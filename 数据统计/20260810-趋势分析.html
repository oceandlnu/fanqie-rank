<style>

    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

est": 9.4, "wordNumber": 150899, "creationStatus": 1, "desc": "快穿|万人迷|男洁|女嬷1vn\n白颜末，一个重度社恐，被大货车撞进恐怖世界，绑定了炮灰系统。\n\n系统告诉她：任务只有一个，活到最后。\n\n于是她谨记社恐生存法则：低调、墙头草、远离主角团。\n在主角团和神秘boss间反复横跳，两边递刀两边卖乖。\n但渐渐地，她发现主角团和boss看她的眼神越来越不对劲了……\n【1.湖边小屋】\n穿成一只远离主角纠纷的小水鬼，白颜末计划着在水底苟到剧终。直到一群阳气旺盛的男高中生来湖边露营，她鬼使神差地飘上了岸……\n\n【2.孤岛疯人院】\n这座孤岛关押着一群有精神疾病的权贵罪犯，白颜末作为新来的心理医生，要对每个病人进行“疏导”。只是每次疏导完，病人看她的眼神更疯了……\n\n【3.美高大逃亡】\n……", "tags": ["快穿", "现代言情", "系统", "穿越", "幻想言情", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：蓄意勾引，女主心上人归我", "fullTitle": "快穿：蓄意勾引，女主心上人归我", "link": "https://fanqienovel.com/page/7656731898927909912", "data": [7.94, 8.58, 9.08, 9.71, 9.9, 10.36, 10.54], "trend": 2.6, "latest": 10.5, "wordNumber": 179255, "creationStatus": 1, "desc": "【心机美人+蓄意勾引+女主很撩+无道德三观+横刀夺爱+男洁】\n姜若拥有一张清丽漂亮的脸蛋，娇媚入骨的风情，只要是她看上的，就没有得不到的。\n“你喜欢的心上人，归我了。”\n【世界1：小团体中的汉子茶】\n在小团体里顶着兄弟的名义做尽暧昧的事情。面对女主的控诉质疑，姜若淡定回道：\n“你误会了，我可不会看上我的狗儿子，要是在一起早就在一起了。”\n【世界2：社团里的绿茶婊】\n绿茶婊看上了社团有钱有势的学长，处处引诱，面对女主的怀疑，姜若道：\"呜呜呜—，姐姐为什么要这么想我，我跟哥哥是清白了。\"\n与学长在一起后，姜若道：\"不被爱的才是小三。\"", "tags": ["快穿", "总裁", "幻想言情", "穿越"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：恶狗又疯又坏总缠着不放", "fullTitle": "快穿：恶狗又疯又坏总缠着不放", "link": "https://fanqienovel.com/page/7657058433543179288", "data": [11.77, 12.85, 13.66, 14.47, 14.98, 14.65, 14.29], "trend": 2.52, "latest": 14.3, "wordNumber": 182050, "creationStatus": 1, "desc": "【快穿＋男全洁＋甜宠＋强制爱＋强取豪夺＋爽爽】\n【世界一】毫无底线卑微舔狗x阴暗觊觎疯批男\n柯煜一直都知道，堂哥谢珩舟身后追着一条小尾巴，随叫随到，有求必应。\n他觉得可笑，就等着看她被谢珩舟玩死。\n直到那日亲眼见到那条小尾巴，倾盆大雨中，女孩身量纤细，浑身布料被打湿，手里紧紧攥着要给谢珩舟送的套，急得掉眼泪。\n柯煜坐在车里，笑出声来。\n谢珩舟生病她送药，肚子饿她送饭，连寂寞了她都跑去酒店给他和情人送套，当真是舔得毫无底线。\n恶劣心思滋生，一发不可收拾。\n这么听话的小尾巴，他也想要怎么办？\n那就抢走关起来好了。\n【世界二】被弟弟偷照片，网恋到顶级财阀怎么办？\n黎景最近恋爱了，对方似乎是个富婆，在他身上狂砸上百万。\n黎幼觉得不对劲，直到在黎景手机相册里看到自己的照片，才知道他偷拿自己照片骗了个富二代。\n黎幼又气又怒，给黎景下了最后通牒，还钱然后分手。\n黎景照做，狠心和对面的冤大头分了手，却不料富二代追到了现实中！\n“不接近你弟弟，怎么好接近你呢？”\n“弟弟犯的错，姐姐来还吧？”\n“弟弟答应我的亲吻拥抱，姐姐是不是都该代劳？”\n“亲吻拥抱怎么够呢？弟弟 31752468384792", "data": [4.63, 5.06, 5.51, 5.83, 6.08, 6.61, 6.52], "trend": 1.89, "latest": 6.5, "wordNumber": 150728, "creationStatus": 1, "desc": "【OOC预警+亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [3.92, 4.06, 4.19, 4.65, 5.16, 5.49, 5.66], "trend": 1.74, "latest": 5.7, "wordNumber": 275076, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "魂穿", "剑修"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频悬疑": [{"label": "盗墓：长生都是有纹身的", "fullTitle": "盗墓：长生都是有纹身的", "link": "https://fanqienovel.com/page/7622580052009438233", "data": [9.87, 10.43, 11.13, 11.82, 12.35, 13.75, 14.34], "trend": 4.47, "latest": 14.3, "wordNumber": 276519, "creationStatus": 1, "desc": "【OOC+无CP+全员单箭头+陈皮亲儿子+社恐男主+我是想要刺激，但绝对不包括这种刺激】\n陈言回到陈家的第一件事，就是杀了一批汪家人。\n陈金水到死都没想明白，汪家是什么？\n长白山上，张启灵觉得陈言眼熟，好像在 .88, 5.09, 5.63, 5.48], "trend": 1.64, "latest": 5.5, "wordNumber": 225873, "creationStatus": 1, "desc": "化神修士长宁渡劫飞升时，竟被一道天雷劈进了“大乾”王朝，成了镇国公府的老夫人。\n原身与她同名，同样叫长宁，只是多了大乾皇室的姓氏，凤氏。身份更是尊贵至极。她是先帝胞妹、当今圣上的皇姑，大乾唯一的镇国大长公主。年轻时下嫁战功赫赫的镇国公，夫君离世后，年近五十的她，早已成了镇国公府说一不二的老祖宗。\n一开始，长宁还觉得，这样的开局也算不错。荣华富贵在手，儿孙满堂，无需再为修炼拼命。\n直到她发现，这个世界竟是自己曾经看过的一本小说。\n而镇国公府，正是书中那个一年后会被诬陷“通敌叛国”、满门抄斩、流放惨死的炮灰家族。\n长宁：“……”\n既然知道结局，她自然不可能坐以待毙。\n于是，镇国公府上下很快发现，自家老祖宗突然像变了个人。\n她先是雷厉风行，斩断所有可能被人利用的隐患；又以强硬手段清理府中蛀虫，整肃内外势力。短短数月，原本漏洞百出的镇国公府，被她经营得固若金汤。\n至于原书那对踩着镇国公府尸骨上位的男女主？\n长宁只冷笑一声。\n想拿她全族的命铺路？\n做梦。\n【无CP＋金手指强大＋全家逆天改命＋爽感拉满】", "tags": ["古言脑洞", "古代言情", "穿越", "空间", "公主", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被暴君读心后，我把虐文玩崩了", "fullTitle": "被暴君读心后，我把虐文玩崩了", "link": "https://fanqienovel.com/page/7649498976772705305", "data": [2.71, 2.72, 2.68, 2.68, 2.71, 3.56, 4.17], "trend": 1.46, "latest": 4.2, "wordNumber": 296149, "creationStatus": 1, "desc": "【读心术+系统+宫斗+埋人的贵妃+填土的暴君】\n沈兮薇穿进一本烂尾宫斗文里，开局被暴君一剑捅穿。\n原主条件好，有老奸巨猾的爹，伪善毒辣的继母，霸凌她的妹，破碎的自己和一个纨绔弟。\n当然，优点也很多，原主家世好，样貌好，一入宫就封贵妃，只是名字加起来不超过三章，命比纸薄？\n沈兮薇手握暴君剧本，淡淡一笑。\n当贵妃还要受气，活着跟死了有什么区别？\n她掌掴嫔妃，顶撞太后，最后罚跪在暴君面前，“臣妾知罪。”\n有些人看似跪着，其实已经骑到暴君头上了！\n人是暴君惯的，有什么法子？继续惯着。\n…\n当贵妃不想早起，暴君延迟上朝时，群臣死谏：妖妃祸国殃民，请陛下处死贵妃！\n暴君哄她上榻：贵妃哪里祸国，她祸害的，明明只朕一人。\n朕一人可抵万民。\n妖妃？还不够，做妖后他们是不是骂的更大声？\n当妖妃拥有话语权，群臣磕破脑袋：陛下做事何须看妖妃脸色？！\n暴君：朕惧内，不行吗？", "tags": ["古言脑洞", "古代言情", "系统", "幻想言情", "穿越", "王妃"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成京城第一权贵，主角们颤抖吧", "fullTitle": "穿成京城第一权贵，主角们颤抖吧", "link": "https://fanqienovel.com/page/7628206250508962878", "data": [3.19, 3.34, 3.45, 3.51, 3.66, 4.07, 4.2], "trend": 1.01, "latest": 4.2, "wordNumber": 273752, "creationStatus": 0, "desc": "爽文+团宠+日常+搞笑+利己+万人迷+系统\n坏消息，绑定了反派系统。要和一群打不死的主角们斗。\n好消息。系统直接带着宿主顾昭月穿成京城第一权贵，皇帝亲弟弟唯一的孩子——昭月郡主。小小主角们，拿捏～\n真假公主，偏心假公主？\n想都别想，各归其位，假公主变奴婢。\n人前显圣文主角。在我面前装神仙？\n系统商城在手，给老娘爬。\n众皇子上位之后要第一个宰了我？\n系统商城在手，给我金大腿——皇帝伯伯续波寿命，熬死你不成问题。\n你爹是皇帝没错，但你爹有几十个崽，我爹就我一个，物以稀为贵，懂？\n公主表姐非男主不嫁？来人，剥去她的公主身份，贬为庶人。\n叮，解锁新小说，修真界大佬魂穿异世。\n切～管他是龙是蛇，到我的地盘就得好好趴着。\n感谢最大的金主——反派系统001送来的顶级背景哦～（特别鸣谢～）\n主角们，颤抖吧！\n\n小剧场：\n系统：没错！我们反派天生就是一个阵营的。长大后的顾昭月：支持！所以这清冷反派，阴鸷反派，温润反派……各种反派快到本郡主府上来～", "tags": ["古言脑洞", "古代言情", "系统", "穿书", "团宠", "反派"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满朝听见我心声后，长公主护短了", "fullTitle": "满朝听见我心声后，长公主护短了", "link": "https://fanqienovel.com/page/7642748664410016793", "data": [3.73, 3.64, 3.66, 4.05, 4.23, 4.43, 4.52], "trend": 0.79, "latest": 4.5, "wordNumber": 281009, "creationStatus": 1, "desc": "（评分刚出，后面会涨，请放心食用）【读心吃瓜+爆笑沙雕+发疯文学+甜宠+微群像+双女主+1v1】\n版本一：\n宁小满穿越大夏两年半，绑定吃瓜系统。\n她在街上卖身时，被乔装逛街的冷面长公主带回府。\n\n她以为抱上金大腿，结果公主府也不太平：管事做两套账、绣房拿针扎人、外院领粮越来越狠。\n她嘴上装傻，心里喊统子扒瓜，公主、丫鬟、护卫统领，一个个憋笑憋到内伤。\n\n后来，皇帝听见了，皇后听见了，满朝文武也听见了。\n于是，大夏朝堂画风突变。\n\n反派正在深情演戏，她心里吐槽：\n「哥，别演了，你心眼多的都能给苏打饼干扎眼了。」\n\n贪官正在哭穷喊冤，她心里开麦：\n「你家地窖银砖都快码成小长城了，还搁这儿装月光族？」\n\n众人表面严肃，内心疯狂憋笑。\n宁小满：奇怪，为什么他们看我的眼神越来越不对？\n\n长公主冷静护人：\n“她胆小，别吓她。”\n\n满朝文武看着刚在心里把反派祖宗十八代都创飞的小姑娘，陷入沉默。\n胆小？\n殿下，您要不要听听她心里在骂什么？\n\n版本二：\n全大夏都知道，长公主萧明昭冷血、冷面、冷心。\n直到有一天，她捡回一个叫宁小满的小姑娘。\n\n从此，长公主上朝会走神，皇帝批奏折会喷茶，皇后喝茶会微笑，满朝文武会集体沉默。\n因为他们都听见了同一个声音。\n「啊，这瓜真香！」", "tags": ["古言脑洞", "古代言情", "系统", "甜宠", "搞笑轻松", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了冷血皇帝的病弱炮灰养子", "fullTitle": "穿成了冷血皇帝的病弱炮灰养子", "link": "https://fanqienovel.com/page/7628961061521083416", "data": [2.48, 2.61, 2.7, 2.7, 2.66, 2.72, 2.7], "trend": 0.23, "latest": 2.7, "wordNumber": 268862, "creationStatus": 1, "desc": "【亲情向＋无CP＋病弱＋团宠＋架空】\n　　作为第二代的陪伴型AI仿真人，零零一陪伴小主人从幼崽到成年期，功不可没。\n　　按照原计划，它是要更新老化零件，再陪伴主人到老年。\n　　但市面上越来越多的新款，大人们早就想要换掉它，他们第一时间销毁了零零一。\n　　零零一不知道自己被销毁了，在重新醒来过后，它以为自己升级成功了，换了新皮肤。\n　　但脑海中不知道为什么多出了一段奇怪的记忆，它是炮灰？叫做李临祎？\n　　还是个炮灰，因为身体孱弱，又天生寡言少语，被遗弃在雪天荒野，遇到了重伤的帝王李钦纶。\n　　帝王会心软，将他带回去，认作养子，养在身侧。但他不识好歹，偏执娇纵，横行无忌，得罪了一众皇子公主，以及妃子，甚至下到宫女太监，无一不厌恶他。\n　　最后落得废为庶人，驱逐出宫的下场。\n　　零零一不明白自己这是穿书了，以为这是自己被新植入的程序……既然是程序，就应该执行。\n　　至此，零零一变成了炮灰李临祎。\n　　但不太会阴谋诡计的陪伴型零零一，总会搞砸一切……\n　　他后知后觉地发现，已经和【程序】完全不一样的时候……\n　　嗯，大概是零零一变成了真人之后的古代日常。（架空哒！）", "tags": ["古言脑洞", "古代言情", "穿越", "团宠", "医术", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [4.4, 4.82, 5.12, 5.36, 5.66, 7.26, 7.86], "trend": 3.46, "latest": 7.9, "wordNumber": 223247, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.92, 2.97, 3.09, 3.17, 3.31, 3.68, 3.86], "trend": 0.95, "latest": 3.9, "wordNumber": 260607, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破庙通古今，小乞丐们有救啦！", "fullTitle": "破庙通古今，小乞丐们有救啦！", "link": "https://fanqienovel.com/page/7650351395756837912", "data": [2.49, 2.63, 2.67, 2.78, 2.82, 2.85, 2.8], "trend": 0.31, "latest": 2.8, "wordNumber": 283609, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+群像文+温馨日常+无极品+无cp】\n逃荒路上，弹尽粮绝，\n小瑶的爹娘卖完两个姐姐又想卖掉小瑶。\n小瑶连夜逃跑，跑到闹鬼的破庙。\n鬼再可怕也没有人可怕，\n原来破庙住着装神弄鬼的小乞丐。\n无粮无水五个小乞丐快要饿死之际，小瑶向破庙内神像求救，绑定快要报废的通古今交易系统。\n五个底层小人物，与废物统子共同携手，摸爬滚打，靠着古今穿越的奇遇，一步步努力，成为有饭吃，有衣穿，有屋住的小小大人物。\n（PS：前几章写五人的相识和小乞丐在古代底层社会生存的不易，想直接看古今穿越的可以从第五章开始看。\n前期小瑶，小满，狗蛋，虎子，乌川五个孩子都是主角，都会穿现代，后期还会有小瑶姐姐夏一，夏二的加入。\n希望大家能爱上这些性格不同，但一样善良可爱懂事的孩子）", "tags": ["种田", "古代言情", "萌宝", "穿越"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生新婚夜，和离回娘家发家致富", "fullTitle": "重生新婚夜，和离回娘家发家致富", "link": "https://fanqienovel.com/page/7616374658438269976", "data": [3.94, 4.14, 4.31, 4.45, 4.61, 4.39, 4.17], "trend": 0.23, "latest": 4.2, "wordNumber": 207995, "creationStatus": 1, "desc": "【空间种田+家长里短+发家致富】\n【敲黑板：本故事纯属虚构！】\n【逻辑不存在，三观已丢失，圣母请绕道！】\n【写文不易，不喜勿喷！】\n睁眼重生新婚夜，颜俏就听见前世与她举案齐眉的夫君对她说：和离！ \n颜俏想起，前世夫君一直珍藏在书房里的那幅画，便明白了眼前人也和自己一样重生了！\n她果断签下和离书，带着自己的嫁妆回到家里！\n然而，看着一贫如洗的家里，她采草药、捡山货、打猎物、卖豆腐、做卤味、开店铺、买宅子、建庄子，带着全家发家致富！", "tags": ["种田", "古代言情", "乡村", "重生", "空间", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [5.67, 6.0, 6.25, 6.54, 6.76, 7.11, 8.01], "trend": 2.35, "latest": 8.0, "wordNumber": 222725, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.58, 9.54, 9.63, 9.68, 9.81, 10.58, 11.15], "trend": 1.57, "latest": 11.1, "wordNumber": 271820, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.68, 5.95, 5.97, 5.97, 5.99, 6.12, 6.13], "trend": 0.45, "latest": 6.1, "wordNumber": 264908, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "玄幻言情", "score": 7, "reasons": ["7日增长+18.3万", "竞争系数低(3.6)", "腰部稳(均腰比1.18)"], "total19": 169.8, "growth": 12.0, "abs_growth": 18.3, "coeff": 3.6, "count10w": 2, "mean": 5.7, "mid19": 4.8, "mm_ratio": 1.18, "ndays": 7}, {"cat": "女频衍生", "score": 6, "reasons": ["7日增长+49.0万", "竞争系数中(5.8)", "腰部稳(均腰比1.39)"], "total19": 241.2, "growth": 25.5, "abs_growth": 49.0, "coeff": 5.8, "count10w": 6, "mean": 8.0, "mid19": 5.8, "mm_ratio": 1.39, "ndays": 7}, {"cat": "快穿", "score": 6, "reasons": ["7日增长+1.5万", "竞争系数低(3.1)", "腰部稳(均腰比1.12)"], "total19": 283.4, "growth": 0.5, "abs_growth": 1.5, "coeff": 3.1, "count10w": 10, "mean": 9.4, "mid19": 8.5, "mm_ratio": 1.12, "ndays": 7}, {"cat": "悬疑脑洞", "score": 6, "reasons": ["7日增长+25.4万", "竞争系数中(6.4)", "腰部稳(均腰比1.59)"], "total19": llTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [7.35, 7.77, 7.88], "trend": 0.53, "latest": 7.9, "wordNumber": 261050, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高考出分，女儿第一个劝我离婚", "fullTitle": "高考出分，女儿第一个劝我离婚", "link": "https://fanqienovel.com/page/7657391720396508184", "data": [5.8, 6.01, 6.24], "trend": 0.44, "latest": 6.2, "wordNumber": 194237, "creationStatus": 1, "desc": "（高考查分+恶婆婆+离婚后我成了入殓师）\n高考出分，女儿第一句话没报分数，而是——\n“妈，你离婚吧。”\n安柠还没反应过来，就被拽进本市最贵的酒楼。\n婆家人正整整齐齐给一个女孩庆祝高考大捷。\n她这才知道：\n丈夫周明海的私生女竟和她的女儿一样大！\n包厢里，乱成一片。\n公公一拍桌子，定下规矩：\n“既然都捅破了，那就按老规矩办：谁生的娃有出息，谁就上周家族谱！”\n安柠气得发抖，女儿周念安却按住她的手，一口答应：“比就比。”\n在所有人的追问下，她只说了三个字：\n“屏蔽了。”\n全场一愣，随即哄笑：\n“零分啊！”\n婆婆满眼鄙夷，小三得意忘形，私生女笑着要认祖归宗，丈夫更是直接甩出离婚协议。\n后来，各招生办亲自上门，抢省状元周念安。\n周家人立马变脸：\n“老周家祖坟冒青烟，出了个女状元！安安是周家的种，必须上族谱！”\n周明海跪求原谅：\n“我只是犯了全天下男人都会犯的错。”\n可这次，安柠铁了心要离！\n离婚后，她重拾阿婆传下来的手艺，成了一名入殓师。\n起初只当谋生，后来越做越大。\n她也遇见了那个既能替她挡住前夫骚扰，又能安静看她为逝者整妆，更能看到她身上光的男人！", "tags": ["职场婚恋", "现代言情", "家庭", "虐渣", "打脸", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲闪婚，糙汉老公太直接", "fullTitle": "相亲闪婚，糙汉老公太直接", "link": "https://fanqienovel.com/page/7636132561508387902", "data": [2.73, 3.02, 3.15], "trend": 0.43, "latest": 3.2, "wordNumber": 204482, "creationStatus": 0, "desc": "【乡镇超市糙汉vs县城小会计+直球式相亲+年龄差两岁+细水长甜】\n林小晚相了七次亲，遇到的不是抠门就是奇葩，要不就是动手动脚。\n第八次，赵铁柱坐在对面，上来就摊牌：“我来相亲就奔着结婚来的，你要觉得行咱就处。”\n她以为又是三分钟热度。\n结果这人第二天就拉着她去挑三金，彩礼不打磕巴，领证不拖泥带水。\n林小晚内向又话少，生怕赵铁柱嫌她闷。\n但赵铁柱说：“你不用说太多，听我说就行。”\n婚后她第一次体会到被人护着的感觉，踏实，安心，有人撑腰。\n就是，就是这人太直接了，有啥说啥，她脸皮薄，有点吃不消。", "tags": ["职场婚恋", "现代言情", "婚恋", "家长里短", "乡村", "年龄差", "闪婚"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "救命！产检遇到妇科圣手前男友", "fullTitle": "救命！产检遇到妇科圣手前男友", "link": "https://fanqienovel.com/page/7665336297111686168", "data": [2.41, 2.5, 2.51], "trend": 0.1, "latest": 2.5, "wordNumber": 219825, "creationStatus": 1, "desc": "知名扑街小黄文作者马小旦，人生做过最勇的两件事：第一，把清冷禁欲的医学院男神睡了后渣掉；\n第二，发现怀孕后连夜买站票跑路回十八线老家。\n本以为天高皇帝远，谁知在县城医院第一次产检——\n“裤子脱了，躺好。”\n清冷熟悉的男声从口罩后传出，马小旦吓得差点从检查床上滚下来。\n眼前这位空降县医院的妇产科顶级圣手，不是她那被甩的前男友还能是谁？！\n看着B超单上的孕周，男人修长的手指把玩着探头，冷笑连连：“分手三个月，孕周十二周，马小旦，医学上这叫无缝衔接，还是叫医学奇迹？”\n马小旦死鸭子嘴硬：“那…那是我无性繁殖！”\n自此，妇产科大佬开启贴身“监视”模式。\n从按时产检到登堂入室，甚至把她小说里的姿势打印出来贴在床头：\n“马大作家，生完孩子，我们把这些实践一下？”", "tags": ["职场婚恋", "现代言情", "暗恋", "破镜重圆", "医生", "带球跑", "情有独钟"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "离婚后她轰动全球", "fullTitle": "离婚后她轰动全球", "link": "https://fanqienovel.com/page/7635987497771600921", "data": [2.58, 2.69, 2.62], "trend": 0.04, "latest": 2.6, "wordNumber": 240597, "creationStatus": 0, "desc": "结婚三周年那天，顾北琛把离婚协议推到沈清禾面前，语气冷淡：\n“签了吧，她回来了。”\n沈清禾没有要那五千万补偿，只带走了一台加密电脑。\n离婚的消息传遍全城，所有人等着看她的笑话——一个破产家族的孤女，没了顾家撑腰，迟早沦落街头。\n没人知道，第二天一早，中科院的专车停在她楼下。\n导师在电话里差点把实验室炸了：“三年！你耽误了三年！暗物质项目组因为你停摆了三次！”\n一个月后，顾氏集团的核心供应链突然崩盘。\n两个月后，全球物理学峰会直播。沈清禾站在首席发言席，身后是足以改变世界的实验数据。镜头扫过她的脸，弹幕瞬间炸了——\n“这不是顾总那个下堂妻吗？！”\n台下，顾北琛红着眼坐在第一排。\n而他身边，沈清禾的未婚夫、手握千亿资本的投资人陆砚，正不紧不慢地放下手机，声音温柔却字字诛心：\n“清禾，有人问能不能排队求你，帮他家公司续命。”", "tags": ["职场婚恋", "现代言情", "总裁", "HE", "1v1"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "请你依赖我", "fullTitle": "请你依赖我", "link": "https://fanqienovel.com/page/7647931717331717145", "data": [4.0, 4.06, 4.0], "trend": 0.0, "latest": 4.0, "wordNumber": 254230, "creationStatus": 1, "desc": "空军中尉沈砚辞 × 协和心外科医生时愿\n\n第一次见面，她在医院楼梯间撞见别人踮脚吻他。第二次，他浑身是血扛着战友冲进急诊，说她手抖不适合做医生。第三次，他穿过一整个房间的人走到她面前，叫出她的名字。\n\n他冷硬、寡言、从不解释。\n她把所有情绪咽下去，一个人扛着那只正在失去知觉的右手，扛着不告而别的旧人，扛着他看不到她的时候，她还在等。\n\n她以为把自己藏得够远，他就找不到她了。\n但她不知道，洪水中他涉过齐腰的泥水找到她的时候，才发现她藏着一个他永远无法偿还的秘密——她怀过一个他的孩子，他刚知道，就已经失去了。", "tags": ["职场婚恋", "现代言情", "暗恋", "职场", "医生", "情有独钟", "1v1"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "星光璀璨": [{"label": "说好当站姐，这黑子系统什么鬼？", "fullTitle": "说好当站姐，这黑子系统什么鬼？", "link": "https://fanqienovel.com/page/7652735154556767257", "data": [15.17, 20.81, 22.91], "trend": 7.74, "latest": 22.9, "wordNumber": 180960, "creationStatus": 1, "desc": "（评分刚出会慢慢涨）\n江问渔黑了秦梵六年，骂他骂到黑粉圈封神。\n直到真相大白——她黑错人了。\n带着悔意一头栽倒，再睁眼，回到六年前选秀录制当天。她发誓这辈子要给秦梵当最强站姐。\n结果——【叮！最强黑子养成系统绑定成功！】\n【黑秦梵可获得：拍摄技术+10，修图能力+20，独家黑料解锁、S级歌曲、S级剧本……】\n江问渔：\"？我要当粉丝啊！！\"", "tags": ["星光璀璨", "现代言情", "系统", "重生", "娱乐圈", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "万人迷神颜顶流只想演炮灰", "fullTitle": "万人迷神颜顶流只想演炮灰", "link": "https://fanqienovel.com/page/7652765843931024446", "data": [34.24, 38.81, 39.57], "trend": 5.33, "latest": 39.6, "wordNumber": 269435, "creationStatus": 1, "desc": "评分刚出，会涨！！（女频！！！）\n【万人迷+神颜+娱乐圈+无cp单箭头+事业线】单箭头「男女」都有！！当无脑文看就行，无逻辑可言\n\n一觉醒来，宋时安穿成背负巨债的十八线小透明。\n\n好消息是，他帅到惨绝人寰。\n\n坏消息是，十七条催债短信条条写着“不还钱，打断你的腿”。\n\n天降“炮灰演绎系统”，演满一百个炮灰配角，奖励百亿资产、长命百岁；演主角？直接清零。\n\n于是内娱出了个怪咖：顶着碾压顶流的神颜，专接炮灰角色。\n\n演太监气场盖过皇帝，演尸体都能美上热搜。\n\n粉丝跪求他接男主，宋时安面笑着营业：“每个配角都有属于自己的高光。”\n\n内心疯狂OS：我也想啊！系统不让啊！\n\n白天剧组跑龙套，晚上全城搞兼职。\n\n摆摊上热搜，当铲屎官被传“顶流隐退改行宠物美容”，硬生生卷成内娱全能测评师。\n\n粉丝抓狂：“你到底还有多少技能？”\n\n更麻烦的是，今天顶流堵门表白，明天霸总壁咚质问。\n\n宋时安抱紧自己瑟瑟发抖：别爱我没结果，我只想搞钱！", "tags": ["星光璀璨", "现代言情", "系统", "娱乐圈", "学霸", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全网逼我和影帝谈恋爱", "fullTitle": "全网逼我和影帝谈恋爱", "link": "https://fanqienovel.com/page/7658959468054465560", "data": [10.86, 1  "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "洪荒，阐教小师妹后台太硬", "fullTitle": "洪荒，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [7.2, 10.08, 11.07], "trend": 3.88, "latest": 11.1, "wordNumber": 159813, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "危！刚飞升我就杀了天帝？", "fullTitle": "危！刚飞升我就杀了天帝？", "link": "https://fanqienovel.com/page/7663020533176339518", "data": [4.36, 5.7, 6.21], "trend": 1.84, "latest": 6.2, "wordNumber": 132025, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "灵根被挖后，被爆出我是杀神转世", "fullTitle": "灵根被挖后，被爆出我是杀神转世", "link": "https://fanqienovel.com/page/7660556085752761369", "data": [2.92, 4.32, 4.72], "trend": 1.8, "latest": 4.7, "wordNumber": 292154, "creationStatus": 1, "desc": "【真假千金+天道金榜盘点+火葬场扬灰+杀伐果断】\n雷劫之下，真千金温灵枫被亲生父母和师尊强行按在阵法中，\n生生抽走变异冰灵根，只为给假千金温柔续命。\n剧痛中，温灵枫觉醒记忆，原来自己只是一本团宠文的血包女配！\n她决然捏碎本命玉牌，叛出宗门。\n次日，天生异象，天道金榜横空出世，耀眼金光直指温灵枫：\n“盘点修仙界十大至高神祇，榜首——上古杀神转世、天道之主温灵枫！”\n看着金榜上温灵枫未来挥剑斩碎九重天、覆灭万法的画面，偏心父母和满门师兄吓得肝胆俱裂。\n他们挖了天道之主的灵根？现在跪下求她，还来得及吗？", "tags": ["玄幻言情", "系统", "幻想言情", "前世今生", "真假千金"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [15.54, 16.81, 17.29], "trend": 1.75, "latest": 17.3, "wordNumber": 212983, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [8.41, 9.36, 9.82], "trend": 1.41, "latest": 9.8, "wordNumber": 142228, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在秘境废墟捡的垃圾都是宝", "fullTitle": "我在秘境废墟捡的垃圾都是宝", "link": "https://fanqienovel.com/page/7623367574926920729", "data": [4.25, 4.89, 5.17], "trend": 0.92, "latest": 5.2, "wordNumber": 247016, "creationStatus": 1, "desc": "【异世大陆】【打怪升级】【捡垃圾】【诡异】【领地经营】【秘境捡宝】【群像】【美食】\n莫小西穿到诡怪纵横之地，这里的人类以诡虫蘑菇苔藓为食，以诡怪皮为衣。\n她觉醒万物修复魂术，不仅可以修复秘境，还可以修复从秘境内捡到的垃圾，于是，煞气横生的秘境废墟成为她的藏宝地，这里遍地都是仙器灵器残骸，还有高阶仙宝残骸，仙府残骸，关键是，仙府残骸内还有遗存的灵植园……\n莫小西修复这些残骸为己用，终于吃上大米白面跟水果蔬菜，带着弟弟过上人人羡慕的好日子......", "tags": ["玄幻言情", "幻想言情", "穿越", "美食", "群像", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [4.95, 5.31, 5.45], "trend": 0.5, "latest": 5.4, "wordNumber": 225329, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [5.16, 5.49, 5.66], "trend": 0.5, "latest": 5.7, "wordNumber": 275076, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "魂穿", "剑修"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [6.08, 6.61, 6.52], "trend": 0.43, "latest": 6.5, "wordNumber": 150728, "creationStatus": 1, "desc": "【OOC预警+亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [3.46, 3.78, 3.88], "trend": 0.41, "latest": 3.9, "wordNumber": 293608, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "剑修", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "那个闻药就呕的庸医是剑仙", "fullTitle": "那个闻药就呕的庸医是剑仙", "link": "https://fanqienovel.com/page/7653601370594872344", "data": [3.28, 3.54, 3.68], "trend": 0.4, "latest": 3.7, "wordNumber": 233109, "creationStatus": 1, "desc": "（刚开分，还会涨）【微群像+1v多雄竞+男全洁+性取向丰富+女强+团宠+掉马甲+高冷老六】\n月照梵身为医修，却一闻药味就想yue。\n问题不大，被当成黑心医修有什么不好？\n如果病人不听医嘱，那么我也略懂一些拳脚。\n没想到好不容易用技术征服患者，竟惹得剑宗高岭之花大师兄黑化疯魔：\n“小奶狗有什么好？是我还不够骚吗？” \n温润如玉的贵公子发小不服，跟在后面又争又抢：\n“只要你愿意多看我一眼，哪怕像小时候一样天天打我都行……”　　\n回到家还没喘口气，又被自己的腹黑兄长药翻在床上：\n“梵儿，兄长不好吗？为什么要去找别人？”\n月照梵还没跑掉，又被魅魔合欢宗宗主纠缠不休：\n“小月儿，男人有什么好？姐姐能让你尝到什么叫极乐……”\n谁能想到好不容易逃出生天，又被魔君抓走按住：\n“听说……你要我死？”\n月照梵都受不住了，首富家的腼腆少主还来横插一脚：\n“梵、梵姐……我很乖的……”\n接连而来的修罗场让月照梵怀疑人生，修真界怎么如此危险？", "tags": ["玄幻言情", "幻想言情", "医术", "古色古香"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.14, 7.19, 7.37], "trend": 0.23, "latest": 7.4, "wordNumber": 208968, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\n——\n阮吱吱回到现实世界，不知为何，时常想起那个肆意潇洒的少年人。\n系统再次出现:【检测到男主黑化值过高，即将毁灭世界！】\n什么？\n他居然这么爱自己！\n怀着微妙情绪，阮吱吱回到书中世界，又一次见到他。\n少年穿着喜服，神情阴霾，手里拿着绳索，缓步而来。\n阮吱吱紧张，“裴厌，我可以解释，你别囚禁我——”\n她被扭断了脖子。\n倒在地上刹那，她见到的是少年把藏着的女孩抓出来，低声威胁:\n“贺喜，你再敢逃婚试试？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿书", "异世穿越", "黑化"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "顶级世家大小姐，全族撑腰谁敢动", "fullTitle": "顶级世家大小姐，全族撑腰谁敢动", "link": "https://fanqienovel.com/page/7644883270928190526", "data": [3.61, 3.78, 3.82], "trend": 0.2, "latest": 3.8, "wordNumber": 287343, "creationStatus": 1, "desc": "【大女主+顶级隐世家族+系统+无CP+忠犬龙凤胎弟弟+救世】\n高考考场，南宫知佑落下试卷最后一笔。\n系统之音骤然在脑海中响起：无数小说世界错乱融合，男女主们肆意破坏、搅乱秩序，整片修仙界濒临崩塌。\n天道恳请她，出手拯救濒临毁灭的苍生。\n南宫知佑，一口应允。\n系统为她编写出身，（专属世界=南宫知佑专属秘境）她转身降生世间第一隐世大家南宫家族，生来就是全族上下、全员偏心、宠到骨子里的嫡出大小姐。\n身边还有一母同胞的龙凤胎弟弟，软萌奶狗、极致忠犬，眼里心里只有姐姐一人，姐姐说东绝不往西，姐姐一句话，他愿为她挡下世间所有刀山火海。\n两人的相遇，相互救赎，是命中注定。\n一路仙途前行，南宫知佑不断的成长。\n怼傲慢天骄、撕破虚伪假面、踏尽拦路强敌、镇压失控作乱的男女主；\n抚平乱世祸乱、守护亿万苍生，于荆棘遍地的神路之上，一路杀伐、一路高歌。\n南宫知佑看着面前南宫家的人：\n额……没人告诉这些人因她而来，甘愿臣服于她。\n从被命运选中的异乡来客，到全修仙界的救世天命，也是命运的重逢\n修为境界：\n练气→筑基→金丹→元婴→化神→炼虚→合体→大乘→渡劫飞升\n（每个大境界分：初期-中期-圆满-巅峰", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "嫡女", "无CP"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主为爱发疯，但你只想好好活着", "fullTitle": "男主为爱发疯，但你只想好好活着", "link": "https://fanqienovel.com/page/7652408518770691096", "data": [7.48, 7.53, 7.66], "trend": 0.18, "latest": 7.7, "wordNumber": 267601, "creationStatus": 1, "desc": "【强调：本文为黑泥向纯代入乙女，有大量g向恐怖描写，男主神经病非人类较多，不要用正常三观对待】\n穿越后，你没有得到金手指，也没有万人迷光环，甚至被某个变态给缠上了。\n什么？他是气运之子，天道宠儿？\n可这个世界是疯掉的世界，气运之子也都是疯子。\n所以你选择了逃跑。\n那就请在保住命的情况下确保自己不被抓住吧。\n\t\n他说他会吃掉你，从头到脚，拆吃入腹。", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [9.39, 9.58, 9.45], "trend": 0.05, "latest": 9.4, "wordNumber": 254271, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.33, 3.26, 3.34], "trend": 0.01, "latest": 3.3, "wordNumber": 238431, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自己，却生得心脉残缺，体弱易碎，连哭都没力气，一副早夭相。\n他的孩子必须活得好好的，天要他亡，沈寂就把这天逆了。", "tags": ["玄幻言情", "幻想言情", "穿越", "穿书", "养崽", "胎穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末世，我靠装弱，苟成最强", "fullTitle": "穿进末世，我靠装弱，苟成最强", "link": "https://fanqienovel.com/page/7662354834556734488", "data": [9.17, 14.01, 16.39], "trend": 7.22, "latest": 16.4, "wordNumber": 200991, "creationStatus": 1, "desc": "纪昼穿进末世八年，是临江基地公认的废物。\n\n检测做了一年又一年，结果始终没变。\n\n无异能。\n\n体弱。\n\n胆子小。\n\n遇到危险，只会躲在人群后面。\n\n纪昼对此十分满意。\n\n废物有人护着。\n\n天才却可能被送进实验室。\n\n没人知道，她体内藏着一团奇怪的东西。\n\n它会记住异能。\n\n硬化、雷电、冲击……\n\n只要给它一点时间，那些原本属于别人的力量，就能在她身上重新出现。\n\n纪昼靠着这张底牌装弱苟命，一装就是八年。\n\n她原本打算继续装下去。\n\n直到赛场坍塌，横梁压向被困的人，她当着六大基地的面，抬手托住了整片废墟。\n\n检测记录被连夜翻出。\n\n中央基地要求重新检测。\n\n研究人员想把她带回去。\n\n就连比赛里的对手，也故意重伤她的队友，逼她补位上场。\n\n姜妄隔着防护墙看向临江席位。\n\n“不是还有个替补吗？”\n\n“团队赛让她上。”\n\n“我倒想看看，她那层刚觉醒的硬化，能撑几刀。”\n\n所有人都以为，纪昼只有硬化。\n\n只有谢闻岐坐在高处，转了转缠着固定带的右腕。\n\n他望着她周围那片不肯随场域改变的异常，忽然笑了。\n\n“刚觉醒？”\n\n“她可藏了不止一天。”\n\n纪昼抱着医药箱，乖巧地坐在原位。\n\n她算了算自己手里剩下的异能。\n\n还是太少。\n\n得再攒一点。", "tags": ["科幻末世", "末世", "穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际第一躺平学大师", "fullTitle": "星际第一躺平学大师", "link": "https://fanqienovel.com/page/7656676073710554137", "data": [3.92, 5.25, 5.78], "trend": 1.87, "latest": 5.8, "wordNumber": 199577, "creationStatus": 1, "desc": "【星际、穿越、校园、女强、无CP】【评分刚出，后面会涨】\n两世卷王，这世放假。这辈子迎瓷发誓不卷了，躺平任嘲。\n迎瓷前两世卷生卷死，从小镇做题家卷成C9国奖得主，从外门弟子卷成天梯榜第一的天之骄子，结果两世都不得善终。\n直到第三世，眼睛一闭一睁，穿到星际时代，变成了一个五岁孤儿，迎瓷真的累了。\n这真的不是拐卖人口吗？能不能请有关部门管一管啊。\n风雨中飘摇的家，没爹没妈的她，清澈见底的财富和不努力捡垃圾就会饿死的生活。\n老天奶，她在互联网上接的不是这种日子啊。\n直到有一天，迎瓷翻到一张沾满油污的传单上写着：联邦“未成年教育保障计划”孤儿或底层贫困人口，只要通过最低入学测试就能进入就近的公立学校，享受包吃包住……\n本着免费的就是最好的，迎瓷决定去小学美美躺平，却因为每一次“省事操作”被当成隐藏实力的天才。\n她一路躺、一路被卷、一路拒绝，直到……\n（第一章作话有避雷，大家阅读前可以看一眼哦，如果是不喜欢的题材或者雷点，也方便提前识别）", "tags": ["科幻末世", "穿越", "星际", "女强", "天才", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.81, 10.58, 11.15], "trend": 1.34, "latest": 11.1, "wordNumber": 271820, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日死考：七岁丧尸王也要考试？", "fullTitle": "末日死考：七岁丧尸王也要考试？", "link": "https://fanqienovel.com/page/7652257815586688025", "data": [2.87, 3.85, 4.2], "trend": 1.32, "latest": 4.2, "wordNumber": 187959, "creationStatus": 1, "desc": "评分刚出！会涨！看正文看可爱小老大!\n末日废土+恶童丧尸王+比格属性+全名求生直播】\n季末一觉睡醒，发现家没了，哥也不见了，甚至她连人都不当了。\n因为她变成了一只丧尸，穿着花棉袄的丧尸王。\n季末想要找妈妈，脑海中就传来了一道机械音。\n“叮，第101次末日死亡高考准备开始，考场已准备就绪，请考生做好准备。”\n季末：嗯？高考？我吗？可我刚满七岁，还没上小学啊。\n紧接着，季末出现在了墓地。\n考题：枯骨酸雨墓园（杀戮求生）\n季末不识字，问一旁的姐姐。\n姐姐眼神奇怪：“小姑娘，幼儿园不教认字吗？”\n季末挠了挠头：幼儿园，不是教杀人的地方吗？\n不过好在，她得到了答案。\n不需要做数学题啊，既然如此，她要开始，发疯了！\n----\n基地中，幸存者们看着直播画面，其实早就麻木了，因为人类根本没有希望，不过是延长死去的时间罢了。\n可突然，一个名叫季末的积分以成倍递增，所有人都涌入了季末的直播间。\n咦？咋还有个小孩。\n有点不爱干净啊，这脸咋乌漆嘛黑的，这花棉袄好土啊。\n季末：你们这是言语霸凌小学生。\n同样看到直播的五位哥哥：呜呜呜，我的妹宝，没死！\n有幸和季末一起参加高考的高考生们：人麻了，死考最恐怖的，是那个熊孩子啊！", "tags": ["科幻末世", "末世", "直播"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [6.76, 7.11, 8.01], "trend": 1.26, "latest": 8.0, "wordNumber": 222725, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的 /fanqienovel.com/page/7649966056949173273", "data": [6.27, 6.23, 6.33], "trend": 0.07, "latest": 6.3, "wordNumber": 272717, "creationStatus": 1, "desc": "经营/多男主/拾荒/有群像/非女强/非无敌\n废土末世第十年，沈雾荞从棺材里醒来，竟然看见满地乱跑的死人。\n因没有异能，是基地不要的废人。\n可她也是唯一没有受污染的纯净体，还绑定了变废为宝经营系统：\n“拾取红烧牛肉面空盒×1，奖励红烧牛肉面×10桶……”\n她拾荒喂系统，小卖部开起来，货品装不下，圈地升级新商店。\n生意做大，高阶异能恶匪找茬？她抬手就是一个大耳巴。\n某位大佬死死抱住她的腿，鼻涕眼泪蹭她一嘴：“雾宝…真的是你？”\n一问才知道，在她死后的这十年，三个哥哥一个竹马已经全员黑化。\n大哥暴戾冷酷，二哥残忍嗜杀，亲哥是个掠夺狂，竹马成了科研疯子！\n而这一切都因为她。\n十年不见，本以为劝他们“改邪归正”要费一番功夫，但这一个两个怎么不讲武德，看见她就又哭又笑不准她跑。\n蒜鸟蒜鸟，正好她的末日商店需要大佬撑腰，这四根大腿巨粗无比，抱了！\n“雾宝没异能怎么了？她是我们的命！”\n“那个……其实我是有异能的。”\n一双双惊愕的眼睛注视着被她触摸过的水源和土地，水污染消失了，废土上长出了一片片新生的绿色！\n“是谁说雾宝就是个一无是处的笨蛋美人？”\n“她是终结末世的唯一希望！", "tags": ["科幻末世", "系统", "末世", "大佬", "群像", "黑化"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "震惊！我养的狗子都是顶级大佬", "fullTitle": "震惊！我养的狗子都是顶级大佬", "link": "https://fanqienovel.com/page/7658074781413035070", "data": [3.54, 3.54, 3.59], "trend": 0.05, "latest": 3.6, "wordNumber": 176509, "creationStatus": 1, "desc": "（评分刚出会涨）【1vn、男全洁、大佬穿成狗被女主养（蹂躏】\n坏消息，穿进黑暗世界观的末世文了；\n好消息，系统金手指来了。\n林苑一盯着系统面板上显示为0的宠物友好值，面色复杂。\n“你的意思是，让我在末世养宠物，然后就可以得到异能？”\n系统一脸谄媚：“是的呢，亲亲～”\n林苑一挠头：“可我没养过宠物啊……”\n系统大手一挥：“没关系，我也没养——啊不是，我可以帮你参谋呀！”\n一人一统对视一眼，然后一拍即合。\n正巧，旁边废墟里刚好有一只没人要的瘸腿大狗！\n……\n黎四厌作为末世幸存者里少见的孤狼，一向信奉的是“杀无赦”。\n毕竟这个世界怎么对他的，他就要怎么回报这个世界，不是么？\n所以，他是有名的煞神。\n又所以，在他被仇家追杀时，没人帮忙，也是很合情合理的。\n但是…等等\n为什么死了之后不是下地狱，而是变成狗啊？！！\n林苑一躲在远处，拿着小石头朝狗屁股上扔了几下；\n黎四厌有气无力的扭头，试图骂人，最后只能喊出一声“汪～”\n系统连忙撺掇：【快看快看，它知道你救它呢！】\n林苑一也感慨：“不愧是人类的好朋友…别怕小宝贝我这就救、呃你狗腿怎么弯了？”\n？你说呢\n好在让狗庆幸的是这样的生活，并不只是一只狗在过", "tags": ["科幻末世", "系统", "穿越", "末世", "穿书", "大佬"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "悬疑脑洞": [{"label": "乙女游戏哪来的面板和血条啊喂？", "fullTitle": "乙女游戏哪来的面板和血条啊喂？", "link": "https://fanqienovel.com/page/7650859423321033790", "data": [4.51, 6.58, 7.66], "trend": 3.15, "latest": 7.7, "wordNumber": 255592, "creationStatus": 1, "desc": "【系统+万人迷+病娇+全洁+暧昧拉扯+直播弹幕+升级  1, "desc": "【玄学＋萌宝＋吃瓜+无脑爽文＋算命+虐渣＋团宠＋小缺德】\n   洛氏皇族阳盛阴衰，三百年内无一个女孩儿出生，当今圣上急得都想让老祖宗们搬新家了。\n   或许是老祖宗们怕棺材板不保，也或许是皇天不负有心人，在全皇室的殷殷期盼下，三百年后，终于迎来了他们心心念念的小公主。\n   天老爷啊！\n   小公主竟然是个小神棍！\n   别看她小小一只，年仅三岁半，但她文武双全、能掐会算、画符炼丹、驱鬼算命、上房揭瓦、惩奸除恶……样样精通。\n   一双眼能看透众生因果，主打一个不爽就开扒，所有阴私之事在她眼里都不是秘密。\n   满朝文武瑟瑟发抖：你不要过来啊！", "tags": ["古言脑洞", "古代言情", "团宠", "虐渣", "无脑爽", "风水秘术"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假千金全家读心，我靠摆烂躺赢", "fullTitle": "假千金全家读心，我靠摆烂躺赢", "link": "https://fanqienovel.com/page/7654561730638384152", "data": [3.26, 3.93, 4.21], "trend": 0.95, "latest": 4.2, "wordNumber": 162834, "creationStatus": 0, "desc": "前世，桓未晚身为侯府真千金，却被假千金抢走父母、兄长和婚约，最后惨死乱葬岗。\n重生回府，她决定不争了。\n亲情不要，婚约不要，侯府嫡女的位置也不要。\n她只想远离这群糊涂蛋，吃瓜摆烂，安稳活命。\n谁知刚进侯府，她就绑定了吃瓜系统。\n她不知道的是——\n全家都能听见她的心声。\n【大哥别喝，那碗汤里有毒！】\n【爹别查了，你身边那个忠心耿耿的副将就是敌国细作！】\n【娘，你还护着假千金呢？她已经准备踩着大房的尸骨嫁进皇子府了！】\n桓未晚表面乖巧，心里疯狂吃瓜。\n原以为侯府众人还会像前世一样护着假千金，结果一夜之间，全家都变了。\n大哥拔剑护在她身前。\n父亲连夜锯平她院中的门槛。\n母亲打开库房，恨不得将十五年亏欠全部补给她。\n假千金越算计，侯府众人越护着桓未晚。\n直到高高在上的摄政王祁临渊也将她堵在怀中，低声问：\n“你连满朝文武的秘密都能猜中。”\n“偏偏看不出本王为何一次次护着你？”", "tags": ["古言脑洞", "古代言情", "系统", "幻想言情", "重生", "真假千金"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿女尊躺平纳夫", "fullTitle": "身穿女尊躺平纳夫", "link": "https://fanqienovel.com/page/7655467828614548542", "data": [3.67, 4.07, 4.23], "trend": 0.56, "latest": 4.2, "wordNumber": 153818, "creationStatus": 1, "desc": "1V多，男全洁，空间，异能\n白絮是一个倒霉蛋，倒霉的喝水都塞牙缝。\n可是没想到倒霉蛋在末世没混下去，到了女尊小世界居然混下去了，而且混的还有点好。\n不是说女尊都是女子赚钱养家吗？为什么这里不一样？\n而且夫郎们怎么都这么奇怪？", "tags": ["古言脑洞", "古代言情", "穿越", "系统"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成京城第一权贵，主角们颤抖吧", "fullTitle": "穿成京城第一权贵，主角们颤抖吧", "link": "https://fanqienovel.com/page/7628206250508962878", "data": [3.66, 4.07, 4.2], "trend": 0.54, "latest": 4.2, "wordNumber": 273752, "creationStatus": 0, "desc": "爽文+团宠+日常+搞笑+利己+万人迷+系统\n坏消息，绑定了反派系统。要和一群打不死的主角们斗。\n好消息。系统直接带着宿主顾昭月穿成京城第一权贵，皇帝亲弟弟唯一的孩子——昭月郡主。小小主角们，拿捏～\n真假公主，偏心假公主？\n想都别想，各归其位，假公主变奴婢。\n人前显圣文主角。在我面前装神仙？\n系统商城在手，给老娘爬。\n众皇子上位之后要第一个宰了我？\n系统商城在手，给我金大腿——皇帝伯伯续波寿命，熬死你不成问题。\n你爹是皇帝没错，但你爹有几十个崽，我爹就我一个，物以稀为贵，懂？\n公主表姐非男主不嫁？来人，剥去她的公主身份，贬为庶人。\n叮，解锁新小说，修真界大佬魂穿异世。\n切～管他是龙是蛇，到我的地盘就得好好趴着。\n感谢最大的金主——反派系统001送来的顶级背景哦～（特别鸣谢～）\n主角们，颤抖吧！\n\n小剧场：\n系统：没错！我们反派天生就是一个阵营的。长大后的顾昭月：支持！所以这清冷反派，阴鸷反派，温润反派……各种反派快到本郡主府上来～", "tags": ["古言脑洞", "古代言情", "系统", "穿书", "团宠", "反派"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越重生，她靠弹幕在古代翻身", "fullTitle": "穿越重生，她靠弹幕在古代翻身", "link": "https://fanqienovel.com/page/7656862681466407998", "data": [3.44, 3.79, 3.96], "trend": 0.53, "latest": 4.0, "wordNumber": 140159, "creationStatus": 1, "desc": "穿越十弹幕提示十灵泉空间十多胞胎十抢男女主机缘：现代十八线小明星桑叶，在拍武侠片的时候，发生意外，穿越成大胜皇朝丞柤府嫡女桑叶，天崩开局，一来就要在宫里被抓奸，好\\在有弹幕金手指提示。【女配惨了，女主马上就要带人来抓奸了，她还在这里发愣，快跑呀】\n【女配手上的这个玉佩，不就女主的灵泉空间吗？女主明天就会意外开启，真想看看灵泉空间是什么样子的。】\n【明天女主就要去把那个芳华楼以5000两银子买下，简直是捡了个大漏啊！不愧是我们女主。】\n桑叶一边吃瓜看戏抢机缘，一边赚钱撩夫带娃娃，生活有兹有味。", "tags": ["古言脑洞", "古代言情", "穿越", "空间", "嫡女", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成老祖宗后，我改写全家炮灰命", "fullTitle": "穿成老祖宗后，我改写全家炮灰命", "link": "https://fanqienovel.com/page/7657374227460262937", "data": [5.09, 5.63, 5.48], "trend": 0.38, "latest": 5.5, "wordNumber": 225873, "creationStatus": 1, "desc": "化神修士长宁渡劫飞升时，竟被一道天雷劈进了“大乾”王朝，成了镇国公府的老夫人。\n原身与她同名，同样叫长宁，只是多了大乾皇室的姓氏，凤氏。身份更是尊贵至极。她是先帝胞妹、当今圣上的皇姑，大乾唯一的镇国大长公主。年轻时下嫁战功赫赫的镇国公，夫君离世后，年近五十的她，早已成了镇国公府说一不二的老祖宗。\n一开始，长宁还觉得，这样的开局也算不错。荣华富贵在手，儿孙满堂，无需再为修炼拼命。\n直到她发现，这个世界竟是自己曾经看过的一本小说。\n而镇国公府，正是书中那个一年后会被诬陷“通敌叛国”、满门抄斩、流放惨死的炮灰家族。\n长宁：“……”\n既然知道结局，她自然不可能坐以待毙。\n于是，镇国公府上下很快发现，自家老祖宗突然像变了个人。\n她先是雷厉风行，斩断所有可能被人利用的隐患；又以强硬手段清理府中蛀虫，整肃内外势力。短短数月，原本漏洞百出的镇国公府，被她经营得固若金汤。\n至于原书那对踩着镇国公府尸骨上位的男女主？\n长宁只冷笑一声。\n想拿她全族的命铺路？\n做梦。\n【无CP＋金手指强大＋全家逆天改命＋爽感拉满】", "tags": ["古言脑洞", "古代言情", "穿越", "空间", "公主", "无CP"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满朝听见我心声后，长公主护短了", "fullTitle": "满朝听见我心声后，长公主护短了", "link": "https://fanqienovel.com/page/7642748664410016793", "data": [4.23, 4.43, 4.52], "trend": 0.29, "latest": 4.5, "wordNumber": 281009, "creationStatus": 1, "desc": "（评分刚出，后面会涨，请放心食用）【读心吃瓜+爆笑沙雕+发疯文学+甜宠+微群像+双女主+1v1】\n版本一：\n宁小满穿越大夏两年半，绑定吃瓜系统。\n她在街上卖身时，被乔装逛街的冷面长公主带回府。\n\n她以为抱上金大腿，结果公主府也不太平：管事做两套账、绣房拿针扎人、外院领粮越来越狠。\n她嘴上装傻，心里喊统子扒瓜，公主、丫鬟、护卫统领，一个个憋笑憋到内伤。\n\n后来，皇帝听见了，皇后听见了，满朝文武也听见了。\n于是，大夏朝堂画风突变。\n\n反派正在深情演戏，她心里吐槽：\n「哥，别演了，你心眼多的都能给苏打饼干扎眼了。」\n\n贪官正在哭穷喊冤，她心里开麦：\n「你家地窖银砖都快码成小长城了，还搁这儿装月光族？」\n\n众人表面严肃，内心疯狂憋笑。\n宁小满：奇怪，为什么他们看我的眼神越来越不对？\n\n长公主冷静护人：\n“她胆小，别吓她。”\n\n满朝文武看着刚在心里把反派祖宗十八代都创飞的小姑娘，陷入沉默。\n胆小？\n殿下，您要不要听听她心里在骂什么？\n\n版本二：\n全大夏都知道，长公主萧明昭冷血、冷面、冷心。\n直到有一天，她捡回一个叫宁小满的小姑娘。\n\n从此，长公主上朝会走神，皇帝批奏折会喷茶，皇后喝茶会微笑，满朝文武会集体沉默。\n因为他们都听见了同一个声音。\n「啊，这瓜真香！」", "tags": ["古言脑洞", "古代言情", "系统", "甜宠", "搞笑轻松", "1v1"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被丢乱坟坡后，我的客户全是鬼", "fullTitle": "被丢乱坟坡后，我的客户全是鬼", "link": "https://fanqienovel.com/page/7652224733592685592", "data": [5.72, 5.71, 5.81], "trend": 0.09, "latest": 5.8, "wordNumber": 286929, "creationStatus": 1, "desc": "修仙界不务正业的茱萸散人渡劫失败，一睁眼发现自己穿到古代奄奄一息的三岁小儿身体里。\n大冬天被家里人扔到乱坟坡，眼瞅着就要冻死了。\n 好消息：渡劫失败被雷劈死又活了。\n坏消息：这个世界没有灵气，修炼不了。\n本以为这辈子都要像凡人一样生活了，突然发现天道还给她留了条缝。\n她继承了原主的阴阳眼，能以凡人之躯看到鬼。\n在帮鬼完成心愿后，对方的真心感激会化为愿力进入她体内，而这愿力能转化成灵气。\n这就叫天无绝人之路啊！\n\n于是接下来茱萸的日子变了。\nA：我死时没来得及告诉儿子我私房钱藏在哪，烦请姑娘帮忙找出来放到儿子床头。\n茱萸：行\nB：我儿子换了我的棺材板，你帮我把他私房钱偷来咱俩分。\n茱萸：可以\nC：我要跟我老相好埋一起。\n茱萸：没问题\nDEFJGHIJK……\n\n茱萸一鱼两吃，愿力+劳务费两手抓，每天睁开眼：办完你的办你的……\n\n", "tags": ["古言脑洞", "古代言情", "乡村", "幻想言情", "穿越", "风水秘术"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了冷血皇帝的病弱炮灰养子", "fullTitle": "穿成了冷血皇帝的病弱炮灰养子", "link": "https://fanqienovel.com/page/7628961061521083416", "data": [2.66, 2.72, 2.7], "trend": 0.04, "latest": 2.7, "wordNumber": 268862, "creationStatus": 1, "desc": "【亲情向＋无CP＋病弱＋团宠＋架空】\n　　作为第二代的陪伴型AI仿真人，零零一陪伴小主人从幼崽到成年期，功不可没。\n　　按照原计划，它是要更新老化零件，再陪伴主人到老年。\n　　但市面上越来越多的新款，大人们早就想要换掉它，他们第一时间销毁了零零一。\n　　零零一不知道自己被销毁了，在重新醒来过后，它以为自己升级成功了，换了新皮肤。\n　　但脑海中不知道为什么多出了一段奇怪的记忆，它是炮灰？叫做李临祎？\n　　还是个炮灰，因为身体孱弱，又天生寡言少语，被遗弃在雪天荒野，遇到了重伤的帝王李钦纶。\n　　帝王会心软，将他带回去，认作养子，养在身侧。但他不识好歹，偏执娇纵，横行无忌，得罪了一众皇子公主，以及妃子，甚至下到宫女太监，无一不厌恶他。\n　　最后落得废为庶人，驱逐出宫的下场。\n　　零零一不明白自己这是穿书了，以为这是自己被新植入的程序……既然是程序，就应该执行。\n　　至此，零零一变成了炮灰李临祎。\n　　但不太会阴谋诡计的陪伴型零零一，总会搞砸一切……\n　　他后知后觉地发现，已经和【程序】完全不一样的时候……\n　　嗯，大概是零零一变成了真人之后的古代日常。（架空哒！）", "tags": ["古言脑洞", "古代言情", "穿越", "团宠", "医术", "无CP"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频悬疑": [{"label": "盗墓：长生都是有纹身的", "fullTitle": "盗墓：长生都是有纹身的", "link": "https://fanqienovel.com/page/7622580052009438233", "data": [12.35, 13.75, 14.34], "trend": 2.0, "latest": 14.3, "wordNumber": 276519, "creationStatus": 1, "desc": "【OOC+无CP+全员单箭头+陈皮亲儿子+社恐男主+我是想要刺激，但绝对不包括这种刺激】\n陈言回到陈家的第一件事，就是杀了一批汪家人。\n陈金水到死都没想明白，汪家是什么？\n长白山上，张启灵觉得陈言眼熟，好像在哪里见过。\n吴邪更是不可置信的问潘子要是他成了家主，也需要这么干吗？\n对于黑瞎子，陈言更是热情，问黑瞎子吃不吃烤肉？\n瞎：小四爷，瞎子我吃饱了。\n言：那可惜了。\n*\n陈言的出现，炸了整个九门，也炸了整个盗墓圈子。\n谁都没有想到，一直混迹在国外，亲娘是北派最有名的摸金校尉后人的胡清，竟然会是南派九门四爷的崽子。\n南北派都怀疑人生了。\n吴三省想要局限于南派的事情，陈言不屑。\n要玩就玩大的。\n*\n北派南派，三教九流都疯了，长生？长生在哪？哪有长生？\n什么？长生的人身上有纹身？懂！挖地三尺都要找出来！\n汪家：草！\n张家：草啊！\n九门：陈皮！！！\n陈皮：我耳聋，还眼瞎，等死呢。勿扰。\n小剧场。\n邪：言哥，我三叔能还我吗？\n花：阿言，解连环能直接掐死吗？\n灵：我留下。\n黑：言子，没有你我可怎么活啊~\n皮：我砍死你们！\n言：我是想要刺激，但绝对不包括这种刺激。\n胖：言哥，求带啊，我也是摸金校尉的后代啊~", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人", "悬疑恋爱"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三七穿越盗墓世界", "fullTitle": "三七穿越盗墓世界", "link": "https://fanqienovel.com/page/7650737707861167129", "data": [2.99, 3.61, 3.89], "trend": 0.91, "latest": 3.9, "wordNumber": 140695, "creationStatus": 1, "desc": "灵魂摆渡里反应慢半拍的孟婆三七无意间离开了黄泉，被人类的花花世界所吸引，又遇见一群把她当妹妹宠的人，不过这几个哥哥怎么都奇奇怪怪，总是喜欢往地底下钻呢？算了，看在他们这么弱小的份上，她就勉为其难地护着他们吧～\n三七是被吴邪捡到当妹妹养的，所以跟 , "悬疑", "灵异", "无CP", "群像", "悬疑恋爱"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：大哥，要成为我的信徒吗？", "fullTitle": "盗墓：大哥，要成为我的信徒吗？", "link": "https://fanqienovel.com/page/7469016608720030744", "data": [2.8, 2.75, 2.86], "trend": 0.06, "latest": 2.9, "wordNumber": 130220, "creationStatus": 1, "desc": "（吳二白女儿+原创cp+与主角团亲情友情向+自然力量+微团宠）\n为了稳定天地间的力量变化，维持生灵间的平衡，自然与天道达成共识，自然选择人类成为她的使者，履行维护这个世界的平衡，世代自然使者就这么履行着自己的职责。\n\n直到这代使者——天道进行了选择，祂察觉到了这个世界这一代的气运者命运轨迹发生了变化，有一股力量插手了他们原本的轨迹，于是一个和他们有密切联系的孩子被祂选中。\n\n她顺应天道出生，却被阴谋笼罩，一张大网将她一步步推向九门与汪家的局，眼睁睁的看着疼爱自己的哥哥一步步走向深渊，父亲越来越多的白发。\n\n吴盎然逗弄着指尖求抚摸的藤曼，你们是在挑衅恢复力量的自然使者吗？\n\n“哥，要不你拜拜我吧，你太邪门了。”\n“我要不给你上柱香？”吳邪咬牙切齿的发问。\n“你要成为我的信徒？也可以啊！” \n“等等，你们一块过来干嘛？我只要我哥一个信徒啊！”\n\n吳盎然表示：她哥真的不是一般人能保的，太邪门了。\n（拯救意难平，全都好好的。）", "tags": ["女频悬疑", "悬疑", "盗墓", "灵异", "悬疑恋爱"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "人在唐诡，每天都在策反六人组", "fullTitle": "人在唐诡，每天都在策反六人组", "link": "https://fanqienovel.com/page/7649606938501598233", "data": [1.44, 1.46, 1.46], "trend": 0.02, "latest": 1.5, "wordNumber": 295019, "creationStatus": 1, "desc": "古武世家继承人裴琳琅意外穿越进了唐诡世界之中，加入六人小分队，共探诡案的同时，每天最喜欢的就是积极策反苏无名和卢凌风支持公主上位\n裴琳琅：风啊，嘞是恁娘咦！恁娘要是登基了，恁将来就是皇帝哎！俺姐就是皇后啊！\n卢凌风：我卢凌风此生忠于大唐，而不是战队于谁，还有你好好说话！\n裴琳琅：名呀，公主殿下很赏识侬的呀，侬帮助公主上位，那未来就是要当宰相的呀，那可是升官发财的好机会呢呀~\n苏无名：在下愚钝，不敢有此妄想，裴姑娘慎言\n裴琳琅：君君呀~公主要是当了皇帝，你未来可是皇后呢~我就是皇后的妹妹了……\n裴喜君：打住，小妹慎言！\n樱桃、费鸡师、薛环：为什么不策反我们三个？\n裴琳琅：那他们三个选了公主，你们三个难道不跟着？（摊手）\n樱桃、费鸡师、薛环：……说的好像也有道理……\n（外人面前优雅大小姐，实则脑回路清奇的搞笑女，各方面都略懂一点点，武力值max，一心想要公主上位的女主一枚~\n不拆cp，女强）", "tags": ["女频悬疑", "悬疑", "穿越", "推理", "破案", "悬疑恋爱"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被阴湿杀人魔盯上后【贵族学院】", "fullTitle": "被阴湿杀人魔盯上后【贵族学院】", "link": "https://fanqienovel.com/page/7561845467420560409", "data": [1.78, 1.8, 1.8], "trend": 0.01, "latest": 1.8, "wordNumber": 299722, "creationStatus": 0, "desc": "群狼环伺vs美而不自知万人迷｜各种阴湿疯子变态扯头花、微灵异、真杀人魔、男洁\n变异版文案:\n赵吟自觉是个平平无奇的特招生，日常是兼职上学回家三点一线，偶尔需要应付富二代男友身边那群傲慢毒舌又奇怪的朋友。\n\n直到德尚贵族学院频频死人。\n\n警官将她带到审讯室，似笑非笑问:“赵同学知不知道这三位被扒皮砍头的死者都在偷偷暗恋你？”\n\n文案二:\n赵吟和宋舰谈恋爱时，他身边朋友都说:“一个寡淡普通的女人，空有皮囊，根本配不上你。”\n\n“她太穷了，不仅在餐馆洗碗，还兼职跑腿，使唤她只用一点廉价的报酬，和使唤一条狗有什么区别呢？”\n\n“阿舰，你最好和她分手。”\n\n宋舰那时爱她，疯起来连命都可以不要，只不过后来在国外飙车出了意外，失去记忆，唯独忘掉赵吟。\n\n他带着新女友回国当晚，赵吟家那扇灰扑陈旧的掉漆大门迎来了好几波“客人”。\n\n“吟吟，你应该看看我的。”\n\n“阿舰不懂珍惜，只有我才是真心爱你。”\n\n“你根本不知道，我多嫉妒，配不上你的，明明是他。”\n排雷:是万人迷，不是万男迷，会有变态女配出没。除女主外，全员恶人。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱", "风水秘术"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [4.66, 6.27, 6.99], "trend": 2.33, "latest": 7.0, "wordNumber": 209789, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [5.66, 7.26, 7.86], "trend": 2.2, "latest": 7.9, "wordNumber": 223247, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.31, 3.68, 3.86], "trend": 0.55, "latest": 3.9, "wordNumber": 260607, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全村逃荒流失所，我独深山囤粮肉", "fullTitle": "全村逃荒流失所，我独深山囤粮肉", "link": "https://fanqienovel.com/page/7659219704237542425", "data": [3.67, 3.94, 4.18], "trend": 0.5, "latest": 4.2, "wordNumber": 157897, "creationStatus": 1, "desc": "评分刚出，大家莫慌！！！\n\n【种田+系统+空间+囤粮+深山+基建】\n陆枕筠穿越了，刚穿来，就面临全村逃难，她被丢下的命运。\n外人以为，一个十四岁的小姑娘：生活困苦，举步维艰。\n实际上的陆枕筠，堪称捡漏之王：\n粮食，捡捡捡！\n银钱，捡捡捡！\n保暖衣物，捡捡捡！\n山中宁谥，岁月静好。\n陆枕筠一边种田，一边捡漏，顺手打造了一个世外桃源。\n叮！恭喜宿主，安全领地扩展五百米，一千米，两千米，五千米……\n多年后，众人诧异。\n当初那个瘦不拉几，面黄肌瘦的小女娃呢？\n不好意思，请叫我：陆女王！\n（本文有男主，但出场比较晚，大体还是以女主深山基建为主。有空间和系统，但都以辅助为主。）", "tags": ["种田", "古代言情", "乡村", "系统", "穿越", "基建"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿古代，又遇逃荒，怎么活", "fullTitle": "身穿古代，又遇逃荒，怎么活", "link": "https://fanqienovel.com/page/7655897155650980888", "data": [2.69, 2.97, 2.96], "trend": 0.27, "latest": 3.0, "wordNumber": 171417, "creationStatus": 1, "desc": "刚进入一家公司实习没几天的林荞，在帮一个离职同事送东西去楼下时，却在电梯内一脚踏空，连同装物品的纸箱子，一起穿越到了古代。\n别人穿越，都是魂穿，林荞却是整个身体都跟着穿越了。而穿越大神送给她的金手指，就是那个装有同事私人物品的纸箱子，变成了她的空间。\n就在林荞一边庆幸自己有个小的可怜的空间，一边忧愁自己在古代是个黑户时，让她更崩溃的是，她所在的地方，竟然大旱了半年，到处都是逃荒的流民。\n而她没钱没水没粮。\n苍天啊！大地啊！这叫她一个人生地不熟的现代人，在这里怎么活？\n逃荒种田文，女主无CP，不会和朝堂，贵族，大将军什么的扯上关系，就是一个普通的现代女孩在古代小心翼翼求生存，最终平安终老的日常文。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "逃荒"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女一睁眼，残疾太子冷脸剥玉米", "fullTitle": "恶女一睁眼，残疾太子冷脸剥玉米", "link": "https://fanqienovel.com/page/7637807750260460568", "data": [3.21, 3.29, 3.34], "trend": 0.13, "latest": 3.3, "wordNumber": 175992, "creationStatus": 0, "desc": "【病秧子纯情废太子VS搞怪抽象大力女医生】+【种田无宫斗】+【虐渣】+【搞笑轻松】+【空间】+【双洁】\n医学大佬苏青梨，穿成古代农村小恶女，开局就身处山贼窝。\n\n好不容易逃回家，发现家里更惨，家里欠债，大嫂难产，一家人快活不下去了。\n\n不过问题不大，她穿越把空间实验室给带过来了。\n\n她撸起袖子，虐渣男，搞钱，还债，赎地，把绝望的一家人从泥潭里捞了出来。\n\n只是，她顺手救的那双腿瘫痪的病秧子怎么回事？饭不吃，药不喝，整日摆着一副“活着没意思”的死人脸。\n\n苏青梨表示：多半是闲的！\n\n啪地一下，直接将一大筐玉米砸在他面前。\n\n“腿废了，手不是还能动吗？干活！”\n\n病秧子：“？？？”\n\n干吧。\n\n不就一点农家活，能比读书练武累？\n\n结果——\n\n他剥完玉米剥花生，剥完花生刮木薯，刮完木薯煮猪食。\n\n好不容易腿能站起来了，又被拉着下田插秧，赶牛放羊。\n\n萧时衍沉默了。\n\n好消息：她没把自己当残疾人。\n\n坏消息：也没把自己当人。\n\n后来的苏青梨才知道，这个被她使唤许久的病秧子美人，是曾经位高权重的太子。\n\n你说这事整的，也没人跟她说啊。\n\n村里人都说，就是有十条命，也不敢娶这恶丫头。\n\n可后来，一个清隽如玉的公子带着十里红妆来敲她门，\n\n“阿梨，我来求赘了，你可愿娶我？”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "医术"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "侯府大小姐居然是末世大佬", "fullTitle": "侯府大小姐居然是末世大佬", "link": "https://fanqienovel.com/page/7649705209668570174", "data": [2.24, 2.27, 2.24], "trend": 0.0, "latest": 2.2, "wordNumber": 271119, "creationStatus": 1, "desc": "大女主➕无CP【乡村➕侯府➕流放➕建设➕造反➕女帝】\n末世大佬因背叛而被系统选中，穿越到被侯府养在乡下的傻子身上，先是诛杀欺负过原主的二流子，回到京城后，主打表面柔弱不堪，背后直接捅刀子.......", "tags": ["种田", "古代言情", "乡村", "穿越", "女强", "无CP"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [7.63, 8.37, 9.0], "trend": 1.37, "latest": 9.0, "wordNumber": 200544, "creationStatus": 1, "desc": "评分刚开，后面会涨。\n（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零嫁给早死的男主后连生十娃", "fullTitle": "七零嫁给早死的男主后连生十娃", "link": "https://fanqienovel.com/page/7656631345929522201", "data": [5.25, 5.52, 5.92], "trend": 0.67, "latest": 5.9, "wordNumber": 204978, "creationStatus": 1, "desc": "【年代➕多子文➕团宠➕病弱娇夫宠妻➕先婚后爱】\n林小满的弟弟妹妹们要饿死了。\n林小满决定把自己嫁给快要病死的顾砚辞。\n没想到病秧子顾砚辞长得跟画里的人一样，小满看见他便心生欢喜。\n洞房夜当天，顾砚辞情绪激动下，差点一命呜呼。\n这可把小满给吓坏了，小满下定决心好好照顾他！\n筒子楼的人都在看好戏呢。\n人人都知道，顾砚辞从娘胎开始，这身体便不太好，医生说过他活不过二十二岁。\n“真不知道谁家可怜姑娘嫁给了顾家小子。”\n“是啊，顾砚辞恐怕不行了。”\n一年还没到，林小满怀了顾砚辞的孩子。\n邻居：“这顾家也算是有后了，只是可怜了小小的娃，从此以后有娘没爹。”\n“寡妇日子不好过啊。”\n又过了一年，顾砚辞活着，林小满一胎二宝了！\n“我看啊，顾砚辞今年肯定不行了，我看他走路腿都在打颤呢。”\n“是啊是啊，可怜到时候小满孤儿寡母。”\n又过了两年，小满又又怀孕了。\n邻居们：“……”\n他们眼瞅着顾砚辞年年病秧秧，却生了一个又一个孩子。\n从一开始大家可怜小满嫁给一个将死之人，到后面又开始羡慕顾砚辞能有小满这个福妻。\n没人知道，顾砚辞对小满是一见钟情，她干净纯粹， 热爱生活，有了小满，他生活才足够圆满。", "tags": ["年代", "现代言情", "先婚后爱", "团宠", "宠妻", "一见钟情", "情有独钟"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [6.57, 7.18, 7.16], "trend": 0.58, "latest": 7.2, "wordNumber": 191345, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "童养媳揣崽随军，冷面军官追着哄", "fullTitle": "童养媳揣崽随军，冷面军官追着哄", "link": "https://fanqienovel.com/page/7644917027538209816", "data": [4.88, 5.41, 5.45], "trend": 0.57, "latest": 5.5, "wordNumber": 196336, "creationStatus": 1, "desc": "（年代+随军+先婚后爱+养娃+萌宝）\n作为陆家的童养媳，苏婉婉从小就知道，自己长大是要嫁给陆振哥当媳妇儿的。\n可好不容易等到从军多年的陆振哥回家，他却告诉她，他不能娶她，只当她是妹妹，也反对这种包办婚姻。\n从小就喜欢陆振的苏婉婉天都塌了，但还是忍着泪选择成全。\n不曾想，陆母让她送的一碗汤面，却让一切失去了控制。\n也让陆振对她产生了很深的误会，认为她是两面三刀，心机深沉的人，白天说好，晚上就给他下药。\n天还没亮，陆振就愤然离家。\n陆父陆母怕陆振一去不回，便让苏婉婉去部队随军。\n不想被误会的苏婉婉，想去部队跟他说清楚，便独自一人背上行囊踏上了前往部队的火车……", "tags": ["年代", "现代言情", "萌宝", "先婚后爱", "青梅竹马"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [6.89, 7.24, 7.45], "trend": 0.57, "latest": 7.5, "wordNumber": 278845, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长你胖村姑媳妇带龙凤胎随军了", "fullTitle": "首长你胖村姑媳妇带龙凤胎随军了", "link": "https://fanqienovel.com/page/7648944914255858713", "data": [5.7, 6.15, 6.25], "trend": 0.56, "latest": 6.3, "wordNumber": 264348, "creationStatus": 1, "desc": "【觉醒＋军婚＋养娃＋变瘦变美＋灵泉空间＋先婚后爱】\n前胖黑丑后丰腴美人✖️前禁欲后重欲\n穿越女为了完成任务，操控了苏眠的身子五年。\n让苏眠从白幼瘦的美女，变成了黑胖丑的孩子妈，且跟家人朋友都断绝了关系。\n大结局后，穿越女脱离了世界。\n看着留下来的一大堆烂摊子，苏眠都恨不得自己两眼一闭。\n面对着被穿越女养得骨瘦如柴的两个娃，以及一贫如洗的家，苏眠只得振作起来，负起责任将两个娃养大。\n可娃毕竟不是她一个人的，苏眠也不想两个娃一直被人叫野种。\n所以干脆带娃去部队，寻找孩子的亲生父亲。\n还没瘦下去的苏眠，也没指望那个门槛都被踏破的首长能看上自己。\n让他给钱或者两人一起抚养孩子都行。\n只是没想到的是，才刚到部队没几天，对方就带着她去扯证了。\n·\n傅晏清对女人提不起兴趣，所以一直清心寡欲着。\n一次意外，他对一个女人失控了，事后却连女方是谁都不知道。\n直到有一天，一个胖乎乎的女人来到了部队，说为了自己生了两个娃。\n秉持着责任心，傅晏清直接跟对方领了证。\n只是说好的搭伙过日子，但是在相处过程中，傅晏清却越陷越深，越来越失控。\n胖又怎么样？胖点好，肉多，手感好！\n只是媳妇越变越美，越来越受欢迎，傅晏清生怕媳妇      这具身体的人十分的崩溃，处于这个年代还发生了这种事情，加上父母他们的劝阻最后嫁给了这个军官。\n       嫁人之后，这个身体女孩过的十分不幸福，嫁的军官每个月除了拿钱什么都不管，婆婆还会时不时来刁难她。\n       萧玖染现在明白了，她这是改上了穿越潮流，她从前也是听过朋友说过几本小说。\n       萧玖染了解完现在能处境，她并不打算继续和这个军官生活。萧玖染打算提出离婚，如果现在这个身体生的小孩韩旭辰要留下来她就不带走，不要的话她就把这个小孩一起带走。\n       离婚后萧玖染打算考大学考研究生，去美国留学博士，留学的时候在美国炒股，毕业之后带着赚的钱回国做投资。", "tags": ["年代", "现代言情", "穿越", "空间", "魂穿", "家长里短"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "搬空家产去随军，进错洞房被亲晕", "fullTitle": "搬空家产去随军，进错洞房被亲晕", "link": "https://fanqienovel.com/page/7649401358138756120", "data": [4.93, 4.99, 5.05], "trend": 0.12, "latest": 5.0, "wordNumber": 269307, "creationStatus": 1, "desc": "【空间+萌宠+爽文+丰满娇媚能医会毒大美人VS顶级男德无脑护军官】\n全球首富大小姐白梨无聊开了把游戏，打团气到嘎过去，还倒霉催的穿进酸鸡室友写的小说里。\n原主作为天命女主，被攻略者夺取气运，剥离光环，收走家产，家暴致死。\n死了也不放过，还给她配了几门阴婚。\n这给白梨看笑了，什么脑残剧情？滚一边去。\n她只会以恶制恶，煽风点火，主打谁都别想活。\n亲爹渣，后妈毒，她鞭子蘸碘伏，边打边消毒，免费附送农场改造VIP服务。\n白莲继妹？给她脸划烂，腿打断，嘴巴缝上，送她去收破烂。\n房屋地皮收收收，祖产嫁妆搬搬搬，雁过拔毛，一分不留，厕纸都一道顺走。\n连夜收拾行李，去军区投奔未婚夫。\n只是，咦，好像投错了～。\n裴泫冷静克制，不近女色，战友临时出任务，他去帮接未婚妻。\n第一次见面，小姑娘肤白貌美，身段窈窕，脆生生喊了句，“同志，你好。”\n裴泫心脏狂跳，连娃儿名字都已经想好。\n兄弟，既然你嫌弃，那我可就接盘了？\n大院都说裴泫疯了，捡了个兄弟不要的二手货。\n结果，白梨一手银针，起死回生，灵药出手，病痛全消，八国语言，通通全会，还被国家奉为座上宾，视为重点保护对象。\n看着闪闪发光的她，战友那是肠子都悔青了。", "tags": ["年代", "现代言情", "穿越", "空间", "先婚后爱", "虐渣"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零年代病佳人把偏执男哄迷糊了", "fullTitle": "七零年代病佳人把偏执男哄迷糊了", "link": "https://fanqienovel.com/page/7632583070306028568", "data": [5.79, 5.85, 5.82], "trend": 0.03, "latest": 5.8, "wordNumber": 235836, "creationStatus": 1, "desc": "（七零年代+双洁+偏执娇宠+病弱美人VS疯批阴郁狼狗+家里长短+穿书）\n　　注意；女主有轻微万人迷属性，性子软软糯糯有私心，划重点男女主双洁\n　　宁家的那个早产的小女娃，村子里的人都说她养不活。\n　　没想到这个小女娃不仅长大了，还长的亭亭玉立。\n　　村里人又说女娃身子弱，以后没人敢娶。\n　　偏偏宁家小丫头十分争气不仅在城里找到工作，还找到一个各方面顶顶好好的城里老公。\n　　在外人看来，宁沫沫是个有福的姑娘。\n　　只有宁沫沫知道她是一本年代文小说的小炮灰意外觉醒了。\n　　而她老公就是一个时刻求关注的哈士奇。\n　　木弛一发现她的重心不在他身上，就是一哭二闹三发疯。\n　　一开始，\n　　宁沫沫只是觉得木弛是一个很合适的结婚对象，\n　　相处中发现这个人脾气犟，性子也阴沉不定，但是对她很好有求必应。\n　　宁母告诉闺女，男人是一个猴一个栓法。\n　　于是宁沫沫摸索出了 流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [14.01, 14.21, 14.41, 14.98, 15.72, 17.56, 18.55], "trend": 4.54, "latest": 18.6, "wordNumber": 4622162, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [15.82, 16.41, 16.93, 17.53, 18.08, 19.33, 19.95], "trend": 4.13, "latest": 20.0, "wordNumber": 893294, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "想兼祧两房？搬空家产带儿女和离", "fullTitle": "想兼祧两房？搬空家产带儿女和离", "link": "https://fanqienovel.com/page/7545324289256328216", "data": [27.58, 28.47, 29.73, 29.43, 29.1, 28.71, 28.41], "trend": 0.83, "latest": 28.4, "wordNumber": 1152924, "creationStatus": 0, "desc": "【有空间，不是双洁，女主懂医术。】\n末世摸爬滚打多年的乔念，带着空间穿越到古代，一个穷秀才的妻子。\n刚睁眼，龙凤胎儿女面临被卖，乔念凭借自己的武力夺回孩子。\n成亲五年的秀才相公不回家？\n她带着孩子找过去。\
