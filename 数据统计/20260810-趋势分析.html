oundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [59.08, 62.61, 64.12], "trend": 5.04, "latest": 64.1, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春日烈阳", "fullTitle": "春日烈阳", "link": "https://fanqienovel.com/page/7163459032223583270", "data": [19.28, 22.62, 24.16], "trend": 4.87, "latest": 24.2, "wordNumber": 351264, "creationStatus": 0, "desc": "[体弱少女 X 烈日少年]\n（正文已完结）\n（原书名：春日烈阳）\n（青梅竹马+校园甜宠+日常）\n（人物设定均已成年）\n许渔刚来青禾中学的时候，有一个梦想，那就是在冬日纷飞的时候亲手接住一片雪花。\n她想，人生都这么苦了，总要来看一次大雪纷飞的样子。\n于是许渔努力的一边上学，一边治病。\n在来京市之前，自家亲爹说，在学校会有小时候的邻居哥哥帮忙照顾她。\n但是在许渔记忆里的邻居哥哥：喜欢揪她衣领子，还和别人打架。\n“邻家哥哥”顾盛：......\n第一次见到许渔的时候，顾盛站在校门口“亲切”为她指路。\n第二次见到许渔，顾盛提着保温杯里面装的是热牛奶。\n第三次，第四次......\n顾盛在许渔面前向来习惯了伪装，只有那一次。\n他在昏暗的路灯下表情狠厉的撺着一个人的衣领：“别让我看见你打扰她第二次，滚。”\n他终于有些抑制不住的爆发，脸上掉落的面具后才会原原本本的顾盛。\n那天的许渔忽然觉得，顾盛就像太阳。\n她想，如果在冬天摸不到雪花，那就拜托顾盛带着她去春天感受阳光也不错。\n世界对她来说无聊单调，但是顾盛能够带来温暖。\n立意：我们可遇不可求。", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "青梅竹马"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我刻薄不是装的", "fullTitle": "我刻薄不是装的", "link": "https://fanqienovel.com/page/7585498354692394046", "data": [14.53, 17.02, 19.36], "trend": 4.83, "latest": 19.4, "wordNumber": 300523, "creationStatus": 1, "desc": "那咋了？喜欢我的人只会觉得我在撒娇。\n-\n【贵族学院+都市】【恶女万人迷】【1v1】【雄竞】【轻松沙雕】\n－\n前世，恶女乔映只是因为嘴损，就被团宠文女主给宰了。\n重生后，乔映反思，觉得还是要有点恶毒手腕，这样才能保护这张好嘴。\n最好的防守就是进攻，所以这一次她把女主的舔狗们全给阴了。\n－\n钟树白这人是个冷脸萌。\n乔映亲他，他只会哼哼一声，说乔映是个坏女人。\n身为男主之一，钟树白没有走上既定的路线被攻略。\n而是在乔映破产后，豢养了她这只美丽的金丝雀。\n不过乔映实在不省心，一个没看住，就被弄死了。\n钟树白坐在凌晨的客厅，开酒刀割破手腕，随她而去。\n－\n既然老公迟早是我的，为什么不能现在就是我的？\n乔映猛追十七岁的钟树白。\n少年抗拒，结果一张嘴。\n“姐姐”两个字脱口而出。\n乔映已被萌晕。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "搞笑轻松", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [52.43, 54.65, 55.39], "trend": 2.96, "latest": 55.4, "wordNumber": 855621, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [61.67, 63.39, 64.38], "trend": 2.71, "latest": 64.4, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [21.95, 23.35, 24.33], "trend": 2.37, "latest": 24.3, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大小姐雇我替她和太子爷网恋", "fullTitle": "大小姐雇我替她和太子爷网恋", "link": "https://fanqienovel.com/page/7624147408376581145", "data": [37.57, 38.25, 38.65], "trend": 1.08, "latest": 38.7, "wordNumber": 384371, "creationStatus": 0, "desc": "已签实体出版！\n［无虐，无雌竞，轻松甜文，双洁1v1］\n【嘴特甜，很缺钱，纯欲钓系女主】\n【嘴很毒，钱贼多，冷傲拽哥男主】\n-\nS大校花姜晚接了一项特殊委托。\n豪门大小姐雇她追求海城太子爷进行网恋。\n照片、身份都是大小姐本人，手机对面换成她。\n然而太子爷又冷又拽，姜晚每天绞尽脑汁的撩。\n-\n姜晚费劲吧啦刚追到人，大小姐发来指令：\n“晚晚，目标达成，计划终止。”\n“收到！”\n姜晚连夜爬起来和太子爷提分手。\n商时序咬牙：【你别后悔】\n姜晚：【嗯嗯，绝不后悔】\n\n两天后——\n大小姐：“晚晚，情况有变，你还没跟他分手吧？”\n姜晚咬紧后槽牙：“你、说、呢？”\n大小姐：“快、快复合！”\n-\n复合后，海外留学的太子爷偷偷跑回国要给姜晚惊喜。\n他的惊喜，姜晚的惊吓！\n为了不掉马，情急之下，哄骗他酒店蒙眼。\n姜晚聊完天想溜，被他扣住腰亲懵！\n说好的网恋怎么还有失身的风险？\n-\n【掉马小剧场】\n某日，姜晚帮父母摆完摊后回到小区门口，太子爷突然打来电话。\n“在哪？”\n“不是告诉你我和朋友在拉斯维加斯玩呢。”\n“玩得开心吗？”\n“开心啊～”\n“回头。”\n姜晚：！！！", "tags": ["青春甜宠", "现代言情", "总裁", "甜宠", "双洁", "1v1"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [17.34, 17.87, 18.34], "trend": 1.01, "latest": 18.3, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被缠上了，穿成疯批的作精前女友", "fullTitle": "被缠上了，穿成疯批的作精前女友", "link": "https://fanqienovel.com/page/7596956333937544254", "data": [12.71, 12.79, 12.88], "trend": 0.18, "latest": 12.9, "wordNumber": 367077, "creationStatus": 0, "desc": "（已签出版 漫剧已上线）【穿书+女主社恐+男主疯批+双洁】\n【超级超级甜！！】\n别人眼中的乖乖女闻初，实则是个深度社恐——直到她穿进了一本大学校园文，成了男主的作精前女友。按照剧情，这个角色将以胡搅蛮缠和撒泼打滚成功“作”掉爱情，成为男女主甜美恋情的完美对照组。\n闻初原想照本宣科走完剧情成功分手，却想起剧情里男主是个阴暗疯批，不仅会设计报复前女友，后期还会对女主上演强制爱。\n社恐闻初陷入了两难：按照剧情作死会被男主报复，但是主动分手可能触发男主记仇然后报复。\n于是她在网上查询如何成功和男朋友分手？\n得到了一个意想不到的答案：热暴力！在保持作精的同时，进行热暴力，撒娇粘人，是个男人都不会受的了这么控制欲强的女朋友！\n慢慢的她发现男主对她也是蛮好的，说不定等后面女主出现后两人可以实现和平分手。\n就是这个男主怎么看她的眼神越来越深沉，变得比自己还粘人啊？ \n闻初：O.O 等等，这剧本不对啊！\n终于女主出现了，闻初终于小心翼翼的试探着提出分手，但为什么每次一提分手就被压着亲？\n##\n席黎野某一天看到了自己女朋友的备忘录。\n他笑出了声，原来是要离开自己吗？\n“分手？”他垂眸轻声重复，语气温柔。\n“闻初，想都别想。”", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "作精", "双洁"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "超甜！校草哑声诱哄小可爱", "fullTitle": "超甜！校草哑声诱哄小可爱", "link": "https://fanqienovel.com/page/7344299159488318489", "data": [12.67, 12.69, 12.84], "trend": 0.17, "latest": 12.8, "wordNumber": 406209, "creationStatus": 0, "desc": "【痞帅校霸大佬×娇软学霸甜妹】\n【校园小甜饼，双强，轻松甜宠，双向救赎】\n传闻江城八中有一校霸大佬顾辞澜，桀骜不驯，狂妄张扬，从不把任何人放在眼里。\n高二这年，新来了一位甜妹转学生。\n黎酥人美声甜，初来乍到就斩获月考年级第一名。\n只是她胆子忒大了，总招惹大佬同桌。\n“顾大佬，书包好重，帮我拎~”\n“同桌，来姨妈了肚肚痛，你帮我去买~“\n“顾辞澜，手机放下，今天跟我一起学习。”\n所有人都以为大佬要让她知道什么是人世险恶，却震惊地看到大佬心甘情愿，一一照做。\n后来，某次八中和隔壁职高约架，所有人都看见顾辞澜低声哄着转学生。\n往日的乖张恣意化为绕指柔，声线干净清冽，语气却卑微入尘土。\n“酥酥，我听你的不打架，别生我气了好不好？”", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "大佬", "相互救赎", "学霸"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [16.83, 23.95, 23.5], "trend": 6.67, "latest": 23.5, "wordNumber": 918778, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [15.02, 17.66, 19.07], "trend": 4.05, "latest": 19.1, "wordNumber": 567587, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [25.65, 28.2, 28.92], "trend": 3.27, "latest": 28.9, "wordNumber": 905657, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [15.72, 17.56, 18.55], "trend": 2.83, "latest": 18.6, "wordNumber": 4622162, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [12.31, 12.93, 14.88], "trend": 2.56, "latest": 14.9, "wordNumber": 1779007, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [18.08, 19.33, 19.95], "trend": 1.87, "latest": 20.0, "wordNumber": 893294, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [13.95, 14.7, 15.38], "trend": 1.43, "latest": 15.4, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世：兽夫太凶猛", "fullTitle": "穿越兽世：兽夫太凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [12.51, 12.69, 12.8], "trend": 0.3, "latest": 12.8, "wordNumber": 1328196, "creationStatus": 0, "desc": "【穿越兽世＋轻快甜宠+生活日常＋1vN+多雄】\n千夏在21世纪是个勤勤恳恳的打工人，这天加完班回家路上被一辆失控的汽车撞死，没想到当她再睁开眼的时候是在一个巨大的山洞里。\n山洞阴暗潮湿让她惶恐，而她身上只围着一块抹胸样式和短裙样式的破烂兽皮，她不明白她明明死去了又怎么会出现在这里。\n难道......忽然见她脑袋里电光一闪，她又细细看了身上的兽皮，这......不会是像她看的兽世小说那样，穿越兽世了吧？？？\n别人的第一兽夫是四阶、五阶强者，她一个最不受欢迎的瘦弱丑雌的第一兽夫就是这大陆的顶尖战力强者。\n上辈子她兢兢业业连个恋爱都谈过，这辈子刚穿来没多久就肚里揣崽，还上演了一场兽世带球跑。", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "带球跑"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [16.23, 16.25, 16.5], "trend": 0.27, "latest": 16.5, "wordNumber": 1632818, "creationStatus": 1, "desc": "【古言架空+女强+斗极品婆家娘家+养崽+无穿越+无重生+先婚后爱】\n　　银杏五岁就伤了身子，失去了做母亲的资格，尽管她长得好看又能赚钱。\n　　但依旧没有哪个人家愿意娶她，因为娶了她就变成绝户了。\n　　唯独村里的老鳏夫赖大，不但愿意娶她，还愿意出双倍的聘礼。\n　　这让银杏贪财的娘果断点头。\n　　收了五两银子的聘礼，让他把闺女直接领走。\n　　但银杏死活不肯，她知晓已经死了两个媳妇的赖大没安好心思。\n　　可在这封建的年代，婚姻向来是由父母做主。\n　　尽管她极力反对，但也无法改变贪财娘的想法。\n　　就在她绝望之时，那个藏在她心里多年的男人出现了。\n　　萧青北：婶子，我想娶银杏，希望您能同意。\n　　王氏：你要娶银杏？人家赖大出了五两银子的聘礼，你能拿得出来吗？\n　 萧青北：我能的。\n　　 银杏：青北哥，你真的要娶我吗？\n　 萧青北：嗯，跟我走吧。\n        银杏：大宝二宝，快叫爹！\n 大宝二宝：（他们可是皇子，怎么可能随便叫爹呢！）\n     萧青北：你们想学功夫吗？（这两个小子还真是块练武的好苗子）\n   大宝二宝：师父！（叫师父是可以的）", "tags": ["种田", "古代言情", "乡村", "女强", "养崽", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [32.97, 40.14, 43.58], "trend": 10.61, "latest": 43.6, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [32.94, 37.44, 39.18], "trend": 6.24, "latest": 39.2, "wordNumber": 503160, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [25.69, 26.58, 26.79], "trend": 1.1, "latest": 26.8, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君今日又没有藏好他的尾巴！", "fullTitle": "夫君今日又没有藏好他的尾巴！", "link": "https://fanqienovel.com/page/7565826198656273432", "data": [10.87, 11.62, 11.83], "trend": 0.96, "latest": 11.8, "wordNumber": 370843, "creationStatus": 0, "desc": "乔盈穿书了，但不幸的是，她被绑匪伤到了脑袋，失了忆。\n在阴暗潮湿的地牢里，她遇到了一个少年。\n少年一袭青衣，白发如雪，面容昳丽，却眼覆白绫，虽身有残缺，但他最是乐观爱笑。\n那一天，失忆的乔盈带着人畜无害的少年一起逃出了地牢。\n少年是个好人。\n因为怕血，所以哪怕是在尸山血海，他的衣摆也一尘不染。\n因为胆小，别人打架，他只敢躲在远处，众人却在下一刻死在毒雾里。\n因为善良，他给痛苦的敌人递药，可惜对方没熬住，七窍流血而死。\n于是，她决定和这样的好人成亲。\n再到后来，正派人士叫着妖孽，提剑而来。\n那一夜，尸横遍野。\n她终于想起来了剧情。\n这是一个诡异横生，光怪陆离的世界。\n有那么一个大反派，他缺乏正常人的情感，为祸苍生，引来纷争无数，最后是男女主牺牲生命才将他封印。\n腥风血雨里，少年回眸看她。\n蓝色的眼眸幽深诡谲，缀了血花的面容，宛若人间修罗，九条狐尾在身后肆意舒展，妖冶秾丽。\n乔盈被吓得脸色煞白。\n他却轻轻的笑，“你若是害怕想跑，可来不及——”\n话音未落，乔盈跑了，却是跑进他的怀里，拭去他脸上的血花，“你吓到我了，我还以为你受伤了！”\n少年眨眨眼，摸摸她的脑袋，又戳戳她的脸，“你是不是傻？”", "tags": ["古言脑洞", "古代言情", "反派", "穿书", "HE"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "你听心声我吃瓜，换嫁夫妻笑哈哈", "fullTitle": "你听心声我吃瓜，换嫁夫妻笑哈哈", "link": "https://fanqienovel.com/page/7592502894293683224", "data": [14.51, 14.84, 15.36], "trend": 0.85, "latest": 15.4, "wordNumber": 579611, "creationStatus": 0, "desc": "【吃瓜乐子人男主 × 读心宠夫女主，先婚后爱，夫妻联手，单女主】\n我，裴辞镜，穿成侯府二少，只想躺平吃瓜。\n谁知大婚在即，我那世子大哥，竟和我未婚妻滚到了一起！\n现场吃瓜，苦主竟是我自己？\n正当我以为要沦为全京城笑柄时，那位本该成为我大嫂的沈家嫡女，竟主动提出：\n“不如，换我嫁你？”\n我表面稳如老狗，内心狂喜：这姑娘有眼光！\n可直到婚后某天我才发现不对，我内心OS正嗨：【我媳妇今天真好看，想亲……】\n她忽然转头，眼波流转：“准了。”\n等等！\n她能听见我的心声？！\n这下好了，我吃遍天下的瓜，她专吃我这只呆瓜。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "宠夫", "代嫁代娶"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "有了暴君读心术，我在宫里杀疯了", "fullTitle": "有了暴君读心术，我在宫里杀疯了", "link": "https://fanqienovel.com/page/7367580979906497560", "data": [11.49, 11.94, 12.24], "trend": 0.75, "latest": 12.2, "wordNumber": 925747, "creationStatus": 0, "desc": "安玖穿成了皇帝宫里想爬龙床的小宫女。\n一睁眼，暴君将勾引他的小宫女一剑刺了个透心凉。\n第二天，暴君刺死了嫔妃身边的大宫女。\n第三天，给皇帝试菜的宫女毒发身亡。\n宫女是个高危职业，安玖决定好好干活，多多存钱，珍爱生命，远离暴君。\n可此时她忽然听到了暴君的心声。\n　　“啊啊啊，烦死了烦死了烦死了，这些奏章写的都是狗屎吗？朕都说了不吃桃子，不吃桃子，不吃桃子，还天天问天天问天天问。”\n　　安玖？\n　　“新来的宫女是傻子吗？杵在那做灯台？没看见朕脖子都酸了，也不知道过来捏捏？”\n　　安玖挪动脚步，试探着捏了捏皇帝的肩膀…\n　　“御膳房的点心噎死人，李公公瞎了，不知道给朕倒杯水…”\n　　安玖挪过去倒了一杯茶…\n　　渐渐的，光华殿的宫女太监们发现，暴君的脾气似乎好了许多…\n　　后宫嫔妃喜极而泣，陛下的疯病好了，是不是可以侍寝了…\n　　\n　　“朕是种马吗？天天让朕翻牌子，这是人腰子，不是猪腰子…提到腰子，朕忽然想吃爆炒腰子了…”\n　　于是绿头牌没了，一盘美味的腰子端了上来。\n　　安玖从小宫女升职成掌事姑姑…\n　　某天，暴君说：“你甚得朕心，做朕的女人吧。”\n安玖发现她忽然听不到暴君的心声了…", "tags": ["古言脑洞", "古代言情", "穿越", "今穿古", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [24.9, 25.24, 25.49], "trend": 0.59, "latest": 25.5, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新的人生，结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "闺蜜穿书，搞错男主", "fullTitle": "闺蜜穿书，搞错男主", "link": "https://fanqienovel.com/page/7604900854776220696", "data": [10.32, 10.76, 10.82], "trend": 0.51, "latest": 10.8, "wordNumber": 414528, "creationStatus": 0, "desc": "【闺蜜穿书攻略男主和反派+两对cp+轻松日常+系统】\n白真儿去世后，系统找上柳月缇，说她闺蜜穿书了。\n还把反派摄政王错认成了男主，兢兢业业攻略大半天，现在才知道认错了人，只能找她救场。\n白真儿：闺蜜闺蜜想不想跟我一起穿书喵喵喵！\n柳月缇：……认错了怎么了！反派和男主，闺蜜一个我一个！\n两人一个是丞相府嫡女，一个是远来投奔的表小姐，要完成系统任务，必须从一众女配中夺下女主之位！\n柳月缇：系统，为什么这些女配有绝世神功、超绝医术、甚至是重生剧本啊！\n白真儿：就是就是！我们难道就没有金手指吗？\n系统：你们有啊。\n系统：你们有两个人。\n柳月缇&白真儿：……看来只能智取了。\n总之后来——\n真·男主凌不斩：你就不能看住你老婆吗？她天天睡我老婆床上什么意思？\n大反派·沈寒之：真儿天真，不谙世事，你就不能让柳月缇把她送回来吗？", "tags": ["古言脑洞", "古代言情", "系统", "反派", "穿书", "攻略反派"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [36.98, 40.07, 43.06], "trend": 6.09, "latest": 43.1, "wordNumber": 515154, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [24.55, 26.37, 27.24], "trend": 2.69, "latest": 27.2, "wordNumber": 1108629, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [28.91, 28.41, 31.3], "trend": 2.39, "latest": 31.3, "wordNumber": 1155066, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁植物人大佬，婆家撑腰成团宠", "fullTitle": "替嫁植物人大佬，婆家撑腰成团宠", "link": "https://fanqienovel.com/page/7577671607246670872", "data": [26.8, 29.02, 29.1], "trend": 2.31, "latest": 29.1, "wordNumber": 1002341, "creationStatus": 0, "desc": "【先婚后爱+虐渣复仇+真假千金+追妻火葬场+微群像】\n乔珂被杀的时候才知道自己精心照顾的养子是丈夫的私生子，一切只为他的白月光。\n重生在乔柳两家知道抱错孩子，乔珂从乡下刚进城的时候。\n乔珂和重生的前夫哥默契地做了同样的选择:\n前夫哥选了他上辈子心心念念的白月光。\n乔珂选择搬空偏心狠辣娘家的小金库，同意去司家冲喜，未来当个有钱有势的小寡妇也不错。\n谁料婚后她福运太旺，寡妇没当上，婆家撑腰步步高\n对于等着前妻低头投靠的前夫哥来说，上辈子本该早死的植物人却突然醒了？\n前夫哥心慌了，不好！前妻真的要嫁人了！\n小剧场：\n乔妹：老公躺在床上一动不动，很乖~很安分~我要好好照顾他。\n军官：她对我这么体贴照顾，肯定很爱很爱我！我一定要快点好起来！\n乔妹大惊：他上辈子不是死了？怎么又活了？不行！我要离婚！\n辛辛苦苦好起来给她一个惊喜，反而差点被她再气成植物人！\n男人红眼放狠话：想离婚？除非我死了！", "tags": ["年代", "现代言情", "重生", "打脸", "追妻火葬场", "真假千金"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魂归香江：从裁缝铺到女首富", "fullTitle": "魂归香江：从裁缝铺到女首富", "link": "https://fanqienovel.com/page/7644061214691052606", "data": [27.02, 28.58, 29.32], "trend": 2.3, "latest": 29.3, "wordNumber": 629753, "creationStatus": 1, "desc": "【八零年代+女强+学霸+商战+香港】\n前世的她过目不忘的脑袋配了颗随时停摆的心脏；\n心脏停跳那刻，她想：下辈子，不做人了。\n再睁眼，她叫林颖，九岁，痴傻九年，今日魂归。\n师婆掐算过三次：\"不会再走了。你本来就是你，只是被放错了地方。\"\n她成了八零年代香江西环一间裁缝铺里痴傻九年的小女孩：林颖。\n老窦是从G省偷渡来的入赘木匠，老母踩着缝纫机和老窦一起养活一家四口。\n九岁，魂归香江。前世满腹经纶无处施展，这世她有了一副能跑能跳的身体。\n\"阿公，我想读书。\"\n\"好！你想读到几时，阿公就供到几时！\"\n官校不能跳级，私立学费要命，一个一天学没上过的九岁女孩，装了十八年知识的脑子，一颗终于不会停摆的心脏，和一家子拼了命也要托举她的人。\n从裁缝铺到港岛写字楼，从西环旧唐楼到半山豪宅：这个被老天放错了地方的女孩，要在这座黄金遍地的城市里，亲手造出一个商业帝国。\n前世欠她一副好身体，今生还她一个盛世香江。\n【大女主文，本书叙事核心重头到尾都是女主，该书看的是女主是否能掌控自己人生与事业，不是统计书中有几个男配角色！作者不会为了迎合极端观点消除所有男性！所有配角都是推动剧情的需要！】", "tags": ["年代", "现代言情", "学霸", "女强", "前世今生", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [22.7, 23.76, 24.77], "trend": 2.07, "latest": 24.8, "wordNumber": 773874, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些 /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

      const grid = document.createElement('div');
      grid.className = 'rec-grid';
      groups[score].forEach(t => {
        const tierClass =
          s>=7 ? 's8' :
          s>=5 ? 's7' :
          s>=3 ? 's6' :
          s>=1 ? 's5' :
          'slo';
        const scoreClass = s>=6?'high':s>=3?'med':'low';
        const agRaw = t.abs_growth != null ? t.abs_growth : 0;
        const gPct = t.growth != null ? t.growth : 0;
        const agHtml = agRaw>=0?`<span class="pill pill-up">+${agRaw}万</span>`:`<span class="pill pill-dn">${agRaw}万</span>`;
        const pctHtml = `<span style="font-size:11px;color:var(--text3);margin-left:4px">${gPct>=0?'+':''}${gPct}%</span>`;
        const gHtml = agHtml + pctHtml;
        const reasonsHtml = t.reasons.map(r=>{
          let cls='tag-blue';
          if(r.includes('增长'))cls='tag-green';
          else if(r.includes('稳定'))cls='tag-yellow';
          else if(r.includes('系数低'))cls='tag-green';
          else if(r.includes('系数中'))cls='tag-yellow';
          else if(r.includes('腰部稳'))cls='tag-green';
          else if(r.includes('腰部中'))cls='tag-yellow';
          else if(r.includes('头部虹吸'))cls='tag-red';
          else if(r.includes('体量偏小'))cls='tag-red';
          return `<span class="${cls}">${r}</span>`;
        }).join('');
        grid.innerHTML += `<div class="rec-card ${tierClass}">
          <div class="rec-cat">${t.cat}</div>
          <div class="rec-score-badge ${scoreClass}">综合评分 ${s}分</div>
          <div class="rec-stats">
            <div class="rec-stat"><div class="val">${t.total19}万</div><div class="lbl">总在读</div></div>
            <div class="rec-stat"><div class="val">${gHtml}</div><div class="lbl">${n}日在读增幅</div></div>
            <div class="rec-stat"><div class="val" style="color:${t.coeff<5?'#22c55e':t.coeff<7?'#3b82f6':t.coeff<10?'#f59e0b':'#ef4444'}">${t.coeff}</div><div class="lbl">竞争系数</div></div>
            <div class="rec-stat"><div class="val" style="color:${t.mm_ratio<1.8?'#22c55e':t.mm_ratio<=3.0?'#f59e0b':'#ef4444'}">${t.mm_ratio}</div><div class="lbl">均腰比</div></div>
          </div>
          <div class="rec-reasons">${reasonsHtml}</div>
        </div>`;
      });
      groupEl.appendChild(grid);
      container.appendChild(groupEl);
    });
  })();

  // ② 上升题材折线图（solo legend）
  (function() {
    const ctx = document.getElementById('overviewChart-' + sfx).getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: D.days, datasets: D.overviewDatasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}万` } }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b' } },
          y: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'万' } }
        }
      }
    });
    const legEl = document.getElementById('overview-legend-' + sfx);
    attachSoloLegend(legEl, chart, D.overviewDatasets);
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 增幅柱状图
  (function() {
    const chart = new Chart(document.getElementById('growthChart-' + sfx).getContext('2d'), {
      type: 'bar',
      data: { labels: D.growthCats, datasets: [{ data: D.growthValues,
        backgroundColor: D.growthColors.map(c=>c+'cc'), borderColor: D.growthColors,
        borderWidth: 1, borderRadius: 3 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.parsed.x>0?'+':''}${c.parsed.x}%` } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }
        }
      }
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>均腰比</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      const mmr=m.mm_ratio!=null?m.mm_ratio:0;
      const mmc=mmr<1.8?'#22c55e':mmr<=3.0?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${mmc};font-weight:600">${mmr}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const rawBooks = D.bookChartData[cat];
      const isRead = sfx.startsWith('Read');
      // 阅读榜只展示连载中的书；图表、表格、热门标签、累计净增全部同源
      const displayBooks = isRead
        ? rawBooks.filter(b => b.creationStatus === 1)
        : rawBooks;
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = displayBooks.length > 0
        ? displayBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${displayBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = displayBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书${isRead ? '，仅连载中' : ''}，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
