竹马深情几许：“棠儿，你再忍忍，等我登基，定封你为后。”\n她信了竹马的话，打算给皇帝下毒。\n然而眼前飘过排排金色弹幕——\n“好蠢的女配，男主早和女主好上了，骗你送死呢！”\n“原著她下毒失败被反派囚禁了，桀桀桀黑化倒计时，搓手等待。”\n“死恋爱脑我服了！皇帝暗恋她十多年，给她后位不要，偏要当小三！”\n戚以棠：“……”\n蠢货竟是我自己？\n*****\n戚以棠觉醒了，自己竟是话本里的恶毒女配。\n因痴恋男主，她被骗下毒害死反派皇帝，导致大哥被诬陷通敌卖国，二哥被造谣私吞盐税，三哥被山贼砍掉半个脑袋，四哥染上花柳病……\n而男主踩着她全家的尸骨成了千古帝王！\n狗男人想让我当垫脚石，呵。\n戚以棠反手把毒药换成春药，灌进皇帝嘴里。\n既然弹幕说她是恶毒女配，何不“恶毒”到底呢？\n*****\n谢瓴知道戚以棠对他并无真心，但年少的执念困其一生，他偏要将她强娶到自己身边。\n后来，谢翎表示——\n瓜甜不甜，果然只有自己尝了才知道。", "tags": ["古言脑洞", "古代言情", "甜宠", "虐渣", "暗恋", "攻略反派"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2, "spanGaps": false}, {"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [6.99, 7.72, 8.39, 9.0, 9.45, 10.64, 11.11], "trend": 4.12, "latest": 11.11, "wordNumber": 258834, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2, "spanGaps": false}, {"label": "悍妻进门：扶起一屋软骨头", "fullTitle": "悍妻进门：扶起一屋软骨头", "link": "https://fanqienovel.com/page/7624469403525975064", "data": [13.32, 11.81, 11.4, 10.78, 10.75, null, 9.71], "trend": -3.61, "latest": 9.71, "wordNumber": 728043, "creationStatus": 1, "desc": "【漫剧、真人有声已出】(妻奴，入赘）\n王金珠穿越成屠户的女儿，倒贴嫁妆嫁了个猎户。\n奈何猎户一家子全是软骨头，对着吸血的二房，偏心的二老，屁都不敢放一个。\n眼看小姑子都要被卖了，她的傻相公和公婆只知道跪地请求，她忍不了了。\n这群软骨头，她非给他们扳直了。", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "虐渣"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2, "spanGaps": false}, {"label": "八岁搬空全家，带弟北上找爹爹", "fullTitle": "八岁搬空全家，带弟北上找爹爹", "link": "https://fanqienovel.com/page/7649 Chart.defaults.font.family = "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
const gridColor = 'rgba(42,48,64,0.8)';

const datasets = (SHELF.datasets || []).slice().sort((a,b) => (b.trend||0) - (a.trend||0));
const days = SHELF.days || [];

document.getElementById('shelf-count').textContent = datasets.length + ' 本书目';
document.getElementById('note-count').textContent = datasets.length;

// 填充表头日期列
const thead = document.querySelector('.book-table thead tr');
const dayThPlaceholder = document.getElementById('day-headers');
const dayFragment = document.createDocumentFragment();
days.forEach(d => {
  const th = document.createElement('th');
  th.textContent = d;
  th.style.width = '52px';
  dayFragment.appendChild(th);
});
dayThPlaceholder.replaceWith(dayFragment);

// 固定列宽（table-layout:fixed 下第一行 th 决定宽度）
(function() {
  const ths = document.querySelectorAll('.book-table thead tr th');
  // 列顺序：展开btn / 序号 / 书名 / ...日期列... / 字数 / 净增 / 状态
  const fixedWidths = { 0:'32px', 1:'28px', [ths.length-3]:'52px', [ths.length-2]:'52px', [ths.length-1]:'36px' };
  ths.forEach((th, i) => {
    if (fixedWidths[i]) th.style.width = fixedWidths[i];
  });
})();

// solo legend
function attachSoloLegend(legEl, chart, dsList) {
  let soloIdx = -1;
  const items = [];
  dsList.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < dsList.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < dsList.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (dsList.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

// 折线图
const ctx = document.getElementById('shelfChart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: { labels: days, datasets: datasets },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
        callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` }
      }
    },
    scales: {
      x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
      y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
    }
  }
});
attachSoloLegend(document.getElementById('shelfLegend'), chart, datasets);

// 书目表格（按净增降序）
const tbody = document.getElementById('shelfTbody');
const sorted = [...datasets].sort((a,b) => (b.trend||0) - (a.trend||0));
sorted.forEach((b, i) => {
  const wn = b.wordNumber || 0;
  const wStr = wn > 0 ? (Math.round(wn/1000)/10).toFixed(1)+'万' : '—';
  const trendStr = b.trend > 0 ? '+'+b.trend+'万' : b.trend < 0 ? b.trend+'万' : '—';
  const trendCls = b.trend > 0 ? 'trend-up' : b.trend < 0 ? 'trend-dn' : '';
  const rid = `dr-${i}`;
  const btnId = `btn-${i}`;
  const latestVal = b.latest || 0;
  const isHighlight = latestVal >= 10;
  const cols = b.data.map((v, di) => {
    const isLast = di === b.data.length - 1;
    const hiCls = isLast && isHighlight ? ' class="inread-high"' : '';
    const hiSfx = isLast && isHighlight ? ' ★' : '';
    return v > 0
      ? `<td${hiCls}>${v}万${hiSfx}</td>`
      : `<td><span style="color:var(--text3)">—</span></td>`;
  }).join('');
  const isSerial = b.creationStatus === 1;
  const statusHtml = isSerial
    ? `<span class="status-dot serial"></span>`
    : `<span class="status-dot finished"></span>`;
  const tr = document.createElement('tr');
  tr.style.cursor = 'pointer';
  if (isHighlight) tr.className = 'row-highlight';
  tr.innerHTML = `
    <td><button class="expand-btn" id="${btnId}">+</button></td>
    <td style="color:var(--text3)">${i+1}</td>
    <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
    ${cols}
    <td style="color:var(--text2)">${wStr}</td>
    <td class="${trendCls}">${trendStr}</td>
    <td style="text-align:center">${statusHtml}</td>`;
  tbody.appendChild(tr);

  const dr = document.createElement('tr');
  dr.className = 'book-detail-row';
  dr.id = rid;
  const colspan = 6 + b.data.length;
  const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
  dr.innerHTML = `<td colspan="${colspan}">
    <div class="book-detail-inner">
      <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
      <div style="margin-top:4px"><span style="color:var(--text3)">简介：</span>${b.desc||'暂无简介'}</div>
      ${tagsHtml ? `<div class="book-detail-tags">${tagsHtml}</div>` : ''}
    </div></td>`;
  tbody.appendChild(dr);

  const toggle = () => {
    const row = document.getElementById(rid);
    const open = row.classList.toggle('open');
    const btn = document.getElementById(btnId);
    if (btn) btn.textContent = open ? '−' : '+';
  };
  tr.addEventListener('click', toggle);
});

// 热门标签
const tagBars = document.getElementById('shelfTagBars');
if (SHELF_TAGS && SHELF_TAGS.length) {
  const maxCount = SHELF_TAGS[0].count;
  SHELF_TAGS.forEach(t => {
    const row = document.createElement('div');
    row.className = 'tag-bar-row';
    row.innerHTML = `
      <div class="tag-bar-name">${t.tag}</div>
      <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:#f59e0b99"></div></div>
      <div class="tag-bar-count">${t.count}本</div>`;
    tagBars.appendChild(row);
  });
} else {
  tagBars.innerHTML = '<div style="color:var(--text3);font-size:12px">暂无标签数据</div>';
}
</script>
</body>
</html>
