s": 0, "desc": "程昭被赐婚给最年轻的国公爷周元慎。\n　　周元慎有一房背景强大的娇妾，又与寡嫂暧昧不清，憎恶高门贵女身上的古板沉闷。\n　　偏程昭是受过最正统教养的贵女。\n　　面对国公府层出不穷的争斗、小妾的挑衅、寡嫂暗中拨火，程昭解决起来游刃有余。\n　　“我嫁过来做主母，就是替国公爷收拾烂摊子的。”程昭温良恭俭。\n　　待我地位稳固，有了子嗣，下一个被收拾的烂摊子，就是国公爷你。\n　　——*——*——\n　　初见时，周元慎觉得程昭虚伪狡诈；相处日久，赞她恢廓大度、见识广博。\n　　他周元慎的夫人，没有任何缺点。唯一不好的，是她心中另有所属，不爱他。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书：侯爷，夫人又给你纳妾了", "fullTitle": "穿书：侯爷，夫人又给你纳妾了", "link": "https://fanqienovel.com/page/7563282810547473433", "data": [31.01, 31.51, 32.32], "trend": 1.32, "latest": 32.3, "wordNumber": 1014007, "creationStatus": 0, "desc": "穿书+宫斗宅斗+重生的儿子+爽文+躺平的一生\n争家产大获全胜的林嫣然，因为太高兴参加极限运动摔死了，有幸穿到了一本她看过的小说里，她成了因为小说男主养外室抑郁而死的正室女配。\n书中女主当然就是成功登堂入室的那个外室。\n本来林嫣然都把袖子撸起来了，准备搬空渣男的私库，把外室纳进府里来折磨。\n结果林嫣然发现她这个‘大儿子’好像有点门道。\n所以画风就变成了，‘轩儿，管管你弟弟。’\n‘轩儿，管管你父亲。’\n“轩儿······”\n总的来说就是林嫣然看戏躺平的一生。\n楚云轩：母亲歇着，事情全部都交给儿子。", "tags": ["宫斗宅斗", "古代言情", "萌宝", "穿越", "穿书", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "和渣夫同归于尽后又双双重生了", "fullTitle": "和渣夫同归于尽后又双双重生了", "link": "https://fanqienovel.com/page/7402062722877115417", "data": [32.35, 32.95, 33.26], "trend": 0.91, "latest": 33.3, "wordNumber": 669864, "creationStatus": 0, "desc": "【实体书《岁岁春欢》已出，全平台可购】\n【女主渣男双重生＋男主穿越＋双向救赎＋扮猪吃虎】\n十七岁这年，沈嘉岁嫁于陆云铮为妻，沈陆两家皆为将门，强强联合。\r\n成婚两年后，陆云铮大败敌国名扬四海，沈家却因通敌叛国满门抄斩。\r\n沈嘉岁临死前才得知，沈家通敌叛国罪证乃陆云铮亲呈，且陆云铮想娶的人从来不是她，而是沈家养女，她视作亲妹妹的顾惜枝。\r\n灭门之仇，欺骗之恨，沈嘉岁临死反扑，拉陆云铮同归于尽。\r\n再一睁眼，重回陆云铮上门提亲那一日。\r\n沈嘉岁匆忙赶到时，陆云铮正深情开口求娶顾惜枝。\r\n原来，陆云铮也重生了......\r\n————\r\n沈家通敌叛国一事迷雾重重，牵涉甚广。\r\n为查清真相，沈嘉岁决然入局，这时，一人着绯红官服站在了她的身旁。\r\n沈嘉岁依稀记得，上一世咽气之时，似有一片绯红衣角闯进视野......\r\n————\r\n江浔：“江某平生所愿，唯山河远阔，国泰民安。如今再添一愿，愿心上之人岁岁无虞，常乐长安。”", "tags": ["宫斗宅斗", "古代言情", "重生", "扮猪吃虎", "HE", "相互救赎"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "勾太傅，人前不熟人后如做了夫妻", "fullTitle": "勾太傅，人前不熟人后如做了夫妻", "link": "https://fanqienovel.com/page/7591861882936380478", "data": [45.4, 45.84, 46.01], "trend": 0.61, "latest": 46.0, "wordNumber": 1000427, "creationStatus": 1, "desc": "状元夫君熟睡，宋怜抱住霁月清风的当朝太傅哭：“求求您，救救我……”\n她能有什么错？她只是不想死。\n家规无情，长公主不容人，夫君要做驸马，留给宋怜唯有一条路——吊死。\n于是她壮着胆子，勾引了当朝太傅。\n陆九渊乘着酒意：“如你所愿。”\n从那以后，宋怜予取予求，陆九渊事事如了她的意。\n他俩一个蓄意勾引，一个见色起意。\n人前殊途陌路，人后颠鸾倒凤。\n有人告密：“宋怜她精于算计，处心积虑破坏太傅大婚。”\n陆九渊淡泊道：“我就喜欢被她霸占着，怎么了？”\n-\n太傅陆九渊出去打了场仗，回来发现自己暗中相看好的姑娘，被皇上指给新科状元了。\n他大发雷霆之后也没跟任何人提及，不过一个女人而已，犯不上。\n直到这女人哭着抱着他的腰求他：“求求您，救我……”\n“一哭二闹的。”陆九渊笑纳了，偶尔当回活菩萨也不错。\n可原本是无聊时纾解的玩物，却被他养成了尖牙利爪的小豹子。\n有人状告宋怜为虎作伥，飞扬跋扈，目中无人。\n陆九渊：“我惯的，你适应一下。”\n后来，宋怜说皇帝该换了，陆九渊就把皇帝换了。\n宋怜说反了吧，陆九渊就反了。", "tags": ["宫斗宅斗", "古代言情", "宠妻", "甜宠", "双洁", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春潮夜渡，表姑娘渣得明明白白", "fullTitle": "春潮夜渡，表姑娘渣得明明白白", "link": "https://fanqienovel.com/page/7603646647297379352", "data": [29.46, 29.55, 29.65], "trend": 0.2, "latest": 29.7, "wordNumber": 441253, "creationStatus": 0, "desc": "禁忌之恋 #极限拉扯#美强惨 #双向救赎\n非一见钟情，非蓄谋已久，是日久生情，亦是日久生情！\n—\n\n江南茶庄的明珠温以贞，家破人亡后，被卖作扬州瘦马。\n逃出生天后，她带着一身不可告人的技艺与入骨的媚香，投奔至侯府姨母，却深陷二房的算计与觊觎。\n绝境之中，她将目光投向府中最高的冰山——四爷傅霁川。\n他捏起她的下巴，眸色深沉：“你究竟想干什么？”\n她坐在他的腿上，吻上他的喉结：“小叔，现在是想我下去，还是想我亲下去？”\n男人食髓知味，于是一纸荒唐的契约悄然成立——\n他成了她的靠山，而她成了他长夜的慰藉。\n她恪守“玩物”本分，笑问他厌弃后，能否予她千两白银放她离开。\n他冷眼应下，心却在她平静的自贱中，寸寸下沉。\n他们撕毁、重签、修订契约，在人前不熟、人后缱绻的极限拉扯里越陷越深。\n扬州旧案重查，杀父血案与皇室秘辛层层揭开\n他们能否夺回属于自己的一切？\n当初雪来临，这场始于算计的风月游戏，又将如何收场？\n他们都把对方当作救赎的太阳，殊不知，太阳在成为太阳之前，要经历多少毁灭般的聚变。\n—\n纯古言，无穿越重生金手指。\n两个陌生人的相知相恋相许全描摩。\n一起来谈场酸酸甜甜、咸咸涩涩的古风恋爱吧！", "tags": ["宫斗宅斗", "古代言情", "冰山", "契约婚姻", "相互救赎", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "失忆太子给妹宝招亲，把自己醋疯", "fullTitle": "失忆太子给妹宝招亲，把自己醋疯", "link": "https://fanqienovel.com/page/7622955760682552382", "data": [18.6, 18.79, 18.67], "trend": 0.08, "latest": 18.7, "wordNumber": 606900, "creationStatus": 0, "desc": "姜禾穿成了‘失忆太子的恶毒前妻’，想到将来惨死的结局，她立刻按停了那只解腰带的手。\n“我骗你的，我爹的遗言不是让咱们成亲，他让咱俩当兄妹。”\n谢昭信了，一直把她当妹妹照顾。\n自己吃苦受累不要紧，关键是要给妹妹最好的。\n给她攒够了嫁妆，找好了夫婿。\n眼看着她跟别的男人眉来眼去，他心里不得劲儿。\n他要把她留在身边。\n经过一系列的心理斗争后，他悟了。妹妹留不住，妻子能。\n于是他找到姜禾说：“我必须要向你坦白一件事，爹留给我的遗言，是让咱们做夫妻。”\n……\n恢复记忆的谢昭像条疯狗，不但假传父亲遗言，还对她死缠烂打，强取豪夺。\n朱门对朱门，竹门对竹门。她一个商户女，并不想去高攀什么天潢贵胄。\n她只想把家业发扬光大，当个富婆就好了。\n没想到一个不小心成了天下第一富婆，直到谢昭找来，要把自己卖给她换粮草。\n“将士们，咱们的粮草，是皇上给人当赘婿换来的，你们还有什么理由不拼命？”", "tags": ["宫斗宅斗", "古代言情", "穿越", "穿书", "HE", "1v1"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "团子助攻王爷请接招", "fullTitle": "团子助攻王爷请接招", "link": "https://fanqienovel.com/page/7613704029318695961", "data": [16.55, 16.55, 16.6], "trend": 0.05, "latest": 16.6, "wordNumber": 1237523, "creationStatus": 0, "desc": "特种兵军医沈长宁，在一次任务中牺牲，醒来却发现自己穿进了没读完的宅斗小说里——成了那个被姨母毒害、胖到200斤的蠢笨嫡女。洞房花烛夜，原主被又瘸又瞎的战神八王爷活活折腾死，她穿过来时，只剩一身酸痛和一肚子脏话。\n\n“卧槽！”这是沈长宁穿越后的第一句话。\n\n更操蛋的是，原主体内竟有五年慢性毒，亲弟弟被养成纨绔，母亲的死也疑点重重。而那个表面柔弱的姨母，如今正躺在父亲怀里，享受着本该属于原主母亲的一切。\n\n幸好，前世的手链化作随身空间，实验室、药品、美食一应俱全。她一边解毒减肥，一边暗中查证。谁知那晚一次意外，她竟怀上了那个又瘸又瞎的臭男人的种。\n\n三年后院幽禁，她带着天才儿子种菜养鸡，活得有滋有味。小团子三个月会说话，六个月背诗，七个月走路，三岁就能指挥鸡鸭鹅排兵布阵，智商堪比超级电脑。\n\n直到八王爷大婚之日，一个缩小版的自己突然出现在眼前——\n\n“你就是我爹？”小团子歪着头，“长得还行，就是脑子不太好使，难怪把娘亲关了三年。”\n\n慕容战：“？？？”\n\n当他闯入后院，看到那个曾经200斤的丑女如今身姿婀娜、容颜绝世，正叉腰骂鸡时，整个人都不好了。\n\n“你谁？”\n\n“你祖宗！”", "tags": ["宫斗宅斗", "古代言情", "穿越", "空间", "嫡女", "医术"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "状元悔断肠，玄学大佬不好惹", "fullTitle": "状元悔断肠，玄学大佬不好惹", "link": "https://fanqienovel.com/page/7631195129595841561", "data": [16.55, 16.71, 16.59], "trend": 0.05, "latest": 16.6, "wordNumber": 421685, "creationStatus": 1, "desc": "［玄学+宅斗+抓鬼+爽文+无cp+算命+故事单元］\n修炼三百年的玄学大佬桑夏，在飞升之际陨落了，重生到了一百年以后。\n成为了被新科状元抛弃的糟糠之妻。\n这还不够惨，她还是被自己的亲祖母抛弃的太傅府真千金。\n桑夏都怀疑，天道是嫉妒她的天赋，才让她重生到这个可怜虫身上。\n人人都想看她笑话，偏生她是最争气的那个。\n风水测算，捉鬼画符……\n短短时间内，她便成为了京中人人敬畏的玄学大佬。\n百姓敬畏的监正大人喊她祖师奶奶。\n京中人人惧怕的纨绔世子，求着拜她为师。\n连权侵朝野的辅国公毕恭毕敬的喊她主子。\n这时，那位状元爷前夫，以及抛弃她的祖母，才后悔莫及。", "tags": ["宫斗宅斗", "古代言情", "重生", "无CP", "大佬", "风水秘术"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "末世文恶毒女配？嚣张一日是一日", "fullTitle": "末世文恶毒女配？嚣张一日是一日", "link": "https://fanqienovel.com/page/7478769464138288153", "data": [23.98, 25.59, 26.98], "trend": 3.0, "latest": 27.0, "wordNumber": 1532131, "creationStatus": 0, "desc": "（已出版）[女主回归+空间+位面交易+丧尸晶石+变异动植物]\n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世降临：小尸尸我呀囤囤囤囤！", "fullTitle": "末世降临：小尸尸我呀囤囤囤囤！", "link": "https://fanqienovel.com/page/7346909068407098430", "data": [30.12, 31.06, 32.99], "trend": 2.87, "latest": 33.0, "wordNumber": 1118886, "creationStatus": 0, "desc": "【末世x囤粮x双洁x甜宠x小丧尸女主x超A输出狂魔男主】\n暴雨，台风，海啸，雷暴，地磁消失，丧尸，怪物，异能，等等等等……\n恭喜各位打开末世主线，全世界大洗牌，接下来的求生路，靠命，靠运气，靠自己。\n-\n而在别人还在疯狂尖叫的时候，作为生存狂魔的许多多已经吭哧吭哧地囤满了粮仓！\n什么肉蛋奶，什么各种罐头干粮，什么武器各类工具。\n千面魔方空间在手，所有物资通通打包全部带走！\n只是——为什么万事俱备的她开场就直接变成了阿巴阿巴的小丧尸啊喂！", "tags": ["科幻末世", "空间", "末世", "囤物资"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局天灾，我靠囤百亿物资躺赢", "fullTitle": "开局天灾，我靠囤百亿物资躺赢", "link": "https://fanqienovel.com/page/7123103859110579213", "data": [11.97, 13.07, 13.98], "trend": 2.01, "latest": 14.0, "wordNumber": 1325784, "creationStatus": 0, "desc": "【末世+重生+空间+囤货+宠物+日常向】\n（实体出版中，短剧、动态漫已上线）\n末世天灾，适者生存。\n台风，洪水，极寒极热，地震，海啸，虫灾，酸雨……\n在末世挣扎求生三年，最终却落得惨死的姜宁，重生到末世前三天抢占先机夺回空间，开启疯狂囤货模式。\n买买买，囤囤囤，找回前世救她性命的狗子。\n磨好刀，囤好粮，挨个收拾渣男贱女们，有仇报仇有恩报恩。\n当天灾来临，她右手握刀左手撸狗，在文明丧失道德沦陷的末世中乘风破浪！", "tags": ["科幻末世", "重生", "空间", "末世", "虐渣", "囤物资", "打脸", "前世今生", "天灾"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "弱智就弱智吧，我照样星际最强！", "fullTitle": "弱智就弱智吧，我照样星际最强！", "link": "https://fanqienovel.com/page/7622869871344241689", "data": [12.88, 13.74, 14.52], "trend": 1.64, "latest": 14.5, "wordNumber": 771695, "creationStatus": 1, "desc": "【无cp】孔淼一朝穿越，成为了星际幼崽。\n被好心人送去上学时，孔淼看着周围随处可见的机甲两眼冒光，她飞快地接受了新身份，并摩拳擦掌决定大干一场立志成为一名出色的机甲手……然后差点没通过入学检测。\n校方：“精神力为0，疑似弱智。”\n孔淼：“……啊？”\n……\n军校大比拉开序幕，由于参赛人数不足，校方心一横，将复健了几年的弱智孔淼也塞了进去凑数。\n校方：“别有压力，重在参与，输赢也不是很重要。”\n孔淼：“哦哦。”\n比赛开始，孔淼开着初始机甲原地表演自杀。\n校方：“……”\n比赛中期，种子选手一个接一个地被淘汰，场上只剩孔淼还在挑战自我。\n校方：“……”\n比赛收尾，终于适应了机甲的孔淼磕磕绊绊地开着机甲出去收割了场上剩余人头。\n校方：“……？！”\n啊？赢了？？？\n**\n联盟举办的大型赛事中，一位横空出世的手操机甲手以出色的作战意识、漂亮流畅的操作技术以及出其不意的作战风格惊艳整个联盟。\n记者：“手操机甲手的魅力在您身上体现得很彻底，赛中看您多次挑战精神力极限迎敌，平时训练精神力一定很辛苦吧？”\n孔淼挠头：“没有吧……我是弱智来着。”\n记者：“……”\n被打败的众军校生：“……”\n翌日，星网大头条：《星际最强教您重新定义“弱智”》。", "tags": ["科幻末世", "穿越", "星际", "无CP"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "变成丧尸我学习母猪的产后护理", "fullTitle": "变成丧尸我学习母猪的产后护理", "link": "https://fanqienovel.com/page/7174693973267582012", "data": [15.58, 16.49, 16.91], "trend": 1.32, "latest": 16.9, "wordNumber": 310437, "creationStatus": 0, "desc": "小镇上有只奇怪的小丧尸，不吃人不吸血，只爱推着小车车屯零食。\n有一天，小丧尸辛辛苦苦囤的东西被偷了，小丧尸愤而搬家。\n新家就在养猪场，于是小丧尸过上了养猪，吃肉的幸福生活（并没有）\n小丧尸脑子空空，忘记了偷她东西的人，直到小偷再次回来。\n厉璟枫拿了小丧尸满屋子的东西，从此被缠上，小丧尸力气大，不讲理，只有香喷喷的猪肉才能哄好。\n小丧尸：让咬一口也能好。\n后来，厉璟枫用一碗肉将小丧尸骗走了。", "tags": ["科幻末世", "重生", "空间", "末世", "囤物资", "前世今生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世恶毒女配？我靠发疯成为顶流", "fullTitle": "末世恶毒女配？我靠发疯成为顶流", "link": "https://fanqienovel.com/page/7510209946865110040", "data": [11.55, 12.15, 12.43], "trend": 0.88, "latest": 12.4, "wordNumber": 160 徐津年偏头吻在她嘴角，轻笑低语：“不拒绝吗，我的女朋友。”\n众人一脸震惊。\n…\n徐津年：“宝宝，喜欢我好不好。我的人，我的钱，我的一切都是你的。”\n这段关系开始，他就没想过要结束。\n【是徐津年让江枳初知道，有的爱是“润物细无声”，爱在灵魂生根。】\n【早在多年以前，原来我们曾见过】\n【这是一个“念念不忘，终有回响”的故事。】", "tags": ["青春甜宠", "现代言情", "校园", "学霸", "甜宠", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [44.57, 45.14, 47.04], "trend": 2.47, "latest": 47.0, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "他的盛夏热恋", "fullTitle": "他的盛夏热恋", "link": "https://fanqienovel.com/page/7603710153967275033", "data": [15.21, 16.33, 16.36], "trend": 1.15, "latest": 16.4, "wordNumber": 434718, "creationStatus": 0, "desc": "已签出版\n乖巧病弱VS懒淡拽哥\n微群像+双洁甜宠+日常慢热\n谈斯礼，为人冷痞又狂妄，顶着一张顶级皮囊，浑身散发着恣意随性，是学校里当之无愧的风云人物\n姜枳转学来到沪城一中，被爆料是个天才少女，刚入学就出了名\n第一次见到谈斯礼，听到他那声音觉得有几分耳熟，她没忍住多看了两眼\n*\n见面第一天，少年脸上笑意懒散，不达眼底，他掀了掀眼皮，歪首戏谑：“妹妹？还满意吗？”\n姜枳愣了下，下意识回道：“满意。”\n谈斯礼只觉得这人有点呆\n后来，他将人圈抱在怀内，亲的她喘不过气\n在她呼吸的间隙，少年在她耳边低笑，腔调懒洋洋的，嗓音暧昧又蛊人\n“宝宝，这么喜欢我的声音，我喘给你听好不好？”\n*\n提起谈斯礼，所有人对他的评价都是很拽一男的，不知怜香惜玉为何物\n直到联谊晚会那天，他们看着一向散漫高傲的少年弯下腰，用着他们从未听过的温柔语调，轻哄着怀里的女孩\n“不哭了好不好？”\n“要不…我给你当男妈妈？”\n*\n再后来，姜枳不告而别\n谈斯礼提前保送，再也没来过学校\n再见到他时，是在几年后的同学聚会\n他还是那个天之骄子\n当包厢门再次被推开，众人愣住了\n下一秒，只见男人上前将人揽在怀里埋在她的颈侧，委屈撒娇\n“老婆，怎么来的这么晚。”\n众人：？\n怎么跟他们想的不太一样？", "tags": ["青春甜宠", "现代言情", "天才", "甜宠", "双洁", "群像"], "borderColor": "#f39c12", "backgroundColor": "#f39 ius": 5, "borderWidth": 2}, {"label": "七月半，鬼娶亲", "fullTitle": "七月半，鬼娶亲", "link": "https://fanqienovel.com/page/7418454040775773246", "data": [4.69, 4.7, 4.73], "trend": 0.04, "latest": 4.7, "wordNumber": 1055677, "creationStatus": 0, "desc": "〖大女主文+玄学+宠妻+群像+复仇〗\n目前同名短剧«七月半，鬼娶亲»已上线。\n阿妈说，我出生那年，村子里天降异象，雷霆大雨，万鬼嚎哭，爷爷将七婆请来，亲自接生，这才将我生下来。\n七婆批命:“天生阴命，已被“他”相中，十八年后，七月半，花轿至。”\n从我记事起，我每晚都会做一个梦，梦见我身旁躺着一个男人，他说:“阿音，我是你夫君。”\n从小阿妈便让我与一个灵牌一屋子睡觉，逢年过节还得上香叩拜，更不能让我与任何异性有接触。\n阿妈却只是说我还太小，要以学业为重。\n村里人用惧怕，恭敬，疏远的眼神看着我，甚至，不许家中小孩与我一同玩耍。\n七月半，鬼节那天，刚满十八岁的我，迫于无奈穿上大红嫁衣，被鬼抬轿离开家，与‘鬼’拜堂成亲。\n自从那之后，我虽然回归学校，但，各种灵异事件都接踵而来……\n本故事纯属虚构，所有意外，纯属巧合。", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "长夜寄", "fullTitle": "长夜寄", "link": "https://fanqienovel.com/page/7535484800606424126", "data": [4.76, 4.79, 4.78], "trend": 0.02, "latest": 4.8, "wordNumber": 1812614, "creationStatus": 1, "desc": "【群像+无男主】\n她是从乱葬岗爬出来的孤僵，没记忆没感情，只随性而行，四处游荡。\n万般景象入耳即记，万事光景过目永存。\n她有了名字，她知道了自己是僵尸。\n她见了很多很多生灵，不止人。\n她走走停停，身边聚聚散散……\n", "tags": ["女频悬疑", "悬疑", "幻想言情", "灵异", "悬疑恋爱"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心理分析者", "fullTitle": "心理分析者", "link": "https://fanqienovel.com/page/7412616178163534873", "data": [4.15, 4.15, 4.16], "trend": 0.01, "latest": 4.2, "wordNumber": 1016312, "creationStatus": 0, "desc": "病娇犯罪心理专家 VS 面瘫刑警队长\n原书名：《心理分析者》\n控制大脑的菌丝、人形蚁窝、邪恶吃播……离奇的案件折射出凶手扭曲的精神世界。\n基因给犯罪上膛，心理瞄准目标，环境扣动扳机。\n凝视深渊的人，也要警惕深渊。\n江宁希:我想跳进深渊体验一下。\n深渊:你不要过来啊！\n林司言拽住她：欢迎你先跳进我的世界。\n——\n江宁希见到帅气但面瘫的林司言时，格外兴奋。\n这竟然是个没有表情的男人。\n江宁希盯着林队长的瞳孔:你眼睛里的情绪很丰富。但你现在好像有点不耐烦。为什么呢?\n林司言:……你靠得太近了。\n表白时\n江宁希:没有遇到物理刺激，但你的瞳孔突然放大了，你在害怕我吗?\n林司言:没有。\n江宁希:那么就是另一种可能了。你对我产生了欲望。\n江宁希惊讶地发现，原来面瘫也会脸红啊。\n——\n推荐我的旧文《我一个自闭症会亿点剖尸怎么了》", "tags": ["女频悬疑", "悬疑恋爱", "悬疑", "推理", "病娇", "破案"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}] /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }
        }
      }
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const allBooks = D.bookChartData[cat];
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = allBooks.length > 0
        ? allBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${sfx.startsWith('Read') ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${allBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = allBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const isRead = sfx.startsWith('Read');
        const displayBooks = isRead
          ? allBooks.filter(b => b.creationStatus === 1)
          : allBooks;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: allBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, allBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
