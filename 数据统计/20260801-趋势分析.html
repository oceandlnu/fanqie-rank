nk": "https://fanqienovel.com/page/7651566622582246425", "data": [4.42, 4.62, 4.79], "trend": 0.37, "latest": 4.8, "wordNumber": 256831, "creationStatus": 1, "desc": "【清冷医生vs乖张网红】　\n【年上DADDY·年龄差八岁·青梅竹马·先婚后爱】\n宋鹤眠娶了亲手带大的小姑娘。\n两家世交，娃娃亲，他大她八岁。她从穿纸尿裤起就是他看着长大的，幼儿园接送、小学开家长会、初中辅导作业……她人生的每一个阶段，都有他的影子。\n江稚：我现在是个成熟的大人了！\n宋鹤眠：成熟的大人会在凌晨两点因为空腹吃布洛芬被送进急诊？\n江稚：……那是意外。\n宋鹤眠：成熟的大人会连续一周每天只睡四个小时？\n江稚：……我那是工作忙。\n宋鹤眠：成熟的大人会把自己的工资卡花得一干二净，连余额都说不出来？\n江稚：……\n宋鹤眠：成熟的大人会……\n江稚：停停停，你是老大，你说了算！\n——　\n一句话简介：“我的太太，是我一手养大的。以前管我叫哥哥，现在管我叫老公。”", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "医生", "年龄差"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内：我的太太是我的步步为营", "fullTitle": "体制内：我的太太是我的步步为营", "link": "https://fanqienovel.com/page/7649367076783524889", "data": [6.04, 6.15, 6.36], "trend": 0.32, "latest": 6.4, "wordNumber": 162691, "creationStatus": 1, "desc": "我的太太年纪小但乖巧，是我的底线，更是我的步步为营。\n双向心动。\n年龄差的互宠。\n体制内，直播，声优配音，哪个是最真实的你。\n说白了，就是一场长在彼此择偶心动点上的爱情。\n\n补充：文中所有职务，事件均为平行时空，请宝宝们勿代入现实。\n爱你们呦~\n\n", "tags": ["职场婚恋", "现代言情", "总裁", "豪门世家", "互宠", "年龄差"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，我不再做小城乖女儿", "fullTitle": "重生后，我不再做小城乖女儿", "link": "https://fanqienovel.com/page/7658113549268421656", "data": [3.15, 3.41, 3.43], "trend": 0.27, "latest": 3.4, "wordNumber": 194254, "creationStatus": 1, "desc": "【重生觉醒+一步一个脚印+无金手指+女性独立+女强+成长】 \n蔡庭芳死在四十一岁那年。\n她这一生，听父母的话，放弃大城市高薪工作，回县城当“稳定”的乖女儿；听亲戚的话，嫁给“条件不错”的男人；听丈夫的话，顾家、带娃、伺候老人；听单位的话，加班、背锅、替人收拾烂摊子。\n最后，她病倒在医院，丈夫计较治疗费，婆婆嫌她拖累家里，父母还劝她忍一忍。 \n直到死的那一刻，蔡庭芳才发现，一辈子的逆来顺受，只给她带来了一生悲剧。\n难道我生来就该死？连活下去都要看别人脸色？这一切到底凭什么！\n再睁眼，她回到二十四岁那场相亲饭局。周家端着架子说：“女人结婚后，还是要以家庭为主。”\n所有人都等着她点头。\n蔡庭芳只做了三件事。退婚。拿回工资卡。拖着行李箱搬出家门。\n她没有系统，没有空间，没有天降贵人，也不靠彩票暴富。\n她只有一张余额六千八的银行卡，一间月租六百五的小屋，一个清大毕业的脑子，和重活一次后再也不肯低头的狠劲。\n没有什么能困住女人，也没有什么能困住蔡庭芳。", "tags": ["职场婚恋", "现代言情", "重生", "打脸", "职场", "家庭", "虐渣"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "请你依赖我", "fullTitle": "请你依赖我", "link": "https://fanqienovel.com/page/7647931717331717145", "data": [5.51, 5.71, 5.77], "trend": 0.25, "latest": 5.8, "wordNumber": 230102, "creationStatus": 1, "desc": "空军中尉沈砚辞 × 协和心外科医生时愿\n\n第一次见面，她在医院楼梯间撞见别人踮脚吻他。第二次，他浑身是血扛着战友冲进急诊，说她手抖不适合做医生。第三次，他穿过一整个房间的人走到她面前，叫出她的名字。\n\n他冷硬、寡言、从不解释。\n她把所有情绪咽下去，一个人扛着那只正在失去知觉的右手，扛着不告而别的旧人，扛着他看不到她的时候，她还在等。\n\n她以为把自己藏得够远，他就找不到她了。\n但她不知道，洪水中他涉过齐腰的泥水找到她的时候，才发现她藏着一个他永远无法偿还的秘密——她怀过一个他的孩子，他刚知道，就已经失去了。", "tags": ["职场婚恋", "现代言情", "暗恋", "职场", "医生", "情有独钟", "1v1"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "十年执念，等一场迟到重逢", "fullTitle": "十年执念，等一场迟到重逢", "link": "https://fanqienovel.com/page/7636255485590522905", "data": [3.14, 3.3, 3.35], "trend": 0.21, "latest": 3.4, "wordNumber": 165538, "creationStatus": 0, "desc": "【暗恋】【双洁】【十年等待】【重逢】【甜宠】\n从小门对门的邻居，翟欣欣是跟在陈廷周身后长大的小尾巴。\n年少盛夏，他们许下约定：北城大学，不见不散。\n可高考意外失利，她骤然远赴异国，断了所有音讯，从此消失在他的世界里。\n一晃十年光阴，陈廷周留校北城，把那份深藏心底的爱意，悄悄封存了许多年。\n年岁渐长，家人催婚，他妥协开始相亲，试着放下过往，接受新的缘分。\n昔日邻家少女骤然归国。\n再次对上她眉眼的那一刻陈廷周才恍然明白：岁月隔了十年，人事几经变迁，可他心底那份藏了半生的喜欢，从来没有半点消减。\n旧情难忘，年少意难平，这一场迟到十年的重逢，终究还是乱了他整颗心。", "tags": ["职场婚恋", "现代言情", "暗恋", "青梅竹马", "双洁"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纹心尖", "fullTitle": "纹心尖", "link": "https://fanqienovel.com/page/7123541828854352934", "data": [3.55, 3.58, 3.62], "trend": 0.07, "latest": 3.6, "wordNumber": 266796, "creationStatus": 0, "desc": "【已签实体出版(✧∇✧) 进度见🧣】\n【纹身师×老师】【SC/HE】\n    沐妍心和祈骁第一次见面是在纹身店。\n　 第二次是在雨天，他给她递了一把伞。\n　 第三次，成了邻居。\n　  ……\n　 暗生情愫。\n　 而在祈骁开始计划展开追求的时候，沐妍心忽然对他说：“我们要不要结婚？”\n　 祈骁：“？”\n　 这是什么天降福利？？？\n　　\n     #痞帅纹身师VS温柔老师#\n　 #打破世俗偏见#\n　　——我们是世俗眼中的相反面，却成为了彼此最好的依靠。\n   （文中女主没有藏着掖着自己结婚的事。第一是因为突然的闪婚，男女主都需要适应的时间；第二是因为女主性格乖顺，身边的人也不相信她会闪婚。后面都会说清楚的，勿武断。）", "tags": ["职场婚恋", "现代言情"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一眼情深不负悦，余生朝夕皆伴君", "fullTitle": "一眼情深不负悦，余生朝夕皆伴君", "link": "https://fanqienovel.com/page/7640815035899448344", "data": [3.14, 3.17, 3.16], "trend": 0.02, "latest": 3.2, "wordNumber": 296009, "creationStatus": 1, "desc": "【都市职场 甜宠 暗恋成真 体制内 1v1 双洁 HE 双向奔赴 年龄差 高冷×独立】\n她是业务过硬的年轻科长，做事较真，从不服软。 \n他是寡言克制、让人又敬又怕的年轻领导。\n男人得知她要去相亲，他连夜从外地赶回来，她家楼下等了一夜，不敢敲门。\n理智战胜不了情感，地下车库强吻：“我有没有名分？” \n他护她于风雨，她暖他于日常。 \n始于猫，终于爱，体制内，双强双向，克制深情，\n从暗恋三年到步步为营靠近，\n这是一场迟到了三年的双向奔赴。", "tags": ["职场婚恋", "现代言情", "暗恋", "甜宠", "双洁"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怀孕三月，死去的丈夫失忆回来了", "fullTitle": "怀孕三月，死去的丈夫失忆回来了", "link": "https://fanqienovel.com/page/7638723178730114073", "data": [5.43, 5.5, 5.43], "trend": 0.0, "latest": 5.4, "wordNumber": 242447, "creationStatus": 1, "desc": "天灾水患那日，廖晴在无人得知的地方杀了自己新婚半年的丈夫周鸣山，亲眼看着他身影沉进水底彻底消失。\n她向来不是什么好女人，仗着好家境嚣张跋扈，坏事做尽，无论什么总有自己的一套道理和理由，甚至被至亲赶去这偏僻地方改过也是因为从前犯了恶毒的过错。\n周鸣山是廖晴小时候捡回家的，他向来只会端着一副正直良善的模样对她说教，处处帮着外人，格外令人生厌。\n但最后，他成了她的丈夫。\n在她最落魄，满怀怨恨时际，他甚至敢威胁她。\n廖晴忍无可忍了。\n周鸣山的死，除了她，所有人都只以为是天灾意外。\n她成了年纪轻轻的寡妇，可怜又悲哀。\n也因为周鸣山的死，廖晴如愿被家人宽容饶恕，过了一阵安生日子，这段时间，她极其安分守己，也惴惴不安。\n只因为周鸣山的身影总阴魂不散，日日入她梦中，恶鬼一般面目狰狞双眼赤红地紧盯着她不放，不知是在恨她，还是想杀了她，想将她拆之入骨。\n清明那夜，火光之下，日夜梦魇中的他步步靠近，还是来找她算账了。\n\nps：失忆梗，真坏女主，又坏又怕死，有点良知但不多，会把善良老实人男主逼疯，逼黑化，然后在挣扎扭曲中妥协（接受不了女主真做过坏事的就不看了哈，女主不太懂爱，男主疯爱）", "tags": ["职场婚恋", "现代言情", "日久生情", "打脸", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [7.83, 8.82, 9.03], "trend": 1.19, "latest": 9.0, "wordNumber": 229690, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "成为美强惨龙崽的早逝娘亲", "fullTitle": "成为美强惨龙崽的早逝娘亲", "link": "https://fanqienovel.com/page/7645232910252919870", "data": [4.8, 5.49, 5.94], "trend": 1.15, "latest": 5.9, "wordNumber": 133384, "creationStatus": 1, "desc": "【温柔老实妹宝×冷漠偏执龙龙】\n【双洁+1V1+人外+男强女弱+体型差+一见钟情+温馨治愈】\n（简介是儿子殷珩视角）\n殷珩重活一世，回到一千年前，只有一个任务：阻止爹娘相爱。\n他娘是世界上最好的人，他爹是条脑子有病的龙。\n在上一世，娘亲嫁给他爹没几年就去世了，他不想让娘亲重蹈覆辙，即便自己也会消失。\n好消息是：他重生得够早，两人根本不认识。\n坏消息是：不管他怎么阻止，那龙还是来了，而且对娘亲一见钟情。\n不仅如此，追人的方式还笨得要命：\n今天送灵石，明天往她枕头底下塞银票，后天面无表情地站在她家门口，开口就是：“我没家了，能收留我吗？”。\n云绵一脸茫然：“这位公子，我并不知道您是怎么了。”\n殷珩坐在屋顶上看着这一切，心情愉悦，甚至还想鼓掌。\n追姑娘追成这样，也是种本事。\n殷珩觉得这开局稳了，就他爹这个追法，不把娘吓跑才怪。\n可云绵偏偏觉得殷寂“挺有意思的”。\n某天，她拉着殷珩问：“阿珩，你了解隔壁那位殷公子吗？他这个人虽然奇怪，但好像…还挺不错的。”\n殷珩两眼一黑，苦口婆心地劝：“…不怎么样，他长得丑，心也黑，不是良配！”\n云绵羞赧：“你胡说，他长得不丑。”\n殷珩站在原地，仰头望天。\n他明明是回来拆散他们的。\n怎么变成助攻了？", "tags": ["玄幻言情", "独宠", "幻想言情", "宠妻", "团宠", "双洁", "HE"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙崽心声曝光后，六界都不好了！", "fullTitle": "龙崽心声曝光后，六界都不好了！", "link": "https://fanqienovel.com/page/7626321035767335961", "data": [7.22, 8.0, 8.35], "trend": 1.13, "latest": 8.3, "wordNumber": 215872, "creationStatus": 1, "desc": "【双洁1V1+全员读心+三界团宠+养崽撒糖+轻松救赎无虐】\n高考前夕，叶黎惨遭人间至恶！\n辛苦打工攒下的学费被表妹偷走，舅舅舅妈颠倒黑白，将他打伤后像丢垃圾一般赶出家门。\n无依无靠，遍体鳞伤的他，本以为人生就此落幕，却意外绑定天道救赎系统，重生成了一颗圆滚滚的至尊龙蛋！\n更炸裂的是，他的‘生母’，是六界闻风丧胆的妖族至尊夜无咎！\n别人出生被父母捧在手心，他刚出生，就被妖神亲爹拎在手里，扬言烤蛋，煮汤，直接丢掉！\n为了活命，叶黎只能装乖卖萌，破壳后化身软糯小奶团，日日花式吹捧讨好傲娇亲爹。\n系统给他开辟了吃瓜功能，本想安稳躺平吃瓜做顶级妖二代！皇二代！\n可系统惊天大瓜直接震懵他，他还有一个爹！\n另一个爹是清冷出尘的仙界仙尊楚云鉴！\n而楚云鉴，是夜无咎不共戴天的死对头！\n一边是暴躁别扭，嘴硬心软的妖神父神，\n一边是清冷温柔，禁欲圣洁的仙尊父尊。\n缺爱半生，执念有家的叶黎，化身三界最强月老，疯狂花式撮合双亲，在线维和！\n不曾想，天道选中他，本就是宿命安排。\n他对“家”的纯粹执念，竟是化解仙妖魔万年恩怨的唯一解药！\n从此，曾经任人欺凌的小可怜，逆袭成仙妖魔团宠！\n双大佬争锋护崽，全员读心吃瓜围观宠崽！\n崽有CP！后期主要剧情线！\n", "tags": ["玄幻言情", "重生", "团宠", "双洁", "1v1", "养崽"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法：被迫组队后高冷队长沦陷了", "fullTitle": "魔法：被迫组队后高冷队长沦陷了", "link": "https://fanqienovel.com/page/7649235070481353753", "data": [6.89, 7.67, 7.95], "trend": 1.05, "latest": 7.9, "wordNumber": 231908, "creationStatus": 1, "desc": "【高智商傲娇巫族公主VS高冷禁欲灵族公爵】\n魔法+言情+团队救世\n朗瓦西星球有三类人：会魔法的灵者、作战强的曜士、通巫术的巫主\n三千年前，灵、曜两族诞下五灵守护者，对灭世的不死女巫艾拉进行世代封印\n三千年后，新一届守护者诞生，五位圣灵者肩负救世使命。\n巫族公主蒂泠，出了名的任性，翘课、炸学校、学禁术\n然而，一则消息震惊世界\n蒂泠成了三千年来第一位来自巫族的圣灵者——智之灵\n让“恶霸”拯救世界？\n众人：谁说看不见星球的未来？这不是一眼就看到头了\n灵息学院，\n所有人都想进的三族最强学府，一心摆烂的蒂泠被强制保送\n灵息优等生缪辞，是灵族最年轻的公爵，也是众望所归的五灵守护者队长玄之灵\n蒂泠来前：高冷，沉稳，尽在掌握\n蒂泠来后：头疼，善后，怀疑人生\n算了，赶紧封印艾拉，大家好聚好散\n…\n一次意外，蒂泠灵印消失，决定独自离开。\n黑暗的房间内，她被吻的喘不过气，用力推开他，“队长，我不是圣灵者了，好聚好散吧。”\n男人眼尾浸红，额头贴着她的耳朵，薄唇轻吻她的脸颊，“你觉得呢？我的公主殿下。”\n撩也撩了，摸也摸了，要负责了，人就跑了\n女孩理亏的偏过头，缪辞都气笑了，指尖扣住她的下颌，迫使她面对自己，学着她曾经恶劣的语气\n“不接话？那就接吻。”", "tags": ["玄幻言情", "校园", "幻想言情", "星际", "冰山", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "孩子们救一下，遇到冲徒逆师了", "fullTitle": "孩子们救一下，遇到冲徒逆师了", "link": "https://fanqienovel.com/page/7656761759016963096", "data": [2.61, 3.24, 3.64], "trend": 1.03, "latest": 3.6, "wordNumber": 126990, "creationStatus": 1, "desc": "【玄幻言情】【单女主】【双洁】\n救命！救命！\n司砚清连滚带爬冲进凌霄峰主殿，一把抱住那抹白衣的腿\n刚被测出时空双灵根，升灵台上万众瞩目，本该是他富贵的起点，结果不知怎么就得罪了那气运之子\n他不过是在对方吃饭时扔了点“小玩意儿”\n那人竟带着一整个上古世家追杀他！\n南宫寒玥低头看着自己这个便宜徒弟，额角一跳\n时空双灵根，万年不遇，跟她一模一样\n天赋是顶天的，惹事的本事也是顶天的\n“起来”她冷声道\n“师父不答应我就不起！”\n往后百年，她替他平了三十六桩祸事，救了他不下百次\n司砚清倒是心安理得，甚至愈发嚣张——反正有师父兜底\n直到那夜，他被师父唤进寝殿\n“有好吃的？”\n他眼睛一亮，毫无防备地跨进门\n下一刻，眼前一黑，神识被封，灵力被锁\n“师父？这不对劲吧？”\n南宫寒玥修长的手指挑起他的下巴，唇角微扬\n“乖，这可太对了”\n后半夜，司砚清的声音从殿内传出，带着哭腔不停的蹬着腿：“下去！你下去！不带这样的——”\n后来全宗都知道了，凌霄剑宗那位绝代天骄的师徒关系，好像跟他想象的……不太一样", "tags": ["玄幻言情", "穿越", "今穿古"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "万人迷在耽美世界生存法则", "fullTitle": "万人迷在耽美世界生存法则", "link": "https://fanqienovel.com/page/7632222540525489176", "data": [3.13, 3.83, 4.0], "trend": 0.87, "latest": 4.0, "wordNumber": 140330, "creationStatus": 1, "desc": "新书。谢春慈一觉醒来穿越到了一个奇怪的修仙界。\n这里不但阴阳失调，男男相恋大行其道，似乎暗地里还在酝酿着惊天秘密。\n而曾经眼高于顶不可一世的男人们，遇见谢春慈后，一个接一个都疯了。\n昔日师徒，离心。\n恩爱情侣，相残。\n亲密父子，反目。\n这些男人们挣来抢去闹个不停，恨不得互食血肉，到头来所求的其实不过是她的爱而已。\n谢春慈懵懵懂懂闯入这个扭曲的世界，却吝啬地不肯施舍一点真心。\n她要让这些伤害过她的人，永生永世困在苦海，不得往生！\n玛丽苏真万人迷但纯恨女主×各种各样单箭头的男人。\n真弯掰直，所有人都会爱上女主，包括且不限于男情侣/师徒/父子/好兄弟为了女主互相残杀。\n【世界背景为极端男尊女卑，女主无外挂，有微强制，黑泥！虐文，一点都不爽，全世界都有病，随时随地大小疯】\n初版简介：\n谢春慈莫名其妙穿进了一个修仙的耽美世界里。\n在这里，几乎所有的男人都喜欢男人。\n在男人为主导的世界，女人为男人们惊天动地的爱情摇旗呐喊感动流泪，却看不到自己卑贱如泥被男人狠狠踩在脚下。她们泯灭自我，沦为拼凑世界的装饰物。\n而谢春慈……她本只想和救命恩人一起平凡的度过此生，但这个可恶的世界不放过她，毁了她最爱的一切", "tags": ["玄幻言情", "穿越", "打脸", "今穿古"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主为爱发疯，但你只想好好活着", "fullTitle": "男主为爱发疯，但你只想好好活着", "link": "https://fanqienovel.com/page/7652408518770691096", "data": [6.54, 7.0, 7.36], "trend": 0.82, "latest": 7.4, "wordNumber": 251397, "creationStatus": 1, "desc": "【强调：本文为黑泥向纯代入乙女，有大量g向恐怖描写，男主神经病非人类较多，不要用正常三观对待】\n穿越后，你没有得到金手指，也没有万人迷光环，甚至被某个变态给缠上了。\n什么？他是气运之子，天道宠儿？\n可这个世界是疯掉的世界，气运之子也都是疯子。\n所以你选择了逃跑。\n那就请在保住命的情况下确保自己不被抓住吧。\n\t\n他说他会吃掉你，从头到脚，拆吃入腹。", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "洪荒：罗睺三岁闺女被收入截教了", "fullTitle": "洪荒：罗睺三岁闺女被收入截教了", "link": "https://fanqienovel.com/page/7660710214282251326", "data": [3.54, 3.9, 4.21], "trend": 0.67, "latest": 4.2, "wordNumber": 131907, "creationStatus": 1, "desc": "【洪荒+三岁半+扮猪吃虎+反向反派+团宠养成+迪化量劫+爆笑截教】\n魔界太小，装不下三岁半魔宝魔小乖的“灭世大志”。\n罗睺看着被闺女拆完的魔宫，连夜将她丢进了洪荒。\n【宿主，你的大反派系统回来了，发布灭世任务：污染洪荒水源！】\n然而，系统与魔小乖双双记忆缺失功德系统变成反派灭世系统。\n魔小乖迈着小短腿，将万魔毒煞倒进黄河，瞬间净化了洪荒积攒亿万年的地煞浊气！\n天降无量功德，金光照亮三十三重天！\n路过的通天教主看着浑身功德金光，奶凶奶凶喊着我要毁灭世界的魔小乖，整个人都懵了。\n“这孩子杀气腾腾却功德无量，简直是为我量身定做的亲传弟子！”\n于是，截教多了一个立志灭世的混世魔王。\n多宝：“小师妹，今天我们去毁灭哪个大教？”\n三宵：“谁敢拦着小师妹灭世，先过我们九曲黄河阵！”\n魔小乖哭红了眼：“我真的是坏人，天道再发小红花了，窝就代表大道灭了泥！”", "tags": ["玄幻言情", "系统", "扮猪吃虎", "团宠", "反派", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被迫退学的我绑定了打卡成仙系统", "fullTitle": "被迫退学的我绑定了打卡成仙系统", "link": "https://fanqienovel.com/page/7638640284493958168", "data": [3.43, 3.61, 3.79], "trend": 0.36, "latest": 3.8, "wordNumber": 277464, "creationStatus": 0, "desc": "【现代修仙+升级流+女主团宠+校园+系统+空间+无CP】\n龙国灵气复苏，所有人都以修仙者为荣。\n但林羡偏偏穿越到了祖上18代都是平民的大家庭中，成为那个虽美但渣，且自私自利、好吃懒做的小姑子。\n此刻的林羡，不仅被退学，还面对着家破人亡的风险。\n好消息，她绑定了一个系统。\n坏消息，这个系统好像是个半成品。\n没办法，林羡只好撸起袖子加油干！\n第一步，先制造一个储物袋。\n第二步，成为全龙国最大的储物袋供应商。\n她带着全家人一起发家致富。\n只是为何？身边会有那么多奇奇怪怪的人黏上来啊啊啊！\n\n———场景———\n【叮！监测到宿主到达冷湖图书馆，是否打卡？】\n林羡？？？\n“打卡！”\n【恭喜宿主获得图书馆自习室使用时长240小时！（注：在自习室学习时，外界时间静止！）】\n【恭喜宿主获得《不灭灵体》天阶炼体功法……练成后肉身不灭，断肢可重生；肉身湮灭，神魂不灭。】\n\n———\n排雷：\n1.前期家庭日常多，无脑爽文，请不要带脑子看\n2.10万字后才开始校园篇，校园有无脑打脸情节\n3.不是那种传统的无cp，有男角色追求女主、对女主一见钟情等的情节，不喜勿点，千万别点\n4.男性角色可能偏多（也有女性厉害的角色），男女角色比例大概64开，甚至73开\n", "tags": ["玄幻言情", "校园", "系统", "空间", "团宠", "无CP"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [3.34, 3.55, 3.65], "trend": 0.31, "latest": 3.7, "wordNumber": 235719, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "幻想言情", "反派", "穿书", "古代言情", "团宠"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [2.85, 3.04, 3.1], "trend": 0.25, "latest": 3.1, "wordNumber": 257103, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "剑修", "古色古香"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "休了四个兽夫后，我契约了六个", "fullTitle": "休了四个兽夫后，我契约了六个", "link": "https://fanqienovel.com/page/7557391657260289086", "data": [4.77, 4.86, 4.99], "trend": 0.22, "latest": 5.0, "wordNumber": 250445, "creationStatus": 1, "desc": "（穿越+大佬+兽魂+强制契约+升级流+1vN）\n林清蕴修炼千年的灵符师，穿到第一天，以为自己拿的是女强爽文剧本。\n直到她低头一看——无灵根，蜗牛兽魂，凡品垫底。\n四个契约兽夫嫌她废物，把她扔在贫民区铁皮房里自生自灭。\n亲妈把她扫地出门，亲妹设局陷害，路过的人都要啐一句“丢人”。\n林清蕴：“……这剧本不对吧？”\n还没等她反应过来，直接被驱逐青云城，四名兽夫更是要解除契约。\n怂是不可能怂的，解，必须解，留着你们这些白眼狼干嘛？\n所有人都等着她死在城外。却不知她体内藏着上古紫凤兽魂。\n当晚六道契约天光散落大陆\n冰霜巨龙的主人低笑：\"魂契?有意思。\"\n地下黑场的铁塔硬汉红着眼眶：\"有人要我了?\"\n最高监狱里，锁链寸断的少年抬起头，露出一双极深的凤眸。\n而轮椅上的男人，捻着一朵蓝楹花，笑得温润如玉：\"妻主?\"\n林清蕴：......我现在退契还来得及吗?男人，只是取悦她的工具罢了。", "tags": ["玄幻言情", "幻想言情", "穿越", "大佬", "魂穿"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生另投师门成团宠，你们气什么", "fullTitle": "重生另投师门成团宠，你们气什么", "link": "https://fanqienovel.com/page/7637353004902911038", "data": [3.53, 3.68, 3.74], "trend": 0.21, "latest": 3.7, "wordNumber": 274272, "creationStatus": 1, "desc": "前世，乔月被妹妹觊觎她的极品单灵根，妹妹自导自演陷害她，害她被师父挖了灵根，沦为魔修，最后还被妹妹害死，被师兄抽了灵魂拘在妹妹的百鬼帆，折磨百年。\n　　被人从百鬼幡救后，她竟回到被挖灵根那一日！\n　　灵根已经被挖，她第一时间激发了隐灵根，重生长出来的居然是万年难得的全系完美灵根！\n　　师门害她，不仁不义，她转头拜前世恩人为师，成为残峰最小师妹。\n　　以为只是逃离被害的被迫选择，却不想成了残峰的团宠。\n　　大师兄送她花不完的灵石和法器，二师兄送她用不完的阵盘，三师兄送她嗑不完的丹药，四师兄送她守护傀儡。\n　　残峰师兄弟以为新来的小师妹是小可怜，却发现小师妹强得可怕。\n　　极品丹药从来没有人练出来过？小师妹能练！\n　　净化师只能净化妖兽肉？小师妹她还会净化魔气、鬼气！\n　　种植师只能种普通灵植？小师妹可以种仙植！\n　　最最厉害的是，万年没有人会的画符，小师妹她也手到擒来！\n　　那个谁谁谁，我们小师妹这么优秀，你们气什么？\n　　后悔？晚了！", "tags": ["玄幻言情", "幻想言情", "重生", "穿越", "团宠", "前世今生"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠抽卡系统装高手", "fullTitle": "我靠抽卡系统装高手", "link": "https://fanqienovel.com/page/7654641611606854718", "data": [3.9, 3.97, 4.1], "trend": 0.21, "latest": 4.1, "wordNumber": 282136, "creationStatus": 1, "desc": "仙门大比，我随手从怀里掏出一把古琴\n全场寂静。\n大师兄颤声：“那是……失踪百年的凤栖琴？”\n我波澜不惊，又从头发上随手取下一根发簪。\n大师姐尖叫:“那是神器青芜簪！”\n后来全修仙界都在传，林执月有一整个随身洞府，藏着无数上古灵器乃至神器。\n只有林执月知道，她这身时装是系统送的。\n今天想穿“烟落叠翠”，明天就穿“流火绯星”，至于后天——\n死系统突然弹窗：【限时卡池“九天玄女”开启，抽齐整套可解锁飞行特效，机不可失！】\n我看着卡池里48个部件以及需要氪金的面部妆容和头发陷入了沉思。\n评分刚出，会涨的，小宝们🥹", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "异世穿越", "魂穿"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [5.27, 5.34, 5.47], "trend": 0.2, "latest": 5.5, "wordNumber": 187938, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [3.82, 3.85, 3.91], "trend": 0.1, "latest": 3.9, "wordNumber": 270501, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [7.09, 7.51, 8.21], "trend": 1.12, "latest": 8.2, "wordNumber": 183044, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [5.06, 5.41, 6.05], "trend": 0.99, "latest": 6.1, "wordNumber": 127699, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越荒年炮灰夺女主机缘全家翻身", "fullTitle": "穿越荒年炮灰夺女主机缘全家翻身", "link": "https://fanqienovel.com/page/7654869321851620414", "data": [2.63, 2.95, 3.18], "trend": 0.55, "latest": 3.2, "wordNumber": 277700, "creationStatus": 1, "desc": "程朝晖倒霉地被精神病砸死了，原来是粗心大意白无常的锅。与其讨价还价后，她成功地获得了穿越的机会，同时获得了两个异能作为伴手礼。\n结果，穿过来才发现自己居然是剧本里的炮灰！而且原主还被女主推倒，倒霉地磕死了。\n那就别怪她截取女主的金手指-随身空间了！\n手握剧本，她知道灾年即将来临，逃荒在所难免，本想考察一下自己的窝囊家人，没想到他们为了自己这个小妹，忽然支棱起来了。\n好好好，那就带上自己的家人，先收拾收拾原女主和压榨自己父母的家人，然后好好度过近在眼前的灾年危机！\n结果半路还捡了个长得帅的小哥哥，养起来。\n重要的事情说三遍：程朝晖是一家之主！程朝晖是一家之主！程朝晖是一家之主！", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [3.08, 3.42, 3.6], "trend": 0.52, "latest": 3.6, "wordNumber": 260644, "creationStatus": 1, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但没耀祖！！！\n……\n\n《家无男丁我来撑》——这个撑，撑的从来不是没有男人的空缺，而是不管有没有男人，女主都会让家人好好活着。女主不是代替男人在撑，她是作为她自己在撑。\n女主不会通过贬低或工具化男性来证明自己强大，她的强大来自于她比任何人都更敬畏生命、更懂守护。\n……\n苏青禾没有打算把两个妹妹养成温室里的娇花。\n她要把她们培养成食人花——\n要争权夺利", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "养女害死全家，老太重生剥她皮", "fullTitle": "养女害死全家，老太重生剥她皮", "link": "https://fanqienovel.com/page/7643847756875844670", "data": [2.8, 3.05, 3.24], "trend": 0.45, "latest": 3.2, "wordNumber": 133477, "creationStatus": 1, "desc": "【重生+致富+空间+美食+无cp+微群像+家长里短】\n沈秀禾得知自己的儿子和母亲都被养女那个白眼狼所害，临死前，她用银簪刺穿养女喉咙。\n再次睁眼，她重生到自己四十一岁，亲生女儿被卖的当天。\n沈秀禾请婆家人帮忙，换回亲生女儿，并且讨要回刘翠英多年来欠下自己的银子，成功帮母亲与两个窝囊废儿子分家。\n接回母亲和亲生女儿的当天晚上，沈秀禾成功激活了手镯空间，改变了孩子们惨死的命运。\n沈秀禾的日子越过越好，又一步一步将仇人推进深渊……", "tags": ["种田", "古代言情", "重生", "空间", "美食", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [4.54, 4.85, 4.97], "trend": 0.44, "latest": 5.0, "wordNumber": 266889, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [4.9, 5.16, 5.23], "trend": 0.34, "latest": 5.2, "wordNumber": 264723, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [5.77, 5.95, 6.09], "trend": 0.32, "latest": 6.1, "wordNumber": 177611, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿古代，在主角后面捡漏", "fullTitle": "胎穿古代，在主角后面捡漏", "link": "https://fanqienovel.com/page/7635046106379848729", "data": [3.53, 3.69, 3.79], "trend": 0.25, "latest": 3.8, "wordNumber": 292699, "creationStatus": 1, "desc": "[架空] [种田] [经商] [权谋] [金手指] [有cp]（cp出场比较后）\n（刚出评分，还会继续涨哦）新人新作品，请多多担待。\n李巧语因被医闹病人报复，穿越到古代，直到两岁才恢复记忆。\n家中虽在村里比较富裕，但每个人心思各异，李巧语只能默默苟住，学习手艺，偷摸赚钱。\n可惜在这个时代，女性终究地位低下，为了未来的幸福，她只好计划制造机会入赘高富帅。\n本来以为这漫长的岁月会按部就班进行。\n没想到村长家出了个福娃，村里人都说福娃就是运气好，肯定是神仙下凡。\n却没有看到福娃一捡东西，旁边的人就会倒霉。\n还有，三姐整天用看鬼的眼神看我干什么？哦，原来她是重生的！！？\n隔壁家的书生也满嘴“我命由我不由天，三十年河东...”", "tags": ["种田", "古代言情", "乡村", "空间", "医术", "胎穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女替嫁废夫后，赶海暴富炸渔村", "fullTitle": "恶女替嫁废夫后，赶海暴富炸渔村", "link": "https://fanqienovel.com/page/7647076991916592190", "data": [2.14, 2.27, 2.3], "trend": 0.16, "latest": 2.3, "wordNumber": 285674, "creationStatus": 1, "desc": "【恶女+替嫁++大力+美食+空间+甜宠+赶海+发家致富+虐渣】沈鸢穿成了被继母按着脑袋往墙上撞的恶毒村姑，全家逼她替姐嫁给瘸腿渔夫。\n她笑了：嫁！但断亲书和嫁妆一样不能少。\n临走上演空城计，把沈家偷得只剩四面墙。\n新婚第一天，全村恶霸来闹事，她一拳把人打飞两米远，全村震惊。\n第二天就要分家，公婆：没钱没房你分个寂寞？\n沈鸢拎起竹篓走向海边：你们不懂，这片海能生金。\n蛤蜊、海螺、八爪鱼……别人眼里的破烂，她手里的宝贝。沙虫、海参、鲍鱼……她闭着眼都知道哪儿有。\n全村人都在等着看笑话，直到她真金白银堆满了院。\n瘸腿相公一脸懵：娶了个啥媳妇？", "tags": ["种田", "古代言情", "乡村", "空间", "美食", "代嫁代娶"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全村嫌弃？崽崽带隔壁村逆天改命", "fullTitle": "全村嫌弃？崽崽带隔壁村逆天改命", "link": "https://fanqienovel.com/page/7630158445840190488", "data": [6.3, 6.36, 6.46], "trend": 0.16, "latest": 6.5, "wordNumber": 295939, "creationStatus": 1, "desc": "【古代+种田＋福运＋萌宝+无CP＋团结+群像文】\n【前期小可怜后期大快人心】\n临阳县有两个极端。\n一个是大柳树村，勤奋，能干，却倒霉透顶。\n村口常年盘踞着乌鸦，日夜啼叫，村民饿着肚子，霉运缠身。\n另一个是石泉村——懒惰，虚伪，却好运连连。\n土地不浇水，不施肥，却能长出镇上人人争抢的仙米。\n全村膘肥体胖，用鼻孔瞧人！\n但石泉村村长家有一个最小的女儿，她最懂事，最勤快，却天天挨打。\n全村没无一人给她好脸色，也感受不到一丝善意。\n她拼命干活，渴望得到一丝温暖。\n可最后被娘毒打，浑身鲜血淋漓，在全村的漠视下扔到山上喂狼。\n命悬一线的她，阴差阳错被霉运缠身的大柳树村所救。\n有了爱她的爹娘，爱她的家人，被全村团宠。\n倒霉的大柳树村也从此逆天改命…", "tags": ["种田", "古代言情", "乡村", "萌宝", "无CP", "群像"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带异能穿女尊开局被退婚？", "fullTitle": "带异能穿女尊开局被退婚？", "link": "https://fanqienovel.com/page/7648884503930227736", "data": [3.05, 3.17, 3.21], "trend": 0.16, "latest": 3.2, "wordNumber": 254318, "creationStatus": 1, "desc": "【女尊＋空间＋逃荒＋科举＋1vn】\n末世第八年，江言昭被同父异母的妹妹从背后捅了一刀。\n\n再睁眼，她成了女尊国一个刚被退婚的穷书生。未婚夫嫌她体弱多病、科举无望，上门撕了庚帖。她反手把退婚书撕了，先敲了柳家十两银子。\n\n大旱后，村里颗粒无收。她带着全族人逃荒，一路打土匪、找水源、分粮食，从清河村走到青州府，把一条绝路硬生生走成了活路。\n\n空间还在，异能也在，而接下来，她要科举，要做人上人。\n\n而那个前世为她殉情的人，正红着眼睛问她：\n\"姐姐，我能排在第一个吗？\"\n\n她答：\"不管未来几个男人，你永远会是我的例外和偏爱。\"", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.58, 2.68, 2.71], "trend": 0.13, "latest": 2.7, "wordNumber": 240066, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成小丫鬟，靠梳妆赎身暴富", "fullTitle": "穿成小丫鬟，靠梳妆赎身暴富", "link": "https://fanqienovel.com/page/7564256304332557336", "data": [3.09, 3.15, 3.21], "trend": 0.12, "latest": 3.2, "wordNumber": 291844, "creationStatus": 1, "desc": "观看指南：【非爽文+架空北宋+微群像+市井经商+微宅斗+家长里短+日常流】\n林丰穗穿到北宋，成了八岁小丫头，喜提知州府上「家生子」身份。\n娘是灶上的厨娘，爹是账房贴书，前边还有个大她两岁的绣娘姐姐。\n老娘是灶上摸油水的高手，好的孬的全塞兜里。\n姐姐绣活一般，嘴皮子极好，哄的管事眉开眼笑，多出的边角料通通拎回家。\n家里边只剩个老实爹，半点不敢马虎手里的账。\n丰穗到了年纪要学门手艺，全家人跳出来支招。\n娘说：厨房干活是冬冷夏热，不行！\n姐说：绣娘的活计不分昼夜，别干！\n爹说：账房么，识字算术，不差分厘，还行！\n丰穗心想：学，都学，但还得靠重操旧业稳妥。\n“娘子，梳妆吗？”\n不不不，搞错了！八岁大的人应该先拜师学艺。\n谨小慎微是安身立命的前提。\n赚钱赎身，身兼数职是常态。\n伺候主子饮食起居，还得起早贪黑，制那面脂香膏、胭脂水粉上街兜售。\n苦点累点都没事，只要能挣脱这脖子上的枷锁。\n一家人齐整出府，置上一间小院，做些经济买卖，自由自在的过红火日子，便浑身都是劲。\n日子能过好，就别让其糟下去。\n立意：自由、奋斗、自强则万事顺，向阳而生。", "tags": ["种田", "古代言情", "穿越", "今穿古", "发家致富", "群像"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [9.96, 9.88, 10.07], "trend": 0.11, "latest": 10.1, "wordNumber": 183384, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [4.97, 5.04, 5.08], "trend": 0.11, "latest": 5.1, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。", "tags": ["种田", "古代言情", "空间", "医术", "古色古香", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分到破旧老宅后，我富甲一方", "fullTitle": "分到破旧老宅后，我富甲一方", "link": "https://fanqienovel.com/page/7644022751656676376", "data": [2.59, 2.66, 2.69], "trend": 0.1, "latest": 2.7, "wordNumber": 299890, "creationStatus": 1, "desc": "【系统+开荒+种田+虐渣+致富+家长里短+升级】\n花落大学毕业在即，在一次户外课题研究中，被人推下山，\n穿到大兴二年小林村的一名被推撞身亡的小姑娘身上。\n醒来后，正赶上老大一家歇斯底里闹分家，只因老大吸不到老二的血了。\n而花落悲催的正好穿成包子一家老二家的痴傻小女儿。\n一身怨气正愁发泄的花落瞬间开启了虐渣，手撕白莲花，将这个家闹得鸡犬不宁的戏码。\n遇神杀神，遇佛杀佛，鸡经过都得拔光毛！\n吓得老大一家觉得老二家的傻妞疯了。\n而老二一家却惊喜地发现，包子一辈子终于迎来了她家的话事员。\n于是小女儿说往东，她们绝不往西，小女儿说种田，他们绝不上山。\n花落就这样，带着受气的娘亲以及包子大姐，成功分家，\n开启修老屋，开荒，打猎，种田，囤粮，顺带虐渣的日渐暴富生活。\nPS：温馨向，节奏慢，不喜弃之", "tags": ["种田", "古代言情", "乡村", "系统", "虐渣", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.73, 2.79, 2.83], "trend": 0.1, "latest": 2.8, "wordNumber": 224143, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "周家独苗要科举", "fullTitle": "周家独苗要科举", "link": "https://fanqienovel.com/page/7649989071162330174", "data": [2.82, 2.93, 2.92], "trend": 0.1, "latest": 2.9, "wordNumber": 167641, "creationStatus": 1, "desc": "【胎穿-科举-家长里短-无金手指-cp不确定，写着看】\n周如寒熬夜加班猝死后竟然穿越了，穿成了老周家的独苗苗。\n因为出生时身子弱，又是独苗，爷奶爹娘都当眼珠子疼，周如寒看着自己瘦弱的小身板，这幅身子想要靠力气吃饭怕是不行了，既然这样，那就走科举吧！\n可看着老周家一文钱恨不得掰成两半花的样子，周如寒长长叹了口，想要读书还是得先搞钱，不然怕是学费都交不起，好在他现在才七岁，一切都来得及。\n听说要送他去读书，家里人都不同意，连村里的乡亲们都觉得周老头一家疯了，他们这些一辈子在地里刨食的泥腿子，哪里是读书的料？\n可随着喜报一次次传回村里，喜宴他们是吃了一顿又一顿，谁还敢说他不是读书的料？", "tags": ["种田", "古代言情", "乡村", "穿越", "科举", "胎穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "女频衍生", "score": 5, "reasons": ["3日增长+18.1万", "竞争系数低(4.9)"], "total19": 182.2, "growth": 11.0, "abs_growth": 18.1, "coeff": 4.9, "count10w": 3, "mean": 6.1, "mid19": 4.6, "ndays": 3}, {"cat": "年代", "score": 5, "reasons": ["3日增长+16.4万", "竞争系数低(3.0)"], "total19": 229.9, "growth": 7.7, "abs_growth": 16.4, "coeff": 3.0, "count10w": 3, "mean": 7.7, "mid19": 6.4, "ndays": 3}, {"cat": "快穿", "score": 5, "reasons": ["3日增长+88.4万", "竞争系数低(2.0)"], "total19": 363.7, "growth": 32.1, "abs_growth": 88.4, "coeff": 2.0, "count10w": 20, "mean": 12.1, "mid19": 11.8, "ndays": 3}, {"cat": "宫斗宅斗", "score": 4, "reasons": ["3日增长+76.1万", "竞争系数中(8.0)"], "total19": 317.5, "growth": 31.5, "abs_growth": 76.1, "coeff": 8.0, "count10w": 8, "mean": 10.6, "mid19": 7.1, "ndays": 3}, {"cat": "玄幻言情", "score": 4, "reasons": ["3日增长+7.5万", "竞争系数低(2.3)"], "total19": 137.9, "growth": 5.8, "abs_growth": 7.5, "coeff": 2.3, "count10w": 0, "mean": 4.6, "mid19": 3.9, "ndays": 3}, {"cat": "现言脑洞", "score": 4, "reasons": ["3日增长+26.6万", "竞争系数中(9.6)"], "total19": 358.3, "growth": 8.0, "abs_growth": 26.6, "coeff": 9.6, "count10w": 7, "mean": 11.9, "mid19": 7.1, "ndays": 3}, {"cat": "种田", "score": 4, "reasons": ["3日增长+2.8万", "竞争系数低(3.1)"], "total19": 122.4, "growth": 2.3, "abs_growth": 2.8, "coeff": 3.1, "count10w": 1, "mean": 4.1, "mid19": 3.2, "ndays": 3}, {"cat": "职场婚恋", "score": 4, "reasons": ["3日增长+4.6万", "竞争系数低(3.0)"], "total19": 126.9, "growth": 3.7, "abs_growth": 4.6, "coeff": 3.0, "count10w": 0, "mean": 4.2, "mid19": page/7613292466841586713", "data": [157.76, 161.79, 167.05, 169.61, 171.62], "trend": 13.86, "latest": 171.6, "wordNumber": 564326, "creationStatus": 1, "desc": "这是一个关于贫穷的悲伤故事。\n爹穷到赔掉裤衩，把我送去修仙界找娘。\n宗门嫌弃我是五灵根废柴。\n只有天剑宗愿意收留，因为他们更穷，没得挑。\n师兄们以为捡了个萌妹。\n结果养出了修仙界最大BUG。\n清云宗天才被我一剑打哭。\n魔界少主是我亲哥。\n高阶妖兽见我就跑。\n现在整个修仙界都说我是魔界奸细？\n我才三岁半，我爹没文化，我是文盲二代，能奸什么？\n是的，我现在三岁半了，在线等一个亲娘认领。", "tags": ["玄幻言情", "幻想言情", "剑修", "第一人称", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门反派疯批，唯有师妹逗比", "fullTitle": "满门反派疯批，唯有师妹逗比", "link": "https://fanqienovel.com/page/7134523177480227854", "data": [36.46, 38.24, 38.24, 43.01, 46.66], "trend": 10.2, "latest": 46.7, "wordNumber": 3537452, "creationStatus": 0, "desc": "一朝穿书，叶灵泷成了修仙文里的恶毒炮灰女配，资质奇差还在修仙大会上胁迫女主带她进第一宗门，入门后处处跟女主作对最后惨死收场。\n　　为了快乐苟活，叶灵泷当场放弃胁迫女主，扭头就进了修真界最差的门派，这恶毒女配她不当了！\n　　本以为进个最差宗门能吃喝玩乐苟日子当咸鱼，谁知这最差的宗门里全员都是疯批反派，随时走在黑化边缘，准备给女主挨个送头。\n　　啊这…她们门派要是马上要团灭了吗？不慌，这题她会。\n　　大师兄满门被灭后复仇杀穿整个修真界最终被女主打败？小师妹：师兄我知道她什么修为什么功法多少秘宝，快，卷起来！咱不能输！\n　　二师兄身藏妖族血脉隐忍躲藏却被人发现群起而诛之？小师妹：躲什么？牛逼血脉两界通杀，去征服两界奉你为主啊！我知道两界传送门在哪！\n　　三师兄金丹破碎经脉全废走火入魔后成为联手歼灭的大魔头？小师妹：我知道哪里可以重练金丹重塑经脉，稳住，这波团战我们能赢！\n　　四师兄苦恋女主爱而不得为情所伤最后黑化被男主所杀？小师妹：你这样不行，舔狗一号送法宝，舔狗二号签契约，你这舔狗N号不如去送个命？\n　　他们这哭哭唧唧柔柔弱弱又煽风点火疯言疯言的小师妹，是猴子请来的逗比吧？", "tags": ["玄幻言情", "古代言情", "穿越", "反派", "穿书", "异世穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [22.74, 23.6, 24.39, 25.12, 25.85], "trend": 3.11, "latest": 25.9, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [21.21, 21.98, 23.62, 23.95, 24.14], "trend": 2.93, "latest": 24.1, "wordNumber": 875479, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [21.47, 22.56, 22.56, 23.11, 23.63], "trend": 2.17, "latest": 23.6, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [23.85, 24.76, 24.76, 25.75, 25.99], "trend": 2.14, "latest": 26.0, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [41.06, 42.22, 42.22, 42.58, 43.04], "trend": 1.98, "latest": 43.0, "wordNumber": 3251736, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙冤种女配崛起，开局杀女主", "fullTitle": "修仙冤种女配崛起，开局杀女主", "link": "https://fanqienovel.com/page/7117541469996452867", "data": [24.85, 26.99, 26.99, 26.82, 26.63], "trend": 1.77, "latest": 26.6, "wordNumber": 1026838, "creationStatus": 0, "desc": "[大家说被简介耽误了，本人简介无能，看内容吧］\n穿成惨死的冤种女配？不怕，开局杀女主，剧情崩塌，一切洗牌重来。\n　　这一世，我就是女主。\n　　这本书的设定是女主是外室生的小可怜，起点低，光环强，不管遇到什么危险总会逢凶化吉，逆境重生，最后走到人生巅峰。\n　　而她，是女主同父异母的冤种妹妹，父亲唯一的嫡女。\n　　穿越之后掏心掏肺的对女主好，人家发达后，照样抽她仙骨，毁她全族，她终究逃不过惨死的命运。\n　　既然改变不了命运，那就将命运的源头直接掐死。\n【本书是偏正统一些的修仙文，注重主角个人历程，大家齐心协力突破桎梏，不恋爱，友情师门羁绊为重，不写师门斗雌竞雄竞等等，希望大家多一点儿耐心，谢谢】\n——\n避雷：偏传统修仙，人物成长会更符合逻辑，不是一天筑基三天结丹的爽文，筑基打死金丹的剧情有，不可能出现筑基一拳打死元婴的夸张剧情，看爽文的慎入。", "tags": ["玄幻言情", "古代言情", "穿越", "嫡女", "穿书", "虐渣", "今穿古", "打脸", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [26.81, 27.25, 27.92, 28.37, 28.45], "trend": 1.64, "latest": 28.4, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠摆烂拯救了全宗门", "fullTitle": "我靠摆烂拯救了全宗门", "link": "https://fanqienovel.com/page/7153918048745819172", "data": [58.44, 59.48, 59.48, 59.78, 59.95], "trend": 1.51, "latest": 59.9, "wordNumber": 1899187, "creationStatus": 0, "desc": "（实体第二册已出）叶翘一觉睡醒穿成了万人迷小说里的工具人二师姐。\n小说里小师妹有难二师姐上，小师妹想要神器，二师姐去拿，小师妹没有灵根，要挖她的灵根。\n叶翘心态崩了，连夜下山，撂担子不干了。\n这工具人谁爱当谁当。\n……\n新宗门的师兄们一切都好，手拿剧本的叶翘却知道这些人都是万人迷女主的鱼。\n丧气厌世的大师兄是爱而不得的舔狗，最终为女主牺牲。\n自打叶翘来了后，他也不不丧了，也不想着去死了，而是整日追着叶翘咆哮：“以后再敢逃课试试！”\n二师兄是个天才男配，因为无法破境，而生了心魔最后死在雷劫。\n叶翘试探性发出邀请：“大道至简，无欲则刚，二师兄，一起摆烂吗？”\n二师兄：“……”好像有些道理？\n天才丹修三师兄是备胎男配，为女主提供各种丹药被榨干所有价值，只得到一句‘我们只是朋友’\n叶翘来了后，三师兄满脑子都是炼丹炼丹，努力投喂小师妹。\n天生剑骨的四师兄为了女主，断送修为，自毁道心。\n叶翘抽出一把剑，认认真真：“心中无女人，拔剑自然神，女人，只会影响你拔剑的速度。”\n四师兄看着神神叨叨的小师妹：“？”\n自从叶翘来了后，他们不围着女主转了，整个门派鸡飞狗跳。\n原文女主：“？”\n我的万人迷光环呢？", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "虐渣", "今穿古", "异世穿越", "打脸", "群像", "魂穿", "剑修"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [16.52, 16.68, 17.03, 17.43, 17.73], "trend": 1.21, "latest": 17.7, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主都是恋爱脑，只有我是真修仙", "fullTitle": "男主都是恋爱脑，只有我是真修仙", "link": "https://fanqienovel.com/page/7587644291774696510", "data": [52.89, 53.31, 53.6, 54.1, 54.02], "trend": 1.14, "latest": 54.0, "wordNumber": 1676047, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n【女主修仙升级流爽文+符道天才+大后期古神苏醒】\n桑渔入仙门那天，修仙界南域多了个天灵根天才。\n剑修、法修、丹修、阵修、御兽任她选？\n不，她只想安静画个画、做个符修！\n仙门众长老力劝：符修只是辅修，在修仙界毫无地位可言，狗都不修！\n后来：\n仙门众天才：谁说符修只是辅修、全是垃圾？给老子站出来！\n特么！他们都被桑渔这个变态画的符炸冒烟了。\n仙门众弟子：狗都不修我修！我要当符修！\n符修能越阶杀人！炼气战筑基、筑基战金丹、金丹追着元婴满世界跑……\n可他们往死里修，都修不到桑渔这样儿啊！\n桑渔：上辈子我被古神砸死了，这辈子靠抄袭古神身上的符文成为符道天才不过份吧？\n再后来：\n修仙界南域最顶尖的仙门为了抢天才入门，不惜派出同为天才的金丹美男——逼婚 是，姜灵焕把谢风叙当充电宝，变着花样跟他制造接触。\n谁曾想谢风叙不仅有皮肤饥渴症，还能听见她的心声，还只能听一半！\n她内心：他手好大，感觉能一把握住我的头。胸肌练得不错。\n他听到：他手好大，感觉能一把握住我的…胸，不错。\n他：？她好变态\n她：？我冤枉啊\n后来，自我攻略的谢风叙在勾引姜灵焕的路上一去不复返，从闷骚到明骚！\n姜：你真的好骚啊！", "tags": ["现言脑洞", "现代言情", "校园", "系统", "穿越", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际校园：五人小队向前冲", "fullTitle": "星际校园：五人小队向前冲", "link": "https://fanqienovel.com/page/7363859366488837182", "data": [22.99, 24.87, 26.65, 27.92, 29.13], "trend": 6.15, "latest": 29.1, "wordNumber": 1169247, "creationStatus": 0, "desc": "【军校+机甲+无cp+成长向+群像+轻幽默+五人团队+团魂】\n人生的前十七年，姜林的目标是考上明德机械工程系，成为未来高薪机甲师，但一场突如其来的变故让她前往黎明军校，走上了一条成为超强单兵的道路。\n三校联赛、实战演练、星际战斗……\n多年之后，五名意气风发的少年并肩站在废墟之上，成为三校当之无愧的最强小队。\n“加入黎明军校，是为了今日夺冠吗？”\n“不是，是为了以血肉之躯，再造黎明。”\n【小队介绍】\n姜林（女），单兵，182，敏捷型战斗机甲“擎风”，擅长近身作战，独狼，“一剑不行？多砍几剑总会好的”；\n权雅（女），后勤，165，不会做好吃饭饭的医疗兵，不是好后勤，“你的命，我用一碗佛跳墙买下了”；\n康尧（男），机甲师，175，看到人就烦但是会冷脸做机甲，说话难听天赋极高，皮脆容易被打死，“难听？更难听的话我还没说出口呢”；\n江鹰（男），单兵，191，中火力战斗机甲“重影”，擅长枪械炮弹，表面冷酷壮汉，实则腼腆饭桶，“你这事儿我办不了，请我吃饭？哦，那可以。”\n杨星（女），指挥，172，你有你的精神力，我有我的战术打法，赛场之上，“仅我一人，就可当千军万马”", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "星际", "无CP", "搞笑轻松", "群像"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "算命亿点准，假千金被国家收编了", "fullTitle": "算命亿点准，假千金被国家收编了", "link": "https://fanqienovel.com/page/7621489476405054526", "data": [28.42, 29.4, 30.84, 32.22, 34.05], "trend": 5.63, "latest": 34.1, "wordNumber": 475889, "creationStatus": 0, "desc": "【假千金+国家团宠+群像+玄学+无cp+直播算命】\n\n　　时鸢是被抱错的假千金，亲子鉴定报告一出，养父母就迫不及待将她赶出豪门。\n\n　　亲生父母家里一穷二白，气运被偷，欠债千万！\n\n　　为还债，时鸢只能干起老本行，摆摊算命，当起了玄学主播。\n\n　　“大师，我想找我女儿。”\n\n　　时鸢：“你前脚出门，你重男轻女的婆婆后脚就把你女儿卖了，现在你女儿已经上了卖器官的手术台。”\n\n　　当晚警方破获一起跨省重大买卖器官案。\n\n　　“大师，我今年五十岁，想看看我和现在的男友有没有正缘。”\n\n　　时鸢：“你亲儿子联合你男友给你买了巨额保险，还要带你出去旅游上演消失的她。”\n\n　　苦主当即断亲报警，渣男和亲儿子被捕入狱。\n\n　　“大师，我发现我家墙壁有异响！”\n\n　　时鸢：“有异响就对了，十年前你杀了人藏尸在墙壁里，她现在出来找你了。”\n\n　　……\n\n　　只要时鸢一开播，全国警方蹲点吃瓜，靠着时鸢破获了一起又一起的重大犯罪案件。\n\n　　原本被夺走气运的亲生父母哥哥，也重新走上暴富巅峰！\n（不是全文都是直播，有主线剧情的哦） , "link": "https://fanqienovel.com/page/7569956253888171032", "data": [14.13, 15.0, 15.0, 15.44, 15.72], "trend": 1.59, "latest": 15.7, "wordNumber": 1091433, "creationStatus": 0, "desc": "【私设多+动植物变异+天灾+怪物+异能+微群像+升级流】\n巫泗泗满18岁生日这天，耳边骤然出现无数的呢喃声。\n除了她，没有人能听到。\n第二天觉醒台上，她又听到了呢喃，一不小心照着对方说的做了。\n然后。\n她觉醒了治愈异能，和别的治愈系那充满生机的绿光不同！\n她浑身冒黑烟儿，一看就邪！\n注册官飞快掏出一把糯米朝她撒了过去！\n巫泗泗：？\n……\n巫泗泗被录取了。\n但被高层悄悄例入【危险人物】档案！\n她最开始还很担忧，直到遇到了另外几大毒物。\n7号毒物：右簪。抽烟喝酒纹花臂，徒手撕怪物的猛人室友，最大爱好是去窝棚区救治老人小孩……\n5号毒物，童印。走到哪哪儿死人的倒霉体质，每次倒霉都要喂自己吃一颗糖……\n1号毒物：白撬秋。喜爱穿红戴绿，阳光开朗大男孩，姐姐长姐姐短的嘴甜怪，实则有着反社会人格！\n巫泗泗放心了，大家藏起来的身份都不简单，那我冒个黑烟儿也可以大大方方的。\n她表面是治愈系，实则是伤害转移。\n她净化诡异，但诡异不嚎个七天七夜就下不了线！\n她能靠献祭获得赐福、批量生产【金光甲】的能力，但献祭的东西不太正常，是怪物的眼球舌头或者死老鼠……\n高层紧张的咽了口唾沫：“呃，冒黑烟儿也没什么不好！再……再看看？”\n\n", "tags": ["科幻末世", "幻想言情", "末世", "天灾", "群像"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际：逼我退学？反手造S级机甲", "fullTitle": "星际：逼我退学？反手造S级机甲", "link": "https://fanqienovel.com/page/7547238651487341593", "data": [17.03, 18.08, 18.08, 18.27, 18.34], "trend": 1.31, "latest": 18.3, "wordNumber": 1203738, "creationStatus": 1, "desc": "【星际+搞笑+学院+比赛+机甲制造+经营+无CP】\n机甲女王沈昭蕴重生三百年后。\n老师问：“你怎么评价创造联盟第一台机甲的沈昭蕴？是什么驱使她创造出世界上第一台机甲？”\n沈昭蕴答：“她有点小聪明，穷，抠门，爱财……\n为什么创造出机甲？因为怕死！”\n老师狂怒口水飞喷，“错！错！错！你学到狗肚子了吗？\n请看VCR！\n《沈昭蕴个人回忆录》，第一百九十三页，写了沈昭蕴背身站立，望月兴叹：血债就要血偿，伟大的胜利是需要牺牲，在血仇面前，个人利益微不足道。\n《沈昭蕴个人回忆录》，第一百九十四页，记载了沈昭蕴夜半起武吟诗，黄沙百战穿机甲，不破异兽终不还……\n这样的沈昭蕴应该是坚强，勇敢，无私，伟大的！”\n沈昭蕴越听越奇怪，这……是我吗？", "tags": ["科幻末世", "重生", "星际", "无CP", "前世今生", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真公主？不，真君主！", "fullTitle": "真公主？不，真君主！", "link": "https://fanqienovel.com/page/7517228824212278334", "data": [10.83, 11.06, 11.25, 11.53, 11.76], "trend": 0.93, "latest": 11.8, "wordNumber": 920036, "creationStatus": 1, "desc": "（无CP+大女主+前期军校争霸+后期一统人族+热血）\n问：从君主幼年体到完成体要几步？\n幼年体凌昭：孤儿院开局，疑似金手指的游戏芯片还一直拖后腿。\n完成体凌昭：后星际第一人·第一指挥官·神级星者·人族的希望·神迹计划唯一继承者……\n后星际时代，异兽大肆入侵，帝国统治式微。在 全部新郎流程，跟经纪人交换戒指，甚至接吻\n他解释：“别误会，新郎没来，我顶一下他跟姐姐结婚。”\n全文概括：\n＃全世界都是男女主play的一环\n＃当面暧昧，贴脸挑衅，玩弄", "tags": ["快穿", "总裁", "幻想言情", "穿越", "豪门世家", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "他们要我当圣母，我偏成阎罗", "fullTitle": "他们要我当圣母，我偏成阎罗", "link": "https://fanqienovel.com/page/7521587119647640601", "data": [18.63, 18.93, 19.27, 19.5, 19.56], "trend": 0.92, "latest": 19.6, "wordNumber": 1004007, "creationStatus": 0, "desc": "【穿书 + 爽文 + 打脸  】\n【副本1:穿成九零扶弟魔，这血包我不当了】✔\n【副本2:暗恋的第九年】✔\n【副本3:第一闺秀】✔\n【副本4:穿成龙傲天的后宫女配】✔\n【副本5:废土求生记】✔\n\n……\n穿进年代文里，E6成了“天选弟弟”的血包工具人。\n开局就被塞进城里姑姑家“寄养”，美其名曰“享福”。\n“要不是为了你，咱家怎么会过的这么不容易。”\n“你妈给你生了个弟弟。”\n“你能不能懂点事儿，他是你亲弟弟，就不能让让他？”\n“女的不能吃鸡腿，会烂嘴的。”\nE6捏碎狗屎剧本。\n后来，所有吸过她血的人都在哭嚎：\n“她以前不是这样的！”", "tags": ["快穿", "现代言情", "系统", "穿书", "打脸", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：所有人都知道我是好人", "fullTitle": "快穿：所有人都知道我是好人", "link": "https://fanqienovel.com/page/7341261051901512766", "data": [15.71, 15.79, 15.79, 15.97, 16.12], "trend": 0.42, "latest": 16.1, "wordNumber": 3612674, "creationStatus": 1, "desc": "三千小世界，恶女千千万。\n舒姣的任务，就是弥补这些被各式各样恶女毁掉一生的人。\n从此……\n【世界一：我败家？国家养我】。\n她善良、大方、爱国、漂亮，不就是爱花点钱吗？给她！\n【世界二：撒谎成性的侯门庶女】。\n撒谎？什么撒谎？她那么柔弱、那么仁慈，怎么可能撒谎呢？\n【世界三：想嫁入豪门的假名媛】。\n假名媛？不，她就是真名媛！\n……\n简介无能，请看正文√\n注：并非全是爱情故事，架空文学，喜欢咱就看，不喜欢就退，小可爱们手下留情呀~\n注：避雷··恶毒小炮灰··的世界，大修，不好看。", "tags": ["快穿", "现代言情", "系统", "幻想言情", "穿越"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿炮灰她不走寻常路", "fullTitle": "快穿炮灰她不走寻常路", "link": "https://fanqienovel.com/page/7432285807722908696", "data": [22.15, 22.26, 22.97, 23.09, 22.48], "trend": 0.33, "latest": 22.5, "wordNumber": 1712809, "creationStatus": 1, "desc": "无固定cp，清穿+年代+其他，有空间\n注：女主纯享乐主义，精致利己，主打吃什么就是不能吃苦，受什么都不能受罪，每个世界都要尽量过的舒服。\n\n     倒霉了二十几年的女大学生沈安宁好不容易一朝转运，却在财运到来的前一天一命呜呼。许是怨念太大，临死前被一个还愿系统绑定，由此开始了游走各界之旅。\n千挑万选绑定宿 n西方二圣：恨此子不是吾西方弟子。痛哉!痛哉!\n杜蘅只想帮助更多的百姓，等回过神来，她已经功德无量，修得功德真身，成就功德圣人。\n（女主非无敌。\nPS：前期是现实流的基建，后期才能转修仙流基建，不喜慎入，节奏较慢）", "tags": ["女频衍生", "系统", "穿越", "基建", "公版衍生", "衍生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "人生互换从华妃成为小秦氏开始", "fullTitle": "人生互换从华妃成为小秦氏开始", "link": "https://fanqienovel.com/page/7523840466396138521", "data": [7.63, 8.33, 8.78, 9.09, 9.35], "trend": 1.72, "latest": 9.3, "wordNumber": 1081259, "creationStatus": 1, "desc": "【剧版知否+剧版甄嬛+剧版如懿】\n确定三对互换：\n1.年世兰和小秦氏（1-145年世兰，146-233小秦氏，都已完结）\n2.富察琅嬅和王若弗（琅嬅234-420已完结，王若弗421-动工中）\n3.宜修和林噙霜\n暂定世界：\n李金桂与宰相根苗之母？\n德妃与盛老太太？\n王熙凤与？？？\n\n核心设定：孩子随母亲，无论母亲改嫁给谁，去到哪个时空，生下的都是自己的孩子。\n注：性格并非一成不变，而是靠后天教养与环境。\n\n【你只管先救赎自己，你心心念念的骨血，自会随你离开泥沼，奔赴新生。】", "tags": ["女频衍生", "皇后", "虐渣", "同人", "如懿衍生", "甄嬛衍生", "衍生"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "前半生之罗子君重生归来", "fullTitle": "前半生之罗子君重生归来", "link": "https://fanqienovel.com/page/7568503079918636094", "data": [10.75, 11.52, 11.52, 12.21, 12.43], "trend": 1.68, "latest": 12.4, "wordNumber": 326888, "creationStatus": 0, "desc": "罗子君在友情爱情双双失去后，她跟随吴大娘去深圳做事业去了，谁知一朝又重生在离婚前，这次罗子君想要改变自己的生活，经营好自己的生活，远离唐晶，贺涵两人之间的关系，他俩是否圆满，罗子君愿意偶尔助攻，但主要还是取决于他俩自身原因，她不想因为她出现才造成这样的结果，所以这一世她要经营好自己的生活，不要向前世那样处处依赖别人，做个自强自立的女人，谁知道她越想远离，两人的缘分却始终不断，本书中的罗子君，唐晶她俩各自美丽，都会有着她们美好的未来！", "tags": ["女频衍生", "重生", "家庭", "同人", "家长里短", "衍生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "甄嬛传：幸运值点满后撞脸十三爷", "fullTitle": "甄嬛传：幸运值点满后撞脸十三爷", "link": "https://fanqienovel.com/page/7626717980772011070", "data": [7.7, 7.85, 7.97, 8.12, 8.16], "trend": 0.46, "latest": 8.2, "wordNumber": 481278, "creationStatus": 1, "desc": "确诊肺癌晚期后，穆宁看见河面直接就是个三二一，起跳。\n穆宁幸运的挂了。\n更幸运的是她绑定了系统。\n只要成功攻略甄嬛传里的大胖橘，她就能永享财富和健康。\n开局属性点，穆宁脑子一抽，全点了幸运值。\n一睁眼，穆宁成了怡亲王表妹，还跟他长得一模一样。\n看到她第一眼，四爷：……\n穆宁阴差阳错(系统作祟)进了雍王府，成了庶福晋。\n洞房当晚……\n四爷：……实在下不去手啊，有一种抓耳挠 23}, {"x": 528.2, "y": 9.6, "r": 29.2, "label": "职场婚恋", "count10w": 14}, {"x": 1221.4, "y": 3.7, "r": 58.0, "label": "豪门总裁", "count10w": 30}, {"x": 877.3, "y": 3.0, "r": 58.0, "label": "青春甜宠", "count10w": 30}], "bookChartData": {"玄幻言情": [{"label": "满门反派疯批，唯有师妹逗比", "fullTitle": "满门反派疯批，唯有师妹逗比", "link": "https://fanqienovel.com/page/7134523177480227854", "data": [38.24, 43.01, 46.66], "trend": 8.42, "latest": 46.7, "wordNumber": 3537452, "creationStatus": 0, "desc": "一朝穿书，叶灵泷成了修仙文里的恶毒炮灰女配，资质奇差还在修仙大会上胁迫女主带她进第一宗门，入门后处处跟女主作对最后惨死收场。\n　　为了快乐苟活，叶灵泷当场放弃胁迫女主，扭头就进了修真界最差的门派，这恶毒女配她不当了！\n　　本以为进个最差宗门能吃喝玩乐苟日子当咸鱼，谁知这最差的宗门里全员都是疯批反派，随时走在黑化边缘，准备给女主挨个送头。\n　　啊这…她们门派要是马上要团灭了吗？不慌，这题她会。\n　　大师兄满门被灭后复仇杀穿整个修真界最终被女主打败？小师妹：师兄我知道她什么修为什么功法多少秘宝，快，卷起来！咱不能输！\n　　二师兄身藏妖族血脉隐忍躲藏却被人发现群起而诛之？小师妹：躲什么？牛逼血脉两界通杀，去征服两界奉你为主啊！我知道两界传送门在哪！\n　　三师兄金丹破碎经脉全废走火入魔后成为联手歼灭的大魔头？小师妹：我知道哪里可以重练金丹重塑经脉，稳住，这波团战我们能赢！\n　　四师兄苦恋女主爱而不得为情所伤最后黑化被男主所杀？小师妹：你这样不行，舔狗一号送法宝，舔狗二号签契约，你这舔狗N号不如去送个命？\n　　他们这哭哭唧唧柔柔弱弱又煽风点火疯言疯言的小师妹，是猴子请来的逗比吧？", "tags": ["玄幻言情", "古代言情", "穿越", "反派", "穿书", "异世穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "剑宗小魔童，三岁半超凶", "fullTitle": "剑宗小魔童，三岁半超凶", "link": "https://fanqienovel.com/page/7613292466841586713", "data": [167.05, 169.61, 171.62], "trend": 4.57, "latest": 171.6, "wordNumber": 564326, "creationStatus": 1, "desc": "这是一个关于贫穷的悲伤故事。\n爹穷到赔掉裤衩，把我送去修仙界找娘。\n宗门嫌弃我是五灵根废柴。\n只有天剑宗愿意收留，因为他们更穷，没得挑。\n师兄们以为捡了个萌妹。\n结果养出了修仙界最大BUG。\n清云宗天才被我一剑打哭。\n魔界少主是我亲哥。\n高阶妖兽见我就跑。\n现在整个修仙界都说我是魔界奸细？\n我才三岁半，我爹没文化，我是文盲二代，能奸什么？\n是的，我现在三岁半了，在线等一个亲娘认领。", "tags": ["玄幻言情", "幻想言情", "剑修", "第一人称", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [24.39, 25.12, 25.85], "trend": 1.47, "latest": 25.9, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [24.76, 25.75, 25.99], "trend": 1.23, "latest": 26.0, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [22.56, 23.11, 23.63], "trend": 1.08, "latest": 23.6, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [42.22, 42.58, 43.04], "trend": 0.82, "latest": 43.0, "wordNumber": 3251736, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [17.03, 17.43, 17.73], "trend": 0.7, "latest": 17.7, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [27.92, 28.37, 28.45], "trend": 0.53, "latest": 28.4, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [23.62, 23.95, 24.14], "trend": 0.52, "latest": 24.1, "wordNumber": 875479, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.17, 41.31, 41.66], "trend": 0.49, "latest": 41.7, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠摆烂拯救了全宗门", "fullTitle": "我靠摆烂拯救了全宗门", "link": "https://fanqienovel.com/page/7153918048745819172", "data": [59.48, 59.78, 59.95], "trend": 0.47, "latest": 59.9, "wordNumber": 1899187, "creationStatus": 0, "desc": "（实体第二册已出）叶翘一觉睡醒穿成了万人迷小说里的工具人二师姐。\n小说里小师妹有难二师姐上，小师妹想要神器，二师姐去拿，小师妹没有灵根，要挖她的灵根。\n叶翘心态崩了，连夜下山，撂担子不干了。\n这工具人谁爱当谁当。\n……\n新宗门的师兄们一切都好，手拿剧本的叶翘却知道这些人都是万人迷女主的鱼。\n丧气厌世的大师兄是爱而不得的舔狗，最终为女主牺牲。\n自打叶翘来了后，他也不不丧了，也不想着去死了，而是整日追着叶翘咆哮：“以后再敢逃课试试！”\n二师兄是个天才男配，因为无法破境，而生了心魔最后死在雷劫。\n叶翘试探性发出邀请：“大道至简，无欲则刚，二师兄，一起摆烂吗？”\n二师兄：“……”好像有些道理？\n天才丹修三师兄是备胎男配，为女主提供各种丹药被榨干所有价值，只得到一句‘我们只是朋友’\n叶翘来了后，三师兄满脑子都是炼丹炼丹，努力投喂小师妹。\n天生剑骨的四师兄为了女主，断送修为，自毁道心。\n叶翘抽出一把剑，认认真真：“心中无女人，拔剑自然神，女人，只会影响你拔剑的速度。”\n四师兄看着神神叨叨的小师妹：“？”\n自从叶翘来了后，他们不围着女主转了，整个门派鸡飞狗跳。\n原文女主：“？”\n我的万人迷光环呢？", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "虐渣", "今穿古", "异世穿越", "打脸", "群像", "魂穿", "剑修"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主都是恋爱脑，只有我是真修仙", "fullTitle": "男主都是恋爱脑，只有我是真修仙", "link": "https://fanqienovel.com/page/7587644291774696510", "data": [53.6, 54.1, 54.02], "trend": 0.42, "latest": 54.0, "wordNumber": 1676047, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n【女主修仙升级流爽文+符道天才+大后期古神苏醒】\n桑渔入仙门那天，修 , "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被疯批NPC盯上后，我直接拿捏", "fullTitle": "被疯批NPC盯上后，我直接拿捏", "link": "https://fanqienovel.com/page/7342757972377865240", "data": [4.96, 5.03, 5.12], "trend": 0.17, "latest": 5.1, "wordNumber": 813708, "creationStatus": 0, "desc": "【成长型女主】【男主纯坏种】【双洁】【游戏类型包括生存类、恐怖类、规则怪谈类……】\n一趟诡谲的时空巴士在异时空穿梭......\n姜颂从没想到自己的社畜生活会结束在下班的这天，想要在恐怖的生存游戏中活下去，她必须完成每一场游戏任务，不能出错。\n原本就危险重重的游戏中，姜颂却突然被一个NPC盯上，直接提升到地狱级难度，更可气的是无论哪局游戏都能碰上他。\n游戏最初。\n一把锃亮的砍刀悬在姜颂的头上，刀的主人沈听肆脸上挂着诡异冰冷的神情，落下的瞬间，动作止住，他不受控制地收起刀。\n姜颂回头，表情温和：“你在干嘛？”\n沈听肆咬牙切齿道：“我在帮你修理分叉。”\n姜颂看了一眼手里的吸引力卡牌，被绑定者：沈听肆。\n她笑了笑：“你要是闲的不行，来帮我剪个脚趾甲。”\n后来，吸引力卡牌不再作用到沈听肆身上，但沈听肆还是每次都会找到姜颂，别的男鬼靠近她时，沈听肆冷着一张脸掐着他的脖子：“那是我老婆，滚远点。”\n【女主外表软妹子，三观正，金手指或大或小，这个因人而异，我觉得还可以，至于男主，腹黑霸道，完全没有三观，全靠女主硬掰。虽然是求生游戏，但恋爱也是要谈的。（男主后期死恋爱脑）】", "tags": ["悬疑脑洞", "腹黑", "灵异", "规则怪谈", "悬疑"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "在恐怖游戏里谈的恋爱千奇百怪", "fullTitle": "在恐怖游戏里谈的恋爱千奇百怪", "link": "https://fanqienovel.com/page/7250087472565062656", "data": [11.95, 11.99, 12.04], "trend": 0.09, "latest": 12.0, "wordNumber": 2036120, "creationStatus": 0, "desc": "白瑶成了诸多恐怖世界里空有美貌，且满身铜臭味的恶毒女配。\n系统给她抛下“攻略”两个字后就因为信号不好失联了。\n她看过那么多小说，很懂套路，不就是要她去攻略有悲惨遭遇的男人吗？\n她在看到某人的第一眼时，能察觉对方身上出现的暗红色光芒，她猜那一定就是自己的攻略对象，于是——\n在闹鬼的寄宿制校园里，她捡到了被人欺负的单纯少年，她给他补课，给他送花，与他躲在死过人的美术室里偷偷的搂搂抱抱。\n在六人逃生的废弃医院，她救下了被所有人视为累赘而丢下的病弱少年，她给他送资源，给他送装备，与他藏在衣柜里小心的亲吻。\n在危机遍布的海岛，看到那坨黑色带着触手的形似章鱼的生物，她也来者不拒，把黑色怪物藏在了自己的口袋里，它一天天长大，最后有了人的形状，她觉得可以教它亲吻了。\n系统重新上线，失声惊叫，“你究竟是怎么能做到和那么多鬼怪BOSS谈恋爱的啊！”\n白瑶:“你不是说让我攻略他们？”\n系统崩溃，“我是让你把游戏攻略成功活到最后，没有叫你嫖BOSS 啊！”\n白瑶:“啊这……”\n不可言说的怪物身体撕成两半，它的触手把藏起来的贝壳都送到了她的面前，“瑶瑶，亲我呀。”\n白瑶:好感度都刷满了，不亲说的过去？", "tags": ["悬疑脑洞", "悬疑", "灵异", "系统", "穿越", "惊悚游戏"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "无限流：摆烂后我封神了", "fullTitle": "无限流：摆烂后我封神了", "link": "https://fanqienovel.com/page/719727 到周围人看向她的眼底是遮掩不住的粘稠爱意和病态的偏执。\n\n　　副本一：林中别墅【1v6】【已通关】\n\n　　你是小团体中的小透明，本应该会在一个雨夜中被所有人抛弃，被雨夜屠夫杀害。\n\n　　可后来未婚夫妻为你自相残杀，反目成仇；雨夜屠夫单膝下跪，只为了求你一吻；姐弟共感，每天夜里向你索取……\n\n　　你成为了所有人掌心中的宝贝。\n\n　　可你该怎么从他们的控制中逃离……\n　　副本二：借种的寡妇【已通关】\n　　副本三：恐怖直播间的擦边小主播【已通关】\n副本四：血腥屠夫的小羔羊【1v4】【已通关】\n副本五：疗养院饲养怪物的小护工【已通过】\n副本六:无人岛上得罪所有人的恶毒大小姐【正在进行】", "tags": ["悬疑脑洞", "悬疑", "穿越", "无限流", "灵异", "惊悚游戏"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：我真不是张家人，真的！", "fullTitle": "盗笔：我真不是张家人，真的！", "link": "https://fanqienovel.com/page/7618255935110138905", "data": [6.83, 6.85, 6.84], "trend": 0.01, "latest": 6.8, "wordNumber": 399237, "creationStatus": 1, "desc": "【刚出分，后续会涨。无cp，人物私设原著土著。有回忆杀很多，非爽文。不是吴邪黑！不黑主角团！简介无力。有点火葬场和日常文的特色】\n张安没有想到只是一个姓，会给他的人生带来天翻地覆的变化。\n他和一个叫关根的初遇，因为他藏着右手，他就问他是不是张家人。\n张安摇头，他不知道什么是张家人，藏着右手当然是有他的原因。\n后来，他遇到了很多人，他们都把他当成了张家人，无论张安怎么解释，他们都不相信。\n张安没招了，一个装睡的人是永远叫不醒的，更何况是这么多装睡的人。\n于是他成了吴邪计划里的第一个棋子，也是后来计划里十七个少年中唯一“死”掉的那个。\n张安在长白山崖迎来了新生，只是没想到一场意外让他们重逢。\n他们都以为人死了，没想到在雨村他们又相遇了。\n……\n吴邪看着“沈姑姑”作画的背影，想起门后那幅旧画。\n王胖子隔着墨镜，再也看不见“沈祖祖”眼里曾如月牙弯起的笑意。\n黑瞎子看着他戴的墨镜，一度怀疑这是影分身。\n张起灵沉默注视，他认得那双眼睛，却不懂族人为何否认自己的身份。\n黎簇拽住他的衣袖，声音发颤：“小安哥，我没家了，你也不要我了吗？”\n张安坐在悬崖边，心想他要回家了，这些人又唱又跳的干什么。", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "同人"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿成财阀太子爷的作精前女友", "fullTitle": "穿成财阀太子爷的作精前女友", "link": "https://fanqienovel.com/page/7641635688978336792", "data": [73.39, 75.29, 78.09], "trend": 4.7, "latest": 78.1, "wordNumber": 315876, "creationStatus": 0, "desc": "「腹黑男人X娇气包｜双洁、甜宠」\n穿成财阀校园文里的恶毒女配，柯眠棠接到的任务是：半年内扮演好男主的女朋友，稳定他的反社会情绪，等原书女主出场后，然后拿钱走人，功成身退。\n男主荣涉，星云集团太子爷，白名单榜首。\n表面温润如玉，骨子里偏执病态，占有欲强到令人发指。\n柯眠棠每天战战兢兢地演着娇纵女友，生怕露馅。\n可来的第一天，她就被男主亲哭了。\n系统：“问题不大，别慌。”\n她信了。\n然而男主看她的眼神越来越不对劲，并非原著里对恶毒女配的冷漠，倒像是让人后背发凉的痴迷。\n系统又说：“别怕，小说结局是男主和原书女主在一起，既定结局。”\n她放下心来。\n后来，原书女主终于登场。\n但男主对那位真命天女兴趣淡淡，反倒对前女友兴致盎然。\n柯眠棠瑟瑟发抖：说好的原著里他会爱上原书女主呢？\n-\n终于，任务结束前一晚，她满心欢喜一亿到账。\n结果系统突然失联。\n重启后，终端程序直接被篡改，从“剧情纠正”变成了“爱上男主”。\n她懵了。\n一双大手从身后掐住她的腰，男人的呼吸落在耳畔，嗓音低哑带笑：“宝贝，你知道我为了留住你，有多辛苦吗？”\n他早在她穿来的第一天就发现了真相。\n立意：黑心的财阀继承人从不做亏本买卖。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "甜宠", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恋爱脑能传染？幸好我是个神经病", "fullTitle": "恋爱脑能传染？幸好我是个神经病", "link": "https://fanqienovel.com/page/7641990468129016857", "data": [29.63, 31.49, 32.89], "trend": 3.26, "latest": 32.9, "wordNumber": 340912, "creationStatus": 1, "desc": "冷脸萌x纯情骚＋沙雕整活+半截读心+皮肤饥渴+自我攻略\n姜灵焕穿进古早玛丽苏贵族学院文，绑定“反恋爱脑”系统，靠阻止全校磕cp、打击不文明恋爱行为续命：\n霸道少爷用广播强势示爱，全校磕爆！恋爱毒气暴涨！\n她把广播示爱爆改英语听力，全校萎掉：？这是什么脏东西\n还天天到处打击不文明恋爱行为：\n有人图书馆激吻，她将乒乓拍精准扔到两人嘴巴之间：“这不是你们的大床房。”\n有人泳池狠狠爱，她举着插线板放在泳池边：“再不出来，让你们做亡命鸳鸯。”\n有人树林里调情，她牵着几条狗冲进去：“别在小树林法天法地！”\n全校恋爱脑：姜灵焕是地狱来的魔鬼！！\n-\n姜灵焕日常被“恋爱毒气”侵扰，一被侵入就想找人亲嘴子。\n后来，她发现待在校草兼学生会会长的身边就能保持清醒，跟他碰一下，就能回血！接触越多，回血越快！\n于是，姜灵焕把谢风叙当充电宝，变着花样跟他制造接触。\n谁曾想谢风叙不仅有皮肤饥渴症，还能听见她的心声，还只能听一半！\n她内心：他手好大，感觉能一把握住我的头。胸肌练得不错。\n他听到：他手好大，感觉能一把握住我的…胸，不错。\n他：？她好变态\n她：？我冤枉啊\n后来，自我攻略的谢风叙在勾引姜灵焕的路上一去不复返，从闷骚到明骚！\n姜：你真的好骚啊！", "tags": ["现言脑洞", "现代言情", "校园", "系统", "穿越", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "算命亿点准，假千金被国家收编了", "fullTitle": "算命亿点准，假千金被国家收编了", "link": "https://fanqienovel.com/page/7621489476405054526", "data": [30.84, 32.22, 34.05], "trend": 3.21, "latest": 34.1, "wordNumber": 475889, "creationStatus": 0, "desc": "【假千金+国家团宠+群像+玄学+无cp+直播算命】\n\n　　时鸢是被抱错的假千金，亲子鉴定报告一出，养父母就迫不及待将她赶出豪门。\n\n　　亲生父母家里一穷二白，气运被偷，欠债千万！\n\n　　为还债，时鸢只能干起老本行，摆摊算命，当起了玄学主播。\n\n　　“大师，我想找我女儿。”\n\n　　时鸢：“你前脚出门，你重男轻女的婆婆后脚就把你女儿卖了，现在你女儿已经上了卖器官的手术台。”\n\n　　当晚警方破获一起跨省重大买卖器官案。\n\n　　“大师，我今年五十岁，想看看我和现在的男友有没有正缘。”\n\n　　时鸢：“你亲儿子联合你男友给你买了巨额保险，还要带你出去旅游上演消失的她。”\n\n　　苦主当即断亲报警，渣男和亲儿子被捕入狱。\n\n　　“大师，我发现我家墙壁有异响！”\n\n　　时鸢：“有异响就对了，十年前你杀了人藏尸在墙壁里，她现在出来找你了。”\n\n　　……\n\n　　只要时鸢一开播，全国警方蹲点吃瓜，靠着时鸢破获了一起又一起的重大犯罪案件。\n\n　　原本被夺走气运的亲生父母哥哥，也重新走上暴富巅峰！\n（不是全文都是直播，有主线剧情的哦）", "tags": ["现言脑洞", "现代言情", "团宠", "无CP", "群像", "风水秘术"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女靠捞金，撬了万人迷的男主", "fullTitle": "恶女靠捞金，撬了万人迷的男主", "link": "https://fanqienovel.com/page/7572216848263941144", "data": [35.16, 36.69, 38.0], "trend": 2.84, "latest": 38.0, "wordNumber": 1162489, "creationStatus": 1, "desc": "【上位者低头+高干+顶级拉扯】+【偏现实向】+【非甜宠文】+【没有龙傲天打脸，只有小人物的步步为营】\n沈念禾是一本“万人迷”小说里的恶毒女配，是女主完美人生的对照组。\n当她被男女主联手逼至绝境、濒死之际，一个名为“拜金系统”将她唤醒。\n它告诉她：唯有从那些气运加身的男主们身上获取金钱，才能汲取他们的气运，逆转家破人亡、惨淡收场的既定结局。\n从此，她收起无用的骄傲，步步为营，只为谋财。\n有人讥讽她拜金、浅薄、不择手段——\n她只轻笑反问：“这世间，谁不爱钱？”\n若有人说不爱，那大抵只是虚伪得不够坦荡。\n可她未曾预料，这场以金钱为名的清醒游戏里。\n那些曾视她为玩物、笑她为捞女、说她给女主提鞋都不配的“天之骄子”，竟一个个为她俯首，步步沦陷。", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "重生", "打脸"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际校园：五人小队向前冲", "fullTitle": "星际校园：五人小队向前冲", "link": "https://fanqienovel.com/page/7363859366488837182", "data": [26.65, 27.92, 29.13], "trend": 2.48, "latest": 29.1, "wordNumber": 1169247, "creationStatus": 0, "desc": "【军校+机甲+无cp+成长向+群像+轻幽默+五人团队+团魂】\n人生的前十七年，姜林的目标是考上明德机械工程系，成为未来高薪机甲师，但一场突如其来的变故让她前往黎明军校，走上了一条成为超强单兵的道路。\n三校联赛、实战演练、星际战斗……\n多年之后，五名意气风发的少年并肩站在废墟之上，成为三校当之无愧的最强小队。\n“加入黎明军校，是为了今日夺冠吗？”\n“不是，是为了以血肉之躯，再造黎明。”\n【小队介绍】\n姜林（女），单兵，182，敏捷型战斗机甲“擎风”，擅长近身作战，独狼，“一剑不行？多砍几剑总会好的”；\n权雅（女），后勤，165，不会做好吃饭饭的医疗兵，不是好后勤，“你的命，我用一碗佛跳墙买下了”；\n康尧（男），机甲师，175，看到人就烦但是会冷脸做机甲，说话难听天赋极高，皮脆容易被打死，“难听？更难听的话我还没说出口呢”；\n江鹰（男），单兵，191，中火力战斗机甲“重影”，擅长枪械炮弹，表面冷酷壮汉，实则腼腆饭桶，“你这事儿我办不了，请我吃饭？哦，那可以。”\n杨星（女），指挥，172，你有你的精神力，我有我的战术打法，赛场之上，“仅我一人，就可当千军万马”", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "星际", "无CP", "搞笑轻松", "群像"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成兽世恶雌：末世强者沉迷打怪", "fullTitle": "穿成兽世恶雌：末世强者沉迷打怪", "link": "https://fanqienovel.com/page/7525723826827578430", "data": [29.16, 29.67, 30.38], "trend": 1.22, "latest": 30.4, "wordNumber": 1095822, "creationStatus": 0, "desc": "【番外更新中】\n #27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书兽世：恶雌她终于吃上好的了", "fullTitle": "穿书兽世：恶雌她终于吃上好的了", "link": "https://fanqienovel.com/page/7627509785704811545", "data": [60.05, 59.34, 60.26], "trend": 0.2, "latest": 60.3, "wordNumber": 681560, "creationStatus": 1, "desc": "【兽世】+【雄竞修罗场】+【基建】\n沈湄穿进一本星际兽世大女主文，成了女主宁雪的对照组炮灰女配。\n书里的她，家世显赫，父兄宠爱，天赋惊人，除了长相普通点，处处都是优点。\n主脑刚给婚配了兽夫，结婚证还没焐热，海时代来临。\n曾经被争相追捧的毛茸茸陆地兽人一夜间沦为废兽，而曾被嫌恶满身腥气的水生兽人，成了炙手可热的生存保障。\n沈湄失去精神力，陆地兽夫无法入海捕猎，养活不了她。\n原主接受不了这个刺激，发疯了。\n租赁兽夫给别的雌性、逼迫兽夫当众跳求偶舞、将兽夫推进海里捕鱼……\n折辱、打骂、践踏，日复一日，极尽癫狂。\n最终众叛亲离，穷困潦倒，被海盗军团折磨分食。\n沈湄大骂原主变态，可一睁眼，穿到贩卖兽夫现场了！\n【“吃得超好系统”为您服务。请问，是否绑定？】\n吃得超好？吃什么？什么超好？\n后来，沈湄看着怼到眼前的胸肌、腹肌、大腿肌，陷入沉思。", "tags": ["现言脑洞", "现代言情", "系统", "星际", "穿书", "基建"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "山庄通异界古人来打工", "fullTitle": "山庄通异界古人来打工", "link": "https://fanqienovel.com/page/7547660999843662910", "data": [16.4, 16.38, 16.45], "trend": 0.04, "latest": 16.4, "wordNumber": 1622047, "creationStatus": 1, "desc": "简星夏大学毕业，继承了姥姥的农庄。\n只是这农庄地处深山，周遭杂草丛生，房屋四处漏水。\n简星夏拔草拔得怀疑人生，哀嚎：能不能来个人帮我拔草，修屋顶啊！\n下一秒，深山里钻出了个十二岁的古代小姑娘：拔草？小意思，野菜给我就行。\n面相五十多的瘦老头挑着扁担也来了：修屋顶砌灶台都不在话下，就是不知这个“水泥瓷砖”是何物。\n农庄庄主简星夏，费心心思按照“工资标准”给临时工们搭配报酬。\n几毛钱的感冒药，几块钱的红砂糖，还有农庄自产不要钱的野菜和野果，让临时工们满意而归。\n系统哐哐发奖：\n临时工满意度满分，奖励太阳能发电系统一套！\n临时工工作岗位增加，奖励神奇种子一包！\n临时工雇佣次数达标，解锁长期工岗位一个！\n简星夏：小小农庄拿下，大大山庄出发！", "tags": ["现言脑洞", "现代言情", "乡村", "系统"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纯人类在废土被疯狗哨兵强制圈养", "fullTitle": "纯人类在废土被疯狗哨兵强制圈养", "link": "https://fanqienovel.com/page/7629295095761603608", "data": [25.36, 25.43, 25.4], "trend": 0.04, "latest": 25.4, "wordNumber": 525793, "creationStatus": 1, "desc": "【疯哨文学+修罗场乱炖+强制爱+兔入狼圈+双生子+兄弟+男全c+救赎本+极致拉扯+xp之作】\n【ps：我的爱人是我的软肋，但我们绝非善类】\n\n这是她和十二个被隔绝于世界之外哨兵的故事。\n\n未来纪元999年，恒星坍塌，异形入侵，辐射风暴令所有动植物灭绝，人类移民火星，只留下觉醒为哨兵的极少部分人类驻守地球。\n\n冷冻休眠上百年的舒窈醒来后，觉醒为一名A级向导，被发配至东三区哨所驻守。\n\n东三区，绝对禁地，凶恶重重，曾经驻守的3名向导均离奇死亡。\n\n火星高层已经接近三十年未曾派遣过向导前往此区。\n\n“舒向导，祝您一切顺利。”\n\n漫天尘沙中，她来到了这座与世隔绝的孤独哨塔。\n\n他们都说，这里的哨兵是彻头彻尾的疯狗、变态、精神病！\n\n已经压抑在失控、狂躁、癫妄的边缘！\n\n“舒向导，别停。”\n\n“向导小姐，满意了么？我现在已经是你的狗了。”\n\n“姐姐，我的头好痛，帮帮我好不好？”\n\n....\n\n舒窈如一只小白兔惊慌逃窜，房门在身后合上，似乎将所有的疯子都隔绝于外。\n\n她捂着狂跳的心脏，企图在疯子的世界中寻找乌托邦。\n视界一片黑暗，耳前吹来一道酥麻幽哑的热气：\n“窈窕，该睡觉了…”", "tags": ["现言脑洞", "现代言情", "幻想言情", "末世", "星际"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "父王，开门！本郡主闯祸回来啦", "fullTitle": "父王，开门！本郡主闯祸回来啦", "link": "https://fanqienovel.com/page/7571356675811052568", "data": [37.33, 41.35, 43.19], "trend": 5.86, "latest": 43.2, "wordNumber": 1082481, "creationStatus": 1, "desc": "[轻松诙谐＋无CP＋日常＋团宠＋爽文＋沙雕＋女强＋群像＋权谋＋颠文]\n（简介无能，大家还是直接看正文吧）\n    自从端王府的独苗苗叶琼脑袋被驴踢中失忆后。\n    老纨绔端王好日子到头了。\n    别人家父慈子孝，端王府鸡飞狗跳。\n    叶琼不是在坑爹，就是在坑爹路上。\n    短短半月，不仅荣升为了京城纨绔之首，还成立了纨绔天团。\n    当别人琴棋书画时，叶琼忙着败家逛青楼。\n    当别人宫斗宅斗时，叶琼忙着吃瓜打架斗殴。\n\n    直到某天，众人发现那个臭名昭著的草包郡主，一跃成为了京城的顶流。\n    最火戏楼老板——是郡主。\n    最赚钱的拍卖行东家——是郡主。\n    最大的山匪头子——是郡主。\n    连江湖最厉害的门派门主——也是郡主。\n    百姓给郡主立长生牌，纨绔们认郡主为老大。\n\n    当众人抢皇位抢的火热时，\n    清点银票的叶琼看着自己钱也有了，人也有了。\n    好像不参与一下有点不合群。\n    于是，反手就把自己的跟屁虫小皇孙拎上了皇位。\n    比起皇位，她还是更喜欢当权倾朝野的摄政王。\n【注：不是正经宫斗权谋，本文走轻松诙谐风】", "tags": ["宫斗宅斗", "古代言情", "女强", "团宠", "搞笑轻松", "群像"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不是疯批反派吗？怎么红眼要抱抱", "fullTitle": "不是疯批反派吗？怎么红眼要抱抱", "link": "https://fanqienovel.com/page/7613718162839718937", "data": [83.97, 85.81, 86.14], "trend": 2.17, "latest": 86.1, "wordNumber": 731931, "creationStatus": 1, "desc": "【疯批阴湿反派×娇软小怂包】\n【穿书+1V1甜宠+上位者为爱当狗+强性张力占有欲】\n【苏软（江鹿伊）x晏沉】\n江鹿伊穿成了三集必死的恶毒女配苏软。\n开篇就是地狱模式，不仅滚错床单，还顺手给那位疯批反派开了瓢。\n苏软想逃，却被捞回怀里。\n“跑？晚了。”\n“作死是你开的头，怎么结束，得我说了算。”\n从此，京城皆知昭王晏沉养了只娇雀。\n捧在掌心，谁碰谁死。\n直到某天他发现，这只娇雀心里，竟还偷偷恋着原书男主。\n他疯了。\n红着眼将她困在臂弯，声音低哑，几近乞求：\n“以后，只看我一个人好不好？”\n“我比他会摇尾巴。”\n“汪汪……”\n说好的阴湿疯批呢？\n他怎么自己先当上狗了？\n【食用指南】\n1、女主是真的美，男主是真的疯。\n2、男主日常：在“发疯弄死所有人”和“摇尾巴求摸摸”之间反复横跳。\n
