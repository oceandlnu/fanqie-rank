<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

n但最后，他成了她的丈夫。\n在她最落魄，满怀怨恨时际，他甚至敢威胁她。\n廖晴忍无可忍了。\n周鸣山的死，除了她，所有人都只以为是天灾意外。\n她成了年纪轻轻的寡妇，可怜又悲哀。\n也因为周鸣山的死，廖晴如愿被家人宽容饶恕，过了一阵安生日子，这段时间，她极其安分守己，也惴惴不安。\n只因为周鸣山的身影总阴魂不散，日日入她梦中，恶鬼一般面目狰狞双眼赤红地紧盯着她不放，不知是在恨她，还是想杀了她，想将她拆之入骨。\n清明那夜，火光之下，日夜梦魇中的他步步靠近，还是来找她算账了。\n\nps：失忆梗，真坏女主，又坏又怕死，有点良知但不多，会把善良老实人男主逼疯，逼黑化，然后在挣扎扭曲中妥协（接受不了女主真做过坏事的就不看了哈，女主不太懂爱，男主疯爱）", "tags": ["职场婚恋", "现代言情", "日久生情", "打脸", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都市：一撞成婚", "fullTitle": "都市：一撞成婚", "link": "https://fanqienovel.com/page/7645558905812028441", "data": [2.94, 2.94, 2.88, 2.76, 3.25, 3.19, 3.11], "trend": 0.17, "latest": 3.1, "wordNumber": 214116, "creationStatus": 1, "desc": "夏沐在二十五岁那天和程氏集团总裁程青砚领证了。\n夏沐和柴珩相恋三年，今天是两人约定好领证的日子，夏沐在民政局等了一个小时，还不见柴珩的身影，她掏出手机给柴珩打电话，对方没接，随后给她发了一条消息：【对不起小沐，雪儿她生病了，我们改天再领证吧。】\n陆雪儿，柴珩的青梅竹马。\n夏沐看着这条消息，愣了半天，嘴角扬起一抹自嘲的笑容：“还是输了啊！”随后她收拾好自己的证件，转身朝着门外走去。\n程青砚刚下飞机，便被自己母亲的一通电话叫来了民政局，他走到门口，刚准备伸手去推门……\n夏沐一拉开门，便撞进了一个人的怀里，她鼻尖嗅到了一股淡淡的松木香气，\n“你没事吧？”\n头顶传来一道清透温润的声音。\n夏沐抬起头看着眼前的人，她眨了眨眼睛，“先生，有兴趣领个证吗？”", "tags": ["职场婚恋", "现代言情", "总裁", "先婚后爱", "豪门世家", "医生"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纹心尖", "fullTitle": "纹心尖", "link": "https://fanqienovel.com/page/7123541828854352934", "data": [3.55, 3.54, 3.53, 3.55, 3.55, 3.58, 3.62], "trend": 0.07, "latest": 3.6, "wordNumber": 266796, "creationStatus": 0, "desc": "【已签实体出版(✧∇✧) 进度见🧣】\n【纹身师×老师】【SC/HE】\n    沐妍心和祈骁第一次见面是在纹身店。\n　 第二次是在雨天，他给她递了一把伞。\n　 第三次，成了邻居。\n　  ……\n　 暗生情愫。\n　 而在祈骁开始计划展开追求的时候，沐妍心忽然对他说：“我们要不要结婚？”\n　 祈骁：“？”\n　 这是什么天降福利？？？\n　　\n     #痞帅纹身师VS温柔老师#\n　 #打破世俗偏见#\n　　——我们是世俗眼中的相反面，却成为了彼此最好的依靠。\n   （文中女主没有藏着掖着自己结婚的事。第一是因为突然的闪婚，男女主都需要适应的时间；第二是因为女主性格乖顺，身边的人也不相信她会闪婚。后面都会说清楚的，勿武断。）", "tags": ["职场婚恋", "现代言情"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [4.49, 5.2, 5.64, 6.39, 7.09, 7.51, 8.21], "trend": 3.73, "latest": 8.2, "wordNumber": 183044, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [4.15, 4.77, 5.19, 5.62, 5.77, 5.95, 6.09], "trend": 1.94, "latest": 6.1, "wordNumber": 177611, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [3.14, 3.48, 3.73, 4.08, 4.54, 4.85, 4.97], "trend": 1.84, "latest": 5.0, "wordNumber": 266889, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": [" 3.69, 3.79], "trend": 1.15, "latest": 3.8, "wordNumber": 292699, "creationStatus": 1, "desc": "[架空] [种田] [经商] [权谋] [金手指] [有cp]（cp出场比较后）\n（刚出评分，还会继续涨哦）新人新作品，请多多担待。\n李巧语因被医闹病人报复，穿越到古代，直到两岁才恢复记忆。\n家中虽在村里比较富裕，但每个人心思各异，李巧语只能默默苟住，学习手艺，偷摸赚钱。\n可惜在这个时代，女性终究地位低下，为了未来的幸福，她只好计划制造机会入赘高富帅。\n本来以为这漫长的岁月会按部就班进行。\n没想到村长家出了个福娃，村里人都说福娃就是运气好，肯定是神仙下凡。\n却没有看到福娃一捡东西，旁边的人就会倒霉。\n还有，三姐整天用看鬼的眼神看我干什么？哦，原来她是重生的！！？\n隔壁家的书生也满嘴“我命由我不由天，三十年河东...”", "tags": ["种田", "古代言情", "乡村", "空间", "医术", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [4.01, 4.46, 4.81, 4.88, 4.97, 5.04, 5.08], "trend": 1.07, "latest": 5.1, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。", "tags": ["种田", "古代言情", "空间", "医术", "古色古香", "代嫁代娶"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带异能穿女尊开局被退婚？", "fullTitle": "带异能穿女尊开局被退婚？", "link": "https://fanqienovel.com/page/7648884503930227736", "data": [2.46, 2.59, 2.75, 2.88, 3.05, 3.17, 3.21], "trend": 0.75, "latest": 3.2, "wordNumber": 254318, "creationStatus": 1, "desc": "【女尊＋空间＋逃荒＋科举＋1vn】\n末世第八年，江言昭被同父异母的妹妹从背后捅了一刀。\n\n再睁眼，她成了女尊国一个刚被退婚的穷书生。未婚夫嫌她体弱多病、科举无望，上门撕了庚帖。她反手把退婚书撕了，先敲了柳家十两银子。\n\n大旱后，村里颗粒无收。她带着全族人逃荒，一路打土匪、找水源、分粮食，从清河村走到青州府，把一条绝路硬生生走成了活路。\n\n空间还在，异能也在，而接下来，她要科举，要做人上人。\n\n而那个前世为她殉情的人，正红着眼睛问她：\n\"姐姐，我能排在第一个吗？\"\n\n她答：\"不管未来几个男人，你永远会是我的例外和偏爱。\"", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糠逆袭后，前夫九族悔哭了", "fullTitle": "糟糠逆袭后，前夫九族悔哭了", "link": "https://fanqienovel.com/page/7646611978152070206", "data": [3.62, 4.04, 4.26, 4.49, 4.62, 4.53, 4.33], "trend": 0.71, "latest": 4.3, "wordNumber": 272665, "creationStatus": 1, "desc": "和离后，姜小满得到了天大的机缘。\n\n洗筋伐髓，一夜回春。\n那张被二十年苦日子熬出来的蜡黄老脸，脱胎换骨，肌肤胜雪，花容月貌，比十六岁出嫁那年还美上十分。\n\n种灵草，炼仙丹，荒山变宝山。\n全省大旱，颗粒无收，她的灵稻却绿浪翻涌，逆天丰收。\n\n一颗丹药在京城卖出万两天价，求药的人从青岩山排到了城门口。\n\n前夫一家跪在她门前磕头认错。\n她正坐在院子里数银子，头也没抬，只淡淡说了句：“别挡光。”", "tags": ["种田", "古代言情", "乡村", "幻想言情", "空间", "发家致富"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越后自称汉族，后来我的国来了", "fullTitle": "穿越后自称汉族，后来我的国来了", "link": "https://fanqienovel.com/page/7643332690896227352", "data": [3.98, 4.43, 4.76, 4.92, 5.01, 4.93, 4.66], "trend": 0.68, "latest": 4.7, "wordNumber": 267819, "creationStatus": 1, "desc": "【无cp+古代穿越】\n沈清一朝穿越异世，逃荒路上众人排挤戒备，为在古代求生，对外谎称出身隐世大族。\n落脚于安置点时，开了间食肆，本想安安稳稳过日子，不想却救济了万民。\n宗室子弟肆意残害百姓，种种恶行令人发指。\n众人眼中最为善良、去牙行挑人都哭跑出来的沈娘子，破口大骂，众人纷纷表明从没听过这么脏的话。\n有人上前攻击，女主将手中器物猛地掷出，轰然一声炸响，震慑全场。\n“吾乃汉族，维天有汉，鉴亦有光，你们岂敢动我。”\n后期国家来了，女主的心态彻底发生变化。", "tags": ["种田", "古代言情", "穿越", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.18, 2.28, 2.33, 2.45, 2.58, 2.68, 2.71], "trend": 0.53, "latest": 2.7, "wordNumber": 240066, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "笨蛋美人挺孕肚，搬空全京去流放", "fullTitle": "笨蛋美人挺孕肚，搬空全京去流放", "link": "https://fanqienovel.com/page/7647142493472951321", "data": [2.26, 2.43, 2.6, 2.88, 2.88, 2.82, 2.69], "trend": 0.42, "latest": 2.7, "wordNumber": 261464, "creationStatus": 1, "desc": "【种田+天灾+流放+虐渣+搬空+空间】\n修真界符阵宗师南穗穗渡劫失败，穿成临安侯府人人嫌弃的痴傻庶女，被迫替嫁给身中剧毒、双腿残疾的短命宁王冲喜。\n新婚夜，宁王剑指咽喉：“说，皇后派你来做什么？”\n南穗穗软乎乎歪头：“哥哥，要吃糖糖吗？穗穗有甜甜的糖糖哦……”\n宁王：……（这怕不是个真傻子？）\n婚后次日，南穗穗察觉王府死气萦绕，掐指一算，十日之内必遭抄家流放！\n南穗穗冷笑一声，反手画下百张搬运符，连夜搬空侯府，顺便将国库、帝后私库一扫而空！\n短短十天，她不仅囤够亿万物资，还顺手解了宁王的毒，揣着双胎崽崽踏上流放路。\n流放途中，别人啃树皮，她吃香喝辣，极品来找茬，宁王开启极致护妻模式。\n宁王：“我家夫人身怀六甲，谁敢惊着她，本王要谁的命！”\n被自家老祖宗显灵揍得脸肿如猪的仇家痛哭：“王爷！她召我老祖宗上来抽了我三百个巴掌，到底谁惊着谁啊？！”\n宁王：“我家夫人最怕打雷，一听雷声就往本王怀里钻。”\n被劈得外焦里嫩的刺客们嚎啕大哭：“王爷！那追着我们劈了三天三夜的九天玄雷就是她招来的！我们被劈成黑炭，她挺着大肚子在旁边用雷火烤红薯，这叫怕打雷？！”\n……\n柔弱是装的，满级大佬是真的，搬空全京去流放是让狗皇帝哭爹喊娘的！", "tags": ["种田", "古代言情", "空间", "虐渣", "天灾", "代嫁代娶"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成小丫鬟，靠梳妆赎身暴富", "fullTitle": "穿成小丫鬟，靠梳妆赎身暴富", "link": "https://fanqienovel.com/page/7564256304332557336", "data": [2.83, 2.89, 2.94, 2.97, 3.09, 3.15, 3.21], "trend": 0.38, "latest": 3.2, "wordNumber": 291844, "creationStatus": 1, "desc": "观看指南：【非爽文+架空北宋+微群像+市井经商+微宅斗+家长里短+日常流】\n林丰穗穿到北宋，成了八岁小丫头，喜提知州府上「家生子」身份。\n娘是灶上的厨娘，爹是账房贴书，前边还有个大她两岁的绣娘姐姐。\n老娘是灶上摸油水的高手，好的孬的全塞兜里。\n姐姐绣活一般，嘴皮子极好，哄的管事眉开眼笑，多出的边角料通通拎回家。\n家里边只剩个老实爹，半点不敢马虎手里的账。\n丰穗到了年纪要学门手艺，全家人跳出来支招。\n娘说：厨房干活是冬冷夏热，不行！\n姐说：绣娘的活计不分昼夜，别干！\n爹说：账房么，识字算术，不差分厘，还行！\n丰穗心想：学，都学，但还得靠重操旧业稳妥。\n“娘子，梳妆吗？”\n不不不，搞错了！八岁大的人应该先拜师学艺。\n谨小慎微是安身立命的前提。\n赚钱赎身，身兼数职是常态。\n伺候主子饮食起居，还得起早贪黑，制那面脂香膏、胭脂水粉上街兜售。\n苦点累点都没事，只要能挣脱这脖子上的枷锁。\n一家人齐整出府，置上一间小院，做些经济买卖，自由自在的过红火日子，便浑身都是劲。\n日子能过好，就别让其糟下去。\n立意：自由、奋斗、自强则万事顺，向阳而生。", "tags": ["种田", "古代言情", "穿越", "今穿古", "发家致富", "群像"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.77, 2.72, 2.71, 2.73, 2.73, 2.79, 2.83], "trend": 0.06, "latest": 2.8, "wordNumber": 224143, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [6.09, 6.57, 7.06, 7.83, 7.83, 8.82, 9.03], "trend": 2.94, "latest": 9.0, "wordNumber": 229690, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [2.94, 3.13, 3.32, 3.55, 3.82, 3.85, 3.91], "trend": 0.97, "latest": 3.9, "wordNumber": 270501, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主为爱发疯，但你只想好好活着", "fullTitle": "男主为爱发疯，但你只想好好活着", "link": "https://fanqienovel.com/page/7652408518770691096", "data": [6.49, 6.16, 6.35, 6.52, 6.54, 7.0, 7.36], "trend": 0.88, "latest": 7.4, "wordNumber": 251397, "creationStatus": 1, "desc": "【强调：本文为黑泥向纯代入乙女，有大量g向恐怖描写，男主神经病非人类较多，不要用正常三观对待】\n穿越后，你没有得到金手指，也没有万人迷光环，甚至被某个变态给缠上了。\n什么？他是气运之子，天道宠儿？\n可这个世界是疯掉的世界，气运之子也都是疯子。\n所以你选择了逃跑。\n那就请在保住命的情况下确保自己不被抓住吧。\n\t\n他说他会吃掉你，从头到脚，拆吃入腹。", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [2.92, 2.9, 2.98, 3.34, 3.34, 3.55, 3.65], "trend": 0.73, "latest": 3.7, "wordNumber": 235719, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "幻想言情", "反派", "穿书", "古代言情", "团宠"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法：被迫组队后高冷队长沦陷了", "fullTitle": "魔法：被迫组队后高冷队长沦陷了", "link": "https://fanqienovel.com/page/7649235070481353753", "data": [7.33, 7.14, 6.83, 6.89, 6.89, 7.67, 7.95], "trend": 0.62, "latest": 7.9, "wordNumber": 231908, "creationStatus": 1, "desc": "【高智商傲娇巫族公主VS高冷禁欲灵族公爵】\n魔法+言情+团队救世\n朗瓦西星球有三类人：会魔法的灵者、作战强的曜士、通巫术的巫主\n三千年前，灵、曜两族诞下五灵守护者，对灭世的不死女巫艾拉进行世代封印\n三千年后，新一届守护者诞生，五位圣灵者肩负救世使命。\n巫族公主蒂泠，出了名的任性，翘课、炸学校、学禁术\n然而，一则消息震惊世界\n蒂泠成了三千年来第一位来自巫族的圣灵者——智之灵\n让“恶霸”拯救世界？\n众人：谁说看不见星球的未来？这不是一眼就看到头了\n灵息学院，\n所有人都想进的三族最强学府，一心摆烂的蒂泠被强制保送\n灵息优等生缪辞，是灵族最年轻的公爵，也是众望所归的五灵守护者队长玄之灵\n蒂泠来前：高冷，沉稳，尽在掌握\n蒂泠来后：头疼，善后，怀疑人生\n算了，赶紧封印艾拉，大家好聚好散\n…\n一次意外，蒂泠灵印消失，决定独自离开。\n黑暗的房间内，她被吻的喘不过气，用力推开他，“队长，我不是圣灵者了，好聚好散吧。”\n男人眼尾浸红，额头贴着她的耳朵，薄唇轻吻她的脸颊，“你觉得呢？我的公主殿下。”\n撩也撩了，摸也摸了，要负责了，人就跑了\n女孩理亏的偏过头，缪辞都气笑了，指尖扣住她的下颌，迫使她面对自己，学着她曾经恶劣的语气\n“不接话？那就接吻。”", "tags": ["玄幻言情", "校园", "幻想言情", "星际", "冰山", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "休了四个兽夫后，我契约了六个", "fullTitle": "休了四个兽夫后，我契约了六个", "link": "https://fanqienovel.com/page/7557391657260289086", "data": [4.38, 4.41, 4.42, 4.54, 4.77, 4.86, 4.99], "trend": 0.61, "latest": 5.0, "wordNumber": 250445, "creationStatus": 1, "desc": "（穿越+大佬+兽魂+强制契约+升级流+1vN）\n林清蕴修炼千年的灵符师，穿到第一天，以为自己拿的是女强爽文剧本。\n直到她低头一看——无灵根，蜗牛兽魂，凡品垫底。\n四个契约兽夫嫌她废物，把她扔在贫民区铁皮房里自生自灭。\n亲妈把她扫地出门，亲妹设局陷害，路过的人都要啐一句“丢人”。\n林清蕴：“……这剧本不对吧？”\n还没等她反应过来，直接被驱逐青云城，四名兽夫更是要解除契约。\n怂是不可能怂的，解，必须解，留着你们这些白眼狼干嘛？\n所有人都等着她死在城外。却不知她体内藏着上古紫凤兽魂。\n当晚六道契约天光散落大陆\n冰霜巨龙的主人低笑：\"魂契?有意思。\"\n地下黑场的铁塔硬汉红着眼眶：\"有人要我了?\"\n最高监狱里，锁链寸断的少年抬起头，露出一双极深的凤眸。\n而轮椅上的男人，捻着一朵蓝楹花，笑得温润如玉：\"妻主?\"\n林清蕴：......我现在退契还来得及吗?男人，只是取悦她的工具罢了。", "tags": ["玄幻言情", "幻想言情", "穿越", "大佬", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.02, 7.33, 7.11, 7.63, 7.63, 7.85, 7.62], "trend": 0.6, "latest": 7.6, "wordNumber": 171658, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\n——\n阮吱吱回到现实世界，不知为何，时常想起那个肆意潇洒的少年人。\n系统再次出现:【检测到男主黑化值过高，即将毁灭世界！】\n什么？\n他居然这么爱自己！\n怀着微妙情绪，阮吱吱回到书中世界，又一次见到他。\n少年穿着喜服，神情阴霾，手里拿着绳索，缓步而来。\n阮吱吱紧张，“裴厌，我可以解释，你别囚禁我——”\n她被扭断了脖子。\n倒在地上刹那，她见到的是少年把藏着的女孩抓出来，低声威胁:\n“贺喜，你再敢逃婚试试？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿书", "异世穿越", "黑化"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废柴辅灵师神眼十万里异世做锦鲤", "fullTitle": "废柴辅灵师神眼十万里异世做锦鲤", "link": "https://fanqienovel.com/page/7657127010971438104", "data": [3.02, 3.21, 3.39, 3.67, 3.67, 3.47, 3.47], "trend": 0.44, "latest": 3.5, "wordNumber": 132936, "creationStatus": 1, "desc": "退婚摔泥坑？觉醒神眼+锦鲤气运，废柴辅灵师直接躺赢异世！\n捡个墨家高冷战神，可惜对方是顶级非酋，从此大佬靠我运气活命。\n不内卷不斗争，炼丹开店环游大陆，算计我的人，最后全都自己翻车。", "tags": ["玄幻言情", "幻想言情", "穿越", "异世穿越", "冰山", "大佬"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "生子系统：家族帮我攻略极品男神", "fullTitle": "生子系统：家族帮我攻略极品男神", "link": "https://fanqienovel.com/page/7654551840356322366", "data": [3.33, 3.5, 3.7, 3.85, 3.85, 3.58, 3.43], "trend": 0.11, "latest": 3.4, "wordNumber": 195693, "creationStatus": 1, "desc": "【背景强大+系统上交+生子+团宠+轻松搞笑+反套路+男全c】\n#论把生子系统上交母皇后#\n#我的舅舅们疑似在仙界搞人口贩卖#\n夏念安胎穿九天仙界，成了大夏女帝唯一子嗣。\n好消息：背景逆天，亲娘是大帝，舅舅准帝起步，真仙界顶级二代。\n坏消息：她无法修炼，被全仙界当成后继无人的笑话。\n刚满十八岁，【多子多福】系统激活还觉醒了完美生育圣体！\n只要和高品质男神生娃，就能奖励拿到手软，家族实力原地起飞！\n夏念安：“？”\n 自己找人攻略太累了，夏念安果断决定把系统上交家族！\n从此，画风突变。\n霸道女帝亲娘和准帝舅舅们，扛着聘礼（麻袋）满世界为她抢亲。\n“浮玉山的白虎神子长在念安审美点上，抢来！”\n“魔族皇子身强体壮，抱走！”\n“小孩子才做选择，我外甥女全都要！”", "tags": ["玄幻言情", "系统", "团宠", "大小姐", "搞笑轻松", "胎穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "叹金缕", "fullTitle": "叹金缕", "link": "https://fanqienovel.com/page/7629335999511792702", "data": [5.38, 5.95, 6.42, 6.98, 7.32, 7.13, 7.05], "trend": 1.67, "latest": 7.1, "wordNumber": 240461, "creationStatus": 1, "desc": "谁为嫡子？谁承宗事？\n自己这个正室嫡出，刚一出生就成了嫡次子，被已经记名的庶长子压了一头。\n沈照禅不大高兴。\n记名长子订亲太傅费氏。\n费氏女进门，亲娘郭氏婆婆的款儿还没摆，费氏眼珠一转先把沈照禅整得不得不离家。\n亲娘郭氏肝肠寸断，从此仿佛换了一个人，沈家乱象起。\n从沈照禅不得不入宫开始……到他一身紫袍，立于金阶之上，俯瞰群臣为止。\n十年亲如是，十年起伐异，几经生死，散尽亲友", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "入宫即高位，我是陛下表妹我怕谁", "fullTitle": "入宫即高位，我是陛下表妹我怕谁", "link": "https://fanqienovel.com/page/7648256759785589784", "data": [54.63, 54.43, 54.05, 54.37, 54.37, 55.72, 56.2], "trend": 1.58, "latest": 56.2, "wordNumber": 230548, "creationStatus": 1, "desc": "宫斗+伪表兄妹+极限拉扯+攻心+训狗\n（新文，评分会涨的）\n昭启十年春。\n沈嘉玉被召入宫中，成了天子的妃妾。\n彼时后宫表面看似风平浪静，实则利害缠杂、暗流潜行。诸妃之间明争暗斗，百般算计，刚入宫的新秀们战战兢兢，只怕一个不小心，便会命丧黄泉。\n唯有沈嘉玉淡淡一笑，表示这有什么？\n不爽就打，不服就干。\n她有的是甩巴掌的力气和资本。\n今天打了有宠的容华！明天打了得势的贵嫔！后天更是打了掌权的四妃！\n整个后宫被她搅了个天翻地覆。\n沈嘉玉丝毫不惧。\n她是陛下表妹她怕谁？！\n毕竟，她和陛下之间的羁绊实在太深了。\n没了爱意，还有情分，没了情分，还有血缘。\n*\n对于这位娇纵表妹入宫，\n一开始寡情疏冷的帝王：金尊玉贵养着，别亏待委屈她就行。\n后来逐渐失控破防的帝王：朕那么喜欢你，你凭什么敢不喜欢朕！\n再后来，这位权御九州的帝王，匍匐在她的裙下，俯首称臣，卑微求爱。\n*\n阅读指南:封建大爹帝王vs娇纵跋扈表妹", "tags": ["宫斗宅斗", "古代言情", "皇后", "甜宠", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被威胁后，我成了摄政王的掌中娇", "fullTitle": "被威胁后，我成了摄政王的掌中娇", "link": "https://fanqienovel.com/page/7647961721784519742", "data": [3.79, 4.29, 4.58, 4.6, 4.6, 4.74, 4.61], "trend": 0.82, "latest": 4.6, "wordNumber": 163196, "creationStatus": 1, "desc": "娇气包x活阎王 /甜宠 /双洁  /一见钟情 /男主宠妻无度\n沈初妘，国公府次女，圣上亲封的华瑶郡主。自小受尽宠爱，是出了名的娇气难养。\n没人敢摘下这朵娇花，可偏偏大周的活阎王却把这朵娇花摘了下来护在怀里。\n谢迟渊，大周异姓摄政王，执掌禁军三十万，杀伐果断、冷血无情，是出了名的活阎王。\n初见时他被人追杀，浑身浴血闯进她的院子，捂住她的嘴：“听话些，不然杀了你。”\n小姑娘吓得眼泪直掉：“你别杀我……我听话。”\n谢迟渊轻嗤：“胆子真小，像个兔子。”\n后来，这只兔子被叼进了狼窝，成了摄政王妃。\n人人都以为娇气包遇上活阎王，必定被折磨得哭回家。可谁知沈初妘被他养得更娇气了。\n邻国使臣想献公主给摄政王当侧妃，话刚出口，谢迟渊一箭射穿他头顶的发冠。\n当天下朝回府，谢迟渊发现王妃不见了，桌上摆着和离书。“王妃呢？”管家颤颤巍巍地说：“王妃回国公府了。”\n国公府内，沈初妘正掉眼泪。谢迟渊翻窗而入，一把将她捞进怀里亲：“夫君只要你一个人。”\n沈初妘红着眼眶瞪他。他抵着她的额头，声音低哑：“妘儿原谅夫君，好不好？”\n她别过脸：“谁要你翻窗了？”\n谢迟渊低笑：“可是本王就是愿意翻王妃的窗，翻一辈子。”", "tags": ["宫斗宅斗", "古代言情", "王妃", "双洁", "团宠", "一见钟情"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "觊觎臣妻：清冷权臣不装了", "fullTitle": "觊觎臣妻：清冷权臣不装了", "link": "https://fanqienovel.com/page/7650103887151500350", "data": [3.98, 4.06, 4.25, 4.61, 4.59, 4.66, 4.71], "trend": 0.73, "latest": 4.7, "wordNumber": 229414, "creationStatus": 1, "desc": "（刚开分，后期会涨）\n【强取豪夺＋臣妻＋高岭之花下神坛＋步步为营】\n大靖朝权倾朝野的大司马裴修晏，世人皆道他清冷自持，如悲悯众生的神佛。\n温眠棠也深以为然。\n她本是七品御史沈子煜的娇妻，只想在夫君的羽翼下安稳度日。\n沈子煜以为自己遇到了青天大老爷。\n权倾朝野的大司马裴修晏赏识他，提拔他，甚至连他递上去的折子都亲自圈阅夸赞。\n他发誓要结草衔环，报答侯爷的知遇之恩。\n直到某日，他身陷重案，即将面临满门抄斩的死局。\n走投无路之下，温眠棠只能在那个大雨滂沱的深夜，跪在权倾朝野的大司马府前求情。\n书房门开，那尊玉雕般的圣人缓步而出，温眠棠衣衫尽湿，跪倒在那个清冷端方的男人脚边。\n男人用微凉的指腹勾起她的下巴。\n“求我？”男人的声音温醇如酿，眼底却翻涌着她看不懂的疯狂，“夫人打算拿什么来换沈大人的命？”\n温眠棠这才知道，夫君的死局，不过是这位圣人为了引她入笼，亲手布下的一场天罗地网。", "tags": ["宫斗宅斗", "古代言情", "一见钟情", "情有独钟"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "萌宝团团一开口满朝文武都跪了", "fullTitle": "萌宝团团一开口满朝文武都跪了", "link": "https://fanqienovel.com/page/7648189270460484670", "data": [11.11, 11.6, 11.87, 12.19, 12.35, 12.18, 11.65], "trend": 0.54, "latest": 11.7, "wordNumber": 290303, "creationStatus": 1, "desc": "【刚出分，会涨的，放心观看～】沈团团五岁那年，侯府要把她卖给老王爷冲喜。\n她抱着包袱坐在门槛上，认真问亲爹。\n“爹，冲喜包吃吗？”\n落魄侯爷沈宴辞沉默三息。\n然后抱起闺女，连夜敲登闻鼓。\n满京城都笑他疯了。\n一个废侯爷，带着一个奶团子，能翻出什么浪？\n结果团团一开口，二房私吞爵产。\n团团二开口，老夫人伪造遗嘱。\n团团三开口，朝中三位大人齐齐变脸。\n皇帝本想看热闹。\n看着看着，发现这小团子嘴里全是大案。\n从此父女俩成了京城最怕见的人。\n别人上朝带奏折，沈宴辞上朝带闺女。\n别人查案靠刑讯，他查案靠团团吃瓜。\n父女俩一路闯祸，一路打脸。\n最后满朝文武哭着求皇帝：别让那孩子说话了！", "tags": ["宫斗宅斗", "古代言情", "虐渣", "打脸", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "女频衍生", "score": 5, "reasons": ["7日增长+48.4万", "竞争系数低(4.9)"], "total19": 182.2, "growth": 36.2, "abs_growth": 48.4, "coeff": 4 情配角。\n只有陆斯年自己知道，所有体面都是装出来的，骨子里早烂透了。", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "豪门世家", "久别重逢"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [6.84, 7.94, 9.03], "trend": 2.19, "latest": 9.0, "wordNumber": 175467, "creationStatus": 1, "desc": "（新书 刚开评分）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“……要。”\n\n她是他的血养出来的妖，也是他这辈子唯一的因与缘。\n（女主控放心观看，纯甜无虐）\n（很甜！！甜的发腻！！不爱看甜的勿入）", "tags": ["现言脑洞", "现代言情", "双洁", "精灵", "幻想言情", "双向奔赴", "情有独钟"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越星际兽世：成为虚拟偶像顶流", "fullTitle": "穿越星际兽世：成为虚拟偶像顶流", "link": "https://fanqienovel.com/page/7655195003299318809", "data": [8.53, 8.98, 9.54], "trend": 1.01, "latest": 9.5, "wordNumber": 186951, "creationStatus": 1, "desc": "【星际兽世+主事业线无CP+非女强文，妹宝女主（有明月独不照我情节）+雌少雄多+万人迷+雄竞+系统】\n云岁穿越到了雌少雄多的星际兽世。\n\n\n\n云岁穿越前身体已经火化。\n\n系统绑定她后，用最后能量保住了她的灵魂带她穿越，要重新造出身体需要100亿星币能量。\n\n由于系统规则，虽然它的科技水平大于这个世界的水平，却不能做违法乱纪的事情，只能云岁自己想办法赚钱获得身体。\n\n云岁眼前一黑，虽然不知道1星币多少钱，但100亿就让人感觉人生无望了，其实当阿飘挺好的。\n\n系统却告知由于雌性在星际兽世过于稀少，现在很流行虚拟偶像，是大流量，操作好会很赚钱。\n\n云岁为了拥有新身体，注册了成为恋爱向虚拟偶像。\n\n想原来世界，恋爱向抽卡类虚拟偶像都很赚钱，云岁磕绊在系统的掩护下大胆出击，给这个荒芜的精神世界带来一次次的精神盛宴。\n\n每一次的打歌，舞台，综艺，影视，联动，都引爆全网。\n\n后来云岁拥有了最大的后援会。\n\n云岁生日当天全国大屏庆生。\n\n云岁联动全星铁刷屏。\n\n成星际兽世第一顶流。\n\n众多位高权重的大人物不相信怎么完美的云岁是虚拟偶像，世人觉得他们疯魔，查探证明她是真的，结果越扒越有！\n最后云岁掉马。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "星际", "无CP"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "人类饲养员：自己的老婆自己养", "fullTitle": "人类饲养员：自己的老婆自己养", "link": "https://fanqienovel.com/page/7657302630409964569", "data": [10.35, 10.77, 11.13], "trend": 0.77, "latest": 11.1, "wordNumber": 129890, "creationStatus": 1, "desc": "【新书刚开分，后面会涨】\n好吃懒做怂包女主VS严谨到变态的外星男主\n【人外，强制爱，触手】\n昭晨好被包养了，不对，被饲养了。\n也不对，准确来说，是被一个不明生物饲养了。\n这个有着人类外表却时不时能够变换形态的“人”强行带走她，成为了她的饲养员。\n为了照顾好她，严格地按照人类饲养手册执行。\nViner：必须早睡早起。\n长期日夜颠倒的昭晨好：“……”\nViner：一日三餐必须吃。\n饮食毫无规律的昭晨好:“……”\nViner：要适当的运动。\n能躺绝不坐着的昭晨好:“喂！这算哪门子运动！”\nViner一本正经：“适当的亲密关系运动也是运动。”", "tags": ["现言脑洞", "现代言情", "幻想言情"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [5.18, 5.61, 5.86], "trend": 0.68, "latest": 5.9, "wordNumber": 222407, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漂亮笨蛋穿成恶女配！夜夜被亲哭", "fullTitle": "漂亮笨蛋穿成恶女配！夜夜被亲哭", "link": "https://fanqienovel.com/page/7653869565612411928", "data": [8.77, 9.34, 9.36], "trend": 0.59, "latest": 9.4, "wordNumber": 169579, "creationStatus": 1, "desc": "【万人迷不自知+雄竞+强制爱+体型差+男洁】\n【可爱迷人娇憨糊涂蛋×阴湿男鬼/疯批/病娇】\n苏桃一睁眼，穿成三本男频文的恶毒女配。\n【系统：你是绿了未来大佬（学霸版）的捞子前女友；践踏落难太子爷的势利未婚妻；潜规则顶流未遂，便雪藏的黑心老板。你的任务是欺辱男主，刺激他们逆袭。】\n苏桃结结巴巴：“我我不行，你换个人吧。”\n【系统：只要男主成功逆袭，保你发财。】\n于是，史上最窝囊恶毒女配出现了。\n她边掉小珍珠边扇男主：“穷光蛋！”\n男主握住她颤抖的手，眸光微暗：她手好香。\n她哆哆嗦嗦对男主伸脚，声音越来越小：“把我鞋子舔干净，不然我退婚。”\n男主喉结滚动：“别的地方，不需要*干净吗？”\n她发消息威胁男主：“来我房间，不然雪藏你。”\n男主深夜敲门：“姐姐开门。”\n苏桃：“我在欺负你们啊！看不出来吗？”\n殊不知她红着眼眶装凶的样子，比撒娇还勾人。\n\n—小剧场—\n眼看剧情崩坏，苏桃拿着当初天使投男主赚的巨款连夜跑路，可还是被男主们找到了。\n苏桃：“我以后再也不欺负你们了。”\n男主：“你必须继续欺负。”\n后来，被欺负得死去活来的，是她。\n\n【阴湿男鬼高岭之花学霸】\n【被欺上瘾腹黑恶犬太子爷】\n【又争又抢白切黑病娇年下】", "tags": ["现言脑洞", "现代言情", "系统", "学霸", "腹黑", "病娇"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "唯一人类在兽世，当养成虚拟偶像", "fullTitle": "唯一人类在兽世，当养成虚拟偶像", "link": "https://fanqienovel.com/page/7642136290401471512", "data": [16.51, 16.59, 16.55], "trend": 0.03, "latest": 16.5, "wordNumber": 164234, "creationStatus": 1, "desc": "【万人迷+雄竞+修罗场+玛丽苏+多男+男全洁】\n\n十万个兽人里面，才能降生一个雌性。\n江月白穿越到星际兽世，整个人都傻眼了。\n\n倒不是受不了悬殊的男女比例，而是她处境格外尴尬。\n身为纯种人类，身形娇小，没办法幻化兽形，也感知不到任何信息素，被认定为了残疾兽。\n只能靠着拾荒勉强糊口过日子。\n\n江月白索性放手一搏，打算注册星网账号，做这个世界不被认可的养成系虚拟偶像。\n……\n雄性兽人都格外关注雌性相关动态，却十分抵触虚拟账号。\n这类账号全是雄性运营，根本没人愿意为此消费，甚至还会遭到攻击。\n江月白的账号，刚上线就遭到不少谩骂吐槽。\n直到她发出一张图，小小的雌性蜷缩在昏暗角落，配上简简单单一句：\n月月好饿。\n这下直接引爆全网，无数兽人看的心软动容。\n帝国元帅豪气打赏：“给我的月月买大房子！”\n神圣祭司稳居榜一，满心惦记发问：“月月动态怎么还没有更新？”\n皇族太子更是出面撑腰：“谁敢随意抹黑月月！等着瞧！\n……\n江月白捞够就想跑，害怕自己人类身份暴露。\n谁料刚踏出家门，就被身形挺拔的雄性一把抵在墙上，对方语气满是激动：\n“月月，原来你真的是雌性！”", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "星际", "养成"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "丰腴媳妇不作了，糙汉打脸真香了", "fullTitle": "丰腴媳妇不作了，糙汉打脸真香了", "link": "https://fanqienovel.com/page/7648274238557654041", "data": [13.89, 18.32, 19.54], "trend": 5.65, "latest": 19.5, "wordNumber": 263351, "creationStatus": 1, "desc": "服装设计师姜蜜熬夜猝死，一睁眼穿成了年代文里的极品作精村妇。\n原主顶着十里八乡最绝色的脸，却长了个草包脑子。\n放着任劳任怨、能赚能打的糙汉老公不要，把家底掏空去倒贴小白脸知青，甚至一哭二闹三上吊逼着离婚。\n按原书剧情，她离了婚就被渣男卖进深山，被折磨得连个全尸都没留下！\n母胎单身的姜蜜连连摆手：这作死剧本谁爱要谁要！\n满肚子坏水的细狗知青？滚一边去！把骗她的钱连本带利全吐出来！\n嚼舌根看笑话的长舌妇？不好意思，我当场发疯教你做人！\n至于那个表面冷酷无情实则纯情护短的糙汉老公……当然是关起门来好好撩拨！\n\n全村人都搬好小马扎，等着看贺家那个作精婆娘被扫地出门，笃定她肯定要跟小白脸私奔。\n可谁知左等右等，只等来贺家顿顿飘出诱人的肉香，日子越过越红火！\n原本嫌她恶心的冷面糙汉，更是化身无底线“护妻狂魔”。\n有人眼红挑拨：“铮哥，你媳妇以前可是天天惦记野男人……”\n话没说完，贺铮一脚踹碎水缸，霸气护妻：“滚！老子愿意给媳妇当牛做马，谁敢说她一句不是，老子打断他的腿！”\n夜里。\n那个打起架来不要命的野男人，却将娇柔的小媳妇圈在怀里，双眼猩红，嗓音哑得要命：“媳妇，这可是你先招惹我的，说好了一辈子，少一天都不行……”", "tags": ["年代", "现代言情", "乡村", "穿越", "护短", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越七零，我成了女主的恶毒继姐", "fullTitle": "穿越七零，我成了女主的恶毒继姐", "link": "https://fanqienovel.com/page/7645293690532924440", "data": [16.53, 18.83, 19.27], "trend": 2.74, "latest": 19.3, "wordNumber": 244487, "creationStatus": 1, "desc": "【军婚 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霞光暖暖的第1本书", "fullTitle": "霞光暖暖的第1本书", "link": "https://fanqienovel.com/page/7630819091648891928", "data": [6.17, 7.25, 7.42], "trend": 1.25, "latest": 7.4, "wordNumber": 293727, "creationStatus": 1, "desc": "【年代+乡村写实+家长里短+出轨+团宠+女性成长】\n红杏，村医，23岁，两个女儿的母亲。丈夫意外死亡后，她才发现，那个平时看起来老实巴交，三棍子都打不出来一个屁的男人，竟然背叛了自己。天崩地裂，一向恪守妇道，孝敬父母，相夫教子的她，感觉自己的天塌了！她的信仰的爱情，亲情，就在那一刻彻底的消失了。\n痛定思痛，余生的日子，她要撕破一切束缚她的无形的道德枷锁，真真切切为自己活一次。\n大胆去爱，大胆去恨，让自己的人生活的有滋有味！\n\n\n\n", "tags": ["年代", "现代言情", "乡村", "团宠", "医生", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成对照组女配我把男女主玩疯了", "fullTitle": "穿成对照组女配我把男女主玩疯了", "link": "https://fanqienovel.com/page/7635566031313849406", "data": [6.38, 7.09, 7.47], "trend": 1.08, "latest": 7.5, "wordNumber": 269162, "creationStatus": 1, "desc": "顾昭昭穿成一本对照组小说的妯娌女配，最恶心的是她还获得一个女主助攻暴击系统。\n　　对照组还不够，还要她为女主服务是吧。\n　　既然这样玩，那就别怪她了。\n　　好孕多子？一胎十宝不用谢。\n　　心地善良，随手一救就是贵人？一个贵人哪够，百倍暴击，一下晕倒一百个在她前面，吓不死她！\n　　男配都爱她，二三四个男配哪里够，直接来个千倍暴击，男主头上青青草原。\n……\n只是这个她随便将就一下的男人是怎么一回事，怎么就黏上甩不掉了。\n谢彦平好不容易娶了个妻子，老婆没心没肺就算了，还总想把他甩掉，谢彦平表示，是他的，就永远是他的，想跑，打断腿哦~~~", "tags": ["年代", "现代言情", "系统", "穿越", "魂穿", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生七五年扔掉外甥上大学", "fullTitle": "重生七五年扔掉外甥上大学", "link": "https://fanqienovel.com/page/7641835297906363417", "data": [7.48, 8.29, 8.43], "trend": 0.95, "latest": 8.4, "wordNumber": 208363, "creationStatus": 1, "desc": "沈云重生在中考那年，嫂子生孩子凭什么让她带？嫂子的妈凭什么她伺候？重来一世，她要去上大学，不再给别人当免费保姆，远离兄嫂一家。手握空间，灵泉，药房，她自能闯出自己的一片天。", "tags": ["年代", "现代言情", "重生", "空间"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零恶妻一胎四宝科研大佬跪地哄", "fullTitle": "七零恶妻一胎四宝科研大佬跪地哄", "link": "https://fanqienovel.com/page/7641514479775124504", "data": [6.7, 7.42, 7.59], "trend": 0.89, "latest": 7.6, "wordNumber": 280716, "creationStatus": 1, "desc": "[年代+甜宠+生理性喜欢]\n一朝穿书，苏绾绾成了下放科研男主顾时砚的恶毒原配:骗婚、作妖、卖小姑子，下场是被马蜂蛰死在深山。\n苏绾绾：这破剧本谁爱走谁走。\n她上山挖参，进城经商，日子过得风生水起，顺带发现高冷丈夫看她的眼神越来越不对劲。\n直到骗婚真相败露，苏绾绾连夜揣着四个崽跑路，却被男人一把箍进怀里。\n顾时砚掐着她的腰，气息灼热：“骗了我的身，偷了我的心，现在还想拐走我的种？”\n苏绾绾心虚：“你不恨我？”\n顾时砚低头咬住她的唇:“恨，恨你半夜偷亲我，恨你怀了孕还敢跑，更恨你把我这颗心搅得稀巴烂。”\n他投降般抵着她的额头：“是我先沦陷了，行不行？”\n——\n多年后记者专访：“顾工，听说您和夫人的婚姻始于一场骗局？”\n顾时砚对着镜头浅笑，语气宠溺：“她爱我，才骗我。”\n全网炸了：原来这位国士无双的科研大佬，竟是骨灰级恋爱脑！\n苏绾绾磕着瓜子总结：高冷男人的恋爱脑，一旦上头，终生不愈。", "tags": ["年代", "现代言情", "乡村", "甜宠", "穿书", "大佬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [6.92, 7.21, 7.38], "trend": 0.46, "latest": 7.4, "wordNumber": 254290, "creationStatus": 1, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [5.97, 6.21, 6.42], "trend": 0.44, "latest": 6.4, "wordNumber": 273023, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我老公是年代文里女主的白月光", "fullTitle": "我老公是年代文里女主的白月光", "link": "https://fanqienovel.com/page/7646365309284142104", "data": [5.41, 5.73, 5.83], "trend": 0.42, "latest": 5.8, "wordNumber": 294766, "creationStatus": 1, "desc": "【年代+穿书+不下乡+空间+日常流+甜宠+养崽+搞事业】\n胎穿18年，直到结婚第二天，苏甜才知道，自己穿书了。\n不仅如此，她还抢了女主白月光，顺利从名字都没出现过一次的路人甲，晋升成头号女配。\n女主啥事都想跟她比一下。\n女主是城市户口，她是农村户口，刚傲气两天，就想到以后拆迁，农村能分到三倍多拆迁款，女主又沉默了。\n女主成为电厂正式工，还没来得及炫耀，转头她就考上电厂干部。\n女主三年抱俩，暗地里笑她是不下蛋的母鸡，结果她一胎三宝，直接弯道超车。\n女主高兴考上全国首一的大学，就看见她以第一名的成绩成为运动后首批研究生。\n改革开放，女主创业开饭店，做老板，买大奔，风光无限，却不想苏甜手里早已经控股十数家公司，成了名副其实的企业家。\n女主终于崩溃了，红着眼问：“为什么？明明我才是女主，为什么哪里都比不上你？”\n苏甜靠在真皮沙发上，端起茶杯，慢悠悠地吹了口气，矫揉造作地笑了笑：\n“我也没办法，谁让姐从小就那么优秀呢？”\n“你要真想翻盘，可以等老了死在我前面，然后早投胎几年——说不定下一辈子，我就输你了。”\n女主：“……”", "tags": ["年代", "现代言情", "空间", "甜宠", "穿书", "养崽"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [7.57, 7.82, 7.87], "trend": 0.3, "latest": 7.9, "wordNumber": 286416, "creationStatus": 1, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "先婚后爱：大小姐被糙汉狠狠宠爱", "fullTitle": "先婚后爱：大小姐被糙汉狠狠宠爱", "link": "https://fanqienovel.com/page/7646781632002657342", "data": [5.85, 6.08, 6.14], "trend": 0.29, "latest": 6.1, "wordNumber": 159242, "creationStatus": 1, "desc": "【先婚后爱+恶女作精+狼兔文学+糙汉+疯批强制】\n一觉醒来胡若桃穿成昨晚看的年代文里对照组娇气恶毒女二。\n原书男女主是根正苗红的贫下中农，青梅竹马，因为原女主觉醒了治疗系统，帮助男主治好眼疾后，两人便在一起了，男主考上大学毕业后直接当了官，一路高升。\n相反，胡若桃和她的未来老公在特殊时期开始后就成了人人喊打的对象，过得好不凄惨。\n胡若桃当即立断收拾包袱去了乡下，她要先一步嫁给大佬，争取能在特殊时期过得安稳。\n——\n穹野因意外娶了个娇滴滴的大小姐，大小姐不仅要饮琼浆，食珍味，夜枕玉枕，身盖锦罗，而且不爽了就打他，天天把他当奴仆使，当狗喂，当马骑。\n村里人都说他命好，穹野只冷笑。\n后来———\n深夜。\n“穹野，我要现在！立刻！上山去捉兔子！”\n男人声音淡淡：“别胡闹。”\n大小姐气鼓鼓一翻身：“我不跟你玩了，我要去找舟舟！”\n男人伸手将人捞过来，捏住她的小脸，眼睛发红声音发狠：“我的乖宝，你说…你想找谁？”\n再后来——\n“听说没，穹野他媳妇跑了。\"\n“就说这小子没好的福气，守不住，他人呢？”\n“疯魔了，满地找媳妇呢。”\n注：大小姐是真的作。", "tags": ["年代", "现代言情", "乡村", "穿越", "先婚后爱", "作精"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰满作精美人：诱哄硬汉生崽续命", "fullTitle": "丰满作精美人：诱哄硬汉生崽续命", "link": "https://fanqienovel.com/page/7655235611619494937", "data": [6.75, 6.89, 7.01], "trend": 0.26, "latest": 7.0, "wordNumber": 169825, "creationStatus": 1, "desc": "（年代丰腴坏美人+面凶糙汉+养崽+生理性喜欢）\n秦含香生的美貌，但实在恶劣，她家道中落，要过好日子，结了婚也不安分，被渣男骗的人财两失。\n检测到宿主的恶毒虚荣爆表了！寿命只剩0,01天，但如果宿主愿意绑定生子系统，攻略男主，就可以返现生命值哦。】\n秦含香好奇的问：“男主，谁啊？”\n【被你卷了家产抛弃的未来大佬霍征啊。】\n嘶…她那个整天凶巴巴的老公？秦含香可是把人得罪死了的。\n她还记得她到处造谣是霍征生不出来，绝嗣！\n“他？他不行，他生不出孩子。”\n【嘿嘿，现在不是有我这个生子系统了嘛，保准宿主一夜揣崽！】\n　……\n霍征出完车刚回来，就看见穿着清透薄裙子的美人娇滴滴的扑到他怀里，满手的软玉生香。\n“老公，你怎么才回来啊，我都等不及了呢~”\n霍征低头看她，漆黑眼眸又沉又怒，“你不是跟人跑了吗？”\n秦含香踮起脚尖亲亲他的唇：“看了别人，还是我老公好，老公，我给你生儿砸好不好？”\n女人的嘴，骗人的鬼，但霍征是真喜欢她这坏透了的样子，管她耍什么花招，他打横抱起人进屋。\n一年后…霍征又幸福又满脸苦相的看着三个大胖小子，“媳妇儿我们绝对不能再生了！我去结扎。”", "tags": ["年代", "现代言情", "作精", "系统", "破镜重圆", "情有独钟", "婚恋"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "拒做 帝王，匍匐在她的裙下，俯首称臣，卑微求爱。\n*\n阅读指南:封建大爹帝王vs娇纵跋扈表妹", "tags": ["宫斗宅斗", "古代言情", "皇后", "甜宠", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "觊觎臣妻：清冷权臣不装了", "fullTitle": "觊觎臣妻：清冷权臣不装了", "link": "https://fanqienovel.com/page/7650103887151500350", "data": [4.59, 4.66, 4.71], "trend": 0.12, "latest": 4.7, "wordNumber": 229414, "creationStatus": 1, "desc": "（刚开分，后期会涨）\n【强取豪夺＋臣妻＋高岭之花下神坛＋步步为营】\n大靖朝权倾朝野的大司马裴修晏，世人皆道他清冷自持，如悲悯众生的神佛。\n温眠棠也深以为然。\n她本是七品御史沈子煜的娇妻，只想在夫君的羽翼下安稳度日。\n沈子煜以为自己遇到了青天大老爷。\n权倾朝野的大司马裴修晏赏识他，提拔他，甚至连他递上去的折子都亲自圈阅夸赞。\n他发誓要结草衔环，报答侯爷的知遇之恩。\n直到某日，他身陷重案，即将面临满门抄斩的死局。\n走投无路之下，温眠棠只能在那个大雨滂沱的深夜，跪在权倾朝野的大司马府前求情。\n书房门开，那尊玉雕般的圣人缓步而出，温眠棠衣衫尽湿，跪倒在那个清冷端方的男人脚边。\n男人用微凉的指腹勾起她的下巴。\n“求我？”男人的声音温醇如酿，眼底却翻涌着她看不懂的疯狂，“夫人打算拿什么来换沈大人的命？”\n温眠棠这才知道，夫君的死局，不过是这位圣人为了引她入笼，亲手布下的一场天罗地网。", "tags": ["宫斗宅斗", "古代言情", "一见钟情", "情有独钟"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被威胁后，我成了摄政王的掌中娇", "fullTitle": "被威胁后，我成了摄政王的掌中娇", "link": "https://fanqienovel.com/page/7647961721784519742", "data": [4.6, 4.74, 4.61], "trend": 0.01, "latest": 4.6, "wordNumber": 163196, "creationStatus": 1, "desc": "娇气包x活阎王 /甜宠 /双洁  /一见钟情 /男主宠妻无度\n沈初妘，国公府次女，圣上亲封的华瑶郡主。自小受尽宠爱，是出了名的娇气难养。\n没人敢摘下这朵娇花，可偏偏大周的活阎王却把这朵娇花摘了下来护在怀里。\n谢迟渊，大周异姓摄政王，执掌禁军三十万，杀伐果断、冷血无情，是出了名的活阎王。\n初见时他被人追杀，浑身浴血闯进她的院子，捂住她的嘴：“听话些，不然杀了你。”\n小姑娘吓得眼泪直掉：“你别杀我……我听话。”\n谢迟渊轻嗤：“胆子真小，像个兔子。”\n后来，这只兔子被叼进了狼窝，成了摄政王妃。\n人人都以为娇气包遇上活阎王，必定被折磨得哭回家。可谁知沈初妘被他养得更娇气了。\n邻国使臣想献公主给摄政王当侧妃，话刚出口，谢迟渊一箭射穿他头顶的发冠。\n当天下朝回府，谢迟渊发现王妃不见了，桌上摆着和离书。“王妃呢？”管家颤颤巍巍地说：“王妃回国公府了。”\n国公府内，沈初妘正掉眼泪。谢迟渊翻窗而入，一把将她捞进怀里亲：“夫君只要你一个人。”\n沈初妘红着眼眶瞪他。他抵着她的额头，声音低哑：“妘儿原谅夫君，好不好？”\n她别过脸：“谁要你翻窗了？”\n谢迟渊低笑：“可是本王就是愿意翻王妃的窗，翻一辈子。”", "tags": ["宫斗宅斗", "古代言情", "王妃", "双洁", "团宠", "一见钟情"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "保姆我在富贵窝里看冷暖", "fullTitle": "保姆我在富贵窝里看冷暖", "link": "https://fanqienovel.com/page/7646938862643579928", "data": [7.73, 8.09, 9.97], "trend": 2.23, "latest": 10.0, "wordNumber": 264978, "creationStatus": 1, "desc": "Hello，书友们好～我是王拉弟，一个爱记录、爱唠嗑的保姆。\n\n“不算计，能在别墅里挣上钱吗？”——可我这算计啊，都在心里，厚道嘛，得摆在脸上。\n\n我骑着那辆破二手电驴，进过500平的大铁门。见过高贵女主人背地里的眼泪，偷听过美丽太太心里的肮脏；这一家表面光鲜，那一家内心宽容。种种不同，我都见过……\n\n可我也得低头——低头看着丈夫那条伤腿，低头数着儿子的学费，还得低头闻一楼飘上来的那股子馊臭味。\n\n大强子总劝我：“嘴牢，装傻，把钱挣了。”\n\n可当我推开那扇门，才发现——这人间烟火太烫嘴，这世态炎凉太扎心，我又怎能真的视而不见？\n\n我这一辈子，在别人的屋檐下躲过雨，也在自家的车库里生过火。人说三十年河东，三十年河西，我看惯了高楼起，也看厌了宴席散。到头来才明白：那呛人的烟火味，才是活着的底气。\n\n——谨以此书，献给我中国普通的母亲，也致敬每一位用力活着的平凡人。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "触礁对岸", "fullTitle": "触礁对岸", "link": "https://fanqienovel.com/page/7542096272866413630", "data": [5.25, 5.41, 6.54], "trend": 1.29, "latest": 6.5, "wordNumber": 248317, "creationStatus": 1, "desc": "评分刚出，可能会涨哈哈\n姜柠是顶级学府本硕博八年制的医学生，学医，博士buff叠满\n巨大压力之下，她养成了一点无伤大雅但不好宣之于口的小爱好\n本来她还处于精神放飞但是行为保守的状态，直到她毕业那年，压力过大，她忍不住对一个认识了一年多的网友发起了邀请\n网友不仅长的好，身材也好\n两天两夜，姜柠吃饱喝足后删除拉黑，潇洒走人\n答辩那天，那位传说中导师死对头的答辩主席端坐主位，赫然是那个和她在酒店待了两天两夜的男人！\n而他还即将成为她的顶头上司，领导的领导\n\n一只伤痕累累但铁骨铮铮的小狐狸遇见了心软的神\n一个端方君子第一次谈恋爱就被骗身骗心为爱发疯的故事\n\n1v1双c，男女主都很纵yu。\nhappy ending \n本人不学医，所有的东西都是按自己的想法设定的，不实的地方千万不要当真啊\nPS：作者有一直在修文，完善前后逻辑，如果有宝宝看到内容有变化是正常的喔，爱每一个看文的宝宝", "tags": ["职场婚恋", "现代言情", "职场", "医生", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [4.92, 5.53, 6.14], "trend": 1.22, "latest": 6.1, "wordNumber": 203472, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动
