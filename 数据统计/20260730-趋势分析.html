ata": [17.67, 18.55, 18.55], "trend": 0.89, "latest": 18.6, "wordNumber": 540943, "creationStatus": 1, "desc": "（评分刚出，后期会涨）1VN+男全洁+极限拉扯+强制+悬疑+微恐\n非大女主爽文，非圣母。（再次强调，非大女主女强爽文，介意勿入，请允许有不同种类的小说）\n末世时代，不断有禁区产生，进入禁区便会累计异化值，异化值满点即为死亡。\n姜暖觉醒了唯一SSS级天赋“净化”，却有个难以启齿的秘密，必须亲密接触才能平息异化。\n为了不沦为大势力的“充电宝”，姜暖给自己立下规矩：不救人，见疯子立刻跑！\n可她还是被第一战力的“调查小组零”堵在了审讯室。\n那个能射杀禁区怪物的闷骚狙击手，枪口正抵着她的心口；温柔的医疗官正拿着针筒，眼神病态地记录她的每一次颤栗。\n冷血队长亲手撕碎她的规矩，将她禁锢在方寸之间：\n“要么被我们收容，要么去禁区喂怪物。”\n“选一个吧：是死在禁区，还是死在我们怀里？”", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别撒糯米了！我也不想冒黑烟儿啊", "fullTitle": "别撒糯米了！我也不想冒黑烟儿啊", "link": "https://fanqienovel.com/page/7569956253888171032", "data": [14.13, 15.0, 15.0], "trend": 0.87, "latest": 15.0, "wordNumber": 1091433, "creationStatus": 0, "desc": "【私设多+动植物变异+天灾+怪物+异能+微群像+升级流】\n巫泗泗满18岁生日这天，耳边骤然出现无数的呢喃声。\n除了她，没有人能听到。\n第二天觉醒台上，她又听到了呢喃，一不小心照着对方说的做了。\n然后。\n她觉醒了治愈异能，和别的治愈系那充满生机的绿光不同！\n她浑身冒黑烟儿，一看就邪！\n注册官飞快掏出一把糯米朝她撒了过去！\n巫泗泗：？\n……\n巫泗泗被录取了。\n但被高层悄悄例入【危险人物】档案！\n她最开始还很担忧，直到遇到了另外几大毒物。\n7号毒物：右簪。抽烟喝酒纹花臂，徒手撕怪物的猛人室友，最大爱好是去窝棚区救治老人小孩……\n5号毒物，童印。走到哪哪儿死人的倒霉体质，每次倒霉都要喂自己吃一颗糖……\n1号毒物：白撬秋。喜爱穿红戴绿，阳光开朗大男孩，姐姐长姐姐短的嘴甜怪，实则有着反社会人格！\n巫泗泗放心了，大家藏起来的身份都不简单，那我冒个黑烟儿也可以大大方方的。\n她表面是治愈系，实则是伤害转移。\n她净化诡异，但诡异不嚎个七天七夜就下不了线！\n她能靠献祭获得赐福、批量生产【金光甲】的能力，但献祭的东西不太正常，是怪物的眼球舌头或者死老鼠……\n高层紧张的咽了口唾沫：“呃，冒黑烟儿也没什么不好！再……再看看？”\n\n", "tags": ["科幻末世", "幻想言情", "末世", "天灾", "群像"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世菟丝花：姐夫你倒是说句话啊", "fullTitle": "末世菟丝花：姐夫你倒是说句话啊", "link": "https://fanqienovel.com/page/7601868684897815614", "data": [10.81, 11.27, 11.56], "trend": 0.74, "latest": 11.6, "wordNumber": 719298, "creationStatus": 1, "desc": "【末世+菟丝绿茶+泪失禁美人+多男主全洁+雄竞修罗场+追妻火葬场】\n女主没有异能，真普通人，但也不是真的手无缚鸡之力，她只想不劳而获罢了。\n\n云遥枝没有觉醒异能，身为普通人的她靠男友圈养着，被小队嫌弃娇贵趁她男友受伤昏迷丢弃。\n\n 好在天无绝人之路，她遇见了她姐姐的校友，不管三七二十一她直接叫姐夫认关系！\n\n她装乖示弱扮可怜，泪眼婆娑黏上大腿。\n\n姐夫，你们不会不管我吧？\n\n中途又遇见找她两年的竹马团。\n\n就是男人太多，每天都在争风吃醋，想着干掉对方。\n\n后面她找到了已经成基地长的姐姐，果断甩掉了他们，开启啃姐模式。\n\n只是为什么她那个被她单方面分手的男友也在这里？？？", "tags": ["科幻末世", "末世", "囤物资"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世文恶毒女配？嚣张一日是一日", "fullTitle": "末世文恶毒女配？嚣张一日是一日", "link": "https://fanqienovel.com/page/7478769464138288153", "data": [23.27, 23.98, 23.98], "trend": 0.71, "latest": 24.0, "wordNumber": 1532131, "creationStatus": 0, "desc": "（已出版）[女主回归+空间+位面交易+丧尸晶石+变异动植物]\n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "变成丧尸我学习母猪的产后护理", "fullTitle": "变成丧尸我学习母猪的产后护理", "link": "https://fanqienovel.com/page/7174693973267582012", "data": [14.99, 15.58, 15.58], "trend": 0.59, "latest": 15.6, "wordNumber": 310437, "creationStatus": 0, "desc": "小镇上有只奇怪的小丧尸，不吃人不吸血，只爱推着小车车屯零食。\n有一天，小丧尸辛辛苦苦囤的东西被偷了，小丧尸愤而搬家。\n新家就在养猪场，于是小丧尸过上了养猪，吃肉的幸福生活（并没有）\n小丧尸脑子空空，忘记了偷她东西的人，直到小偷再次回来。\n厉璟枫拿了小丧尸满屋子的东西，从此被缠上，小丧尸力气大，不讲理，只有香喷喷的猪肉才能哄好。\n小丧尸：让咬一口也能好。\n后来，厉璟枫用一碗肉将小丧尸骗走了。", "tags": ["科幻末世", "重生", "空间", "末世", "囤物资", "前世今生"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真公主？不，真君主！", "fullTitle": "真公主？不，真君主！", "link": "https://fanqienovel.com/page/7517228824212278334", "data": [10.83, 11.06, 11.25], "trend": 0.43, "latest": 11.3, "wordNumber": 915624, "creationStatus": 1, "desc": "（无CP+大女主+前期军校争霸+后期一统人族+热血）\n问：从君主幼年体到完成体要几步？\n幼年体凌昭：孤儿院开局，疑似金手指的游戏芯片还一直拖后腿。\n完成体凌昭：后星际第一人·第一指挥官·神级星者·人族的希望·神迹计划唯一继承者……\n后星际时代，异兽大肆入侵，帝国统治式微。在人人唱衰皇室的情况下，一个遗漏在外的公主默默绑定【万国狩猎场】的游戏芯片。\n在这里，她将作为帝国唯一继承人，以子民信仰为准入券，和其它生物进行比赛，从而赚取奖励。\n于是，卷王之旅正式开启。\n三十六校联赛冠军？拿来吧。\n天骄突围赛冠军？拿来吧。\n皇室身份、君主之冕、丢失的蓝星、散乱的人族大军？统统拿来吧。\n起初，凌昭只想做白塔市最强者，后面却在收队员和创纪录的路上越走越远，一不留神就顺手在万国狩猎场登顶了，又一个不留神就把游戏芯片玩崩了。\nN年后，被揍到鼻青脸肿的宇宙诸国：你们当初惹她干嘛？\n全人类：再渺小的人类，也有在浩瀚宇宙里留下痕迹的权利。今天也是朝伟大君主前进的一天！\n（我流星际文，世界观私设颇多，略慢热；前期军校和军营版图为主，后期游戏和宇宙诸国版图为主）", "tags": ["科幻末世", "穿越", "星际", "无CP", "异世穿越"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天灾异种：金手指？拿来吧你", "fullTitle": "天灾异种：金手指？拿来吧你", "link": "https://fanqienovel.com/page/7590885420477451289", "data": [8.73, 8.86, 8.86], "trend": 0.13, "latest": 8.9, "wordNumber": 1088705, "creationStatus": 1, "desc": "【天灾+变异+女强+重生+空间+系统农场+囤货+无CP】\n【种田流，有妹妹，有宠物】\n天灾频发、变异开启、异种降临。\n明玖——一个毫无异能的普通人，稳健地苟到了末世第7年。\n她谨小慎微，她狗狗祟祟，她能使阴招就绝不冒头，她为了得到异能勤勤恳恳种地打工……终于，在自己的安全小窝里被人一击毙命。\n死后她才知道，自己只是一本末世大男主文里的炮灰。\n炮灰她死了，炮灰她又活了，炮灰她不干了。\n男主的金手指是吧？拿来吧你！", "tags": ["科幻末世", "重生", "空间", "女强", "无CP", "天灾"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都末世了，有亿点异能很合理吧", "fullTitle": "都末世了，有亿点异能很合理吧", "link": "https://fanqienovel.com/page/7343521552446540824", "data": [11.22, 11.26, 11.31], "trend": 0.09, "latest": 11.3, "wordNumber": 912382, "creationStatus": 0, "desc": "【末世+天灾+大佬+爽文无逻辑+无cp+言灵】\n言灵师大佬凌染意外穿书末世，对于新世界，她很感兴趣。\n面对丧尸围攻\n凌染：神说，我会飞。\n异能者们看着那人明明没有翅膀，却双脚离地，腾空而起，缓缓张大了嘴巴。\n面对要去拿研究资料，异能者们束手无策之时\n凌染：神说，我会隐身。\n异能者们看着凭空消失的凌染，没一会儿就把那份研究资料从丧尸间里带了出来。\n异能者们：凌神这是什么异能？飞行、隐身双系异能？\n后来他们才知道，什么双系异能？明明是言出法随。", "tags": ["科幻末世", "穿越", "末世", "穿书", "无CP", "大佬", "天灾", "魂穿"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全民求生，我成了万年老二", "fullTitle": "全民求生，我成了万年老二", "link": "https://fanqienovel.com/page/7567215449079811097", "data": [7.55, 7.63, 7.63], "trend": 0.08, "latest": 7.6, "wordNumber": 823819, "creationStatus": 0, "desc": "【无cp+囤货+无限流+天灾+有队友+美食+微恐】\n【刚开分，慢慢会长的，走过路过不要错过，进来看看吧～】\n　　作为群居动物的人类都知道，在一众榜单中，你能记住榜一，因为他可能是领头的羊，善战的狼，敏捷的豹，远见的鹰。\n　　你也能记住老六，因为他就是搅屎的棍，划水的鱼，装饭的桶，退堂的鼓。\n　　但你唯独记不住老二，这个实力不祥，名字不详，登上榜单好像只是为了凑数的存在。\n　　上一世李橙子先是成为老六在求生游戏中搅了个天翻地覆，随后成为榜一。\n　　享年25，卒！\n　　重活一世，她发誓要苟成榜二，做路人甲，做大众脸，在无人在意的角落里，默默发展。\n然而随着她来到1区，不断闯过一个又一个城市，她发现事情没有她想的那么简单，这款求生游戏的终点不是个人的生死而是种族的较量。\n有比较搞笑的部分，有比较压抑的部分，非温馨轻松向。", "tags": ["科幻末世", "重生", "末世", "美食", "无CP", "囤物资"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "温软玫瑰沦为他心尖偏宠【末世】", "fullTitle": "温软玫瑰沦为他心尖偏宠【末世】", "link": "https://fanqienovel.com/page/7245170805103922191", "data": [8.07, 8.07, 8.1], "trend": 0.03, "latest": 8.1, "wordNumber": 360560, "creationStatus": 0, "desc": "【架空末日背景＋渣男火葬场＋死对头反派上位＋修罗场＋双向救赎＋苏撩＋浪漫主义美学＋双洁】\n【温柔坚定正道曙光x斯文变态笑面虎（骚断腿】\n温瑶到死也没想明白，她喜欢沈逸川什么，喜欢他的冷酷薄情，还是喜欢他的自私自利？\n作为搭档，她为他出生入死七年，却在遇险时被他果断放弃。\n他说：“你已经感染尸毒了，不能留在列车上。”\n他说：“温瑶，我以为你很懂事。”\n—\n再次睁眼，她看见了死对头季明尘的脸——那个桃花眼温柔面，惊艳绝尘，杀人从不眨眼的变态。\n男人用沾血的手指挑起她的下颚，笑时气息撩人：“我救了你？你要怎么报答我？”\n温瑶鼻尖酸涩，心一横，仰头贴上了男人的唇。\n本来只是惯例调戏她的季明尘：“！？”\n—\n后来，沈逸川寻遍尸海，日夜痛悔，等到终于再见，他悲喜交加，红着眼卑微祈求：“回来，阿瑶……”\n却见温瑶身后徐徐走来一位白衣男人，男人亲昵地将手搁在她的双肩，笑看向对面时，在她耳畔温柔吐息：“当初怎么教你的，嗯？”\n“对敌人的仁慈，就是对自己的残忍。”", "tags": ["科幻末世", "末世", "反派"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "穿书：侯爷，夫人又给你纳妾了", "fullTitle": "穿书：侯爷，夫人又给你纳妾了", "link": "https://fanqienovel.com/page/7563282810547473433", "data": [26.18, 30.75, 31.01], "trend": 4.83, "latest": 31.0, "wordNumber": 1014007, "creationStatus": 0, "desc": "穿书+宫斗宅斗+重生的儿子+爽文+躺平的一生\n争家产大获全胜的林嫣然，因为太高兴参加极限运动摔死了，有幸穿到了一本她看过的小说里，她成了因为小说男主养外室抑郁而死的正室女配。\n书中女主当然就是成功登堂入室的那个外室。\n本来林嫣然都把袖子撸起来了，准备搬空渣男的私库，把外室纳进府里来折磨。\n结果林嫣然发现她这个‘大儿子’好像有点门道。\n所以画风就变成了，‘轩儿，管管你弟弟。’\n‘轩儿，管管你父亲。’\n“轩儿······”\n总的来说就是林嫣然看戏躺平的一生。\n楚云轩：母亲歇着，事情全部都交给儿子。", "tags": ["宫斗宅斗", "古代言情", "萌宝", "穿越", "穿书", "魂穿"], "borderColor":  32.35], "trend": 1.33, "latest": 32.3, "wordNumber": 669864, "creationStatus": 0, "desc": "【实体书《岁岁春欢》已出，全平台可购】\n【女主渣男双重生＋男主穿越＋双向救赎＋扮猪吃虎】\n十七岁这年，沈嘉岁嫁于陆云铮为妻，沈陆两家皆为将门，强强联合。\r\n成婚两年后，陆云铮大败敌国名扬四海，沈家却因通敌叛国满门抄斩。\r\n沈嘉岁临死前才得知，沈家通敌叛国罪证乃陆云铮亲呈，且陆云铮想娶的人从来不是她，而是沈家养女，她视作亲妹妹的顾惜枝。\r\n灭门之仇，欺骗之恨，沈嘉岁临死反扑，拉陆云铮同归于尽。\r\n再一睁眼，重回陆云铮上门提亲那一日。\r\n沈嘉岁匆忙赶到时，陆云铮正深情开口求娶顾惜枝。\r\n原来，陆云铮也重生了......\r\n————\r\n沈家通敌叛国一事迷雾重重，牵涉甚广。\r\n为查清真相，沈嘉岁决然入局，这时，一人着绯红官服站在了她的身旁。\r\n沈嘉岁依稀记得，上一世咽气之时，似有一片绯红衣角闯进视野......\r\n————\r\n江浔：“江某平生所愿，唯山河远阔，国泰民安。如今再添一愿，愿心上之人岁岁无虞，常乐长安。”", "tags": ["宫斗宅斗", "古代言情", "重生", "扮猪吃虎", "HE", "相互救赎"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "勾太傅，人前不熟人后如做了夫妻", "fullTitle": "勾太傅，人前不熟人后如做了夫妻", "link": "https://fanqienovel.com/page/7591861882936380478", "data": [44.92, 45.4, 45.4], "trend": 0.49, "latest": 45.4, "wordNumber": 996080, "creationStatus": 1, "desc": "状元夫君熟睡，宋怜抱住霁月清风的当朝太傅哭：“求求您，救救我……”\n她能有什么错？她只是不想死。\n家规无情，长公主不容人，夫君要做驸马，留给宋怜唯有一条路——吊死。\n于是她壮着胆子，勾引了当朝太傅。\n陆九渊乘着酒意：“如你所愿。”\n从那以后，宋怜予取予求，陆九渊事事如了她的意。\n他俩一个蓄意勾引，一个见色起意。\n人前殊途陌路，人后颠鸾倒凤。\n有人告密：“宋怜她精于算计，处心积虑破坏太傅大婚。”\n陆九渊淡泊道：“我就喜欢被她霸占着，怎么了？”\n-\n太傅陆九渊出去打了场仗，回来发现自己暗中相看好的姑娘，被皇上指给新科状元了。\n他大发雷霆之后也没跟任何人提及，不过一个女人而已，犯不上。\n直到这女人哭着抱着他的腰求他：“求求您，救我……”\n“一哭二闹的。”陆九渊笑纳了，偶尔当回活菩萨也不错。\n可原本是无聊时纾解的玩物，却被他养成了尖牙利爪的小豹子。\n有人状告宋怜为虎作伥，飞扬跋扈，目中无人。\n陆九渊：“我惯的，你适应一下。”\n后来，宋怜说皇帝该换了，陆九渊就把皇帝换了。\n宋怜说反了吧，陆九渊就反了。", "tags": ["宫斗宅斗", "古代言情", "宠妻", "甜宠", "双洁", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "心声被偷听，满朝文武齐吃瓜", "fullTitle": "心声被偷听，满朝文武齐吃瓜", "link": "https://fanqienovel.com/page/7379714137724570648", "data": [20.27, 20.9, 21.82], "trend": 1.55, "latest": 21.8, "wordNumber": 2097856, "creationStatus": 0, "desc": "【穿越+读心术+系统+金手指+作精+扮猪吃虎+搞笑+吃瓜+口嗨+怼人+沙雕】\n宋瑶瑶前世是一个孤儿，本硕博连读毕业后，成了一名军医，年纪轻轻做手术累死后，胎穿到了一个架空的朝代：天凤国。\n这辈子的宋瑶瑶，父亲是正四品户部侍郎，母亲是二品将军家的嫡女，有父母和哥哥姐姐的疼爱，自己有了这样好的家庭和身份，她想过得轻松一些！\n宋瑶瑶刚一出生，就绑定了一个吃瓜系统。\n宋瑶瑶还不知道，她 结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沈世子，您真是做男做女都精彩啊", "fullTitle": "沈世子，您真是做男做女都精彩啊", "link": "https://fanqienovel.com/page/7611934119068437528", "data": [22.31, 22.38, 22.38], "trend": 0.07, "latest": 22.4, "wordNumber": 564541, "creationStatus": 1, "desc": "【1vN男全洁+雄竞+掉马+抽象】【非权谋文】\n【温润端方小皇帝+阴鸷反差摄政王+孤高清冷左相+聪慧狐狸皇商】\n沈折枝穿书了。\n为继承侯府，她女扮男装，顶替战死沙场的亡兄成了世子爷。\n因知晓最后的赢家，她投靠了天子。\n可有一天，身边的重要角色们，竟莫名听到了原文中的内容…\n-\n摄政王瞪着沈折枝，耳边突然响起——\n【裴凛将沈折枝按在墙上，狠狠吻了上去：“为什么不能爱我？”】\n摄政王：？\n他竟有龙阳之好？对象还是他的政敌？\n\n-\n天子刚想让沈折枝出差——\n【“陛下，枝儿受不住了……”沈折枝眼尾泛红，死死抓着龙袍的衣襟。】\n天子：？\n什么？他竟玩弄自己的心腹权臣？\n-\n左相邀沈折枝对弈，下一秒——\n【江寄雪用指腹毫不怜惜地揉弄着沈折枝水润的双唇，在她耳边轻笑：“怎么不敢看我？”】\n左相：？\n他居然和天子死忠断袖？\n-\n皇商刚给她送来保护费，紧接着——\n【顾鹤洲将珍珠赠予沈折枝，她含入口中，眼波流转，顾鹤洲当场情难自持……】\n皇商：？\n他能稍微自持一点吗？\n-\n鸡飞狗跳下，几人终于发现沈折枝是女子。\n于是，大型修罗场开幕。\n沈折枝满头问号：“不是，你们连男子都喜欢？滚远点！”\n完全忘了，她穿的根本不是什么正经文。\n而她，是女主角。\n（后期男女身份随机切换）", "tags": ["古言脑洞", "古代言情", "穿越", "穿书", "女扮男装", "胎穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "手拿名臣系统，我在古代女扮男装", "fullTitle": "手拿名臣系统，我在古代女扮男装", "link": "https://fanqienovel.com/page/7225592747904732192", "data": [17.07, 17.09, 17.09], "trend": 0.02, "latest": 17.1, "wordNumber": 1032880, "creationStatus": 0, "desc": "许玥穿书了。\n成为科举文里母亲早亡，没有兄弟，孤苦无依，家中不管只能尴尬寄住在男主家的小白花表妹。\n许玥上辈子一路从孤女拼到博士，从不信命，即使古代女子难存，她也不放弃的思考着该怎么破局。\n系统:不，对不起，宿主，你不能当个女孩子，因为我是名臣系统。\n许玥:……\n多年以后，乡人都说，许家祖坟冒了青烟，许玥三岁识文，五岁作诗，八岁中秀才，十二岁举业有成，不过十八便高中状元！\n打马游街，风光一时。\n许玥:谢邀，你听过半夜的鸡叫声吗？\n原男主:许兄 data": [14.21, 14.75, 15.08], "trend": 0.87, "latest": 15.1, "wordNumber": 2687300, "creationStatus": 1, "desc": "【万人迷+废物女大摆烂式攻略+脑洞+无固定男主+一见钟情】\n　　废物点心禹乔被一个刚出厂的攻略系统绑定了。\n　　看着自信满满说要她到各个世界攻略优质男的系统，禹乔笑了。\n　　她觉得是时候让系统看看大学生的真正实力。\n　　世界一：穿成君夺臣妻里被赐给绿帽侠的炮灰宫妃，因不懂上古音被迫装聋作哑。\n　　世界二：被迫成为末世重生文黑化男主的“女儿”。\n　　世界三：星际恋爱游戏里不可攻略的绝美NPC。\n　　世界四：恋综文万人嫌女配的闺蜜。\n　　……\n　　事实证明，只要禹乔摆得够烂，系统就能主动变成卷王。\n　　多年以后，王牌攻略系统514在进行新系统培训演讲时，都会想起它的宿主禹乔。这时候它都会在演讲后补充一句话——“不要绑定大学生！！！”", "tags": ["快穿", "古代言情", "系统", "穿越", "王妃", "今穿古", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿炮灰她不走寻常路", "fullTitle": "快穿炮灰她不走寻常路", "link": "https://fanqienovel.com/page/7432285807722908696", "data": [22.15, 22.26, 22.97], "trend": 0.82, "latest": 23.0, "wordNumber": 1712809, "creationStatus": 1, "desc": "无固定cp，清穿+年代+其他，有空间\n注：女主纯享乐主义，精致利己，主打吃什么就是不能吃苦，受什么都不能受罪，每个世界都要尽量过的舒服。\n\n     倒霉了二十几年的女大学生沈安宁好不容易一朝转运，却在财运到来的前一天一命呜呼。许是怨念太大，临死前被一个还愿系统绑定，由此开始了游走各界之旅。\n千挑万选绑定宿主后，系统君每天都在哭唧唧，为什么自家宿主总是不按常理出牌？\n1：清宫炮灰小宫女\n宫斗？no，抱着未来铁板钉钉的亲王儿子，带着小姐妹吃瓜看戏不好吗？\n2：七十年代被冷暴力的继女\n下乡？不，我选择直接送渣爹一程\n3:古代炮灰农家女\n陪贫寒夫君一路艰辛的糟糠妻，谁爱抢抢去！\n4:虐恋情深霸总文里的前女友\n   恋爱脑，狗都不吃。\n5:炮灰九幅晋\n6:红楼小丫鬟\n7:六零炮灰小村姑\n8:古代炮灰“嫡长子”\n9:修真文里的极品炉鼎\n\n什么救世？选择飞升不好吗？\n11:仁宗那个被迫下嫁丑男的倒霉公主\n12:古代炮灰嫡女\n13:19世纪贵族小姐\n14:清宫炮灰庶妃\n15:末世小炮灰\n未完……", "tags": ["快穿", "古代言情", "系统", "穿越", "空间", "清穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心机勾引快穿：女主心上人归我了", "fullTitle": "心机勾引快穿：女主心上人归我了", "link": "https://fanqienovel.com/page/7634751548186168344", "data": [17.52, 17.93, 18.25], "trend": 0.73, "latest": 18.3, "wordNumber": 335504, "creationStatus": 1, "desc": "【心机禁忌勾引绿茶+无道德三观+横刀夺爱+1V1男洁】\n温枝宁拥有一张漂亮又无辜的脸蛋，只要是她看上的，就没有得不到的。\n“这是你喜欢的心上人吗？那归我了。”\n-\n【世界1.汉子茶】\n在小团体里顶着兄弟的名义做尽暧昧的事情。\n面对女主的控诉质疑，她跟男主只是淡定的一人一句：\n“妹妹，我可不会看上我的狗儿子，接吻只是大冒险，抱在一起睡觉只是兄弟。”\n“我跟她要是在一起早在一起了，你在闹什么?”\n【世界2.被全家偷听心声的假千金】\n真千金回来那天，全家都听到了假千金的心声。\n早上给全家人做饭，假千金心声说：“刚刚看到姐姐好像给我汤里下了什么，算了我还是照喝吧。”\ /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },

];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

        <span class="section-title">在读人数呈趋势上升的赛道</span>
      </div>
      <div class="note">从全部 18 个分类中筛选出 ${n} 日内在读人数持续上升的题材，共 ${D.nRising} 个。点击图例可单独查看某个分类的曲线。</div>
      <div class="card">
        <div id="overview-legend-${sfx}" class="legend-row"></div>
        <div class="chart-wrap" style="height:320px"><canvas id="overviewChart-${sfx}"></canvas></div>
      </div>
    </div>
    <div class="section" id="sec-compare-${sfx}">
      <div class="section-header">
        <span class="section-num">03</span>
        <span class="badge">对比</span>
        <span class="section-title">${n}日增幅 &amp; 竞争系数分析</span>
      </div>
      <div class="two-col">
        <div class="card">
          <div style="font-size:13px;color:var(--text2);margin-bottom:12px">${n}日总在读增幅（${D.startLabel}→${D.endLabel}）</div>
          <div class="chart-wrap" style="height:520px"><canvas id="growthChart-${sfx}"></canvas></div>
        </div>
        <div class="card">
          <div style="font-size:13px;color:var(--text2);margin-bottom:12px">赛道定位图：总在读 vs 竞争系数（气泡大小 = 10万+书目数）</div>
          <div class="chart-wrap" style="height:320px"><canvas id="bubbleChart-${sfx}"></canvas></div>
        </div>
      </div>
    </div>
    <div class="section" id="sec-table-${sfx}">
      <div class="section-header">
        <span class="section-num">04</span>
        <span class="badge">数据</span>
        <span class="section-title">全分类汇总表（${D.endLabel}快照）</span>
      </div>
      <div class="card" style="overflow-x:auto">
        <table class="overview-table" id="overviewTable-${sfx}"></table>
      </div>
    </div>
    <div class="section" id="sec-books-${sfx}">
      <div class="section-header">
        <span class="section-num">05</span>
        <span class="badge">书目</span>
        <span class="section-title">推荐赛道 &amp; 对标书目</span>
      </div>
      <div class="note">仅展示连续 ${n} 天上榜且净增 &gt; 0 的书目，按净增降序排列。</div>
      <div class="tabs" id="bookTabs-${sfx}"></div>
      <div id="bookTabContents-${sfx}"></div>
    </div>
  </div>`;

  buildNav(sfx);
  setTimeout(() => setupScrollSpy(sfx), 200);

  // ① 推荐卡片
  (function() {
    const container = document.getElementById('rec-container-' + sfx);
    const groups = {};
    D.recTracks.forEach(t => { if (!groups[t.score]) groups[t.score] = []; groups[t.score].push(t); });
    const scoreLabels = { 5:'★★★ 强烈推荐', 4:'★★☆ 推荐', 3:'★★☆ 建议关注', 2:'★☆☆ 参考', 1:'☆☆☆ 谨慎' };
    Object.keys(groups).sort((a,b)=>b-a).forEach(score => {
      const s = parseInt(score);
      const groupEl = document.createElement('div');
      groupEl.className = 'score-group';
      const labelEl = document.createElement('div');
      labelEl.className = 'score-group-label';
      labelEl.textContent = `${scoreLabels[s] || ''} — ${s}分`;
      groupEl.appendChild(labelEl);
      const grid = document.createElement('div');
      grid.className = 'rec-grid';
      groups[score].forEach(t => {
        const tierClass = s>=5?'s8':s===4?'s7':s===3?'s6':s===2?'s5':'slo';
        const scoreClass = s>=5?'high':s>=3?'med':'low';
        const agRaw = t.abs_growth != null ? t.abs_growth : 0;
        const gPct = t.growth != null ? t.growth : 0;
        const agHtml = agRaw>=0?`<span class="pill pill-up">+${agRaw}万</span>`:`<span class="pill pill-dn">${agRaw}万</span>`;
        const pctHtml = `<span style="font-size:11px;color:var(--text3);margin-left:4px">${gPct>=0?'+':''}${gPct}%</span>`;
        const gHtml = agHtml + pctHtml;
        const reasonsHtml = t.reasons.map(r=>{
          let cls='tag-blue';
          if(r.includes('增长'))cls='tag-green';
          else if(r.includes('稳定'))cls='tag-yellow';
          else if(r.includes('系数低'))cls='tag-green';
          else if(r.includes('系数中'))cls='tag-yellow';
          else if(r.includes('体量偏小'))cls='tag-red';
          return `<span class="${cls}">${r}</span>`;
        }).join('');
        grid.innerHTML += `<div class="rec-card ${tierClass}">
          <div class="rec-cat">${t.cat}</div>
          <div class="rec-score-badge ${scoreClass}">综合评分 ${s}分</div>
          <div class="rec-stats">
            <div class="rec-stat"><div class="val">${t.total19}万</div><div class="lbl">总在读</div></div>
            <div class="rec-stat"><div class="val">${gHtml}</div><div class="lbl">${n}日在读增幅</div></div>
            <div class="rec-stat"><div class="val" style="color:${t.coeff<5?'#22c55e':t.coeff<7?'#3b82f6':t.coeff<10?'#f59e0b':'#ef4444'}">${t.coeff}</div><div class="lbl">竞争系数</div></div>
          </div>
          <div class="rec-reasons">${reasonsHtml}</div>
        </div>`;
      });
      groupEl.appendChild(grid);
      container.appendChild(groupEl);
    });
  })();

  // ② 上升题材折线图（solo legend）
  (function() {
    const ctx = document.getElementById('overviewChart-' + sfx).getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: D.days, datasets: D.overviewDatasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}万` } }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b' } },
          y: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'万' } }
        }
      }
    });
    const legEl = document.getElementById('overview-legend-' + sfx);
    attachSoloLegend(legEl, chart, D.overviewDatasets);
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 增幅柱状图
  (function() {
    const chart = new Chart(document.getElementById('growthChart-' + sfx).getContext('2d'), {
      type: 'bar',
      data: { labels: D.growthCats, datasets: [{ data: D.growthValues,
        backgroundColor: D.growthColors.map(c=>c+'cc'), borderColor: D.growthColors,
        borderWidth: 1, borderRadius: 3 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.parsed.x>0?'+':''}${c.parsed.x}%` } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }
        }
      }
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const allBooks = D.bookChartData[cat];
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = allBooks.length > 0
        ? allBooks[0].data.map((_,di) => `<th>${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th>${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${sfx.startsWith('Read') ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${allBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table">
              <thead><tr><th></th><th>#</th><th>书名</th>${dayCols}<th>字数</th><th>净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = allBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const isRead = sfx.startsWith('Read');
        const displayBooks = isRead
          ? allBooks.filter(b => b.creationStatus === 0)
          : allBooks;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td><a href="${b.link}" target="_blank" onclick="event.stopPropagation()">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: allBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, allBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
