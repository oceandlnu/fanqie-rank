<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 7月24日–7月30日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越七零，我成了女主的恶毒继姐", "fullTitle": "穿越七零，我成了女主的恶毒继姐", "link": "https://fanqienovel.com/page/7645293690532924440", "data": [14.46, 14.78, 14.69, 15.01, 15.85, 16.53, 16.53], "trend": 2.07, "latest": 16.5, "wordNumber": 236005, "creationStatus": 1, "desc": "【军婚 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [3.98, 4.1, 4.32, 4.52, 5.05, 5.97, 5.97], "trend": 2.0, "latest": 6.0, "wordNumber": 264461, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零，拒绝换亲被疯批糙汉强宠", "fullTitle": "七零，拒绝换亲被疯批糙汉强宠", "link": "https://fanqienovel.com/page/7647848427442670617", "data": [6.03, 6.57, 6.73, 6.8, 7.24, 7.49, 7.92], "trend": 1.89, "latest": 7.9, "wordNumber": 163296, "creationStatus": 1, "desc": "【注意，1V2，女主冷静清醒，疯批跟糙汉是两个人，养娃，家长里短，乡村发家文，靠双手过日子，不是爽文，有兴趣的来看看】\n慢节奏农村生活\n\n总有小说里换嫁的，没人问问被换的男人愿不愿意。\n沈晚棠穿越到七零成了换嫁新娘里的作精女配。\n她还没闹呢。\n被换了新娘的男人不乐意了，\n雷霆手段后，原女主被迫嫁给了男主弟弟。\n两个男人对于谁归媳妇，展开看一场默契的较量", "tags": ["年代", "现代言情", "乡村", "宠妻", "穿越", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生七五年扔掉外甥上大学", "fullTitle": "重生七五年扔掉外甥上大学", "link": "https://fanqienovel.com/page/7641835297906363417", "data": [6.06, 6.42, 6.55, 6.55, 6.47, 6.21, 7.48], "trend": 1.42, "latest": 7.5, "wordNumber": 199784, "creationStatus": 1, "desc": "沈云重生在中考那年，嫂子生孩子凭什么让她带？嫂子的妈凭什么她伺候？重来一世，她要去上大学，不再给别人当免费保姆，远离兄嫂一家。手握空间，灵泉，药房，她自能闯出自己的一片天。", "tags": ["年代", "现代言情", "重生", "空间"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰腴美人一撒娇，冷面军官脸红了", "fullTitle": "丰腴美人一撒娇，冷面军官脸红了", "link": "https://fanqienovel.com/page/7640510554175458366", "data": [6.91, 7.34, 8.05, 8.21, 8.22, 8.27, 8.18], "trend": 1.27, "latest": 8.2, "wordNumber": 268260, "creationStatus": 1, "desc": "【年代，先婚后爱，随军，萌宝，追妻火葬场】\n把离婚协议书寄给容璟时的第二天，沈青姝开始不断做预知梦。\n她梦到自己被那伪善的白眼狼养妹夺走传家宝，算计下乡，在黑省被折磨致死，落得个抄家灭门的凄惨下场。\n醒来后，听着绿茶养妹正在脑海里和“系统”商量怎么抢她气运，沈青姝冷笑一声，反手夺过空间金手指，把白眼狼和渣男都一起打包下乡了！\n*\n撕了离婚信，护住沈家财产，沈青姝带着一对双胞胎儿子，麻溜去海岛军区找容璟时复合。\n面对主动换上真丝吊带钻被窝、软玉温香的小妻子，容首长如临大敌，咬牙切齿：“沈青姝，你休想用这种色诱的手段骗我签离婚协议，我绝对不上当！”\n 沈青姝翻了个白眼，一把擒住他的软肋：“废什么话，睡觉！”\n　　*\n海岛军区来了个美艳娇气的大小姐军嫂，刚开始大院里人人觉得她不出三天准待不下去。后来大家发现，这祖宗手里漏出的随便一样好东西，都够他们眼红大半辈子，各位刺头大佬纷纷开始抱大腿。", "tags": ["年代", "现代言情", "萌宝", "先婚后爱", "暗恋", "追妻火葬场"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [6.32, 6.56, 6.74, 7.02, 7.3, 7.41, 7.57], "trend": 1.25, "latest": 7.6, "wordNumber": 278014, "creationStatus": 1, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我老公是年代文里女主的白月光", "fullTitle": "我老公是年代文里女主的白月光", "link": "https://fanqienovel.com/page/7646365309284142104", "data": [4.25, 4.44, 4.67, 4.9, 5.05, 5.24, 5.41], "trend": 1.16, "latest": 5.4, "wordNumber": 286255, "creationStatus": 1, "desc": "【年代+穿书+不下乡+空间+日常流+甜宠+养崽+搞事业】\n胎穿18年，直到结婚第二天，苏甜才知道，自己穿书了。\n不仅如此，她还抢了女主白月光，顺利从名字都没出现过一次的路人甲，晋升成头号女配。\n女主啥事都想跟她比一下。\n女主是城市户口，她是农村户口，刚傲气两天，就想到以后拆迁，农村能分到三倍多拆迁款，女主又沉默了。\n女主成为电厂正式工，还没来得及炫耀，转头她就考上电厂干部。\n女主三年抱俩，暗地里笑她是不下蛋的母鸡，结果她一胎三宝，直接弯道超车。\n女主高兴考上全国首一的大学，就看见她以第一名的成绩成为运动后首批研究生。\n改革开放，女主创业开饭店，做老板，买大奔，风光无限，却不想苏甜手里早已经控股十数家公司，成了名副其实的企业家。\n女主终于崩溃了，红着眼问：“为什么？明明我才是女主，为什么哪里都比不上你？”\n苏甜靠在真皮沙发上，端起茶杯，慢悠悠地吹了口气，矫揉造作地笑了笑：\n“我也没办法，谁让姐从小就那么优秀呢？”\n“你要真想翻盘，可以等老了死在我前面，然后早投胎几年——说不定下一辈子，我就输你了。”\n女主：“……”", "tags": ["年代", "现代言情", "空间", "甜宠", "穿书", "养崽"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "骗婚捞女？科研大佬独宠丰腴美人", "fullTitle": "骗婚捞女？科研大佬独宠丰腴美人", "link": "https://fanqienovel.com/page/7649237755582483518", "data": [8.02, 8.52, 9.01, 8.89, 8.7, 8.43, 8.51], "trend": 0.48, "latest": 8.5, "wordNumber": 194840, "creationStatus": 1, "desc": "【娇媚丰腴大美人VS外冷内野重欲大佬】\n【架空+八零+上位者为爱低头+独宠+先婚后爱+日久生情】\n柳娇媚穿进八零年代，成了书中那个又娇又媚的丰腴美人。\n好消息：老公穆寒舟是顶级科研大佬，工资津贴月月全额上交。\n坏消息：原主是捞女，老公是骗来的。\n按原书剧情，大佬半年后回家，发现原主是照骗，当场提出离婚。\n原主爱慕虚荣，对穆寒舟下药，企图生米煮成熟饭留在京市。\n穆寒舟自己忍着，给原主灌了十倍的药，丢进黑矿里，原主被摧残致死……\n柳娇媚瑟瑟发抖：惹不起惹不起，趁大佬还没回来，赶紧跑路！\n可原主太能挥霍了，兜里就剩二块五，估计跑出家门就饿死了。\n柳娇媚给自己定制剧本：装乖撒娇拉满情绪价值，搞一笔钱，再挑刺冷战断崖式分手。\n冷峻矜贵的科研大佬，开始电话里喊她宝宝，一张张万元汇款单砸过来，砸得柳娇媚说不出分手。\n穆寒舟一颗心，被家里的小妻子撩得辗转反侧，科研上攻坚克难，短短二个月就解决了预计半年才能解决的难题。\n提前回京市，只想按着小妻子的说法，把人狠狠宠爱，结果火车站就被正准备跑路的小妻子撞了个满怀。\n穆寒舟：宝宝！\n柳娇媚：？\n扣着小妻子的手腕把人抵在门上，穆寒舟：电话里说喜欢的，是这样吗？", "tags": ["年代", "现代言情", "先婚后爱", "独宠", "日久生情", "大佬"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全家穿越年代后带着空间躺赢了", "fullTitle": "全家穿越年代后带着空间躺赢了", "link": "https://fanqienovel.com/page/7313546549861026878", "data": [4.18, 4.31, 4.39, 4.44, 4.51, 4.52, 4.46], "trend": 0.29, "latest": 4.5, "wordNumber": 256984, "creationStatus": 1, "desc": "评分刚出还会涨\n【爽文+年代+系统+空间+全家享福】\n有男主！\n林向瑜做了个噩梦，梦里是满是尘土的70年代。\n她以为只是幻觉，直到父母也梦见了同样的背朝黄土面朝天。\n下一秒，白光闪过——他们真的穿了！\n穿成了家里优渥、父母恩爱，却突然面临“下乡”指标的林家千金。\n有挂！\n✅ 签到系统到手，荒野变粮仓！\n✅ 随身空间开启，物资自由不是梦！\n别人在70年代苦哈哈挣工分，林向瑜靠着系统和空间，吃香喝辣，日子过得风生水起！\n且看她如何在物资匮乏的年代，带领全家发家致富，躺赢人生！", "tags": ["年代", "现代言情", "乡村", "系统", "穿越", "空间"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [3.02, 3.51, 4.01, 4.46, 4.81, 4.88, 4.97], "trend": 1.95, "latest": 5.0, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。", "tags": ["种田", "古代言情", "空间", "医术", "古色古香", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [2.99, 3.13, 3.45, 3.81, 4.1, 4.53, 4.9], "trend": 1.9, "latest": 4.9, "wordNumber": 255612, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越后自称汉族，后来我的国来了", "fullTitle": "穿越后自称汉族，后来我的国来了", "link": "https://fanqienovel.com/page/7643332690896227352", "data": [3.17, 3.56, 3.98, 4.43, 4.76, 4.92, 5.01], "trend": 1.84, "latest": 5.0, "wordNumber": 259398, "creationStatus": 1, "desc": "【无cp+古代穿越】\n沈清一朝穿越异世，逃荒路上众人排挤戒备，为在古代求生，对外谎称出身隐世大族。\n落脚于安置点时，开了间食肆，本想安安稳稳过日子，不想却救济了万民。\n宗室子弟肆意残害百姓，种种恶行令人发指。\n众人眼中最为善良、去牙行挑人都哭跑出来的沈娘子，破口大骂，众人纷纷表明从没听过这么脏的话。\n有人上前攻击，女主将手中器物猛地掷出，轰然一声炸响，震慑全场。\n“吾乃汉族，维天有汉，鉴亦有光，你们岂敢动我。”\n后期国家来了，女主的心态彻底发生变化。", "tags": ["种田", "古代言情", "穿越", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿古代，在主角后面捡漏", "fullTitle": "胎穿古代，在主角后面捡漏", "link": "https://fanqienovel.com/page/7635046106379848729", "data": [2.33, 2.45, 2.63, 2.84, 3.04, 3.26, 3.53], "trend": 1.2, "latest": 3.5, "wordNumber": 288456, "creationStatus": 1, "desc": "[架空] [种田] [经商] [权谋] [金手指] [有cp]（cp出场比较后）\n（刚出评分，还会继续涨哦）新人新作品，请多多担待。\n李巧语因被医闹病人报复，穿越到古代，直到两岁才恢复记忆。\n家中虽在村里比较富裕，但每个人心思各异，李巧语只能默默苟住，学习手艺，偷摸赚钱。\n可惜在这个时代，女性终究地位低下，为了未来的幸福，她只好计划制造机会入赘高富帅。\n本来以为这漫长的岁月会按部就班进行。\n没想到村长家出了个福娃，村里人都说福娃就是运气好，肯定是神仙下凡。\n却没有看到福娃一捡东西，旁边的人就会倒霉。\n还有，三姐整天用看鬼的眼神看我干什么？哦，原来她是重生的！！？\n隔壁家的书生也满嘴“我命由我不由天，三十年河东...”", "tags": ["种田", "古代言情", "乡村", "空间", "医术", "胎穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [2.13, 2.21, 2.38, 2.63, 2.65, 2.68, 3.08], "trend": 0.94, "latest": 3.1, "wordNumber": 253095, "creationStatus": 1, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但没耀祖！！！\n……\n\n《家无男丁我来撑》——这个撑，撑的从来不是没有男人的空缺，而是不管有没有男人，女主都会让家人好好活着。女主不是代替男人在撑，她是作为她自己在撑。\n女主不会通过贬低或工具化男性来证明自己强大，她的强大来自于她比任何人都更敬畏生命、更懂守护。\n……\n苏青禾没有打算把两个妹妹养成温室里的娇花。\n她要把她们培养成食人花——\n要争权夺利", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "彪悍小农女的悠闲生活", "fullTitle": "彪悍小农女的悠闲生活", "link": "https://fanqienovel.com/page/7646312151467953176", "data": [2.19, 2.21, 2.32, 2.41, 2.49, 2.73, 2.95], "trend": 0.77, "latest": 3.0, "wordNumber": 299673, "creationStatus": 1, "desc": "张璃死了，死后穿越成古代杏花村里的一缕游魂，村里张莲花与父亲张铁柱激烈争吵，撞门身亡。\n张璃的魂魄便进入这具身体，承受开瓢的剧痛，为消解心中那口怨气，她抓起镰刀，发疯一样追着张铁柱全村跑。\n从此村里谁惹她，她便疯给谁看。这一世，她不想再拼命的卷，只想种种田，悠闲度日。\n富商家的纨绔，村里来的文弱书生，不时凑过来招惹，她从未放在心上。\n后来，经历过多次磨难，总有人默默守在她身边。待她见过太多的生死，她握住文弱书生的手，许他三生三世。\n（多是家长里短，亲情，也有家国情怀）", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带异能穿女尊开局被退婚？", "fullTitle": "带异能穿女尊开局被退婚？", "link": "https://fanqienovel.com/page/7648884503930227736", "data": [2.35, 2.4, 2.46, 2.59, 2.75, 2.88, 3.05], "trend": 0.7, "latest": 3.1, "wordNumber": 246015, "creationStatus": 1, "desc": "【女尊＋空间＋逃荒＋科举＋1vn】\n末世第八年，江言昭被同父异母的妹妹从背后捅了一刀。\n\n再睁眼，她成了女尊国一个刚被退婚的穷书生。未婚夫嫌她体弱多病、科举无望，上门撕了庚帖。她反手把退婚书撕了，先敲了柳家十两银子。\n\n大旱后，村里颗粒无收。她带着全族人逃荒，一路打土匪、找水源、分粮食，从清河村走到青州府，把一条绝路硬生生走成了活路。\n\n空间还在，异能也在，而接下来，她要科举，要做人上人。\n\n而那个前世为她殉情的人，正红着眼睛问她：\n\"姐姐，我能排在第一个吗？\"\n\n她答：\"不管未来几个男人，你永远会是我的例外和偏爱。\"", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世开荒：小怂包娇娇成团宠了", "fullTitle": "兽世开荒：小怂包娇娇成团宠了", "link": "https://fanqienovel.com/page/7651124284554759192", "data": [3.5, 3.78, 4.05, 4.18, 4.16, 4.05, 4.05], "trend": 0.55, "latest": 4.1, "wordNumber": 183348, "creationStatus": 1, "desc": "【兽世】【小怂包】【甜宠】【生存】\n苏妙斥巨资办了998游泳卡，只上一节课，一睁眼穿越蛮荒兽世。\n她 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生七五年扔掉外甥上大学", "fullTitle": "重生七五年扔掉外甥上大学", "link": "https://fanqienovel.com/page/7641835297906363417", "data": [6.47, 6.21, 7.48], "trend": 1.01, "latest": 7.5, "wordNumber": 199784, "creationStatus": 1, "desc": "沈云重生在中考那年，嫂子生孩子凭什么让她带？嫂子的妈凭什么她伺候？重来一世，她要去上大学，不再给别人当免费保姆，远离兄嫂一家。手握空间，灵泉，药房，她自能闯出自己的一片天。", "tags": ["年代", "现代言情", "重生", "空间"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [5.05, 5.97, 5.97], "trend": 0.93, "latest": 6.0, "wordNumber": 264461, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越七零，我成了女主的恶毒继姐", "fullTitle": "穿越七零，我成了女主的恶毒继姐", "link": "https://fanqienovel.com/page/7645293690532924440", "data": [15.85, 16.53, 16.53], "trend": 0.68, "latest": 16.5, "wordNumber": 236005, "creationStatus": 1, "desc": "【军婚 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零，拒绝换亲被疯批糙汉强宠", "fullTitle": "七零，拒绝换亲被疯批糙汉强宠", "link": "https://fanqienovel.com/page/7647848427442670617", "data": [7.24, 7.49, 7.92], "trend": 0.68, "latest": 7.9, "wordNumber": 163296, "creationStatus": 1, "desc": "【注意，1V2，女主冷静清醒，疯批跟糙汉是两个人，养娃，家长里短，乡村发家文，靠双手过日子，不是爽文，有兴趣的来看看】\n慢节奏农村生活\n\n总有小说里换嫁的，没人问问被换的男人愿不愿意。\n沈晚棠穿越到七零成了换嫁新娘里的作精女配。\n她还没闹呢。\n被换了新娘的男人不乐意了，\n雷霆手段后，原女主被迫嫁给了男主弟弟。\n两个男人对于谁归媳妇，展开看一场默契的较量", "tags": ["年代", "现代言情", "乡村", "宠妻", "穿越", "家长里短"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [6.32, 6.92, 6.92], "trend": 0.6, "latest": 6.9, "wordNumber": 246239, "creationStatus": 1, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "拒做后妈，年代小辣椒嫁糙汉被宠", "fullTitle": "拒做后妈，年代小辣椒嫁糙汉被宠", "link": "https://fanqienovel.com/page/7649193113168137278", "data": [8.56, 8.89, 9.13], "trend": 0.57, "latest": 9.1, "wordNumber": 280338, "creationStatus": 1, "desc": "年代+闪婚+糙汉+不圣母+无金手指+发家致富+一见钟情\n姜舒柠作为家里的小女儿，日子还是相当悠闲的，这辈子最大的坎坷，大概就是差点被人骗去当后妈了吧。\n媒婆：哎呀，舒柠啊，小唐同志可是很优秀的，不知道多少人抢着嫁呢，就是照顾几个孩子，很容易的。\n笑话，她姜舒柠聪明又漂亮，怎么会给人当后妈，既然媒婆觉得小唐这么好，那给你女儿嫁好了。\n媒婆：我#￥%……&&\n姜舒柠本来是为了搬出家里，闪婚嫁给了这个沉默寡言的汉子，没想到这汉子看着粗心，实则心细，头脑灵活。\n俩人一起摆摊卖衣服、卖吃的，只要能赚钱，俩人都不怕苦不怕累，总算是拼下一份家业，再养几个崽崽，这辈子就圆满了。\n谭远没想到，一眼就看上的姑娘，竟然会嫁给他这个糙汉子，一直到老了，儿孙绕围着她嬉笑打闹，还总觉得这一生都是在做梦。", "tags": ["年代", "现代言情", "宠妻", "先婚后爱", "闪婚", "发家致富"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零恶妻一胎四宝科研大佬跪地哄", "fullTitle": "七零恶妻一胎四宝科研大佬跪地哄", "link": "https://fanqienovel.com/page/7641514479775124504", "data": [6.18, 6.7, 6.7], "trend": 0.52, "latest": 6.7, "wordNumber": 272061, "creationStatus": 1, "desc": "[年代+甜宠+生理性喜欢]\n一朝穿书，苏绾绾成了下放科研男主顾时砚的恶毒原配:骗婚、作妖、卖小姑子，下场是被马蜂蛰死在深山。\n苏绾绾：这破剧本谁爱走谁走。\n她上山挖参，进城经商，日子过得风生水起，顺带发现高冷丈夫看她的眼神越来越不对劲。\n直到骗婚真相败露，苏绾绾连夜揣着四个崽跑路，却被男人一把箍进怀里。\n顾时砚掐着她的腰，气息灼热：“骗了我的身，偷了我的心，现在还想拐走我的种？”\n苏绾绾心虚：“你不恨我？”\n顾时砚低头咬住她的唇:“恨，恨你半夜偷亲我，恨你怀了孕还敢跑，更恨你把我这颗心搅得稀巴烂。”\n他投降般抵着她的额头：“是我先沦陷了，行不行？”\n——\n多年后记者专访：“顾工，听说您和夫人的婚姻始于一场骗局？”\n顾时砚对着镜头浅笑，语气宠溺：“她爱我，才骗我。”\n全网炸了：原来这位国士无双的科研大佬，竟是骨灰级恋爱脑！\n苏绾绾磕着瓜子总结：高冷男人的恋爱脑，一旦上头，终生不愈。", "tags": ["年代", "现代言情", "乡村", "甜宠", "穿书", "大佬"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我老公是年代文里女主的白月光", "fullTitle": "我老公是年代文里女主的白月光", "link": "https://fanqienovel.com/page/7646365309284142104", "data": [5.05, 5.24, 5.41], "trend": 0.36, "latest": 5.4, "wordNumber": 286255, "creationStatus": 1, "desc": "【年代+穿书+不下乡+空间+日常流+甜宠+养崽+搞事业】\n胎穿18年，直到结婚第二天，苏甜才知道，自己穿书了。\n不仅如此，她还抢了女主白月光，顺利从名字都没出现过一次的路人甲，晋升成头号女配。\n女主啥事都想跟她比一下。\n女主是城市户口，她是农村户口，刚傲气两天，就想到以后拆迁，农村能分到三倍多拆迁款，女主又沉默了。\n女主成为电厂正式工，还没来得及炫耀，转头她就考上电厂干部。\n女主三年抱俩，暗地里笑她是不下蛋的母鸡，结果她一胎三宝，直接弯道超车。\n女主高兴考上全国首一的大学，就看见她以第一名的成绩成为运动后首批研究生。\n改革开放，女主创业开饭店，做老板，买大奔，风光无限，却不想苏甜手里早已经控股十数家公司，成了名副其实的企业家。\n女主终于崩溃了，红着眼问：“为什么？明明我才是女主，为什么哪里都比不上你？”\n苏甜靠在真皮沙发上，端起茶杯，慢悠悠地吹了口气，矫揉造作地笑了笑：\n“我也没办法，谁让姐从小就那么优秀呢？”\n“你要真想翻盘，可以等老了死在我前面，然后早投胎几年——说不定下一辈子，我就输你了。”\n女主：“……”", "tags": ["年代", "现代言情", "空间", "甜宠", "穿书", "养崽"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [7.3, 7.41, 7.57], "trend": 0.27, "latest": 7.6, "wordNumber": 278014, "creationStatus": 1, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [5.64, 6.39, 7.09], "trend": 1.46, "latest": 7.1, "wordNumber": 176832, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [3.92, 5.06, 5.06], "trend": 1.14, "latest": 5.1, "wordNumber": 119475, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [3.73, 4.08, 4.54], "trend": 0.81, "latest": 4.5, "wordNumber": 261949, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [4.1, 4.53, 4.9], "trend": 0.8, "latest": 4.9, "wordNumber": 255612, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [5.19, 5.62, 5.77], "trend": 0.58, "latest": 5.8, "wordNumber": 168710, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿古代，在主角后面捡漏", "fullTitle": "胎穿古代，在主角后面捡漏", "link": "https://fanqienovel.com/page/7635046106379848729", "data": [3.04, 3.26, 3.53], "trend": 0.5, "latest": 3.5, "wordNumber": 288456, "creationStatus": 1, "desc": "[架空] [种田] [经商] [权谋] [金手指] [有cp]（cp出场比较后）\n（刚出评分，还会继续涨哦）新人新作品，请多多担待。\n李巧语因被医闹病人报复，穿越到古代，直到两岁才恢复记忆。\n家中虽在村里比较富裕，但每个人心思各异，李巧语只能默默苟住，学习手艺，偷摸赚钱。\n可惜在这个时代，女性终究地位低下，为了未来的幸福，她只好计划制造机会入赘高富帅。\n本来以为这漫长的岁月会按部就班进行。\n没想到村长家出了个福娃，村里人都说福娃就是运气好，肯定是神仙下凡。\n却没有看到福娃一捡东西，旁边的人就会倒霉。\n还有，三姐整天用看鬼的眼神看我干什么？哦，原来她是重生的！！？\n隔壁家的书生也满嘴“我命由我不由天，三十年河东...”", "tags": ["种田", "古代言情", "乡村", "空间", "医术", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "彪悍小农女的悠闲生活", "fullTitle": "彪悍小农女的悠闲生活", "link": "https://fanqienovel.com/page/7646312151467953176", "data": [2.49, 2.73, 2.95], "trend": 0.46, "latest": 3.0, "wordNumber": 299673, "creationStatus": 1, "desc": "张璃死了，死后穿越成古代杏花村里的一缕游魂，村里张莲花与父亲张铁柱激烈争吵，撞门身亡。\n张璃的魂魄便进入这具身体，承受开瓢的剧痛，为消解心中那口怨气，她抓起镰刀，发疯一样追着张铁柱全村跑。\n从此村里谁惹她，她便疯给谁看。这一世，她不想再拼命的卷，只想种种田，悠闲度日。\n富商家的纨绔，村里来的文弱书生，不时凑过来招惹，她从未放在心上。\n后来，经历过多次磨难，总有人默默守在她身边。待她见过太多的生死，她握住文弱书生的手，许他三生三世。\n（多是家长里短，亲情，也有家国情怀）", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [2.65, 2.68, 3.08], "trend": 0.42, "latest": 3.1, "wordNumber": 253095, "creationStatus": 1, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但没耀祖！！！\n……\n\n《家无男丁我来撑》——这个撑，撑的从来不是没有男人的空缺，而是不管有没有男人，女主都会让家人好好活着。女主不是代替男人在撑，她是作为她自己在撑。\n女主不会通过贬低或工具化男性来证明自己强大，她的强大来自于她比任何人都更敬畏生命、更懂守护。\n……\n苏青禾没有打算把两个妹妹养成温室里的娇花。\n她要把她们培养成食人花——\n要争权夺利", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糠逆袭后，前夫九族悔哭了", "fullTitle": "糟糠逆袭后，前夫九族悔哭了", "link": "https://fanqienovel.com/page/7646611978152070206", "data": [4.26, 4.49, 4.62], "trend": 0.36, "latest": 4.6, "wordNumber": 266912, "creationStatus": 1, "desc": "和离后，姜小满得到了天大的机缘。\n\n洗筋伐髓，一夜回春。\n那张被二十年苦日子熬出来的蜡黄老脸，脱胎换骨，肌肤胜雪，花容月貌，比十六岁出嫁那年还美上十分。\n\n种灵草，炼仙丹，荒山变宝山。\n全省大旱，颗粒无收，她的灵稻却绿浪翻涌，逆天丰收。\n\n一颗丹药在京城卖出万两天价，求药的人从青岩山排到了城门口。\n\n前夫一家跪在她门前磕头认错。\n她正坐在院子里数银子，头也没抬，只淡淡说了句：“别挡光。”", "tags": ["种田", "古代言情", "乡村", "幻想言情", "空间", "发家致富"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带异能穿女尊开局被退婚？", "fullTitle": "带异能穿女尊开局被退婚？", "link": "https://fanqienovel.com/page/7648884503930227736", "data": [2.75, 2.88, 3.05], "trend": 0.3, "latest": 3.1, "wordNumber": 246015, "creationStatus": 1, "desc": "【女尊＋空间＋逃荒＋科举＋1vn】\n末世第八年，江言昭被同父异母的妹妹从背后捅了一刀。\n\n再睁眼，她成了女尊国一个刚被退婚的穷书生。未婚夫嫌她体弱多病、科举无望，上门撕了庚帖。她反手把退婚书撕了，先敲了柳家十两银子。\n\n大旱后，村里颗粒无收。她带着全族人逃荒，一路打土匪、找水源、分粮食，从清河村走到青州府，把一条绝路硬生生走成了活路。\n\n空间还在，异能也在，而接下来，她要科举，要做人上人。\n\n而那个前世为她殉情的人，正红着眼睛问她：\n\"姐姐，我能排在第一个吗？\"\n\n她答：\"不管未来几个男人，你永远会是我的例外和偏爱。\"", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "笨蛋美人挺孕肚，搬空全京去流放", "fullTitle": "笨蛋美人挺孕肚，搬空全京去流放", "link": "https://fanqienovel.com/page/7647142493472951321", "data": [2.6, 2.88, 2.88], "trend": 0.27, "latest": 2.9, "wordNumber": 253104, "creationStatus": 1, "desc": "【种田+天灾+流放+虐渣+搬空+空间】\n修真界符阵宗师南穗穗渡劫失败，穿成临安侯府人人嫌弃的痴傻庶女，被迫替嫁给身中剧毒、双腿残疾的短命宁王冲喜。\n新婚夜，宁王剑指咽喉：“说，皇后派你来做什么？”\n南穗穗软乎乎歪头：“哥哥，要吃糖糖吗？穗穗有甜甜的糖糖哦……”\n宁王：……（这怕不是个真傻子？）\n婚后次日，南穗穗察觉王府死气萦绕，掐指一算，十日之内必遭抄家流放！\n南穗穗冷笑一声，反手画下百张搬运符，连夜搬空侯府，顺便将国库、帝后私库一扫而空！\n短短十天，她不仅囤够亿万物资，还顺手解了宁王的毒，揣着双胎崽崽踏上流放路。\n流放途中，别人啃树皮，她吃香喝辣，极品来找茬，宁王开启极致护妻模式。\n宁王：“我家夫人身怀六甲，谁敢惊着她，本王要谁的命！”\n被自家老祖宗显灵揍得脸肿如猪的仇家痛哭：“王爷！她召我老祖宗上来抽了我三百个巴掌，到底谁惊着谁啊？！”\n宁王：“我家夫人最怕打雷，一听雷声就往本王怀里钻。”\n被劈得外焦里嫩的刺客们嚎啕大哭：“王爷！那追着我们劈了三天三夜的九天玄雷就是她招来的！我们被劈成黑炭，她挺着大肚子在旁边用雷火烤红薯，这叫怕打雷？！”\n……\n柔弱是装的，满级大佬是真的，搬空全京去流放是让狗皇帝哭爹喊娘的！", "tags": ["种田", "古代言情", "空间", "虐渣", "天灾", "代嫁代娶"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.33, 2.45, 2.58], "trend": 0.26, "latest": 2.6, "wordNumber": 229295, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越后自称汉族，后来我的国来了", "fullTitle": "穿越后自称汉族，后来我的国来了", "link": "https://fanqienovel.com/page/7643332690896227352", "data": [4.76, 4.92, 5.01], "trend": 0.25, "latest": 5.0, "wordNumber": 259398, "creationStatus": 1, "desc": "【无cp+古代穿越】\n沈清一朝穿越异世，逃荒路上众人排挤戒备，为在古代求生，对外谎称出身隐世大族。\n落脚于安置点时，开了间食肆，本想安安稳稳过日子，不想却救济了万民。\n宗室子弟肆意残害百姓，种种恶行令人发指。\n众人眼中最为善良、去牙行挑人都哭跑出来的沈娘子，破口大骂，众人纷纷表明从没听过这么脏的话。\n有人上前攻击，女主将手中器物猛地掷出，轰然一声炸响，震慑全场。\n“吾乃汉族，维天有汉，鉴亦有光，你们岂敢动我。”\n后期国家来了，女主的心态彻底发生变化。", "tags": ["种田", "古代言情", "穿越", "无CP"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [4.81, 4.88, 4.97], "trend": 0.17, "latest": 5.0, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。", "tags": ["种田", "古代言情", "空间", "医术", "古色古香", "代嫁代娶"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成小丫鬟，靠梳妆赎身暴富", "fullTitle": "穿成小丫鬟，靠梳妆赎身暴富", "link": "https://fanqienovel.com/page/7564256304332557336", "data": [2.94, 2.97, 3.09], "trend": 0.15, "latest": 3.1, "wordNumber": 287752, "creationStatus": 1, "desc": "观看指南：【非爽文+架空北宋+微群像+市井经商+微宅斗+家长里短+日常流】\n林丰穗穿到北宋，成了八岁小丫头，喜提知州府上「家生子」身份。\n娘是灶上的厨娘，爹是账房贴书，前边还有个大她两岁的绣娘姐姐。\n老娘是灶上摸油水的高手，好的孬的全塞兜里。\n姐姐绣活一般，嘴皮子极好，哄的管事眉开眼笑，多出的边角料通通拎回家。\n家里边只剩个老实爹，半点不敢马虎手里的账。\n丰穗到了年纪要学门手艺，全家人跳出来支招。\n娘说：厨房干活是冬冷夏热，不行！\n姐说：绣娘的活计不分昼夜，别干！\n爹说：账房么，识字算术，不差分厘，还行！\n丰穗心想：学，都学，但还得靠重操旧业稳妥。\n“娘子，梳妆吗？”\n不不不，搞错了！八岁大的人应该先拜师学艺。\n谨小慎微是安身立命的前提。\n赚钱赎身，身兼数职是常态。\n伺候主子饮食起居，还得起早贪黑，制那面脂香膏、胭脂水粉上街兜售。\n苦点累点都没事，只要能挣脱这脖子上的枷锁。\n一家人齐整出府，置上一间小院，做些经济买卖，自由自在的过红火日子，便浑身都是劲。\n日子能过好，就别让其糟下去。\n立意：自由、奋斗、自强则万事顺，向阳而生。", "tags": ["种田", "古代言情", "穿越", "今穿古", "发家致富", "群像"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越荒年炮灰夺女主机缘全家翻身", "fullTitle": "穿越荒年炮灰夺女主机缘全家翻身", "link": "https://fanqienovel.com/page/7654869321851620414", "data": [2.51, 2.63, 2.63], "trend": 0.12, "latest": 2.6, "wordNumber": 265540, "creationStatus": 1, "desc": "程朝晖倒霉地被精神病砸死了，原来是粗心大意白无常的锅。与其讨价还价后，她成功地获得了穿越的机会，同时获得了两个异能作为伴手礼。\n结果，穿过来才发现自己居然是剧本里的炮灰！而且原主还被女主推倒，倒霉地磕死了。\n那就别怪她截取女主的金手指-随身空间了！\n手握剧本，她知道灾年即将来临，逃荒在所难免，本想考察一下自己的窝囊家人，没想到他们为了自己这个小妹，忽然支棱起来了。\n好好好，那就带上自己的家人，先收拾收拾原女主和压榨自己父母的家人，然后好好度过近在眼前的灾年危机！\n结果半路还捡了个长得帅的小哥哥，养起来。\n重要的事情说三遍：程朝晖是一家之主！程朝晖是一家之主！程朝晖是一家之主！", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世：开局揍哭崽，白狮狠狠爱！", "fullTitle": "兽世：开局揍哭崽，白狮狠狠爱！", "link": "https://fanqienovel.com/page/7649407986728717374", "data": [2.26, 2.29, 2.29], "trend": 0.03, "latest": 2.3, "wordNumber": 295340, "creationStatus": 1, "desc": "拜托各位小宝们，不喜欢这本书，请点击退出就可以了。别来骂我笔下的角色，你可以来骂我！求求啦！\n【温柔豹猫女VS冷酷反差白狮男】\n【注：双洁+兽世+萌宝+女主训狗+万人迷】\n路糯糯穿越了。\n作为优秀的农大毕业生，按理应是要报效国家的。\n可是，为什么机会没有？\n直接就是，两眼一睁来到兽世。\n可爱糯米团子的小白狮儿子。\n帅气高冷有腹肌的老公。\n路糯糯简直不敢想！这种好事真的让她遇到了。\n\n朔：“糯，我们在生一个崽吧？”\n路糯糯：“我天！这男人一来就这么刺激！”\n“只是看他的腹肌就知道，体力一定很好！”\n哈哈哈……", "tags": ["种田", "古代言情", "兽世", "双洁", "穿越", "养崽"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.71, 2.73, 2.73], "trend": 0.02, "latest": 2.7, "wordNumber": 215932, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "真千金她从军了", "fullTitle": "真千金她从军了", "link": "https://fanqienovel.com/page/7634576516210232345", "data": [5.96, 7.61, 7.61], "trend": 1.65, "latest": 7.6, "wordNumber": 282094, "creationStatus": 1, "desc": "【女频➕军旅➕女强➕无CP➕成长➕大力】\n祁今越死了！死在精神病院洁白的病床上。鲜血淌满床单，她的手里还握着一把生锈的剪刀。\n祁今越又活了！白幡飘动的灵堂上，养父母的音容笑貌在脑海里一帧一帧回放。\n她还是一个无依无靠的可怜虫！！\n车轮不断向前，再一次站上那片熟悉的土地，心境却是大不相同了。\n这辈子，她走上了一条与前世截然相反的道路——参军！\n入伍前夕，陆家沸腾，愤怒的父母、看好戏的大哥、假惺惺的“姐妹”、拍手叫好的小弟，祁今越将他们脸上的表情牢牢刻进心底，却没有生出一丝波澜。\n丛林、草地、大海、雪山、沼泽都留下她的足迹，汗水腥咸、血液粘稠都不能阻挡她的脚步。\n若干年后，祁今越平步青云，接受最高程度的奖赏，陆家父母激动上前，眼中迸射出贪婪的光芒。\n“孩子，你辛苦了，我们……”\n“我们认识吗?”祁今越脸上没有任何表情。", "tags": ["职场婚恋", "现代言情", "重生", "豪门世家", "前世今生", "真假千金"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内：我的太太是我的步步为营", "fullTitle": "体制内：我的太太是我的步步为营", "link": "https://fanqienovel.com/page/7649367076783524889", "data": [5.26, 5.73, 6.04], "trend": 0.78, "latest": 6.0, "wordNumber": 154493, "creationStatus": 1, "desc": "我的太太年纪小但乖巧，是我的底线，更是我的步步为营。\n双向心动。\n年龄差的互宠。\n体制内，直播，声优配音，哪个是最真实的你。\n说白了，就是一场长在彼此择偶心动点上的爱情。\n\n补充：文中所有职务，事件均为平行时空，请宝宝们勿代入现实。\n爱你们呦~\n\n", "tags": ["职场婚恋", "现代言情", "总裁", "豪门世家", "互宠", "年龄差"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "请你依赖我", "fullTitle": "请你依赖我", "link": "https://fanqienovel.com/page/7647931717331717145", "data": [4.91, 5.24, 5.51], "trend": 0.6, "latest": 5.5, "wordNumber": 228773, "creationStatus": 1, "desc": "空军中尉沈砚辞 × 协和心外科医生时愿\n\n第一次见面，她在医院楼梯间撞见别人踮脚吻他。第二次，他浑身是血扛着战友冲进急诊，说她手抖不适合做医生。第三次，他穿过一整个房间的人走到她面前，叫出她的名字。\n\n他冷硬、寡言、从不解释。\n她把所有情绪咽下去，一个人扛着那只正在失去知觉的右手，扛着不告而别的旧人，扛着他看不到她的时候，她还在等。\n\n她以为把自己藏得够远，他就找不到她了。\n但她不知道，洪水中他涉过齐腰的泥水找到她的时候，才发现她藏着一个他永远无法偿还的秘密——她怀过一个他的孩子，他刚知道，就已经失去了。", "tags": ["职场婚恋", "现代言情", "暗恋", "职场", "医生", "情有独钟", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，我不再做小城乖女儿", "fullTitle": "重生后，我不再做小城乖女儿", "link": "https://fanqienovel.com/page/7658113549268421656", "data": [2.62, 2.87, 3.15], "trend": 0.54, "latest": 3.2, "wordNumber": 190196, "creationStatus": 1, "desc": "【重生觉醒+一步一个脚印+无金手指+女性独立+女强+成长】 \n蔡庭芳死在四十一岁那年。\n她这一生，听父母的话，放弃大城市高薪工作，回县城当“稳定”的乖女儿；听亲戚的话，嫁给“条件不错”的男人；听丈夫的话，顾家、带娃、伺候老人；听单位的话，加班、背锅、替人收拾烂摊子。\n最后，她病倒在医院，丈夫计较治疗费，婆婆嫌她拖累家里，父母还劝她忍一忍。 \n直到死的那一刻，蔡庭芳才发现，一辈子的逆来顺受，只给她带来了一生悲剧。\n难道我生来就该死？连活下去都要看别人脸色？这一切到底凭什么！\n再睁眼，她回到二十四岁那场相亲饭局。周家端着架子说：“女人结婚后，还是要以家庭为主。”\n所有人都等着她点头。\n蔡庭芳只做了三件事。退婚。拿回工资卡。拖着行李箱搬出家门。\n她没有系统，没有空间，没有天降贵人，也不靠彩票暴富。\n她只有一张余额六千八的银行卡，一间月租六百五的小屋，一个清大毕业的脑子，和重活一次后再也不肯低头的狠劲。\n没有什么能困住女人，也没有什么能困住蔡庭芳。", "tags": ["职场婚恋", "现代言情", "重生", "打脸", "职场", "家庭", "虐渣"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宋医生，新婚请指教", "fullTitle": "宋医生，新婚请指教", "link": "https://fanqienovel.com/page/7651566622582246425", "data": [3.93, 4.12, 4.42], "trend": 0.49, "latest": 4.4, "wordNumber": 247979, "creationStatus": 1, "desc": "【清冷医生vs乖张网红】　\n【年上DADDY·年龄差八岁·青梅竹马·先婚后爱】\n宋鹤眠娶了亲手带大的小姑娘。\n两家世交，娃娃亲，他大她八岁。她从穿纸尿裤起就是他看着长大的，幼儿园接送、小学开家长会、初中辅导作业……她人生的每一个阶段，都有他的影子。\n江稚：我现在是个成熟的大人了！\n宋鹤眠：成熟的大人会在凌晨两点因为空腹吃布洛芬被送进急诊？\n江稚：……那是意外。\n宋鹤眠：成熟的大人会连续一周每天只睡四个小时？\n江稚：……我那是工作忙。\n宋鹤眠：成熟的大人会把自己的工资卡花得一干二净，连余额都说不出来？\n江稚：……\n宋鹤眠：成熟的大人会……\n江稚：停停停，你是老大，你说了算！\n——　\n一句话简介：“我的太太，是我一手养大的。以前管我叫哥哥，现在管我叫老公。”", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "医生", "年龄差"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "秦律师，复合吗", "fullTitle": "秦律师，复合吗", "link": "https://fanqienovel.com/page/7620095920746531865", "data": [3.35, 3.51, 3.75], "trend": 0.4, "latest": 3.8, "wordNumber": 223455, "creationStatus": 0, "desc": "【破镜重圆，1v1，追妻火葬场】\n【傲娇律师x明艳大美人】\n对家举报姜岁禾拍小视频传播盈利。\n姜岁禾气不过，找律师反击。\n律师是她前男友。\n前男友看完视频，阴阳怪气：\n“分手四年，你涉猎的知识不少。”\n姜岁禾解释：“只是借位而已。”\n“他把手放在你的腰上，揉捏，摸蹭，也是借位？”\n姜岁禾：“……”\n-\n委托秦律师的第一天。\n他公事公办，眉眼料峭：“把我从黑名单里放出来，后续同步向你跟进。”\n委托秦律师的第二天。\n他一本正经，收集材料：“你和拍视频那男的是否发生过x关系？”\n“你们是什么关系。”\n“私下接触过最深有多深。”\n姜岁禾：“？”\n委托秦律师的第三天。\n姜岁禾被他堵在公司门口，面无表情的三个字：\n“下班了？聊会案子。”\n姜岁禾：“……”\n就这么点案子，要聊这么多次吗？\n-\n秦律师说他从不吃回头草。\n根本没想过复合这回事。\n天下女人多得是，他又不是找不到。\n分手这么多年，感情早就淡了。\n朋友：“天塌下来还有秦律师的嘴顶着。”\n-\n小剧场：\n某天。\n姜岁禾说：“我想生个优秀的宝宝。”\n秦律师拿出从3岁到30岁的辉煌战绩，精彩履历，智商测试高分表，矜持而傲娇地开口。\n“你看我的基因行吗？”", "tags": ["职场婚恋", "现代言情", "破镜重圆", "律师", "追妻火葬场", "1v1"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一眼情深不负悦，余生朝夕皆伴君", "fullTitle": "一眼情深不负悦，余生朝夕皆伴君", "link": "https://fanqienovel.com/page/7640815035899448344", "data": [2.76, 3.02, 3.14], "trend": 0.38, "latest": 3.1, "wordNumber": 287597, "creationStatus": 1, "desc": "【都市职场 甜宠 暗恋成真 体制内 1v1 双洁 HE 双向奔赴 年龄差 高冷×独立】\n她是业务过硬的年轻科长，做事较真，从不服软。 \n他是寡言克制、让人又敬又怕的年轻领导。\n男人得知她要去相亲，他连夜从外地赶回来，她家楼下等了一夜，不敢敲门。\n理智战胜不了情感，地下车库强吻：“我有没有名分？” \n他护她于风雨，她暖他于日常。 \n始于猫，终于爱，体制内，双强双向，克制深情，\n从暗恋三年到步步为营靠近，\n这是一场迟到了三年的双向奔赴。", "tags": ["职场婚恋", "现代言情", "暗恋", "甜宠", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都市：一撞成婚", "fullTitle": "都市：一撞成婚", "link": "https://fanqienovel.com/page/7645558905812028441", "data": [2.88, 2.76, 3.25], "trend": 0.38, "latest": 3.3, "wordNumber": 193895, "creationStatus": 1, "desc": "夏沐在二十五岁那天和程氏集团总裁程青砚领证了。\n夏沐和柴珩相恋三年，今天是两人约定好领证的日子，夏沐在民政局等了一个小时，还不见柴珩的身影，她掏出手机给柴珩打电话，对方没接，随后给她发了一条消息：【对不起小沐，雪儿她生病了，我们改天再领证吧。】\n陆雪儿，柴珩的青梅竹马。\n夏沐看着这条消息，愣了半天，嘴角扬起一抹自嘲的笑容：“还是输了啊！”随后她收拾好自己的证件，转身朝着门外走去。\n程青砚刚下飞机，便被自己母亲的一通电话叫来了民政局，他走到门口，刚准备伸手去推门……\n夏沐一拉开门，便撞进了一个人的怀里，她鼻尖嗅到了一股淡淡的松木香气，\n“你没事吧？”\n头顶传来一道清透温润的声音。\n夏沐抬起头看着眼前的人，她眨了眨眼睛，“先生，有兴趣领个证吗？”", "tags": ["职场婚恋", "现代言情", "总裁", "先婚后爱", "豪门世家", "医生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "十年执念，等一场迟到重逢", "fullTitle": "十年执念，等一场迟到重逢", "link": "https://fanqienovel.com/page/7636255485590522905", "data": [2.83, 2.98, 3.14], "trend": 0.31, "latest": 3.1, "wordNumber": 165538, "creationStatus": 0, "desc": "【暗恋】【双洁】【十年等待】【重逢】【甜宠】\n从小门对门的邻居，翟欣欣是跟在陈廷周身后长大的小尾巴。\n年少盛夏，他们许下约定：北城大学，不见不散。\n可高考意外失利，她骤然远赴异国，断了所有音讯，从此消失在他的世界里。\n一晃十年光阴，陈廷周留校北城，把那份深藏心底的爱意，悄悄封存了许多年。\n年岁渐长，家人催婚，他妥协开始相亲，试着放下过往，接受新的缘分。\n昔日邻家少女骤然归国。\n再次对上她眉眼的那一刻陈廷周才恍然明白：岁月隔了十年，人事几经变迁，可他心底那份藏了半生的喜欢，从来没有半点消减。\n旧情难忘，年少意难平，这一场迟到十年的重逢，终究还是乱了他整颗心。", "tags": ["职场婚恋", "现代言情", "暗恋", "青梅竹马", "双洁"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怀孕三月，死去的丈夫失忆回来了", "fullTitle": "怀孕三月，死去的丈夫失忆回来了", "link": "https://fanqienovel.com/page/7638723178730114073", "data": [5.15, 5.3, 5.43], "trend": 0.28, "latest": 5.4, "wordNumber": 238356, "creationStatus": 1, "desc": "天灾水患那日，廖晴在无人得知的地方杀了自己新婚半年的丈夫周鸣山，亲眼看着他身影沉进水底彻底消失。\n她向来不是什么好女人，仗着好家境嚣张跋扈，坏事做尽，无论什么总有自己的一套道理和理由，甚至被至亲赶去这偏僻地方改过也是因为从前犯了恶毒的过错。\n周鸣山是廖晴小时候捡回家的，他向来只会端着一副正直良善的模样对她说教，处处帮着外人，格外令人生厌。\n但最后，他成了她的丈夫。\n在她最落魄，满怀怨恨时际，他甚至敢威胁她。\n廖晴忍无可忍了。\n周鸣山的死，除了她，所有人都只以为是天灾意外。\n她成了年纪轻轻的寡妇，可怜又悲哀。\n也因为周鸣山的死，廖晴如愿被家人宽容饶恕，过了一阵安生日子，这段时间，她极其安分守己，也惴惴不安。\n只因为周鸣山的身影总阴魂不散，日日入她梦中，恶鬼一般面目狰狞双眼赤红地紧盯着她不放，不知是在恨她，还是想杀了她，想将她拆之入骨。\n清明那夜，火光之下，日夜梦魇中的他步步靠近，还是来找她算账了。\n\nps：失忆梗，真坏女主，又坏又怕死，有点良知但不多，会把善良老实人男主逼疯，逼黑化，然后在挣扎扭曲中妥协（接受不了女主真做过坏事的就不看了哈，女主不太懂爱，男主疯爱）", "tags": ["职场婚恋", "现代言情", "日久生情", "打脸", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一纸借调，顶头上司竟是我前男友", "fullTitle": "一纸借调，顶头上司竟是我前男友", "link": "https://fanqienovel.com/page/7641060152770055192", "data": [6.14, 6.1, 6.34], "trend": 0.2, "latest": 6.3, "wordNumber": 251118, "creationStatus": 1, "desc": "【久别重逢+破镜重圆 + 体制内职场+双洁he 】\n\n许诗念这辈子最后悔的事，不是跟江时序谈恋爱，也不是没跟他去京北。\n是她妈当年说的那句“女孩子当老师好，稳定”。\n稳定到，五年后她的前男友成了她的顶头上司的顶头上司的顶头上司。\n——\n暑期，一纸借调令，砸碎了许诗念的暑假梦。\n然后，她遇到了那个人。。\n那个人，五年前她喊他“江时序”，他在她宿舍楼下等两个小时也不催她。\n现在她得喊他一声“领导”。\n并且他不用等任何人。\n……\n★因为是体制文，简介比较简单。\n喜欢体制，久别重逢，破镜重圆这个题材，可移步正文观看！！！", "tags": ["职场婚恋", "现代言情", "职场", "破镜重圆", "双洁", "久别重逢"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [4.73, 4.76, 4.92], "trend": 0.19, "latest": 4.9, "wordNumber": 192916, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "楼上来了个兵哥哥", "fullTitle": "楼上来了个兵哥哥", "link": "https://fanqienovel.com/p  26.99, 26.99], "trend": 2.14, "latest": 27.0, "wordNumber": 1026838, "creationStatus": 0, "desc": "[大家说被简介耽误了，本人简介无能，看内容吧］\n穿成惨死的冤种女配？不怕，开局杀女主，剧情崩塌，一切洗牌重来。\n　　这一世，我就是女主。\n　　这本书的设定是女主是外室生的小可怜，起点低，光环强，不管遇到什么危险总会逢凶化吉，逆境重生，最后走到人生巅峰。\n　　而她，是女主同父异母的冤种妹妹，父亲唯一的嫡女。\n　　穿越之后掏心掏肺的对女主好，人家发达后，照样抽她仙骨，毁她全族，她终究逃不过惨死的命运。\n　　既然改变不了命运，那就将命运的源头直接掐死。\n【本书是偏正统一些的修仙文，注重主角个人历程，大家齐心协力突破桎梏，不恋爱，友情师门羁绊为重，不写师门斗雌竞雄竞等等，希望大家多一点儿耐心，谢谢】\n——\n避雷：偏传统修仙，人物成长会更符合逻辑，不是一天筑基三天结丹的爽文，筑基打死金丹的剧情有，不可能出现筑基一拳打死元婴的夸张剧情，看爽文的慎入。", "tags": ["玄幻言情", "古代言情", "穿越", "嫡女", "穿书", "虐渣", "今穿古", "打脸", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门反派疯批，唯有师妹逗比", "fullTitle": "满门反派疯批，唯有师妹逗比", "link": "https://fanqienovel.com/page/7134523177480227854", "data": [36.46, 38.24, 38.24], "trend": 1.78, "latest": 38.2, "wordNumber": 3531711, "creationStatus": 0, "desc": "一朝穿书，叶灵泷成了修仙文里的恶毒炮灰女配，资质奇差还在修仙大会上胁迫女主带她进第一宗门，入门后处处跟女主作对最后惨死收场。\n　　为了快乐苟活，叶灵泷当场放弃胁迫女主，扭头就进了修真界最差的门派，这恶毒女配她不当了！\n　　本以为进个最差宗门能吃喝玩乐苟日子当咸鱼，谁知这最差的宗门里全员都是疯批反派，随时走在黑化边缘，准备给女主挨个送头。\n　　啊这…她们门派要是马上要团灭了吗？不慌，这题她会。\n　　大师兄满门被灭后复仇杀穿整个修真界最终被女主打败？小师妹：师兄我知道她什么修为什么功法多少秘宝，快，卷起来！咱不能输！\n　　二师兄身藏妖族血脉隐忍躲藏却被人发现群起而诛之？小师妹：躲什么？牛逼血脉两界通杀，去征服两界奉你为主啊！我知道两界传送门在哪！\n　　三师兄金丹破碎经脉全废走火入魔后成为联手歼灭的大魔头？小师妹：我知道哪里可以重练金丹重塑经脉，稳住，这波团战我们能赢！\n　　四师兄苦恋女主爱而不得为情所伤最后黑化被男主所杀？小师妹：你这样不行，舔狗一号送法宝，舔狗二号签契约，你这舔狗N号不如去送个命？\n　　他们这哭哭唧唧柔柔弱弱又煽风点火疯言疯言的小师妹，是猴子请来的逗比吧？", "tags": ["玄幻言情", "古代言情", "穿越", "反派", "穿书", "异世穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [22.74, 23.6, 24.39], "trend": 1.65, "latest": 24.4, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [41.06, 42.22, 42.22], "trend": 1.16, "latest": 42.2, "wordNumber": 3243667, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [26.81, 27.25, 27.92], "trend": 1.11, "latest": 27.9, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [21.47, 22.56, 22.56], "trend": 1.09, "latest": 22.6, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠摆烂拯救了全宗门", "fullTitle": "我靠摆烂拯救了全宗门", "link": "https://fanqienovel.com/page/7153918048745819172", "data": [58.44, 59.48, 59.48], "trend": 1.04, "latest": 59.5, "wordNumber": 1899187, "creationStatus": 0, "desc": "（实体第二册已出）叶翘一觉睡醒穿成了万人迷小说里的工具人二师姐。\n小说里小师妹有难二师姐上，小师妹想要神器，二师姐去拿，小师妹没有灵根，要挖她的灵根。\n叶翘心态崩了，连夜下山，撂担子不干了。\n这工具人谁爱当谁当。\n……\n新宗门的师兄们一切都好，手拿剧本的叶翘却知道这些人都是万人迷女主的鱼。\n丧气厌世的大师兄是爱而不得的舔狗，最终为女主牺牲。\n自打叶翘来了后，他也不不丧了，也不想着去死了，而是整日追着叶翘咆哮：“以后再敢逃课试试！”\n二师兄是个天才男配，因为无法破境，而生了心魔最后死在雷劫。\n叶翘试探性发出邀请：“大道至简，无欲则刚，二师兄，一起摆烂吗？”\n二师兄：“……”好像有些道理？\n天才丹修三师兄是备胎男配，为女主提供各种丹药被榨干所有价值，只得到一句‘我们只是朋友’\n叶翘来了后，三师兄满脑子都是炼丹炼丹，努力投喂小师妹。\n天生剑骨的四师兄为了女主，断送修为，自毁道心。\n叶翘抽出一把剑，认认真真：“心中无女人，拔剑自然神，女人，只会影响你拔剑的速度。”\n四师兄看着神神叨叨的小师妹：“？”\n自从叶翘来了后，他们不围着女主转了，整个门派鸡飞狗跳。\n原文女主：“？”\n我的万人迷光环呢？", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "虐渣", "今穿古", "异世穿越", "打脸", "群像", "魂穿", "剑修"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大师姐是修仙界鬼见愁", "fullTitle": "大师姐是修仙界鬼见愁", "link": "https://fanqienovel.com/page/7382011300081060889", "data": [17.91, 18.52, 18.84], "trend": 0.92, "latest": 18.8, "wordNumber": 1059072, "creationStatus": 1, "desc": "【已签约出版】（私设多，切忌套公式）\n【和死对头杀穿修仙界+超绝活人感cp＋双强天才成长流+有大基调+易燃易爆炸+微群像+姜郎才烬he】\n暴力嚣张女vs嘴毒腹黑男\n燃！战斗向！从身到心成长型男女主，剧情流有脑修仙文！\n睚眦必报的短命天才少女穿越了！\n本以为是普普通通的修仙世界，却在这里遇到了以为自己手握剧本的穿书女、走龙傲天剧情的气运之子、从天才宝座坠落后本该堕魔的大反派？\n这是一个棋子掀翻棋盘，干掉棋手的故事。\n*\n【一不小心和对家顶流谈恋爱了咋办？】\n听说不朽仙门的首席大师姐和北斗剑宗天生剑骨的小师叔不对付，见面就掐架？\n狐朋狗友：“我说，你和盛大剑仙这么你来我往的打拉锯战已经这么久了，什么时候正式结为道侣啊？”  \n姜珩伸出一根手指摇了摇：“你不懂，暧昧期才是最上头的。谈上了，就不好玩儿了。”\n*\n“放眼神州，也就他配得上我。”\n“放眼神州，还有谁比我更配你？”\n*\n“久仰大名，初次见面，我是来杀你的。”\n“天诛而不死者，是为仙。诛天而创世者，方为神。”\n“告诉他们，弑神者，姜珩。”\n【简介无能，移步正文】", "tags": ["玄幻言情", "古代言情", "穿越", "天才", "强强", "群像"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [23.85, 24.76, 24.76], "trend": 0.91, "latest": 24.8, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "看到这个机缘了吗？我的我的我的", "fullTitle": "看到这个机缘了吗？我的我的我的", "link": "https://fanqienovel.com/page/7599147863683124248", "data": [18.92, 19.35, 19.68], "trend": 0.76, "latest": 19.7, "wordNumber": 991776, "creationStatus": 1, "desc": "本书改编两个漫剧均已上线。\n点击小说任意一章内容右下角改编剧场即可观看，或进入抖音或者红果搜索《清冷大小姐她开两个挂》和《修仙女配不当垫脚石》，改编了两个漫剧哦。\n【穿书+马甲文+无cp+大爽文+不雌竞+打脸、报复速度极快+金手指巨大】\n林望舒眼睛一闭一睁，就从21世纪大好青年穿书成为一本玄幻狗血甜宠文反派。\n而且是暗恋男主不成，即将被女主打脸，被男主虐杀的反派。\n恰好在此时，天降系统。\n系统可以每个月提供一次抽奖，然后将林望舒身上随机一物十倍膨胀。\n水灵根？十倍膨胀通明冰骨水天灵根！\n宠物灵狐？十倍膨胀守护神兽九尾天狐！\n玄级灵宝破甲弓？十倍膨胀地阶法器冰凝弓！\n筑基期马甲？十倍膨胀金丹期护道者。\n从此以后，通天宗新一代小师祖、玄灵大陆第一妖孽横空出世。\n而林望舒本人，看着自己上辈子出生自带的读档系统笑而不语。\n男女主的机缘？我的了。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "无CP", "打脸"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主都是恋爱脑，只有我是真修仙", "fullTitle": "男主都是恋爱脑，只有我是真修仙", "link": "https://fanqienovel.com/page/7587644291774696510", "data": [52.89, 53.31, 53.6], "trend": 0.71, "latest": 53.6, "wordNumber": 1656318, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n【女主修仙升级流爽文+符道天才+大后期古神苏醒】\n桑渔入仙门那天，修仙界南域多了个天灵根天才。\n剑修、法修、丹修、阵修、御兽任她选？\n不，她只想安静画个画、做个符修！\n仙门众长老力劝：符修只是辅修，在修仙界毫无地位可言，狗都不修！\n后来：\n仙门众天才：谁说符修只是辅修、全是垃圾？给老子站出来！\n特么！他们都被桑渔这个变态画的符炸冒烟了。\n仙门众弟子：狗都不修我修！我要当符修！\n符修能越阶杀人！炼气战筑基、筑基战金丹、金丹追着元婴满世界跑……\n可他们往死里修，都修不到桑渔这样儿啊！\n桑渔：上辈子我被古神砸死了，这辈子靠抄袭古神身上的符文成为符道天才不过份吧？\n再后来：\n修仙界南域最顶尖的仙门为了抢天才入门，不惜派出同为天才的金丹美男——逼婚桑渔联姻。\n桑渔：正好我体内养了头吞金兽，来点灵石花花~\n再再后来：\n桑渔飞升上界后，苏醒后的古神紧捂兽皮、眼神幽幽地盯着她：“要抄这里的可以，必须对我负责！”\n一生痴迷于符道无法自拔的桑渔、看着眼前这尊帅到没朋友的真神，摸着下巴抹去口水为难道：“我、桑渔，愿为艺术献身——”\n \n（境界：炼气—筑基—金丹—元婴—化神—炼虚—合体—渡劫—大乘）", "tags": ["玄幻言情", "古代言情", "幻想言情", "穿越", "空间", "天才"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怎奈她一身反骨，就爱给众神添堵", "fullTitle": "怎奈她一身反骨，就爱给众神添堵", "link": "https://fanqienovel.com/page/7451062991820164158", "data": [18.35, 18.71, 18.95], "trend": 0.6, "latest": 18.9, "wordNumber": 366467, "creationStatus": 0, "desc": "今日《神仙日报》头版头条：\n　《注意！天庭新增反骨仔一位！》\n　　据悉，此人乃是三坛海会大神新领养的小跟班，人送外号“四姑奶”。\n　　孙大圣明着反，二郎神暗着反，三太子随时反，四姑奶你反我就反，反必跟随。\n　　这几个人不干别的，光是聚在一起唠唠嗑，玉帝就睡不着觉。\n　　你说说他们，自身实力强悍也就罢了，后台还一个比一个硬。\n　　太乙真人、玉鼎真人、菩提老祖……\n　　前两位不能撕破脸，后面那位更是完全惹不起，也就那个四姑奶没什么背景，只有一个爷爷，似乎在天庭打工。\n　　满天神佛，沈芙星随身携带画像，逢人就问：“你好，见过我爷吗？”\n　　都没见过。\n　　天兵和仙侍里也找不到这个人。\n　　倒是鸿钧老祖和蔼地端出一碟糯米糍，用拂尘指了指，笑道：“孩子，你若吃完这碟点心，我便与你结为兄妹。”\n　　菩提老祖：套镇元子公式，扣分！抢我台词，扣大分！！叉出去！！！", "tags": ["玄幻言情", "古代言情", "幻想言情", "古色古香"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [16.52, 16.68, 17.03], "trend": 0.51, "latest": 17.0, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听说我死后成了反派白月光", "fullTitle": "听说我死后成了反派白月光", "link": "https://fanqienovel.com/page/7383825464940317720", "data": [31.64, 31.89, 32.11], "trend": 0.48, "latest": 32.1, "wordNumber": 476600, "creationStatus": 0, "desc": "【实体书已上线】桑念不小心爬到了修仙界，成了书里下场凄惨的恶毒女配。\n　系统：你的任务是嫁给男配谢沉舟，虐待他，羞辱他，然后被他嘎掉。\n　桑念：ok(挥舞小皮鞭)（打中自己）（噗通倒地）\n　系统：（沉默）（望天）\n　系统：任务更改，你给我攻略他，失败就去挖煤\n　桑念：（自信一笑）这简直易如反掌\n　然后她就成功被谢沉舟嘎掉了。\n　她以为自己会被送去隔壁世界挖煤，可再睁开眼，她重生到了三百年后。\n　系统很沉重：“网卡来晚一步，你有了新的任务。”\n　桑念：“是什么？”\n　系统：“救赎黑化成反派的谢沉舟，让他变成一个懂爱的正常人，重点是让他停止灭世。”\n　桑念：“……”\n　#这个反派，我曾见过的#\n　#你怎么不等大结局再来呢#\n　#要不你还是把我删了吧#\n　*\n　谢沉舟恨桑念。\n　所有人都这样认为，包括他自己。\n　可她死的那一日，谢沉舟弃仙途入魔道，纵身跃下无尽炼狱。\n　他踏过忘川河中无数浮沉尸骨，一寸寸翻遍三百里黄泉。\n　冥界震荡，恶鬼嚎啕，两岸仙神皆闻之色变。\n　人人都道谢沉舟疯了。\n　只有谢沉舟知道，他只是想找回一个人。\n　他的妻子，他的……念念。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "甜宠", "反派", "异世穿越", "HE"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [24.81, 24.93, 24.99], "trend": 0.18, "latest": 25.0, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被夺气运后，我靠双修飞升成神", "fullTitle": "被夺气运后，我靠双修飞升成神", "link": "https://fanqienovel.com/page/7614732062435593241", "data": [16.91, 16.99, 17.07], "trend": 0.15, "latest": 17.1, "wordNumber": 389600, "creationStatus": 1, "desc": "【刚出评分！还会涨的！】\n【男全洁+修仙+系统+万人迷+1vn+多男主全收】\n【万人嫌变万人迷】\n穿成被绿茶夺走气运的万人嫌炮灰，沈微澜睁眼就发现自己正压在冰清玉洁的化神期师尊身上。\n面对高岭之花拼死压抑的喘息，她选择直接强上！\n绑定双修逆袭系统，只要撩拨那些曾偏心绿茶的男神们，就能夺回气运，原地飞升！\n从此，剧情走向彻底崩坏——\n傲娇小师弟眼尾泛红，将她堵在墙角：“我中了你的情蛊，你要对我负责到底！”\n一向端方守节的温润大师兄步步紧逼……\n至于那晚被强上的高冷师尊？他红着眼：“逆徒，你到底还有多少事瞒着为师？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "冰山", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.08, 41.16, 41.17], "trend": 0.08, "latest": 41.2, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗都是舔狗，小师妹是真狗", "fullTitle": "全宗都是舔狗，小师妹是真狗", "link": "https://fanqienovel.com/page/7200755351845604355", "data": [26.79, 26.83, 26.83], "trend": 0.04, "latest": 26.8, "wordNumber": 4170637, "creationStatus": 0, "desc": "【实体书《一念凤兮》全平台可购】凤溪穿成修仙文里面的炮灰女配，穿书之日就是忌日。\n她为了苟命，千方百计脱离了女主所在的混元宗，加入了玄天宗。\n嚯！\n五个亲师兄，在书里全都是女主的舔狗，一个比一个死的惨。\n凤溪邪魅一笑：“舔狗了不起？有我狗吗？”\n大师兄身中剧毒，只有女主的血能够解毒，从此对女主情深似海，最后却被女主一脚踹入万丈魔渊，魂飞魄散？\n凤溪屁颠屁颠端来一大盆狗血：\n“师兄，喝我的！我的剂量大，药效足！”\n吞服完解毒丹，正准备割破手指的女主：“……”\n二师兄身具餍族皇族血脉，女主给了他隐藏血脉的丹药，从此二师兄心甘情愿为女主出生入死，哪怕最后被女主推出去当替死鬼也甘之如饴？\n凤溪拿出人族餍族友好一万年的盟约：\n“二师兄，尽情展示你高贵的餍族皇族血脉吧！万千少女为你痴为你狂为你咣咣撞大墙！”\n女主看着手里需要三个月服用一次的隐血丹：“……”\n凤溪的人生信条：做得狗中狗，方为人上人！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满级雷灵根：卷哭修仙界", "fullTitle": "满级雷灵根：卷哭修仙界", "link": "https://fanqienovel.com/page/7578229922217331774", "data": [19.07, 19.15, 19.09], "trend": 0.03, "latest": 19.1, "wordNumber": 1371523, "creationStatus": 1, "desc": "【团宠+非传统爽文+反套路+群像+系统+无cp】（原名：满级雷灵根：卷哭修仙界）（番外会写带cp）（排雷：女主并不是一帆风顺的！并不是开局就秒天秒地的爽文！有虐点。不要带脑子看。）\n三岁的林枝意被皇帝爹爹抱上登仙山时，还叼着奶嘴。\n脑中突然绑定的系统警告她：「你是恶毒女配，将来会被抽灵根、废修为！」\n小团子歪头：「听不懂呀～」\n五年后，修仙界大比，八岁的林枝意已名动宗门。\n擂台之上，原著女主被她一道惊雷劈得连连败退，泪眼汪汪地看向裁判长老。\n林枝意收起剑，想起系统最近带她看的《琼瑶剧经典大全》，小脸一沉，痛心疾首地指向对方：\n“你只是输了比赛，我呢？我差点就输了早饭！我的灵果糕、蜜饯酥、糖醋灵鲤……要是因为你哭两声就判我输，它们不就白白牺牲了吗！”\n全场死寂。\n高座上的凤临渊一口灵茶喷出：「……这都跟谁学的？」\n恶毒女配系统本想培养专业反派，结果成了全职保姆：教法术、哄睡觉、防坏人，还要偷偷用宿主积分给自己买皮肤。\n系统日记：今天宿主又电了一个想害她的人，黑化进度+1%，但她是为了保护朋友…这算恶毒吗？在线等，急。", "tags": ["玄幻言情", "古代言情", "系统", "幻想言情", "团宠", "剑修"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿成财阀太子爷的作精前女友", "fullTitle": "穿成财阀太子爷的作精前女友", "link": "https://fanqienovel.com/page/7641635688978336792", "data": [67.24, 73.39, 73.39], "trend": 6.15, "latest": 73.4, "wordNumber": 315876, "creationStatus": 0, "desc": "「腹黑男人X娇气包｜双洁、甜宠」\n穿成财阀校园文里的恶毒女配，柯眠棠接到的任务是：半年内扮演好男主的女朋友，稳定他的反社会情绪，等原书女主出场后，然后拿钱走人，功成身退。\n男主荣涉，星云集团太子爷，白名单榜首。\n表面温润如玉，骨子里偏执病态，占有欲强到令人发指。\n柯眠棠每天战战兢兢地演着娇纵女友，生怕露馅。\n可来的第一天，她就被男主亲哭了。\n系统：“问题不大，别慌。”\n她信了。\n然而男主看她的眼神越来越不对劲，并非原著里对恶毒女配的冷漠，倒像是让人后背发凉的痴迷。\n系统又说：“别怕，小说结局是男主和原书女主在一起，既定结局。”\n她放下心来。\n后来，原书女主终于登场。\n但男主对那位真命天女兴趣淡淡，反倒对前女友兴致盎然。\n柯眠棠瑟瑟发抖：说好的原著里他会爱上原书女主呢？\n-\n终于，任务结束前一晚，她满心欢喜一亿到账。\n结果系统突然失联。\n重启后，终端程序直接被篡改，从“剧情纠正”变成了“爱上男主”。\n她懵了。\n一双大手从身后掐住她的腰，男人的呼吸落在耳畔，嗓音低哑带笑：“宝贝，你知道我为了留住你，有多辛苦吗？”\n他早在她穿来的第一天就发现了真相。\n立意：黑心的财阀继承人从不做亏本买卖。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "甜宠", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恋爱脑能传染？幸好我是个神经病", "fullTitle": "恋爱脑能传染？幸好我是个神经病", "link": "https://fanqienovel.com/page/7641990468129016857", "data": [25.8, 27.77, 29.63], "trend": 3.83, "latest": 29.6, "wordNumber": 330002, "creationStatus": 1, "desc": "冷脸萌x纯情骚＋沙雕整活+半截读心+皮肤饥渴+自我攻略\n姜灵焕穿进古早玛丽苏贵族学院文，绑定“反恋爱脑”系统，靠阻止全校磕cp、打击不文明恋爱行为续命：\n霸道少爷用广播强势示爱，全校磕爆！恋爱毒气暴涨！\n她把广播示爱爆改英语听力，全校萎掉：？这是什么脏东西\n还天天到处打击不文明恋爱行为：\n有人图书馆激吻，她将乒乓拍精准扔到两人嘴巴之间：“这不是你们的大床房。”\n有人泳池狠狠爱，她举着插线板放在泳池边：“再不出来，让你们做亡命鸳鸯。”\n有人树林里调情，她牵着几条狗冲进去：“别在小树林法天法地！”\n全校恋爱脑：姜灵焕是地狱来的魔鬼！！\n-\n姜灵焕日常被“恋爱毒气”侵扰，一被侵入就想找人亲嘴子。\n后来，她发现待在校草兼学生会会长的身边就能保持清醒，跟他碰一下，就能回血！接触越多，回血越快！\n于是，姜灵焕把谢风叙当充电宝，变着花样跟他制造接触。\n谁曾想谢风叙不仅有皮肤饥渴症，还能听见她的心声，还只能听一半！\n她内心：他手好大，感觉能一把握住我的头。胸肌练得不错。\n他听到：他手好大，感觉能一把握住我的…胸，不错。\n他：？她好变态\n她：？我冤枉 rend": 2.42, "latest": 30.8, "wordNumber": 475889, "creationStatus": 0, "desc": "【假千金+国家团宠+群像+玄学+无cp+直播算命】\n\n　　时鸢是被抱错的假千金，亲子鉴定报告一出，养父母就迫不及待将她赶出豪门。\n\n　　亲生父母家里一穷二白，气运被偷，欠债千万！\n\n　　为还债，时鸢只能干起老本行，摆摊算命，当起了玄学主播。\n\n　　“大师，我想找我女儿。”\n\n　　时鸢：“你前脚出门，你重男轻女的婆婆后脚就把你女儿卖了，现在你女儿已经上了卖器官的手术台。”\n\n　　当晚警方破获一起跨省重大买卖器官案。\n\n　　“大师，我今年五十岁，想看看我和现在的男友有没有正缘。”\n\n　　时鸢：“你亲儿子联合你男友给你买了巨额保险，还要带你出去旅游上演消失的她。”\n\n　　苦主当即断亲报警，渣男和亲儿子被捕入狱。\n\n　　“大师，我发现我家墙壁有异响！”\n\n　　时鸢：“有异响就对了，十年前你杀了人藏尸在墙壁里，她现在出来找你了。”\n\n　　……\n\n　　只要时鸢一开播，全国警方蹲点吃瓜，靠着时鸢破获了一起又一起的重大犯罪案件。\n\n　　原本被夺走气运的亲生父母哥哥，也重新走上暴富巅峰！\n（不是全文都是直播，有主线剧情的哦）", "tags": ["现言脑洞", "现代言情", "团宠", "无CP", "群像", "风水秘术"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法学校小学妹，沙雕搞事啥都会", "fullTitle": "魔法学校小学妹，沙雕搞事啥都会", "link": "https://fanqienovel.com/page/7388389162069543961", "data": [33.33, 34.31, 34.92], "trend": 1.59, "latest": 34.9, "wordNumber": 2523869, "creationStatus": 1, "desc": "【非西幻，中式魔法学院，沙雕+群像+搞笑日常，有cp】\n　　【女主沙雕搞事带偏所有人，一群神经学生搞笑学魔法的故事】\n　　黎问音一朝穿到魔法世界，在顶尖中式魔法学院里苟且偷生。\n　　剪院旗当校服，偷抢课本夺命奔跑，把各个院长气的七窍生烟，禁闭室第一贵客。\n学习魔法，植物魔法变植物大战僵尸，药剂做听音药剂，编织魔法做出来个四处创人的筋斗云！\n　　很会吐槽的学长：我本意是做一个好学生，直到她成为我的同学。\n安静的社恐学姐：她的花样层出不穷，很厉害。\n　　好奇宝宝二傻子学长：经常会非常佩服她的操作，要是我也能这么胆大妄为就好了。\n不理解其他人的学姐：我感觉她很好啊！不明白为什么那么多人说她是大麻烦。\n　　后人闻之叹之：那位学姐，是经久不衰的传奇。", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "穿越", "团宠", "异世穿越", "搞笑轻松", "群像"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "四个孩子四个妈？渣爹赶紧受死吧", "fullTitle": "四个孩子四个妈？渣爹赶紧受死吧", "link": "https://fanqienovel.com/page/7574903131662732312", "data": [26.13, 26.96, 27.55], "trend": 1.42, "latest": 27.6, "wordNumber": 959305, "creationStatus": 1, "desc": "「重生+豪门+打脸虐渣+爽文+搞笑」\n上一世，容昭宁受尽霸凌，惨死时体无完肤。\n死后，她绑定系统穿到99个世界做任务，却在噩梦中目睹家人个个下场凄惨：\n她那风流多情的渣爹身中数刀惨死。\n冷漠大哥卷入命案被判枪决。\n病娇二哥坠楼身亡。\n嚣张四弟被卖缅甸，最后做成人彘折磨至死。\n再睁眼，她重生到刚回厉家这天，那些欺凌过她的人，都将下地狱！\n听着家人重复上辈子的混账话，容昭宁直接一拳砸过去，打得几人鼻青脸肿：“从今天起，这个家我说了算！懂？”\n为扭转全员惨死结局，她专治各种不服—\n渣爹敢沾花惹草？断他桃花，设死门禁，敢反抗
