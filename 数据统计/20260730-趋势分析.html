，而我无所吊谓。”\n面对众人质疑，她：“怎么，你们屁股缝里没夹钱？”\n接受节目采访，她：“生而为人，我很抱歉；身为吗喽，横扫自由！”\n顺便还和讨厌她的嘴炮大少爷怼得有来有回\n观众：癫公癫婆，魔法披风！\n明哩：我的生活很单调，不是在犯困就是在犯贱。\n遇到虚弱的猫查不出生病原因，主人焦急万分，明哩直接读心：“没大问题，就是玩太野，虚的。”\n主人反驳说它乖巧懂事，她直接把它的老相好全部叫来。\n全员懵逼：卧槽，猫哥你玩挺花啊！\n-\n节目一出：\n网友：谩骂明哩，质疑明哩，相信明哩，追随明哩！\n粉丝：长江后浪推前浪，癫婆啥样我啥样！\n明哩：你们也真是……（扶额苦笑）\n综艺结束后，突然曝出另一位嘉宾是假千金，明哩才是真千金！\n网友：？？？\n讨厌明哩的京圈太子爷切错号掉马，皮下居然是明哩头号铁粉，对其花样百夸。\n网友：？？？\n这个世界太疯狂！\n明哩：你小子还有两副面孔？", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "娱乐圈", "直播", "明星", "搞笑轻松"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "娇软美人替嫁，冷面糙汉夜夜诱哄", "fullTitle": "娇软美人替嫁，冷面糙汉夜夜诱哄", "link": "https://fanqienovel.com/page/7633426025581399065", "data": [44.15, 51.14, 51.14], "trend": 6.99, "latest": 51.1, "wordNumber": 370888, "creationStatus": 0, "desc": "【年代+先婚后爱+体型差+5岁年龄差年上+细水长流日常+朴实奋斗】\n★娇软美腻乡村女教师x寡言重欲冷硬糙汉\n乔清妍的继姐勾搭了她的公务员未婚夫，她意外发现自己竟能听到继姐恶毒的心声。\n如果不代替继姐嫁入萧家，他们就要把自己卖给恶心的老光棍？\n为了逃离这个家，她被迫同意替嫁给继姐的未婚夫——猎户萧劲野。\n继姐心里得意：萧劲野穷得叮当响，一个瘸腿的妈，还有智障的妹，等你嫁过去就受穷受累吧。\n乔清妍觉得穷不要紧，只要人品贵重，不懒惰，日子会好的。\n继姐心道：那萧家穷就算了，萧劲野还是个不中用的东西，你就守活寡吧。\n乔清妍高兴，那可太好了，反正她也不想跟一个不爱的男人干那档子事。\n不曾想，嫁过去后，顿顿有肉吃。婆婆什么活儿都不让她干，将她宠上了天，小姑子也是可爱纯真。\n而萧劲野，更是把她宠到了骨子里，媳妇让往东，他绝不往西。\n只有一点，清妍不满意。\n萧劲野不是那方面不行吗？\n怎么一到晚上就像一头饿了多年的野狼，粗鲁的要命。\n清妍气恼：“你有完没完？”\n他哑声说：“怎么办，媳妇，真想死在你身上。”", "tags": ["年代", "现代言情", "乡村", "先婚后爱", "年龄差", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "睁眼六零军区，弄错对象被亲哭了", "fullTitle": "睁眼六零军区，弄错对象被亲哭了", "link": "https://fanqienovel.com/page/7567657861308746814", "data": [22.83, 28.59, 28.59], "trend": 5.76, "latest": 28.6, "wordNumber": 1086276, "creationStatus": 1, "desc": "睁眼六零，许穗在男人床上醒来，被狠狠折腾了一整夜，亲哭晕死过去，一夜揣上双胎\n她这才发现自己穿书了。\n穿成肤白貌美，身姿窈窕的漂亮恶毒小青梅，前往军区找男主结婚，却意外弄错对象爬错床，被迫嫁给了落魄的假少爷。\n婚后顾云舟出任务断了腿，原主转头卷钱打胎跑路，最后钱丢了，身子骨坏了，大动荡被人举报作风问题惨死。\n顾云舟不仅腿好了，还重返部队步步高升，成为有权有势军区大佬，成了军区炙手可热的存在，惹得多少人想攀上他这根高枝。\n许穗看着眼前斯文俊美的军官男人，摸着肚子里的崽：长得帅，有本事，能力强，也不是不行。\n这么好的潜力股，可不能便宜了别人。\n*\n顾云舟不喜欢许穗。\n然而，婚后自家媳妇漂亮又勾人。\n一夜就怀上他的种，还是龙凤胎。\n怀着双胎轻松考上粮站铁饭碗，转头又成为六十年代顶尖大学高级人才，发明这个，发明那个，办厂赚外汇，让大伙儿富起来，成为领导座上宾。\n两个娃随媳妇，是有名的天才儿童。\n老实婆家：瞧见没，软弱了大半辈子的老秦家终于迎来了主心骨。\n成了首长夫人的心机寡妇娘：瞧，我闺女上报纸了。\n某首长：这是咱闺女，咱闺女就是厉害。\n被许穗带富的军嫂们：谁敢说许厂长坏话，就撕谁的嘴！", "tags": ["年代", "现代言情", "穿书", "大佬", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [35.43, 37.93, 38.55], "trend": 3.12, "latest": 38.5, "wordNumber": 803068, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一胎！又一胎！绝嗣大伯哥有后了", "fullTitle": "一胎！又一胎！绝嗣大伯哥有后了", "link": "https://fanqienovel.com/page/7576258459784465433", "data": [24.27, 25.67, 25.67], "trend": 1.4, "latest": 25.7, "wordNumber": 1041991, "creationStatus": 1, "desc": "\n【穿书六零+神医系统+易孕vs绝嗣+美艳爬床女vs明面禁欲实际好色大佬】\n林幼薇穿书六零，书中林幼薇不肯离婚，丈夫为了给白月光腾位置，亲手把她送进土匪窝，她被摧残后抛下山崖死无全尸。\n结婚前夜，穿来的林幼薇果断放弃渣男，转而爬了绝嗣瘫痪大伯哥的床！\n不是说他瘫痪又禁欲，那为什么他好色还能动？\n不该发生的都发生了？\n他还夜夜笙歌！\n大家都等着看这对新人的笑话，绝嗣又瘫痪，已经是明家的弃子！！\n搭配乡下来的美艳废物，以后头顶一片绿油油，绝配！\n可是渐渐的，瘫痪的男人重新站了起来，又一次一次屡立战功！成了领导身边不可或缺的左膀右臂！\n突然有一天，绝嗣大佬的明艳娇妻孕吐了！\n众人惊！\n“看吧！他头顶果然一片绿油油，再厉害又如何，老婆给人睡了！就是没用！”\n几个月后，绝嗣大佬抱着缩小版的，和他长得一模一样的小团子出来遛弯，打脸众人，给媳妇儿正名：“这是我媳妇儿生的！我儿子！”\n众人：“——！！”\n奇迹啊！\n绝嗣大佬有后了！\n原来他头顶不绿啊！\n林幼薇也没料到，自己的神医系统还能治好男人的绝嗣，这可苦了她这个好孕体质了，生了一胎又一胎。", "tags": ["年代", "现代言情", "系统", "宠妻", "穿书", "医生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零崽崽父亲是隐形大佬", "fullTitle": "七零崽崽父亲是隐形大佬", "link": "https://fanqienovel.com/page/7489102469776034840", "data": [22.66, 23.93, 23.93], "trend": 1.27, "latest": 23.9, "wordNumber": 2909320, "creationStatus": 1, "desc": "简介：[穿越+空间+打脸+甜宠+家长里短+训夫成才]林凡穿越了，穿成年代文中谱通职工离异单亲家庭的大女儿，还成了未婚先孕的小姑娘。\n不行，必须要去找崽崽的爸爸，要他负责。爱不爱不要紧，有钱有工作生活有保障就行！\n等孩子出生站稳脚根工作稳定就去父留子独自美丽！\n最终找到了孩子的爸爸是个不学无术，无所事事吊儿郎当的二世祖！\n婚后！说好的二流子怎么越来越像隐形的大佬！", "tags": ["年代", "现代言情", "穿越", "空间", "大佬", "打脸"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生1977，不再给弟弟当血包", "fullTitle": "重生1977，不再给弟弟当血包", "link": "https://fanqienovel.com/page/7649071612280458302", "data": [27.97, 28.52, 29.02], "trend": 1.05, "latest": 29.0, "wordNumber": 363186, "creationStatus": 1, "desc": "前世林秀禾掏心掏肺活了一辈子：\n铁饭碗让给弟弟，工资全数贴补娘家，升学名额拱手送人。\n她伺候二老、帮弟弟成家、供养侄子，熬得一身病痛。\n弥留之际躺在病床上，账户里只剩七块三毛钱。\n父母理所当然：你是姐姐，就该帮衬弟弟。\n弟弟冷眼旁观：姐，你别想拖累我。\n一朝重生，她回到1977年。\n饭桌前，家人又在逼她让出人人眼红的供销社工作。\n林秀禾猛地掀翻饭桌，眼神冷彻：\n工作，不让。钱财，不贴。我的人生，从此谁也别想觊觎！", "tags": ["年代", "现代言情", "重生", "打脸", "虐渣", "家长里短", "前世今生"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男人瘫痪后，我顶骂名换儿女前程", "fullTitle": "男人瘫痪后，我顶骂名换儿女前程", "link": "https://fanqienovel.com/page/7607564482147011608", "data": [21.03, 21.36, 21.91], "trend": 0.88, "latest": 21.9, "wordNumber": 670990, "creationStatus": 1, "desc": "原书名：《守活寡，我被全村骂破鞋》\n男人瘫痪后，李俊兰从来没有想过再跟别的男人有什么瓜葛，一门心思想把三个孩子拉扯大，然而现实太残酷，在生活的重压之下，她还是选择了一条最令人不耻的路……全村人都骂她，孩子们也鄙视她，然而她却根本不在乎，为了心中的执念和目标，她甘愿做一个道德败坏的女人……这是一首绝境母亲的生存悲歌，母性的光辉与道德标准相互撕咬碰撞，孰是孰非没有标准答案，只能一声叹息。", "tags": ["年代", "现代言情", "乡村", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [27.02, 27.81, 27.81], "trend": 0.79, "latest": 27.8, "wordNumber": 469027, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [21.29, 22.02, 22.02], "trend": 0.73, "latest": 22.0, "wordNumber": 1118982, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "妹宝相亲认错男主，禁欲军官狂宠", "fullTitle": "妹宝相亲认错男主，禁欲军官狂宠", "link": "https://fanqienovel.com/page/7613573249485507608", "data": [38.69, 39.54, 39.33], "trend": 0.64, "latest": 39.3, "wordNumber": 599824, "creationStatus": 1, "desc": "（评分刚出，以后会涨）\n【穿书＋年代＋打脸爽文＋真假千金＋科研兴国】\n\n二十一世纪美女科学家苏瑶意外遭遇车祸后，穿书到一本八十年代的真假千金文当中。\n\n好消息：她是真千金。\n\n坏消息：她是悲惨女配。\n\n书中原身从乡下被认回苏家后，就各种作天作地跟假千金争宠。\n\n还用尽手段从假千金手里面抢回了娃娃亲营长未婚夫，可是男人跟她结婚后视她如陌生人，始终让她独守空房，最终她含恨而亡。\n\n苏瑶琢磨了一下剧情。\n\n争宠？\n\n她才没空去争取不爱她的家人！有那时间科研兴国，奔赴星辰大海，难道它不香吗？\n\n夺回娃娃亲？\n\n这个嘛……可以有。\n\n毕竟她看中的是独守空房。没人打扰那得多自由啊！\n\n到那时她就会有大把时间发展科研事业。\n\n于是苏瑶决定去军区跟书中的男主娃娃亲见一面。\n\n可是等他们闪婚后，事情发展怎么跟书中描写的不一样了呢？\n\n她扶腰叹：“不是说好了独守空房吗？”\n\n某军官大佬：“媳妇儿，谁跟你说好了？求亲亲。”\n\n苏瑶：……\n\n什么？她认错人了？\n\n她相看的人根本不是娃娃亲对象，而军区的冷面首长！\n\n~~~\n\n当苏瑶凭借过硬的实力带飞祖国后，书中原男主拍大腿后悔。\n\n上辈子，我怎么就没好好珍惜她", "tags": ["年代", "现代言情", "宠妻", "穿书", "打脸", "真假千金"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [29.41, 35.28, 36.75], "trend": 7.34, "latest": 36.8, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后女配才是五个哥哥的真团宠", "fullTitle": "穿书后女配才是五个哥哥的真团宠", "link": "https://fanqienovel.com/page/7215979253920173108", "data": [50.7, 53.17, 55.82], "trend": 5.11, "latest": 55.8, "wordNumber": 1123320, "creationStatus": 0, "desc": "苏莞穿书后，看着自己的人物设定和下场陷入了沉思，明明可以躺赢，却非要作死，这就是恶毒女配的标准结局？\n为了改变命运，她选择主动回到乡下，抱紧五个哥哥的大腿，谁让他们以后都是大佬呢？\n大哥入朝为官，官拜三品，二哥被神医收徒，医毒双绝，三哥上了战场，成为了大将军，四哥厨艺无双，开的酒楼被御赐天下第一楼，五哥则是天赋异禀，丹青妙绝，闻名天下，这大腿，不抱白不抱。\n可是，这顺手救回来的大佬男二是哪根筋不对了？总是美色诱惑她，还时不时扮成小奶狗装可怜，扮无辜？\n哥哥们一致认为，他不安好心，图谋不轨，但苏莞看着他这张脸却觉得，好像也不是不可以。", "tags": ["种田", "古代言情", "乡村", "穿越", "团宠", "甜宠", "穿书", "今穿古", "大佬"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家，继母渣爹跪求我回家", "fullTitle": "分家，继母渣爹跪求我回家", "link": "https://fanqienovel.com/page/7620425812189121598", "data": [28.61, 30.05, 32.41], "trend": 3.79, "latest": 32.4, "wordNumber": 571922, "creationStatus": 1, "desc": "（漫剧已出）一睁眼，林仟仟成了农家炮灰女。\n亲娘刚死，继母带着她女儿进门了，从此她和三岁的弟弟住进了柴房，一天两顿稀粥，还要挨打受骂。继母说：“女孩子家，识什么字？”转头却给继妹请了先生。\n爷奶偏心小叔，大伯母尖酸刻薄，整日惦记着把她卖个好价钱。亲爹呢？站在院里搓着手，屁都不敢放一个。\n林仟仟笑了。\n牵着弟弟的手往外走。\n“分家。”\n堂屋里一片哄笑：“一个丫头片子，带着个拖油瓶，分出去等死？”\n她没回头。\n分家后，她采野菜卖野兔赚了第一桶金。\n一个月后，她的木薯淀粉风靡镇上酒楼。\n两个月后，她买下了村东头三十亩地。\n三个月后，她要翻新老宅推倒重盖\n继母急了，爷奶慌了，亲爹站在院门口来回踱步——那院门，她牵着弟弟走出去那天，就再没打算回来。\n年底，她坐着新打的牛车经过老宅门口，继母追出来喊她的名字。\n她低头给弟弟擦了擦嘴角的油光，头都没抬：\n“娘？我娘早死了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [12.59, 13.76, 13.76], "trend": 1.17, "latest": 13.8, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被嫁给瘸腿猎户，饥荒年顿顿吃肉", "fullTitle": "被嫁给瘸腿猎户，饥荒年顿顿吃肉", "link": "https://fanqienovel.com/page/7544980163042216984", "data": [21.84, 21.84, 22.34], "trend": 0.5, "latest": 22.3, "wordNumber": 1319033, "creationStatus": 0, "desc": "【穿越+种田+医术+打猎+采药+系统+商城+空间】\nps：没有京城、朝堂、王爷、将军、简单温馨种田日常、微群像。\n凌溪从小身患心脏病，爹不疼娘不爱\n好不容易熬到医师转正，却又病发离世\n再睁眼，\n她成了饥荒年，被恶毒阿奶卖给瘸子冲喜的林西。\n一番权衡，先跟娘家断亲。\n再嫁瘸腿猎户\n没想到，成婚第二日就被公婆分出家？\n莫慌！\n进山、开荒、打猎，采草药\n一不小心还解锁了，草药图鉴系统。\n采到草药解锁图鉴\n不但有积分能在商城兑换物资，\n还能掉落丰厚的实物奖励。\n帮瘸腿相公治好腿。\n奖励更多！\n外面饥荒，饿尸殍野。\n深山之中他们天天吃肉……\n不太会写简介，大家移步正文！", "tags": ["种田", "古代言情", "系统", "穿越", "空间", "医术"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家小福星，全家反派都慌了", "fullTitle": "穿成农家小福星，全家反派都慌了", "link": "https://fanqienovel.com/page/7629967669818575897", "data": [13.53, 13.91, 13.91], "trend": 0.38, "latest": 13.9, "wordNumber": 665517, "creationStatus": 1, "desc": "评分刚出会长得（漫剧上线，欢迎观看）\n【读心+种田+团宠+萌宝】\n\n云生生穿书了，成了书里3岁还不会说话的小傻子。\n\n一家子恶毒反派，花样作死，妥妥就是女主一家的对照组。\n\n云生生麻了，有苦说不出\n\n却不知一家人都能听到她的心声。\n\n她爹心狠手辣，杀人埋尸？结果那人好好活着，还和她爹合伙做生意\n\n她娘丧心病狂，在席面里投毒？结果她娘做饭越来越好吃，家家排队请她做席面\n\n大姐嫌弃姐夫多年科考不中，闹着和离还打死婆婆？结果大姐起早贪黑挣钱，供姐夫读书\n\n二姐重伤世子爷，还把他扔到荒野里喂狼？结果二姐把人背回家，还好生伺候\n\n三姐偷了钱跟着小白脸私奔，然后被卖青楼？结果三姐把小白脸变太监，还进宫\n\n四姐女扮男装入匪寨打家劫舍，然后被枭首示众？结果四姐女扮男装入军营，屡立战功\n\n以前众人嘲笑：云老二没儿子，要绝后\n\n后来众人跪舔：云大人的闺女各个大出息，一个顶十个儿子，牛啊！\n\n云家五朵金花，四个姐姐都名花有主，众媒婆赶紧盯上了最小的香饽饽，门槛差点被踩烂。\n\n宴时瑾拉着云生生的手让她看：“我为你准备了白玉金丝镶五彩宝石花盆……”\n\n云生生：“……”\n\n【云生生穿书/宴时瑾重生/原书女主穿越】", "tags": ["种田", "古代言情", "乡村", "萌宝", "团宠", "穿书"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放，神医小娇妻救了国公府满门", "fullTitle": "流放，神医小娇妻救了国公府满门", "link": "https://fanqienovel.com/page/7182987297330039840", "data": [29.77, 30.03, 29.97], "trend": 0.2, "latest": 30.0, "wordNumber": 1167916, "creationStatus": 0, "desc": "【空间+女主神医+女强+爽文+虐渣+发家致富+全家流放逃荒，女主能力强，空间辅助】\n特种军医穿越古代，刚穿越就与历史上的大英雄墨玖晔拜堂成亲。\n据历史记载，墨家满门忠烈，然而却因功高盖主遭到了皇上的忌惮，新婚第二日，便是墨家满门被抄家流放之时。\n了解这一段历史的赫知冉，果断使用空间搬空墨家财物，让抄家的皇帝抄了个寂寞。\n流放前，又救了墨家满门的性命。\n担心流放路上会被饿死？这不可能，赫知冉不但空间财物足够，她还掌握了无数赚钱的本事。\n一路上，八个嫂嫂视她为偶像，言听计从。\n婆婆小姑默默支持，但凡有人敢说赫知冉不好，老娘撕烂你们的嘴。\n终于安顿下来，日子过得一天比一天红火。\n墨玖晔：“媳妇儿，我们成亲这么久，还没有洞房呢！”\n赫知冉：“想洞房，得看你表现。”\n墨玖晔：“我对天发誓，一辈子心里只有你一个女人，不，下辈子、下下辈子也是。”\n赫知冉：“你说话要算数……”", "tags": ["种田", "古代言情", "穿越", "空间", "女强", "虐渣", "今穿古", "打脸", "逃荒", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "中奖10个亿的护士躺平生活", "fullTitle": "中奖10个亿的护士躺平生活", "link": "https://fanqienovel.com/page/7653831326541286462", "data": [14.35, 16.93, 22.65], "trend": 8.29, "latest": 22.6, "wordNumber": 379546, "creationStatus": 1, "desc": "沈南星三十七岁，在三甲医院急诊科做了十二年护士。她曾以为和医生丈夫一起进医院、结婚生子、买房还贷，就是普通人最稳妥的人生。可十二年过去，她熬过夜班，生下两个儿子，撑起家里家外，却在医院改革中被裁，失去工作后，婆婆态度骤变，丈夫沉默回避。最终，离婚了，那天雨很大，她路过一家彩票店，随手买下几注彩票，所有人都以为沈南星已经输了。直到她发现，自己中了十个亿........", "tags": ["职场婚恋", "现代言情", "萌宝", "家庭", "职场", "医生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚羔羊", "fullTitle": "新婚羔羊", "link": "https://fanqienovel.com/page/7586483614892690457", "data": [84.49, 87.64, 87.64], "trend": 3.15, "latest": 87.6, "wordNumber": 1026156, "creationStatus": 1, "desc": "婚后我才知道，老公有个怪癖——每晚亲热前必喝交杯酒。\n起初我以为只是夫妻间的情趣，直到一次妇科检查令真相大白，我才猛然惊觉：在这场婚姻里，我从来不是妻子，而是他精心饲养的待宰羔羊。", "tags": ["职场婚恋", "现代言情", "婚恋", "家庭", "家长里短", "第一人称"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "远嫁八年，回娘家难如登天！", "fullTitle": "远嫁八年，回娘家难如登天！", "link": "https://fanqienovel.com/page/7567928097673055256", "data": [27.49, 28.83, 28.83], "trend": 1.34, "latest": 28.8, "wordNumber": 1153838, "creationStatus": 1, "desc": "（远嫁+恶婆婆+过年不让回娘家）\n林婉怡为爱远嫁八年，一次没有回过娘家，临近过年父亲病重弟弟结婚，她提出让丈夫和女儿一起回娘家过年，却被婆家人轮番刁难。\n婆婆说：“你嫁到王家就是王家人，别一天到晚惦记娘家，给他们一百块钱，我看他们还想不想你。”\n大姑姐说：“你走了谁照顾我爸妈？谁给他们做饭洗衣服？”\n就连丈夫也唯唯诺诺：“老婆，我姐说的对，大过年的你不在村里人会笑话我们的，实在不行你打个视频跟爸妈见一面吧。”\n林婉怡愤怒不已想要带着女儿自己回去，婆婆却又藏起女儿：\n“想走自己一个人滚，不准带走我王家的子孙！”\n后来，林婉怡离了婚，带走了女儿，还把王家搅了个天翻地覆。\n王家人，终于后悔了……", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "离婚后豪门前夫彻底失了控", "fullTitle": "离婚后豪门前夫彻底失了控", "link": "https://fanqienovel.com/page/7172033185033751563", "data": [9.11, 9.87, 9.87], "trend": 0.76, "latest": 9.9, "wordNumber": 2503800, "creationStatus": 0, "desc": "【双洁+双向奔赴+先婚后爱+追妻火葬场】\n时漾年少时开始喜欢的傅景川，那时他是天之骄子，她只是不起眼的转学生，两人之间像隔着鸿沟。\n多年后同学聚会上重逢，他坐她旁边，席上两人几乎没什么交流。\n聚会结束，他顺路送她回家。\n那天晚上，两人不小心擦枪走了火。\n她意外怀孕，他问她愿不愿意结婚，她说好。\n没有婚礼，也没有祝福，两人婚后的生活像搭伙过日子，平淡且无趣。\n最终，时漾提了离婚，“傅景川，我们离婚吧。”\n他只是静静垂眸看她，然后轻轻点头，“好！”\n所有人都以为傅景川不爱时漾，包括时漾自己，直到那天，在商场熙熙攘攘的人群里，两人不经意间擦肩而过，傅景川突然一把拽住了她手臂，时漾看到了他黑眸里掀起的狂风巨浪。\n【日常风，男主爱而不自知，前期火葬场，后期甜宠（会有曲折），细腻慢热，徐徐讲故事】", "tags": ["职场婚恋", "现代言情", "总裁", "甜宠", "豪门世家", "双向奔赴", "暗恋", "1v1", "追妻"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "机关女人", "fullTitle": "机关女人", "link": "https://fanqienovel.com/page/7539124126061972505", "data": [12.38, 12.65, 12.92], "trend": 0.54, "latest": 12.9, "wordNumber": 799942, "creationStatus": 0, "desc": "农村出身的吴玫，通过公务员考试，拥有了政府机关干部的身份，本以为一朝上岸，就可衣食无忧。可树欲静而风不止，看似体面的工作，实则暗潮汹涌，危机四伏。\n　　吴玫能否适应机关工作？是任人收割？还是自主沉浮？工作与感情，婚姻与家庭，这一切能否成为桎梏吴玫成功的枷锁？\n　　请与作者一起走入机关女人的精彩生活……。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "潮汐界限", "fullTitle": "潮汐界限", "link": "https://fanqienovel.com/page/7524517490395712536", "data": [25.82, 25.95, 26.12], "trend": 0.3, "latest": 26.1, "wordNumber": 348239, "creationStatus": 0, "desc": "【实体书《潮汐界限》已上市，各平台搜索书名可买】\n办公大楼里传着两句心照不宣的话——\n一是周聿深的车驶过观复街，连积雪都会识趣地消融三分。\n二是他的行程从不为谁停留。\n后来蔚汐才知道，这两句话都是错的。\n*\n那场行业座谈会上，蔚汐被突兀地点名坐进第一排。\n全场目光灼灼，她的发言快速且精准，却仍然紧张到指尖发颤，不敢抬头看主位上那位。\n再后来，分手那天雨很大——\n她因醉酒蜷在街角等车，朦胧间看见那辆从不驻足的黑色轿车缓缓停驻。\n“蔚小姐。”男人嗓音沉缓，整洁的西装沾了雨气，“你抖得厉害。”\n他那样威严的大人物。\n竟会破例俯身撑伞，纵容她在车里哭了足足四十七分钟。\n*\n“周聿深，你图什么？”\n“潮汐有信，为我停留。”\n*\n观复街的积雪会消融，他的锋芒也会俯首。\n而潮汐界限，终抵不过他为她心软的四十七分钟。", "tags": ["职场婚恋", "现代言情", "大佬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "豪门总裁": [{"label": "哥，你再当舔狗我就舔你的死对头", "fullTitle": "哥，你再当舔狗我就舔你的死对头", "link": "https://fanqienovel.com/page/7625291986546723902", "data": [64.9, 67.8, 70.55], "trend": 5.66, "latest": 70.6, "wordNumber": 520193, "creationStatus": 1, "desc": "【奶凶大小姐+高冷年上+训哥】\n好好的人不当，非要当舔狗？没关系，你舔你的女明星，我舔你的死对头，看谁舔得过谁。\n前世惨死，周岁岁重生了，哥哥在给白莲花表白的路上。\n周岁岁不慌不忙，从包包里掏出一个小盒子，拨通哥哥视频，满脸无辜：“哥哥，这是什么呀？”\n盒子上“持久超薄”几个黑字被放大。\n哥哥直接炸毛，“你才十九岁，这玩意谁给你的？”\n岁岁歪着脑袋，“你的好兄弟江宗砚啊。”\n哥哥石化：什么兄弟？他们是死对头！\n岁岁惊讶：“哥哥，你们每次见面眼睛都瞪那么大，关系很好吧？”\n哥哥懵逼：那分明是想嘎了他。\n“不说了，砚哥哥还在酒店等我，他说教我玩个刺激的游戏。”\n酒店？游戏？\n哥哥快要碎了：“求你了，别去，哥不表白了。”\n表白取消，白莲花还等着哥哥去跟她道歉。\n然而她不知道的是，从此哥哥跟她说的最多的话是“下次，下次我一定去见你，下次一定给你买”。\n终于治好了哥哥的恋爱脑，周岁岁打算抽身而退，却发现被她死缠烂打的男人不干了。\n他将她禁锢身前，滚烫的手掌强势扣着她的腰，咬着她耳朵，语气恶劣又张狂：“宝宝你忘了，小时候哭着闹着要嫁给我？乖乖，叫老公，这十个亿是你的零花钱。”\n呵，狗男人！可他给的实在太多了。\n“老公……唔……”", "tags": ["豪门总裁", "现代言情", "重生", "冰山", "大小姐", "年龄差"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "她醉酒进错房，京圈大佬一夜沦陷", "fullTitle": "她醉酒进错房，京圈大佬一夜沦陷", "link": "https://fanqienovel.com/page/7508934595518139454", "data": [61.82, 63.53, 64.65], "trend": 2.82, "latest": 64.6, "wordNumber": 1157175, "creationStatus": 0, "desc": "【甜宠+双洁+男主一见钟情到发疯索爱】\n矜贵闷骚的集团大总裁vs清纯漂亮的小白花员工\n林媛参加朋友生日聚会，喝醉了酒，一不小心走错房间，跟陌生男人邂逅一整夜。\n第二天她看了一眼男人，怕被要求负责，匆匆就跑，本以为不会再有见面的机会，却不想隔天去医院检查的时候，又碰到了他。\n穿着白衬衫的男人，矜贵自持，高冷得不像话，“裤子脱了，我帮你检查。”\n误以为他是医生，林媛傻乎乎的听男人指挥，任他为所欲为。\n事后才发现，他竟然假借医生之名，对她欲图不轨。\n林媛吓得要跑，却被他抓住，拐上车，露出了他的狼子野心。\n“那一晚我比较吃亏，对我负责。”\n负责的代价是，她又陪了他一整晚，彻夜疯狂，弄得她腰酸腿软。\n本以为会从此一笔勾销，却不想彻底被他缠上。\n她遇麻烦，他帮她解决。\n她受欺负，他替她报仇。\n天上没有掉馅饼的事。\n林媛问他，“你想要什么？”\n傅冥修，是京圈无人招惹的集团大佬，清冷禁欲，不近女色，却在一个陌生女人进了他房间后一夜沉沦，欲罢不能。\n他对了她上了瘾，着了魔，明知道她有男朋友，却依旧想禁锢她入怀。\n直到发现她没有所谓的男朋友，他欣喜若狂，面对她问他想要什么，搂住她疯狂索吻，“我想要你。”", "tags": ["豪门总裁", "现代言情", "总裁", "甜宠", "一见钟情", "双洁", "位尊权重"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "十诫锁心", "fullTitle": "十诫锁心", "link": "https://fanqienovel.com/page/7584818220356357144", "data": [80.42, 82.46, 82.46], "trend": 2.04, "latest": 82.5, "wordNumber": 908983, "creationStatus": 0, "desc": "【强制爱+年龄差+体型差+上位者不低头+身与心的绝对掌控】\n东南亚狠厉财阀大佬 x 华国呆萌娇柔小白花　　　\n被亲叔叔骗到金三角，19岁的大二学生夏知遥沦为待宰的猪仔。\n就在生死一线间，那个缔造秩序的男人如神祇般降，将她从地狱中救出。\n他是她的救赎，却也是她的深渊。\n在无冕之王沈御面前，夏知遥渺小如尘埃。\n“记住，惩罚，就是对你的奖赏。”\n他占有她的一切，而她只能颤抖着含泪道谢。\n他用最残酷的方式将她驯服，又用最宠溺的爱欲将她占有。\n他救赎她和她的家人，也惩罚所有欺侮她的仇人。\n她在极致的痛与爱中不断沉沦……\n直到她陷入敌人之手，他擦着枪，眼底血红，杀气冲天：\n“我的东西，谁敢动？送他上天。", "tags": ["豪门总裁", "现代言情", "宠妻", "甜宠", "大佬", "年龄差"], "borderColor": "#9b59 ata": [17.67, 18.55, 18.55], "trend": 0.89, "latest": 18.6, "wordNumber": 540943, "creationStatus": 1, "desc": "（评分刚出，后期会涨）1VN+男全洁+极限拉扯+强制+悬疑+微恐\n非大女主爽文，非圣母。（再次强调，非大女主女强爽文，介意勿入，请允许有不同种类的小说）\n末世时代，不断有禁区产生，进入禁区便会累计异化值，异化值满点即为死亡。\n姜暖觉醒了唯一SSS级天赋“净化”，却有个难以启齿的秘密，必须亲密接触才能平息异化。\n为了不沦为大势力的“充电宝”，姜暖给自己立下规矩：不救人，见疯子立刻跑！\n可她还是被第一战力的“调查小组零”堵在了审讯室。\n那个能射杀禁区怪物的闷骚狙击手，枪口正抵着她的心口；温柔的医疗官正拿着针筒，眼神病态地记录她的每一次颤栗。\n冷血队长亲手撕碎她的规矩，将她禁锢在方寸之间：\n“要么被我们收容，要么去禁区喂怪物。”\n“选一个吧：是死在禁区，还是死在我们怀里？”", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别撒糯米了！我也不想冒黑烟儿啊", "fullTitle": "别撒糯米了！我也不想冒黑烟儿啊", "link": "https://fanqienovel.com/page/7569956253888171032", "data": [14.13, 15.0, 15.0], "trend": 0.87, "latest": 15.0, "wordNumber": 1091433, "creationStatus": 0, "desc": "【私设多+动植物变异+天灾+怪物+异能+微群像+升级流】\n巫泗泗满18岁生日这天，耳边骤然出现无数的呢喃声。\n除了她，没有人能听到。\n第二天觉醒台上，她又听到了呢喃，一不小心照着对方说的做了。\n然后。\n她觉醒了治愈异能，和别的治愈系那充满生机的绿光不同！\n她浑身冒黑烟儿，一看就邪！\n注册官飞快掏出一把糯米朝她撒了过去！\n巫泗泗：？\n……\n巫泗泗被录取了。\n但被高层悄悄例入【危险人物】档案！\n她最开始还很担忧，直到遇到了另外几大毒物。\n7号毒物：右簪。抽烟喝酒纹花臂，徒手撕怪物的猛人室友，最大爱好是去窝棚区救治老人小孩……\n5号毒物，童印。走到哪哪儿死人的倒霉体质，每次倒霉都要喂自己吃一颗糖……\n1号毒物：白撬秋。喜爱穿红戴绿，阳光开朗大男孩，姐姐长姐姐短的嘴甜怪，实则有着反社会人格！\n巫泗泗放心了，大家藏起来的身份都不简单，那我冒个黑烟儿也可以大大方方的。\n她表面是治愈系，实则是伤害转移。\n她净化诡异，但诡异不嚎个七天七夜就下不了线！\n她能靠献祭获得赐福、批量生产【金光甲】的能力，但献祭的东西不太正常，是怪物的眼球舌头或者死老鼠……\n高层紧张的咽了口唾沫：“呃，冒黑烟儿也没什么不好！再……再看看？”\n\n", "tags": ["科幻末世", "幻想言情", "末世", "天灾", "群像"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世菟丝花：姐夫你倒是说句话啊", "fullTitle": "末世菟丝花：姐夫你倒是说句话啊", "link": "https://fanqienovel.com/page/7601868684897815614", "data": [10.81, 11.27, 11.56], "trend": 0.74, "latest": 11.6, "wordNumber": 719298, "creationStatus": 1, "desc": "【末世+菟丝绿茶+泪失禁美人+多男主全洁+雄竞修罗场+追妻火葬场】\n女主没有异能，真普通人，但也不是真的手无缚鸡之力，她只想不劳而获罢了。\n\n云遥枝没有觉醒异能，身为普通人的她靠男友圈养着，被小队嫌弃娇贵趁她男友受伤昏迷丢弃。\n\n 好在天无绝人之路，她遇见了她姐姐的校友，不管三七二十一她直接叫姐夫认关系！\n\n她装乖示弱扮可怜，泪眼婆娑黏上大腿。\n\n姐夫，你们不会不管我吧？\n\n中途又遇见找她两年的竹马团。\n\n就是男人太多，每天都在争风吃醋，想着干掉对方。\n\n后面她找到了已经成基地长的姐姐，果断甩掉了他们，开启啃姐模式。\n\n只是为什么她那个被她单方面分手的男友也在这里？？？", "tags": ["科幻末世", "末世", "囤物资"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世文恶毒女配？嚣张一日是一日", "fullTitle": "末世文恶毒女配？嚣张一日是一日", "link": "https://fanqienovel.com/page/7478769464138288153", "data": [23.27, 23.98, 23.98], "trend": 0.71, "latest": 24.0, "wordNumber": 1532131, "creationStatus": 0, "desc": "（已出版）[女主回归+空间+位面交易+丧尸晶石+变异动植物]\n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "变成丧尸我学习母猪的产后护理", "fullTitle": "变成丧尸我学习母猪的产后护理", "link": "https://fanqienovel.com/page/7174693973267582012", "data": [14.99, 15.58, 15.58], "trend": 0.59, "latest": 15.6, "wordNumber": 310437, "creationStatus": 0, "desc": "小镇上有只奇怪的小丧尸，不吃人不吸血，只爱推着小车车屯零食。\n有一天，小丧尸辛辛苦苦囤的东西被偷了，小丧尸愤而搬家。\n新家就在养猪场，于是小丧尸过上了养猪，吃肉的幸福生活（并没有）\n小丧尸脑子空空，忘记了偷她东西的人，直到小偷再次回来。\n厉璟枫拿了小丧尸满屋子的东西，从此被缠上，小丧尸力气大，不讲理，只有香喷喷的猪肉才能哄好。\n小丧尸：让咬一口也能好。\n后来，厉璟枫用一碗肉将小丧尸骗走了。", "tags": ["科幻末世", "重生", "空间", "末世", "囤物资", "前世今生"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真公主？不，真君主！", "fullTitle": "真公主？不，真君主！", "link": "https://fanqienovel.com/page/7517228824212278334", "data": [10.83, 11.06, 11.25], "trend": 0.43, "latest": 11.3, "wordNumber": 915624, "creationStatus": 1, "desc": "（无CP+大女主+前期军校争霸+后期一统人族+热血）\n问：从君主幼年体到完成体要几步？\n幼年体凌昭：孤儿院开局，疑似金手指的游戏芯片还一直拖后腿。\n完成体凌昭：后星际第一人·第一指挥官·神级星者·人族的希望·神迹计划唯一继承者……\n后星际时代，异兽大肆入侵，帝国统治式微。在人人唱衰皇室的情况下，一个遗漏在外的公主默默绑定【万国狩猎场】的游戏芯片。\n在这里，她将作为帝国唯一继承人，以子民信仰为准入券，和其它生物进行比赛，从而赚取奖励。\n于是，卷王之旅正式开启。\n三十六校联赛冠军？拿来吧。\n天骄突围赛冠军？拿来吧。\n皇室身份、君主之冕、丢失的蓝星、散乱的人族大军？统统拿来吧。\n起初，凌昭只想做白塔市最强者，后面却在收队员和创纪录的路上越走越远，一不留神就顺手在万国狩猎场登顶了，又一个不留神就把游戏芯片玩崩了。\nN年后，被揍到鼻青脸肿的宇宙诸国：你们当初惹她干嘛？\n全人类：再渺小的人类，也有在浩瀚宇宙里留下痕迹的权利。今天也是朝伟大君主前进的一天！\n（我流星际文，世界观私设颇多，略慢热；前期军校和军营版图为主，后期游戏和宇宙诸国版图为主）", "tags": ["科幻末世", "穿越", "星际", "无CP", "异世穿越"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天灾异种：金手指？拿来吧你", "fullTitle": "天灾异种：金手指？拿来吧你", "link": "https://fanqienovel.com/page/7590885420477451289", "data": [8.73, 8.86, 8.86], "trend": 0.13, "latest": 8.9, "wordNumber": 1088705, "creationStatus": 1, "desc": "【天灾+变异+女强+重生+空间+系统农场+囤货+无CP】\n【种田流，有妹妹，有宠物】\n天灾频发、变异开启、异种降临。\n明玖——一个毫无异能的普通人，稳健地苟到了末世第7年。\n她谨小慎微，她狗狗祟祟，她能使阴招就绝不冒头，她为了得到异能勤勤恳恳种地打工……终于，在自己的安全小窝里被人一击毙命。\n死后她才知道，自己只是一本末世大男主文里的炮灰。\n炮灰她死了，炮灰她又活了，炮灰她不干了。\n男主的金手指是吧？拿来吧你！", "tags": ["科幻末世", "重生", "空间", "女强", "无CP", "天灾"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都末世了，有亿点异能很合理吧", "fullTitle": "都末世了，有亿点异能很合理吧", "link": "https://fanqienovel.com/page/7343521552446540824", "data": [11.22, 11.26, 11.31], "trend": 0.09, "latest": 11.3, "wordNumber": 912382, "creationStatus": 0, "desc": "【末世+天灾+大佬+爽文无逻辑+无cp+言灵】\n言灵师大佬凌染意外穿书末世，对于新世界，她很感兴趣。\n面对丧尸围攻\n凌染：神说，我会飞。\n异能者们看着那人明明没有翅膀，却双脚离地，腾空而起，缓缓张大了嘴巴。\n面对要去拿研究资料，异能者们束手无策之时\n凌染：神说，我会隐身。\n异能者们看着凭空消失的凌染，没一会儿就把那份研究资料从丧尸间里带了出来。\n异能者们：凌神这是什么异能？飞行、隐身双系异能？\n后来他们才知道，什么双系异能？明明是言出法随。", "tags": ["科幻末世", "穿越", "末世", "穿书", "无CP", "大佬", "天灾", "魂穿"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全民求生，我成了万年老二", "fullTitle": "全民求生，我成了万年老二", "link": "https://fanqienovel.com/page/7567215449079811097", "data": [7.55, 7.63, 7.63], "trend": 0.08, "latest": 7.6, "wordNumber": 823819, "creationStatus": 0, "desc": "【无cp+囤货+无限流+天灾+有队友+美食+微恐】\n【刚开分，慢慢会长的，走过路过不要错过，进来看看吧～】\n　　作为群居动物的人类都知道，在一众榜单中，你能记住榜一，因为他可能是领头的羊，善战的狼，敏捷的豹，远见的鹰。\n　　你也能记住老六，因为他就是搅屎的棍，划水的鱼，装饭的桶，退堂的鼓。\n　　但你唯独记不住老二，这个实力不祥，名字不详，登上榜单好像只是为了凑数的存在。\n　　上一世李橙子先是成为老六在求生游戏中搅了个天翻地覆，随后成为榜一。\n　　享年25，卒！\n　　重活一世，她发誓要苟成榜二，做路人甲，做大众脸，在无人在意的角落里，默默发展。\n然而随着她来到1区，不断闯过一个又一个城市，她发现事情没有她想的那么简单，这款求生游戏的终点不是个人的生死而是种族的较量。\n有比较搞笑的部分，有比较压抑的部分，非温馨轻松向。", "tags": ["科幻末世", "重生", "末世", "美食", "无CP", "囤物资"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "温软玫瑰沦为他心尖偏宠【末世】", "fullTitle": "温软玫瑰沦为他心尖偏宠【末世】", "link": "https://fanqienovel.com/page/7245170805103922191", "data": [8.07, 8.07, 8.1], "trend": 0.03, "latest": 8.1, "wordNumber": 360560, "creationStatus": 0, "desc": "【架空末日背景＋渣男火葬场＋死对头反派上位＋修罗场＋双向救赎＋苏撩＋浪漫主义美学＋双洁】\n【温柔坚定正道曙光x斯文变态笑面虎（骚断腿】\n温瑶到死也没想明白，她喜欢沈逸川什么，喜欢他的冷酷薄情，还是喜欢他的自私自利？\n作为搭档，她为他出生入死七年，却在遇险时被他果断放弃。\n他说：“你已经感染尸毒了，不能留在列车上。”\n他说：“温瑶，我以为你很懂事。”\n—\n再次睁眼，她看见了死对头季明尘的脸——那个桃花眼温柔面，惊艳绝尘，杀人从不眨眼的变态。\n男人用沾血的手指挑起她的下颚，笑时气息撩人：“我救了你？你要怎么报答我？”\n温瑶鼻尖酸涩，心一横，仰头贴上了男人的唇。\n本来只是惯例调戏她的季明尘：“！？”\n—\n后来，沈逸川寻遍尸海，日夜痛悔，等到终于再见，他悲喜交加，红着眼卑微祈求：“回来，阿瑶……”\n却见温瑶身后徐徐走来一位白衣男人，男人亲昵地将手搁在她的双肩，笑看向对面时，在她耳畔温柔吐息：“当初怎么教你的，嗯？”\n“对敌人的仁慈，就是对自己的残忍。”", "tags": ["科幻末世", "末世", "反派"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "穿书：侯爷，夫人又给你纳妾了", "fullTitle": "穿书：侯爷，夫人又给你纳妾了", "link": "https://fanqienovel.com/page/7563282810547473433", "data": [26.18, 30.75, 31.01], "trend": 4.83, "latest": 31.0, "wordNumber": 1014007, "creationStatus": 0, "desc": "穿书+宫斗宅斗+重生的儿子+爽文+躺平的一生\n争家产大获全胜的林嫣然，因为太高兴参加极限运动摔死了，有幸穿到了一本她看过的小说里，她成了因为小说男主养外室抑郁而死的正室女配。\n书中女主当然就是成功登堂入室的那个外室。\n本来林嫣然都把袖子撸起来了，准备搬空渣男的私库，把外室纳进府里来折磨。\n结果林嫣然发现她这个‘大儿子’好像有点门道。\n所以画风就变成了，‘轩儿，管管你弟弟。’\n‘轩儿，管管你父亲。’\n“轩儿······”\n总的来说就是林嫣然看戏躺平的一生。\n楚云轩：母亲歇着，事情全部都交给儿子。", "tags": ["宫斗宅斗", "古代言情", "萌宝", "穿越", "穿书", "魂穿"], "borderColor":  32.35], "trend": 1.33, "latest": 32.3, "wordNumber": 669864, "creationStatus": 0, "desc": "【实体书《岁岁春欢》已出，全平台可购】\n【女主渣男双重生＋男主穿越＋双向救赎＋扮猪吃虎】\n十七岁这年，沈嘉岁嫁于陆云铮为妻，沈陆两家皆为将门，强强联合。\r\n成婚两年后，陆云铮大败敌国名扬四海，沈家却因通敌叛国满门抄斩。\r\n沈嘉岁临死前才得知，沈家通敌叛国罪证乃陆云铮亲呈，且陆云铮想娶的人从来不是她，而是沈家养女，她视作亲妹妹的顾惜枝。\r\n灭门之仇，欺骗之恨，沈嘉岁临死反扑，拉陆云铮同归于尽。\r\n再一睁眼，重回陆云铮上门提亲那一日。\r\n沈嘉岁匆忙赶到时，陆云铮正深情开口求娶顾惜枝。\r\n原来，陆云铮也重生了......\r\n————\r\n沈家通敌叛国一事迷雾重重，牵涉甚广。\r\n为查清真相，沈嘉岁决然入局，这时，一人着绯红官服站在了她的身旁。\r\n沈嘉岁依稀记得，上一世咽气之时，似有一片绯红衣角闯进视野......\r\n————\r\n江浔：“江某平生所愿，唯山河远阔，国泰民安。如今再添一愿，愿心上之人岁岁无虞，常乐长安。”", "tags": ["宫斗宅斗", "古代言情", "重生", "扮猪吃虎", "HE", "相互救赎"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "勾太傅，人前不熟人后如做了夫妻", "fullTitle": "勾太傅，人前不熟人后如做了夫妻", "link": "https://fanqienovel.com/page/7591861882936380478", "data": [44.92, 45.4, 45.4], "trend": 0.49, "latest": 45.4, "wordNumber": 996080, "creationStatus": 1, "desc": "状元夫君熟睡，宋怜抱住霁月清风的当朝太傅哭：“求求您，救救我……”\n她能有什么错？她只是不想死。\n家规无情，长公主不容人，夫君要做驸马，留给宋怜唯有一条路——吊死。\n于是她壮着胆子，勾引了当朝太傅。\n陆九渊乘着酒意：“如你所愿。”\n从那以后，宋怜予取予求，陆九渊事事如了她的意。\n他俩一个蓄意勾引，一个见色起意。\n人前殊途陌路，人后颠鸾倒凤。\n有人告密：“宋怜她精于算计，处心积虑破坏太傅大婚。”\n陆九渊淡泊道：“我就喜欢被她霸占着，怎么了？”\n-\n太傅陆九渊出去打了场仗，回来发现自己暗中相看好的姑娘，被皇上指给新科状元了。\n他大发雷霆之后也没跟任何人提及，不过一个女人而已，犯不上。\n直到这女人哭着抱着他的腰求他：“求求您，救我……”\n“一哭二闹的。”陆九渊笑纳了，偶尔当回活菩萨也不错。\n可原本是无聊时纾解的玩物，却被他养成了尖牙利爪的小豹子。\n有人状告宋怜为虎作伥，飞扬跋扈，目中无人。\n陆九渊：“我惯的，你适应一下。”\n后来，宋怜说皇帝该换了，陆九渊就把皇帝换了。\n宋怜说反了吧，陆九渊就反了。", "tags": ["宫斗宅斗", "古代言情", "宠妻", "甜宠", "双洁", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "心声被偷听，满朝文武齐吃瓜", "fullTitle": "心声被偷听，满朝文武齐吃瓜", "link": "https://fanqienovel.com/page/7379714137724570648", "data": [20.27, 20.9, 21.82], "trend": 1.55, "latest": 21.8, "wordNumber": 2097856, "creationStatus": 0, "desc": "【穿越+读心术+系统+金手指+作精+扮猪吃虎+搞笑+吃瓜+口嗨+怼人+沙雕】\n宋瑶瑶前世是一个孤儿，本硕博连读毕业后，成了一名军医，年纪轻轻做手术累死后，胎穿到了一个架空的朝代：天凤国。\n这辈子的宋瑶瑶，父亲是正四品户部侍郎，母亲是二品将军家的嫡女，有父母和哥哥姐姐的疼爱，自己有了这样好的家庭和身份，她想过得轻松一些！\n宋瑶瑶刚一出生，就绑定了一个吃瓜系统。\n宋瑶瑶还不知道，她 结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沈世子，您真是做男做女都精彩啊", "fullTitle": "沈世子，您真是做男做女都精彩啊", "link": "https://fanqienovel.com/page/7611934119068437528", "data": [22.31, 22.38, 22.38], "trend": 0.07, "latest": 22.4, "wordNumber": 564541, "creationStatus": 1, "desc": "【1vN男全洁+雄竞+掉马+抽象】【非权谋文】\n【温润端方小皇帝+阴鸷反差摄政王+孤高清冷左相+聪慧狐狸皇商】\n沈折枝穿书了。\n为继承侯府，她女扮男装，顶替战死沙场的亡兄成了世子爷。\n因知晓最后的赢家，她投靠了天子。\n可有一天，身边的重要角色们，竟莫名听到了原文中的内容…\n-\n摄政王瞪着沈折枝，耳边突然响起——\n【裴凛将沈折枝按在墙上，狠狠吻了上去：“为什么不能爱我？”】\n摄政王：？\n他竟有龙阳之好？对象还是他的政敌？\n\n-\n天子刚想让沈折枝出差——\n【“陛下，枝儿受不住了……”沈折枝眼尾泛红，死死抓着龙袍的衣襟。】\n天子：？\n什么？他竟玩弄自己的心腹权臣？\n-\n左相邀沈折枝对弈，下一秒——\n【江寄雪用指腹毫不怜惜地揉弄着沈折枝水润的双唇，在她耳边轻笑：“怎么不敢看我？”】\n左相：？\n他居然和天子死忠断袖？\n-\n皇商刚给她送来保护费，紧接着——\n【顾鹤洲将珍珠赠予沈折枝，她含入口中，眼波流转，顾鹤洲当场情难自持……】\n皇商：？\n他能稍微自持一点吗？\n-\n鸡飞狗跳下，几人终于发现沈折枝是女子。\n于是，大型修罗场开幕。\n沈折枝满头问号：“不是，你们连男子都喜欢？滚远点！”\n完全忘了，她穿的根本不是什么正经文。\n而她，是女主角。\n（后期男女身份随机切换）", "tags": ["古言脑洞", "古代言情", "穿越", "穿书", "女扮男装", "胎穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "手拿名臣系统，我在古代女扮男装", "fullTitle": "手拿名臣系统，我在古代女扮男装", "link": "https://fanqienovel.com/page/7225592747904732192", "data": [17.07, 17.09, 17.09], "trend": 0.02, "latest": 17.1, "wordNumber": 1032880, "creationStatus": 0, "desc": "许玥穿书了。\n成为科举文里母亲早亡，没有兄弟，孤苦无依，家中不管只能尴尬寄住在男主家的小白花表妹。\n许玥上辈子一路从孤女拼到博士，从不信命，即使古代女子难存，她也不放弃的思考着该怎么破局。\n系统:不，对不起，宿主，你不能当个女孩子，因为我是名臣系统。\n许玥:……\n多年以后，乡人都说，许家祖坟冒了青烟，许玥三岁识文，五岁作诗，八岁中秀才，十二岁举业有成，不过十八便高中状元！\n打马游街，风光一时。\n许玥:谢邀，你听过半夜的鸡叫声吗？\n原男主:许兄 data": [14.21, 14.75, 15.08], "trend": 0.87, "latest": 15.1, "wordNumber": 2687300, "creationStatus": 1, "desc": "【万人迷+废物女大摆烂式攻略+脑洞+无固定男主+一见钟情】\n　　废物点心禹乔被一个刚出厂的攻略系统绑定了。\n　　看着自信满满说要她到各个世界攻略优质男的系统，禹乔笑了。\n　　她觉得是时候让系统看看大学生的真正实力。\n　　世界一：穿成君夺臣妻里被赐给绿帽侠的炮灰宫妃，因不懂上古音被迫装聋作哑。\n　　世界二：被迫成为末世重生文黑化男主的“女儿”。\n　　世界三：星际恋爱游戏里不可攻略的绝美NPC。\n　　世界四：恋综文万人嫌女配的闺蜜。\n　　……\n　　事实证明，只要禹乔摆得够烂，系统就能主动变成卷王。\n　　多年以后，王牌攻略系统514在进行新系统培训演讲时，都会想起它的宿主禹乔。这时候它都会在演讲后补充一句话——“不要绑定大学生！！！”", "tags": ["快穿", "古代言情", "系统", "穿越", "王妃", "今穿古", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿炮灰她不走寻常路", "fullTitle": "快穿炮灰她不走寻常路", "link": "https://fanqienovel.com/page/7432285807722908696", "data": [22.15, 22.26, 22.97], "trend": 0.82, "latest": 23.0, "wordNumber": 1712809, "creationStatus": 1, "desc": "无固定cp，清穿+年代+其他，有空间\n注：女主纯享乐主义，精致利己，主打吃什么就是不能吃苦，受什么都不能受罪，每个世界都要尽量过的舒服。\n\n     倒霉了二十几年的女大学生沈安宁好不容易一朝转运，却在财运到来的前一天一命呜呼。许是怨念太大，临死前被一个还愿系统绑定，由此开始了游走各界之旅。\n千挑万选绑定宿主后，系统君每天都在哭唧唧，为什么自家宿主总是不按常理出牌？\n1：清宫炮灰小宫女\n宫斗？no，抱着未来铁板钉钉的亲王儿子，带着小姐妹吃瓜看戏不好吗？\n2：七十年代被冷暴力的继女\n下乡？不，我选择直接送渣爹一程\n3:古代炮灰农家女\n陪贫寒夫君一路艰辛的糟糠妻，谁爱抢抢去！\n4:虐恋情深霸总文里的前女友\n   恋爱脑，狗都不吃。\n5:炮灰九幅晋\n6:红楼小丫鬟\n7:六零炮灰小村姑\n8:古代炮灰“嫡长子”\n9:修真文里的极品炉鼎\n\n什么救世？选择飞升不好吗？\n11:仁宗那个被迫下嫁丑男的倒霉公主\n12:古代炮灰嫡女\n13:19世纪贵族小姐\n14:清宫炮灰庶妃\n15:末世小炮灰\n未完……", "tags": ["快穿", "古代言情", "系统", "穿越", "空间", "清穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心机勾引快穿：女主心上人归我了", "fullTitle": "心机勾引快穿：女主心上人归我了", "link": "https://fanqienovel.com/page/7634751548186168344", "data": [17.52, 17.93, 18.25], "trend": 0.73, "latest": 18.3, "wordNumber": 335504, "creationStatus": 1, "desc": "【心机禁忌勾引绿茶+无道德三观+横刀夺爱+1V1男洁】\n温枝宁拥有一张漂亮又无辜的脸蛋，只要是她看上的，就没有得不到的。\n“这是你喜欢的心上人吗？那归我了。”\n-\n【世界1.汉子茶】\n在小团体里顶着兄弟的名义做尽暧昧的事情。\n面对女主的控诉质疑，她跟男主只是淡定的一人一句：\n“妹妹，我可不会看上我的狗儿子，接吻只是大冒险，抱在一起睡觉只是兄弟。”\n“我跟她要是在一起早在一起了，你在闹什么?”\n【世界2.被全家偷听心声的假千金】\n真千金回来那天，全家都听到了假千金的心声。\n早上给全家人做饭，假千金心声说：“刚刚看到姐姐好像给我汤里下了什么，算了我还是照喝吧。”\  26.99, 26.99], "trend": 2.14, "latest": 27.0, "wordNumber": 1026838, "creationStatus": 0, "desc": "[大家说被简介耽误了，本人简介无能，看内容吧］\n穿成惨死的冤种女配？不怕，开局杀女主，剧情崩塌，一切洗牌重来。\n　　这一世，我就是女主。\n　　这本书的设定是女主是外室生的小可怜，起点低，光环强，不管遇到什么危险总会逢凶化吉，逆境重生，最后走到人生巅峰。\n　　而她，是女主同父异母的冤种妹妹，父亲唯一的嫡女。\n　　穿越之后掏心掏肺的对女主好，人家发达后，照样抽她仙骨，毁她全族，她终究逃不过惨死的命运。\n　　既然改变不了命运，那就将命运的源头直接掐死。\n【本书是偏正统一些的修仙文，注重主角个人历程，大家齐心协力突破桎梏，不恋爱，友情师门羁绊为重，不写师门斗雌竞雄竞等等，希望大家多一点儿耐心，谢谢】\n——\n避雷：偏传统修仙，人物成长会更符合逻辑，不是一天筑基三天结丹的爽文，筑基打死金丹的剧情有，不可能出现筑基一拳打死元婴的夸张剧情，看爽文的慎入。", "tags": ["玄幻言情", "古代言情", "穿越", "嫡女", "穿书", "虐渣", "今穿古", "打脸", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门反派疯批，唯有师妹逗比", "fullTitle": "满门反派疯批，唯有师妹逗比", "link": "https://fanqienovel.com/page/7134523177480227854", "data": [36.46, 38.24, 38.24], "trend": 1.78, "latest": 38.2, "wordNumber": 3531711, "creationStatus": 0, "desc": "一朝穿书，叶灵泷成了修仙文里的恶毒炮灰女配，资质奇差还在修仙大会上胁迫女主带她进第一宗门，入门后处处跟女主作对最后惨死收场。\n　　为了快乐苟活，叶灵泷当场放弃胁迫女主，扭头就进了修真界最差的门派，这恶毒女配她不当了！\n　　本以为进个最差宗门能吃喝玩乐苟日子当咸鱼，谁知这最差的宗门里全员都是疯批反派，随时走在黑化边缘，准备给女主挨个送头。\n　　啊这…她们门派要是马上要团灭了吗？不慌，这题她会。\n　　大师兄满门被灭后复仇杀穿整个修真界最终被女主打败？小师妹：师兄我知道她什么修为什么功法多少秘宝，快，卷起来！咱不能输！\n　　二师兄身藏妖族血脉隐忍躲藏却被人发现群起而诛之？小师妹：躲什么？牛逼血脉两界通杀，去征服两界奉你为主啊！我知道两界传送门在哪！\n　　三师兄金丹破碎经脉全废走火入魔后成为联手歼灭的大魔头？小师妹：我知道哪里可以重练金丹重塑经脉，稳住，这波团战我们能赢！\n　　四师兄苦恋女主爱而不得为情所伤最后黑化被男主所杀？小师妹：你这样不行，舔狗一号送法宝，舔狗二号签契约，你这舔狗N号不如去送个命？\n　　他们这哭哭唧唧柔柔弱弱又煽风点火疯言疯言的小师妹，是猴子请来的逗比吧？", "tags": ["玄幻言情", "古代言情", "穿越", "反派", "穿书", "异世穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [22.74, 23.6, 24.39], "trend": 1.65, "latest": 24.4, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [41.06, 42.22, 42.22], "trend": 1.16, "latest": 42.2, "wordNumber": 3243667, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [26.81, 27.25, 27.92], "trend": 1.11, "latest": 27.9, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [21.47, 22.56, 22.56], "trend": 1.09, "latest": 22.6, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠摆烂拯救了全宗门", "fullTitle": "我靠摆烂拯救了全宗门", "link": "https://fanqienovel.com/page/7153918048745819172", "data": [58.44, 59.48, 59.48], "trend": 1.04, "latest": 59.5, "wordNumber": 1899187, "creationStatus": 0, "desc": "（实体第二册已出）叶翘一觉睡醒穿成了万人迷小说里的工具人二师姐。\n小说里小师妹有难二师姐上，小师妹想要神器，二师姐去拿，小师妹没有灵根，要挖她的灵根。\n叶翘心态崩了，连夜下山，撂担子不干了。\n这工具人谁爱当谁当。\n……\n新宗门的师兄们一切都好，手拿剧本的叶翘却知道这些人都是万人迷女主的鱼。\n丧气厌世的大师兄是爱而不得的舔狗，最终为女主牺牲。\n自打叶翘来了后，他也不不丧了，也不想着去死了，而是整日追着叶翘咆哮：“以后再敢逃课试试！”\n二师兄是个天才男配，因为无法破境，而生了心魔最后死在雷劫。\n叶翘试探性发出邀请：“大道至简，无欲则刚，二师兄，一起摆烂吗？”\n二师兄：“……”好像有些道理？\n天才丹修三师兄是备胎男配，为女主提供各种丹药被榨干所有价值，只得到一句‘我们只是朋友’\n叶翘来了后，三师兄满脑子都是炼丹炼丹，努力投喂小师妹。\n天生剑骨的四师兄为了女主，断送修为，自毁道心。\n叶翘抽出一把剑，认认真真：“心中无女人，拔剑自然神，女人，只会影响你拔剑的速度。”\n四师兄看着神神叨叨的小师妹：“？”\n自从叶翘来了后，他们不围着女主转了，整个门派鸡飞狗跳。\n原文女主：“？”\n我的万人迷光环呢？", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "虐渣", "今穿古", "异世穿越", "打脸", "群像", "魂穿", "剑修"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大师姐是修仙界鬼见愁", "fullTitle": "大师姐是修仙界鬼见愁", "link": "https://fanqienovel.com/page/7382011300081060889", "data": [17.91, 18.52, 18.84], "trend": 0.92, "latest": 18.8, "wordNumber": 1059072, "creationStatus": 1, "desc": "【已签约出版】（私设多，切忌套公式）\n【和死对头杀穿修仙界+超绝活人感cp＋双强天才成长流+有大基调+易燃易爆炸+微群像+姜郎才烬he】\n暴力嚣张女vs嘴毒腹黑男\n燃！战斗向！从身到心成长型男女主，剧情流有脑修仙文！\n睚眦必报的短命天才少女穿越了！\n本以为是普普通通的修仙世界，却在这里遇到了以为自己手握剧本的穿书女、走龙傲天剧情的气运之子、从天才宝座坠落后本该堕魔的大反派？\n这是一个棋子掀翻棋盘，干掉棋手的故事。\n*\n【一不小心和对家顶流谈恋爱了咋办？】\n听说不朽仙门的首席大师姐和北斗剑宗天生剑骨的小师叔不对付，见面就掐架？\n狐朋狗友：“我说，你和盛大剑仙这么你来我往的打拉锯战已经这么久了，什么时候正式结为道侣啊？”  \n姜珩伸出一根手指摇了摇：“你不懂，暧昧期才是最上头的。谈上了，就不好玩儿了。”\n*\n“放眼神州，也就他配得上我。”\n“放眼神州，还有谁比我更配你？”\n*\n“久仰大名，初次见面，我是来杀你的。”\n“天诛而不死者，是为仙。诛天而创世者，方为神。”\n“告诉他们，弑神者，姜珩。”\n【简介无能，移步正文】", "tags": ["玄幻言情", "古代言情", "穿越", "天才", "强强", "群像"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [23.85, 24.76, 24.76], "trend": 0.91, "latest": 24.8, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "看到这个机缘了吗？我的我的我的", "fullTitle": "看到这个机缘了吗？我的我的我的", "link": "https://fanqienovel.com/page/7599147863683124248", "data": [18.92, 19.35, 19.68], "trend": 0.76, "latest": 19.7, "wordNumber": 991776, "creationStatus": 1, "desc": "本书改编两个漫剧均已上线。\n点击小说任意一章内容右下角改编剧场即可观看，或进入抖音或者红果搜索《清冷大小姐她开两个挂》和《修仙女配不当垫脚石》，改编了两个漫剧哦。\n【穿书+马甲文+无cp+大爽文+不雌竞+打脸、报复速度极快+金手指巨大】\n林望舒眼睛一闭一睁，就从21世纪大好青年穿书成为一本玄幻狗血甜宠文反派。\n而且是暗恋男主不成，即将被女主打脸，被男主虐杀的反派。\n恰好在此时，天降系统。\n系统可以每个月提供一次抽奖，然后将林望舒身上随机一物十倍膨胀。\n水灵根？十倍膨胀通明冰骨水天灵根！\n宠物灵狐？十倍膨胀守护神兽九尾天狐！\n玄级灵宝破甲弓？十倍膨胀地阶法器冰凝弓！\n筑基期马甲？十倍膨胀金丹期护道者。\n从此以后，通天宗新一代小师祖、玄灵大陆第一妖孽横空出世。\n而林望舒本人，看着自己上辈子出生自带的读档系统笑而不语。\n男女主的机缘？我的了。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "无CP", "打脸"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主都是恋爱脑，只有我是真修仙", "fullTitle": "男主都是恋爱脑，只有我是真修仙", "link": "https://fanqienovel.com/page/7587644291774696510", "data": [52.89, 53.31, 53.6], "trend": 0.71, "latest": 53.6, "wordNumber": 1656318, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n【女主修仙升级流爽文+符道天才+大后期古神苏醒】\n桑渔入仙门那天，修仙界南域多了个天灵根天才。\n剑修、法修、丹修、阵修、御兽任她选？\n不，她只想安静画个画、做个符修！\n仙门众长老力劝：符修只是辅修，在修仙界毫无地位可言，狗都不修！\n后来：\n仙门众天才：谁说符修只是辅修、全是垃圾？给老子站出来！\n特么！他们都被桑渔这个变态画的符炸冒烟了。\n仙门众弟子：狗都不修我修！我要当符修！\n符修能越阶杀人！炼气战筑基、筑基战金丹、金丹追着元婴满世界跑……\n可他们往死里修，都修不到桑渔这样儿啊！\n桑渔：上辈子我被古神砸死了，这辈子靠抄袭古神身上的符文成为符道天才不过份吧？\n再后来：\n修仙界南域最顶尖的仙门为了抢天才入门，不惜派出同为天才的金丹美男——逼婚桑渔联姻。\n桑渔：正好我体内养了头吞金兽，来点灵石花花~\n再再后来：\n桑渔飞升上界后，苏醒后的古神紧捂兽皮、眼神幽幽地盯着她：“要抄这里的可以，必须对我负责！”\n一生痴迷于符道无法自拔的桑渔、看着眼前这尊帅到没朋友的真神，摸着下巴抹去口水为难道：“我、桑渔，愿为艺术献身——”\n \n（境界：炼气—筑基—金丹—元婴—化神—炼虚—合体—渡劫—大乘）", "tags": ["玄幻言情", "古代言情", "幻想言情", "穿越", "空间", "天才"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怎奈她一身反骨，就爱给众神添堵", "fullTitle": "怎奈她一身反骨，就爱给众神添堵", "link": "https://fanqienovel.com/page/7451062991820164158", "data": [18.35, 18.71, 18.95], "trend": 0.6, "latest": 18.9, "wordNumber": 366467, "creationStatus": 0, "desc": "今日《神仙日报》头版头条：\n　《注意！天庭新增反骨仔一位！》\n　　据悉，此人乃是三坛海会大神新领养的小跟班，人送外号“四姑奶”。\n　　孙大圣明着反，二郎神暗着反，三太子随时反，四姑奶你反我就反，反必跟随。\n　　这几个人不干别的，光是聚在一起唠唠嗑，玉帝就睡不着觉。\n　　你说说他们，自身实力强悍也就罢了，后台还一个比一个硬。\n　　太乙真人、玉鼎真人、菩提老祖……\n　　前两位不能撕破脸，后面那位更是完全惹不起，也就那个四姑奶没什么背景，只有一个爷爷，似乎在天庭打工。\n　　满天神佛，沈芙星随身携带画像，逢人就问：“你好，见过我爷吗？”\n　　都没见过。\n　　天兵和仙侍里也找不到这个人。\n　　倒是鸿钧老祖和蔼地端出一碟糯米糍，用拂尘指了指，笑道：“孩子，你若吃完这碟点心，我便与你结为兄妹。”\n　　菩提老祖：套镇元子公式，扣分！抢我台词，扣大分！！叉出去！！！", "tags": ["玄幻言情", "古代言情", "幻想言情", "古色古香"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [16.52, 16.68, 17.03], "trend": 0.51, "latest": 17.0, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听说我死后成了反派白月光", "fullTitle": "听说我死后成了反派白月光", "link": "https://fanqienovel.com/page/7383825464940317720", "data": [31.64, 31.89, 32.11], "trend": 0.48, "latest": 32.1, "wordNumber": 476600, "creationStatus": 0, "desc": "【实体书已上线】桑念不小心爬到了修仙界，成了书里下场凄惨的恶毒女配。\n　系统：你的任务是嫁给男配谢沉舟，虐待他，羞辱他，然后被他嘎掉。\n　桑念：ok(挥舞小皮鞭)（打中自己）（噗通倒地）\n　系统：（沉默）（望天）\n　系统：任务更改，你给我攻略他，失败就去挖煤\n　桑念：（自信一笑）这简直易如反掌\n　然后她就成功被谢沉舟嘎掉了。\n　她以为自己会被送去隔壁世界挖煤，可再睁开眼，她重生到了三百年后。\n　系统很沉重：“网卡来晚一步，你有了新的任务。”\n　桑念：“是什么？”\n　系统：“救赎黑化成反派的谢沉舟，让他变成一个懂爱的正常人，重点是让他停止灭世。”\n　桑念：“……”\n　#这个反派，我曾见过的#\n　#你怎么不等大结局再来呢#\n　#要不你还是把我删了吧#\n　*\n　谢沉舟恨桑念。\n　所有人都这样认为，包括他自己。\n　可她死的那一日，谢沉舟弃仙途入魔道，纵身跃下无尽炼狱。\n　他踏过忘川河中无数浮沉尸骨，一寸寸翻遍三百里黄泉。\n　冥界震荡，恶鬼嚎啕，两岸仙神皆闻之色变。\n　人人都道谢沉舟疯了。\n　只有谢沉舟知道，他只是想找回一个人。\n　他的妻子，他的……念念。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "甜宠", "反派", "异世穿越", "HE"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [24.81, 24.93, 24.99], "trend": 0.18, "latest": 25.0, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被夺气运后，我靠双修飞升成神", "fullTitle": "被夺气运后，我靠双修飞升成神", "link": "https://fanqienovel.com/page/7614732062435593241", "data": [16.91, 16.99, 17.07], "trend": 0.15, "latest": 17.1, "wordNumber": 389600, "creationStatus": 1, "desc": "【刚出评分！还会涨的！】\n【男全洁+修仙+系统+万人迷+1vn+多男主全收】\n【万人嫌变万人迷】\n穿成被绿茶夺走气运的万人嫌炮灰，沈微澜睁眼就发现自己正压在冰清玉洁的化神期师尊身上。\n面对高岭之花拼死压抑的喘息，她选择直接强上！\n绑定双修逆袭系统，只要撩拨那些曾偏心绿茶的男神们，就能夺回气运，原地飞升！\n从此，剧情走向彻底崩坏——\n傲娇小师弟眼尾泛红，将她堵在墙角：“我中了你的情蛊，你要对我负责到底！”\n一向端方守节的温润大师兄步步紧逼……\n至于那晚被强上的高冷师尊？他红着眼：“逆徒，你到底还有多少事瞒着为师？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "冰山", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.08, 41.16, 41.17], "trend": 0.08, "latest": 41.2, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗都是舔狗，小师妹是真狗", "fullTitle": "全宗都是舔狗，小师妹是真狗", "link": "https://fanqienovel.com/page/7200755351845604355", "data": [26.79, 26.83, 26.83], "trend": 0.04, "latest": 26.8, "wordNumber": 4170637, "creationStatus": 0, "desc": "【实体书《一念凤兮》全平台可购】凤溪穿成修仙文里面的炮灰女配，穿书之日就是忌日。\n她为了苟命，千方百计脱离了女主所在的混元宗，加入了玄天宗。\n嚯！\n五个亲师兄，在书里全都是女主的舔狗，一个比一个死的惨。\n凤溪邪魅一笑：“舔狗了不起？有我狗吗？”\n大师兄身中剧毒，只有女主的血能够解毒，从此对女主情深似海，最后却被女主一脚踹入万丈魔渊，魂飞魄散？\n凤溪屁颠屁颠端来一大盆狗血：\n“师兄，喝我的！我的剂量大，药效足！”\n吞服完解毒丹，正准备割破手指的女主：“……”\n二师兄身具餍族皇族血脉，女主给了他隐藏血脉的丹药，从此二师兄心甘情愿为女主出生入死，哪怕最后被女主推出去当替死鬼也甘之如饴？\n凤溪拿出人族餍族友好一万年的盟约：\n“二师兄，尽情展示你高贵的餍族皇族血脉吧！万千少女为你痴为你狂为你咣咣撞大墙！”\n女主看着手里需要三个月服用一次的隐血丹：“……”\n凤溪的人生信条：做得狗中狗，方为人上人！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满级雷灵根：卷哭修仙界", "fullTitle": "满级雷灵根：卷哭修仙界", "link": "https://fanqienovel.com/page/7578229922217331774", "data": [19.07, 19.15, 19.09], "trend": 0.03, "latest": 19.1, "wordNumber": 1371523, "creationStatus": 1, "desc": "【团宠+非传统爽文+反套路+群像+系统+无cp】（原名：满级雷灵根：卷哭修仙界）（番外会写带cp）（排雷：女主并不是一帆风顺的！并不是开局就秒天秒地的爽文！有虐点。不要带脑子看。）\n三岁的林枝意被皇帝爹爹抱上登仙山时，还叼着奶嘴。\n脑中突然绑定的系统警告她：「你是恶毒女配，将来会被抽灵根、废修为！」\n小团子歪头：「听不懂呀～」\n五年后，修仙界大比，八岁的林枝意已名动宗门。\n擂台之上，原著女主被她一道惊雷劈得连连败退，泪眼汪汪地看向裁判长老。\n林枝意收起剑，想起系统最近带她看的《琼瑶剧经典大全》，小脸一沉，痛心疾首地指向对方：\n“你只是输了比赛，我呢？我差点就输了早饭！我的灵果糕、蜜饯酥、糖醋灵鲤……要是因为你哭两声就判我输，它们不就白白牺牲了吗！”\n全场死寂。\n高座上的凤临渊一口灵茶喷出：「……这都跟谁学的？」\n恶毒女配系统本想培养专业反派，结果成了全职保姆：教法术、哄睡觉、防坏人，还要偷偷用宿主积分给自己买皮肤。\n系统日记：今天宿主又电了一个想害她的人，黑化进度+1%，但她是为了保护朋友…这算恶毒吗？在线等，急。", "tags": ["玄幻言情", "古代言情", "系统", "幻想言情", "团宠", "剑修"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿成财阀太子爷的作精前女友", "fullTitle": "穿成财阀太子爷的作精前女友", "link": "https://fanqienovel.com/page/7641635688978336792", "data": [67.24, 73.39, 73.39], "trend": 6.15, "latest": 73.4, "wordNumber": 315876, "creationStatus": 0, "desc": "「腹黑男人X娇气包｜双洁、甜宠」\n穿成财阀校园文里的恶毒女配，柯眠棠接到的任务是：半年内扮演好男主的女朋友，稳定他的反社会情绪，等原书女主出场后，然后拿钱走人，功成身退。\n男主荣涉，星云集团太子爷，白名单榜首。\n表面温润如玉，骨子里偏执病态，占有欲强到令人发指。\n柯眠棠每天战战兢兢地演着娇纵女友，生怕露馅。\n可来的第一天，她就被男主亲哭了。\n系统：“问题不大，别慌。”\n她信了。\n然而男主看她的眼神越来越不对劲，并非原著里对恶毒女配的冷漠，倒像是让人后背发凉的痴迷。\n系统又说：“别怕，小说结局是男主和原书女主在一起，既定结局。”\n她放下心来。\n后来，原书女主终于登场。\n但男主对那位真命天女兴趣淡淡，反倒对前女友兴致盎然。\n柯眠棠瑟瑟发抖：说好的原著里他会爱上原书女主呢？\n-\n终于，任务结束前一晚，她满心欢喜一亿到账。\n结果系统突然失联。\n重启后，终端程序直接被篡改，从“剧情纠正”变成了“爱上男主”。\n她懵了。\n一双大手从身后掐住她的腰，男人的呼吸落在耳畔，嗓音低哑带笑：“宝贝，你知道我为了留住你，有多辛苦吗？”\n他早在她穿来的第一天就发现了真相。\n立意：黑心的财阀继承人从不做亏本买卖。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "甜宠", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恋爱脑能传染？幸好我是个神经病", "fullTitle": "恋爱脑能传染？幸好我是个神经病", "link": "https://fanqienovel.com/page/7641990468129016857", "data": [25.8, 27.77, 29.63], "trend": 3.83, "latest": 29.6, "wordNumber": 330002, "creationStatus": 1, "desc": "冷脸萌x纯情骚＋沙雕整活+半截读心+皮肤饥渴+自我攻略\n姜灵焕穿进古早玛丽苏贵族学院文，绑定“反恋爱脑”系统，靠阻止全校磕cp、打击不文明恋爱行为续命：\n霸道少爷用广播强势示爱，全校磕爆！恋爱毒气暴涨！\n她把广播示爱爆改英语听力，全校萎掉：？这是什么脏东西\n还天天到处打击不文明恋爱行为：\n有人图书馆激吻，她将乒乓拍精准扔到两人嘴巴之间：“这不是你们的大床房。”\n有人泳池狠狠爱，她举着插线板放在泳池边：“再不出来，让你们做亡命鸳鸯。”\n有人树林里调情，她牵着几条狗冲进去：“别在小树林法天法地！”\n全校恋爱脑：姜灵焕是地狱来的魔鬼！！\n-\n姜灵焕日常被“恋爱毒气”侵扰，一被侵入就想找人亲嘴子。\n后来，她发现待在校草兼学生会会长的身边就能保持清醒，跟他碰一下，就能回血！接触越多，回血越快！\n于是，姜灵焕把谢风叙当充电宝，变着花样跟他制造接触。\n谁曾想谢风叙不仅有皮肤饥渴症，还能听见她的心声，还只能听一半！\n她内心：他手好大，感觉能一把握住我的头。胸肌练得不错。\n他听到：他手好大，感觉能一把握住我的…胸，不错。\n他：？她好变态\n她：？我冤枉 rend": 2.42, "latest": 30.8, "wordNumber": 475889, "creationStatus": 0, "desc": "【假千金+国家团宠+群像+玄学+无cp+直播算命】\n\n　　时鸢是被抱错的假千金，亲子鉴定报告一出，养父母就迫不及待将她赶出豪门。\n\n　　亲生父母家里一穷二白，气运被偷，欠债千万！\n\n　　为还债，时鸢只能干起老本行，摆摊算命，当起了玄学主播。\n\n　　“大师，我想找我女儿。”\n\n　　时鸢：“你前脚出门，你重男轻女的婆婆后脚就把你女儿卖了，现在你女儿已经上了卖器官的手术台。”\n\n　　当晚警方破获一起跨省重大买卖器官案。\n\n　　“大师，我今年五十岁，想看看我和现在的男友有没有正缘。”\n\n　　时鸢：“你亲儿子联合你男友给你买了巨额保险，还要带你出去旅游上演消失的她。”\n\n　　苦主当即断亲报警，渣男和亲儿子被捕入狱。\n\n　　“大师，我发现我家墙壁有异响！”\n\n　　时鸢：“有异响就对了，十年前你杀了人藏尸在墙壁里，她现在出来找你了。”\n\n　　……\n\n　　只要时鸢一开播，全国警方蹲点吃瓜，靠着时鸢破获了一起又一起的重大犯罪案件。\n\n　　原本被夺走气运的亲生父母哥哥，也重新走上暴富巅峰！\n（不是全文都是直播，有主线剧情的哦）", "tags": ["现言脑洞", "现代言情", "团宠", "无CP", "群像", "风水秘术"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法学校小学妹，沙雕搞事啥都会", "fullTitle": "魔法学校小学妹，沙雕搞事啥都会", "link": "https://fanqienovel.com/page/7388389162069543961", "data": [33.33, 34.31, 34.92], "trend": 1.59, "latest": 34.9, "wordNumber": 2523869, "creationStatus": 1, "desc": "【非西幻，中式魔法学院，沙雕+群像+搞笑日常，有cp】\n　　【女主沙雕搞事带偏所有人，一群神经学生搞笑学魔法的故事】\n　　黎问音一朝穿到魔法世界，在顶尖中式魔法学院里苟且偷生。\n　　剪院旗当校服，偷抢课本夺命奔跑，把各个院长气的七窍生烟，禁闭室第一贵客。\n学习魔法，植物魔法变植物大战僵尸，药剂做听音药剂，编织魔法做出来个四处创人的筋斗云！\n　　很会吐槽的学长：我本意是做一个好学生，直到她成为我的同学。\n安静的社恐学姐：她的花样层出不穷，很厉害。\n　　好奇宝宝二傻子学长：经常会非常佩服她的操作，要是我也能这么胆大妄为就好了。\n不理解其他人的学姐：我感觉她很好啊！不明白为什么那么多人说她是大麻烦。\n　　后人闻之叹之：那位学姐，是经久不衰的传奇。", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "穿越", "团宠", "异世穿越", "搞笑轻松", "群像"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "四个孩子四个妈？渣爹赶紧受死吧", "fullTitle": "四个孩子四个妈？渣爹赶紧受死吧", "link": "https://fanqienovel.com/page/7574903131662732312", "data": [26.13, 26.96, 27.55], "trend": 1.42, "latest": 27.6, "wordNumber": 959305, "creationStatus": 1, "desc": "「重生+豪门+打脸虐渣+爽文+搞笑」\n上一世，容昭宁受尽霸凌，惨死时体无完肤。\n死后，她绑定系统穿到99个世界做任务，却在噩梦中目睹家人个个下场凄惨：\n她那风流多情的渣爹身中数刀惨死。\n冷漠大哥卷入命案被判枪决。\n病娇二哥坠楼身亡。\n嚣张四弟被卖缅甸，最后做成人彘折磨至死。\n再睁眼，她重生到刚回厉家这天，那些欺凌过她的人，都将下地狱！\n听着家人重复上辈子的混账话，容昭宁直接一拳砸过去，打得几人鼻青脸肿：“从今天起，这个家我说了算！懂？”\n为扭转全员惨死结局，她专治各种不服—\n渣爹敢沾花惹草？断他桃花，设死门禁，敢反抗 ，而我无所吊谓。”\n面对众人质疑，她：“怎么，你们屁股缝里没夹钱？”\n接受节目采访，她：“生而为人，我很抱歉；身为吗喽，横扫自由！”\n顺便还和讨厌她的嘴炮大少爷怼得有来有回\n观众：癫公癫婆，魔法披风！\n明哩：我的生活很单调，不是在犯困就是在犯贱。\n遇到虚弱的猫查不出生病原因，主人焦急万分，明哩直接读心：“没大问题，就是玩太野，虚的。”\n主人反驳说它乖巧懂事，她直接把它的老相好全部叫来。\n全员懵逼：卧槽，猫哥你玩挺花啊！\n-\n节目一出：\n网友：谩骂明哩，质疑明哩，相信明哩，追随明哩！\n粉丝：长江后浪推前浪，癫婆啥样我啥样！\n明哩：你们也真是……（扶额苦笑）\n综艺结束后，突然曝出另一位嘉宾是假千金，明哩才是真千金！\n网友：？？？\n讨厌明哩的京圈太子爷切错号掉马，皮下居然是明哩头号铁粉，对其花样百夸。\n网友：？？？\n这个世界太疯狂！\n明哩：你小子还有两副面孔？", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "娱乐圈", "直播", "明星", "搞笑轻松"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "娇软美人替嫁，冷面糙汉夜夜诱哄", "fullTitle": "娇软美人替嫁，冷面糙汉夜夜诱哄", "link": "https://fanqienovel.com/page/7633426025581399065", "data": [44.15, 51.14, 51.14], "trend": 6.99, "latest": 51.1, "wordNumber": 370888, "creationStatus": 0, "desc": "【年代+先婚后爱+体型差+5岁年龄差年上+细水长流日常+朴实奋斗】\n★娇软美腻乡村女教师x寡言重欲冷硬糙汉\n乔清妍的继姐勾搭了她的公务员未婚夫，她意外发现自己竟能听到继姐恶毒的心声。\n如果不代替继姐嫁入萧家，他们就要把自己卖给恶心的老光棍？\n为了逃离这个家，她被迫同意替嫁给继姐的未婚夫——猎户萧劲野。\n继姐心里得意：萧劲野穷得叮当响，一个瘸腿的妈，还有智障的妹，等你嫁过去就受穷受累吧。\n乔清妍觉得穷不要紧，只要人品贵重，不懒惰，日子会好的。\n继姐心道：那萧家穷就算了，萧劲野还是个不中用的东西，你就守活寡吧。\n乔清妍高兴，那可太好了，反正她也不想跟一个不爱的男人干那档子事。\n不曾想，嫁过去后，顿顿有肉吃。婆婆什么活儿都不让她干，将她宠上了天，小姑子也是可爱纯真。\n而萧劲野，更是把她宠到了骨子里，媳妇让往东，他绝不往西。\n只有一点，清妍不满意。\n萧劲野不是那方面不行吗？\n怎么一到晚上就像一头饿了多年的野狼，粗鲁的要命。\n清妍气恼：“你有完没完？”\n他哑声说：“怎么办，媳妇，真想死在你身上。”", "tags": ["年代", "现代言情", "乡村", "先婚后爱", "年龄差", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "睁眼六零军区，弄错对象被亲哭了", "fullTitle": "睁眼六零军区，弄错对象被亲哭了", "link": "https://fanqienovel.com/page/7567657861308746814", "data": [22.83, 28.59, 28.59], "trend": 5.76, "latest": 28.6, "wordNumber": 1086276, "creationStatus": 1, "desc": "睁眼六零，许穗在男人床上醒来，被狠狠折腾了一整夜，亲哭晕死过去，一夜揣上双胎\n她这才发现自己穿书了。\n穿成肤白貌美，身姿窈窕的漂亮恶毒小青梅，前往军区找男主结婚，却意外弄错对象爬错床，被迫嫁给了落魄的假少爷。\n婚后顾云舟出任务断了腿，原主转头卷钱打胎跑路，最后钱丢了，身子骨坏了，大动荡被人举报作风问题惨死。\n顾云舟不仅腿好了，还重返部队步步高升，成为有权有势军区大佬，成了军区炙手可热的存在，惹得多少人想攀上他这根高枝。\n许穗看着眼前斯文俊美的军官男人，摸着肚子里的崽：长得帅，有本事，能力强，也不是不行。\n这么好的潜力股，可不能便宜了别人。\n*\n顾云舟不喜欢许穗。\n然而，婚后自家媳妇漂亮又勾人。\n一夜就怀上他的种，还是龙凤胎。\n怀着双胎轻松考上粮站铁饭碗，转头又成为六十年代顶尖大学高级人才，发明这个，发明那个，办厂赚外汇，让大伙儿富起来，成为领导座上宾。\n两个娃随媳妇，是有名的天才儿童。\n老实婆家：瞧见没，软弱了大半辈子的老秦家终于迎来了主心骨。\n成了首长夫人的心机寡妇娘：瞧，我闺女上报纸了。\n某首长：这是咱闺女，咱闺女就是厉害。\n被许穗带富的军嫂们：谁敢说许厂长坏话，就撕谁的嘴！", "tags": ["年代", "现代言情", "穿书", "大佬", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [35.43, 37.93, 38.55], "trend": 3.12, "latest": 38.5, "wordNumber": 803068, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一胎！又一胎！绝嗣大伯哥有后了", "fullTitle": "一胎！又一胎！绝嗣大伯哥有后了", "link": "https://fanqienovel.com/page/7576258459784465433", "data": [24.27, 25.67, 25.67], "trend": 1.4, "latest": 25.7, "wordNumber": 1041991, "creationStatus": 1, "desc": "\n【穿书六零+神医系统+易孕vs绝嗣+美艳爬床女vs明面禁欲实际好色大佬】\n林幼薇穿书六零，书中林幼薇不肯离婚，丈夫为了给白月光腾位置，亲手把她送进土匪窝，她被摧残后抛下山崖死无全尸。\n结婚前夜，穿来的林幼薇果断放弃渣男，转而爬了绝嗣瘫痪大伯哥的床！\n不是说他瘫痪又禁欲，那为什么他好色还能动？\n不该发生的都发生了？\n他还夜夜笙歌！\n大家都等着看这对新人的笑话，绝嗣又瘫痪，已经是明家的弃子！！\n搭配乡下来的美艳废物，以后头顶一片绿油油，绝配！\n可是渐渐的，瘫痪的男人重新站了起来，又一次一次屡立战功！成了领导身边不可或缺的左膀右臂！\n突然有一天，绝嗣大佬的明艳娇妻孕吐了！\n众人惊！\n“看吧！他头顶果然一片绿油油，再厉害又如何，老婆给人睡了！就是没用！”\n几个月后，绝嗣大佬抱着缩小版的，和他长得一模一样的小团子出来遛弯，打脸众人，给媳妇儿正名：“这是我媳妇儿生的！我儿子！”\n众人：“——！！”\n奇迹啊！\n绝嗣大佬有后了！\n原来他头顶不绿啊！\n林幼薇也没料到，自己的神医系统还能治好男人的绝嗣，这可苦了她这个好孕体质了，生了一胎又一胎。", "tags": ["年代", "现代言情", "系统", "宠妻", "穿书", "医生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零崽崽父亲是隐形大佬", "fullTitle": "七零崽崽父亲是隐形大佬", "link": "https://fanqienovel.com/page/7489102469776034840", "data": [22.66, 23.93, 23.93], "trend": 1.27, "latest": 23.9, "wordNumber": 2909320, "creationStatus": 1, "desc": "简介：[穿越+空间+打脸+甜宠+家长里短+训夫成才]林凡穿越了，穿成年代文中谱通职工离异单亲家庭的大女儿，还成了未婚先孕的小姑娘。\n不行，必须要去找崽崽的爸爸，要他负责。爱不爱不要紧，有钱有工作生活有保障就行！\n等孩子出生站稳脚根工作稳定就去父留子独自美丽！\n最终找到了孩子的爸爸是个不学无术，无所事事吊儿郎当的二世祖！\n婚后！说好的二流子怎么越来越像隐形的大佬！", "tags": ["年代", "现代言情", "穿越", "空间", "大佬", "打脸"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生1977，不再给弟弟当血包", "fullTitle": "重生1977，不再给弟弟当血包", "link": "https://fanqienovel.com/page/7649071612280458302", "data": [27.97, 28.52, 29.02], "trend": 1.05, "latest": 29.0, "wordNumber": 363186, "creationStatus": 1, "desc": "前世林秀禾掏心掏肺活了一辈子：\n铁饭碗让给弟弟，工资全数贴补娘家，升学名额拱手送人。\n她伺候二老、帮弟弟成家、供养侄子，熬得一身病痛。\n弥留之际躺在病床上，账户里只剩七块三毛钱。\n父母理所当然：你是姐姐，就该帮衬弟弟。\n弟弟冷眼旁观：姐，你别想拖累我。\n一朝重生，她回到1977年。\n饭桌前，家人又在逼她让出人人眼红的供销社工作。\n林秀禾猛地掀翻饭桌，眼神冷彻：\n工作，不让。钱财，不贴。我的人生，从此谁也别想觊觎！", "tags": ["年代", "现代言情", "重生", "打脸", "虐渣", "家长里短", "前世今生"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男人瘫痪后，我顶骂名换儿女前程", "fullTitle": "男人瘫痪后，我顶骂名换儿女前程", "link": "https://fanqienovel.com/page/7607564482147011608", "data": [21.03, 21.36, 21.91], "trend": 0.88, "latest": 21.9, "wordNumber": 670990, "creationStatus": 1, "desc": "原书名：《守活寡，我被全村骂破鞋》\n男人瘫痪后，李俊兰从来没有想过再跟别的男人有什么瓜葛，一门心思想把三个孩子拉扯大，然而现实太残酷，在生活的重压之下，她还是选择了一条最令人不耻的路……全村人都骂她，孩子们也鄙视她，然而她却根本不在乎，为了心中的执念和目标，她甘愿做一个道德败坏的女人……这是一首绝境母亲的生存悲歌，母性的光辉与道德标准相互撕咬碰撞，孰是孰非没有标准答案，只能一声叹息。", "tags": ["年代", "现代言情", "乡村", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [27.02, 27.81, 27.81], "trend": 0.79, "latest": 27.8, "wordNumber": 469027, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [21.29, 22.02, 22.02], "trend": 0.73, "latest": 22.0, "wordNumber": 1118982, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "妹宝相亲认错男主，禁欲军官狂宠", "fullTitle": "妹宝相亲认错男主，禁欲军官狂宠", "link": "https://fanqienovel.com/page/7613573249485507608", "data": [38.69, 39.54, 39.33], "trend": 0.64, "latest": 39.3, "wordNumber": 599824, "creationStatus": 1, "desc": "（评分刚出，以后会涨）\n【穿书＋年代＋打脸爽文＋真假千金＋科研兴国】\n\n二十一世纪美女科学家苏瑶意外遭遇车祸后，穿书到一本八十年代的真假千金文当中。\n\n好消息：她是真千金。\n\n坏消息：她是悲惨女配。\n\n书中原身从乡下被认回苏家后，就各种作天作地跟假千金争宠。\n\n还用尽手段从假千金手里面抢回了娃娃亲营长未婚夫，可是男人跟她结婚后视她如陌生人，始终让她独守空房，最终她含恨而亡。\n\n苏瑶琢磨了一下剧情。\n\n争宠？\n\n她才没空去争取不爱她的家人！有那时间科研兴国，奔赴星辰大海，难道它不香吗？\n\n夺回娃娃亲？\n\n这个嘛……可以有。\n\n毕竟她看中的是独守空房。没人打扰那得多自由啊！\n\n到那时她就会有大把时间发展科研事业。\n\n于是苏瑶决定去军区跟书中的男主娃娃亲见一面。\n\n可是等他们闪婚后，事情发展怎么跟书中描写的不一样了呢？\n\n她扶腰叹：“不是说好了独守空房吗？”\n\n某军官大佬：“媳妇儿，谁跟你说好了？求亲亲。”\n\n苏瑶：……\n\n什么？她认错人了？\n\n她相看的人根本不是娃娃亲对象，而军区的冷面首长！\n\n~~~\n\n当苏瑶凭借过硬的实力带飞祖国后，书中原男主拍大腿后悔。\n\n上辈子，我怎么就没好好珍惜她", "tags": ["年代", "现代言情", "宠妻", "穿书", "打脸", "真假千金"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [29.41, 35.28, 36.75], "trend": 7.34, "latest": 36.8, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后女配才是五个哥哥的真团宠", "fullTitle": "穿书后女配才是五个哥哥的真团宠", "link": "https://fanqienovel.com/page/7215979253920173108", "data": [50.7, 53.17, 55.82], "trend": 5.11, "latest": 55.8, "wordNumber": 1123320, "creationStatus": 0, "desc": "苏莞穿书后，看着自己的人物设定和下场陷入了沉思，明明可以躺赢，却非要作死，这就是恶毒女配的标准结局？\n为了改变命运，她选择主动回到乡下，抱紧五个哥哥的大腿，谁让他们以后都是大佬呢？\n大哥入朝为官，官拜三品，二哥被神医收徒，医毒双绝，三哥上了战场，成为了大将军，四哥厨艺无双，开的酒楼被御赐天下第一楼，五哥则是天赋异禀，丹青妙绝，闻名天下，这大腿，不抱白不抱。\n可是，这顺手救回来的大佬男二是哪根筋不对了？总是美色诱惑她，还时不时扮成小奶狗装可怜，扮无辜？\n哥哥们一致认为，他不安好心，图谋不轨，但苏莞看着他这张脸却觉得，好像也不是不可以。", "tags": ["种田", "古代言情", "乡村", "穿越", "团宠", "甜宠", "穿书", "今穿古", "大佬"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家，继母渣爹跪求我回家", "fullTitle": "分家，继母渣爹跪求我回家", "link": "https://fanqienovel.com/page/7620425812189121598", "data": [28.61, 30.05, 32.41], "trend": 3.79, "latest": 32.4, "wordNumber": 571922, "creationStatus": 1, "desc": "（漫剧已出）一睁眼，林仟仟成了农家炮灰女。\n亲娘刚死，继母带着她女儿进门了，从此她和三岁的弟弟住进了柴房，一天两顿稀粥，还要挨打受骂。继母说：“女孩子家，识什么字？”转头却给继妹请了先生。\n爷奶偏心小叔，大伯母尖酸刻薄，整日惦记着把她卖个好价钱。亲爹呢？站在院里搓着手，屁都不敢放一个。\n林仟仟笑了。\n牵着弟弟的手往外走。\n“分家。”\n堂屋里一片哄笑：“一个丫头片子，带着个拖油瓶，分出去等死？”\n她没回头。\n分家后，她采野菜卖野兔赚了第一桶金。\n一个月后，她的木薯淀粉风靡镇上酒楼。\n两个月后，她买下了村东头三十亩地。\n三个月后，她要翻新老宅推倒重盖\n继母急了，爷奶慌了，亲爹站在院门口来回踱步——那院门，她牵着弟弟走出去那天，就再没打算回来。\n年底，她坐着新打的牛车经过老宅门口，继母追出来喊她的名字。\n她低头给弟弟擦了擦嘴角的油光，头都没抬：\n“娘？我娘早死了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [12.59, 13.76, 13.76], "trend": 1.17, "latest": 13.8, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被嫁给瘸腿猎户，饥荒年顿顿吃肉", "fullTitle": "被嫁给瘸腿猎户，饥荒年顿顿吃肉", "link": "https://fanqienovel.com/page/7544980163042216984", "data": [21.84, 21.84, 22.34], "trend": 0.5, "latest": 22.3, "wordNumber": 1319033, "creationStatus": 0, "desc": "【穿越+种田+医术+打猎+采药+系统+商城+空间】\nps：没有京城、朝堂、王爷、将军、简单温馨种田日常、微群像。\n凌溪从小身患心脏病，爹不疼娘不爱\n好不容易熬到医师转正，却又病发离世\n再睁眼，\n她成了饥荒年，被恶毒阿奶卖给瘸子冲喜的林西。\n一番权衡，先跟娘家断亲。\n再嫁瘸腿猎户\n没想到，成婚第二日就被公婆分出家？\n莫慌！\n进山、开荒、打猎，采草药\n一不小心还解锁了，草药图鉴系统。\n采到草药解锁图鉴\n不但有积分能在商城兑换物资，\n还能掉落丰厚的实物奖励。\n帮瘸腿相公治好腿。\n奖励更多！\n外面饥荒，饿尸殍野。\n深山之中他们天天吃肉……\n不太会写简介，大家移步正文！", "tags": ["种田", "古代言情", "系统", "穿越", "空间", "医术"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家小福星，全家反派都慌了", "fullTitle": "穿成农家小福星，全家反派都慌了", "link": "https://fanqienovel.com/page/7629967669818575897", "data": [13.53, 13.91, 13.91], "trend": 0.38, "latest": 13.9, "wordNumber": 665517, "creationStatus": 1, "desc": "评分刚出会长得（漫剧上线，欢迎观看）\n【读心+种田+团宠+萌宝】\n\n云生生穿书了，成了书里3岁还不会说话的小傻子。\n\n一家子恶毒反派，花样作死，妥妥就是女主一家的对照组。\n\n云生生麻了，有苦说不出\n\n却不知一家人都能听到她的心声。\n\n她爹心狠手辣，杀人埋尸？结果那人好好活着，还和她爹合伙做生意\n\n她娘丧心病狂，在席面里投毒？结果她娘做饭越来越好吃，家家排队请她做席面\n\n大姐嫌弃姐夫多年科考不中，闹着和离还打死婆婆？结果大姐起早贪黑挣钱，供姐夫读书\n\n二姐重伤世子爷，还把他扔到荒野里喂狼？结果二姐把人背回家，还好生伺候\n\n三姐偷了钱跟着小白脸私奔，然后被卖青楼？结果三姐把小白脸变太监，还进宫\n\n四姐女扮男装入匪寨打家劫舍，然后被枭首示众？结果四姐女扮男装入军营，屡立战功\n\n以前众人嘲笑：云老二没儿子，要绝后\n\n后来众人跪舔：云大人的闺女各个大出息，一个顶十个儿子，牛啊！\n\n云家五朵金花，四个姐姐都名花有主，众媒婆赶紧盯上了最小的香饽饽，门槛差点被踩烂。\n\n宴时瑾拉着云生生的手让她看：“我为你准备了白玉金丝镶五彩宝石花盆……”\n\n云生生：“……”\n\n【云生生穿书/宴时瑾重生/原书女主穿越】", "tags": ["种田", "古代言情", "乡村", "萌宝", "团宠", "穿书"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放，神医小娇妻救了国公府满门", "fullTitle": "流放，神医小娇妻救了国公府满门", "link": "https://fanqienovel.com/page/7182987297330039840", "data": [29.77, 30.03, 29.97], "trend": 0.2, "latest": 30.0, "wordNumber": 1167916, "creationStatus": 0, "desc": "【空间+女主神医+女强+爽文+虐渣+发家致富+全家流放逃荒，女主能力强，空间辅助】\n特种军医穿越古代，刚穿越就与历史上的大英雄墨玖晔拜堂成亲。\n据历史记载，墨家满门忠烈，然而却因功高盖主遭到了皇上的忌惮，新婚第二日，便是墨家满门被抄家流放之时。\n了解这一段历史的赫知冉，果断使用空间搬空墨家财物，让抄家的皇帝抄了个寂寞。\n流放前，又救了墨家满门的性命。\n担心流放路上会被饿死？这不可能，赫知冉不但空间财物足够，她还掌握了无数赚钱的本事。\n一路上，八个嫂嫂视她为偶像，言听计从。\n婆婆小姑默默支持，但凡有人敢说赫知冉不好，老娘撕烂你们的嘴。\n终于安顿下来，日子过得一天比一天红火。\n墨玖晔：“媳妇儿，我们成亲这么久，还没有洞房呢！”\n赫知冉：“想洞房，得看你表现。”\n墨玖晔：“我对天发誓，一辈子心里只有你一个女人，不，下辈子、下下辈子也是。”\n赫知冉：“你说话要算数……”", "tags": ["种田", "古代言情", "穿越", "空间", "女强", "虐渣", "今穿古", "打脸", "逃荒", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "中奖10个亿的护士躺平生活", "fullTitle": "中奖10个亿的护士躺平生活", "link": "https://fanqienovel.com/page/7653831326541286462", "data": [14.35, 16.93, 22.65], "trend": 8.29, "latest": 22.6, "wordNumber": 379546, "creationStatus": 1, "desc": "沈南星三十七岁，在三甲医院急诊科做了十二年护士。她曾以为和医生丈夫一起进医院、结婚生子、买房还贷，就是普通人最稳妥的人生。可十二年过去，她熬过夜班，生下两个儿子，撑起家里家外，却在医院改革中被裁，失去工作后，婆婆态度骤变，丈夫沉默回避。最终，离婚了，那天雨很大，她路过一家彩票店，随手买下几注彩票，所有人都以为沈南星已经输了。直到她发现，自己中了十个亿........", "tags": ["职场婚恋", "现代言情", "萌宝", "家庭", "职场", "医生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚羔羊", "fullTitle": "新婚羔羊", "link": "https://fanqienovel.com/page/7586483614892690457", "data": [84.49, 87.64, 87.64], "trend": 3.15, "latest": 87.6, "wordNumber": 1026156, "creationStatus": 1, "desc": "婚后我才知道，老公有个怪癖——每晚亲热前必喝交杯酒。\n起初我以为只是夫妻间的情趣，直到一次妇科检查令真相大白，我才猛然惊觉：在这场婚姻里，我从来不是妻子，而是他精心饲养的待宰羔羊。", "tags": ["职场婚恋", "现代言情", "婚恋", "家庭", "家长里短", "第一人称"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "远嫁八年，回娘家难如登天！", "fullTitle": "远嫁八年，回娘家难如登天！", "link": "https://fanqienovel.com/page/7567928097673055256", "data": [27.49, 28.83, 28.83], "trend": 1.34, "latest": 28.8, "wordNumber": 1153838, "creationStatus": 1, "desc": "（远嫁+恶婆婆+过年不让回娘家）\n林婉怡为爱远嫁八年，一次没有回过娘家，临近过年父亲病重弟弟结婚，她提出让丈夫和女儿一起回娘家过年，却被婆家人轮番刁难。\n婆婆说：“你嫁到王家就是王家人，别一天到晚惦记娘家，给他们一百块钱，我看他们还想不想你。”\n大姑姐说：“你走了谁照顾我爸妈？谁给他们做饭洗衣服？”\n就连丈夫也唯唯诺诺：“老婆，我姐说的对，大过年的你不在村里人会笑话我们的，实在不行你打个视频跟爸妈见一面吧。”\n林婉怡愤怒不已想要带着女儿自己回去，婆婆却又藏起女儿：\n“想走自己一个人滚，不准带走我王家的子孙！”\n后来，林婉怡离了婚，带走了女儿，还把王家搅了个天翻地覆。\n王家人，终于后悔了……", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "离婚后豪门前夫彻底失了控", "fullTitle": "离婚后豪门前夫彻底失了控", "link": "https://fanqienovel.com/page/7172033185033751563", "data": [9.11, 9.87, 9.87], "trend": 0.76, "latest": 9.9, "wordNumber": 2503800, "creationStatus": 0, "desc": "【双洁+双向奔赴+先婚后爱+追妻火葬场】\n时漾年少时开始喜欢的傅景川，那时他是天之骄子，她只是不起眼的转学生，两人之间像隔着鸿沟。\n多年后同学聚会上重逢，他坐她旁边，席上两人几乎没什么交流。\n聚会结束，他顺路送她回家。\n那天晚上，两人不小心擦枪走了火。\n她意外怀孕，他问她愿不愿意结婚，她说好。\n没有婚礼，也没有祝福，两人婚后的生活像搭伙过日子，平淡且无趣。\n最终，时漾提了离婚，“傅景川，我们离婚吧。”\n他只是静静垂眸看她，然后轻轻点头，“好！”\n所有人都以为傅景川不爱时漾，包括时漾自己，直到那天，在商场熙熙攘攘的人群里，两人不经意间擦肩而过，傅景川突然一把拽住了她手臂，时漾看到了他黑眸里掀起的狂风巨浪。\n【日常风，男主爱而不自知，前期火葬场，后期甜宠（会有曲折），细腻慢热，徐徐讲故事】", "tags": ["职场婚恋", "现代言情", "总裁", "甜宠", "豪门世家", "双向奔赴", "暗恋", "1v1", "追妻"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "机关女人", "fullTitle": "机关女人", "link": "https://fanqienovel.com/page/7539124126061972505", "data": [12.38, 12.65, 12.92], "trend": 0.54, "latest": 12.9, "wordNumber": 799942, "creationStatus": 0, "desc": "农村出身的吴玫，通过公务员考试，拥有了政府机关干部的身份，本以为一朝上岸，就可衣食无忧。可树欲静而风不止，看似体面的工作，实则暗潮汹涌，危机四伏。\n　　吴玫能否适应机关工作？是任人收割？还是自主沉浮？工作与感情，婚姻与家庭，这一切能否成为桎梏吴玫成功的枷锁？\n　　请与作者一起走入机关女人的精彩生活……。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "潮汐界限", "fullTitle": "潮汐界限", "link": "https://fanqienovel.com/page/7524517490395712536", "data": [25.82, 25.95, 26.12], "trend": 0.3, "latest": 26.1, "wordNumber": 348239, "creationStatus": 0, "desc": "【实体书《潮汐界限》已上市，各平台搜索书名可买】\n办公大楼里传着两句心照不宣的话——\n一是周聿深的车驶过观复街，连积雪都会识趣地消融三分。\n二是他的行程从不为谁停留。\n后来蔚汐才知道，这两句话都是错的。\n*\n那场行业座谈会上，蔚汐被突兀地点名坐进第一排。\n全场目光灼灼，她的发言快速且精准，却仍然紧张到指尖发颤，不敢抬头看主位上那位。\n再后来，分手那天雨很大——\n她因醉酒蜷在街角等车，朦胧间看见那辆从不驻足的黑色轿车缓缓停驻。\n“蔚小姐。”男人嗓音沉缓，整洁的西装沾了雨气，“你抖得厉害。”\n他那样威严的大人物。\n竟会破例俯身撑伞，纵容她在车里哭了足足四十七分钟。\n*\n“周聿深，你图什么？”\n“潮汐有信，为我停留。”\n*\n观复街的积雪会消融，他的锋芒也会俯首。\n而潮汐界限，终抵不过他为她心软的四十七分钟。", "tags": ["职场婚恋", "现代言情", "大佬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "豪门总裁": [{"label": "哥，你再当舔狗我就舔你的死对头", "fullTitle": "哥，你再当舔狗我就舔你的死对头", "link": "https://fanqienovel.com/page/7625291986546723902", "data": [64.9, 67.8, 70.55], "trend": 5.66, "latest": 70.6, "wordNumber": 520193, "creationStatus": 1, "desc": "【奶凶大小姐+高冷年上+训哥】\n好好的人不当，非要当舔狗？没关系，你舔你的女明星，我舔你的死对头，看谁舔得过谁。\n前世惨死，周岁岁重生了，哥哥在给白莲花表白的路上。\n周岁岁不慌不忙，从包包里掏出一个小盒子，拨通哥哥视频，满脸无辜：“哥哥，这是什么呀？”\n盒子上“持久超薄”几个黑字被放大。\n哥哥直接炸毛，“你才十九岁，这玩意谁给你的？”\n岁岁歪着脑袋，“你的好兄弟江宗砚啊。”\n哥哥石化：什么兄弟？他们是死对头！\n岁岁惊讶：“哥哥，你们每次见面眼睛都瞪那么大，关系很好吧？”\n哥哥懵逼：那分明是想嘎了他。\n“不说了，砚哥哥还在酒店等我，他说教我玩个刺激的游戏。”\n酒店？游戏？\n哥哥快要碎了：“求你了，别去，哥不表白了。”\n表白取消，白莲花还等着哥哥去跟她道歉。\n然而她不知道的是，从此哥哥跟她说的最多的话是“下次，下次我一定去见你，下次一定给你买”。\n终于治好了哥哥的恋爱脑，周岁岁打算抽身而退，却发现被她死缠烂打的男人不干了。\n他将她禁锢身前，滚烫的手掌强势扣着她的腰，咬着她耳朵，语气恶劣又张狂：“宝宝你忘了，小时候哭着闹着要嫁给我？乖乖，叫老公，这十个亿是你的零花钱。”\n呵，狗男人！可他给的实在太多了。\n“老公……唔……”", "tags": ["豪门总裁", "现代言情", "重生", "冰山", "大小姐", "年龄差"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "她醉酒进错房，京圈大佬一夜沦陷", "fullTitle": "她醉酒进错房，京圈大佬一夜沦陷", "link": "https://fanqienovel.com/page/7508934595518139454", "data": [61.82, 63.53, 64.65], "trend": 2.82, "latest": 64.6, "wordNumber": 1157175, "creationStatus": 0, "desc": "【甜宠+双洁+男主一见钟情到发疯索爱】\n矜贵闷骚的集团大总裁vs清纯漂亮的小白花员工\n林媛参加朋友生日聚会，喝醉了酒，一不小心走错房间，跟陌生男人邂逅一整夜。\n第二天她看了一眼男人，怕被要求负责，匆匆就跑，本以为不会再有见面的机会，却不想隔天去医院检查的时候，又碰到了他。\n穿着白衬衫的男人，矜贵自持，高冷得不像话，“裤子脱了，我帮你检查。”\n误以为他是医生，林媛傻乎乎的听男人指挥，任他为所欲为。\n事后才发现，他竟然假借医生之名，对她欲图不轨。\n林媛吓得要跑，却被他抓住，拐上车，露出了他的狼子野心。\n“那一晚我比较吃亏，对我负责。”\n负责的代价是，她又陪了他一整晚，彻夜疯狂，弄得她腰酸腿软。\n本以为会从此一笔勾销，却不想彻底被他缠上。\n她遇麻烦，他帮她解决。\n她受欺负，他替她报仇。\n天上没有掉馅饼的事。\n林媛问他，“你想要什么？”\n傅冥修，是京圈无人招惹的集团大佬，清冷禁欲，不近女色，却在一个陌生女人进了他房间后一夜沉沦，欲罢不能。\n他对了她上了瘾，着了魔，明知道她有男朋友，却依旧想禁锢她入怀。\n直到发现她没有所谓的男朋友，他欣喜若狂，面对她问他想要什么，搂住她疯狂索吻，“我想要你。”", "tags": ["豪门总裁", "现代言情", "总裁", "甜宠", "一见钟情", "双洁", "位尊权重"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "十诫锁心", "fullTitle": "十诫锁心", "link": "https://fanqienovel.com/page/7584818220356357144", "data": [80.42, 82.46, 82.46], "trend": 2.04, "latest": 82.5, "wordNumber": 908983, "creationStatus": 0, "desc": "【强制爱+年龄差+体型差+上位者不低头+身与心的绝对掌控】\n东南亚狠厉财阀大佬 x 华国呆萌娇柔小白花　　　\n被亲叔叔骗到金三角，19岁的大二学生夏知遥沦为待宰的猪仔。\n就在生死一线间，那个缔造秩序的男人如神祇般降，将她从地狱中救出。\n他是她的救赎，却也是她的深渊。\n在无冕之王沈御面前，夏知遥渺小如尘埃。\n“记住，惩罚，就是对你的奖赏。”\n他占有她的一切，而她只能颤抖着含泪道谢。\n他用最残酷的方式将她驯服，又用最宠溺的爱欲将她占有。\n他救赎她和她的家人，也惩罚所有欺侮她的仇人。\n她在极致的痛与爱中不断沉沦……\n直到她陷入敌人之手，他擦着枪，眼底血红，杀气冲天：\n“我的东西，谁敢动？送他上天。", "tags": ["豪门总裁", "现代言情", "宠妻", "甜宠", "大佬", "年龄差"], "borderColor": "#9b59
