  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);

    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }

  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);

    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }

  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }

    margin-bottom: 18px; padding-bottom: 12px;

  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }

  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;

    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;

  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

他们也不知道，厦门档案馆内的资料，也被篡改了。\n鉴于张瑞朴之前是元老级别的人，张南絮的身份彻底成为了谜团。\n*\n张海侠的温柔，张海盐的逗比，张南絮只想把张海盐的嘴缝上，就你有嘴是吧？\n莫云高的事情发生。\n*\n山海不相见，见之必亡。\n亡不亡的，张南絮只想说：别闹了，你们谁能有我这个穿越来的知道的剧情多？\n这也就是不知道南部档案的剧情，不然都不会变成这样的。\n但是话说回来了，你们老是追着我干什么？\n张海侠：阿絮，你之前说的话还算数吗？\n张海盐：我俩是兄弟，你不能厚此薄彼啊，我也要跟你睡。\n张启灵：？\n张海琪：我两个儿子都不错，考虑一下？", "tags": ["女频悬疑", "悬疑", "穿越", "灵异", "同人", "悬疑恋爱"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [3.54, 4.4, 4.82, 5.12, 5.36, 5.66, 7.26], "trend": 3.72, "latest": 7.3, "wordNumber": 214228, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.71, 2.68, 2.65, 2.61, 2.57, 2.94, 3.69], "trend": 0.98, "latest": 3.7, "wordNumber": 287379, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "乡村", "甜宠", "打脸", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.88, 2.92, 2.97, 3.09, 3.17, 3.31, 3.68], "trend": 0.8, "latest": 3.7, "wordNumber": 252466, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [6.05, 7.1, 7.51, 7.89, 8.33, 8.66, 6.8], "trend": 0.75, "latest": 6.8, "wordNumber": 156209, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [8.21, 8.59, 8.99, 9.01, 9.42, 9.09, 8.43], "trend": 0.21, "latest": 8.4, "wordNumber": 237327, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局逃荒农家长姐有空间", "fullTitle": "开局逃荒农家长姐有空间", "link": "https://fanqienovel.com/page/7655709030232362008", "data": [2.68, 2.89, 2.99, 3.02, 3.04, 3.03, 2.73], "trend": 0.06, "latest": 2.7, "wordNumber": 184336, "creationStatus": 1, "desc": "【古代言情＋种田＋逃荒＋基建＋女主成长＋年下养成】\n【年下娇羞小将军vs全能型末世大佬】\n末世挣扎求生五年，最后还是死在了丧尸手里，苏清禾本以为要重新投胎了，却不想一睁眼穿成了古代的农家长姐，刚穿来就是天崩开局，斗极品亲戚，爹娘还都死了，却留下两个妹妹，和一个几个月大的弟弟给她抚养，\n她都还没来得及适应新身份，就拖家带口踏上了逃荒路，\n没有家人帮衬没关系，没有她有灵泉空间，还有一身的本领，足够她带着弟妹在这乱世中生存下去，\n只是原本收养的小萝卜头不知道什么时间就悄悄长大了，她教他习武，教他杀人，在他被强制征兵后成为他坚实的后盾，看着他从青涩稚童到意气风发的少年将军，苏清禾满是吾家有弟初长成的成就感，本以为是相依为命的姐弟情，却不想随着她身边的追求者越来越多，他的占有欲也愈发浓烈，\n萧衡哪里知道某人对他也是觊觎已久，只是眼睁睁看着他一步步踏入自己早已编织好的牢笼，", "tags": ["种田", "古代言情", "乡村", "逃荒", "基建", "年下"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [3.87, 5.67, 6.0, 6.25, 6.54, 6.76, 7.11], "trend": 3.24, "latest": 7.1, "wordNumber": 214428, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.65, 9.58, 9.54, 9.63, 9.68, 9.81, 10.58], "trend": 0.93, "latest": 10.6, "wordNumber": 263514, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.29, 5.68, 5.95, 5.97, 5.97, 5.99, 6.12], "trend": 0.83, "latest": 6.1, "wordNumber": 258882, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "玄幻言情", "score": 7, "reasons": ["7日增长+24.9万", "竞争系数低(3.4)", "腰部稳(均腰比1.12)"], "total19": 165.0, "growth": 17.8, "abs_growth": 24.9, "coeff": 3.4, "count10w": 2, "mean": 5.5, "mid19": 4.9, "mm_ratio": 1.12, "ndays": 7}, {"cat": "职场婚恋", "score": 7, "reasons": ["7日增长+28.1万", "竞争系数低(3.7)", "腰部稳(均腰比1.2)"], "total19": 159.5, "growth": 21.4, "abs_growth": 28.1, "coeff": 3.7, "count10w": 3, "mean": 5.3, "mid19": 4.4, "mm_ratio": 1.2, "ndays": 7}, {"cat": "豪门总裁", "score": 7, "reasons": ["7日增长+18.4万", "竞争系数低(4.7)", "腰部稳(均腰比1.34)"], "total19": 633.7, "growth": 3.0, "abs_growth": 18.4, "coeff": 4.7, "count10w": 26, "mean": 21.1, "mid19": 15.8, "mm_ratio": 1.34, "ndays": 7}, {"cat": "女频悬疑", "score": 6, "reasons": ["7日增长+12.9万", "竞争系数中(5.0)" ，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [5.95, 7.2, 10.08], "trend": 4.14, "latest": 10.1, "wordNumber": 146772, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [14.31, 15.54, 16.81], "trend": 2.5, "latest": 16.8, "wordNumber": 204957, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "危！刚飞升我就杀了天帝？", "fullTitle": "危！刚飞升我就杀了天帝？", "link": "https://fanqienovel.com/page/7663020533176339518", "data": [3.63, 4.36, 5.7], "trend": 2.07, "latest": 5.7, "wordNumber": 127181, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "灵根被挖后，被爆出我是杀神转世", "fullTitle": "灵根被挖后，被爆出我是杀神转世", "link": "https://fanqienovel.com/page/7660556085752761369", "data": [2.73, 2.92, 4.32], "trend": 1.6, "latest": 4.3, "wordNumber": 277867, "creationStatus": 1, "desc": "【真假千金+天道金榜盘点+火葬场扬灰+杀伐果断】\n雷劫之下，真千金温灵枫被亲生父母和师尊强行按在阵法中，\n生生抽走变异冰灵根，只为给假千金温柔续命。\n剧痛中，温灵枫觉醒记忆，原来自己只是一本团宠文的血包女配！\n她决然捏碎本命玉牌，叛出宗门。\n次日，天生异象，天道金榜横空出世，耀眼金光直指温灵枫：\n“盘点修仙界十大至高神祇，榜首——上古杀神转世、天道之主温灵枫！”\n看着金榜上温灵枫未来挥剑斩碎九重天、覆灭万法的画面，偏心父母和满门师兄吓得肝胆俱裂。\n他们挖了天道之主的灵根？现在跪下求她，还来得及吗？", "tags": ["玄幻言情", "系统", "幻想言情", "前世今生", "真假千金"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [8.03, 8.41, 9.36], "trend": 1.33, "latest": 9.4, "wordNumber": 138185, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [4.65, 5.16, 5.49], "trend": 0.84, "latest": 5.5, "wordNumber": 270396, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料 om/page/7650930355381210137", "data": [4.83, 4.95, 5.31], "trend": 0.48, "latest": 5.3, "wordNumber": 218953, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [3.35, 3.46, 3.78], "trend": 0.42, "latest": 3.8, "wordNumber": 287465, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "剑修", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "那个闻药就呕的庸医是剑仙", "fullTitle": "那个闻药就呕的庸医是剑仙", "link": "https://fanqienovel.com/page/7653601370594872344", "data": [3.14, 3.28, 3.54], "trend": 0.4, "latest": 3.5, "wordNumber": 228897, "creationStatus": 1, "desc": "（刚开分，还会涨）【微群像+1v多雄竞+男全洁+性取向丰富+女强+团宠+掉马甲+高冷老六】\n月照梵身为医修，却一闻药味就想yue。\n问题不大，被当成黑心医修有什么不好？\n如果病人不听医嘱，那么我也略懂一些拳脚。\n没想到好不容易用技术征服患者，竟惹得剑宗高岭之花大师兄黑化疯魔：\n“小奶狗有什么好？是我还不够骚吗？” \n温润如玉的贵公子发小不服，跟在后面又争又抢：\n“只要你愿意多看我一眼，哪怕像小时候一样天天打我都行……”　　\n回到家还没喘口气，又被自己的腹黑兄长药翻在床上：\n“梵儿，兄长不好吗？为什么要去找别人？”\n月照梵还没跑掉，又被魅魔合欢宗宗主纠缠不休：\n“小月儿，男人有什么好？姐姐能让你尝到什么叫极乐……”\n谁能想到好不容易逃出生天，又被魔君抓走按住：\n“听说……你要我死？”\n月照梵都受不住了，首富家的腼腆少主还来横插一脚：\n“梵、梵姐……我很乖的……”\n接连而来的修罗场让月照梵怀疑人生，修真界怎么如此危险？", "tags": ["玄幻言情", "幻想言情", "医术", "古色古香"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "顶级世家大小姐，全族撑腰谁敢动", "fullTitle": "顶级世家大小姐，全族撑腰谁敢动", "link": "https://fanqienovel.com/page/7644883270928190526", "data": [3.5, 3.61, 3.78], "trend": 0.28, "latest": 3.8, "wordNumber": 287343, "creationStatus": 1, "desc": "【大女主+顶级隐世家族+系统+无CP+忠犬龙凤胎弟弟+救世】\n高考考场，南宫知佑落下试卷最后一笔。\n系统之音骤然在脑海中响起：无数小说世界错乱融合，男女主们肆意破坏、搅乱秩序，整片修仙界濒临崩塌。\n天道恳请她，出手拯救濒临毁灭的苍生。\n南宫知佑，一口应允。\n系统为她编写出身，（专属世界=南宫知佑专属秘境）她转身降生世间第一隐世大家南宫家族，生来就是全族上下、全员偏心、宠到骨子里的嫡出大小姐。\n身边还有一母同胞的龙凤胎弟弟，软萌奶狗、极致忠犬，眼里心里只有姐姐一人，姐姐说东绝不往西，姐姐一句话，他愿为她挡下世间所有刀山火海。\n两人的相遇，相互救赎，是命中注定。\n一路仙途前行，南宫知佑不断的成长。\n怼傲慢天骄、撕破虚伪假面、踏尽拦路强敌、镇压失控作乱的男女主；\n抚平乱世祸乱、守护亿万苍生，于荆棘遍地的神路之上，一路杀伐、一路高歌。\n南宫知佑看着面前南宫家的人：\n额……没人告诉这些人因她而来，甘愿臣服于她。\n从被命运选中的异乡来客，到全修仙界的救世天命，也是命运的重逢\n修为境界：\n练气→筑基→金丹→元婴→化神→炼虚→合体→大乘→渡劫飞升\n（每个大境界分：初期-中期-圆满-巅峰", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "嫡女", "无CP"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [9.33, 9.39, 9.58], "trend": 0.25, "latest": 9.6, "wordNumber": 252227, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#95a5a6" desc": "【非爽文+无限流+无cp+智斗游戏+微群像+成神之路+神明入侵】\n晏夕这辈子最擅长三件事：藏锋，偷懒，逃避。\n她本以为自己可以这样安安稳稳和妹妹相依为命，直到某天，她被卷入一场名为“神明审判”的无限游戏。\n晏夕醒来时，发现自己在一座审判厅里。\n六个人，七张椅子。\n规则只有一条：每个人必须找到属于自己的审判椅，一人坐错，全员处刑。\n别人崩溃、争吵、抢线索，只有晏夕靠在墙边，一动不动。\n众人以为她吓傻了。\n直到审判钟声敲响，她不动声色地做出正确的选择。\n他们这才发现，这个被判定为【怠惰】的女人，不是不敢动，她只是懒得做错事。\n后来，贪惏者死于欲望，色欲者毁于执念，暴怒者痛不欲生，傲慢者跪下求饶。\n所有人都在七罪试验里挣扎求活。\n只有晏夕，一步一步走上神座。\n塔灵问她：“你犯下怠惰之罪，可知悔改？”\n晏夕淡淡道：\n“我不悔。”\n“我只是累了。”\n“累到想让这场无穷无尽的审判，彻底安息。”\n（不是爽文！！！具体排雷详见第一章作话和评论，谢绝写作指导，不喜勿入）", "tags": ["悬疑脑洞", "悬疑", "无限流", "灵异", "无CP", "群像"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓麒麟崽怎么又又又倒霉了", "fullTitle": "盗墓麒麟崽怎么又又又倒霉了", "link": "https://fanqienovel.com/page/7648908738077658137", "data": [3.0, 3.67, 4.49], "trend": 1.49, "latest": 4.5, "wordNumber": 139812, "creationStatus": 1, "desc": "【无cp＋友情＋团宠＋搞笑＋系统？＋后面会变小麒麟】\n路归只是去趟厕所的功夫，再出来就被带到了盗墓世界。\n还绑定了个985系统，要他加入主角团。\n说是让他改变每个人未来悲惨的命运走向？\n他只是个普通人啊！！\n主角团那都是何许人也？！一个个的都是能喜提一套银手镯套餐的狠人，他一个小卡拉米不得送菜去。\n无邪开心:“我们都是小卡拉米。”\n张起灵慈爱:是小可爱，我家的。\n黑瞎子扶额:“真是个没长大的小崽子。”\n王胖子笑成花:“快来吃饭。”\n解雨臣霸气十足:“拿去刷。”", "tags": ["悬疑脑洞", "悬疑", "灵异", "无CP", "同人", "风水秘术"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "青霉素发家，张家女在盗笔当富豪", "fullTitle": "青霉素发家，张家女在盗笔当富豪", "link": "https://fanqienovel.com/page/7659746866979933246", "data": [11.77, 12.05, 13.04], "trend": 1.26, "latest": 13.0, "wordNumber": 160635, "creationStatus": 1, "desc": "【字数比较少，刚开分】【剧情线从南部档案开始，cp黑瞎子1v1，无其他暧昧向】  \n       张海灼这辈子做过最正确的决定，是十五岁那年从张家假死出逃。\n       第二正确的决定，是在柏林巷子里捡了黑瞎子当劳动力。\n       她在法租界开药铺，在苏州河边建厂，用青霉素撬动军火贸易，用芯片技术搭上改革开放的快车。\n       八十年间她换了三个身份，产业却越做越大，从“姚老板”到“姚小姐”再到“姚董”，桃花暗纹的信物流传至今。\n       什么莫云高、裘德考？要体验一下被经济制裁的恐惧吗？\n       什么汪家？你背后的势力比得上我为国家做的贡献？\n       什么，每个身份身边都有一个黑漆漆的保镖？不好意思啊，我们毕竟是母女嘛，审美一致，男朋友长得像多正常。\n       黑瞎子：没错，她就喜欢我这款！\n——\n       我写的主角是1905出生的张家人，从民国活到主线，尽可能经历大部分重要剧情点，能避免的悲剧会尽量避免，不会过多干扰让某些剧情点直接消失，但会改变一些人的结局。\n       主角有自己的事业线要走，某种程度上会是从民国到现代的穿越大女主爽文", olor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [14.92, 15.82, 16.41, 16.93, 17.53, 18.08, 19.33], "trend": 4.41, "latest": 19.3, "wordNumber": 890944, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [14.13, 14.01, 14.21, 14.41, 14.98, 15.72, 17.56], "trend": 3.43, "latest": 17.6, "wordNumber": 4614098, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "想兼祧两房？搬空家产带儿女和离", "fullTitle": "想兼祧两房？搬空家产带儿女和离", "link": "https://fanqienovel.com/page/7545324289256328216", "data": [27.47, 27.58, 28.47, 29.73, 29.43, 29.1, 28.71], "trend": 1.24, "latest": 28.7, "wordNumber": 1152924, "creationStatus": 0, "desc": "【有空间，不是双洁，女主懂医术。】\n末世摸爬滚打多年的乔念，带着空间穿越到古代，一个穷秀才的妻子。\n刚睁眼，龙凤胎儿女面临被卖，乔念凭借自己的武力夺回孩子。\n成亲五年的秀才相公不回家？\n她带着孩子找过去。\n结果却发现，丈夫和寡嫂在城里，小日子过得风生水起，连儿子都生了俩。\n乔念一去，大杀四方，胖揍狗男女，搬空婆家所有财物。\n和离后，带着娘家人赚得盆满钵满。\n乔念变得越来越漂亮，肤白貌美又多金，渣前夫肠子都悔青了。\n他厚着脸皮上门求和，被乔念一脚踢出门。\n渣男有多远给我滚多远……", "tags": ["种田", "古代言情", "穿越", "空间", "医术", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听懂兽语后：整个后山都是我粮仓", "fullTitle": "听懂兽语后：整个后山都是我粮仓", "link": "https://fanqienovel.com/page/7532785436142357566", "data": [16.86, 16.91, 17.0, 17.16, 17.09, 17.28, 18.08], "trend": 1.22, "latest": 18.1, "wordNumber": 1399162, "creationStatus": 0, "desc": "【大力胖妞+混混娇夫+搞笑夫妻+通兽语+屯粮满仓】\n超级大忽悠叶珠和一只千年乌鸦哥一起穿越了，还能听懂各种动物说话，于是整个后山的动物都被她忽悠成了小弟，大野猪跟她称兄道弟，老虎把她当成自己崽，她成了名副其实的山大王。\n开局成为农家痴傻胖妞，恶毒的爷奶二叔一家为了聘礼把她卖了给人配冥婚。不怕！往死里揍他们就完了。一顿不行那就揍两顿！\n爹娘包子？不怕，她最擅长给人洗脑，黑的也能说成白的。老实了一辈子的爹突然醒悟，大耳瓜子痛打黑心二弟。\n软弱娘对上恶毒婆婆“娘，你再逼我，我就吊死在家门口，让全村看看你恶毒嘴脸！”\n恶毒婆婆“天爷啊！这都是我的词儿啊！”\n古代独生女照样能在灾荒年带着父母过上好日子，还能带着全村一起填饱肚子！\n叶珠：路边的男人不能捡。\n贺铮：救命之恩，我想以身相许。", "tags": ["种田", "古代言情", "穿越", "美食", "医术", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "发配边关，罪妻开荒养出战神", "fullTitle": "发配边关，罪妻开荒养出战神", "link": "https://fanqienovel.com/page/7613410424586767385", "data": [71.98, 76.89, 78.07, 77.73, 79.1, 79.78, 72.51], "trend": 0.53, "latest": 72.5, "wordNumber": 749824, "creationStatus": 1, "desc": "【边关生活+木系+御兽+宠夫+护短+开荒种田+甜宠+双强直球夫妇+对照组】\n大靖连旱两年，粮荒四起，战火燃遍辽东。\n末世后勤员苏禾穿成罪奴丫鬟，被发配给军户为妻。\n罪奴姐妹极力表现，力争抢个优秀男儿，而她只看安全感，一眼锁定全场最壮的百户萧征。\n他冷脸拒绝：“我不需要媳妇，赏我粮食就行！我养不起，也没功夫照顾。”\n她直白坦荡：“我不用你照顾。我能种地，能持家。你很强，跟你，我安全。”\n没媳妇前的萧征：女人真麻烦！\n有了媳妇后，萧征夜夜搂着苏禾：真得劲！媳妇，再来二十个馒头！\n自此，边关多了一对双强夫妇。\n他负责拿刀护她，横扫敌军；\n她负责种田产粮，兜底全家。\n极品邻居攀比？打脸！\n边关缺粮断炊？解决！\n敌军突袭包围？放野兽！\n萧征从穷军户一路封将，世人皆知：\n大将军最厉害的不是战功，是他那位能种出天下粮的媳妇。\n【饭桶将军×产粮小媳妇】\n你负责打仗护家・我负责种地养你", "tags": ["种田", "古代言情", "乡村", "穿越", "强强", "宠夫"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "嫁八，娘登！", "fullTitle": "嫁八，娘登！", "link": "https://fanqienovel.com/page/7567928097673055256", "data": [33.14, 38.51, 39.85, 40.07, 39.76, 40.29, 39.91], "trend": 6.76, "latest": 39.9, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>均腰比</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      const mmr=m.mm_ratio!=null?m.mm_ratio:0;
      const mmc=mmr<1.8?'#22c55e':mmr<=3.0?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${mmc};font-weight:600">${mmr}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const rawBooks = D.bookChartData[cat];
      const isRead = sfx.startsWith('Read');
      // 阅读榜只展示连载中的书；图表、表格、热门标签、累计净增全部同源
      const displayBooks = isRead
        ? rawBooks.filter(b => b.creationStatus === 1)
        : rawBooks;
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = displayBooks.length > 0
        ? displayBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${displayBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = displayBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书${isRead ? '，仅连载中' : ''}，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
