<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 7月23日–7月29日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

intRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [6.53, 6.32, 6.92], "trend": 0.39, "latest": 6.9, "wordNumber": 242091, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [7.02, 7.3, 7.41], "trend": 0.39, "latest": 7.4, "wordNumber": 273701, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我老公是年代文里女主的白月光", "fullTitle": "我老公是年代文里女主的白月光", "link": "https://fanqienovel.com/page/7646365309284142104", "data": [4.9, 5.05, 5.24], "trend": 0.35, "latest": 5.2, "wordNumber": 281605, "desc": "【年代+穿书+不下乡+空间+日常流+甜宠+养崽+搞事业】\n胎穿18年，直到结婚第二天，苏甜才知道，自己穿书了。\n不仅如此，她还抢了女主白月光，顺利从名字都没出现过一次的路人甲，晋升成头号女配。\n女主啥事都想跟她比一下。\n女主是城市户口，她是农村户口，刚傲气两天，就想到以后拆迁，农村能分到三倍多拆迁款，女主又沉默了。\n女主成为电厂正式工，还没来得及炫耀，转头她就考上电厂干部。\n女主三年抱俩，暗地里笑她是不下蛋的母鸡，结果她一胎三宝，直接弯道超车。\n女主高兴考上全国首一的大学，就看见她以第一名的成绩成为运动后首批研究生。\n改革开放，女主创业开饭店，做老板，买大奔，风光无限，却不想苏甜手里早已经控股十数家公司，成了名副其实的企业家。\n女主终于崩溃了，红着眼问：“为什么？明明我才是女主，为什么哪里都比不上你？”\n苏甜靠在真皮沙发上，端起茶杯，慢悠悠地吹了口气，矫揉造作地笑了笑：\n“我也没办法，谁让姐从小就那么优秀呢？”\n“你要真想翻盘，可以等老了死在我前面，然后早投胎几年——说不定下一辈子，我就输你了。”\n女主：“……”", "tags": ["年代", "现代言情", "空间", "甜宠", "穿书", "养崽"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全家穿越年代后带着空间躺赢了", "fullTitle": "全家穿越年代后带着空间躺赢了", "link": "https://fanqienovel.com/page/7313546549861026878", "data": [4.44, 4.51, 4.52], "trend": 0.08, "latest": 4.5, "wordNumber": 256982, "desc": "评分刚出还会涨\n【爽文+年代+系统+空间+全家享福】\n有男主！\n林向瑜做了个噩梦，梦里是满是尘土的70年代。\n她以为只是幻觉，直到父母也梦见了同样的背朝黄土面朝天。\n下一秒，白光闪过——他们真的穿了！\n穿成了家里优渥、父母恩爱，却突然面临“下乡”指标的林家千金。\n有挂！\n✅ 签到系统到手，荒野变粮仓！\n✅ 随身空间开启，物资自由不是梦！\n别人在70年代苦哈哈挣工分，林向瑜靠着系统和空间，吃香喝辣，日子过得风生水起！\n且看她如何在物资匮乏的年代，带领全家发家致富，躺赢人生！", "tags": ["年代", "现代言情", "乡村", "系统", "穿越", "空间"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰腴美人一撒娇，冷面军官脸红了", "fullTitle": "丰腴美人一撒娇，冷面军官脸红了", "link": "https://fanqienovel.com/page/7640510554175458366", "data": [8.21, 8.22, 8.27], "trend": 0.06, "latest": 8.3, "wordNumber": 264243, "desc": "【年代，先婚后爱，随军，萌宝，追妻火葬场】\n把离婚协议书寄给容璟时的第二天，沈青姝开始不断做预知梦。\n她梦到自己被那伪善的白眼狼养妹夺走传家宝，算计下乡，在黑省被折磨致死，落得个抄家灭门的凄惨下场。\n醒来后，听着绿茶养妹正在脑海里和“系统”商量怎么抢她气运，沈青姝冷笑一声，反手夺过空间金手指，把白眼狼和渣男都一起打包下乡了！\n*\n撕了离婚信，护住沈家财产，沈青姝带着一对双胞胎儿子，麻溜去海岛军区找容璟时复合。\n面对主动换上真丝吊带钻被窝、软玉温香的小妻子，容首长如临大敌，咬牙切齿：“沈青姝，你休想用这种色诱的手段骗我签离婚协议，我绝对不上当！”\n 沈青姝翻了个白眼，一把擒住他的软肋：“废什么话，睡觉！”\n　　*\n海岛军区来了个美艳娇气的大小姐军嫂，刚开始大院里人人觉得她不出三天准待不下去。后来大家发现，这祖宗手里漏出的随便一样好东西，都够他们眼红大半辈子，各位刺头大佬纷纷开始抱大腿。", "tags": ["年代", "现代言情", "萌宝", "先婚后爱", "暗恋", "追妻火葬场"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [5.2, 5.64, 6.39], "trend": 1.19, "latest": 6.4, "wordNumber": 169965, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [4.77, 5.19, 5.62], "trend": 0.86, "latest": 5.6, "wordNumber": 168710, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [3.81, 4.1, 4.53], "trend": 0.72, "latest": 4.5, "wordNumber": 255612, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [3.48, 3.73, 4.08], "trend": 0.6, "latest": 4.1, "wordNumber": 259850, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越后自称汉族，后来我的国来了", "fullTitle": "穿越后自称汉族，后来我的国来了", "link": "https://fanqienovel.com/page/7643332690896227352", "data": [4.43, 4.76, 4.92], "trend": 0.49, "latest": 4.9, "wordNumber": 255380, "desc": "【无cp+古代穿越】\n沈清一朝穿越异世，逃荒路上众人排挤戒备，为在古代求生，对外谎称出身隐世大族。\n落脚于安置点时，开了间食肆，本想安安稳稳过日子，不想却救济了万民。\n宗室子弟肆意残害百姓，种种恶行令人发指。\n众人眼中最为善良、去牙行挑人都哭跑出来的沈娘子，破口大骂，众人纷纷表明从没听过这么脏的话。\n有人上前攻击，女主将手中器物猛地掷出，轰然一声炸响，震慑全场。\n“吾乃汉族，维天有汉，鉴亦有光，你们岂敢动我。”\n后期国家来了，女主的心态彻底发生变化。", "tags": ["种田", "古代言情", "穿越", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糠逆袭后，前夫九族悔哭了", "fullTitle": "糟糠逆袭后，前夫九族悔哭了", "link": "https://fanqienovel.com/page/7646611978152070206", "data": [4.04, 4.26, 4.49], "trend": 0.45, "latest": 4.5, "wordNumber": 262874, "desc": "和离后，姜小满得到了天大的机缘。\n\n洗筋伐髓，一夜回春。\n那张被二十年苦日子熬出来的蜡黄老脸，脱胎换骨，肌肤胜雪，花容月貌，比十六岁出嫁那年还美上十分。\n\n种灵草，炼仙丹，荒山变宝山。\n全省大旱，颗粒无收，她的灵稻却绿浪翻涌，逆天丰收。\n\n一颗丹药在京城卖出万两天价，求药的人从青岩山排到了城门口。\n\n前夫一家跪在她门前磕头认错。\n她正坐在院子里数银子，头也没抬，只淡淡说了句：“别挡光。”", "tags": ["种田", "古代言情", "乡村", "幻想言情", "空间", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "笨蛋美人挺孕肚，搬空全京去流放", "fullTitle": "笨蛋美人挺孕肚，搬空全京去流放", "link": "https://fanqienovel.com/page/7647142493472951321", "data": [2.43, 2.6, 2.88], "trend": 0.45, "latest": 2.9, "wordNumber": 253104, "desc": "【种田+天灾+流放+虐渣+搬空+空间】\n修真界符阵宗师南穗穗渡劫失败，穿成临安侯府人人嫌弃的痴傻庶女，被迫替嫁给身中剧毒、双腿残疾的短命宁王冲喜。\n新婚夜，宁王剑指咽喉：“说，皇后派你来做什么？”\n南穗穗软乎乎歪头：“哥哥，要吃糖糖吗？穗穗有甜甜的糖糖哦……”\n宁王：……（这怕不是个真傻子？）\n婚后次日，南穗穗察觉王府死气萦绕，掐指一算，十日之内必遭抄家流放！\n南穗穗冷笑一声，反手画下百张搬运符，连夜搬空侯府，顺便将国库、帝后私库一扫而空！\n短短十天，她不仅囤够亿万物资，还顺手解了宁王的毒，揣着双胎崽崽踏上流放路。\n流放途中，别人啃树皮，她吃香喝 饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成小丫鬟，靠梳妆赎身暴富", "fullTitle": "穿成小丫鬟，靠梳妆赎身暴富", "link": "https://fanqienovel.com/page/7564256304332557336", "data": [2.89, 2.94, 2.97], "trend": 0.08, "latest": 3.0, "wordNumber": 287752, "desc": "观看指南：【非爽文+架空北宋+微群像+市井经商+微宅斗+家长里短+日常流】\n林丰穗穿到北宋，成了八岁小丫头，喜提知州府上「家生子」身份。\n娘是灶上的厨娘，爹是账房贴书，前边还有个大她两岁的绣娘姐姐。\n老娘是灶上摸油水的高手，好的孬的全塞兜里。\n姐姐绣活一般，嘴皮子极好，哄的管事眉开眼笑，多出的边角料通通拎回家。\n家里边只剩个老实爹，半点不敢马虎手里的账。\n丰穗到了年纪要学门手艺，全家人跳出来支招。\n娘说：厨房干活是冬冷夏热，不行！\n姐说：绣娘的活计不分昼夜，别干！\n爹说：账房么，识字算术，不差分厘，还行！\n丰穗心想：学，都学，但还得靠重操旧业稳妥。\n“娘子，梳妆吗？”\n不不不，搞错了！八岁大的人应该先拜师学艺。\n谨小慎微是安身立命的前提。\n赚钱赎身，身兼数职是常态。\n伺候主子饮食起居，还得起早贪黑，制那面脂香膏、胭脂水粉上街兜售。\n苦点累点都没事，只要能挣脱这脖子上的枷锁。\n一家人齐整出府，置上一间小院，做些经济买卖，自由自在的过红火日子，便浑身都是劲。\n日子能过好，就别让其糟下去。\n立意：自由、奋斗、自强则万事顺，向阳而生。", "tags": ["种田", "古代言情", "穿越", "今穿古", "发家致富", "群像"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [2.63, 2.65, 2.68], "trend": 0.05, "latest": 2.7, "wordNumber": 253095, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但 ", "先婚后爱", "年龄差", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "睁眼六零军区，弄错对象被亲哭了", "fullTitle": "睁眼六零军区，弄错对象被亲哭了", "link": "https://fanqienovel.com/page/7567657861308746814", "data": [22.83, 28.59], "trend": 5.76, "latest": 28.6, "wordNumber": 1086276, "desc": "睁眼六零，许穗在男人床上醒来，被狠狠折腾了一整夜，亲哭晕死过去，一夜揣上双胎\n她这才发现自己穿书了。\n穿成肤白貌美，身姿窈窕的漂亮恶毒小青梅，前往军区找男主结婚，却意外弄错对象爬错床，被迫嫁给了落魄的假少爷。\n婚后顾云舟出任务断了腿，原主转头卷钱打胎跑路，最后钱丢了，身子骨坏了，大动荡被人举报作风问题惨死。\n顾云舟不仅腿好了，还重返部队步步高升，成为有权有势军区大佬，成了军区炙手可热的存在，惹得多少人想攀上他这根高枝。\n许穗看着眼前斯文俊美的军官男人，摸着肚子里的崽：长得帅，有本事，能力强，也不是不行。\n这么好的潜力股，可不能便宜了别人。\n*\n顾云舟不喜欢许穗。\n然而，婚后自家媳妇漂亮又勾人。\n一夜就怀上他的种，还是龙凤胎。\n怀着双胎轻松考上粮站铁饭碗，转头又成为六十年代顶尖大学高级人才，发明这个，发明那个，办厂赚外汇，让大伙儿富起来，成为领导座上宾。\n两个娃随媳妇，是有名的天才儿童。\n老实婆家：瞧见没，软弱了大半辈子的老秦家终于迎来了主心骨。\n成了首长夫人的心机寡妇娘：瞧，我闺女上报纸了。\n某首长：这是咱闺女，咱闺女就是厉害。\n被许穗带富的军嫂们：谁敢说许厂长坏话，就撕谁的嘴！", "tags": ["年代", "现代言情", "穿书", "大佬", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [35.43, 37.93], "trend": 2.5, "latest": 37.9, "wordNumber": 798807, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一胎！又一胎！绝嗣大伯哥有后了", "fullTitle": "一胎！又一胎！绝嗣大伯哥有后了", "link": "https://fanqienovel.com/page/7576258459784465433", "data": [24.27, 25.67], "trend": 1.4, "latest": 25.7, "wordNumber": 1037831, "desc": "\n【穿书六零+神医系统+易孕vs绝嗣+美艳爬床女vs明面禁欲实际好色大佬】\n林幼薇穿书六零，书中林幼薇不肯离婚，丈夫为了给 ", "先婚后爱", "年龄差", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "睁眼六零军区，弄错对象被亲哭了", "fullTitle": "睁眼六零军区，弄错对象被亲哭了", "link": "https://fanqienovel.com/page/7567657861308746814", "data": [22.83, 28.59], "trend": 5.76, "latest": 28.6, "wordNumber": 1086276, "desc": "睁眼六零，许穗在男人床上醒来，被狠狠折腾了一整夜，亲哭晕死过去，一夜揣上双胎\n她这才发现自己穿书了。\n穿成肤白貌美，身姿窈窕的漂亮恶毒小青梅，前往军区找男主结婚，却意外弄错对象爬错床，被迫嫁给了落魄的假少爷。\n婚后顾云舟出任务断了腿，原主转头卷钱打胎跑路，最后钱丢了，身子骨坏了，大动荡被人举报作风问题惨死。\n顾云舟不仅腿好了，还重返部队步步高升，成为有权有势军区大佬，成了军区炙手可热的存在，惹得多少人想攀上他这根高枝。\n许穗看着眼前斯文俊美的军官男人，摸着肚子里的崽：长得帅，有本事，能力强，也不是不行。\n这么好的潜力股，可不能便宜了别人。\n*\n顾云舟不喜欢许穗。\n然而，婚后自家媳妇漂亮又勾人。\n一夜就怀上他的种，还是龙凤胎。\n怀着双胎轻松考上粮站铁饭碗，转头又成为六十年代顶尖大学高级人才，发明这个，发明那个，办厂赚外汇，让大伙儿富起来，成为领导座上宾。\n两个娃随媳妇，是有名的天才儿童。\n老实婆家：瞧见没，软弱了大半辈子的老秦家终于迎来了主心骨。\n成了首长夫人的心机寡妇娘：瞧，我闺女上报纸了。\n某首长：这是咱闺女，咱闺女就是厉害。\n被许穗带富的军嫂们：谁敢说许厂长坏话，就撕谁的嘴！", "tags": ["年代", "现代言情", "穿书", "大佬", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [35.43, 37.93], "trend": 2.5, "latest": 37.9, "wordNumber": 798807, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一胎！又一胎！绝嗣大伯哥有后了", "fullTitle": "一胎！又一胎！绝嗣大伯哥有后了", "link": "https://fanqienovel.com/page/7576258459784465433", "data": [24.27, 25.67], "trend": 1.4, "latest": 25.7, "wordNumber": 1037831, "desc": "\n【穿书六零+神医系统+易孕vs绝嗣+美艳爬床女vs明面禁欲实际好色大佬】\n林幼薇穿书六零，书中林幼薇不肯离婚，丈夫为了给 /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

      groups[score].forEach(t => {
        const tierClass = s>=5?'s8':s===4?'s7':s===3?'s6':s===2?'s5':'slo';
        const scoreClass = s>=5?'high':s>=3?'med':'low';

        const pctHtml = `<span style="font-size:11px;color:var(--text3);margin-left:4px">${gPct>=0?'+':''}${gPct}%</span>`;
        const gHtml = agHtml + pctHtml;

          else if(r.includes('稳定'))cls='tag-yellow';
          else if(r.includes('系数低'))cls='tag-green';
          else if(r.includes('系数中'))cls='tag-yellow';

        grid.innerHTML += `<div class="rec-card ${tierClass}">

        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }

      }

    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',

      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);

          tbody.appendChild(dr);

            const row = document.getElementById(rid);

          tr.addEventListener('click', toggle);

      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);

          type: 'line',
          data: { labels: D.days, datasets: allBooks },
          options: {
            responsive: true, maintainAspectRatio: false,

            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },

              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },

        if (legEl) attachSoloLegend(legEl, chart, allBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];

    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
