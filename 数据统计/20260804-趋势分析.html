<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 7月29日–8月4日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

圆", "情有独钟", "婚恋"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "先婚后爱：大小姐被糙汉狠狠宠爱", "fullTitle": "先婚后爱：大小姐被糙汉狠狠宠爱", "link": "https://fanqienovel.com/page/7646781632002657342", "data": [5.52, 5.85, 6.08, 6.14, 6.14, 6.32, 6.28], "trend": 0.77, "latest": 6.3, "wordNumber": 171632, "creationStatus": 1, "desc": "【先婚后爱+恶女作精+狼兔文学+糙汉+疯批强制】\n一觉醒来胡若桃穿成昨晚看的年代文里对照组娇气恶毒女二。\n原书男女主是根正苗红的贫下中农，青梅竹马，因为原女主觉醒了治疗系统，帮助男主治好眼疾后，两人便在一起了，男主考上大学毕业后直接当了官，一路高升。\n相反，胡若桃和她的未来老公在特殊时期开始后就成了人人喊打的对象，过得好不凄惨。\n胡若桃当即立断收拾包袱去了乡下，她要先一步嫁给大佬，争取能在特殊时期过得安稳。\n——\n穹野因意外娶了个娇滴滴的大小姐，大小姐不仅要饮琼浆，食珍味，夜枕玉枕，身盖锦罗，而且不爽了就打他，天天把他当奴仆使，当狗喂，当马骑。\n村里人都说他命好，穹野只冷笑。\n后来———\n深夜。\n“穹野，我要现在！立刻！上山去捉兔子！”\n男人声音淡淡：“别胡闹。”\n大小姐气鼓鼓一翻身：“我不跟你玩了，我要去找舟舟！”\n男人伸手将人捞过来，捏住她的小脸，眼睛发红声音发狠：“我的乖宝，你说…你想找谁？”\n再后来——\n“听说没，穹野他媳妇跑了。\"\n“就说这小子没好的福气，守不住，他人呢？”\n“疯魔了，满地找媳妇呢。”\n注：大小姐是真的作。", "tags": ["年代", "现代言情", "乡村", "穿越", "先婚后爱", "作精"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [5.97, 5.97, 6.21, 6.42, 6.42, 6.52, 6.66], "trend": 0.69, "latest": 6.7, "wordNumber": 285865, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [6.92, 6.92, 7.21, 7.38, 7.41, 7.4, 7.49], "trend": 0.57, "latest": 7.5, "wordNumber": 266634, "creationStatus": 1, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [7.41, 7.57, 7.82, 7.87, 7.87, 7.77, 7.6], "trend": 0.19, "latest": 7.6, "wordNumber": 299314, "creationStatus": 1, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零，拒绝换亲被疯批糙汉强宠", "fullTitle": "七零，拒绝换亲被疯批糙汉强宠", "link": "https://fanqienovel.com/page/7647848427442670617", "data": [7.49, 7.92, 8.01, 8.08, 8.08, 8.26, 7.62], "trend": 0.13, "latest": 7.6, "wordNumber": 182229, "creationStatus": 1, "desc": "【注意，1V2，女主冷静清醒，疯批跟糙汉是两个人，养娃，家长里短，乡村发家文，靠双手过日子，不是爽文，有兴趣的来看看】\n慢节奏农村生活\n\n总有小说里换嫁的，没人问问被换的男人愿不愿意。\n沈晚棠穿越到七零成了换嫁新娘里的作精女配。\n她还没闹呢。\n被换了新娘的男人不乐意了，\n雷霆手段后，原女主被迫嫁给了男主弟弟。\n两个男人对于谁归媳妇，展开看一场默契的较量", "tags": ["年代", "现代言情", "乡村", "宠妻", "穿越", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "保姆我在富贵窝里看冷暖", "fullTitle": "保姆我在富贵窝里看冷暖", "link": "https://fanqienovel.com/page/7646938862643579928", "data": [5.66, 7.73, 8.09, 9.97, 13.19, 13.12, 13.05], "trend": 7.39, "latest": 13.0, "wordNumber": 283726, "creationStatus": 1, "desc": "Hello，书友们好～我是王拉弟，一个爱记录、爱唠嗑的保姆。\n\n“不算计，能在别墅里挣上钱吗？”——可我这算计啊，都在心里，厚道嘛，得摆在脸上。\n\n我骑着那辆破二手电驴，进过500平的大铁门。见过高贵女主人背地里的眼泪，偷听过美丽太太心里的肮脏；这一家表面光鲜，那一家内心宽容。种种不同，我都见过……\n\n可我也得低头——低头看着丈夫那条伤腿，低头数着儿子的学费，还得低头闻一楼飘上来的那股子馊臭味。\n\n大强子总劝我：“嘴牢，装傻，把钱挣了。”\n\n可当我推开那扇门，才发现——这人间烟火太烫嘴，这世态炎凉太扎心，我又怎能真的视而不见？\n\n我这一辈子，在别人的屋檐下躲过雨，也在自家的车库里生过火。人说三十年河东，三十年河西，我看惯了高楼起，也看厌了宴席散。到头来才明白：那呛人的烟火味，才是活着的底气。\n\n——谨以此书，献给我中国普通的母亲，也致敬每一位用力活着的平凡人。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "触礁对岸", "fullTitle": "触礁对岸", "link": "https://fanqienovel.com/page/7542096272866413630", "data": [5.25, 5.25, 5.41, 6.54, 6.54, 8.11, 9.34], "trend": 4.09, "latest": 9.3, "wordNumber": 261580, "creationStatus": 1, "desc": "评分刚出，可能会涨哈哈\n姜柠是顶级学府本硕博八年制的医学生，学医，博士buff叠满\n巨大压力之下，她养成了一点无伤大雅但不好宣之于口的小爱好\n本来她还处于精神放飞但是行为保守的状态，直到她毕业那年，压力过大，她忍不住对一个认识了一年多的网友发起了邀请\n网友不仅长的好，身材也好\n两天两夜，姜柠吃饱喝足后删除拉黑，潇洒走人\n答辩那天，那位传说中导师死对头的答辩主席端坐主位，赫然是那个和她在酒店待了两天两夜的男人！\n而他还即将成为她的顶头上司，领导的领导\n\n一只伤痕累累但铁骨铮铮的小狐狸遇见了心软的神\n一个端方君子第一次谈恋爱就被骗身骗心为爱发疯的故事\n\n1v1双c，男女主都很纵yu。\nhappy ending \n本人不学医，所有的东西都是按自己的想法设定的，不实的地方千万不要当真啊\nPS：作者有一直在修文，完善前后逻辑，如果有宝宝看到内容有变化是正常的喔，爱每一个看文的宝宝", "tags": ["职场婚恋", "现代言情", "职场", "医生", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [4.76, 4.92, 5.53, 6.14, 6.14, 6.65, 6.73], "trend": 1.97, "latest": 6.7, "wordNumber": 222648, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension" 1768", "data": [3.55, 3.82, 3.85, 3.91, 3.91, 4.0, 3.98], "trend": 0.42, "latest": 4.0, "wordNumber": 274809, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "美人师尊翻车后，惨遭两次囚禁", "fullTitle": "美人师尊翻车后，惨遭两次囚禁", "link": "https://fanqienovel.com/page/7654038704800926744", "data": [5.59, 5.73, 5.76, 5.67, 5.67, 6.07, 5.86], "trend": 0.27, "latest": 5.9, "wordNumber": 202041, "creationStatus": 1, "desc": "评分刚出，后面会涨～【修仙师徒+锁链警告+强制爱+1v3+男全洁】\n江棠以神尊和妖尊的身份收了两个徒弟。\n一个是妖族少尊主，拥有九幽玄蛇血脉，肉身强悍，能越境战斗。\n一个是仙族神君，天生剑骨，以杀问道，以战破境。\n他们哪哪都好，就是有个缺点，占有欲太强，都想做她唯一的徒弟。\n江棠一直藏得很好，他们互相不知道对方的存在，互相以为是她的唯一。\n不料因为一个香囊，她翻车了，而且恰巧还失了修为。\n他们变得陌生，变得肆无忌惮。\n相貌妖异的少尊主将她囚于氤氲的温泉池中，强逼她陪他照着书籍练习。\n“尊师重道还有另一层意思，师尊想听听吗？”\n光风霁月的神君将她囚于方寸的马车内，强逼她直视颠簸无退路的困境。\n“师尊，你是逃不掉的。”", "tags": ["玄幻言情", "穿越", "腹黑", "今穿古", "大佬", "剑修"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生另投师门成团宠，你们气什么", "fullTitle": "重生另投师门成团宠，你们气什么", "link": "https://fanqienovel.com/page/7637353004902911038", "data": [3.53, 3.53, 3.68, 3.74, 3.74, 3.76, 3.75], "trend": 0.22, "latest": 3.7, "wordNumber": 290873, "creationStatus": 1, "desc": "前世，乔月被妹妹觊觎她的极品单灵根，妹妹自导自演陷害她，害她被师父挖了灵根，沦为魔修，最后还被妹妹害死，被师兄抽了灵魂拘在妹妹的百鬼帆，折磨百年。\n　　被人从百鬼幡救后，她竟回到被挖灵根那一日！\n　　灵根已经被挖，她第一时间激发了隐灵根，重生长出来的居然是万年难得的全系完美灵根！\n　　师门害她，不仁不义，她转头拜前世恩人为师，成为残峰最小师妹。\n　　以为只是逃离被害的被迫选择，却不想成了残峰的团宠。\n　　大师兄送她花不完的灵石和法器，二师兄送她用不完的阵盘，三师兄送她嗑不完的丹药，四师兄送她守护傀儡。\n　　残峰师兄弟以为新来的小师妹是小可怜，却发现小师妹强得可怕。\n　　极品丹药从来没有人练出来过？小师妹能练！\n　　净化师只能净化妖兽肉？小师妹她还会净化魔气、鬼气！\n　　种植师只能种普通灵植？小师妹可以种仙植！\n　　最最厉害的是，万年没有人会的画符，小师妹她也手到擒来！\n　　那个谁谁谁，我们小师妹这么优秀，你们气什么？\n　　后悔？晚了！", "tags": ["玄幻言情", "幻想言情", "重生", "穿越", "团宠", "前世今生"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [5.27, 5.27, 5.34, 5.47, 5.52, 5.53, 5.33], "trend": 0.06, "latest": 5.3, "wordNumber": 200297, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠抽卡系统装高手", "fullTitle": "我靠抽卡系统装高手", "link": "https://fanqienovel.com/page/7654641611606854718", "data": [3.9, 3.9, 3.97, 4.1, 4.1, 4.23, 3.91], "trend": 0.01, "latest": 3.9, "wordNumber": 295587, "creationStatus": 1, "desc": "仙门大比，我随手从怀里掏出一把古琴\n全场寂静。\n大师兄颤声：“那是……失踪百年的凤栖琴？”\n我波澜不惊，又从头发上随手取下一根发簪。\n大师姐尖叫:“那是神器青芜簪！”\n后来全修仙界都在传，林执月有一整个随身洞府，藏着无数上古灵器乃至神器。\n只有林执月知道，她这身时装是系统送的。\n今天想穿“烟落叠翠”，明天就穿“流火绯星”，至于后天——\n死系统突然弹窗：【限时卡池“九天玄女”开启，抽齐整套可解锁飞行特效，机不可失！】\n我看着卡池里48个部件以及需要氪金的面部妆容和头发陷入了沉思。\n评分刚出，会涨的，小宝们🥹", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "异世穿越", "魂穿"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [6.39, 7.09, 7.51, 8.21, 8.21, 8.59, 8.99], "trend": 2.6, "latest": 9.0, "wordNumber": 211708, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [5.06, 5.06, 5.41, 6.05, 6.05, 7.1, 7.51], "trend": 2.45, "latest": 7.5, "wordNumber": 140071, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [4.08, 4.54, 4.85, 4.97, 4.97, 5.24, 5.24], "trend": 1.16, "latest": 5.2, "wordNumber": 274090, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [4.53, 4.9, 5.16, 5.23, 5.23, 5.32, 5.37], "trend": 0.84, "latest": 5.4, "wordNumber": 277651, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [5.62, 5.77, 5.95, 6.09, 6.07, 6.21, 6.01], "trend": 0.38, "latest": 6.0, "wordNumber": 191210, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.73, 2.73, 2.79, 2.83, 2.88, 2.92, 2.97], "trend": 0.24, "latest": 3.0, "wordNumber": 236230, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.45, 2.58, 2.68, 2.71, 2.71, 2.68, 2.65], "trend": 0.2, "latest": 2.6, "wordNumber": 261738, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "周家独苗要科举", "fullTitle": "周家独苗要科举", "link": "https://fanqienovel.com/page/7649989071162330174", "data": [2.84, 2.82, 2.93, 2.92, 2.92, 2.86, 2.86], "trend": 0.02, "latest": 2.9, "wordNumber": 175239, "creationStatus": 1, "desc": "【胎穿-科举-家长里短-无金手指-cp不确定，写着看】\n周如寒熬夜加班猝死后竟然穿越了，穿成了老周家的独苗苗。\n因为出生时身子弱，又是独苗，爷奶爹娘都当眼珠子疼，周如寒看着自己瘦弱的小身板，这幅身子想要靠力气吃饭怕是不行了，既然这样，那就走科举吧！\n可看着老周家一文钱恨不得掰成两半花的样子，周如寒长长叹了口，想要读书还是得先搞钱，不然怕是学费都交不起，好在他现在才七岁，一切都来得及。\n听说要送他去读书，家里人都不同意，连村里的乡亲们都觉得周老头一家疯了，他们这些一辈子在地里刨食的泥腿子，哪里是读书的料？\n可随着喜报一次次传回村里，喜宴他们是吃了一顿又一顿，谁还敢说他不是读书的料？", "tags": ["种田", "古代言情", "乡村", "穿越", "科举", "胎穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "年代", "score": 5, "reasons": ["7日增长+23.4万", "竞争系数低(3.5)"], "total19": 233.1, "growth": 11.1, "abs_growth": 23.4, "coeff": 3.5, "count10w": 3, "mean": 7.8, "mid19": 6.4, "ndays": 7}, {"cat": "快穿", "score": 5, "reasons": ["7日增长+14.7万", "竞争系数低(3.4)"], "total19": 283.9, "growth": 5.4, "a 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰腴媳妇不作了，糙汉打脸真香了", "fullTitle": "丰腴媳妇不作了，糙汉打脸真香了", "link": "https://fanqienovel.com/page/7648274238557654041", "data": [19.54, 20.91, 21.3], "trend": 1.77, "latest": 21.3, "wordNumber": 275755, "creationStatus": 1, "desc": "服装设计师姜蜜熬夜猝死，一睁眼穿成了年代文里的极品作精村妇。\n原主顶着十里八乡最绝色的脸，却长了个草包脑子。\n放着任劳任怨、能赚能打的糙汉老公不要，把家底掏空去倒贴小白脸知青，甚至一哭二闹三上吊逼着离婚。\n按原书剧情，她离了婚就被渣男卖进深山，被折磨得连个全尸都没留下！\n母胎单身的姜蜜连连摆手：这作死剧本谁爱要谁要！\n满肚子坏水的细狗知青？滚一边去！把骗她的钱连本带利全吐出来！\n嚼舌根看笑话的长舌妇？不好意思，我当场发疯教你做人！\n至于那个表面冷酷无情实则纯情护短的糙汉老公……当然是关起门来好好撩拨！\n\n全村人都搬好小马扎，等着看贺家那个作精婆娘被扫地出门，笃定她肯定要跟小白脸私奔。\n可谁知左等右等，只等来贺家顿顿飘出诱人的肉香，日子越过越红火！\n原本嫌她恶心的冷面糙汉，更是化身无底线“护妻狂魔”。\n有人眼红挑拨：“铮哥，你媳妇以前可是天天惦记野男人……”\n话没说完，贺铮一脚踹碎水缸，霸气护妻：“滚！老子愿意给媳妇当牛做马，谁敢说她一句不是，老子打断他的腿！”\n夜里。\n那个打起架来不要命的野男人，却将娇柔的小媳妇圈在怀里，双眼猩红，嗓音哑得要命：“媳妇，这可是你先招惹我的，说好了一辈子，少一天都不行……”", "tags": ["年代", "现代言情", "乡村", "穿越", "护短", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [5.18, 6.07, 6.42], "trend": 1.24, "latest": 6.4, "wordNumber": 255220, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [5.27, 6.0, 6.49], "trend": 1.23, "latest": 6.5, "wordNumber": 175523, "creationStatus": 1, "desc": "（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成对照组女配我把男女主玩疯了", "fullTitle": "穿成对照组女配我把男女主玩疯了", "link": "https://fanqienovel.com/page/7635566031313849406", "data": [7.47, 8.18, 8.42], "trend": 0.95, "latest": 8.4, "wordNumber": 277402, "creationStatus": 1, "desc": "顾昭昭穿成一本对照组小说的妯娌女配，最恶心的是她还获得一个女主助攻暴击系统。\n　　对照组还不够，还要她为女主服务是吧。\n　　既然这样玩，那就别怪她了。\n　　好孕多子？一胎十宝不用谢。\n　　心地善良，随手一救就是贵人？一个贵人哪够，百倍暴击，一下晕倒一百个在她前面，吓不死她！\n　　男配都爱她，二三四个男配哪里够，直接来个千倍暴击，男主头上青青草原。\n……\n只是这个她随便将就一下的男人是怎么一回事，怎么就黏上甩不掉了。\n谢彦平好不容易娶了个妻子，老婆没心没肺就算了，还总想把他甩掉，谢彦平表示，是他的，就永远是他的，想跑，打断腿哦~~~", "tags": ["年代", "现代言情", "系统", "穿越", "魂穿", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替姐下乡？我搬空家底闪耀七零", "fullTitle": "替姐下乡？我搬空家底闪耀七零", "link": "https://fanqienovel.com/page/7655596159691394072", "data": [5.56, 6.18, 6.43], "trend": 0.87, "latest": 6.4, "wordNumber": 261789, "creationStatus": 1, "desc": "宁晚秋重生了，一睁眼，偏心父母正逼她替白莲花姐姐去苦寒的北大荒下乡。\n前世她隐忍退让，却落得个惨死异乡的下场，而姐姐和渣男未婚夫却踩着她的血肉恩爱一生。\n重活一世，宁晚秋冷笑：这垫脚石，谁爱当谁当！\n下乡名额是吧？她反手设局，亲手送白莲花姐姐嫁给胡同里暴戾的二流子！\n逼她净身出户？她觉醒双层现代百货与医药空间，连夜将偏心父母和渣男家的存折、黄金、大米白面搬得连渣都不剩！\n拍拍屁股，她带着百亿物资和神医传承，美滋滋地奔赴北大荒。\n本以为要在林海雪原里猫冬致富，谁知一不小心，救了前未婚夫那位权势滔天、冷硬如铁的军区大佬大哥——陆闻野。\n那个平日里生人勿近的冷面阎王，却在风雪夜里将她死死抵在炕沿上，声音暗哑：“晚秋，跟了我，命都给你。”", "tags": ["年代", "现代言情", "乡村", "重生", "空间", "大佬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [5.74, 6.04, 6.37], "trend": 0.63, "latest": 6.4, "wordNumber": 173087, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿50年代，我怎么又擦边上岸", "fullTitle": "胎穿50年代，我怎么又擦边上岸", "link": "https://fanqienovel.com/page/7651321133513313305", "data": [5.57, 6.17, 6.18], "trend": 0.6, "latest": 6.2, "wordNumber": 259729, "creationStatus": 1, "desc": "刚出分!会涨!\n程雅上辈子加班猝死，一睁眼胎穿五十年代。\n她没有改变世界的能力，只是一个比较幸运的普通小孩，普普通通的成绩，比上不足，比下有余，大方耐看的长相，但按她妈的说法，她奸懒馋滑，偏偏吃饭最积极。\n可是她有个特异磁场——逢考必擦边，堪称当代女版孙山。小升初时，她妈看了三分钟榜单，愣是在最后一个犄角旮旯看到了她的名字。1965年中考，历史再一次重演，她又一次擦边考上中专。录取通知书到手第二天，广播响了：全国取消高考。全家发出了尖锐的爆鸣声，她妈蹲在院子里又哭又笑。\n好不容易中专毕业了，国家包分配。她满怀期待本以为能进县机械厂端铁饭碗，结果上个厕所的功夫转角听说名额被厂领导的儿子占了。程雅心一横，让家里买了点特产，茶叶里头塞了点人情世故，去找负责的老师哭。老师看她哭得可怜又有眼力劲儿，透露了一个消息：粮站最近也有一个指标，本来也是那个厂领导儿子要去的，但人家临时改了主意不去了。程雅连夜递了材料，最后一名擦边进了粮站。\n1969年，她十九岁，年纪轻轻风华正茂。铁饭碗也有了，家里又开始催婚。\n行吧，但她相了一圈亲发现，好嘛，她成资源了。果断微笑拒绝，结果转角遇到貌美落泪小狗…", "tags": ["年代", "现代言情", "穿越", "胎穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [6.42, 6.52, 6.66], "trend": 0.24, "latest": 6.7, "wordNumber": 285865, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世混子苟在东北", "fullTitle": "末世混子苟在东北", "link": "https://fanqienovel.com/page/7651616019772886040", "data": [8.71, 9.01, 8.92], "trend": 0.21, "latest": 8.9, "wordNumber": 226660, "creationStatus": 0, "desc": "林晚宁，一个末世里七个不服八个不愤的混子！与大佬温柏青和丧尸皇同归于尽后，以为就此一了百了！\n谁曾想一睁眼魂穿了，被迫发誓，才得了个干瘪的身体，一个倔的要命的爷爷！\n从此她走上了和老爷子斗志斗勇，和末世大佬重遇，相爱相杀的道路……", "tags": ["年代", "现代言情", "穿越", "空间", "相爱相杀", "大佬"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "先婚后爱：大小姐被糙汉狠狠宠爱", "fullTitle": "先婚后爱：大小姐被糙汉狠狠宠爱", "link": "https://fanqienovel.com/page/7646781632002657342", "data": [6.14, 6.32, 6.28], "trend": 0.14, "latest": 6.3, "wordNumber": 171632, "creationStatus": 1, "desc": "【先婚后爱+恶女作精+狼兔文学+糙汉+疯批强制】\n一觉醒来胡若桃穿成昨晚看的年代文里对照组娇气恶毒女二。\n原书男女主是根正苗红的贫下中农，青梅竹马，因为原女主觉醒了治疗系统，帮助男主治好眼疾后，两人便在一起了，男主考上大学毕业后直接当了官，一路高升。\n相反，胡若桃和她的未来老公在特殊时期开始后就成了人人喊打的对象，过得好不凄惨。\n胡若桃当即立断收拾包袱去了乡下，她要先一步嫁给大佬，争取能在特殊时期过得安稳。\n——\n穹野因意外娶了个娇滴滴的大小姐，大小姐不仅要饮琼浆，食珍味，夜枕玉枕，身盖锦罗，而且不爽了就打他，天天把他当奴仆使，当狗喂，当马骑。\n村里人都说他命好，穹野只冷笑。\n后来———\n深夜。\n“穹野，我要现在！立刻！上山去捉兔子！”\n男人声音淡淡：“别胡闹。”\n大小姐气鼓鼓一翻身：“我不跟你玩了，我要去找舟舟！”\n男人伸手将人捞过来，捏住她的小脸，眼睛发红声音发狠：“我的乖宝，你说…你想找谁？”\n再后来——\n“听说没，穹野他媳妇跑了。\"\n“就说这小子没好的福气，守不住，他人呢？”\n“疯魔了，满地找媳妇呢。”\n注：大小姐是真的作。", "tags": ["年代", "现代言情", "乡村", "穿越", "先婚后爱", "作精"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零恶妻一胎四宝科研大佬跪地哄", "fullTitle": "七零恶妻一胎四宝科研大佬跪地哄", "link": "https://fanqienovel.com/page/7641514479775124504", "data": [7.68, 7.8, 7.8], "trend": 0.12, "latest": 7.8, "wordNumber": 293763, "creationStatus": 1, "desc": "[年代+甜宠+生理性喜欢]\n一朝穿书，苏绾绾成了下放科研男主顾时砚的恶毒原配:骗婚、作妖、卖小姑子，下场是被马蜂蛰死在深山。\n苏绾绾：这破剧本谁爱走谁走。\n她上山挖参，进城经商，日子过得风生水起，顺带发现高冷丈夫看她的眼神越来越不对劲。\n直到骗婚真相败露，苏绾绾连夜揣着四个崽跑路，却被男人一把箍进怀里。\n顾时砚掐着她的腰，气息灼热：“骗了我的身，偷了我的心，现在还想拐走我的种？”\n苏绾绾心虚：“你不恨我？”\n顾时砚低头咬住她的唇:“恨，恨你半夜偷亲我，恨你怀了孕还敢跑，更恨你把我这颗心搅得稀巴烂。”\n他投降般抵着她的额头：“是我先沦陷了，行不行？”\n——\n多年后记者专访：“顾工，听说您和夫人的婚姻始于一场骗局？”\n顾时砚对着镜头浅笑，语气宠溺：“她爱我，才骗我。”\n全网炸了：原来这位国士无双的科研大佬，竟是骨灰级恋爱脑！\n苏绾绾磕着瓜子总结：高冷男人的恋爱脑，一旦上头，终生不愈。", "tags": ["年代", "现代言情", "乡村", "甜宠", "穿书", "大佬"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰满作精美人：诱哄硬汉生崽续命", "fullTitle": "丰满作精美人：诱哄硬汉生崽续命", "link": "https://fanqienovel.com/page/7655235611619494937", "data": [7.01, 7.19, 7.12], "trend": 0.11, "latest": 7.1, "wordNumber": 182972, "creationStatus": 1, "desc": "（年代丰腴坏美人+面凶糙汉+养崽+生理性喜欢）\n秦含香生的美貌，但实在恶劣，她家道中落，要过好日子，结了婚也不安分，被渣男骗的人财两失。\n检测到宿主的恶毒虚荣爆表了！寿命只剩0,01天，但如果宿主愿意绑定生子系统，攻略男主，就可以返现生命值哦。】\n秦含香好奇的问：“男主，谁啊？”\n【被你卷了家产抛弃的未来大佬霍征啊。】\n嘶…她那个整天凶巴巴的老公？秦含香可是把人得罪死了的。\n她还记得她到处造谣是霍征生不出来，绝嗣！\n“他？他不行，他生不出孩子。”\n【嘿嘿，现在不是有我这个生子系统了嘛，保准宿主一夜揣崽！】\n　……\n霍征出完车刚回来，就看见穿着清透薄裙子的美人娇滴滴的扑到他怀里，满手的软玉生香。\n“老公，你怎么才回来啊，我都等不及了呢~”\n霍征低头看她，漆黑眼眸又沉又怒，“你不是跟人跑了吗？”\n秦含香踮起脚尖亲亲他的唇：“看了别人，还是我老公好，老公，我给你生儿砸好不好？”\n女人的嘴，骗人的鬼，但霍征是真喜欢她这坏透了的样子，管她耍什么花招，他打横抱起人进屋。\n一年后…霍征又幸福又满脸苦相的看着三个大胖小子，“媳妇儿我们绝对不能再生了！我去结扎。”", "tags": ["年代", "现代言情", "作精", "系统", "破镜重圆", "情有独钟", "婚恋"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [7.41, 7.4, 7.49], "trend": 0.09, "latest": 7.5, "wordNumber": 266634, "creationStatus": 1, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "婆婆妯娌和小姑", "fullTitle": "婆婆妯娌和小姑", "link": "https://fanqienovel.com/page/7617351350073953305", "data": [6.18, 6.26, 6.27], "trend": 0.09, "latest": 6.3, "wordNumber": 289413, "creationStatus": 1, "desc": "父兄奇丑，她却貌美如花，扭曲的母爱差点让她成为换亲的牺牲品。\n       他救她出深井，给了她一个温暖的家，丈夫、孩子、公婆、妯娌、大姑姐、小姑子……\n      生活的序幕就此拉开，形形色色的人物纷纷登场……酸甜苦辣、嬉笑怒骂、活色生香……", "tags": ["年代", "现代言情", "乡村", "家长里短"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [6.23, 9.88, 11.79], "trend": 5.56, "latest": 11.8, "wordNumber": 186934, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [3.76, 4.63, 5.06], "trend": 1.3, "latest": 5.1, "wordNumber": 125741, "creationStatus": 1, "desc": "【OOC预警+亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n 夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "幻想言情", "反派", "穿书", "古代言情", "团宠"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法：被迫组队后高冷队长沦陷了", "fullTitle": "魔法：被迫组队后高冷队长沦陷了", "link": "https://fanqienovel.com/page/7649235070481353753", "data": [7.95, 8.31, 8.33], "trend": 0.38, "latest": 8.3, "wordNumber": 244294, "creationStatus": 1, "desc": "【高智商傲娇巫族公主VS高冷禁欲灵族公爵】\n魔法+言情+团队救世\n朗瓦西星球有三类人：会魔法的灵者、作战强的曜士、通巫术的巫主\n三千年前，灵、曜两族诞下五灵守护者，对灭世的不死女巫艾拉进行世代封印\n三千年后，新一届守护者诞生，五位圣灵者肩负救世使命。\n巫族公主蒂泠，出了名的任性，翘课、炸学校、学禁术\n然而，一则消息震惊世界\n蒂泠成了三千年来第一位来自巫族的圣灵者——智之灵\n让“恶霸”拯救世界？\n众人：谁说看不见星球的未来？这不是一眼就看到头了\n灵息学院，\n所有人都想进的三族最强学府，一心摆烂的蒂泠被强制保送\n灵息优等生缪辞，是灵族最年轻的公爵，也是众望所归的五灵守护者队长玄之灵\n蒂泠来前：高冷，沉稳，尽在掌握\n蒂泠来后：头疼，善后，怀疑人生\n算了，赶紧封印艾拉，大家好聚好散\n…\n一次意外，蒂泠灵印消失，决定独自离开。\n黑暗的房间内，她被吻的喘不过气，用力推开他，“队长，我不是圣灵者了，好聚好散吧。”\n男人眼尾浸红，额头贴着她的耳朵，薄唇轻吻她的脸颊，“你觉得呢？我的公主殿下。”\n撩也撩了，摸也摸了，要负责了，人就跑了\n女孩理亏的偏过头，缪辞都气笑了，指尖扣住她的下颌，迫使她面对自己，学着她曾经恶劣的语气\n“不接话？那就接吻。”", "tags": ["玄幻言情", "校园", "幻想言情", "星际", "冰山", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被迫退学的我绑定了打卡成仙系统", "fullTitle": "被迫退学的我绑定了打卡成仙系统", "link": "https://fanqienovel.com/page/7638640284493958168", "data": [3.79, 4.02, 4.09], "trend": 0.3, "latest": 4.1, "wordNumber": 277464, "creationStatus": 0, "desc": "【现代修仙+升级流+女主团宠+校园+系统+空间+无CP】\n龙国灵气复苏，所有人都以修仙者为荣。\n但林羡偏偏穿越到了祖上18代都是平民的大家庭中，成为那个虽美但渣，且自私自利、好吃懒做的小姑子。\n此刻的林羡，不仅被退学，还面对着家破人亡的风险。\n好消息，她绑定了一个系统。\n坏消息，这个系统好像是个半成品。\n没办法，林羡只好撸起袖子加油干！\n第一步，先制造一个储物袋。\n第二步，成为全龙国最大的储物袋供应商。\n她带着全家人一起发家致富。\n只是为何？身边会有那么多奇奇怪怪的人黏上来啊啊啊！\n\n———场景———\n【叮！监测到宿主到达冷湖图书馆，是否打卡？】\n林羡？？？\n“打卡！”\n【恭喜宿主获得图书馆自习室使用时长240小时！（注：在自习室学习时，外界时间静止！）】\n【恭喜宿主获得《不灭灵体》天阶炼体功法……练成后肉身不灭，断肢可重生；肉身湮灭，神魂不灭。】\n\n———\n排雷：\n1.前期家庭日常多，无脑爽文，请不要带脑子看\n2.10万字后才开始校园篇，校园有无脑打脸情节\n3.不是那种传统的无cp，有男角色追求女主、对女主一见钟情等的情节，不喜勿点，千万别点\n4.男性角色可能偏多（也有女性厉害的角色），男女角色比例大概64开，甚至73开\n", "tags": ["玄幻言情", "校园", "系统", "空间", "团宠", "无CP"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "万人迷在耽美世界生存法则", "fullTitle": "万人迷在耽美世界生存法则", "link": "https://fanqienovel.com/page/7632222540525489176", "data": [4.0, 4.21, 4.27], "trend": 0.27, "latest": 4.3, "wordNumber": 148926, "creationStatus": 1, "desc": "新书。谢春慈一觉醒来穿越到了一个奇怪的修仙界。\n这里不但阴阳失调，男男相恋大行其道，似乎暗地里还在酝酿着惊天秘密。\n而曾经眼高于顶不可一世的男人们，遇见谢春慈后，一个接一个都疯了。\n昔日师徒，离心。\n恩爱情侣，相残。\n亲密父子，反目。\n这些男人们挣来抢去闹个不停，恨不得互食血肉，到头来所求的其实不过是她的爱而已。\n谢春慈懵懵懂懂闯入这个扭曲的世界，却吝啬地不肯施舍一点真心。\n她要让这些伤害过她的人，永生永世困在苦海，不得往生！\n玛丽苏真万人迷但纯恨女主×各种各样单箭头的男人。\n真弯掰直，所有人都会爱上女主，包括且不限于男情侣/师徒/父子/好兄弟为了女主互相残杀。\n【世界背景为极端男尊女卑，女主无外挂，有微强制，黑泥！虐文，一点都不爽，全世界都有病，随时随地大小疯】\n初版简介：\n谢春慈莫名其妙穿进了一个修仙的耽美世界里。\n在这里，几乎所有的男人都喜欢男人。\n在男人为主导的世界，女人为男人们惊天动地的爱情摇旗呐喊感动流泪，却看不到自己卑贱如泥被男人狠狠踩在脚下。她们泯灭自我，沦为拼凑世界的装饰物。\n而谢春慈……她本只想和救命恩人一起平凡的度过此生，但这个可恶的世界不放过她，毁了她最爱的一切", "tags": ["玄幻言情", "穿越", "打脸", "今穿古"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙崽心声曝光后，六界都不好了！", "fullTitle": "龙崽心声曝光后，六界都不好了！", "link": "https://fanqienovel.com/page/7626321035767335961", "data": [8.49, 8.63, 8.71], "trend": 0.23, "latest": 8.7, "wordNumber": 234932, "creationStatus": 1, "desc": "【双洁1V1+全员读心+三界团宠+养崽撒糖+轻松救赎无虐】\n高考前夕，叶黎惨遭人间至恶！\n辛苦打工攒下的学费被表妹偷走，舅舅舅妈颠倒黑白，将他打伤后像丢垃圾一般赶出家门。\n无依无靠，遍体鳞伤的他，本以为人生就此落幕，却意外绑定天道救赎系统，重生成了一颗圆滚滚的至尊龙蛋！\n更炸裂的是，他的‘生母’，是六界闻风丧胆的妖族至尊夜无咎！\n别人出生被父母捧在手心，他刚出生，就被妖神亲爹拎在手里，扬言烤蛋，煮汤，直接丢掉！\n为了活命，叶黎只能装乖卖萌，破壳后化身软糯小奶团，日日花式吹捧讨好傲娇亲爹。\n系统给他开辟了吃瓜功能，本想安稳躺平吃瓜做顶级妖二代！皇二代！\n可系统惊天大瓜直接震懵他，他还有一个爹！\n另一个爹是清冷出尘的仙界仙尊楚云鉴！\n而楚云鉴，是夜无咎不共戴天的死对头！\n一边是暴躁别扭，嘴硬心软的妖神父神，\n一边是清冷温柔，禁欲圣洁的仙尊父尊。\n缺爱半生，执念有家的叶黎，化身三界最强月老，疯狂花式撮合双亲，在线维和！\n不曾想，天道选中他，本就是宿命安排。\n他对“家”的纯粹执念，竟是化解仙妖魔万年恩怨的唯一解药！\n从此，曾经任人欺凌的小可怜，逆袭成仙妖魔团宠！\n双大佬争锋护崽，全员读心吃瓜围观宠崽！\n崽有CP！后期主要剧情线！\n", "tags": ["玄幻言情", "重生", "团宠", "双洁", "1v1", "养崽"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "成为美强惨龙崽的早逝娘亲", "fullTitle": "成为美强惨龙崽的早逝娘亲", "link": "https://fanqienovel.com/page/7645232910252919870", "data": [5.94, 6.54, 6.14], "trend": 0.2, "latest": 6.1, "wordNumber": 145619, "creationStatus": 1, "desc": "【温柔老实妹宝×冷漠偏执龙龙】\n【双洁+1V1+人外+男强女弱+体型差+一见钟情+温馨治愈】\n（简介是儿子殷珩视角）\n殷珩重活一世，回到一千年前，只有一个任务：阻止爹娘相爱。\n他娘是世界上最好的人，他爹是条脑子有病的龙。\n在上一世，娘亲嫁给他爹没几年就去世了，他不想让娘亲重蹈覆辙，即便自己也会消失。\n好消息是：他重生得够早，两人根本不认识。\n坏消息是：不管他怎么阻止，那龙还是来了，而且对娘亲一见钟情。\n不仅如此，追人的方式还笨得要命：\n今天送灵石，明天往她枕头底下塞银票，后天面无表情地站在她家门口，开口就是：“我没家了，能收留我吗？”。\n云绵一脸茫然：“这位公子，我并不知道您是怎么了。”\n殷珩坐在屋顶上看着这一切，心情愉悦，甚至还想鼓掌。\n追姑娘追成这样，也是种本事。\n殷珩觉得这开局稳了，就他爹这个追法，不把娘吓跑才怪。\n可云绵偏偏觉得殷寂“挺有意思的”。\n某天，她拉着殷珩问：“阿珩，你了解隔壁那位殷公子吗？他这个人虽然奇怪，但好像…还挺不错的。”\n殷珩两眼一黑，苦口婆心地劝：“…不怎么样，他长得丑，心也黑，不是良配！”\n云绵羞赧：“你胡说，他长得不丑。”\n殷珩站在原地，仰头望天。\n他明明是回来拆散他们的。\n怎么变成助攻了？", "tags": ["玄幻言情", "独宠", "幻想言情", "宠妻", "团宠", "双洁", "HE"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "美人师尊翻车后，惨遭两次囚禁", "fullTitle": "美人师尊翻车后，惨遭两次囚禁", "link": "https://fanqienovel.com/page/7654038704800926744", "data": [5.67, 6.07, 5.86], "trend": 0.19, "latest": 5.9, "wordNumber": 202041, "creationStatus": 1, "desc": "评分刚出，后面会涨～【修仙师徒+锁链警告+强制爱+1v3+男全洁】\n江棠以神尊和妖尊的身份收了两个徒弟。\n一个是妖族少尊主，拥有九幽玄蛇血脉，肉身强悍，能越境战斗。\n一个是仙族神君，天生剑骨，以杀问道，以战破境。\n他们哪哪都好，就是有个缺点，占有欲太强，都想做她唯一的徒弟。\n江棠一直藏得很好，他们互相不知道对方的存在，互相以为是她的唯一。\n不料因为一个香囊，她翻车了，而且恰巧还失了修为。\n他们变得陌生，变得肆无忌惮。\n相貌妖异的少尊主将她囚于氤氲的温泉池中，强逼她陪他照着书籍练习。\n“尊师重道还有另一层意思，师尊想听听吗？”\n光风霁月的神君将她囚于方寸的马车内，强逼她直视颠簸无退路的困境。\n“师尊，你是逃不掉的。”", "tags": ["玄幻言情", "穿越", "腹黑", "今穿古", "大佬", "剑修"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [3.1, 3.24, 3.28], "trend": 0.18, "latest": 3.3, "wordNumber": 276774, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "剑修", "古色古香"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [9.27, 9.45, 9.41], "trend": 0.14, "latest": 9.4, "wordNumber": 239817, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在秘境废墟捡的垃圾都是宝", "fullTitle": "我在秘境废墟捡的垃圾都是宝", "link": "https://fanqienovel.com/page/7623367574926920729", "data": [3.7, 3.84, 3.82], "trend": 0.12, "latest": 3.8, "wordNumber": 222371, "creationStatus": 1, "desc": "【异世大陆】【打怪升级】【捡垃圾】【诡异】【领地经营】【秘境捡宝】【群像】【美食】\n莫小西穿到诡怪纵横之地，这里的人类以诡虫蘑菇苔藓为食，以诡怪皮为衣。\n她觉醒万物修复魂术，不仅可以修复秘境，还可以修复从秘境内捡到的垃圾，于是，煞气横生的秘境废墟成为她的藏宝地，这里遍地都是仙器灵器残骸，还有高阶仙宝残骸，仙府残骸，关键是，仙府残骸内还有遗存的灵植园……\n莫小西修复这些残骸为己用，终于吃上大米白面跟水果蔬菜，带着弟弟过上人人羡慕的好日子......", "tags": ["玄幻言情", "幻想言情", "穿越", "美食", "群像", "魂穿"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [3.91, 4.0, 3.98], "trend": 0.07, "latest": 4.0, "wordNumber": 274809, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "休了四个兽夫后，我契约了六个", "fullTitle": "休了四个兽夫后，我契约了六个", "link": "https://fanqienovel.com/page/7557391657260289086", "data": [5.23, 5.41, 5.27], "trend": 0.05, "latest": 5.3, "wordNumber": 263349, "creationStatus": 1, "desc": "（穿越+大佬+兽魂+强制契约+升级流+1vN）\n林清蕴修炼千年的灵符师，穿到第一天，以为自己拿的是女强爽文剧本。\n直到她低头一看——无灵根，蜗牛兽魂，凡品垫底。\n四个契约兽夫嫌她废物，把她扔在贫民区铁皮房里自生自灭。\n亲妈把她扫地出门，亲妹设局陷害，路过的人都要啐一句“丢人”。\n林清蕴：“……这剧本不对吧？”\n还没等她反应过来，直接被驱逐青云城，四名兽夫更是要解除契约。\n怂是不可能怂的，解，必须解，留着你们这些白眼狼干嘛？\n所有人都等着她死在城外。却不知她体内藏着上古紫凤兽魂。\n当晚六道契约天光散落大陆\n冰霜巨龙的主人低笑：\"魂契?有意思。\"\n地下黑场的铁塔硬汉红着眼眶：\"有人要我了?\"\n最高监狱里，锁链寸断的少年抬起头，露出一双极深的凤眸。\n而轮椅上的男人，捻着一朵蓝楹花，笑得温润如玉：\"妻主?\"\n林清蕴：......我现在退契还来得及吗?男人，只是取悦她的工具罢了。", "tags": ["玄幻言情", "幻想言情", "穿越", "大佬", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生另投师门成团宠，你们气什么", "fullTitle": "重生另投师门成团宠，你们气什么", "link": "https://fanqienovel.com/page/7637353004902911038", "data": [3.74, 3.76, 3.75], "trend": 0.0, "latest": 3.7, "wordNumber": 290873, "creationStatus": 1, "desc": "前世，乔月被妹妹觊觎她的极品单灵根，妹妹自导自演陷害她，害她被师父挖了灵根，沦为魔修，最后还被妹妹害死，被师兄抽了灵魂拘在妹妹的百鬼帆，折磨百年。\n　　被人从百鬼幡救后，她竟回到被挖灵根那一日！\n　　灵根已经被挖，她第一时间激发了隐灵根，重生长出来的居然是万年难得的全系完美灵根！\n　　师门害她，不仁不义，她转头拜前世恩人为师，成为残峰最小师妹。\n　　以为只是逃离被害的被迫选择，却不想成了残峰的团宠。\n　　大师兄送她花不完的灵石和法器，二师兄送她用不完的阵盘，三师兄送她嗑不完的丹药，四师兄送她守护傀儡。\n　　残峰师兄弟以为新来的小师妹是小可怜，却发现小师妹强得可怕。\n　　极品丹药从来没有人练出来过？小师妹能练！\n　　净化师只能净化妖兽肉？小师妹她还会净化魔气、鬼气！\n　　种植师只能种普通灵植？小师妹可以种仙植！\n　　最最厉害的是，万年没有人会的画符，小师妹她也手到擒来！\n　　那个谁谁谁，我们小师妹这么优秀，你们气什么？\n　　后悔？晚了！", "tags": ["玄幻言情", "幻想言情", "重生", "穿越", "团宠", "前世今生"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "悬疑脑洞": [{"label": "没血条？你管这绝美NPC叫病弱", "fullTitle": "没血条？你管这绝美NPC叫病弱", "link": "https://fanqienovel.com/page/7633433896964590617", "data": [29.64, 31.96, 32.11], "trend": 2.47, "latest": 32.1, "wordNumber": 244653, "creationStatus": 1, "desc": "说好的恐怖副本，玩家们怎么都把我一个NPC当成靠山？\n穿越诡异无限流世界，别人都是艰难求生，木知兮却连个肉身都没有。\n好在前世的角色创作软件激活，木知兮能附身于自己亲手捏的角色，获得其能力与背景。\n于是——身份不够神秘怎么办？自己编！\n势力不够庞大怎么办？自己吹！吹牛谁不会呀！\n更有趣的是，木知兮发现她能随意修改自己的NPC面板！\n作为重度颜控，她第一时间就是把头顶巨丑无比的血条给抠掉了（严肃）\n万万没想到，这个纯粹出于“颜控”的举动，直接引爆了整个无限流圈子！\n玩家A：“没血条？你管这绝色NPC叫病弱？她岂不是无法被杀死！”\n玩家B：“她的面板上写着至纯至善，是位仁慈神女，大家快去抱大腿！”\n为了苟命，木知兮附身神女，随手给自己的面板加了一行：【隐藏阵营：圣域教堂，古纪元势力】\n玩家疯了，争着给她刷好感、做任务，把她当成副本里的唯一生路。\n所有人都以为木知兮背后藏着一个传承万万年的古老神国，疯狂考据她的势力秘史，甚至为了她的马甲分化阵营。\n只有木知兮知道，从教堂到帝国，从神女到帝女，全是她随口扯的。\n全网玩家考据：“她是隐世势力神女，是隐藏主线！”\n木知兮微笑不语。\n不好意思，你们考据出的古老势力，都是我刚编的。", "tags": ["悬疑脑洞", "悬疑", "穿越", "灵异", "惊悚游戏", "规则怪谈"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "惊悚游戏降临后，我变成女巫了", "fullTitle": "惊悚游戏降临后，我变成女巫了", "link": "https://fanqienovel.com/page/7646318154984983614", "data": [11.09, 12.3, 12.97], "trend": 1.88, "latest": 13.0, "wordNumber": 262973, "creationStatus": 1, "desc": "【惊悚游戏+直播+微恐+轻松+群像爽文+装逼+无CP】\n评分刚出会涨的，求求五星好评，感谢(◦˙▽˙◦)\n女主超强，但是刚开始心态还是普通人心态，等她进副本就好。\n惊悚游戏降临，怕死的岑杳意外绑定学习系统，学习如何成为全宇宙最伟大的女巫。\n于是，别人在副本逃生，她在空间疯狂学魔法。\n本以为能单刷副本，却捡到了一群“破布娃娃”一样的神仙队友。\n于是，全网都知道，岑杳的队伍是惊悚游戏里最奇葩的存在。\n队长岑杳是眼神清澈的准大学生。\n队员更离谱：高冷的聋子、自闭的哑巴、自恋的瞎子、刻薄的腿残人士、没有触觉的迟钝路痴。\n副本Boss狂喜：全员残废和一个不足为惧的清澈大学生，这把稳了！\n结果开局就遭到了惨无人道的毒打。\n清澈大学生岑杳左手凤凰右手冰龙，追着BOSS哐哐砸；\n触觉失灵的祝灵犀，戴上面具请神诛邪；\n聋子黑客迟霜序，手敲代码重写规则；\n双腿残疾的裴听澜，海妖歌声操控万鬼；\n自闭哑巴顾砚迟，一拳干碎规则屏障；\n瞎子少爷谢昼行，大喊着黑夜由他主宰。\n聋、哑、瞎、残、无触感，却个个都是满级大佬！\n岑杳：很好，刚好带这群疯批制霸惊悚局！\n后来，只要这六个人出现，鬼怪连夜扛着火车跑", "tags": ["悬疑脑洞", "悬疑", "直播", "灵异", "惊悚游戏", "群像"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "什么变态，那是我老公", "fullTitle": "什么变态，那是我老公", "link": "https://fanqienovel.com/page/7615733068296358974", "data": [7.44, 7.77, 8.31], "trend": 0.87, "latest": 8.3, "wordNumber": 238862, "creationStatus": 0, "desc": "明想嫁给谢均，结婚两年，生活平淡且幸福。\n可这一天，她突然看到了出现的弹幕。\n【笑死，女配不会以为她会很幸福吧，嫁给了一个变态杀人狂魔】\n【都不知道自己怎么死的，还在那沾沾自喜】\n明想：胡说，我老公怎么可能是变态。\n她不信，觉得自己产生幻觉了。\n谢均从屠宰场回来，衣服上沾了不少血。\n【来了来了，女配今晚会被这个变态杀死分尸，我迫不及待了！】\n【终于能看到她的下场了，抢了女主的人生，该死！】\n明想看向朝自己温柔笑的丈夫，拿着把刀在切菜。\n她老公这么好，为了两人的小家，每天从早到晚去屠宰场杀猪，才不是什么变态。\n明想坚决不相信弹幕说的。\n当抛弃她的明家人找上门，对她颐指气使，骂她不孝，让她替养女去死时。\n谢均站在她面前，徒手捏死了嚣张气焰的一家人，化做血雾。\n弹幕空白几秒:\n【不是，你告诉我这是普通的鬼夫文？女主都被杀了，反派还是惊悚副本的boss，疯了，我真是疯了！】\n明想:？\n明想觉得自己精神更不正常了。\n她老公才没杀人，杀的是恶人，也不是变态。\n#女主眼中全是正常人，看不到诡异，甜文，1v1\n#什么，你说我老公是变态，胡说，他明明就是个普通屠宰场杀猪的", "tags": ["悬疑脑洞", "悬疑", "灵异", "惊悚游戏", "1v1", "规则怪谈"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：谁家要饭的这么嚣张！", "fullTitle": "盗墓：谁家要饭的这么嚣张！", "link": "https://fanqienovel.com/page/7660518060612144152", "data": [3.69, 3.94, 4.37], "trend": 0.68, "latest": 4.4, "wordNumber": 163237, "creationStatus": 1, "desc": "【癫文+无CP】\n张九被一个叫“乞讨成帝”的实习系统绑错了，\n本来是龙傲天走老朱的路线，结果给她送到了盗墓世界。\n还只能向古人乞讨才能获得系统奖励。\n张九表示：“谁说错嫁没真爱？你看隔壁王二赖！”\n现代没古人？\n地下不全都是吗？\n清朝出生的都算古人？\n那不巧了吗！\n百岁老人这里有的是。\n【不怎么走剧情，没有感情戏，与鬼吹灯有一点联动】\n提前避雷：1.女主带过去的那个智能机没上交国家，而是给了小花。作者给出的理由是，国家不一定看得上那个手机，但一定看得上穿越这件事。盗墓贼江湖气重，只要女主够强，没人问来历。\n2.系统就是个开盲盒的工具，没有吊炸天的功能\n3.女主身穿、成长形，不是一上来就很牛逼，开始很弱。", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "无CP", "同人"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小哥的女儿从地狱爬回来了", "fullTitle": "小哥的女儿从地狱爬回来了", "link": "https://fanqienovel.com/page/7656456911012776985", "data": [3.35, 3.78, 3.89], "trend": 0.54, "latest": 3.9, "wordNumber": 218221, "creationStatus": 1, "desc": "有记忆以来都是汪家的零号实验体，张苗在实验室被折磨了整整三十年。\n不打麻药的抽血、断骨、极限改造……\n她唯一的执念，就是活下去，找到那个被称为“神明”的父亲。\n重生后逃离汪家，坠入鲁王宫，她终于见到了那个男人——张起灵。\n昏迷前的一声“爸”惊呆了铁三角。\n然而，当女孩被带回吴山居，被发现浑身上下是新旧交叠的伤口。\n当黑瞎子带回一盒录像带，揭开汪家不打麻药抽骨换血的残忍真相……\n那一日，吴山居煞气冲天。\n人间神佛张起灵，彻底化身修罗！\n原本以为只是个重度PTSD的废物小可怜，谁知当汪家死士杀上门时……\n【叮！神级血脉提纯进化系统激活！】\n残血麒麟沸腾，娇弱的女孩化身疯批修罗，徒手撕裂死士防线！\n踩着汪家人的尸体，女孩转头冲小哥露出一个卑微又讨好的笑：\n“爸，我很有用的，不要丢掉我……”\n看着女儿卑微的讨好，张起灵的黑金古刀发出一阵悲鸣。\n这一刻，神明暴怒，不死不休！", "tags": ["悬疑脑洞", "悬疑", "系统", "重生", "灵异", "同人"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "从南部档案馆靠签到混成九门团宠", "fullTitle": "从南部档案馆靠签到混成九门团宠", "link": "https://fanqienovel.com/page/7654650438687411262", "data": [3.03, 3.34, 3.55], "trend": 0.52, "latest": 3.6, "wordNumber": 261323, "creationStatus": 1, "desc": "(评分刚出♥)\n【盗笔同人+南部档案+爆笑日常+签到系统+老九门+弥补遗憾】\n穿越盗笔宇宙，成了张家籍籍无名的小透明张幺幺。本以为要卷入长生阴谋，每天在古墓里和粽子玩命，结果当场绑定【奇葩每日签到系统】！\n不签到就扣寿命？行！但你这任务是不是离谱过头了？！\n【滴！今日任务：拔下张海盐的一根头发。奖励：满级缩骨功！】\n张海盐捂着头皮狂飙脏话：张幺幺你有病是不是？！\n【滴！今日任务：在九门大会上，抢走张大佛爷的茶杯并一饮而尽。奖励：麒麟血脉纯度+10%！】\n张启山捏断了手中的钢笔：……把这个疯丫头给我叉出长沙城！\n【滴！今日任务：给闷油瓶讲三个冷笑话，并让他笑出声。奖励：黑金古刀（绝版）！】\n张幺幺两眼一黑：系统你干脆直接抹杀我吧！！\n为了活命，张幺幺在作死的边缘反复横跳。\n结果一路从南部档案签到到了西泠印社，生生把惊悚悬疑剧本玩成了情景喜剧。当年那个到处惹是生非的搞笑女，不知不觉间，竟成了九门几代大佬拼了命也要护着的祖宗。\n无邪：“如果有我幺幺姑奶奶在，这墓里的粽子都得连夜搬家。”\n张幺幺欲哭无泪：“我真的没想当大佬，我只是想安安静静签个到啊喂！”", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：别急，一个一个来！", "fullTitle": "盗墓：别急，一个一个来！", "link": "https://fanqienovel.com/page/7654802667813735486", "data": [2.34, 2.53, 2.63], "trend": 0.29, "latest": 2.6, "wordNumber": 142479, "creationStatus": 1, "desc": "张宝珠的恋爱笔记。\n\n　　第一篇：失忆族长在工地打工养我\n\n　　张宝珠：路边的男人不能捡，会变得不幸！\n\n　　张起灵：捡我，我打工养你！\n\n　　第二篇：年下弟弟粘人又爱哭\n\n　　张宝珠：打饭手抖怎么办？\n\n　　吴邪：宝宝，辛苦了，我给你揉揉小手～\n\n　　第三篇：进错房间后，二爷夜夜宠\n\n　　张宝珠：我有男朋友，你别过来！\n\n　　吴二白：乖，和他分手。\n\n　　第四篇：当老板的快乐，谁懂？\n\n　　张宝珠：除了按摩，你还会什么？\n\n　　黑瞎子：瞎子我呀，会的可就多了～\n\n　　第五篇：被撞后，我把肇事司机认成了男朋友\n\n　　张宝珠：哥哥，你是我的男朋友吗？\n\n　　解雨臣：嗯。\n\n　　过渡篇六：小修罗场～\n\n　　第七篇：我知道她很可爱，但是表哥你为什么也知道？\n\n　　张宝珠：你怎么又回来了？\n\n　　解连环：你喜欢白天的我还是晚上的我？\n\n　　吴三省：白天的我厉害还是晚上的我厉害？\n\n　　第八篇：等我想一想", "tags": ["悬疑脑洞", "悬疑", "系统", "盗墓", "灵异", "同人"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.28, 3.42, 3.49], "trend": 0.2, "latest": 3.5, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：我的天，怎么又来任务了", "fullTitle": "盗笔：我的天，怎么又来任务了", "link": "https://fanqienovel.com/page/7652903119143062553", "data": [2.41, 2.54, 2.59], "trend": 0.18, "latest": 2.6, "wordNumber": 138434, "creationStatus": 1, "desc": "［盗笔同人，女强，系统，武力值max,黑瞎子妹妹，all向］\n排雷预警：微万人迷，女强，时间线混乱，all向，大部分基于影视剧，我自我感觉有些偏保姆，私设多\n［ooc预警，时间线混乱］\n天选打工人岳浠在结束无心世界的任务后本想就此退休，随橙想被卷入了时空乱流被卷入了盗笔世界还被一个任务系统绑定了从此踏上了完成盗笔任务之旅……\n苦命打工人每日任务belike：\n“请宿主完成任务——比张海楼还装”\n“？系统你疯了？我咋装？在嘴里装大炮吗？”\n“请宿主完成任务——将莫云高的头发掀到另一边”\n“？沙溢丝？你们是正经系统不？”\n“请宿主完成任务——在铁三角面前装逼三次”\n“？”\n亲哥和妹妹相认后：belike：我家白菜身边咋这么多🐷啊\n————\n“张海浠！我们不是说好一起回厦城吗？”\n“小浠，你要去哪里我们都陪你，别再把我和海楼留在厦城了。”\n“海浠，我学会剪纸人了，你要看看吗？”\n“姑姑，不是说好要一直陪着的吗？你怎么食言了。”\n“张海浠，我能听见你的心跳”\n……………\n黑眼镜：劳资出去夹个喇嘛的功夫怎么一回来妹妹被拱走了", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "同人", "风水秘术"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, 体面衣裳，随为师去见一个人。”\n文才：“师父，你是要给我.....”\n九叔：“不错，是要给你找个师娘了！”\n文才：不是老婆吗？.....我要裂开了啊！\n九叔：老东西，我的芙妹在那里！！！\n现代老年文才：师父，你这样为了师娘，会引起道门大派大战的啊！\n九叔一意孤行：区区门派纷争，不及我芙妹半分重要！\n九叔：混账玩意！就凭我僵尸道长林凤娇这七个字，含金量够不够！\n秋生：师娘驾到，统统闪开！", "tags": ["悬疑脑洞", "悬疑", "穿越", "灵异", "同人", "风水秘术"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：你也想要我的香吗？", "fullTitle": "盗墓：你也想要我的香吗？", "link": "https://fanqienovel.com/page/7656772528630680638", "data": [3.02, 3.06, 3.11], "trend": 0.09, "latest": 3.1, "wordNumber": 134205, "creationStatus": 1, "desc": "【避雷看章一】\n在荒渊不知道活了多久，连脑子都退化完了的老鬼腊十八，一朝被系统强制性拐卖到盗墓世界打起了黑工。\n腊十八没上过班，系统忘了便宜没好货，小世界不懂没脑子鬼的杀伤力。\n三方颗粒度没对齐，重要角色被他一次次闹出的意外整的狗带，导致世界不断重启，他也被困在小世界里一次次的循环没走完的故事线。\n直到终极受不住了找上门，和腊十八约定了最后一次机会。\n没成想，重生上线就送大逃杀。\n算了，事已至此，先认个爹吧。\n——————————\n系统大猫十九为了能够早日退休，背着时空局私下接单。\n万万没想到，精挑细选的任务者还能让它有炸单的一天。\n面对小世界流着瀑布眼泪的控述。\n十九一边掏着赔偿款，一边倒三角眼发出不亚于恶魔的低语：\n“你就掏了这点家底，还想要多贵的东西？便宜没好货你不知道吗！”\n著名便宜货·腊十八听到自己的名字，不明所以的茫茫然抬头。\n【喊我？】\n**********\n对此，主角团表示有话要说——\n吴邪脸红又绝望：畜生啊！！！\n解雨臣淡定饮茶：不过贪玩了些，不是什么大事。\n黑瞎子扭头假笑：没说不养，谢谢。\n沉浸在破碎男性自尊无可自拔的王胖子，哭的不能自已。\n张起灵路过，手里拎着一个无辜的腊十八，从所有人面前路过。", "tags": ["悬疑脑洞", "悬疑", "盗墓", "系统", "重生", "同人", "灵异"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "老九门到盗笔，宿主他易燃易爆炸", "fullTitle": "老九门到盗笔，宿主他易燃易爆炸", "link": "https://fanqienovel.com/page/7638263689493089305", "data": [3.87, 3.83, 3.95], "trend": 0.08, "latest": 3.9, "wordNumber": 248530, "creationStatus": 1, "desc": "[无cp+团宠]\n江昭，快穿局绿茶部成员，被新上任的绿茶部部长直接打包扔进了盗笔小世界。\n江昭：不是，没人先过问一下我的意见吗？\n吴棠：你的意见是什么很重要的东西吗？要是任务失败了，我就把你扔星际监狱里去……\n江昭：一串优美的电报声飘过\n江昭再次睁眼的时候，就成了一个小婴儿。\n江昭：不是，就不能让我一穿过来的时候就是个成年人吗？为什么一穿过来就是生活不能自理的年纪？又是一串优美的电报声！\n小时候的江昭，是一颗乖巧软萌的灵珠，长大后的江昭，是唯恐天下不乱，而且还一点就炸的炮仗！\n水蝗：佛爷好歹也是九门之首，你这么直呼其名不太好吧？\n江昭嗖的一下过去踹翻了水蝗，\n江昭：我敢叫，他敢应吗？他逢年过节给我磕一个还差不多！\n张起山刚想开口\n江昭：你闭嘴！\n张起山：张家人为什么会有晚婚晚育这种东西？\n努力降低自己存在感的张鈤山：佛爷，咱也收敛点成吗？\n解九：阿昭，气大伤身！\n江昭：我要是有气不撒出来，更伤身！\n吴叁省／解联环：叔，你下手能轻点吗？我的医保卡要刷爆了！\n江昭：没把你们两个倒霉玩意儿打死，已经算得 \n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠装逼征服诡异世界", "fullTitle": "我靠装逼征服诡异世界", "link": "https://fanqienovel.com/page/7651204736850332697", "data": [4.56, 4.42, 4.57], "trend": 0.02, "latest": 4.6, "wordNumber": 251719, "creationStatus": 1, "desc": "【评分刚出，求五星🙏🏻】\n【1VN】【无CP】【装逼】【迪化】\n【注：无CP等于谁都能是CPヘ(￣ω￣ヘ)】\n公元3077年，诡异入侵世界，杨宴被迫卷入到诡异副本当中，正准备摆烂混日子，谁曾想居然绑定了一个装逼系统，从此在迪化的道路上一去不复返……\n杨宴：闭眼休息\n众人：都闭上眼睛！大佬察觉了不对！\n杨宴：发发呆放空大脑\n众人：都不要轻举妄动！大佬在思考破局之法！\n杨宴：？\n系统欲哭无泪：家人们谁懂啊！本以为绑定了一个大佬，谁知道是个面瘫装逼男啊！\n—\n“听说十三区来了一个顶级大佬！”\n“真的假的！”\n“真的！据说他杀伐果断，深不可测，腰细腿长，清冷矜贵……”\n“嗯？等等？后面的形容词不对吧啊喂……”\n“细说深不可测……”\n——\n于此同时，副本内的大佬们……\n孤狼大佬呈影（心满意足）：“是的，我是他的狗，这是我的荣幸(｡･ω･｡)。”\n公会会长风惊羽（认真脸）：“啊？你问我杨宴吗？他宽肩窄腰，气质斐然，高冷神秘……（此处省略一万字）”\n商会盟主枭鹤（温润如玉）：“希望能够取代呈影的位置，他还不配(◣_◢)。”\n某反派：“真的不能改变阵营吗？老师我想和杨宴一组o(╥﹏╥)o”\n杨宴：？你们", "tags": ["悬疑脑洞", "悬疑", "系统", "直播", "灵异", "惊悚游戏"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "触礁对岸", "fullTitle": "触礁对岸", "link": "https://fanqienovel.com/page/7542096272866413630", "data": [6.54, 8.11, 9.34], "trend": 2.8, "latest": 9.3, "wordNumber": 261580, "creationStatus": 1, "desc": "评分刚出，可能会涨哈哈\n姜柠是顶级学府本硕博八年制的医学生，学医，博士buff叠满\n巨大压力之下，她养成了一点无伤大雅但不好宣之于口的小爱好\n本来她还处于精神放飞但是行为保守的状态，直到她毕业那年，压力过大，她忍不住对一个认识了一年多的网友发起了邀请\n网友不仅长的好，身材也好\n两天两夜，姜柠吃饱喝足后删除拉黑，潇洒走人\n答辩那天，那位传说中导师死对头的答辩主席端坐主位，赫然是那个和她在酒店待了两天两夜的男人！\n而他还即将成为她的顶头上司，领导的领导\n\n一只伤痕累累但铁骨铮铮的小狐狸遇见了心软的神\n一个端方君子第一次谈恋爱就被骗身骗心为爱发疯的故事\n\n1v1双c，男女主都很纵yu。\nhappy ending \n本人不学医，所有的东西都是按自己的想法设定的，不实的地方千万不要当真啊\nPS：作者有一直在修文，完善前后逻辑，如果有宝宝看到内容有变化是正常的喔，爱每一个看文的宝宝", "tags": ["职场婚恋", "现代言情", "职场", "医生", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全网骂我杀人犯时，我在守国门", "fullTitle": "全网骂我杀人犯时，我在守国门", "link": "https://fanqienovel.com/page/7658213567753096216", "data": [3.99, 4.47, 5.94], "trend": 1.96, "latest": 5.9, "wordNumber": 149295, "creationStatus": 1, "desc": "刚开分，绝对会涨【直播+大女主爽文+热血爱国+双强结局HE】\n青梅竹马的婚礼当天，一段战场录像曝光了全网唾骂六年的“杀人犯”真面目。\n她不是罪犯。\n她是守了北境六年的战神，一线作战指挥官。\n六年前，她为救义妹反被诬陷入狱，众叛亲离无人听她解释。\n入狱当天，她被秘密调往北境，从“杀人犯”变成守国门的兵。\n二十一岁，她带着人打穿北境，横推境外十几股武装势力，把华国北境防线前推一百二十公里。\n五年征战，直到二十六岁那场战役，增援迟迟不来，战队全军覆没。\n她看着满地战友遗体，抹掉脸上的血说了句：“天下青山都一样，埋在哪都是家。国门，我得守着。”\n被俘敌营，敌人以为折断了她，她却反手搅动整片三不管地带，以战止战，扶仇人坐上王座统一北域。\n燃烧了二十多年的北境外患彻底熄火。\n如今，那个深爱她的男人撬动了全球直播系统，把她的战场录像公之于众。\n全网看见她在废墟里啃能量棒，看见她在敌人角斗场上车轮战却始终没有跪下，看见她站在千年烽火台上负手而立指挥作战。\n骂她的人，哭了。\n害她的人，跪了。\n抛弃她的家人，迟了。\n全网都在求她活着，求着她凯旋！\n她叫纪寻，代号寒戈，华国最年轻的少将。\n当所有人期待着那场授勋仪式时，她又跑去北欧把桌掀了……", "tags": ["职场婚恋", "现代言情", "直播", "女强", "强强", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲相到高中物理老师", "fullTitle": "相亲相到高中物理老师", "link": "https://fanqienovel.com/page/7654979133981608985", "data": [5.73, 6.3, 6.38], "trend": 0.65, "latest": 6.4, "wordNumber": 186827, "creationStatus": 1, "desc": "沈书言的十七岁，有两个解不开的难题。 一个是物理，一个是尚睿。\n他是隔壁班的物理老师，穿白衬衫很好看，讲题的时候声音很低。 她不是他班的学生，但是总喜欢在他们班物理下课的时候去等闺蜜，借此看一眼他。\n拍毕业照那天，想跟他单独合影，但是没有理由，她以为这就是结局。\n四年后。 她是楼管，他是一个普通的顾客。 四目相对的那一刻，她听见自己心跳的声音。 \n更离谱的是 —— 过年回家相亲，对面坐的人，又是他。\n尚睿看着她，眼底带着诧异： \"好久不见？。\"\n原来不是她一个人的独角戏；\n原来物理题不会没关系；\n原来他在身边，就够了。", "tags": ["职场婚恋", "现代言情", "久别重逢"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [6.14, 6.65, 6.73], "trend": 0.59, "latest": 6.7, "wordNumber": 222648, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理 "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [27.25, 27.92, 28.37, 28.45, 28.45, 29.16, 29.36], "trend": 2.11, "latest": 29.4, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [24.93, 24.99, 25.02, 25.24, 25.24, 26.09, 26.99], "trend": 2.06, "latest": 27.0, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉  "fullTitle": "父王，开门！本郡主闯祸回来啦", "link": "https://fanqienovel.com/page/7571356675811052568", "data": [37.33, 37.33, 41.35, 43.19, 44.17, 44.57, 44.87], "trend": 7.54, "latest": 44.9, "wordNumber": 1094721, "creationStatus": 1, "desc": "[轻松诙谐＋无CP＋日常＋团宠＋爽文＋沙雕＋女强＋群像＋权谋＋颠文]\n（简介无能，大家还是直接看正文吧）\n    自从端王府的独苗苗叶琼脑袋被驴踢中失忆后。\n    老纨绔端王好日子到头了。\n    别人家父慈子孝，端王府鸡飞狗跳。\n    叶琼不是在坑爹，就是在坑爹路上。\n    短短半月，不仅荣升为了京城纨绔之首，还成立了纨绔天团。\n    当别人琴棋书画时，叶琼忙着败家逛青楼。\n    当别人宫斗宅斗时，叶琼忙着吃瓜打架斗殴。\n\n    直到某天，众人发现那个臭名昭著的草包郡主，一跃成为了京城的顶流。\n    最火戏楼老板——是郡主。\n    最赚钱的拍卖行东家——是郡主。\n    最大的山匪头子——是郡主。\n    连江湖最厉害的门派门主——也是郡主。\n    百姓给郡主立长生牌，纨绔们认郡主为老大。\n\n    当众人抢皇位抢的火热时，\n    清点银票的叶琼看着自己钱也有了，人也有了。\n    好像不参与一下有点不合群。\n    于是，反手就把自己的跟屁虫小皇孙拎上了皇位。\n    比起皇位，她还是更喜欢当权倾朝野的摄政王。\n【注：不是正经宫斗权谋，本文走轻松诙谐风】", "tags": ["宫斗宅斗", "古代言情", "女强", "团宠", "搞笑轻松", "群像"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "侯府忘恩义？摄政王撑腰，不原谅", "fullTitle": "侯府忘恩义？摄政王撑腰，不原谅", "link": "https://fanqienovel.com/page/7455896023752264766", "data": [26.42, 27.3, 28.21, 29.18, 29.18, 30.82, 31.41], "trend": 4.99, "latest": 31.4, "wordNumber": 1082856, "creationStatus": 0, "desc": "骆宁替太后挡刀重伤，换取家族爵位。\n她南下养病三年，回来后却发现，表妹占据了她的院子。\n表妹也取代了她的地位。骆宁的父母、兄长疼她、祖母赏识她；就连骆宁的竹马，也暗慕她，说她处处比骆宁优秀。\n骆宁大闹，他们联手害死了她。\n做鬼十八年，看到了他们的下场，她重生了。\n她又活了。\n这次，她想要活得痛快。\n——*——*——\n骆宁重生后为复仇，找摄政王做靠山。\n“明面上你是雍王妃，实际上你是本王之奴。他日，助你假死脱身，更名换姓。封你为郡主，有封地、俸禄，同郡王。”\n她同意了。\n她镇得住侧妃、斗得赢野心勃勃的门阀、哄得了太后。\n几年后，摄政王成了新主。\n跋扈狠戾的年轻帝王，用很缥缈的声音问她：“郡主印换皇后金印，可愿意？”\n她忠诚听话，头一回忤逆他：“不愿！”\n—*—*—\n原书名：《侯府忘恩义？摄政王撑腰，不原谅》", "tags": ["宫斗宅斗", "古代言情", "重生", "王妃", "前世今生", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高门主母的驯夫手册", "fullTitle": "高门主母的驯夫手册", "link": "https://fanqienovel.com/page/7550793954933885976", "data": [18.62, 19.15, 19.92, 20.73, 21.32, 21.99, 22.38], "trend": 3.76, "latest": 22.4, "wordNumber": 547008, "creationStatus": 0, "desc": "程昭被赐婚给最年轻的国公爷周元慎。\n　　周元慎有一 那里她目睹了人性的扭曲。\n那些为精心定制的骗局，没有一个人能够从中逃出来。\n也许没人相信2023年了还有人会被骗，那是因为你没有遇到适合你的骗局。\n奉劝所有人不要相信国外的高薪招聘。", "tags": ["职场婚恋", "现代言情", "第一人称"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "闪婚刑警老公，陆队人前请装不熟", "fullTitle": "闪婚刑警老公，陆队人前请装不熟", "link": "https://fanqienovel.com/page/7638577943551167550", "data": [8.77, 8.92, 9.1], "trend": 0.32, "latest": 9.1, "wordNumber": 407143, "creationStatus": 1, "desc": "「刑警硬汉队长x娇软画像师」\n「先婚后爱+细水长流+破案日常+甜宠+双洁+1v1」\n相亲那天，温清梨遇到了自己学生时代的暗恋对象，陆峥。\n仅用两句话，两人就敲定了闪婚事宜。\n“不对外公开。”\n“相敬如宾，互不干涉。”\n他是冷硬糙帅的刑警队长，她是警局特聘的画像师。\n白天，他们联手侦破郊外抛尸案、明星被杀案、雨夜失踪案……\n夜晚，她守着婚前约定：床上熟透，床下不熟。\n她藏起自己暗恋的小心思，努力和他保持着相敬如宾的状态。\n直到发生了一件事，她主动留下一封离婚协议，提着行李箱连夜跑路。\n-\n所有人都以为陆峥天生冷酷，不会爱任何人。\n直到温清梨提出离婚跑路后，他差点疯掉。\n没有她画的画像，凶手样貌不像，没有她深夜的晚安吻，长夜漫漫。\n他费尽千辛万苦找到她，掐着她细腰，将她逼至墙角：\n“为什么提离婚？”\n“回来，别跑，以后我的命都给你。”\n温清梨：“！！！”\n说好的不需要爱情呢？", "tags": ["职场婚恋", "现代言情", "甜宠", "先婚后爱", "暗恋", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内闪婚，陆队你媳妇又孕吐了", "fullTitle": "体制内闪婚，陆队你媳妇又孕吐了", "link": "https://fanqienovel.com/page/7510767748738190398", "data": [8.4, 8.64, 8.72], "trend": 0.32, "latest": 8.7, "wordNumber": 1263495, "creationStatus": 0, "desc": "漫剧制作中；\n实体书已上架！书名：《予她灿烂骄阳》。\n一见钟情+奉子闪婚+双体制内+双洁+宠妻甜宠日常；\n高岭之花坚韧女法医VS超会撩深情刑警队长；\n-\n情人节这天，舒妍受酒精刺激，睡了一个帅哥；\n第二天上班，男人突然出现在她面前，她才知对方是新来的同事。\n一个月后。\n在出勘现场时，舒妍面对她习以为常的气味突然作呕。\n次日，陆乘风便拖着行李箱搬进她家……\n-\n为了孩子，舒妍同意结婚的提议，从此——\n白天，他们是默契的搭档，一起联手侦破各种案件；\n晚上，他们是甜蜜的夫妻，过着脸红心跳的小日子。\n-\n遇到舒妍之前，陆乘风一心只有工作，\n遇到舒妍之后，他才发现自己过去白活了，\n他现在只有一个想法，白天努力工作，晚上下班回家跟老婆孩子暖被窝……\n-\n虚构的城市！架空背景！\n婚后宠妻日常，细水长流，感情线穿插小案件~\n文中职业相关内容借鉴于书籍或网络资料，可能不够严谨，请勿较真~\n老作者坑品好，稳定日更，求支持~\n另有两部同类型百万长篇作品已完结，有兴趣的可查看主页~", "tags": ["职场婚恋", "现代言情", "宠妻", "闪婚", "一见钟情", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "远嫁的女儿", "fullTitle": "远嫁的女儿", "link": "https://fanqienovel.com/page/746976951877291526 \n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宿舍求生：从刷广告开始变强", "fullTitle": "宿舍求生：从刷广告开始变强", "link": "https://fanqienovel.com/page/7632978161973595161", "data": [29.61, 32.0, 31.44], "trend": 1.83, "latest": 31.4, "wordNumber": 312259, "creationStatus": 1, "desc": "评分刚开开开开！！！\n【诡异+有cp+女主恶毒炮灰+女主花心大萝卜+爽文+成长流】\n避雷1：女主超漂亮，阴暗妒强，一心要当天龙人\n避雷2：男主超纯起点龙傲天风，巨强巨黑巨装，巨容易破防。\n避雷3：女主人见人爱，诡见诡爱（少量女嬷）。男主后来还没上位，就天天抓小三。\n=========\n诡异公寓降临，全民躺平求生 。\n在这里，夜晚必须躺在床上睡眠赚取金币。金币越多，房门越厚，活得越久。\n郁圆上辈子被人害死，重生归来，开局就抢走大楼内唯一珍稀盲盒。\n本以为这辈子直接起飞，脚踩所有天龙人。\n谁知道开盒一看：【获得隐藏款道具：广告麻麻！】\n郁圆：……什么东西？\n广告麻麻：看广告可获得升级或抽取盲盒的机会哦～\n##\n宋聿早就知道这个世界是个巨大的小说，而他是绝对的主角。\n既然他是主角，\n为什么郁圆不能只围着他转？\n那些仗着郁圆年纪小，不能辨别好坏，妄图勾引她的人，都该在这个世界上消失……", "tags": ["科幻末世", "幻想言情", "重生", "末世", "前世今生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "采集技能怎么了，我可采万物", "fullTitle": "采集技能怎么了，我可采万物", "link": "https://fanqienovel.com/page/7549109392579234841", "data": [9.42, 10.66, 11.13], "trend": 1.71, "latest": 11.1, "wordNumber": 1003183, "creationStatus": 0, "desc": "【废土求生】【天灾】【异能】【采集术】【无CP】【女强】\n   \n 异世废土，魔物入侵，大地皲裂，无数怪物涌入。\n十八岁的安然艰难求生，某天忽然发现，自己的技能有很多神奇之处，但凡用技能采来的植物与果实，不仅没有丝毫污染，还带着某种神奇功能。\n   叮！采集成功，你获得一颗五阶变异红薯，吸收可永久增加一点体质。\n   叮！采集成功，你获得六级变异葫芦，可储存一立方物体。\n  \n  叮！采集成功，你获得三阶小兽袋，可储存五立方体积物体。\n   叮！你得到一根狼牙......\n   叮！你得到2点力量属性......\n\n  安然震惊。\n   自己的技能竟然可以对其他生物施展，包括人类，明明就是采集技能，为何会 er": 933177, "creationStatus": 0, "desc": "迟夏初到专案组，骆寻强烈建议她转岗。\n 这实习生细胳膊细腿又木讷，跟睡不醒似的，哪点适合专案组？倒是很适合去宣传科！\n细胳膊细腿默不吭声，凡事来一句：骆队，破案要紧。\n骆寻气不打一处来，觉得专案组要完。\n没过多久，骆队啪啪打脸。\n她这哪是细胳膊细腿啊，抡起拳头他都怕！\n她这哪是睡不醒啊，一会一个主意，给人下套都不带眨眼的！\n她这哪适合宣传科啊，出了专案组大门那就是暴殄天物！\n骆队总结：迟警官必须留在专案组！还得立马转正！\n————————————\n【如果黑云遮住这片天，罪恶无法消散，那就遮住这片云，再造一个太阳，悬于苍穹和人心之上。】\n我们终其一生，顶着烈日寒冬，我将忠于我的内心，忠于我的祖国，忠于我的人民，用我一腔热血，护一方山河无恙。\n我护你一方小小山河，你全我一腔赤忱热爱。\n　　\n  ***\n【超高智商天才实习生VS 最接地气浓颜系大队长】\n\n强强联合|破案为主，感情为辅|架空，含私设", "tags": ["女频悬疑", "悬疑恋爱", "推理", "女强", "天才", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "当个社畜，怎么成凶案嫌疑人了？", "fullTitle": "当个社畜，怎么成凶案嫌疑人了？", "link": "https://fanqienovel.com/page/7620318256322071576", "data": [17.37, 17.91, 18.38], "trend": 1.01, "latest": 18.4, "wordNumber": 564880, "creationStatus": 1, "desc": "刚开分，后面会涨！请放心食用\n逻辑天才实习生×高冷禁欲护短刑警队长1v1，双洁双强，架空，含私设。\n姜绵只是下楼拿个雷霆外卖，就撞上小区垃圾桶发现人民碎片。\n她挤进人群吃瓜，下一秒直接被目击证人指认成凶手。\n姜绵：满脸???，别这么离谱行不？她只是吃个瓜！怎么成凶手了？\n刑警队队长宋延，高冷禁欲，不近人情，一开口就把她按在嫌疑人位置上磋磨。\n“说一下作案过程。”\n语气恶劣，还把她当小猫似的逗了一通。姜绵气炸，幸好天降神探系统，当场洗清嫌疑。\n但她万万没料到自己倒霉到竟被学校分配到临江市刑警支队实习。\n上司，还是宋延!!\n直到某天，姜绵发现，这位高冷禁欲的队长，一跟她对视就耳尖发红。\n她笑眯眯凑近：“宋队，你中暑了?”\n宋延绷着脸：“没有。”\n姜绵挑眉：“那就是……对我心动了。” \n再后来她更惊了。\n这人在床上既不高冷，也不禁欲。\n分明是个装正经的大涩迷！！！\n清水河里，钓友钓起一具高度腐败……\n空置出租屋，夜半墙缝渗出暗红水渍。\n诡异村庄，看似村风纯朴，实则暗藏恐怖陋习。\n腐生菌丛、假面新郎、骨影灯笼……\n一桩桩离奇凶案，撕开人性最黑暗的褶皱。\n而她和他，在刀尖上追凶，也在心动里沦陷。", "tags": ["女频悬疑", "悬疑", "推理", "天才", "破案", "悬疑恋爱"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七月半，鬼娶亲", "fullTitle": "七月半，鬼娶亲", "link": "https://fanqienovel.com/page/7418454040775773246", "data": [4.83, 5.07, 5.72], "trend": 0.88, "latest": 5.7, "wordNumber": 1055677, "creationStatus": 0, "desc": "〖大女主文+玄学+宠妻+群像+复仇〗\n目前同名短剧«七月半，鬼娶亲»已上线。\n阿妈说，我出生那年，村子里天降异象，雷霆大雨，万鬼嚎哭，爷爷将七婆请来，亲自接生，这才将我生下来。\n七婆批命:“天生阴命，已被“他”相中，十八年后，七月半，花轿至。”\n从我记事起，我每晚都会做一个梦，梦见我身旁躺着一个男人，他说:“阿音，我是你夫君。”\n从小阿妈便让我与一个灵牌一屋子睡觉，逢年过节还得上香叩拜，更不能让我与任何异性有接触。\n阿妈却只是说我还太小，要以学业为重。\n村里人用惧怕，恭敬，疏远的眼神看着我，甚至，不许家中小孩与我一同玩耍。\n七月半，鬼节那天，刚满十八岁的我，迫于无奈穿上大红嫁衣，被鬼抬轿离开家，与‘鬼’拜堂成亲。\n自从那之后，我虽然回归学校，但，各种灵异事件都接踵而来……\n本故事纯属虚构，所有意外，纯属巧合。", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三嫁阎君", "fullTitle": "三嫁阎君", "link": "https://fanqienovel.com/page/7588095605168163865", "data": [7.81, 8.36, 8.63], "trend": 0.82, "latest": 8.6, "wordNumber": 499907, "creationStatus": 1, "desc": "二十岁这年，我爸给我抢了一桩人人都惧怕的婚事。\n婚期定在七月十五，鬼节，而我要嫁的他……\n也不是人。\n只因我出生就没有心跳，是我爸用秘术吊着我的命，只有和这个神秘老公结婚才能得一线生机。\n成婚当天夜里，漫天飞舞的纸钱中，诡异的纸人携着八抬凤辇从天而降。\n我代替了同村少女成为了他的妻。\n结婚后，父亲诡异失踪，留下一本《世间百鬼录》，从此我携百鬼录踏入了奇幻诡谲的世界。\n千年尸王是我的保镖，万年灵物成为我的法器，渡灵扇在手了却世间万千执念，灵愈之力治愈三界山精鬼怪，我成为世间独一无二的渡灵师。\n而我的那个神秘老公，他说娶我非他所愿，等到约定期限一到，他便给我自由并赐予我长命百岁。\n我欣然接受，离婚而已，可以再嫁。\n可是……\n我都三嫁了，新郎怎么还是他？", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱", "风水秘术"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "她从地狱来，证罪", "fullTitle": "她从地狱来，证罪", "link": "https://fanqienovel.com/page/7643407618580433944", "data": [3.8, 4.24, 4.51], "trend": 0.71, "latest": 4.5, "wordNumber": 412056, "creationStatus": 1, "desc": "【地狱重生杀手×偏执刑侦队长｜双强相爱相杀｜刑侦悬疑反转｜HE】\n一枪贯穿额骨，江离死在她宿敌凌执面前。\n她是暗网封神的顶尖杀手A，双手染血，亦暗中救下无数无辜之人。\n罪孽与功德纠缠，地府无法审判，送她借尸重回人间。\n睁眼，她成了被拐卖虐杀的可怜少女，满身伤痕，前路皆是豺狼。\n这一世，她主动拨通那个与她不死不休的刑侦队长电话。\n\n前世猫鼠追猎，他拼尽全力缉拿她归案，两人刀尖相向，不死不休；\n今生她弃暗投明，硬闯刑警队，以一身杀人技法，撕开所有藏在正义皮囊下的肮脏罪孽。\n\n人人都说杀手本性难改，视律法如无物。\n唯有凌执看清她藏着的挣扎与温柔。\n她精通所有犯罪诡计，看透人性阴暗；\n他手握刑侦所有规则，坚守世间公道。\n\n昔日死敌，被迫并肩查案。\n明暗拉扯，步步博弈，爱意与杀意共生。\n江离：我从地狱回来，只为扒开所有没被审判的罪。\n凌执：地狱太黑，往后光明，我陪你一起走。\n\n✨高燃双强互钓｜连环凶案反转不断｜全员助攻｜前世今生宿命拉扯｜全程无虐HE", "tags": ["女频悬疑", "悬疑", "重生", "推理", "破案", "悬疑恋爱"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漫画预言杀人事件", "fullTitle": "漫画预言杀人事件", "link": "https://fanqienovel.com/page/7477901455727283225", "data": [4.15, 4.47, 4.58], "trend": 0.43, "latest": 4.6, "wordNumber": 393
