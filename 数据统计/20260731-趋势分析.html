<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 7月25日–7月31日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

转头她就考上电厂干部。\n女主三年抱俩，暗地里笑她是不下蛋的母鸡，结果她一胎三宝，直接弯道超车。\n女主高兴考上全国首一的大学，就看见她以第一名的成绩成为运动后首批研究生。\n改革开放，女主创业开饭店，做老板，买大奔，风光无限，却不想苏甜手里早已经控股十数家公司，成了名副其实的企业家。\n女主终于崩溃了，红着眼问：“为什么？明明我才是女主，为什么哪里都比不上你？”\n苏甜靠在真皮沙发上，端起茶杯，慢悠悠地吹了口气，矫揉造作地笑了笑：\n“我也没办法，谁让姐从小就那么优秀呢？”\n“你要真想翻盘，可以等老了死在我前面，然后早投胎几年——说不定下一辈子，我就输你了。”\n女主：“……”", "tags": ["年代", "现代言情", "空间", "甜宠", "穿书", "养崽"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [6.56, 6.74, 7.02, 7.3, 7.41, 7.57, 7.82], "trend": 1.27, "latest": 7.8, "wordNumber": 286416, "creationStatus": 1, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰腴美人一撒娇，冷面军官脸红了", "fullTitle": "丰腴美人一撒娇，冷面军官脸红了", "link": "https://fanqienovel.com/page/7640510554175458366", "data": [7.34, 8.05, 8.21, 8.22, 8.27, 8.18, 7.99], "trend": 0.65, "latest": 8.0, "wordNumber": 274872, "creationStatus": 1, "desc": "【年代，先婚后爱，随军，萌宝，追妻火葬场】\n把离婚协议书寄给容璟时的第二天，沈青姝开始不断做预知梦。\n她梦到自己被那伪善的白眼狼养妹夺走传家宝，算计下乡，在黑省被折磨致死，落得个抄家灭门的凄惨下场。\n醒来后，听着绿茶养妹正在脑海里和“系统”商量怎么抢她气运，沈青姝冷笑一声，反手夺过空间金手指，把白眼狼和渣男都一起打包下乡了！\n*\n撕了离婚信，护住沈家财产，沈青姝带着一对双胞胎儿子，麻溜去海岛军区找容璟时复合。\n面对主动换上真丝吊带钻被窝、软玉温香的小妻子，容首长如临大敌，咬牙切齿：“沈青姝，你休想用这种色诱的手段骗我签离婚协议，我绝对不上当！”\n 沈青姝翻了个白眼，一把擒住他的软肋：“废什么话，睡觉！”\n　　*\n海岛军区来了个美艳娇气的大小姐军嫂，刚开始大院里人人觉得她不出三天准待不下去。后来大家发现，这祖宗手里漏出的随便一样好东西，都够他们眼红大半辈子，各位刺头大佬纷纷开始抱大腿。", "tags": ["年代", "现代言情", "萌宝", "先婚后爱", "暗恋", "追妻火葬场"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [6.83, 6.53, 6.53, 6.32, 6.92, 6.92, 7.21], "trend": 0.38, "latest": 7.2, "wordNumber": 250195, "creationStatus": 1, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [3.24, 4.15, 4.77, 5.19, 5.62, 5.77, 5.95], "trend": 2.7, "latest": 5.9, "wordNumber": 177611, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [2.71, 3.14, 3.48, 3.73, 4.08, 4.54, 4.85], "trend": 2.14, "latest": 4.8, "wordNumber": 266889, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [3.13, 3.45, 3.81, 4.1, 4.53, 4.9, 5.16], "trend": 2.03, "latest": 5.2, "wordNumber": 264723, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [3.51, 4.01, 4.46, 4.81, 4.88, 4.97, 5.04], "trend": 1.53, "latest": 5.0, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。", "tags": ["种田", "古代言情", "空间", "医术", "古色古香", "代嫁代娶"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糠逆袭后，前夫九族悔哭了", "fullTitle": "糟糠逆袭后，前夫九族悔哭了", "link": "https://fanqienovel.com/page/7646611978152070206", "data": [3.01, 3.62, 4.04, 4.26, 4.49, 4.62, 4.53], "trend": 1.52, "latest": 4.5, "wordNumber": 271213, "creationStatus": 1, "desc": "和离后，姜小满得到了天大的机缘。\n\n洗筋伐髓，一夜回春。\n那张被二十年苦日子熬出来的蜡黄老脸，脱胎换骨，肌肤胜雪，花容月貌，比十六岁出嫁那年还美上十分。\n\n种灵草，炼仙丹，荒山变宝山。\n全省大旱，颗粒无收，她的灵稻却绿浪翻涌，逆天丰收。\n\n一颗丹药在京城卖出万两天价，求药的人从青岩山排到了城门口。\n\n前夫一家跪在她门前磕头认错。\n她正坐在院子里数银子，头也没抬，只淡淡说了句：“别挡光。”", "tags": ["种田", "古代言情", "乡村", "幻想言情", "空间", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越后自称汉族，后来我的国来了", "fullTitle": "穿越后自称汉族，后来我的国来了", "link": "https://fanqienovel.com/page/7643332690896227352", "data": [3.56, 3.98, 4.43, 4.76, 4.92, 5.01, 4.93], "trend": 1.37, "latest": 4.9, "wordNumber": 267819, "creationStatus": 1, "desc": "【无cp+古代穿越】\n沈清一朝穿越异世，逃荒路上众人排挤戒备，为在古代求生，对外谎称出身隐世大族。\n落脚于安置点时，开了间食肆，本想安安稳稳过日子，不想却救济了万民。\n宗室子弟肆意残害百姓，种种恶行令人发指。\n众人眼中最为善良、去牙行挑人都哭跑出来的沈娘子，破口大骂，众人纷纷表明从没听过这么脏的话。\n有人上前攻击，女主将手中器物猛地掷出，轰然一声炸响，震慑全场。\n“吾乃汉族，维天有汉，鉴亦有光，你们岂敢动我。”\n后期国家来了，女主的心态彻底发生变化。", "tags": ["种田", "古代言情", "穿越", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿古代，在主角后面捡漏", "fullTitle": "胎穿古代，在主角后面捡漏", "link": "https://fanqienovel.com/page/7635046106379848729", "data": [2.45, 2.63, 2.84, 3.04, 3.26, 3.53, 3.69], "trend": 1.25, "latest": 3.7, "wordNumber": 292699, "creationStatus": 1, "desc": "[架空] [种田] [经商] [权谋] [金手指] [有cp]（cp出场比较后）\n（刚出评分，还会继续涨哦）新人新作品，请多多担待。\n李巧语因被医闹病人报复，穿越到古代，直到两岁才恢复记忆。\n家中虽在村里比较富裕，但每个人心思各异，李巧语只能默默苟住，学习手艺，偷摸赚钱。\n可惜在这个时代，女性终究地位低下，为了未来的幸福，她只好计划制造机会入赘高富帅。\n本来以为这漫长的岁月会按部就班进行。\n没想到村长家出了个福娃，村里人都说福娃就是运气好，肯定是神仙下凡。\n却没有看到福娃一捡东西，旁边的人就会倒霉。\n还有，三姐整天用看鬼的眼神看我干什么？哦，原来她是重生的！！？\n隔壁家的书生也满嘴“我命由我不由天，三十年河东...”", "tags": ["种田", "古代言情", "乡村", "空间", "医术", "胎穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [2.21, 2.38, 2.63, 2.65, 2.68, 3.08, 3.42], "trend": 1.21, "latest": 3.4, "wordNumber": 260644, "creationStatus": 1, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但没耀祖！！！\n……\n\n《家无 龙子绝不允许", "link": "https://fanqienovel.com/page/7656717581486656537", "data": [4.22, 4.83, 5.43], "trend": 1.21, "latest": 5.4, "wordNumber": 147395, "creationStatus": 1, "desc": "三界皆怜沉香，欲毁严苛天条，唯有敖一持斧相拦。\n他是杨戬与敖寸心藏在西海海眼的混血龙子，自幼受尽分离苦楚。\n可他深知，天条崩塌，仙神皆能徇私，苍生必将受难。\n赴天庭求援恰逢大乱，敖一硬夺盘古斧对峙沉香，隐秘身世随之公之于众。", "tags": ["女频衍生", "幻想言情", "同人", "古色古香", "衍生"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "当第二部的小燕子穿越到第三部", "fullTitle": "当第二部的小燕子穿越到第三部", "link": "https://fanqienovel.com/page/7651929495531703320", "data": [4.52, 4.87, 5.34], "trend": 0.83, "latest": 5.3, "wordNumber": 224651, "creationStatus": 1, "desc": "（刚开分，后期会涨~放心阅读）\n第三部开篇，知画和永琪圆房后，那个在第二部大杀四方的小燕子灵魂强势回归。\n（永琪还是第三部的爱新觉罗·书桓，但苏·永琪也会出现。）\n面对知画的绿茶操作，小燕子不再流泪背诗，直接暴力掀桌。\n在小燕子的影响下，紫薇会高智商护短，晴儿会清醒独立。\n中后期主角团全部人格觉醒，不会ooc（除了爱新觉罗·书桓）\n这次小燕子不再是孤立无援。", "tags": ["女频衍生", "穿越", "虐渣", "同人", "魂穿", "衍生"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄凌重生，阴湿男鬼争做陵容正夫", "fullTitle": "玄凌重生，阴湿男鬼争做陵容正夫", "link": "https://fanqienovel.com/page/7657323828221053977", "data": [4.79, 5.19, 5.5], "trend": 0.72, "latest": 5.5, "wordNumber": 127392, "creationStatus": 1, "desc": "【阴湿病弱极度缺乏安全感男鬼的重生后给老婆冷脸洗内裤的日常】\n从奋起扑杀过摄政王夺权的少年帝王堕落成沉溺药石酒水中的昏君，被下毒被刺杀，身边人人都恨他、人人都盼着他死。\n周玄凌本来都已经认命了，但偏偏在一切已成定局再也无法转圜的时候，上天让他看到了自己本可以有的另一种结局。\n在那个世界，他是开疆拓土的明君，是妻儿在怀的完美丈夫。\n没有一身的病，没有一身的伤，幸福美满。\n他如何能甘心？\n重生前：她敢给我下毒，我一定要狠狠折辱她。\n重生后：喜欢那个老鳏夫看不上我，是吧？行，那你这辈子不仅跟他不可能了，还永远甩不掉我。而你只能获得荣华富贵，我的真心是不会给你的！！", "tags": ["女频衍生", "重生", "同人", "古色古香", "甄嬛衍生", "衍生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "【综影视】穿越的一百种姿势", "fullTitle": "【综影视】穿越的一百种姿势", "link": "https://fanqienovel.com/page/7649930549863124030", "data": [3.68, 4.1, 4.14], "trend": 0.46, "latest": 4.1, "wordNumber": 231308, "creationStatus": 1, "desc": "9396是时空管理局维稳部的员工，犯错后被自家组长开后门塞进隔壁同人部避风头，开启属于她的摆烂之旅。", "tags": ["女频衍生", "穿越", "同人", "甄嬛衍生", "综影视", "衍生"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "HP：布莱克家的姐姐", "fullTitle": "HP：布莱克家的姐姐", "link": "https://fanqienovel.com/page/7647004855134866494", "data": [3.49, 3.75, 3.91], "trend": 0.42, "latest": 3.9, "wordNumber": 235501, "creationStatus": 1, "desc": "(评分刚出，后续会涨˶⦁ ༝ ⦁˶ )亲世代万人迷向/原创女主穿越/长篇饭多/微量金手指/拆原cp/人物会有缺点和成长/轻度ooc警告\n穿越到《哈利波特》亲世代，成了布莱克家的养女，附带一个《哈利波特：魔法觉醒》满级账号。\n西里斯和雷古勒斯都是她弟弟。\n沃尔布加把所有的爱都给了她。\n两个弟弟：？？？\n维拉厌烦老宅冰冷压抑的氛围，不屑迂腐固化的纯血理念。\n她不愿任由命运摆布，更不愿看着自己珍视的两个弟弟，走向原著里凄惨悲凉的结局。\n她会打破家族宿命，改写既定悲剧。\n没有人知道她的秘密\n她来自另一个世界\n她读过《哈利波特》所有原著\n她知道每个人的结局。", "tags": ["女频衍生", "穿越", "女强", "团宠", "同人", "衍生"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "为了嫡妹林黛玉，我嫁给了九皇叔", "fullTitle": "为了嫡妹林黛玉，我嫁给了九皇叔", "link": "https://fanqienovel.com/page/7655574965659388953", "data": [8.36, 8.64, 8.67], "trend": 0.3, "latest": 8.7, "wordNumber": 285944, "creationStatus": 1, "desc": "穿越成大明巡盐御史林如海的庶长女林黛曦，自幼被正室贾敏养在名下视若己出，更是一手带大嫡妹林黛玉。明知红楼宿命，她苦熬十四年想扭转剧情，怎奈随身系统与空间被天道封印，只能勉强为贾敏母女调理身体，却终究拦不住贾敏病逝的命数。\n灵堂之上她崩溃质问，尘封十四年的金手指骤然满级解封！空间自带神界灵泉与冥界弱水，生杀予夺随心；系统万物可兑、任务全凭自愿，毫无强制惩罚。开局即巅峰，她手握神级挂，誓要护住林家，改写黛玉泪尽而逝的结局。\n为给妹妹铺就通天路，十四岁那年她应下赐婚，嫁予权倾朝野、常年戴面具的九皇叔朱景宸。全京城都笑林家高攀，直到大婚当日，面具落下——那张脸竟比北静王还绝色三分，且宠妻无度、钞能力拉满。\n贾府想拿捏黛玉、蹭林家好处？她反手用金山银山大观园教对方做人。看护妹狂魔携手权倾朝野的九皇叔，在大明玩转红楼，打脸虐渣，爆笑爽感一路狂飙！", "tags": ["女频衍生", "穿越", "虐渣", "红楼衍生", "公版衍生", "衍生"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成砂金姐姐，我有生之执政模版", "fullTitle": "穿成砂金姐姐，我有生之执政模版", "link": "https://fanqienovel.com/page/7653006237042215960", "data": [3.9, 4.04, 4.17], "trend": 0.27, "latest": 4.2, "wordNumber": 122693, "creationStatus": 1, "desc": "【崩铁】【OOC】【主角成长向】【作者是虚构史学家来着】\n好消息：穿越了，名叫莱茵多特\n坏消息：但落地茨冈尼亚。\n落地就送贫穷，饥饿，战争和可爱的弟弟一枚——卡卡瓦夏\n耳边还有聒噪的系统带来生之执政模版。\n疯狂的求知欲已点燃了理智与束缚。\n“那么，请宇宙，敬观我的伟业！”\n…\n作者这篇文属于梦到哪写哪，充满了作者的各种个人猜测和推断", "tags": ["女频衍生", "系统", "穿越", "星际", "同人", "衍生"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "【综名著】十九世纪冒险家", "fullTitle": "【综名著】十九世纪冒险家", "link": "https://fanqienovel.com/page/7646082398211279897", "data": [5.14, 5.2, 5.28], "trend": 0.14, "latest": 5.3, "wordNumber": 286087, "creationStatus": 1, "desc": "简介：\n【傲慢与偏见+福尔摩斯探案集+泰坦尼克号，世界观融合了福尔摩斯探案集的维多利亚时代，CP夏洛克·福尔摩斯】\n李梨因一场事故，穿越到了1855年。\n是傲慢与偏见中班纳特家刚出生的第六个女儿——伊迪斯·班纳特。\n比莉迪亚小三岁，但在原著从未出现过。\n李梨并未纠结过多，来都来了，想办法好好生存吧。\n伊迪斯顶着现代人的成熟灵魂，她既保持着十九世纪淑女的外表，骨子里却总是冒出不合维多利亚时代规训的现代思维。\n什么？随便写写的番茄味标题科普类小说火了？\n什么？这个世界不只是傲慢与偏见，一不小心成冒险家了？\nPS：1.半架空历史，傲慢与偏见延后时间线，泰坦尼克号提前时间线，因为时间线杂糅到一起可能有些设定跟真实历史对不上。\n2.前期剧情孕育发展女主事业，中期开始冒险", "tags": ["女频衍生", "穿越", "穿书", "魂穿", "公版衍生", "衍生"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "综影视，剧中山河改天换命", "fullTitle": "综影视，剧中山河改天换命", "link": "https://fanqienovel.com/page/7655245369076370457", "data": [3.19, 3.27, 3.31], "trend": 0.12, "latest": 3.3, "wordNumber": 165243, "creationStatus": 1, "desc": "【女频男主视角快穿+同人+无固定cp】\n江凛意外身亡后被系统捕捉灵魂去三千小世界做任务，结果他半点任务不做，专灭小日子，抽筋扒皮，把岛炸沉，男女主被牵连全废了，剧情变得面目全非，还污染了环境，严重影响了小世界升级。\n因此他被主神拘禁到影视剧中赎罪，强制要求他改变那些被剧情裹挟如提线木偶似的悲惨角色命运，以此获得满意值弥补过失。\n主角、配角、炮灰，江凛开启了无限期影视剧里打工还债的日常。", "tags": ["女频衍生", "系统", "穿越", "同人", "综影视", "衍生"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "士兵突击：我成了许三多的妹妹", "fullTitle": "士兵突击：我成了许三多的妹妹", "link": "https://fanqienovel.com/page/7654847329966492696", "data": [4.63, 4.54, 4.75], "trend": 0.12, "latest": 4.7, "wordNumber": 197278, "creationStatus": 1, "desc": "没有金手指+不是爽文+前期很甜+后期会稍稍有点虐心\n此小说跟原著士兵突击剧情基本没有任何关系。\n主要围绕许思言和高城长达四年的军旅之恋开展。\n剧情会少量涉及到原著剧情。\n不会影响剧中人物的发展轨迹和结局。\n女主许思言是穿越而来，投胎成了许三多的妹妹。\n女主通过自身努力考上大学，成为下榕树第一个大学生。\n她上大学的地方刚好离许三多当兵的地方不远。\n许思言去探望许三多，因见义勇为结识钢七连连长高城。\n两人属于一见钟情。\n从相识到相恋再到相守。\n两人经历了许三多的成长，钢七连的解散。", "tags": ["女频衍生", "乡村", "穿越", "一见钟情", "同人", "衍生"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "丰腴媳妇不作了，糙汉打脸真香了", "fullTitle": "丰腴媳妇不作了，糙汉打脸真香了", "link": "https://fanqienovel.com/page/7648274238557654041", "data": [13.89, 13.89, 18.32], "trend": 4.44, "latest": 18.3, "wordNumber": 263351, "creationStatus": 1, "desc": "服装设计师姜蜜熬夜猝死，一睁眼穿成了年代文里的极品作精村妇。\n原主顶着十里八乡最绝色的脸，却长了个草包脑子。\n放着任劳任怨、能赚能打的糙汉老公不要，把家底掏空去倒贴小白脸知青，甚至一哭二闹三上吊逼着离婚。\n按原书剧情，她离了婚就被渣男卖进深山，被折磨得连个全尸都没留下！\n母胎单身的姜蜜连连摆手：这作死剧本谁爱要谁要！\n满肚子坏水的细狗知青？滚一边去！把骗她的钱连本带利全吐出来！\n嚼舌根看笑话的长舌妇？不好意思，我当场发疯教你做人！\n至于那个表面冷酷无情实则纯情护短的糙汉老公……当然是关起门来好好撩拨！\n\n全村人都搬好小马扎，等着看贺家那个作精婆娘被扫地出门，笃定她肯定要跟小白脸私奔。\n可谁知左等右等，只等来贺家顿顿飘出诱人的肉香，日子越过越红火！\n原本嫌她恶心的冷面糙汉，更是化身无底线“护妻狂魔”。\n有人眼红挑拨：“铮哥，你媳妇以前可是天天惦记野男人……”\n话没说完，贺铮一脚踹碎水缸，霸气护妻：“滚！老子愿意给媳妇当牛做马，谁敢说她一句不是，老子打断他的腿！”\n夜里。\n那个打起架来不要命的野男人，却将娇柔的小媳妇圈在怀里，双眼猩红，嗓音哑得要命：“媳妇，这可是你先招惹我的，说好了一辈子，少一天都不行……”", "tags": ["年代", "现代言情", "乡村", "穿越", "护短", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越七零，我成了女主的恶毒继姐", "fullTitle": "穿越七零，我成了女主的恶毒继姐", "link": "https://fanqienovel.com/page/7645293690532924440", "data": [16.53, 16.53, 18.83], "trend": 2.3, "latest": 18.8, "wordNumber": 244487, "creationStatus": 1, "desc": "【军婚 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生七五年扔掉外甥上大学", "fullTitle": "重生七五年扔掉外甥上大学", "link": "https://fanqienovel.com/page/7641835297906363417", "data": [6.21, 7.48, 8.29], "trend": 2.08, "latest": 8.3, "wordNumber": 208363, "creationStatus": 1, "desc": "沈云重生在中考那年，嫂子生孩子凭什么让她带？嫂子的妈凭什么她伺候？重来一世，她要去上大学，不再给别人当免费保姆，远离兄嫂一家。手握空间，灵泉，药房，她自能闯出自己的一片天。", "tags": ["年代", "现代言情", "重生", "空间"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霞光暖暖的第1本书", "fullTitle": "霞光暖暖的第1本书", "link": "https://fanqienovel.com/page/7630819091648891928", "data": [5.32, 6.17, 7.25], "trend": 1.93, "latest": 7.3, "wordNumber": 293727, "creationStatus": 1, "desc": "【年代+乡村写实+家长里短+出轨+团宠+女性成长】\n红杏，村医，23岁，两个女儿的母亲。丈夫意外死亡后，她才发现，那个平时看起来老实巴交，三棍子都打不出来一个屁的男人，竟然背叛了自己。天崩地裂，一向恪守妇道，孝敬父母，相夫教子的她，感觉自己的天塌了！她的信仰的爱情，亲情，就在那一刻彻底的消失了。\n痛定思痛，余生的日子，她要撕破一切束缚她的无形的道德枷锁，真真切切为自己活一次。\n大胆去爱，大胆去恨，让自己的人生活的有滋有味！\n\n\n\n", "tags": ["年代", "现代言情", "乡村", "团宠", "医生", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "炮灰女配错睡禁欲长官后一胎五宝", "fullTitle": "炮灰女配错睡禁欲长官后一胎五宝", "link": "https://fanqienovel.com/page/7648259181132123198", "data": [6.08, 6.87, 7.29], "trend": 1.21, "latest": 7.3, "wordNumber": 300252, "creationStatus": 1, "desc": "评分刚出,后面会涨~\n【年代军婚】【穿书女配】【空间囤货】【发疯文学】【反差萌】 【搞笑甜宠】\n\n穿成年代文里被继妹抢房抢工作还要被下药毁清白的炮灰？苏又夏表示：这破剧本老娘不伺候了！\n反手把药灌回继妹嘴里，一脚踹飞极品全家，转头却发现——昨晚被她“嫖”了的那个男人，竟是军区赫赫有名的禁欲军官陆砚辞？\n苏又夏看着眼前腿长腰好的男人,八块腹肌谁不馋?但是看着空间那条“L0-穷光蛋和男色亲密必定怀五胞胎的”的奇葩设定，咽了咽口水：男人虽好，但生一窝崽可不行！\n溜了溜了，搞钱要紧,三毛钱嫖资已付，江湖不见。\n\n谁知逃跑下乡，好巧不巧分到了他驻地附近。\n陆砚辞堵住她：“睡完就跑？嗯？”\n苏又夏捂着肚子发疯：“跑什么跑，五胞胎你养啊！”\n \n陆砚辞果断上交存款,系统升级了!\n不受系统提示影响,苏又夏果断从了,男色当前不享受岂不是浪费了!\n什么?你不能生育?那我岂不是白跑了,亏大发了,必须补回来!\n\n从此军区大院多了个日常囤货赶海、偶尔发疯怼人、偏偏被大佬宠上天的奇葩军嫂。\n\n（空间在手，粮食我有；一胎五宝，老公腿软腰好。）\n ", "tags": ["年代", "现代言情", "空间", "穿书", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成对照组女配我把男女主玩疯了", "fullTitle": "穿成对照组女配我把男女主玩疯了", "link": "https://fanqienovel.com/page/7635566031313849406", "data": [5.9, 6.38, 7.09], "trend": 1.19, "latest": 7.1, "wordNumber": 269162, "creationStatus": 1, "desc": "顾昭昭穿成一本对照组小说的妯娌女配，最恶心的是她还获得一个女主助攻暴击系统。\n　　对照组还不够，还要她为女主服务是吧。\n　　既然这样玩，那就别怪她了。\n　　好孕多子？一胎十宝不用谢。\n　　心地善良，随手一救就是贵人？一个贵人哪够，百倍暴击，一下晕倒一百个在她前面，吓不死她！\n　　男配都爱她，二三四个男配哪里够，直接来个千倍暴击，男主头上青青草原。\n……\n只是这个她随便将就一下的男人是怎么一回事，怎么就黏上甩不掉了。\n谢彦平好不容易娶了个妻子，老婆没心没肺就算了，还总想把他甩掉，谢彦平表示，是他的，就永远是他的，想跑，打断腿哦~~~", "tags": ["年代", "现代言情", "系统", "穿越", "魂穿", "家长里短"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰满作精美人：诱哄硬汉生崽续命", "fullTitle": "丰满作精美人：诱哄硬汉生崽续命", "link": "https://fanqienovel.com/page/7655235611619494937", "data": [6.13, 6.75, 6.89], "trend": 0.76, "latest": 6.9, "wordNumber": 169825, "creationStatus": 1, "desc": "（年代丰腴坏美人+面凶糙汉+养崽+生理性喜欢）\n秦含香生的美貌，但实在恶劣，她家道中落，要过好日子，结了婚也不安分，被渣男骗的人财两失。\n检测到宿主的恶毒虚荣爆表了！寿命只剩0,01天，但如果宿主愿意绑定生子系统，攻略男主，就可以返现生命值哦。】\n秦含香好奇的问：“男主，谁啊？”\n【被你卷了家产抛弃的未来大佬霍征啊。】\n嘶…她那个整天凶巴巴的老公？秦含香可是把人得罪死了的。\n她还记得她到处造谣是霍征生不出来，绝嗣！\n“他？他不行，他生不出孩子。”\n【嘿嘿，现在不是有我这个生子系统了嘛，保准宿主一夜揣崽！】\n　……\n霍征出完车刚回来，就看见穿着清透薄裙子的美人娇滴滴的扑到他怀里，满手的软玉生香。\n“老公，你怎么才回来啊，我都等不及了呢~”\n霍征低头看她，漆黑眼眸又沉又怒，“你不是跟人跑了吗？”\n秦含香踮起脚尖亲亲他的唇：“看了别人，还是我老公好，老公，我给你生儿砸好不好？”\n女人的嘴，骗人的鬼，但霍征是真喜欢她这坏透了的样子，管她耍什么花招，他打横抱起人进屋。\n一年后…霍征又幸福又满脸苦相的看着三个大胖小子，“媳妇儿我们绝对不能再生了！我去结扎。”", "tags": ["年代", "现代言情", "作精", "系统", "破镜重圆", "情有独钟", "婚恋"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零恶妻一胎四宝科研大佬跪地哄", "fullTitle": "七零恶妻一胎四宝科研大佬跪地哄", "link": "https://fanqienovel.com/page/7641514479775124504", "data": [6.7, 6.7, 7.42], "trend": 0.73, "latest": 7.4, "wordNumber": 280716, "creationStatus": 1, "desc": "[年代+甜宠+生理性喜欢]\n一朝穿书，苏绾绾成了下放科研男主顾时砚的恶毒原配:骗婚、作妖、卖小姑子，下场是被马蜂蛰死在深山。\n苏绾绾：这破剧本谁爱走谁走。\n她上山挖参，进城经商，日子过得风生水起，顺带发现高冷丈夫看她的眼神越来越不对劲。\n直到骗婚真相败露，苏绾绾连夜揣着四个崽跑路，却被男人一把箍进怀里。\n顾时砚掐着她的腰，气息灼热：“骗了我的身，偷了我的心，现在还想拐走我的种？”\n苏绾绾心虚：“你不恨我？”\n顾时砚低头咬住她的唇:“恨，恨你半夜偷亲我，恨你怀了孕还敢跑，更恨你把我这颗心搅得稀巴烂。”\n他投降般抵着她的额头：“是我先沦陷了，行不行？”\n——\n多年后记者专访：“顾工，听说您和夫人的婚姻始于一场骗局？”\n顾时砚对着镜头浅笑，语气宠溺：“她爱我，才骗我。”\n全网炸了：原来这位国士无双的科研大佬，竟是骨灰级恋爱脑！\n苏绾绾磕着瓜子总结：高冷男人的恋爱脑，一旦上头，终生不愈。", "tags": ["年代", "现代言情", "乡村", "甜宠", "穿书", "大佬"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [4.71, 5.11, 5.42], "trend": 0.71, "latest": 5.4, "wordNumber": 163096, "creationStatus": 1, "desc": "（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "打脸", "群像", "家长里短"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "先婚后爱：大小姐被糙汉狠狠宠爱", "fullTitle": "先婚后爱：大小姐被糙汉狠狠宠爱", "link": "https://fanqienovel.com/page/7646781632002657342", "data": [5.52, 5.85, 6.08], "trend": 0.56, "latest": 6.1, "wordNumber": 159242, "creationStatus": 1, "desc": "【先婚后爱+恶女作精+狼兔文学+糙汉+疯批强制】\n一觉醒来胡若桃穿成昨晚看的年代文里对照组娇气恶毒女二。\n原书男女主是根正苗红的贫下中农，青梅竹马，因为原女主觉醒了治疗系统，帮助男主治好眼疾后，两人便在一起了，男主考上大学毕业后直接当了官，一路高升。\n相反，胡若桃和她的未来老公在特殊时期开始后就成了人人喊打的对象，过得好不凄惨。\n胡若桃当即立断收拾包袱去了乡下，她要先一步嫁给大佬，争取能在特殊时期过得安稳。\n——\n穹野因意外娶了个娇滴滴的大小姐，大小姐不仅要饮琼浆，食珍味，夜枕玉枕，身盖锦罗，而且不爽了就打他，天天把他当奴仆使，当狗喂，当马骑。\n村里人都说他命好，穹野只冷笑。\n后来———\n深夜。\n“穹野，我要现在！立刻！上山去捉兔子！”\n男人声音淡淡：“别胡闹。”\n大小姐气鼓鼓一翻身：“我不跟你玩了，我要去找舟舟！”\n男人伸手将人捞过来，捏住她的小脸，眼睛发红声音发狠：“我的乖宝，你说…你想找谁？”\n再后来——\n“听说没，穹野他媳妇跑了。\"\n“就说这小子没好的福气，守不住，他人呢？”\n“疯魔了，满地找媳妇呢。”\n注：大小姐是真的作。", "tags": ["年代", "现代言情", "乡村", "穿越", "先婚后爱", "作精"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零，拒绝换亲被疯批糙汉强宠", "fullTitle": "七零，拒绝换亲被疯批糙汉强宠", "link": "https://fanqienovel.com/page/7647848427442670617", "data": [7.49, 7.92, 8.01], "trend": 0.52, "latest": 8.0, "wordNumber": 171396, "creationStatus": 1, "desc": "【注意，1V2，女主冷静清醒，疯批跟糙汉是两个人，养娃，家长里短，乡村发家文，靠双手过日子，不是爽文，有兴趣的来看看】\n慢节奏农村生活\n\n总有小说里换嫁的，没人问问被换的男人愿不愿意。\n沈晚棠穿越到七零成了换嫁新娘里的作精女配。\n她还没闹呢。\n被换了新娘的男人不乐意了，\n雷霆手段后，原女主被迫嫁给了男主弟弟。\n两个男人对于谁归媳妇，展开看一场默契的较量", "tags": ["年代", "现代言情", "乡村", "宠妻", "穿越", "家长里短"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我老公是年代文里女主的白月光", "fullTitle": "我老公是年代文里女主的白月光", "link": "https://fanqienovel.com/page/7646365309284142104", "data": [5.24, 5.41, 5.73], "trend": 0.49, "latest": 5.7, "wordNumber": 294766, "creationStatus": 1, "desc": "【年代+穿书+不下乡+空间+日常流+甜宠+养崽+搞事业】\n胎穿18年，直到结婚第二天，苏甜才知道，自己穿书了。\n不仅如此，她还抢了女主白月光，顺利从名字都没出现过一次的路人甲，晋升成头号女配。\n女主啥事都想跟她比一下。\n女主是城市户口，她是农村户口，刚傲气两天，就想到以后拆迁，农村能分到三倍多拆迁款，女主又沉默了。\n女主成为电厂正式工，还没来得及炫耀，转头她就考上电厂干部。\n女主三年抱俩，暗地里笑她是不下蛋的母鸡，结果她一胎三宝，直接弯道超车。\n女主高兴考上全国首一的大学，就看见她以第一名的成绩成为运动后首批研究生。\n改革开放，女主创业开饭店，做老板，买大奔，风光无限，却不想苏甜手里早已经控股十数家公司，成了名副其实的企业家。\n女主终于崩溃了，红着眼问：“为什么？明明我才是女主，为什么哪里都比不上你？”\n苏甜靠在真皮沙发上，端起茶杯，慢悠悠地吹了口气，矫揉造作地笑了笑：\n“我也没办法，谁让姐从小就那么优秀呢？”\n“你要真想翻盘，可以等老了死在我前面，然后早投胎几年——说不定下一辈子，我就输你了。”\n女主：“……”", "tags": ["年代", "现代言情", "空间", "甜宠", "穿书", "养崽"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书后，替下乡的真千金回城了", "fullTitle": "穿书后，替下乡的真千金回城了", "link": "https://fanqienovel.com/page/7645665457105554494", "data": [7.41, 7.57, 7.82], "trend": 0.41, "latest": 7.8, "wordNumber": 286416, "creationStatus": 1, "desc": "评分刚出会涨【学霸+打脸+虐渣+利己主义+爽文+不憋屈+双强】\n沈晚秋睁眼穿成年代文替养女下乡早死的炮灰。\n醒来后，夺空间，撕极品，把伤害过原主的人尽数清算。\n恢复高考，她凭惊人学识轰动全国，高调回京。\n抛弃她的一家慌了。那个被扔到乡下的女儿，竟强势归来。\n情亲绑架？她当众撕破虚伪嘴脸。\n道德绑架？可惜她没有道德，一巴掌扇翻所有人\n身份压制？她已经是国家重点保护科研人员，地位今非昔比。\n一家人想她认祖归宗。\n“滚，你们不配叫我的名字”", "tags": ["年代", "现代言情", "乡村", "学霸", "强强", "打脸"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "拒做后妈，年代小辣椒嫁糙汉被宠", "fullTitle": "拒做后妈，年代小辣椒嫁糙汉被宠", "link": "https://fanqienovel.com/page/7649193113168137278", "data": [8.89, 9.13, 9.31], "trend": 0.41, "latest": 9.3, "wordNumber": 292517, "creationStatus": 1, "desc": "年代+闪婚+糙汉+不圣母+无金手指+发家致富+一见钟情\n姜舒柠作为家里的小女儿，日子还是相当悠闲的，这辈子最大的坎坷，大概就是差点被人骗去当后妈了吧。\n媒婆：哎呀，舒柠啊，小唐同志可是很优秀的，不知道多少人抢着嫁呢，就是照顾几个孩子，很容易的。\n笑话，她姜舒柠聪明又漂亮，怎么会给人当后妈，既然媒婆觉得小唐这么好，那给你女儿嫁好了。\n媒婆：我#￥%……&&\n姜舒柠本来是为了搬出家里，闪婚嫁给了这个沉默寡言的汉子，没想到这汉子看着粗心，实则心细，头脑灵活。\n俩人一起摆摊卖衣服、卖吃的，只要能赚钱，俩人都不怕苦不怕累，总算是拼下一份家业，再养几个崽崽，这辈子就圆满了。\n谭远没想到，一眼就看上的姑娘，竟然会嫁给他这个糙汉子，一直到老了，儿孙绕围着她嬉笑打闹，还总觉得这一生都是在做梦。", "tags": ["年代", "现代言情", "宠妻", "先婚后爱", "闪婚", "发家致富"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零吃百家饭长大我成了科研大佬", "fullTitle": "六零吃百家饭长大我成了科研大佬", "link": "https://fanqienovel.com/page/7650484467957517336", "data": [6.92, 6.92, 7.21], "trend": 0.29, "latest": 7.2, "wordNumber": 250195, "creationStatus": 1, "desc": "（评分低是因为刚开分）【有cp+年代土著+家长里短+学霸】\n陈松果生下来就成了孤儿，被村里的人一家一口饭养大。\n后来偶然发现陈松果聪明得厉害，大家拍案决定送五岁松果上学。\n拿成绩单时，村里人个个都抢着去。\n抠门的周奶奶说：“学费那么贵，你可得把知识都学进去了才划算！”\n所以陈松果使劲学使劲学，直接连跳两级。\n村里剥玉米费劲，陈松果就着书上的知识造了个玉米脱粒神器。\n村里人摸瞎舍不得点蜡烛，却攒钱买了一捆蜡烛给陈松果。\n陈松果就用废品站的材料手搓了个水力发动机，从此大林村家家用上了电灯。\n一步一步，陈松果把自己造进了研究院，成了院里最年轻的研究员。", "tags": ["年代", "现代言情", "乡村", "大佬"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [5.97, 5.97, 6.21], "trend": 0.24, "latest": 6.2, "wordNumber": 273023, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糙汉军官在大西北养了个娇气包", "fullTitle": "糙汉军官在大西北养了个娇气包", "link": "https://fanqienovel.com/page/76289 7], "trend": 7.61, "latest": 66.6, "wordNumber": 230129, "creationStatus": 0, "desc": "（女主控勿看，超高洁勿看，超敏感人群勿看，多视角，情感快，小说勿代入现实，未成年勿入）\n绿茶偏执阴暗男二VS温柔白月光\n温以宁从小就是人群里的月亮，温柔漂亮善解人意。高中时无数人下课挤在走廊，只为远远看她一眼，包括那个永远站在角落的沉默少年\n——陆斯年。\n后来她出国深造，那段岁月被彻底封存。\n直到某天，她的视野里突然飘过弹幕：\n——“男二好可怜，守护了女主一辈子，却从来没被爱过。”\n——“听说他有个白月光？那又怎样，白月光只是过去式。”\n——“可惜了，他注定要爱女主一生一世。”\n——“等等，白月光好像叫……温以宁？”\n她心头一震，顺着弹幕指引回国，见到了那个所谓的“男主”，也见到了陆斯年。\n陆斯年温柔体贴，是所有人眼中深情的男二，命中注定要守护原女主，爱而不得地过完这一生。\n系统告诉他：只要完成任务，就能再见到他的白月光。\n他其实找过温以宁，但世界规则像一睹透明的墙，他永远找不到她。\n而她也从来没有注意过他。\n于是陆斯年学会伪装，把偏执阴暗藏在温柔皮相之下，按部就班地扮演一个深情配角。\n只有陆斯年自己知道，所有体面都是装出来的，骨子里早烂透了。", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "豪门世家", "久别重逢"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小炮灰变美后，抢了财阀太子爷", "fullTitle": "小炮灰变美后，抢了财阀太子爷", "link": "https://fanqienovel.com/page/7654572647035964440", "data": [62.42, 62.42, 65.86], "trend": 3.44, "latest": 65.9, "wordNumber": 238046, "creationStatus": 1, "desc": "【穿书 + 贵族学院F4 +  娇柔大美人 + 勾引上位】\n冷厉傲慢第一财阀太子爷（193cm） × 纯欲娇柔炮灰大美人（168cm）\n铃兰小花妖渡劫失败，本该魂飞魄散，却意外绑定了炮灰系统，穿进一本贵族学院小说，成了同名小炮灰。\n原剧情里，她是女主林晓葵的好朋友，对照组的配平工具人。\n对花心浪子温衍一见钟情，深情不移，最终嫁入豪门。\n可甜文结局的背面，是浪子永不回头，是情人和私生子登堂入室，是小产后再也不能生育，是抑郁而终。\n而她的好姐妹林晓葵，却嫁给了第一财阀太子爷司凛，人人称羡。\n穿过来那天，阮棠看着镜子里灰扑扑的原主。\n再看她灵魂带来的属性点：冰肌玉骨、倾城之貌、杨柳细腰、内媚天成……\n每一样都是她原本拥有的东西，但没有气运值，一样也解锁不了。\n而这个世界的气运，集中在圣澜学院执事团的四个天之骄子身上，尤其是执事之首：司凛。\n阮棠想得很清楚：既然要蹭气运，为什么要蹭温衍那个浪子的？\n要蹭，就蹭最大的那个。\n排雷：F4贵族文学，非NP，不买股。", "tags": ["现言脑洞", "现代言情", "系统", "穿书", "豪门世家"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "人类饲养员：自己的老婆自己养", "fullTitle": "人类饲养员：自己的老婆自己养", "link": "https://fanqienovel.com/page/7657302630409964569", "data": [9.54, 10.35, 10.77], "trend": 1.23, "latest": 10.8, "wordNumber": 129890, "creationStatus": 1, "desc": "【新书刚开分，后面会涨】\n好吃懒做怂包女主VS严谨到变态的外星男主\n【人外，强制爱，触手】\n昭晨好被包养了，不对，被饲养了。\n也不对，准确来说，是被一个不明生物饲养了。\n这个有着人类外表却时不时能够变换形态的“人”强行带走她，成为了她的饲养员。\n为了照顾好她，严格地按照人类饲养手册执行。\nViner：必须早睡早起。\n长期日夜颠倒的昭晨好：“……”\nViner：一日三餐必须吃。\n饮食毫无规律的昭晨好:“……”\nViner：要适当的运动。\n能躺绝不坐着的昭晨好:“喂！这算哪门子运动！”\nViner一本正经：“适当的亲密关系运动也是运动。”", "tags": ["现言脑洞", "现代言情", "幻想言情"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [6.84, 6.84, 7.94], "trend": 1.11, "latest": 7.9, "wordNumber": 175467, "creationStatus": 1, "desc": "（新书 刚开评分）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“……要。”\n\n她是他的血养出来的妖，也是他这辈子唯一的因与缘。\n（女主控放心观看，纯甜无虐）\n（很甜！！甜的发腻！！不爱看甜的勿入）", "tags": ["现言脑洞", "现代言情", "双洁", "精灵", "幻想言情", "双向奔赴", "情有独钟"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越星际兽世：成为虚拟偶像顶流", "fullTitle": "穿越星际兽世：成为虚拟偶像顶流", "link": "https://fanqienovel.com/page/7655195003299318809", "data": [7.99, 8.53, 8.98], "trend": 1.0, "latest": 9.0, "wordNumber": 186951, "creationStatus": 1, "desc": "【星际兽世+主事业线无CP+非女强文，妹宝女主（有明月独不照我情节）+雌少雄多+万人迷+雄竞+系统】\n云岁穿越到了雌少雄多的星际兽世。\n\n\n\n云岁穿越前身体已经火化。\n\n系统绑定她后，用最后能量保住了她的灵魂带她穿越，要重新造出身体需要100亿星币能量。\n\n由于系统规则，虽然它的科技水平大于这个世界的水平，却不能做违法乱纪的事情，只能云岁自己想办法赚钱获得身体。\n\n云岁眼前一黑，虽然不知道1星币多少钱，但100亿就让人感觉人生无望了，其实当阿飘挺好的。\n\n系统却告知由于雌性在星际兽世过于稀少，现在很流行虚拟偶像，是大流量，操作好会很赚钱。\n\n云岁为了拥有新身体，注册了成为恋爱向虚拟偶像。\n\n想原来世界，恋爱向抽卡类虚拟偶像都很赚钱，云岁磕绊在系统的掩护下大胆出击，给这个荒芜的精神世界带来一次次的精神盛宴。\n\n每一次的打歌，舞台，综艺，影视，联动，都引爆全网。\n\n后来云岁拥有了最大的后援会。\n\n云岁生日当天全国大屏庆生。\n\n云岁联动全星铁刷屏。\n\n成星际兽世第一顶流。\n\n众多位高权重的大人物不相信怎么完美的云岁是虚拟偶像，世人觉得他们疯魔，查探证明她是真的，结果越扒越有！\n最后云岁掉马。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "星际", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漂亮笨蛋穿成恶女配！夜夜被亲哭", "fullTitle": "漂亮笨蛋穿成恶女配！夜夜被亲哭", "link": "https://fanqienovel.com/page/7653869565612411928", "data": [8.77, 8.77, 9.34], "trend": 0.57, "latest": 9.3, "wordNumber": 169579, "creationStatus": 1, "desc": "【万人迷不自知+雄竞+强制爱+体型差+男洁】\n【可爱迷人娇憨糊涂蛋×阴湿男鬼/疯批/病娇】\n苏桃一睁眼，穿成三本男频文的恶毒女配。\n【系统：你是绿了未来大佬（学霸版）的捞子前女友；践踏落难太子爷的势利未婚妻；潜规则顶流未遂，便雪藏的黑心老板。你的任务是欺辱男主，刺激他们逆袭。】\n苏桃结结巴巴：“我我不行，你换个人吧。”\n【系统：只要男主成功逆袭，保你发财。】\n于是，史上最窝囊恶毒女配出现了。\n她边掉小珍珠边扇男主：“穷光蛋！”\n男主握住她颤抖的手，眸光微暗：她手好香。\n她哆哆嗦嗦对男主伸脚，声音越来越小：“把我鞋子舔干净，不然我退婚。”\n男主喉结滚动：“别的地方，不需要*干净吗？”\n她发消息威胁男主：“来我房间，不然雪藏你。”\n男主深夜敲门：“姐姐开门。”\n苏桃：“我在欺负你们啊！看不出来吗？”\n殊不知她红着眼眶装凶的样子，比撒娇还勾人。\n\n—小剧场—\n眼看剧情崩坏，苏桃拿着当初天使投男主赚的巨款连夜跑路，可还是被男主们找到了。\n苏桃：“我以后再也不欺负你们了。”\n男主：“你必须继续欺负。”\n后来，被欺负得死去活来的，是她。\n\n【阴湿男鬼高岭之花学霸】\n【被欺上瘾腹黑恶犬太子爷】\n【又争又抢白切黑病娇年下】", "tags": ["现言脑洞", "现代言情", "系统", "学霸", "腹黑", "病娇"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "唯一人类在兽世，当养成虚拟偶像", "fullTitle": "唯一人类在兽世，当养成虚拟偶像", "link": "https://fanqienovel.com/page/7642136290401471512", "data": [16.16, 16.51, 16.59], "trend": 0.43, "latest": 16.6, "wordNumber": 164234, "creationStatus": 1, "desc": "【万人迷+雄竞+修罗场+玛丽苏+多男+男全洁】\n\n十万个兽人里面，才能降生一个雌性。\n江月白穿越到星际兽世，整个人都傻眼了。\n\n倒不是受不了悬殊的男女比例，而是她处境格外尴尬。\n身为纯种人类，身形娇小，没办法幻化兽形，也感知不到任何信息素，被认定为了残疾兽。\n只能靠着拾荒勉强糊口过日子。\n\n江月白索性放手一搏，打算注册星网账号，做这个世界不被认可的养成系虚拟偶像。\n……\n雄性兽人都格外关注雌性相关动态，却十分抵触虚拟账号。\n这类账号全是雄性运营，根本没人愿意为此消费，甚至还会遭到攻击。\n江月白的账号，刚上线就遭到不少谩骂吐槽。\n直到她发出一张图，小小的雌性蜷缩在昏暗角落，配上简简单单一句：\n月月好饿。\n这下直接引爆全网，无数兽人看的心软动容。\n帝国元帅豪气打赏：“给我的月月买大房子！”\n神圣祭司稳居榜一，满心惦记发问：“月月动态怎么还没有更新？”\n皇族太子更是出面撑腰：“谁敢随意抹黑月月！等着瞧！\n……\n江月白捞够就想跑，害怕自己人类身份暴露。\n谁料刚踏出家门，就被身形挺拔的雄性一把抵在墙上，对方语气满是激动：\n“月月，原来你真的是雌性！”", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "星际", "养成"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [5.18, 5.18, 5.61], "trend": 0.43, "latest": 5.6, "wordNumber": 222407, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开个酒吧，客人天天求着我唱歌", "fullTitle": "开个酒吧，客人天天求着我唱歌", "link": "https://fanqienovel.com/page/7657918129305029657", "data": [5.23, 5.59, 5.46], "trend": 0.22, "latest": 5.5, "wordNumber": 188965, "creationStatus": 1, "desc": "【文抄公/只在酒吧唱歌/女主不走娱乐圈，专注咸鱼人生与快乐后宫/多男但无男主，男全C】\n胎穿到平行世界，戚曼这辈子就一个念头——当条咸鱼，把上辈子猝死没享的福都补回来。\n跟着舅舅长大，毕业接手酒吧，靠着万物系统把生意做得风生水起。\n谁知一次意外救场，她随手扔出三首原创《慢慢喜欢你》《遇见》《阴天》，一夜之间全网炸裂。\n从此，她的酒吧座无虚席，各路大佬挤破头只为占个座。\n可她是条有原则的咸鱼。\n任凭全网疯求，她只答应每周随机唱一首，多一句都不可能。\n有人砸钱，有人递权，还有人……直接送男人。\n钱和权她眼皮都不抬一下，但送到嘴边的美人，她照单全收。", "tags": ["现言脑洞", "现代言情", "系统", "无CP", "穿越", "胎穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成男频文男主的虚荣妹妹", "fullTitle": "穿成男频文男主的虚荣妹妹", "link": "https://fanqienovel.com/page/7641540435936021529", "data": [4.68, 4.68, 4.79], "trend": 0.11, "latest": 4.8, "wordNumber": 138747, "creationStatus": 1, "desc": "【双洁+系统】\n任柚穿书了，穿成了假冒男主救命恩人的炮灰女配。\n　　为了报答恩情，男主承诺以后会将女配当做亲妹妹看待。\n　　有了男主妹妹这个身份之后，原主作威作福，铺张浪费，把能得罪的人给得罪了个遍。\n　　最后事情败露，得到了一个被众人厌弃、贫困潦倒的下场。\n　　……\n　　穿过来的时候，原主已经把男主给得罪狠了。\n　　救命之恩的功劳已经冒领。\n　　其他的谎也撒了一个又一个。\n　　为了保命，任柚没办法，只能继续哄，继续骗。\n　　每天哥哥长哥哥短，天天把哥哥挂嘴边。\n　　于是，男主身边亲近的朋友渐渐知道了，男主多了一个黏人嘴甜的妹妹，会哄人，会撒娇。\n　　……\n　　后来，冒充救命恩人一事还是曝光了，任柚忐忑不安地等着被清算。\n　　她想，她当了这么久的乖巧妹妹，有没有一点可能，她还是继续给男主做妹妹呢？\n　　结果下一秒，她就听到男主说，“其实，我早就不想当你哥哥了。”\n　　任柚：？？？\n　　“我只想做你的男朋友。”\n　　任柚：！！！\n　　……\n　　小剧场：\n　　朋友聚会，有朋友调侃，“你之前不还说你这个异父异母的假妹妹谎话连篇嘴里没一句真话？现在什么情况？”\n　　凌序棱语气淡淡，“但是她只骗我一人，只哄我一个，这不是爱又是什么？”", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "双洁", "魂穿"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "保姆我在富贵窝里看冷暖", "fullTitle": "保姆我在富贵窝里看冷暖", "link": "https://fanqienovel.com/page/7646938862643579928", "data": [5.66, 7.73, 8.09], "trend": 2.43, "latest": 8.1, "wordNumber": 264978, "creationStatus": 1, "desc": "Hello，书友们好～我是王拉弟，一个爱记录、爱唠嗑的保姆。\n\n“不算计，能在别墅里挣上钱吗？”——可我这算计啊，都在心里，厚道嘛，得摆在脸上。\n\n我骑着那辆破二手电驴，进过500平的大铁门。见过高贵女主人背地里的眼泪，偷听过美丽太太心里的肮脏；这一家表面光鲜，那一家内心宽容。种种不同，我都见过……\n\n可我也得低头——低头看着丈夫那条伤腿，低头数着儿子的学费，还得低头闻一楼飘上来的那股子馊臭味。\n\n大强子总劝我：“嘴牢，装傻，把钱挣了。”\n\n可当我推开那扇门，才发现——这人间烟火太烫嘴，这世态炎凉太扎心，我又怎能真的视而不见？\n\n我这一辈子，在别人的屋檐下躲过雨，也在自家的车库里生过火。人说三十年河东，三十年河西，我看惯了高楼起，也看厌了宴席散。到头来才明白：那呛人的烟火味，才是活着的底气。\n\n——谨以此书，献给我中国普通的母亲，也致敬每一位用力活着的平凡人。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [4.76, 4.92, 5.53], "trend": 0.76, "latest": 5.5, "wordNumber": 203472, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲相到高中物理老师", "fullTitle": "相亲相到高中物理老师", "link": "https://fanqienovel.com/page/7654979133981608985", "data": [4.59, 4.59, 5.28], "trend": 0.69, "latest": 5.3, "wordNumber": 168958, "creationStatus": 1, "desc": "沈书言的十七岁，有两个解不开的难题。 一个是物理，一个是尚睿。\n他是隔壁班的物理老师，穿白衬衫很好看，讲题的时候声音很低。 她不是他班的学生，但是总喜欢在他们班物理下课的时候去等闺蜜，借此看一眼他。\n拍毕业照那天，想跟他单独合影，但是没有理由，她以为这就是结局。\n四年后。 她是楼管，他是一个普通的顾客。 四目相对的那一刻，她听见自己心跳的声音。 \n更离谱的是 —— 过年回家相亲，对面坐的人，又是他。\n尚睿看着她，眼底带着诧异： \"好久不见？。\"\n原来不是她一个人的独角戏；\n原来物理题不会没关系；\n原来他在身边，就够了。", "tags": ["职场婚恋", "现代言情", "久别重逢"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "清冷万人迷每个世界都被强取豪夺", "fullTitle": "清冷万人迷每个世界都被强取豪夺", "link": "https://fanqienovel.com/page/7624910386143169598", "data": [3.9, 3.9, 4.59], "trend": 0.69, "latest": 4.6, "wordNumber": 260190, "creationStatus": 1, "desc": "新书刚开分 读者宝宝说会涨૮₍♡>𖥦<₎ა💗  \n【微墙纸】➕【男全c】➕【上位者低头】➕【1vn】➕【万人迷】\n清绝美人清茉：禁欲无爱。\n顶级权贵们：爱！很爱！非常爱！\n\n无爱论女医生 ʚɞ 各色权贵大佬\n温清茉是顶尖外科女医生，信奉无爱一身轻，偏偏被各色顶级权贵同时盯上。\n\n💰沉稳绅士的商界新贵靳衍，倾尽资本权势，也要将她留在身边；\n☠妖冶危险的掌权者秦来，红着眼嘶吼:“我说过，我很长情的;”\n🚔冷戾桀骜的刑警陆沉修，以爱为名，将她圈在身下，分毫不让。\n全员疯魔，祈求博她一丝怜爱。\n\n*\n第一卷结束介绍清茉和三三 \n\n💌排雷！\n1.有墙纸❤️\n2.剧情较长\n3.非大女主文", "tags": ["职场婚恋", "现代言情", "职场", "医生", "强强", "追妻火葬场"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一纸借调，顶头上司竟是我前男友", "fullTitle": "一纸借调，顶头上司竟是我前男友", "link": "https://fanqienovel.com/page/7641060152770055192", "data": [6.1, 6.34, 6.72], "trend": 0.62, "latest": 6.7, "wordNumber": 260266, "creationStatus": 1, "desc": "【久别重逢+破镜重圆 + 体制内职场+双洁he 】\n\n许诗念这辈子最后悔的事，不是跟江时序谈恋爱，也不是没跟他去京北。\n是她妈当年说的那句“女孩子当老师好，稳定”。\n稳定到，五年后她的前男友成了她的顶头上司的顶头上司的顶头上司。\n——\n暑期，一纸借调令，砸碎了许诗念的暑假梦。\n然后，她遇到了那个人。。\n那个人，五年前她喊他“江时序”，他在她宿舍楼下等两个小时也不催她。\n现在她得喊他一声“领导”。\n并且他不用等任何人。\n……\n★因为是体制文，简介比较简单。\n喜欢体制，久别重逢，破镜重圆这个题材，可移步正文观看！！！", "tags": ["职场婚恋", "现代言情", "职场", "破镜重圆", "双洁", "久别重逢"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，我不再做小城乖女儿", "fullTitle": "重生后，我不再做小城乖女儿", "link": "https://fanqienovel.com/page/7658113549268421656", "data": [2.87, 3.15, 3.41], "trend": 0.55, "latest": 3.4, "wordNumber": 194254, "creationStatus": 1, "desc": "【重生觉醒+一步一个脚印+无金手指+女性独立+女强+成长】 \n蔡庭芳死在四十一岁那年。\n她这一生，听父母的话，放弃大城市高薪工作，回县城当“稳定”的乖女儿；听亲戚的话，嫁给“条件不错”的男人；听丈夫的话，顾家、带娃、伺候老人；听单位的话，加班、背锅、替人收拾烂摊子。\n最后，她病倒在医院，丈夫计较治疗费，婆婆嫌她拖累家里，父母还劝她忍一忍。 \n直到死的那一刻，蔡庭芳才发现，一辈子的逆来顺受，只给她带来了一生悲剧。\n难道我生来就该死？连活下去都要看别人脸色？这一切到底凭什么！\n再睁眼，她回到二十四岁那场相亲饭局。周家端着架子说：“女人结婚后，还是要以家庭为主。”\n所有人都等着她点头。\n蔡庭芳只做了三件事。退婚。拿回工资卡。拖着行李箱搬出家门。\n她没有系统，没有空间，没有天降贵人，也不靠彩票暴富。\n她只有一张余额六千八的银行卡，一间月租六百五的小屋，一个清大毕业的脑子，和重活一次后再也不肯低头的狠劲。\n没有什么能困住女人，也没有什么能困住蔡庭芳。", "tags": ["职场婚恋", "现代言情", "重生", "打脸", "职场", "家庭", "虐渣"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "秦律师，复合吗", "fullTitle": "秦律师，复合吗", "link": "https://fanqienovel.com/page/7620095920746531865", "data": [3.51, 3.75, 4.05], "trend": 0.54, "latest": 4.1, "wordNumber": 223455, "creationStatus": 0, "desc": "【破镜重圆，1v1，追妻火葬场】\n【傲娇律师x明艳大美人】\n对家举报姜岁禾拍小视频传播盈利。\n姜岁禾气不过，找律师反击。\n律师是她前男友。\n前男友看完视频，阴阳怪气：\n“分手四年，你涉猎的知识不少。”\n姜岁禾解释：“只是借位而已。”\n“他把手放在你的腰上，揉捏，摸蹭，也是借位？”\n姜岁禾：“……”\n-\n委托秦律师的第一天。\n他公事公办，眉眼料峭：“把我从黑名单里放出来，后续同步向你跟进。”\n委托秦律师的第二天。\n他一本正经，收集材料：“你和拍视频那男的是否发生过x关系？”\n“你们是什么关系。”\n“私下接触过最深有多深。”\n姜岁禾：“？”\n委托秦律师的第三天。\n姜岁禾被他堵在公司门口，面无表情的三个字：\n“下班了？聊会案子。”\n姜岁禾：“……”\n就这么点案子，要聊这么多次吗？\n-\n秦律师说他从不吃回头草。\n根本没想过复合这回事。\n天下女人多得是，他又不是找不到。\n分手这么多年，感情早就淡了。\n朋友：“天塌下来还有秦律师的嘴顶着。”\n-\n小剧场：\n某天。\n姜岁禾说：“我想生个优秀的宝宝。”\n秦律师拿出从3岁到30岁的辉煌战绩，精彩履历，智商测试高分表，矜持而傲娇地开口。\n“你看我的基因行吗？”", "tags": ["职场婚恋", "现代言情", "破镜重圆", "律师", "追妻火葬场", "1v1"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宋医生，新婚请指教", "fullTitle": "宋医生，新婚请指教", "link": "https://fanqienovel.com/page/7651566622582246425", "data": [4.12, 4.42, 4.62], "trend": 0.49, "latest": 4.6, "wordNumber": 256831, "creationStatus": 1, "desc": "【清冷医生vs乖张网红】　\n【年上DADDY·年龄差八岁·青梅竹马·先婚后爱】\n宋鹤眠娶了亲手带大的小姑娘。\n两家世交，娃娃亲，他大她八岁。她从穿纸尿裤起就是他看着长大的，幼儿园接送、小学开家长会、初中辅导作业……她人生的每一个阶段，都有他的影子。\n江稚：我现在是个成熟的大人了！\n宋鹤眠：成熟的大人会在凌晨两点因为空腹吃布洛芬被送进急诊？\n江稚：……那是意外。\n宋鹤眠：成熟的大人会连续一周 扭，嘴硬心软的妖神父神，\n一边是清冷温柔，禁欲圣洁的仙尊父尊。\n缺爱半生，执念有家的叶黎，化身三界最强月老，疯狂花式撮合双亲，在线维和！\n不曾想，天道选中他，本就是宿命安排。\n他对“家”的纯粹执念，竟是化解仙妖魔万年恩怨的唯一解药！\n从此，曾经任人欺凌的小可怜，逆袭成仙妖魔团宠！\n双大佬争锋护崽，全员读心吃瓜围观宠崽！\n崽有CP！后期主要剧情线！\n", "tags": ["玄幻言情", "重生", "团宠", "双洁", "1v1", "养崽"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "成为美强惨龙崽的早逝娘亲", "fullTitle": "成为美强惨龙崽的早逝娘亲", "link": "https://fanqienovel.com/page/7645232910252919870", "data": [3.98, 4.8, 5.49], "trend": 1.51, "latest": 5.5, "wordNumber": 133384, "creationStatus": 1, "desc": "【温柔老实妹宝×冷漠偏执龙龙】\n【双洁+1V1+人外+男强女弱+体型差+一见钟情+温馨治愈】\n（简介是儿子殷珩视角）\n殷珩重活一世，回到一千年前，只有一个任务：阻止爹娘相爱。\n他娘是世界上最好的人，他爹是条脑子有病的龙。\n在上一世，娘亲嫁给他爹没几年就去世了，他不想让娘亲重蹈覆辙，即便自己也会消失。\n好消息是：他重生得够早，两人根本不认识。\n坏消息是：不管他怎么阻止，那龙还是来了，而且对娘亲一见钟情。\n不仅如此，追人的方式还笨得要命：\n今天送灵石，明天往她枕头底下塞银票，后天面无表情地站在她家门口，开口就是：“我没家了，能收留我吗？”。\n云绵一脸茫然：“这位公子，我并不知道您是怎么了。”\n殷珩坐在屋顶上看着这一切，心情愉悦，甚至还想鼓掌。\n追姑娘追成这样，也是种本事。\n殷珩觉得这开局稳了，就他爹这个追法，不把娘吓跑才怪。\n可云绵偏偏觉得殷寂“挺有意思的”。\n某天，她拉着殷珩问：“阿珩，你了解隔壁那位殷公子吗？他这个人虽然奇怪，但好像…还挺不错的。”\n殷珩两眼一黑，苦口婆心地劝：“…不怎么样，他长得丑，心也黑，不是良配！”\n云绵羞赧：“你胡说，他长得不丑。”\n殷珩站在原地，仰头望天。\n他明明是回来拆散他们的。\n怎么变成助攻了？", "tags": ["玄幻言情", "独宠", "幻想言情", "宠妻", "团宠", "双洁", "HE"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [7.83, 7.83, 8.82], "trend": 0.99, "latest": 8.8, "wordNumber": 229690, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法：被迫组队后高冷队长沦陷了", "fullTitle": "魔法：被迫组队后高冷队长沦陷了", "link": "https://fanqienovel.com/page/7649235070481353753", "data": [6.89, 6.89, 7.67], "trend": 0.77, "latest": 7.7, "wordNumber": 231908, "creationStatus": 1, "desc": "【高智商傲娇巫族公主VS高冷禁欲灵族公爵】\n魔法+言情+团队救世\n朗瓦西星球有三类人：会魔法的灵者、作战强的曜士、通巫术的巫主\n三千年前，灵、曜两族诞下五灵守护者，对灭世的不死女巫艾拉进行世代封印\n三千年后，新一届守护者诞生，五位圣灵者肩负救世使命。\n巫族公主蒂泠，出了名的任性，翘课、炸学校、学禁术\n然而，一则消息震惊世界\n蒂泠成了三千年来第一位来自巫族的圣灵者——智之灵\n让“恶霸”拯救世界？\n众人：谁说看不见星球的未来？这不是一眼就看到头了\n灵息学院，\n所有人都想进的三族最强学府，一心摆烂的蒂泠被强制保送\n灵息优等生缪辞，是灵族最年轻的公爵，也是众望所归的五灵守护者队长玄之灵\n蒂泠来前：高冷，沉稳，尽在掌握\n蒂泠来后：头疼，善后，怀疑人生\n算了，赶紧封印艾拉，大家好聚好散\n…\n一次意外，蒂泠灵印消失，决定独自离开。\n黑暗的房间内，她被吻的喘不过气，用力推开他，“队长，我不是圣灵者了，好聚好散吧。”\n男人眼尾浸红，额头贴着她的耳朵，薄唇轻吻她的脸颊，“你觉得呢？我的公主殿下。”\n撩也撩了，摸也摸了，要负责了，人就跑了\n女孩理亏的偏过头，缪辞都气笑了，指尖扣住她的下颌，迫使她面对自己，学着她曾经恶劣的语气\n“不接话？那就接吻。”", "tags": ["玄幻言情", "校园", "幻想言情", "星际", "冰山", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "洪荒：罗睺三岁闺女被收入截教了", "fullTitle": "洪荒：罗睺三岁闺女被收入截教了", "link": "https://fanqienovel.com/page/7660710214282251326", "data": [3.14, 3.54, 3.9], "trend": 0.77, "latest": 3.9, "wordNumber": 131907, "creationStatus": 1, "desc": "【洪荒+三岁半+扮猪吃虎+反向反派+团宠养成+迪化量劫+爆笑截教】\n魔界太小，装不下三岁半魔宝魔小乖的“灭世大志”。\n罗睺看着被闺女拆完的魔宫，连夜将她丢进了洪荒。\n【宿主，你的大反派系统回来了，发布灭世任务：污染洪荒水源！】\n然而，系统与魔小乖双双记忆缺失功德系统变成反派灭世系统。\n魔小乖迈着小短腿，将万魔毒煞倒进黄河，瞬间净化了洪荒积攒亿万年的地煞浊气！\n天降无量功德，金光照亮三十三重天！\n路过的通天教主看着浑身功德金光，奶凶奶凶喊着我要毁灭世界的魔小乖，整个人都懵了。\n“这孩子杀气腾腾却功德无量，简直是为我量身定做的亲传弟子！”\n于是，截教多了一个立志灭世的混世魔王。\n多宝：“小师妹，今天我们去毁灭哪个大教？”\n三宵：“谁敢拦着小师妹灭世，先过我们九曲黄河阵！”\n魔小乖哭红了眼：“我真的是坏人，天道再发小红花了，窝就代表大道灭了泥！”", "tags": ["玄幻言情", "系统", "扮猪吃虎", "团宠", "反派", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "孩子们救一下，遇到冲徒逆师了", "fullTitle": "孩子们救一下，遇到冲徒逆师了", "link": "https://fanqienovel.com/page/7656761759016963096", "data": [2.61, 2.61, 3.24], "trend": 0.63, "latest": 3.2, "wordNumber": 126990, "creationStatus": 1, "desc": "【玄幻言情】【单女主】【双洁】\n救命！救命！\n司砚清连滚带爬冲进凌霄峰主殿，一把抱住那抹白衣的腿\n刚被测出时空双灵根，升灵台上万众瞩目，本该是他富贵的起点，结果不知怎么就得罪了那气运之子\n他不过是在对方吃饭时扔了点“小玩意儿”\n那人竟带着一整个上古世家追杀他！\n南宫寒玥低头看着自己这个便宜徒弟，额角一跳\n时空双灵根，万年不遇，跟她一模一样\n天赋是顶天的，惹事的本事也是顶天的\n“起来”她冷声道\n“师父不答应我就不起！”\n往后百年，她替他平了三十六桩祸事，救了他不下百次\n司砚清倒是心安理得，甚至愈发嚣张——反正有师父兜底\n直到那夜，他被师父唤进寝殿\n“有好吃的？”\n他眼睛一亮，毫无防备地跨进门\n下一刻，眼前一黑，神识被封，灵力被锁\n“师父？这不对劲吧？”\n南宫寒玥修长的手指挑起他的下巴，唇角微扬\n“乖，这可太对了”\n后半夜，司砚清的声音从殿内传出，带着哭腔不停的蹬着腿：“下去！你下去！不带这样的——”\n后来全宗都知道了，凌霄剑宗那位绝代天骄的师徒关系，好像跟他想象的……不太一样", "tags": ["玄幻言情", "穿越", "今穿古"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主为爱发疯，但你只想好好活着", "fullTitle": "男主为爱发疯，但你只想好好活着", "link": "https://fanqienovel.com/page/7652408518770691096", "data": [6.52, 6.54, 7.0], "trend": 0.49, "latest": 7.0, "wordNumber": 251397, "creationStatus": 1, "desc": "【强调：本文为黑泥向纯代入乙女，有大量g向恐怖描写，男主神经病非人类较多，不要用正常三观对待】\n穿越后，你没有得到金手指，也没有万人迷光环，甚至被某个变态给缠上了。\n什么？他是气运之子，天道宠儿？\n可这个世界是疯掉的世界，气运之子也都是疯子。\n所以你选择了逃跑。\n那就请在保住命的情况下确保自己不被抓住吧。\n\t\n他说他会吃掉你，从头到脚，拆吃入腹。", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [2.66, 2.85, 3.04], "trend": 0.39, "latest": 3.0, "wordNumber": 257103, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "剑修", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "休了四个兽夫后，我契约了六个", "fullTitle": "休了四个兽夫后，我契约了六个", "link": "https://fanqienovel.com/page/7557391657260289086", "data": [4.54, 4.77, 4.86], "trend": 0.32, "latest": 4.9, "wordNumber": 250445, "creationStatus": 1, "desc": "（穿越+大佬+兽魂+强制契约+升级流+1vN）\n林清蕴修炼千年的灵符师，穿到第一天，以为自己拿的是女强爽文剧本。\n直到她低头一看——无灵根，蜗牛兽魂，凡品垫底。\n四个契约兽夫嫌她废物，把她扔在贫民区铁皮房里自生自灭。\n亲妈把她扫地出门，亲妹设局陷害，路过的人都要啐一句“丢人”。\n林清蕴：“……这剧本不对吧？”\n还没等她反应过来，直接被驱逐青云城，四名兽夫更是要解除契约。\n怂是不可能怂的，解，必须解，留着你们这些白眼狼干嘛？\n所有人都等着她死在城外。却不知她体内藏着上古紫凤兽魂。\n当晚六道契约天光散落大陆\n冰霜巨龙的主人低笑：\"魂契?有意思。\"\n地下黑场的铁塔硬汉红着眼眶：\"有人要我了?\"\n最高监狱里，锁链寸断的少年抬起头，露出一双极深的凤眸。\n而轮椅上的男人，捻着一朵蓝楹花，笑得温润如玉：\"妻主?\"\n林清蕴：......我现在退契还来得及吗?男人，只是取悦她的工具罢了。", "tags": ["玄幻言情", "幻想言情", "穿越", "大佬", "魂穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [3.55, 3.82, 3.85], "trend": 0.3, "latest": 3.9, "wordNumber": 270501, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.63, 7.63, 7.85], "trend": 0.22, "latest": 7.9, "wordNumber": 171658, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\ wordNumber": 282136, "creationStatus": 1, "desc": "仙门大比，我随手从怀里掏出一把古琴\n全场寂静。\n大师兄颤声：“那是……失踪百年的凤栖琴？”\n我波澜不惊，又从头发上随手取下一根发簪。\n大师姐尖叫:“那是神器青芜簪！”\n后来全修仙界都在传，林执月有一整个随身洞府，藏着无数上古灵器乃至神器。\n只有林执月知道，她这身时装是系统送的。\n今天想穿“烟落叠翠”，明天就穿“流火绯星”，至于后天——\n死系统突然弹窗：【限时卡池“九天玄女”开启，抽齐整套可解锁飞行特效，机不可失！】\n我看着卡池里48个部件以及需要氪金的面部妆容和头发陷入了沉思。\n评分刚出，会涨的，小宝们🥹", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "异世穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [5.27, 5.27, 5.34], "trend": 0.07, "latest": 5.3, "wordNumber": 185915, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [6.39, 7.09, 7.51], "trend": 1.12, "latest": 7.5, "wordNumber": 183044, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！ n末世第八年，江言昭被同父异母的妹妹从背后捅了一刀。\n\n再睁眼，她成了女尊国一个刚被退婚的穷书生。未婚夫嫌她体弱多病、科举无望，上门撕了庚帖。她反手把退婚书撕了，先敲了柳家十两银子。\n\n大旱后，村里颗粒无收。她带着全族人逃荒，一路打土匪、找水源、分粮食，从清河村走到青州府，把一条绝路硬生生走成了活路。\n\n空间还在，异能也在，而接下来，她要科举，要做人上人。\n\n而那个前世为她殉情的人，正红着眼睛问她：\n\"姐姐，我能排在第一个吗？\"\n\n她答：\"不管未来几个男人，你永远会是我的例外和偏爱。\"", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分到破旧老宅后，我富甲一方", "fullTitle": "分到破旧老宅后，我富甲一方", "link": "https://fanqienovel.com/page/7644022751656676376", "data": [2.38, 2.59, 2.66], "trend": 0.29, "latest": 2.7, "wordNumber": 299890, "creationStatus": 1, "desc": "【系统+开荒+种田+虐渣+致富+家长里短+升级】\n花落大学毕业在即，在一次户外课题研究中，被人推下山，\n穿到大兴二年小林村的一名被推撞身亡的小姑娘身上。\n醒来后，正赶上老大一家歇斯底里闹分家，只因老大吸不到老二的血了。\n而花落悲催的正好穿成包子一家老二家的痴傻小女儿。\n一身怨气正愁发泄的花落瞬间开启了虐渣，手撕白莲花，将这个家闹得鸡犬不宁的戏码。\n遇神杀神，遇佛杀佛，鸡经过都得拔光毛！\n吓得老大一家觉得老二家的傻妞疯了。\n而老二一家却惊喜地发现，包子一辈子终于迎来了她家的话事员。\n于是小女儿说往东，她们绝不往西，小女儿说种田，他们绝不上山。\n花落就这样，带着受气的娘亲以及包子大姐，成功分家，\n开启修老屋，开荒，打猎，种田，囤粮，顺带虐渣的日渐暴富生活。\nPS：温馨向，节奏慢，不喜弃之", "tags": ["种田", "古代言情", "乡村", "系统", "虐渣", "发家致富"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.45, 2.58, 2.68], "trend": 0.24, "latest": 2.7, "wordNumber": 240066, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成小丫鬟，靠梳妆赎身暴富", "fullTitle": "穿成小丫鬟，靠梳妆赎身暴富", "link": "https://fanqienovel.com/page/7564256304332557336", "data": [2.97, 3.09, 3.15], "trend": 0.18, "latest": 3.2, "wordNumber": 291844, "creationStatus": 1, "desc": "观看指南：【非爽文+架空北宋+微群像+市井经商+微宅斗+家长里短+日常流】\n林丰穗穿到北宋，成了八岁小丫头，喜提知州府上「家生子」身份。\n娘是灶上的厨娘，爹是账房贴书，前边还有个大她两岁的绣娘姐姐。\n老娘是灶上摸油水的高手，好的孬的全塞兜里。\n姐姐绣活一般，嘴皮子极好，哄的管事眉开眼笑，多出的边角料通通拎回家。\n家里边只剩个老实爹，半点不敢马虎手里的账。\n丰穗到了年纪要学门手艺，全家人跳出来支招。\n娘说：厨房干活是冬冷夏热，不行！\n姐说：绣娘的活计不分昼夜，别干！\n爹说：账房么，识字算术，不差分厘，还行！\n丰穗心想：学，都学，但还得靠重操旧业稳妥。\n“娘子，梳妆吗？”\n不不不，搞错了！八岁大的人应该先拜师学艺。\n谨小慎微是安身立命的前提。\n赚钱赎身，身兼数职是常态。\n伺候主子饮食起居，还得起早贪黑，制那面脂香膏、胭脂水粉上街兜售。\n苦点累点都没事，只要能挣脱这脖子上的枷锁。\n一家人齐整出府，置上一间小院，做些经济买卖，自由自在的过红火日子，便浑身都是劲。\n日子能过好，就别让其糟下去。\n立意：自由、奋斗、自强则万事顺，向阳而生。", "tags": ["种田", "古代言情", "穿越", "今穿古", "发家致富", "群像"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [4.88, 4.97, 5.04], "trend": 0.15, "latest": 5.0, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。", "tags": ["种田", "古代言情", "空间", "医术", "古色古香", "代嫁代娶"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "周家独苗要科举", "fullTitle": "周家独苗要科举", "link": "https://fanqienovel.com/page/7649989071162330174", "data": [2.84, 2.82, 2.93], "trend": 0.08, "latest": 2.9, "wordNumber": 167641, "creationStatus": 1, "desc": "【胎穿-科举-家长里短-无金手指-cp不确定，写着看】\n周如寒熬夜加班猝死后竟然穿越了，穿成了老周家的独苗苗。\n因为出生时身子弱，又是独苗，爷奶爹娘都当眼珠子疼，周如寒看着自己瘦弱的小身板，这幅身子想要靠力气吃饭怕是不行了，既然这样，那就走科举吧！\n可看着老周家一文钱恨不得掰成两半花的样子，周如寒长长叹了口，想要读书还是得先搞钱，不然怕是学费都交不起，好在他现在才七岁，一切都来得及。\n听说要送他去读书，家里人都不同意，连村里的乡亲们都觉得周老头一家疯了，他们这些一辈子在地里刨食的泥腿子，哪里是读书的料？\n可随着喜报一次次传回村里，喜宴他们是吃了一顿又一顿，谁还敢说他不是读书的料？", "tags": ["种田", "古代言情", "乡村", "穿越", "科举", "胎穿"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全村嫌弃？崽崽带隔壁村逆天改命", "fullTitle": "全村嫌弃？崽崽带隔壁村逆天改命", "link": "https://fanqienovel.com/page/7630158445840190488", "data": [6.3, 6.3, 6.36], "trend": 0.06, "latest": 6.4, "wordNumber": 295939, "creationStatus": 1, "desc": "【古代+种田＋福运＋萌宝+无CP＋团结+群像文】\n【前期小可怜后期大快人心】\n临阳县有两个极端。\n一个是大柳树村，勤奋，能干，却倒霉透顶。\n村口常年盘踞着乌鸦，日夜啼叫，村民饿着肚子，霉运缠身。\n另一个是石泉村——懒惰，虚伪，却好运连连。\n土地不浇水，不施肥，却能长出镇上人人争抢的仙米。\n全村膘肥体胖，用鼻孔瞧人！\n但石泉村村长家有一个最小的女儿，她最懂事，最勤快，却天天挨打。\n全村没无一人给她好脸色，也感受不到一丝善意。\n她拼命干活，渴望得到一丝温暖。\n可最后被娘毒打，浑身鲜血淋漓，在全村的漠视下扔到山上喂狼。\n命悬一线的她，阴差阳错被霉运缠身的大柳树村所救。\n有了爱她的爹娘，爱她的家人，被全村团宠。\n倒霉的大柳树村也从此逆天改命…", "tags": ["种田", "古代言情", "乡村", "萌宝", "无CP", "群像"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.73, 2.73, 2.79], "trend": 0.06, "latest": 2.8, "wordNumber": 224143, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糠逆袭后，前夫九族悔哭了", "fullTitle": "糟糠逆袭后，前夫九族悔哭了", "link": "https://fanqienovel.com/page/7646611978152070206", "data": [4.49, 4.62, 4.53], "trend": 0.04, "latest": 4.5, "wordNumber": 271213, "creationStatus": 1, "desc": "和离后，姜小满得到了天大的机缘。\n\n洗筋伐髓，一夜回春。\n那张被二十年苦日子熬出来的蜡黄老脸，脱胎换骨，肌肤胜雪，花容月貌，比十六岁出嫁那年还美上十分。\n\n种灵草，炼仙丹，荒山变宝山。\n全省大旱，颗粒无收，她的灵稻却绿浪翻涌，逆天丰收。\n\n一颗丹药在京城卖出万两天价，求药的人从青岩山排到了城门口。\n\n前夫一家跪在她门前磕头认错。\n她正坐在院子里数银子，头也没抬，只淡淡说了句：“别挡光。”", "tags": ["种田", "古代言情", "乡村", "幻想言情", "空间", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越后自称汉族，后来我的国来了", "fullTitle": "穿越后自称汉族，后来我的国来了", "link": "https://fanqienovel.com/page/7643332690896227352", "data": [4.92, 5.01, 4.93], "trend": 0.01, "latest": 4.9, "wordNumber": 267819, "creationStatus": 1, "desc": "【无cp+古代穿越】\n沈清一朝穿越异世，逃荒路上众人排挤戒备，为在古代求生，对外谎称出身隐世大族。\n落脚于安置点时，开了间食肆，本想安安稳稳过日子，不想却救济了万民。\n宗室子弟肆意残害百姓，种种恶行令人发指。\n众人眼中最为善良、去牙行挑人都哭跑出来的沈娘子，破口大骂，众人纷纷表明从没听过这么脏的话。\n有人上前攻击，女主将手中器物猛地掷出，轰然一声炸响，震慑全场。\n“吾乃汉族，维天有汉，鉴亦有光，你们岂敢动我。”\n后期国家来了，女主的心态彻底发生变化。", "tags": ["种田", "古代言情", "穿越", "无CP"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六岁萌娃搬空全家去逃荒", "fullTitle": "六岁萌娃搬空全家去逃荒", "link": "https://fanqienovel.com/page/7657186795850845246", "data": [2.97, 2.97, 2.97], "trend": 0.0, "latest": 3.0, "wordNumber": 264211, "creationStatus": 1, "desc": "秦霜，末世最强杀神，死后一睁眼——六岁，破草屋，饿得前胸贴后背，怀里还窝着个两岁的奶娃弟弟。\n极品奶奶要卖她换彩礼，大伯一家抢她爹寄回的银子，婶娘指着她鼻子骂赔钱货。\n秦霜：呵。\n前世她在末世杀丧尸如割草，这辈子还治不了几个乡下泼妇？\n一夜之间——粮仓空了，银匣没了，连腌菜缸都不翼而飞。\n秦霜牵着弟弟的小手，头也不回地走出秦家村。\n身后？\n随身空间里百亿物资码得整整齐齐。\n她要带弟弟去找那个在边关打仗的爹，顺便——把这乱世踩在脚下。", "tags": ["种田", "古代言情", "乡村", "重生", "空间", "逃荒"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "女频衍生", "score": 5, "reasons": ["3日增长+17.3万", "竞争系数低(4.5)"], "total19": 171.4, "growth": 11.2, "abs_growth": 17.3, "coeff": 4.5, "count10w": 3, "mean": 5.7, "mid19": 4.4, "ndays": 3}, {"cat": "年代", "score": 5, "reasons": ["3日增长+19.5万", "竞争系数低(2.7)"], "total19": 229.2, "growth": 9.3, "abs_growth": 19.5, "coeff": 2.7, "count10w": 3, "mean": 7.6, "mid19": 6.9, "ndays": 3}, {"cat": "快穿", "score": 5, "reasons
