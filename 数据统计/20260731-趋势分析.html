75, "latest": 24.0, "wordNumber": 875479, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [22.74, 23.6, 24.39, 25.12], "trend": 2.38, "latest": 25.1, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙冤种女配崛起，开局杀女主", "fullTitle": "修仙冤种女配崛起，开局杀女主", "link": "https://fanqienovel.com/page/7117541469996452867", "data": [24.85, 26.99, 26.99, 26.82], "trend": 1.96, "latest": 26.8, "wordNumber": 1026838, "creationStatus": 0, "desc": "[大家说被简介耽误了，本人简介无能，看内容吧］\n穿成惨死的冤种女配？不怕，开局杀女主，剧情崩塌，一切洗牌重来。\n　　这一世，我就是女主。\n　　这本书的设定是女主是外室生的小可怜，起点低，光环强，不管遇到什么危险总会逢凶化吉，逆境重生，最后走到人生巅峰。\n　　而她，是女主同父异母的冤种妹妹，父亲唯一的嫡女。\n　　穿越之后掏心掏肺的对女主好，人家发达后，照样抽她仙骨，毁她全族，她终究逃不过惨死的命运。\n　　既然改变不了命运，那就将命运的源头直接掐死。\n【本书是偏正统一些的修仙文，注重主角个人历程，大家齐心协力突破桎梏，不恋爱，友情师门羁绊为重，不写师门斗雌竞雄竞等等，希望大家多一点儿耐心，谢谢】\n——\n避雷：偏传统修仙，人物成长会更符合逻辑，不是一天筑基三天结丹的爽文，筑基打死金丹的剧情有，不可能出现筑基一拳打死元婴的夸张剧情，看爽文的慎入。", "tags": ["玄幻言情", "古代言情", "穿越", "嫡女", "穿书", "虐渣", "今穿古", "打脸", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [23.85, 24.76, 24.76, 25.75], "trend": 1.9, "latest": 25.7, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [21.47, 22.56, 22.56, 23.11], "trend": 1.64, "latest": 23.1, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [26.81, 27.25, 27.92, 28.37], "trend": 1.56, "latest": 28.4, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [41.06, 42.22, 42.22, 42.58], "trend": 1.53, "latest": 42.6, "wordNumber": 3251736, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠摆烂拯救了全宗门", "fullTitle": "我靠摆烂拯救了全宗门", "link": "https://fanqienovel.com/page/7153918048745819172", "data": [58.44, 59.48, 59.48, 59.78], "trend": 1.34, "latest": 59.8, "wordNumber": 1899187, "creationStatus": 0, "desc": "（实体第二册已出）叶翘一觉睡醒穿成了万人迷小说里的工具人二师姐。\n小说里小师妹有难二师姐上，小师妹想要神器，二师姐去拿，小师妹没有灵根，要挖她的灵根。\n叶翘心态崩了，连夜下山，撂担子不干了。\n这工具人谁爱当谁当。\n……\n新宗门的师兄们一切都好，手拿剧本的叶翘却知道这些人都是万人迷女主的鱼。\n丧气厌世的大师兄是爱而不得的舔狗，最终为女主牺牲。\n自打叶翘来了后，他也不不丧了，也不想着去死了，而是整日追着叶翘咆哮：“以后再敢逃课试试！”\n二师兄是个天才男配，因为无法破境，而生了心魔最后死在雷劫。\n叶翘试探性发出邀请：“大道至简，无欲则刚，二师兄，一起摆烂吗？”\n二师兄：“……”好像有些道理？\n天才丹修三师兄是备胎男配，为女主提供各种丹药被榨干所有价值，只得到一句‘我们只是朋友’\n叶翘来了后，三师兄满脑子都是炼丹炼丹，努力投喂小师妹。\n天生剑骨的四师兄为了女主，断送修为，自毁道心。\n叶翘抽出一把剑，认认真真：“心中无女人，拔剑自然神，女人，只会影响你拔剑的速度。”\n四师兄看着神神叨叨的小师妹：“？”\n自从叶翘来了后，他们不围着女主转了，整个门派鸡飞狗跳。\n原文女主：“？”\n我的万人迷光环呢？", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "虐渣", "今穿古", "异世穿越", "打脸", "群像", "魂穿", "剑修"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主都是恋爱脑，只有我是真修仙", "fullTitle": "男主都是恋爱脑，只有我是真修仙", "link": "https://fanqienovel.com/page/7587644291774696510", "data": [52.89, 53.31, 53.6, 54.1], "trend": 1.21, "latest": 54.1, "wordNumber": 1676047, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n【女主修仙升级流爽文+符道天才+大后期古神苏醒】\n桑渔入仙门那天，修仙界南域多了个天灵根天才。\n剑修、法修、丹修、阵修、御兽任她选？\n不，她只想安静画个画、做个符修！\n仙门众长老力劝：符修只是辅修，在修仙界毫无地位可言，狗都不修！\n后来：\n仙门众天才：谁说符修只是辅修、全是垃圾？给老子站出来！\n特么！他们都被桑渔这个变态画的符炸冒烟了。\n仙门众弟子：狗都不修我修！我要当符修！\n符修能越阶杀人！炼气战筑基、筑基战金丹、金丹追着元婴满世界跑……\n可他们往死里修，都修不到桑渔这样儿啊！\n桑渔：上辈子我被古神砸死了，这辈子靠抄袭古神身上的符文成为符道天才不过份吧？\n再后来：\n修仙界南域最顶尖的仙门为了抢天才入门，不惜派出同为天才的金丹美男——逼婚桑渔联姻。\n桑渔：正好我体内养了头吞金兽，来点灵石花花~\n再再后来：\n桑渔飞升上界后，苏醒后的古神紧捂兽皮、眼神幽幽地盯着她：“要抄这里的可以，必须对我负责！”\n一生痴迷于符道无法自拔的桑渔、看着眼前这尊帅到没朋友的真神，摸着下巴抹去口水为难道：“我、桑渔，愿为艺术献身——”\n \n（境界：炼气—筑基—金丹—元婴—化神—炼虚—合体—渡劫—大乘）", "tags": ["玄幻言情", "古代言情", "幻想言情", "穿越", "空间", "天才"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大师姐是修仙界鬼见愁", "fullTitle": "大师姐是修仙界鬼见愁", "link": "https://fanqienovel.com/page/7382011300081060889", "data": [17.91, 18.52, 18.84, 18.97], "trend": 1.05, "latest": 19.0, "wordNumber": 1061436, "creationStatus": 1, "desc": "【已签约出版】（私设多，切忌套公式）\n【和死对头杀穿修仙界+超绝活人感cp＋双强天才成长流+有大基调+易燃易爆炸+微群像+姜郎才烬he】\n暴力嚣张女vs嘴毒腹黑男\n燃！战斗向！从身到心成长型男女主，剧情流有脑修仙文！\n睚眦必报的短命天才少女穿越了！\n本以为是普普通通的修仙世界，却在这里遇到了以为自己手握剧本的穿书女、走龙傲天剧情的气运之子、从天才宝座坠落后本该堕魔的大反派？\n这是一个棋子掀翻棋盘，干掉棋手的故事。\n*\n【一不小心和对家顶流谈恋爱了咋办？】\n听说不朽仙门的首席大师姐和北斗剑宗天生剑骨的小师叔不对付，见面就掐架？\n狐朋狗友：“我说，你和盛大剑仙这么你来我往的打拉锯战已经这么久了，什么时候正式结为道侣啊？”  \n姜珩伸出一根手指摇了摇：“你不懂，暧昧期才是最上头的。谈上了，就不好玩儿了。”\n*\n“放眼神州，也就他配得上我。”\n“放眼神州，还有谁比我更配你？”\n*\n“久仰大名，初次见面，我是来杀你的。”\n“天诛而不死者，是为仙。诛天而创世者，方为神。”\n“告诉他们，弑神者，姜珩。”\n【简介无能，移步正文】", "tags": ["玄幻言情", "古代言情", "穿越", "天才", "强强", "群像"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [16.52, 16.68, 17.03, 17.43], "trend": 0.91, "latest": 17.4, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "看到这个机缘了吗？我的我的我的", "fullTitle": "看到这个机缘了吗？我的我的我的", "link": "https://fanqienovel.com/page/7599147863683124248", "data": [18.92, 19.35, 19.68, 19.82], "trend": 0.89, "latest": 19.8, "wordNumber": 998012, "creationStatus": 1, "desc": "本书改编两个漫剧均已上线。\n点击小说任意一章内容右下角改编剧场即可观看，或进入抖音或者红果搜索《清冷大小姐她开两个挂》和《修仙女配不当垫脚石》，改编了两个漫剧哦。\n【穿书+马甲文+无cp+大爽文+不雌竞+打脸、报复速度极快+金手指巨大】\n林望舒眼睛一闭一睁，就从21世纪大好青年穿书成为一本玄幻狗血甜宠文反派。\n而且是暗恋男主不成，即将被女主打脸，被男主虐杀的反派。\n恰好在此时，天降系统。\n系统可以每个月提供一次抽奖，然后将林望 ointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.08, 41.16, 41.17, 41.31], "trend": 0.22, "latest": 41.3, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [24.81, 24.93, 24.99, 25.02], "trend": 0.22, "latest": 25.0, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗都是舔狗，小师妹是真狗", "fullTitle": "全宗都是舔狗，小师妹是真狗", "link": "https://fanqienovel.com/page/7200755351845604355", "data": [26.79, 26.83, 26.83, 26.91], "trend": 0.12, "latest": 26.9, "wordNumber": 4170637, "creationStatus": 0, "desc": "【实体书《一念凤兮》全平台可购】凤溪穿成修仙文里面的炮灰女配，穿书之日就是忌日。\n她为了苟命，千方百计脱离了女主所在的混元宗，加入了玄天宗。\n嚯！\n五个亲师兄，在书里全都是女主的舔狗，一个比一个死的惨。\n凤溪邪魅一笑：“舔狗了不起？有我狗吗？”\n大师兄身中剧毒，只有女主的血能够解毒，从此对女主情深似海，最后却被女主一脚踹入万丈魔渊，魂飞魄散？\n凤溪屁颠屁颠端来一大盆狗血：\n“师兄，喝我的！我的剂量大，药效足！”\n吞服完解毒丹，正准备割破手指的女主：“……”\n二师兄身具餍族皇族血脉，女主给了他隐藏血脉的丹药，从此二师兄心甘情愿为女主出生入死，哪怕最后被女主推出去当替死鬼也甘之如饴？\n凤溪拿出人族餍族友好一万年的盟约：\n“二师兄，尽情展示你高贵的餍族皇族血脉吧！万千少女为你痴为你狂为你咣咣撞大墙！”\n女主看着手里需要三个月服用一次的隐血丹：“……”\n凤溪的人生信条：做得狗中狗，方为人上人！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "睁眼六零军区，弄错对象被亲哭了", "fullTitle": "睁眼六零军区，弄错对象被亲哭了", "link": "https://fanqienovel.com/page/7567657861308746814", "data": [22.83, 28.59, 28.59, 30.9], "trend": 8.07, "latest": 30.9, "wordNumber": 1092388, "creationStatus": 1, "desc": "睁眼六零，许穗在男人床上醒来，被狠狠折腾了一整夜，亲哭晕死过去，一夜揣上双胎\n她这才发现自己穿书了。\n穿成肤白貌美，身姿窈窕的漂亮恶毒小青梅，前往军区找男主结婚，却意外弄错对象爬错床，被迫嫁给了落魄的假少爷。\n婚后顾云舟出任务断了腿，原主转头卷钱打胎跑路，最后钱丢了，身子骨坏了，大动荡被人举报作风问题惨死。\n顾云舟不仅腿好了，还重返部队步步高升，成为有权有势军区大佬，成了军区炙手可热的存在，惹得多少人想攀上他这根高枝。\n许穗看着眼前斯文俊美的军官男人，摸着肚子里的崽：长得帅，有本事，能力强，也不是不行。\n这么好的潜力股，可不能便宜了别人。\n*\n顾云舟不喜欢许穗。\n然而，婚后自家媳妇漂亮又勾人。\n一夜就怀上他的种，还是龙凤胎。\n怀着双胎轻松考上粮站铁饭碗，转头又成为六十年代顶尖大学高级人才，发明这个，发明那个，办厂赚外汇，让大伙儿富起来，成为领导座上宾。\n两个娃随媳妇，是有名的天才儿童。\n老实婆家：瞧见没，软弱了大半辈子的老秦家终于迎来了主心骨。\n成了首长夫人的心机寡妇娘：瞧，我闺女上报纸了。\n某首长：这是咱闺女，咱闺女就是厉害。\n被许穗带富的军嫂们：谁敢说许厂长坏话，就撕谁的嘴！", "tags": ["年代", "现代言情", "穿书", "大佬", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "娇软美人替嫁，冷面糙汉夜夜诱哄", "fullTitle": "娇软美人替嫁，冷面糙汉夜夜诱哄", "link": "https://fanqienovel.com/page/7633426025581399065", "data": [44.15, 51.14, 51.14, 51.45], "trend": 7.3, "latest": 51.5, "wordNumber": 370888, "creationStatus": 0, "desc": "【年代+先婚后爱+体型差+5岁年龄差年上+细水长流日常+朴实奋斗】\n★娇软美腻乡村女教师x寡言重欲冷硬糙汉\n乔清妍的继姐勾搭了她的公务员未婚夫，她意外发现自己竟能听到继姐恶毒的心声。\n如果不代替继姐嫁入萧家，他们就要把自己卖给恶心的老光棍？\n为了逃离这个家，她被迫同意替嫁给继姐的未婚夫——猎户萧劲野。\n继姐心里得意：萧劲野穷得叮当响，一个瘸腿的妈，还有智障的妹，等你嫁过去就受穷受累吧。\n乔清妍觉得穷不要紧，只要人品贵重，不懒惰，日子会好的。\n继姐心道：那萧家穷就算了，萧劲野还是个不中用的东西，你就守活寡吧。\n乔清妍高兴，那可太好了，反正她也不想跟一个不爱的男人干那档子事。\n不曾想，嫁过去后，顿顿有肉吃。婆婆什么活儿都不让她干，将她宠上了天，小姑子也是可爱纯真。\n而萧劲野，更是把她宠到了骨子里，媳妇让往东，他绝不往西。\n只有一点，清妍不满意。\n萧劲野不是那方面不行吗？\n怎么一到晚上就像一头饿了多年的野狼，粗鲁的要命。\n清妍气恼：“你有完没完？”\n他哑声说：“怎么办，媳妇，真想死在你身上。”", "tags": ["年代", "现代言情", "乡村", "先婚后爱", "年龄差", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [21.29, 22.02, 22.02, 26.93], "trend": 5.64, "latest": 26.9, "wordNumber": 1125340, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [27.02, 27.81, 27.81, 31.41], "trend": 4.39, "latest": 31.4, "wordNumber": 477492, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [35.43, 37.93, 38.55, 37.5], "trend": 2.07, "latest": 37.5, "wordNumber": 811853, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男人瘫痪后，我顶骂名换儿女前程", "fullTitle": "男人瘫痪后，我顶骂名换儿女前程", "link": "https://fanqienovel.com/page/7607564482147011608", "data": [21.03, 21.36, 21.91, 23.04], "trend": 2.01, "latest": 23.0, "wordNumber": 675358, "creationStatus": 1, "desc": "原书名：《守活寡，我被全村骂破鞋》\n男人瘫痪后，李俊兰从来没有想过再跟别的男人有什么瓜葛，一门心思想把三个孩子拉扯大，然而现实太残酷，在生活的重压之下，她还是选择了一条最令人不耻的路……全村人都骂她，孩子们也鄙视她，然而她却根本不在乎，为了心中的执念和目标，她甘愿做一个道德败坏的女人……这是一首绝境母亲的生存悲歌，母性的光辉与道德标准相互撕咬碰撞，孰是孰非没有标准答案，只能一声叹息。", "tags": ["年代", "现代言情", "乡村", "家长里短"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一胎！又一胎！绝嗣大伯哥有后了", "fullTitle": "一胎！又一胎！绝嗣大伯哥有后了", "link": "https://fanqienovel.com/page/7576258459784465433", "data": [24.27, 25.67, 25.67, 26.06], "trend": 1.8, "latest": 26.1, "wordNumber": 1048193, "creationStatus": 1, "desc": "\n【穿书六零+神医系统+易孕vs绝嗣+美艳爬床女vs明面禁欲实际好色大佬】\n林幼薇穿书六零，书中林幼薇不肯离婚，丈夫为了给白月光腾位置，亲手把她送进土匪窝，她被摧残后抛下山崖死无全尸。\n结婚前夜，穿来的林幼薇果断放弃渣男，转而爬了绝嗣瘫痪大伯哥的床！\n不是说他瘫痪又禁欲，那为什么他好色还能动？\n不该发生的都发生了？\n他还夜夜笙歌！\n大家都等着看这对新人的笑话，绝嗣又瘫痪，已经是明家的弃子！！\n搭配乡下来的美艳废物，以后头顶一片绿油油，绝配！\n可是渐渐的，瘫痪的男人重新站了起来，又一次一次屡立战功！成了领导身边不可或缺的左膀右臂！\n突然有一天，绝嗣大佬的明艳娇妻孕吐了！\n众人惊！\n“看吧！他头顶果然一片绿油油，再厉害又如何，老婆给人睡了！就是没用！”\n几个月后，绝嗣大佬抱着缩小版的，和他长得一模一样的小团子出来遛弯，打脸众人，给媳妇儿正名：“这是我媳妇儿生的！我儿子！”\n众人：“——！！”\n奇迹啊！\n绝嗣大佬有后了！\n原来他头顶不绿啊！\n林幼薇也没料到，自己的神医系统还能治好男人的绝嗣，这可苦了她这个好孕体质了，生了一胎又一胎。", "tags": ["年代", "现代言情", "系统", "宠妻", "穿书", "医生"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零崽崽父亲是隐形大佬", "fullTitle": "七零崽崽父亲是隐形大佬", "link": "https://fanqienovel.com/page/7489102469776034840", "data": [22.66, 23.93, 23.93, 24.15], "trend": 1.49, "latest": 24.1, "wordNumber": 2919596, "creationStatus": 1, "desc": "简介：[穿越+空间+打脸+甜宠+家长里短+训夫成才]林凡穿越了，穿成年代文中谱通职工离异单亲家庭的大女儿，还成了未婚先孕的小姑娘。\n不行，必须要去找崽崽的爸爸，要他负责。爱不爱不要紧，有钱有工作生活有保障就行！\n等孩子出生站稳脚根工作稳定就去父留子独自美丽！\n最终找到了孩子的爸爸是个不学无术，无所事事吊儿郎当的二世祖！\n婚后！说好的二流子怎么越来越像隐形的大佬！", "tags": ["年代", "现代言情", "穿越", "空间", "大佬", "打脸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生1977，不再给弟弟当血包", "fullTitle": "重生1977，不再给弟弟当血包", "link": "https://fanqienovel.com/page/7649071612280458302", "data": [27.97, 28.52, 29.02, 29.19], "trend": 1.22, "latest": 29.2, "wordNumber": 375001, "creationStatus": 1, "desc": "前世林秀禾掏心掏肺活了一辈子：\n铁饭碗让给弟弟，工资全数贴补娘家，升学名额拱手送人。\n她伺候二老、帮弟弟成家、供养侄子，熬得一身病痛。\n弥留之际躺在病床上，账户里只剩七块三毛钱。\n父母理所当然：你是姐姐，就该帮衬弟弟。\n弟弟冷眼旁观：姐，你别想拖累我。\n一朝重生，她回到1977年。\n饭桌前，家人又在逼她让出人人眼红的供销社工作。\n林秀禾猛地掀翻饭桌，眼神冷彻：\n工作，不让。钱财，不贴。我的人生，从此谁也别想觊觎！", "tags": ["年代", "现代言情", "重生", "打脸", "虐渣", "家长里短", "前世今生"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿成财阀太子爷的作精前女友", "fullTitle": "穿成财阀太子爷的作精前女友", "link": "https://fanqienovel.com/page/7641635688978336792", "data": [67.24, 73.39, 73.39, 75.29], "trend": 8.04, "latest": 75.3, "wordNumber": 315876, "creationStatus": 0, "desc": "「腹黑男人X娇气包｜双洁、甜宠」\n穿成财阀校园文里的恶毒女配，柯眠棠接到的任务是：半年内扮演好男主的女朋友，稳定他的反社会情绪，等原书女主出场后，然后拿钱走人，功成身退。\n男主荣涉，星云集团太子爷，白名单榜首。\n表面温润如玉，骨子里偏执病态，占有欲强到令人发指。\n柯眠棠每天战战兢兢地演着娇纵女友，生怕露馅。\n可来的第一天，她就被男主亲哭了。\n系统：“问题不大，别慌。”\n她信了。\n然而男主看她的眼神越来越不对劲，并非原著里对恶毒女配的冷漠，倒像是让人后背发凉的痴迷。\n系统又说：“别怕，小说结局是男主和原书女主在一起，既定结局。”\n她放下心来。\n后来，原书女主终于登场。\n但男主对那位真命天女兴趣淡淡，反倒对前女友兴致盎然。\n柯眠棠瑟瑟发抖：说好的原著里他会爱上原书女主呢？\n-\n终于，任务结束前一晚，她满心欢喜一亿到账。\n结果系统突然失联。\n重启后，终端程序直接被篡改，从“剧情纠正”变成了“爱上男主”。\n她懵了。\n一双大手从身后掐住她的腰，男人的呼吸落在耳畔，嗓音低哑带笑：“宝贝，你知道我为了留住你，有多辛苦吗？”\n他早在她穿来的第一天就发现了真相。\n立意：黑心的财阀继承人从不做亏本买卖。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "甜宠", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恋爱脑能传染？幸好我是个神经病", "fullTitle": "恋爱脑能传染？幸好我是个神经病", "link": "https://fanqienovel.com/page/7641990468129016857", "data": [25.8, 27.77, 29.63, 31.49], "trend": 5.69, "latest": 31.5, "wordNumber": 340912, "creationStatus": 1, "desc": "冷脸萌x纯情骚＋沙雕整活+半截读心+皮肤饥渴+自我攻略\n姜灵焕穿进古早玛丽苏贵族学院文，绑定“反恋爱脑”系统，靠阻止全校磕cp、打击不文明恋爱行为续命：\n霸道少爷用广播强势示爱，全校磕爆！恋爱毒气暴涨！\n她把广播示爱爆改英语听力，全校萎掉：？这是什么脏东西\n还天天到处打击不文明恋爱行为：\n有人图书馆激吻，她将乒乓拍精准扔到两人嘴巴之间：“这不是你们的大床房。”\n有人泳池狠狠爱，她举着插线板放在泳池边：“再不出来，让你们做亡命鸳鸯。”\n有人树林里调情，她牵着几条狗冲进去：“别在小树林法天法地！”\n全校恋爱脑：姜灵焕是地狱来的魔鬼！！\n-\n姜灵焕日常被“恋爱毒气”侵扰，一被侵入就想找人亲嘴子。\n后来，她发现待在校草兼学生会会长的身边就能保持清醒，跟他碰一下，就能回血！接触越多，回血越快！\n于是，姜灵焕把谢风叙当充电宝，变着花样跟他制造接触。\n谁曾想谢风叙不仅有皮肤饥渴症，还能听见她的心声，还只能听一半！\n她内心：他手好大，感觉能一把握住我的头。胸肌练得不错。\n他听到：他手好大，感觉能一把握住我的…胸，不错。\n他：？她好变态\n她：？我冤枉啊\n后来，自我攻略的谢风叙在勾引姜灵焕的路上一去不复返，从闷骚到明骚！\n姜：你真的好骚啊！", "tags": ["现言脑洞", "现代言情", "校园", "系统", "穿越", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际校园：五人小队向前冲", "fullTitle": "星际校园：五人小队向前冲", "link": "https://fanqienovel.com/page/7363859366488837182", "data": [22.99, 24.87, 26.65, 27.92], "trend": 4.93, "latest": 27.9, "wordNumber": 1169247, "creationStatus": 0, "desc": "【军校+机甲+无cp+成长向+群像+轻幽默+五人团队+团魂】\n人生的前十七年，姜林的目标是考上明德机械工程系，成为未来高薪机甲师，但一场突如其来的变故让她前往黎明军校，走上了一条成为超强单兵的道路。\n三校联赛、实战演练、星际战斗……\n多年之后，五名意气风发的少年并肩站在废墟之上，成为三校当之无愧的最强小队。\n“加入黎明军校，是为了今日夺冠吗？”\n“不是，是为了以血肉之躯，再造黎明。”\n【小队介绍】\n姜林（女），单兵，182，敏捷型战斗机甲“擎风”，擅长近身作战，独狼，“一剑不行？多砍几剑总会好的”；\n权雅（女），后勤，165，不会做好吃饭饭的医疗兵，不是好后勤，“你的命，我用一碗佛跳墙买下了”；\n康尧（男），机甲师，175，看到人就烦但是会冷脸做机甲，说话难听天赋极高，皮脆容易被打死，“难听？更难听的话我还没说出口呢”；\n江鹰（男），单兵，191，中火力战斗机甲“重影”，擅长枪械炮弹，表面冷酷壮汉，实则腼腆饭桶，“你这事儿我办不了，请我吃饭？哦，那可以。”\n杨星（女），指挥，172，你有你的精神力，我有我的战术打法，赛场之上，“仅我一人，就可当千军万马”", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "星际", "无CP", "搞笑轻松", "群像"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女靠捞金，撬了万人迷的男主", "fullTitle": "恶女靠捞金，撬了万人迷的男主", "link": "https://fanqienovel.com/page/7572216848263941144", "data": [32.56, 34.11, 35.16, 36.69], "trend": 4.13, "latest": 36.7, "wordNumber": 1162489, "creationStatus": 1, "desc": "【上位者低头+高干+顶级拉扯】+【偏现实向】+【非甜宠文】+【没有龙傲天打脸，只有小人物的步步为营】\n沈念禾是一本“万人迷”小说里的恶毒女配，是女主完美人生的对照组。\n当她被男女主联手逼至绝境、濒死之际，一个名为“拜金系统”将她唤醒。\n它告诉她：唯有从那些气运加身的男主们身上获取金钱，才能汲取他们的气运，逆转家破人亡、惨淡收场的既定结局。\n从此，她收起无用的骄傲，步步为营，只为谋财。\n有人讥讽她拜金、浅薄、不择手段——\n她只轻笑反问：“这世间，谁不爱钱？”\n若有人说不爱，那大抵只是虚伪得不够坦荡。\n可她未曾预料，这场以金钱为名的清醒游戏里。\n那些曾视她为玩物、笑她为捞女、说她给女主提鞋都不配的“天之骄子”，竟一个个为她俯首，步步沦陷。", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "重生", "打脸"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "算命亿点准，假千金被国家收编了", "fullTitle": "算命亿点准，假千金被国家收编了", "link": "https://fanqienovel.com/page/7621489476405054526", "data": [28.42, 29.4, 30.84, 32.22], "trend": 3.8, "latest": 32.2, "wordNumber": 475889, "creationStatus": 0, "desc": "【假千金+国家团宠+群像+玄学+无cp+直播算命】\n\n　　时鸢是被抱错的假千金，亲子鉴定报告一出，养父母就迫不及待将她赶出豪门。\n\n　　亲生父母家里一穷二白，气运被偷，欠债千万！\n\n　　为还债，时鸢只能干起老本行，摆摊算命，当起了玄学主播。\n\n　　“大师，我想找我女儿。”\n\n　　时鸢：“你前脚出门，你重男轻女的婆婆后脚就把你女儿卖了，现在你女儿已经上了卖器官的手术台。”\n\n　　当晚警方破获一起跨省重大买卖器官案。\n\n　　“大师，我今年五十岁，想看看我和现在的男友有没有正缘。”\n\n　　时鸢：“你亲儿子联合你男友给你买了巨额保险，还要带你出去旅游上演消失的她。”\n\n　　苦主当即断亲报警，渣男和亲儿子被捕入狱。\n\n　　“大师，我发现我家墙壁有异响！”\n\n　　时鸢：“有异响就对了，十年前你杀了人藏尸在墙壁里，她现在出来找你了。”\n\n　　……\n\n　　只要时鸢一开播，全国警方蹲点吃瓜，靠着时鸢破获了一起又一起的重大犯罪案件。\n\n　　原本被夺走气运的亲生父母哥哥，也重新走上暴富巅峰！\n（不是全文都是直播，有主线剧情的哦）", "tags": ["现言脑洞", "现代言情", "团宠", "无CP", "群像", "风水秘术"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法学校小学妹，沙雕搞事啥都会", "fullTitle": "魔法学校小学妹，沙雕搞事啥都会", "link": "https://fanqienovel.com/page/7388389162069543961", "data": [33.33, 34.31, 34.92, 35.51], "trend": 2.18, "latest": 35.5, "wordNumber": 2532683, "creationStatus": 1, "desc": "【非西幻，中式魔法学院，沙雕+群像+搞笑日常，有cp】\n　　【女主沙雕搞事带偏所有人，一群神经学生搞笑学魔法的故事】\n　　黎问音一朝穿到魔法世界，在顶尖中式魔法学院里苟且偷生。\n　　剪院旗当校服，偷抢课本夺命奔跑，把各个院长气的七窍生烟，禁闭室第一贵客。\n学习魔法，植物魔法变植物大战僵尸，药剂做听音药剂，编织魔法做出来个四处创人的筋斗云！\n　　很会吐槽的学长：我本意是做一个好学生，直到她成为我的同学。\n安静的社恐学姐：她的花样层出不穷，很厉害。\n　　好奇宝宝二傻子学长：经常会非常佩服她的操作，要是我也能这么胆大妄为就好了。\n不理解其他人的学姐：我感觉她很好啊！不明白为什么那么多人说她是大麻烦。\n　　后人闻之叹之：那位学姐，是经久不衰的传奇。", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "穿越", "团宠", "异世穿越", "搞笑轻松", "群像"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "四个孩子四个妈？渣爹赶紧受死吧", "fullTitle": "四个孩子四个妈？渣爹赶紧受死吧", "link": "https://fanqienovel.com/page/7574903131662732312", "data": [26.13, 26.96, 27.55, 27.55], "trend": 1.42, "latest": 27.6, "wordNumber": 967523, "creationStatus": 1, "desc": "「重生+豪门+打脸虐渣+爽文+搞笑」\n上一世，容昭宁受尽霸凌，惨死时体无完肤。\n死后，她绑定系统穿到99个世界做任务，却在噩梦中目睹家人个个下场凄惨：\n她那风流多情的渣爹身中数刀惨死。\n冷漠大哥卷入命案被判枪决。\n病娇二哥坠楼身亡。\n嚣张四弟被卖缅甸，最后做成人彘折磨至死。\n再睁眼，她重生到刚回厉家这天，那些欺凌过她的人，都将下地狱！\n听着家人重复上辈子的混账话，容昭宁直接一拳砸过去，打得几人鼻青脸肿：“从今天起，这个家我说了算！懂？”\n为扭转全员惨死结局，她专治各种不服—\n渣爹敢沾花惹草？断他桃花，设死门禁，敢反抗就揍到他喊祖宗！\n大哥冷漠寡情？打包扔去孤儿院做义工，磨掉一身戾气！\n二哥阴湿病娇？发配乡下闺蜜家养猪场，扛猪喂料练心性！\n四弟嚣张跋扈？放在眼皮子底下，亲自调教，打到他跪地叫姐！\n同父异母的厉家三兄弟瑟瑟发抖：“妹妹/姐，打了渣爹就不能打我们了哦～”\n渣爹气得在一旁骂骂咧咧。\n—\n上一世，从她来到京市，直到死…微信置顶那人都不曾回过她一条信息。\n这一世，看着对方刷屏的消息，容昭宁烦躁拉黑！\n谁知，男人撕下伪装，将眼前掉马的人亲到红温，“宁宁，你不乖！快把哥哥微信加回来！”", "tags": ["现言脑洞", "现代言情", "重生", "豪门世家", "打脸", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成兽世恶雌：末世强者沉迷打怪", "fullTitle": "穿成兽世恶雌：末世强者沉迷打怪", "link": "https://fanqienovel.com/page/7525723826827578430", "data": [28.87, 28.81, 29.16, 29.67], "trend": 0.8, "latest": 29.7, "wordNumber": 1095822, "crea \n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小队全员兽化，菟丝花夹缝难逃", "fullTitle": "小队全员兽化，菟丝花夹缝难逃", "link": "https://fanqienovel.com/page/7636739236065971225", "data": [17.13, 18.16, 19.14, 19.44], "trend": 2.31, "latest": 19.4, "wordNumber": 451436, "creationStatus": 1, "desc": "评分刚出）末日 | 兽世 | 系统 | 熟女 | 多男主雄竞 | 极致宠爱 | 男全洁\n\n　　大学还没毕业，陆灵就遭遇了末日危机，诡异降临，人间化成炼狱。\n\n　　好消息：陆灵穿越到一百年后了。\n\n　　坏消息：一百年后还是末日世界。\n\n　　陆灵：人类花了一百年还是没有干翻诡异结束末日吗？\n\n　　【是的哦，宿主，而且，现在的世界，已经变成了兽化变异人主宰的世界了。\n\n　　这里雄兽多，雌性少，像你这样，可以驯化雄兽，让他们为你所用的驯化师更少。】\n\n　　驯化？\n\n　　【就是和兽人结侣呀，不但可以获得他们永远的忠诚，而且结侣成功有奖励哦，万平空间，无限能源，双系异能，等等等等任你挑选！】\n\n　　陆灵本以为结侣很难，没想到开局就送给她一个绝色发情期兽人。\n\n　　白狮把她抵在角落里：“你好漂亮，我可以亲你吗？”\n\n　　陆灵点头，让亲，让帅哥亲。\n\n　　兽人把她抱回了自己的小队里。\n\n　　进了兽人小队，陆灵才明白，自己这是进了狼窝了……\n\n　　兽人如狼似虎，她轮流驯化调教\n\n（无雌竞，有女反派，不会用x惩罚女反派）\n\n（女主的金手指在开局会隐瞒男主，后面会告诉男主）\n（有少量女配感情线，笔墨不多）", "tags": ["科幻末世", "系统", "幻想言情", "穿越", "末世", "甜宠"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "弱智就弱智吧，我照样星际最强！", "fullTitle": "弱智就弱智吧，我照样星际最强！", "link": "https://fanqienovel.com/page/7622869871344241689", "data": [11.71, 12.88, 12.88, 13.74], "trend": 2.03, "latest": 13.7, "wordNumber": 771696, "creationStatus": 1, "desc": "【无cp】孔淼一朝穿越，成为了星际幼崽。\n被好心人送去上学时，孔淼看着周围随处可见的机甲两眼冒光，她飞快地接受了新身份，并摩拳擦掌决定大干一场立志成为一名出色的机甲手……然后差点没通过入学检测。\n校方：“精神力为0，疑似弱智。”\n孔淼：“……啊？”\n……\n军校大比拉开序幕，由于参赛人数不足，校方心一横，将复健了几年的弱智孔淼也塞了进 , "creationStatus": 0, "desc": "【末世+天灾+大佬+爽文无逻辑+无cp+言灵】\n言灵师大佬凌染意外穿书末世，对于新世界，她很感兴趣。\n面对丧尸围攻\n凌染：神说，我会飞。\n异能者们看着那人明明没有翅膀，却双脚离地，腾空而起，缓缓张大了嘴巴。\n面对要去拿研究资料，异能者们束手无策之时\n凌染：神说，我会隐身。\n异能者们看着凭空消失的凌染，没一会儿就把那份研究资料从丧尸间里带了出来。\n异能者们：凌神这是什么异能？飞行、隐身双系异能？\n后来他们才知道，什么双系异能？明明是言出法随。", "tags": ["科幻末世", "穿越", "末世", "穿书", "无CP", "大佬", "天灾", "魂穿"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世降临，我靠种田带室友杀疯了", "fullTitle": "末世降临，我靠种田带室友杀疯了", "link": "https://fanqienovel.com/page/7497410581733854233", "data": [11.08, 11.1, 11.05, 11.17], "trend": 0.09, "latest": 11.2, "wordNumber": 1546062, "creationStatus": 0, "desc": "【末世游戏+多位面+群像文+种田+无CP+囤货】\n【作者不看书评，偶尔看段评】\n简介：\n末世游戏降临，全校宿舍沦陷，许可望凭借一个梦带室友提前囤货，成功全部解锁职业技能。\n可谁能告诉她，哪个好人的职业是疯狂戴夫？\n能当子弹的花生，能吃异虫的含羞草，吃了能进入无敌状态的小番茄……\n室友们表示：你尽管种，怪我们杀，架我们打，土地我们给你抢！\n极寒、虫灾、洪涝、酷热、丧失、人造人，无论多难解决的世界，在许可望眼里都不是事儿，她靠一只铁铲，一块地，带全寝室杀穿末世。\n1.前期求生，解锁职业后开启种田。\n2.群像文，其他室友占据一定篇幅，孤狼设定爱好者慎入。\n3.非无脑爽文，成长需要时间。\n4.不要骂人。", "tags": ["科幻末世", "末世", "女强", "无CP", "囤物资", "群像"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "父王，开门！本郡主闯祸回来啦", "fullTitle": "父王，开门！本郡主闯祸回来啦", "link": "https://fanqienovel.com/page/7571356675811052568", "data": [35.75, 37.33, 37.33, 41.35], "trend": 5.61, "latest": 41.4, "wordNumber": 1082481, "creationStatus": 1, "desc": "[轻松诙谐＋无CP＋日常＋团宠＋爽文＋沙雕＋女强＋群像＋权谋＋颠文]\n（简介无能，大家还是直接看正文吧）\n    自从端王府的独苗苗叶琼脑袋被驴踢中失忆后。\n    老纨绔端王好日子到头了。\n    别人家父慈子孝，端王府鸡飞狗跳。\n    叶琼不是在坑爹，就是在坑爹路上。\n    短短半月，不仅荣升为了京城纨绔之首，还成立了纨绔天团。\n    当别人琴棋书画时，叶琼忙着败家逛青楼。\n    当别人宫斗宅斗时，叶琼忙着吃瓜打架斗殴。\n\n    直到某天，众人发现那个臭名昭著的草包郡主，一跃成为了京城的顶流。\n    最火戏楼老板——是郡主。\n    最赚钱的拍卖行东家——是郡主。\n    最大的山匪头子——是郡主。\n    连江湖最厉害的门派门主——也是郡主。\n    百姓给郡主立长生牌，纨绔们认郡主为老大。\n\n    当众人抢皇位抢的火热时，\n    清点银票的叶琼看着自己钱也有了，人也有了。\n    好像不参与一下有点不合群。\n    于是，反手就把自己的跟屁虫小皇孙拎上了皇位。\n    比起皇位，她还是更喜欢当权倾朝野的摄政王。\n【注：不是正经宫斗权谋，本文走轻松诙谐风】", "tags": ["宫斗宅斗", "古代言情", "女强", "团宠", "搞笑轻松", "群像"], "borderColor": "#e74 孽缘，呸，你的善缘到了，下山去吧。”\n    人人都笑尚书府大小姐是个江湖骗子。\n　直到宫宴之上，百鬼夜行，红灯成血。\n　　众人看见女子手持骨笛，朱砂为刃，一笛封魂。\n　　自此，姜渡生三个字，响彻长陵城。\n　　那日，妹妹红着眼眶扑过来：“姐姐，我…”\n　　姜渡生淡淡瞥了她一眼：\n“我渡生、渡死、渡厄、渡魂、渡苍生，唯独不渡没脑子的蠢货。”\n　　她自诩算天算地，却没算到那个煞星。\n　　\n原想借他一身纯阳煞气续命。\n　　功成那夜，她收拾小包袱准备跑路，却被他困在朱砂案前，眼底满是疯狂与执拗：\n　　“姜渡生，你渡苍生，能不能——也渡渡我？”\n　　“我从烬火中来，不求成佛，只求你渡我一个余生。”\n　　后来，当他血染衣袍，在她耳边落下绝望的呢喃：“姜渡生，你算尽天机，可曾算出我会是你的情劫？”\n　　“若不能在你心里占得一席之地，我甘愿…永世为鬼，受你封印。”", "tags": ["古言脑洞", "古代言情", "大小姐", "大佬", "1v1", "捉鬼"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "太子崽崽今天登基了吗？", "fullTitle": "太子崽崽今天登基了吗？", "link": "https://fanqienovel.com/page/7545144499408751678", "data": [15.01, 15.69, 16.11, 16.1], "trend": 1.09, "latest": 16.1, "wordNumber": 631536, "creationStatus": 0, "desc": "养崽+气运+无cp，避雷去看第一章作话，简介限制字数。\n\n前世武君稷流落民间十六年，被周帝找回册封为太子，登基五年含恨而终。\n\n再睁开眼，他回到了被周帝送出皇宫的一刻，他发誓这辈子一定杀周帝雪恨，老天爷跟他开了个玩笑，从娘胎里一出来就告诉他，周帝不能杀。\n成长的相处中，前世最恨的人，竟成为今世最爱他的人。\n是恨还是爱？幸好武君稷还有很长时间可以逃避选择，在此期间，他要正位人皇，他要生造妖庭，他要统一天下，他要封神！\n先去东北，种出个妖庭！\n\nN年后，武君稷身边妖将如云，神官成群，他举着人皇玺，气运滔天，信仰加身！统一！统一！\n重生的二皇子：怎么斗？\n三皇子四皇子：怎么斗？\n重生的陈瑜：谢邀，已自阉。\n而总梦到前世的周帝：心虚.jpg", "tags": ["古言脑洞", "古代言情", "系统", "重生", "无CP", "养崽"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄门神算卦太灵，火爆全京城！", "fullTitle": "玄门神算卦太灵，火爆全京城！", "link": "https://fanqienovel.com/page/7268528075988536378", "data": [18.27, 18.54, 18.79, 18.97], "trend": 0.7, "latest": 19.0, "wordNumber": 741030, "creationStatus": 0, "desc": "【无cp+玄学+算命+爽文+微马甲+捉鬼+轻松无虐~】\n　　萧家云灼自幼被弃，亲人找上门，果断回京做个眼中钉。\n　　生母说这女儿粗鄙、大字不识？\n　　可她转眼入了京城名师圈，谈词说赋、解天下运势。\n　　白莲花说她恶毒凶悍？\n　　下一刻她善名远扬、气得旁人靠边站。\n　  勇猛大哥觉得她这些年穷困潦倒十分可怜……她转手掏出金银珠宝亮瞎他眼。\n　　妈宝二哥心恶歹毒？没关系，带着他瞧瞧报应见见鬼！\n　　陌生小弟不认姐，绝对的武力之下必报大腿。\n　　通算命、熟相术；占星辰、改风水。\n　　听闻每一任神隐门门主都是短命鬼+穷鬼，所以云灼立志，一定要赚点小钱、安享晚年！\n　　攒功德、了因果，务必要成功活到门主身份交接那一刻。\n　　于是，她的摊儿，爆火京城啦！", "tags": ["古言脑洞", "古代言情", "无CP", "捉鬼"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [22.68, 22.91, 23.12, 23.32], "trend": 0.64, "latest": 23.3, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新的人生，结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被系统逼疯，我杀几个男主不过分", "fullTitle": "被系统逼疯，我杀几个男主不过分", "link": "https://fanqienovel.com/page/7570469751013510206", "data": [15.01, 15.31, 15.46, 15.6], "trend": 0.59, "latest": 15.6, "wordNumber": 339201, "creationStatus": 0, "desc": "【出版中，漫剧出啦。女主无敌，无cp，无基建，主剧情，有男性角色（可能死亡）。】\n　　\n　　关知微被迫穿越，无数系统绑定她，许诺完成任务就送她回家。\n　　\n　　结果全是骗子。\n　　\n　　冤种女主决定干翻这个世界。\n　　\n　　从杀男主开始。\n　　\n　　她一边干掉有感情线的男主，一边带着左邻右舍在乱世逃命，不知不觉凝聚大批人追随，逐鹿天下，官衔至太尉。\n　　\n　　他们把龙袍披在她身上。\n　　\n　　她无奈摆手：“我不想当皇帝。”\n　　\n　　手下：懂懂懂，三辞三让。\n　　\n　　系统一脸震惊：【你当皇帝了，我的男主怎么办？】\n　　\n　　“选秀去吧。”\n\n【无cp的意思是，没有人和女主真正在一起，结局在一起（重点）。\n有男性角色，有后宫，厌男不建议看。男性角色可能死亡（重点），可能被女主杀掉（重点）。\n不要对女主有任何贞洁性的要求。人不是器物，还分是不是二手的。作者讨厌处男，但读者喜欢，所以但凡和女主有关联的男人全部处男。\n女主是绝对无敌的存在，女主神经有点不好，会发疯（重点）。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "无敌", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒贵妃又又作死，弹幕教她躺赢", "fullTitle": "恶毒贵妃又又作死，弹幕教她躺赢", "link": "https://fanqienovel.com/page/7640115067735788606", "data": [13.54, 13.49, 13.49, 13.78], "trend": 0.24, "latest": 13.8, "wordNumber": 342153, "creationStatus": 1, "desc": "（评分刚出，会涨）【古言甜宠+帝王宠妃+双洁+弹幕爽文+虐渣打脸】\n戚以棠，太傅千金，生得花容月貌，过得顺风顺水。\n然而议亲那年，她被强取豪夺，成了反派帝王的妃子。\n竹马深情几许：“棠儿，你再忍忍，等我登基，定封你为后。”\n她信了竹马的话，打算给皇帝下毒。\n然而眼前飘过排排金色弹幕——\n“好蠢的女配，男主早和女主好上了，骗你送死呢！”\n“原著她下毒失败被反派囚禁了，桀桀桀黑化倒计时，搓手等待。”\n“死恋爱脑我服了！皇帝暗恋她十多年，给她后位不要，偏要当小三！”\n戚以棠：“……”\n蠢货竟是我自己？\n*****\n戚以棠觉醒了，自己竟是话本里的恶毒女配。\n因痴恋男主，她被骗下毒害死反派皇帝，导致大哥被诬陷通敌卖国，二哥被造谣私吞盐税，三哥被山贼砍掉半个脑袋，四哥染上花柳病……\n而男主踩着她全家的尸骨成了千古帝王！\n狗男人想让我当垫脚石，呵。\n戚以棠反手把毒药换成春药，灌进皇帝嘴里。\n既然弹幕说她是恶毒女配，何不“恶毒”到底呢？\n*****\n谢瓴知道戚以棠对他并无真心，但年少的执念困其一生，他偏要将她强娶到自己身边。\n后来，谢翎表示——\n瓜甜不甜，果然只有自己尝了才知道。", "tags": ["古言脑洞", "古代言情", "甜宠", "虐渣", "暗恋", "攻略反派"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "手拿名臣系统，我在古代女扮男装", "fullTitle": "手拿名臣系统，我在古代女扮男装", "link": "https://fanqienovel.com/page/7225592747904732192", "data": [17.07, 17.09, 17.09, 17.13], "trend": 0.06, "latest": 17.1, "wordNumber": 1032880, "creationStatus": 0, "desc": "许玥穿书了。\n成为科举文里母亲早亡，没有兄弟，孤苦无依，家中不管只能尴尬寄住在男主家的小白花表妹。\n许玥上辈子一路从孤女拼到博士，从不信命，即使古代女子难存，她也不放弃的思考着该怎么破局。\n系统:不，对不起，宿主，你不能当个女孩子，因为我是名臣系统。\n许玥:……\n多年以后，乡人都说，许家祖坟冒了青烟，许玥三岁识文，五岁作诗，八岁中秀才，十二岁举业有成，不过十八便高中状元！\n打马游街，风光一时。\n许玥:谢邀，你听过半夜的鸡叫声吗？\n原男主:许兄才华横溢，品性高洁，乃我辈楷模。\nPS:纯爽文，无虐，架空勿考据。\n女主超美，超美，会有一定篇幅描写美貌，女主会成为一个世人眼中诗、书、礼、御齐备，颜值惊艳的一代盛世皇朝白月光。\n虽然无CP，但是有很多单箭头，女主性格并不包容善良，偏利己主义。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "穿书", "女扮男装"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "快穿": [{"label": "快穿：吾之第一女技能生效", "fullTitle": "快穿：吾之第一女技能生效", "link": "https://fanqienovel.com/page/7631127077751639065", "data": [20.07, 20.67, 20.99, 21.35], "trend": 1.28, "latest": 21.4, "wordNumber": 427721, "creationStatus": 1, "desc": "评分刚出～\n【父母偏心眼+女主不单纯不咸鱼不愧疚（父母的是她的）+胎穿】\n明琦，一个精怪化人的地府鬼，日日夜夜打扰地府人员办公，时不时篡出来吓鬼，不少人向阎王抗议。\n阎王头疼的看着又去她库房捡东西鬼鬼祟祟的鬼，下定决心——让明琦去小世界（玩）长大，给地府鬼一段安静的日子。\n于是，特意在明琦来捡东西的时候，一枚青色的拇指大小，板板正正发出金光的钥匙。\n明琦默默的趁人不注意，悄悄伸手，咧着嘴把钥匙收进怀里，只是下一秒，她被金光笼罩，消失在地府。\n......\n第一个年代文世界：重生女配妹妹\n知青办来家里动员下乡人选，只见他们家排成一排站好，重 "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [21.98, 23.62, 23.95], "trend": 1.98, "latest": 24.0, "wordNumber": 875479, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [23.6, 24.39, 25.12], "trend": 1.52, "latest": 25.1, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [27.25, 27.92, 28.37], "trend": 1.12, "latest": 28.4, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [24.76, 24.76, 25.75], "trend": 0.99, "latest": 25.7, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主都是恋爱脑，只有我是真修仙", "fullTitle": "男主都是恋爱脑，只有我是真修仙", "link": "https://fanqienovel.com/page/7587644291774696510", "data": [53.31, 53.6, 54.1], "trend": 0.78, "latest": 54.1, "wordNumber": 1676047, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n【女主修仙升级流爽文+符道天才+大后期古神苏醒】\n桑渔入仙门那天，修仙界南域多了个天灵根天才。\n剑修、法修、丹修、阵修、御兽任她选？\n不，她只想安静画个画、做个符修！\n仙门众长老力劝：符修只是辅修，在修仙界毫无地位可言，狗都不修！\n后来：\n仙门众天才：谁说符修只是辅修、全是垃圾？给老子站出来！\n特么！他们都被桑渔这个变态画的符炸冒烟了。\n仙门众弟子：狗都不修我修！我要当符修！\n符修能越阶杀人！炼气战筑基、筑基战金丹、金丹追着元婴满世界跑……\n可他们往死里修，都修不到桑渔这样儿啊！\n桑渔：上辈子我被古神砸死了，这辈子靠抄袭古神身上的符文成为符道天才不过份吧？\n再后来：\n修仙界南域最顶尖的仙门为了抢天才入门，不惜派出同为天才的金丹美男——逼婚桑渔联姻。\n桑渔：正好我体内养了头吞金兽，来点灵石花花~\n再再后来：\n桑渔飞升上界后，苏醒后的古神紧捂兽皮、眼神幽幽地盯着她：“要抄这里的可以，必须对我负责！”\n一生痴迷于符道无法自拔的桑渔、看着眼前这尊帅到没朋友的真神，摸着下巴抹去口水为难道：“我、桑渔，愿为艺术献身——”\n \n（境界：炼气—筑基—金丹—元婴—化神—炼虚—合体—渡劫—大乘）", "tags": ["玄幻言情", "古代言情", "幻想言情", "穿越", "空间", "天才"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [16.68, 17.03, 17.43], "trend": 0.74, "latest": 17.4, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [22.56, 22.56, 23.11], "trend": 0.55, "latest": 23.1, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "看到这个机缘了吗？我的我的我的", "fullTitle": "看到这个机缘了吗？我的我的我的", "link": "https://fanqienovel.com/page/7599147863683124248", "data": [19.35, 19.68, 19.82], "trend": 0.47, "latest": 19.8, "wordNumber": 998012, "creationStatus": 1, "desc": "本书改编两个漫剧均已上线。\n点击小说任意一章内容右下角改编剧场即可观看，或进入抖音或者红果搜索《清冷大小姐她开两个挂》和《修仙女配不当垫脚石》，改编了两个漫剧哦。\n【穿书+马甲文+无cp+大爽文+不雌竞+打脸、报复速度极快+金手指巨大】\n林望舒眼睛一闭一睁，就从21世纪大好青年穿书成为一本玄幻狗血甜宠文反派。\n而且是暗恋男主不成，即将被女主打脸，被男主虐杀的反派。\n恰好在此时，天降系统。\n系统可以每个月提供一次抽奖，然后将林望舒身上随机一物十倍膨胀。\n水灵根？十倍膨胀通明冰骨水天灵根！\n宠物灵狐？十倍膨胀守护神兽九尾天狐！\n玄级灵宝破甲弓？十倍膨胀地阶法器冰凝弓！\n筑基期马甲？十倍膨胀金丹期护道者。\n从此以后，通天宗新一代小师祖、玄灵大陆第一妖孽横空出世。\n而林望舒本人，看着自己上辈子出生自带的读档系统笑而不语。\n男女主的机缘？我的了。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "无CP", "打脸"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大师姐是修仙界鬼见愁", "fullTitle": "大师姐是修仙界鬼见愁", "link": "https://fanqienovel.com/page/7382011300081060889", "data": [18.52, 18.84, 18.97], "trend": 0.44, "latest": 19.0, "wordNumber": 1061436, "creationStatus": 1, "desc": "【已签约出版】（私设多，切忌套公式）\n【和死对头杀穿修仙界+超绝活人感cp＋双强天才成长流+有大基调+易燃易爆炸+微群像+姜郎才烬he】\n暴力嚣张女vs嘴毒腹黑男\n燃！战斗向！从身到心成长型男女主，剧情流有脑修仙文！\n睚眦必报的短命天才少女穿越了！\n本以为是普普通通的修仙世界，却在这里遇到了以为自己手握剧本的穿书女、走龙傲天剧情的气运之子、从天才宝座坠落后本该堕魔的大反派？\n这是一个棋子掀翻棋盘，干掉棋手的故事。\n*\n【一不小心和对家顶流谈恋爱了咋办？】\n听说不朽仙门的首席大师姐和北斗剑宗天生剑骨的小师叔不对付，见面就掐架？\n狐朋狗友：“我说，你和盛大剑仙这么你来我往的打拉锯战已经这么久了，什么时候正式结为道侣啊？”  \n姜珩伸出一根手指摇了摇：“你不懂，暧昧期才是最上头的。谈上了，就不好玩儿了。”\n*\n“放眼神州，也就他配得上我。”\n“放眼神州，还有谁比我更配你？”\n*\n“久仰大名，初次见面，我是来杀你的。”\n“天诛而不死者，是为仙。诛天而创世者，方为神。”\n“告诉他们，弑神者，姜珩。”\n【简介无能，移步正文】", "tags": ["玄幻言情", "古代言情", "穿越", "天才", "强强", "群像"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听说我死后成了反派白月光", "fullTitle": "听说我死后成了反派白月光", "link": "https://fanqienovel.com/page/7383825464940317720", "data": [31.89, 32.11, 32.3], "trend": 0.41, "latest": 32.3, "wordNumber": 476600, "creationStatus": 0, "desc": "【实体书已上线】桑念不小心爬到了修仙界，成了书里下场凄惨的恶毒女配。\n　系统：你的任务是嫁给男配谢沉舟，虐待他，羞辱他，然后被他嘎掉。\n　桑念：ok(挥舞小皮鞭)（打中自己）（噗通倒地）\n　系统：（沉默）（望天）\n　系统：任务更改，你给我攻略他，失败就去挖煤\n　桑念：（自信一笑）这简直易如反掌\n　然后她就成功被谢沉舟嘎掉了。\n　她以为自己会被送去隔壁世界挖煤，可再睁开眼，她重生到了三百年后。\n　系统很沉重：“网卡来晚一步，你有了新的任务。”\n　桑念：“是什么？”\n　系统：“救赎黑化成反派的谢沉舟，让他变成一个懂爱的正常人，重点是让他停止灭世。”\n　桑念：“……”\n　#这个反派，我曾见过的#\n　#你怎么不等大结局再来呢#\n　#要不你还是把我删了吧#\n　*\n　谢沉舟恨桑念。\n　所有人都这样认为，包括他自己。\n　可她死的那一日，谢沉舟弃仙途入魔道，纵身跃下无尽炼狱。\n　他踏过忘川河中无数浮沉尸骨，一寸寸翻遍三百里黄泉。\n　冥界震荡，恶鬼嚎啕，两岸仙神皆闻之色变。\n　人人都道谢沉舟疯了。\n　只有谢沉舟知道，他只是想找回一个人。\n　他的妻子，他的……念念。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "甜宠", "反派", "异世穿越", "HE"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怎奈她一身反骨，就爱给众神添堵", "fullTitle": "怎奈她一身反骨，就爱给众神添堵", "link": "https://fanqienovel.com/page/7451062991820164158", "data": [18.71, 18.95, 19.09], "trend": 0.38, "latest": 19.1, "wordNumber": 366467, "creationStatus": 0, "desc": "今日《神仙日报》头版头条：\n　《注意！天庭新增反骨仔一位！》\n　　据悉，此人乃是三坛海会大神新领养的小跟班，人送外号“四姑奶”。\n　　孙大圣明着反，二郎神暗着反，三太子随时反，四姑奶你反我就反，反必跟随。\n　　这几个人不干别的，光是聚在一起唠唠嗑，玉帝就睡不着觉。\n　　你说说他们，自身实力强悍也就罢了，后台还一个比一个硬。\n　　太乙真人、玉鼎真人、菩提老祖……\n　　前两位不能撕破脸，后面那位更是完全惹不起，也就那个四姑奶没什么背景，只有一个爷爷，似乎在天庭打工。\n　　满天神佛，沈芙星随身携带画像，逢人就问：“你好，见过我爷吗？”\n　　都没见过。\n　　天兵和仙侍里也找不到这个人。\n　　倒是鸿钧老祖和蔼地端出一碟糯米糍，用拂尘指了指，笑道：“孩子，你若吃完这碟点心，我便与你结为兄妹。”\n　　菩提老祖：套镇元子公式，扣分！抢我台词，扣大分！！叉出去！！！", "tags": ["玄幻言情", "古代言情", "幻想言情", "古色古香"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [42.22, 42.22, 42.58], "trend": 0.37, "latest": 42.6, "wordNumber": 3251736, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用 为累赘而丢下的病弱少年，她给他送资源，给他送装备，与他藏在衣柜里小心的亲吻。\n在危机遍布的海岛，看到那坨黑色带着触手的形似章鱼的生物，她也来者不拒，把黑色怪物藏在了自己的口袋里，它一天天长大，最后有了人的形状，她觉得可以教它亲吻了。\n系统重新上线，失声惊叫，“你究竟是怎么能做到和那么多鬼怪BOSS谈恋爱的啊！”\n白瑶:“你不是说让我攻略他们？”\n系统崩溃，“我是让你把游戏攻略成功活到最后，没有叫你嫖BOSS 啊！”\n白瑶:“啊这……”\n不可言说的怪物身体撕成两半，它的触手把藏起来的贝壳都送到了她的面前，“瑶瑶，亲我呀。”\n白瑶:好感度都刷满了，不亲说的过去？", "tags": ["悬疑脑洞", "悬疑", "灵异", "系统", "穿越", "惊悚游戏"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：我真不是张家人，真的！", "fullTitle": "盗笔：我真不是张家人，真的！", "link": "https://fanqienovel.com/page/7618255935110138905", "data": [6.83, 6.83, 6.85], "trend": 0.02, "latest": 6.8, "wordNumber": 399237, "creationStatus": 1, "desc": "【刚出分，后续会涨。无cp，人物私设原著土著。有回忆杀很多，非爽文。不是吴邪黑！不黑主角团！简介无力。有点火葬场和日常文的特色】\n张安没有想到只是一个姓，会给他的人生带来天翻地覆的变化。\n他和一个叫关根的初遇，因为他藏着右手，他就问他是不是张家人。\n张安摇头，他不知道什么是张家人，藏着右手当然是有他的原因。\n后来，他遇到了很多人，他们都把他当成了张家人，无论张安怎么解释，他们都不相信。\n张安没招了，一个装睡的人是永远叫不醒的，更何况是这么多装睡的人。\n于是他成了吴邪计划里的第一个棋子，也是后来计划里十七个少年中唯一“死”掉的那个。\n张安在长白山崖迎来了新生，只是没想到一场意外让他们重逢。\n他们都以为人死了，没想到在雨村他们又相遇了。\n……\n吴邪看着“沈姑姑”作画的背影，想起门后那幅旧画。\n王胖子隔着墨镜，再也看不见“沈祖祖”眼里曾如月牙弯起的笑意。\n黑瞎子看着他戴的墨镜，一度怀疑这是影分身。\n张起灵沉默注视，他认得那双眼睛，却不懂族人为何否认自己的身份。\n黎簇拽住他的衣袖，声音发颤：“小安哥，我没家了，你也不要我了吗？”\n张安坐在悬崖边，心想他要回家了，这些人又唱又跳的干什么。", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "同人"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：娇纵美人深陷修罗场", "fullTitle": "快穿：娇纵美人深陷修罗场", "link": "https://fanqienovel.com/page/7595632372599507992", "data": [5.68, 5.7, 5.7], "trend": 0.02, "latest": 5.7, "wordNumber": 746545, "creationStatus": 1, "desc": "【评分刚出还会涨₍˄·͈༝·͈˄*₎◞ ̑̑】\n\n　　【快穿➕无限流➕训狗文学➕修罗场➕追妻火葬场➕超级雄竞➕万人迷➕所有人都爱女主➕疯批变态强制爱➕微恐➕全洁】\n\n　　苏软一觉醒来发现自己竟然被迫成为了一场惊悚游戏的玩家，大脑一片空白，失去了所有的记忆。\n\n　　系统x告诉她，她在进行一场以爱为名的游戏。\n\n　　为了活下去，她被迫脚踏n条船，说着些虚伪的情话，\n\n　　她以为自己骗住了所有人，却没有注意到周围人看向她的眼底是遮掩不住的粘稠爱意和病态的偏执。\n\n　　副本一：林中别墅【1v6】【已通关】\n\n　　你是小团体中的小透明，本应该会在一个雨夜中被所有人抛弃，被雨夜屠夫杀害。\n\n　　可后来未婚夫妻为你自相残杀，反目成仇；雨夜屠夫单膝下跪，只为了求你一吻；姐弟共感，每天夜里向你索取……\n\n　　你成为了所有人掌心中的宝贝。\n\n　　可你该怎么从他们的控制中逃离……\n　　副本二：借种的寡妇【已通关】\n　　副本 ienovel.com/page/7572216848263941144", "data": [34.11, 35.16, 36.69], "trend": 2.58, "latest": 36.7, "wordNumber": 1162489, "creationStatus": 1, "desc": "【上位者低头+高干+顶级拉扯】+【偏现实向】+【非甜宠文】+【没有龙傲天打脸，只有小人物的步步为营】\n沈念禾是一本“万人迷”小说里的恶毒女配，是女主完美人生的对照组。\n当她被男女主联手逼至绝境、濒死之际，一个名为“拜金系统”将她唤醒。\n它告诉她：唯有从那些气运加身的男主们身上获取金钱，才能汲取他们的气运，逆转家破人亡、惨淡收场的既定结局。\n从此，她收起无用的骄傲，步步为营，只为谋财。\n有人讥讽她拜金、浅薄、不择手段——\n她只轻笑反问：“这世间，谁不爱钱？”\n若有人说不爱，那大抵只是虚伪得不够坦荡。\n可她未曾预料，这场以金钱为名的清醒游戏里。\n那些曾视她为玩物、笑她为捞女、说她给女主提鞋都不配的“天之骄子”，竟一个个为她俯首，步步沦陷。", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "重生", "打脸"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成财阀太子爷的作精前女友", "fullTitle": "穿成财阀太子爷的作精前女友", "link": "https://fanqienovel.com/page/7641635688978336792", "data": [73.39, 73.39, 75.29], "trend": 1.89, "latest": 75.3, "wordNumber": 315876, "creationStatus": 0, "desc": "「腹黑男人X娇气包｜双洁、甜宠」\n穿成财阀校园文里的恶毒女配，柯眠棠接到的任务是：半年内扮演好男主的女朋友，稳定他的反社会情绪，等原书女主出场后，然后拿钱走人，功成身退。\n男主荣涉，星云集团太子爷，白名单榜首。\n表面温润如玉，骨子里偏执病态，占有欲强到令人发指。\n柯眠棠每天战战兢兢地演着娇纵女友，生怕露馅。\n可来的第一天，她就被男主亲哭了。\n系统：“问题不大，别慌。”\n她信了。\n然而男主看她的眼神越来越不对劲，并非原著里对恶毒女配的冷漠，倒像是让人后背发凉的痴迷。\n系统又说：“别怕，小说结局是男主和原书女主在一起，既定结局。”\n她放下心来。\n后来，原书女主终于登场。\n但男主对那位真命天女兴趣淡淡，反倒对前女友兴致盎然。\n柯眠棠瑟瑟发抖：说好的原著里他会爱上原书女主呢？\n-\n终于，任务结束前一晚，她满心欢喜一亿到账。\n结果系统突然失联。\n重启后，终端程序直接被篡改，从“剧情纠正”变成了“爱上男主”。\n她懵了。\n一双大手从身后掐住她的腰，男人的呼吸落在耳畔，嗓音低哑带笑：“宝贝，你知道我为了留住你，有多辛苦吗？”\n他早在她穿来的第一天就发现了真相。\n立意：黑心的财阀继承人从不做亏本买卖。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "甜宠", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法学校小学妹，沙雕搞事啥都会", "fullTitle": "魔法学校小学妹，沙雕搞事啥都会", "link": "https://fanqienovel.com/page/7388389162069543961", "data": [34.31, 34.92, 35.51], "trend": 1.2, "latest": 35.5, "wordNumber": 2532683, "creationStatus": 1, "desc": "【非西幻，中式魔法学院，沙雕+群像+搞笑日常，有cp】\n　　【女主沙雕搞事带偏所有人，一群神经学生搞笑学魔法的故事】\n　　黎问音一朝穿到魔法世界，在顶尖中式魔法学院里苟且偷生。\n　　剪院旗当校服，偷抢课本夺命奔跑，把各个院长气的七窍生烟，禁闭室第一贵客。\n学习魔法，植物魔法变植物大战僵尸，药剂做听音药剂，编织魔法做出来个四处创人的筋斗云！\n　　很会吐槽的学长：我本意是做一个好学生，直到她成为我的同学。\n安静的社恐学姐：她的花样层出不穷，很厉害。\n　　好奇宝宝二傻子学长：经常会非常佩服她的操作，要是我也能这么胆大妄为就好了。\n不理解其他人的学姐：我感觉她很好啊！不明白为什么那么多人说她是大麻烦。\n　　后人闻之叹之：那位学姐，是经久不衰的传奇。", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "穿越", "团宠", "异世穿越", "搞笑轻松", "群像"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成兽世恶雌：末世强者沉迷打怪", "fullTitle": "穿成兽世恶雌：末世强者沉迷打怪", "link": "https://fanqienovel.com/page/7525723826827578430", "data": [28.81, 29.16, 29.67], "trend": 0.86, "latest": 29.7, "wordNumber": 1095822, "creationStatus": 0, "desc": "【番外更新中】\n　　兽世１ｖN＋雄竞＋雌性少＋雄性多＋团宠＋空间＋女主植物系异能\n\n　　乔然带着植物系异能和物资空间，穿进星际兽人游戏世界。\n\n　　好消息：系统匹配六位兽夫\n\n　　坏消息：他们正在策划离婚后如何嘎了她。\n\n　　乔然：…\n\n     后来冷峻的狼王，矜贵的麒麟，桀骜的游隼兽王虔诚温顺地跪在她的脚下，苦苦哀求：只要不离婚，怎样都行。\n\n       想要离婚不是你们吗？现在跪什么？    \n\n甜爽，轻松，搞笑", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "空间", "兽世"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "四个孩子四个妈？渣爹赶紧受死吧", "fullTitle": "四个孩子四个妈？渣爹赶紧受死吧", "link": "https://fanqienovel.com/page/7574903131662732312", "data": [26.96, 27.55, 27.55], "trend": 0.59, "latest": 27.6, "wordNumber": 967523, "creationStatus": 1, "desc": "「重生+豪门+打脸虐渣+爽文+搞笑」\n上一世，容昭宁受尽霸凌，惨死时体无完肤。\n死后，她绑定系统穿到99个世界做任务，却在噩梦中目睹家人个个下场凄惨：\n她那风流多情的渣爹身中数刀惨死。\n冷漠大哥卷入命案被判枪决。\n病娇二哥坠楼身亡。\n嚣张四弟被卖缅甸，最后做成人彘折磨至死。\n再睁眼，她重生到刚回厉家这天，那些欺凌过她的人，都将下地狱！\n听着家人重复上辈子的混账话，容昭宁直接一拳砸过去，打得几人鼻青脸肿：“从今天起，这个家我说了算！懂？”\n为扭转全员惨死结局，她专治各种不服—\n渣爹敢沾花惹草？断他桃花，设死门禁，敢反抗就揍到他喊祖宗！\n大哥冷漠寡情？打包扔去孤儿院做义工，磨掉一身戾气！\n二哥阴湿病娇？发配乡下闺蜜家养猪场，扛猪喂料练心性！\n四弟嚣张跋扈？放在眼皮子底下，亲自调教，打到他跪地叫姐！\n同父异母的厉家三兄弟瑟瑟发抖：“妹妹/姐，打了渣爹就不能打我们了哦～”\n渣爹气得在一旁骂骂咧咧。\n—\n上一世，从她来到京市，直到死…微信置顶那人都不曾回过她一条信息。\n这一世，看着对方刷屏的消息，容昭宁烦躁拉黑！\n谁知，男人撕下伪装，将眼前掉马的人亲到红温，“宁宁，你不乖！快把哥哥微信加回来！”", "tags": ["现言脑洞", "现代言情", "重生", "豪门世家", "打脸", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "啊！被我逼黑化的反派们能读我心", "fullTitle": "啊！被我逼黑化的反派们能读我心", "link": "https://fanqienovel.com/page/7320557221803199550", "data": [16  28.2, "wordNumber": 1082856, "creationStatus": 0, "desc": "骆宁替太后挡刀重伤，换取家族爵位。\n她南下养病三年，回来后却发现，表妹占据了她的院子。\n表妹也取代了她的地位。骆宁的父母、兄长疼她、祖母赏识她；就连骆宁的竹马，也暗慕她，说她处处比骆宁优秀。\n骆宁大闹，他们联手害死了她。\n做鬼十八年，看到了他们的下场，她重生了。\n她又活了。\n这次，她想要活得痛快。\n——*——*——\n骆宁重生后为复仇，找摄政王做靠山。\n“明面上你是雍王妃，实际上你是本王之奴。他日，助你假死脱身，更名换姓。封你为郡主，有封地、俸禄，同郡王。”\n她同意了。\n她镇得住侧妃、斗得赢野心勃勃的门阀、哄得了太后。\n几年后，摄政王成了新主。\n跋扈狠戾的年轻帝王，用很缥缈的声音问她：“郡主印换皇后金印，可愿意？”\n她忠诚听话，头一回忤逆他：“不愿！”\n—*—*—\n原书名：《侯府忘恩义？摄政王撑腰，不原谅》", "tags": ["宫斗宅斗", "古代言情", "重生", "王妃", "前世今生", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高门主母的驯夫手册", "fullTitle": "高门主母的驯夫手册", "link": "https://fanqienovel.com/page/7550793954933885976", "data": [18.62, 19.15, 19.92], "trend": 1.3, "latest": 19.9, "wordNumber": 547008, "creationStatus": 0, "desc": "程昭被赐婚给最年轻的国公爷周元慎。\n　　周元慎有一房背景强大的娇妾，又与寡嫂暧昧不清，憎恶高门贵女身上的古板沉闷。\n　　偏程昭是受过最正统教养的贵女。\n　　面对国公府层出不穷的争斗、小妾的挑衅、寡嫂暗中拨火，程昭解决起来游刃有余。\n　　“我嫁过来做主母，就是替国公爷收拾烂摊子的。”程昭温良恭俭。\n　　待我地位稳固，有了子嗣，下一个被收拾的烂摊子，就是国公爷你。\n　　——*——*——\n　　初见时，周元慎觉得程昭虚伪狡诈；相处日久，赞她恢廓大度、见识广博。\n　　他周元慎的夫人，没有任何缺点。唯一不好的，是她心中另有所属，不爱他。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "和渣夫同归于尽后又双双重生了", "fullTitle": "和渣夫同归于尽后又双双重生了", "link": "https://fanqienovel.com/page/7402062722877115417", "data": [31.78, 32.35, 32.95], "trend": 1.16, "latest": 32.9, "wordNumber": 669864, "creationStatus": 0, "desc": "【实体书《岁岁春欢》已出，全平台可购】\n【女主渣男双重生＋男主穿越＋双向救赎＋扮猪吃虎】\n十七岁这年，沈嘉岁嫁于陆云铮为妻，沈陆两家皆为将门，强强联合。\r\n成婚两年后，陆云铮大败敌国名扬四海，沈家却因通敌叛国满门抄斩。\r\n沈嘉岁临死前才得知，沈家通敌叛国罪证乃陆云铮亲呈，且陆云铮想娶的人从来不是她，而是沈家养女，她视作亲妹妹的顾惜枝。\r\n灭门之仇，欺骗之恨，沈嘉岁临死反扑，拉陆云铮同归于尽。\r\n再一睁眼，重回陆云铮上门提亲那一日。\r\n沈嘉岁匆忙赶到时，陆云铮正深情开口求娶顾惜枝。\r\n原来，陆云铮也重生了......\r\n————\r\n沈家通敌叛国一事迷雾重重，牵涉甚广。\r\n为查清真相，沈嘉岁决然入局，这时，一人着绯红官服站在了她的身旁。\r\n沈嘉岁依稀记得，上一世咽气之时，似有一片绯红衣角闯进视野......\r\n————\r\n江浔：“江某平生所愿，唯山河远阔，国泰民安。如今再添一愿，愿心上之人岁岁无虞，常乐长安。”", "tags": ["宫斗宅斗", "古代言情", "重生", "扮猪吃虎", "HE", "相互救赎"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书：侯爷，夫人又给你纳妾了", "fullTitle": "穿书：侯爷，夫人又给你纳妾了", "link": "https://fanqienovel.com/page/7563282810547473433", "data": [30.75, 31.01, 31.51], "trend": 0.76, "latest": 31.5, "wordNumber": 1014007, "creationStatus": 0, "desc": "穿书+宫斗宅斗+重生的儿子+爽文+躺平的一生\n争家产大获全胜的林嫣然，因为太高兴参加极限运动摔死了，有幸穿到了一本她看过的小说里，她成了因为小说男主养外室抑郁而死的正室女配。\n书中女主当然就是成功登堂入室的那个外室。\n本来林嫣然都把袖子撸起来了，准备搬空渣男的私库，把外室纳进府里来折磨。\n结果林嫣然发现她这个‘大儿子’好像有点门道。\n所以画风就变成了，‘轩儿，管管你弟弟。’\n‘轩儿，管管你父亲。’\n“轩儿······”\n总的来说就是林嫣然看戏躺平的一生。\n楚云轩：母亲歇着，事情全部都交给儿子。", "tags": ["宫斗宅斗", "古代言情", "萌宝", "穿越", "穿书", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "勾太傅，人前不熟人后如做了夫妻", "fullTitle": "勾太傅，人前不熟人后如做了夫妻", "link": "https://fanqienovel.com/page/7591861882936380478", "data": [45.4, 45.4, 45.84], "trend": 0.43, "latest": 45.8, "wordNumber": 1000427, "creationStatus": 1, "desc": "状元夫君熟睡，宋怜抱住霁月清风的当朝太傅哭：“求求您，救救我……”\n她能有什么错？她只是不想死。\n家规无情，长公主不容人，夫君要做驸马，留给宋怜唯有一条路——吊死。\n于是她壮着胆子，勾引了当朝太傅。\n陆九渊乘着酒意：“如你所愿。”\n从那以后，宋怜予取予求，陆九渊事事如了她的意。\n他俩一个蓄意勾引，一个见色起意。\n人前殊途陌路，人后颠鸾倒凤。\n有人告密：“宋怜她精于算计，处心积虑破坏太傅大婚。”\n陆九渊淡泊道：“我就喜欢被她霸占着，怎么了？”\n-\n太傅陆九渊出去打了场仗，回来发现自己暗中相看好的姑娘，被皇上指给新科状元了。\n他大发雷霆之后也没跟任何人提及，不过一个女人而已，犯不上。\n直到这女人哭着抱着他的腰求他：“求求您，救我……”\n“一哭二闹的。”陆九渊笑纳了，偶尔当回活菩萨也不错。\n可原本是无聊时纾解的玩物，却被他养成了尖牙利爪的小豹子。\n有人状告宋怜为虎作伥，飞扬跋扈，目中无人。\n陆九渊：“我惯的，你适应一下。”\n后来，宋怜说皇帝该换了，陆九渊就把皇帝换了。\n宋怜说反了吧，陆九渊就反了。", "tags": ["宫斗宅斗", "古代言情", "宠妻", "甜宠", "双洁", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生：双姝媚骨，撩翻权臣覆江山", "fullTitle": "重生：双姝媚骨，撩翻权臣覆江山", "link": "https://fanqienovel.com/page/7628295560520289342", "data": [16.23, 16.48, 16.48], "trend": 0.25, "latest": 16.5, "wordNumber": 510425, "creationStatus": 1, "desc": "(刚开分，后面会涨，放心食用！)时家双姝，前世孤臣之女，低调隐忍，却因父亲不肯站队，被皇子构陷，满门倾覆！\n浴火重生，姐妹俩携滔天恨意归来，收起善心，化身蛇蝎钓系！\n姐姐时蕴，清冷皮囊下藏着妖媚骨，妹妹时幸，小白花外表裹着蛇蝎心。\n姐妹俩勾勾手指，让桀骜娇贵的定安王世子沈浸星神魂颠倒，俯首称臣！\n让算无遗漏的清弈公子柳诗年倾心相付，倾尽权谋！\n世人皆叹，时家姐妹不知天高地厚，竟敢招惹京城两大权贵天骄！\n却不知，两位天骄早已沦为她们的裙下之臣，为她们扫平障碍，手撕仇敌！\n这一世，不做温顺闺秀，只做复仇毒花，撩权臣，覆朝野，让害我时家者，万劫不复！", "tags": ["宫斗宅斗", "古代言情", "重生", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "缚春情", "fullTitle": "缚春情", "link": "https://fanqienovel.com/page/7170319408890383396", "data": [22.13, 22.13, 22.31], "trend": 0.18, "latest": 22.3, "wordNumber": 603240, "creationStatus": 0, "desc": "【实体书首页可购 影视已售】\n江宋二府世代交好，宋挽未出生便同江行简定下婚约。二人青梅竹马，她困于后宅，一生所学不过为做江家妇准备。\n少年鲜衣怒马志向高远，未及弱冠便远赴边关建功立业，临行前江行简亲手为她戴上白玉簪。\n一句等我，宋挽便入了心，哪怕他战死沙场，她也执意抱着灵位嫁入城阳侯府。\n她将少年藏在心尖守寡六年，却等到江行简带着挚爱回京。少年挚爱言行古怪，她夏日制冰，制火器扶持侯府扶摇而上。\n宋挽看着他拥人入怀，予那少女万千宠爱。也看着他亲手将掌家之权从她手中夺走，只为博美人一笑。\n世家从无和离妇，宋挽抛弃所有离开侯府，却被一个离经叛道横行无忌的男人缠上。\n谁知江行简又幡然醒悟。\n江行简:宋氏生为我的人，死为我的鬼。\n沈千聿:你找你的死鬼，我要我的阿挽……", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "状元悔断肠，玄学大佬不好惹", "fullTitle": "状元悔断肠，玄学大佬不好惹", "link": "https://fanqienovel.com/page/7631195129595841561", "data": [16.57, 16.55, 16.71], "trend": 0.14, "latest": 16.7, "wordNumber": 421685, "creationStatus": 1, "desc": "［玄学+宅斗+抓鬼+爽文+无cp+算命+故事单元］\n修炼三百年的玄学大佬桑夏，在飞升之际陨落了，重生到了一百年以后。\n成为了被新科状元抛弃的糟糠之妻。\n这还不够惨，她还是被自己的亲祖母抛弃的太傅府真千金。\n桑夏都怀疑，天道是嫉妒她的天赋，才让她重生到这个可怜虫身上。\n人人都想看她笑话，偏生她是最争气的那个。\n风水测算，捉鬼画符……\n短短时间内，她便成为了京中人人敬畏的玄学大佬。\n百姓敬畏的监正大人喊她祖师奶奶。\n京中人人惧怕的纨绔世子，求着拜她为师。\n连权侵朝野的辅国公毕恭毕敬的喊她主子。\n这时，那位状元爷前夫，以及抛弃她的祖母，才后悔莫及。", "tags": ["宫斗宅斗", "古代言情", "重生", "无CP", "大佬", "风水秘术"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书，勾他上位", "fullTitle": "穿书，勾他上位", "link": "https://fanqienovel.com/page/7357557799548619800", "data": [18.17, 18.17, 18.19], "trend": 0.02, "latest": 18.2, "wordNumber": 1102552, "creationStatus": 0, "desc": "番茄短剧【坤仪】已上线~\n【穿书，男非女洁，宫斗，互相攻心，HE】\n太子君泽辰，见惯心机深沉之女子，独爱单纯善良之品性。\n塞外征战，邂逅凌悦，为其洒脱善良所倾倒，许她一生一世一双人。\n然两年已逝，太子妃却未能有孕。\n\n圣意降下，尚书令之女苏婧瑶，册封为太子侧妃，身负延绵皇嗣之重任。\n她年方十五，穿越古代已历十五载，自襁褓婴孩出落为绝世佳人。\n十岁之际，偶然得知所处世界，是她现代看过的小说。\n书中男主君泽辰与女主凌悦，由少年情谊终至相看两厌。\n而苏婧瑶，是二人情谊正浓时，由陛下赐给太子的侧妃，终因不得太子欢心，于东宫郁郁而终。\n现代而来的苏婧瑶，不信爱情，唯信己身。\n无论身处现代抑或古代，她皆志存高远，欲扶摇直上九万里。\n男子，为她所属；权力，亦为她所求。\n\n第一卷：正文——大野心女主披巾斩棘宫斗上位\n第二卷：君瑶双重生——双洁甜宠人生！\n第三卷：原书君重生——跋扈任性娇妃vs冷漠老男人（追妻火葬场）\n第四卷：现代——瑶瑶情史，你若盛开，蝴蝶自来\n四世情缘天注定，因果循环终闭环。\n【注：四卷男女主都是苏婧瑶、君泽辰】", "tags": ["宫斗宅斗", "古代言情", "穿越", "HE", "王妃", "甜宠", "追妻火葬场"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "中奖10个亿的护士躺平生活", "fullTitle": "中奖10个亿的护士躺平生活", "link": "https://fanqienovel.com/page/7653831326541286462", "data": [16.93, 22.65, 27.95], "trend": 11.01, "latest": 27.9, "wordNumber": 391028, "creationStatus": 1, "desc": "沈南星三十七岁，在三甲医院急诊科做了十二年护士。她曾以为和医生丈夫一起进医院、结婚生子、买房还贷，就是普通人最稳妥的人生。可十二年过去，她熬过夜班，生下两个儿子，撑起家里家外，却在医院改革中被裁，失去工作后，婆婆态度骤变，丈夫沉默回避。最终，离婚了，那天雨很大，她路过一家彩票店，随手买下几注彩票，所有人都以为沈南星已经输了。直到她发现，自己中了十个亿........", "tags": ["职场婚恋", "现代言情", "萌宝", "家庭", "职场", "医生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "远嫁八年，回娘家难如登天！", "fullTitle": "远嫁八年，回娘家难如登天！", "link": "https://fanqienovel.com/page/7567928097673055256", "data": [28.83, 28.83, 31.06], "trend": 2.24, "latest": 31.1, "wordNumber": 1160040, "creationStatus": 1, "desc": "（远嫁+恶婆婆+过年不让回娘家）\n林婉怡为爱远嫁八年，一次没有回过娘家，临近过年父亲病重弟弟结婚，她提出让丈夫和女儿一起回娘家过年，却被婆家人轮番刁难。\n婆婆说：“你嫁到王家就是王家人，别一天到晚惦记娘家，给他们一百块钱，我看他们还想不想你。”\n大姑姐说：“你走了谁照顾我爸妈？谁给他们做饭洗衣服？”\n就连丈夫也唯唯诺诺：“老婆，我姐说的对，大过年的你不在村里人会笑话我们的，实在不行你打个视频跟爸妈见一面吧。”\n林婉怡愤怒不已想要带着女儿自己回去，婆婆却又藏起女儿：\n“想走自己一个人滚，不准带走我王家的子孙！”\n后来，林婉怡离了婚，带走了女儿，还把王家搅了个天翻地覆。\n王家人，终于后悔了……", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "机关女人", "fullTitle": "机关女人", "link": "https://fanqienovel.com/page/7539124126061972505", "data": [12.65, 12.92, 13.13], "trend": 0.48, "latest": 13.1, "wordNumber": 799942, "creationStatus": 0, "desc": "农村出身的吴玫，通过公务员考试，拥有了政府机关干部的身份，本以为一朝上岸，就可衣食无忧。可树欲静而风不止，看似体面的工作，实则暗潮汹涌，危机四伏。\n　　吴玫能否适应机关工作？是任人收割？还是自主沉浮？工作与感情，婚姻与家庭，这一切能否成为桎梏吴玫成功的枷锁？\n　　请与作者一起走入机关女人的精彩生活……。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "闪婚刑警老公，陆队人前请装不熟", "fullTitle": "闪婚刑警老公，陆队人前请装不熟", "link": "https://fanqienovel.com/page/7638577943551167550", "data": [8.33, 8.33, 8.66], "trend": 0.33, "latest": 8.7, "wordNumber": 394868, "creationStatus": 1, "desc": "「刑警硬汉队长x娇软画像师」\n「先婚后爱+细水长流+破案日常+甜宠+双洁+1v1」\n相亲那天，温清梨遇到了自己学生时代的暗恋对象，陆峥。\n仅用两句话，两人就敲定了闪婚事宜。\n“不对外公开。”\n“相敬如宾，互不干涉。”\n他是冷硬糙帅的刑警队长，她是警局特聘的画像师。\n白天，他们联手侦破郊外抛尸案、明星被杀案、雨夜失踪案……\n夜晚，她守着婚前约定：床上熟透，床下不熟。\n她藏起自己暗恋的小心思，努力和他保持着相敬如宾的状态。\n直到发生了一件事，她主动留下一封离婚协议，提着行李箱连夜跑路。\n-\n所有人都以为陆峥天生冷酷，不会爱任何人。\n直到温清梨提出离婚跑路后，他差点疯掉。\n没有她画的画像，凶手样貌不像，没有她深夜的晚安吻，长夜漫漫。\n他费尽千辛万苦找到她，掐着她细腰，将她逼至墙角：\n“为什么提离婚？”\n“回来，别跑，以后我的命都给你。”\n温清梨：“！！！”\n说好的不需要爱情呢？", "tags": ["职场婚恋", "现代言情", "甜宠", "先婚后爱", "暗恋", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "潮汐界限", "fullTitle": "潮汐界限", "link": "https://fanqienovel.com/page/7524517490395712536", "data": [25.95, 26.12, 26.23], "trend": 0.29, "latest": 26.2, "wordNumber": 348239, "creationStatus": 0, "desc": "【实体书《潮汐界限》已上市，各平台搜索书名可买】\n办公大楼里传着两句心照不宣的话——\n一是周聿深的车驶过观复街，连积雪都会识趣地消融三分。\n二是他的行程从不为谁停留。\n后来蔚汐才知道，这两句话都是错的。\n*\n那场行业座谈会上，蔚汐被突兀地点名坐进第一排。\n全场目光灼灼，她的发言快速且精准，却仍然紧张到指尖发颤，不敢抬头看主位上那位。\n再后来，分手那天雨很大——\n她因醉酒蜷在街角等车，朦胧间看见那辆从不驻足的黑色轿车缓缓停驻。\n“蔚小姐。”男人嗓音沉缓，整洁的西装沾了雨气，“你抖得厉害。”\n他那样威严的大人物。\n竟会破例俯身撑伞，纵容她在车里哭了足足四十七分钟。\n*\n“周聿深，你图什么？”\n“潮汐有信，为我停留。”\n*\n观复街的积雪会消融，他的锋芒也会俯首。\n而潮汐界限，终抵不过他为她心软的四十七分钟。", "tags": ["职场婚恋", "现代言情", "大佬"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心跳越轨", "fullTitle": "心跳越轨", "link": "https://fanqienovel.com/page/7259746208799788067", "data": [13. 料是个天才少女，刚入学就出了名\n第一次见到谈斯礼，听到他那声音觉得有几分耳熟，她没忍住多看了两眼\n*\n见面第一天，少年脸上笑意懒散，不达眼底，他掀了掀眼皮，歪首戏谑：“妹妹？还满意吗？”\n姜枳愣了下，下意识回道：“满意。”\n谈斯礼只觉得这人有点呆\n后来，他将人圈抱在怀内，亲的她喘不过气\n在她呼吸的间隙，少年在她耳边低笑，腔调懒洋洋的，嗓音暧昧又蛊人\n“宝宝，这么喜欢我的声音，我喘给你听好不好？”\n*\n提起谈斯礼，所有人对他的评价都是很拽一男的，不知怜香惜玉为何物\n直到联谊晚会那天，他们看着一向散漫高傲的少年弯下腰，用着他们从未听过的温柔语调，轻哄着怀里的女孩\n“不哭了好不好？”\n“要不…我给你当男妈妈？”\n*\n再后来，姜枳不告而别\n谈斯礼提前保送，再也没来过学校\n再见到他时，是在几年后的同学聚会\n他还是那个天之骄子\n当包厢门再次被推开，众人愣住了\n下一秒，只见男人上前将人揽在怀里埋在她的颈侧，委屈撒娇\n“老婆，怎么来的这么晚。”\n众人：？\n怎么跟他们想的不太一样？", "tags": ["青春甜宠", "现代言情", "天才", "甜宠", "双洁", "群像"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盛夏满分暗恋", "fullTitle": "盛夏满分暗恋", "link": "https://fanqienovel.com/page/7364175997584804888", "data": [11.27, 11.6, 11.93], "trend": 0.66, "latest": 11.9, "wordNumber": 627223, "creationStatus": 0, "desc": "【已签实体｜暗恋成真｜破镜重圆｜甜宠｜1v1双洁】\n沈盛屹是京大金融系出了名的随性浪荡，眼光高，皮囊好看人难追，拿着天之骄子的牌，恣肆桀骜，身边永远花团满簇，从来不缺朋友。\n设创比赛上，池雾临时被好友拉上台救场。\n比赛结束，视频被顶上了论坛，视频中，女孩一身素雅月白旗袍配上那张清冷淡静的脸，侃侃而谈她的设计思路，细腰黛眉，抬眸笑时惊艳了台下众人。\n\n没有人知道，这两个八竿子打不着的人，私底下是怎样纠缠不清的。\n\n比赛后的某个夏日夜晚。\n池雾刚走出宿舍楼，就被人握着腰逼到了角落，退无可退之际，男人低头将她吻得气喘吁吁，脸埋进她颈窝，不满又委屈，“什么时候才能公开我？”\n这段不被朋友看好的爱情里，众人皆知，沈盛屹爱池雾爱的轰轰烈烈。\n可无人知晓的是，池雾其实才是那个先暗恋的人。\n\n池雾喜欢沈盛屹多年，从好奇到一头栽进去。\n哪怕追着他脚步到了大学里，她从来没奢望着他们之间能有什么故事。直到有一天，她的月亮主动来到了她的身边。\n*\n“陪我在这盛夏里，来一场私奔。”\n-\n-\n痞坏浪拽少爷x挺会钓的乖乖女\n*[一场属于她的、他的，他们的满分暗恋]", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "破镜重圆", "暗恋", "双洁", "1v1"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "致命美人计：顶级绿茶杀穿权贵圈", "fullTitle": "致命美人计：顶级绿茶杀穿权贵圈", "link": "https://fanqienovel.com/page/7542450377480735769", "data": [18.28, 18.65, 18.91], "trend": 0.64, "latest": 18.9, "wordNumber": 1373077, "creationStatus": 1, "desc": "【自私自利的白切黑坏女人+颜值身材天花板+勾引+套路+多男】\n沈明月出身偏远山区，年少时目睹父母与一众亲族被人暴打，却求告无门的社会黑暗面，也让她早早看透了这世界的冰冷法则。\n权在谁手，谁就是真理！\n为了不再被欺压，摆脱底层的命运，她从小县城一步步走出去，处心积虑的接近金字塔顶端那层人。\n攻城为下，攻心为上，三十六计里最狠的一计称之为——\n美人计。\n纯真无辜是她的面具，狠辣算计是她的内核。\n她周旋于形形色色的男人之间，形骸放浪的富二代，位高权重的官员、富甲一方的巨贾、前途无量的新贵……\n从小城女孩一步步到权贵圈最蛊人心的白月光。\n“爱我？那就乖乖让我踩着你，登上巅峰。”\n……\n直到谎言碎裂，修罗场降临。\n曾经被她玩弄于股掌的众大佬红着眼将她逼至墙角：“你到底爱过谁？！”\n沈明月眼波流转，唇角微勾，指尖轻轻点在他心口：“当然是你呀乖乖，你是在怀疑我对你的爱吗？”\n欢迎来到坏女人的登顶游戏。", "tags": ["青春甜宠", "现代言情", "校园", "腹黑", "大佬", "白切黑"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "等一场盛夏", "fullTitle": "等一场盛夏", "link": "https://fanqienovel.com/page/7301496396102782014", "data": [19.64, 19.94, 20.21], "trend": 0.56, "latest": 20.2, "wordNumber": 639530, "creationStatus": 0, "desc": "已签实体\n*\n夏时是十六岁那年遇见的祁佑\n少年颓然高傲，自由散漫\n长着张绝好皮囊，浑身散发着游戏人间的痞劲\n喜欢他的女孩不计其数，可他向来兴致缺缺，不曾多看谁一眼\n而她更不可能是他会喜欢的那一类\n循规蹈矩，无聊无趣\n他们本不该有任何交集，直至她发现了他的秘密\n*\n学校里任何人提起夏时都是，“那个长得特漂亮的好学生”\n而提起祁佑便是野蛮生长的肆意少年\n任谁看他们都是八竿子打不着的关系\n可就是这样的两人被撞见在楼梯间里相拥\n一向高傲的少年把头埋在女孩侧颈，声音微不可见：夏时，你喜欢我好不好？\n*\n夏时生命里最黑暗的那段日子是因为佑白的歌才得以支撑下去\n当她认出学校那个银发少年就是自己偶像后便不动声色的靠近\n他帮她走出黑暗，她也想拉他出泥潭\n她的喜欢既克制又清醒\n可未曾想，他会深陷\n*\n夏日热烈，樱花树叶被风吹落一地\n在没人看到的树下，靠着一银发少年\n他右手指间夹了跟烟，没吸，就是任由烟蒂燃烧\n而抬起的左手，搂着一穿校服的女孩\n女孩整个身体都在他怀里，头微微仰起，睁着双水灵灵的大眼睛看他\n对视没几秒，他就耐不住低下了头\n*\n都说骄阳似火，他却比夏日更热烈", "tags": ["青春甜宠", "现代言情", "校园"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [44.58, 44.57, 45.14], "trend": 0.56, "latest": 45.1, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宝宝，选我好不好", "fullTitle": "宝宝，选我好不好", "link": "https://fanqienovel.com/page/7554221989641063449", "data": [39.51, 39.75, 39.88], "trend": 0.37, "latest": 39.9, "wordNumber": 448010, "creationStatus": 0, "desc": "（已签实体出版）\n【强制爱＋前校园后都市＋暗恋＋双洁】\n【坏种少爷 x 乖乖女】\n弟弟不慎追尾撞上豪车被索赔两百万，债主是柯然。\n柯然，英国回来的少爷，家境优渥，长了一张招摇恣意的脸，是站在金字塔顶端的天之骄子。\n沈雾眠找上他，协商分期赔偿。\n柯然直勾勾地盯着女孩半晌，倏地意欲不明地笑了声，“拿你来赔我。”\n沈雾眠知道他是什么意思。\n沉默半晌，“可以保密吗？我们在学校里保持距离。”\n“两个要求。”\n沈雾眠茫然，“什么？”\n柯然勾起薄唇，漫不经心道，“等同的我也给你提两个要求。”\n“那么第一个要求就是——”\n“做我女朋友。”\n-\n所有人都在说是沈雾眠攀附柯然。\n直到一段视频流出——\n柯然醉酒趴在沈雾眠颈窝上，眼圈湿红，敛着眼皮在哭，嗓音要多委屈就有多委屈，\n“宝宝，别喜欢他了，选我好不好？”", "tags": ["青春甜宠", "现代言情", "校园", "总裁", "豪门世家", "暗恋", "位尊权重"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "亲一下就软！", "fullTitle": "亲一下就软！", "link": "https://fanqienovel.com/page/7529586528876497945", "data": [11.86, 12.01, 12.04], "trend": 0.18, "latest": 12.0, "wordNumber": 502525, "creationStatus": 0, "desc": "*已签约出版*（混不吝又痞又帅的校霸X清冷美人好到没脾气的‘乖乖女’学霸）浪子回头，玩世不恭，校园恋爱，甜虐救赎，破镜重圆，1v1双洁\n\n“沈梨，你还可以复读，别拿自己的前程开玩笑，下届清北保送名额，你还有机会。”\n\n“不了老师，我想好了，我想去鹜川念书。”\n\n——承德大学，一所不入流的大专学校。\n\n沈梨拿着高考一门语文149分，其余五门都是零的成绩，去了承德大学。\n\n开学去大专学校报道那天，沈梨无意惹到了校霸的女朋友。\n\n下课就被校霸跟那帮兄弟，堵在了教室走廊。\n\n这个坏学生谢钦有点凶，“这位同学，听说你很拽啊，欺负我女朋友？”\n\n沈梨被吓到了，有些怕他，低着头跟他道歉：“对不起。”\n\n后来，只要有他在的地方沈梨扭头就走，避之不及。\n\n*\n\n谢钦从来没有这么费劲，追过一个人。\n\n沈梨很乖的坐在木椅上，谢钦单膝半跪在地，握着她的手，眼睛湿红。\n\n他已经拿她没办法了。\n\n“沈梨，我是你养的鱼吗？”\n\n“…”\n\n“我们试试好不好？”\n\n“老子，求你了。”", "tags": ["青春甜宠", "现代言情", "校园", "学霸", "双洁", "1v1"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "偷藏湿夏", "fullTitle": "偷藏湿夏", "link": "https://fanqienovel.com/page/7503414411793550361", "data": [12.52, 12.52, 12.65], "trend": 0.13, "latest": 12.7, "wordNumber": 335185, "creationStatus": 0, "desc": "实体书《偷藏湿夏》已上市\n【狂拽欲撩高门少爷vs学霸小甜妹】\n【双学霸+中学时曾相遇+男主先心动】\n大一刚开学，宋浅就得罪了江大的风云人物。\n第一次，她撞飞了谢砚池的咖啡。\n第二次，她晾的内衣掉到了谢砚池头上。\n第三次，她直接扒掉了谢砚池的裤子。\n谢砚池忍无可忍，把人堵在墙角，“宋浅，我是挖你家祖坟了？我有没有告诉过你不准靠近我？”\n宋浅弱弱掏出五十块钱，“对不起学长，这是我买鸭的钱，给你…”\n谢砚池冷冷地扫她：“买…鸭？”\n“是室友让我买的烤鸭…”\n男人把五十块钱揣进兜，“钱都收了，那就为你服务一下？”\n后来，宋浅得知竹马哥哥订婚，难过的蹲在地上画圈圈，一双长腿站到跟前。\n谢砚池：“要不要鸭？免费的，包你开心。”\n-\n江大校草谢砚池，出身江城名门，帅气不羁，笑如朗月入怀，身后女孩成群。\n谁都不知这样的高门少爷，在那记忆丢失的一页里，曾满心满眼都是那个小姑娘。\n某天，江大论坛出现帖子。\n宋浅：【谢砚池腹肌照，十块钱一张】\n众人疯抢。\n谢砚池留言：【宝宝，娇也撒了，肉也卖了，你原谅我行么？哭哭（图）】\n兄弟们：呕…\n-\n【她是我始料不及的遇见，也是我藏在星星里的整个夏天】", "tags": ["青春甜宠", "现代言情", "校园", "总裁", "HE", "双学霸"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [14.86, 14.88, 14.89], "trend": 0.04, "latest": 14.9, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春意入我怀", "fullTitle": "春意入我怀", "link": "https://fanqienovel.com/page/7336505171825937433", "data": [12.78, 12.78, 12.78], "trend": 0.0, "latest": 12.8, "wordNumber": 467040, "creationStatus": 0, "desc": "【待出版】\n【大学校园+浪子回头+男追女+单向救赎】\n【痞坏浪拽vs清冷纯情】\n虞惜大学碰见了自己这辈子最大的一道坎，一个花名在外的纨绔公子哥———靳灼霄。\n\n靳灼霄这人家世好、长得帅，唯二的缺点大概就是性格极坏和浪得没边。\n\n虞惜作为直接受害人，表示从来没遇见过这么不要脸又讨厌的人。\n\n*\n\n“宝贝，按照现在的游戏规则，进来的人可得先亲我一口。”\n\n男人眉眼桀骜，声音跟长相一样，带着浓重的荷尔蒙和侵略性，让人无法忽视。\n\n初见，虞惜便知道靳灼霄是个什么样的男人，魅力十足又危险，像个玩弄人心的恶魔，躲不过只能妥协。\n\n*\n\n两厢情愿的暧昧无关爱情，只有各取所需，可关系如履薄冰，一触就碎。\n\n放假后，虞惜单方面断绝所有联系，消失的无影无踪。\n\n再次碰面，靳灼霄把她抵在墙边，低沉的嗓音像在酝酿一场风暴：“看见我就跑？”\n\n*\n\n虞惜是凛冬的独行客，她在等有人破寒而来，对她说：“虞惜，春天来了。”", "tags": ["青春甜宠", "现代言情", "校园"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频衍生": [{"label": "穿越封神，我功德成圣了", "fullTitle": "穿越封神，我功德成圣了", "link": "https://fanqienovel.com/page/76 /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },

];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}
