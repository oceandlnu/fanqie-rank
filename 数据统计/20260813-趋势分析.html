我破戒了，而他…出现了。", "tags": ["女频悬疑", "灵异"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "当个社畜，怎么成凶案嫌疑人了？", "fullTitle": "当个社畜，怎么成凶案嫌疑人了？", "link": "https://fanqienovel.com/page/7620318256322071576", "data": [16.81, 16.83, 16.95], "trend": 0.14, "latest": 17.0, "wordNumber": 602170, "creationStatus": 1, "desc": "刚开分，后面会涨！请放心食用\n逻辑天才实习生×高冷禁欲护短刑警队长1v1，双洁双强，架空，含私设。\n姜绵只是下楼拿个雷霆外卖，就撞上小区垃圾桶发现人民碎片。\n她挤进人群吃瓜，下一秒直接被目击证人指认成凶手。\n姜绵：满脸???，别这么离谱行不？她只是吃个瓜！怎么成凶手了？\n刑警队队长宋延，高冷禁欲，不近人情，一开口就把她按在嫌疑人位置上磋磨。\n“说一下作案过程。”\n语气冷漠，还把她逗了一通。姜绵气到肺快炸了，幸好天降神探系统，当场洗清嫌疑。\n但她万万没料到自己倒霉到竟被学校分配到临江市刑警支队实习。\n上司，还是宋延!!\n直到某天，姜绵发现，这位高冷禁欲的队长，一跟她对视就耳尖发红。\n她笑眯眯凑近：“宋队，你中暑了?”\n宋延绷着脸：“没有。”\n姜绵挑眉：“那就是……对我心动了。” \n再后来她更惊了。\n这人在床上既不高冷，也不禁欲。\n分明是个装正经的大涩迷！！！\n清水河里，钓友钓起一具高度腐败……\n空置出租屋，夜半墙缝渗出暗红水渍。\n诡异村庄，看似村风纯朴，实则暗藏恐怖陋习。\n腐生菌丛、假面新郎、骨影灯笼……\n一桩桩离奇凶案，撕开人性最黑暗的褶皱。\n而她和他，在刀尖上追凶，也在心动里沦陷。", "tags": ["女频悬疑", "悬疑", "推理", "天才", "破案", "悬疑恋爱"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "阴祸得狐", "fullTitle": "阴祸得狐", "link": "https://fanqienovel.com/page/7363518931169971224", "data": [4.42, 4.54, 4.55], "trend": 0.13, "latest": 4.5, "wordNumber": 1001693, "creationStatus": 0, "desc": "我出生那晚天生异象恍见瑞兽，算命先生说我是天生贵命，福气临门，将来必定大有作为。\n可十二岁那年一场变故让我从此阴祸缠身病痛不止，为了活命，我去祭拜先人求庇佑，却没想到拜错了坟……\n夜晚，身后有九尾如同谪仙般的男人闯进了我的梦里，他说拜错坟是要付出代价的。\n“什么代价？”\n“救命之恩，当以身相许。”", "tags": ["女频悬疑", "悬疑恋爱", "悬疑", "灵异", "第一人称"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纸扎店老板娘她是玄门大佬", "fullTitle": "纸扎店老板娘她是玄门大佬", "link": "https://fanqienovel.com/page/7483682988459314201", "data": [4.68, 4.75, 4.82], "trend": 0.13, "latest": 4.8, "wordNumber": 1029724, "creationStatus": 0, "desc": "女强，无cp（单箭头的和尚有目的接近女主）+爽文+剧情流，女主非圣母，喜欢圣母型女主请绕道。\n　　女主陈昭愿纸扎店的老板。\n　　一个活了很久很久的‘人’。\n        有一部分记忆空白。\n　　琴棋书画，一概不精。\n　　贪财好色，脾气不好。\n　　能动手不喜欢哔哔赖赖。\n　　战绩\n　　古时有天地玄黄四大修仙门派。\n　　陈昭愿身为玄门第一代弟子，一个人灭了其他三门。\n　　能和上古大妖打个平手。\n　　闯过地府，杀过鬼差，打过阎王。\n　　转眼到了新世纪，陈昭愿偏安一隅，开了一家纸扎店。\n　　直到某一日，几十年前救过的男人找上门来。\n　　让她救救他孙子。\n　　因为这个小婴儿，陈昭愿的生活开始不一样了", "tags": ["女频悬疑", "悬疑", "女强", "灵异", "大佬", "悬疑恋爱"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玫瑰利刃", "fullTitle": "玫瑰利刃", "link": "https://fanqienovel.com/page/7211480528497675279", "data": [4.0, 4.05, 4.08], "trend": 0.07, "latest": 4.1, "wordNumber": 1092931, "creationStatus": 0, "desc": "严肃正义刑警队长VS乖巧能打实习女警\n姜不寒是刑警支队的新人实习生。\n邢念生本以为，长得太漂亮的美女，一般能力有限。\n“我的刑警队不需要花瓶。”邢念生板着脸道：“实习三个月，不行滚蛋。”\n谁料到这个花瓶，身高腿长武力值爆表，一拳能把壮汉打趴。心思细腻眼神敏锐，能在蛛丝马迹中寻找线索。可盐可甜造型百变，上山下海勇往无前。\n三个月后，邢队长严肃道。\n“小姜是我们支队的心肝大宝贝，谁也别想把她挖走！”\n不知死活的队员飘过。\n“邢队，也是你的心肝大宝贝吗？”\n铁血硬汉邢队长，他竟然脸红了！", "tags": ["女频悬疑", "悬疑恋爱", "推理", "破案"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心理分析者", "fullTitle": "心理分析者", "link": "https://fanqienovel.com/page/7412616178163534873", "data": [4.4, 4.4, 4.4], "trend": 0.0, "latest": 4.4, "wordNumber": 1016312, "creationStatus": 0, "desc": "病娇犯罪心理专家 VS 面瘫刑警队长\n原书名：《心理分析者》\n控制大脑的菌丝、人形蚁窝、邪恶吃播……离奇的案件折射出凶手扭曲的精神世界。\n基因给犯罪上膛，心理瞄准目标，环境扣动扳机。\n凝视深渊的人，也要警惕深渊。\n江宁希:我想跳进深渊体验一下。\n深渊:你不要过来啊！\n林司言拽住她：欢迎你先跳进我的世界。\n——\n江宁希见到帅气但面瘫的林司言时，格外兴奋。\n这竟然是个没有表情的男人。\n江宁希盯着林队长的瞳孔:你眼睛里的情绪很丰富。但你现在好像有点不耐烦。为什么呢?\n林司言:……你靠得太近了。\n表白时\n江宁希:没有遇到物理刺激，但你的瞳孔突然放大了，你在害怕我吗?\n林司言:没有。\n江宁希:那么就是另一种可能了。你对我产生了欲望。\n江宁希惊讶地发现，原来面瘫也会脸红啊。\n——\n推荐我的旧文《我一个自闭症会亿点剖尸怎么了》", "tags": ["女频悬疑", "悬疑恋爱", "悬疑", "推理", "病娇", "破案"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "和阉贼在一起后，真公主重生了", "fullTitle": "和阉贼在一起后，真公主重生了", "link": "https://fanqienovel.com/page/7623310820218244158", "data": [22.13, 23.33, 24.73], "trend": 2.6, "latest": 24.7, "wordNumber": 571798, "creationStatus": 0, "desc": "\n容夭六岁时中毒，毒坏了脑子，便成了蠢人，都说她只有六岁小儿的心智。\n\n为活命，容夭蒙混进了宫，成为了盛平公主的贴身宫女，日日给盛平公主洗脚捶背，干些轻快活计。\n\n她感激不嫌她蠢的盛平公主，故而在盛平公主让她与大宦官祁慎做对食时，她便偷偷爬上了大宦官的床榻。\n\n可事后不久，盛平公主便将她乱棍打死了。\n\n死后她才知，她能活到十七岁，全因盛平公主想要戏耍她，玩够了，便将她杀了。\n\n盛平公主说她才是真公主，说陈贵妃顶替了她的娘亲，说她的亲人都死于她和陈贵妃之手……\n\n*\n再睁眼，容夭重生回到六岁，此时她头脑清醒，还没被毒傻。\n\n而害她痴傻的带毒吃食正摆在她的眼前。\n容夭将吃食一分两份，一份送给假祖母，一份送给假父亲……\n\n然后她收拾好家当带娘回娘家，她还小，认爹要趁早！认完爹后还要帮祁慎留根……\n\n*\n谁都没料到，那个被皇上从民间寻回的小公主，有一日会令天下人臣服，站在最高位上，带领大周走向前所未有的盛世。", "tags": ["宫斗宅斗", "古代言情", "重生", "公主", "前世今生", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "状元悔断肠，玄学大佬不好惹", "fullTitle": "状元悔断肠，玄学大佬不好惹", "link": "https://fanqienovel.com/page/7631195129595841561", "data": [16.38, 17.04, 17.27], "trend": 0.89, "latest": 17.3, "wordNumber": 469999, "creationStatus": 1, "desc": "［玄学+宅斗+抓鬼+爽文+无cp+算命+故事单元］\n修炼三百年的玄学大佬桑夏，在飞升之际陨落了，重生到了一百年以后。\n成为了被新科状元抛弃的糟糠之妻。\n这还不够惨，她还是被自己的亲祖母抛弃的太傅府真千金。\n桑夏都怀疑，天道是嫉妒她的天赋，才让她重生到这个可怜虫身上。\n人人都想看她笑话，偏生她是最争气的那个。\n风水测算，捉鬼画符……\n短短时间内，她便成为了京中人人敬畏的玄学大佬。\n百姓敬畏的监正大人喊她祖师奶奶。\n京中人人惧怕的纨绔世子，求着拜她为师。\n连权侵朝野的辅国公毕恭毕敬的喊她主子。\n这时，那位状元爷前夫，以及抛弃她的祖母，才后悔莫及。", "tags": ["宫斗宅斗", "古代言情", "重生", "无CP", "大佬", "风水秘术"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后扑到权臣怀里哭，他红温了", "fullTitle": "重生后扑到权臣怀里哭，他红温了", "link": "https://fanqienovel.com/page/7545304657187310617", "data": [16.23, 16.77, 17.08], "trend": 0.85, "latest": 17.1, "wordNumber": 500020, "creationStatus": 0, "desc": "【娇软甜妹VS沉稳克制权臣】\n（双洁，青梅竹马，多年暗恋成真）\n沈明姝被江浔宠着长大，却因为他的严苛冰冷，一直怕他如命。\n被人下药后，她被青梅竹马的小将军带走，被人撞见，只得嫁给他。\n谁知小将军心中有人，新婚当日便纳妾进门。\n小将军宠爱小妾入骨，而对她冷言冷语。\n他们一同去京郊烧香拜佛，谁知马匪突袭，小将军慌忙带着小妾奔逃，把她留给了马匪……\n为了保全自己，沈明姝撞刀而死。\n死后成为幽魂，亲眼看到江浔为她报仇，为她而死……\n——\n一睁眼，重回沈明姝被下药那一晚。\n她忍着滚烫和难受，哭着去找江浔，扑到他怀中。\n“阿兄……”\n她声音颤抖，带着哭腔。\n沈明姝哭得厉害，满心都是自己受过的委屈和对江浔的愧疚心疼。\n完全没想到，在她看不见的地方。\n这个素来沉稳克制的权臣耳尖悄悄泛起薄红……\n——\n再后来，沈明姝被江浔按到腿上。\n腰肢被他铁臂箍住，右手亦被他强势地撬开，十指穿入，扣得死紧。\n昏暗烛影里，她眼尾绯红，男人似笑非笑地看着她，嗓音低哑，“乖阿姝，哭什么？”\n沈明姝身子止不住地轻颤。\n事情不对！\n但好像已经来不及了……\n", "tags": ["宫斗宅斗", "古代言情", "重生", "青梅竹马", "双洁", "古色古香", "暗恋"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "掌心饵，驯娇记", "fullTitle": "掌心饵，驯娇记", "link": "https://fanqienovel.com/page/7590362586965609496", "data": [15.31, 15.49, 15.77], "trend": 0.46, "latest": 15.8, "wordNumber": 1025720, "creationStatus": 0, "desc": "【阴郁真太监×馋嘴小宫女｜训诫依存｜食物掌控】\n进宝是御前得脸的太监，也是冷宫那堵矮墙后，唯一会给春儿留点心的人。\n只是这点心不好拿，跪着接。\n春儿以为这是她在这吃人宫里，能抓住的唯一活路。\n直到她看见，这个总是站得笔直的人，头顶压着那样沉重的天。\n她就只需要窝在他的影子下，赏的罚的通通咽下。\n可她抬头望着，总觉得想替他撑一撑。\n——苔花如米小，也学牡丹开。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成早死的炮灰原配，我怒嫁反派", "fullTitle": "穿成早死的炮灰原配，我怒嫁反派", "link": "https://fanqienovel.com/page/7199806910327950392", "data": [18.66, 18.86, 18.93], "trend": 0.26, "latest": 18.9, "wordNumber": 1775762, "creationStatus": 0, "desc": "【影视版权已售】吕颂梨穿书了，穿成《权臣的娇美继室》里男主谢湛的炮灰原配。\n　　\n　　书里，原主会被从流放之地衣锦归来的好友赵郁檀抢了丈夫。他们在她重病时暗通曲款，活活气死了她。\n　　\n　　吕颂梨正打算撸起袖子手撕渣男贱女，却发现赵郁檀不打算维持原著剧情了，她想让两人互换未婚夫。吕颂梨默默地让她把渣男抢走了。\n　　\n　　但是，他们为什么还要请太后娘娘强行给她和秦晟赐婚？\n　　\n　　嫁进注定要被流放的秦家，她只好撸起袖子干了。\n　　\n　　不料干着干着，摊子越铺越大。\n　　\n　　秦家也没办法了，为了护着这摊子，只能打仗打仗再打仗。\n　　\n　　最后，吕颂梨和秦晟二圣临朝了，史称吕皇秦帝。\n　　\n　　秦吕两家一跃成为新朝最顶级的权贵。\n　　\n　　一次喝酒中，好友问秦晟，怎么会想到造反的？\n　　\n　　世代忠良的秦晟睁着微醉的眼眸说，商队是妻子给划拉起来的，贤士是妻子给招的，招兵买马的钱是妻子给的，一不小心妻子就为他们凑齐了造反的资本。\n　　\n　　妻子把摊子搞大了，不造反成功，他们很难收场的。\n　　\n　　天下：原来他们新朝两位圣人的皇位是这么来的啊，吕皇果然野心勃勃。\n　　\n　　吕颂梨：滚蛋，这个锅她不背！他们老秦家在原著里就造反了好吗？", "tags": ["宫斗宅斗", "古代言情", "宠妻", "穿越", "甜宠", "反派", "穿书", "虐渣", "今穿古", "打脸", "1v1", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "父王，开门！本郡主闯祸回来啦", "fullTitle": "父王，开门！本郡主闯祸回来啦", "link": "https://fanqienovel.com/page/7571356675811052568", "data": [48.78, 48.56, 49.04], "trend": 0.26, "latest": 49.0, "wordNumber": 1132319, "creationStatus": 1, "desc": "[轻松诙谐＋无CP＋日常＋团宠＋爽文＋沙雕＋女强＋群像＋权谋＋颠文]\n（简介无能，大家还是直接看正文吧）\n    自从端王府的独苗苗叶琼脑袋被驴踢中失忆后。\n    老纨绔端王好日子到头了。\n    别人家父慈子孝，端王府鸡飞狗跳。\n    叶琼不是在坑爹，就是在坑爹路上。\n /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
