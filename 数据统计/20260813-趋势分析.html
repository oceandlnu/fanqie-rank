。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [8.63, 9.32, 9.09], "trend": 0.46, "latest": 9.1, "wordNumber": 231976, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [4.1, 4.37, 4.56], "trend": 0.46, "latest": 4.6, "wordNumber": 270715, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盲雌一睁眼，周围全是大佬兽夫", "fullTitle": "盲雌一睁眼，周围全是大佬兽夫", "link": "https://fanqienovel.com/page/7654427669408255000", "data": [2.15, 2.38, 2.57], "trend": 0.42, "latest": 2.6, "wordNumber": 150100, "creationStatus": 1, "desc": "【兽世+甜宠+雄多雌少+日常治愈】\r\n一场意外，失明少女颜悦穿越到凶险的蛮荒兽世。\r\n荒草荆棘、古木参天、猛兽蛰伏、弱肉强食……\n为了活下去，颜悦接受了流浪兽的守护。\r\n冷厉寡言的金雕兽人，敛着宽翼护她身后，不动声色撑起安稳；\n温柔细心的熊兽人，将她裹进厚毛怀抱，事事都要操心周全；\n温柔腹黑的灵瞳猫，耳畔低语说尽情话；\n暴躁勇猛的花豹，赤忱心意却从不作假；\n还有双生人鱼，一个心思深沉，肆意逗弄，却句句藏着试探心意；\n一个温顺失语，沉默里尽是死心塌地。\r\n……\r\n兽夫轮番哄宠，蛮荒日子甜到发腻！", "tags": ["种田", "古代言情", "穿越", "兽世"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [6.68, 6.62, 7.01], "trend": 0.33, "latest": 7.0, "wordNumber": 208624, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成被休悍妇，边关种田养娃致富", "fullTitle": "穿成被休悍妇，边关种田养娃致富", "link": "https://fanqienovel.com/page/7655592418057653272", "data": [2.04, 2.27, 2.29], "trend": 0.25, "latest": 2.3, "wordNumber": 210054, "creationStatus": 1, "desc": "评分刚出，会涨，勿在意\n（边关开荒种田+空间+灵泉+木系异能）\n俗话说升官发财死老婆。\n江棉棉睁眼就成了那个将死的老婆。\n外室进门，男人嫌她是个黄脸婆随便捏了个不孝婆母的罪名。\n还没断气就被扔到外面等死，\n儿女也被赶到柴房给外室的孩子腾位置。\n呵呵。\n她江棉棉是谁，末世满级大佬，怕你一个陈世美。\n“和离。”\n她带着儿女媳妇离开。\n分家后，她靠木系异能卖草药很快赚了第一桶金。\n抓到野鸡，每天喂它喝灵泉水，噗噗下蛋。\n打死野猪，正好卖给别人办婚事用。\n老大夫妇心灵手巧，绝版编织书搞起，编的东西风靡边关，挣的盆满钵满。\n老二力大如牛，教他功夫去从军，战无不胜。\n老三脑子活，最聪明，教她识字经营，成为大燕朝第一女皇商。\n顺便再救救落难的小男主和被虐待的阴毒小反派。\n想让他们当外室女儿对照组，不可能，\n谁牛逼谁说了算。", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废雌是4S向导，六个大佬跪着撩", "fullTitle": "废雌是4S向导，六个大佬跪着撩", "link": "https://fanqienovel.com/page/7659305583463386137", "data": [2.57, 2.72, 2.78], "trend": 0.2, "latest": 2.8, "wordNumber": 151525, "creationStatus": 1, "desc": "【星际兽世+穿书+种田+真假千金+多男主全洁+美食+团宠+向哨】\n孟澜穿成了0生育0精神力的废雌假千金，一本星际团宠文里的炮灰女配，真千金的对照组。\n在原书里，她因为嫉妒真千金觉醒了S级精神力，成为S级向导，处处针对真千金。\n原主到处作死，勾引真千金的未婚夫，最后被真千金和后宫团扔进了虫洞里，连渣都不剩。\n孟澜穿到了这个星际世界，与真千金换回身份，与养父母一家彻底撇清关系。\n她原本想着先回家走个过场，再与只有血缘关系却没有相处过的便宜家人说清楚搬出去，不曾想……\n孟家人虽然生活在垃圾星，家里一贫如洗，却把最好的一切都给了她这个刚找回来的女儿。\n【叮，恭喜宿主觉醒了农场主系统。】\n只要是系统出品，所有的农作物、水果以及养殖出来的家禽都是0污染，吃了能净化污染值。\n整个星际都疯了，一个废雌二次进化成了向导，不需要给人深度净化，只需要吃她做的美食就能净化。\n一份番茄炒蛋卖一万星际币，一份麻婆豆腐卖五万星际币……\n各行业的顶级雄性兽人上门找孟澜，刚开始是为了一碗菜一份饭一杯果汁，后来是为了那个人……\n养父母一家看着曾经不屑一顾的废物养女变成唯一的4S向导，全星际最有权威的雄性都成了她的裙下臣…", "tags": ["种田", "古代言情", "兽世", "美食", "穿书", "真假千金"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君战死五年归来：我携婆家出族", "fullTitle": "夫君战死五年归来：我携婆家出族", "link": "https://fanqienovel.com/page/7654779071276010520", "data": [2.16, 2.2, 2.21], "trend": 0.05, "latest": 2.2, "wordNumber": 177027, "creationStatus": 1, "desc": "【女强+团宠+萌宝+绝不回头+加破案+微科举】\n刚升为公安局长的林玉娘穿越了，刚成亲三天，夫君裴元骏就被征兵去了战场，不到三个月就传来了夫君战死的消息。\n这时，林玉娘发现自己怀孕了，前世活了三十多年，连个男人的手都没牵过，这才多久，她肚子里已经喘着娃了。\n裴家父母和小叔子、小姑子都对她很好，不久她就生了一对龙凤胎。\n不光养活了裴家一家人，还送小叔子去书院读书，送小姑子去学刺绣的手艺。\n就连自己生的一对双胞胎她也给他们请了启蒙的夫子，村里人人羡慕裴家娶了一个能干又孝顺的儿媳，可惜是个命苦的。就当日子越来越好时，那个战死五年的夫君成了将军回来了，见面就要和离，林玉娘根本就不在乎这个夫君，只要不和她抢孩子，和离就和离，可让她没想到的是，裴家父母和小叔子、小姑子为她打抱不平，既然说不通，那就把儿子逐出族谱，断绝父子关系。可人家已经是正三品的大将军，族长不同意把他逐出族谱，公爹下定决心，带着他们一家自请出族，小叔子中状元，裴元骏使手段，把他贬到黄县为县令，黄县是整个大同最贫困的县，在叔嫂两人的治理下，成了整个大同最富裕的县。只是那个被贬的皇子天天来串门是怎么回事儿？\n", "tags": ["种田", "古代言情", "乡村", "萌宝", "女强", "科举"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "愚孝爹逼别演了，我娘弟开荒暴富", "fullTitle": "愚孝爹逼别演了，我娘弟开荒暴富", "link": "https://fanqienovel.com/page/7657897844791053337", "data": [1.98, 2.04, 2.03], "trend": 0.04, "latest": 2.0, "wordNumber": 208483, "creationStatus": 1, "desc": "【穿越+致富+家长里短+美食+枯土异能+微群像+无 CP】\n\n    穿成被黑心奶卖身的小可怜，开局便是死局，末世女姜梨暴揍全家。都说老实人最可怕，便宜爹愚孝伪善，极品奶爱作妖，姜梨带着娘分家精神出户。\n\n    手握金手指枯土赋灵，荒山变粮仓，死地生万物。\n\n    分家后，黄土种地，遍山采药。\n\n    渣爹跪求原谅？滚。和离书、断亲书，一次性断干净。从今往后，天高任鸟飞，谁也别想欺负她半分，带着村民一起把日子过起来最重要。", "tags": ["种田", "古代言情", "乡村", "穿越", "美食", "发家致富"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "被诊出喜脉后，朕成了病弱团宠", "fullTitle": "被诊出喜脉后，朕成了病弱团宠", "link": "https://fanqienovel.com/page/7664149830779800638", "data": [4.97, 5.55, 6.0], "trend": 1.03, "latest": 6.0, "wordNumber": 199785, "creationStatus": 1, "desc": "（刚出评分所以低）无cp无脑团宠+病弱系统设定，非生子\n“陛下！您这是喜脉呀！”\n“放肆！朕怎么可能有喜？！”\n“额...或许是因为您是天命之君呢？”\n“放屁！”\n前世，宁淮卿，宁氏王朝第五代君主，很不幸，挂了。\n由于他爹整天花天酒地，导致王朝岌岌可危——然后他爹暴毙了，丢下了一堆烂摊子给他。\n他宵衣旰食的努力努力再努力——修水路，重农重商，整顿贪官污吏，复辟科举...终于，猝死了。\n重生后，小宁发誓朕一定要再创辉煌！！！结果他得到了一个不靠谱的系统。\n小统：“作为陛下贴心的小棉袄，为了君臣一心，已为您发放病弱团宠大礼包——我去，发错了！这是给隔壁皇后的好孕礼包！”\n“？”\n乌龙导致的结果就是：\n1.贴身太监王长贵，以头抢地：陛下您快歇歇吧，不然小皇子怎么办？\n2.太医院院判老李头，如履薄冰：陛下别闹了，您需要卧床！\n3.一向跟他不对付的弟弟宁云琅，看他的眼神也带着莫名其妙的关怀：皇兄，保重龙体。\n不仅前朝乌烟瘴气，就连微服私访收的学生也学会了那一套，一群人整天盯着小宁的肚子。\n众人：陛下都是为了我们才病的如此厉害，我要给陛下打一辈子工！\n小宁一边咳一边骂：朕真求你们了，你们疯了吗？", "tags": ["古言脑洞", "古代言情", "团宠", "无CP", "系统", "重生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕盘点大秦女相，怎么是我啊！", "fullTitle": "天幕盘点大秦女相，怎么是我啊！", "link": "https://fanqienovel.com/page/7659047521683000344", "data": [2.34, 2.65, 3.04], "trend": 0.7, "latest": 3.0, "wordNumber": 216956, "creationStatus": 1, "desc": "【女扮男装+天幕盘点+秦始皇+权谋+基建+种田+基建狂魔】\n\n　　穿越成秦朝一个女扮男装的穷县令，黎简开局只有一间空得连老鼠都不来的粮仓。\n\n　　系统却要求三年温饱，五年奔小康。\n\n　　她卷起裤腿下田教沤肥、蹲在水田里试种水稻、用蜂窝煤撬动经济。\n\n　　就在她撸起袖子准备大搞水泥路和砖窑，带着全县奔小康时，天幕突然横亘苍穹。\n\n　　两千多年后的考古直播，硬生生砸在了大秦的天空上。\n\n　　始皇陵被挖、历史走向泄露、六国余孽蠢蠢欲动……整个天下都乱了套。\n\n　　黎简本打算置身事外，闷头搞基建就好。\n\n　　然而天幕第二次亮起时，却抛出一个石破天惊的消息。\n\n　　【被挖的不是秦始皇陵，而是大秦女相的陵寝。】\n\n　　黎简：“？？？”\n\n　　大秦什么时候有女相了？\n\n　　那个女相的名字，怎么跟自己一模一样？\n\n　　不等她理出头绪，天幕的声音再度响彻苍穹。\n\n　　【诸位，我们现在打开的，是大秦女相、也是古往今来千古第一女相的陵寝。】\n\n　　整个大秦，热血沸腾。\n\n　　黎简低头看了看自己手里的蜂窝煤模具，又抬头看了看天幕，陷入了沉思。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "女扮男装", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "没人告诉我兽世要会抡大锤啊！", "fullTitle": "没人告诉我兽世要会抡大锤啊！", "link": "https://fanqienovel.com/page/7650550529575095321", "data": [5.04, 5.27, 5.56], "trend": 0.52, "latest": 5.6, "wordNumber": 247227, "creationStatus": 1, "desc": "兽世，1/n，雌尊，异能，雌雄皆强，许多雌尊形容，避雷已放，不喜勿入或左上角，文明评论区，幸福你我他。\n\n—————————\n蓝渊胎穿到兽世，本以为自己将像上辈子看的各种兽世文一样，过上美男环伺左拥右抱的躺平整活，直到她看见她阿母的招侍擂台——\n当各个外形实力皆出挑的雄性兽人战到最后，最强的那位从中兽人脱颖而出，当蓝渊以为接下来就是阿母直接收下新的雄侍，皆大欢喜时——\n她的却阿母走下擂台。\n她便看见阿母将披风一扔，气势顶天立地，不像是在擂台招侍，反倒像是来收复新部落，对着这个准阿父摆出了邀战手势。\n阿母：刚才的战斗是你拼命争取站到我面前的资格，接下来想让我接受你，那就和我一战吧！努力获得我的认可，证明你有资格做我的雄侍！\n在阿父怀里咬手指看戏的小蓝渊：！\n不对！哪里不对！\n——————", "tags": ["古言脑洞", "古代言情", "幻想言情", "穿越", "兽世", "胎穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "异世界妈妈控制欲不太对劲！？", "fullTitle": "异世界妈妈控制欲不太对劲！？", "link": "https://fanqienovel.com/page/7553154748937931838", "data": [3.0, 3.28, 3.48], "trend": 0.47, "latest": 3.5, "wordNumber": 174072, "creationStatus": 1, "desc": "“宝宝，要多喝奶才能更健康，更快长大哦～”\n“妈妈会一直守护宝宝，不让受到一点委屈，妈妈会永远爱你，永远～”\n［本人小说生涯中的癫疯之作，错过你就对了～］", "tags": ["古言脑洞", "古代言情", "萌宝", "公主", "年下", "养崽"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕曝光，朕的四哥是征北大将军", "fullTitle": "天幕曝光，朕的四哥是征北大将军", "link": "https://fanqienovel.com/page/7663787874822655001", "data": [3.25, 3.54, 3.69], "trend": 0.45, "latest": 3.7, "wordNumber": 135158, "creationStatus": 1, "desc": "天幕/大女主/渣女/称帝/微架空\n朱明姝穿成朱元璋最小的公主，成了皇宫唯一不怕洪武帝的硬茬！\n宫里上至皇子勋贵，下至宫人内侍，没人不怕洪武大帝的雷霆手段，就连骁勇的燕王朱棣，面见父皇时都谨小慎微，不敢造次\n朱明姝反而一身反骨，天天找老朱抬杠\n朱元璋拍着龙案怒斥：“女子安分守礼即可，朝堂江山，岂是你们女儿家该置喙的？”\n朱明姝挑眉回怼：“一味重男轻女，固守旧规，本就是在拖大明后腿”\n旁人都纳闷，陛下素来杀伐果决，怎么偏偏不重罚这位逆女？\n事实上呢？\n作为马皇后临终前再三托付要好生照料的幼女，朱元璋念着亡妻情分，每次都压下火气，顶多口头训斥，舍不得真对这个女儿真的下手\n再加上凑热闹的燕王，父女三人天天鸡飞狗跳\n直到天幕砸落大明，全民瞳孔地震！\n未来皇孙朱允炆登基才七天，龙椅还没捂热，就被朱明姝联手她四哥朱棣一起给薅下来了\n后来天幕更是曝光了一大堆大明的弊病\n合着老朱兢兢业业，愣是留了一堆烂摊子！\n反观众人最看不起的公主？\n她登基后，废苛政、减赋税、养万民、开盛世！\n直接把漏洞百出的大明，干成百姓吃饱、万国朝拜的巅峰！\n朱元璋盯着天幕盛世，捂心叹气：\n离谱！咱这逆女比咱几个儿子还厉害!", "tags": ["古言脑洞", "古代言情", "穿越", "直播", "公主", "女强"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "对，我在古代当神女", "fullTitle": "对，我在古代当神女", "link": "https://fanqienovel.com/page/7662746316191042585", "data": [3.63, 3.86, 4.05], "trend": 0.42, "latest": 4.0, "wordNumber": 180166, "creationStatus": 1, "desc": "穿到旱灾古代呼风唤雨，开局成神➕无cp➕万人迷。\n \n旱灾？她可呼风唤雨。\n缺粮？她可催生万物。\n瘟疫？她灵丹祛百病。\n\n片段：\n　　一船人呆呆看着。\n\n　　像山般大的巨兽，此刻褪去凶相，像一只狗一样，温顺地围着周身泛光的少女游动。\n\n　　符汐伸出手，手掌轻轻贴上它潮湿粗糙的脊背。\n\n　　海风卷走她的话音。\n\n　　“跟着我。”\n\n　　“我带你回深海。”\n\n　　巨鲸似乎听懂了她的声音。\n\n　　低鸣一声，沉入海中。\n\n　　符汐飞起，如同夜里一盏孤灯，在前方引路。\n\n　　巨鲸摆动巨大尾鳍，追着那片光亮，朝着无边远洋游去。", "tags": ["古言脑洞", "古代言情", "乡村", "穿越", "今穿古", "系统"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "古临妻，福赢麻", "fullTitle": "古临妻，福赢麻", "link": "https://fanqienovel.com/page/7646761026335034393", "data": [2.26, 2.45, 2.52], "trend": 0.26, "latest": 2.5, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满级监狱长穿古代，罪犯全跟来了", "fullTitle": "满级监狱长穿古代，罪犯全跟来了", "link": "https://fanqienovel.com/page/7661140117666401305", "data": [2.8, 2.87, 2.94], "trend": 0.14, "latest": 2.9, "wordNumber": 125943, "creationStatus": 1, "desc": "【群穿古代！全朝最强罪犯VS战力爆表指挥官。】\n池鲤月，一个能让顶级重刑犯集体做噩梦的名字。\n一场爆炸，她穿了。\n更要命的是，那群穷凶极恶的罪犯也跟着穿了。\n满朝文武面对二十一世纪的顶级罪犯束手无策。\n直到系统将她的一魄找回，三法司的三位大佬当场哭了：\n“老大！！！救命啊！！！你终于来了！！！”\n万金悬赏却无人敢抓的罪犯们更是集体崩溃！\n罪犯A：卧槽！那灭绝师太怎么也穿来了？！\n罪犯B：别说了，我先跪为敬，争取宽大处理。\n池鲤月负手而立，笑如春风：“听说诸位想在古代称王称霸？”\n叱咤朝廷的罪犯们跪了一地：“不敢不敢不敢！老大您说了算！”\n*\n当某官员站出：女子不得参政……\n护短皇上手动微笑：池爱卿，把炸弹拿来，朕要把他炸个稀巴烂。\n池鲤月：皇上，不至于不至于。\n*\n后来，毒舌腹黑的养子弟弟吃着飞醋：“阿姐不是说往后好好待我不欺负我吗？可现在阿姐就在欺负我。”\n清冷矜贵无血缘的太师小舅舅深夜隐忍动情：“阿月，小舅舅不该有这种心思。”\n向来不待见她的未婚夫太子将订婚玉佩塞给她：“本宫不退了！不退婚了。”\n还有前世她捕抓N次的疯子红着脸：“如果，不是因攻略任务的情况下，我真的喜欢你呢……", "tags": ["古言脑洞", "古代言情", "穿越", "系统", "打脸", "青梅竹马", "虐渣"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宦官反派之子？但四岁封建老学究", "fullTitle": "宦官反派之子？但四岁封建老学究", "link": "https://fanqienovel.com/page/7663339551775001625", "data": [2.39, 2.46, 2.52], "trend": 0.13, "latest": 2.5, "wordNumber": 156399, "creationStatus": 1, "desc": "【养崽＋无CP＋日常流＋父子情占比高】\n　　念青四岁，府上心知肚明的野种。\n　　亲娘软弱，好在小家伙争气。\n　　他立誓考取功名，郡丞却要他当暴虐无状小皇帝的伴读。\n　　念青大病，眼看要烧成傻子。\n　　舅父忽至，细心照料。\n　　周青序一生飘零，父母早亡，少年时就成了太监。\n　　他不择手段成了辅佐幼帝的周常侍，朝野道他卑贱专权。\n　　周青序冷眼旁坐看北魏亡国。\n　　不料他锒铛入狱，受万人唾骂。\n　　厌世等死之际，恨极的人带来烧傻的孩子，说这是他的血脉！\n　　延续香火，爹娘临终期盼，周青序不想死了！当日他却死在了狱中。\n　　转世重生，他奔袭接回幼子。\n　　面对骨肉，周青序自卑又爱极，将他宠得如珠似宝。\n　　周从意发愤图强，要报答舅父。天降系统，说他舅父身为奸佞，距离死期只剩一年。\n　　从意怒目圆瞪，我舅父是忠臣，大大的良民！\n　　小家伙致力于洗白舅父，誓要将忠君爱国贯彻到底。\n　　一身正气克己复礼，左一句之乎者也，右一句仁义礼智。\n　　妥妥封建老学究。\n　　有天北魏分崩离析，皇权最坚定的维护者偷偷摸摸收拾包袱，苦口婆心：“爹爹，我们快跑。”\n　　凤仪鹤影的青年挥手，万千将士赫然跪地：“太子，请登基！”\n　　“我、我成奸佞反贼了？”", "tags": ["古言脑洞", "古代言情", "系统", "重生", "无CP", "养崽"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假千金全家读心，我靠摆烂躺赢", "fullTitle": "假千金全家读心，我靠摆烂躺赢", "link": "https://fanqienovel.com/page/7654561730638384152", "data": [4.44, 4.56, 4.53], "trend": 0.09, "latest": 4.5, "wordNumber": 162834, "creationStatus": 0, "desc": "前世，桓未晚身为侯府真千金，却被假千金抢走父母、兄长和婚约，最后惨死乱葬岗。\n重生回府，她决定不争了。\n亲情不要，婚约不要，侯府嫡女的位置也不要。\n她只想远离这群糊涂蛋，吃瓜摆烂，安稳活命。\n谁知刚进侯府，她就绑定了吃瓜系统。\n她不知道的是——\n全家都能听见她的心声。\n【大哥别喝，那碗汤里有毒！】\n【爹别查了，你身边那个忠心耿耿的副将就是敌国细作！】\n【娘，你还护着假千金呢？她已经准备踩着大房的尸骨嫁进皇子府了！】\n桓未晚表面乖巧，心里疯狂吃瓜。\n原以为侯府众人还会像前世一样护着假千金，结果一夜之间，全家都变了。\n大哥拔剑护在她身前。\n父亲连夜锯平她院中的门槛。\n母亲打开库房，恨不得将十五年亏欠全部补给她。\n假千金越算计，侯府众人越护着桓未晚。\n直到高高在上的摄政王祁临渊也将她堵在怀中，低声问：\n“你连满朝文武的秘密都能猜中。”\n“偏偏看不出本王为何一次次护着你？”", "tags": ["古言脑洞", "古代言情", "系统", "幻想言情", "重生", "真假千金"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了冷血皇帝的病弱炮灰养子", "fullTitle": "穿成了冷血皇帝的病弱炮灰养子", "link": "https://fanqienovel.com/page/7628961061521083416", "data": [2.8, 2.9, 2.82], "trend": 0.01, "latest": 2.8, "wordNumber": 281149, "creationStatus": 1, "desc": "【亲情向＋无CP＋病弱＋团宠＋架空】\n　　作为第二代的陪伴型AI仿真人，零零一陪伴小主人从幼崽到成年期，功不可没。\n　　按照原计划，它是要更新老化零件，再陪伴主人到老年。\n　　但市面上越来越多的新款，大人们早就想要换掉它，他们第一时间销毁了零零一。\n　　零零一不知道自己被销毁了，在重新醒来过后，它以为自己升级成功了，换了新皮肤。\n　　但脑海中不知道为什么多出了一段奇怪的记忆，它是炮灰？叫做李临祎？\n　　还是个炮灰，因为身体孱弱，又天生寡言少语，被遗弃在雪天荒野，遇到了重伤的帝王李钦纶。\n　　帝王会心软，将他带回去，认作养子，养在身侧。但他不识好歹，偏执娇纵，横行无忌，得罪了一众皇子公主，以及妃子，甚至下到宫女太监，无一不厌恶他。\n　　最后落得废为庶人，驱逐出宫的下场。\n　　零零一不明白自己这是穿书了，以为这是自己被新植入的程序……既然是程序，就应该执行。\n　　至此，零零一变成了炮灰李临祎。\n　　但不太会阴谋诡计的陪伴型零零一，总会搞砸一切……\n　　他后知后觉地发现，已经和【程序】完全不一样的时候……\n　　嗯，大概是零零一变成了真人之后的古代日常。（架空哒！）", "tags": ["古言脑洞", "古代言情", "穿越", "团宠", "医术", "无CP"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越重生，她靠弹幕在古代翻身", "fullTitle": "穿越重生，她靠弹幕在古代翻身", "link": "https://fanqienovel.com/page/7656862681466407998", "data": [4.09, 4.12, 4.09], "trend": 0.01, "latest": 4.1, "wordNumber": 152613, "creationStatus": 1, "desc": "穿越十弹幕提示十灵泉空间十多胞胎十抢男女主机缘：现代十八线小明星桑叶，在拍武侠片的时候，发生意外，穿越成大胜皇朝丞柤府嫡女桑叶，天崩开局，一来就要在宫里被抓奸，好\\在有弹幕金手指提示。【女配惨了，女主马上就要带人来抓奸了，她还在这里发愣，快跑呀】\n【女配手上的这个玉佩，不就女主的灵泉空间吗？女主明天就会意外开启，真想看看灵泉空间是什么样子的。】\n【明天女主就要去把那个芳华楼以5000两银子买下，简直是捡了个大漏啊！不愧是我们女主。】\n桑叶一边吃瓜看戏抢机缘，一边赚钱撩夫带娃娃，生活有兹有味。", "tags": ["古言脑洞", "古代言情", "穿越", "空间", "嫡女", "魂穿"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "当我同时绑定好孕系统和天命系统", "fullTitle": "当我同时绑定好孕系统和天命系统", "link": "https://fanqienovel.com/page/7654893715571362878", "data": [6.0, 6.72, 7.35], "trend": 1.35, "latest": 7.3, "wordNumber": 155046, "creationStatus": 1, "desc": "【变嫁+渣男改造+多男主+魅魔体质+攻略+生子变强】\n因为在前世辜负了太多女孩子的真心，卿越被前女友的哥哥撞死，死后同时绑定了天命掠夺系统和人渣好孕系统，前者帮他变强，后者要他赎罪，结果二者谁也不服谁，最后只能达成协作，让他通过攻略三个天命之子，并为他们诞下子嗣，才能变强的同时也跟着赎罪。\n卿越根本来不及拒绝，灵魂就被投放到了修真世界，成为了南宫家的二小姐——南宫卿月。\n从他变成了她。\n而她十八岁那天，在系统给的抽奖轮盘里抽中了绝世魅魔体质，同时系统给她发布了第一个任务。\n要她去攻略即将被她阿姐强势退婚的天命之子——萧焱尘，并在二十岁之前为他生下第一个孩子。\n为了活下去，南宫卿月不得不接受系统发布的任务……\n注1:本文又叫“人渣改造之旅”，“系统逼我生孩子”，“当我抽中魅魔体质后”。\n注2:主角前世真的很渣，不要同情“他”。", "tags": ["玄幻言情", "系统", "幻想言情", "前世今生", "双系统", "胎穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "洪荒，阐教小师妹后台太硬", "fullTitle": "洪荒，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [11.45, 11.87, 12.23], "trend": 0.78, "latest": 12.2, "wordNumber": 173434, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "危！刚飞升我就杀了天帝？", "fullTitle": "危！刚飞升我就杀了天帝？", "link": "https://fanqienovel.com/page/7663020533176339518", "data": [6.5, 6.82, 7.17], "trend": 0.66, "latest": 7.2, "wordNumber": 145104, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绑定双修系统后，我躺成宗门团宠", "fullTitle": "绑定双修系统后，我躺成宗门团宠", "link": "https://fanqienovel.com/page/7653329586515610648", "data": [2.81, 3.09, 3.29], "trend": 0.48, "latest": 3.3, "wordNumber": 255893, "creationStatus": 1, "desc": "【爽文+系统+修仙+微万人迷+男全洁】\n她穿进一本《我在修仙界生崽就变强》的狗血文中。\n成了活不过一章的炮灰女配安如素。\n原文小师妹是女主，身怀多子多福系统，不仅抢了她的道侣，还哄得全宗门都成了她的舔狗，最后飞升成仙。\n幸好，她获得了双修就变强系统。\n高岭之花师尊，为她跌落神坛。\n无情道二师兄，为她挡天雷。\n抠搜的三师兄，把最顶级的丹药捧到她面前。\n体修四师兄，金刚不坏神功已经达到铁石心肠，见到她心就软了。\n每天想死的五师兄，不想死了，每天只想跟她贴贴。\n就连与她解除婚契的大师兄，跪在她面前，只求她多看一眼。\n甚至黄狗旺财化为人形后，对外宣布，“主人是我的，你们敢抢，吞了你们！”\n她懵了，她只想双修变强啊，怎么就成了宗门团宠了？", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "团宠", "今穿古"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，她断了男女主所有的路", "fullTitle": "重生后，她断了男女主所有的路", "link": "https://fanqienovel.com/page/7659427975628065816", "data": [3.08, 3.36, 3.54], "trend": 0.46, "latest": 3.5, "wordNumber": 153625, "creationStatus": 1, "desc": "沈灵汐是她爹娘的心头宝，爹娘因为要飞升，重新回到太初大陆。怕丢下她一人在云荒大陆孤单寂寞，为她创建了宗门。\n本来是想有人陪着他们的闺女，没想到却招进来一头白眼狼。披着深情款款的皮囊，想要的却是沈灵汐的灵根和她的血液。\n在被挖灵根，放血液的时候才知道他们的世界是一本书。而那头白眼狼和他家领养的妹妹，是书中的男主与女主。\n同归于尽后，强烈的不甘让她回到爹娘没有创建宗门之前。这一次，她要让那渣男贱女死在故事的开局。\n可这该死的天道，竟然护着这样的渣男贱女。既然杀不死他们，那就断了他们所有的路。", "tags": ["玄幻言情", "幻想言情", "重生", "空间", "虐渣", "前世今生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [9.49, 9.72, 9.77], "trend": 0.28, "latest": 9.8, "wordNumber": 154352, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.41, 3.48, 3.53], "trend": 0.12, "latest": 3.5, "wordNumber": 251065, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自己，却生得心脉残缺，体弱易碎，连哭都没力气，一副早夭相。\n他的孩子必须活得好好的，天要他亡，沈寂就把这天逆了。", "tags": ["玄幻言情", "幻想言情", "穿越", "穿书", "养崽", "胎穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [6.63, 6.67, 6.65], "trend": 0.02, "latest": 6.7, "wordNumber": 158894, "creationStatus": 1, "desc": "【亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城+OOC预警】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "民国言情": [{"label": "陈皮阿四之多情种", "fullTitle": "陈皮阿四之多情种", "link": "https://fanqienovel.com/page/7537294523685145625", "data": [2.91, 3.5, 4.06], "trend": 1.15, "latest": 4.1, "wordNumber": 252851, "creationStatus": 1, "desc": "故事发生在四屠黄葵之后……初见时，浑身浴血的少年黑沉着眸子，无法无天的流氓做派。\n后来竟将整颗真心奉上，只求她的怜惜……\n披着老九门外衣的小甜文\n私设如山，努力不崩人设\n给橘子皮一个小小的羁绊", "tags": ["民国言情", "现代言情", "古代言情", "古色古香", "医术", "武侠"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成五零姨太太，卷走财产逃港城", "fullTitle": "穿成五零姨太太，卷走财产逃港城", "link": "https://fanqienovel.com/page/7645653673145551896", "data": [4.71, 4.95, 5.53], "trend": 0.82, "latest": 5.5, "wordNumber": 156189, "creationStatus": 1, "desc": "祝阮蓝一醒来就发现自己穿成了索府的七爷的‘冲喜姨太太’，而且索府的人正在谋划着离开沪上，逃往小弯，最重要的是竟然还不带她！\n这怎么能成，她也要出去，她想去港城！\n可惜，相处后才发现，索府都是一群豺狼虎豹，而且还一个个带着坏主意，竟然觉得买了她这个冲喜姨太太不能吃亏，想要将她当成礼物送给沪上官员笼络人心。\n看着索府的人这样恶心，祝阮蓝索性当起了飞天大盗，先是偷走了索府的保险箱，后又偷走了枪支弹药，还毫不客气的送索府的人看了一场炸弹烟花给他们开开胃。\n趁着这个时机，她卷走了索府宝库里所有的东西，而后消失不见。\n索府的人气炸了，老太太发出高额悬赏想要捉拿祝阮蓝。\n祝阮蓝趁着这个时机，逃离沪上，等到船快要开时才辗转回来。\n没想到她千算万算，等上船后才发现，她如今坐着的这条船，竟然是那条奔向绝路的‘太平轮’，且看祝阮蓝如何逆风翻盘，去往港城大杀四方，由一个姨太太成为一个港城新贵！", "tags": ["民国言情", "现代言情", "穿越", "空间", "民国", "虐渣"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿老九门，恶犬她要贴身驯养", "fullTitle": "身穿老九门，恶犬她要贴身驯养", "link": "https://fanqienovel.com/page/7654637620693060633", "data": [0.63, 0.82, 1.16], "trend": 0.53, "latest": 1.2, "wordNumber": 96856, "creationStatus": 1, "desc": "盗墓衍生CP陈皮非传统女强文 系统 团宠 \nOOC警告（部分人物有出入），私设较多，介意误入（男主只能爱女主，陈皮江柚为官配）\n江柚cp陈皮 \n道上的二月红突然收下两个徒弟听说还是两个外乡人，里面居然有女子，还认了齐八爷为干亲。\n江柚从天而降\n陈皮早期:留在身边观察\n陈皮呼吸后:想来是上天对我惩恶扬善的奖赏\n江柚:“陈皮你别死!我给你一百文你不死好不好?”\n陈皮:她想买下我的命和我同生共死。\n江柚:呼吸\n陈皮:会不会进展有点太快", "tags": ["民国言情", "现代言情", "系统", "团宠", "女强", "同人", "民国"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "南部档案：师姐老想退休了", "fullTitle": "南部档案：师姐老想退休了", "link": "https://fanqienovel.com/page/7658487361486982206", "data": [1.96, 2.15, 2.25], "trend": 0.29, "latest": 2.3, "wordNumber": 112176, "creationStatus": 1, "desc": "（不是爽文，不后宫，部分情节和原著有出入，女主本相蝴蝶，CP未定。）\n张海梦也是在南安号上牺牲的探员之一，她的尸体被张海琪带回了厦门，下葬之前，她的尸体上布满了大大小小的蝴蝶，再一恍惚，蝴蝶连带尸体都不见了，在张海琪眼皮子底下消失了。", "tags": ["民国言情", "现代言情", "民国", "幻想言情", "谍战"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "民国爱情：烟雨长安渡", "fullTitle": "民国爱情：烟雨长安渡", "link": "https://fanqienovel.com/page/7659211380351831065", "data": [1.13, 1.22, 1.31], "trend": 0.18, "latest": 1.3, "wordNumber": 159430, "creationStatus": 1, "desc": "民国十年，我嫁给了一个陌生的男人，以为这是一生最大的错。 多年后我才明白，那才是上天给我最后的礼物。民国年间，苏州书香门第的沈云烟，父亲新丧，家道中落，被叔父以三千块债务为由，嫁给上海滩洋行少东家顾承训做填房。\n洞房那夜，新郎说了两个字\"休息吧\"，转身走了。\n她以为嫁的是一个冷血霸道的商人，却不知他身后藏着一张五年的情报网，那些深夜带血归来的背影，那些压在沉默里的距离，都是他以为的保护。\n她查账，识人，在顾家一步一步站稳脚跟；他看着，信她，却始终把她挡在危险之外。误解最深处，说出了最狠的话。\n真相大白时，她才明白，他的每一次沉默，都是一把刀，刺的是他自己。\n从苏州河边的长安渡口出发，经历误解、别离、烽火与重逢，两个各自扛着重量的人，用了整整一年，才走到彼此面前，说出那些早该说的话。\n烟雨长安渡，渡的是这一程，这一生这一个人。", "tags": ["民国言情", "现代言情", "先婚后爱", "民国", "破镜重圆"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丑村姑靠签到积分提升美貌", "fullTitle": "丑村姑靠签到积分提升美貌", "link": "https://fanqienovel.com/page/7656847598967327806", "data": [0.38, 0.47, 0.5], "trend": 0.12, "latest": 0.5, "wordNumber": 132055, "creationStatus": 1, "desc": "【架空民国+无固定cp+不择手段+土著】\n女主：不甘底层、依赖系统、觊觎上层人脉、敏感自卑又野心暗藏。(底层的普通人，前期不会很耀眼)\n绑定了系统的乡村丑姑娘，通过来到不同地点签到获得积分。\n兑换美貌、智商、健康。\n柳柳来城的路上，被破卷进了麻烦的中心，认识了一个又一个男人。\n“朱柳柳，你真狠心。”\n柳柳甩开被抓的手，毫不犹豫的转身离开。\n“处理好了？”\n柳柳点点头，跟着顾营长离开。\n后来，柳柳拿着枪对着他。\n“柳柳，我不相信你会动手!”\n柳柳毫不犹豫的开枪。\n最终，朱柳柳找到了自己人生的方向", "tags": ["民国言情", "现代言情", "系统", "民国", "一见钟情"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "出门在外，身份全靠自己编", "fullTitle": "出门在外，身份全靠自己编", "link": "https://fanqienovel.com/page/7580057733001399321", "data": [1.28, 1.35, 1.37], "trend": 0.1, "latest": 1.4, "wordNumber": 154156, "creationStatus": 1, "desc": "【无cp，爽文，微迪化，系统，民国，不掉马】\n断更后复更，流量不好见谅\n刚开分，评分有点低，后面还会陆续涨起来的\n大二学生林舟，在出车祸后被迫绑定了系统，穿进了一本民国架空背景的小说。\n系统告诉他想要复活需要十万熵值，在林舟兢兢业业努力两个月却只凑够了三点熵值后，他顿悟了。\n做人，不能太踏实，还是要学会投机取巧。\n在确认更改原著剧情能获得大量熵值后，林舟果断选择把自己塞进剧情。\n只他一个改变的剧情当然不够，可如果还有一个隐居避世的大家族呢？\n再没有什么能比一个横空出世的家族改变剧情更方便了。\n多方势力都在争夺的信物？主角遍寻不得的仇家？行事莫测的高手？\n一切的一切，都在这个只显露冰山一角的大家族掌握之中。\n-\n林舟，一个领了家族任务被派出来的子弟，其行事从来都以家中任务为首要目标，道上骂他的人不知几何。\n有人想拉拢他，也有人骂他是家族的走狗，可无论道上的人怎么说，他们都清楚一个事，那就是这位年纪并不大的后生，是个狠角色。\n横空出世仅仅两年，哪怕身后的家族供给他源源不断的资源，能将手下创立的据点做到这个地步都说明了他的能力。\n（无脑爽，无暧昧向，重要的事情说三遍：无cp，无cp）", "tags": ["民国言情", "现代言情", "系统", "穿越", "民国", "无CP"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "他人挚爱？重欲督军照样强娶豪夺", "fullTitle": "他人挚爱？重欲督军照样强娶豪夺", "link": "https://fanqienovel.com/page/7661128607221156888", "data": [0.35, 0.38, 0.42], "trend": 0.07, "latest": 0.4, "wordNumber": 101222, "creationStatus": 1, "desc": "（男替身十强取豪夺十强制爱十极限拉扯十上位者低头十双洁）\n身穿到军阀割据、动荡不安的民国，阮潇潇只想苟起来，为这个狼烟四起、动荡不安的国家做点力所能及的事情。\n怎奈何庇护她的同志，被对手诬陷，进了巡捕房。阮潇潇无法，只能求到了三省督军霍云霆面前。\n传闻霍云霆杀伐果断，年纪轻轻就坐上三省督军的位置，可谓要风得风，要雨得雨。在他看来，权势和地位，才是男人一生该去追求的东西，女人，不过是个消遣的玩意，随时可弃之如敝履，直到那一夜，夜幕下惊鸿一瞥，他就对阮潇潇这个女人势在必得。\n面对上门有求于他的阮潇潇，霍云霆想也没想，伸出一根手指头，冷冷道。\n“跟我一个月，换他的自由？”\n任他如何有兴趣的女人，一个月，足以让他腻了，谁也没想到，离开那天，霍云霆握住阮潇潇拎着行李的手，红着眼问。\n“和我在一起的日夜里，有没有那么一刻，你看我的眼神，心里没想着他？”\n看过冷漠的眼神，爱过一生无缘的人！", "tags": ["民国言情", "现代言情", "穿越", "民国", "替身", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在老九门打工那些年", "fullTitle": "我在老九门打工那些年", "link": "https://fanqienovel.com/page/7347712908786158654", "data": [1.35, 1.38, 1.42], "trend": 0.07, "latest": 1.4, "wordNumber": 155998, "creationStatus": 1, "desc": "本文略偏群像，以剧版节奏展开，多偏生活气息，不偏重下墓。\n女主脑力武力都没问题，一开始隐藏实力只是因为雨村金盆洗手的誓言，所以不想插手。\n然后逐渐被卷入，和九门众人熟悉起来，才决定参与。\n主CP齐八爷（日久生情，患得患失，甜甜的唯妻主义）和二月红有些瓜葛（前世今生，换皮掉马甲，追妻火葬场），其他人看情况撩一撩。\n第一次借尸还魂，她遇到了二月红，名为霜叶。\n在她想留下时，一切却戛然而止。\n她回到现实，疯狂搜寻关于他的一切，从而结识了吴邪等人。\n多年冒险之后，打算就此金盆洗手，留在雨村养养老，却不想突如其来第二次借尸还魂。\n第二次借尸还魂，她回到了九门，自称叶霜。\n昔日少年郎，已是名伶二爷，有了丫头。\n“叶霜，霜叶，很难猜吗？二月红，你是真的不知道，还是装作不知道？”\n不过没关系，她遇到了更好的。\n“八爷这么贤惠，不如我娶了你去吧。”", "tags": ["民国言情", "现代言情", "民国"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "谍战：我的动物军团杀疯了", "fullTitle": "谍战：我的动物军团杀疯了", "link": "https://fanqienovel.com/page/7628302723569437758", "data": [0.26, 0.29, 0.31], "trend": 0.05, "latest": 0.3, "wordNumber": 241460, "creationStatus": 1, "desc": "乱世狼烟，日寇横行。\n孤女禾苗，觉醒万兽之主系统。\n \n鼠潜地道，鸦探长空；\n猫狗盯梢，蜂群破阵；\n毒蛇隐杀，步步为营。\n \n以鸟兽为耳目，以虫蛇为刀锋。\n隐于市井，搅动谍战迷局；\n孤身抗敌，踏平倭寇凶焰。\n你抓不到我的人，更防不住我的万兽军团！", "tags": ["民国言情", "现代言情", "民国", "养成", "系统", "魂穿"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "谍战：我竟是敌方顶级女领导", "fullTitle": "谍战：我竟是敌方顶级女领导", "link": "https://fanqienovel.com/page/7624062180719070270", "data": [0.22, 0.23, 0.24], "trend": 0.01, "latest": 0.2, "wordNumber": 254776, "creationStatus": 0, "desc": "       【四十年代&谍战&无系统&无cp】\n     谁懂啊！现代外贸日语女经理一觉穿越，直接砸进华国大牢成了失忆女犯人！\n      离谱的是，她长了张和倭国特高课女指挥官一模一样的脸！\n      正主刚被暗杀，她就被军统当场捡走，强制拉去特训当替身间谍。\n      日语满级、情商爆表、搞情报自带天赋挂，她混进上海特高课疯狂卧底，偷偷给军统递情报。\n      全程被反派疯狂找茬怀疑身份，结果一块后腰胎记直接锁死身份，全员闭嘴！\n      越查越崩溃：我哪是替身啊，我本人就是那个日本女大佬！\n      我那个义兄竟是潜伏地下党。\n      从此她开启双轨打工模式，顶着日军高官马甲，一边忽悠鬼子，一边给两边递情报，在谍场躺赢封神  无cp", "tags": ["民国言情", "现代言情", "民国", "谍战", "穿越", "替身", "无CP"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生回到新婚，我掀翻督军府", "fullTitle": "重生回到新婚，我掀翻督军府", "link": "https://fanqienovel.com/page/7660001384011402265", "data": [0.36, 0.36, 0.37], "trend": 0.01, "latest": 0.4, "wordNumber": 158841, "creationStatus": 1, "desc": "直隶唐家世代经商，积累下庞大家财，手握兵权的陈督军觊觎唐家家产，以联姻方式，套取唐家万贯家财。\n嫁入陈家后，女主受尽磋磨，丈夫沉溺外室，与情人联手害死女主。\n女主带着前世刻骨恨意重生，发誓让仇人血债血偿。\n女主撕碎旧式女子必须困于内宅，以夫为天的规矩，一改往日守旧拘谨的摸样，学着新氏打扮，接触新思想，自学商业知识。\n女主顶住宗族长辈的与世情俗理，保全唐家产业，抓住民国实业兴起的风口，在动荡乱世挣脱礼教枷锁，步步为营，逆天改命。\n\n女主不善良，不善良，不善良！！！！\n\n\n\n\n", "tags": ["民国言情", "现代言情", "重生", "打脸", "民国", "虐渣", "豪门世家"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "1927：咱们俩现是什么关系？", "fullTitle": "1927：咱们俩现是什么关系？", "link": "https://fanqienovel.com/page/7661221597474196542", "data": [0.26, 0.27, 0.27], "trend": 0.01, "latest": 0.3, "wordNumber": 170869, "creationStatus": 1, "desc": "本文是人间正道是沧桑杨立仁的同人文\n也是我另一本书《我和未来国府高官谈恋爱》的姊妹篇，算是平行的小世界，楚材X汪昭的番外会穿插在这本里~\n剧中的杨立仁是一个很有魅力的角色，大家觉得有雷点的地方直接跳过就好~\n女主不重生不穿越无金手指\n1927年，杨立仁接到任务赶赴上海，和上海滩荣家大小姐产生了交集\n对荣佩仪，杨立仁爱不深恨不透，他们纠缠放纵，却忘了问一问，“你到底爱不爱我？”", "tags": ["民国言情", "现代言情", "民国", "大小姐"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "游戏体育": [{"label": "被男朋友分手后末日游戏入侵现实", "fullTitle": "被男朋友分手后末日游戏入侵现实", "link": "https://fanqienovel.com/page/7660848919328328728", "data": [0.85, 1.17, 1.8], "trend": 0.94, "latest": 1.8, "wordNumber": 184949, "creationStatus": 1, "desc": "末日游戏+空间囤货+安全屋+无CP+女强\n \n \n江月活成了旁人眼中十足的倒霉人。\n \n相恋五年的男友毫无征兆提出分手，她沉浸在失恋的低落里，偶然刷到闺蜜朋友圈才撞破残酷真相——两人早已暗生情愫，联手欺骗了她许久。\n \n满心委屈无处排解时，末日游戏入侵蓝星，全球年满十八岁的人类尽数被强制传送至危险的游戏位面。\n \n进入副本后，所有人都随机分配初始庇护所，旁人拿到整洁安全的小屋，唯 ationStatus": 1, "desc": "【全洁款，请放心食用。】\n《仙缘》号称全球首款拥有沉浸式VR体验的乙女向游戏。\n常宁作为品鉴无数电子男友的资深玩家，好不容易抢到了内测资格，却在数个可攻略对象中，头铁地选择了一名叫陆今尘的神秘剑修男。\n【请玩家选择身份：1.弟子；2.器灵；3.路人】\n“开玩笑，我当然要原地螺旋起飞再忧郁地降临继承他的一切并和他展开一场惊天动地的师徒禁忌之恋！”\n后来，常宁就为自己的无知付出了代价。\n她被be麻了。\n当常宁好不容易打出he之后，心累地决定换换口味潇洒一下。\n没想到她刚和新对象牵上小手，比她的脸红来的更快的是陆今尘的剑气。\n他落下的时候，剑甚至还没出鞘。\n“若此人接下我这一剑……”\n常宁希冀地看着他：“咱们就此别过了？”\n陆今尘气笑了，拔出长剑。\n“我就砍死他。”", "tags": ["游戏体育", "系统", "搞笑轻松"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全民求生：开局一间茅草棚", "fullTitle": "全民求生：开局一间茅草棚", "link": "https://fanqienovel.com/page/7656077111253290009", "data": [1.62, 1.79, 1.87], "trend": 0.25, "latest": 1.9, "wordNumber": 239226, "creationStatus": 1, "desc": "【无cp➕囤货➕种田➕基建➕可成长天赋➕不圣母】\n一觉醒来，全球百亿人被拉入全民求生游戏。\n\n开局一间漏风的茅草棚，一把石斧，一份新手物资，每个人还能随机抽取一个天赋。\n\n有人抽到百倍暴击，有人抽到元素掌控，有人抽到御兽天赋。\n\n沈宁抽到了看似普通的天赋——【变废为宝】。\n\n别人眼里的破木头、生锈铁块、碎石垃圾，在她手里统统都能变成珍贵资源。\n\n腐烂果子变异成果树种子。\n\n废弃铁片变成精炼钢材。\n\n破旧家具拆出高级图纸。\n\n别人还在为一口吃的发愁时，她已经种田、养殖、建房、囤积物资。\n\n当兽潮降临、极寒来袭、迷雾笼罩大陆……\n\n沈宁的领地早已高墙林立，仓库爆满，良田万亩。\n\n后来，人们才发现。\n\n那个一直低调发展的小小茅草棚，不知何时，已经成为整个世界最坚固的堡垒。", "tags": ["游戏体育", "无CP", "穿越"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "求生游戏：我在童话森林盖树屋", "fullTitle": "求生游戏：我在童话森林盖树屋", "link": "https://fanqienovel.com/page/7642352792408951832", "data": [1.74, 1.93, 1.98], "trend": 0.24, "latest": 2.0, "wordNumber": 277437, "creationStatus": 1, "desc": "【成长型女主+无cp＋全民求生+囤货生存+有萌宠】\n全民求生游戏降临，全球玩家被投入危险的童话森林。\n野生摄影师辛夷开局被传送到这里，却意外绑定生命之树，觉醒天赋、继任特殊职业，开局就把庇护所盖成了巨型树屋！\n别人挨饿受冻、被魔物追杀，她蹲守秘境、撸萌宠、升级树屋，日子过得比谁都滋润。\n软萌松鼠、七彩翠鸟、月光小鱼……全成了她的专属小伙伴。\n更惊喜的是，这片森林藏着童话，灰姑娘、人鱼公主、小红帽真的是我们熟悉的故事主人公吗？\n从简陋树洞，一步步建成百兽守护的童话堡垒；\n从孤身求生，到拥有女巫传承、伙伴相随、全服第一的超强实力。\n辛夷：童话不是只有美好，但我能把危险森林，活成童话主场！\n开局一棵树，装备全靠打，萌宠全靠撸，树屋越盖越豪华！总之，这波求生，我赢定了！", "tags": ["游戏体育", "穿越", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "求生游戏，我真不是美食魔女", "ful 4ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个榜一，她比游戏还阴", "fullTitle": "别惹那个榜一，她比游戏还阴", "link": "https://fanqienovel.com/page/7648579996763573272", "data": [1.86, 1.92, 1.92], "trend": 0.07, "latest": 1.9, "wordNumber": 275614, "creationStatus": 1, "desc": "评分刚出，会涨的，(>^ω^<)\n【游戏入侵+无cp+求生+副本闯关】\n某个平平无奇的日子，作为游戏主播的辛酒通关了全息求生爬塔游戏《代号·神临》。\n上一秒，系统还在发公告说她是全球唯一通关玩家。\n下一秒，就迎来版本大更新，游戏内的试炼塔降临现实，所有参与过公测的玩家必须在六个小时内进入塔内开启游戏，为自己的国家赚积分，争排名。\n每期排行末尾的国家将面对诡异降临。\n辛酒：作为全球唯一的通关玩家，版本更新怎么了？我依旧能打穿。\n可没想到游戏副本被重组，难度提升，公测时游戏内木讷的npc竟然有了自己的思想。\n全世界都在哀嚎，觉得这个世界要完。\n唯独九州群众淡淡一笑：“只要有酒酒在，我们九州就是无敌的。”\n———\n【排雷1:小队成员后期汇合，女5男2，队内无感情线，包括单箭头也无。】\n【排雷2:女主内心是柔软的，但不窝囊，是女本位，但非大女主，大爽文，以升级流为主，女主改变需要时间。】\n【排雷3:作者笔力不足，逻辑会有漏洞。】\n【一千个读者心中一千个哈姆雷特，作者能力有限，不能避开所有人的雷点，短暂相遇也是缘分，祝平安，祝暴富～～】", "tags": ["游戏体育", "无限流", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "地球人，你们逃离原生神明了吗？", "fullTitle": "地球人，你们逃离原生神明了吗？", "link": "https://fanqienovel.com/page/7651126222834895896", "data": [1.12, 1.17, 1.16], "trend": 0.05, "latest": 1.2, "wordNumber": 220177, "creationStatus": 1, "desc": "【无CP+游戏降临+神明竞赛+无限流】\n正值高三的毕成神抽到一个名为地球世界的初始卡池，从此开始捡垃圾养卡牌，卡牌各个都争气，说话又好听，谁说这犄角旮旯偏僻土世界不好的，这地球世界可太好了。\n毕成神：斗争之神走丢了，我就是斗争之神。\n竞技场里，五连败，毕成神：“自然之神大姐，别打了，我承认我跟胜利之神都是废物。”\n十连败，毕成神：“各位神仙大佬，我说我只是路过竞技场你们信吗？”\n...\n十五连败，毕成神：“地球人你们能不能行？十个打一个被反杀会不会玩？好歹给我赢一局，我叫斗争之神，一局不赢会被同学笑死的！”\n...\n二十连败收菜后，毕成神：“我承认刚刚是我声音有点大。”\n二十连胜后，毕成神：“什么修仙世界、魔法世界也配跟我的地球世界比？”\n三十连胜后，毕成神：“把幸运女神给我叫来！”\n...\n后来已经成为真正的神明的毕成神接受采访，“你们不知道，地球世界小时候有多费资源，我是一把垃圾一把废料含辛茹苦把它拉扯大，为了养地球，天天去副本捡垃圾，一个新世界都不舍得给自己买...”\n第二天的原世界头条：地球世界，你们逃离原生神明了吗？", "tags": ["游戏体育", "无限流", "无CP"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "游戏入侵：全服笑我捡垃圾", "fullTitle": "游戏入侵：全服笑我捡垃圾", "link": "https://fanqienovel.com/page/7650045105436363838", "data": [1.31, 1.36, 1.36], "trend": 0.04, "latest": 1.4, "wordNumber": 29447  "已签实体出版！\n［无虐，无雌竞，轻松甜文，双洁1v1］\n【嘴特甜，很缺钱，纯欲钓系女主】\n【嘴很毒，钱贼多，冷傲拽哥男主】\n-\nS大校花姜晚接了一项特殊委托。\n豪门大小姐雇她追求海城太子爷进行网恋。\n照片、身份都是大小姐本人，手机对面换成她。\n然而太子爷又冷又拽，姜晚每天绞尽脑汁的撩。\n-\n姜晚费劲吧啦刚追到人，大小姐发来指令：\n“晚晚，目标达成，计划终止。”\n“收到！”\n姜晚连夜爬起来和太子爷提分手。\n商时序咬牙：【你别后悔】\n姜晚：【嗯嗯，绝不后悔】\n\n两天后——\n大小姐：“晚晚，情况有变，你还没跟他分手吧？”\n姜晚咬紧后槽牙：“你、说、呢？”\n大小姐：“快、快复合！”\n-\n复合后，海外留学的太子爷偷偷跑回国要给姜晚惊喜。\n他的惊喜，姜晚的惊吓！\n为了不掉马，情急之下，哄骗他酒店蒙眼。\n姜晚聊完天想溜，被他扣住腰亲懵！\n说好的网恋怎么还有失身的风险？\n-\n【掉马小剧场】\n某日，姜晚帮父母摆完摊后回到小区门口，太子爷突然打来电话。\n“在哪？”\n“不是告诉你我和朋友在拉斯维加斯玩呢。”\n“玩得开心吗？”\n“开心啊～”\n“回头。”\n姜晚：！！！", "tags": ["青春甜宠", "现代言情", "总裁", "甜宠", "双洁", "1v1"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [52.2, 52.43, 54.65, 55.39, 54.91, 54.05, 54.09], "trend": 1.89, "latest": 54.1, "wordNumber": 864207, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [17.2, 17.34, 17.87, 18.34, 18.8, 18.82, 18.79], "trend": 1.59, "latest": 18.8, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次 el": "夏夜有染", "fullTitle": "夏夜有染", "link": "https://fanqienovel.com/page/7429537438936075289", "data": [19.98, 19.76, 18.46, 19.25, 19.62, 19.94, 20.31], "trend": 0.33, "latest": 20.3, "wordNumber": 403900, "creationStatus": 0, "desc": "（已签实体）\n【校园重生+追妻火葬场+拽哥上位+借住文学】\n【有点叛逆乖乖女x懒淡拽哥】\n奶奶离世，谈、陆两家见没了亲人的许恩棠可怜，都想把她接去照顾。\n来到北城，许恩棠再次见到那个让她一眼难忘的少年。\n陆襟痞气肆意，之后一起成长的那些年，她看他身边的女人换了一个又一个。\n没想到有一天，他会问她想不想嫁给他。\n她以为是自己多年暗恋终于得到回应。\n直到婚后，她听到他对朋友说：“家里让娶，我还能怎么办？”\n她心灰意冷，决定离婚。\n**\n离婚前夜，她重生回到高二被接回北城这天，依旧是两家都住。\n后来，她夜不归宿，他发疯似的找她。\n“你真的谈恋爱了？跟谁？”\n电话彼端的许恩棠红着脸被谈霁礼圈在怀里。\n谈霁礼开口，声音传进电话里，“告诉他，是不是在和我谈恋爱？”\n**\n以前的许恩棠心思都在陆襟身上，和谈霁礼不熟，没想到会与疏离懒淡的他在这个夏夜有染。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "追妻火葬场", "男二上位"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "替嫁植物人大佬，婆家撑腰成团宠", "fullTitle": "替嫁植物人大佬，婆家撑腰成团宠", "link": "https://fanqienovel.com/page/7577671607246670872", "data": [21.64, 26.8, 29.02, 29.1, 27.86, 30.02, 46.25], "trend": 24.61, "latest": 46.2, "wordNumber": 1002341, "creationStatus": 0, "desc": "【先婚后爱+虐渣复仇+真假千金+追妻火葬场+微群像】\n乔珂被杀的时候才知道自己精心照顾的养子是丈夫的私生子，一切只为他的白月光。\n重生在乔柳两家知道抱错孩子，乔珂从乡下刚进城的时候。\n乔珂和重生的前夫哥默契地做了同样的选择:\n前夫哥选了他上辈子心心念念的白月光。\n乔珂选择搬空偏心狠辣娘家的小金库，同意去司家冲喜，未来当个有钱有势的小寡妇也不错。\n谁料婚后她福运太旺，寡妇没当上，婆家撑腰步步高\n对于等着前妻低头投靠的前夫哥来说，上辈子本该早死的植物人却突然醒了？\n前夫哥心慌了，不好！前妻真的要嫁人了！\n小剧场：\n乔妹：老公躺在床上一动不动，很乖~很安分~我要好好照顾他。\n军官：她对我这么体贴照顾，肯定很爱很爱我！我一定要快点好起来！\n乔妹大惊：他上辈子不是死了？怎么又活了？不行！我要离婚！\n辛辛苦苦好起来给她一个惊喜，反而差点被她再气成植物人！\n男人红眼放狠话：想离婚？除非我死了！", "tags": ["年代", "现代言情", "重生", "打脸", "追妻火葬场", "真假千金"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [36.78, 36.98, 40.07, 43.06, 46.26, 48.07, 47.86], "trend": 11.08, "latest": 47.9, "wordNumber": 528058, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这 50.1, 53.01], "trend": 23.41, "latest": 53.0, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [29.28, 32.94, 37.44, 39.18, 40.91, 42.41, 43.85], "trend": 14.57, "latest": 43.8, "wordNumber": 507414, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君今日又没有藏好他的尾巴！", "fullTitle": "夫君今日又没有藏好他的尾巴！", "link": "https://fanqienovel.com/page/7565826198656273432", "data": [10.56, 10.87, 11.62, 11.83, 12.11, 12.27, 12.47], "trend": 1.91, "latest": 12.5, "wordNumber": 370843, "creationStatus": 0, "desc": "乔盈穿书了，但不幸的是，她被绑匪伤到了脑袋，失了忆。\n在阴暗潮湿的地牢里，她遇到了一个少年。\n少年一袭青衣，白发如雪，面容昳丽，却眼覆白绫，虽身有残缺，但他最是乐观爱笑。\n那一天，失忆的乔盈带着人畜无害的少年一起逃出了地牢。\n少年是个好人。\n因为怕血，所以哪怕是在尸山血海，他的衣摆也一尘不染。\n因为胆小，别人打架，他只敢躲在远处，众人却在下一刻死在毒雾里。\n因为善良，他给痛苦的敌人递药，可惜对方没熬住，七窍流血而死。\n于是，她决定和这样的好人成亲。\n再到后来，正派人士叫着妖孽，提剑而来。\n那一夜，尸横遍野。\n她终于想起来了剧情。\n这是一个诡异横生，光怪陆离的世界。\n有那么一个大反派，他缺乏正常人的情感，为祸苍生，引来纷争无数，最后是男女主牺牲生命才将他封印。\n腥风血雨里，少年回眸看她。\n蓝色的眼眸幽深诡谲，缀了血花的面容，宛若人间修罗，九条狐尾在身后肆意舒展，妖冶秾丽。\n乔盈被吓得脸色煞白。\n他却轻轻的笑，“你若是害怕想跑，可来不及——”\n话音未落，乔盈跑了，却是跑进他的怀里，拭去他脸上的血花，“你吓到我了，我还以为你受伤了！”\n少年眨眨眼，摸摸她的脑袋，又戳戳她的脸，“你是不是傻？”", "tags": ["古言脑洞", "古代言情", "反派", "穿书", "HE"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [25.36, 25.69, 26.58, 26.79, 26.96, 27.02, 27.12], "trend": 1.76, "latest": 27.1, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "你听心声我吃瓜，换嫁夫妻笑哈哈", "fullTitle": "你听心声我吃瓜，换嫁夫妻笑哈哈", "link": "https://fanqienovel.com/page/7592502894293683224", "data": [14.75, 14.51, 14.84, 15.36, 15.94, 16.43, 16.4], "trend": 1.65, "latest": 16.4, "wordNumber": 579611, "creationStatus": 0, "desc": "【吃瓜乐子人男主 × 读心宠夫女主，先婚后爱，夫妻联手，单女主】\n我，裴辞镜，穿成侯府二少，只想躺平吃瓜。\n谁知大婚在即，我那世子大哥，竟和我未婚妻滚到了一起！\n现场吃瓜，苦主竟是我自己？\n正当我以为要沦为全京城笑柄时，那位本该成为我大嫂的沈家嫡女，竟主动提出：\n“不如，换我嫁你？”\n我表面稳如老狗，内心狂喜：这姑娘有眼光！\n可直到婚后某天我才发现不对，我内心OS正嗨：【我媳妇今天真好看，想亲……】\n她忽然转头，眼波流转：“准了。”\n等等！\n她能听见我的心声？！\n这下好了，我吃遍天下的瓜，她专吃我这 去吃花生米！\n\n绿茶想要又要？做梦！你只配吃花生米！\n\n不仅处处给他们挖坑，还通过他们找到了金山银山？\n\n太好了，目之所及，不论钱财粮食还是宝贝，通通收收收！\n\n顺带着陆海空三军告状告了一大遍，把渣男的领导搞的灰头土脸，别提有多爽！\n\n啥？渣男娘受不了刺激想求自己？\nno！本姑娘不接受道德绑架！\n\n\n\n\n\n\n\n\n\n………………\n只是那个高冷的首长喂，\n你千里追到我家为哪般？想让我跟你去随军？\n\n本辣椒是觉得你有钱又大方还好欺负，\n可咱们不太合适！\n\n毕竟，跨军界告你状，让你成为了大笑话，我虽不后悔但心虚！\n\n\n而且姐有大志向：只想当村霸！\n\n………………………………\n\n小剧场：\n“听说了吗，顾首长的新婚妻子是黎予初！”\n“老天爷！这个活爹怎么又回来了？”\n嫂子们急的嘴里起了水泡，\n文工团的姑娘使劲捂住钱包，\n训狗的提前做好了被罚准备，\n\n……\n\n要说谁最欢迎黎予初这个大闹腾，\n当然是……犬！\n呃，还有某人！", "tags": ["年代", "现代言情", "宠妻", "空间", "虐渣", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "投胎？不！我和六零重生女换人生", "fullTitle": "投胎？不！我和六零重生女换人生", "link": "https://fanqienovel.com/page/7627049014881438745", "data": [21.19, 22.81, 23.98], "trend": 2.79, "latest": 24.0, "wordNumber": 548365, "creationStatus": 1, "desc": "评分刚开，会涨！\n【强惨狱霸风男主X貌美咸鱼小作家】\n【不下乡+不黑市+日常家长里短+互相救赎+甜文】\n下辈子荣华富贵关我这辈子什么事儿？\n林夏本是现代一个网文作者和粉丝十几万的短篇漫画作家。\n一场意外连人带窝被轰得渣都没了，喝孟婆汤投个富贵胎？她选补偿空间和六零重生女交换人生。\n林夏面对即将被卖出去换彩礼的人生，首先选择撕开林家偏心的遮羞布，不当老黄牛伺候全家，在外积极找工作。\n结果六十年代的铁饭碗没关系实在是太难了。\n“夏夏，老师给你介绍个相亲对象，其他条件都符合你的要求，就是这长相，五官分开看都好看”\n“合在一起嘛。夏夏，你知道胡子么？他就像那没有胡子的胡子，胡子头儿要是一起蹲笆篱子，他凭长相气质能当狱霸的那种。”\n林夏想了想下乡的苦。\n相！长得凶怎么了，有下乡可怕吗？\n谁知当天相亲，第二天就领了证，嫁进了铁路局家属院。\n贺凛在他荒芜的人生碰到了独属于他的救赎，迅速扒拉回了家。\n家属院众人看着美若天仙的林夏，本以为贺科长的媳妇儿肯定是被强迫嫁给他的，日子肯定不好过。\n谁知人家贺科长长得凶但他是真疼媳妇啊。\n再后来夫妻两一起努力，一个在铁路系统一路晋升，一个成为了闻名全国的畅销作家", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "相互救赎", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [26.34, 27.65, 28.24], "trend": 1.9, "latest": 28.2, "wordNumber": 786229, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [46.26, 48.07, 47.86], "trend": 1.6, "latest": 47.9, "wordNumber": 528058, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随妈改嫁军区院：首长他蓄谋已久", "fullTitle": "随妈改嫁军区院：首长他蓄谋已久", "link": "https://fanqienovel.com/page/7530871199874681880", "data": [23.63, 24.11, 25.21], "trend": 1.58, "latest": 25.2, "wordNumber": 1116007, "creationStatus": 0, "desc": "【年代+群像+军婚+家长里短+病娇+打脸虐渣+女强】\n天才医生江临夏累死在手术台上，穿成80年代受人排挤欺辱的小村姑。苏醒后，她与泼辣老妈林阿秀联手揍人渣，成了村里的女霸王！\n\n老妈捡回重伤的顾石野。眼看母女俩艰难度日，又因为自己的到来被羞辱，救命恩情加烈士遗孀身份，顾时野果断求婚歪婆娘：“我娶你，你和阿夏都跟我走！”\n\n 母女俩一合计：进军区大院？不亏！\n\n谁知大院才是真地狱开局，流言蜚语如刀，弟弟不认，哥哥不睬。\n\n不想认？没关系，她可不是娇滴滴的女王，有的是力气和手段！\n\n江临夏冷笑：专治各种不服！银针救战士，辣妈骂全院，日子刚爽起来，却惊觉那人看她的眼神，越来越烫人……\n", "tags": ["年代", "现代言情", "病娇", "群像", "家长里短"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄学真千金穿七零，认亲首长父亲", "fullTitle": "玄学真千金穿七零，认亲首长父亲", "link": "https://fanqienovel.com/page/7581118244304473150", "data": [30.87, 31.65, 31.74], "trend": 0.87, "latest": 31.7, "wordNumber": 947599, "creationStatus": 0, "desc": "江莯颜本是现代玄学界的修炼天才，早在她穿越之前，师父便已算出她有穿越到异世这一劫难。为护她周全，师父与众位师兄们，将海量金银珠宝、稀缺药材以及各种符箓和生活物资尽数收纳于芥子袋中，成为江莯颜在七十年代最大的“底气”。\n江莯颜刚穿越，便发现原主在刚出生时，就被现在的养母把她和自己的亲生女儿偷偷调换 。而养母更是为了自己的亲生女儿和儿子，逼着原主嫁给一个打死过两任老婆的老渣男。\n不过，这都难不倒江莯颜，看她如何榨干无良养父母的钱财，临走前还分别送给他们一个霉运符，让他们为欺辱原主付出代价。\n江莯颜报名下乡后，在这期间，邂逅了未来的命中注定，也重逢了自己的亲三哥。凭借精湛的玄术和医术救治了很多本该被命运辜负的人。更凭借那双能洞察虚妄的天眼，敏锐察觉到潜藏在暗处的敌特分子，保护了被下放的科研人员的安全。\n高考恢复后，江莯颜凭借过人的天赋和优异的成绩考入京市的顶尖学府，也终于和亲生父母相遇，开启了属于她的璀璨篇章！", "tags": ["年代", "现代言情", "穿越", "天才", "虐渣", "真假千金"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生：搬空首富家底去北大荒", "fullTitle": "重生：搬空首富家底去北大荒", "link": "https://fanqienovel.com/page/7632550005361888281", "data": [19.26, 19.55, 19.99], "trend": 0.73, "latest": 20.0, "wordNumber": 1047615, "creationStatus": 1, "desc": "上一世，我是江南顾家的大小姐顾晚。\n特殊时期一来，家被抄、人被批斗，爷爷奶奶被逼死，三个哥哥流放惨死，我冻毙在北大荒的雪地里。\n睁眼，我竟重生回到了风波前！\n风声已紧，断了联系的二叔一家等着落井下石，远在南洋的姥姥家远水解不了近渴。\n这一次，我攥着随身空间，说服全家：跑！\n金银细软、粮食布匹、药品工具，统统收进空间。\n江南再无顾家地主，北大荒多了户开荒户。\n别人啃树皮时，我家粮囤满仓；\n别人被批斗时，我们早已洗白身份，安稳度日。\n这一世，我要护好全家，让所有仇人血债血偿！", "tags": ["年代", "现代言情", "乡村", "重生", "空间", "家长里短"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [29.44, 30.42, 29.91], "trend": 0.47, "latest": 29.9, "wordNumber": 865040, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "堂妹抢婚？爽，禁欲首长馋上我！", "fullTitle": "堂妹抢婚？爽，禁欲首长馋上我！", "link": "https://fanqienovel.com/page/7612183160905796670", "data": [24.18, 27.49, 24.53], "trend": 0.35, "latest": 24.5, "wordNumber": 979176, "creationStatus": 1, "desc": "【姐妹易嫁+年代军婚+冷情恶女VS禁欲首长+撕渣+追妻火葬场】\n\n骆青瑶胎穿七零后，忘记了上辈子的事，十五岁的时候她还出了车祸。\n因此变得又胖又横。\n堂妹骆青雨抢了她的娃娃亲，失忆了的骆青瑶过不去这个坎，恨不得杀了那对狗男女。\n有一天，堂妹的未来亲姐夫到她家里来了！\n不仅是个高门子弟，还是部队最年轻的参谋长。\n很优质！\n比之她以前的未婚夫强太多！\n骆青瑶的眼底闪过一丝得意：机会来了！妹债姐还！\n抢！\n——骆青雨，你抢我的未婚夫、我抢你的亲姐夫，不为过吧？\n——骆青华，你不是说会被抢，那是自己不被爱吗？这滋味，你也享受享受吧！\n一夜混乱，骆青瑶把傅北寒给睡了，这一夜也因为她不小心摔倒，觉醒了前世的记忆。\n醒来后，骆青瑶给自己点了个赞：干得好，咱二十一世纪的人，吃啥也不能吃亏！\n傅北寒：我出来执行个任务，就被人睡了？\n睡我的，还是个小胖妹？？？\n", "tags": ["年代", "现代言情", "穿越", "追妻火葬场", "代嫁代娶"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零知青娇弱可人？刀刀要你狗命", "fullTitle": "七零知青娇弱可人？刀刀要你狗命", "link": "https://fanqienovel.com/page/7606648925205826584", "data": [25.06, 24.98, 25.38], "trend": 0.33, "latest": 25.4, "wordNumber": 834823, "creationStatus": 0, "desc": "【已完结，放心入坑】\n重生七零年代＋抄家＋空间＋白切黑女主＋男女双强＋下乡知青＋科技助国＋军婚＋甜宠＋恋爱脑兵王＋爽文＋双洁\n23世纪武术冠军魂穿七零，一睁眼就遇上抄家惊魂，原主被活活逼死。\n她携带异宝重活一世。\n父母双双牺牲，家产被窥，革委会频频上门刁难？\n她连夜端了革委会老巢，洗劫仇家，卷走滔天财富潇洒下乡。\n本想苟着搞钱搞科研，却意外撞破祖辈惊天秘辛，一路遭人截杀。\n人前软萌娇弱小知青，人后狠辣能打白切黑。\n谁料被冷面兵王一眼盯上，从此黏人属性彻底爆发。\n风行止：看着香香软软，想娶回家疼。\n下一秒见她把人揍飞：……更爱了，又飒又野！\n恋爱脑兵王天天贴贴，白切黑女主一言不合就动手。\n她搞科技强国，他做最强后盾。\n男女双强，军婚高甜，从下乡知青飒到京城顶层！", "tags": ["年代", "现代言情", "重生", "空间", "强强", "白切黑"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [27.42, 27.79, 27.73], "trend": 0.31, "latest": 27.7, "wordNumber": 1120914, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生八零：老太太抛子弃女", "fullTitle": "重生八零：老太太抛子弃女", "link": "https://fanqienovel.com/page/7460001987375926296", "data": [25.13, 25.36, 25.31], "trend": 0.19, "latest": 25.3, "wordNumber": 3182087, "creationStatus": 1, "desc": "【年代】【八零】【微群像】【重生】【爽文】【无金手指】【家长里短】\n（又名：重生八零：老太太抛子弃女）七旬老太吴知秋重生了，重生到孩子们还要靠她辛苦付出的年代！上辈子自己偏心，晚景凄凉。重生不重演，老太太决定抛开儿女，美美的过余生！\n小儿子哭唧唧抱着大腿，妈！我可是你最爱的小儿子，我要给你买大房子！为了能跟老娘在一起生活，砒霜拌馅，鹤顶红勾芡，为了老娘没事就得插兄弟两刀！\n公婆化身王炸组合“我那最有出息的大孙呦！爷奶想吃锅子，烤肉，洋饭……”把大儿子两口子坑的裤衩子都穿不上溜。\n宠妻狂魔李满仓……别和我说，这家我说的不算！", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "青春甜宠": [{"label": "我刻薄不是装的", "fullTitle": "我刻薄不是装的", "link": "https://fanqienovel.com/page/7585498354692394046", "data": [23.15, 26.36, 29.58], "trend": 6.42, "latest": 29.6, "wordNumber": 300523, "creationStatus": 1, "desc": "那咋了？喜欢我的人只会觉得我在撒娇。\n-\n【贵族学院+都市】【恶女万人迷】【1v1】【雄竞】【轻松沙雕】\n－\n前世，恶女乔映只是因为嘴损，就被团宠文女主给宰了。\n重生后，乔映反思，觉得还是要有点恶毒手腕，这样才能保护这张好嘴。\n最好的防守就是进攻，所以这一次她把女主的舔狗们全给阴了。\n－\n钟树白这人是个冷脸萌。\n乔映亲他，他只会哼哼一声，说乔映是个坏女人。\n身为男主之一，钟树白没有走上既定的路线被攻略。\n而是在乔映破产后，豢养了她这只美丽的金丝雀。\n不过乔映实在不省心，一个没看住，就被弄死了。\n钟树白坐在凌晨的客厅，开酒刀割破手腕，随她而去。\n－\n既然老公迟早是我的，为什么不能现在就是我的？\n乔映猛追十七岁的钟树白。\n少年抗拒，结果一张嘴。\n“姐姐”两个字脱口而出。\n乔映已被萌晕。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "搞笑轻松", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怎敌她动人", "fullTitle": "怎敌她动人", "link": "https://fanqienovel.com/page/7470142203893926936", "data": [56.59, 59.21, 61.47], "trend": 4.88, "latest": 61.5, "wordNumber": 551024, "creationStatus": 0, "desc": "【已签实体出版】\n【重生校园+救赎+男暗恋+双洁HE】\n明媚嗲精 x 偏执隐忍\n*\n外人眼里，许霁青清冷斯文，是身家显赫的耀眼新贵，靠自己改命的寒门奇迹，能在最狼狈的时候嫁给他，是苏夏八辈子修来的好命。\n只有苏夏知道，许霁青是个疯子。\n她不喜欢他湿沉的眼神，不喜欢他无处不在的掌控欲，更怕那双苍白变形的手。\n直到许霁青为保护她死了。\n百亿遗产到手，苏夏却开始失眠，每回惊醒，梦里都是许霁青最后那声“夏夏”，和那张鲜血浸透的俊脸。\n*\n一睁眼，重回高二。\n苏夏家庭美满，还是那个众星捧月的小公主。\n许霁青刚转校到临中，旧球鞋刷洗到泛白，眉眼冷淡。\n他过得很苦，但还看不出日后的偏执。\n无人愿意和他同桌，她攥紧了裙摆，拉开身边的椅子，鼓起勇气对他笑。\n我的亡夫，这辈子好好活着。\n长大之后，\n不许再缠着我了哦。\n*\nTIPS:\n1.女主重生，两世都是双洁；\n2.男主的手后面会好；\n3.无雌竞，女主会慢慢改变，男主起始好感拉满爱到发疯；\n4.有关“亡夫哥为什么会爱上女主”和其他前世内容，正文后已更新5w+亡夫哥专场番外，从if线风雪故人归开始，书信集结束，请务必不要错过", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "双洁", "位尊权重"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯批太子爷夜夜闻我体香入睡", "fullTitle": "疯批太子爷夜夜闻我体香入睡", "link": "https://fanqienovel.com/page/7561406804232522814", "data": [39.17, 40.92, 42.67], "trend": 3.5, "latest": 42.7, "wordNumber": 308760, "creationStatus": 0, "desc": "新书刚开分，还会涨的！【阴湿疯批+甜撩+救赎+穿越+大学校园+双洁1v1】 \n天生坏种X坚韧乐观小太阳 \n品学兼优的大一新生江幼希，某天兼职时，意外捡到一个少年。 \n少年自称是她未来的儿子，对她大喊“妈”，抱着江大风云人物贺酌直喊“爸”。\n等等！ \n孩子他爸是贺酌？\n那个传闻杀过人、手段狠戾变态的疯批太子爷？！ \n儿子：“妈，那都是谣言，爸其实是一个温柔善良的好人！”\n江幼希半信半疑，当晚就亲眼看到贺酌开车撞人。\n他满眼杀气，以飙车的速度把一名男子撞得满身是血，奄奄一息。\n江幼希吓得转身想跑，却被他扣住后脖颈。\n“抱歉，吓到你了，”他沾染血迹的指尖落在她眉心，笑容恶劣—\n“小、学、妹。”\n—\n虽然孩子他爹是变态，但为了避免丧偶式教育，江幼希决定带着儿子去认爹。\n江幼希把儿子拉出来：“贺酌学长，他、他是你儿子。”\n贺酌睨她：“他妈是谁？”\n“我。”\n“行，那今晚陪我睡。”\n“？？我为什么要陪你睡？”\n“不睡，他怎么来？”\n“……”\n— \n贺酌因童年遭受打击，导致患上了睡眠障碍症。唯有江幼希身上的气息，能让他心安，成功入眠。 \n男人指腹轻碾她的小梨涡：“再陪我睡一晚，好不好？” \n“怎么睡？”\n男人紧扣她纤腰，俯身亲吻— \n“换个姿势。”", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生亡妻少年时，鳏夫他又茶又装", "fullTitle": "重生亡妻少年时，鳏夫他又茶又装", "link": "https://fanqienovel.com/page/7639714250130213913", "data": [24.2, 26.07, 27.56], "trend": 3.37, "latest": 27.6, "wordNumber": 476569, "creationStatus": 1, "desc": "【阴湿绿茶+男主视角+服务型男主+双洁1v1】\n评分刚开，后面会涨，书评为证！\n祝知予长相明艳，做事果断，是身家显赫的集团掌权人，却不料一朝遇难，公司接连暴雷，转眼所有合作商对她闭门不见。\n霍礼用十亿作为交换，将年少时暗恋的人锁进婚姻。\n他原以为自己能与妻子举案齐眉、琴瑟和鸣，却没想到意外来得如此突然。\n祝知予死了。\n他的妻子死了。\n他深爱的、日夜妄想的人，死了。\n霍礼冷静地为妻子处理后事、收拾遗物……最后冷静地服药殉情……\n再次睁眼，墓碑消失，他的妻子好端端的站在他跟前，问道：“同学，你还好吗？”\n不好，他一点也不好。\n霍礼摇头，她离开的每一天，他都如行尸走肉，度日如年。\n他下意识钻进她的怀里寻求安慰。\n却没想到只迎来了妻子清脆的巴掌。\n哦，他忘了，现在的祝知予还不是他的妻子。\n发帖：用不光彩的手段和妻子结婚了，但现在妻子还不是妻子，我该怎么让妻子重新爱上自己？\n回答：哈？楼主要不要看看你在问什么呢？语文是体育老师教的吧？", "tags": ["青春甜宠", "现代言情", "学霸", "暗恋", "双洁", "1v1"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [25.74, 27.09, 28.1], "trend": 2.36, "latest": 28.1, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿：想假装平凡，结果是真不行", "fullTitle": "胎穿：想假装平凡，结果是真不行", "link": "https://fanqienovel.com/page/7627093619358305305", "data": [17.39, 18.44, 19.46], "trend": 2.08, "latest": 19.5, "wordNumber": 600103, "creationStatus": 0, "desc": "苏宁宁从暗卫第一，胎穿成现代的一个小宝宝时，她决定的第一件事就是当个普通人，坚决不争强好胜，当那领头拔尖之人。\n然而事情的发展似乎和她想得有些不一样！\n苏宁宁上幼儿园时，她拔光了小区的花送给老母亲，只为换一支冰淇淋，老母亲看着眼熟的花陷入沉默，没多久物业上门了。\n小学三年级时，苏宁宁放学路上看见一只肥鸽从头顶飞过，下意识抬手击落，她捡起鸽子来回翻看，却什么都没找到，直接扔了鸽子一头雾水地回家了，当晚一个凶巴巴的老头上门了。。。。。\n小学五年级时，苏宁宁看见一个陌生男人去了李阿姨家，不久她就听到了李阿姨痛苦的叫声，这次她学聪明了，没有自己去，叫了妈妈以及周围的邻居一起上，不久，李阿姨离婚了。。。。\n苏宁宁就这样在鸡飞狗跳的日子中长大了，完美地成为了一名人嫌狗厌的万年学渣。\n苏宁宁：。。。。。\n也没有人告诉过她当个普通人这么难啊！\n好在她找了个靠谱的男人，这男人品学兼优，考试万年第一，就是家庭环境复杂了点。", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "学霸", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [65.29, 66.17, 67.3], "trend": 2.01, "latest": 67.3, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春日烈阳", "fullTitle": "春日烈阳", "link": "https://fanqienovel.com/page/7163459032223583270", "data": [25.46, 26.46, 27.37], "trend": 1.92, "latest": 27.4, "wordNumber": 351264, "creationStatus": 0, "desc": "[体弱少女 X 烈日少年]\n（正文已完结）\n（原书名：春日烈阳）\n（青梅竹马+校园甜宠+日常）\n（人物设定均已成年）\n许渔刚来青禾中学的时候，有一个梦想，那就是在冬日纷飞的时候亲手接住一片雪花。\n她想，人生都这么苦了，总要来看一次大雪纷飞的样子。\n于是许渔努力的一边上学，一边治病。\n在来京市之前，自家亲爹说，在学校会有小时候的邻居哥哥帮忙照顾她。\n但是在许渔记忆里的邻居哥哥：喜欢揪她衣领子，还和别人打架。\n“邻家哥哥”顾盛：......\n第一次见到许渔的时候，顾盛站在校门口“亲切”为她指路。\n第二次见到许渔，顾盛提着保温杯里面装的是热牛奶。\n第三次，第四次......\n顾盛在许渔面前向来习惯了伪装，只有那一次。\n他在昏暗的路灯下表情狠厉的撺着一个人的衣领：“别让我看见你打扰她第二次，滚。”\n他终于有些抑制不住的爆发，脸上掉落的面具后才会原原本本的顾盛。\n那天的许渔忽然觉得，顾盛就像太阳。\n她想，如果在冬天摸不到雪花，那就拜托顾盛带着她去春天感受阳光也不错。\n世界对她来说无聊单调，但是顾盛能够带来温暖。\n立意：我们可遇不可求。", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "青梅竹马"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [65.26, 66.07, 66.84], "trend": 1.58, "latest": 66.8, "wordNumber": 373464, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答 球夫妇+对照组】\n大靖连旱两年，粮荒四起，战火燃遍辽东。\n末世后勤员苏禾穿成罪奴丫鬟，被发配给军户为妻。\n罪奴姐妹极力表现，力争抢个优秀男儿，而她只看安全感，一眼锁定全场最壮的百户萧征。\n他冷脸拒绝：“我不需要媳妇，赏我粮食就行！我养不起，也没功夫照顾。”\n她直白坦荡：“我不用你照顾。我能种地，能持家。你很强，跟你，我安全。”\n没媳妇前的萧征：女人真麻烦！\n有了媳妇后，萧征夜夜搂着苏禾：真得劲！媳妇，再来二十个馒头！\n自此，边关多了一对双强夫妇。\n他负责拿刀护她，横扫敌军；\n她负责种田产粮，兜底全家。\n极品邻居攀比？打脸！\n边关缺粮断炊？解决！\n敌军突袭包围？放野兽！\n萧征从穷军户一路封将，世人皆知：\n大将军最厉害的不是战功，是他那位能种出天下粮的媳妇。\n【饭桶将军×产粮小媳妇】\n你负责打仗护家・我负责种地养你", "tags": ["种田", "古代言情", "乡村", "穿越", "强强", "宠夫"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "农家团宠娇娇女", "fullTitle": "农家团宠娇娇女", "link": "https://fanqienovel.com/page/6849391701497220109", "data": [13.81, 15.41, 16.42], "trend": 2.61, "latest": 16.4, "wordNumber": 1459545, "creationStatus": 0, "desc": "糖宝没了爹娘，亲戚都不愿意养，说她克人。\n拥有七个孙子的杨老太为凑齐八（谐音“发”），把糖宝领回了家。\n人人都说杨家养糖宝这下要倒霉了，可杨家不仅没倒霉，还成了大周新贵！\n就是杨家人脾气不好，一有人说糖宝克人，杨老二就瞪眼：哪个不要命的说我闺女克人？\n杨老太最牛逼，抽出一根绳子跑到人家：说你自个克人，不说我就吊死在你家。\n杨家七个孙子围着糖宝：妹妹吃糖。\n糖宝：耶？我是来凑数的呀，怎么凑成了人人疼爱的小宝贝？", "tags": ["种田", "古代言情", "团宠", "古灵精怪", "甜宠", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒前妻再就业，汴京第一妙厨娘", "fullTitle": "恶毒前妻再就业，汴京第一妙厨娘", "link": "https://fanqienovel.com/page/7517953139266309144", "data": [17.18, 18.29, 19.26], "trend": 2.08, "latest": 19.3, "wordNumber": 584126, "creationStatus": 1, "desc": "【1v1双洁+穿书+美食+经营+日常向】\n一睁眼，叶昭昭穿成了权臣文男主的恶毒前妻。\n在书中，原主做梦都想当官夫人。\n她使尽浑身解数嫁给男主，却在男主官职被一撸到底后，不顾男主和孩子的挽留，和离回到了扬州老家，二嫁给了青梅竹马。\n只是不到一年。\n竹马就转手将原主送给上峰做礼。\n原主逃出来，辗转回到汴京，却发现新帝登基，男主一朝翻身、敕封摄政王，誉满汴京。\n原主这个前妻也变得人人喊打，最后被擅作主张的下人活生生饿死在了柴房里。\n穿书后的叶昭昭，当然不想重蹈覆辙。\n放着现成的幸福生活不要，非要回什么扬州投奔青梅竹马？\n她脑子又没进水，分得清好赖。\n小姑子难缠小叔子阴郁；\n不愁，她苦练高情商，应付两个半大孩子还不容易？\n男主颓废潦倒家里入不敷出；\n不怕，她有厨艺傍身，能眼睁睁看着丈夫孩子饿死？\n只是，她的汴京小食肆开业的那一日，怎么全汴京的权贵都来捧她的场了？\n说好的全家低谷三年、人人可欺呢？\n流水的银子哗啦啦地进账，这哪里用得着吃苦头呀！\n原本麻木沉郁的男主更是将叶昭昭视若珍宝，全家人的日子也越过越好。", "tags": ["种田", "古代言情", "美食", "穿书", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [29.22, 30.11, 31.1], "trend": 1.89, "latest": 31.1, "wordNumber": 917920, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [20.47, 21.48, 22.1], "trend": 1.63, "latest": 22.1, "wordNumber": 579822, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [19.51, 20.16, 20.76], "trend": 1.25, "latest": 20.8, "wordNumber": 4634273, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [15.67, 16.08, 16.86], "trend": 1.19, "latest": 16.9, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [24.66, 25.38, 25.73], "trend": 1.07, "latest": 25.7, "wordNumber": 938905, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流？疯批恶搬空库逃荒", "fullTitle": "流？疯批恶搬空库逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [17.97, 19.27, 19.01], "trend": 1.04, "latest": 19.0, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [20.74, 21.23, 21.73], "trend": 0.99, "latest": 21.7, "wordNumber": 897997, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越农断，空肉！", "fullTitle": "穿越农断，空肉！", "link": "https://fanqienovel.com/page/7615591201386810393", "data": [16.25, 16.24, 17.22], "trend": 0.97, "latest": 17.2, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全家提前两年囤货，逃荒吃香喝辣", "fullTitle": "全家提前两年囤货，逃荒吃香喝辣", "link": "https://fanqienovel.com/page/7546430467558345752", "data": [12.07, 12.58, 12.92], "trend": 0.84, "latest": 12.9, "wordNumber": 1421924, "creationStatus": 1, "desc": "【空间+赶山找山货+草药野果野菜真实配图+家长里短+逃荒+群像+囤货+虐渣+无CP]\t\n（又名：全家提前两年囤货，逃荒吃香喝辣）\n李杏儿做了一个奇怪的预知梦，她梦见自己十八代祖宗正在被屠杀。\n她必须穿越过去拯救自己的老祖宗。\n不然后世的她会因为蝴蝶反应消失，没想到老祖宗的魂在地府把人都求遍了，上天才给她十天同时又获得灵泉空间和千万存款。\n她迅速开启买买买囤货模式。\n十天过去，她买好物资穿定时越到古代池州杏花村。\n没想到穿早了，距离可怕的荒年还有两年。\n李杏儿发誓带着一空间物资要在古代过上好日。\n...\n谁都没想到。\n李杏儿穿越后变成大力女，一身武力值超高。\n她拳打野猪，脚踢恶霸，别人不敢去的禁山是她的粮仓，山珍野味随便捡。\n穿越后的春耕她利用现代化种子种出千斤粮食，搞出惊人的大丰收，带全家疯狂囤货。\n两年后。\n地震，火山爆发，蝗灾，瘟疫如期而至。杏花村全村人却没个怕的。\n因为地窖堆满粮食，杏儿带着村民们逃荒路上底气嘎嘎强!", "tags": ["种田", "古代言情", "空间", "逃荒", "群像", "无CP", "虐渣", "囤物资"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [17.64, 18.24, 18.36], "trend": 0.72, "latest": 18.4, "wordNumber": 1651709, "creationStatus": 1, "desc": "【古言架空+女强+斗极品婆家娘家+养崽+无穿越+无重生+先婚后爱】\n　　银杏五岁就伤了身子，失去了做母亲的资格，尽管她长得好看又能赚钱。\n　　但依旧没有哪个人家愿意娶她，因为娶了她就变成绝户了。\n　　唯独村里的老鳏夫赖大，不但愿意娶她，还愿意出双倍的聘礼。\n　　这让银杏贪财的娘果断点头。\n　　收了五两银子的聘礼，让他把闺女直接领走。\n　　但银杏死活不肯，她知晓已经死了两个媳妇的赖大没安好心思。\n　　可在这封建的年代，婚姻向来是由父母做主。\n　　尽管她极力反对，但也无法改变贪财娘的想法。\n　　就在她绝望之时，那个藏在她心里多年的男人出现了。\n　　萧青北：婶子，我想娶银杏，希望您能同意。\n　　王氏：你要娶银杏？人家赖大出了五两银子的聘礼，你能拿得出来吗？\n　 萧青北：我能的。\n　　 银杏：青北哥，你真的要娶我吗？\n　 萧青北：嗯，跟我走吧。\n        银杏：大宝二宝，快叫爹！\n 大宝二宝：（他们可是皇子，怎么可能随便叫爹呢！）\n     萧青北：你们想学功夫吗？（这两个小子还真是块练武的好苗子）\n   大宝二宝：师父！（叫师父是可以的）", "tags": ["种田", "古代言情", "乡村", "女强", "养崽", "古色古香"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "古代农家夫妻的红火小日子", "fullTitle": "古代农家夫妻的红火小日子", "link": "https://fanqienovel.com/page/7574739331256945726", "data": [13.75, 13.98, 14.2], "trend": 0.45, "latest": 14.2, "wordNumber": 4523883, "creationStatus": 1, "desc": "（又名：清水故事）\n【古代种田/架空地图（南北乱炖）/群像（每个人都是自己人生的主角）/无空间/无金手指/乡村生活/细水长流】\n\n\n真人有声书已上线~欢迎收听~\n\n一本闲来无事，消磨光阴的好书~\n\n作者拥有五百万字长文经验，量大管饱~可放心追更观看~\n\n这是一户农家最真实的日子，是清水村林家一生的故事。\n\n这里有田间的汗水，也有市集的吆喝，\n\n有屋檐下的温馨，也有暗流涌动的危机，\n\n有病榻前的守候，也有绝境中的奋起，\n\n有朴实无华的相守，也有悄然滋生的情愫，\n\n酸甜苦辣，有哭有笑，列位看官，且听我慢慢道来...\n\n", "tags": ["种田", "古代言情", "乡村", "团宠", "互宠", "古色古香"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽：兽凶猛", "fullTitle": "穿越兽：兽凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [12.89, 12.96, 12.95], "trend": 0.06, "latest": 13.0, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [46.96, 50.1, 53.01], "trend": 6.05, "latest": 53.0, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女扮男装，农家子的科举青云路", "fullTitle": "女扮男装，农家子的科举青云路", "link": "https://fanqienovel.com/page/7381807933354429464", "data": [18.59, 20.27, 21.9], "trend": 3.3, "latest": 21.9, "wordNumber": 1001078, "creationStatus": 0, "desc": "【女扮男装+科举权谋+位极人臣+单女主搞事业】\n谢清风一睁眼，拿的是“家徒四壁、女扮男装”的地狱剧本。\n在这个万般皆下品、惟有读书高的时代，她若不争，便是粉身碎骨。\n既然来了，那便要做到极致！\n她以女儿身，入庙堂，搅弄风云，定国安邦。\n科场上，她笔落惊风雨，夺魁首！朝堂上，她舌战群儒，推新政，平边疆，这盛世如她所愿。\n史书记载：谢公清风，三元及第，辅佐三帝，乃千古第一名臣。 \n“我谢清风这一生，不求荣华，只求在史书上，堂堂正正刻下我的名字。”\n【小剧场】 金銮殿上，群臣激愤：“谢清风行事乖张，乱我不尊祖制，当诛！”\n 那人身着绯红官袍，立于大殿中央，脊背如松，淡然一笑： “诸位大人读的是圣贤书，修的是一家之言；而本官修的是富国策，行的是万世法！何错之有？！”\n主成长向，非爽文", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "女扮男装", "无CP", "科举", "胎穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [40.91, 42.41, 43.85], "trend": 2.94, "latest": 43.8, "wordNumber": 507414, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "读心后，疯批暴君决定洗白", "fullTitle": "读心后，疯批暴君决定洗白", "link": "https://fanqienovel.com/page/735142578866041960 ": "沈世子，您真是做男做女都精彩啊", "link": "https://fanqienovel.com/page/7611934119068437528", "data": [16.71, 16.7, 16.89], "trend": 0.18, "latest": 16.9, "wordNumber": 612861, "creationStatus": 1, "desc": "【1vN男全洁+雄竞+掉马+抽象】【非权谋文】\n【温润端方小皇帝+阴鸷反差摄政王+孤高清冷左相+聪慧狐狸皇商】\n沈折枝穿书了。\n为继承侯府，她女扮男装，顶替战死沙场的亡兄成了世子爷。\n因知晓最后的赢家，她投靠了天子。\n可有一天，身边的重要角色们，竟莫名听到了原文中的内容…\n-\n摄政王瞪着沈折枝，耳边突然响起——\n【裴凛将沈折枝按在墙上，狠狠吻了上去：“为什么不能爱我？”】\n摄政王：？\n他竟有龙阳之好？对象还是他的政敌？\n\n-\n天子刚想让沈折枝出差——\n【“陛下，枝儿受不住了……”沈折枝眼尾泛红，死死抓着龙袍的衣襟。】\n天子：？\n什么？他竟玩弄自己的心腹权臣？\n-\n左相邀沈折枝对弈，下一秒——\n【江寄雪用指腹毫不怜惜地揉弄着沈折枝水润的双唇，在她耳边轻笑：“怎么不敢看我？”】\n左相：？\n他居然和天子死忠断袖？\n-\n皇商刚给她送来保护费，紧接着——\n【顾鹤洲将珍珠赠予沈折枝，她含入口中，眼波流转，顾鹤洲当场情难自持……】\n皇商：？\n他能稍微自持一点吗？\n-\n鸡飞狗跳下，几人终于发现沈折枝是女子。\n于是，大型修罗场开幕。\n沈折枝满头问号：“不是，你们连男子都喜欢？滚远点！”\n完全忘了，她穿的根本不是什么正经文。\n而她，是女主角。\n（后期男女身份随机切换）", "tags": ["古言脑洞", "古代言情", "穿越", "穿书", "女扮男装", "胎穿"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [26.96, 27.02, 27.12], "trend": 0.17, "latest": 27.1, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿书兽世：恶雌她终于吃上好的了", "fullTitle": "穿书兽世：恶雌她终于吃上好的了", "link": "https://fanqienovel.com/page/7627509785704811545", "data": [60.66, 62.22, 64.62 4, "latest": 21.5, "wordNumber": 444357, "creationStatus": 1, "desc": "【年代快穿】【无固定cp】\n苏茶发现自己穿进了一本看过的年代小说里，重过一世，她只想快快乐乐的享福，只以为自己是因救人被奖励再活一世的她并不知道，这是一场决定她命运的快穿实习……\n避雷：只写年代位面，无固定cp不是没cp，设定都有cp，大家自主避雷。\n洁党注意，有的世界设定男女主有过婚姻之类的。\n故事以女主为主，有的故事男主着墨不多。女主快穿新人，不是什么大佬，一点点成长，积累，变强。\n世界一：女主那极品继妹\n世界二：男主那救命恩人的遗孀\n世界三：以怨报德的极品村姑\n……", "tags": ["快穿", "幻想言情", "穿越", "穿书", "魂穿", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：女主心上人怎么喜欢我", "fullTitle": "快穿：女主心上人怎么喜欢我", "link": "https://fanqienovel.com/page/7570522964437781528", "data": [17.23, 17.3, 17.25], "trend": 0.02, "latest": 17.3, "wordNumber": 875368, "creationStatus": 1, "desc": "【快穿•掠夺•1vn•绿茶•微万人迷】\r\n网上一个热贴—和帅哥谈到底什么感觉？\r\n评论区里，一堆女生兴致勃勃地分享。\r\n到了谈恋爱的年纪，可周围都是歪瓜裂枣。于是评论区里最帅的那个，就这样被盯上了。\n-\n女主纯坏，觊觎帅哥，但不走心。\n-\n玉璇舒舒服服过完一辈子后，才被告知自己所处的是一个小说世界，偶然间拆散了男女主的CP。\n“你就是我们‘剧情破坏部’最需要的人才啊！”系统两眼放光，找上了门，两人一拍即合。\n-\n【世界1】别总在网上晒男主，会被绿茶撬走。\r\n【世界2】汉子茶毫无边界感，嘴上说着男主是朋友兄弟，结果呢？\r\n【世界3】男大爱上姐姐，为爱当后爹。可你的高中女同学不要了吗？\n【世界4】变成狐狸精后，要抢走妹妹喜欢的人。\r\n【世界5】顶流的小助理有嫂子瘾，总在社交媒体上晒。被骂了？反手把顶流下跪照po上去，“再骂一句试试呢？一句跪一小时。”\r\n【世界六】从坏女人手里夺回最宠自己的哥哥。\n【世界七】皇帝vs女鬼\n【世界八】乙游委托vs玩家vs乙游男主本人\n【世界九】男大vs宿管阿姨\n【世界十】女儿同学vs死了老公的寡妇\n【世界十一】渣男vs小青梅\n【世界十二】小厨男vs陪X女", "tags": ["快穿", "现代言情", "校园", "总裁", "幻想言情", "豪门世家"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "闪婚刑警老公，陆队人前请装不熟", "fullTitle": "闪婚刑警老公，陆队人前请装不熟", "link": "https://fanqienovel.com/page/7638577943551167550", "data": [11.57, 12.92, 15.44], "trend": 3.87, "latest": 15.4, "wordNumber": 430786, "creationStatus": 0, "desc": "「刑警硬汉队长x娇软画像师」\n「先婚后爱+细水长流+破案日常+甜宠+双洁+1v1」\n相亲那天，温清梨遇到了自己学生时代的暗恋对象，陆峥。\n仅用两句话，两人就敲定了闪婚事宜。\n“不对外公开。”\n“相敬如宾，互不干涉。”\n他是冷硬糙帅的刑警队长，她是警局特聘的画像师。\n白天，他们联手侦破郊外抛尸案、明星被杀案、雨夜失踪案……\n夜晚，她守着婚前约定：床上熟透，床下不熟。\n她藏起自己暗恋的小心思，努力和他保持着相敬如宾的状态。\n直到发生了一件事，她主动留下一封离婚协议，提着行李箱连夜跑路。\n-\n所有人都以为陆峥天生冷酷，不会爱任何人。\n直到温清梨提出离婚跑路后，他差点疯掉。\n没有她画的画像，凶手样貌不像，没有她深夜的晚安吻，长夜漫漫。\n他费尽千辛万苦找到她，掐着她细腰，将她逼至墙角：\n“为什么提离婚？”\n“回来，别跑，以后我的命都给你。”\n温清梨：“！！！”\n说好的不需要爱情呢？", "tags": ["职场婚恋", "现代言情", "甜宠", "先婚后爱", "暗恋", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "远嫁八年，回娘家难如登天！", "fullTitle": "远嫁八年，回娘家难如登天！", "link": "https://fanqienovel.com/page/7567928097673055256", "data": [41.8, 43.79, 43.99], "trend": 2.2, "latest": 44.0, "wordNumber": 1212319, "creationStatus": 1, "desc": "（远嫁+恶婆婆+过年不让回娘家）\n林婉怡为爱远嫁八年，一次没有回过娘家，临近过年父亲病重弟弟结婚，她提出让丈夫和女儿一起回娘家过年，却被婆家人轮番刁难。\n婆婆说：“你嫁到王家就是王家人，别一天到晚惦记娘家，给他们一百块钱，我看他们还想不想你。”\n大姑姐说：“你走了谁照顾我爸妈？谁给他们做饭洗衣服？”\n就连丈夫也唯唯诺诺：“老婆，我姐说的对，大过年的你不在村里人会笑话我们的，实在不行你打个视频跟爸妈见一面吧。”\n林婉怡愤怒不已想要带着女儿自己回去，婆婆却又藏起女儿：\n“想走自己一个人滚，不准带走我王家的子孙！”\n后来，林婉怡离了婚，带走了女儿，还把王家搅了个天翻地覆。\n王家人，终于后悔了……", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新娘换人后，周队长夜里亲得好凶", "fullTitle": "新娘换人后，周队长夜里亲得好凶", "link": "https://fanqienovel.com/page/7629168035038759960", "data": [9.82, 10.56, 11.32], "trend": 1.5, "latest": 11.3, "wordNumber": 514905, "creationStatus": 0, "desc": "开篇新婚夜，进度超快，年上荷尔蒙爆棚糙汉刑警队长和香香软软娇妻\n男主老房子着火，占有欲强，爱亲亲抱抱，甜欲宠~\n女主馋男主，主动超会撩\n-\n陆甯出差回来发现她竟是假千金，不但父母换了，就连结婚对象也被换了。\n真千金夏雨薇已经跟陆家的联姻对象领了结婚证，断了她的念想。\n她本想让亲生父母退掉婚约，但见到夏家的婚配对象后，立马改了主意。\n那男人是警察，身高188，肩宽腰窄，一身腱子肉荷尔蒙爆棚，正是陆甯喜欢的类型。\n-\n领证前，男人对陆甯说，他的要求只有一个，必须过夫妻生活。\n陆甯暗自窃喜，爽快地答：过，必须过，不然结婚做什么！\n然而，连着几天下不来床的陆甯后悔了。\n她提出抗议：这夫妻生活还是不过了吧……\n男人却道：抗议无效。\n-\n夏雨薇眼里的周烈就是个暴戾冷硬的糙汉子，家里还有瘫痪的父亲要照顾。\n她庆幸自己在结婚前被认回陆家，可以嫁入豪门当少奶奶。\n至于周家的火坑就让陆甯去跳好了，她就等着看笑话。\n-\n可后来夏雨薇却听说那个暴戾无情的糙汉队长是个老婆奴，把陆甯捧在心尖宠。\n再后来首富江家举办认亲宴，周父认祖归宗，陆甯摇身变成豪门儿媳。\n陆家却破产了，夏雨薇传来离婚的消息……\n-\n先婚后爱+糙汉宠妻+真假千金对照组+家长里短群像日常流", "tags": ["职场婚恋", "现代言情", "甜宠", "先婚后爱", "群像", "真假千金"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "弟媳太奇葩？我用拳头教她做人！", "fullTitle": "弟媳太奇葩？我用拳头教她做人！", "link": "https://fanqienovel.com/page/7481122214759107608", "data": [8.07, 9.1, ps://fanqienovel.com/page/7650408680646511678", "data": [4.32, 4.51, 4.71], "trend": 0.39, "latest": 4.7, "wordNumber": 491590, "creationStatus": 1, "desc": "【鬼吹灯】+【病娇】+【献王纯暴君，不会洗白】刚出分，评分会涨得，更新稳定，入股不亏哦\n一朝穿越，我没拿到逆袭剧本，反而直接落在了滇国献王的王宫里！\n四周是嗷嗷痛哭的女子，眼前是手握青铜剑、眼神阴鸷的疯批暴君。\n没有系统！没有异能！手无缚鸡之力的我，\n为了活命，硬是凭着“怂到极致便是勇”的演技，在残暴暴君的刀尖上蹦迪。\n他残暴、偏执、疯魔，为了成仙不择手段，活人痋术令人闻风丧胆。\n我没有去改变他的圣母心，也没有可以与他抗衡的超能力。\n我只是个想活下去的普通人。\n每一次他眼神扫过，都是一场生死博弈；每一次他抚摸我的脖颈，都伴随着窒息的战栗。\n我靠着极致的顺从、天衣无缝的伪装，在他尸骨累累的王座旁，生生苟出了一条王妃之路。\n他视人命如草芥，手段狠辣，我便做他身边最听话的哑巴新娘。\n我被迫近距离围观遮龙山神宫的血腥建造，亲眼看着无数人沦为痋引，只能瑟瑟发抖地往他怀里钻。\n多年后，当摸金校尉历经千险终于打开献王墓，看着那尊玉棺时……\n我揉着眼睛在玉棺里坐了起来，弱弱地问了一句：“那个……胡司令，来了吗？我憋了两千年了……”", "tags": ["女频悬疑", "悬疑", "灵异", "衍生", "悬疑恋爱"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漫画预言杀人事件", "fullTitle": "漫画预言杀人事件", "link": "https://fanqienovel.com/page/7477901455727283225", "data": [5.05, 5.21, 5.37], "trend": 0.32, "latest": 5.4, "wordNumber": 393660, "creationStatus": 0, "desc": "【漫画师 X 复仇者】陈荷三年前坑掉的一部扑街漫画突然爆火，原因是预言了一宗凶案。\n　　网友们在漫画评论区瑟瑟发抖：\n　　[你们看新闻了吗，这一幕怎么跟电视上播的一样啊！]\n　　[我没有看错吧，尸体是刚刚发现的，漫画是三年前发布的！]\n　　[画手是怎么想出这种埋尸地的，有这么巧吗？]\n　　[我有一个大胆的猜测……]\n　　[作者不会就是凶手吧！]\n　　[作者你说句话啊！人不会是你杀的吧！]\n　　……\n　　面对警方的质疑，陈荷微笑答复：\n　　“这只是巧合。我们画漫画的想象力很丰富的。”\n现实悬疑，本格推理，无奇幻元素。群像，主角填俩是因为只能填俩。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "群像", "悬疑恋爱"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "蛇仙", "fullTitle": "蛇仙", "link": "https://fanqienovel.com/page/6990261702142987295", "data": [5.23, 5.48, 5.54], "trend": 0.31, "latest": 5.5, "wordNumber": 1996224, "creationStatus": 0, "desc": "《漫剧七日蛇缠已上线》我叫安心，‘青龙娶亲’那天，我曾祖父杀死了一青一白两条蛇，村民说，那是长角化蛟要飞升做蛇仙的。\n　　我出生那晚，我爷爷跪在蛇庙一宿，我妈才把我生下来，他却死在蛇庙。\n　　我打小，梦中就会出现一条蛇，他说，我是他的新娘。\n　　突然有一天，我的堂哥堂姐突然出事，我们回到村子，玉佩丢了，他却出现了……", "tags": ["女频悬疑", "悬疑", "乡村", "灵异", "第一人称", "悬疑恋爱"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"labe
