<style>

  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }

  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

的故事，这章篇幅比较短，作为过渡。然后是九门三代。\n杨花落刚穿越到山东瓜子庙鲁王宫就见了五鬼朝拜的诡异场面。\n吴斜见这个人悄无声息摸到他们五人背后，寒意爬上脊背。\n吴斜：“你是人是鬼？”吴三醒：“人影子立那儿了，你眉毛下挂俩蛋，只扇风不会看是吧？”\n吴斜委屈巴巴：“心急则乱，再说，人难道就不可怕了吗？”\n吴三醒哑口无言，心想还真是这个理儿。\n杨花落：这人一来就拿手电筒晃我，挑衅我是吧？\n———\n杨花落瞟了一眼任务介绍，寻找海南西沙沙头礁下的‘小北鼻’。\n杨花落：？\n杨花落不解，小北鼻？小baby？小宝贝？\n宝贝？宝物？孩子？\n什么乱七八糟的。", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "同人"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.53, 3.57, 3.67, 3.72, 3.76, 3.82, 3.85], "trend": 0.33, "latest": 3.9, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：强制诚实的我憋不住了", "fullTitle": "盗墓：强制诚实的我憋不住了", "link": "https://fanqienovel.com/page/7563612379108346905", "data": [4.66, 4.57, 4.77, 4.87, 4.94, 4.99, 4.98], "trend": 0.32, "latest": 5.0, "wordNumber": 261040, "creationStatus": 1, "desc": "（评分刚出，会涨哒）\n一个普通人穿越到盗笔世界，成了吴家小少爷。\n吴言，开局抽奖抽到了‘强制诚实’，这是奖励？\n再次抽奖，抽到了‘不会坏的计算器’。\n为了活下去，吴言只能尽量少说话，用‘计算器’代替自己发言！\n（有CP，有系统，团宠，搞笑甜味，不虐。主角性格是被特意培养的，单纯、幼稚，但三观极正。介意者，勿看！！！！！！！）\n看着不停说话欺负自己的黑瞎子，吴言不语，拿出计算器，不停按下减号键，计算器不停响起 “ jian jian jian jian jian jian ........”\n看着出言不逊的伙计，吴言用计算器按下几个键，计算器响起“平方根62500  等于......”\n遇到嘲讽吴家的藿仙姑，吴言不语，拿出计算器，按下六个数字‘4’ ‘3’ ‘8’， ‘4’ ‘7’ ‘8’！\n不想回答别人问题，按下计算器的“X的y次方”键，计算器会响起‘mi’！\n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#f1c40f", "backgroundColor": "# ata": [3.63, 4.36, 5.7, 6.21, 6.5, 6.82, 7.17], "trend": 3.54, "latest": 7.2, "wordNumber": 145104, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [14.31, 15.54, 16.81, 17.29, 17.69, 17.33, 16.76], "trend": 2.45, "latest": 16.8, "wordNumber": 225008, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [8.03, 8.41, 9.36, 9.82, 9.49, 9.72, 9.77], "trend": 1.73, "latest": 9.8, "wordNumber": 154352, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [5.83, 6.08, 6.61, 6.52, 6.63, 6.67, 6.65], "trend": 0.82, "latest": 6.7, "wordNumber": 158894, "creationStatus": 1, "desc": "【亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城+OOC预警】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.5, 3.33, 3.26, 3.34, 3.41, 3.48, 3.53], "trend": 0.03, "latest": 3.5, "wordNumber": 251065, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自己，却生得心脉残缺，体弱易碎，连哭都没力气，一副早夭相。\n他的孩子必须活得好好的，天要他亡，沈寂就把这天逆了。", "tags": ["玄幻言情", "幻想言情", "穿越", "穿书", "养崽", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.24, 7.14, 7.19, 7.37, 7.45, 7.3, 7.25], "trend": 0.01, "latest": 7.2, "wordNumber": 219335, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\ 二学生林舟，在出车祸后被迫绑定了系统，穿进了一本民国架空背景的小说。\n系统告诉他想要复活需要十万熵值，在林舟兢兢业业努力两个月却只凑够了三点熵值后，他顿悟了。\n做人，不能太踏实，还是要学会投机取巧。\n在确认更改原著剧情能获得大量熵值后，林舟果断选择把自己塞进剧情。\n只他一个改变的剧情当然不够，可如果还有一个隐居避世的大家族呢？\n再没有什么能比一个横空出世的家族改变剧情更方便了。\n多方势力都在争夺的信物？主角遍寻不得的仇家？行事莫测的高手？\n一切的一切，都在这个只显露冰山一角的大家族掌握之中。\n-\n林舟，一个领了家族任务被派出来的子弟，其行事从来都以家中任务为首要目标，道上骂他的人不知几何。\n有人想拉拢他，也有人骂他是家族的走狗，可无论道上的人怎么说，他们都清楚一个事，那就是这位年纪并不大的后生，是个狠角色。\n横空出世仅仅两年，哪怕身后的家族供给他源源不断的资源，能将手下创立的据点做到这个地步都说明了他的能力。\n（无脑爽，无暧昧向，重要的事情说三遍：无cp，无cp）", "tags": ["民国言情", "现代言情", "系统", "穿越", "民国", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "空间：民国逃荒，先搬空黑心亲戚", "fullTitle": "空间：民国逃荒，先搬空黑心亲戚", "link": "https://fanqienovel.com/page/7662015515384089625", "data": [0.26, 0.26, 0.32, 0.35, 0.35, 0.35, 0.3], "trend": 0.04, "latest": 0.3, "wordNumber": 179762, "creationStatus": 1, "desc": "【民国+逃荒+空间种田+囤物资+手撕极品+不圣母】\n战火蔓延，沦陷在即，苏晚禾带着能储物保鲜、催熟作物的灵田空间穿到了民国。\n本以为最难的是天灾人祸，没想到最毒的是人心。\n重男轻女的祖母扣下她的退热药给堂弟，说好带全家渡河的亲三舅，不仅私吞了救命的保工银，卷走了全家仅剩的被褥粮盐，甚至还想用亲爹的命去换他自己的船位！\n苏晚禾冷笑一声：真当老实人好欺负？\n既然你不仁，就别怪我不义。夜探货栈，她用空间把自家被骗走的物资原封不动全部搬空，顺手还拿回了本该属于自家的救命钱。\n外头兵荒马乱、物价飞涨，别人吃糠咽菜，苏晚禾在空间里种地囤粮，带着一家老小吃香喝辣，一路反杀极品，逃荒路上风生水起！", "tags": ["民国言情", "现代言情", "穿越", "打脸", "民国", "幻想言情", "空间"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [5.36, 5.66, 7.26, 7.86, 8.63, 9.32, 9.09], "trend": 3.73, "latest": 9.1, "wordNumber": 231976, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.17, 3.31, 3.68, 3.86, 4.1, 4.37, 4.56], "trend": 1.38, "latest": 4.6, "wordNumber": 270715, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [2.61, 2.41, 2.09, 2.08, 2.41, 3.01, 3.51], "trend": 0.9, "latest": 3.5, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿古代，又遇逃荒，怎么活", "fullTitle": "身穿古代，又遇逃荒，怎么活", "link": "https://fanqienovel.com/page/7655897155650980888", "data": [2.62, 2.69, 2.97, 2.96, 2.88, 2.81, 2.72], "trend": 0.1, "latest": 2.7, "wordNumber": 183748, "creationStatus": 1, "desc": "刚进入一家公司实习没几天的林荞，在帮一个离职同事送东西去楼下时，却在电梯内一脚踏空，连同装物品的纸箱子，一起穿越到了古代。\n别人穿越，都是魂穿，林荞却是整个身体都跟着穿越了。而穿越大神送给她的金手指，就是那个装有同事私人物品的纸箱子，变成了她的空间。\n就在林荞一边庆幸自己有个小的可怜的空间，一边忧愁自己在古代是个黑户时，让她更崩溃的是，她所在的地方，竟然大旱了半年，到处都是逃荒的流民。\n而她没钱没水没粮。\n苍天啊！大地啊！这叫她一个人生地不熟的现代人，在这里怎么活？\n逃荒种田文，女主无CP，不会和朝堂，贵族，大将军什么的扯上关系，就是一个普通的现代女孩在古代小心翼翼求生存，最终平安终老的日常文。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "逃荒"], "borderColor": "#f39c12", "back ps://fanqienovel.com/page/7648837283092630590", "data": [6.76, 6.89, 7.24, 7.45, 7.4, 7.24, 7.28], "trend": 0.52, "latest": 7.3, "wordNumber": 291393, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [6.27, 6.57, 7.18, 7.16, 7.02, 7.0, 6.77], "trend": 0.5, "latest": 6.8, "wordNumber": 201391, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "骗婚捞女？科研大佬独宠丰腴美人", "fullTitle": "骗婚捞女？科研大佬独宠丰腴美人", "link": "https://fanqienovel.com/page/7649237755582483518", "data": [7.57, 7.91, 8.08, 8.16, 8.2, 8.21, 7.98], "trend": 0.41, "latest": 8.0, "wordNumber": 253200, "creationStatus": 1, "desc": "【娇媚丰腴大美人VS外冷内野重欲大佬】\n【架空+八零+上位者为爱低头+独宠+先婚后爱+日久生情】\n柳娇媚穿进八零年代，成了书中那个又娇又媚的丰腴美人。\n好消息：老公穆寒舟是顶级科研大佬，工资津贴月月全额上交。\n坏消息：原主是捞女，老公是骗来的。\n按原书剧情，大佬半年后回家，发现原主是照骗，当场提出离婚。\n原主爱慕虚荣，对穆寒舟下药，企图生米煮成熟饭留在京市。\n穆寒舟自己忍着，给原主灌了十倍的药，丢进黑矿里，原主被摧残致死……\n柳娇媚瑟瑟发抖：惹不起惹不起，趁大佬还没回来，赶紧跑路！\n可原主太能挥霍了，兜里就剩二块五，估计跑出家门就饿死了。\n柳娇媚给自己定制剧本：装乖撒娇拉满情绪价值，搞一笔钱，再挑刺冷战断崖式分手。\n冷峻矜贵的科研大佬，开始电话里喊她宝宝，一张张万元汇款单砸过来，砸得柳娇媚说不出分手。\n穆寒舟一颗心，被家里的小妻子撩得辗转反侧，科研上攻坚克难，短短二个月就解决了预计半年才 tatus": 1, "desc": "（评分刚出）\n颜控利己娇软美人×七位血族少爷继承人（七宗罪）\n血族学院｜雄竞修罗场｜穿书｜系统任务｜万人迷｜多男主！｜娇软不是真的娇妻丨含有副本游戏丨男主们是处|非人有超能力的都市\n提醒：女主利己惜命，擅长示弱与算计，不走舍己救人的路线。\n血族男主均有危险倾向，感情线包含争夺、占有与博弈。\n—\n边玖月穿进一本血族贵族学院文，成了替长姐入学的炮灰。\n在这里，血族掌握财富、土地与能源，人类学生戴着徽章分出等级。\n豪门子女拿血换取家族庇护\n按照书中剧情，边玖月会被榨干利用价值，死在夜曜学院的地下室。\n而原书女主林初雪却会高举人族尊严的大旗，掌掴血族少爷，引来七位继承人争相折腰。\n—\n她的命运不该像书里的剧情一样如此安排\n她不甘做别人走上巅峰的踏脚石\n她知道自己自私、贪财、惜命，还重度颜控，就算穿书又不是换人，也没替她长出舍己为人的胆子。\n让她为了人族尊严冲上去送命，她做不到。\n好在她绑定了甜美系统。\n只要完成任务就可以获得一定的道具和甜蜜值，甜蜜值存够了就可以带着一千万重生回家\n娇弱又坚韧，善良又利己的她，如何在这个地方生存下去直到完成任务回家\n当她落入纯血种口中，这场狩猎的掌控者会是谁…", "tags": ["现言脑洞", "现代言情", "校园", "系统", "幻想言情", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高武：把敌人掰弯就变强", "fullTitle": "高武：把敌人掰弯就变强", "link": "https://fanqienovel.com/page/7663031017103428632", "data": [11.3, 12.29, 13.39], "trend": 2.09, "latest": 13.4, "wordNumber": 230160, "creationStatus": 1, "desc": "【高武】【脑洞】【搞笑】【抽象】\n萧淼穿越到高武世界，意外得到了系统。\n上门催债？我把你掰弯！\n班主任强制消费？我把你也掰弯！\n参加全国比赛，我把竞争对手都掰弯！\n面对虫族入侵，对不起，我把它们通通掰弯！\n别说虫族了，就是三体人来了我也能把他们掰弯！\n萧淼成为人族大帝后，站在宇宙中央，对着全宇宙呼唤：“愿天下男人都被掰弯，阿门！”", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "搞笑轻松"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绑定接吻系统，咋都嘬上瘾了", "fullTitle": "绑定接吻系统，咋都嘬上瘾了", "link": "https://fanqienovel.com/page/7659021946213911614", "data": [11.01, 12.04, 12.6], "trend": 1.59, "latest": 12.6, "wordNumber": 156338, "creationStatus": 1, "desc": "刚开分）万人迷，女主给他们香迷糊了/烧男人/雄竞修罗场/男全洁/全员真香沦陷\n（这玩应简介咋写啊，我求你们看bushi）\n社畜林幺绑定了亲亲变美系统。\n她必须按照系统要求，想办法和优质目标人物接吻，以此来对系统进行充电。\n任务奖励极其丰厚：天籁之音、魔鬼身材、最强柔韧度。\n“等等，我万一挨揍咋办？”\n【宿主放心，我是专业的，一旦他们摄入你的信息素，就会上瘾似的渴望更多，只要你勾勾手，他们连命都给你。】\n“我不行啊！”\n【宿主有拒绝的权利，但我与您命脉相连，我休眠的那一刻，您也一起】\n“……”\n林幺欲哭无泪，为了活命，她不得不狗狗祟祟地去接近目标。\n目标A：集团董事，雷厉风行，看她的目光都是冷的。\n没办法，林幺咬牙硬上，亲完就跑。\n结果这一亲，男人连续一周没睡好觉，一闭眼就是想她、想她、想她。\n邪门了。\n不行，他得把她追回来。\n但林幺很忙啊。\n目标B：金牌律师，斯文败类，玉面狐狸。\n目标C：天才法医，清冷疯批，情感漠视。\n目标D：顶级清道夫，阴鸷少年，只哄不停。\n目标E：邻家哥哥，毒舌抽象，嘴硬心软。\n目标F：教廷神子，绿茶黑莲花，天天色诱。\n还有GHIJ……\n目标太多，林幺不得不骗完这个骗那个，结果大家聚一块了。\n非大女主，纯男色文", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "天才", "律师"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被逼回乡，老祖宗回来撑腰了！", "fullTitle": "被逼回乡，老祖宗回来撑腰了！", "link": "https://fanqienovel.com/page/7647458669554060312", "data": [17.44, 17.78, 18.3], "trend": 0.86, "latest": 18.3, "wordNumber": 168479, "creationStatus": 1, "desc": "【无CP，请放心食用】\n唐娇在娱乐圈打拼了六年，养着青梅竹马的恋人上大学，谁知道男朋友被富家小姐看上了。\n男朋友劈腿攀上高枝。\n富家小三姐打压她。\n一夜之间，全网黑。\n走投无路之下，她被逼着回到乡下。\n回家之后就没绷住，直接去祖坟哭。\n没想到一下就把家里的老祖宗给哭回来了！\n泼天的富贵，立马就来了。\n她不装了！\n直接回家继承家业了！\n苏黎以为自己死了，没想到意外穿越到了修仙界。\n她一心苦修，好不容易要飞升了。\n却被另界的后辈给哭回去了。\n“老祖宗，他们全都欺负我！”\n回家一看，太惨了。\n一大家子，就只剩下了这么一个独苗苗。\n还有一个从小就被人偷走了。\n这个家，没她得散啊！\n顾城从小就是独生子，父母对他虽然不亲近，可也很不错。\n谁知，他居然是个假少爷。\n真千金回归，他立马成了家里的透明。\n养父母想让他和真千金结婚，谁知道真千金看不上他。\n转头就把他赶出了家门，还处处打压他。\n背负巨额负债的他，突然得知自己是被偷的？\n家里还有一个老祖宗和一个亲妹妹？\n好日子也算是被他过上了。", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "空间", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成猫后，带反派全家薅秃气运女", "fullTitle": "穿成猫后，带反派全家薅秃气运女", "link": "https://fanqienovel.com/page/7662732724855114776", "data": [5.3, 5.9, 6.13], "trend": 0.83, "latest": 6.1, "wordNumber": 169802, "creationStatus": 1, "desc": "新书评分刚开\n【傻白甜沙雕小猫+全家反派路人甲+团宠+动物心声+毛绒绒】\n姜澄穿成一只炮灰橘猫，被气运女主虐杀三次吸气运后，她悟了！\n再不当血包了，只求找个毫无存在感的路人甲苟活一世！\n月黑风高夜，她碰瓷了一个社畜大叔。\n【叔，养猫吗？我干得多吃得少！】\n刚处理完“业务”的杀手之王姜铮，听见小猫心声，沉默了。\n为不吓跑这只傻白甜，杀手全家被迫开启“遵纪守法好市民”剧本。\n于是，在姜澄眼中：\n老爸是平庸社畜，偶尔处理一些“肉类碎块”。\n老妈是温柔主妇，虽然宠物是毒蛇和蜥蜴。\n哥哥是病弱理科生，只是兜里常揣微型炸弹。\n妹妹是单纯高中生，偶尔发出反派狞笑。\n姜澄握紧了猫爪：\n【我的家人都是普通人，必须保护好他们！】\n当晚，猫猫率领毒蛇老鼠，熟练炸了总电闸，把气运女主价值一亿的新手礼包连锅端回家。\n正开会分赃的四个顶级反派，听着脑内的剧透，嘴角疯狂上扬。\n——懂了，以后亲子活动就是跟猫打劫。\n气运女主要再次虐杀小橘猫，所有人都觉得猫死定了。\n却见她那社畜老爹慢条斯理地走上前，身后，无数黑洞洞的枪口从阴影中探出。\n他朝她招了招手，语气是极致的温柔与冷酷：\n“澄澄，过来，别溅你一身血。”\n姜澄猫瞳地震。\n爸爸，你不是遵纪守法的平庸路人甲吗？！", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "团宠", "反派"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒女二被男主错认成女主后", "fullTitle": "恶毒女二被男主错认成女主后", "link": "https://fanqienovel.com/page/7624784956866186264", "data": [5.66, 6.24, 6.49], "trend": 0.83, "latest": 6.5, "wordNumber": 228024, "creationStatus": 0, "desc": "【现言甜宠/日常向/双洁/男主逗比脑补帝/女主吐槽大师】\n十八岁那年，虞晚发现自己是一本小说里的恶毒女二。\n她虚荣、拜金、挥金如土，最后被继兄男二指着鼻子骂吸血鬼、寄生虫。\n——最后，她被赶出豪门，惨死街头。\n……不行！恶毒女二也要自力更生！\n于是虞晚拒绝了豪门的每一分钱，开始打工。\n直到有一天，她正在咖啡店洗杯子，突然听见了男主的心声：\n【系统，你确定是她？】\n【宿主，根据原著简介描述，‘A大最美最穷的女生’就是本书女主。虞晚又穷又美！她一定是女主！】\n【你确定，她就是我命中注定的另一半？】\n【宿主，我十分确定！你，李熠，是这本小说的男主。她，虞晚，是这本小说的女主。】\n【你们就是天造地设的一对！】\n虞晚：……？\n天呐！男主把她一个恶毒女二错认成女主了！\n——\n当李熠又一次疑惑女主的好感度加的这么慢后，系统提出了疑问：\n【宿主，有没有可能，我们找错人了？】\n【想什么呢！】李熠冷哼：【要是女主这么好攻略，凭什么当女主？】\n他转头，看向虞晚的目光炯炯有神：\n【不愧是我命中注定的女人，就是与众不同！】", "tags": ["现言脑洞", "现代言情", "系统", "甜宠", "豪门世家", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [10.48, 10.86, 11.16], "trend": 0.69, "latest": 11.2, "wordNumber": 274518, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身为漫画路人的我也要拯救世界吗", "fullTitle": "身为漫画路人的我也要拯救世界吗", "link": "https://fanqienovel.com/page/7657916022938143768", "data": [5.3, 5.56, 5.74], "trend": 0.44, "latest": 5.7, "wordNumber": 152931, "creationStatus": 1, "desc": "——评分刚开，可能有点低\n【真的是无CP】【女频文】(作品标签不是我加的）【群像】【还有弹幕各种乱磕，但真的是无cp】【雷者勿入】【友情向!!少年之间互相关心】\n间启是一个普通人。\n非常非常非常普通的人。\n呃，倒也不是完全那么普通，毕竟普通人没有他那么奇怪的运气。\n不过他普通人的生涯算是正式结束在那一天了，一个奇怪的系统告诉他，他只是一个漫画里的人物——还是个脸都没漏的路人。\n——啊，简直太荒谬了。\n间启一边吐槽，一边以一种奇怪的方式进入了青尚异能学院，并以一种奇怪的方式上了漫画。\n很好，从此节操是路人。\n过去的普通人间启已经死了，现在出场的是钮钴禄氏.「运气守恒」间启。\n——开个玩笑。\n“所以，不要沮丧，不要绝望，我会让这次失败，成为下一次胜利的开幕式。”\n“听着，信我。”\n“这次绝不是玩笑。”\n*\n《异元纪年》是草草草草老师最新的作品，这个漫画以丰富且塑造深刻的人物出名。在三人小队成功进入异能学院后，一个又一个人物成功吸引了更多人的注意。\n[四草老贼，我警告你，所有人都必须好好的。不然刀片预警]\n[小启————没有你我该怎么活啊——（尖叫）（扭曲）（阴暗的爬行", "tags": ["现言脑洞", "现代言情", "无CP", "群像", "系统", "校园", "搞笑轻松"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我的异能怎么是恋爱脑啊！", "fullTitle": "我的异能怎么是恋爱脑啊！", "link": "https://fanqienovel.com/page/7655037932947917849", "data": [5.27, 5.51, 5.63], "trend": 0.36, "latest": 5.6, "wordNumber": 205126, "creationStatus": 1, "desc": "【升级流+结局无cp+crush一局一换】\n十八线糊糊演员夏衔月，出道五年，演过无数镶边配角，每每因美貌出圈，又因嘴贱变回糊咖。\n又一次拒绝了潜规则，估摸着是要被雪藏的那天，她意外进入了一场求生游戏。\n夏衔月：我怀疑是哪个得不到我的人想毁了我。\n诡异的封闭村庄，人人遵守着古怪的条约，进行一场真人狼人杀。\n玩家与npc，神、狼与村民。\n手握村民卡，一问三不知甚至没玩过狼人杀的夏衔月，只有一个和她一样嘴贱的系统，以及一个名为“潘多拉”的异能。\n系统：所谓潘多拉，就是可以选定一个对象，然后……\n夏衔月：让他疯狂地爱上我？\n系统：不，让你疯狂地爱上他。\n夏衔月：？你有病吧这异能？我缺的是这个恋爱脑吗？\n#女人三分醉演到你流泪#只是女人难免一往二往三往……情深#你是我见一个爱一个里最爱的那一个\n——————————\n潘多拉，神明用黏土制作的第一个女人，所有神灵都会赠与她一件礼物。\n赤诚者赠她勇气，上位者赠她权柄，强大者赠她力量。\n她深爱着你，而你会为她献上一切。", "tags": ["现言脑洞", "现代言情", "无CP", "系统", "明星", "双向奔赴", "无限流"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "离婚前，大佬的恶毒老婆觉醒了", "fullTitle": "离婚前，大佬的恶毒老婆觉醒了", "link": "https://fanqienovel.com/page/7649608344931421208", "data": [7.76, 7.98, 8.08], "trend": 0.33, "latest": 8.1, "wordNumber": 189013, "creationStatus": 1, "desc": "［先婚后爱+上位者低头+小甜文+双洁］\n安佳宁即将签字离婚时，突然眼前飘过好几行字。\n【这女配真是作死，好好的白富美不当非要当渣男的舔狗，活该家破人亡，死无全尸！】\n【签吧，女配你就签吧！一旦离了婚，你的好日子也就到头了！】\n【其实女配也是可怜，她一直以为当年的救命恩人就是裴崇文那个渣男，所以才会这么听渣男的话。】\n安佳宁：？？？\n十年前救她的人不是裴崇文？哪是谁？\n而且什么叫离了婚，她就会家破人亡？\n还不等她反应过来，弹幕又来了。\n【咦？这女配犹豫什么呢？再不签字离开，裴书衍马上就从浴室出来了，裴书衍体内的药还没解呢，看见她恐怕又要忍不住嘿嘿哈哈】\n果然，她还来不及走，裴书衍从浴室出来了，而 \n那是注入时间的高定艺术！\n当沈清欢将古老家族徽章烙印在纯手工服饰上，在伦敦顶级社交季亮相时，全英王室与顶级贵族疯狂了！\n“一件衣服要五千英镑，还要配货？买！不买就配不上我的身份！”\n“这才是真正的奢侈品！”\n(英国全名名字叫：伊芙琳·辛克莱)", "tags": ["职场婚恋", "现代言情", "穿越", "打脸", "职场", "职场商战", "豪门世家"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯爹捡我弃婴命，我护他余生安稳", "fullTitle": "疯爹捡我弃婴命，我护他余生安稳", "link": "https://fanqienovel.com/page/7659432573558344728", "data": [2.84, 2.92, 3.01], "trend": 0.16, "latest": 3.0, "wordNumber": 195809, "creationStatus": 1, "desc": "他被全村叫疯子，准备跳河那天，捡到了被豪门父母丢弃在冰河边的女婴。\n两个濒死之人，在寒冬里互相救了对方的命。\n全村笑：疯子养灾星，早晚饿死。\n二十年后，女婴成了顶级名医，疯子养父被她治愈。\n豪门血亲跪地求认亲，她说——\n“你们给我冰冷血缘，他给我整个人间。”", "tags": ["职场婚恋", "现代言情", "乡村", "家庭", "豪门世家", "医生"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频衍生": [{"label": "穿成依萍，我带雪姨制霸上海滩", "fullTitle": "穿成依萍，我带雪姨制霸上海滩", "link": "https://fanqienovel.com/page/7660877336039935001", "data": [13.66, 14.27, 15.06], "trend": 1.39, "latest": 15.1, "wordNumber": 225032, "creationStatus": 1, "desc": "“啪！啪！”\n两个极重的耳光狠狠甩在傅文佩满是泪水的脸上。\n“你这毒妇！故意把亲生女儿换给我，却让我王雪琴的亲骨肉跟着你吃糠咽菜，受尽虐待？！”\n看着一向骄横的“雪姨”双眼猩红，将那张带着红章的医学血型鉴定单死死砸在傅文佩伪善的面具上，陆依萍居高临下地冷笑出声。\n前世作为二十一世纪顶级医学女博士，睁眼竟穿成暴雨夜被逼去讨钱挨打的依萍。面对只会哭唧唧推她出去挡枪的“圣母”养母，依萍绝不内耗，反手撕破伪装，直接找上死敌王雪琴！\n“你看看如萍那三脚踹不出个屁的懦弱样，哪点像你这泼辣精明的九姨太？”\n一针见血，真假千金惊天掉马！死敌竟然变亲妈！\n不被狗血亲情绑架，依萍觉醒灵魂深处的“医药空间实验室”，手握青霉素、高纯度磺胺等乱世神药配方，彻底掀翻原著烂牌！\n母女强强联手，两人拉拢上海滩大佬秦五爷，一手缔造庞大的医药帝国！\n大上海从来不缺大舞厅里唱歌卖笑的“白玫瑰”，多的是心狠手辣的“医药女王”！\n沉溺什么狗血恋爱？搞钱、囤药、摧毁父权、做红顶商人支援抗战！格局打开，这才是民国清醒大女主该走的通天大道！", "tags": ["女频衍生", "穿越", "空间", "女强", "同人", "衍生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张瑞朴！你快来管管你大侄女", "fullTitle": "张瑞朴！你快来管管你大侄女", "link": "https://fanqienovel.com/page/7659247007562730521", "data": [5.27, 5.96, 6.47], "trend": 1.2, "latest": 6.5, "wordNumber": 156125, "creationStatus": 1, "desc": "【OOC+南部档案开局+无CP自磕+两只比格闯天下】\n张家本家遇到了从未有过的危机，从本家撤离的路上，张拂潇收到了发小的消息，果断的去了南洋。\n 获得随机辅助道具，演绎分满，任务结束，祝贺宿主任务顺利，活着完成任务！”\n　　关云闲：？？？\n　　听听，人言否？\n　　前文提醒：\n　　没什么下墓剧情，本书也可以叫剧情外主角团的日常生活，同人文里，下墓的剧情看多了，有点腻，又找不到代餐，只能自己做饭了。", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "无CP", "同人"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我恐怖boss，从南部档案开始", "fullTitle": "我恐怖boss，从南部档案开始", "link": "https://fanqienovel.com/page/7659921533963340825", "data": [2.75, 2.83, 2.87], "trend": 0.12, "latest": 2.9, "wordNumber": 151711, "creationStatus": 1, "desc": "【无CP+女强+平遗憾+走剧情】\n桑九叶是一个倒霉鬼，第一次穿成无限流副本里冥婚主题大boss的新娘，\n战战兢兢搞死大boss之后，自己成了大boss，本来该大杀四方，大显身手，大展拳脚！\n结果被无限流系统判定为bug，直接把人踢出世界。\n好不容易带着她的小搭档找到一个小世界投放，\n却没想到这是个依旧诡异的世界……\n桑九叶：想过回正常人生活 咋就这么难？\n张海琪：我说我是顶格了，没想到来了个更夯的……\n张海楼：干娘一个老太婆就很难伺候了，没想到这样难伺候的老太婆还有一个！\n张海侠：（偷笑.jpg）没办法，谁让我太乖了呢", "tags": ["悬疑脑洞", "悬疑", "风水秘术", "无CP", "女强", "穿越", "系统"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我和顶头boss成诡了", "fullTitle": "我和顶头boss成诡了", "link": "https://fanqienovel.com/page/7657438469932715033", "data": [2.39, 2.46, 2.49], "trend": 0.1, "latest": 2.5, "wordNumber": 187053, "creationStatus": 1, "desc": "诡异视角\n双男主，视角随机\n周荣攻，胡建仁受\n第一卷：小心夫妻店，包括无限流世界\n第二卷：寻找霸总真爱\n第三卷：少妻的珍宝（含老夫少妻，救风尘因素）\n第四卷：退婚流龙傲天的未婚“妻”（含狗血，男扮女装，私会因素）\n第五卷：三舅，你就放心的去吧，我会继承你的一切\n第六卷：狐假虎威and为虎作伥\n\n“建仁，哥只是有病，没啥正常三观，但哥又不是傻。真喜欢一个人，不知道怎么去爱，还能不知道啥日子过的舒服？”\n\n也是，当年没捅破那窗户纸，没意识到自己爱上了对方。\n\n但荣哥给钱给权给地位给自由，还得偷偷给我留后路。当然，我也留了。\n可惜，都没用上，准确来说，是我们都不想用。\n\n胡建仁把笔拿起来又放下：“现在外面世界的爱，已经到了我们都理解不了的程度了吗？你说他们是不是不懂什么叫爱？”\n\n“你看看那四个傀儡，不是被关、就是被抽血、或者被恨、被当空气。她们身上的标签全是‘惨’”\n“爱又不是把自己搞得越惨就越真。爱一个人，是会让他过得好的。”\n\n周荣哼了一声：“所以真正的答案不在那四个人里面。真正的答案，应该是那个让被爱的人过得最好的人。”", "tags": ["悬疑脑洞", "悬疑", "推理", "规则怪谈", "惊悚游戏", "灵异", "无限流"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "青霉素发家，张家女在盗笔当富豪", "fullTitle": "青霉素发家，张家女在盗笔当富豪", "link": "https://fanqienovel.com/page/7659746866979933246", "data": [13.74, 13.81, 13.83], "trend": 0.1, "latest": 13.8, "wordNumber": 186930, "creationStatus": 1, "desc": "【字数比较少，刚开分】【剧情线从南部档案开始，cp黑瞎子1v1，无其他暧昧向】  \n       张海灼这辈子做过最正确的决定，是十五岁那年从张家假死出逃。\n       第二正确的决定，是在柏林巷子里捡了黑瞎子当劳动力。\n       她在法租界开药铺，在苏州河边建厂，用青霉素撬动军火贸易，用芯片技术搭上改革开放的快车。\n       八十年间她换了三个身份，产业却越做越大，从“姚老板”到“姚小姐”再到“姚董”，桃花暗纹的信物流传至今。\n       什么莫云高、裘德考？要体验一下被经济制裁的恐惧吗？\n       什么汪家？你背后的势力比得上我为国家做的贡献？\n       什么，每个身份身边都有一个黑漆漆的保镖？不好意思啊，我们毕竟是母女嘛，审美一致，男朋友长得像多正常。\n       黑瞎子：没错，她就喜欢我这款！\n——\n       我写的主角是1905出生的张家人，从民国活到主线，尽可能经历大部分重要剧情点，能避免的悲剧会尽量避免，不会过多干扰让某些剧情点直接消失，但会改变一些人的结局。\n       主角有自己的事业线要走，某种程度上会是从民国到现代的穿越大女主爽文", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "衍生"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.76, 3.82, 3.85], "trend": 0.09, "latest": 3.9, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：强制诚实的我憋不住了", "fullTitle": "盗墓：强制诚实的我憋不住了", "link": "https://fanqienovel.com/page/7563612379108346905", "data": [4.94, 4.99, 4.98], "trend": 0.05, "latest": 5.0, "wordNumber": 261040, "creationStatus": 1, "desc": "（评分刚出，会涨哒）\n一个普通人穿越到盗笔世界，成了吴家小少爷。\n吴言，开局抽奖抽到了‘强制诚实’，这是奖励？\n再次抽奖，抽到了‘不会坏的计算器’。\n为了活下去，吴言只能尽量少说话，用‘计算器’代替自己发言！\n（有CP，有系统，团宠，搞笑甜味，不虐。主角性格是被特意培养的，单纯、幼稚，但三观极正。介意者，勿看！！！！！！！）\n看着不停说话欺负自己的黑瞎子，吴言不语，拿出计算器，不停按下减号键，计算器不停响起 “ jian jian jian jian jian jian ........”\n看着出言不逊的伙计，吴言用计算器按下几个键，计算器响起“平方根62500  等于......”\n遇到嘲讽吴家的藿仙姑，吴言不语，拿出计算器，按下六个数字‘4’ ‘3’ ‘8’， ‘4’ ‘7’ ‘8’！\n不想回答别人问题，按下计算器的“X的y次方”键，计算器会响起‘mi’！\n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓沙海：江同学魅力值爆表", "fullTitle": "盗墓沙海：江同学魅力值爆表", "link": "https://fanqienovel.com/page/7656405978484575294", "data": [2.34, 2.34, 2.36], "trend": 0.01, "latest": 2.4, "wordNumber": 228355, "creationStatus": 1, "desc": "【沙海+盲冢+重启+万人迷+NPC觉醒】（评分刚出，后期会涨）\n江游突然觉醒记忆，发现自己竟然是小说里连名字都没有的路人甲。他没有顺从命运，而是做出惊人之举——改写黎簇的结局，硬闯盗笔世界。\n可偏偏，他越疯，越有人挪不开眼。\n沙三角：我难道不是昭昭最喜欢的哥哥吗？\n小汪们：敌友难辨，立场摇摆。\n无邪：死之前，我只想再见他一面。\n黑瞎子：“兄弟”太多，要不要先下手为强？\n江游一路走来，常常感叹自己运气不错，遇上了一群过命的兄弟。\n直到某天，他忽然发现，身边这些“好兄弟”似乎都藏着不为人知的心思……\n【主角已成年，无不良导向。】", "tags": ["悬疑脑洞", "悬疑", "盗墓", "同人", "衍生", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "糟糕末世：系统给我发了五个疯批", "fullTitle": "糟糕末世：系统给我发了五个疯批", "link": "https://fanqienovel.com/page/7661368861291187262", "data": [5.82, 6.83, 7.73], "trend": 1.91, "latest": 7.7, "wordNumber": 152602, "creationStatus": 1, "desc": "【搞笑+可爱+体型差+全员洁+无脑爽】\n可爱软萌女主VS忠犬男主\n意外穿到末世。\n人家都是技能满格，左手杀丧尸，右手扣晶核。\n而她！！！\n什么都没有！！！\n系统无奈：“好吧，我可以给你个储存空间，保证你饿不死。”\n“我还可以塑造你小说里的男主人物。”\n“让他们来陪你一起。”\n叶歌眼睛亮晶晶，她心动了。\n系统：“只能是你最近写的一本。”\n叶歌崩溃：“？我最近写的是极限文啊！”\n不止疯批，还没素质…\n“我不要。”\n系统：“……拒绝无效，已经生成了。”\n叶歌崩溃：“坑货，那是五个疯批啊——”\n系统：“人多热闹。”", "tags": ["科幻末世", "穿越", "空间", "末世", "搞笑轻松", "无脑爽"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进末世，我靠装弱，苟成最强", "fullTitle": "穿进末世，我靠装弱，苟成最强", "link": "https://fanqienovel.com/page/7662354834556734488", "data": [17.44, 18.26, 19.12], "trend": 1.68, "latest": 19.1, "wordNumber": 222675, "creationStatus": 1, "desc": "纪昼穿进末世八年，是临江基地公认的废物。\n\n检测做了一年又一年，结果始终没变。\n\n无异能。\n\n体弱。\n\n胆子小。\n\n遇到危险，只会躲在人群后面。\n\n纪昼对此十分满意。\n\n废物有人护着。\n\n天才却可能被送进实验室。\n\n没人知道，她体内藏着一团奇怪的东西。\n\n它会记住异能。\n\n硬化、雷电、冲击……\n\n只要给它一点时间，那些原本属于别人的力量，就能在她身上重新出现。\n\n纪昼靠着这张底牌装弱苟命，一装就是八年。\n\n她原本打算继续装下去。\n\n直到赛场坍塌，横梁压向被困的人，她当着六大基地的面，抬手托住了整片废墟。\n\n检测记录被连夜翻出。\n\n中央基地要求重新检测。\n\n研究人员想把她带回去。\n\n就连比赛里的对手，也故意重伤她的队友，逼她补位上场。\n\n姜妄隔着防护墙看向临江席位。\n\n“不是还有个替补吗？”\n\n“团队赛让她上。”\n\n“我倒想看看，她那层刚觉醒的硬化，能撑几刀。”\n\n所有人都以为，纪昼只有硬化。\n\n只有谢闻岐坐在高处，转了转缠着固定带的右腕。\n\n他望着她周围那片不肯随场域改变的异常，忽然笑了。\n\n“刚觉醒？”\n\n“她可藏了不止一天。”\n\n纪昼抱着医药箱，乖巧地坐在原位。\n\n她算了算自己手里剩下的异能。\n\n还是太少。\n\n得再攒一点。", "tags": ["科幻末世", "末世", "穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都是公路求生，凭啥她这么强？", "fullTitle": "都是公路求生，凭啥她这么强？", "link": "https://fanqienovel.com/page/7615678294175779865", "data": [2.88, 3.13, 3.34], "trend": 0.46, "latest": 3.3, "wordNumber": 155115, "creationStatus": 1, "desc": "【武力值爆表女主 星星vs娇俏病美人男主 景越】\n谁也不知道，末世力量、速度双异能满级大佬星星，表面看着冷若冰霜；实际上是一个内心柔软的资深甜文小说迷，没错，她就是个面瘫。\n某日，被无良作者用甜文标签吊着胃口，看了本小说，因同情文中男主遭遇，在心里激情开麦，下一秒，突然被召唤进入公路求生游戏，开局一辆手推车……\n星星面瘫脸上头一回出现疑惑，公路求生啊！不知道跟末世求生比如何？\n半个小时候后，她就知道了，公路求生简直不要太爽，到处都是吃的，这里的怪物还不会传染变异，简直就是天堂！\n然而，很快，她就更激动了，这里竟然是她之前看的那本小说世界。\n她倒要去看看，这男主景越是不是真的像书里描写的那么好看。\n十分钟后，看着晕在自己怀里的大美人，小面瘫内心疯狂表示，与书里相比，有过之而无不及啊，作者文笔误我！不过倒是跟我挺配的，那要不就……拐了？\n这一拐，就丢不掉了。\n444区谁都知道，她们榜一大佬有一个爱撒娇、爱吃醋，还病恹恹的小娇夫；大佬天天都在交换探友卡去哄小娇夫的路上……\n【简介无力，移步正文。头回写这个类型，读者宝宝们多多包容，实在看不下去的点左上角退出就行，求求不要轻易打低分嗷～首章】", "tags": ["科幻末世", "穿越", "女强", "穿书", "异世穿越", "大佬"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽皮肤抽到丧尸位面后我上交了", "fullTitle": "抽皮肤抽到丧尸位面后我上交了", "link": "https://fanqienovel.com/page/7660783163194494014", "data": [3.12, 3.39, 3.52], "trend": 0.39, "latest": 3.5, "wordNumber": 185548, "creationStatus": 1, "desc": "【多位面穿越+都市脑洞+有CP+强国+成长向+群像】\n【末世+游戏+小说+星际+修仙……】\n她只是想抽个皮肤，怎么还带强买强卖！\n从丧尸位面死里逃生后，奚乔裹成粽子冲进派出所：警察叔叔，我要上交！\n从此，国家爸爸组队穿越，奚乔开开心心薅资源，薅科技，薅系统！\n******\n“警察叔叔，等我变成丧尸，就会不讲卫生，还喜欢到处咬呜呜……我、我不知道会不会传染。”\n她不想被豌豆射手biu biu、biu！\n******\n“本系统是正经系统！”\n奚乔冷笑：“正经系统会把人强制送去丧尸世界？”\n系统：“……”\n它不吭声了。\n******\n“毕竟时间太短，那些人都只会按任务做，谁能想到带着一堆现实种子来补图鉴啊！”\n奚乔默默举手。\n“国家爸爸会。”\n系统安静了一秒，诚恳道：“你们国家爸爸确实很离谱。”", "tags": ["科幻末世", "系统", "穿越", "末世"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "同居半年后发现未婚夫非人类！", "fullTitle": "同居半年后发现未婚夫非人类！", "link": "https://fanqienovel.com/page/7615492664061856792", "data": [3.89, 4.09, 4.26], "trend": 0.36, "latest": 4.3, "wordNumber": 140345, "creationStatus": 1, "desc": "【微型末世+甜宠恋爱文（阴暗疯批非人×微盲坚韧人类】\n陆昭昭是只是家里培养的联姻工具，而周景和是周家不入名的末流孩子。\n因为一场合作，两人相知相爱，原本以为生活会平平淡淡，幸福快乐的过下去，突然的变异人爆发，让他们被迫隔离家中。\n末日爆发，所有人自顾不暇，唯独这对小情侣，仍旧甜甜蜜蜜。\n偶然的一天，陆昭昭视力恢复，她看着上天入地的未婚夫，短暂的陷入沉默。\n他怎么有尾巴？\n求助，未婚夫不是人怎么办？\n—\n小剧场：\n周景和：我不是人你还会爱我吗？\n陆昭昭：我最最喜欢的人就是你。\n周景和（沉默）：我不是人。\n陆昭昭：最爱你。\n—\n你可是我孵出来的 自然是我的老婆。\n                                    ——周景和\n——\n（PS：\n           非女强，女主前期盲，后面视力会恢复正常。）", "tags": ["科幻末世", "末世", "甜宠", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真千金在星际杀穿了", "fullTitle": "真千金在星际杀穿了", "link": "https://fanqienovel.com/page/7649654747821001790", "data": [3.78, 3.98, 4.11], "trend": 0.33, "latest": 4.1, "wordNumber": 287959, "creationStatus": 1, "desc": "分刚出后面会涨的！\n【星际＋学院＋精神力＋军校联赛＋群像+真假千金+打脸】\n末世最强小队队长楚辛，重生后惨变嘤嘤怪婴儿，还惨遭女佣调包丢进贫民窟！开局天崩？不存在的！\n拳打人渣父母，脚踢假千金，想认她回去？不可能的！\n看她一路杀穿星际，被摁在地上打的众多s级精神力\n看着她顶着A级精神力开始怀疑人生\n直到双s也被她压着打，事情逐渐开始变得不对劲起来……\n你说什么叫精神力可以增长的？\n什么叫你能吸收虫晶能量？\n什么叫你才是楚家大小姐？\n一个个消息炸的一众天才外焦里嫩\n女主属性：又痞又强·饿鬼投胎·专治各种不服\n配角吐槽：“她开机甲像街头斗殴，干饭像星际蝗虫！”", "tags": ["科幻末世", "星际", "重生", "打脸", "女强", "穿越", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全星际都知道我们小队很有钱", "fullTitle": "全星际都知道我们小队很有钱", "link": "https://fanqienovel.com/page/7646458108536966169", "data": [3.93, 4.1, 4.2], "trend": 0.27, "latest": 4.2, "wordNumber": 139459, "creationStatus": 1, "desc": "【星际军校+热血群像+爆笑反差+爽爆高能】\n穿越第一天，江晚栀看着账户里237亿星币和13颗资源星，准备直接躺平当富婆。\n结果管家一盆冷水浇下：\n“小姐，您签了四年军籍预备协议。除非……因能力太差被军校淘汰。”\n江晚栀眼睛暴亮：还有这种好事？拿倒数第一回家继承家产，这不有手就行？！\n于是，荒星考核里——\n别人拼命杀怪，江晚栀找安全区睡觉；\n别人抢夺积分，她拉着四个全校最嫌弃的怪胎组队避战。\n可画风突然就歪了：\n别人小队缺弹药，江晚栀随手买下补给站：“刷卡。”\n别人遭遇星兽潮，江晚栀脑子飞速计算：“它左侧肋下有旧伤，周野，撞它！”\n原本想混个零分被开除，结果莫名其妙拿了战术贡献第一；\n原本想当个花瓶富婆，结果把这支“垃圾小队”一路带成了联邦最强战神！\n别人眼中的他们：富婆、贫民、书呆子、莽夫、懒狗。\n星兽眼中的他们：求求了，这五个疯子真的不是来毁毁灭宇宙的吗？！\n【绝不虐主+超默契团队+五人独立高光+爆笑热血杀穿星际！】", "tags": ["科幻末世", "星际", "群像", "穿越", "搞笑轻松", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹小祖宗！星际战神竟是女儿奴", "fullTitle": "别惹小祖宗！星际战神竟是女儿奴", "link": "https://fanqienovel.com/page/7660492016349875262", "data": [3.14, 3.31, 3.38], "trend": 0.24, "latest": 3.4, "wordNumber": 175475, "creationStatus": 1, "desc": "【星际+系统+团宠+重生+升级+爽文+大佬+打脸】\n\n上一世，江子霜为了顶替江子函的身份，将她囚困致死\n\n她信赖的养父，养兄，青梅竹马的未婚夫全都是帮凶\n\n遭所有至亲之人背叛而死\n\n她死不瞑目 重生归来，有仇报仇，有怨报怨。\n\n玉佩激活，自带系统、空间、灵泉水\n\n还意外觉醒了稀有的木系异能\n\n完成任务就能提升精神力\n\n从此走上了变强之路\n\n铁血杀伐、威震星际的战神元帅，竟然是她爹\n\n战神化身女儿奴\n\n他将所有温柔与偏爱尽数倾注在女儿身上\n\n顶级别墅直接过户，赠予千万零花钱..十六年缺失的疼爱，他一一补齐\n\n不仅如此，她还意外发现，六位顶尖3S级精神力强者是她的哥哥\n\n老大是联邦首席医疗权威\n\n老二是顶级星际财团掌权人\n\n老三是星际黑市老大\n\n老四是全星级顶级大明星\n\n老五是最年轻星际法官\n\n老六是大皇子，最年轻的指挥官\n\n从前无人撑腰、任人欺凌的孤女，一朝逆袭成战神父亲极尽偏爱、六位天才大佬兄长极致宠爱\n\n成了没人敢招惹的存在！\n\n谁敢惹我的小祖宗？\n\n不想活了！\n\n所有人达成共识：惹谁都别惹司清柠小祖宗，她全家超级护短！\n\n昔日肆意践踏她尊严的江家众人、虚伪爱人，再度偶遇她时，只剩惊恐后怕、狼狈不堪、后悔万分\n\n柔弱不能自理的小妹竟然成了顶级大佬，\n\n重活一世，她终于活成了人生赢家！！", "tags": ["科幻末世", "星际", "末世", "重生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假借身份入学，全军校防我偷零件", "fullTitle": "假借身份入学，全军校防我偷零件", "link": "https://fanqienovel.com/page/7646091148657708056", "data": [2.75, 2.86, 2.93], "trend": 0.17, "latest": 2.9, "wordNumber": 242969, "creationStatus": 1, "desc": "【评分刚出，后面会涨】\n废窑星黑户楚休顶替死人身份混进皇家军校。\n别人来上学是为了建功立业。\n她来上学是为了捡破烂搞钱。\n全校师生都以为机甲制造系来了个天才。\n直到五大军校联赛开打。\n楚休开着一堆破铜烂铁拼成的缝合怪上场。\n边打边拆敌方零件现场改装。\n整个赛场沦为她进货的废品收购站。\n后来虫族降临，星际覆灭在即。\n那个被贵族圈嘲笑的拾荒者，驾驶着满身补丁的机甲一枪贯穿母巢。\n星海之巅，她踩着反派的定制机甲残骸。\n手里的碳钢扳手包浆发亮。\n“万物皆可拆，万物皆有价，结账吧各位。”", "tags": ["科幻末世", "星际", "天才"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日死考：七岁丧尸王也要考试？", "fullTitle": "末日死考：七岁丧尸王也要考试？", "link": "https://fanqienovel.com/page/7652257815586688025", "data": [4.48, 4.68, 4.51], "trend": 0.03, "latest": 4.5, "wordNumber": 200413, "creationStatus": 1, "desc": "评分刚出！会涨！看正文看可爱小老大!\n末日废土+恶童丧尸王+比格属性+全名求生直播】\n季末一觉睡醒，发现家没了，哥也不见了，甚至她连人都不当了。\n因为她变成了一只丧尸，穿着花棉袄的丧尸王。\n季末想要找妈妈，脑海中就传来了一道机械音。\n“叮，第101次末日死亡高考准备开始，考场已准备就绪，请考生做好准备。”\n季末：嗯？高考？我吗？可我刚满七岁，还没上小学啊。\n紧接着，季末出现在了墓地。\n考题：枯骨酸雨墓园（杀戮求生）\n季末不识字，问一旁的姐姐。\n姐姐眼神奇怪：“小姑娘，幼儿园不教认字吗？”\n季末挠了挠头：幼儿园，不是教杀人的地方吗？\n不过好在，她得到了答案。\n不需要做数学题啊，既然如此，她要开始，发疯了！\n----\n基地中，幸存者们看着直播画面，其实早就麻木了，因为人类根本没有希望，不过是延长死去的时间罢了。\n可突然，一个名叫季末的积分以成倍递增，所有人都涌入了季末的直播间。\n咦？咋还有个小孩。\n有点不爱干净啊，这脸咋乌漆嘛黑的，这花棉袄好土啊。\n季末：你们这是言语霸凌小学生。\n同样看到直播的五位哥哥：呜呜呜，我的妹宝，没死！\n有幸和季末一起参加高考的高考生们：人麻了，死考最恐怖的，是那个熊孩子啊！", "tags": ["科幻末世", "末世", "直播"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "七零：成了农村耀祖亲生的崽", "fullTitle": "七零：成了农村耀祖亲生的崽", "link": "https://fanqienovel.com/page/7663822713491835928", "data": [13.82, 15.2, 16.38], "trend": 2.56, "latest": 16.4, "wordNumber": 128216, "creationStatus": 1, "desc": "评分刚开，会涨\n【无cp➕团宠➕女主真小孩➕爽文➕玄幻】\n沈遂蓁在虚空中睡着睡着，睁眼发现自己变成了小婴儿，再睁眼，又没了所有的记忆。\n她爹，原修真老祖，现农村耀祖，带着自己的储物空间被天雷劈到陌生小世界，在别人面前桀骜不驯，平等的看不起每一个人；在她面前，把她宠成了祖宗，甚至还会哭着说自己如何如何艰难才生下的她。\n她奶她爷，坚定的重男轻女拥护者，但又极为偏爱沈承耀。于是沈遂蓁生下后，老两口爱屋及乌，全然不顾自己还有那么多孙子孙女，潜意识认为只有沈遂蓁才是沈家唯一的后。\n沈遂蓁理所应当的被全家惯成了继她爹之后的下一个农村耀祖。\n只是长着长着，突然发现自己还有一个娘。\n亲娘顾泠月乃是快穿局顶尖资深员工，此刻正在京城闯荡真假千金副本.........\n(蓁蓁五岁前和顾泠月互相不知道对方的存在，跟着沈承耀在农村生活，五岁后开始前往京城)\n(蓁蓁本质上不是沈承耀亲自生的，只是沈承耀承担了顾泠月的生育痛苦，又因为系统的错误，生下来就空间传送到沈承耀身边。)", "tags": ["年代", "现代言情", "空间", "团宠", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "拿继妹照片相亲，冷面军官掐腰宠", "fullTitle": "拿继妹照片相亲，冷面军官掐腰宠", "link": "https://fanqienovel.com/page/7659378397017017369", "data": [5.38, 5.99, 6.36], "trend": 0.98, "latest": 6.4, "wordNumber": 162018, "creationStatus": 1, "desc": "【美媚娇小作精×又冷又傲禁欲军官】\n季寒川被父亲勒令去乡下接人。\n临出发前母亲特意打电话叮嘱，让他防着些一个叫沈黛的姑娘，别被缠上了。\n一见面，女人一张脸勾魂夺魄，娇媚入骨，性格更是矫揉造作，闹腾作妖。\n季寒川下意识不喜，打定主意接了人之后就避而不见。\n只是后来……\n他单膝下跪，捧起女人嫩白的脚，深情印上一吻，素来冷傲的脸上满是意乱情迷：\n“黛黛，不要离开我……”\n——\n沈黛穿成了年代文里女主的对照组，一个胸大无脑、虚荣拜金、一心想要攀高枝的蠢女人。\n原主作死地拿继妹照片去相亲，被戳穿后还给男主下药。\n为了避免凄惨结局，沈黛去了军区大院后老老实实享受生活。\n面对军区大院里成堆的帅气兵哥哥时，实在没忍住好色的本质，跑去跟人家搭讪。\n一向冷傲禁欲的季寒川却拦住她，黑眸沉沉：“你是我的！”\n沈黛：？\nPS：甜宠爽文，女主是站在美貌链顶端的女人！", "tags": ["年代", "现代言情", "宠妻", "穿越", "作精", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "村女刘丽", "fullTitle": "村女刘丽", "link": "https://fanqienovel.com/page/7655680332317871166", "data": [5.18, 5.62, 6.07], "trend": 0.89, "latest": 6.1, "wordNumber": 176347, "creationStatus": 1, "desc": "懵懂的村女刘丽，被渣男夺去身子，后来看清渣男的真面目。与小学体育老师于立伟意外相遇，经历过渣男，刘丽变得不再信任任何人，于立伟用心守护，刘丽一次次的被于立伟感动，刘丽通过自己的实力，打脸渣男，渣男最后落的非常悲惨的结局。只有小学文化的刘丽，却一步步逆袭变得强大无比。", "tags": ["年代", "现代言情", "家庭", "虐渣", "打脸", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰腴美人穿成恶毒女配后，发疯了", "fullTitle": "丰腴美人穿成恶毒女配后，发疯了", "link": "https://fanqienovel.com/page/7660895066201787416", "data": [11.67, 11.83, 12.13], "trend": 0.46, "latest": 12.1, "wordNumber": 167748, "creationStatus": 1, "desc": "【丰腴恶毒美人VS绝嗣封建大爹】\n【系统电击+对抗路夫妻+男主生理性喜欢】\n季清然穿书了，穿成了书里的恶毒女配。\n系统告诉她，完成任务后，她就能得到一亿。\n不就是走剧情吗，她狠狠行。\n设计陷害男主娶她，骂男主是不会下蛋的公鸡，只要有女人喜欢男主，就甩男主巴掌，伤害男主的侄子…\n不能脱离人设，否则就会被系统电击。\n她的目标是走完剧情拿钱跑路。\n看着微微隆起的肚子，她崩溃打人，“系统，你不是说是绝嗣吗？”\n系统：“他是男主。”\n季清然：“都给他，我只要钱回家。”\n…\n沈景川是书里的男主，人生一路顺到到三十岁，遇到了季清然这个大坎。\n他时常被这个小妻子气得脑门疼，不管怎么教育，她总是我行我素。\n沈景川在跟她相处的时候总是会感觉心脏不舒服，他以为是被气的。\n有一天，战友告诉他，喜欢就是一种电流般的酥麻感，沈景川不愿相信他喜欢上了那个恶毒的小妻子。\n她都快把他兜里的钱都掏完了。\n还想跑路呢。\n…\n当沈景川从医生的嘴巴里听到妻子怀孕的消息后，如遭天谴。\n“打掉！”他冷声说。\n“好。”季清然很轻易就答应了。\n他却后悔了，经过半个月的考虑，他接受了这个别人家的孩子。\n可是，养着养着，孩子却跟他越来越像", "tags": ["年代", "现代言情", "系统", "先婚后爱", "穿书"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [9.19, 9.55, 9.64], "trend": 0.45, "latest": 9.6, "wordNumber": 212852, "creationStatus": 1, "desc": "评分刚开，后面会涨。\n（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，且表示只要这一个孩子，不会再生二胎。\n爷奶一听瞬间急了……\n只生一个孩子，还是个女娃，那怎么能行？\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带娃上军区找爹，改造前夫被亲哭", "fullTitle": "带娃上军区找爹，改造前夫被亲哭", "link": "https://fanqienovel.com/page/7635968897727859774", "data": [7.6, 7.96, 7.97], "trend": 0.37, "latest": 8.0, "wordNumber": 278525, "creationStatus": 1, "desc": "年代女大学生揣崽上部队，找被她弃的军官前夫\n【训夫成军区大佬+换亲拿捏男人+资本家肤白貌美大小姐VS首长家刚从乡下找回来的真儿子】\n夏桃是肤白貌美资本家娇小姐，是这个年代难得的大学生，有为她谋划的心机恶毒亲妈。\n新婚夜被继姐算计走错房，不知情的情况下，她男人变成了乡下泥腿子出身的军官，用户口本还跟对方领了证。\n一觉醒来夏桃傻眼了，把人狠狠踢下床，坚持离婚。\n生米煮成熟饭周野不想离婚。\n当初相看，有人指着夏桃说是他相看对象，他才会同意婚事。\n他这人俗气，就图媳妇俊。\n夏桃死活不愿意，用自杀逼着周野打离婚报告。\n周野最终还是妥协离婚了。\n不久夏家被下放。\n夏桃觉醒记忆，才发现肚里揣了崽。\n走错房不是意外。\n她和她妈是书里的恶毒继妹和心机后妈，不仅跟女主抢男人还抢家产。\n下放改造后，她和崽都惨死乡下。\n周野不是泥腿子，他才是首长家真儿子，然而身份还没曝出就出任务牺牲了。\n他压根不知道他们还有两个崽，也不知道自己的身世，更不知道她和崽惨死。\n重活一世。\n夏桃揣崽上部队找崽爹负责，这人可不能早死，早死她和崽咋办，还得改造他让他认祖归宗，带她和崽过好日子。\n爱不爱不重要，给钱给工作保证他们生活就行", "tags": ["年代", "现代言情", "重生", "大佬", "代嫁代娶"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频悬疑": [{"label": "豪门归位：真千金她来自刑侦九处", "fullTitle": "豪门归位：真千金她来自刑侦九处", "link": "https://fanqienovel.com/page/7645229022334438424", "data": [1.41, 3.34, 4.2], "trend": 2.79, "latest": 4.2, "wordNumber": 139668, "creationStatus": 1, "desc": "京城顶级豪门季家失散十年的小女儿季宁被寻回。\n所有人都以为，归来的真千金是流落民间、没什么心机的苦菜花。\n独占了她身份十年的养女季暖心生忌惮。\n十年的锦衣玉食、众星捧月的日子早已刻入骨髓，她觉不允许突然归来的季宁夺走属于自己的一切。于是，季暖处处试探、暗中刁难，步步谋划，一心想将这位真千金赶出季家，独占所有偏爱于荣光。可计划一开始，季暖就彻底懵了。\n这位归家的真千金根本不按常理出牌。\n别人归家认亲，日日陪伴家人，讨好长辈兄弟姐妹。\n唯有季宁，神龙见首不见尾，一年到头回家不超过两次，连人都见不到，还怎么把她赶出去。\n季暖还暗自窃喜，觉得自己稳超胜卷。\n可日子渐久，季暖才发现，那个从不在豪门圈子露面，从不参与宅斗纷争的季宁，竟然是直属公安部管辖的重案组高级警探，一名真真正正的一线刑警。\n那个自己费劲心机都要争抢的东西，在季宁眼里根本不屑一顾或者说是没时间顾。\n自己的一切举动都像个笑话。\n你挣豪门偏爱，我破世间奇案。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱", "风水秘术"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：猫鼠人一家亲", "fullTitle": "盗笔：猫鼠人一家亲", "link": "https://fanqienovel.com/page/7659744133816257598", "data": [6.12, 6.62, 7.64], "trend": 1.52, "latest": 7.6, "wordNumber": 149758, "creationStatus": 1, "desc": "（OOC）（原创女主+无cp＋重生+猫和老鼠+私设）（时间在盗笔主线半年前）\n解家新来了一位表小姐。\n她父母双亡，孤苦伶仃。\n解当家为了还恩，特意将其接来老宅照顾。\n表小姐不是自己来的，她还带了一只半人高的英短蓝白。\n自从一人一猫来到解宅，老宅怪事频发。\n先是解当家深夜遇“鬼影”，只闻其声不见其“人”。\n后是厨房频繁被偷，疑似小偷已饿疯。\n直到天价古董无故失窃，对方还毁坏现场，场面之惨烈确定为打击报复。\n可解当家绞尽脑汁，翻遍新仇旧恨账本，却不得真面目。遂请来“专家”，却被专家质疑为失心疯。\n这一系列事件究竟是人性的扭曲，还是猫性的沦丧，关注大王，持续为您报道。\n……\n鹿笙是个传统的淑女，却命比纸薄，死在了最好的19岁年华。\n为了再给自己挣一条命，她接受了世界意识派发的拯救世界的任务。\n因为大量人物的重生，盗笔世界的主线乱成一锅粥，就需要有一个人来纠正它。\n鹿笙就成了天选之人。\n可熟知剧情的小伙伴都知道，盗笔是著名的黑深残。\n为了保证人身安全，聪明的鹿笙给自己找了两个小伙伴。\n一只猫和一只鼠。\n至此，猫鼠人小队正式成立，拯救世界行动开始。\n接下来登场的是，\n世界上最佳团队\n传奇点子王\n三大魔丸组合\n颤抖吧，新世界", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人", "悬疑恋爱"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三七穿越盗墓世界", "fullTitle": "三七穿越盗墓世界", "link": "https://fanqienovel.com/page/7650737707861167129", "data": [4.11, 4.3, 4.54], "trend": 0.43, "latest": 4.5, "wordNumber": 152925, "creationStatus": 1, "desc": "灵魂摆渡里反应慢半拍的孟婆三七无意间离开了黄泉，被人类的花花世界所吸引，又遇见一群把她当妹妹宠的人，不过这几个哥哥怎么都奇奇怪怪，总是喜欢往地底下钻呢？算了，看在他们这么弱小的份上，她就勉为其难地护着他们吧～\n三七是被吴邪捡到当妹妹养的，所以跟吴邪相处最多", "tags": ["女频悬疑", "悬疑", "灵异", "衍生", "悬疑恋爱", "风水秘术"], "borderColor"
