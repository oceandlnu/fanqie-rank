父亲是隐形大佬", "link": "https://fanqienovel.com/page/7489102469776034840", "data": [23.07, 22.67, 24.75], "trend": 1.68, "latest": 24.8, "wordNumber": 2958561, "creationStatus": 1, "desc": "简介：[穿越+空间+打脸+甜宠+家长里短+训夫成才]林凡穿越了，穿成年代文中谱通职工离异单亲家庭的大女儿，还成了未婚先孕的小姑娘。\n不行，必须要去找崽崽的爸爸，要他负责。爱不爱不要紧，有钱有工作生活有保障就行！\n等孩子出生站稳脚根工作稳定就去父留子独自美丽！\n最终找到了孩子的爸爸是个不学无术，无所事事吊儿郎当的二世祖！\n婚后！说好的二流子怎么越来越像隐形的大佬！", "tags": ["年代", "现代言情", "穿越", "空间", "大佬", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小辣椒闹腾，高冷首长宠宠宠", "fullTitle": "小辣椒闹腾，高冷首长宠宠宠", "link": "https://fanqienovel.com/page/7561724651605330968", "data": [25.33, 26.47, 26.84], "trend": 1.51, "latest": 26.8, "wordNumber": 1017822, "creationStatus": 0, "desc": "[年代文+爽文+虐渣+空间+双洁]\n\n上辈子，魂魄不全的黎予初，被渣男和绿茶合谋骗到了边境，落了个死后喂狗的下场！\n\n重生后，她清醒果断，\n\n渣男想升职？毫不犹豫送他去吃花生米！\n\n绿茶想要又要？做梦！你只配吃花生米！\n\n不仅处处给他们挖坑，还通过他们找到了金山银山？\n\n太好了，目之所及，不论钱财粮食还是宝贝，通通收收收！\n\n顺带着陆海空三军告状告了一大遍，把渣男的领导搞的灰头土脸，别提有多爽！\n\n啥？渣男娘受不了刺激想求自己？\nno！本姑娘不接受道德绑架！\n\n\n\n\n\n\n\n\n\n………………\n只是那个高冷的首长喂，\n你千里追到我家为哪般？想让我跟你去随军？\n\n本辣椒是觉得你有钱又大方还好欺负，\n可咱们不太合适！\n\n毕竟，跨军界告你状，让你成为了大笑话，我虽不后悔但心虚！\n\n\n而且姐有大志向：只想当村霸！\n\n………………………………\n\n小剧场：\n“听说了吗，顾首长的新婚妻子是黎予初！”\n“老天爷！这个活爹怎么又回来了？”\n嫂子们急的嘴里起了水泡，\n文工团的姑娘使劲捂住钱包，\n训狗的提前做好了被罚准备，\n\n……\n\n要说谁最欢迎黎予初这个大闹腾，\n当然是……犬！\n呃，还有某人！", "tags": ["年代", "现代言情", "宠妻", "空间", "虐渣", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [37.27, 37.81, 38.39], "trend": 1.11, "latest": 38.4, "wordNumber": 838485, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魂归香江：从裁缝铺到女首富", "fullTitle": "魂归香江：从裁缝铺到女首富", "link": "https://fanqienovel.com/page/7644061214691052606", "data": [25.94, 26.52, 27.02], "trend": 1.09, "latest": 27.0, "wordNumber": 610285, "creationStatus": 1, "desc": "【八零年代+女强+学霸+商战+香港】\n前世的她过目不忘的脑袋配了颗随时停摆的心脏；\n心脏停跳那刻，她想：下辈子，不做人了。\n再睁眼，她叫林颖，九岁，痴傻九年，今日魂归。\n师婆掐算过三次：\"不会再走了。你本来就是你，只是被放错了地方。\"\n她成了八零年代香江西环一间裁缝铺里痴傻九年的小女孩：林颖。\n老窦是从G省偷渡来的入赘木匠，老母踩着缝纫机和老窦一起养活一家四口。\n九岁，魂归香江。前世满腹经纶无处施展，这世她有了一副能跑能跳的身体。\n\"阿公，我想读书。\"\n\"好！你想读到几时，阿公就供到几时！\"\n官校不能跳级，私立学费要命，一个一天学没上过的九岁女孩，装了十八年知识的脑子，一颗终于不会停摆的心脏，和一家子拼了命也要托举她的人。\n从裁缝铺到港岛写字楼，从西环旧唐楼到半山豪宅：这个被老天放错了地方的女孩，要在这座黄金遍地的城市里，亲手造出一个商业帝国。\n前世欠她一副好身体，今生还她一个盛世香江。\n【大女主文，本书叙事核心重头到尾都是女主，该书看的是女主是否能掌控自己人生与事业，不是统计书中有几个男配角色！作者不会为了迎合极端观点消除所有男性！所有配角都是推动剧情的需要！】", "tags": ["年代", "现代言情", "学霸", "女强", "前世今生", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "堂妹抢婚？爽，禁欲首长馋上我！", "fullTitle": "堂妹抢婚？爽，禁欲首长馋上我！", "link": "https://fanqienovel.com/page/7612183160905796670", "data": [21.9, 22.07, 22.78], "trend": 0.88, "latest": 22.8, "wordNumber": 942350, "creationStatus": 1, "desc": "【姐妹易嫁+年代军婚+冷情恶女VS禁欲首长+撕渣+追妻火葬场】\n\n骆青瑶胎穿七零后，忘记了上辈子的事，十五岁的时候她还出了车祸。\n因此变得又胖又横。\n堂妹骆青雨抢了她的娃娃亲，失忆了的骆青瑶过不去这个坎，恨不得杀了那对狗男女。\n有一天，堂妹的未来亲姐夫到她家里来了！\n不仅是个高门子弟，还是部队最年轻的参谋长。\n很优质！\n比之她以前的未婚夫强太多！\n骆青瑶的眼底闪过一丝得意：机会来了！妹债姐还！\n抢！\n——骆青雨，你抢我的未婚夫、我抢你的亲姐夫，不为过吧？\n——骆青华，你不是说会被抢，那是自己不被爱吗？这滋味，你也享受享受吧！\n一夜混乱，骆青瑶把傅北寒给睡了，这一夜也因为她不小心摔倒，觉醒了前世的记忆。\n醒来后，骆青瑶给自己点了个赞：干得好，咱二十一世纪的人，吃啥也不能吃亏！\n傅北寒：我出来执行个任务，就被人睡了？\n睡我的，还是个小胖妹？？？\n", "tags": ["年代", "现代言情", "穿越", "追妻火葬场", "代嫁代娶"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "村女吴秀丽", "fullTitle": "村女吴秀丽", "link": "https://fanqienovel.com/page/7614505261746621502", "data": [40.82, 40.96, 41.35], "trend": 0.53, "latest": 41.4, "wordNumber": 593140, "creationStatus": 1, "desc": "20岁的村女秀丽，在男友刚子大学入学前一天，失身于刚子，秀丽追随男友到了城里打工，然而，进城后发生的一件件事，让秀丽寒透了心，秀丽决定重新审视她与刚子的感情。在感情不如意的同时，秀丽的生活也陷入了困境，这时，大学教师许云峰走进了秀丽的生活，慢慢地两人陷入爱河。", "tags": ["年代", "现代言情"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [22.2, 22.64, 22.7], "trend": 0.5, "latest": 22.7, "wordNumber": 763527, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纯情傻子是军官？大小姐娇宠他", "fullTitle": "纯情傻子是军官？大小姐娇宠他", "link": "https://fanqienovel.com/page/7593263178578938942", "data": [28.18, 28.81, 28.67], "trend": 0.49, "latest": 28.7, "wordNumber": 1045398, "creationStatus": 0, "desc": "【年代+爽文+赚钱+家长里短】\n许昭昭死后才知，她是被人换命的假千金！\n徐家把她换掉，就是为了夺走她的富贵气运！\n一朝觉醒，许昭昭绑定好感度系统，可以换粮，换药，换物资，直接开挂！\n    为夺回气运，她果断下乡投奔亲爹娘。\n    亲爹亲娘：“闺女是心头肉，谁也不能委屈她！”\n    哥哥们：“妹妹想要啥，哥都给你弄来！”\n    弟弟：“我保护姐姐！”\n    她带着全家搞钱，挖野味、赚工分，日子越过越红火，全村都羡慕哭！\n    半路还捡了个小傻子：长得帅、力气大、听话又护短，见她就喊：媳妇！\n    许昭昭：…… 别过来啊！\n    可傻子只黏她、只听她、只护她，夜里还会红温黏着她不放。\n    她索性嫁了，日子甜如蜜。\n    直到某天，傻子恢复神智。\n    他非但不是傻子，还是身份显赫的大佬！\n    沈寂恢复记忆，被迫返回军区。\n    许昭昭毅然挺着孕肚，千里奔赴军区寻夫。\n    众人等着看她的笑话。\n    却在看见沈寂在见到她的瞬间，卸下所有防备。\n    “媳妇，我这辈子、下辈子，都是你的小傻子。” \n    夺气运？换人生？谁也别想拿捏我！", "tags": ["年代", "现代言情", "乡村", "系统", "护短", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宋老太重生，渣男私生子都滚开", "fullTitle": "宋老太重生，渣男私生子都滚开", "link": "https://fanqienovel.com/page/7573537639983238169", "data": [28.42, 28.99, 28.91], "trend": 0.49, "latest": 28.9, "wordNumber": 1862188, "creationStatus": 0, "desc": "（无系统空间，无CP，家长里短，海边美食，女人互助，送渣男去坐牢改造）\n八十岁的宋香兰，儿孙满堂，却活成了一个笑话。\n她为了丈夫，为了儿女，操劳一生，奉献出自己的全部，\n没想到临了的时候，丈夫为了白月光要和她离婚，还逼她净身出户。\n宋香兰来不及愤怒，更诛心的真相被揭开。\n原来她疼爱了大半辈子的儿子是丈夫和白月光所生，而被自己厌弃的、已英年早逝的养子才是自己的亲儿子。\n愤怒之下，她点燃瓦斯，和所有人渣同归于尽。\n再睁眼，宋香兰回到了1977，一切都还来得及。\n这一世，谁敢让她不痛快，她就让谁双倍不痛快！\n她要手撕渣男贱女，脚踢白眼狼野种，独宠亲生子女！搞钱！搞钱！再搞钱！", "tags": ["年代", "现代言情", "重生", "无CP", "虐渣", "家长里短"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书七零，吃瓜赚钱两不误！", "fullTitle": "穿书七零，吃瓜赚钱两不误！", "link": "https://fanqienovel.com/page/7554031144186940478", "data": [21.71, 21.87, 22.03], "trend": 0.32, "latest": 22.0, "wordNumber": 1008237, "creationStatus": 0, "desc": "【穿书+系统+知青下乡+吃瓜+爽文+女主自强+原女主也是大女主人设+不娇妻】\n女主太小，感情线比较靠后。\n穿到七零年代，还没过几天好日子，就被迫下乡的苏桃，对着让她下乡的罪魁祸首冷冷一笑。\n敢算计她，那就一起下乡吧！\n没想到，她不仅穿越了，还穿书了！\n作为书中没有的角色，她决定远离男女主，静静地吃瓜，默默地赚钱，争取早日买上车，买上房，抱个少年郎！\n只是，故事的发展怎么跟她记得的不一样呢？\n恶毒女配怎么跟女主成了朋友？\n自己身边的这个帅哥，书里也没有啊？", "tags": ["年代", "现代言情", "乡村", "系统", "穿书", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [36.67, 36.78, 36.98], "trend": 0.31, "latest": 37.0, "wordNumber": 502477, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄学真千金穿七零，认亲首长父亲", "fullTitle": "玄学真千金穿七零，认亲首长父亲", "link": "https://fanqienovel.com/page/7581118244304473150", "data": [29.57, 28.28, 29.84], "trend": 0.27, "latest": 29.8, "wordNumber": 947599, "creationStatus": 0, "desc": "江莯颜本是现代玄学界的修炼天才，早在她穿越之前，师父便已算出她有穿越到异世这一劫难。为护她周全，师父与众位师兄们，将海量金银珠宝、稀缺药材以及各种符箓和生活物资尽数收纳于芥子袋中，成为江莯颜在七十年代最大的“底气”。\n江莯颜刚穿越，便发现原主在刚出生时，就被现在的养母把她和自己的亲生女儿偷偷调换 。而养母更是为了自己的亲生女儿和儿子，逼着原主嫁给一个打死过两任老婆的老渣男。\n不过，这都难不倒江莯颜，看她如何榨干无良养父母的钱财，临走前还分别送给他们一个霉运符，让他们为欺辱原主付出代价。\n江莯颜报名下乡后，在这期间，邂逅了未来的命中注定，也重逢了自己的亲三哥。凭借精湛的玄术和医术救治了很多本该被命运辜负的人。更凭借那双能洞察虚妄的天眼，敏锐察觉到潜藏在暗处的敌特分子，保护了被下放的科研人员的安全。\n高考恢复后，江莯颜凭借过人的天赋和优异的成绩考入京市的顶尖学府，也终于和亲生父母相遇，开启了属于她的璀璨篇章！", "tags": ["年代", "现代言情", "穿越", "天才", "虐渣", "真假千金"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [24.4, 24.37, 24.55], "trend": 0.15, "latest": 24.5, "wordNumber": 1096110, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "妹宝投亲认错哥，被冷面首长亲哭", "fullTitle": "妹宝投亲认错哥，被冷面首长亲哭", "link": "https://fanqienovel.com/page/7619239630935706686", "data": [20.95, 21.0, 21.05], "trend": 0.1, "latest": 21.0, "wordNumber": 815502, "creationStatus": 1, "desc": "漫剧《妹宝睡错房开局撞上大魔王》已上线，番茄红果搜索可看。\n乔欣欣是乔家刚认回来的真千金。\n假千金乔明珠为了不嫁给因任务残废的未婚夫，在认亲宴上，给她灌酒，将她送到了自己未婚夫床上。\n却没想到，她走错了房，和乔家死对头那优秀到人神共愤的儿子一夜荒唐。\n她连夜逃走，那男人到处寻找。\n假千金为了不嫁给那残废未婚夫，茶言茶语，全家逼迫她替嫁，她只能去投奔养父母家的大哥。\n然而，投奔当天，十年没见的大哥帅到她快认不出来了！\n但为了和大哥打好关系，她决定拿出自己看家本领——撒娇！\n但是……这男人怎么看着她的眼神那么不对劲呢？\n乔欣欣一直到后来才知道，原来她哥执行任务去了，作为她哥的好兄弟，某位年轻的首长大人亲自照顾她。\n但是……这男人好眼熟呀？\n嗯？他身上怎么有乔家死对头特有的家族胎记？\n不对！她好像是那天和她发生关系的人？", "tags": ["年代", "现代言情", "空间", "穿书", "真假千金"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁残疾英雄，婆家宠我青云志", "fullTitle": "替嫁残疾英雄，婆家宠我青云志", "link": "https://fanqienovel.com/page/7630006960976317502", "data": [22.23, 21.92, 22.23], "trend": 0.0, "latest": 22.2, "wordNumber": 620666, "creationStatus": 1, "desc": "【年代甜宠+爽文+婆家宠上天】\n七十年代末，家境贫寒受尽欺负的杨巧，被迫替嫁嫁给断了双腿的退伍英雄周文辉。\n本是一场各取所需的婚姻，她以为往后日子只有柴米油盐的艰辛，却没想到嫁对了人，连带着婆家都把她宠上了天！\n公公是部队师长，婆婆是外科主任，全家上下把她当成心尖宝。\n从受尽冷眼的苦命姑娘，到被婆家捧在手心的宝贝，杨巧一路逆袭。\n恢复高考后，她埋头苦读考上大学，成为受人尊敬的老师。\n哥哥杨政潜心钻研假肢技术，终于让丈夫重新站了起来。\n没有金手指，只有细水长流的温情与步步向上的人生。", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "青春甜宠": [{"label": "怎敌她动人", "fullTitle": "怎敌她动人", "link": "https://fanqienovel.com/page/7470142203893926936", "data": [34.1, 35.54, 40.87], "trend": 6.77, "latest": 40.9, "wordNumber": 551024, "creationStatus": 0, "desc": "【已签实体出版】\n【重生校园+救赎+男暗恋+双洁HE】\n明媚嗲精 x 偏执隐忍\n*\n外人眼里，许霁青清冷斯文，是身家显赫的耀眼新贵，靠自己改命的寒门奇迹，能在最狼狈的时候嫁给他，是苏夏八辈子修来的好命。\n只有苏夏知道，许霁青是个疯子。\n她不喜欢他湿沉的眼神，不喜欢他无处不在的掌控欲，更怕那双苍白变形的手。\n直到许霁青为保护她死了。\n百亿遗产到手，苏夏却开始失眠，每回惊醒，梦里都是许霁青最后那声“夏夏”，和那张鲜血浸透的俊脸。\n*\n一睁眼，重回高二。\n苏夏家庭美满，还是那个众星捧月的小公主。\n许霁青刚转校到临中，旧球鞋刷洗到泛白，眉眼冷淡。\n他过得很苦，但还看不出日后的偏执。\n无人愿意和他同桌，她攥紧了裙摆，拉开身边的椅子，鼓起勇气对他笑。\n我的亡夫，这辈子好好活着。\n长大之后，\n不许再缠着我了哦。\n*\nTIPS:\n1.女主重生，两世都是双洁；\n2.男主的手后面会好；\n3.无雌竞，女主会慢慢改变，男主起始好感拉满爱到发疯；\n4.有关“亡夫哥为什么会爱上女主”和其他前世内容，正文后已更新5w+亡夫哥专场番外，从if线风雪故人归开始，书信集结束，请务必不要错过", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "双洁", "位尊权重"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [55.03, 57.33, 59.08], "trend": 4.05, "latest": 59.1, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [59.82, 60.42, 61.67], "trend": 1.85, "latest": 61.7, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，冷拽死对头被我亲爽了", "fullTitle": "重生后，冷拽死对头被我亲爽了", "link": "https://fanqienovel.com/page/7639375832493853720", "data": [45.27, 45.96, 46.61], "trend": 1.34, "latest": 46.6, "wordNumber": 363039, "creationStatus": 1, "desc": "【明媚小仙女X冷拽太子爷丨大学校园+同居+系统+死对头】\n卢筱筱在大四那年遭人毒害身亡。\n再睁眼，她重生到大一，还被迫绑定了系统。\n必须和死对头邵恩辞完成100件羞耻社死的任务，\n才能彻底复活。\n［任务1：篮球赛结束，当众强吻他。］\n卢筱筱：……老天奶为何如此整我！\n-\n邵恩辞，智商天花板，AI领域天才，家世显赫。\n191浓颜帅哥，薄肌冷白皮，爱滑板爱运动。\n高中起就是她的死对头，两人见面必掐。\n因为一条百科乌龙，众人都以为他们是一对。\n昨天她火速避嫌：“我谈百合都不会跟他有一腿。”\n没想到今天，众人便看见她在篮球场当众强吻他，\n并且嗲着嗓音说：“哥哥，你唇好甜。”\n众人傻眼：？\n-\n某晚卢筱筱为了完成任务，厚着脸皮住进他家里。\n偷看他洗澡，半夜爬上他的床，趁他睡觉摸他腹肌，\n这些邵恩辞都能忍。\n唯独接受不了她一个女孩子偷藏他裤衩这件事。\n急！暗恋对象成了变态怎么办？\n-\n后来兄弟邱柏野得知真相，提醒他：\n“她只是为了完成任务才接近你，你被骗财骗色了！”\n邵恩辞：“玩我都不介意了，还在乎被骗吗？”\n邱柏野：……哥们，你没救了。", "tags": ["青春甜宠", "现代言情", "校园", "系统", "学霸", "暗恋"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [20.63, 21.3, 21.95], "trend": 1.32, "latest": 22.0, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [16.94, 17.2, 17.34], "trend": 0.4, "latest": 17.3, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [52.13, 52.2, 52.43], "trend": 0.3, "latest": 52.4, "wordNumber": 841738, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "满门反派疯批，唯有师妹逗比", "fullTitle": "满门反派疯批，唯有师妹逗比", "link": "https://fanqienovel.com/page/7134523177480227854", "data": [63.25, 66.27, 68.82], "trend": 5.57, "latest": 68.8, "wordNumber": 3537452, "creationStatus": 0, "desc": "一朝穿书，叶灵泷成了修仙文里的恶毒炮灰女配，资质奇差还在修仙大会上胁迫女主带她进第一宗门，入门后处处跟女主作对最后惨死收场。\n　　为了快乐苟活，叶灵泷当场放弃胁迫女主，扭头就进了修真界最差的门派，这恶毒女配她不当了！\n　　本以为进个最差宗门能吃喝玩乐苟日子当咸鱼，谁知这最差的宗门里全员都是疯批反派，随时走在黑化边缘，准备给女主挨个送头。\n　　啊这…她们门派要是马上要团灭了吗？不慌，这题她会。\n　　大师兄满门被灭后复仇杀穿整个修真界最终被女主打败？小师妹：师兄我知道她什么修为什么功法多少秘宝，快，卷起来！咱不能输！\n　　二师兄身藏妖族血脉隐忍躲藏却被人发现群起而诛之？小师妹：躲什么？牛逼血脉两界通杀，去征服两界奉你为主啊！我知道两界传送门在哪！\n　　三师兄金丹破碎经脉全废走火入魔后成为联手歼灭的大魔头？小师妹：我知道哪里可以重练金丹重塑经脉，稳住，这波团战我们能赢！\n　　四师兄苦恋女主爱而不得为情所伤最后黑化被男主所杀？小师妹：你这样不行，舔狗一号送法宝，舔狗二号签契约，你这舔狗N号不如去送个命？\n　　他们这哭哭唧唧柔柔弱弱又煽风点火疯言疯言的小师妹，是猴子请来的逗比吧？", "tags": ["玄幻言情", "古代言情", "穿越", "反派", "穿书", "异世穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [28.49, 30.47, 33.13], "trend": 4.64, "latest": 33.1, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹五界第一，天才见她都破防", "fullTitle": "小师妹五界第一，天才见她都破防", "link": "https://fanqienovel.com/page/7587720446674471998", "data": [21.53, 23.28, 24.76], "trend": 3.22, "latest": 24.8, "wordNumber": 338580, "creationStatus": 1, "desc": "【大女主、爽文、群像、无cp】\n现代人有没有灵根？\n云鸢表示，有的！还很牛！\n*\n一朝身穿到修仙界，觉醒极品金灵根，还是先天剑骨，被顶级宗门追着抢。\n这都不算什么。\n云鸢没想到，自己在现代对动物的亲和力，在修仙界还能用！\n*\n异兽大杀四方，各宗门弟子出去历练。\n“那是杀伤力极高的黑背烈齿狼！”\n云鸢：黑背德牧？\n“那是会吐人言迷惑人心的凤鸟！”\n云鸢：小玄凤？？\n“那是雪地最难惹的蓝眸飓风狼！”\n云鸢：二哈？？？\n看着云鸢轻松收下一堆灵兽，并且还称兄道弟，还能契约！\n同辈弟子：大变态！！\n云鸢：变态？\n要不你们去瞧瞧她的几个师兄师姐？\n*\n加入飞流峰后。\n云鸢才知道，变态是何物。\n大师姐最强武力，专修无情道，一剑一负心人。\n二师兄笑眯眯的，整日睡不醒，像是个废物，实则下手最狠。\n三师兄清冷无双，洁癖严重，一弄脏衣服修为暴增。\n四师兄长的多美，说话就多脏，出手就多阴。\n小师姐没她腰高，却最有钱，擅长拿灵石砸人！\n*\n直到飞升后，云鸢才发现自己的身份大有来头。\n她穿的不是修仙界吗？\n这魔法又是哪儿来的！\n这突然冒出的爹妈又是怎么回事儿", "tags": ["玄幻言情", "幻想言情", "穿越", "无CP", "今穿古", "群像"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "成为男主剑灵后，全宗门追悔莫及", "fullTitle": "成为男主剑灵后，全宗门追悔莫及", "link": "https://fanqienovel.com/page/7482706423281896473", "data": [32.1, 33.29, 33.92], "trend": 1.82, "latest": 33.9, "wordNumber": 1265723, "creationStatus": 0, "desc": "原书名：《成为男主剑灵后，全宗门追悔莫及》\n小师妹抢我灵根，夺我机缘，于是我一剑废了她。\n扶兮乃倚剑宗大师姐，修炼刻苦，同门敬仰，可这一切却在师尊带回小师妹后变了。\n敬重的师尊为了小师妹不顾宗门数次涉险，二师弟为了不让小师妹感到自卑对她下慢性毒药，三师弟在她奄奄一息时提议将她的灵根送给小师妹......\n系统告诉她，这一切都是因为这个世界是个龙傲天暗黑升级流小说，而她只是活在传闻中的炮灰。\n扶兮不甘心，她拖着残缺的身体进入宗门禁地深处，投入到上古神剑横苍剑之中成为剑灵，并辗转找到了未来的龙傲天男主。\n此时的男主还未黑化成未来神挡杀神，魔挡弑魔踏着鲜血登上天梯的龙傲天，于是扶兮以剑灵之身潜伏在他身边，待他踏上修仙之路时重新杀回倚剑宗复仇。\n只是，扶兮看着还是个孩子的男主犯了难，剑灵要如何养孩子？\n后来——\n龙傲天：他们都说剑修的剑就是自己的老婆，所以嗨，老婆！\n扶兮：.........\n哪一步出错了？\n【女频言情+复仇火葬场1v1+前期男主视角+女主剑灵】", "tags": ["玄幻言情", "古代言情", "系统", "幻想言情", "1v1", "剑修"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [29.63, 29.93, 30.15], "trend": 0.52, "latest": 30.2, "wordNumber": 1010252, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [43.0, 43.35, 43.08], "trend": 0.08, "latest": 43.1, "wordNumber": 3275821, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [24.34, 24.42, 24.35], "trend": 0.01, "latest": 24.3, "wordNumber": 900036, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "星际校园：五人小队向前冲", "fullTitle": "星际校园：五人小队向前冲", "link": "https://fanqienovel.com/page/7363859366488837182", "data": [31.84, 34.28, 36.32], "trend": 4.49, "latest": 36.3, "wordNumber": 1169247, "creationStatus": 0, "desc": "【军校+机甲+无cp+成长向+群像+轻幽默+五人团队+团魂】\n人生的前十七年，姜林的目标是考上明德机械工程系，成为未来高薪机甲师，但一场突如其来的变故让她前往黎明军校，走上了一条成为超强单兵的道路。\n三校联赛、实战演练、星际战斗……\n多年之后，五名意气风发的少年并肩站在废墟之上，成为三校当之无愧的最强小队。\n“加入黎明军校，是为了今日夺冠吗？”\n“不是，是为了以血肉之躯，再造黎明。”\n【小队介绍】\n姜林（女），单兵，182，敏捷型战斗机甲“擎风”，擅长近身作战，独狼，“一剑不行？多砍几剑总会好的”；\n权雅（女），后勤，165，不会做好吃饭饭的医疗兵，不是好后勤，“你的命，我用一碗佛跳墙买下了”；\n康尧（男），机甲师，175，看到人就烦但是会冷脸做机甲，说话难听天赋极高，皮脆容易被打死，“难听？更难听的话我还没说出口呢”；\n江鹰（男），单兵，191，中火力战斗机甲“重影”，擅长枪械炮弹，表面冷酷壮汉，实则腼腆饭桶，“你这事儿我办不了，请我吃饭？哦，那可以。”\n杨星（女），指挥，172，你有你的精神力，我有我的战术打法，赛场之上，“仅我一人，就可当千军万马”", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "星际", "无CP", "搞笑轻松", "群像"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成男主的拜金前女友被亲懵了", "fullTitle": "穿成男主的拜金前女友被亲懵了", "link": "https://fanqienovel.com/page/7631009218320944152", "data": [24.83, 26.64, 28.13], "trend": 3.3, "latest": 28.1, "wordNumber": 424529, "creationStatus": 0, "desc": "（评分刚出，后面会涨）【甜宠+双洁+1v1】\n姜棠穿进了一本校园文，成为男主的拜金前女友。\n男主是物理学天才，家世顶尖，清冷禁欲，谈恋爱都是柏拉图模式，妥妥的高岭之花。\n姜棠穿进来后觉得剧情好眼熟，这不是她学物理学的发疯的好闺闺写的文吗？\n当时好闺闺问姜棠要不要客串角色。\n姜棠说要，她要做男主的拜金前女友，男主完全不爱她，一个月只见一面，但副卡随便刷，分手还会有九位数的巨额分手费。\n好闺闺大手一挥同意了。\n姜棠现在就是这位前女友，她需要维持拜金值，每天狂刷男主的卡，等待分手后拿到巨额分手费。\n但是男主说好的柏拉图呢？\n第一次约会刚牵手就搂腰，第三次约会要抱抱，第五次约会竟然想亲亲？\n姜棠都不敢想他以后还想做什么。\n她觉得一定是她维持人设的方式不对。\n她努力娇蛮任性，每天99+消息轰炸，男主总该对她厌烦了吧？\n男主看她的眼神怎么越来越深了。\n女主终于出场。\n姜棠主动提分手，清冷禁欲的男主开始发疯，她被抱着亲懵了。", "tags": ["现言脑洞", "现代言情", "系统", "学霸", "甜宠", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成兽世恶雌：末世强者沉迷打怪", "fullTitle": "穿成兽世恶雌：末世强者沉迷打怪", "link": "https://fanqienovel.com/page/7525723826827578430", "data": [33.65, 34.68, 35.2], "trend": 1.54, "latest": 35.2, "wordNumber": 1095822, "creationStatus": 0, "desc": "【番外更新中】\n　　兽世１ｖN＋雄竞＋雌性少＋雄性多＋团宠＋空间＋女主植物系异能\n\n　　乔然带着植物系异能和物资空间，穿进星际兽人游戏世界。\n\n　　好消息：系统匹配六位兽夫\n\n　　坏消息：他们正在策划离婚后如何嘎了她。\n\n　　乔然：…\n\n     后来冷峻的狼王，矜贵的麒麟，桀骜的游隼兽王虔诚温顺地跪在她的脚下，苦苦哀求：只要不离婚，怎样都行。\n\n       想要离婚不是你们吗？现在跪什么？    \n\n甜爽，轻松，搞笑", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "空间", "兽世"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成财阀太子爷的作精前女友", "fullTitle": "穿成财阀太子爷的作精前女友", "link": "https://fanqienovel.com/page/7641635688978336792", "data": [77.04, 77.01, 78.34], "trend": 1.31, "latest": 78.3, "wordNumber": 315876, "creationStatus": 0, "desc": "「腹黑男人X娇气包｜双洁、甜宠」\n穿成财阀校园文里的恶毒女配，柯眠棠接到的任务是：半年内扮演好男主的女朋友，稳定他的反社会情绪，等原书女主出场后，然后拿钱走人，功成身退。\n男主荣涉，星云集团太子爷，白名单榜首。\n表面温润如玉，骨子里偏执病态，占有欲强到令人发指。\n柯眠棠每天战战兢兢地演着娇纵女友，生怕露馅。\n可来的第一天，她就被男主亲哭了。\n系统：“问题不大，别慌。”\n她信了。\n然而男主看她的眼神越来越不对劲，并非原著里对恶毒女配的冷漠，倒像是让人后背发凉的痴迷。\n系统又说：“别怕，小说结局是男主和原书女主在一起，既定结局。”\n她放下心来。\n后来，原书女主终于登场。\n但男主对那位真命天女兴趣淡淡，反倒对前女友兴致盎然。\n柯眠棠瑟瑟发抖：说好的原著里他会爱上原书女主呢？\n-\n终于，任务结束前一晚，她满心欢喜一亿到账。\n结果系统突然失联。\n重启后，终端程序直接被篡改，从“剧情纠正”变成了 自救”模式，盘算着等崽们的亲爹回来，立刻离婚跑路！\n可后来——\n没想到她一不小心自己变成了星际圣雌性，还觉醒了SSSS级精神力和无边际空间。\n崽崽们围着她喊“雌母”，全星际大佬争相追捧。\n只有那位名义上的兽夫，被冷落在一旁。\n崽崽们眼泪汪汪：“雌母，别不要爹爹…”\n烬野：“…”\n鹿天骄：“明明不是我干的，这烂摊子我不接！”\n然而，随着记忆复苏，她逐渐发现——事情好像不对劲…\n天塌了，原主竟是我自己！\n当初把烬野霸王硬上弓的，好像…还真是她。", "tags": ["现言脑洞", "现代言情", "穿越", "星际", "双洁", "1v1"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世学院，匹配顶级兽人", "fullTitle": "穿越兽世学院，匹配顶级兽人", "link": "https://fanqienovel.com/page/7589654180378201150", "data": [17.52, 17.58, 17.66], "trend": 0.15, "latest": 17.7, "wordNumber": 910807, "creationStatus": 1, "desc": "【我流兽世+万人迷微升级流+毛绒控女主横扫顶级兽人+1vN男全c】\n（补充：全文未完，请勿臆断剧情。没有人死，全员包饺子）\n　　被羊撞后穿进兽人世界，匹配到顶级兽人。\n　　身为动物爱好者的苏徉惊喜连连，开始享受幸福人生。\n　　这是什么？毛茸茸！摸一下。\n　　这是什么？滑溜溜！摸一下。\n　　……变成人？\n　　算了，也摸一下！\n　　-\n　　兽人把自己的另一半称为【驯养师】。\n　　即为能够驯服他们、抚慰他们的人。\n　　是兽人们一生渴求的存在。\n　　但不是所有兽人都相信自己能够拥有，越高等级越是如此。\n　　直到那个人出现——\n　　冷静自持的会长弯唇轻笑：你可以随意使用我。\n　　矜贵傲娇的小王子面红耳赤：我可以喵喵叫。\n　　孤僻怕生的毒蛇，表演蛇信打结。\n　　还有热情开朗的狗狗、阴郁蝴蝶……\n排雷：\n非大女主爽文，多人转恋爱，正常畸形都有，上桌与否看后续表现，无脑玛丽苏没有内涵没有立意。", "tags": ["现言脑洞", "现代言情", "校园", "幻想言情", "穿越"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "山庄通异界古人来打工", "fullTitle": "山庄通异界古人来打工", "link": "https://fanqienovel.com/page/7547660999843662910", "data": [16.52, 16.8, 16.63], "trend": 0.11, "latest": 16.6, "wordNumber": 1642614, "creationStatus": 1, "desc": "简星夏大学毕业，继承了姥姥的农庄。\n只是这农庄地处深山，周遭杂草丛生，房屋四处漏水。\n简星夏拔草拔得怀疑人生，哀嚎：能不能来个人帮我拔草，修屋顶啊！\n下一秒，深山里钻出了个十二岁的古代小姑娘：拔草？小意思，野菜给我就行。\n面相五十多的瘦老头挑着扁担也来了：修屋顶砌灶台都不在话下，就是不知这个“水泥瓷砖”是何物。\n农庄庄主简星夏，费心心思按照“工资标准”给临时工们搭配报酬。\n几毛钱的感冒药，几块钱的红砂糖，还有农庄自产不要钱的野菜和野果，让临时工们满意而归。\n系统哐哐发奖：\n临时工满意度满分，奖励太阳能发电系统一套！\n临时工工作岗位增加，奖励神奇种子一包！\n临时工雇佣次数达标，解锁长期工岗位一个！\n简星夏：小小农庄拿下，大大山庄出发！", "tags": ["现言脑洞", "现代言情", "乡村", "系统"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [26.66, 29.6, 32.97], "trend": 6.31, "latest": 33.0, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [28.64, 29.28, 32.94], "trend": 4.29, "latest": 32.9, "wordNumber": 500294, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [24.94, 25.36, 25.69], "trend": 0.75, "latest": 25.7, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [24.63, 24.79, 24.9], "trend": 0.27, "latest": 24.9, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新的人生，结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "中奖10个亿的护士躺平生活", "fullTitle": "中奖10个亿的护士躺平生活", "link": "https://fanqienovel.com/page/7653831326541286462", "data": [38.53, 39.72, 40.57], "trend": 2.04, "latest": 40.6, "wordNumber": 418938, "creationStatus": 1, "desc": "沈南星三十七岁，在三甲医院急诊科做了十二年护士。她曾以为和医生丈夫一起进医院、结婚生子、买房还贷，就是普通人最稳妥的人生。可十二年过去，她熬过夜班，生下两个儿子，撑起家里家外，却在医院改革中被裁，失去工作后，婆婆态度骤变，丈夫沉默回避。最终，离婚了，那天雨很大，她路过一家彩票店，随手买下几注彩票，所有人都以为沈南星已经输了。直到她发现，自己中了十个亿........", "tags": ["职场婚恋", "现代言情", "萌宝", "家庭", "职场", "医生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被闺蜜骗到缅北赚快钱", "fullTitle": "被闺蜜骗到缅北赚快钱", "link": "https://fanqienovel.com/page/7566096846053985304", "data": [24.06, 25.42, 25.66], "trend": 1.6, "latest": 25.7, "wordNumber": 678934, "creationStatus": 0, "desc": "写下这段经历，就是为了告诫所有人。\n有句话说的好，你不会被骗，是因为没有遇到适合你的骗局。\n周程程本来可以有一个美好的未来，可是因为事业和家庭的双重打击让她走上了一条不归路，相信了那个曾经最信任的人，毁了自己的一生。\n被推入人间地狱，在那里她目睹了人性的扭曲。\n那些为精心定制的骗局，没有一个人能够从中逃出来。\n也许没人相信2023年了还有人会被骗，那是因为你没有遇到适合你的骗局。\n奉劝所有人不要相信国外的高薪招聘。", "tags": ["职场婚恋", "现代言情", "第一人称"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真千金她从军了", "fullTitle": "真千金她从军了", "link": "https://fanqienovel.com/page/7634576516210232345", "data": [12.45, 13.34, 13.69], "trend": 1.23, "latest": 13.7, "wordNumber": 316699, "creationStatus": 1, "desc": "【女频➕军旅➕女强➕无CP➕成长➕大力】\n祁今越死了！死在精神病院洁白的病床上。鲜血淌满床单，她的手里还握着一把生锈的剪刀。\n祁今越又活了！白幡飘动的灵堂上，养父母的音容笑貌在脑海里一帧一帧回放。\n她还是一个无依无靠的可怜虫！！\n车轮不断向前，再一次站上那片熟悉的土地，心境却是大不相同了。\n这辈子，她走上了一条与前世截然相反的道路——参军！\n入伍前夕，陆家沸腾，愤怒的父母、看好戏的大哥、假惺惺的“姐妹”、拍手叫好的小弟，祁今越将他们脸上的表情牢牢刻进心底，却没有生出一丝波澜。\n丛林、草地、大海、雪山、沼泽都留下她的足迹，汗水腥咸、血液粘稠都不能阻挡她的脚步。\n若干年后，祁今越平步青云，接受最高程度的奖赏，陆家父母激动上前，眼中迸射出贪婪的光芒。\n“孩子，你辛苦了，我们……”\n“我们认识吗?”祁今越脸上没有任何表情。", "tags": ["职场婚恋", "现代言情", "重生", "豪门世家", "前世今生", "真假千金"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "婚牢", "fullTitle": "婚牢", "link": "https://fanqienovel.com/page/1629874566288396", "data": [18.36, 18.8, 19.18], "trend": 0.82, "latest": 19.2, "wordNumber": 923610, "creationStatus": 0, "desc": "三年自由恋爱两年和谐婚姻，五年的青春止步在一纸不孕不育的检查报告里，遭受双重背叛的我万万没想到，离婚不到两个月，一条不起眼的婚约，让我本就破败不堪的人生陷入了绝境......", "tags": ["职场婚恋", "都市生活", "家庭"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "闪婚刑警老公，陆队人前请装不熟", "fullTitle": "闪婚刑警老公，陆队人前请装不熟", "link": "https://fanqienovel.com/page/7638577943551167550", "data": [9.12, 9.3, 9.91], "trend": 0.79, "latest": 9.9, "wordNumber": 420042, "creationStatus": 1, 82, "creationStatus": 1, "desc": "（远嫁+恶婆婆+过年不让回娘家）\n林婉怡为爱远嫁八年，一次没有回过娘家，临近过年父亲病重弟弟结婚，她提出让丈夫和女儿一起回娘家过年，却被婆家人轮番刁难。\n婆婆说：“你嫁到王家就是王家人，别一天到晚惦记娘家，给他们一百块钱，我看他们还想不想你。”\n大姑姐说：“你走了谁照顾我爸妈？谁给他们做饭洗衣服？”\n就连丈夫也唯唯诺诺：“老婆，我姐说的对，大过年的你不在村里人会笑话我们的，实在不行你打个视频跟爸妈见一面吧。”\n林婉怡愤怒不已想要带着女儿自己回去，婆婆却又藏起女儿：\n“想走自己一个人滚，不准带走我王家的子孙！”\n后来，林婉怡离了婚，带走了女儿，还把王家搅了个天翻地覆。\n王家人，终于后悔了……", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "闪婚的医学年轻大佬是前男友室友", "fullTitle": "闪婚的医学年轻大佬是前男友室友", "link": "https://fanqienovel.com/page/7615197065009712152", "data": [11.91, 12.17, 12.0], "trend": 0.09, "latest": 12.0, "wordNumber": 1019199, "creationStatus": 1, "desc": "【阴阳诡诈、清醒泼辣女主&自律全能、高智精英男主】\n【1V1+先闪婚后恋爱+暗恋成真+现实向+情有独钟】\n【蓄谋已久的一见钟情&瞬间的怦然心动】\n相亲遇到好男人要先下手，见好就收（见到好的就要收起来）。\n“你好，我是黎朝，黎明朝阳的朝。”\n江夏从来没见过这么年轻的主任医师。\n相亲的当天，黎朝调侃：“你在想什么？”\n江夏叹了口气，手肘撑在围栏上，非常遗憾地开口道：“我在愁今天民政局怎么不开门？”\n黎朝微微一笑：“今天是周六，民政局后天就开门了，我们一起？”", "tags": ["职场婚恋", "现代言情", "学霸", "先婚后爱", "闪婚", "暗恋"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "离婚后豪门前夫彻底失了控", "fullTitle": "离婚后豪门前夫彻底失了控", "link": "https://fanqienovel.com/page/7172033185033751563", "data": [8.95, 9.14, 9.01], "trend": 0.06, "latest": 9.0, "wordNumber": 2503800, "creationStatus": 0, "desc": "【双洁+双向奔赴+先婚后爱+追妻火葬场】\n时漾年少时开始喜欢的傅景川，那时他是天之骄子，她只是不起眼的转学生，两人之间像隔着鸿沟。\n多年后同学聚会上重逢，他坐她旁边，席上两人几乎没什么交流。\n聚会结束，他顺路送她回家。\n那天晚上，两人不小心擦枪走了火。\n她意外怀孕，他问她愿不愿意结婚，她说好。\n没有婚礼，也没有祝福，两人婚后的生活像搭伙过日子，平淡且无趣。\n最终，时漾提了离婚，“傅景川，我们离婚吧。”\n他只是静静垂眸看她，然后轻轻点头，“好！”\n所有人都以为傅景川不爱时漾，包括时漾自己，直到那天，在商场熙熙攘攘的人群里，两人不经意间擦肩而过，傅景川突然一把拽住了她手臂，时漾看到了他黑眸里掀起的狂风巨浪。\n【日常风，男主爱而不自知，前期火葬场，后期甜宠（会有曲折），细腻慢热，徐徐讲故事】", "tags": ["职场婚恋", "现代言情", "总裁", "甜宠", "豪门世家", "双向奔赴", "暗恋", "1v1", "追妻"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "荣耀失格", "fullTitle": "荣耀失格", "link": "https://fanqienovel.com/page/7549845419849698366", ension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心理分析者", "fullTitle": "心理分析者", "link": "https://fanqienovel.com/page/7412616178163534873", "data": [4.27, 4.3, 4.37], "trend": 0.1, "latest": 4.4, "wordNumber": 1016312, "creationStatus": 0, "desc": "病娇犯罪心理专家 VS 面瘫刑警队长\n原书名：《心理分析者》\n控制大脑的菌丝、人形蚁窝、邪恶吃播……离奇的案件折射出凶手扭曲的精神世界。\n基因给犯罪上膛，心理瞄准目标，环境扣动扳机。\n凝视深渊的人，也要警惕深渊。\n江宁希:我想跳进深渊体验一下。\n深渊:你不要过来啊！\n林司言拽住她：欢迎你先跳进我的世界。\n——\n江宁希见到帅气但面瘫的林司言时，格外兴奋。\n这竟然是个没有表情的男人。\n江宁希盯着林队长的瞳孔:你眼睛里的情绪很丰富。但你现在好像有点不耐烦。为什么呢?\n林司言:……你靠得太近了。\n表白时\n江宁希:没有遇到物理刺激，但你的瞳孔突然放大了，你在害怕我吗?\n林司言:没有。\n江宁希:那么就是另一种可能了。你对我产生了欲望。\n江宁希惊讶地发现，原来面瘫也会脸红啊。\n——\n推荐我的旧文《我一个自闭症会亿点剖尸怎么了》", "tags": ["女频悬疑", "悬疑恋爱", "悬疑", "推理", "病娇", "破案"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "起猛了，夫人她好像手撕厉鬼了！", "fullTitle": "起猛了，夫人她好像手撕厉鬼了！", "link": "https://fanqienovel.com/page/7468317647302560793", "data": [3.81, 3.83, 3.89], "trend": 0.08, "latest": 3.9, "wordNumber": 1342411, "creationStatus": 0, "desc": "【玄学➕沙雕微恐➕抓鬼➕灵异➕算命➕爽文】\n\n    林家丢了二十年的小女儿找回来了，听说是在道观里长大的。\n\n    下山第一天，搭手给方家大少把出来了喜脉。\n\n    下山第二天，掐指一算，说李总被老婆戴了绿帽子，儿子不是自己的。\n\n    下山第四天，去方家公司，开水浇死了发财树，一拳献祭了程序员，并且从五楼跳下去还毫发无伤。\n\n    下山第n天，掐指一算，说从苏家千金肚子里生出来的宝贝儿子是上门女婿和外面野女人的。\n\n    乱了乱了，全乱套了。\n\n    全京城大佬都跪着求她别算了。\n\n    众人一个接一个的去方家那位掌权人面前告状，方砚珩看着一脸满足吃小蛋糕的林知知，斩钉截铁的说对方在造谣。\n\n    直到林知知当他的面轻轻松松将一只厉鬼一拳打的灰飞湮灭。\n\n    方砚珩:起猛了，好像看到老婆手撕厉鬼了！\n\n    怎么办，急，在线等。", "tags": ["女频悬疑", "悬疑", "灵异", "搞笑轻松", "捉鬼"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纸扎店老板娘她是玄门大佬", "fullTitle": "纸扎店老板娘她是玄门大佬", "link": "https://fanqienovel.com/page/7483682988459314201", "data": [4.39, 4.46, 4.46], "trend": 0.07, "latest": 4.5, "wordNumber": 1029724, "creationStatus": 0, "desc": "女强，无cp（单箭头的和尚有目的接近女主）+爽文+剧情流，女主非圣母，喜欢圣母型女主请绕道。\n　　女主陈昭愿纸扎店的老板。\n　　一个活了很久很久的‘人’。\n        有一部分记忆空白。\n　　琴棋书画，一概不精。\n　　贪财好色，脾气不好。\n　　能动手不喜欢哔哔赖赖。\n　　战绩\n　　古时有天地玄黄四大修仙门派。\n　　陈昭愿身为玄 mber": 313965, "creationStatus": 0, "desc": "（细水长流/日久生情/双向救赎/少年爱恋/he）\n　　逃荒北上，苏缨饿得奄奄一息，险些死在漫天风雪里。\n　　是尚书府的盲眼小公子裴修救了她，将她带入府中。\n　　两年后，皇权更迭，裴家一朝倾覆。\n　　抄家那夜，苏缨趁乱将小瞎子救走。\n　　·\n　　那年，苏缨十六岁，带着一个十五岁的盲眼少年东躲西藏讨生活。\n　　一路颠沛流离，苏缨觉得自己还够了恩情。\n　　恰逢意外，裴家兄长找上门，裴修的眼疾也好了。\n　　苏缨趁着一场大雨，跳进水里，成功死遁。\n　　·\n　　五年后，豫州。\n　　苏缨改名换姓，开了一家小药铺，生活平淡如水。\n　　那日，暮春细雨潇潇入夜。\n　　有人踏雨而来。\n　　昔日温雅斯文的小瞎子，成了威震天下的定安王。\n　　裴修心脉受损，少年白头，湿漉漉地站在门口——像是从未走出五年前的那场大雨。\n　　“再救我一次……好么？”", "tags": ["古风世情", "古代言情", "HE", "1v1", "相互救赎", "古言权谋"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死去的外室她成了国公府的表小姐", "fullTitle": "死去的外室她成了国公府的表小姐", "link": "https://fanqienovel.com/page/7579634085035772990", "data": [11.55, 11.83, 12.15], "trend": 0.61, "latest": 12.2, "wordNumber": 1108245, "creationStatus": 1, "desc": "原书名《冒认贵女》\n【古风群像】【权谋】【非重生】\n【剧情流】【有cp】【男洁】\n【群像，多主角，多视角】\n【裴庾欢是女主之一，陈蛮也是女主之一，主角栏签约后不能改，写的是本文主cp】\n皇城中有许多秘密，也有许多不甘。\n比如被污蔑入狱的商贾，比如被活埋荒山的戏子。\n她擅布局，她会唱戏。\n她将她从乱葬岗挖出，送她贵妃之女的身份。\n她为她做台前的筹码，打断仇人骨，铸成青云梯。\n\n若天生命贱者是为蝼蚁，那假金钗也可刺穿朱门骨。\n\n她们会簪着这假金钗，搅时局，拆凤阙，借东风，入青云，爬的比所有人都要高。", "tags": ["古风世情", "古代言情", "群像", "古色古香", "古言权谋"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攀高枝", "fullTitle": "攀高枝", "link": "https://fanqienovel.com/page/7402200659753176126", "data": [20.7, 21.07, 21.24], "trend": 0.55, "latest": 21.2, "wordNumber": 424158, "creationStatus": 0, "desc": "【影视版权已售】【实体书已出版】\n张知序天生拥有一切。\n显赫百年的家世、令人嫉妒的天赋、步步高升的仕途。\n但他觉得人生很无趣。\n直到这日突遭意外，他的灵魂进入了一个女人的身体。\n一个大字不识、却妄图攀上高枝变凤凰的女人。\n·\n陈宝香从乡下千里迢迢赶来上京，就是想凭着姿色嫁贵门。\n她贪慕富贵、她阿谀奉承、她拜高踩低、她唯利是图。\n结果用尽一切手段，却还是没能得到心上人的青睐。\n心灰意冷的陈宝香正打算回乡下去，谁料脑海里突然出现了一个男人的声音：\n“照我说的去做，保你飞上枝头。”\n·\n世家富贵男主魂移贪财女主身体里、与她共用躯体，替她开挂攀高枝的故事。", "tags": ["古风世情", "古言权谋", "古代言情", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越老朱后宫，我开局冒充长平", "fullTitle": "穿越老朱后宫，我开局冒充长平", "link": "https://fanqienovel.com/page/7634383946045721624", "data": [11.78, 12.18, 12.3], "trend": 0.52, "latest": 12.3, "wordNumber": 400419, "creationStatus": 1, "desc": "穿到明朝开国朱元璋的后宫，试图和马皇后宫斗？\n穿越大神是不是有点太看得起我了？\n沈微无语望苍天。\n她穿的原身还没有家族的支持，是假少爷真千金里头，悲催不受待见的真千金。\n一穷二白，前途无亮。\n沈微看看左边，看看右边，痛定思痛。\n人类是有极限的，娘娘，我不做人啦！\n“皇后娘娘！我是大明末代公主长平，求老祖宗救命！”\n忽悠马皇后，哄骗朱标朱棣，最后摆平老朱。\n嘿，谁说置之死地，不能后生？\n各位娘娘，你们继续卷后宫赛道，我要去开辟孝顺曾曾曾孙女赛道啦~", "tags": ["古风世情", "古代言情", "穿越", "今穿古", "魂穿", "古言权谋"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纨绔郡主得宠日常", "fullTitle": "纨绔郡主得宠日常", "link": "https://fanqienovel.com/page/7485232984434412569", "data": [14.94, 15.27, 15.24], "trend": 0.3, "latest": 15.2, "wordNumber": 1078911, "creationStatus": 0, "desc": "已签出版 实体书见面时间预计在年底\n不！是！言！情！小！说！无cp！\n无重生 无穿越  纯恶女 权谋文\n 纯恶人女主 权谋天下 女主真疯批 凶残 黑心肝\n看书产生的疑问要接着看书才能得到解答 \n镇北王府刁蛮跋扈的小郡主看上了河东裴家嫡子裴瑾年，将跟其有婚约的崔小姐差点淹死。\n皇帝将其赶出京城，送到白雀寺苦修赎罪。\n三年后，打了胜仗的镇北王用一身功勋换了秦金枝回京，众人皆等待看到秦金枝落魄凄惨的模样，谁知回京后的秦金枝嚣张依旧，回城当天就当街打掉皇子的牙！\n仗着帝后的宠爱竟诬陷裴瑾年父亲下毒害她，裴瑾年为救父亲退了婚约，请求皇帝赐婚。\n可一切尘埃落定之后，裴瑾年发现这嚣张跋扈的小郡主并不喜欢他。\n婚事另有隐情！\n\n所有阻拦我的人，都会拜倒在我秦金枝无与伦比的权势之下。\n\n泥潭里的人，做梦都在妄想攀上我这根金枝儿！\n\n", "tags": ["古风世情", "古言权谋", "古代言情", "公主", "团宠", "无CP", "古色古香"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越之躺不平的古代生活", "fullTitle": "穿越之躺不平的古代生活", "link": "https://fanqienovel.com/page/7491657040520039449", "data": [5.42, 5.66, 5.66], "trend": 0.24, "latest": 5.7, "wordNumber": 1906725, "creationStatus": 1, "desc": "【评分刚出，后续会涨】\n古代生活+细水长流+读书科举+专一+单女主+慢热文\n从小孤儿院长大的陈文安，半工半读大学毕业。参加工作成为牛马的一员。下班回家的路上，因打电话没有注意到闯红灯的大货车，就这样成为了穿越大军的一份子。穿越到大商王朝，历史上没有的朝代。可能老天爷可怜他，上辈子是孤儿，这辈子能体验亲情友情爱情。身世看起来也不错，\n看似风流的爹，商女软弱的娘，古灵精怪的妹妹和躺不平的他\n请看正文，简介无能～", "tags": ["古风世情", "古代言情", "穿越", "科举", "1v1", "古言权谋"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "退婚太子，我转身撩穿残疾皇叔", "fullTitle": "退婚太子，我转身撩穿残疾皇叔", "link": "https://fanqienovel.com/page/7647643987611749438", "data": [7.53, 7.61, 7.6], "trend": 0.07, "latest": 7.6, "wordNumber": 344278, "creationStatus": 1, "desc": "评分刚出会涨的\n【杀伐果断】+【绝不圣母】+【双强互宠】+【暴戾残疾皇叔】+【神医毒妃】+【换嫁退婚】+【重生虐渣】+【空间金手指】+【渣男火葬场扬骨灰】+【全员火葬场】\n 前世，她呕心沥血辅佐他登基，却被褫夺后位，抽干鲜血给他的白月光做药引！重生大婚日，渣男太子为博美人一笑，竟让她堂堂相府嫡女走侧门入府？她冷笑一声，凤冠一摔，当街拦下那辆令人闻风丧胆的马车：“皇叔，娶我！我治好你的腿，保你权倾天下！”全京城都在等她被那暴戾皇叔折磨致死。谁知没过多久，那权倾朝野的男人不仅站了起来，还将她死死扣在怀里，红着眼道：“全天下的命都给你，你给本王生个小郡主好不好？”", "tags": ["古风世情", "古代言情", "重生", "皇叔", "医术", "古言权谋"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "陛下赐婚，夫君，凑合凑合过吧！", "fullTitle": "陛下赐婚，夫君，凑合凑合过吧！", "link": "https://fanqienovel.com/page/7559930050649279512", "data": [5.57, 5.61, 5.61], "trend": 0.04, "latest": 5.6, "wordNumber": 1077817, "creationStatus": 0, "desc": "作品已完结，大家放进观看。\n古灵精怪戏精少女VS腹黑闷骚世家公子\n双洁，古言甜宠+轻松搞笑+恋爱日常+权谋\n淮南江氏，书香世家。\n江二公子光风霁月，文可夺探花，武可定天下。\n是盛京城世家眼中的香饽饽。\n二皇子岳丈池博文，一个被招安的山大王，世家权贵口中的泥腿子。\n池家幺女，除了好看，一无是处！\n德行，心胸，样样没有！\n打劫，斗鸡，一个不落！\n一纸婚约，将八竿子打不到一块儿的两人绑在一处。\n人们都说，江家二郎好好的一个白菜，到头来被池家那无才无德的猪拱了！\n池乐曦万事看的开，可事儿惹到身上自是不能忍。\n惯会人前一套，背后一套，暗地里打闷棍，脑袋里就三个字儿，不吃亏！\n世人都说池家低微。\n却不知，在这场储君之争里，池家，才是执棋者。", "tags": ["古风世情", "古代言情", "腹黑", "古灵精怪", "双洁", "搞笑轻松", "戏精", "古言权谋"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "何不同舟渡", "fullTitle": "何不同舟渡", "link": "https://fanqienovel.com/page/7289383132648705082", "data": [20.01, 20.05, 20.03], "trend": 0.01, "latest": 20.0, "wordNumber": 483628, "creationStatus": 0, "desc": "〈同名实体书全网可购〉\n【无金手指无穿越无重生，纯古言家国天下+高智商谍战权谋】\n【卧底双面间谍+成长型小女贼：一匹孤狼玩养成游戏将一只兔子养出獠牙后非要跟她双宿双飞的故事】\n她是乱世里最如草芥的一个贼，为了活命无所不用其极\n她偷了一位公子的十两纹银，殊不知他便是那位臭名昭著的叛国将军，手上沾满同胞的鲜血。\n她上蹿下跳的求生欲竟激起了他的兴致，他燃起一炷香，跟他的玩物玩了一场大逃杀的游戏。\n“我给你一炷香的时间逃跑，不要被我抓到，否则——\n万劫不复。”\n她逃到世家里，改头换面嫁人为妻，以为能安稳度过余生，一抬眼却发现他笑望着她，温柔而危险地唤了一声“嫂嫂”。\n她输了这场游戏，成了他的奴。\n他说到做到，铁着心将她扔进刀山火海滚上一遭，然后她竟发现，自己在他的锤炼下有了一身刀枪不入的铠甲，在乱世中也能凭一介女子的脊梁骨站着。\n他似过江之舟，只渡她一程，便隐入黑暗。他到底是谁？\n去时迢迢，归路遥遥。都是迷途人，何不同舟渡？\n\n【本文架空仿宋，参考 \n在末世挣扎求生三年，最终却落得惨死的姜宁，重生到末世前三天抢占先机夺回空间，开启疯狂囤货模式。\n买买买，囤囤囤，找回前世救她性命的狗子。\n磨好刀，囤好粮，挨个收拾渣男贱女们，有仇报仇有恩报恩。\n当天灾来临，她右手握刀左手撸狗，在文明丧失道德沦陷的末世中乘风破浪！", "tags": ["科幻末世", "重生", "空间", "末世", "虐渣", "囤物资", "打脸", "前世今生", "天灾"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全民求生，我成了万年老二", "fullTitle": "全民求生，我成了万年老二", "link": "https://fanqienovel.com/page/7567215449079811097", "data": [9.28, 9.6, 9.77], "trend": 0.49, "latest": 9.8, "wordNumber": 823819, "creationStatus": 0, "desc": "【无cp+囤货+无限流+天灾+有队友+美食+微恐】\n【刚开分，慢慢会长的，走过路过不要错过，进来看看吧～】\n　　作为群居动物的人类都知道，在一众榜单中，你能记住榜一，因为他可能是领头的羊，善战的狼，敏捷的豹，远见的鹰。\n　　你也能记住老六，因为他就是搅屎的棍，划水的鱼，装饭的桶，退堂的鼓。\n　　但你唯独记不住老二，这个实力不祥，名字不详，登上榜单好像只是为了凑数的存在。\n　　上一世李橙子先是成为老六在求生游戏中搅了个天翻地覆，随后成为榜一。\n　　享年25，卒！\n　　重活一世，她发誓要苟成榜二，做路人甲，做大众脸，在无人在意的角落里，默默发展。\n然而随着她来到1区，不断闯过一个又一个城市，她发现事情没有她想的那么简单，这款求生游戏的终点不是个人的生死而是种族的较量。\n有比较搞笑的部分，有比较压抑的部分，非温馨轻松向。", "tags": ["科幻末世", "重生", "末世", "美食", "无CP", "囤物资"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世降临：小尸尸我呀囤囤囤囤！", "fullTitle": "末世降临：小尸尸我呀囤囤囤囤！", "link": "https://fanqienovel.com/page/7346909068407098430", "data": [33.11, 33.41, 33.39], "trend": 0.28, "latest": 33.4, "wordNumber": 1118886, "creationStatus": 0, "desc": "【末世x囤粮x双洁x甜宠x小丧尸女主x超A输出狂魔男主】\n暴雨，台风，海啸，雷暴，地磁消失，丧尸，怪物，异能，等等等等……\n恭喜各位打开末世主线，全世界大洗牌，接下来的求生路，靠命，靠运气，靠自己。\n-\n而在别人还在疯狂尖叫的时候，作为生存狂魔的许多多已经吭哧吭哧地囤满了粮仓！\n什么肉蛋奶，什么各种罐头干粮，什么武器各类工具。\n千面魔方空间在手，所有物资通通打包全部带走！\n只是——为什么万事俱备的她开场就直接变成了阿巴阿巴的小丧尸啊喂！", "tags": ["科幻末世", "空间", "末世", "囤物资"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世菟丝花：姐夫你倒是说句话啊", "fullTitle": "末世菟丝花：姐夫你倒是说句话啊", "link": "https://fanqienovel.com/page/7601868684897815614", "data": [13.6, 13.43, 13.83], "trend": 0.23, "latest": 13.8, "wordNumber": 747820, "creationStatus": 1, "desc": "【末世+菟丝绿茶+泪失禁美人+多男主全洁+雄竞修罗场+追妻火葬场】\n女主没有异能，真普通人，但也不是真的手无缚鸡之力，她只想不劳而获罢了。\n\n function attachSoloLegend(legEl, chart, datasets) {

    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
