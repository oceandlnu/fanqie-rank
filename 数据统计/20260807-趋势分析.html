"女频悬疑", "悬疑", "悬疑恋爱", "风水秘术", "盗墓", "无CP", "同人"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我，丧尸王，九叔亲亲徒弟是也", "fullTitle": "我，丧尸王，九叔亲亲徒弟是也", "link": "https://fanqienovel.com/page/7654505159258557502", "data": [2.56, 2.63, 2.69], "trend": 0.12, "latest": 2.7, "wordNumber": 164664, "creationStatus": 1, "desc": "无cp➕九叔推第一人➕九叔护崽记➕微群像➕微恐➕兄友弟恭（鸡飞狗跳）\n（注：故事为林正英电影框架，有修改，大部分原创故事，没看电影的也不影响阅读，故事基本都会重新梳理融合）\n无外挂，无系统，不修仙，故事主要围绕九叔带着三个徒弟捉僵尸，破邪祟，以故事为主，会涉及电影原片中的风水八卦，民俗文化灵异传说，少量恐怖情节。\n拥有雷电系异能的末日丧尸王霖青青，被天雷夸嚓一下劈到了异世界，两眼一睁，发现不仅穿越了，脑子还慢慢恢复人类意识了。\n更重要的是，眼前这个拿符引天雷劈自己的一字连眉帅大叔，不是自己的童年男神林凤娇（林九英）么！\n霖青青上去就是一个蛤蟆飞扑抱住九叔的大腿，“师傅！我是你从未蒙面的亲徒弟啊！”\n林九：“？”\n秋生：“师傅你背着我们外面有别的徒弟了？”\n文才：“哇！师傅你好厉害啊，僵尸王都求你收徒啊！”", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱", "风水秘术"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：被反派养大的我成了万人迷", "fullTitle": "盗墓：被反派养大的我成了万人迷", "link": "https://fanqienovel.com/page/7650550461103082558", "data": [4.16, 4.18, 4.28], "trend": 0.12, "latest": 4.3, "wordNumber": 248335, "creationStatus": 1, "desc": "【恶女预备役+美艳笨蛋美人+微万人迷+全员暧昧向】\n巴乃深山里，养出了一株有毒的野玫瑰。\n山月长了一张稠艳秾丽的脸，行事却不择手段，毫无善恶观。\n【划重点：女主前期善恶不分（注：没有说后期就分的意思）】\n七岁那年，父母双亡。\n山月哭闹着上山，一头撞进了那个毁容怪物的怀里。\n塌肩膀最初收留她，只想把她当成最听话锋利的棋子。\n可养着养着，棋子没变聪明，他的控制欲倒先变质了。\n他用扭曲又深沉的爱，将她浇灌成快活耀眼的模样。\n直到某天，吴邪一行人来到了巴乃。\n───\n避雷：女主大美人，表面恶女切开带点笨。\nooc预警，私设如山，介意勿入。", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：迁徙的月亮", "fullTitle": "盗墓：迁徙的月亮", "link": "https://fanqienovel.com/page/7647811408016460862", "data": [1.83, 1.89, 1.93], "trend": 0.1, "latest": 1.9, "wordNumber": 255816, "creationStatus": 1, "desc": "【ooc+all向+剧情】女主武力值很高，和小哥差不多，甚至还要高一点。\n涂月踏着月色回到北京，本想在国内开启一段全新的遛狗之旅，不曾想隔壁的两人和她有着相似的经历。\n有了线索后，她不想再遛狗了，只想找出他们，把他们一窝端了。\n为了找出他们，涂月和隔壁的两人成了搭档，成为了一名地下工作者。灰头土脸跟着他们穿梭在各大地下古建筑里。\n里面的原住民非常热情，时不时地会起身和他们打招呼。\n原住民养的宠物也非常好客，经常追在他们身后，希望他们能留下来陪它们。\n……\n夹喇嘛1————\n涂月：“这是什么？”\n黑瞎子咧嘴一笑，“尸蹩。”\n涂月：？\n“哑巴不在，咱们只能跑了。”\n“我试试。”涂月拿起挂在胸前的哨子吹了下，原本还算安静的尸蹩群一下子变得躁动起来。\n黑瞎子甩掉爬到他脚上的尸蹩，“看来你的哨子对它们没用。”\n涂月松开嘴里的哨子，“跑吧。”\n两人拔腿就跑。\n……\n夹喇嘛2———\n涂月看着狭窄的盗洞，“真的要从这里走吗？”\n張起灵点头。\n确定是走，不是爬么，涂月叹气，“你走前面。”\n張起灵果断‘走’在前面。\n涂月拽了拽手上的半指手套，紧跟其后。\n自从跟他们成为地下工作者后，钻盗洞于她而言是家常便饭。\n………\n", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱", "风水秘术"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沙海：盈而不溢", "fullTitle": "沙海：盈而不溢", "link": "https://fanqienovel.com/page/7650859338046639128", "data": [2.12, 2.16, 2.2], "trend": 0.09, "latest": 2.2, "wordNumber": 164702, "creationStatus": 1, "desc": "【天才型女主all+巨量私设+鬼吹灯部分设定+文抄公情节…待补充】\n本书唯一主角姜盈。\n2年前，姜盈以为只是一次普通的重生，并且可能是重生特性，脑子也直接直接超进化了，一跃成为学神，本以为自己会这样平淡但不平凡地走下去，为果家争光。但没想到2年后上了高中刚准备大展身手，她就发现自己的同班同学有一个叫黎簇的，而他的朋友一个叫苏万一个叫杨好。她这时才明白她不止是重生，而且还是穿越！\n穿的还是某三叔写的大坑笔记！而当姜盈发现不对劲时，时间线已经来到了沙海计划的开始…\n并且吴邪好像对黎簇等人没有任何兴趣，却对她有了极大兴趣，姜盈看似面无表情很镇定实际内心os：吴邪你滚啊…我只想好好上学！\n吴邪：…现在的小孩都这么难忽悠？我居然比不过那个叫苏难的汪家人？宁愿跟王盟说话都不跟我说话是什么意思？（醋意up）\n王盟：小盈，你快走吧，我家老板就是个变态！\n苏难：小满，跟我回汪家吧。\n瞎子：我徒弟说得对！…王盟说得也对（咬牙切齿）", "tags": ["女频悬疑", "悬疑", "天才", "灵异", "同人", "悬疑恋爱"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "警官别猜了，我真的是无辜的啊", "fullTitle": "警官别猜了，我真的是无辜的啊", "link": "https://fanqienovel.com/page/7658369592892345369", "data": [1.66, 1.68, 1.73], "trend": 0.07, "latest": 1.7, "wordNumber": 79221, "creationStatus": 1, "desc": "叶岚留学归来准备入警队报道，结果成为凶案嫌疑人。\n为洗脱嫌疑，她冷静的剖析事实，提出自己或许是凶手的目标，可以作为诱饵。\n帮助警队抓获杀人凶手，警察问她以前干什么的，叶岚：可能上辈子杀手。\n警察：……\n可能这两个字很精髓。\n后来警察成同事，探案天赋一览无余，同事差些哭了，原因无她，这人脑回路不正常。\n好消息：破案速度快了。\n坏消息：叶法医是个精神病。\n＊＊\n叶岚破案时的脑子和日常生活的脑子是两个极端，很奇怪她为什么骑自行车是扛着走的。\n总会很认真的说：因为不会骑。\n当杭越问她：如果是汽车，或者是公交呢。\n叶岚就会用你不懂的神色开口：你是不是傻，那当然是找人载着走。\n被鄙视智商的杭越：……\n破案上，二人搭配和谐，日常上，杭越时常被叶岚奇怪脑回路牵着走。\n警员总会和她聊天，叶岚偶尔嘴毒，警员就会吐槽，她估计会孤独终老，嘴毒成这样，会把人毒死的。\n直到某一天，看见叶岚和杭越手牵手。警员：霹雳女魔头好像和杭队在一起了！\n这算是以毒攻毒吗？！\n成长性女主VS嘴硬心软刑警队长。\n【探案，尸体，法医，凶手，悬疑，凶手，刑侦，高智商犯罪，连环杀人案，推理，反转，默契，探案，1V1，反派，群像，", "tags": ["女频悬疑", "悬疑", "推理", "破案", "1v1", "悬疑恋爱"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假千金偷命格，全家跪求回头", "fullTitle": "假千金偷命格，全家跪求回头", "link": "https://fanqienovel.com/page/7640519954181147673", "data": [1.63, 1.66, 1.69], "trend": 0.06, "latest": 1.7, "wordNumber": 213628, "creationStatus": 0, "desc": "沈雾替沈家挡灾十八年，却被假千金夺走命牌，生日宴上还被逼献血救人。她当众剪断亲缘线，回到外婆留下的白纸铺，重新开门接命债。从此沈家祖宅命牌尽裂，假千金遭反噬，亲生父母跪求她回家。沈雾只低头扎纸，笑着让他们先把欠她的命还清。", "tags": ["女频悬疑", "悬疑", "灵异", "打脸", "悬疑恋爱", "风水秘术"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：大哥，要成为我的信徒吗？", "fullTitle": "盗墓：大哥，要成为我的信徒吗？", "link": "https://fanqienovel.com/page/7469016608720030744", "data": [2.78, 2.77, 2.8], "trend": 0.02, "latest": 2.8, "wordNumber": 125451, "creationStatus": 1, "desc": "（吳二白女儿+原创cp+与主角团亲情友情向+自然力量+微团宠）\n为了稳定天地间的力量变化，维持生灵间的平衡，自然与天道达成共识，自然选择人类成为她的使者，履行维护这个世界的平衡，世代自然使者就这么履行着自己的职责。\n\n直到这代使者——天道进行了选择，祂察觉到了这个世界这一代的气运者命运轨迹发生了变化，有一股力量插手了他们原本的轨迹，于是一个和他们有密切联系的孩子被祂选中。\n\n她顺应天道出生，却被阴谋笼罩，一张大网将她一步步推向九门与汪家的局，眼睁睁的看着疼爱自己的哥哥一步步走向深渊，父亲越来越多的白发。\n\n吴盎然逗弄着指尖求抚摸的藤曼，你们是在挑衅恢复力量的自然使者吗？\n\n“哥，要不你拜拜我吧，你太邪门了。”\n“我要不给你上柱香？”吳邪咬牙切齿的发问。\n“你要成为我的信徒？也可以啊！” \n“等等，你们一块过来干嘛？我只要我哥一个信徒啊！”\n\n吳盎然表示：她哥真的不是一般人能保的，太邪门了。\n（拯救意难平，全都好好的。）", "tags": ["女频悬疑", "悬疑", "盗墓", "灵异", "悬疑恋爱"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "南部档案：我真没招了", "fullTitle": "南部档案：我真没招了", "link": "https://fanqienovel.com/page/7653395831701130302", "data": [4.11, 4.08, 4.11], "trend": 0.01, "latest": 4.1, "wordNumber": 151784, "creationStatus": 1, "desc": "【南部档案+OOC+原创女主+只管吃不管埋】\n盘花海礁案，这个只了解过只言片语的故事，真实的在张南絮的面前上演了。\n老天鹅，她只听过南部档案这四个字啊！\n顶多知道张海侠死在了南洋。\n别的？她真的求求了，她真的不知道啊。\n*\n张海盐和张海侠在调查盘花海礁案的时候，发现了一个被张瑞朴藏起来的张家女。\n而这个张家女，跟他们一起经历了一切后回到了马六甲。\n这个张家女一问三不知，而厦门那边失联了。\n所以这个叫张海絮的人，到底身份是什么，没有查到。\n他们也不知道，厦门档案馆内的资料，也被篡改了。\n鉴于张瑞朴之前是元老级别的人，张南絮的身份彻底成为了谜团。\n*\n张海侠的温柔，张海盐的逗比，张南絮只想把张海盐的嘴缝上，就你有嘴是吧？\n莫云高的事情发生。\n*\n山海不相见，见之必亡。\n亡不亡的，张南絮只想说：别闹了，你们谁能有我这个穿越来的知道的剧情多？\n这也就是不知道南部档案的剧情，不然都不会变成这样的。\n但是话说回来了，你们老是追着我干什么？\n张海侠：阿絮，你之前说的话还算数吗？\n张海盐：我俩是兄弟，你不能厚此薄彼啊，我也要跟你睡。\n张启灵：？\n张海琪：我两个儿子都不错，考虑一下？", "tags": ["女频悬疑", "悬疑", "穿越", "灵异", "同人", "悬疑恋爱"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "穿成年代男主的恶毒原配", "fullTitle": "穿成年代男主的恶毒原配", "link": "https://fanqienovel.com/page/7647072153879186494", "data": [4.72, 4.84, 5.78], "trend": 1.07, "latest": 5.8, "wordNumber": 265544, "creationStatus": 1, "desc": "宝宝们刚出评分\n萧玖染睡醒之后就发现自己待在陌生的地方，  当是她在想到底是哪个朋友的恶作剧的时候，突然脑袋一阵刺痛，传来了一大股陌生的记忆。\n       萧玖染从记忆中知道了她现在这个情况是穿越，这个身体女孩高中的时候喜欢上一个男生，高中毕业终于打算鼓起勇气表白。\n       但是意外来的太快，一次跟人来镇上碰到了一个出任务的军官，这个军官中了药把她当成解药。\n       这具身体的人十分的崩溃，处于这个年代还发生了这种事情，加上父母他们的劝阻最后嫁给了这个军官。\n       嫁人之后，这个身体女孩过的十分不幸福，嫁的军官每个月除了拿钱什么都不管，婆婆还会时不时来刁难她。\n       萧玖染现在明白了，她这是改上了穿越潮流，她从前也是听过朋友说过几本小说。\n       萧玖染了解完现在能处境，她并不打算继续和这个军官生活。萧玖染打算提出离婚，如果现在这个身体生的小孩韩旭辰要留下来她就不带走，不要的话她就把这个小孩一起带走。\n       离婚后萧玖染打算考大学考研究生，去美国留学博士，留学的时候在美国炒股，毕业之后带着赚的钱回国做投资。", "tags": ["年代", "现代言情", "穿越", "空间", "魂穿", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [6.98, 7.25, 7.63], "trend": 0.65, "latest": 7.6, "wordNumber": 187971, "creationStatus": 1, "desc": "（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长你胖村姑媳妇带龙凤胎随军了", "fullTitle": "首长你胖村姑媳妇带龙凤胎随军了", "link": "https://fanqienovel.com/page/7648944914255858713", "data": [5.28, 5.45, 5.7], "trend": 0.41, "latest": 5.7, "wordNumber": 252071, "creationStatus": 1, "desc": "【觉醒＋军婚＋养娃＋变瘦变美＋灵泉空间＋先婚后爱】\n前胖黑丑后丰腴美人✖️前禁欲后重欲\n穿越女为了完成任务，操控了苏眠的身子五年。\n让苏眠从白幼瘦的美女，变成了黑胖丑的孩子妈，且跟家人朋友都断绝了关系。\n大结局后，穿越女脱离了世界。\n看着留下来的一大堆烂摊子，苏眠都恨不得自己两眼一闭。\n面对着被穿越女养得骨瘦如柴的两个娃，以及一贫如洗的家，苏眠只得振作起来，负起责任将两个娃养大。\n可娃毕竟不是她一个人的，苏眠也不想两个娃一直被人叫野种。\n所以干脆带娃去部队，寻找孩子的亲生父亲。\n还没瘦下去的苏眠，也没指望那个门槛都被踏破的首长能看上自己。\n让他给钱或者两人一起抚养孩子都行。\n只是没想到的是，才刚到部队没几天，对方就带着她去扯证了。\n·\n傅晏清对女人提不起兴趣，所以一直清心寡欲着。\n一次意外，他对一个女人失控了，事后却连女方是谁都不知道。\n直到有一天，一个胖乎乎的女人来到了部队，说为了自己生了两个娃。\n秉持着责任心，傅晏清直接跟对方领了证。\n只是说好的搭伙过日子，但是在相处过程中，傅晏清却越陷越深，越来越失控。\n胖又怎么样？胖点好，肉多，手感好！\n只是媳妇越变越美，越来越受欢迎，傅晏清生怕媳妇跑了，化身粘人精。", "tags": ["年代", "现代言情", "穿越", "空间", "先婚后爱"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "骗婚捞女？科研大佬独宠丰腴美人", "fullTitle": "骗婚捞女？科研大佬独宠丰腴美人", "link": "https://fanqienovel.com/page/7649237755582483518", "data": [7.59, 7.57, 7.91], "trend": 0.32, "latest": 7.9, "wordNumber": 228460, "creationStatus": 1, "desc": "【娇媚丰腴大美人VS外冷内野重欲大佬】\n【架空+八零+上位者为爱低头+独宠+先婚后爱+日久生情】\n柳娇媚穿进八零年代，成了书中那个又娇又媚的丰腴美人。\n好消息：老公穆寒舟是顶级科研大佬，工资津贴月月全额上交。\n坏消息：原主是捞女，老公是骗来的。\n按原书剧情，大佬半年后回家，发现原主是照骗，当场提出离婚。\n原主爱慕虚荣，对穆寒舟下药，企图生米煮成熟饭留在京市。\n穆寒舟自己忍着，给原主灌了十倍的药，丢进黑矿里，原主被摧残致死……\n柳娇媚瑟瑟发抖：惹不起惹不起，趁大佬还没回来，赶紧跑路！\n可原主太能挥霍了，兜里就剩二块五，估计跑出家门就饿死了。\n柳娇媚给自己定制剧本：装乖撒娇拉满情绪价值，搞一笔钱，再挑刺冷战断崖式分手。\n冷峻矜贵的科研大佬，开始电话里喊她宝宝，一张张万元汇款单砸过来，砸得柳娇媚说不出分手。\n穆寒舟一颗心，被家里的小妻子撩得辗转反侧，科研上攻坚克难，短短二个月就解决了预计半年才能解决的难题。\n提前回京市，只想按着小妻子的说法，把人狠狠宠爱，结果火车站就被正准备跑路的小妻子撞了个满怀。\n穆寒舟：宝宝！\n柳娇媚：？\n扣着小妻子的手腕把人抵在门上，穆寒舟：电话里说喜欢的，是这样吗？", "tags": ["年代", "现代言情", "先婚后爱", "独宠", "日久生情", "大佬"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [6.31, 6.27, 6.57], "trend": 0.27, "latest": 6.6, "wordNumber": 185207, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [6.64, 6.76, 6.89], "trend": 0.24, "latest": 6.9, "wordNumber": 267619, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "搬空家产去随军，进错洞房被亲晕", "fullTitle": "搬空家产去随军，进错洞房被亲晕", "link": "https://fanqienovel.com/page/7649401358138756120", "data": [4.71, 4.74, 4.93], "trend": 0.22, "latest": 4.9, "wordNumber": 257135, "creationStatus": 1, "desc": "【空间+萌宠+爽文+丰满娇媚能医会毒大美人VS顶级男德无脑护军官】\n全球首富大小姐白梨无聊开了把游戏，打团气到嘎过去，还倒霉催的穿进酸鸡室友写的小说里。\n原主作为天命女主，被攻略者夺取气运，剥离光环，收走家产，家暴致死。\n死了也不放过，还给她配了几门阴婚。\n这给白梨看笑了，什么脑残剧情？滚一边去。\n她只会以恶制恶，煽风点火，主打谁都别想活。\n亲爹渣，后妈毒，她鞭子蘸碘伏，边打边消毒，免费附送农场改造VIP服务。\n白莲继妹？给她脸划烂，腿打断，嘴巴缝上，送她去收破烂。\n房屋地皮收收收，祖产嫁妆搬搬搬，雁过拔毛，一分不留，厕纸都一道顺走。\n连夜收拾行李，去军区投奔未婚夫。\n只是，咦，好像投错了～。\n裴泫冷静克制，不近女色，战友临时出任务，他去帮接未婚妻。\n第一次见面，小姑娘肤白貌美，身段窈窕，脆生生喊了句，“同志，你好。”\n裴泫心脏狂跳，连娃儿名字都已经想好。\n兄弟，既然你嫌弃，那我可就接盘了？\n大院都说裴泫疯了，捡了个兄弟不要的二手货。\n结果，白梨一手银针，起死回生，灵药出手，病痛全消，八国语言，通通全会，还被国家奉为座上宾，视为重点保护对象。\n看着闪闪发光的她，战友那是肠子都悔青了。", "tags": ["年代", "现代言情", "穿越", "空间", "先婚后爱", "虐渣"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越七零，我成了女主的恶毒继姐", "fullTitle": "穿越七零，我成了女主的恶毒继姐", "link": "https://fanqienovel.com/page/7645293690532924440", "data": [22.86, 23.05, 23.04], "trend": 0.19, "latest": 23.0, "wordNumber": 268552, "creationStatus": 1, "desc": "【军婚 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书七零：高冷军官没羞没臊", "fullTitle": "穿书七零：高冷军官没羞没臊", "link": "https://fanqienovel.com/page/7656724782125173822", "data": [4.48, 4.54, 4.61], "trend": 0.14, "latest": 4.6, "wordNumber": 234713, "creationStatus": 1, "desc": "穿越成七四年，成了嚯嚯了哥哥战友的女配，\n林疏月看着搪瓷缸子和闷骚硬汉顾砚深，决定走肾不走心。\n反正婚结了，下乡躲了，人嘛，图个自己快乐！\n没想到表面高冷的顾团长私下竟是个黏人精，\n顾砚深对这个匆匆结婚的对象一开始就觉得是战友的妹妹。\n后来眼神总是随着她转，一刻也不想离开。\n随军后天天缠着她：“媳妇儿，你看看我，……”\n林疏月扶着腰，“顾砚深，我们分房睡吧！”\n顾砚深哼哼唧唧的趴在老婆肩膀上，“宝儿，好宝儿，不分房嗷！”\n“那你不会少一点嘛？我腰都要断了！”", "tags": ["年代", "现代言情", "先婚后爱", "穿书", "穿越", "日久生情"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "守了二十年寡，不守了", "fullTitle": "守了二十年寡，不守了", "link": "https://fanqienovel.com/page/7654493284269575193", "data": [5.24, 5.39, 5.38], "trend": 0.13, "latest": 5.4, "wordNumber": 232383, "creationStatus": 1, "desc": "【年代+克夫+女强+种田+家长里短+寡妇逆袭+单亲妈妈+凶宅】\n新婚夜，丈夫被房梁砸死，刘春红成了“克夫扫把星”。\n婆婆逼她生下遗腹子，转头翻脸不认人，月子里将母女俩赶出门。娘家大嫂堵着门骂：“嫁出去的闺女泼出去的水！”\n走投无路，她抱着满月的女儿，推开了村后那座死了五口人的凶宅。\n村里人都说她活不过这个冬天。\n二十年后，那个等了她二十年的男人问她：“守了二十年寡，不守了？”\n她说：“不守了。”", "tags": ["年代", "现代言情", "乡村", "女强", "养崽", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "童养媳揣崽随军，冷面军官追着哄", "fullTitle": "童养媳揣崽随军，冷面军官追着哄", "link": "https://fanqienovel.com/page/7644917027538209816", "data": [4.85, 4.9, 4.88], "trend": 0.04, "latest": 4.9, "wordNumber": 183419, "creationStatus": 1, "desc": "（年代+随军+先婚后爱+养娃+萌宝）\n作为陆家的童养媳，苏婉婉从小就知道，自己长大是要嫁给陆振哥当媳妇儿的。\n可好不容易等到从军多年的陆振哥回家，他却告诉她，他不能娶她，只当她是妹妹，也反对这种包办婚姻。\n从小就喜欢陆振的苏婉婉天都塌了，但还是忍着泪选择成全。\n不曾想，陆母让她送的一碗汤面，却让一切失去了控制。\n也让陆振对她产生了很深的误会，认为她是两面三刀，心机深沉的人，白天说好，晚上就给他下药。\n天还没亮，陆振就愤然离家。\n陆父陆母怕陆振一去不回，便让苏婉婉去部队随军。\n不想被误会的苏婉婉，想去部队跟他说清楚，便独自一人背上行囊踏上了前往部队的火车……", "tags": ["年代", "现代言情", "萌宝", "先婚后爱", "青梅竹马"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [7.89, 8.33, 8.66], "trend": 0.76, "latest": 8.7, "wordNumber": 152179, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [4.29, 4.5, 4.87], "trend": 0.58, "latest": 4.9, "wordNumber": 285549, "creationStatus": 1, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但没耀祖！！！\n……\n\n《家无男丁我来撑》——这个撑，撑的从来不是没有男人的空缺，而是不管有没有男人，女主都会让家人好好活着。女主不是代替男人在撑，她是作为她自己在撑。\n女主不会通过贬低或工具化男性来证明自己强大，她的强大来自于她比任何人都更敬畏生命、更懂守护。\n……\n苏青禾没有打算把两个妹妹养成温室里的娇花。\n她要把她们培养成食人花——\n要争权夺利", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [5.12, 5.36, 5.66], "trend": 0.54, "latest": 5.7, "wordNumber": 204958, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.61, 2.57, 2.94], "trend": 0.33, "latest": 2.9, "wordNumber": 280893, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "乡村", "甜宠", "打脸", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生新婚夜，和离回娘家发家致富", "fullTitle": "重生新婚夜，和离回娘家发家致富", "link": "https://fanqienovel.com/page/7616374658438269976", "data": [4.31, 4.45, 4.61], "trend": 0.29, "latest": 4.6, "wordNumber": 182012, "creationStatus": 1, "desc": "【空间种田+家长里短+发家致富】\n【敲黑板：本故事纯属虚构！】\n【逻辑不存在，三观已丢失，圣母请绕道！】\n【写文不易，不喜勿喷！】\n睁眼重生新婚夜，颜俏就听见前世与她举案齐眉的夫君对她说：和离！ \n颜俏想起，前世夫君一直珍藏在书房里的那幅画，便明白了眼前人也和自己一样重生了！\n她果断签下和离书，带着自己的嫁妆回到家里！\n然而，看着一贫如洗的家里，她采草药、捡山货、打猎物、卖豆腐、做卤味、开店铺、买宅子、建庄子，带着全家发家致富！", "tags": ["种田", "古代言情", "乡村", "重生", "空间", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.09, 3.17, 3.31], "trend": 0.23, "latest": 3.3, "wordNumber": 248417, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破庙通古今，小乞丐们有救啦！", "fullTitle": "破庙通古今，小乞丐们有救啦！", "link": "https://fanqienovel.com/page/7650351395756837912", "data": [2.67, 2.78, 2.82], "trend": 0.15, "latest": 2.8, "wordNumber": 271392, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+群像文+温馨日常+无极品+无cp】\n逃荒路上，弹尽粮绝，\n小瑶的爹娘卖完两个姐姐又想卖掉小瑶。\n小瑶连夜逃跑，跑到闹鬼的破庙。\n鬼再可怕也没有人可怕，\n原来破庙住着装神弄鬼的小乞丐。\n无粮无水五个小乞丐快要饿死之际，小瑶向破庙内神像求救，绑定快要报废的通古今交易系统。\n五个底层小人物，与废物统子共同携手，摸爬滚打，靠着古今穿越的奇遇，一步步努力，成为有饭吃，有衣穿，有屋住的小小大人物。\n（PS：前几章写五人的相识和小乞丐在古代底层社会生存的不易，想直接看古今穿越的可以从第五章开始看。\n前期小瑶，小满，狗蛋，虎子，乌川五个孩子都是主角，都会穿现代，后期还会有小瑶姐姐夏一，夏二的加入。\n希望大家能爱上这些性格不同，但一样善良可爱懂事的孩子）", "tags": ["种田", "古代言情", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿古代，又遇逃荒，怎么活", "fullTitle": "身穿古代，又遇逃荒，怎么活", "link": "https://fanqienovel.com/page/7655897155650980888", "data": [2.58, 2.62, 2.69], "trend": 0.11, "latest": 2.7, "wordNumber": 158856, "creationStatus": 1, "desc": "刚进入一家公司实习没几天的林荞，在帮一个离职同事送东西去楼下时，却在电梯内一脚踏空，连同装物品的纸箱子，一起穿越到了古代。\n别人穿越，都是魂穿，林荞却是整个身体都跟着穿越了。而穿越大神送给她的金手指，就是那个装有同事私人物品的纸箱子，变成了她的空间。\n就在林荞一边庆幸自己有个小的可怜的空间，一边忧愁自己在古代是个黑户时，让她更崩溃的是，她所在的地方，竟然大旱了半年，到处都是逃荒的流民。\n而她没钱没水没粮。\n苍天啊！大地啊！这叫她一个人生地不熟的现代人，在这里怎么活？\n逃荒种田文，女主无CP，不会和朝堂，贵族，大将军什么的扯上关系，就是一个普通的现代女孩在古代小心翼翼求生存，最终平安终老的日常文。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "逃荒"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [9.01, 9.42, 9.09], "trend": 0.08, "latest": 9.1, "wordNumber": 225030, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "养女害死全家，老太重生剥她皮", "fullTitle": "养女害死全家，老太重生剥她皮", "link": "https://fanqienovel.com/page/7643847756875844670", "data": [3.52, 3.51, 3.6], "trend": 0.08, "latest": 3.6, "wordNumber": 158084, "creationStatus": 1, "desc": "【重生+致富+空间+美食+无cp+微群像+家长里短】\n沈秀禾得知自己的儿子和母亲都被养女那个白眼狼所害，临死前，她用银簪刺穿养女喉咙。\n再次睁眼，她重生到自己四十一岁，亲生女儿被卖的当天。\n沈秀禾请婆家人帮忙，换回亲生女儿，并且讨要回刘翠英多年来欠下自己的银子，成功帮母亲与两个窝囊废儿子分家。\n接回母亲和亲生女儿的当天晚上，沈秀禾成功激活了手镯空间，改变了孩子们惨死的命运。\n沈秀禾的日子越过越好，又一步一步将仇人推进深渊……", "tags": ["种田", "古代言情", "重生", "空间", "美食", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女一睁眼，残疾太子冷脸剥玉米", "fullTitle": "恶女一睁眼，残疾太子冷脸剥玉米", "link": "https://fanqienovel.com/page/7637807750260460568", "data": [3.17, 3.2, 3.21], "trend": 0.04, "latest": 3.2, "wordNumber": 175992, "creationStatus": 0, "desc": "【病秧子纯情废太子VS搞怪抽象大力女医生】+【种田无宫斗】+【虐渣】+【搞笑轻松】+【空间】+【双洁】\n医学大佬苏青梨，穿成古代农村小恶女，开局就身处山贼窝。\n\n好不容易逃回家，发现家里更惨，家里欠债，大嫂难产，一家人快活不下去了。\n\n不过问题不大，她穿越把空间实验室给带过来了。\n\n她撸起袖子，虐渣男，搞钱，还债，赎地，把绝望的一家人从泥潭里捞了出来。\n\n只是，她顺手救的那双腿瘫痪的病秧子怎么回事？饭不吃，药不喝，整日摆着一副“活着没意思”的死人脸。\n\n苏青梨表示：多半是闲的！\n\n啪地一下，直接将一大筐玉米砸在他面前。\n\n“腿废了，手不是还能动吗？干活！”\n\n病秧子：“？？？”\n\n干吧。\n\n不就一点农家活，能比读书练武累？\n\n结果——\n\n他剥完玉米剥花生，剥完花生刮木薯，刮完木薯煮猪食。\n\n好不容易腿能站起来了，又被拉着下田插秧，赶牛放羊。\n\n萧时衍沉默了。\n\n好消息：她没把自己当残疾人。\n\n坏消息：也没把自己当人。\n\n后来的苏青梨才知道，这个被她使唤许久的病秧子美人，是曾经位高权重的太子。\n\n你说这事整的，也没人跟她说啊。\n\n村里人都说，就是有十条命，也不敢娶这恶丫头。\n\n可后来，一个清隽如玉的公子带着十里红妆来敲她门，\n\n“阿梨，我来求赘了，你可愿娶我？”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "医术"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局逃荒农家长姐有空间", "fullTitle": "开局逃荒农家长姐有空间", "link": "https://fanqienovel.com/page/7655709030232362008", "data": [3.02, 3.04, 3.03], "trend": 0.01, "latest": 3.0, "wordNumber": 180335, "creationStatus": 1, "desc": "【古代言情＋种田＋逃荒＋基建＋女主成长＋年下养成】\n【年下娇羞小将军vs全能型末世大佬】\n末世挣扎求生五年，最后还是死在了丧尸手里，苏清禾本以为要重新投胎了，却不想一睁眼穿成了古代的农家长姐，刚穿来就是天崩开局，斗极品亲戚，爹娘还都死了，却留下两个妹妹，和一个几个月大的弟弟给她抚养，\n她都还没来得及适应新身份，就拖家带口踏上了逃荒路，\n没有家人帮衬没关系，没有她有灵泉空间，还有一身的本领，足够她带着弟妹在这乱世中生存下去，\n只是原本收养的小萝卜头不知道什么时间就悄悄长大了，她教他习武，教他杀人，在他被强制征兵后成为他坚实的后盾，看着他从青涩稚童到意气风发的少年将军，苏清禾满是吾家有弟初长成的成就感，本以为是相依为命的姐弟情，却不想随着她身边的追求者越来越多，他的占有欲也愈发浓烈，\n萧衡哪里知道某人对他也是觊觎已久，只是眼睁睁看着他一步步踏入自己早已编织好的牢笼，", "tags": ["种田", "古代言情", "乡村", "逃荒", "基建", "年下"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成被休悍妇，边关种田养娃致富", "fullTitle": "穿成被休悍妇，边关种田养娃致富", "link": "https://fanqienovel.com/page/7655592418057653272", "data": [2.44, 2.43, 2.44], "trend": 0.0, "latest": 2.4, "wordNumber": 184643, "creationStatus": 1, "desc": "评分刚出，会涨，勿在意\n（边关开荒种田+空间+灵泉+木系异能）\n俗话说升官发财死老婆。\n江棉棉睁眼就成了那个将死的老婆。\n外室进门，男人嫌她是个黄脸婆随便捏了个不孝婆母的罪名。\n还没断气就被扔到外面等死，\n儿女也被赶到柴房给外室的孩子腾位置。\n呵呵。\n她江棉棉是谁，末世满级大佬，怕你一个陈世美。\n“和离。”\n她带着儿女媳妇离开。\n分家后，她靠木系异能卖草药很快赚了第一桶金。\n抓到野鸡，每天喂它喝灵泉水，噗噗下蛋。\n打死野猪，正好卖给别人办婚事用。\n老大夫妇心灵手巧，绝版编织书搞起，编的东西风靡边关，挣的盆满钵满。\n老二力大如牛，教他功夫去从军，战无不胜。\n老三脑子活，最聪明，教她识字经营，成为大燕朝第一女皇商。\n顺便再救救落难的小男主和被虐待的阴毒小反派。\n想让他们当外室女儿对照组，不可能，\n谁牛逼谁说了算。", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "民国言情": [{"label": "穿成五零姨太太，卷走财产逃港城", "fullTitle": "穿成五零姨太太，卷走财产逃港城", "link": "https://fanqienovel.com/page/7645653673145551896", "data": [1.63, 2.01, 2.75], "trend": 1.12, "latest": 2.8, "wordNumber": 130241, "creationStatus": 1, "desc": "祝阮蓝一醒来就发现自己穿成了索府的七爷的‘冲喜姨太太’，而且索府的人正在谋划着离开沪上，逃往小弯，最重要的是竟然还不带她！\n这怎么能成，她也要出去，她想去港城！\n可惜，相处后才发现，索府都是一群豺狼虎豹，而且还一个个带着坏主意，竟然觉得买了她这个冲喜姨太太不能吃亏，想要将她当成礼物送给沪上官员笼络人心。\n看着索府的人这样恶心，祝阮蓝索性当起了飞天大盗，先是偷走了索府的保险箱，后又偷走了枪支弹药，还毫不客气的送索府的人看了一场炸弹烟花给他们开开胃。\n趁着这个时机，她卷走了索府宝库里所有的东西，而后消失不见。\n索府的人气炸了，老太太发出高额悬赏想要捉拿祝阮蓝。\n祝阮蓝趁着这个时机，逃离沪上，等到船快要开时才辗转回来。\n没想到她千算万算，等上船后才发现，她如今坐着的这条船，竟然是那条奔向绝路的‘太平轮’，且看祝阮蓝如何逆风翻盘，去往港城大杀四方，由一个姨太太成为一个港城新贵！", "tags": ["民国言情", "现代言情", "穿越", "空间", "民国", "虐渣"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "陈皮阿四之多情种", "fullTitle": "陈皮阿四之多情种", "link": "https://fanqienovel.com/page/7537294523685145625", "data": [0.98, 1.3, 1.57], "trend": 0.59, "latest": 1.6, "wordNumber": 239087, "creationStatus": 1, "desc": "故事发生在四屠黄葵之后……初见时，浑身浴血的少年黑沉着眸子，无法无天的流氓做派。\n后来竟将整颗真心奉上，只求她的怜惜……\n披着老九门外衣的小甜文\n私设如山，努力不崩人设\n给橘子皮一个小小的羁绊", "tags": ["民国言情", "现代言情", "古代言情", "古色古香", "医术", "武侠"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在老九门打工那些年", "fullTitle": "我在老九门打工那些年", "link": "https://fanqienovel.com/page/7347712908786158654", "data": [0.56, 0.73, 0.88], "trend": 0.32, "latest": 0.9, "wordNumber": 145476, "creationStatus": 1, "desc": "本文略偏群像，以剧版节奏展开，多偏生活气息，不偏重下墓。\n女主脑力武力都没问题，一开始隐藏实力只是因为雨村金盆洗手的誓言，所以不想插手。\n然后逐渐被卷入，和九门众人熟悉起来，才决定参与。\n主CP齐八爷（日久生情，患得患失，甜甜的唯妻主义）和二月红有些瓜葛（前世今生，换皮掉马甲，追妻火葬场），其他人看情况撩一撩。\n第一次借尸还魂，她遇到了二月红，名为霜叶。\n在她想留下时，一切却戛然而止。\n她回到现实，疯狂搜寻关于他的一切，从而结识了吴邪等人。\n多年冒险之后，打算就此金盆洗手，留在雨村养养老，却不想突如其来第二次借尸还魂。\n第二次借尸还魂，她回到了九门，自称叶霜。\n昔日少年郎，已是名伶二爷，有了丫头。\n“叶霜，霜叶，很难猜吗？二月红，你是真的不知道，还是装作不知道？”\n不过没关系，她遇到了更好的。\n“八爷这么贤惠，不如我娶了你去吧。”", "tags": ["民国言情", "现代言情", "民国"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓之黄泉的角色扮演", "fullTitle": "盗墓之黄泉的角色扮演", "link": "https://fanqienovel.com/page/7545747049849834520", "data": [0.47, 0.64, 0.74], "trend": 0.27, "latest": 0.7, "wordNumber": 128240, "creationStatus": 1, "desc": "【无CP➕微瓶邪黑花➕原著线➕崩铁世界观入侵➕入侵本土化】\n濒死的林清被系统转生到盗墓世界，系统给的金手指是角色扮演\n但，完美扮演角色后，那个人还会是自己吗？\n黄泉不知道，她忘了很多事情，只记得有个叫林清的人送了她一把伞，那把伞很好看，她会一直带着\n走出风雪，她来到一座寺庙前，她在这座庙里知道了一个人——張起灵\n或许是有缘，她后来遇到了这个人，也见到了更多的人\n繁忙的旅程中她也需要一处休憩的地方\n解府，吴山居，喜来眠、黑瞎子的小院子他们永远为她敞开\n而她也会陪着他们直到生命的尽头\nps：作者重生了，不想让第一本书成为遗憾，改了很多，希望不要出现周树人鲁迅梗\n对崩铁体系不理解的，可以理解为十几个古神在搞事情，全部本土化，既然乱成一锅粥就喝了吧\n也不知道大家喜欢不喜欢纯故事的同人，我写文比较正经，烂梗啥的不会出现，迪化也没有，感情戏比较淡或者说隐晦，没谈过，请谅解\n主角团会不会走上命途我也不确定，但肯定会有奇物出现的（纯自创），也是本土化\n均衡大手发力哈，战力会有调整，要按原本战力，那地球和太阳星系，银河系还能存在吗？不过你们放心，泉的战力绝对是本文战力天花板", "tags": ["民国言情", "现代言情", "风水秘术", "盗墓", "无CP", "系统", "同人"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "南部档案：师姐老想退休了", "fullTitle": "南部档案：师姐老想退休了", "link": "https://fanqienovel.com/page/7658487361486982206", "data": [1.01, 1.07, 1.25], "trend": 0.25, "latest": 1.3, "wordNumber": 96138, "creationStatus": 1, "desc": "（不是爽文，不后宫，部分情节和原著有出入，女主本相蝴蝶，CP未定。）\n张海梦也是在南安号上牺牲的探员之一，她的尸体被张海琪带回了厦门，下葬之前，她的尸体上布满了大大小小的蝴蝶，再一恍惚，蝴蝶连带尸体都不见了，在张海琪眼皮子底下消失了。", "tags": ["民国言情", "现代言情", "民国", "幻想言情", "谍战"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "出门在外，身份全靠自己编", "fullTitle": "出门在外，身份全靠自己编", "link": "https://fanqienovel.com/page/7580057733001399321", "data": [0.78, 0.84, 0.91], "trend": 0.12, "latest": 0.9, "wordNumber": 150295, "creationStatus": 1, "desc": "【无cp，爽文，微迪化，系统，民国，不掉马】\n断更后复更，流量不好见谅\n刚开分，评分有点低，后面还会陆续涨起来的\n大二学生林舟，在出车祸后被迫绑定了系统，穿进了一本民国架空背景的小说。\n系统告诉他想要复活需要十万熵值，在林舟兢兢业业努力两个月却只凑够了三点熵值后，他顿悟了。\n做人，不能太踏实，还是要学会投机取巧。\n在确认更改原著剧情能获得大量熵值后，林舟果断选择把自己塞进剧情。\n只他一个改变的剧情当然不够，可如果还有一个隐居避世的大家族呢？\n再没有什么能比一个横空出世的家族改变剧情更方便了。\n多方势力都在争夺的信物？主角遍寻不得的仇家？行事莫测的高手？\n一切的一切，都在这个只显露冰山一角的大家族掌握之中。\n-\n林舟，一个领了家族任务被派出来的子弟，其行事从来都以家中任务为首要目标，道上骂他的人不知几何。\n有人想拉拢他，也有人骂他是家族的走狗，可无论道上的人怎么说，他们都清楚一个事，那就是这位年纪并不大的后生，是个狠角色。\n横空出世仅仅两年，哪怕身后的家族供给他源源不断的资源，能将手下创立的据点做到这个地步都说明了他的能力。\n（无脑爽，无暧昧向，重要的事情说三遍：无cp，无cp）", "tags": ["民国言情", "现代言情", "系统", "穿越", "民国", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抗战1939：你管这叫卫生员？", "fullTitle": "抗战1939：你管这叫卫生员？", "link": "https://fanqienovel.com/page/7646833656249453630", "data": [0.82, 0.85, 0.9], "trend": 0.08, "latest": 0.9, "wordNumber": 289115, "creationStatus": 1, "desc": "张星冉，现代边区特战卫生员，为救队友牺牲后，被传送到了亮剑世界。\n还是被汉奸儿子强娶的天崩开局，幸好有李云龙及时赶到！\n既然来到了1939年，还有了系统，第一件事，当然是改变战士们的生活处境！\n三大神书？拿来！\n青霉素？拿来！\n战地急救，特种培训，枪械装备，我们张医生刚巧都会亿点点！\n这一次，再没人敢把战士们戏称成三枪八路！\n这一次的我们，强得可怕！\n嗯……我们张医生啥都好啥都会，唯一弱点大概就是……政委？！", "tags": ["民国言情", "现代言情", "同人", "民国", "系统", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "哥哥亲手养大的妹妹竟是卧底", "fullTitle": "哥哥亲手养大的妹妹竟是卧底", "link": "https://fanqienovel.com/page/7662703968958549017", "data": [1.53, 1.56, 1.57], "trend": 0.04, "latest": 1.6, "wordNumber": 149667, "creationStatus": 1, "desc": "【伪兄妹｜谍战｜养成｜虐恋｜极限拉扯｜家国群像｜酸涩｜双洁｜he】\n他从瓦砾堆里捡回她，一养就是十几年。\n那年她满身泥垢，脸脏得像只花猫，唯有一双眼睛亮得惊人，抓住他军装袖口的那一刻，就注定了两人这辈子的纠缠。\n她夜里做噩梦哭醒，他坐在床边守到天亮；她挑食不肯吃饭，他端着瓷碗哄着喂；她软声喊一句哥哥，他应了十几年。\n后来他才知道，他捧在手心的妹妹，在他眼皮底下，偷了整整两年的情报。\n他的偏爱，成了她完美的护身符；\n他的纵容，化作刺向自己阵营的利刃。\n东窗事发那晚，他红着眼甩了她一巴掌：\n“你那些说爱我的话，全是骗我的？”\n她骂他畜生。\n他冷笑，伸手擦过她嘴角的血，字字带着毁天灭地的偏执：\n“那我就让你见识见识——什么叫真正的畜生！”\n当他认清自己的内心，终究会和他的小姑娘一起走向光明。", "tags": ["民国言情", "现代言情", "HE", "谍战", "养成", "群像"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被献给少帅后，我成了他的笼中娇", "fullTitle": "被献给少帅后，我成了他的笼中娇", "link": "https://fanqienovel.com/page/7660463475449154622", "data": [0.36, 0.38, 0.41], "trend": 0.04, "latest": 0.4, "wordNumber": 198066, "creationStatus": 1, "desc": "温知棠被亲叔父卖进军宴那晚，所有人都以为她会成为乱世里最轻贱的一件礼物。\n直到她跪在满堂军阀面前，颤声说出一句：“那卷书不能开。”\n下一刻，前朝孤本被拆开，暗藏的杀机暴露当场。\n北地少帅陆烬北抬眼看她，冷声道：“这丫头，留下。”\n从此，她成了督军府里人人不敢碰的笼中娇。\n她怕他，躲他，想逃他。\n可后来她才知道，乱世人人都想要她的命，只有陆烬北不准她死。", "tags": ["民国言情", "现代言情", "民国"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夜夜听禅，步步生欲", "fullTitle": "夜夜听禅，步步生欲", "link": "https://fanqienovel.com/page/7601557587149982745", "data": [0.66, 0.68, 0.69], "trend": 0.03, "latest": 0.7, "wordNumber": 137312, "creationStatus": 1, "desc": "#番茄最欲佛子文#旗袍美人vs疯批佛子#囚禁/替身/火葬场#从佛到魔\n\n🩸 他扯断佛珠那夜，我知道，我这尊佛，从里到外都脏了。 🩸\n\n人人都说，沈听禅是北平最干净的男人。\n佛堂清修，不沾女色，连腕间佛珠都浸透檀香。\n直到那夜暴雨，他把我压在经卷上，指尖碾碎菩提子。\n“装什么？”他咬着我染血的旗袍冷笑，“三年前在江南，你不是早就破了我的戒？”\n\n✨我，温欲，百乐门头牌歌女，旗袍开衩到腿根，唇色艳如血。\n✨他，沈听禅，沈家二少，佛堂里修了多年年的“圣僧”，腕上佛珠从不离身。\n\n所有人都以为，是我这妖女玷污了佛子。\n可他们不知道——\n三年前江南雨夜，是他先撩开我的衣襟。\n也是他，亲手把我送进日本军官的囚笼。\n\n我步步为营，用最艳的妆，唱最媚的歌，在他心上反复纵火。\n他夜夜听禅，捻碎佛珠，在菩萨垂目的注视下，一寸寸吻过我肩头的胎记。\n\n“温欲，你是我唯一的罪。”\n“所以这辈子，你只能陪我一起……永坠无间。”\n\n后来，我一把火烧了佛堂。\n烈焰冲天时，他却从火海里捡出我半毁的旧照。\n颤抖的吻落在焦痕上，这个男人终于撕下佛衣，露出底下疯魔的真容：\n\n“你赌赢了……”\n“我从来就不是什么佛。”\n……", "tags": ["民国言情", "现代言情", "豪门世家", "民国", "总裁", "第一人称", "替身", "双面"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "楠姝", "fullTitle": "楠姝", "link": "https://fanqienovel.com/page/7616643028513459224", "data": [1.03, 1.03, 1.05], "trend": 0.02, "latest": 1.0, "wordNumber": 134382, "creationStatus": 1, "desc": "古有上神，名曰楠姝。\n一朝坟墓被盗，不得不重入世间寻回自己的陪葬品。\n血光冲天的大帅府；\n全员被屠的诡异村庄；\n九世孽缘的人妖殊途；\n……\n这些突然现世的陪葬品，似乎都与她那死了上千年的亡夫关系匪浅？", "tags": ["民国言情", "现代言情", "代嫁代娶", "风水秘术", "民国", "幻想言情", "双向奔赴"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "民国：我来自现代", "fullTitle": "民国：我来自现代", "link": "https://fanqienovel.com/page/7586646056583056408", "data": [0.5, 0.5, 0.5], "trend": 0.0, "latest": 0.5, "wordNumber": 287945, "creationStatus": 0, "desc": "第一卷，为胜利而战。\n宋小棠一个现代的灵魂，意外穿越到民国时期的1938年，一个六岁叫宋小棠的小姑娘身上，她既不是国党特工，也不是红党的地下党，她就是穿来给在上海做地下工作的父母帮忙的。\n谁知帮着帮着，她也成了他们中的一员……\n第二卷，为国敛财。\n讲的是一家三口奉命来到香港为国敛财期间，所发生的故事。", "tags": ["民国言情", "现代言情", "系统", "穿越", "民国", "魂穿"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "星际第一躺平学大师", "fullTitle": "星际第一躺平学大师", "link": "https://fanqienovel.com/page/7656676073710554137", "data": [3.06, 3.34, 3.92], "trend": 0.86, "latest": 3.9, "wordNumber": 185984, "creationStatus": 1, "desc": "【星际、穿越、校园、女强、无CP】【评分刚出，后面会涨】\n两世卷王，这世放假。这辈子迎瓷发誓不卷了，躺平任嘲。\n迎瓷前两世卷生卷死，从小镇做题家卷成C9国奖得主，从外门弟子卷成天梯榜第一的天之骄子，结果两世都不得善终。\n直到第三世，眼睛一闭一睁，穿到星际时代，变成了一个五岁孤儿，迎瓷真的累了。\n这真的不是拐卖人口吗？能不能请有关部门管一管啊。\n风雨中飘摇的家，没爹没妈的她，清澈见底的财富和不努力捡垃圾就会饿死的生活。\n老天奶，她在互联网上接的不是这种日子啊。\n直到有一天，迎瓷翻到一张沾满油污的传单上写着：联邦“未成年教育保障计划”孤儿或底层贫困人口，只要通过最低入学测试就能进入就近的公立学校，享受包吃包住……\n本着免费的就是最好的，迎瓷决定去小学美美躺平，却因为每一次“省事操作”被当成隐藏实力的天才。\n她一路躺、一路被卷、一路拒绝，直到……\n（第一章作话有避雷，大家阅读前可以看一眼哦，如果是不喜欢的题材或者雷点，也方便提前识别）", "tags": ["科幻末世", "穿越", "星际", "女强", "天才", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [6.25, 6.54, 6.76], "trend": 0.5, "latest": 6.8, "wordNumber": 209963, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日死考：七岁丧尸王也要考试？", "fullTitle": "末日死考：七岁丧尸王也要考试？", "link": "https://fanqienovel.com/page/7652257815586688025", "data": [2.48, 2.6, 2.87], "trend": 0.39, "latest": 2.9, "wordNumber": 175460, "creationStatus": 1, "desc": "【末日废土+恶童丧尸王+比格属性+全名求生直播】\n季末一觉睡醒，发现家没了，哥也不见了，甚至她连人都不当了。\n因为她变成了一只丧尸，穿着花棉袄的丧尸王。\n季末想要找妈妈，脑海中就传来了一道机械音。\n“叮，第101次末日死亡高考准备开始，考场已准备就绪，请考生做好准备。”\n季末：嗯？高考？我吗？可我刚满七岁，还没上小学啊。\n紧接着，季末出现在了墓地。\n考题：枯骨酸雨墓园（杀戮求生）\n季末不识字，问一旁的姐姐。\n姐姐眼神奇怪：“小姑娘，幼儿园不教认字吗？”\n季末挠了挠头：幼儿园，不是教杀人的地方吗？\n不过好在，她得到了答案。\n不需要做数学题啊，既然如此，她要开始，发疯了！\n----\n基地中，幸存者们看着直播画面，其实早就麻木了，因为人类根本没有希望，不过是延长死去的时间罢了。\n可突然，一个名叫季末的积分以成倍递增，所有人都涌入了季末的直播间。\n咦？咋还有个小孩。\n有点不爱干净啊，这脸咋乌漆嘛黑的，这花棉袄好土啊。\n季末：你们这是言语霸凌小学生。\n同样看到直播的五位哥哥：呜呜呜，我的妹宝，没死！\n有幸和季末一起参加高考的高考生们：人麻了，死考最恐怖的，是那个熊孩子啊！", "tags": ["科幻末世", "末世", "直播"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际赶海：采集毒海鲜大佬全争抢", "fullTitle": "星际赶海：采集毒海鲜大佬全争抢", "link": "https://fanqienovel.com/page/7662041193118698520", "data": [2.24, 2.42, 2.62], "trend": 0.38, "latest": 2.6, "wordNumber": 223290, "creationStatus": 1, "desc": "【星际+水星球赶海+美食采集+人鱼/海妖+买股雄竞】\n蓝星顶级赶海博主林椰，穿成了星际流放犯，\n被扔在全是被重度污染毒物覆盖的“死海星”。\n别人眼里的致命毒物：八爪异变兽、剧毒黑甲虫、狂躁电鳗。\n拥有“超级净化采集术”的林椰眼睛一亮：这不就是爆头章鱼、帝王蟹和极品蒲烧鳗鱼？！\n她拿着小破桶，在海边一顿爆捡，不仅实现海鲜自由，\n还顺手从礁石缝里薅出了一条奄奄一息的绝美银尾人鱼，\n一只重伤的深海暴龙，和一头迷路的凶残虎鲸。\n全星际网民都在直播里等她被毒死。\n结果，她把毒海鲜炖成了安抚精神海的无上神药。\n更离谱的是，她那个破木屋里养的几只“变异海鲜宠物”，竟然全是大佬！\n那个传闻中残暴无情的帝国元帅（人鱼），熟练地用绝美的银色尾巴给她扇风，只为求一口刚出锅的蒜蓉粉丝扇贝；\n令人闻风丧胆的星盗王（深海渊龙），变成巴掌大的黑棘小蜥蜴，为了抢一口烤生蚝，死死抱住她的脚踝死活不撒手；\n而高不可攀的星际执政官（虎鲸），却每晚霸占着她的浴缸，一边发出“嘤嘤嘤”的夹子音，一边翻出白软的肚皮求她摸摸。\n曾经把她踩在脚下的贵族们，捧着千亿星币只求喝一口洗锅水，却被大佬们一尾巴抽飞出死海星！", "tags": ["科幻末世", "美食", "星际", "大佬", "穿越", "打脸", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世太子爷的恶毒前女友是极品茶", "fullTitle": "末世太子爷的恶毒前女友是极品茶", "link": "https://fanqienovel.com/page/7651886510119078936", "data": [2.71, 2.84, 3.03], "trend": 0.31, "latest": 3.0, "wordNumber": 165253, "creationStatus": 1, "desc": "【穿书，系统，空间，末世求生，大反派，白切黑，万人迷！】\n谁懂啊，穿书第二天就是末世？\n还穿成了活不了几集的大反派的恶毒前女友，绑定了个毛用没有的坑爹绿茶系统。\n只有茶言茶语才能获得积分？\n无奈她一边当绿茶，一边偷偷提高自己的能力。\n等等，那个对她不屑一顾的大反派，怎么突然一副要吃了她的样子？\n妈妈呀！这不是去幼儿园的车……", "tags": ["科幻末世", "系统", "末世", "反派", "穿书", "囤物资"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.63, 9.68, 9.81], "trend": 0.18, "latest": 9.8, "wordNumber": 259409, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世禁区？那明明是狩猎场！", "fullTitle": "末世禁区？那明明是狩猎场！", "link": "https://fanqienovel.com/page/7622901967165082648", "data": [2.67, 2.73, 2.79], "trend": 0.12, "latest": 2.8, "wordNumber": 299684, "creationStatus": 1, "desc": "【无cp+心狠手辣+杀伐果断+独狼+自私自利+损人利己+系统+多序列+诡异+成长+非无敌+末日末世+ 女强+战榜 】\n\n\n灰雾封世，诡异横行，多地沦为禁区。\n\n人类被迫迁徙，只为能找到为数不多的安全区苟延残喘。\n\n迁徙途中，林青意外绑定了生机系统！\n\n当其他觉醒者还框锁在一人一序列的铁律中，她却手握多重序列！\n\n当其他幸存者四处逃命躲避诡异，她却截然相反，迎雾而上！\n\n当诡异成了经验包……\n\n当灰雾成了狩猎场……\n\n我以猎诡谋生路。\n\n此途，由我定序。\n\n雾尽，我即规则。", "tags": ["科幻末世", "末世", "系统"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越末世居然带了个养老系统", "fullTitle": "穿越末世居然带了个养老系统", "link": "https://fanqienovel.com/page/7655687760652536856", "data": [2.5, 2.53, 2.53], "trend": 0.03, "latest": 2.5, "wordNumber": 270980, "creationStatus": 1, "desc": "“哇~宿，宿主，对，对不起，我，我好像定位错世界了！”系统汤圆在颜蓁蓁脑海里哭泣。\n“所以，我们现在在什么世界？”颜蓁蓁无奈的扶额，这具身体，好像在生病，浑身滚烫。\n“末，末世！”\n“什么？”", "tags": ["科幻末世", "系统", "穿越", "末世", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.97, 5.97, 5.99], "trend": 0.03, "latest": 6.0, "wordNumber": 252842, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "游戏体育": [{"label": "这难道不是乙女游戏？", "fullTitle": "这难道不是乙女游戏？", "link": "https://fanqienovel.com/page/7631980422003428414", "data": [2.33, 2.61, 3.38], "trend": 1.05, "latest": 3.4, "wordNumber": 176179, "creationStatus": 1, "desc": "【全洁款，请放心食用。】\n《仙缘》号称全球首款拥有沉浸式VR体验的乙女向游戏。\n常宁作为品鉴无数电子男友的资深玩家，好不容易抢到了内测资格，却在数个可攻略对象中，头铁地选择了一名叫陆今尘的神秘剑修男。\n【请玩家选择身份：1.弟子；2.器灵；3.路人】\n“开玩笑，我当然要原地螺旋起飞再忧郁地降临继承他的一切并和他展开一场惊天动地的师徒禁忌之恋！”\n后来，常宁就为自己的无知付出了代价。\n她被be麻了。\n当常宁好不容易打出he之后，心累地决定换换口味潇洒一下。\n没想到她刚和新对象牵上小手，比她的脸红来的更快的是陆今尘的剑气。\n他落下的时候，剑甚至还没出鞘。\n“若此人接下我这一剑……”\n常宁希冀地看着他：“咱们就此别过了？”\n陆今尘气笑了，拔出长剑。\n“我就砍死他。”", "tags": ["游戏体育", "系统", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全息游戏当神偷，偷完他的偷你的", "fullTitle": "全息游戏当神偷，偷完他的偷你的 ienovel.com/page/7312048784836398143", "data": [28.45, 28.45, 29.16, 29.36, 29.63, 29.93, 30.15], "trend": 1.7, "latest": 30.2, "wordNumber": 1010252, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.66, 41.66, 42.01, 42.21, 42.44, 42.41, 42.35], "trend": 0.7, "latest": 42.4, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [23.63, 23.63, 24.43, 24.56, 24.52, 24.5, 24.24], "trend": 0.6, "latest": 24.2, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗都是舔狗，小师妹是真狗", "fullTitle": "全宗都是舔狗，小师妹是真狗", "link": "https://fanqienovel.com/page/7200755351845604355", "data": [27.08, 27.08, 27.38, 27.37, 27.44, 27.36, 27.36], "trend": 0.29, "latest": 27.4, "wordNumber": 4170637, "creationStatus": 0, "desc": "【实体书《一念凤兮》全平台可购】凤溪穿成修仙文里面的炮灰女配，穿书之日就是忌日。\n她为了苟命，千方百计脱离了女主所在的混元宗，加入了玄天宗。\n嚯！\n五个亲师兄，在书里全都是女主的舔狗，一个比一个死的惨。\n凤溪邪魅一笑：“舔狗了不起？有我狗吗？”\n大师兄身中剧毒，只有女主的血能够解毒，从此对女主情深似海，最后却被女主一脚踹入万丈魔渊，魂飞魄散？\n凤溪屁颠屁颠端来一大盆狗血：\n“师兄，喝我的！我的剂量大，药效足！”\n吞服完解毒丹，正准备割破手指的女主：“……”\n二师兄身具餍族皇族血脉，女主给了他隐藏血脉的丹药，从此二师兄心甘情愿为女主出生入死，哪怕最后被女主推出去当替死鬼也甘之如饴？\n凤溪拿出人族餍族友好一万年的盟约：\n“二师兄，尽情展示你高贵的餍族皇族血脉吧！万千少女为你痴为你狂为你咣咣撞大墙！”\n女主看着手里需要三个月服用一次的隐血丹：“……”\n凤溪的人生信条：做得狗中狗，方为人上人！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越", "魂穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [24.14, 24.24, 24.34, 24.4, 24.34, 24.42, 24.35], "trend": 0.21, "latest": 24.3, "wordNumber": 900036, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂， \n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "发配边关，罪妻开荒养出战神", "fullTitle": "发配边关，罪妻开荒养出战神", "link": "https://fanqienovel.com/page/7613410424586767385", "data": [71.98, 71.98, 76.89, 78.07, 77.73, 79.1, 79.78], "trend": 7.81, "latest": 79.8, "wordNumber": 740149, "creationStatus": 1, "desc": "【边关生活+木系+御兽+宠夫+护短+开荒种田+甜宠+双强直球夫妇+对照组】\n大靖连旱两年，粮荒四起，战火燃遍辽东。\n末世后勤员苏禾穿成罪奴丫鬟，被发配给军户为妻。\n罪奴姐妹极力表现，力争抢个优秀男儿，而她只看安全感，一眼锁定全场最壮的百户萧征。\n他冷脸拒绝：“我不需要媳妇，赏我粮食就行！我养不起，也没功夫照顾。”\n她直白坦荡：“我不用你照顾。我能种地，能持家。你很强，跟你，我安全。”\n没媳妇前的萧征：女人真麻烦！\n有了媳妇后，萧征夜夜搂着苏禾：真得劲！媳妇，再来二十个馒头！\n自此，边关多了一对双强夫妇。\n他负责拿刀护她，横扫敌军；\n她负责种田产粮，兜底全家。\n极品邻居攀比？打脸！\n边关缺粮断炊？解决！\n敌军突袭包围？放野兽！\n萧征从穷军户一路封将，世人皆知：\n大将军最厉害的不是战功，是他那位能种出天下粮的媳妇。\n【饭桶将军×产粮小媳妇】\n你负责打仗护家・我负责种地养你", "tags": ["种田", "古代言情", "乡村", "穿越", "强强", "宠夫"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [15.21, 15.96, 16.28, 16.1, 17.58, 20.27, 21.96], "trend": 6.75, "latest": 22.0, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [40.35, 40.35, 42.88, 43.95, 44.64, 45.9, 46.88], "trend": 6.53, "latest": 46.9, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [14.92, 14.92, 15.82, 16.41, 16.93, 17.53, 18.08], "trend": 3.16, "latest": 18.1, "wordNumber": 890944, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "想兼祧两房？搬空家产带儿女和离", "fullTitle": "想兼祧两房？搬空家产带儿女和离", "link": "https://fanqienovel.com/page/7545324289256328216", "data": [27.47, 27.47, 27.58, 28.47, 29.73, 29.43, 29.1], "trend": 1.63, "latest": 29.1, "wordNumber": 1152924, "creationStatus": 0, "desc": "【有空间，不是双洁，女主懂医术。】\n末世摸爬滚打多年的乔念，带着空间穿越到古代，一个穷秀才的妻子。\n刚睁眼，龙凤胎儿女面临被卖，乔念凭借自己的武力夺回孩子。\n成亲五年的秀才相公不回家？\n她带着孩子找过去。\n结果却发现，丈夫和寡嫂在城里，小日子过得风生水起，连儿子都生了俩。\n乔念一去，大杀四方，胖揍狗男女，搬空婆家所有财物。\n和离后，带着娘家人赚得盆满钵满。\n乔念变得越来越漂亮，肤白貌美又多金，渣前夫肠子都悔青了。\n他厚着脸皮上门求和，被乔念一脚踢出门。\n渣男有多远给我滚多远……", "tags": ["种田", "古代言情", "穿越", "空间", "医术", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家，继母渣爹跪求我回家", "fullTitle": "分家，继母渣爹跪求我回家", "link": "https://fanqienovel.com/page/7620425812189121598", "data": [36.06, 36.06, 35.79, 36.65, 37.57, 36.64, 36.87], "trend": 0.81, "latest": 36.9, "wordNumber": 601757, "creationStatus": 1, "desc": "（漫剧已出）一睁眼，林仟仟成了农家炮灰女。\n亲娘刚死，继母带着她女儿进门了，从此她和三岁的弟弟住进了柴房，一天两顿稀粥，还要挨打受骂。继母说：“女孩子家，识什么字？”转头却给继妹请了先生。\n爷奶偏心小叔，大伯母尖酸刻薄，整日惦记着把她卖个好价钱。亲爹呢？站在院里搓着手，屁都不敢放一个。\n林仟仟笑了。\n牵着弟弟的手往外走。\n“分家。”\n堂屋里一片哄笑：“一个丫头片子，带着个拖油瓶，分出去等死？”\n她没回头。\n分家后，她采野菜卖野兔赚了第一桶金。\n一个月后，她的木薯淀粉风靡镇上酒楼。\n两个月后，她买下了村东头三十亩地。\n三个月后，她要翻新老宅推倒重盖\n继母急了，爷奶慌了，亲爹站在院门口来回踱步——那院门，她牵着弟弟走出去那天，就再没打算回来。\n年底，她坐着新打的牛车经过老宅门口，继母追出来喊她的名字。\n她低头给弟弟擦了擦嘴角的油光，头都没抬：\n“娘？我娘早死了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [15.43, 14.13, 14.01, 14.21, 14.41, 14.98, 15.72], "trend": 0.29, "latest": 15.7, "wordNumber": 4610075, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听懂兽语后：整个后山都是我粮仓", "fullTitle": "听懂兽语后：整个后山都是我粮仓", "link": "https://fanqienovel.com/page/7532785436142357566", "data": [17.09, 16.86, 16.91, 17.0, 17.16, 17.09, 17.28], "trend": 0.2, "latest": 17.3, "wordNumber": 1397958, "creationStatus": 0, "desc": "【大力胖妞+混混娇夫+搞笑夫妻+通兽语+屯粮满仓】\n超级大忽悠叶珠和一只千年乌鸦哥一起穿越了，还能听懂各种动物说话，于是整个后山的动物都被她忽悠成了小弟，大野猪跟她称兄道弟，老虎把她当成自己崽，她成了名副其实的山大王。\n开局成为农家痴傻胖妞，恶毒的爷奶二叔一家为了聘礼把她卖了给人配冥婚。不怕！往死里揍他们就完了。一顿不行那就揍两顿！\n爹娘包子？不怕，她最擅长给人洗脑，黑的也能说成白的。老实了一辈子的爹突然醒悟，大耳瓜子痛打黑心二弟。\n软弱娘对上恶毒婆婆“娘，你再逼我，我就吊死在家门口，让全村看看你恶毒嘴脸！”\n恶毒婆婆“天爷啊！这都是我的词儿啊！”\n古代独生女照样能在灾荒年带着父母过上好日子，还能带着全村一起填饱肚子！\n叶珠：路边的男人不能捡。\n贺铮：救命之恩，我想以身相许。", "tags": [" n她同意了。\n她镇得住侧妃、斗得赢野心勃勃的门阀、哄得了太后。\n几年后，摄政王成了新主。\n跋扈狠戾的年轻帝王，用很缥缈的声音问她：“郡主印换皇后金印，可愿意？”\n她忠诚听话，头一回忤逆他：“不愿！”\n—*—*—\n原书名：《侯府忘恩义？摄政王撑腰，不原谅》", "tags": ["宫斗宅斗", "古代言情", "重生", "王妃", "前世今生", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高门主母的驯夫手册", "fullTitle": "高门主母的驯夫手册", "link": "https://fanqienovel.com/page/7550793954933885976", "data": [20.73, 21.32, 21.99, 22.38, 22.7, 22.76, 22.39], "trend": 1.66, "latest": 22.4, "wordNumber": 547008, "creationStatus": 0, "desc": "程昭被赐婚给最年轻的国公爷周元慎。\n　　周元慎有一房背景强大的娇妾，又与寡嫂暧昧不清，憎恶高门贵女身上的古板沉闷。\n　　偏程昭是受过最正统教养的贵女。\n　　面对国公府层出不穷的争斗、小妾的挑衅、寡嫂暗中拨火，程昭解决起来游刃有余。\n　　“我嫁过来做主母，就是替国公爷收拾烂摊子的。”程昭温良恭俭。\n　　待我地位稳固，有了子嗣，下一个被收拾的烂摊子，就是国公爷你。\n　　——*——*——\n　　初见时，周元慎觉得程昭虚伪狡诈；相处日久，赞她恢廓大度、见识广博。\n　　他周元慎的夫人，没有任何缺点。唯一不好的，是她心中另有所属，不爱他。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "父王，开门！本郡主闯祸回来啦", "fullTitle": "父王，开门！本郡主闯祸回来啦", "link": "https://fanqienovel.com/page/7571356675811052568", "data": [43.19, 44.17, 44.57, 44.87, 45.51, 45.36, 44.73], "trend": 1.54, "latest": 44.7, "wordNumber": 1107108, "creationStatus": 1, "desc": "[轻松诙谐＋无CP＋日常＋团宠＋爽文＋沙雕＋女强＋群像＋权谋＋颠文]\n（简介无能，大家还是直接看正文吧）\n    自从端王府的独苗苗叶琼脑袋被驴踢中失忆后。\n    老纨绔端王好日子到头了。\n    别人家父慈子孝，端王府鸡飞狗跳。\n    叶琼不是在坑爹，就是在坑爹路上。\n    短短半月，不仅荣升为了京城纨绔之首，还成立了纨绔天团。\n    当别人琴棋书画时，叶琼忙着败家逛青楼。\n    当别人宫斗宅斗时，叶琼忙着吃瓜打架斗殴。\n\n    直到某天，众人发现那个臭名昭著的草包郡主，一跃成为了京城的顶流。\n    最火戏楼老板——是郡主。\n    最赚钱的拍卖行东家——是郡主。\n    最大的山匪头子——是郡主。\n    连江湖最厉害的门派门主——也是郡主。\n    百姓给郡主立长生牌，纨绔们认郡主为老大。\n\n    当众人抢皇位抢的火热时，\n    清点银票的叶琼看着自己钱也有了，人也有了。\n    好像不参与一下有点不合群。\n    于是，反手就把自己的跟屁虫小皇孙拎上了皇位。\n    比起皇位，她还是更喜欢当权倾朝野的摄政王。\n【注：不是正经宫斗权谋，本文走轻松诙谐风】", "tags": ["宫斗宅斗", "古代言情", "女强", "团宠", "搞笑轻松", "群像"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春潮夜渡，表姑娘渣得明明白白", "fullTitle": "春潮夜渡，表姑娘渣得明明白白", "link": "https://fanqienovel.com/page/7603646647297379352", "data": [29.65, 30.22, 31.01, 31.3, 31.12, 31.21, 30.44], "trend": 0.79, "latest": 30.4, "wordNumber": 441253, "creationStatus": 0, "desc": "禁忌之恋 #极限拉扯#美强惨 #双向救赎\n非一见钟情，非蓄谋已久，是日久生情，亦是日久生情！\n—\n\n江南茶庄的明珠温以贞，家破人亡后，被卖作扬州瘦马。\n逃出生天后，她带着一身不可告人的技艺与入骨的媚香，投奔至侯府姨母，却深陷二房的算计与觊觎。\n绝境之中，她将目光投向府中最高的冰山——四爷傅霁川。\n他捏起她的下巴，眸色深沉：“你究竟想干什么？”\n她坐在他的腿上，吻上他的喉结：“小叔，现在是想我下去，还是想我亲下去？”\n男人食髓知味，于是一纸荒唐的契约悄然成立——\n他成了她的靠山，而她成了他长夜的慰藉。\n她恪守“玩物”本分，笑问他厌弃后，能否予她千两白银放她离开。\n他冷眼应下，心却在她平静的自贱中，寸寸下沉。\n他们撕毁、重签、修订契约，在人前不熟、人后缱绻的极限拉扯里越陷越深。\n扬州旧案重查，杀父血案与皇室秘辛层层揭开\n他们能否夺回属于自己的一切？\n当初雪来临，这场始于算计的风月游戏，又将如何收场？\n他们都把对方当作救赎的太阳，殊不知，太阳在成为太阳之前，要经历多少毁灭般的聚变。\n—\n纯古言，无穿越重生金手指。\n两个陌生人的相知相恋相许全描摩。\n一起来谈场酸酸甜甜、咸咸涩涩的古风恋爱吧！", "tags": ["宫斗宅斗", "古代言情", "冰山", "契约婚姻", "相互救赎", "古色古香"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "和渣夫同归于尽后又双双重生了", "fullTitle": "和渣夫同归于尽后又双双重生了", "link": "https://fanqienovel.com/page/7402062722877115417", "data": [33.26, 33.26, 33.66, 33.96, 34.04, 33.64, 33.84], "trend": 0.58, "latest": 33.8, "wordNumber": 669864, "creationStatus": 0, "desc": "【实体书《岁岁春欢》已出，全平台可购】\n【女主渣男双重生＋男主穿越＋双向救赎＋扮猪吃虎】\n十七岁这年，沈嘉岁嫁于陆云铮为妻，沈陆两家皆为将门，强强联合。\r\n成婚两年后，陆云铮大败敌国名扬四海，沈家却因通敌叛国满门抄斩。\r\n沈嘉岁临死前才得知，沈家通敌叛国罪证乃陆云铮亲呈，且陆云铮想娶的人从来不是她，而是沈家养女，她视作亲妹妹的顾惜枝。\r\n灭门之仇，欺骗之恨，沈嘉岁临死反扑，拉陆云铮同归于尽。\r\n再一睁眼，重回陆云铮上门提亲那一日。\r\n沈嘉岁匆忙赶到时，陆云铮正深情开口求娶顾惜枝。\r\n原来，陆云铮也重生了......\r\n————\r\n沈家通敌叛国一事迷雾重重，牵涉甚广。\r\n为查清真相，沈嘉岁决然入局，这时，一人着绯红官服站在了她的身旁。\r\n沈嘉岁依稀记得，上一世咽气之时，似有一片绯红衣角闯进视野......\r\n————\r\n江浔：“江某平生所愿，唯山河远阔，国泰民安。如今再添一愿，愿心上之人岁岁无虞，常乐长安。”", "tags": ["宫斗宅斗", "古代言情", "重生", "扮猪吃虎", "HE", "相互救赎"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "勾太傅，人前不熟人后如做了夫妻", "fullTitle": "勾太傅，人前不熟人后如做了夫妻", "link": "https://fanqienovel.com/page/7591861882936380478", "data": [46.01, 45.7, 45.74, 45.8, 46.31, 46.68, 46.49], "trend": 0.48, "latest": 46.5, "wordNumber": 1020365, "creationStatus": 1, "desc": "状元夫君熟睡，宋怜抱住霁月清风的当朝太傅哭：“求求您，救救我……”\n她能有什么错？她只是不想死。\n家规无情，长公主不容人，夫君要做驸马，留给宋怜唯有一条路——吊死。\n于是她壮着胆子，勾引了当朝太傅。\n陆九渊乘着酒意：“如你所愿。”\n从那以后，宋怜予取予求，陆九渊事事如了她的意。\n他俩一个蓄意勾引，一个见色起意。\n人前殊途陌路，人后颠鸾倒凤。\n有人告密：“宋怜她精于算计，处心积虑破坏太傅大婚。”\n陆九渊淡泊道：“我就喜欢被她霸占着，怎么了？”\n-\n太傅陆九渊出去打了场仗，回来发现自己暗中相看好的姑娘，被皇上指给新科状元了。\n他大发雷霆之后也没跟任何人提及，不过一个女人而已，犯不上。\n直到这女人哭着抱着他的腰求他：“求求您，救我……”\n“一哭二闹的。”陆九渊笑纳了，偶尔当回活菩萨也不错。\n可原本是无聊时纾解的玩物，却被他养成了尖牙利爪的小豹子。\n有人状告宋怜为虎作伥，飞扬跋扈，目中无人。\n陆九渊：“我惯的，你适应一下。”\n后来，宋怜说皇帝该换了，陆九渊就把皇帝换了。\n宋怜说反了吧，陆九渊就反了。", "tags": ["宫斗宅斗", "古代言情", "宠妻", "甜宠", "双洁", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "团子助攻王爷请接招", "fullTitle": "团子助攻王爷请接招", "link": "https://fanqienovel.com/page/7613704029318695961", "data": [16.6, 16.6, 16.77, 16.83, 16.81, 16.85, 16.87], "trend": 0.27, "latest": 16.9, "wordNumber": 1237523, "creationStatus": 0, "desc": "特种兵军医沈长宁，在一次任务中牺牲，醒来却发现自己穿进了没读完的宅斗小说里——成了那个被姨母毒害、胖到200斤的蠢笨嫡女。洞房花烛夜，原主被又瘸又瞎的战神八王爷活活折腾死，她穿过来时，只剩一身酸痛和一肚子脏话。\n\n“卧槽！”这是沈长宁穿越后的第一句话。\n\n更操蛋的是，原主体内竟有五年慢性毒，亲弟弟被养成纨绔，母亲的死也疑点重重。而那个表面柔弱的姨母，如今正躺在父亲怀里，享受着本该属于原主母亲的一切。\n\n幸好，前世的手链化作随身空间，实验室、药品、美食一应俱全。她一边解毒减肥，一边暗中查证。谁知那晚一次意外，她竟怀上了那个又瘸又瞎的臭男人的种。\n\n三年后院幽禁，她带着天才儿子种菜养鸡，活得有滋有味。小团子三个月会说话，六个月背诗，七个月走路，三岁就能指挥鸡鸭鹅排兵布阵，智商堪比超级电脑。\n\n直到八王爷大婚之日，一个缩小版的自己突然出现在眼前——\n\n“你就是我爹？”小团子歪着头，“长得还行，就是脑子不太好使，难怪把娘亲关了三年。”\n\n慕容战：“？？？”\n\n当他闯入后院，看到那个曾经200斤的丑女如今身姿婀娜、容颜绝世，正叉腰骂鸡时，整个人都不好了。\n\n“你谁？”\n\n“你祖宗！”", "tags": ["宫斗宅斗", "古代言情", "穿越", "空间", "嫡女", "医术"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古风世情": [{"label": "穿越老朱后宫，我开局冒充长平", "fullTitle": "穿越老朱后宫，我开局冒充长平", "link": "https://fanqienovel.com/page/7634383946045721624", "data": [10.42, 10.42, 11.02, 11.38, 11.78, 12.18, 12.3], "trend": 1.87, "latest": 12.3, "wordNumber": 400419, "creationStatus": 1, "desc": "穿到明朝开国朱元璋的后宫，试图和马皇后宫斗？\n穿越大神是不是有点太看得起我了？\n沈微无语望苍天。\n她穿的原身还没有家族的支持，是假少爷真千金里头，悲催不受待见的真千金。\n一穷二白，前途无亮。\n沈微看看左边，看看右边，痛定思痛。\n人类是有极限的，娘娘，我不做人啦！\n“皇后娘娘！我是大明末代公主长平，求老祖宗救命！”\n忽悠马皇后 卖掉。\n她掌掴二叔，脚踢奶奶，带着被压榨得说话都不敢大声的爹决然断亲自立门户。\n上辈子的千万存款自动兑换成了灵泉空间，还有千亩良田。\n极品敢来闹事，打得他们鼻青脸肿。\n生死看淡，不服就干。\n住着破草棚，食不果腹，身无分文，那就上山打猎、挖草药，赚了银子就能盖房，天天大鱼大肉。\n有人抓着她的把柄来逼婚，直接干死他！\n她的愿望：赚到花不完的银子，直接躺平。\n某天，男人带着所有家当来敲门：“苏晚云，开门，我来入赘了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "女强"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [17.58, 20.27, 21.96], "trend": 4.38, "latest": 22.0, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [13.49, 14.62, 16.83], "trend": 3.34, "latest": 16.8, "wordNumber": 899310, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [44.64, 45.9, 46.88], "trend": 2.24, "latest": 46.9, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "发配边关，罪妻开荒养出战神", "fullTitle": "发配边关，罪妻开荒养出战神", "link": "https://fanqienovel.com/page/7613410424586767385", "data": [77.73, 79.1, 79.78], "trend": 2.06, "latest": 79.8, "wordNumber": 740149, "creationStatus": 1, "desc": "【边关生活+木系+御兽+宠夫+护短+开荒种田+甜宠+双强直球夫妇+对照组】\n大靖连旱两年，粮荒四起，战火燃遍辽东。\n末世后勤员苏禾穿成罪奴丫鬟，被发配给军户为妻。\n罪奴姐妹极力表现，力争抢个优秀男儿，而她只看安全感，一眼锁定全场最壮的百户萧征。\n他冷脸拒绝：“我不需要媳妇，赏我粮食就行！我养不起，也没功夫照顾。”\n她直白坦荡：“我不用你照顾。我能种地，能持家。你很强，跟你，我安全。”\n没媳妇前的萧征：女人真麻烦！\n有了媳妇后，萧征夜夜搂着苏禾：真得劲！媳妇，再来二十个馒头！\n自此，边关多了一对双强夫妇。\n他负责拿刀护她，横扫敌军；\n她负责种田产粮，兜底全家。\n极品邻居攀比？打脸！\n边关缺粮断炊？解决！\n敌军突袭包围？放野兽！\n萧征从穷军户一路封将，世人皆知：\n大将军最厉害的不是战功，是他那位能种出天下粮的媳妇。\n【饭桶将军×产粮小媳妇】\n你负责打仗护家・我负责种地养你", "tags": ["种田", "古代言情", "乡村", "穿越", "强强", "宠夫"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [12.46, 13.27, 13.95], "trend": 1.49, "latest": 14.0, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [14.41, 14.98, 15.72], "trend": 1.31, "latest": 15.7, "wordNumber": 4610075, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [16.93, 17.53, 18.08], "trend": 1.15, "latest": 18.1, "wordNumber": 890944, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [11.18, 11.78, 12.31], "trend": 1.13, "latest": 12.3, "wordNumber": 1766776, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "悍妻进门：扶起一屋软骨头", "fullTitle": "悍妻进门：扶起一屋软骨头", "link": "https://fanqienovel.com/page/7624469403525975064", "data": [13.02, 13.48, 13.76], "trend": 0.74, "latest": 13.8, "wordNumber": 652785, "creationStatus": 1, "desc": "【漫剧、真人有声已出】王金珠穿越成屠户的女儿，倒贴嫁妆嫁了个猎户。\n奈何猎户一家子全是软骨头，对着吸血的二房，偏心的二老，屁都不敢放一个。\n眼看小姑子都要被卖了，她的傻相公和公婆只知道跪地请求，她忍不了了。\n这群软骨头，她非给他们扳直了。", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "虐渣"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "婆家休娘家拒！困境中潇洒翻身！", "fullTitle": "婆家休娘家拒！困境中潇洒翻身！", "link": "https://fanqienovel.com/page/7576293473200901182", "data": [23.91, 24.18, 24.38], "trend": 0.46, "latest": 24.4, "wordNumber": 1140354, "creationStatus": 1, "desc": "空间+商超+大女主+无cp\n两世抓奸：\n前世爸爸出轨被自己抓奸，重活一世丈夫背叛，被自己抓奸，难道老天爷就是派自己来抓奸的。\n柳思月发现父亲养小三，还有一个私生子，她与小三起冲突，被父亲拉扯摔倒，遭遇车祸。\n再醒来时，发现自己身处一个陌生的环境，看着一张张陌生的脸，嘴里说着关心的话，原来她占用了一个叫柳四月的女子的身体。\n柳四月被父母卖给邻村陆家当童养媳，那年她八岁，被带走的那天，爹娘对她说：“今天出了柳家门，从此不再是柳家人。”\n到了婆家，把她当牲口使唤，干的多吃得少。\n偶然间，撞破了丈夫和大嫂的奸情，吓得柳四月早产生下一个女儿，陆家诬陷她与人私通，这孩子根本不是小叔子的，陆云舟一纸休书，让她带着自己生的赔钱货滚。\n她抱着女儿回娘家，被爹娘哥嫂赶出来。\n心灰意冷起了轻生的念头,她站在村口的土崖边，望着曾经长大的地方，谁知脚下的土一松，整个人摔了下去，被路过的村民所救，送到娘家不留，又送到二叔家，收留娘俩。\n上天垂怜，赏赐空间，还带了一个商超，老天爷有些可爱，重活一世，绝不辜负……\n看她如何改变命运，带二叔发家致富……\n报复陆家……\n打脸娘家！有肉，汤都不给娘家喝……", "tags": ["种田", "古代言情", "空间", "无CP", "打脸", "发家致富"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世：兽夫太凶猛", "fullTitle": "穿越兽世：兽夫太凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [12.09, 12.28, 12.51], "trend": 0.42, "latest": 12.5, "wordNumber": 1328196, "creationStatus": 0, "desc": "【穿越兽世＋轻快甜宠+生活日常＋1vN+多雄】\n千夏在21世纪是个勤勤恳恳的打工人，这天加完班回家路上被一辆失控的汽车撞死，没想到当她再睁开眼的时候是在一个巨大的山洞里。\n山洞阴暗潮湿让她惶恐，而她身上只围着一块抹胸样式和短裙样式的破烂兽皮，她不明白她明明死去了又怎么会出现在这里。\n难道......忽然见她脑袋里电光一闪，她又细细看了身上的兽皮，这......不会是像她看的兽世小说那样，穿越兽世了吧？？？\n别人的第一兽夫是四阶、五阶强者，她一个最不受欢迎的瘦弱丑雌的第一兽夫就是这大陆的顶尖战力强者。\n上辈子她兢兢业业连个恋爱都谈过，这辈子刚穿来没多久就肚里揣崽，还上演了一场兽世带球跑。", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "带球跑"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadiu
