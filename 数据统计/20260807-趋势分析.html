<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 8月1日–8月7日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

s": ["星光璀璨", "现代言情", "穿越", "娱乐圈", "学霸", "无CP"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女变男：顾鱼的练习生之旅", "fullTitle": "女变男：顾鱼的练习生之旅", "link": "https://fanqienovel.com/page/7647493458873043992", "data": [3.42, 3.4, 3.37, 3.31, 3.35, 3.46, 3.62], "trend": 0.19, "latest": 3.6, "wordNumber": 250526, "creationStatus": 1, "desc": "小时候的顾鱼瘦的跟个外星人似的，在小学门口因为跟一个怪叔叔对视一眼，从而进入一家娱乐公司当练习生。\n【星探】你们知不知道这种长相的！以我多年的经验来看，绝对是能开出绝世大帅哥的！\n于是顾鱼成为了一名练习生，一边上学一边去公司练习。\n到公司后因为吃的不限量，顾鱼因为吃的太多，跟周围一群嫌饭不好吃的其他练习生们形成了鲜明的对比，不爱吃？那太好了，都是我的了！\n顾鱼把自己吃的圆滚滚的，连练习舞蹈的苦都觉得不苦了。\n为了省出买盲盒的钱坐公交去公司，公交站离公司还有一公里的距离，为了躲避拍照的代拍们，每天快速跑进公司，经常在其他练习生们从各种豪车上下来进入公司时，从旁边跑过成为背景图。\n粉丝们翻看照片时总会发出疑问，那个在各个练习生后面跑的有点模糊的是谁？\n在其他粉丝互吵你家正主是黄子，是皇族，争颜永一时，顾鱼的粉丝都是在一边看热闹的。自家的小胖墩有种把秋衣扎在秋裤的实在感。\n随着时间的推移，营养跟上去的顾鱼，慢慢开始抽条，那张被星探追着不放的脸也逐渐显现出来。\n在看到自家爱豆逐渐显露出来的颜值，粉丝们表示，等一下！等一下！顾鱼你让我感到陌生！\n这是一个励志，温馨的日常文，在粉丝爱中长大的练习生", "tags": ["星光璀璨", "现代言情", "重生", "娱乐圈", "前世今生"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "嫌他穷？重欲太子爷按哭恶毒前妻", "fullTitle": "嫌他穷？重欲太子爷按哭恶毒前妻", "link": "https://fanqienovel.com/page/7637546200119397401", "data": [13.59, 13.59, 17.6, 19.5, 21.2, 22.91, 25.41], "trend": 11.82, "latest": 25.4, "wordNumber": 172139, "creationStatus": 1, "desc": "【出租屋文学+破产大小姐搞钱+阴湿小狗暗恋】\n开局破产，负债千万。\n被堵在巷子里，章月以为自己要完，\n曾经被她踩在脚底的穷小子江远辞，\n却冲出来替她挡了三记闷棍！\n\n距离拉近一米，他头顶突然疯狂闪过发光弹幕，\n【心疼！未来千亿首富就是今晚瘸腿彻底黑化的！】\n【这恶毒女配不仅卷走他最后的饭钱，以后瞎眼断腿遭报应！】\n\n千亿首富？瞎眼断腿？\n章月瞬间清醒！\n这粗大腿她今天抱定了！\n“穷鬼，拼个婚吗？你请我。”\n江远辞不信，大小姐刚刚还把他骂成狗，现在就要结婚了？\n“把我当成摇尾乞怜的狗是吗？”\n“结不结？！”\n“汪汪汪！结！”\n弹幕全疯了：\n【说好的清冷暴戾未来首富呢？怎么像个被霸王硬上弓的小媳妇！】\n【恶毒前妻你住手啊！搞钱就搞钱，别一直盯着腹肌看啊！】\n婚后阴湿男爆改粘人忠犬，被她搞得羞涩难当。\n章月：“不是，说好的阴郁绝情大男主呢？这粘人精是谁啊？！”\n江远辞支棱起来了：“乖，叫老公。”", "tags": ["现言脑洞", "现代言情", "宠妻", "先婚后爱", "独宠", "发家致富", "忠犬"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [9.03, 10.09, 10.87, 11.56, 11.95, 12.26, 12.0], "trend": 2.98, "latest": 12.0, "wordNumber": 200352, "creationStatus": 1, "desc": "（新书）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“……要。”\n\n她是他的血养出来的妖，也是他这辈子唯一的因与缘。\n（女主控放心观看，纯甜无虐）\n（文风轻松跳脱，诙谐幽默，不爱看勿入！！）\n（很甜！！甜的发腻！！不爱看甜的勿入！！）", "tags": ["现言脑洞", "现代言情", "双洁", "精灵", "幻想言情", "双向奔赴", "情有独钟"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "双重生后，我考公上岸了", "fullTitle": "双重生后，我考公上岸了", "link": "https://fanqienovel.com/page/7660718439375326233", "data": [9.08, 9.08, 10.3, 10.67, 10.4, 10.36, 10.13], "trend": 1.05, "latest": 10.1, "wordNumber": 195175, "creationStatus": 1, "desc": "苏沅重生了，回到22岁那年夏天。\n前夫也重生了，转身牵了别人的手。\n苏沅：懂了，各走各的路。\n考公上岸，入职省直单位，日子清闲体面。外加绑定一个每周秒杀系统，养元丹、储物空间、股票情报，该有的都有。\n他奔他的前程，我过我的日子。\n这一世，为自己活。", "tags": ["现言脑洞", "现代言情", "系统", "重生", "前世今生", "双重生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越星际兽世：成为虚拟偶像顶流", "fullTitle": "穿越星际兽世：成为虚拟偶像顶流", "link": "https://fanqienovel.com/page/7655195003299318809", "data": [9.54, 9.54, 10.0, 10.5, 10.82, 10.87, 10.2], "trend": 0.66, "latest": 10.2, "wordNumber": 216573, "creationStatus": 1, "desc": "【星际兽世+主事业线无CP+非女强文，妹宝女主（有明月独不照我情节）+雌少雄多+万人迷+雄竞+系统】\n云岁穿越到了雌少雄多的星际兽世。\n\n\n\n云岁穿越前身体已经火化。\n\n系统绑定她后，用最后能量保住了她的灵魂带她穿越，要重新造出身体需要100亿星币能量。\n\n由于系统规则，虽然它的科技水平大于这个世界的水平，却不能做违法乱纪的事情，只能云岁自己想办法赚钱获得身体。\n\n云岁眼前一黑，虽然不知道1星币多少钱，但100亿就让人感觉人生无望了，其实当阿飘挺好的。\n\n系统却告知由于雌性在星际兽世过于稀少，现在很流行虚拟偶像，是大流量，操作好会很赚钱。\n\n云岁为了拥有新身体，注册了成为恋爱向虚拟偶像。\n\n想原来世界，恋爱向抽卡类虚拟偶像都很赚钱，云岁磕绊在系统的掩护下大胆出击，给这个荒芜的精神世界带来一次次的精神盛宴。\n\n每一次的打歌，舞台，综艺，影视，联动，都引爆全网。\n\n后来云岁拥有了最大的后援会。\n\n云岁生日当天全国大屏庆生。\n\n云岁联动全星铁刷屏。\n\n成星际兽世第一顶流。\n\n众多位高权重的大人物不相信这么完美的云岁是虚拟偶像，世人觉得他们疯魔，查探证明她是真的，结果越扒越有！\n最后云岁掉马。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "星际", "无CP"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：关于我的吸引疯批体质", "fullTitle": "快穿：关于我的吸引疯批体质", "link": "https://fanqienovel.com/page/7637132188705639486", "data": [5.84, 5.89, 5.99, 5.97, 6.02, 6.03, 6.12], "trend": 0.27, "latest": 6.1, "wordNumber": 174186, "creationStatus": 1, "desc": "【强制+1vn 】\n温念身上有个专门吸引疯批的光环，不是真正的疯批不会中招，而且还是永久性的。\n好在世界上还是正常人居多。\n不好在她总能遇到不太正常的人。", "tags": ["现言脑洞", "现代言情", "学霸", "校园", "一见钟情", "情有独钟", "系统"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [6.23, 6.23, 9.88, 11.79, 13.05, 14.31, 15.54], "trend": 9.31, "latest": 15.5, "wordNumber": 200955, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [3.65, 3.65, 3.92, 4.06, 4.19, 4.65, 5.16], "trend": 1.51, "latest": 5.2, "wordNumber": 264096, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "魂穿", "剑修"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [9.03, 9.27, 9.45, 9.41, 9.29, 9.33, 9.39], "trend": 0.37, "latest": 9.4, "wordNumber": 252227, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙崽心声曝光后，六界都不好了！", "fullTitle": "龙崽心声曝光后，六界都不好了！", "link": "https://fanqienovel.com/page/7626321035767335961", "data": [8.35, 8.49, 8.63, 8.71, 8.66, 8.69, 8.71], "trend": 0.36, "latest": 8.7, "wordNumber": 254154, "creationStatus": 1, "desc": "【双洁1V1+全员读心+三界团宠+养崽撒糖+轻松救赎无虐】\n高考前夕，叶黎惨遭人间至恶！\n辛苦打工攒下的学费被表妹偷走，舅舅舅妈颠倒黑白，将他打伤后像丢垃圾一般赶出家门。\n无依无靠，遍体鳞伤的他，本以为人生就此落幕，却意外绑定天道救赎系统，重生成了一颗圆滚滚的至尊龙蛋！\n更炸裂的是，他的‘生母’，是六界 陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [5.27, 5.27, 6.0, 6.49, 6.98, 7.25, 7.63], "trend": 2.36, "latest": 7.6, "wordNumber": 187971, "creationStatus": 1, "desc": "（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [5.18, 5.18, 6.07, 6.42, 6.64, 6.76, 6.89], "trend": 1.71, "latest": 6.9, "wordNumber": 267619, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [5.74, 5.74, 6.04, 6.37, 6.31, 6.27, 6.57], "trend": 0.83, "latest": 6.6, "wordNumber": 185207, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成对照组女配我把男女主玩疯了", "fullTitle": "穿成对照组女配我把男女主玩疯了", "link": "https://fanqienovel.com/page/7635566031313849406", "data": [7.47, 7.47, 8.18, 8.42, 8.38, 8.28, 8.19], "trend": 0.73, "latest": 8.2, "wordNumber": 289557, "creationStatus": 1, "desc": "顾昭昭穿成一本对照组小说的妯娌女配，最恶心的是她还获得一个女主助攻暴击系统。\n　　对照组还不够，还要她为女主服务是吧。\n　　既然这样玩，那就别怪她了。\n　　好孕多子？一胎十宝不用谢。\n　　心地善良，随手一救就是贵人？一个贵人哪够，百倍暴击，一下晕倒一百个在她前面，吓不死她！\n　　男配都爱她，二三四个男配哪里够，直接来个千倍暴击，男主头上青青草原。\n……\n只是这个她随便将就一下的男人是怎么一回事，怎么就黏上甩不掉了。\n谢彦平好不容易娶了个妻子，老婆没心没肺就算了，还总想把他甩掉，谢彦平表示，是他的，就永远是他的，想跑，打断腿哦~~~", "tags": ["年代", "现代言情", "系统", "穿越", "魂穿", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿50年代，我怎么又擦边上岸", "fullTitle": "胎穿50年代，我怎么又擦边上岸", "link": "https://fanqienovel.com/page/7651321133513313305", "data": [5.57, 5.57, 6.17, 6.18, 6.19, 6.18, 6.03], "trend": 0.45, "latest": 6.0, "wordNumber": 267897, "creationStatus": 1, "desc": "刚出分!会涨!\n程雅上辈子加班猝死，一睁眼胎穿五十年代。\n她没有改变世界的能力，只是一个比较幸运的普通小孩，普普通通的成绩，比上不足，比下有余，大方耐看的长相，但按她妈的说法，她奸懒馋滑，偏偏吃饭最积极。\n可是她有个特异磁场——逢考必擦边，堪称当代女版孙山。小升初时，她妈看了三分钟榜单，愣是在最后一个犄角旮旯看到了她的名字。1965年中考，历史再一次重演，她又一次擦边考上中专。录取通知书到手第二天，广播响了：全国取消高考。全家发出了尖锐的爆鸣声，她妈蹲在院子里又哭又笑。\n好不容易中专毕业了，国家包分配。她满怀期待本以为能进县机械厂端铁饭碗，结果上个厕所的功夫转角听说名额被厂领导的儿子占了。程雅心一横，让家里买了点特产，茶叶里头塞了点人情世故，去找负责的老师哭。老师看她哭得可怜又有眼力劲儿，透露了一个消息：粮站最近也有一个指标，本来也是那个厂领导儿子要去的，但人家临时改了主意不去了。程雅连夜递了材料，最后一名擦边进了粮站。\n1969年，她十九岁，年纪轻轻风华正茂。铁饭碗也有了，家里又开始催婚。\n行吧，但她相了一圈亲发现，好嘛，她成资源了。果断微笑拒绝，结果转角遇到貌美落泪小狗…", "tags": ["年代", "现代言情", "穿越", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世混子苟在东北", "fullTitle": "末世混子苟在东北", "link": "https://fanqienovel.com/page/7651616019772886040", "data": [8.71, 8.71, 9.01, 8.92, 9.04, 8.97, 8.99], "trend": 0.28, "latest": 9.0, "wordNumber": 226660, "creationStatus": 0, "desc": "林晚宁，一个末世里七个不服八个不愤的混子！与大佬温柏青和丧尸皇同归于尽后，以为就此一了百了！\n谁曾想一睁眼魂穿了，被迫发誓，才得了个干瘪的身体，一个倔的要命的爷爷！\n从此她走上了和老爷子斗志斗勇，和末世大佬重遇，相爱相杀的道路……", "tags": ["年代", "现代言情", "穿越", "空间", "相爱相杀", "大佬"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替姐下乡？我搬空家底闪耀七零", "fullTitle": "替姐下乡？我搬空家底闪耀七零", "link": "https://fanqienovel.com/page/7655596159691394072", "data": [5.56, 5.56, 6.18, 6.43, 6.55, 6.41, 5.77], "trend": 0.22, "latest": 5.8, "wordNumber": 275970, "creationStatus": 1, "desc": "宁晚秋重生了，一睁眼，偏心父母正逼她替白莲花姐姐去苦寒的北大荒下乡。\n前世她隐忍退让，却落得个惨死异乡的下场，而姐姐和渣男未婚夫却踩着她的血肉恩爱一生。\n重活一世，宁晚秋冷笑：这垫脚石，谁爱当谁当！\n下乡名额是吧？她反手设局，亲手送白莲花姐姐嫁给胡同里暴戾的二流子！\n逼她净身出户？她觉醒双层现代百货与医药空间，连夜将偏心父母和渣男家的存折、黄金、大米白面搬得连渣都不剩！\n拍拍屁股，她带着百亿物资和神医传承，美滋滋地奔赴北大荒。\n本以为要在林海雪原里猫冬致富，谁知一不小心，救了前未婚夫那位权势滔天、冷硬如铁的军区大佬大哥——陆闻野。\n那个平日里生人勿近的冷面阎王，却在风雪夜里将她死死抵在炕沿上，声音暗哑：“晚秋，跟了我，命都给你。”", "tags": ["年代", "现代言情", "乡村", "重生", "空间", "大佬"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [6.42, 6.42, 6.52, 6.66, 6.73, 6.73, 6.61], "trend": 0.2, "latest": 6.6, "wordNumber": 298926, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "先婚后爱：大小姐被糙汉狠狠宠爱", "fullTitle": "先婚后爱：大小姐被糙汉狠狠宠爱", "link": "https://fanqienovel.com/page/7646781632002657342", "data": [6.14, 6.14, 6.32, 6.28, 6.24, 6.4, 6.21], "trend": 0.07, "latest": 6.2, "wordNumber": 184030, "creationStatus": 1, "desc": "【先婚后爱+恶女作精+狼兔文学+糙汉+疯批强制】\n一觉醒来胡若桃穿成昨晚看的年代文里对照组娇气恶毒女二。\n原书男女主是根正苗红的贫下中农，青梅竹马，因为原女主觉醒了治疗系统，帮助男主治好眼疾后，两人便在一起了，男主考上大学毕业后直接当了官，一路高升。\n相反，胡若桃和她的未来老公在特殊时期开始后就成了人人喊打的对象，过得好不凄惨。\n胡若桃当即立断收拾包袱去了乡下，她要先一步嫁给大佬，争取能在特殊时期过得安稳。\n——\n穹野因意外娶了个娇滴滴的大小姐，大小姐不仅要饮琼浆，食珍味，夜枕玉枕，身盖锦罗，而且不爽了就打他，天天把他当奴仆使，当狗喂，当马骑。\n村里人都说他命好，穹野只冷笑。\n后来———\n深夜。\n“穹野，我要现在！立刻！上山去捉兔子！”\n男人声音淡淡：“别胡闹。”\n大小姐气鼓鼓一翻身：“我不跟你玩了，我要去找舟舟！”\n男人伸手将人捞过来，捏住她的小脸，眼睛发红声音发狠：“我的乖宝，你说…你想找谁？”\n再后来——\n“听说没，穹野他媳妇跑了。\"\n“就说这小子没好的福气，守不住，他人呢？”\n“疯魔了，满地找媳妇呢。”\n注：大小姐是真的作。", "tags": ["年代", "现代言情", "乡村", "穿越", "先婚后爱", "作精"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "快穿": [{"label": "快穿：偏偏我过得最好", "fullTitle": "快穿：偏偏我过得最好", "link": "https://fanqienovel.com/page/7658313395673762878", "data": [7.48, 7.83, 8.63, 9.53, 10.07, 10.52, 10.93], "trend": 3.45, "latest": 10.9, "wordNumber": 191938, "creationStatus": 1, "desc": "评分刚出来，会慢慢涨的啊！\n【快穿+系统+空间】【无固定cp，cp的出现也是为了女主而服务的】\n做完十个快穿任务退休的李瑶，有一天又被系统哭唧唧的找上门了！\n在李瑶的哄骗下，系统和她终身绑定了！\n而三千世界，可怜人千千万万！\n看精致利己主义的李瑶如何摆脱剧情杀，又偏偏是过得最好的那一个！\n……\n简介无能，请看正文呀！", "tags": ["快穿", "系统", "幻想言情", "穿越", "空间", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局穿渣男？笑话！软饭我吃定了", "fullTitle": "开局穿渣男？笑话！软饭我吃定了", "link": "https://fanqienovel.com/page/7646322248013335576", "data": [7.11, 7.11, 8.09, 8.4, 8.9, 8.97, 9.46], "trend": 2.34, "latest": 9.5, "wordNumber": 252811, "creationStatus": 1, "desc": "开局穿渣男？笑话！软饭我还吃定了！\n（快穿+家长里短+打脸+软饭男+无固定CP+没有金手指+脸好看）\n许砚舟实验室爆炸身亡，意外绑定快穿系统，为了回到实验室爆炸前两小时，他只能不停的在小世界做任务，但是谁来告诉他为什么每次都穿成吃软饭还吃不明白的渣男啊？\n不过没关系，他胃不好，最会吃软饭了。\n世界一：尚公主的侯府小少爷\n世界二：影后的厨神小男友\n世界三：被富婆包养的男公关\n世界四：被榜下捉婿的探花郎\n世界五：靠岳丈一家供养的知青\n（未完待续…… ）", "tags": ["快穿", "系统", "幻想言情", "穿越", "公主", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：管好自己，莫渡他人", "fullTitle": "快穿：管好自己，莫渡他人", "link": "https://fanqienovel.com/page/7623736893842148376", "data" 现不仅穿越了，脑子还慢慢恢复人类意识了。\n更重要的是，眼前这个拿符引天雷劈自己的一字连眉帅大叔，不是自己的童年男神林凤娇（林九英）么！\n霖青青上去就是一个蛤蟆飞扑抱住九叔的大腿，“师傅！我是你从未蒙面的亲徒弟啊！”\n林九：“？”\n秋生：“师傅你背着我们外面有别的徒弟了？”\n文才：“哇！师傅你好厉害啊，僵尸王都求你收徒啊！”", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱", "风水秘术"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：挖野菜的那帮人", "fullTitle": "盗墓：挖野菜的那帮人", "link": "https://fanqienovel.com/page/7653271844002221081", "data": [2.98, 3.11, 3.23, 3.34, 3.31, 3.35, 3.48], "trend": 0.5, "latest": 3.5, "wordNumber": 205199, "creationStatus": 1, "desc": "【原创女主+原著主角团+无CP+ooc+不走原剧情+剧情不够怪物来凑+自己想吃什么加什么】\n第一次见胖子往包里塞洛阳铲，季嬗伊问：“这啥？”\n“挖野菜的，山里的野菜纯天然无污染，吃着得劲儿。”胖子面不改色\n她又指了指张起灵背上那把黑金古刀。\n“砍柴的。”胖子抢答。\n“砍柴用这么长的刀？”\n“高处的柴火好烧。”\n又指了指无邪手里的黑驴蹄子。\n“熏好的野味，一会和野菜一起炖汤，那叫一个香。”\n季嬗伊点点头，没再问了。\n后来黑瞎子加入，背了个探阴爪，不等她开口，胖子主动介绍：“挖萝卜的，野萝卜不好挖。”\n解语臣拎着绳钩站在旁边，问:“那我这个呢？”\n胖子想了想：“晾衣绳，出门在外得自己洗衣服，勤快！”\n“你们装备挺全。”她说，“又是挖野菜又是砍柴又是野味又是拔萝卜，还带晾衣服的。”\n“那可不。”胖子拍胸脯，“专业驴友。”\n“行。”季嬗伊点点头，“那下次我带口锅，咱们就地野炊。”\n黑瞎子笑出声。\n张起灵没说话，默默把刀往背后挪了挪。", "tags": ["女频悬疑", "悬疑", "悬疑恋爱", "风水秘术", "盗墓", "无CP", "同人"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沙海：盈而不溢", "fullTitle": "沙海：盈而不溢", "link": "https://fanqienovel.com/page/7650859338046639128", "data": [1.77, 1.77, 1.99, 2.06, 2.12, 2.16, 2.2], "trend": 0.43, "latest": 2.2, "wordNumber": 164702, "creationStatus": 1, "desc": "【天才型女主all+巨量私设+鬼吹灯部分设定+文抄公情节…待补充】\n本书唯一主角姜盈。\n2年前，姜盈以为只是一次普通的重生，并且可能是重生特性，脑子也直接直接超进化了，一跃成为学神，本以为自己会这样平淡但不平凡地走下去，为果家争光。但没想到2年后上了高中刚准备大展身手，她就发现自己的同班同学有一个叫黎簇的，而他的朋友一个叫苏万一个叫杨好。她这时才明白她不止是重生，而且还是穿越！\n穿的还是某三叔写的大坑笔记！而当姜盈发现不对劲时，时间线已经来到了沙海计划的开始…\n并且吴邪好像对黎簇等人没有任何兴趣，却对她有了极大兴趣，姜盈看似面无表情很镇定实际内心os：吴邪你滚啊…我只想好好上学！\n吴邪：…现在的小孩都这么难忽悠？我居然比不过那个叫苏难的汪家人？宁愿跟王盟说话都不跟我说话是什么意思？（醋意up）\n王盟：小盈，你快走吧，我家老板就是个变态！\n苏难：小满，跟我回汪家吧。\n瞎子：我徒弟说得对！…王盟说得也对（咬牙切齿）", "tags": ["女频悬疑", "悬疑", "天才", "灵异", "同人", "悬疑恋爱"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "南部档案：我真没招了", "fullTitle": "南部档案：我真没招了", "link": "https://fanqienovel.com/page/7653395831701130302", "data": [3.89, 3.89, 4.17, 4.33, 4.11, 4.08, 4.11], "trend": 0.22, "latest": 4.1, "wordNumber": 151784, "creationStatus": 1, "desc": "【南部档案+OOC+原创女主+只管吃不管埋】\n盘花海礁案，这个只了解过只言片语的故事，真实的在张南絮的面前上演了。\n老天鹅，她只听过南部档案这四个字啊！\n顶多知道张海侠死在了南洋。\n别的？她真的求求了，她真的不知道啊。\n*\n张海盐和张海侠在调查盘花海礁案的时候，发现了一个被张瑞朴藏起来的张家女。\n而这个张家女，跟他们一起经历了一切后回到了马六甲。\n这个张家女一问三不知，而厦门那边失联了。\n所以这个叫张海絮的人，到底身份是什么，没有查到。\n他们也不知道，厦门档案馆内的资料，也被篡改了。\n鉴于张瑞朴之前是元老级别的人，张南絮的身份彻底成为了谜团。\n*\n张海侠的温柔，张海盐的逗比，张南絮只想把张海盐的嘴缝上，就你有嘴是吧？\n莫云高的事情发生。\n*\n山海不相见，见之必亡。\n亡不亡的，张南絮只想说：别闹了，你们谁能有我这个穿越来的知道的剧情多？\n这也就是不知道南部档案的剧情，不然都不会变成这样的。\n但是话说回来了，你们老是追着我干什么？\n张海侠：阿絮，你之前说的话还算数吗？\n张海盐：我俩是兄弟，你不能厚此薄彼啊，我也要跟你睡。\n张启灵：？\n张海琪：我两个儿子都不错，考虑一下？", "tags": ["女频悬疑", "悬疑", "穿越", "灵异", "同人", "悬疑恋爱"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：被反派养大的我成了万人迷", "fullTitle": "盗墓：被反派养大的我成了万人迷", "link": "https://fanqienovel.com/page/7650550461103082558", "data": [4.19, 4.19, 4.18, 4.2, 4.16, 4.18, 4.28], "trend": 0.09, "latest": 4.3, "wordNumber": 248335, "creationStatus": 1, "desc": "【恶女预备役+美艳笨蛋美人+微万人迷+全员暧昧向】\n巴乃深山里，养出了一株有毒的野玫瑰。\n山月长了一张稠艳秾丽的脸，行事却不择手段，毫无善恶观。\n【划重点：女主前期善恶不分（注：没有说后期就分的意思）】\n七岁那年，父母双亡。\n山月哭闹着上山，一头撞进了那个毁容怪物的怀里。\n塌肩膀最初收留她，只想把她当成最听话锋利的棋子。\n可养着养着，棋子没变聪明，他的控制欲倒先变质了。\n他用扭曲又深沉的爱，将她浇灌成快活耀眼的模样。\n直到某天，吴邪一行人来到了巴乃。\n───\n避雷：女主大美人，表面恶女切开带点笨。\nooc预警，私设如山，介意勿入。", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [6.05, 6.05, 7.1, 7.51, 7.89, 8.33, 8.66], "trend": 2.61, "latest": 8.7, "wordNumber": 152179, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐  2.99, 3.02, 3.04, 3.03], "trend": 0.35, "latest": 3.0, "wordNumber": 180335, "creationStatus": 1, "desc": "【古代言情＋种田＋逃荒＋基建＋女主成长＋年下养成】\n【年下娇羞小将军vs全能型末世大佬】\n末世挣扎求生五年，最后还是死在了丧尸手里，苏清禾本以为要重新投胎了，却不想一睁眼穿成了古代的农家长姐，刚穿来就是天崩开局，斗极品亲戚，爹娘还都死了，却留下两个妹妹，和一个几个月大的弟弟给她抚养，\n她都还没来得及适应新身份，就拖家带口踏上了逃荒路，\n没有家人帮衬没关系，没有她有灵泉空间，还有一身的本领，足够她带着弟妹在这乱世中生存下去，\n只是原本收养的小萝卜头不知道什么时间就悄悄长大了，她教他习武，教他杀人，在他被强制征兵后成为他坚实的后盾，看着他从青涩稚童到意气风发的少年将军，苏清禾满是吾家有弟初长成的成就感，本以为是相依为命的姐弟情，却不想随着她身边的追求者越来越多，他的占有欲也愈发浓烈，\n萧衡哪里知道某人对他也是觊觎已久，只是眼睁睁看着他一步步踏入自己早已编织好的牢笼，", "tags": ["种田", "古代言情", "乡村", "逃荒", "基建", "年下"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.71, 2.71, 2.68, 2.65, 2.61, 2.57, 2.94], "trend": 0.23, "latest": 2.9, "wordNumber": 280893, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "乡村", "甜宠", "打脸", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿成末世炮灰，被重生大哥娇宠了", "fullTitle": "穿成末世炮灰，被重生大哥娇宠了", "link": "https://fanqienovel.com/page/7650061683078990873", "data": [9.76, 9.76, 10.82, 11.31, 11.38, 11.32, 11.27], "trend": 1.51, "latest": 11.3, "wordNumber": 177801, "creationStatus": 1, "desc": "【末世+穿书+空间+打脸+囤物资】\n【穿书女+重生男】\n苏小满穿成了末世文里的炮灰——男主早死的未婚妻。\n开局末世爆发，被男女主推出去引丧尸，书里原主不仅毁容，还险些丧命。\n苏小满直接开大。\n谁惹的祸谁背！！\n反手捅破男主拥有异能的秘密，嘲讽他贪生怕死，顺手抢回原身母亲的遗物。\n——女主的空间。\n“你俩不就是他想睡你，你想被他睡，王八配狗，天长地久。”\n划清界限，疯狂囤货。\n一通电话打破了平静。\n“我是陆晏之，三日后我到，一天时间出现在我面前，否则当你死了。”\n苏小满这才想起，原身名义上的大哥，在书里战力逆天。\n带领众人逼退丧尸王，可惜在书里最后一次丧尸潮中陨落。\n这金大腿。\n她抱定了！！\n——\n陆晏之上辈子视命令高于一切，始终冲锋在前，一次意外全军覆没。\n死后灵魂不散，才知晓一切不过是怀璧其罪，反倒让某人捡了便宜。\n重生携异能归来，他火速囤物资、寻队友，事事抢先一步。\n可偏偏出现了一个变数。\n“哥哥，真是物资吗？”\n“哥哥，后面好像有燃油。”\n“哥哥……”\n——\n陆晏之忍无可忍，一把将人按在床上，“说，你到底是谁。”\n苏小满：“……”\n完了，好像演过头了。", "tags": ["科幻末世", "穿越", "空间", "末世", "囤物资", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.14, 5.29, 5.68, 5.95, 5.97, 5.97, 5.99], "trend": 0.86, "latest": 6.0, "wordNumber": 252842, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.64, 9.65, 9.58, 9.54, 9.63, 9.68, 9.81], "trend": 0.17, "latest": 9.8, "wordNumber": 259409, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "民国言情": [{"label": "陈皮阿四之多情种", "fullTitle": "陈皮阿四之多情种", "link": "https://fanqienovel.com/page/7537294523685145625", "data": [0.35, 0.47, 0.65, 0.77, 0.98, 1.3, 1.57], "trend": 1.22, "latest": 1.6, "wordNumber": 239087, "creationStatus": 1, "desc": "故事发生在四屠黄葵之后……初见时，浑身浴血的少年黑沉着眸子，无法无天的流氓做派。\n后来竟将整颗真心奉上，只求她的怜惜……\n披着老九门外衣的小甜文\n私设如山，努力不崩人设\n给橘子皮一个小小的羁绊", "tags": ["民国言情", "现代言情", "古代言情", "古色古香", "医术", "武侠"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "哥哥亲手养大的妹妹竟是卧底", "fullTitle": "哥哥亲手养大的妹妹竟是卧底", "link": "https://fanqienovel.com/page/7662703968958549017", "data": [1.09, 1.09, 1.39, 1.49, 1.53, 1.56, 1.57], "trend": 0.48, "latest": 1.6, "wordNumber": 149667, "creationStatus": 1, "desc": "【伪兄妹｜谍战｜养成｜虐恋｜极限拉扯｜家国群像｜酸涩｜双洁｜he】\n他从瓦砾堆里捡回她，一养就是十几年。\n那年她满身泥垢，脸脏得像只花猫，唯有一双眼睛亮得惊人，抓住他军装袖口的那一刻，就注定了两人这辈子的纠缠。\n她夜里做噩梦哭醒，他坐在床边守到天亮；她挑食不肯吃饭，他端着瓷碗哄着喂；她软声喊一句哥哥，他应了十几年。\n后来他才知道，他捧在手心的妹妹，在他眼皮底下，偷了整整两年的情报。\n他的偏爱，成了她完美的护身符；\n他的纵容，化作刺向自己阵营的利刃。\n东窗事发那晚，他红着眼甩了她一巴掌：\n“你那些说爱我的话，全是骗我的？”\n她骂他畜生。\n他冷笑，伸手擦过她嘴角的血，字字带着毁天灭地的偏执：\n“那我就让你见识见识——什么叫真正的畜生！”\n当他认清自己的内心，终究会和他的小姑娘一起走向光明。", "tags": ["民国言情", "现代言情", "HE", "谍战", "养成", "群像"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "令颐小姐：干妈是个交际花", "fullTitle": "令颐小姐：干妈是个交际花", "link": "https://fanqienovel.com/page/7657576981055163416", "data": [2.08, 2.08, 2.2, 2.3, 2.4, 2.49, 2.36], "trend": 0.28, "latest": 2.4, "wordNumber": 211308, "creationStatus": 1, "desc": "（港城年代+豪门大佬+上流社会+年龄差+双向奔赴）\n**棋逢对手，才是爱情最好的开局**\n六丫头（令颐）是唐楼里最不起眼的存在，一家人挤在狭窄的房子里，姐姐们一个接一个被明码标价地嫁出去，而她注定是下一个。\n就在阿爸准备将她也打发出去时，表姑婆为她指了一条通往半山的路。\n半山玫瑰道十八号，豪门寡妇霍太的宅邸，这位在上流社交圈八面玲珑的交际花，收干女儿的真正目的并不单纯……\n令颐的到来超出了她的预期：这个女孩沉得住气、学得会事、看得透人，像一块被投入熔炉的璞玉，在豪门博弈中迅速脱胎换骨。\n从家宴的小试牛刀，到茶会的正面交锋，再到慈善晚宴的公开亮相，令颐一步步在半山站稳脚跟。\n直到她遇见了霍庭深，这个霍太亡夫的同宗族弟，半山人人忌惮的“霍老七”。\n他城府极深，行事果决，从不做没有意义的事，却对令颐上了心，用一种近乎棋手对弈般的耐心走近她。\n从画廊到法餐厅，从音乐会到马场，一个是阅尽千帆的商业巨擘，一个是初涉豪门却天赋异禀的野心家。\n他步步为营，她见招拆招。\n感情在试探与回应中层层递进，在两个聪明人之间展开了一场不动声色的博弈与共舞。", "tags": ["民国言情", "现代言情", "年龄差", "双向奔赴", "强强", "民国", "虐渣"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "楠姝", "fullTitle": "楠姝", "link": "https://fanqienovel.com/page/7616643028513459224", "data": [0.91, 0.91, 1.01, 1.02, 1.03, 1.03, 1.05], "trend": 0.14, "latest": 1.0, "wordNumber": 134382, "creationStatus": 1, "desc": "古有上神，名曰楠姝。\n一朝坟墓被盗，不得不重入世间寻回自己的陪葬品。\n血光冲天的大帅府；\n全员被屠的诡异村庄；\n九世孽缘的人妖殊途；\n……\n这些突然现世的陪葬品，似乎都与她那死了上千年的亡夫关系匪浅？", "tags": ["民国言情", "现代言情", "代嫁代娶", "风水秘术", "民国", "幻想言情", "双向奔赴"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓笔记：一盈南洋卷", "fullTitle": "盗墓笔记：一盈南洋卷", "link": "https://fanqienovel.com/page/7654784521547566104", "data": [1.0, 1.04, 1.07, 1.09, 1.11, 1.13, 1.1], "trend": 0.1, "latest": 1.1, "wordNumber": 152197, "creationStatus": 1, "desc": "·剧版《南部档案》同人文  含oc｜楼侠cp向\n·年少从本家走失的小姑娘，被出来玩耍的少年张海侠和张海楼捡到，将其带回了档案馆，张海琪收她为徒，并为其取名——张海念。\n·然这小姑娘的体内，竟还有另一个来自未来的意识，一体双魂，知晓未来结果，此局又该何解。", "tags": ["民国言情", "现代言情", "风水秘术", "盗墓", "同人", "穿越", "民国"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抗战1939：你管这叫卫生员？", "fullTitle": "抗战1939：你管这叫卫生员？", "link": "https://fanqienovel.com/page/7646833656249453630", "data": [0.88, 0.88, 0.82, 0.83, 0.82, 0.85, 0.9], "trend": 0.03, "latest": 0.9, "wordNumber": 289115, "creationStatus": 1, "desc": "张星冉，现代边区特战卫生员，为救队友牺牲后，被传送到了亮剑世界。\n还是被汉奸儿子强娶的天崩开局，幸好有李云龙及时赶到！\n既然来到了1939年，还有了系统，第一件事，当然是改变战士们的生活处境！\n三大神书？拿来！\n青霉素？拿来！\n战地急救，特种培训，枪械装备，我们张医生刚巧都会亿点点！\n这一次，再没人敢把战士们戏称成三枪八路！\n这一次的我们，强得可怕！\n嗯……我们张医生啥都好啥都会，唯一弱点大概就是……政委？！", "tags": ["民国言情", "现代言情", "同人", "民国", "系统", "穿越"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "玄幻言情", "score": 7, "reasons": ["7日增长+21.1万", "竞争系数低(3.6)", "腰部稳(均腰比1.21)"], "total19": 159.0, "growth": 15.3, "abs_growth": 21.1, "coeff": 3.6, "count10w": 1, "mean": 5.3, "mid19": 生活里估计也是找茬的一把好手，受不起”\n这话刚巧被路过的曲医生听见\n推门而入，“院长，不劳您费心，我有聊得来的网友，他才是我结婚首选”\n“至于沈主任…”\n曲珊溶视线自上而下扫过沈溪年，嗤道：“放心，骨外神外永不联姻”\n“我们拿显微镜的艺术家，跟抡大锤的木匠没什么好聊的！”\n-\n彼时两人都不知道，对方正是自己热聊一年的网友\n直到约定见面闪婚那天，民政局门口\n“沈溪年？”\n“你是‘善良兽医’？！”\n沈溪年淡笑：“曲医生，您对‘温柔甜心’四个字有什么误解吗？”\n-\n不想吓到医院同事，二人决定隐婚\n两个科室依旧天天吵\n直到某天，沈主任转发了条曲医生的获奖新闻，配文：【恭喜我们曲医生得偿所愿】\n骨科：我们？咱骨科要和神外合并了？\n神外：哈！咱赢了！沈主任被曲医生气疯了！\n知晓真相：原来不是合并，是被偷家了！", "tags": ["职场婚恋", "现代言情", "先婚后爱", "隐婚", "医生", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在总裁文里当助理", "fullTitle": "我在总裁文里当助理", "link": "https://fanqienovel.com/page/7472651990569339929", "data": [2.59, 2.96, 3.56], "trend": 0.97, "latest": 3.6, "wordNumber": 178216, "creationStatus": 1, "desc": "叶肖在这个世界生活了二十多年，有一天突然觉醒了，他才知道原来他不是土著人而是穿书的，甚至男女主跟他看的那本书也完全不一样..........而且他怎么这么爱吃醋啊！！占有欲强。\n有副CP   不一样的两对", "tags": ["职场婚恋", "现代言情", "总裁", "职场", "幻想言情"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高考出分，女儿第一个劝我离婚", "fullTitle": "高考出分，女儿第一个劝我离婚", "link": "https://fanqienovel.com/page/7657391720396508184", "data": [5.25, 5.52, 5.8], "trend": 0.55, "latest": 5.8, "wordNumber": 181341, "creationStatus": 1, "desc": "（高考查分+恶婆婆+离婚后我成了入殓师）\n高考出分，女儿第一句话没报分数，而是——\n“妈，你离婚吧。”\n安柠还没反应过来，就被拽进本市最贵的酒楼。\n婆家人正整整齐齐给一个女孩庆祝高考大捷。\n她这才知道：\n丈夫周明海的私生女竟和她的女儿一样大！\n包厢里，乱成一片。\n公公一拍桌子，定下规矩：\n“既然都捅破了，那就按老规矩办：谁生的娃有出息，谁就上周家族谱！”\n安柠气得发抖，女儿周念安却按住她的手，一口答应：“比就比。”\n在所有人的追问下，她只说了三个字：\n“屏蔽了。”\n全场一愣，随即哄笑：\n“零分啊！”\n婆婆满眼鄙夷，小三得意忘形，私生女笑着要认祖归宗，丈夫更是直接甩出离婚协议。\n后来，各招生办亲自上门，抢省状元周念安。\n周家人立马变脸：\n“老周家祖坟冒青烟，出了个女状元！安安是周家的种，必须上族谱！”\n周明海跪求原谅：\n“我只是犯了全天下男人都会犯的错。”\n可这次，安柠铁了心要离！\n离婚后，她重拾阿婆传下来的手艺，成了一名入殓师。\n起初只当谋生，后来越做越大。\n她也遇见了那个既能替她挡住前夫骚扰，又能安静看她为逝者整妆，更能看到她身上光的男人！", "tags": ["职场婚恋", "现代言情", "家庭", "虐渣", "打脸", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都市：一撞成婚", "fullTitle": "都市：一撞成婚", "link": "https://fanqienovel.com/page/7645558905812028441", "data": [3.53, 3.65, 3.97], "trend": 0.44, "latest": 4.0, "wordNumber": 236197, "creationStatus": 1, "desc": "夏沐在二十五岁那天和程氏集团总裁程青砚领证了。\n夏沐和柴珩相恋三年，今天是两人约定好领证的日子，夏沐在民政局等了一个小时，还不见柴珩的身影，她掏出手机给柴珩打电话，对方没接，随后给她发了一条消息：【对不起小沐，雪儿她生病了，我们改天再领证吧。】\n陆雪儿，柴珩的青梅竹马。\n夏沐看着这条消息，愣了半天，嘴角扬起一抹自嘲的笑容：“还是输了啊！”随后她收拾好自己的证件，转身朝着门外走去。\n程青砚刚下飞机，便被自己母亲的一通电话叫来了民政局，他走到门口，刚准备伸手去推门……\n夏沐一拉开门，便撞进了一个人的怀里，她鼻尖嗅到了一股淡淡的松木香气，\n“你没事吧？”\n头顶传来一道清透温润的声音。\n夏沐抬起头看着眼前的人，她眨了眨眼睛，“先生，有兴趣领个证吗？”", "tags": ["职场婚恋", "现代言情", "总裁", "先婚后爱", "豪门世家", "医生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "村花红红", "fullTitle": "村花红红", "link": "https://fanqienovel.com/page/7651459016131873854", "data": [2.43, 2.62, 2.86], "trend": 0.43, "latest": 2.9, "wordNumber": 259176, "creationStatus": 1, "desc": "22岁村花红红，第一次相亲就失身与磊磊，后面每次上门都亲热，再到后面两人结婚，红红一直都没有生育，面对磊磊家里人的鄙视和冷眼，红红最后被逼无奈离婚，过来好久和村里混混李刚结婚……", "tags": ["职场婚恋", "现代言情", "乡村", "第一人称"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲相到高中物理老师", "fullTitle": "相亲相到高中物理老师", "link": "https://fanqienovel.com/page/7654979133981608985", "data": [6.53, 6.78, 6.9], "trend": 0.37, "latest": 6.9, "wordNumber": 204536, "creationStatus": 1, "desc": "沈书言的十七岁，有两个解不开的难题。 一个是物理，一个是尚睿。\n他是隔壁班的物理老师，穿白衬衫很好看，讲题的时候声音很低。 她不是他班的学生，但是总喜欢在他们班物理下课的时候去等闺蜜，借此看一眼他。\n拍毕业照那天，想跟他单独合影，但是没有理由，她以为这就是结局。\n四年后。 她是楼管，他是一个普通的顾客。 四目相对的那一刻，她听见自己心跳的声音。 \n更离谱的是 —— 过年回家相亲，对面坐的人，又是他。\n尚睿看着她，眼底带着诧异： \"好久不见？。\"\n原来不是她一个人的独角戏；\n原来物理题不会没关系；\n原来他在身边，就够了。", "tags": ["职场婚恋", "现代言情", "久别重逢"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [7.0, 7.16, 7.35], "trend": 0.35, "latest": 7.4, "wordNumber": 239763, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内：我的太太是我的步步为营", "fullTitle": "体制内：我的太太是我的步步为营", "link": "https://fanqienovel.com/page/7649367076783524889", "data": [6.44, 6.51, 6.68], "trend": 0.25, "latest": 6.7, "wordNumber": 199772, "creationStatus": 1, "desc": "我的太太年纪小但乖巧，是我的底线，更是我的步步为营。\n双向心动。\n年龄差的互宠。\n体制内，直播，声优配音，哪个是最真实的你。\n说白了，就是一场长在彼此择偶心动点上的爱情。\n\n补充：文中所有职务，事件均为平行时空，请宝宝们勿代入现实。\n爱你们呦~\n\n", "tags": ["职场婚恋", "现代言情", "总裁", "豪门世家", "互宠", "年龄差"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "一纸借调，顶头上司竟是我前男友", "fullTitle": "一纸借调，顶头上司竟是我前男友", "link": "https://fanqienovel.com/page/7641060152770055192", "data": [7.26, 7.38, 7.43], "trend": 0.17, "latest": 7.4, "wordNumber": 289282, "creationStatus": 1, "desc": "【久别重逢+破镜重圆 + 体制内职场+双洁he 】\n\n许诗念这辈子最后悔的事，不是跟江时序谈恋爱，也不是没跟他去京北。\n是她妈当年说的那句“女孩子当老师好，稳定”。\n稳定到，五年后她的前男友成了她的顶头上司的顶头上司的顶头上司。\n——\n暑期，一纸借调令，砸碎了许诗念的暑假梦。\n然后，她遇到了那个人。。\n那个人，五年前她喊他“江时序”，他在她宿舍楼下等两个小时也不催她。\n现在她得喊他一声“领导”。\n并且他不用等任何人。\n……\n★因为是体制文，简介比较简单。\n喜欢体制，久别重逢，破镜重圆这个题材，可移步正文观看！！！", "tags": ["职场婚恋", "现代言情", "职场", "破镜重圆", "双洁", "久别重逢"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "向周舟", "fullTitle": "向周舟", "link": "https://fanqienovel.com/page/7438239758670646296", "data": [2.99, 3.07, 3.13], "trend": 0.14, "latest": 3.1, "wordNumber": 274224, "creationStatus": 0, "desc": "【短剧已上线】【温柔沉静女学霸VS温和专一技术咖】\n斯人若彩虹，遇上方知有。因家庭变故，周舟结束驻外工作，返回H市。消息传到了如今是高新科技公司合伙人的程晏然耳中，经历了好几个晚上的辗转反侧，程晏然决定搏一把，主动添加了微信，理由是卖车!\n一段长达十多年的暗恋修成正果，一个从头甜到尾的故事……", "tags": ["职场婚恋", "现代言情", "学霸", "甜宠", "职场", "暗恋"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "离婚后她轰动全球", "fullTitle": "离婚后她轰动全球", "link": "https://fanqienovel.com/page/7635987497771600921", "data": [2.48, 2.55, 2.58], "trend": 0.1, "latest": 2.6, "wordNumber": 240597, "creationStatus": 0, "desc": "结婚三周年那天，顾北琛把离婚协议推到沈清禾面前，语气冷淡：\n“签了吧，她回来了。”\n沈清禾没有要那五千万补偿，只带走了一台加密电脑。\n离婚的消息传遍全城，所有人等着看她的笑话——一个破产家族的孤女，没了顾家撑腰，迟早沦落街头。\n没人知道，第二天一早，中科院的专车停在她楼下。\n导师在电话里差点把实验室炸了：“三年！你耽误了三年！暗物质项目组因为你停摆了三次！”\n一个月后，顾氏集团的核心供应链突然崩盘。\n两个月后，全球物理学峰会直播。沈清禾站在首席发言席，身后是足以改变世界的实验数据。镜头扫过她的脸，弹幕瞬间炸了——\n“这不是顾总那个下堂妻吗？！”\n台下，顾北琛红着眼坐在第一排。\n而他身边，沈清禾的未婚夫、手握千亿资本的投资人陆砚，正不紧不慢地放下手机，声音温柔却字字诛心：\n“清禾，有人问能不能排队求你，帮他家公司续命。”", "tags": ["职场婚恋", "现代言情", "总裁", "HE", "1v1"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [13.05, 14.31, 15.54], "trend": 2.49, "latest": 15.5, "wordNumber": 200955, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "洪荒，阐教小师妹后台太硬", "fullTitle": "洪荒，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [5.35, 5.95, 7.2], "trend": 1.84, "latest": 7.2, "wordNumber": 142388, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [7.4, 8.03, 8.41], "trend": 1.01, "latest": 8.4, "wordNumber": 130115, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [4.19, 4.65, 5.16], "trend": 0.97, "latest": 5.2, "wordNumber": 264096, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "魂穿", "剑修"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [5.51, 5.83, 6.08], "trend": 0.57, "latest": 6.1, "wordNumber": 138230, "creationStatus": 1, "desc": "【OOC预警+亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [9.29, 9.33, 9.39], "trend": 0.11, "latest": 9.4, "wordNumber": 252227, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙崽心声曝光后，六界都不好了！", "fullTitle": "龙崽心声曝光后，六界都不好了！", "link": "https://fanqienovel.com/page/7626321035767335961", "data": [8.66, 8.69, 8.71], "trend": 0.05, "latest": 8.7, "wordNumber": 254154, "creationStatus": 1, "desc": "【双洁1V1+全员读心+三界团宠+养崽撒糖+轻松救赎无虐】\n高考前夕，叶黎惨遭人间至恶！\n辛苦打工攒下的学费被表妹偷走，舅舅舅妈颠倒黑白，将他打伤后像丢垃圾一般赶出家门。\n无依无靠，遍体鳞伤的他，本以为人生就此落幕，却意外绑定天道救赎系统，重生成了一颗圆滚滚的至尊龙蛋！\n更炸裂的是，他的‘生母’，是六界闻风丧胆的妖族至尊夜无咎！\n别人出生被父母捧在手心，他刚出生，就被妖神亲爹拎在手里，扬言烤蛋，煮汤，直接丢掉！\n为了活命，叶黎只能装乖卖萌，破壳后化身软糯小奶团，日日花式吹捧讨好傲娇亲爹。\n系统给他开辟了吃瓜功能，本想安稳躺平吃瓜做顶级妖二代！皇二代！\n可系统惊天大瓜直接震懵他，他还有一个爹！\n另一个爹是清冷出尘的仙界仙尊楚云鉴！\n而楚云鉴，是夜无咎不共戴天的死对头！\n一边是暴躁别扭，嘴硬心软的妖神父神，\n一边是清冷温柔，禁欲圣洁的仙尊父尊。\n缺爱半生，执念有家的叶黎，化身三界最强月老，疯狂花式撮合双亲，在线维和！\n不曾想，天道选中他，本就是宿命安排。\n他对“家”的纯粹执念，竟是化解仙妖魔万年恩怨的唯一解药！\n从此，曾经任人欺凌的小可怜，逆袭成仙妖魔团宠！\n双大佬争锋护崽，全员读心吃瓜围观宠崽！\n崽有CP！后期主要剧情线！\n", "tags": ["玄幻言情", "重生", "团宠", "双洁", "1v1", "养崽"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "悬疑脑洞": [{"label": "七罪副本：她靠怠惰封神", "fullTitle": "七罪副本：她靠怠惰封神", "link": "https://fanqienovel.com/page/7655266817392249918", "data": [8.98, 9.63, 10.49], "trend": 1.51, "latest": 10.5, "wordNumber": 231264, "creationStatus": 1, "desc": "【非爽文+无限流+无cp+智斗游戏+微群像+成神之路+神明入侵】\n晏夕这辈子最擅长三件事：藏锋，偷懒，逃避。\n她本以为自己可以这样安安稳稳和妹妹相依为命，直到某天，她被卷入一场名为“神明审判”的无限游戏。\n晏夕醒来时，发现自己在一座审判厅里。\n六个人，七张椅子。\n规则只有一条：每个人必须找到属于自己的审判椅，一人坐错，全员处刑。\n别人崩溃、争吵、抢线索，只有晏夕靠在墙边，一动不动。\n众人以为她吓傻了。\n直到审判钟声敲响，她不动声色地做出正确的选择。\n他们这才发现，这个被判定为【怠惰】的女人，不是不敢动，她只是懒得做错事。\n后来，贪惏者死于欲望，色欲者毁于执念，暴怒者痛不欲生，傲慢者跪下求饶。\n所有人都在七罪试验里挣扎求活。\n只有晏夕，一步一步走上神座。\n塔灵问她：“你犯下怠惰之罪，可知悔改？”\n晏夕淡淡道：\n“我不悔。”\n“我只是累了。”\n“累到想让这场无穷无尽的审判，彻底安息。”\n（不是爽文！！！具体排雷详见第一章作话和评论，谢绝写作指导，不喜勿入）", "tags": ["悬疑脑洞", "悬疑", "无限流", "灵异", "无CP", "群像"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：谁家要饭的这么嚣张！", "fullTitle": "盗墓：谁家要饭的这么嚣张！", "link": "https://fanqienovel.com/page/7660518060612144152", "data": [5.01, 5.83, 6.32], "trend": 1.32, "latest": 6.3, "wordNumber": 182432, "creationStatus": 1, "desc": "【癫文+无CP】\n张九被一个叫“乞讨成帝”的实习系统绑错了，\n本来是龙傲天走老朱的路线，结果给她送到了盗墓世界。\n还只能向古人乞讨才能获得系统奖励。\n张九表示：“谁说错嫁没真爱？你看隔壁王二赖！”\n现代没古人？\n地下不全都是吗？\n清朝出生的都算古人？\n那不巧了吗！\n百岁老人这里有的是。\n【不怎么走剧情，没有感情戏，与鬼吹灯有一点联动】\n提前避雷：1.女主带过 ，对待不善--", "tags": ["悬疑脑洞", "悬疑", "系统", "直播", "灵异", "惊悚游戏"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "什么变态，那是我老公", "fullTitle": "什么变态，那是我老公", "link": "https://fanqienovel.com/page/7615733068296358974", "data": [8.52, 8.8, 8.97], "trend": 0.45, "latest": 9.0, "wordNumber": 238862, "creationStatus": 0, "desc": "明想嫁给谢均，结婚两年，生活平淡且幸福。\n可这一天，她突然看到了出现的弹幕。\n【笑死，女配不会以为她会很幸福吧，嫁给了一个变态杀人狂魔】\n【都不知道自己怎么死的，还在那沾沾自喜】\n明想：胡说，我老公怎么可能是变态。\n她不信，觉得自己产生幻觉了。\n谢均从屠宰场回来，衣服上沾了不少血。\n【来了来了，女配今晚会被这个变态杀死分尸，我迫不及待了！】\n【终于能看到她的下场了，抢了女主的人生，该死！】\n明想看向朝自己温柔笑的丈夫，拿着把刀在切菜。\n她老公这么好，为了两人的小家，每天从早到晚去屠宰场杀猪，才不是什么变态。\n明想坚决不相信弹幕说的。\n当抛弃她的明家人找上门，对她颐指气使，骂她不孝，让她替养女去死时。\n谢均站在她面前，徒手捏死了嚣张气焰的一家人，化做血雾。\n弹幕空白几秒:\n【不是，你告诉我这是普通的鬼夫文？女主都被杀了，反派还是惊悚副本的boss，疯了，我真是疯了！】\n明想:？\n明想觉得自己精神更不正常了。\n她老公才没杀人，杀的是恶人，也不是变态。\n#女主眼中全是正常人，看不到诡异，甜文，1v1\n#什么，你说我老公是变态，胡说，他明明就是个普通屠宰场杀猪的", "tags": ["悬疑脑洞", "悬疑", "灵异", "惊悚游戏", "1v1", "规则怪谈"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "老九门到盗笔，宿主他易燃易爆炸", "fullTitle": "老九门到盗笔，宿主他易燃易爆炸", "link": "https://fanqienovel.com/page/7638263689493089305", "data": [4.1, 4.3, 4.51], "trend": 0.41, "latest": 4.5, "wordNumber": 264773, "creationStatus": 1, "desc": "[无cp+团宠]\n江昭，快穿局绿茶部成员，被新上任的绿茶部部长直接打包扔进了盗笔小世界。\n江昭：不是，没人先过问一下我的意见吗？\n吴棠：你的意见是什么很重要的东西吗？要是任务失败了，我就把你扔星际监狱里去……\n江昭：一串优美的电报声飘过\n江昭再次睁眼的时候，就成了一个小婴儿。\n江昭：不是，就不能让我一穿过来的时候就是个成年人吗？为什么一穿过来就是生活不能自理的年纪？又是一串优美的电报声！\n小时候的江昭，是一颗乖巧软萌的灵珠，长大后的江昭，是唯恐天下不乱，而且还一点就炸的炮仗！\n水蝗：佛爷好歹也是九门之首，你这么直呼其名不太好吧？\n江昭嗖的一下过去踹翻了水蝗，\n江昭：我敢叫，他敢应吗？他逢年过节给我磕一个还差不多！\n张起山刚想开口\n江昭：你闭嘴！\n张起山：张家人为什么会有晚婚晚育这种东西？\n努力降低自己存在感的张鈤山：佛爷，咱也收敛点成吗？\n解九：阿昭，气大伤身！\n江昭：我要是有气不撒出来，更伤身！\n吴叁省／解联环：叔，你下手能轻点吗？我的医保卡要刷爆了！\n江昭：没把你们两个倒霉玩意儿打死，已经算得上是我脾气好了。\n吴斜：小爷爷，别骂了！别骂了！你再骂我就破防了！\n解雨辰：求放过", "tags": ["悬疑脑洞", "悬疑", "穿越", "灵异", "无CP", "同人"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小哥的女儿从地狱爬回来了", "fullTitle": "小哥的女儿从地狱爬回来了", "link": "https://fanqienovel.com/page/7656456911012776985", "data": [3.76, 3.97, 4.1], "trend": 0.34, "latest": 4.1, "wordNumber": 238191, "creationStatus": 1, "desc": "有记忆以来都是汪家的零号实验体，张苗在实验室被折磨了整整三十年。\n不打麻药的抽血、断骨、极限改造……\n她唯一的执念，就是活下去，找到那个被称为“神明”的父亲。\n重生后逃离汪家，坠入鲁王宫，她终于见到了那个男人——张起灵。\n昏迷前的一声“爸”惊呆了铁三角。\n然而，当女孩被带回吴山居，被发现浑身上下是新旧交叠的伤口。\n当黑瞎子带回一盒录像带，揭开汪家不打麻药抽骨换血的残忍真相……\n那一日，吴山居煞气冲天。\n人间神佛张起灵，彻底化身修罗！\n原本以为只是个重度PTSD的废物小可怜，谁知当汪家死士杀上门时……\n【叮！神级血脉提纯进化系统激活！】\n残血麒麟沸腾，娇弱的女孩化身疯批修罗，徒手撕裂死士防线！\n踩着汪家人的尸体，女孩转头冲小哥露出一个卑微又讨好的笑：\n“爸，我很有用的，不要丢掉我……”\n看着女儿卑微的讨好，张起灵的黑金古刀发出一阵悲鸣。\n这一刻，神明暴怒，不死不休！", "tags": ["悬疑脑洞", "悬疑", "系统", "重生", "灵异", "同人"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进盗笔当采购，全九门都喊我靠", "fullTitle": "穿进盗笔当采购，全九门都喊我靠", "link": "https://fanqienovel.com/page/7629974068464208920", "data": [2.96, 3.15, 3.26], "trend": 0.3, "latest": 3.3, "wordNumber": 276738, "creationStatus": 1, "desc": "（主受＋ALL+搞笑＋打工人＋普通人＋部分剧情＋部分日常+小小金手指）\n这是女频同人文，怎么一堆男频的人啊，真求你们了，避避雷吧，男频给我把分拉的太离谱了\n林越穿越了\n一睁眼就在杭州巷子里，全身三百二十七块五毛钱。\n就在他绝望的时候看到了无山居的招聘启事\n凭着前世卷出来的采购经验，他成功拿下了这份工作\n五险一金拉满，月薪六位数，出差补贴翻倍，加班费按分钟算。\n林越当场签下合同：这班我能上到公司倒闭！\n直到上班第一天，他接到了大老板的电话。\n“什么叫你要三百斤犀角粉？”\n这玩意儿犯法吧？你是要开工厂吗？怕不是神经病。\n“什么叫你要五十斤雄黄送到沙漠？”\n你是杭州人还是法海本人，沙漠里是藏着一条修炼千年的眼镜王蛇精么。\n“什么叫把东西送到沙漠一个树的边上”\n把我当骆驼呢，你怎么不说放沙丘上呢！\n采购单一次比一次离谱，配送地址一次比一次阴间。\n更要命的是，无斜发现他好用以后，转头就把他的微信推给了谢宇辰和黑眼镜。\n林越正要抗议，无斜轻飘飘一句话堵住了他的嘴：“你的工资和所有报销，都是谢老板给的。”\n林越瞬间安静。\n从此，别人下斗是九死一生闯剧情，他送货是跋山涉水赶deadline", "tags": ["悬疑脑洞", "悬疑", "穿越", "灵异", "同人", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：我就是个拿画笔的", "fullTitle": "盗墓：我就是个拿画笔的", "link": "https://fanqienovel.com/page/7655175878015454270", "data": [2.78, 2.84, 2.92], "trend": 0.15, "latest": 2.9, "wordNumber": 241347, "creationStatus": 1, "desc": "先是老九门的故事，这章篇幅比较短，作为过渡。然后是九门三代。\n杨花落刚穿越到山东瓜子庙鲁王宫就见了五鬼朝拜的诡异场面。\n吴斜见这个人悄无声息摸到他们五人背后，寒意爬上脊背。\n吴斜：“你是人是鬼？”吴三醒：“人影子立那儿了，你眉毛下挂俩蛋，只扇风不会看是吧？”\n吴斜委屈巴巴：“心急则乱，再说，人难道就不可怕了吗？”\n吴三醒哑口无言，心想还真是这个理儿。\n杨花落：这人一来就拿手电筒晃我，挑衅我是吧？\n———\n杨花落瞟了一眼任务介绍，寻找海南西沙沙头礁下的‘小北鼻’。\n杨花落：？\n杨花落不解，小北鼻？小baby？小宝贝？\n宝贝？宝物？孩子？\n什么乱七八糟的。", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "同人"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.5, 3.53, 3.57], "trend": 0.07, "latest": 3.6, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "从南部档案馆靠签到混成九门团宠", "fullTitle": "从南部档案馆靠签到混成九门团宠", "link": "https://fanqienovel.com/page/7654650438687411262", "data": [3.73, 3.81, 3.79], "trend": 0.05, "latest": 3.8, "wordNumber": 279279, "creationStatus": 1, "desc": "(评分刚出♥)\n【盗笔同人+南部档案+爆笑日常+签到系统+老九门+弥补遗憾】\n穿越盗笔宇宙，成了张家籍籍无名的小透明张幺幺。本以为要卷入长生阴谋，每天在古墓里和粽子玩命，结果当场绑定【奇葩每日签到系统】！\n不签到就扣寿命？行！但你这任务是不是离谱过头了？！\n【滴！今日任务：拔下张海盐的一根头发。奖励：满级缩骨功！】\n张海盐捂着头皮狂飙脏话：张幺幺你有病是不是？！\n【滴！今日任务：在九门大会上，抢走张大佛爷的茶杯并一饮而尽。奖励：麒麟血脉纯度+10%！】\n张启山捏断了手中的钢笔：……把这个疯丫头给我叉出长沙城！\n【滴！今日任务：给闷油瓶讲三个冷笑话，并让他笑出声。奖励：黑金古刀（绝版）！】\n张幺幺两眼一黑：系统你干脆直接抹杀我吧！！\n为了活命，张幺幺在作死的边缘反复横跳。\n结果一路从南部档案签到到了西泠印社，生生把惊悚悬疑剧本玩成了情景喜剧。当年那个到处惹是生非的搞笑女，不知不觉间，竟成了九门几代大佬拼了命也要护着的祖宗。\n无邪：“如果有我幺幺姑奶奶在，这墓里的粽子都得连夜搬家。”\n张幺幺欲哭无泪：“我真的没想当大佬，我只是想安安静静签个到啊喂！”", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠装逼征服诡异世界", "fullTitle": "我靠装逼征服诡异世界", "link": "https://fanqienovel.com/page/7651204736850332697", "data": orderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕：古人围观我带萌娃环游世界", "fullTitle": "天幕：古人围观我带萌娃环游世界", "link": "https://fanqienovel.com/page/7651737189021142041", "data": [6.48, 6.63, 6.56], "trend": 0.08, "latest": 6.6, "wordNumber": 179924, "creationStatus": 1, "desc": "【历史脑洞+萌娃+系统+天幕直播+环游世界】\n刘含章精神分裂有一段了，幻听是家常便饭。\n直到那天，一个脏兮兮的小孩出现在她衣帽间。\n什么意思？这小孩竟然自称来自大业年间？\n警察上门：“这是你昨天收养的。”\n刘含章：“？？？”\n更离谱的是，她写小说赚点小钱，评论区全是奇怪网友——\n“长安第一爱马世”刷了100个深水鱼雷求亲签？\n书里还掉出个西安十日游的优惠券？\n行吧，那就带娃去玩。\n最近运气是不是好的有点过分了？\n而那群“网友”，好像都不是现代人？\n不管了，萌娃在手，环游世界，天幕直播，古人震惊。\n内心戏丰富的现代戏精摆烂人和人小鬼大的古代难民小孩的双相救赎之路。", "tags": ["现言脑洞", "现代言情", "系统", "戏精", "相互救赎", "养崽", "古穿今"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [11.95, 12.26, 12.0], "trend": 0.05, "latest": 12.0, "wordNumber": 200352, "creationStatus": 1, "desc": "（新书）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“……要。”\n\n她是他的血养出来的妖，也是他这辈子唯一的因与缘。\n（女主控放心观看，纯甜无虐）\n（文风轻松跳脱，诙谐幽默，不爱看勿入！！）\n（很甜！！甜的发腻！！不爱看甜的勿入！！）", "tags": ["现言脑洞", "现代言情", "双洁", "精灵", "幻想言情", "双向奔赴", "情有独钟"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "陆总的小桃花超甜哒", "fullTitle": "陆总的小桃花超甜哒", "link": "https://fanqienovel.com/page/7647676784783150142", "data": [5.45, 5.49, 5.47], "trend": 0.02, "latest": 5.5, "wordNumber": 274709, "creationStatus": 1, "desc": "（1V1架空甜宠文，双洁，软糯桃花精VS高冷腹黑醋王，带一点玄幻色彩，但不多）\n江清梨本是灵界勤勤垦垦修炼千年的桃花精，却在渡劫时意外丢失一魄。\n阴差阳错之下，那一魄竟然在人间转世成人，为了魂魄归位，江清梨只好用元神和人间体融合，在人间历劫一世。\n江清梨对陆君骁一见钟情，就想着如何把人拐回去做夫君。\n“陆君骁，你
