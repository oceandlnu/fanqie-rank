<style>

    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

 "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：强制诚实的我憋不住了", "fullTitle": "盗墓：强制诚实的我憋不住了", "link": "https://fanqienovel.com/page/7563612379108346905", "data": [4.57, 4.77, 4.87, 4.94, 4.99, 4.98, 4.88], "trend": 0.31, "latest": 4.9, "wordNumber": 265429, "creationStatus": 1, "desc": "（评分刚出，会涨哒）\n一个普通人穿越到盗笔世界，成了吴家小少爷。\n吴言，开局抽奖抽到了‘强制诚实’，这是奖励？\n再次抽奖，抽到了‘不会坏的计算器’。\n为了活下去，吴言只能尽量少说话，用‘计算器’代替自己发言！\n（有CP，有系统，团宠，搞笑甜味，不虐。主角性格是被特意培养的，单纯、幼稚，但三观极正。介意者，勿看！！！！！！！）\n看着不停说话欺负自己的黑瞎子，吴言不语，拿出计算器，不停按下减号键，计算器不停响起 “ jian jian jian jian jian jian ........”\n看着出言不逊的伙计，吴言用计算器按下几个键，计算器响起“平方根62500  等于......”\n遇到嘲讽吴家的藿仙姑，吴言不语，拿出计算器，按下六个数字‘4’ ‘3’ ‘8’， ‘4’ ‘7’ ‘8’！\n不想回答别人问题，按下计算器的“X的y次方”键，计算器会响起‘mi’！\n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠装逼征服诡异世界", "fullTitle": "我靠装逼征服诡异世界", "link": "https://fanqienovel.com/page/7651204736850332697", "data": [4.76, 4.9, 4.97, 5.04, 5.14, 5.0, 4.96], "trend": 0.2, "latest": 5.0, "wordNumber": 292137, "creationStatus": 1, "desc": "【评分刚出，求五星🙏🏻】\n【1VN】【无CP】【装逼】【迪化】\n【注：无CP等于谁都能是CPヘ(￣ω￣ヘ)】\n公元3077年，诡异入侵世界，杨宴被迫卷入到诡异副本当中，正准备摆烂混日子，谁曾想居然绑定了一个装逼系统，从此在迪化的道路上一去不复返……\n杨宴：闭眼休息\n众人：都闭上眼睛！大佬察觉了不对！\n杨宴：发发呆放空大脑\n众人：都不要轻举妄动！大佬在思考破局之法！\n杨宴：？\n系统欲哭无泪：家人们谁懂啊！本以为绑定了一个大佬，谁知道是个面瘫装逼男啊！\n—\n“听说十三区来了一个顶级大佬！”\n“真的假的！”\n“真的！据说他杀伐果断，深不可测，腰细腿长，清冷矜贵……”\n“嗯？等等？后面的形容词不对吧啊喂……”\n“细说深不可测……”\n——\n于此同时，副本内的大佬们……\n孤狼大佬呈影 】【无道德无三观】【横刀夺爱】【勾引】【禁忌】【无脑甜宠】\n好女人得到名声，坏女人得到一切！\n温暖是个坏种，从小就是。\n想要的东西，从来没有得不到的。\n她笑了：“这是你喜欢的人吗？那好，我抢了。”\n【汉子茶就得嗲精治】\n汉子茶女主以汉子的身份和男主称兄道弟，实则芳心暗许，名言，“我跟他要是在一起早在一起了，有你什么事啊。”\n“哥哥？你兄弟是不是讨厌我啊，好奇怪哦～”\n“人家是女生啦，不会这个，哥哥能不能帮帮我？”\n【宿舍女神的帮忙】\n宿舍转校贫困生绑定攻略男主系统，结果谁都能听见系统声。\n贫困生很自信的，跟她打赌，于是她去了，打着为她好的名义，勾引他。\n“你看啊，他都拒绝不了我的诱惑。所以，人家压根没记住你。”\n【竹马不如天降】\n假千金心疼她这个从乡下来的真千金，将一切都分享给她。\n她却是个学人精，慢慢的取代了她，享受了一切。\n“她吃了那么多苦，你让让她怎么了？你怎么变得这么自私冷漠！”－竹马哥哥。\n“我们所有人都喜欢她，只有你不喜欢，所以就是你的问题！”－小团体\n＃男主癫女主癫，癫公癫婆。\n＃所有剧情为女主服务，女主爽才是真的爽！", "tags": ["快穿", "总裁", "幻想言情", "甜宠", "大小姐", "1v1"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [4.66, 6.27, 6.99, 7.72, 8.39, 9.0, 9.45], "trend": 4.78, "latest": 9.4, "wordNumber": 234398, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [5.66, 7.26, 7.86, 8.63, 9.32, 9.09, 8.65], "trend": 2.99, "latest": 8.7, "wordNumber": 238198, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [2.41, 2.09, 2.08, 2.41, 3.01, 3.51, 3.93], "trend": 1.52, "latest": 3.9, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.31, 3.68, 3.86, 4.1, 4.37, 4.56, 4.66], "trend": 1.34, "latest": 4.7, "wordNumber": 276956, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全村逃荒流失所，我独深山囤粮肉", "fullTitle": "全村逃荒流失所，我独深山囤粮肉", "link": "https://fanqienovel.com/page/7659219704237542425", "data": [3.67, 3.94, 4.18, 4.38, 4.31, 4.23, 4.06], "trend": 0.38, "latest": 4.1, "wordNumber": 174193, "creationStatus": 1, "desc": "评分刚出，后面会涨。\n【种田+系统+空间+囤粮+深山+基建】\n陆枕筠穿越了，刚穿来，就面临全村逃难，她被丢下的命运。\n外人以为，一个十四岁的小姑娘：生活困苦，举步维艰。\n实际上的陆枕筠，堪称捡漏之王：\n粮食，捡捡捡！\n银钱，捡捡捡！\n保暖衣物，捡捡捡！\n山中宁谥，岁月静好。\n陆枕筠一边种田，一边捡漏，顺手打造了一个世外桃源。\n叮！恭喜宿主，安全领地扩展五百米，一千米，两千米，五千米……\n多年后，众人诧异。\n当初那个瘦不拉几，面黄肌瘦的小女娃呢？\n不好意思，请叫我：陆女王！\n（本文有男主，但出场比较晚，大体还是以女主深山基建为主。有空间和系统，但都以辅助为主。）\n\n——————\n十四岁的陆枕筠被狠心遗弃在村落，人人都断定她活不过三日。\n没人知晓，她携随身空间与领地拓荒安保系统。遍地逃难人群遗弃的物资全是她的囊中之物。\n散落的粮食、遗失的银两、完整的棉衣，旁人避之不及的废墟，是她的藏宝之地。\n开荒梯田、耕种五谷、圈养野物，领地随她劳作不断扩张，深山荒崖被她建成与世隔绝的富足桃源。", "tags": ["种田", "古代言情", "乡村", "系统", "穿越", "基建"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "洪荒，阐教小师妹后台太硬", "fullTitle": "洪荒，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [7.2, 10.08, 11.07, 11.45, 11.87, 12.23, 12.44], "trend": 5.24, "latest": 12.4, "wordNumber": 177792, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "危！刚飞升我就杀了天帝？", "fullTitle": "危！刚飞升我就杀了天帝？", "link": "https://fanqienovel.com/page/7663020533176339518", "data": [4.36, 5.7, 6.21, 6.5, 6.82, 7.17, 7.48], "trend": 3.12, "latest": 7.5, "wordNumber": 149601, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": " "盗墓", "同人", "穿越", "衍生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.14, 7.19, 7.37, 7.45, 7.3, 7.25, 7.23], "trend": 0.09, "latest": 7.2, "wordNumber": 221359, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\n——\n阮吱吱回到现实世界，不知为何，时常想起那个肆意潇洒的少年人。\n系统再次出现:【检测到男主黑化值过高，即将毁灭世界！】\n什么？\n他居然这么爱自己！\n怀着微妙情绪，阮吱吱回到书中世界，又一次见到他。\n少年穿着喜服，神情阴霾，手里拿着绳索，缓步而来。\n阮吱吱紧张，“裴厌，我可以解释，你别囚禁我——”\n她被扭断了脖子。\n倒在地上刹那，她见到的是少年把藏着的女孩抓出来，低声威胁:\n“贺喜，你再敢逃婚试试？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿书", "异世穿越", "黑化"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.33, 3.26, 3.34, 3.41, 3.48, 3.53, 3.42], "trend": 0.09, "latest": 3.4, "wordNumber": 255070, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自己，却生得心脉残缺，体弱易碎，连哭都没力气，一副早夭相。\n他的孩子必须活得好好的，天要他亡，沈寂就把这天逆了。", "tags": ["玄幻言情", "幻想言情", "穿越", "穿书", "养崽", "胎穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "假千金全家读心，我靠摆烂躺赢", "fullTitle": "假千金全家读心，我靠摆烂躺赢", "link": "https://fanqienovel.com/page/7654561730638384152", "data": [3.26, 3.93, 4.21, 4.44, 4.56, 4.53, 4.33], "trend": 1.07, "latest": 4.3, "wordNumber": 162834, "creationStatus": 0, "desc": "前世，桓未晚身为侯府真千金，却被假千金抢走父母、兄长和婚约，最后惨死乱葬岗。\n重生回府，她决定不争了。\n亲情不要，婚约不要，侯府嫡女的位置也不要。\n她只想远离这群糊涂蛋，吃瓜摆烂 管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [6.89, 7.24, 7.45, 7.4, 7.24, 7.28, 7.08], "trend": 0.2, "latest": 7.1, "wordNumber": 295470, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "女频衍生", "score": 7, "reasons": ["7日增长+18.6万", "竞争系数低(3.3)", "腰部稳(均腰比1.15)"], "total19": 236.6, "growth": 8.5, "abs_growth": 18.6, "coeff": 3.3, "count10w": 6, "mean": 7.9, "mid19": 6.8, "mm_ratio": 1.15, "ndays": 7}, {"cat": "年代", "score": 7, "reasons": ["7日增长+15.3万", "竞争系数低(3.1)", "腰部稳(均腰比1.25)"], "total19": 221.9, "growth": 7.4, "abs_growth": 15.3, "coeff": 3.1, "count10w": 4, "mean": 7.4, "mid19": 5.9, "mm_ratio": 1.25, "ndays": 7}, {"cat": "悬疑脑洞", "score": 6, "reasons": ["7日增长+12.7万", "竞争系数中(5.5)", "腰部稳(均腰比1.44)"], "total19": 188.6, "growth": 7.2, "abs_growth": 12.7, "coeff": 5.5, "count10w": 5, "mean": 6.3, "mid19": 4.4, "mm_ratio": 1.44, "ndays" 存够了就可以带着一千万重生回家\n娇弱又坚韧，善良又利己的她，如何在这个地方生存下去直到完成任务回家\n当她落入纯血种口中，这场狩猎的掌控者会是谁…", "tags": ["现言脑洞", "现代言情", "校园", "系统", "幻想言情", "穿书"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被逼回乡，老祖宗回来撑腰了！", "fullTitle": "被逼回乡，老祖宗回来撑腰了！", "link": "https://fanqienovel.com/page/7647458669554060312", "data": [17.78, 18.3, 19.1], "trend": 1.32, "latest": 19.1, "wordNumber": 172747, "creationStatus": 1, "desc": "【无CP，请放心食用】\n唐娇在娱乐圈打拼了六年，养着青梅竹马的恋人上大学，谁知道男朋友被富家小姐看上了。\n男朋友劈腿攀上高枝。\n富家小三姐打压她。\n一夜之间，全网黑。\n走投无路之下，她被逼着回到乡下。\n回家之后就没绷住，直接去祖坟哭。\n没想到一下就把家里的老祖宗给哭回来了！\n泼天的富贵，立马就来了。\n她不装了！\n直接回家继承家业了！\n苏黎以为自己死了，没想到意外穿越到了修仙界。\n她一心苦修，好不容易要飞升了。\n却被另界的后辈给哭回去了。\n“老祖宗，他们全都欺负我！”\n回家一看，太惨了。\n一大家子，就只剩下了这么一个独苗苗。\n还有一个从小就被人偷走了。\n这个家，没她得散啊！\n顾城从小就是独生子，父母对他虽然不亲近，可也很不错。\n谁知，他居然是个假少爷。\n真千金回归，他立马成了家里的透明。\n养父母想让他和真千金结婚，谁知道真千金看不上他。\n转头就把他赶出了家门，还处处打压他。\n背负巨额负债的他，突然得知自己是被偷的？\n家里还有一个老祖宗和一个亲妹妹？\n好日子也算是被他过上了。", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "空间", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绑定接吻系统，咋都嘬上瘾了", "fullTitle": "绑定接吻系统，咋都嘬上瘾了", "link": "https://fanqienovel.com/page/7659021946213911614", "data": [12.04, 12.6, 13.26], "trend": 1.22, "latest": 13.3, "wordNumber": 160421, "creationStatus": 1, "desc": "刚开分）万人迷，女主给他们香迷糊了/烧男人/雄竞修罗场/男全洁/全员真香沦陷\n（这玩应简介咋写啊，我求你们看bushi）\n社畜林幺绑定了亲亲变美系统。\n她必须按照系统要求，想办法和优质目标人物接吻，以此来对系统进行充电。\n任务奖励极其丰厚：天籁之音、魔鬼身材、最强柔韧度。\n“等等，我万一挨揍咋办？”\n【宿主放心，我是专业的，一旦他们摄入你的信息素，就会上瘾似的渴望更多，只要你勾勾手，他们连命都给你。】\n“我不行啊！”\n【宿主有拒绝的权利，但我与您命脉相连，我休眠的那一刻，您也一起】\n“……”\n林幺欲哭无泪，为了活命，她不得不狗狗祟祟地去接近目标。\n目标A：集团董事，雷厉风行，看她的目光都是冷的。\n没办法，林幺咬牙硬上，亲完就跑。\n结果这一亲，男人连续一周没睡好觉，一闭眼就是想她、想她、想她。\n邪门了。\n不行，他得把她追回来。\n但林幺很忙啊。\n目标B：金牌律师，斯文败类，玉面狐狸。\n目标C：天才法医，清冷疯批，情感漠视。\n目标D：顶级清道夫，阴鸷少年，只哄不停。\n目标E：邻家哥哥，毒舌抽象，嘴硬心软。\n目标F：教廷神子，绿茶黑莲花，天天色诱。\n还有GHIJ……\n目标太多，林幺不得不骗完这个骗那个，结果大家聚一块了。\n非大女主，纯男色文", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "天才", "律师"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小炮灰变美后，抢了财阀太子爷", "fullTitle": "小炮灰变美后，抢了财阀太子爷", "link": "https://fanqienovel.com/page/7654572647035964440", "data": [59.54, 60.05, 60.26], "trend": 0.72, "latest": 60.3, "wordNumber": 294901, "creationStatus": 1, "desc": "【穿书 + 贵族学院F4 +  娇柔大美人 + 勾引上位】\n冷厉傲慢第一财阀太子爷（193cm） × 纯欲娇柔炮灰大美人（168cm）\n铃兰小花妖渡劫失败，本该魂飞魄散，却意外绑定了炮灰系统，穿进一本贵族学院小说，成了同名小炮灰。\n原剧情里，她是女主林晓葵的好朋友，对照组的配平工具人。\n对花心浪子温衍一见钟情，深情不移，最终嫁入豪门。\n可甜文结局的背面，是浪子永不回头，是情人和私生子登堂入室，是小产后再也不能生育，是抑郁而终。\n而她的好姐妹林晓葵，却嫁给了第一财阀太子爷司凛，人人称羡。\n穿过来那天，阮棠看着镜子里灰扑扑的原主。\n再看她灵魂带来的属性点：冰肌玉骨、倾城之貌、杨柳细腰、内媚天成……\n每一样都是她原本拥有的东西，但没有气运值，一样也解锁不了。\n而这个世界的气运，集中在圣澜学院执事团的四个天之骄子身上，尤其是执事之首：司凛。\n阮棠想得很清楚：既然要蹭气运，为什么要蹭温衍那个浪子的？\n要蹭，就蹭最大的那个。\n排雷：F4贵族文学，非NP，不买股。", "tags": ["现言脑洞", "现代言情", "系统", "穿书", "豪门世家"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "掠夺男主爱意后，我成为了万人迷", "fullTitle": "掠夺男主爱意后，我成为了万人迷", "link": "https://fanqienovel.com/page/7618307530891987993", "data": [5.4, 5.65, 6.01], "trend": 0.61, "latest": 6.0, "wordNumber": 276109, "creationStatus": 1, "desc": "【精致利己白切黑+雄竞+变美系统+训狗文学】\n时音是个普通人，唯一的变故可能就是考上了重点高中，但，依旧普通。\n在看过别的长相甜美的小女孩撒撒娇就能获得糖果，时音摸了摸自己的脸。\n要是她也能长的漂亮就好了。\n后来，十八岁的时音绑定了女神系统，不仅得到了变美的秘密，还得知了世界的真相——\n原来，她所在的世界是一本小说，男主是她未来隔壁学校的学长，清冷矜贵，但暗恋之人却为了追寻自由，远赴国外留学，甚至交了个外国男友。\n男主得知后大受打击，在好兄弟的组局下，找了个替身女友。\n女主回国后，二人经过一番狗血拉扯，最终解除误会达成he结局。\n时音以为自己会是那个替身女友，却被系统告知，替身女友是自己未来人美声甜的大学室友。\n而时音，只是整本书中被一笔带过的炮灰路人甲，唯一的戏份就是在男女主因误会与替身女友发生争执时上去劝架。最后因整容失败而割腕自杀。\n————\n在得知只要掠夺爱意后，就能变美，时音眼中闪过痴迷。\n直到，被玩弄后的男主男配红着眼问她，\"时音，你究竟有没有心？\"\n心？她当然有了。\n只不过不是爱你们的心，而是踩着你们上位的心。\n#既然你爱我，就满足我\n#感情？净给些没人要的东西", "tags": ["现言脑洞", "现代言情", "系统", "腹黑", "白切黑"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒二错", "fullTitle": "恶毒二错", "link": "https://fanqienovel.com/page/7624784956866186264", "data": [6.24, 6.49, 6.81], "trend": 0.57, "latest": 6.8, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成猫后，带反派全家薅秃气运女", "fullTitle": "穿成猫后，带反派全家薅秃气运女", "link": "https://fanqienovel.com/page/7662732724855114776", "data": [5.9, 6.13, 6.38], "trend": 0.48, "latest": 6.4, "wordNumber": 174696, "creationStatus": 1, "desc": "新书评分刚开\n【傻白甜沙雕小猫+全家反派路人甲+团宠+动物心声+毛绒绒】\n姜澄穿成一只炮灰橘猫，被气运女主虐杀三次吸气运后，她悟了！\n再不当血包了，只求找个毫无存在感的路人甲苟活一世！\n月黑风高夜，她碰瓷了一个社畜大叔。\n【叔，养猫吗？我干得多吃得少！】\n刚处理完“业务”的杀手之王姜铮，听见小猫心声，沉默了。\n为不吓跑这只傻白甜，杀手全家被迫开启“遵纪守法好市民”剧本。\n于是，在姜澄眼中：\n老爸是平庸社畜，偶尔处理一些“肉类碎块”。\n老妈是温柔主妇，虽然宠物是毒蛇和蜥蜴。\n哥哥是病弱理科生，只是兜里常揣微型炸弹。\n妹妹是单纯高中生，偶尔发出反派狞笑。\n姜澄握紧了猫爪：\n【我的家人都是普通人，必须保护好他们！】\n当晚，猫猫率领毒蛇老鼠，熟练炸了总电闸，把气运女主价值一亿的新手礼包连锅端回家。\n正开会分赃的四个顶级反派，听着脑内的剧透，嘴角疯狂上扬。\n——懂了，以后亲子活动就是跟猫打劫。\n气运女主要再次虐杀小橘猫，所有人都觉得猫死定了。\n却见她那社畜老爹慢条斯理地走上前，身后，无数黑洞洞的枪口从阴影中探出。\n他朝她招了招手，语气是极致的温柔与冷酷：\n“澄澄，过来，别溅你一身血。”\n姜澄猫瞳地震。\n爸爸，你不是遵纪守法的平庸路人甲吗？！", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "团宠", "反派"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [10.86, 11.16, 11.19], "trend": 0.33, "latest": 11.2, "wordNumber": 278691, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "唯一人类在兽世，当养成虚拟偶像", "fullTitle": "唯一人类在兽世，当养成虚拟偶像", "link": "https://fanqienovel.com/page/7642136290401471512", "data": [9.65, 9.56, 9.74], "trend": 0.1, "latest": 9.7, "wordNumber": 201660, "creationStatus": 1, "desc": "【万人迷+雄竞+修罗场+玛丽苏+多男+男全洁】\n\n十万个兽人里面，才能降生一个雌性。\n江月白穿越到星际兽世，整个人都傻眼了。\n\n倒不是受不了悬殊的男女比例，而是她处境格外尴尬。\n身为纯种人类，身形娇小，没办法幻化兽形，也感知不到任何信息素，被认定为了残疾兽。\n只能靠着拾荒勉强糊口过日子。\n\n江月白索性放手一搏，打算注册星网账号，做这个世界不被认可的养成系虚拟偶像。\n……\n雄性兽人都格外关注雌性相关动态，却十分抵触虚拟账号。\n这类账号全是雄性运营，根本没人愿意为此消费，甚至还会遭到攻击。\n江月白的账号，刚上线就遭到不少谩骂吐槽。\n直到她发出一张图，小小的雌性蜷缩在昏暗角落，配上简简单单一句：\n月月好饿。\n这下直接引爆全网，无数兽人看的心软动容。\n帝国元帅豪气打赏：“给我的月月买大房子！”\n神圣祭司稳居榜一，满心惦记发问：“月月动态怎么还没有更新？”\n皇族太子更是出面撑腰：“谁敢随意抹黑月月！等着瞧！\n……\n江月白捞够就想跑，害怕自己人类身份暴露。\n谁料刚踏出家门，就被身形挺拔的雄性一把抵在墙上，对方语气满是激动：\n“月月，原来你真的是雌性！！！”", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "星际", "养成"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身为漫画路人的我也要拯救世界吗", "fullTitle": "身为漫画路人的我也要拯救世界吗", "link": "https://fanqienovel.com/page/7657916022938143768", "data": [5.56, 5.74, 5.62], "trend": 0.06, "latest": 5.6, "wordNumber": 156238, "creationStatus": 1, "desc": "——评分刚开，可能有点低\n【真的是无CP】【女频文】(作品标签不是我加的）【群像】【还有弹幕各种乱磕，但真的是无cp】【雷者勿入】【友情向!!少年之间互相关心】\n间启是一个普通人。\n非常非常非常普通的人。\n呃，倒也不是完全那么普通，毕竟普通人没有他那么奇怪的运气。\n不过他普通人的生涯算是正式结束在那一天了，一个奇怪的系统告诉他，他只是一个漫画里的人物——还是个脸都没漏的路人。\n——啊，简直太荒谬了。\n间启一边吐槽，一边以一种奇怪的方式进入了青尚异能学院，并以一种奇怪的方式上了漫画。\n很好，从此节操是路人。\n过去的普通人间启已经死了，现在出场的是钮钴禄氏.「运气守恒」间启。\n——开个玩笑。\n“所以，不要沮丧，不要绝望，我会让这次失败，成为下一次胜利的开幕式。”\n“听着，信我。”\n“这次绝不是玩笑。”\n*\n《异元纪年》是草草草草老师最新的作品，这个漫画以丰富且塑造深刻的人物出名。在三人小队成功进入异能学院后，一个又一个人物成功吸引了更多人的注意。\n[四草老贼，我警告你，所有人都必须好好的。不然刀片预警]\n[小启————没有你我该怎么活啊——（尖叫）（扭曲）（阴暗的爬行", "tags": ["现言脑洞", "现代言情", "无CP", "群像", "系统", "校园", "搞笑轻松"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "青春甜宠": [{"label": "重生后，我哄骗呆萌学霸嫁入豪门", "fullTitle": "重生后，我哄骗呆萌学霸嫁入豪门", "link": "https://fanqienovel.com/page/7643377723884178457", "data": [9.99, 11.4, 13.19], "trend": 3.2, "latest": 13.2, "wordNumber": 167195, "creationStatus": 1, "desc": "评分刚出！后续会涨！\n\n【重生+无系统+女追男+扮猪吃虎+轻松甜宠+1V1+HE+前期校园/后期豪门总裁+利己女主+甜蜜小作精VS萌萌书呆子】\n\n重生后，苏晚晚第一时间，就盯上了学校计算机系那个戴黑框眼镜的穷小子。\n\n所有人都觉得她疯了——\n\n堂堂外语系的系花，居然主动去倒贴一个不解风情的书呆子？！\n\n只有苏晚晚自己知道，沈墨白是书里那个未来的科技大佬，家世惊人，而且非常好哄。\n\n借伞、告白、牵手、拥抱、接吻、开房，她一步步照着计划把人彻底骗到了手。\n\n直到他要出国，跳级读研，她才“偶然”发现：\n\n原来这呆子的家里，居然这么有钱？\n\n“只要结婚了就行么？”他非常认真地问，一如既往的呆。\n\n“嗯。”\n\n“那我们明天就去领证。”\n\n没有人会知道——\n\n沈家那位天才小少爷，是被自家老婆哄骗着走进婚姻的。", "tags": ["青春甜宠", "现代言情", "重生", "学霸", "扮猪吃虎", "甜宠"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宝贝，别对我心软", "fullTitle": "宝贝，别对我心软", "link": "https://fanqienovel.com/page/7655259997613329433", "data": [6.68, 7.53, 9.05], "trend": 2.37, "latest": 9.1, "wordNumber": 140298, "creationStatus": 1, "desc": "【校园 | 双向暗恋 | 双洁 | 蓄谋已久 | 非常缺钱vs非常不缺钱】\n【温软乖乖女+伪浪子真纯情】\n段鹤臣是京大出了名的风流公子哥，随性浪荡，女朋友一月一换。\n即便如此，为了获得高昂分手费，招聘女友的帖子下依旧有人前赴后继。\n艺术系系花跪在地上求他不要分手，他一副事不关己的态度。\n某天，祝芜也成了其中一员。\n所有人都在赌他这次连一个月都坚持不了，连祝芜也这么认为。\n面对漫天流言与猜测，段鹤臣无动于衷，只是在某个夜晚，将人逼在狭小的空间，吻到窒息之际才幽幽怨怨的问，“宝贝，还不打算喜欢男朋友？”", "tags": ["青春甜宠", "现代言情", "校园", "总裁", "暗恋", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "【普女】：我怎么会喜欢她！", "fullTitle": "【普女】：我怎么会喜欢她！", "link": "https://fanqienovel.com/page/7602919905331006489", "data": [15.62, 15.91, 16.69], "trend": 1.06, "latest": 16.7, "wordNumber": 257601, "creationStatus": 1, "desc": "社恐透明老实人vs各种类型阴湿男\n—\n村里发生了丑闻。暑假时候，马上上五年级江上被迫转学到另一个城市，和爸妈住在城中村的月租房里。\n—\n柯青是她在这里认识的第一个朋友。他皮肤白得近乎病态，身形瘦削得厉害，嘴唇薄而淡，一双眼眶大得突兀，眼珠子却十分的小。\n起初柯青垂着脖颈坐在门口打游戏，全然不理她。她说话说多了，他那双漆黑无机质瞳孔会一点点左移，再慢吞吞抬起，落在她身上，盯——。他想开口要她不要说话，又觉得说话很麻烦，所以脸上非常的纠结。最后，他怕麻烦的没有说话。\n后面，江上在柯青一脸你好烦啊时，冲他一笑。他睫毛轻颤，眼神飘忽落到游戏上。过了几分钟，声音没有情绪含糊道：“江上是笨蛋。”\n—\n转学第一天见到了王林。他眉眼生得明亮，眼型偏圆，一笑弯成月牙，像是天生被太阳偏爱的人。\n她是班里透明边缘人，而王林人缘好到爆，所以他们没有任何的交集。\n……\n张方七靠着江上打游戏。\n远处，身旁李嘉豪问道：“王林，你在看什么？”\n—\n张方七高一转过来，一个超级富二代。原本与她毫无交集，不过一次换座成为同桌后，一切变的不一样。\n“你表情和黄漫上一样色色。”\n“我们试试接吻吧，我真的超想知道这是什么滋味。”", "tags": ["青春甜宠", "现代言情", "校园", "学霸", "第一人称"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "许南风，至今夏", "fullTitle": "许南风，至今夏", "link": "https://fanqienovel.com/page/7650515507505810457", "data": [31.82, 32.09, 32.77], "trend": 0.96, "latest": 32.8, "wordNumber": 245137, "creationStatus": 1, "desc": "刚出分，会涨。【酸涩拉扯/生理性喜欢/偏执占有/爱而且得】\n双洁，不是纯甜文。\n豪门少爷避祸至石乔小镇。\n他干净、好看、冷漠、疏离。\n石乔高中的人都知道，夏梧死缠烂打，追着许应跑了一年。\n最后不知道用了什么手段占有了他。\n却死在了成为许太太后没多久。\n重生后的夏梧：\n要边界感吗？我给\n要独立行走吗？我滚\n不再依赖哥哥算长大吗？\n许应：你试试。\n那晚，一向对她严防死守的人，\n竟主动献上他尊贵的躯体。\n他微微后仰了脖颈，缓缓闭上眼睛。\n任由她上下其手。\n喉结翻滚间，他暗哑着声音问：\n“喜欢吗？”\n“都给你。”\n就在许应以为，\n这个爱作妖的女人会安心待在他身边，不再离开后。\n一张照片打得他猝不及防。\n照片中的少年眼神温柔缱绻，女孩眉眼弯弯。\n还真是般配得很。\n她为了保命，果断选择离开。\n被赶到的许应死死攥住手腕，眼底压抑着翻涌的情愫：\n“不是最爱我吗？”\n“继续演下去，不好吗？”\n明明是你先靠近，现在却说爱我有罪。\n……\n他跟她之间从来都是他的欲擒故纵，\n他爱她已经入了骨髓，\n只有深度占有，才能让震颤的灵魂得以安定。", "tags": ["青春甜宠", "现代言情", "总裁", "重生", "学霸", "豪门世家"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "婚夜丧偶黑道大佬重回老婆高中时", "fullTitle": "婚夜丧偶黑道大佬重回老婆高中时", "link": "https://fanqienovel.com/page/7647210251103521854", "data": [6.88, 7.68, 7.82], "trend": 0.93, "latest": 7.8, "wordNumber": 184266, "creationStatus": 1, "desc": "评分刚出，请移步正文。\n【校园|双向救赎|1v1|忠犬|HE】\n【入室抢劫型非要爱拽哥X清冷坚韧学霸小可怜】\n高三最后一学期，雅集高中来了一个转学生。\n转来第一天就单挑十个混混，迅速成为雅集高中让人闻风丧胆的校霸。\n学校的人都说，校霸眼高于顶，又狂又酷，拽得二五八万，上下嘴皮子一碰能毒死人。\n面对表白的学妹？校霸表示——已阅，不批。\n找茬放狠话的心机女，校霸眼皮都不抬——这不像一把糯米能解决的事。\n和稀泥的校长，校霸抬腿踢翻了校长办公桌——这么会和稀泥，你的包子店一定生意兴隆。\n可谁也没料到，怼天怼地恨不得在阎王爷坟头蹦迪的混世魔王，偏偏对班里独来独往的江麦另眼相看。\n他像个不讲道理的闯入者，硬生生挤进江麦封闭的世界。\n她穿着水洗发白的衣服，他心疼得难以呼吸。\n她被人欺负，浑身是伤，他痛得整夜睡不着。\n她被逼辍学，差点没了光明前途，他发了疯，不由分说把人护在自己羽翼之下。\n他穷追不舍、死缠烂打，捧着最赤诚的心，求着、哄着、卸下所有锋芒，只为求小姑娘看他一眼。\n——\n江麦在很久以后才知道，这个人是专门为她而来，他像上帝的特殊礼物，突然地、没有防备的，降临在自己身边。\n在她恐惧着，绝望着，惴惴不安的时候，一直热烈地爱着她。", "tags": ["青春甜宠", "现代言情", "校园", "学霸", "相互救赎", "忠犬"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玩弄感情的漂亮妹宝是要被狠狠", "fullTitle": "玩弄感情的漂亮妹宝是要被狠狠", "link": "https://fanqienovel.com/page/7596380175122566168", "data": [21.82, 22.03, 22. 都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "晚年底牌", "fullTitle": "晚年底牌", "link": "https://fanqienovel.com/page/7639112428055186457", "data": [4.24, 4.8, 5.1], "trend": 0.86, "latest": 5.1, "wordNumber": 111621, "creationStatus": 0, "desc": "李玉芬刚一退休就去了儿子家帮带孙子，一帮就是12年，她不但牺牲了退休后的自由，还把自己一生的积蓄包括最后卖房子的钱，都给了儿子用来结婚，买房，买车。可当她把孙子看大以后，儿媳觉得她成了家里的闲人，感觉两代人住一起不方便，便又想过河拆桥，嫌弃，排挤。屈辱绝望中的女主，不再忍受妥协，开始对自己的人生有了新的认识和醒悟，手中掌控的一笔惊人财富，也成了她晚年重启人生的最后底牌。故事撕开原生家庭的亲情凉薄，为儿女付出也要有底线，也要为自己留后路的现实内核。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "渐入婚境", "fullTitle": "渐入婚境", "link": "https://fanqienovel.com/page/7648175724460772376", "data": [4.32, 4.6, 5.11], "trend": 0.79, "latest": 5.1, "wordNumber": 165165, "creationStatus": 1, "desc": "【神外医生x麻醉医生】\n【青梅竹马+先婚后爱+过期暗恋+双洁】\n麻醉科的沈医生年轻帅气又多金，是二院无数女同事心中最佳择偶对象，偏偏其人寡言冷情，身边从未出现过异性。\n神经外科的林医生明艳动人，富贵人家出身，追求者更如过江之鲫，却不曾见她为谁抛却芳心。\n二人共事多年，堪称金牌搭档。\n但从来没人将他俩想到一起——\n众所周知，沈医生与林医生磁场不合，除工作外，其余场合形同陌路，话都懒得说一句。\n-\n后来不知从哪里传出沈医生已婚的风声。\n有同事忍不住调侃：“沈医生娶的女人，会是什么样呢？”\n林稚想了想：“那当然是风华绝代的大美女。”\n同事笑道：“说的像你知道似的。”\n林稚也笑。\n她还真知道，毕竟家里的结婚证上，落着她与沈镜池的名字。\n-\n林稚和沈镜池是人尽皆知的死对头，却鲜有人知，两人也是青梅竹马。\n两小无猜的日子里，他们好过，闹过，吵过，最后分道扬镳。\n所以联姻三个月，两人依旧各不相干，关系纯洁如白纸。\n林稚认为沈镜池跟自己一样，对这桩婚事并非自愿。\n-\n直到某次冷战，有人拍到夫妻俩各自买醉。\n众人纷纷猜测，这段婚姻是否告吹。\n当夜，林稚被男人揽在怀里，听他轻语：“不吹，这辈子都不吹。”\n-\n【两情相悦这件事，是我从青春到白头的课题。】", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "暗恋", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女穿男后我爆红全网", "fullTitle": "女穿男后我爆红全网", "link": "https://fanqienovel.com/page/7638360333085576217", "data": [4.11, 4.53, 4.8], "trend": 0.7, "latest" 抡大锤的木匠没什么好聊的！”\n-\n彼时两人都不知道，对方正是自己热聊一年的网友\n直到约定见面闪婚那天，民政局门口\n“沈溪年？”\n“你是‘善良兽医’？！”\n沈溪年淡笑：“曲医生，您对‘温柔甜心’四个字有什么误解吗？”\n-\n不想吓到医院同事，二人决定隐婚\n两个科室依旧天天吵\n直到某天，沈主任转发了条曲医生的获奖新闻，配文：【恭喜我们曲医生得偿所愿】\n骨科：我们？咱骨科要和神外合并了？\n神外：哈！咱赢了！沈主任被曲医生气疯了！\n知晓真相：原来不是合并，是被偷家了！", "tags": ["职场婚恋", "现代言情", "先婚后爱", "隐婚", "医生", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲闪婚，糙汉老公太直接", "fullTitle": "相亲闪婚，糙汉老公太直接", "link": "https://fanqienovel.com/page/7636132561508387902", "data": [3.59, 3.81, 3.99], "trend": 0.4, "latest": 4.0, "wordNumber": 204482, "creationStatus": 0, "desc": "【乡镇超市糙汉vs县城小会计+直球式相亲+年龄差两岁+细水长甜】\n林小晚相了七次亲，遇到的不是抠门就是奇葩，要不就是动手动脚。\n第八次，赵铁柱坐在对面，上来就摊牌：“我来相亲就奔着结婚来的，你要觉得行咱就处。”\n她以为又是三分钟热度。\n结果这人第二天就拉着她去挑三金，彩礼不打磕巴，领证不拖泥带水。\n林小晚内向又话少，生怕赵铁柱嫌她闷。\n但赵铁柱说：“你不用说太多，听我说就行。”\n婚后她第一次体会到被人护着的感觉，踏实，安心，有人撑腰。\n就是，就是这人太直接了，有啥说啥，她脸皮薄，有点吃不消。", "tags": ["职场婚恋", "现代言情", "婚恋", "家长里短", "乡村", "年龄差", "闪婚"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在总裁文里当助理", "fullTitle": "我在总裁文里当助理", "link": "https://fanqienovel.com/page/7472651990569339929", "data": [5.88, 6.14, 6.28], "trend": 0.4, "latest": 6.3, "wordNumber": 208458, "creationStatus": 1, "desc": "叶肖在这个世界生活了二十多年，有一天突然觉醒了，他才知道原来他不是土著人而是穿书的，甚至男女主跟他看的那本书也完全不一样..........而且他怎么这么爱吃醋啊！！占有欲强。\n有副CP   不一样的两对", "tags": ["职场婚恋", "现代言情", "总裁", "职场", "幻想言情"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯爹捡我弃婴命，我护他余生安稳", "fullTitle": "疯爹捡我弃婴命，我护他余生安稳", "link": "https://fanqienovel.com/page/7659432573558344728", "data": [2.92, 3.01, 3.23], "trend": 0.31, "latest": 3.2, "wordNumber": 200408, "creationStatus": 1, "desc": "他被全村叫疯子，准备跳河那天，捡到了被豪门父母丢弃在冰河边的女婴。\n两个濒死之人，在寒冬里互相救了对方的命。\n全村笑：疯子养灾星，早晚饿死。\n二十年后，女婴成了顶级名医，疯子养父被她治愈。\n豪门血亲跪地求认亲，她说——\n“你们给我冰冷血缘，他给我整个人间。”", "tags": ["职场婚恋", "现代言情", "乡村", "家庭", "豪门世家", "医生"], "borderColor": "#8e44ad", "backgroun 期虐男。渣男为爱低头，不换男主。\n \n结婚一年，她连他的“紧急联系人”都算不上，离婚是时凝唯一主动做的事。他们的婚姻，没有领证，没有孩子，没有一条能证明她存在过的痕迹。\n她以为离开是他默许的结束。\n\n等他费尽心思再次靠近，她却不相信了。\n“你现在想说什么？想说我离开了，你又发现离不开我是吗？”\n“陈明森，我走的那天，你说我在浪费你的时间，现在，你对我说这些，你自己不觉得可笑吗？”\n\n 他的眼底赤红阴翳，毫不掩饰占有:“我爱你，所以我也要你全身心爱我。”\n她退后半步，看着他：“凭什么，以前我的生活只有你，所以我的喜怒哀乐随你牵动，现在我不可能再牺牲我的人格，再次变成围着你转的附属。”\n\n后来，他终于学会蹲下来，可她不再需要他蹲下了。\n她曾经把爱当作救命稻草，后来她站了起来，她才明白，把她引向她更多的路，从来都是她自己的勇气。\n\n立意:我会再次相信，并且勇敢地不顾一切爱你。", "tags": ["职场婚恋", "现代言情", "家庭", "破镜重圆", "追妻火葬场", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "床宝退场，心外科大佬红了眼", "fullTitle": "床宝退场，心外科大佬红了眼", "link": "https://fanqienovel.com/page/7638248498608999449", "data": [2.45, 2.4, 2.5], "trend": 0.06, "latest": 2.5, "wordNumber": 181555, "creationStatus": 1, "desc": "夏栀遥做了程叙三年不见光的恋人。\n她是他手下的心外科规培生，规培三年，整日泡在手术室和病房。\n熬过大大小小无数个夜班，累到低血糖晕倒也不敢多打扰他半分。\n只因为程叙曾经冷着那张棺材脸，一字一句对夏栀遥说：“除了上床，除了工作，别的事不要找我。”\n这句话，她小心翼翼记了三年，从不敢越雷池半步。\n人前，他们是避嫌到底、不苟言笑的师徒；\n人后，他是占有欲极强的恋人。\n却始终不肯给她一个公开的名分，不肯承认她分毫。\n三年付出，三年隐忍。\n夏栀遥把所有爱意藏在心底，也终于攒够了失望。\n规培结束那天，她卖掉他送的所有礼物，递交了转院申请，彻底从他世界消失。\n后来，整个医院都知道，心外科那位高冷寡言、从不动情的主任医师程叙，疯了一样到处找夏栀遥。\n他放下所有骄傲和身段，追在她背后百般挽留，可曾经满眼都是她的小姑娘，只是淡淡抬眸。\n“程主任，师徒情分，已经两清，再无瓜葛。”\n\n", "tags": ["职场婚恋", "现代言情", "大佬", "追妻火葬场"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内：我的太太是我的步步为营", "fullTitle": "体制内：我的太太是我的步步为营", "link": "https://fanqienovel.com/page/7649367076783524889", "data": [6.41, 6.33, 6.44], "trend": 0.04, "latest": 6.4, "wordNumber": 243529, "creationStatus": 1, "desc": "我的太太年纪小但乖巧，是我的底线，更是我的步步为营。\n双向心动。\n年龄差的互宠。\n体制内，直播，声优配音，哪个是最真实的你。\n说白了，就是一场长在彼此择偶心动点上的爱情。\n\n补充：文中所有职务，事件均为平行时空，请宝宝们勿代入现实。\n爱你们呦~\n\n", "tags": ["职场婚恋", "现代言情", "总裁", "豪门世家", "互宠", "年龄差"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末世，我靠装弱，苟成最强", "fullTitle": "穿进末世，我靠装弱，苟成最强", "link": "https://fanqienovel.com/page/7662354834556734488", "data": [18.26, 19.12, 20.62], "trend": 2.36, "latest": 20.6, "wordNumber": 231670, "creationStatus": 1, "desc": "纪昼穿进末世八年，是临江基地公认的废物。\n\n检测做了一年又一年，结果始终没变。\n\n无异能。\n\n体弱。\n\n胆子小。\n\n遇到危险，只会躲在人群后面。\n\n纪昼对此十分满意。\n\n废物有人护着。\n\n天才却可能被送进实验室。\n\n没人知道，她体内藏着一团奇怪的东西。\n\n它会记住异能。\n\n硬化、雷电、冲击……\n\n只要给它一点时间，那些原本属于别人的力量，就能在她身上重新出现。\n\n纪昼靠着这张底牌装弱苟命，一装就是八年。\n\n她原本打算继续装下去。\n\n直到赛场坍塌，横梁压向被困的人，她当着六大基地的面，抬手托住了整片废墟。\n\n检测记录被连夜翻出。\n\n中央基地要求重新检测。\n\n研究人员想把她带回去。\n\n就连比赛里的对手，也故意重伤她的队友，逼她补位上场。\n\n姜妄隔着防护墙看向临江席位。\n\n“不是还有个替补吗？”\n\n“团队赛让她上。”\n\n“我倒想看看，她那层刚觉醒的硬化，能撑几刀。”\n\n所有人都以为，纪昼只有硬化。\n\n只有谢闻岐坐在高处，转了转缠着固定带的右腕。\n\n他望着她周围那片不肯随场域改变的异常，忽然笑了。\n\n“刚觉醒？”\n\n“她可藏了不止一天。”\n\n纪昼抱着医药箱，乖巧地坐在原位。\n\n她算了算自己手里剩下的异能。\n\n还是太少。\n\n得再攒一点。", "tags": ["科幻末世", "末世", "穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糕末世：系统给我发了五个疯批", "fullTitle": "糟糕末世：系统给我发了五个疯批", "link": "https://fanqienovel.com/page/7661368861291187262", "data": [6.83, 7.73, 8.63], "trend": 1.8, "latest": 8.6, "wordNumber": 156939, "creationStatus": 1, "desc": "【搞笑+可爱+体型差+全员洁+无脑爽】\n可爱软萌女主VS忠犬男主\n意外穿到末世。\n人家都是技能满格，左手杀丧尸，右手扣晶核。\n而她！！！\n什么都没有！！！\n系统无奈：“好吧，我可以给你个储存空间，保证你饿不死。”\n“我还可以塑造你小说里的男主人物。”\n“让他们来陪你一起。”\n叶歌眼睛亮晶晶，她心动了。\n系统：“只能是你最近写的一本。”\n叶歌崩溃：“？我最近写的是极限文啊！”\n不止疯批，还没素质…\n“我不要。”\n系统：“……拒绝无效，已经生成了。”\n叶歌崩溃：“坑货，那是五个疯批啊——”\n系统：“人多热闹。”", "tags": ["科幻末世", "穿越", "空间", "末世", "搞笑轻松", "无脑爽"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都是公路求生，凭啥她这么强？", "fullTitle": "都是公路求生，凭啥她这么强？", "link": "https://fanqienovel.com/page/7615678294175779865", "data": [3.13, 3.34, 3.51], "trend": 0.38, "latest": 3.5, "wordNumber": 159640, "creationStatus": 1, "desc": "【武力值爆表女主 星星vs娇俏病美人男主 景越】\n谁也不知道，末世力量、速度双异能满级大佬星星，表面看着冷若冰霜；实际上是一个内心柔软的资深甜文小说迷，没错，她就是个面瘫。\n某日，被无良作者用甜文标签吊着胃口，看了本小说，因同情文中男主遭遇，在心里激情开麦，下一秒，突然被召唤进入公路求生游戏，开局一辆手推车……\n星星面瘫脸上头一回出现疑惑，公路求生啊！不知道跟末世求生比如何？\n半个小时候后，她就知道了，公路求生简直不要太爽，到处都是吃的，这里的怪物还不会传染变异，简直就是天堂！\n然而，很快，她就更激动了，这里竟然是她之前看的那本小说世界。\n她倒要去看看，这男主景越是不是真的像书里描写的那么好看。\n十分钟后，看着晕在自己怀里的大美人，小面瘫内心疯狂表示，与书里相比，有过之而无不及啊，作者文笔误我！不过倒是跟我挺配的，那要不就……拐了？\n这一拐，就丢不掉了。\n444区谁都知道，她们榜一大佬有一个爱撒娇、爱吃醋，还病恹恹的小娇夫；大佬天天都在交换探友卡去哄小娇夫的路上……\n【简介无力，移步正文。头回写这个类型，读者宝宝们多多包容，实在看不下去的点左上角退出就行，求求不要轻易打低分嗷～首章】", "tags": ["科幻末世", "穿越", "女强", "穿书", "异世穿越", "大佬"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽皮肤抽到丧尸位面后我上交了", "fullTitle": "抽皮肤抽到丧尸位面后我上交了", "link": "https://fanqienovel.com/page/7660783163194494014", "data": [3.39, 3.52, 3.74], "trend": 0.35, "latest": 3.7, "wordNumber": 189722, "creationStatus": 1, "desc": "【多位面穿越+都市脑洞+有CP+强国+成长向+群像】\n【末世+游戏+小说+星际+修仙……】\n她只是想抽个皮肤，怎么还带强买强卖！\n从丧尸位面死里逃生后，奚乔裹成粽子冲进派出所：警察叔叔，我要上交！\n从此，国家爸爸组队穿越，奚乔开开心心薅资源，薅科技，薅系统！\n******\n“警察叔叔，等我变成丧尸，就会不讲卫生，还喜欢到处咬呜呜……我、我不知道会不会传染。”\n她不想被豌豆射手biu biu、biu！\n******\n“本系统是正经系统！”\n奚乔冷笑：“正经系统会把人强制送去丧尸世界？”\n系统：“……”\n它不吭声了。\n******\n“毕竟时间太短，那些人都只会按任务做，谁能想到带着一堆现实种子来补图鉴啊！”\n奚乔默默举手。\n“国家爸爸会。”\n系统安静了一秒，诚恳道：“你们国家爸爸确实很离谱。”", "tags": ["科幻末世", "系统", "穿越", "末世"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "同居半年后发现未婚夫非人类！", "fullTitle": "同居半年后发现未婚夫非人类！", "link": "https://fanqienovel.com/page/7615492664061856792", "data": [4.09, 4.26, 4.4], "trend": 0.31, "latest": 4.4, "wordNumber": 140345, "creationStatus": 1, "desc": "【微型末世+甜宠恋爱文（阴暗疯批非人×微盲坚韧人类】\n陆昭昭是只是家里培养的联姻工具，而周景和是周家不入名的末流孩子。\n因为一场合作，两人相知相爱，原本以为生活会平平淡淡，幸福快乐的过下去，突然的变异人爆发，让他们被迫隔离家中。\n末日爆发，所有人自顾不暇，唯独这对小情侣，仍旧甜甜蜜蜜。\n偶然的一天，陆昭昭视力恢复，她看着上天入地的未婚夫，短暂的陷入沉默。\n他怎么有尾巴？\n求助，未婚夫不是人怎么办？\n—\n小剧场：\n周景和：我不是人你还会爱我吗？\n陆昭昭：我最最喜欢的人就是你。\n周景和（沉默）：我不是人。\n陆昭昭：最爱你。\n—\n你可是我孵出来的 自然是我的老婆。\n                                    ——周景和\n——\n（PS：\n           非女强，女主前期盲，后面视力会恢复正常。）", "tags": ["科幻末世", "末世", "甜宠", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真千金在星际杀穿了", "fullTitle": "真千金在星际杀穿了", "link": "https://fanqienovel.com/page/7649654747821001790", "data": [3.98, 4.11, 4.28], "trend": 0.3, "latest": 4.3, "wordNumber": 292037, "creationStatus": 1, "desc": "分刚出后面会涨的！\n【星际＋学院＋精神力＋军校联赛＋群像+真假千金+打脸】\n末世最强小队队长楚辛，重生后惨变嘤嘤怪婴儿，还惨遭女佣调包丢进贫民窟！开局天崩？不存在的！\n拳打人渣父母，脚踢假千金，想认她回去？不可能的！\n看她一路杀穿星际，被摁在地上打的众多s级精神力\n看着她顶着A级精神力开始怀疑人生\n直到双s也被她压着打，事情逐渐开始变得不对劲起来……\n你说什么叫精神力可以增长的？\n什么叫你能吸收虫晶能量？\n什么叫你才是楚家大小姐？\n一个个消息炸的一众天才外焦里嫩\n女主属性：又痞又强·饿鬼投胎·专治各种不服\n配角吐槽：“她开机甲像街头斗殴，干饭像星际蝗虫！”", "tags": ["科幻末世", "星际", "重生", "打脸", "女强", "穿越", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全星际都知道我们小队很有钱", "fullTitle": "全星际都知道我们小队很有钱", "link": "https://fanqienovel.com/page/7646458108536966169", "data": [4.1, 4.2, 4.35], "trend": 0.25, "latest": 4.4, "wordNumber": 145083, "creationStatus": 1, "desc": "【星际军校+热血群像+爆笑反差+爽爆高能】\n穿越第一天，江晚栀看着账户里237亿星币和13颗资源星，准备直接躺平当富婆。\n结果管家一盆冷水浇下：\n“小姐，您签了四年军籍预备协议。除非……因能力太差被军校淘汰。”\n江晚栀眼睛暴亮：还有这种好事？拿倒数第一回家继承家产，这不有手就行？！\n于是，荒星考核里——\n别人拼命杀怪，江晚栀找安全区睡觉；\n别人抢夺积分，她拉着四个全校最嫌弃的怪胎组队避战。\n可画风突然就歪了：\n别人小队缺弹药，江晚栀随手买下补给站：“刷卡。”\n别人遭遇星兽潮，江晚栀脑子飞速计算：“它左侧肋下有旧伤，周野，撞它！”\n原本想混个零分被开除，结果莫名其妙拿了战术贡献第一；\n原本想当个花瓶富婆，结果把这支“垃圾小队”一路带成了联邦最强战神！\n别人眼中的他们：富婆、贫民、书呆子、莽夫、懒狗。\n星兽眼中的他们：求求了，这五个疯子真的不是来毁毁灭宇宙的吗？！\n【绝不虐主+超默契团队+五人独立高光+爆笑热血杀穿星际！】", "tags": ["科幻末世", "星际", "群像", "穿越", "搞笑轻松", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假借身份入学，全军校防我偷零件", "fullTitle": "假借身份入学，全军校防我偷零件", "link": "https://fanqienovel.com/page/7646091148657708056", "data": [2.86, 2.93, 3.05], "trend": 0.19, "latest": 3.1, "wordNumber": 247609, "creationStatus": 1, "desc": "【评分刚出，后面会涨】\n废窑星黑户楚休顶替死人身份混进皇家军校。\n别人来上学是为了建功立业。\n她来上学是为了捡破烂搞钱。\n全校师生都以为机甲制造系来了个天才。\n直到五大军校联赛开打。\n楚休开着一堆破铜烂铁拼成的缝合怪上场。\n边打边拆敌方零件现场改装。\n整个赛场沦为她进货的废品收购站。\n后来虫族降临，星际覆灭在即。\n那个被贵族圈嘲笑的拾荒者，驾驶着满身补丁的机甲一枪贯穿母巢。\n星海之巅，她踩着反派的定制机甲残骸。\n手里的碳钢扳手包浆发亮。\n“万物皆可拆，万物皆有价，结账吧各位。”", "tags": ["科幻末世", "星际", "天才"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "领主：黑暗大帝今天也在努力种田", "fullTitle": "领主：黑暗大帝今天也在努力种田", "link": "https://fanqienovel.com/page/7659178100369919001", "data": [3.01, 3.03, 3.03], "trend": 0.02, "latest": 3.0, "wordNumber": 158161, "creationStatus": 1, "desc": "【无cp+全民求生+领地争霸+基建种田+可爱眷属+灾害+克苏鲁+美食+慢节奏】\n全民穿越进入万族文明升级竞赛游戏。\n作为弱势人类玩家，可在开局觉醒专属天赋，建设领地招募眷属。\n苏沐柠开局觉醒名为【黑暗童话】的SSS天赋者。\n可黑暗系也最不受待见，一旦暴露就要被无数异族玩家集火围攻。\n做过预知梦的苏沐柠，深知自己天赋在万族文明争霸游戏中，等于手拿一张死亡通行证。\n苟字当头。\n猥琐发育，别浪。\n好在，她有身为种花家种族的第二天赋种田，且眷属们比较可爱最擅长伪装。\n眷属小萝卜，垂耳兔兔大军，花花大奶牛，森林猫猫，金娃娃，小地精……\n不想好好搞躺平种田的黑暗大帝，不是好的种花族人。\n众所周知，一直低调霸榜水蓝星领地榜第一的【萝卜城】，是水蓝星最繁华最神秘的后勤基地，拥有优秀的治疗法师和最好吃的美味食材。\n实则。\n领地上。\n深渊龙血可以用来浇菜。\n恶魔怪物可以切碎做花肥。\n异族领主脑袋可以做美味烧烤。\n在争霸领地中关键时刻神兵天降救人族于水火的大黑兔子军队，是小萝卜们一茬一茬种出来的肥料收集队。\n万年后，人族一步步爬到文明顶端，竟惊奇发现，传闻中神秘可怕的人族黑暗大帝是……\n最佛系温柔木系萝卜城主？？？", "tags": ["科幻末世", "穿越", "末世", "美食", "无CP", "基建"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [8.39, 9.0, 9.45], "trend": 1.05, "latest": 9.4, "wordNumber": 234398, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [3.01, 3.51, 3.93], "trend": 0.92, "latest": 3.9, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盲雌一睁眼，周围全是大佬兽夫", "fullTitle": "盲雌一睁眼，周围全是大佬兽夫", "link": "https://fanqienovel.com/page/7654427669408255000", "data": [2.38, 2.57, 3.07], "trend": 0.69, "latest": 3.1, "wordNumber": 154247, "creationStatus": 1, "desc": "【兽世+甜宠+雄多雌少+日常治愈】\r\n一场意外，失明少女颜悦穿越到凶险的蛮荒兽世。\r\n荒草荆棘、古木参天、猛兽蛰伏、弱肉强食……\n为了活下去，颜悦接受了流浪兽的守护。\r\n冷厉寡言的金雕兽人，敛着宽翼护她身后，不动声色撑起安稳；\n温柔细心的熊兽人，将她裹进厚毛怀抱，事事都要操心周全；\n温柔腹黑的灵瞳猫，耳畔低语说尽情话；\n暴躁勇猛的花豹，赤忱心意却从不作假；\n还有双生人鱼，一个心思深沉，肆意逗弄，却句句藏着试探心意；\n一个温顺失语，沉默里尽是死心塌地。\r\n……\r\n兽夫轮番哄宠，蛮荒日子甜到发腻！", "tags": ["种田", "古代言情", "穿越", "兽世"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [6.62, 7.01, 7.06], "trend": 0.45, "latest": 7.1, "wordNumber": 211776, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "生七个娃逃荒？我的马车无限囤货", "fullTitle": "生七个娃逃荒？我的马车无限囤货", "link": "https://fanqienovel.com/page/7583891851157965848", "data": [1.91, 2.1, 2.35], "trend": 0.45, "latest": 2.4, "wordNumber": 245142, "creationStatus": 1, "desc": "【逃荒+天灾+无限空间+无限囤货+灵泉+养七个娃日常+美食+丧尸】\n　　前世，田秋水靠着一辆可以无限囤货、无限扩大的马车，在末世庇护夫家二十余口整整三年！\n　　换来的却是丈夫与好闺蜜暗通款曲，诞下双生子！\n　　恶毒婆婆骂她三岁的亲生女儿是赔钱货，将她推入丧尸潮中！\n　　“你以为你只生了一个女儿吗？你生了七个！当时我们偷偷给你卖了六个！赔钱货要这么多有什么用？”\n　　得知惊天真相对夫家恨之入骨的田秋水再睁眼，她竟回到了末世降临前一个月！\n　　刚生下七胞胎女儿，极品婆家故技重施，想把她刚出生的六个亲生骨肉卖给黑心人贩子换钱？\n　　田秋水冷笑一声，一把生锈的剪刀直接抵住渣夫，“要么滚过来写和离书！要么今天就送你当太监！”\n　　踹翻极品夫家，带着护短的爹娘，和七个绝世宝贝女儿果断跑路！\n　　觉醒【无限囤货马车系统】，一个月内搬空夫家！\n　　一个月后，极寒、酷暑、洪涝、地震、丧尸狂潮接踵而至，人间沦为炼狱。\n　　当渣夫全家在丧尸群里断水断粮、冻饿交加、跪地磕头求她赏一口残羹冷炙时。\n　　田秋水却坐在早已升级成末日堡垒的豪华马车里，抱着七个乖女儿喝羊奶，将马车上刚升级好的火枪大炮对准渣夫全家！", "tags": ["种田", "古代言情", "乡村", "美食", "逃荒", "天灾"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [4.37, 4.56, 4.66], "trend": 0.29, "latest": 4.7, "wordNumber": 276956, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废雌是4S向导，六个大佬跪着撩", "fullTitle": "废雌是4S向导，六个大佬跪着撩", "link": "https://fanqienovel.com/page/7659305583463386137", "data": [2.72, 2.78, 2.96], "trend": 0.24, "latest": 3.0, "wordNumber": 155774, "creationStatus": 1, "desc": "【星际兽世+穿书+种田+真假千金+多男主全洁+美食+团宠+向哨】\n孟澜穿成了0生育0精神力的废雌假千金，一本星际团宠文里的炮灰女配，真千金的对照组。\n在原书里，她因为嫉妒真千金觉醒了S级精神力，成为S级向导，处处针对真千金。\n原主到处作死，勾引真千金的未婚夫，最后被真千金和后宫团扔进了虫洞里，连渣都不剩。\n孟澜穿到了这个星际世界，与真千金换回身份，与养父母一家彻底撇清关系。\n她原本想着先回家走个过场，再与只有血缘关系却没有相处过的便宜家人说清楚搬出去，不曾想……\n孟家人虽然生活在垃圾星，家里一贫如洗，却把最好的一切都给了她这个刚找回来的女儿。\n【叮，恭喜宿主觉醒了农场主系统。】\n只要是系统出品，所有的农作物、水果以及养殖出来的家禽都是0污染，吃了能净化污染值。\n整个星际都疯了，一个废雌二次进化成了向导，不需要给人深度净化，只需要吃她做的美食就能净化。\n一份番茄炒蛋卖一万星际币，一份麻婆豆腐卖五万星际币……\n各行业的顶级雄性兽人上门找孟澜，刚开始是为了一碗菜一份饭一杯果汁，后来是为了那个人……\n养父母一家看着曾经不屑一顾的废物养女变成唯一的4S向导，全星际最有权威的雄性都成了她的裙下臣…", "tags": ["种田", "古代言情", "兽世", "美食", "穿书", "真假千金"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世开荒：小怂包娇娇成团宠了", "fullTitle": "兽世开荒：小怂包娇娇成团宠了", "link": "https://fanqienovel.com/page/7651124284554759192", "data": [1.9, 2.01, 2.04], "trend": 0.14, "latest": 2.0, "wordNumber": 247038, "creationStatus": 1, "desc": "【兽世】【小怂包】【甜宠】【生存】\n苏妙斥巨资办了998游泳卡，只上一节课，一睁眼穿越蛮荒兽世。\n她被族长指派给一头性情暴戾的守护兽，受尽冷待磋磨，最后竟被狠心丢弃在荒林等死。\n濒临绝境之际，数名颜值逆天的兽夫踏光而来。\n为首的君泽眸光缱绻，满心疼惜：“这般软糯小雌性，他不疼，我来疼。”\n从前人人嫌弃、受尽委屈的小苦瓜，一朝得兽神眷顾，坐拥一众神颜兽夫。\n开荒觅食、抵御凶兽、搭建暖巢，全员把她捧在心尖娇养。\n从前受尽冷眼的小怂包，终究在蛮荒绝境里，被偏爱裹成独一无二的团宠。", "tags": ["种田", "古代言情", "穿越", "兽世", "团宠", "甜宠"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女穿男：穿成换嫁文里的对照组", "fullTitle": "女穿男：穿成换嫁文里的对照组", "link": "https://fanqienovel.com/page/7661592499885984830", "data": [1.93, 1.94, 1.97], "trend": 0.04, "latest": 2.0, "wordNumber": 171841, "creationStatus": 1, "desc": "【女穿男+种田经商+后期乱世逃荒+1v1】\n上辈子沈英苦熬十几年，刚全款买下小卡车，就被失控大运撞穿。\n再睁眼，她穿进自己吐槽过的换嫁种田文，从女变男，成了书中同名同姓的人渣炮灰沈赢。\n原书里，重生女主赵欢为嫁隐退将军，设计将亲堂姐赵兰推给沈赢填坑。\n可怜赵兰嫁过来后日日挨打、三度流产，最后只生一女，专门用来衬托赵欢一举得男、富贵美满的人生。\n而原主沈赢，烂赌败家、家暴妻子，是衬托男女主幸福的工具人，下场凄惨。\n身为独立打拼半辈子的大女人沈英穿来：\n赌？戒！家暴？不存在！谁敢欺负我媳妇，先吃我一拳！\n解锁随身货运卡车空间，这做生意不赚翻天？种田经商两手抓。\n家徒四壁？修房开荒，鸭蛋生意做遍十里八乡。\n黑莲花堂妹再想暗中算计？直接戳穿她伪善面具，断她将军夫人美梦！\n一根扁担闯农忙，一间茅屋暖两人。\n从前人人唾弃的浪荡痞子，如今成了全村最护妻的好夫君。\n赵兰满眼崇拜：我家夫君，天下第一好！", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "1v1"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君战死五年归来：我携婆家出族", "fullTitle": "夫君战死五年归来：我携婆家出族", "link": "https://fanqienovel.com/page/7654779071276010520", "data": [2.2, 2.21, 2.24], "trend": 0.03, "latest": 2.2, "wordNumber": 181116, "creationStatus": 1, "desc": "【女强+团宠+萌宝+绝不回头+加破案+微科举】\n刚升为公安局长的林玉娘穿越了，刚成亲三天，夫君裴元骏就被征兵去了战场，不到三个月就传来了夫君战死的消息。\n这时，林玉娘发现自己怀孕了，前世活了三十多年，连个男人的手都没牵过，这才多久，她肚子里已经喘着娃了。\n裴家父母和小叔子、小姑子都对她很好，不久她就生了一对龙凤胎。\n不光养活了裴家一家人，还送小叔子去书院读书，送小姑子去学刺绣的手艺。\n就连自己生的一对双胞胎她也给他们请了启蒙的夫子，村里人人羡慕裴家娶了一个能干又孝顺的儿媳，可惜是个命苦的。就当日子越来越好时，那个战死五年的夫君成了将军回来了，见面就要和离，林玉娘根本就不在乎这个夫君，只要不和她抢孩子，和离就和离，可让她没想到的是，裴家父母和小叔子、小姑子为她打抱不平，既然说不通，那就把儿子逐出族谱，断绝父子关系。可人家已经是正三品的大将军，族长不同意把他逐出族谱，公爹下定决心，带着他们一家自请出族，小叔子中状元，裴元骏使手段，把他贬到黄县为县令，黄县是整个大同最贫困的县，在叔嫂两人的治理下，成了整个大同最富裕的县。只是那个被贬的皇子天天来串门是怎么回事儿？\n", "tags": ["种田", "古代言情", "乡村", "萌宝", "女强", "科举"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "被诊出喜脉后，朕成了病弱团宠", "fullTitle": "被诊出喜脉后，朕成了病弱团宠", "link": "https://fanqienovel.com/page/7664149830779800638", "data": [5.55, 6.0, 6.44], "trend": 0.9, "latest": 6.4, "wordNumber": 206591, "creationStatus": 1, "desc": "（刚出评分所以低）无cp无脑团宠+病弱系统设定，非生子\n“陛下！您这是喜脉呀！”\n“放肆！朕怎么可能有喜？！”\n“额...或许是因为您是天命之君呢？”\n“放屁！”\n前世，宁淮卿，宁氏王朝第五代君主，很不幸，挂了。\n由于他爹整天花天酒地，导致王朝岌岌可危——然后他爹暴毙了，丢下了一堆烂摊子给他。\n他宵衣旰食的努力努力再努力——修水路，重农重商，整顿贪官污吏，复辟科举...终于，猝死了。\n重生后，小宁发誓朕一定要再创辉煌！！！结果他得到了一个不靠谱的系统。\n小统：“作为陛下贴心的小棉袄，为了君臣一心，已为您发放病弱团宠大礼包——我去，发错了！这是给隔壁皇后的好孕礼包！”\n“？”\n乌龙导致的结果就是：\n1.贴身太监王长贵，以头抢地：陛下您快歇歇吧，不然小皇子怎么办？\n2.太医院院判老李头，如履薄冰：陛下别闹了，您需要卧床！\n3.一向跟他不对付的弟弟宁云琅，看他的眼神也带着莫名其妙的关怀：皇兄，保重龙体。\n不仅前朝乌烟瘴气，就连微服私访收的学生也学会了那一套，一群人整天盯着小宁的肚子。\n众人：陛下都是为了我们才病的如此厉害，我要给陛下打一辈子工！\n小宁一边咳一边骂：朕真求你们了，你们疯了吗？", "tags": ["古言脑洞", "古代言情", "团宠", "无CP", "系统", "重生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "没人告诉我兽世要会抡大锤啊！", "fullTitle": "没人告诉我兽世要会抡大锤啊！", "link": "https://fanqienovel.com/page/7650550529575095321", "data": [5.27, 5.56, 5.85], "trend": 0.58, "latest": 5.9, "wordNumber": 253284, "creationStatus": 1, "desc": "兽世，1/n，雌尊，异能，雌雄皆强，许多雌尊形容，避雷已放，不喜勿入或左上角，文明评论区，幸福你我他。\n\n—————————\n蓝渊胎穿到兽世，本以为自己将像上辈子看的各种兽世文一样，过上美男环伺左拥右抱的躺平整活，直到她看见她阿母的招侍擂台——\n当各个外形实力皆出挑的雄性兽人战到最后，最强的那位从中兽人脱颖而出，当蓝渊以为接下来就是阿母直接收下新的雄侍，皆大欢喜时——\n她的却阿母走下擂台。\n她便看见阿母将披风一扔，气势顶天立地，不像是在擂台招侍，反倒像是来收复新部落，对着这个准阿父摆出了邀战手势。\n阿母：刚才的战斗是你拼命争取站到我面前的资格，接下来想让我接受你，那就和我一战吧！努力获得我的认可，证明你有资格做我的雄侍！\n在阿父怀里咬手指看戏的小蓝渊：！\n不对！哪里不对！\n——————", "tags": ["古言脑洞", "古代言情", "幻想言情", "穿越", "兽世", "胎穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕盘点大秦女相，怎么是我啊！", "fullTitle": "天幕盘点大秦女相，怎么是我啊！", "link": "https://fanqienovel.com/page/7659047521683000344", "data": [2.65, 3.04, 3.12], "trend": 0.47, "latest": 3.1, "wordNumber": 223018, "creationStatus": 1, "desc": "【女扮男装+天幕盘点+秦始皇+权谋+基建+种田+基建狂魔】\n\n　　穿越成秦朝一个女扮男装的穷县令，黎简开局只有一间空得连老鼠都不来的粮仓。\n\n　　系统却要求三年温饱，五年奔小康。\n\n　　她卷起裤腿下田教沤肥、蹲在水田里试种水稻、用蜂窝煤撬动经济。\n\n　　就在她撸起袖子准备大搞水泥路和砖窑，带着全县奔小康时，天幕突然横亘苍穹。\n\n　　两千多年后的考古直播，硬生生砸在了大秦的天空上。\n\n　　始皇陵被挖、历史走向泄露、六国余孽蠢蠢欲动……整个天下都乱了套。\n\n　　黎简本打算置身事外，闷头搞基建就好。\n\n　　然而天幕第二次亮起时，却抛出一个石破天惊的消息。\n\n　　【被挖的不是秦始皇陵，而是大秦女相的陵寝。】\n\n　　黎简：“？？？”\n\n　　大秦什么时候有女相了？\n\n　　那个女相的名字，怎么跟自己一模一样？\n\n　　不等她理出头绪，天幕的声音再度响彻苍穹。\n\n　　【诸位，我们现在打开的，是大秦女相、也是古往今来千古第一女相的陵寝。】\n\n　　整个大秦，热血沸腾。\n\n　　黎简低头看了看自己手里的蜂窝煤模具，又抬头看了看天幕，陷入了沉思。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "女扮男装", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "异世界妈妈控制欲不太对劲！？", "fullTitle": "异世界妈妈控制欲不太对劲！？", "link": "https://fanqienovel.com/page/7553154748937931838", "data": [3.28, 3.48, 3.65], "trend": 0.37, "latest": 3.6, "wordNumber": 174072, "creationStatus": 1, "desc": "“宝宝，要多喝奶才能更健康，更快长大哦～”\n“妈妈会一直守护宝宝，不让受到一点委屈，妈妈会永远爱你，永远～”\n［本人小说生涯中的癫疯之作，错过你就对了～］", "tags": ["古言脑洞", "古代言情", "萌宝", "公主", "年下", "养崽"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕曝光，朕的四哥是征北大将军", "fullTitle": "天幕曝光，朕的四哥是征北大将军", "link": "https://fanqienovel.com/page/7663787874822655001", "data": [3.54, 3.69, 3.84], "trend": 0.3, "latest": 3.8, "wordNumber": 139424, "creationStatus": 1, "desc": "天幕/大女主/渣女/称帝/微架空\n朱明姝穿成朱元璋最小的公主，成了皇宫唯一不怕洪武帝的硬茬！\n宫里上至皇子勋贵，下至宫人内侍，没人不怕洪武大帝的雷霆手段，就连骁勇的燕王朱棣，面见父皇时都谨小慎微，不敢造次\n朱明姝反而一身反骨，天天找老朱抬杠\n朱元璋拍着龙案怒斥：“女子安分守礼即可，朝堂江山，岂是你们女儿家该置喙的？”\n朱明姝挑眉回怼：“一味重男轻女，固守旧规，本就是在拖大明后腿”\n旁人都纳闷，陛下素来杀伐果决，怎么偏偏不重罚这位逆女？\n事实上呢？\n作为马皇后临终前再三托付要好生照料的幼女，朱元璋念着亡妻情分，每次都压下火气，顶多口头训斥，舍不得真对这个女儿真的下手\n再加上凑热闹的燕王，父女三人天天鸡飞狗跳\n直到天幕砸落大明，全民瞳孔地震！\n未来皇孙朱允炆登基才七天，龙椅还没捂热，就被朱明姝联手她四哥朱棣一起给薅下来了\n后来天幕更是曝光了一大堆大明的弊病\n合着老朱兢兢业业，愣是留了一堆烂摊子！\n反观众人最看不起的公主？\n她登基后，废苛政、减赋税、养万民、开盛世！\n直接把漏洞百出的大明，干成百姓吃饱、万国朝拜的巅峰！\n朱元璋盯着天幕盛世，捂心叹气：\n离谱！咱这逆女比咱几个儿子还厉害!", "tags": ["古言脑洞", "古代言情", "穿越", "直播", "公主", "女强"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宦官反派之子？但四岁封建老学究", "fullTitle": "宦官反派之子？但四岁封建老学究", "link": "https://fanqienovel.com/page/7663339551775001625", "data": [2.46, 2.52, 2.67], "trend": 0.21, "latest": 2.7, "wordNumber": 160272, "creationStatus": 1, "desc": "【养崽＋无CP＋日常流＋父子情占比高】\n　　念青四岁，府上心知肚明的野种。\n　　亲娘软弱，好在小家伙争气。\n　　他立誓考取功名，郡丞却要他当暴虐无状小皇帝的伴读。\n　　念青大病，眼看要烧成傻子。\n　　舅父忽至，细心照料。\n　　周青序一生飘零，父母早亡，少年时就成了太监。\n　　他不择手段成了辅佐幼帝的周常侍，朝野道他卑贱专权。\n　　周青序冷眼旁坐看北魏亡国。\n　　不料他锒铛入狱，受万人唾骂。\n　　厌世等死之际，恨极的人带来烧傻的孩子，说这是他的血脉！\n　　延续香火，爹娘临终期盼，周青序不想死了！当日他却死在了狱中。\n　　转世重生，他奔袭接回幼子。\n　　面对骨肉，周青序自卑又爱极，将他宠得如珠似宝。\n　　周从意发愤图强，要报答舅父。天降系统，说他舅父身为奸佞，距离死期只剩一年。\n　　从意怒目圆瞪，我舅父是忠臣，大大的良民！\n　　小家伙致力于洗白舅父，誓要将忠君爱国贯彻到底。\n　　一身正气克己复礼，左一句之乎者也，右一句仁义礼智。\n　　妥妥封建老学究。\n　　有天北魏分崩离析，皇权最坚定的维护者偷偷摸摸收拾包袱，苦口婆心：“爹爹，我们快跑。”\n　　凤仪鹤影的青年挥手，万千将士赫然跪地：“太子，请登基！”\n　　“我、我成奸佞反贼了？”", "tags": ["古言脑洞", "古代言情", "系统", "重生", "无CP", "养崽"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "对，我在古代当神女", "fullTitle": "对，我在古代当神女", "link": "https://fanqienovel.com/page/7662746316191042585", "data": [3.86, 4.05, 4.07], "trend": 0.2, "latest": 4.1, "wordNumber": 184664, "creationStatus": 1, "desc": "穿到旱灾古代呼风唤雨，开局成神➕无cp➕万人迷。\n \n旱灾？她可呼风唤雨。\n缺粮？她可催生万物。\n瘟疫？她灵丹祛百病。\n\n片段：\n　　一船人呆呆看着。\n\n　　像山般大的巨兽，此刻褪去凶相，像一只狗一样，温顺地围着周身泛光的少女游动。\n\n　　符汐伸出手，手掌轻轻贴上它潮湿粗糙的脊背。\n\n　　海风卷走她的话音。\n\n　　“跟着我。”\n\n　　“我带你回深海。”\n\n　　巨鲸似乎听懂了她的声音。\n\n　　低鸣一声，沉入海中。\n\n　　符汐飞起，如同夜里一盏孤灯，在前方引路。\n\n　　巨鲸摆动巨大尾鳍，追着那片光亮，朝着无边远洋游去。", "tags": ["古言脑洞", "古代言情", "乡村", "穿越", "今穿古", "系统"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满级监狱长穿古代，罪犯全跟来了", "fullTitle": "满级监狱长穿古代，罪犯全跟来了", "link": "https://fanqienovel.com/page/7661140117666401305", "data": [2.87, 2.94, 2.99], "trend": 0.13, "latest": 3.0, "wordNumber": 130020, "creationStatus": 1, "desc": "【群穿古代！全朝最强罪犯VS战力爆表指挥官。】\n池鲤月，一个能让顶级重刑犯集体做噩梦的名字。\n一场爆炸，她穿了。\n更要命的是，那群穷凶极恶的罪犯也跟着穿了。\n满朝文武面对二十一世纪的顶级罪犯束手无策。\n直到系统将她的一魄找回，三法司的三位大佬当场哭了：\n“老大！！！救命啊！！！你终于来了！！！”\n万金悬赏却无人敢抓的罪犯们更是集体崩溃！\n罪犯A：卧槽！那灭绝师太怎么也穿来了？！\n罪犯B：别说了，我先跪为敬，争取宽大处理。\n池鲤月负手而立，笑如春风：“听说诸位想在古代称王称霸？”\n叱咤朝廷的罪犯们跪了一地：“不敢不敢不敢！老大您说了算！”\n*\n当某官员站出：女子不得参政……\n护短皇上手动微笑：池爱卿，把炸弹拿来，朕要把他炸个稀巴烂。\n池鲤月：皇上，不至于不至于。\n*\n后来，毒舌腹黑的养子弟弟吃着飞醋：“阿姐不是说往后好好待我不欺负我吗？可现在阿姐就在欺负我。”\n清冷矜贵无血缘的太师小舅舅深夜隐忍动情：“阿月，小舅舅不该有这种心思。”\n向来不待见她的未婚夫太子将订婚玉佩塞给她：“本宫不退了！不退婚了。”\n还有前世她捕抓N次的疯子红着脸：“如果，不是因攻略任务的情况下，我真的喜欢你呢……", "tags": ["古言脑洞", "古代言情", "穿越", "系统", "打脸", "青梅竹马", "虐渣"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在古代做临妻，多子多福赢麻了", "fullTitle": "我在古代做临妻，多子多福赢麻了", "link": "https://fanqienovel.com/page/7646761026335034393", "data": [2.45, 2.52, 2.58], "trend": 0.12, "latest": 2.6, "wordNumber": 287735, "creationStatus": 1, "desc": "【穿越+系统+大女主+女撩男+甜宠+群像】\n育儿嫂楚玲珑意外穿越，绑定多子多福育儿系统，依旧躲不开牛马的命运。甚至，这次还需要她亲自上阵，生了又生！\n哎呀，真是好惨一女的！\n摆烂不行吗，躺平不香吗？\n系统暗戳戳吐槽，“说的这么可怜，好像昨晚搂着猛男，快乐尖叫的人不是你一样！”\n楚玲珑窃笑。\n瞎说什么大实话！只不过是隐藏福利有亿点点多罢了！\n比如生崽容易，养崽全靠爸！\n比如三年一换夫郎合情合法！\n没有婆媳矛盾，没有柴米油盐，更没有家暴出轨抓马！\n哎呀，姐妹出息了，以前做梦都不敢做这么大！\n多金帅哥快到碗里来，姐姐愿意给你一个家！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "甜宠", "群像"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "当我同时绑定好孕系统和天命系统", "fullTitle": "当我同时绑定好孕系统和天命系统", "link": "https://fanqienovel.com/page/7654893715571362878", "data": [6.72, 7.35, 7.97], "trend": 1.25, "latest": 8.0, "wordNumber": 159082, "creationStatus": 1, "desc": "【变嫁+渣男改造+多男主+魅魔体质+攻略+生子变强】\n因为在前世辜负了太多女孩子的真心，卿越被前女友的哥哥撞死，死后同时绑定了天命掠夺系统和人渣好孕系统，前者帮他变强，后者要他赎罪，结果二者谁也不服谁，最后只能达成协作，让他通过攻略三个天命之子，并为他们诞下子嗣，才能变强的同时也跟着赎罪。\n卿越根本来不及拒绝，灵魂就被投放到了修真世界，成为了南宫家的二小姐 所有的路", "fullTitle": "重生后，她断了男女主所有的路", "link": "https://fanqienovel.com/page/7659427975628065816", "data": [3.36, 3.54, 3.76], "trend": 0.4, "latest": 3.8, "wordNumber": 157655, "creationStatus": 1, "desc": "沈灵汐是她爹娘的心头宝，爹娘因为要飞升，重新回到太初大陆。怕丢下她一人在云荒大陆孤单寂寞，为她创建了宗门。\n本来是想有人陪着他们的闺女，没想到却招进来一头白眼狼。披着深情款款的皮囊，想要的却是沈灵汐的灵根和她的血液。\n在被挖灵根，放血液的时候才知道他们的世界是一本书。而那头白眼狼和他家领养的妹妹，是书中的男主与女主。\n同归于尽后，强烈的不甘让她回到爹娘没有创建宗门之前。这一次，她要让那渣男贱女死在故事的开局。\n可这该死的天道，竟然护着这样的渣男贱女。既然杀不死他们，那就断了他们所有的路。", "tags": ["玄幻言情", "幻想言情", "重生", "空间", "虐渣", "前世今生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绑定双修系统后，我躺成宗门团宠", "fullTitle": "绑定双修系统后，我躺成宗门团宠", "link": "https://fanqienovel.com/page/7653329586515610648", "data": [3.09, 3.29, 3.29], "trend": 0.2, "latest": 3.3, "wordNumber": 260017, "creationStatus": 1, "desc": "【爽文+系统+修仙+微万人迷+男全洁】\n她穿进一本《我在修仙界生崽就变强》的狗血文中。\n成了活不过一章的炮灰女配安如素。\n原文小师妹是女主，身怀多子多福系统，不仅抢了她的道侣，还哄得全宗门都成了她的舔狗，最后飞升成仙。\n幸好，她获得了双修就变强系统。\n高岭之花师尊，为她跌落神坛。\n无情道二师兄，为她挡天雷。\n抠搜的三师兄，把最顶级的丹药捧到她面前。\n体修四师兄，金刚不坏神功已经达到铁石心肠，见到她心就软了。\n每天想死的五师兄，不想死了，每天只想跟她贴贴。\n就连与她解除婚契的大师兄，跪在她面前，只求她多看一眼。\n甚至黄狗旺财化为人形后，对外宣布，“主人是我的，你们敢抢，吞了你们！”\n她懵了，她只想双修变强啊，怎么就成了宗门团宠了？", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "团宠", "今穿古"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "族姐带炼丹游戏，我捡了种植板块", "fullTitle": "族姐带炼丹游戏，我捡了种植板块", "link": "https://fanqienovel.com/page/7662611486992239640", "data": [2.89, 2.96, 3.0], "trend": 0.11, "latest": 3.0, "wordNumber": 151480, "creationStatus": 1, "desc": "【家族修仙】+【发展经营】+【慢剧情流】+【灵植师】+【金手指】+【无cp】\n　　王灵葫在幼时去看望意外昏迷的族姐王灵筠时，捡到一块闪着金光的碎片\n　　这件事，王灵葫谁也没说过，自进入家族养正堂学习，修仙百艺传承果断选了灵植师，根据灵植词条，开始关于灵植遗传的研究。\n　　引气入体时，家族传承的本命灵植青符木上出现【枝繁】【叶茂】两个蓝色词条，命运开始转动，顺势开拓了副职业符箓师。\n　　自炼气三层到炼气大圆满，一直负责照料作为家族底蕴的聚灵草和淬骨草。\n　　在收割同种灵植一千株，才发现，自己意外得到的这个炼丹游戏附带种植版块隐藏福利，亲自种下、照料并收割同种灵植一千株，灵植全方位1%提升，一直到一百万株，累计提升15%。\n　　从炼气到筑基，从筑基到金丹，乃至一路到元婴、化神，王灵葫都钟爱于照料同一种灵植，至于斗法，跟我的符箓说去吧。\n　　与此同时，落寞的筑基家族清溪王家，也逐步有了祖辈昔年的威势，从恢复筑基家族全盛状态，到派遣族人穿越横澜山脉到达无尽流沙海，从金丹家族到成就元婴家族。\n　　炼气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫。\n　　大道无疆，砥砺永前，薪火长驰。", "tags": ["玄幻言情", "幻想言情", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [9.72, 9.77, 9.78], "trend": 0.06, "latest": 9.8, "wordNumber": 158364, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "快穿": [{"label": "娇软小漂亮天生就要被男人觊觎", "fullTitle": "娇软小漂亮天生就要被男人觊觎", "link": "https://fanqienovel.com/page/7660389113538808894", "data": [11.51, 11.98, 12.24], "trend": 0.73, "latest": 12.2, "wordNumber": 222898, "creationStatus": 1, "desc": "［1v1+双洁+甜宠+身高差体型差+各种类型男主+天生媚骨］\n小合欢花终于修炼成人形，在族里长辈的提议下入世修行。\n云雪儿谨记长老们的叮嘱，只为寻找世界中气运最强者帮助自己精进修为。\n人是找到了，可怎么没人告诉她这些男人怎么见到她就想狗见到了骨头，可怕、霸道、让人难以招架。", "tags": ["快穿", "总裁", "幻想言情", "甜宠", "双洁", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漂亮社恐在恐怖世界当万人迷", "fullTitle": "漂亮社恐在恐怖世界当万人迷", "link": "https://fanqienovel.com/page/7658213142345813017", "data": [9.31, 9.63, 9.62], "trend": 0.3, "latest": 9.6, "wordNumber": 167127, "creationStatus": 1, "desc": "快穿|万人迷|男洁|女嬷1vn\n白颜末，一个重度社恐，被大货车撞进恐怖世界，绑定了炮灰系统。\n\n系统告诉她：任务只有一个，活到最后。\n\n于是她谨记社恐生存法则：低调、墙头草、远离主角团。\n在主角团和神秘boss间反复横跳，两边递刀两边卖乖。\n但渐渐地，她发现主角团和boss看她的眼神越来越不对劲了……\n【1.湖边小屋】\n穿成一只远离主角纠纷的小水鬼，白颜末计划着在水底苟到剧终。直到一群阳气旺盛的男高中生来湖边露营，她鬼使神差地飘上了岸……\n\n【2.孤岛疯人院】\n这座孤岛关押着一群有精神疾病的权贵罪犯，白颜末作为新来的心理医生，要对每个病人进行“疏导”。只是每次疏导完，病人看她的眼神更疯了……\n\n【3.美高大逃亡】\n……", "tags": ["快穿", "现代言情", "系统", "穿越", "幻想言情", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"l 一，钟树白没有走上既定的路线被攻略。\n而是在乔映破产后，豢养了她这只美丽的金丝雀。\n不过乔映实在不省心，一个没看住，就被弄死了。\n钟树白坐在凌晨的客厅，开酒刀割破手腕，随她而去。\n－\n既然老公迟早是我的，为什么不能现在就是我的？\n乔映猛追十七岁的钟树白。\n少年抗拒，结果一张嘴。\n“姐姐”两个字脱口而出。\n乔映已被萌晕。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "搞笑轻松", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯批太子爷夜夜闻我体香入睡", "fullTitle": "疯批太子爷夜夜闻我体香入睡", "link": "https://fanqienovel.com/page/7561406804232522814", "data": [31.05, 35.49, 37.24, 39.17, 40.92, 42.67, 43.37], "trend": 12.32, "latest": 43.4, "wordNumber": 308760, "creationStatus": 0, "desc": "新书刚开分，还会涨的！【阴湿疯批+甜撩+救赎+穿越+大学校园+双洁1v1】 \n天生坏种X坚韧乐观小太阳 \n品学兼优的大一新生江幼希，某天兼职时，意外捡到一个少年。 \n少年自称是她未来的儿子，对她大喊“妈”，抱着江大风云人物贺酌直喊“爸”。\n等等！ \n孩子他爸是贺酌？\n那个传闻杀过人、手段狠戾变态的疯批太子爷？！ \n儿子：“妈，那都是谣言，爸其实是一个温柔善良的好人！”\n江幼希半信半疑，当晚就亲眼看到贺酌开车撞人。\n他满眼杀气，以飙车的速度把一名男子撞得满身是血，奄奄一息。\n江幼希吓得转身想跑，却被他扣住后脖颈。\n“抱歉，吓到你了，”他沾染血迹的指尖落在她眉心，笑容恶劣—\n“小、学、妹。”\n—\n虽然孩子他爹是变态，但为了避免丧偶式教育，江幼希决定带着儿子去认爹。\n江幼希把儿子拉出来：“贺酌学长，他、他是你儿子。”\n贺酌睨她：“他妈是谁？”\n“我。”\n“行，那今晚陪我睡。”\n“？？我为什么要陪你睡？”\n“不睡，他怎么来？”\n“……”\n— \n贺酌因童年遭受打击，导致患上了睡眠障碍症。唯有江幼希身上的气息，能让他心安，成功入眠。 \n男人指腹轻碾她的小梨涡：“再陪我睡一晚，好不好？” \n“怎么睡？”\n男人紧扣她纤腰，俯身亲吻— \n“换个姿势。”", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春日烈阳", "fullTitle": "春日烈阳", "link": "https://fanqienovel.com/page/7163459032223583270", "data": [19.28, 22.62, 24.16, 25.46, 26.46, 27.37, 28.1], "trend": 8.82, "latest": 28.1, "wordNumber": 351264, "creationStatus": 0, "desc": "[体弱少女 X 烈日少年]\n（正文已完结）\n（原书名：春日烈阳）\n（青梅竹马+校园甜宠+日常）\n（人物设定均已成年）\n许渔刚来青禾中学的时候，有一个梦想，那就是在冬日纷飞的时候亲手接住一片雪花。\n她想，人生都这么苦了，总要来看一次大雪纷飞的样子。\n于是许渔努力的一边上学，一边治病。\n在来京市之前，自家亲爹说，在学校会有小时候的邻居哥哥帮忙照顾她。\n但是在许渔记忆里的邻居哥哥：喜欢揪她衣领子，还和别人打架。\n“邻家哥哥”顾盛：......\n第一次见到许渔的时候，顾盛站在校门口“亲切”为她指路。\n第二次见到许渔，顾盛提着保温杯里面装的是热牛奶。\n第三次，第四次......\n顾盛在许渔面前向来习惯了伪装，只有那一次。\n他在昏暗的路灯下表情狠厉的撺着一个人的衣领：“别让我看见你打扰她第二次，滚。”\n他终于有些抑制不住的爆发，脸上掉落的面具后才会原原本本的顾盛。\n那天的许渔忽然觉得，顾盛就像太阳。\n她想，如果在冬天摸不到雪花，那就拜托顾盛带着她去春天感受阳光也不错。\n世界对她来说无聊单调，但是顾盛能够带来温暖。\n立意：我们可遇不可求。", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "青梅竹马"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [59.08, 62.61, 64.12, 65.26, 66.07, 66.84, 67.51], "trend": 8.43, "latest": 67.5, "wordNumber": 373464, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [61.67, 63.39, 64.38, 65.29, 66.17, 67.3, 68.94], "trend": 7.27, "latest": 68.9, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [21.95, 23.35, 24.33, 25.74, 27.09, 28.1, 28.88], "trend": 6.93, "latest": 28.9, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大小姐雇我替她和太子爷网恋", "fullTitle": "大小姐雇我替她和太子爷网恋", "link": "https://fanqienovel.com/page/7624147408376581145", "data": [37.57, 38.25, 38.65, 39.43, 40.2, 40.79, 40.96], "trend": 3.38, "latest": 41.0, "wordNumber": 384371, "creationStatus": 0, "desc": "已签实体出版！\n［无虐，无雌竞，轻松甜文，双洁1v1］\n【嘴特甜，很缺钱，纯欲钓系女主】\n【嘴很毒，钱贼多，冷傲拽哥男主】\n-\nS大校花姜晚接了一项特殊委托。\n豪门大小姐雇她追求海城太子爷进行网恋。\n照片、身份都是大小姐本人，手机对面换成她。\n然而太子爷又冷又拽，姜晚每天绞尽脑汁的撩。\n-\n姜晚费劲吧啦刚追到人，大小姐发来指令：\n“晚晚，目标达成，计划终止。”\n“收到！”\n姜晚连夜爬起来和太子爷提分手。\n商时序咬牙：【你别后悔】\n姜晚：【嗯嗯，绝不后悔】\n\n两天后——\n大小姐：“晚晚，情况有变，你还没跟他分手吧？”\n姜晚咬紧后槽牙：“你、说、呢？”\n大小姐：“快、快复合！”\n-\n复合后，海外留学的太子爷偷偷跑回国要给姜晚惊喜。\n他的惊喜，姜晚的惊吓！\n为了不掉马，情急之下，哄骗他酒店蒙眼。\n姜晚聊完天想溜，被他扣住腰亲懵！\n说好的网恋怎么还有失身的风险？\n-\n【掉马小剧场】\n某日，姜晚帮父母摆完摊后回到小区门口，太子爷突然打来电话。\n“在哪？”\n“不是告诉你我和朋友在拉斯维加斯玩呢。”\n“玩得开心吗？”\n“开心啊～”\n“回头。”\n姜晚：！！！", "tags": ["青春甜宠", "现代言情", "总裁", "甜宠", "双洁", "1v1"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [52.43, 54.65, 55.39, 54.91, 54.05, 54.09, 54.1], "trend": 1.67, "latest": 54.1, "wordNumber": 868537, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [17.34, 17.87, 18.34, 18.8, 18.82, 18.79, 18.93], "trend": 1.59, "latest": 18.9, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夏夜有染", "fullTitle": "夏夜有染", "link": "https://fanqienovel.com/page/7429537438936075289", "data": [19.76, 18.46, 19.25, 19.62, 19.94, 20.31, 20.72], "trend": 0.96, "latest": 20.7, "wordNumber": 403900, "creationStatus": 0, "desc": "（已签实体）\n【校园重生+追妻火葬场+拽哥上位+借住文学】\n【有点叛逆乖乖女x懒淡拽哥】\n奶奶离世，谈、陆两家见没了亲人的许恩棠可怜，都想把她接去照顾。\n来到北城，许恩棠再次见到那个让她一眼难忘的少年。\n陆襟痞气肆意，之后一起成长的那些年，她看他身边的女人换了一个又一个。\n没想到有一天，他会问她想不想嫁给他。\n她以为是自己多年暗恋终于得到回应。\n直到婚后，她听到他对朋友说：“家里让娶，我还能怎么办？”\n她心灰意冷，决定离婚。\n**\n离婚前夜，她重生回到高二被接回北城这天，依旧是两家都住。\n后来，她夜不归宿，他发疯似的找她。\n“你真的谈恋爱了？跟谁？”\n电话彼端的许恩棠红着脸被谈霁礼圈在怀里。\n谈霁礼开口，声音传进电话里，“告诉他，是不是在和我谈恋爱？”\n**\n以前的许恩棠心思都在陆襟身上，和谈霁礼不熟，没想到会与疏离懒淡的他在这个夏夜有染。", "tags": ["青春甜
