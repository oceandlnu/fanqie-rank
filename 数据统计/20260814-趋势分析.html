01987375926296", "data": [22.77, 23.64, 24.49, 25.13, 25.36, 25.31, 25.22], "trend": 2.45, "latest": 25.2, "wordNumber": 3186216, "creationStatus": 1, "desc": "【年代】【八零】【微群像】【重生】【爽文】【无金手指】【家长里短】\n（又名：重生八零：老太太抛子弃女）七旬老太吴知秋重生了，重生到孩子们还要靠她辛苦付出的年代！上辈子自己偏心，晚景凄凉。重生不重演，老太太决定抛开儿女，美美的过余生！\n小儿子哭唧唧抱着大腿，妈！我可是你最爱的小儿子，我要给你买大房子！为了能跟老娘在一起生活，砒霜拌馅，鹤顶红勾芡，为了老娘没事就得插兄弟两刀！\n公婆化身王炸组合“我那最有出息的大孙呦！爷奶想吃锅子，烤肉，洋饭……”把大儿子两口子坑的裤衩子都穿不上溜。\n宠妻狂魔李满仓……别和我说，这家我说的不算！", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄学真千金穿七零，认亲首长父亲", "fullTitle": "玄学真千金穿七零，认亲首长父亲", "link": "https://fanqienovel.com/page/7581118244304473150", "data": [29.84, 31.07, 30.18, 30.87, 31.65, 31.74, 31.81], "trend": 1.97, "latest": 31.8, "wordNumber": 947599, "creationStatus": 0, "desc": "江莯颜本是现代玄学界的修炼天才，早在她穿越之前，师父便已算出她有穿越到异世这一劫难。为护她周全，师父与众位师兄们，将海量金银珠宝、稀缺药材以及各种符箓和生活物资尽数收纳于芥子袋中，成为江莯颜在七十年代最大的“底气”。\n江莯颜刚穿越，便发现原主在刚出生时，就被现在的养母把她和自己的亲生女儿偷偷调换 。而养母更是为了自己的亲生女儿和儿子，逼着原主嫁给一个打死过两任老婆的老渣男。\n不过，这都难不倒江莯颜，看她如何榨干无良养父母的钱财，临走前还分别送给他们一个霉运符，让他们为欺辱原主付出代价。\n江莯颜报名下乡后，在这期间，邂逅了未来的命中注定，也重逢了自己的亲三哥。凭借精湛的玄术和医术救治了很多本该被命运辜负的人。更凭借那双能洞察虚妄的天眼，敏锐察觉到潜藏在暗处的敌特分子，保护了被下放的科研人员的安全。\n高考恢复后，江莯颜凭借过人的天赋和优异的成绩考入京市的顶尖学府，也终于和亲生父母相遇，开启了属于她的璀璨篇章！", "tags": ["年代", "现代言情", "穿越", "天才", "虐渣", "真假千金"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零知青娇弱可人？刀刀要你狗命", "fullTitle": "七零知青娇弱可人？刀刀要你狗命", "link": "https://fanqienovel.com/page/7606648925205826584", "data": [24.67, 25.25, 25.37, 25.06, 24.98, 25.38, 25.68], "trend": 1.01, "latest": 25.7, "wordNumber": 834823, "creationStatus": 0, "desc": "【已完结，放心入坑】\n重生七零年代＋抄家＋空间＋白切黑女主＋男女双强＋下乡知青＋科技助国＋军婚＋甜宠＋恋爱脑兵王＋爽文＋双洁\n23世纪武术冠军魂穿七零，一睁眼就遇上抄家惊魂，原主被活活逼死。\n她携带异宝重活一世。\n父母双双牺牲，家产被窥，革委会频频上门刁难？\n她连夜端了革委会老巢，洗劫仇家，卷走滔天财富潇洒下乡。\n本想苟着搞钱搞科研，却意外撞破祖辈惊天秘辛，一路遭人截杀。\n人前软萌娇弱小知青，人后狠辣能打白切黑。\n谁料被冷面兵王一眼盯上，从此黏人属性彻底爆发。\n风行止：看着香香软软，想娶回家疼。\n下一秒见她把人揍飞：……更爱了，又飒又野！\n恋爱脑兵王天天贴贴，白切黑女主一言不合就动手。\n她搞科技强国，他做最强后盾。\n男女双强，军婚高甜，从下乡知青飒到京城顶层！", "tags": ["年代", "现代言情", "重生", "空间", "强强", "白切黑"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [28.91, 28.41, 31.3, 33.97, 33.56, 31.52, 29.09], "trend": 0.17, "latest": 29.1, "wordNumber": 1173136, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [16.83, 23.95, 23.5, 24.66, 25.38, 25.73, 26.55], "trend": 9.72, "latest": 26.5, "wordNumber": 945291, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [15.02, 17.66, 19.07, 20.47, 21.48, 22.1, 22.32], "trend": 7.3, "latest": 22.3, "wordNumber": 583945, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [25.65, 28.2, 28.92, 29.22, 30.11, 31.1, 32.27], "trend": 6.63, "latest": 32.3, "wordNumber": 922154, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [12.31, 12.93, 14.88, 17.97, 19.27, 19.01, 17.99], "trend": 5.68, "latest": 18.0, "wordNumber": 1795463, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [15.72, 17.56, 18.55, 19.51, 20.16, 20.76, 21.2], "trend": 5.48, "latest": 21.2, "wordNumber": 4638302, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [18.08, 19.33, 19.95, 20.74, 21.23, 21.73, 22.14], "trend": 4.06, "latest": 22.1, "wordNumber": 897997, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [13.95, 14.7, 15.38, 15.67, 16.08, 16.86, 17.66], "trend": 3.71, "latest": 17.7, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [16.23, 16.25, 16.5, 17.64, 18.24, 18.36, 18.29], "trend": 2.06, "latest": 18.3, "wordNumber": 1657992, "creationStatus": 1, "desc": "【古言架空+女强+斗极品婆家娘家+养崽+无穿越+无重生+先婚后爱】\n　　银杏五岁就伤了身子，失去了做母亲的资格，尽管她长得好看又能赚钱。\n　　但依旧没有哪个人家愿意娶她，因为娶了她就变成绝户了。\n　　唯独村里的老鳏夫赖大，不但愿意娶她，还愿意出双倍的聘礼。\n　　这让银杏贪财的娘果断点头。\n　　收了五两银子的聘礼，让他把闺女直接领走。\n　　但银杏死活不肯，她知晓已经死了两个媳妇的赖大没安好心思。\n　　可在这封建的年代，婚姻向来是由父母做主。\n　　尽管她极力反对，但也无法改变贪财娘的想法。\n　　就在她绝望之时，那个藏在她心里多年的男人出现了。\n　　萧青北：婶子，我想娶银杏，希望您能同意。\n　　王氏：你要娶银杏？人家赖大出了五两银子的聘礼，你能拿得出来吗？\n　 萧青北：我能的。\n　　 银杏：青北哥，你真的要娶我吗？\n　 萧青北：嗯，跟我走吧。\n        银杏：大宝二宝，快叫爹！\n 大宝二宝：（他们可是皇子，怎么可能随便叫爹呢！）\n     萧青北：你们想学功夫吗？（这两个小子还真是块练武的好苗子）\n   大宝二宝：师父！（叫师父是可以的）", "tags": ["种田", "古代言情", "乡村", "女强", "养崽", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越农女断亲，有空间天天吃肉！", "fullTitle": "穿越农女断亲，有空间天天吃肉！", "link": "https://fanqienovel.com/page/7615591201386810393", "data": [17.78, 16.87, 16.44, 16.25, 16.24, 17.22, 18.75], "trend": 0.97, "latest": 18.8, "wordNumber": 953716, "creationStatus": 1, "desc": "动漫已上线！\n（有声已出）评分刚出，会涨的，放心入哈～\n【架空+空间+女强+家长里短+处理极品+日常+CP……】\n雇佣兵苏晚云，做最后一个任务被一枪爆头了。\n再醒来变成北国的农家女，要被奶奶和二叔拖去卖掉。\n她掌掴二叔，脚踢奶奶，带着被压榨得说话都不敢大声的爹决然断亲自立门户。\n上辈子的千万存款自动兑换成了灵泉空间，还有千亩良田。\n极品敢来闹事，打得他们鼻青脸肿。\n生死看淡，不服就干。\n住着破草棚，食不果腹，身无分文，那就上山打猎、挖草药，赚了银子就能盖房，天天大鱼大肉。\n有人抓着她的把柄来逼婚，直接干死他！\n她的愿望：赚到花不完的银子，直接躺平。\n某天，男人带着所有家当来敲门：“苏晚云，开门，我来入赘了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "女强"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世：兽夫太凶猛", "fullTitle": "穿越兽世：兽夫太凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [12.51, 12.69, 12.8, 12.89, 12.96, 12.95, 12.95], "trend": 0.45, "latest": 13.0, "wordNumber": 1328196, "creationStatus": 0, "desc": "【穿越兽世＋轻快甜宠+生活日常＋1vN+多雄】\n千夏在21世纪是个勤勤恳恳的打工人，这天加完班回家路上被一辆失控的汽车撞死，没想到当她再睁开眼的时候是在一个巨大的山洞里。\n山洞阴暗潮湿让她惶恐，而她身上只围着一块抹胸样式和短裙样式的破烂兽皮，她不明白她明明死去了又怎么会出现在这里。\n难道......忽然见她脑袋里电光一闪，她又细细看了身上的兽皮，这......不会是像她看的兽世小说那样，穿越兽世了吧？？？\n别人的第一兽夫是四阶、五阶强者，她一个最不受欢迎的瘦弱丑雌的第一兽夫就是这大陆的顶尖战力强者。\n上辈子她兢兢业业连个恋爱都谈过，这辈子刚穿来没多久就肚里揣崽，还上演了一场兽世带球跑。", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "带球跑"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [32.97, 40.14, 43.58, 46.96, 50.1, 53.01, 55.9], "trend": 22.94, "latest": 55.9, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [32.94, 37.44, 39.18, 40.91, 42.41, 43.85, 45.21], "trend": 12.27, "latest": 45.2, "wordNumber": 507414, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君今日又没有藏好他的尾巴！", "fullTitle": "夫君今日又没有藏好他的尾巴！", "link": "https://fanqienovel.com/page/7565826198656273432", "data": [10.87, 11.62, 11.83, 12.11, 12.27, 12.47, 13.1], "trend": 2.23, "latest": 13.1, "wordNumber": 370843, "creationStatus": 0, "desc": "乔盈穿书了，但不幸的是，她被绑匪伤到了脑袋，失了忆。\n在阴暗潮湿的地牢里，她遇到了一个少年。\n少年一袭青衣，白发如雪，面容昳丽，却眼覆白绫，虽身有残缺，但他最是乐观爱笑。\n那一天，失忆的乔盈带着人畜无害的少年一起逃出了地牢。\n少年是个好人。\n因为怕血，所以哪怕是在尸山血海，他的衣摆也一尘不染。\n因为胆小，别人打架，他只敢躲在远处，众人却在下一刻死在毒雾里。\n因为善良，他给痛苦的敌人递药，可惜对方没熬住，七窍流血而死。\n于是，她决定和这样的好人成亲。\n再到后来，正派人士叫着妖孽，提剑而来。\n那一夜，尸横遍野。\n她终于想起来了剧情。\n这是一个诡异横生，光怪陆离的世界。\n有那么一个大反派，他缺乏正常人的情感，为祸苍生，引来纷争无数，最后是男女主牺牲生命才将他封印。\n腥风血雨里，少年回眸看她。\n蓝色的眼眸幽深诡谲，缀了血花的面容，宛若人间修罗，九条狐尾在身后肆意舒展，妖冶秾丽。\n乔盈被吓得脸色煞白。\n他却轻轻的笑，“你若是害怕想跑，可来不及——”\n话音未落，乔盈跑了，却是跑进他的怀里，拭去他脸上的血花，“你吓到我了，我还以为你受伤了！”\n少年眨眨眼，摸摸她的脑袋，又戳戳她的脸，“你是不是傻？”", "tags": ["古言脑洞", "古代言情", "反派", "穿书", "HE"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "有了暴君读心术，我在宫里杀疯了", "fullTitle": "有了暴君读心术，我在宫里杀疯了", "link": "https://fanqienovel.com/page/7367580979906497560", "data": [11.49, 11.94, 12.24, 12.56, 12.76, 12.88, 12.96], "trend": 1.47, "latest": 13.0, "wordNumber": 925747, "creationStatus": 0, "desc": "安玖穿成了皇帝宫里想爬龙床的小宫女。\n一睁眼，暴君将勾引他的小宫女一剑刺了个透心凉。\n第二天，暴君刺死了嫔妃身边的大宫女。\n第三天，给皇帝试菜的宫女毒发身亡。\n宫女是个高危职业，安玖决定好好干活，多多存钱，珍爱生命，远离暴君。\n可此时她忽然听到了暴君的心声。\n　　“啊啊啊，烦死了烦死了烦死了，这些奏章写的都是狗屎吗？朕都说了不吃桃子，不吃桃子，不吃桃子，还天天问天天问天天问。”\n　　安玖？\n　　“新来的宫女是傻子吗？杵在那做灯台？没看见朕脖子都酸了，也不知道过来捏捏？”\n　　安玖挪动脚步，试探着捏了捏皇帝的肩膀…\n　　“御膳房的点心噎死人，李公公瞎了，不知道给朕倒杯水…”\n　　安玖挪过去倒了一杯茶…\n　　渐渐的，光华殿的宫女太监们发现，暴君的脾气似乎好了许多…\n　　后宫嫔妃喜极而泣，陛下的疯病好了，是不是可以侍寝了…\n　　\n　　“朕是种马吗？天天让朕翻牌子，这是人腰子，不是猪腰子…提到腰子，朕忽然想吃爆炒腰子了…”\n　　于是绿头牌没了，一盘美味的腰子端了上来。\n　　安玖从小宫女升职成掌事姑姑…\n　　某天，暴君说：“你甚得朕心，做朕的女 nk": "https://fanqienovel.com/page/7561724651605330968", "data": [28.35, 31.28, 38.69], "trend": 10.34, "latest": 38.7, "wordNumber": 1017822, "creationStatus": 0, "desc": "[年代文+爽文+虐渣+空间+双洁]\n\n上辈子，魂魄不全的黎予初，被渣男和绿茶合谋骗到了边境，落了个死后喂狗的下场！\n\n重生后，她清醒果断，\n\n渣男想升职？毫不犹豫送他去吃花生米！\n\n绿茶想要又要？做梦！你只配吃花生米！\n\n不仅处处给他们挖坑，还通过他们找到了金山银山？\n\n太好了，目之所及，不论钱财粮食还是宝贝，通通收收收！\n\n顺带着陆海空三军告状告了一大遍，把渣男的领导搞的灰头土脸，别提有多爽！\n\n啥？渣男娘受不了刺激想求自己？\nno！本姑娘不接受道德绑架！\n\n\n\n\n\n\n\n\n\n………………\n只是那个高冷的首长喂，\n你千里追到我家为哪般？想让我跟你去随军？\n\n本辣椒是觉得你有钱又大方还好欺负，\n可咱们不太合适！\n\n毕竟，跨军界告你状，让你成为了大笑话，我虽不后悔但心虚！\n\n\n而且姐有大志向：只想当村霸！\n\n………………………………\n\n小剧场：\n“听说了吗，顾首长的新婚妻子是黎予初！”\n“老天爷！这个活爹怎么又回来了？”\n嫂子们急的嘴里起了水泡，\n文工团的姑娘使劲捂住钱包，\n训狗的提前做好了被罚准备，\n\n……\n\n要说谁最欢迎黎予初这个大闹腾，\n当然是……犬！\n呃，还有某人！", "tags": ["年代", "现代言情", "宠妻", "空间", "虐渣", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随妈改嫁军区院：首长他蓄谋已久", "fullTitle": "随妈改嫁军区院：首长他蓄谋已久", "link": "https://fanqienovel.com/page/7530871199874681880", "data": [24.11, 25.21, 28.36], "trend": 4.25, "latest": 28.4, "wordNumber": 1116007, "creationStatus": 0, "desc": "【年代+群像+军婚+家长里短+病娇+打脸虐渣+女强】\n天才医生江临夏累死在手术台上，穿成80年代受人排挤欺辱的小村姑。苏醒后，她与泼辣老妈林阿秀联手揍人渣，成了村里的女霸王！\n\n老妈捡回重伤的顾石野。眼看母女俩艰难度日，又因为自己的到来被羞辱，救命恩情加烈士遗孀身份，顾时野果断求婚歪婆娘：“我娶你，你和阿夏都跟我走！”\n\n 母女俩一合计：进军区大院？不亏！\n\n谁知大院才是真地狱开局，流言蜚语如刀，弟弟不认，哥哥不睬。\n\n不想认？没关系，她可不是娇滴滴的女王，有的是力气和手段！\n\n江临夏冷笑：专治各种不服！银针救战士，辣妈骂全院，日子刚爽起来，却惊觉那人看她的眼神，越来越烫人……\n", "tags": ["年代", "现代言情", "病娇", "群像", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "投胎？不！我和六零重生女换人生", "fullTitle": "投胎？不！我和六零重生女换人生", "link": "https://fanqienovel.com/page/7627049014881438745", "data": [22.81, 23.98, 25.21], "trend": 2.4, "latest": 25.2, "wordNumber": 552388, "creationStatus": 1, "desc": "评分刚开，会涨！\n【强惨狱霸风男主X貌美咸鱼小作家】\n【不下乡+不黑市+日常家长里短+互相救赎+甜文】\n下辈子荣华富贵关我这辈子什么事儿？\n林夏本是现代一个网文作者和粉丝十几万的短篇漫画作家。\n一场意外连人带窝被轰得渣都没了，喝孟婆汤投个富贵胎？她选补偿空间和六零重生女交换人生。\n林夏面对即将被卖出去换彩礼的人生，首先选择撕开林家偏心的遮羞布，不当老黄牛伺候全家，在外积极找工作。\n结果六十年代的铁饭碗没关系实在是太难了。\n“夏夏，老师给你介绍个相亲对象，其他条件都符合你的要求，就是这长相，五官分开看都好看”\n“合在一起嘛。夏夏，你知道胡子么？他就像那没有胡子的胡子，胡子头儿要是一起蹲笆篱子，他凭长相气质能当狱霸的那种。”\n林夏想了想下乡的苦。\n相！长得凶怎么了，有下乡可怕吗？\n谁知当天相亲，第二天就领了证，嫁进了铁路局家属院。\n贺凛在他荒芜的人生碰到了独属于他的救赎，迅速扒拉回了家。\n家属院众人看着美若天仙的林夏，本以为贺科长的媳妇儿肯定是被强迫嫁给他的，日子肯定不好过。\n谁知人家贺科长长得凶但他是真疼媳妇啊。\n再后来夫妻两一起努力，一个在铁路系统一路晋升，一个成为了闻名全国的畅销作家", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "相互救赎", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生：搬空首富家底去北大荒", "fullTitle": "重生：搬空首富家底去北大荒", "link": "https://fanqienovel.com/page/7632550005361888281", "data": [19.55, 19.99, 20.96], "trend": 1.41, "latest": 21.0, "wordNumber": 1054181, "creationStatus": 1, "desc": "上一世，我是江南顾家的大小姐顾晚。\n特殊时期一来，家被抄、人被批斗，爷爷奶奶被逼死，三个哥哥流放惨死，我冻毙在北大荒的雪地里。\n睁眼，我竟重生回到了风波前！\n风声已紧，断了联系的二叔一家等着落井下石，远在南洋的姥姥家远水解不了近渴。\n这一次，我攥着随身空间，说服全家：跑！\n金银细软、粮食布匹、药品工具，统统收进空间。\n江南再无顾家地主，北大荒多了户开荒户。\n别人啃树皮时，我家粮囤满仓；\n别人被批斗时，我们早已洗白身份，安稳度日。\n这一世，我要护好全家，让所有仇人血债血偿！", "tags": ["年代", "现代言情", "乡村", "重生", "空间", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [27.65, 28.24, 28.92], "trend": 1.27, "latest": 28.9, "wordNumber": 788524, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零知青娇弱可人？刀刀要你狗命", "fullTitle": "七零知青娇弱可人？刀刀要你狗命", "link": "https://fanqienovel.com/page/7606648925205826584", "data": [24.98, 25.38, 25.68], "trend": 0.7, "latest": 25.7, "wordNumber": 834823, "creationStatus": 0, "desc": "【已完结，放心入坑】\n重生七零年代＋抄家＋空间＋白切黑女主＋男女双强＋下乡知青＋科技助国＋军婚＋甜宠＋恋爱脑兵王＋爽文＋双洁\n23世纪武术冠军魂穿七零，一睁眼就遇上抄家惊魂，原主被活活逼死。\n她携带异宝重活一世。\n父母双双牺牲，家产被窥，革委会频频上门刁难？\n她连夜端了革委会老巢，洗劫仇家，卷走滔天财富潇洒下乡。\n本想苟着搞钱搞科研，却意外撞破祖辈惊天秘辛，一路遭人截杀。\n人前软萌娇弱小知青，人后狠辣能打白切黑。\n谁料被冷面兵王一眼盯上，从此黏人属性彻底爆发。\n风行止：看着香香软软，想娶回家疼。\n下一秒见她把人揍飞：……更爱了，又飒又野！\n恋爱脑兵王天天贴贴，白切黑女主一言不合就动手。\n她搞科技强国，他做最强后盾。\n男女双强，军婚高甜，从下乡知青飒到京城顶层！", "tags": ["年代", "现代言情", "重生", "空间", "强强", "白切黑"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零女配要改嫁，糙汉军官他急了", "fullTitle": "六零女配要改嫁，糙汉军官他急了", "link": "https://fanqienovel.com/page/7511997532336032793", "data": [20.05, 19.85, 20.67], "trend": 0.62, "latest": 20.7, "wordNumber": 1432893, "creationStatus": 0, "desc": "【正文已完结】【土狗军三代+明艳美人画家+无空间+细水流长+双洁+后半部分偏群像】\n姜喜珠熬夜画画，睁眼成了年代文里男主早死的乡下未婚妻。\n前未婚夫已结婚。\n她也阴差阳错的嫁了个脏脏包款丈夫。\n说她不检点，有丈夫还缠着前未婚夫？反手一封举报信让前未婚夫声名狼藉。\n他能当兵是顶了我哥的名额！当兵的路费都是我家给的！\n拿钱砸她？！\n钱当然要，息事宁人？想都不要想！渣男绿茶女一个都别想跑。\n乡下来的没文化？她亲绘普法连环画，火遍大江南北！\n说她丑？卸了浓妆，军区第一美人！\n虽然我家徒四壁，但吃苦？现世富二代来着，这玩意儿吃不了一点。\n什么？我那个不爱洗脚的脏脏包丈夫，是原书里早死的首都军三代？\n抱紧大腿以后有抚恤金，生个娃以后都是保障啊。\n太脏了...下不去嘴，咋办？\n比她还穷，每个月还吃她粮食咋办？\n要不...让他给未来前妻介绍个对象？\n*\n“帮我，成功高嫁，我就跟你离婚，结婚礼金归你，再送你三年肉夹馍。”\n“狗才要离婚，我洗洗还是很耐看的，而且我家比他家有钱，要不你再试试我？”\n“不要，你又脏又穷。”\n陈青山最后悔的，就是当初和媳妇闹离婚，还不知好歹的跟爬床的媳妇讲道理。\n如果重来，他一定翻身把人压下，再也不讲女人要独立的屁话。", "tags": ["年代", "现代言情", "穿越", "虐渣", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [30.42, 29.91, 31.0], "trend": 0.58, "latest": 31.0, "wordNumber": 869218, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄学真千金穿七零，认亲首长父亲", "fullTitle": "玄学真千金穿七零，认亲首长父亲", "link": "https://fanqienovel.com/page/7581118244304473150", "data": [31.65, 31.74, 31.81], "trend": 0.16, "latest": 31.8, "wordNumber": 947599, "creationStatus": 0, "desc": "江莯颜本是现代玄学界的修炼天才，早在她穿越之前，师父便已算出她有穿越到异世这一劫难。为护她周全，师父与众位师兄们，将海量金银珠宝、稀缺药材以及各种符箓和生活物资尽数收纳于芥子袋中，成为江莯颜在七十年代最大的“底气”。\n江莯颜刚穿越，便发现原主在刚出生时，就被现在的养母把她和自己的亲生女儿偷偷调换 。而养母更是为了自己的亲生女儿和儿子，逼着原主嫁给一个打死过两任老婆的老渣男。\n不过，这都难不倒江莯颜，看她如何榨干无良养父母的钱财，临走前还分别送给他们一个霉运符，让他们为欺辱原主付出代价。\n江莯颜报名下乡后，在这期间，邂逅了未来的命中注定，也重逢了自己的亲三哥。凭借精湛的玄术和医术救治了很多本该被命运辜负的人。更凭借那双能洞察虚妄的天眼，敏锐察觉到潜藏在暗处的敌特分子，保护了被下放的科研人员的安全。\n高考恢复后，江莯颜凭借过人的天赋和优异的成绩考入京市的顶尖学府，也终于和亲生父母相遇，开启了属于她的璀璨篇章！", "tags": ["年代", "现代言情", "穿越", "天才", "虐渣", "真假千金"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书七零，吃瓜赚钱两不误！", "fullTitle": "穿书七零，吃瓜赚钱两不误！", "link": "https://fanqienovel.com/page/7554031144186940478", "data": [21.75, 21.68, 21.79], "trend": 0.03, "latest": 21.8, "wordNumber": 1008237, "creationStatus": 0, "desc": "【穿书+系统+知青下乡+吃瓜+爽文+女主自强+原女主也是大女主人设+不娇妻】\n女主太小，感情线比较靠后。\n穿到七零年代，还没过几天好日子，就被迫下乡的苏桃，对着让她下乡的罪魁祸首冷冷一笑。\n敢算计她，那就一起下乡吧！\n没想到，她不仅穿越了，还穿书了！\n作为书中没有的角色，她决定远离男女主，静静地吃瓜，默默地赚钱，争取早日买上车，买上房，抱个少年郎！\n只是，故事的发展怎么跟她记得的不一样呢？\n恶毒女配怎么跟女主成了朋友？\n自己身边的这个帅哥，书里也没有啊？", "tags": ["年代", "现代言情", "乡村", "系统", "穿书", "家长里短"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "发配边关，罪妻开荒养出战神", "fullTitle": "发配边关，罪妻开荒养出战神", "link": "https://fanqienovel.com/page/7613410424586767385", "data": [68.14, 75.59, 77.29], "trend": 9.14, "latest": 77.3, "wordNumber": 772199, "creationStatus": 1, "desc": "【边关生活+木系+御兽+宠夫+护短+开荒种田+甜宠+双强直球夫妇+对照组】\n大靖连旱两年，粮荒四起，战火燃遍辽东。\n末世后勤员苏禾穿成罪奴丫鬟，被发配给军户为妻。\n罪奴姐妹极力表现，力争抢个优秀男儿，而她只看安全感，一眼锁定全场最壮的百户萧征。\n他冷脸拒绝：“我不需要媳妇，赏我粮食就行！我养不起，也没功夫照顾。”\n她直白坦荡：“我不用你照顾。我能种地，能持家。你很强，跟你，我安全。”\n没媳妇前的萧征：女人真麻烦！\n有了媳妇后，萧征夜夜搂着苏禾：真得劲！媳妇，再来二十个馒头！\n自此，边关多了一对双强夫妇。\n他负责拿刀护她，横扫敌军；\n她负责种田产粮，兜底全家。\n极品邻居攀比？打脸！\n边关缺粮断炊？解决！\n敌军突袭包围？放野兽！\n萧征从穷军户一路封将，世人皆知：\n大将军最厉害的不是战功，是他那位能种出天下粮的媳妇。\n【饭桶将军×产粮小媳妇】\n你负责打仗护家・我负责种地养你", "tags": ["种田", "古代言情", "乡村", "穿越", "强强", "宠夫"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越农女断亲，有空间天天吃肉！", "fullTitle": "穿越农女断亲，有空间天天吃肉！", "link": "https://fanqienovel.com/page/7615591201386810393", "data": [16.24, 17.22, 18.75], "trend": 2.51, "latest": 18.8, "wordNumber": 953716, "creationStatus": 1, "desc": "动漫已上线！\n（有声已出）评分刚出，会涨的，放心入哈～\n【架空+空间+女强+家长里短+处理极品+日常+CP……】\n雇佣兵苏晚云，做最后一个任务被一枪爆头了。\n再醒来变成北国的农家女，要被奶奶和二叔拖去卖掉。\n她掌掴二叔，脚踢奶奶，带着被压榨得说话都不敢大声的爹决然断亲自立门户。\n上辈子的千万存款自动兑换成了灵泉空间，还有千亩良田。\n极品敢来闹事，打得他们鼻青脸肿。\n生死看淡，不服就干。\n住着破草棚，食不果腹，身无分文，那就上山打猎、挖草药，赚了银子就能盖房，天天大鱼大肉。\n有人抓着她的把柄来逼婚，直接干死他！\n她的愿望：赚到花不完的银子，直接躺平。\n某天，男人带着所有家当来敲门：“苏晚云，开门，我来入赘了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "女强"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生在穿越女之前抢回前夫", "fullTitle": "重生在穿越女之前抢回前夫", "link": "https://fanqienovel.com/page/7443016187258080318", "data": [12.75, 14.0, 15.1], "trend": 2.35, "latest": 15.1, "wordNumber": 402942, "creationStatus": 0, "desc": "[种田+美食+古代言情+重生+穿越+读心术]\n林玉禾重生了，重生在了她前夫和他白月光大婚当日。\n她悔恨不已自己前世鼠目寸光，才会同谢书淮和离并打掉了他的孩子，还识人不清和恶人未婚夫定了亲。\n那恶人早在外面养了外室和孩子，娶她回去也是做个背锅的主母。\n最终酿成她被恶人所杀的结果。\n往日谢书淮性子虽冷漠，对她还算用心，包容她的各种刁难。\n抄书挣来的银子自己都舍不得用，却给林玉禾添置衣衫。\n死后，她一心念着谢书淮对她的好，一腔执念成了孤魂野鬼守着谢书淮多年，看他高中探花，还见谢书淮为自己抱了仇。\n直到谢书淮仕途顺遂身居高位娶了他的白月光后。\n林玉禾才黯然离场，不想却重生了。\n得老天垂怜，林玉禾在心中暗暗发誓，定要抢回自己前夫。\n她凭着三个月的身孕，成功抢回谢书淮的人，却没抢回他的心。\n只因情敌太过强大，不仅是谢书淮心中挂念的白月光，还是穿越而来的后世之人样样赢过自己。\n林玉禾也不沮丧，她发现自己竟能听到穿越女的心声。两人暗中较劲，却换来谢书淮对她态度越来越恶劣。\n看着他们两人越走越近。\n林玉禾心灰意冷准备成全两人时。\n谢书淮把她拽进怀中，大声质问道：“怎么？准备放弃，往日折腾我的那股劲去哪儿了。”\n（男女主双洁）\n\n\n\n\n我在\n\n此文忘记", "tags": ["种田", "古代言情", "重生", "美食", "双洁"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [30.11, 31.1, 32.27], "trend": 2.16, "latest": 32.3, "wordNumber": 922154, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "农家团宠娇娇女", "fullTitle": "农家团宠娇娇女", "link": "https://fanqienovel.com/page/6849391701497220109", "data": [15.41, 16.42, 17.26], "trend": 1.85, "latest": 17.3, "wordNumber": 1459545, "creationStatus": 0, "desc": "糖宝没了爹娘，亲戚都不愿意养，说她克人。\n拥有七个孙子的杨老太为凑齐八（谐音“发”），把糖宝领回了家。\n人人都说杨家养糖宝这下要倒霉了，可杨家不仅没倒霉，还成了大周新贵！\n就是杨家人脾气不好，一有人说糖宝克人，杨老二就瞪眼：哪个不要命的说我闺女克人？\n杨老太最牛逼，抽出一根绳子跑到人家：说你自个克人，不说我就吊死在你家。\n杨家七个孙子围着糖宝：妹妹吃糖。\n糖宝：耶？我是来凑数的呀，怎么凑成了人人疼爱的小宝贝？", "tags": ["种田", "古代言情", "团宠", "古灵精怪", "甜宠", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒前妻再就业，汴京第一妙厨娘", "fullTitle": "恶毒前妻再就业，汴京第一妙厨娘", "link": "https://fanqienovel.com/page/7517953139266309144", "data": [18.29, 19.26, 20.11], "trend": 1.82, "latest": 20.1, "wordNumber": 588503, "creationStatus": 1, "desc": "【1v1双洁+穿书+美食+经营+日常向】\n一睁眼，叶昭昭穿成了权臣文男主的恶毒前妻。\n在书中，原主做梦都想当官夫人。\n她使尽浑身解数嫁给男主，却在男主官职被一撸到底后，不顾男主和孩子的挽留，和离回到了扬州老家，二嫁给了青梅竹马。\n只是不到一年。\n竹马就转手将原主送给上峰做礼。\n原主逃出来，辗转回到汴京，却发现新帝登基，男主一朝翻身、敕封摄政王，誉满汴京。\n原主这个前妻也变得人人喊打，最后被擅作主张的下人活生生饿死在了柴房里。\n穿书后的叶昭昭，当然不想重蹈覆辙。\n放着现成的幸福生活不要，非要回什么扬州投奔青梅竹马？\n她脑子又没进水，分得清好赖。\n小姑子难缠小叔子阴郁；\n不愁，她苦练高情商，应付两个半大孩子还不容易？\n男主颓废潦倒家里入不敷出；\n不怕，她有厨艺傍身，能眼睁睁看着丈夫孩子饿死？\n只是，她的汴京小食肆开业的那一日，怎么全汴京的权贵都来捧她的场了？\n说好的全家低谷三年、人人可欺呢？\n流水的银子哗啦啦地进账，这哪里用得着吃苦头呀！\n原本麻木沉郁的男主更是将叶昭昭视若珍宝，全家人的日子也越过越好。", "tags": ["种田", "古代言情", "美食", "穿书", "双洁", "1v1"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [16.08, 16.86, 17.66], "trend": 1.58, "latest": 17.7, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "拾光荀攸", "fullTitle": "拾光荀攸", "link": "https://fanqienovel.com/page/7583672566569520190", "data": [11.53, 12.05, 12.9], "trend": 1.38, "latest": 12.9, "wordNumber": 1184718, "creationStatus": 1, "desc": "系统➕无cp➕种田➕打猎➕囤粮➕逃荒➕评分刚出\n京之春穿了！\n好消息，成了京城尊贵大小姐。\n坏消息，罪臣之女，被流放西北。\n除了挺个大肚子之外，还有个四岁的女儿。\n京之春白眼一翻，差点灵魂出窍。\n幸好，她是个医生，稳了稳心跳决定自己接生。\n历经一场千辛万苦，娃终于落地。\n只是没想到，孩子爹登场竟拒不认娃，还大骂京之春送他一片青青草原。\n京之春：“哈哈哈哈，我能给你戴绿帽子，只能说明你这男人是个渣渣！！”\n结果剧情反转，这男人自己也揣着个外室，外头还藏了个私生子。\n京之春腰杆瞬间直了：“原来你我半斤八两，谁也别嫌谁帽子绿！和离！”\n谁知狗男人不肯和离，京之春大手一挥直接休夫。\n直到某天，天下大乱，战乱天灾不断，京之春立马带着俩孩子开启逃荒模式。", "tags": ["种田", "古代言情", "系统", "医术", "无CP", "逃荒"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [25.38, 25.73, 26.55], "trend": 1.17, "latest": 26.5, "wordNumber": 945291, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [20.16, 20.76, 21.2], "trend": 1.04, "latest": 21.2, "wordNumber": 4638302, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [21.23, 21.73, 22.14], "trend": 0.91, "latest": 22.1, "wordNumber": 897997, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [21.48, 22.1, 22.32], "trend": 0.84, "latest": 22.3, "wordNumber": 583945, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "逃荒，我全家都是重生的", "fullTitle": "逃荒，我全家都是重生的", "link": "https://fanqienovel.com/page/7335796433146088510", "data": [11.93, 12.35, 12.77], "trend": 0.83, "latest": 12.8, "wordNumber": 1008891, "creationStatus": 0, "desc": "【预知梦+全家重生+无cp】前世苏音、苏母、小姑三人惨死在暴民屠刀下。转眼间，三人一同重生，在暴民冲入村庄前，带上杏花村（舅舅所在村子）提前逃离。\n逃荒路上，遇到被苏家人抛弃的愚孝爹，本以为他是拖后腿的存在，没想到他未卜先知，手段变得狠辣。\n在京城中遇到傻白甜双胞胎弟弟，结果一个变得阴险狡诈，一个变的冷血无情。\n“说吧，你们前世身份。”\n愚孝爹:“额，傀儡……皇帝。”\n二弟别过脸，“九千岁！”\n三弟冷着脸，“暗阁阁主。”\n好家伙！苏音直呼好家伙！这都是牛逼的主！\n听着他们说的前世，怎么觉得有点不对劲……\n三人的记忆似乎都……不一样。\n体验过腥风血雨的一家子，这辈子只想安安稳稳过地主小日子。\n可偏偏有人不愿意，用刀逼着他们下场。\n既然都不想过安稳日子，那就都别玩了。\n“爹！反了吧！”苏音。\n愚孝爹磨着屠刀，嘴上却说道:“闺女，这不好吧。”\n结果，转身就掀桌。\n阴险狡诈的二弟，“姐，搞得那么血腥不妥吧！”\n结果，转身就覆灭十万大军……\n冷血无情的三弟，“姐，娘说我们做事得温柔点！”\n结果，转身就一刀斩杀叛军首领！\n苏音:“…", "tags": ["种田", "古代言情", "重生", "前世今生", "逃荒"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全家提前两年囤货，逃荒吃香喝辣", "fullTitle": "全家提前两年囤货，逃荒吃香喝辣", "link": "https://fanqienovel.com/page/7546430467558345752", "data": [12.58, 12.92, 13.23], "trend": 0.65, "latest": 13.2, "wordNumber": 1426179, "creationStatus": 1, "desc": "【空间+赶山找山货+草药野果野菜真实配图+家长里短+逃荒+群像+囤货+虐渣+无CP]\t\n（又名：全家提前两年囤货，逃荒吃香喝辣）\n李杏儿做了一个奇怪的预知梦，她梦见自己十八代祖宗正在被屠杀。\n她必须穿越过去拯救自己的老祖宗。\n不然后世的她会因为蝴蝶反应消失，没想到老祖宗的魂在地府把人都求遍了，上天才给她十天同时又获得灵泉空间和千万存款。\n她迅速开启买买买囤货模式。\n十天过去，她买好物资穿定时越到古代池州杏花村。\n没想到穿早了，距离可怕的荒年还有两年。\n李杏儿发誓带着一空间物资要在古代过上好日。\n...\n谁都没想到。\n李杏儿穿越后变成大力女，一身武力值超高。\n她拳打野猪，脚踢恶霸，别人不敢去的禁山是她的粮仓，山珍野味随便捡。\n穿越后的春耕她利用现代化种子种出千斤粮食，搞出惊人的大丰收，带全家疯狂囤货。\n两年后。\n地震，火山爆发，蝗灾，瘟疫如期而至。杏花村全村人却没个怕的。\n因为地窖堆满粮食，杏儿带着村民们逃荒路上底气嘎嘎强!", "tags": ["种田", "古代言情", "空间", "逃荒", "群像", "无CP", "虐渣", "囤物资"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "想兼祧两房？搬空家产带儿女和离", "fullTitle": "想兼祧两房？搬空家产带儿女和离", "link": "https://fanqienovel.com/page/7545324289256328216", "data": [27.41, 27.19, 27.88], "trend": 0.48, "latest": 27.9, "wordNumber": 1152924, "creationStatus": 0, "desc": "【有空间，不是双洁，女主懂医术。】\n末世摸爬滚打多年的乔念，带着空间穿越到古代，一个穷秀才的妻子。\n刚睁眼，龙凤胎儿女面临被卖，乔念凭借自己的武力夺回孩子。\n成亲五年的秀才相公不回家？\n她带着孩子找过去。\n结果却发现，丈夫和寡嫂在城里，小日子过得风生水起，连儿子都生了俩。\n乔念一去，大杀四方，胖揍狗男女，搬空婆家所有财物。\n和离后，带着娘家人赚得盆满钵满。\n乔念变得越来越漂亮，肤白貌美又多金，渣前夫肠子都悔青了。\n他厚着脸皮上门求和，被乔念一脚踢出门。\n渣男有多远给我滚多远……", "tags": ["种田", "古代言情", "穿越", "空间", "医术", "发家致富"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [26.88, 26.57, 27.35], "trend": 0.46, "latest": 27.3, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "古代农家夫妻的红火小日子", "fullTitle": "古代农家夫妻的红火小日子", "link": "https://fanqienovel.com/page/7574739331256945726", "data": [13.98, 14.2, 14.38], "trend": 0.41, "latest": 14.4, "wordNumber": 4542080, "creationStatus": 1, "desc": "（又名：清水故事）\n【古代种田/架空地图（南北乱炖）/群像（每个人都是自己人生的主角）/无空间/无金手指/乡村生活/细水长流】\n\n\n真人有声书已上线~欢迎收听~\n\n一本闲来无事，消磨光阴的好书~\n\n作者拥有五百万字长文经验，量大管饱~可放心追更观看~\n\n这是一户农家最真实的日子，是清水村林家一生的故事。\n\n这里有田间的汗水，也有市集的吆喝，\n\n有屋檐下的温馨，也有暗流涌动的危机，\n\n有病榻前的守候，也有绝境中的奋起，\n\n有朴实无华的相守，也有悄然滋生的情愫，\n\n酸甜苦辣，有哭有笑，列位看官，且听我慢慢道来...\n\n", "tags": ["种田", "古代言情", "乡村", "团宠", "互宠", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏 外来得如此突然。\n祝知予死了。\n他的妻子死了。\n他深爱的、日夜妄想的人，死了。\n霍礼冷静地为妻子处理后事、收拾遗物……最后冷静地服药殉情……\n再次睁眼，墓碑消失，他的妻子好端端的站在他跟前，问道：“同学，你还好吗？”\n不好，他一点也不好。\n霍礼摇头，她离开的每一天，他都如行尸走肉，度日如年。\n他下意识钻进她的怀里寻求安慰。\n却没想到只迎来了妻子清脆的巴掌。\n哦，他忘了，现在的祝知予还不是他的妻子。\n发帖：用不光彩的手段和妻子结婚了，但现在妻子还不是妻子，我该怎么让妻子重新爱上自己？\n回答：哈？楼主要不要看看你在问什么呢？语文是体育老师教的吧？", "tags": ["青春甜宠", "现代言情", "学霸", "暗恋", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [66.17, 67.3, 68.94], "trend": 2.77, "latest": 68.9, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯批太子爷夜夜闻我体香入睡", "fullTitle": "疯批太子爷夜夜闻我体香入睡", "link": "https://fanqienovel.com/page/7561406804232522814", "data": [40.92, 42.67, 43.37], "trend": 2.44, "latest": 43.4, "wordNumber": 308760, "creationStatus": 0, "desc": "新书刚开分，还会涨的！【阴湿疯批+甜撩+救赎+穿越+大学校园+双洁1v1】 \n天生坏种X坚韧乐观小太阳 \n品学兼优的大一新生江幼希，某天兼职时，意外捡到一个少年。 \n少年自称是她未来的儿子，对她大喊“妈”，抱着江大风云人物贺酌直喊“爸”。\n等等！ \n孩子他爸是贺酌？\n那个传闻杀过人、手段狠戾变态的疯批太子爷？！ \n儿子：“妈，那都是谣言，爸其实是一个温柔善良的好人！”\n江幼希半信半疑，当晚就亲眼看到贺酌开车撞人。\n他满眼杀气，以飙车的速度把一名男子撞得满身是血，奄奄一息。\n江幼希吓得转身想跑，却被他扣住后脖颈。\n“抱歉，吓到你了，”他沾染血迹的指尖落在她眉心，笑容恶劣—\n“小、学、妹。”\n—\n虽然孩子他爹是变态，但为了避免丧偶式教育，江幼希决定带着儿子去认爹。\n江幼希把儿子拉出来：“贺酌学长，他、他是你儿子。”\n贺酌睨她：“他妈是谁？”\n“我。”\n“行，那今晚陪我睡。”\n“？？我为什么要陪你睡？”\n“不睡，他怎么来？”\n“……”\n— \n贺酌因童年遭受打击，导致患上了睡眠障碍症。唯有江幼希身上的气息，能让他心安，成功入眠。 \n男人指腹轻碾她的小梨涡：“再陪我睡一晚，好不好？” \n“怎么睡？”\n男人紧扣她纤腰，俯身亲吻— \n“换个姿势。”", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "双洁", "1v1"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿：想假装平凡，结果是真不行", "fullTitle": "胎穿：想假装平凡，结果是真不行", "link": "https://fanqienovel.com/page/7627093619358305305", "data": [18.44, 19.46, 20.31], "trend": 1.88, "latest": 20.3, "wordNumber": 600103, "creationStatus": 0, "desc": "苏宁宁从暗卫第一，胎穿成现代的一个小宝宝时，她决定的第一件事就是当个普通人，坚决不争强好胜，当那领头拔尖之人。\n然而事情的发展似乎和她想得有些不一样！\n苏宁宁上幼儿园时，她拔光了小区的花送给老母亲，只为换一支冰淇淋，老母亲看着眼熟的花陷入沉默，没多久物业上门了。\n小学三年级时，苏宁宁放学路上看见一只肥鸽从头顶飞过，下意识抬手击落，她捡起鸽子来回翻看，却什么都没找到，直接扔了鸽子一头雾水地回家了，当晚一个凶巴巴的老头上门了。。。。。\n小学五年级时，苏宁宁看见一个陌生男人去了李阿姨家，不久她就听到了李阿姨痛苦的叫声，这次她学聪明了，没有自己去，叫了妈妈以及周围的邻居一起上，不久，李阿姨离婚了。。。。\n苏宁宁就这样在鸡飞狗跳的日子中长大了，完美地成为了一名人嫌狗厌的万年学渣。\n苏宁宁：。。。。。\n也没有人告诉过她当个普通人这么难啊！\n好在她找了个靠谱的男人，这男人品学兼优，考试万年第一，就是家庭环境复杂了点。", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "学霸", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [27.09, 28.1, 28.88], "trend": 1.79, "latest": 28.9, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春日烈阳", "fullTitle": "春日烈阳", "link": "https://fanqienovel.com/page/7163459032223583270", "data": [26.46, 27.37, 28.1], "trend": 1.63, "latest": 28.1, "wordNumber": 351264, "creationStatus": 0, "desc": "[体弱少女 X 烈日少年]\n（正文已完结）\n（原书名：春日烈阳）\n（青梅竹马+校园甜宠+日常）\n（人物设定均已成年）\n许渔刚来青禾中学的时候，有一个梦想，那就是在冬日纷飞的时候亲手接住一片雪花。\n她想，人生都这么苦了，总要来看一次大雪纷飞的样子。\n于是许渔努力的一边上学，一边治病。\n在来京市之前，自家亲爹说，在学校会有小时候的邻居哥哥帮忙照顾她。\n但是在许渔记忆里的邻居哥哥：喜欢揪她衣领子，还和别人打架。\n“邻家哥哥”顾盛：......\n第一次见到许渔的时候，顾盛站在校门口“亲切”为她指路。\n第二次见到许渔，顾盛提着保温杯里面装的是热牛奶。\n第三次，第四次......\n顾盛在许渔面前向来习惯了伪装，只有那一次。\n他在昏暗的路灯下表情狠厉的撺着一个人的衣领：“别让我看见你打扰她第二次，滚。”\n他终于有些抑制不住的爆发，脸上掉落的面具后才会原原本本的顾盛。\n那天的许渔忽然觉得，顾盛就像太阳。\n她想，如果在冬天摸不到雪花，那就拜托顾盛带着她去春天感受阳光也不错。\n世界对她来说无聊单调，但是顾盛能够带来温暖。\n立意：我们可遇不可求。", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "青梅竹马"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [66.07, 66.84, 67.51], "trend": 1.44, "latest": 67.5, "wordNumber": 373464, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夏夜有染", "fullTitle": "夏夜有染", "link": "https://fanqienovel.com/page/7429537438936075289", "data": [19.94, 20.31, 20.72], "trend": 0.78, "latest": 20.7, "wordNumber": 403900, "creationStatus": 0, "desc": "（已签实体）\n【校园重生+追妻火葬场+拽哥上位+借住文学】\n【有点叛逆乖乖女x懒淡拽哥】\n奶奶离世，谈、陆两家见没了亲人的许恩棠可怜，都想把她接去照顾。\n来到北城，许恩棠再次见到那个让她一眼难忘的少年。\n陆襟痞气肆意，之后一起成长的那些年，她看他身边的女人换了一个又一个。\n没想到有一天，他会问她想不想嫁给他。\n她以为是自己多年暗恋终于得到回应。\n直到婚后，她听到他对朋友说：“家里让娶，我还能怎么办？”\n她心灰意冷，决定离婚。\n**\n离婚前夜，她重生回到高二被接回北城这天，依旧是两家都住。\n后来，她夜不归宿，他发疯似的找她。\n“你真的谈恋爱了？跟谁？”\n电话彼端的许恩棠红着脸被谈霁礼圈在怀里。\n谈霁礼开口，声音传进电话里，“告诉他，是不是在和我谈恋爱？”\n**\n以前的许恩棠心思都在陆襟身上，和谈霁礼不熟，没想到会与疏离懒淡的他在这个夏夜有染。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "追妻火葬场", "男二上位"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大小姐雇我替她和太子爷网恋", "fullTitle": "大小姐雇我替她和太子爷网恋", "link": "https://fanqienovel.com/page/7624147408376581145", "data": [40.2, 40.79, 40.96], "trend": 0.76, "latest": 41.0, "wordNumber": 384371, "creationStatus": 0, "desc": "已签实体出版！\n［无虐，无雌竞，轻松甜文，双洁1v1］\n【嘴特甜，很缺钱，纯欲钓系女主】\n【嘴很毒，钱贼多，冷傲拽哥男主】\n-\nS大校花姜晚接了一项特殊委托。\n豪门大小姐雇她追求海城太子爷进行网恋。\n照片、身份都是大小姐本人，手机对面换成她。\n然而太子爷又冷又拽，姜晚每天绞尽脑汁的撩。\n-\n姜晚费劲吧啦刚追到人，大小姐发来指令：\n“晚晚，目标达成，计划终止。”\n“收到！”\n姜晚连夜爬起来和太子爷提分手。\n商时序咬牙：【你别后悔】\n姜晚：【嗯嗯，绝不后悔】\n\n两天后——\n大小姐：“晚晚，情况有变，你还没跟他分手吧？”\n姜晚咬紧后槽牙：“你、说、呢？”\n大小姐：“快、快复合！”\n-\n复合后，海外留学的太子爷偷偷跑回国要给姜晚惊喜。\n他的惊喜，姜晚的惊吓！\n为了不掉马，情急之下，哄骗他酒店蒙眼。\n姜晚聊完天想溜，被他扣住腰亲懵！\n说好的网恋怎么还有失身的风险？\n-\n【掉马小剧场】\n某日，姜晚帮父母摆完摊后回到小区门口，太子爷突然打来电话。\n“在哪？”\n“不是告诉你我和朋友在拉斯维加斯玩呢。”\n“玩得开心吗？”\n“开心啊～”\n“回头。”\n姜晚：！！！", "tags": ["青春甜宠", "现代言情", "总裁", "甜宠", "双洁", "1v1"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "捞女高嫁手册", "fullTitle": "捞女高嫁手册", "link": "https://fanqienovel.com/page/7582998260931890201", "data": [13.28, 13.5, 13.77], "trend": 0.5, "latest": 13.8, "wordNumber": 1096300, "creationStatus": 1, "desc": "【心机万人迷女主✖️各色权贵男人。】\n万藜此生最痛恨贫穷，最爱富有的男人。\n都说：“婚姻是女人的第二次投胎。”\n于是她将美貌与野心炼就筹码，周旋于各色男人之间。\n精于算计，步步为营，终于如愿嫁入豪门。\n当奢侈成为日常，锦衣玉食应有尽有。\n某个午夜梦回，她却依旧在黑暗中惊醒。\n纤手抚过真丝被面，她恍然：\n真正的重生，并非嫁入谁的天地，\n而是亲手劈开命运的浪潮，让自己成为那片更辽阔的海。\n1vn，男主有洁有不洁。\n成长型女主，认知不断提升。", "tags": ["青春甜宠", "现代言情", "校园"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [18.82, 18.79, 18.93], "trend": 0.11, "latest": 18.9, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [54.05, 54.09, 54.1], "trend": 0.05, "latest": 54.1, "wordNumber": 868537, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被缠上了，穿成疯批的作精前女友", "fullTitle": "被缠上了，穿成疯批的作精前女友", "link": "https://fanqienovel.com/page/7596956333937544254", "data": [13.21, 13.29, 13.22], "trend": 0.01, "latest": 13.2, "wordNumber": 367077, "creationStatus": 0, "desc": "（已签出版 漫剧已上线）【穿书+女主社恐+男主疯批+双洁】\n【超级超级甜！！】\n别人眼中的乖乖女闻初，实则是个深度社恐——直到她穿进了一本大学校园文，成了男主的作精前女友。按照剧情，这个角色将以胡搅蛮缠和撒泼打滚成功“作”掉爱情，成为男女主甜美恋情的完美对照组。\n闻初原想照本宣科走完剧情成功分手，却想起剧情里男主是个阴暗疯批，不仅会设计报复前女友，后期还会对女主上演强制爱。\n社恐闻初陷入了两难：按照剧情作死会被男主报复，但是主动分手可能触发男主记仇然后报复。\n于是她在网上查询如何成功和男朋友分手？\n得到了一个意想不到的答案：热暴力！在保持作精的同时，进行热暴力，撒娇粘人，是个男人都不会受的了这么控制欲强的女朋友！\n慢慢的她发现男主对她也是蛮好的，说不定等后面女主出现后两人可以实现和平分手。\n就是这个男主怎么看她的眼神越来越深沉，变得比自己还粘人啊？ \n闻初：O.O 等等，这剧本不对啊！\n终于女主出现了，闻初终于小心翼翼的试探着提出分手，但为什么每次一提分手就被压着亲？\n##\n席黎野某一天看到了自己女朋友的备忘录。\n他笑出了声，原来是要离开自己吗？\n“分手？”他垂眸轻声重复，语气温柔。\n“闻初，想都别想。”", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "作精", "双洁"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "老太片场跑龙套，养活古代一家人", "fullTitle": "老太片场跑龙套，养活古代一家人", "link": "https://fanqienovel.com/page/7614407271283444798", "data": [19.81, 21.1, 25.17], "trend": 5.36, "latest": 25.2, "wordNumber": 607824, "creationStatus": 0, "desc": "王莲花上山挖野菜，一脚踩空——\n再睁眼，到了个妖怪窝。\n铁壳子满地跑，比马车还快。\n人穿得露胳膊露腿，不知羞！\n房子高得脖子仰断都看不见顶。\n王莲花攥紧背篓，心里只有一个念头：这咋回去？家里还等着野菜下锅呢！\n正懵着，一张纸片子塞到她手里：“阿姨，剧组招群演，盒饭管饱，一天八十！”\n王莲花不识字，但“盒饭管饱”四个字，她听懂了。\n一把拽住那人：“大兄弟，这活我能干！”\n第一天进组，演尸体。\n导演喊“卡”之后别人都爬起来了，她还直挺挺躺地上，眼睛闭得紧紧的。\n场务吓一跳：“阿姨？阿姨你醒醒！”\n王莲花睁开眼，一脸忐忑：“这就完了？我看旁边那人不是躺了老半天吗？我躺够时辰没？能结账不？”\n场务：“……阿姨，您多躺的这一会儿不算钱。”\n王莲花心疼坏了：亏了，躺多了。\n后来剧组发现，这个农村大姐简直是宝贝。\n演逃荒的难民，她往地上一坐，眼神里的绝望把场务都看哭了——这老太太是真有故事啊！\n演村妇骂街，她袖子一撸，一口气骂三分钟不带重样，把全场演员都镇住了。\n工资日结，王莲花拿着那纸钞，知道这钱能买多少米、多少肉、多少布，手抖得跟筛糠似的。\n她当场就哭了，要是早点来这个地方，她男人是不是就不用死了？", "tags": ["现言脑洞", "现代言情", "穿越", "娱乐圈", "空间", "古穿今"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书兽世：恶雌她终于吃上好的了", "fullTitle": "穿书兽世：恶雌她终于吃上好的了", "link": "https://fanqienovel.com/page/7627509785704811545", "data": [62.22, 64.62, 67.1], "trend": 4.87, "latest": 67.1, "wordNumber": 792700, "creationStatus": 1, "desc": "【兽世】+【雄竞修罗场】+【基建】\n沈湄穿进一本星际兽世大女主文，成了女主宁雪的对照组炮灰女配。\n书里的她，家世显赫，父兄宠爱，天赋惊人，除了长相普通点，处处都是优点。\n主脑刚给婚配了兽夫，结婚证还没焐热，海时代来临。\n曾经被争相追捧的毛茸茸陆地兽人一夜间沦为废兽，而曾被嫌恶满身腥气的水生兽人，成了炙手可热的生存保障。\n沈湄失去精神力，陆地兽夫无法入海捕猎，养活不了她。\n原主接受不了这个刺激，发疯了。\n租赁兽夫给别的雌性、逼迫兽夫当众跳求偶舞、将兽夫推进海里捕鱼……\n折辱、打骂、践踏，日复一日，极尽癫狂。\n最终众叛亲离，穷困潦倒，被海盗军团折磨分食。\n沈湄大骂原主变态，可一睁眼，穿到贩卖兽夫现场了！\n【“吃得超好系统”为您服务。请问，是否绑定？】\n吃得超好？吃什么？什么超好？\n后来，沈湄看着怼到眼前的胸肌、腹肌、大腿肌，陷入沉思。", "tags": ["现言脑洞", "现代言情", "幻想言情", "星际", "穿书", "基建"], "borderColor": "#e91e8c", "backgroundColor": rend": 0.76, "latest": 14.1, "wordNumber": 562250, "creationStatus": 1, "desc": "[快穿+爽文+利己+无固定cp]\n注:主角最在乎的是自己，谁都没有自己重要。\n一大堆优点，最好最好的优点就是记仇，别人吃亏，也不能让自己吃亏。\n元卿无意中绑定了一个残缺系统，残缺系统带着元卿进入其它世界。\n在陌生的世界活过一生又一生，肆意又自在。\n但在这其间，却总会遇到一些这样又那样的意外。\n什么？这个人竟然是重生的？还有穿越的……\n没关系，不管什么，谁都别想阻碍他的路。\n世界一:痴情男二？与我无关\n世界二:她后悔没有嫁给我\n世界三:中奖后，我甩了白月光\n世界四:落水被救后，我认了个义妹\n世界五:我帮妈妈逃出生天\n世界六:女友想要我的金手指\n世界七:小说完结后，男主出轨了\n世界八:什么！除了我，竟还有三个穿越者！\n世界九:喜欢换孩子是吧！那我也换！\n世界十:留守儿童回家称王称霸\n世界十一:流放？那我可不去", "tags": ["快穿", "校园", "系统", "幻想言情", "穿越", "1v1"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：反派太宠太撩人", "fullTitle": "快穿：反派太宠太撩人", "link": "https://fanqienovel.com/page/7029596409594645517", "data": [15.66, 15.94, 16.18], "trend": 0.52, "latest": 16.2, "wordNumber": 2675659, "creationStatus": 0, "desc": "改编短剧《快穿盛宠》在番茄可以看啦，漫画已上线，出版筹备中，敬请支持【甜宠+病娇1v1】 \n为了活命，盛暖要穿越不同世界，扮演作死炮灰，拯救最黑暗的反派，他们冷血偏执心狠手辣，谈笑间伏尸百万，挥手间举世覆灭，握着炮灰剧本的盛暖很慌……\n后来：偏执少年神情阴鸷：“暖暖，除了我身边，你哪里都不许去。。”\n冷血帝王面颊染血：“暖暖，为了你，覆灭江山又如何。”\n入魔仙尊白发如雪：“暖暖，你便是我的心魔。”\n末世尸王眼神执拗：“暖暖，你来决定，杀死我，亦或拯救我。”\n盛暖更慌了……", "tags": ["快穿", "现代言情", "系统", "总裁", "宠妻", "幻想言情", "穿越", "甜宠", "反派", "病娇", "穿书", "1v1"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿之我替人渣走正途", "fullTitle": "快穿之我替人渣走正途", "link": "https://fanqienovel.com/page/7601823696658910233", "data": [19.6, 19.75, 19.99], "trend": 0.38, "latest": 20.0, "wordNumber": 751630, "creationStatus": 1, "desc": "作为现代社会的长生者，陆与安绑定快穿系统，替代人渣，并拯救小世界中被人渣毁掉一生的人。\n【女频文+男主视角快穿+部分世界有CP+替代渣男洗白】\n（注：不是真人渣在洗白，是替代人渣保护无辜的人，人渣被受刑清算。）\n世界一：古代白眼狼书生（完）\n农家老来子卖侄子侄女？\n六元及第，为家人撑起一片天。\n世界二：吸姐鬼弟弟（完）\n想尽办法卖姐姐赚钱？\n用真本事成为顶级大厨。\n世界三：网骗肥宅（完）\n世界四：穿成虐文女主她爸（完）\n世界五：单亲妈妈的坏种儿子（完）\n世界六：古代忘恩负义的昏君（完）\n世界七：八零年代神棍（完）\n世界八：现代社会的老好人（完）\n世界九：伥鬼朋友（完）\n世界十：真假千金的哥哥（完）\n世界十一：七十年代上啃老下啃小（完）\n世界十二：天才儿子网瘾爹（完）\n世界十三：侯府种地假世子\n世界十四：现代天灾末世\n......\n（故事先后顺序不定)", "tags": ["快穿", "系统", "幻想言情", "穿越", "科举", "魂穿"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿之魔尊他邪的发正", "fullTitle": "快穿之魔尊他邪的发正", "link": "https://fanqienovel.com/page/7607770156546149401", "data": [20.09, 20.2, 20.35], "trend": 0.25, "latest": 20.3, "wordNumber": 1141124, "creationStatus": 1, "desc": "【快穿】【无固定CP】\n时年曾是令三界震颤、亦正亦邪的魔尊，他不拜天、不跪地、不顺所谓天道伦常，只守一颗本心，不杀无辜，但谁犯他，他灭谁。\n为了诛杀他，正道举七大宗、三十六门之力，以数千高阶修士的精血为引，魂飞魄散为代价，才布下万古诛魔阵，将他镇压在镇魔渊底。\n他们杀不死他，只能将他坚韧如铁的神魂一寸寸磨灭。\n这一镇压，便是万年之久。\n昔日抬手便可撕裂苍穹、覆手便能翻倒江海的魔尊，只剩一缕残魂。\n就在时年以为自己要消散之际，一个自称系统的东西，将他带离了镇魔渊。\n从此时年开始穿梭于三千世界。\n修补神魂，重铸魔身。\n“正道……你们欠我的，我会一一讨还。", "tags": ["快穿", "乡村", "系统", "幻想言情", "穿越", "空间"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：恶毒女配她被男主给缠上了", "fullTitle": "快穿：恶毒女配她被男主给缠上了", "link": "https://fanqienovel.com/page/7642637762344012862", "data": [14.99, 15.12, 15.24], "trend": 0.24, "latest": 15.2, "wordNumber": 566068, "creationStatus": 1, "desc": "【柔弱美人+一见钟情+女主最美+上位+双洁+1v1+绿茶白莲花】\n夙被困深渊数万年，弑神坠钉在神躯上的痛，不抵她心中仇恨万分之一。\n她的家园，她的子民，全部在她面前消散。\n直到她意外绑定一个系统，混着时空裂隙前往万千小世界掠夺气运供养神魂。\n渐渐的夙感觉到了不对劲，为什么她一露面，男主就吻上来了！\n1.假千金她上位成功了✔️\n娇气包假千金青梅vs占有欲极强的竹马\n少时戏青梅，暮年同归尘，一生一双人，生死不离分。\n2.室友的高岭之花归我了✔️\n假温柔真善妒校花vs高岭之花男神\n女主：明明是我先认识你的！\n桑雾：（柔弱）爱情是不分先来后到的\n男主：（老婆说爱我！）（窃喜）\n3.白莲花庶女上位成功了✔️\n娇弱白莲花庶妹vs清冷出尘的王爷\n女主：重生了我要让贱人死。\n梁香宜：我没想破坏你和姐姐（哭泣）\n男主：是我执意娶她为妻！是我爱上了她！\n4.男二他不想上位了✔️\n活泼甜豆女明星vs假温润真狠辣总裁\n5.弱质纤纤表小姐她会训犬✔️\n病弱表妹vs桀骜张扬表哥\n6.白月光回国后总裁他又吻上来了（这个稍稍有点虐，不喜欢的可以跳过！）\n心机深沉的白月光vs不想追妻火葬场的总裁\n……（未完）", "tags": ["快穿", "天作之合", "独宠", "一见钟情", "1v1", "忠犬"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：甜文里的对照组", "fullTitle": "快穿：甜文里的对照组", "link": "https://fanqienovel.com/page/7643755764867157016", "data": [14.34, 14.51, 14.57], "trend": 0.22, "latest": 14.6, "wordNumber": 332795, "creationStatus": 1, "desc": "【女主甜妹➕男主身心全洁➕无脑甜宠，非女强文非大女主文】\n戚央死后，绑定了炮灰系统，成了每个甜文小说里的对照组。\n世界一：在古言小说中，女主是烧火丫鬟，她是洒扫丫鬟，最后女主成了侯府夫人，而她则因为勾引男主被发卖。\n世界二：年代文里，女主是从山里挣扎出来的大学生，她是重男轻女家庭里的小透明，最后女主成了国内知名教授，和男主喜结连理，而她则嫁给村里的跛脚汉子悲惨一生。\n……", "tags": ["快穿", "系统", "幻想言情", "甜宠", "HE", "1v1"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：苏茶的年代生活", "fullTitle": "快穿：苏茶的年代生活", "link": "https://fanqienovel.com/page/7644045778834443288", "data": [21.51, 21.5, 21.69], "trend": 0.17, "latest": 21.7, "wordNumber": 449036, "creationStatus": 1, "desc": "【年代快穿】【无固定cp】\n苏茶发现自己穿进了一本看过的年代小说里，重过一世，她只想快快乐乐的享福，只以为自己是因救人被奖励再活一世的她并不知道，这是一场决定她命运的快穿实习……\n避雷：只写年代位面，无固定cp不是没cp，设定都有cp，大家自主避雷。\n洁党注意，有的世界设定男女主有过婚姻之类的。\n故事以女主为主，有的故事男主着墨不多。女主快穿新人，不是什么大佬，一点点成长，积累，变强。\n世界一：女主那极品继妹\n世界二：男主那救命恩人的遗孀\n世界三：以怨报德的极品村姑\n……", "tags": ["快穿", "幻想言情", "穿越", "穿书", "魂穿", "家长里短"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：女配稳拿拜金娇气包剧本", "fullTitle": "快穿：女配稳拿拜金娇气包剧本", "link": "https://fanqienovel.com/page/7623810999656664088", "data": [14.73, 14.87, 14.87], "trend": 0.14, "latest": 14.9, "wordNumber": 750408, "creationStatus": 1, "desc": "【评分刚出，后面会涨】\n【半沉浸+不崩人设+精致利己+低道德心机女+绝美万人迷+男全处】\n　　楚瑶被抽去一魂一魄，为家人朋友和渣男挖了一辈子野菜，临死前重病缠身、身无分文。\n　　直到死后补全灵魂，她才发现自己一手好牌打得稀烂，白瞎了最顶的建模和娴熟的演技。\n　　于是她和恶魔系统做了个交易，扮演好自私娇气的恶毒女配，在每个世界掠夺资源、纵情享乐，帮系统将正统世界的剧情崩个天翻地覆。\n　　系统帮她稳固好灵魂，回到现实世界拥有美满的人生，让那群吸她血的人恶有恶报。\n　　楚瑶秉承着专业精神，兢兢业业上了岗。\n　　①【霸总白月光的卖酒女替身（1v1完结）】\n　　②【用室友照片网恋财阀继承人的妖艳女配（1v1完结）】\n　　③【嚣张贵女和马奴（1v4完结）】\n　　④【破产太子爷的心机前女友（1v1完结）】\n　　⑤【装失明勾引清冷首辅的商户女（1v1完结）】\n　　⑥【末世文里嚣张跋扈的男主继妹（1v1完结）】\n　　⑦【退役雇佣兵水管工的俏房东（1v3完结）】\n　　⑧【年代文里抛弃糙汉男友回城的娇娇女（1v1连载中）】\n　　⑨【古早网游文男主的拜金前情缘】\n　　⑩【向哨文里排挤女主的恶毒向导】", "tags": ["快穿", "系统", "总裁", "替身", "HE", "1v1"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "闪婚刑警老公，陆队人前请装不熟", "fullTitle": "闪婚刑警老公，陆队人前请装不熟", "link": "https://fanqienovel.com/page/7638577943551167550", "data": [12.92, 15.44, 16.35], "trend": 3.43, "latest": 16.3, "wordNumber": 430786, "creationStatus": 0, "desc": "「刑警硬汉队长x娇软画像师」\n「先婚后爱+细水长流+破案日常+甜宠+双洁+1v1」\n相亲那天，温清梨遇到了自己学生时代的暗恋对象，陆峥。\n仅用两句话，两人就敲定了闪婚事宜。\n“不对外公开。”\n“相敬如宾，互不干涉。”\n他是冷硬糙帅的刑警队长，她是警局特聘的画像师。\n白天，他们联手侦破郊外抛尸案、明星被杀案、雨夜失踪案……\n夜晚，她守着婚前约定：床上熟透，床下不熟。\n她藏起自己暗恋的小心思，努力和他保持着相敬如宾的状态。\n直到发生了一件事，她主动留下一封离婚协议，提着行李箱连夜跑路。\n-\n所有人都以为陆峥天生冷酷，不会爱任何人。\n直到温清梨提出离婚跑路后，他差点疯掉。\n没有她画的画像，凶手样貌不像，没有她深夜的晚安吻，长夜漫漫。\n他费尽千辛万苦找到她，掐着她细腰，将她逼至墙角：\n“为什么提离婚？”\n“回来，别跑，以后我的命都给你。”\n温清梨：“！！！”\n说好的不需要爱情呢？", "tags": ["职场婚恋", "现代言情", "甜宠", "先婚后爱", "暗恋", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新娘换人后，周队长夜里亲得好凶", "fullTitle": "新娘换人后，周队长夜里亲得好凶", "link": "https://fanqienovel.com/page/7629168035038759960", "data": [10.56, 11.32, 12.48], "trend": 1.93, "latest": 12.5, "wordNumber": 514905, "creationStatus": 0, "desc": "开篇新婚夜，进度超快，年上荷尔蒙爆棚糙汉刑警队长和香香软软娇妻\n男主老房子着火，占有欲强，爱亲亲抱抱，甜欲宠~\n女主馋男主，主动超会撩\n-\n陆甯出差回来发现她竟是假千金，不但父母换了，就连结婚对象也被换了。\n真千金夏雨薇已经跟陆家的联姻对象领了结婚证，断了她的念想。\n她本想让亲生父母退掉婚约，但见到夏家的婚配对象后，立马改了主意。\n那男人是警察，身高188，肩宽腰窄，一身腱子肉荷尔蒙爆棚，正是陆甯喜欢的类型。\n-\n领证前，男人对陆甯说，他的要求只有一个，必须过夫妻生活。\n陆甯暗自窃喜，爽快地答：过，必须过，不然结婚做什么！\n然而，连着几天下不来床的陆甯后悔了。\n她提出抗议：这夫妻生活还是不过了吧……\n男人却道：抗议无效。\n-\n夏雨薇眼里的周烈就是个暴戾冷硬的糙汉子，家里还有瘫痪的父亲要照顾。\n她庆幸自己在结婚前被认回陆家，可以嫁入豪门当少奶奶。\n至于周家的火坑就让陆甯去跳好了，她就等着看笑话。\n-\n可后来夏雨薇却听说那个暴戾无情的糙汉队长是个老婆奴，把陆甯捧在心尖宠。\n再后来首富江家举办认亲宴，周父认祖归宗，陆甯摇身变成豪门儿媳。\n陆家却破产了，夏雨薇传来离婚的消息……\n-\n先婚后爱+糙汉宠妻+真假千金对照组+家长里短群像日常流", "tags": ["职场婚恋", "现代言情", "甜宠", "先婚后爱", "群像", "真假千金"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夺她，为妻", "fullTitle": "夺她，为妻", "link": "https://fanqienovel.com/page/7624112881386130457", "data": [10.93, 11.17, 11.93], "trend": 0.99, "latest": 11.9, "wordNumber": 638714, "creationStatus": 1, "desc": "百分百姐狗文学，拒绝套路文！【细水长流+双处双强+维权&破案+感情线&事业成长线+年龄差6岁＋谭小狗后期追妻火葬场（成功版）】\n【年上聪慧清冷女律师x年下阴湿隐忍小狼狗】\n—\n两年前，十八岁的酷哥谭问对自己亲哥刚追到手的女朋友一见钟情。\n收起爪子，从桀骜难驯的小豹子变成乖巧听话的小狗子，只为了让姐姐多夸夸自己，看到自己。\n\n两年后，亲哥和姐姐传来要领证的消息，谁知他哥出轨的事情东窗事发。\n谭问摩拳擦掌，心安理得地准备上位。\n“姐姐选我 分刚出，后面会涨的\n又名《皇后的进击之路》\n\n耿直咸鱼庶女VS腹黑大爹四爷\n\n从新时代“牛马”变成古代“娇小姐”，宝珠只感慨世事无常。\n\n虽是庶女但是好在自己的姨娘是嫡母的陪嫁，从小一起长大情分非比寻常。\n\n后来还是救主身亡的，这份恩情自然回报到了自己身上，从小被嫡母娇养长大。\n\n本来这日子也挺好的，坏就坏在自己长得过于标致，选秀是每个穿越女的标配，就让战火来的更猛烈些吧！\n\n更让宝珠没想到的是，四阿哥原来也是每个穿越女的标配！", "tags": ["宫斗宅斗", "古代言情", "宠妻", "清穿", "HE", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "和阉贼在一起后，真公主重生了", "fullTitle": "和阉贼在一起后，真公主重生了", "link": "https://fanqienovel.com/page/7623310820218244158", "data": [23.33, 24.73, 26.33], "trend": 3.0, "latest": 26.3, "wordNumber": 571798, "creationStatus": 0, "desc": "\n容夭六岁时中毒，毒坏了脑子，便成了蠢人，都说她只有六岁小儿的心智。\n\n为活命，容夭蒙混进了宫，成为了盛平公主的贴身宫女，日日给盛平公主洗脚捶背，干些轻快活计。\n\n她感激不嫌她蠢的盛平公主，故而在盛平公主让她与大宦官祁慎做对食时，她便偷偷爬上了大宦官的床榻。\n\n可事后不久，盛平公主便将她乱棍打死了。\n\n死后她才知，她能活到十七岁，全因盛平公主想要戏耍她，玩够了，便将她杀了。\n\n盛平公主说她才是真公主，说陈贵妃顶替了她的娘亲，说她的亲人都死于她和陈贵妃之手……\n\n*\n再睁眼，容夭重生回到六岁，此时她头脑清醒，还没被毒傻。\n\n而害她痴傻的带毒吃食正摆在她的眼前。\n容夭将吃食一分两份，一份送给假祖母，一份送给假父亲……\n\n然后她收拾好家当带娘回娘家，她还小，认爹要趁早！认完爹后还要帮祁慎留根……\n\n*\n谁都没料到，那个被皇上从民间寻回的小公主，有一日会令天下人臣服，站在最高位上，带领大周走向前所未有的盛世。", "tags": ["宫斗宅斗", "古代言情", "重生", "公主", "前世今生", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "掌心饵，驯娇记", "fullTitle": "掌心饵，驯娇记", "link": "https://fanqienovel.com/page/7590362586965609496", "data": [15.49, 15.77, 15.99], "trend": 0.5, "latest": 16.0, "wordNumber": 1025720, "creationStatus": 0, "desc": "【阴郁真太监×馋嘴小宫女｜训诫依存｜食物掌控】\n进宝是御前得脸的太监，也是冷宫那堵矮墙后，唯一会给春儿留点心的人。\n只是这点心不好拿，跪着接。\n春儿以为这是她在这吃人宫里，能抓住的唯一活路。\n直到她看见，这个总是站得笔直的人，头顶压着那样沉重的天。\n她就只需要窝在他的影子下，赏的罚的通通咽下。\n可她抬头望着，总觉得想替他撑一撑。\n——苔花如米小，也学牡丹开。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "状元悔断肠，玄学大佬不好惹", "fullTitle": "状元悔断肠，玄学大佬不好惹", "link": "https://fanqienovel.com/page/7631195129595841561", "data": [17.04, 17.27, 17.49], "trend": 0.45, "latest": 17.5, "wordNumber": 474049, "creationStatus": 1, "desc": "［玄学+宅斗+抓鬼+爽文+无cp+算命+故事单元］\n修炼三百年的玄学大佬桑夏，在飞升之际陨落了，重生到了一百年以后。\n成为了被新科状元抛弃的糟糠之妻。\n这还不够惨，她还是被自己的亲祖母抛弃的太傅府真千金。\n桑夏都怀疑，天道是嫉妒她的天赋，才让她重生到这个可怜虫身上。\n人人都想看她笑话，偏生她是最争气的那个。\n风水测算，捉鬼画符……\n短短时间内，她便成为了京中人人敬畏的玄学大佬。\n百姓敬畏的监正大人喊她祖师奶奶。\n京中人人惧怕的纨绔世子，求着拜她为师。\n连权侵朝野的辅国公毕恭毕敬的喊她主子。\n这时，那位状元爷前夫，以及抛弃她的祖母，才后悔莫及。", "tags": ["宫斗宅斗", "古代言情", "重生", "无CP", "大佬", "风水秘术"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后扑到权臣怀里哭，他红温了", "fullTitle": "重生后扑到权臣怀里哭，他红温了", "link": "https://fanqienovel.com/page/7545304657187310617", "data": [16.77, 17.08, 17.14], "trend": 0.37, "latest": 17.1, "wordNumber": 500020, "creationStatus": 0, "desc": "【娇软甜妹VS沉稳克制权臣】\n（双洁，青梅竹马，多年暗恋成真）\n沈明姝被江浔宠着长大，却因为他的严苛冰冷，一直怕他如命。\n被人下药后，她被青梅竹马的小将军带走，被人撞见，只得嫁给他。\n谁知小将军心中有人，新婚当日便纳妾进门。\n小将军宠爱小妾入骨，而对她冷言冷语。\n他们一同去京郊烧香拜佛，谁知马匪突袭，小将军慌忙带着小妾奔逃，把她留给了马匪……\n为了保全自己，沈明姝撞刀而死。\n死后成为幽魂，亲眼看到江浔为她报仇，为她而死……\n——\n一睁眼，重回沈明姝被下药那一晚。\n她忍着滚烫和难受，哭着去找江浔，扑到他怀中。\n“阿兄……”\n她声音颤抖，带着哭腔。\n沈明姝哭得厉害，满心都是自己受过的委屈和对江浔的愧疚心疼。\n完全没想到，在她看不见的地方。\n这个素来沉稳克制的权臣耳尖悄悄泛起薄红……\n——\n再后来，沈明姝被江浔按到腿上。\n腰肢被他铁臂箍住，右手亦被他强势地撬开，十指穿入，扣得死紧。\n昏暗烛影里，她眼尾绯红，男人似笑非笑地看着她，嗓音低哑，“乖阿姝，哭什么？”\n沈明姝身子止不住地轻颤。\n事情不对！\n但好像已经来不及了……\n", "tags": ["宫斗宅斗", "古代言情", "重生", "青梅竹马", "双洁", "古色古香", "暗恋"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰皇后，和闺蜜扶暗卫登基", "fullTitle": "穿成炮灰皇后，和闺蜜扶暗卫登基", "link": "https://fanqienovel.com/page/7622264339327618073", "data": [24.07, 23.98, 24.3], "trend": 0.23, "latest": 24.3, "wordNumber": 384494, "creationStatus": 0, "desc": "（正文完结）【双穿书|双cp|双洁|闺蜜联手|无雌竞】\n【阴暗忠犬暗卫×钓系皇后|毒舌哭包暗卫×暴躁贵妃】\n一睁眼，温心涟和闺蜜叶婉盈双双穿成了宫斗文里的炮灰女配，一个是跋扈贵妃，一个是恶毒皇后。更要命的是，正在跟她们滚床单的“皇帝”还是个冒牌货。\n原著里皇帝为女主守身如玉，让暗卫假扮自己临幸后妃，再挑唆他们自相残杀，而他躲在幕后，笑看后宫血流成河。\n看着眼前这个满脸写着“我只是在执行任务”的暗卫小哥，温心涟拍了拍他的脸。\n“兄弟，要不要换个老板，薪资双倍，夫人也包分配。”\n“娘娘请自重。”\n后来，他将温心涟抵在铜镜上:“夫人，眼睛睁开啊……”\n温心涟:“我没说分配的是我呀！”\n而隔壁宫的叶婉盈，正威胁着被她捆起来的暗卫:“兄弟，你是想合作还是想被我揍哭呀？”\n“我死都不屈服！”\n后来，他跪在叶婉盈的脚边，眼眶含泪，亲手把绸带递过去:“你想对我做什么都可以。”\n叶婉盈:“这谁能忍得住。”\n表面上皇后和贵妃水火不容，暗地里策反暗卫，拉拢朝臣，一步一步让暗卫彻底代替龙椅上的天子。\n当暴君回宫，他站在宫门前大喊“我是皇帝”。\n温心涟和叶婉盈坐在龙椅上微微一笑：“拖下去，这个冒充陛下的疯子", "tags": ["宫斗宅斗", "古代言情", "穿书", "忠犬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成恶毒女配，她把将军撩红了脸", "fullTitle": "穿成恶毒女配，她把将军撩红了脸", "link": "https://fanqienovel.com/page/7221688698125945894", "data": [15.02, 15.11, 15.24], "trend": 0.22, "latest": 15.2, "wordNumber": 565940, "creationStatus": 0, "desc": "【穿书+前期主事业＋甜宠+1V1+双洁】\n【虚伪心狠·权臣小姐×野蛮能打·铁面将军】\n商界霸主一朝穿书，成为当朝奸臣宰相的女儿，仗势欺人恶贯满盈，恶毒女配四个字直接焊在了她身上。\n对穆府二公子穷追猛打爱而不得？\n萧望舒直接转身，顺道撩了撩她身后那位闷声不吭的硬汉将军，心满意足地看着对方那张憋得通红的脸：“挑来拣去，我还是独爱将军这口。”\n嚣张跋扈只会仗势欺人？\n萧望舒勾唇轻笑，抬起手鼓了鼓掌：“准备好，我要开始仗势欺你了！”\n——\n世人皆说，萧家满门奸佞之臣，狼子野心昭然若揭。\n萧望舒不以为意，寡淡的声音狂妄无边：“奸佞？今日让你们瞧瞧，这奸佞，如何生抢硬夺成为正统！”", "tags": ["宫斗宅斗", "古代言情", "穿书", "甜宠", "1v1", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局被卖，我在王府开启逆袭之路", "fullTitle": "开局被卖，我在王府开启逆袭之路", "link": "https://fanqienovel.com/page/7487969155233090584", "data": [15.16, 15.25, 15.38], "trend": 0.22, "latest": 15.4, "wordNumber": 2158096, "creationStatus": 1, "desc": "《腹黑世子vs清纯姑娘+天生神力+轻松+不虐+》阿奴出生在一个贫穷到连饭都吃不饱的家庭，偏偏弟弟妹妹同时生病，家里又穷的叮当响，没办法，只能把自己卖给了广陵王府当奴婢，听说大户人家的主子可难伺候了，一旦被主子们相中抬成姨娘，那早晚得被主母给弄死了，因此她不想当姨娘，便给自己剪了一个极为丑陋的西瓜头，挡住了好看的眉眼，本以为这样不会有人注意到她了，没想到一进王府，就被大魔头世子要了过去，为了不出错，她尽量少说话多干活，可她越不想出错，闹的笑话就越多，也成功的引起了世子的注意力，发现了她天生神力的潜能。\n娄玄毅：想赚钱吗？\n阿奴：想！\n娄玄毅：只要你按我要求做，这些钱都是你的。\n阿奴：世子，您说话可得算数！", "tags": ["宫斗宅斗", "古代言情", "腹黑", "扮猪吃虎", "甜宠", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成早死的炮灰原配，我怒嫁反派", "fullTitle": "穿成早死的炮灰原配，我怒嫁反派", "link": "https://fanqienovel.com/page/7199806910327950392", "data": [18.86, 18.93, 18.97], "trend": 0.1, "latest": 19.0, "wordNumber": 1775762, "creationStatus": 0, "desc": "【影视版权已售】吕颂梨穿书了，穿成《权臣的娇美继室》里男主谢湛的炮灰原配。\n　　\n　　书里，原主会被从流放之地衣锦归来的好友赵郁檀抢了丈夫。他们在她重病时暗通曲款，活活气死了她。\n　　\n　　吕 , "trend": 0.33, "latest": 17.2, "wordNumber": 2683646, "creationStatus": 0, "desc": "【穿越+争霸+乱世+大女主+逃荒+基建+无CP+空间】\n   原书名：穿乱世，疯癫公主她靠抢劫建国了\n        姜瑾醒来时发现自己成了亡国公主，正被送往梁城给蛮族蛟凉做玩物的路上。\n        她想了想，觉的还是别人做她的玩物比较好，于是开局就把押送她的士兵全噶了。\n　　未婚夫和姐姐暗度陈仓并推她出去挡刀，她笑着原谅，下一瞬就把匕首送进两人心口：“没关系，因为，人死债消。”\n\n　　她收了她的第一批兵，战神周睢和3个摸尸组合。\n\n　　她转身杀到梁城狙了蛟凉，抢了他的粮仓金库，烧了他的郡守府，梁城一夜之间天翻地覆！\n\n　　蛮族派骑兵追杀于她，她反手灭了，不忘交代：“记得别杀马，都是自家的。”\n\n　　山匪想抢她的粮，正好给她的兵练手，她带着人杀进山匪老巢：“能干活的都留着，都是劳动力。”\n\n　　这是一个比五胡乱华还要乱的黑暗乱世，蛮族入侵，哀鸿遍野，各方势力互相角逐，人间如地狱。\n　　一路艰险逃亡，她抢粮抢钱，练兵秣马，终于攒了些家底。\n       姜瑾开始攻城略地，把汉人的土地从蛮族手中一寸一寸夺回来。\n　　以己之能，救能臣，遇良将，抚苍生，在乱世中强悍杀出一条血路，开创独属于她的霸主之路!", "tags": ["古风世情", "古言权谋", "古代言情", "公主", "无CP", "空间", "基建"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冲喜丫头要跑路", "fullTitle": "冲喜丫头要跑路", "link": "https://fanqienovel.com/page/7627401356776590361", "data": [6.29, 6.37, 6.52], "trend": 0.22, "latest": 6.5, "wordNumber": 508526, "creationStatus": 0, "desc": "六岁那年，沈卿卿为救重病弟弟，被母亲卖给陆家冲喜，嫁给奄奄一息的病秧子少爷陆承煜。\n她是名义上的少奶奶，实际上的小丫鬟。七年隐忍，她错付真心，学尽本事，却只换来一句\"做我的通房丫头，已是你的造化\"。\n殊不知，她小臂那朵梅花印记，正是国公嫡女的身份凭证。当她决心挣脱过往，当年破庙里那个被她取名\"阿征\"的孤童，已悄然归来，成为她最坚实的依靠。\n而那个曾冷落她的公子，只剩追悔莫及。", "tags": ["古风世情", "古代言情", "嫡女", "古色古香", "古言权谋"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "在二凤身边当伴读的日子", "fullTitle": "在二凤身边当伴读的日子", "link": "https://fanqienovel.com/page/7621820329278573593", "data": [11.95, 12.12, 12.13], "trend": 0.18, "latest": 12.1, "wordNumber": 481611, "creationStatus": 1, "desc": "【无CP/日常向/主角是团宠/日更/会为了剧情而改变一些时间线/历史考据党慎入】\n穿成李世民的伴读，沈恪以为的日常：\n陪李世民读读书，混日子等对方登基。\n实际上：\n“阿恪起床！给你看看我昨天新练的箭术。”\n“阿恪走！我听说后山有神鸟。”\n“阿恪别睡了！来帮我抄字帖。”\n沈恪：……不要虐待一条咸鱼啊。\n后来沈恪好不容易熬到了李世民成为皇帝。\n他以为自己终于可以当个闲散人员了。\n结果：\n“你帮朕去抓只鸟回来。”\n“魏先生骂我怎么办？”\n“不骂朕就行。”\n沈恪：？\n人在两仪殿，我想骂唐太宗，可以吗？", "tags": ["古风世情", "古代言情", "穿越", "团宠", "无CP", "古言权谋"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "bord /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.parsed.x>0?'+':''}${c.parsed.x}%` } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }
        }
      }
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>均腰比</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      const mmr=m.mm_ratio!=null?m.mm_ratio:0;
      const mmc=mmr<1.8?'#22c55e':mmr<=3.0?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${mmc};font-weight:600">${mmr}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const rawBooks = D.bookChartData[cat];
      const isRead = sfx.startsWith('Read');
      // 阅读榜只展示连载中的书；图表、表格、热门标签、累计净增全部同源
      const displayBooks = isRead
        ? rawBooks.filter(b => b.creationStatus === 1)
        : rawBooks;
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = displayBooks.length > 0
        ? displayBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${displayBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = displayBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书${isRead ? '，仅连载中' : ''}，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
