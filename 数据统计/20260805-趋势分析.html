<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 7月30日–8月5日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [6.84, 7.94, 9.03, 10.09, 10.87, 11.56, 11.95], "trend": 5.12, "latest": 12.0, "wordNumber": 191939, "creationStatus": 1, "desc": "（新书）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“……要。”\n\n她是他的血养出来的妖，也是他这辈子唯一的因与缘。\n（女主控放心观看，纯甜无虐）\n（文风轻松跳脱，诙谐幽默，不爱看勿入！！）\n（很甜！！甜的发腻！！不爱看甜的勿入！！）", "tags": ["现言脑洞", "现代言情", "双洁", "精灵", "幻想言情", "双向奔赴", "情有独钟"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越星际兽世：成为虚拟偶像顶流", "fullTitle": "穿越星际兽世：成为虚拟偶像顶流", "link": "https://fanqienovel.com/page/7655195003299318809", "data": [8.53, 8.98, 9.54, 9.54, 10.0, 10.5, 10.82], "trend": 2.28, "latest": 10.8, "wordNumber": 209429, "creationStatus": 1, "desc": "【星际兽世+主事业线无CP+非女强文，妹宝女主（有明月独不照我情节）+雌少雄多+万人迷+雄竞+系统】\n云岁穿越到了雌少雄多的星际兽世。\n\n\n\n云岁穿越前身体已经火化。\n\n系统绑定她后，用最后能量保住了她的灵魂带她穿越，要重新造出身体需要100亿星币能量。\n\n由于系统规则，虽然它的科技水平大于这个世界的水平，却不能做违法乱纪的事情，只能云岁自己想办法赚钱获得身体。\n\n云岁眼前一黑，虽然不知道1星币多少钱，但100亿就让人感觉人生无望了，其实当阿飘挺好的。\n\n系统却告知由于雌性在星际兽世过于稀少，现在很流行虚拟偶像，是大流量，操作好会很赚钱。\n\n云岁为了拥有新身体，注册了成为恋爱向虚拟偶像。\n\n想原来世界，恋爱向抽卡类虚拟偶像都很赚钱，云岁磕绊在系统的掩护下大胆出击，给这个荒芜的精神世界带来一次次的精神盛宴。\n\n每一次的打歌，舞台，综艺，影视，联动，都引爆全网。\n\n后来云岁拥有了最大的后援会。\n\n云岁生日当天全国大屏庆生。\n\n云岁联动全星铁刷屏。\n\n成星际兽世第一顶流。\n\n众多位高权重的大人物不相信这么完美的云岁是虚拟偶像，世人觉得他们疯魔，查探证明她是真的，结果越扒越有！\n最后云岁掉马。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "星际", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [5.18, 5.61, 5.86, 5.86, 5.87, 6.23, 6.66], "trend": 1.48, "latest": 6.7, "wordNumber": 239732, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "人类饲养员：自己的老婆自己养", "fullTitle": "人类饲养员：自己的老婆自己养", "link": "https://fanqienovel.com/page/7657302630409964569", "data": [10.35, 10.77, 11.13, 11.13, 11.74, 12.03, 10.49], "trend": 0.14, "latest": 10.5, "wordNumber": 146200, "creationStatus": 1, "desc": "【新书刚开分，后面会涨】\n好吃懒做怂包女主VS严谨到变态的外星男主\n【人外，强制爱，触手】\n昭晨好被包养了，不对，被饲养了。\n也不对，准确来说，是被一个不明生物饲养了。\n这个有着人类外表却时不时能够变换形态的“人”强行带走她，成为了她的饲养员。\n为了照顾好她，严格地按照人类饲养手册执行。\nViner：必须早睡早起。\n长期日夜颠倒的昭晨好：“……”\nViner：一日三餐必须吃。\n饮食毫无规律的昭晨好:“……”\nViner：要适当的运动。\n能躺绝不坐着的昭晨好:“喂！这算哪门子运动！”\nViner一本正经：“适当的亲密关系运动也是运动。”", "tags": ["现言脑洞", "现代言情", "幻想言情"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "洪荒：罗睺三岁闺女被收入截教了", "fullTitle": "洪荒：罗睺三岁闺女被收入截教了", "link": "https://fanqienovel.com/page/7660710214282251326", "data": [3.54, 3.9, 4.21, 4.57, 4.85, 5.07, 5.11], "trend": 1.57, "latest": 5.1, "wordNumber": 151118, "creationStatus": 1, "desc": "【洪荒+三岁半+扮猪吃虎+反向反派+团宠养成+迪化量劫+爆笑截教】\n魔界太小，装不下三岁半魔宝魔小乖的“灭世大志”。\n罗睺看着被闺女拆完的魔宫，连夜将她丢进了洪荒。\n【宿主，你的大反派系统回来了，发布灭世任务：污染洪荒水源！】\n然而，系统与魔小乖双双记忆缺失功德系统变成反派灭世系统。\n魔小乖迈着小短腿，将万魔毒煞倒进黄河，瞬间净化了洪荒积攒亿万年的地煞浊气！\n天降无量功德，金光照亮三十三重天！\n路过的通天教主看着浑身功德金光，奶凶奶凶喊着我要毁灭世界的魔小乖，整个人都懵了。\n“这孩子杀气腾腾却功德无量，简直是为我量身定做的亲传弟子！”\n于是，截教多了一个立志灭世的混世魔王。\n多宝：“小师妹，今天我们去毁灭哪个大教？”\n三宵：“谁敢拦着小师妹灭世，先过我们九曲黄河阵！”\n魔小乖哭红了眼：“我真的是坏人，天道再发小红花了，窝就代表大道灭了泥！”", "tags": ["玄幻言情", "系统", "扮猪吃虎", "团宠", "反派", "搞笑轻松"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "成为美强惨龙崽的早逝娘亲", "fullTitle": "成为美强惨龙崽的早逝娘亲", "link": "https://fanqienovel.com/page/7645232910252919870", "data": [4.8, 5.49, 5.94, 5.94, 6.54, 6.14, 6.31], "trend": 1.51, "latest": 6.3, "wordNumber": 149745, "creationStatus": 1, "desc": "【温柔老实妹宝×冷漠偏执龙龙】\n【双洁+1V1+人外+男强女弱+体型差+一见钟情+温馨治愈】\n（简介是儿子殷珩视角）\n殷珩重活一世，回到一千年前，只有一个任务：阻止爹娘相爱。\n他娘是世界上最好的人，他爹是条脑子有病的龙。\n在上一世，娘亲嫁给他爹没几年就去世了，他不想让娘亲重蹈覆辙，即便自己也会消失。\n好消息是：他重生得够早，两人根本不认识。\n坏消息是：不管他怎么阻止，那龙还是来了，而且对娘亲一见钟情。\n不仅如此，追人的方式还笨得要命：\n今天送灵石，明天往她枕头底下塞银票，后天面无表情地站在她家门口，开口就是：“我没家了，能收留我吗？”。\n云绵一脸茫然：“这位公子，我并不知道您是怎么了。”\n殷珩坐在屋顶上看着这一切，心情愉悦，甚至还想鼓掌。\n追姑娘追成这样，也是种本事。\n殷珩觉得这开局稳了，就他爹这个追法，不把娘吓跑才怪。\n可云绵偏偏觉得殷寂“挺有意思的”。\n某天，她拉着殷珩问：“阿珩，你了解隔壁那位殷公子吗？他这个人虽然奇怪，但好像…还挺不错的。”\n殷珩两眼一黑，苦口婆心地劝：“…不怎么样，他长得丑，心也黑，不是良配！”\n云绵羞赧：“你胡说，他长得不丑。”\n殷珩站在原地，仰头望天。\n他明明是回来拆散他们的。\n怎么变成助攻了？", "tags": ["玄幻言情", "独宠", "幻想言情", "宠妻", "团宠", "双洁", "HE"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法：被迫组队后高冷队长沦陷了", "fullTitle": "魔法：被迫组队后高冷队长沦陷了", "link": "https://fanqienovel.com/page/7649235070481353753", "data": [6.89, 7.67, 7.95, 7.95, 8.31, 8.33, 8.37], "trend": 1.48, "latest": 8.4, "wordNumber": 250556, "creationStatus": 1, "desc": "【高智商傲娇巫族公主VS高冷禁欲灵族公爵】\n魔法+言情+团队救世\n朗瓦西星球有三类人：会魔法的灵者、作战强的曜士、通巫术的巫主\n三千年前，灵、曜两族诞下五灵守护者，对灭世的不死女巫艾拉进行世代封印\n三千年后，新一届守护者诞生，五位圣灵者肩负救世使命。\n巫族公主蒂泠，出了名的任性，翘课、炸学校、学禁术\n然而，一则消息震惊世界\n蒂泠成了三千年来第一位来自巫族的圣灵者——智之灵\n让“恶霸”拯救世界？\n众人：谁说看不见星球的未来？这不是一眼就看到头了\n灵息学院，\n所有人都想进的三族最强学府，一心摆烂的蒂泠被强制保送\n灵息优等生缪辞，是灵族最年轻的公爵，也是众望所归的五灵守护者队长玄之灵\n蒂泠来前：高冷，沉稳，尽在掌握\n蒂泠来后：头疼，善后，怀疑人生\n算了，赶紧封印艾拉，大家好聚好散\n…\n一次意外，蒂泠灵印消失，决定独自离开。\n黑暗的房间内，她被吻的喘不过气，用力推开他，“队长，我不是圣灵者了，好聚好散吧。”\n男人眼尾浸红，额头贴着她的耳朵，薄唇轻吻她的脸颊，“你觉得呢？我的公主殿下。”\n撩也撩了，摸也摸了，要负责了，人就跑了\n女孩理亏的偏过头，缪辞都气笑了，指尖扣住她的下颌，迫使她面对自己，学着她曾经恶劣的语气\n“不接话？那就接吻。”", "tags": ["玄幻言情", "校园", "幻想言情", "星际", "冰山", "双洁"], "borderColor": "#9b59b6", "backgroundColo ", "无CP", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [4.9, 5.16, 5.23, 5.23, 5.32, 5.37, 5.31], "trend": 0.41, "latest": 5.3, "wordNumber": 282116, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.73, 2.79, 2.83, 2.88, 2.92, 2.97, 3.09], "trend": 0.36, "latest": 3.1, "wordNumber": 240381, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [4.54, 4.85, 4.97, 4.97, 5.24, 5.24, 4.85], "trend": 0.31, "latest": 4.9, "wordNumber": 276207, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.58, 2.68, 2.71, 2.71, 2.68, 2.65, 2.61], "trend": 0.03, "latest": 2.6, "wordNumber": 265959, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "周家独苗要科举", "fullTitle": "周家独苗要科举", "link": "https://fanqienovel.com/page/7649989071162330174", "data": [2.82, 2.93, 2.92, 2.92, 2.86, 2.86, 2.84], "trend": 0.02, "latest": 2.8, "wordNumber": 175239, "creationStatus": 1, "desc": "【胎穿-科举-家长里短-无金手指-cp不确定，写着看】\n周如寒熬夜加班猝死后竟然穿越了，穿成了老周家的独苗苗。\n因为出生时身子弱，又是独苗，爷奶爹娘都当眼珠子疼，周如寒看着自己瘦弱的小身板，这幅身子想要靠力气吃饭怕是不行了，既然这样，那就走科举吧！\n可看着老周家一文钱恨不得掰成两半花的样子，周如寒长长叹了口，想要读书还是得先搞钱，不然怕是学费都交不起，好在他现在才七岁，一切都来得及。\n听说要送他去读书，家里人都不同意，连村里的乡亲们都觉得周老头一家疯了，他们这些一辈子在地里刨食的泥腿子，哪里是读书的料？\n可随着喜报一次次传回村里，喜宴他们是吃了一顿又一顿，谁还敢说他不是读书的料？", "tags": ["种田", "古代言情", "乡村", "穿越", "科举", "胎穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "女频衍生", "score": 7, "reasons": ["7日增长+109.1万", "竞争系数低(4.2)", "腰部稳(均腰比1.18)"], "total19": 273.2, "growth": 　　张宝珠：路边的男人不能捡，会变得不幸！\n\n　　张起灵：捡我，我打工养你！\n\n　　第二篇：年下弟弟粘人又爱哭\n\n　　张宝珠：打饭手抖怎么办？\n\n　　吴邪：宝宝，辛苦了，我给你揉揉小手～\n\n　　第三篇：进错房间后，二爷夜夜宠\n\n　　张宝珠：我有男朋友，你别过来！\n\n　　吴二白：乖，和他分手。\n\n　　第四篇：当老板的快乐，谁懂？\n\n　　张宝珠：除了按摩，你还会什么？\n\n　　黑瞎子：瞎子我呀，会的可就多了～\n\n　　第五篇：被撞后，我把肇事司机认成了男朋友\n\n　　张宝珠：哥哥，你是我的男朋友吗？\n\n　　解雨臣：嗯。\n\n　　过渡篇六：小修罗场～\n\n　　第七篇：我知道她很可爱，但是表哥你为什么也知道？\n\n　　张宝珠：你怎么又回来了？\n\n　　解连环：你喜欢白天的我还是晚上的我？\n\n　　吴三省：白天的我厉害还是晚上的我厉害？\n\n　　第八篇：等我想一想", "tags": ["悬疑脑洞", "悬疑", "系统", "盗墓", "灵异", "同人"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "乙女游戏哪来的面板和血条啊喂？", "fullTitle": "乙女游戏哪来的面板和血条啊喂？", "link": "https://fanqienovel.com/page/7650859423321033790", "data": [3.38, 3.49, 3.5], "trend": 0.11, "latest": 3.5, "wordNumber": 234094, "creationStatus": 1, "desc": "【系统+万人迷+病娇+全洁+暧昧拉扯+直播弹幕+升级流+反杀+宿敌+诡异副本】\n#狠狠玩弄病娇们感情，她超勇的#\n#表面《诡异恋爱模拟游戏》，实际惊悚副本生死局#\n深夜，沈亦言手机弹出某诡异恋爱游戏。\n开局就抽中伪人卡并被画面吓死。\n好在得到重生方法——通关副本赚积分买重生卡。\n【叮咚！恭喜您开局出生在病床上】\n【您的状态：被绳索水灵灵地五花大绑着】\n【黑发红眸的斯文败类医生正优雅地拿着电锯，即将把您五马分尸！】\n沈亦言：“......？”\n【恭喜您受迷魂香影响扑倒了眼前矜贵优雅却无力反抗的白发青年！】\n【场面一度活色生香！】\n沈亦言：“这才是我们大女人该玩的恋爱游......”戏。\n【检测到白发青年为诡异，与您教导培训中会释放虫胚，使其寄生于您】\n沈亦言：“......？”\n【叮咚！】\n【--检测更多疯批病娇们正在靠近，请玩家做好准备--】\n***\n作为一个间歇性疯批变态的沧桑忧郁社畜。\n越偏执目的不纯的危险爱意，越能激发沈亦言病态的战意，令她热血沸腾......\n“常言道，宿敌就是宿敌，宿敌是不能成为妻子/丈夫的。”\n--所有感情，动机不纯，去向不明，对待不善--", "tags": ["悬疑脑洞", "悬疑", "系统", "直播", "灵异", "惊悚游戏", "病娇"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：你也想要我的香吗？", "fullTitle": "盗墓：你也想要我的香吗？", "link": "https://fanqienovel.com/page/7656772528630680638", "data": [3.06, 3.11, 3.17], "trend": 0.11, "latest": 3.2, "wordNumber": 138861, "creationStatus": 1, "desc": "【避雷看章一】\n在荒渊不知道活了多久，连脑子都退化完了的老鬼腊十八，一朝被系统强制性拐卖到盗墓世界打起了黑工。\n腊十八没上过班，系统忘了便宜没好货，小世界不懂没脑子鬼的杀伤力。\n三方颗粒度没对齐，重要角色被他一次次闹出的意外整的狗带，导致世界不断重启，他也被困在小世界里一次次的循环没走完的故事线。\n直到终极受不住了找上门，和腊十八约定了最后一次机会。\n没成想，重生上线就送大逃杀。\n算了，事已至此，先认个爹吧。\n——————————\n系统大猫十九为了能够早日退休，背着时空局私下接单。\n万万没想到，精挑细选的任务者还能让它有炸单的一天。\n面对小世界流着瀑布眼泪的控述。\n十九一边掏着赔偿款，一边倒三角眼发出不亚于恶魔的低语：\n“你就掏了这点家底，还想要多贵的东西？便宜没好货你不知道吗！”\n著名便宜货·腊十八听到自己的名字，不明所以的茫茫然抬头。\n【喊我？】\n**********\n对此，主角团表示有话要说——\n吴邪脸红又绝望：畜生啊！！！\n解雨臣淡定饮茶：不过贪玩了些，不是什么大事。\n黑瞎子扭头假笑：没说不养，谢谢。\n沉浸在破碎男性自尊无可自拔的王胖子，哭的不能自已。\n张起灵路过，手里拎着一个无辜的腊十八，从所有人面前路过。", "tags": ["悬疑脑洞", "悬疑", "盗墓", "系统", "重生", "同人", "灵异"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.42, 3.49, 3.5], "trend": 0.08, "latest": 3.5, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：强制诚实的我憋不住了", "fullTitle": "盗墓：强制诚实的我憋不住了", "link": "https://fanqienovel.com/page/7563612379108346905", "data": [4.73, 4.79, 4.81], "trend": 0.07, "latest": 4.8, "wordNumber": 227252, "creationStatus": 1, "desc": "（评分刚出，会涨哒）\n一个普通人穿越到盗笔世界，成了吴家小少爷。\n吴言，开局抽奖抽到了‘强制诚实’，这是奖励？\n再次抽奖，抽到了‘不会坏的计算器’。\n为了活下去，吴言只能尽量少说话，用‘计算器’代替自己发言！\n（有CP，有系统，团宠，搞笑甜味，不虐。主角性格是被特意培养的，单纯、幼稚，但三观极正。介意者，勿看！！！！！！！）\n看着不停说话欺负自己的黑瞎子，吴言不语，拿出计算器，不停按下减号键，计算器不停响起 “ jian jian jian jian jian jian ........”\n看着出言不逊的伙计，吴言用计算器按下几个键，计算器响起“平方根62500  等于......”\n遇到嘲讽吴家的藿仙姑，吴言不语，拿出计算器，按下六个数字‘4’ ‘3’ ‘8’， ‘4’ ‘7’ ‘8’！\n不想回答别人问题，按下计算器的“X的y次方”键，计算器会响起‘mi’！\n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "好巧，你也是NPC吗？", "fullTitle": "好巧，你也是NPC吗？", "link": "https://fanqienovel.com/page/7647195849952332862", "data": [3.71, 3.68, 3.75], "trend": 0.04, "latest": 3.8, "wordNumber": 257356, "creationStatus": 1, "desc": "【评分刚出，后面会涨～～走过路过，不要错过～】\n【1v1双洁+无限流+存在部分规则怪谈＋多身份玩家vs无底线纵容npc 】\n她出车祸了。\n好消息，还活着\n坏消息，进无限流了。\n不是，没人告诉她进了无限流还要签两份合同啊。\n而且，为什么每次npc身份都是系统偷的？！\n她到底绑定了个什么东西！！！\n一边防副本也就算了，还要防止原身份主人来揭穿自己？？\n这是什么道理。\n只是，这个身份主人怎么每次都能遇到。\n【具体排雷在第一章末 一定要看！！！】\n【这是无限流小甜饼！！！介意慎入！！！】", "tags": ["悬疑脑洞", "悬疑", "规则怪谈", "惊悚游戏", "灵异", "无限流", "系统"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [6.0, 6.49, 6.98], "trend": 0.98, "latest": 7.0, "wordNumber": 179644, "creationStatus": 1, "desc": "（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满级绿茶穿七零，抢了原主金大腿", "fullTitle": "满级绿茶穿七零，抢了原主金大腿", "link": "https://fanqienovel.com/page/7659748891788594238", "data": [5.02, 5.22, 5.68], "trend": 0.67, "latest": 5.7, "wordNumber": 284719, "creationStatus": 1, "desc": "【年代+空间系统+黑莲花+真假千金+扮猪吃虎+甜宠打脸】\n前世修真界的大妖乔念渡劫失败，穿成了七零年代红星大队最灰头土脸的病弱村姑。\n原剧情里，她是假千金女主苏小曼的垫脚石，被哄骗着替苏小曼干农活、嫁给家暴老鳏夫，最后难产而死。而苏小曼却靠着善良坚韧的人设，搭上了下乡镀金的京圈太子爷叶廷洲，回城走向人生巅峰。\n乔念看着自己枯黄的头发和走两步就喘的破败身体，冷笑一声。\n系统提示：【靠近京圈太子爷叶廷洲，吸取气运，可解锁：冰肌玉骨、灵泉空间、绝顶厨艺……】\n于是，在那群知青为了几个工分斗得头破血流时，乔念红着眼眶，柔柔弱弱地跌进了那个全村人都不敢惹的阴鸷大佬怀里。\n后来，自命清高的苏小曼被极品亲戚逼得嫁给老光棍。\n而乔念却被那位心狠手辣的太子爷抵在麦垛上，男人眼尾猩红，声音沙哑：“念念，命都给你，别看别人好不好？”", "tags": ["年代", "现代言情", "乡村", "系统", "真假千金", "位尊权重"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丰腴媳妇不作了，糙汉打脸真香了", "fullTitle": "丰腴媳妇不作了，糙汉打脸真香了", "link": "https://fanqienovel.com/page/7648274238557654041", "data": [20.91, 21.3, 21.56], "trend": 0.65, "latest": 21.6, "wordNumber": 290065, "creationStatus": 1, "desc": "服装设计师姜蜜熬夜猝死，一睁眼穿成了年代文里的极品作精村妇。\n原主顶着十里八乡最绝色的脸，却长了个草包脑子。\n放着任劳任怨、能赚能打的糙汉老公不要，把家底掏空去倒贴小白脸知青，甚至一哭二闹三上吊逼着离婚。\n按原书剧情，她离了婚就被渣男卖进深山，被折磨得连个全尸都没留下！\n母胎单身的姜蜜连连摆手：这作死剧本谁爱要谁要！\n满肚子坏水的细狗知青？滚一边去！把骗她的钱连本带利全吐出来！\n嚼舌根看笑话的长舌妇？不好意思，我当场发疯教你做人！\n至于那个表面冷酷无情实则纯情护短的糙汉老公……当然是关起门来好好撩拨！\n\n全村人都搬好小马扎，等着看贺家那个作精婆娘被扫地出门，笃定她肯定要跟小白脸私奔。\n可谁知左等右等，只等来贺家顿顿飘出诱人的肉香，日子越过越红火！\n原本嫌她恶心的冷面糙汉，更是化身无底线“护妻狂魔”。\n有人眼红挑拨：“铮哥，你媳妇以前可是天天惦记野男人……”\n话没说完，贺铮一脚踹碎水缸，霸气护妻：“滚！老子愿意给媳妇当牛做马，谁敢说她一句不是，老子打断他的腿！”\n夜里。\n那个打起架来不要命的野男人，却将娇柔的小媳妇圈在怀里，双眼猩红，嗓音哑得要命：“媳妇，这可是你先招惹我的，说好了一辈子，少一天都不行……”", "tags": ["年代", "现代言情", "乡村", "穿越", "护短", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越七零，我成了女主的恶毒继姐", "fullTitle": "穿越七零，我成了女主的恶毒继姐", "link": "https://fanqienovel.com/page/7645293690532924440", "data": [22.24, 22.68, 22.86], "trend": 0.62, "latest": 22.9, "wordNumber": 259914, "creationStatus": 1, "desc": "【军婚 年代 空间 穿越 甜宠 乡村 家长里短  打脸 】\n一睁眼，苏令妩穿越成了蛮横跋扈，自私虚荣，嫉妒心强，除了美貌一无是处的极品炮灰！\n女主苏令棠的恶毒继姐，苏令妩！\n加班猝死的她，眼前黑了又一黑。\n这不是她曾经看过的一本小说么！\n恶毒女配跟女主看上同一个男人，便下药设计女主。\n没想到被女主发现，及时反击，自己却药物过量而死。\n还有更体面一点儿的死法么？\n等等！\n那……眼前的男人……是怎么回事？\n傅凛川！\n那不是原书中男女主的贵人么。\n家世显赫的高干子弟。\n从当兵起就一路开挂，屡获战功，成为破格提拔的年轻骨干。\n后期更是成为了威名赫赫的超级大佬。\n据说年轻时被人算计，失去了生育能力，一生未婚，孤独终老。\n嘶……\n自己这是……\n抱上大腿了！", "tags": ["年代", "现代言情", "乡村", "穿越", "空间"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [6.07, 6.42, 6.64], "trend": 0.57, "latest": 6.6, "wordNumber": 259291, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "守了二十年寡，不守了", "fullTitle": "守了二十年寡，不守了", "link": "https://fanqienovel.com/page/7654493284269575193", "data": [4.87, 5.09, 5.24], "trend": 0.38, "latest": 5.2, "wordNumber": 221124, "creationStatus": 1, "desc": "【年代+克夫+女强+种田+家长里短+寡妇逆袭+单亲妈妈+凶宅】\n新婚夜，丈夫被房梁砸死，刘春红成了“克夫扫把星”。\n婆婆逼她生下遗腹子，转头翻脸不认人，月子里将母女俩赶出门。娘家大嫂堵着门骂：“嫁出去的闺女泼出去的水！”\n走投无路，她抱着满月的女儿，推开了村后那座死了五口人的凶宅。\n村里人都说她活不过这个冬天。\n二十年后，那个等了她二十年的男人问她：“守了二十年寡，不守了？”\n她说：“不守了。”", "tags": ["年代", "现代言情", "乡村", "女强", "养崽", "家长里短"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替姐下乡？我搬空家底闪耀七零", "fullTitle": "替姐下乡？我搬空家底闪耀七零", "link": "https://fanqienovel.com/page/7655596159691394072", "data": [6.18, 6.43, 6.55], "trend": 0.37, "latest": 6.6, "wordNumber": 267555, "creationStatus": 1, "desc": "宁晚秋重生了，一睁眼，偏心父母正逼她替白莲花姐姐去苦寒的北大荒下乡。\n前世她隐忍退让，却落得个惨死异乡的下场，而姐姐和渣男未婚夫却踩着她的血肉恩爱一生。\n重活一世，宁晚秋冷笑：这垫脚石，谁爱当谁当！\n下乡名额是吧？她反手设局，亲手送白莲花姐姐嫁给胡同里暴戾的二流子！\n逼她净身出户？她觉醒双层现代百货与医药空间，连夜将偏心父母和渣男家的存折、黄金、大米白面搬得连渣都不剩！\n拍拍屁股，她带着百亿物资和神医传承，美滋滋地奔赴北大荒。\n本以为要在林海雪原里猫冬致富，谁知一不小心，救了前未婚夫那位权势滔天、冷硬如铁的军区大佬大哥——陆闻野。\n那个平日里生人勿近的冷面阎王，却在风雪夜里将她死死抵在炕沿上，声音暗哑：“晚秋，跟了我，命都给你。”", "tags": ["年代", "现代言情", "乡村", "重生", "空间", "大佬"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [6.04, 6.37, 6.31], "trend": 0.26, "latest": 6.3, "wordNumber": 177099, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "年代文穿书之女配不认命", "fullTitle": "年代文穿书之女配不认命", "link": "https://fanqienovel.com/page/7605585757146713112", "data": [6.52, 6.66, 6.73], "trend": 0.21, "latest": 6.7, "wordNumber": 290188, "creationStatus": 1, "desc": "上了年代新书榜了，没想到第一本书就能上榜单，开心！\n评分刚出，后面会涨的。\n林书悦穿书了，穿成了一本年代文里的女配。因为对象被女主截胡而不得不去下乡，最后永远留在了下乡的地方。林书悦奋起反抗，终于改变了命运，可随即她却发现，这里不仅仅是一本书，而是一个多本小说融合的世界。有纪实文学、真假千金文，重生军嫂文，男频大男主爽文，等她结婚后，她发现她的婆婆居然也是穿越女。而她的儿女，也纷纷遇到了鉴宝文男主和快穿文女主。林书悦麻了。这是怎样一个操蛋的世界。", "tags": ["年代", "现代言情", "系统", "空间", "穿书", "家长里短"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成对照组女配我把男女主玩疯了", "fullTitle": "穿成对照组女配我把男女主玩疯了", "link": "https://fanqienovel.com/page/7635566031313849406", "data": [8.18, 8.42, 8.38], "trend": 0.2, "latest": 8.4, "wordNumber": 281399, "creationStatus": 1, "desc": "顾昭昭穿成一本对照组小说的妯娌女配，最恶心的是她还获得一个女主助攻暴击系统。\n　　对照组还不够，还要她为女主服务是吧。\n　　既然这样玩，那就别怪她了。\n　　好孕多子？一胎十宝不用谢。\n　　心地善良，随手一救就是贵人？一个贵人哪够，百倍暴击，一下晕倒一百个在她前面，吓不死她！\n　　男配都爱她，二三四个男配哪里够，直接来个千倍暴击，男主头上青青草原。\n……\n只是这个她随便将就一下的男人是怎么一回事，怎么就黏上甩不掉了。\n谢彦平好不容易娶了个妻子，老婆没心没肺就算了，还总想把他甩掉，谢彦平表示，是他的，就永远是他的，想跑，打断腿哦~~~", "tags": ["年代", "现代言情", "系统", "穿越", "魂穿", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "婆婆妯娌和小姑", "fullTitle": "婆婆妯娌和小姑", "link": "https://fanqienovel.com/page/7617351350073953305", "data": [6.26, 6.27, 6.41], "trend": 0.15, "latest": 6.4, "wordNumber": 293730, "creationStatus": 1, "desc": "父兄奇丑，她却貌美如花，扭曲的母爱差点让她成为换亲的牺牲品。\n       他救她出深井，给了她一个温暖的家，丈夫、孩子、公婆、妯娌、大姑姐、小姑子……\n      生活的序幕就此拉开，形形色色的人物纷纷登场……酸甜苦辣、嬉笑怒骂、活色生香……", "tags": ["年代", "现代言情", "乡村", "家长里短"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "搬空家产去随军，进错洞房被亲晕", "fullTitle": "搬空家产去随军，进错洞房被亲晕", "link": "https://fanqienovel.com/page/7649401358138756120", "data": [4.59, 4.63, 4.71], "trend": 0.12, "latest": 4.7, "wordNumber": 248992, "creationStatus": 1, "desc": "【空间+萌宠+爽文+丰满娇媚能医会毒大美人VS顶级男德无脑护军官】\n全球首富大小姐白梨无聊开了把游戏，打团气到嘎过去，还倒霉催的穿进酸鸡室友写的小说里。\n原主作为天命女主，被攻略者夺取气运，剥离光环，收走家产，家暴致死。\n死了也不放过，还给她配了几门阴婚。\n这给白梨看笑了，什么脑残剧情？滚一边去。\n她只会以恶制恶，煽风点火，主打谁都别想活。\n亲爹渣，后妈毒，她鞭子蘸碘伏，边打边消毒，免费附送农场改造VIP服务。\n白莲继妹？给她脸划烂，腿打断，嘴巴缝上，送她去收破烂。\n房屋地皮收收收，祖产嫁妆搬搬搬，雁过拔毛，一分不留，厕纸都一道顺走。\n连夜收拾行李，去军区投奔未婚夫。\n只是，咦，好像投错了～。\n裴泫冷静克制，不近女色，战友临时出任务，他去帮接未婚妻。\n第一次见面，小姑娘肤白貌美，身段窈窕，脆生生喊了句，“同志，你好。”\n裴泫心脏狂跳，连娃儿名字都已经想好。\n兄弟，既然你嫌弃，那我可就接盘了？\n大院都说裴泫疯了，捡了个兄弟不要的二手货。\n结果，白梨一手银针，起死回生，灵药出手，病痛全消，八国语言，通通全会，还被国家奉为座上宾，视为重点保护对象。\n看着闪闪发光的她，战友那是肠子都悔青了。", "tags": ["年代", "现代言情", "穿越", "空间", "先婚后爱", "虐渣"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成年代男主的恶毒原配", "fullTitle": "穿成年代男主的恶毒原配", "link": "https://fanqienovel.com/page/7647072153879186494", "data": [4.67, 4.74, 4.72], "trend": 0.04, "latest": 4.7, "wordNumber": 257236, "creationStatus": 1, "desc": "宝宝们刚出评分\n萧玖染睡醒之后就发现自己待在陌生的地方，  当是她在想到底是哪个朋友的恶作剧的时候，突然脑袋一阵刺痛，传来了一大股陌生的记忆。\n       萧玖染从记忆中知道了她现在这个情况是穿越，这个身体女孩高中的时候喜欢上一个男生，高中毕业终于打算鼓起勇气表白。\n       但是意外来的太快，一次跟人来镇上碰到了一个出任务的军官，这个军官中了药把她当成解药。\n       这具身体的人十分的崩溃，处于这个年代还发生了这种事情，加上父母他们的劝阻最后嫁给了这个军官。\n       嫁人之后，这个身体女孩过的十分不幸福，嫁的军官每个月除了拿钱什么都不管，婆婆还会时不时来刁难她。\n       萧玖染现在明白了，她这是改上了穿越潮流，她从前也是听过朋友说过几本小说。\n       萧玖染了解完现在能处境，她并不打算继续和这个军官生活。萧玖染打算提出离婚，如果现在这个身体生的小孩韩旭辰要留下来她就不带走，不要的话她就把这个小孩一起带走。\n       离婚后萧玖染打算考大学考研究生，去美国留学博士，留学的时候在美国炒股，毕业之后带着赚的钱回国做投资。", "tags": ["年代", "现代言情", "穿越", "空间"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世混子苟在东北", "fullTitle": "末世混子苟在东北", "link": "https://fanqienovel.com/page/7651616019772886040", "data": [9.01, 8.92, 9.04], "trend": 0.03, "latest": 9.0, "wordNumber": 226660, "creationStatus": 0, "desc": "林晚宁，一个末世里七个不服八个不愤的混子！与大佬温柏青和丧尸皇同归于尽后，以为就此一了百了！\n谁曾想一睁眼魂穿了，被迫发誓，才得了个干瘪的身体，一个倔的要命的爷爷！\n从此她走上了和老爷子斗志斗勇，和末世大佬重遇，相爱相杀的道路……", "tags": ["年代", "现代言情", "穿越", "空间", "相爱相杀", "大佬"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "胎穿50年代，我怎么又擦边上岸", "fullTitle": "胎穿50年代，我怎么又擦边上岸", "link": "https://fanqienovel.com/page/7651321133513313305", "data": [6.17, 6.18, 6.19], "trend": 0.01, "latest": 6.2, "wordNumber": 263889, "creationStatus": 1, "desc": "刚出分!会涨!\n程雅上辈子加班猝死，一睁眼胎穿五十年代。\n她没有改变世界的能力，只是一个比较幸运的普通小孩，普普通通的成绩，比上不足，比下有余，大方耐看的长相，但按她妈的说法，她奸懒馋滑，偏偏吃饭最积极。\n可是她有个特异磁场——逢考必擦边，堪称当代女版孙山。小升初时，她妈看了三分钟榜单，愣是在最后一个犄角旮旯看到了她的名字。1965年中考，历史再一次重演，她又一次擦边考上中专。录取通知书到手第二天，广播响了：全国取消高考。全家发出了尖锐的爆鸣声，她妈蹲在院子里又哭又笑。\n好不容易中专毕业了，国家包分配。她满怀期待本以为能进县机械厂端铁饭碗，结果上个厕所的功夫转角听说名额被厂领导的儿子占了。程雅心一横，让家里买了点特产，茶叶里头塞了点人情世故，去找负责的老师哭。老师看她哭得可怜又有眼力劲儿，透露了一个消息：粮站最近也有一个指标，本来也是那个厂领导儿子要去的，但人家临时改了主意不去了。程雅连夜递了材料，最后一名擦边进了粮站。\n1969年，她十九岁，年纪轻轻风华正茂。铁饭碗也有了，家里又开始催婚。\n行吧，但她相了一圈亲发现，好嘛，她成资源了。果断微笑拒绝，结果转角遇到貌美落泪小狗…", "tags": ["年代", "现代言情", "穿越", "胎穿"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [7.1, 7.51, 7.89], "trend": 0.79, "latest": 7.9, "wordNumber": 144109, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [4.4, 4.82, 5.12], "trend": 0.72, "latest": 5.1, "wordNumber": 198348, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成古代农女，家无男丁我来撑", "fullTitle": "穿成古代农女，家无男丁我来撑", "link": "https://fanqienovel.com/page/7640465862796774425", "data": [3.69, 3.9, 4.29], "trend": 0.6, "latest": 4.3, "wordNumber": 277185, "creationStatus": 1, "desc": "（评分刚出，后面会涨～请放心入坑）\n【穿越+种田+空间+超强武力值+发家致富+无CP】\n【女主属于高智、谨慎型，不是无脑爽！她擅长了解规则、利用规则。所以，有时候不服就干，有时候不服稍后才干！】\n\n现代特殊部门、手握空间和特种兵身手的苏青禾，因为一场混战，穿回到大启王朝同名同姓的农女身上。\n刚穿过去，爹刚生死不明，爷奶大伯小叔就想吃二房绝户，计划先卖原主双胞胎妹妹，用原主换取高额彩礼，再把大着肚子的原主娘扫地出门……\n苏青禾要让所有人知道，女子亦可立业、致富、立世、传名。\n……\n【排雷！！】\n后有双胞胎弟弟，但是弟弟年龄太小，还是女主撑起的门户！！！\n请你们不要默认代入了一个预设：弟弟长大后，会天然凌驾于姐姐之上，继承一切。\n有弟弟，但没耀祖！！！\n……\n\n《家无男丁我来撑》——这个撑，撑的从来不是没有男人的空缺，而是不管有没有男人，女主都会让家人好好活着。女主不是代替男人在撑，她是作为她自己在撑。\n女主不会通过贬低或工具化男性来证明自己强大，她的强大来自于她比任何人都更敬畏生命、更懂守护。\n……\n苏青禾没有打算把两个妹妹养成温室里的娇花。\n她要把她们培养成食人花——\n要争权夺利", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [8.59, 8.99, 9.01], "trend": 0.42, "latest": 9.0, "wordNumber": 211708, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生新婚夜，和离回娘家发家致富", "fullTitle": "重生新婚夜，和离回娘家发家致富", "link": "https://fanqienovel.com/page/7616374658438269976", "data": [3.94, 4.14, 4.31], "trend": 0.38, "latest": 4.3, "wordNumber": 167733, "creationStatus": 1, "desc": "【空间种田+家长里短+发家致富】\n【敲黑板：本故事纯属虚构！】\n【逻辑不存在，三观已丢失，圣母请绕道！】\n【写文不易，不喜勿喷！】\n睁眼重生新婚夜，颜俏就听见前世与她举案齐眉的夫君对她说：和离！ \n颜俏想起，前世夫君一直珍藏在书房里的那幅画，便明白了眼前人也和自己一样重生了！\n她果断签下和离书，带着自己的嫁妆回到家里！\n然而，看着一贫如洗的家里，她采草药、捡山货、打猎物、卖豆腐、做卤味、开店铺、买宅子、建庄子，带着全家发家致富！", "tags": ["种田", "古代言情", "乡村", "重生", "空间", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成小丫鬟，靠梳妆赎身暴富", "fullTitle": "穿成小丫鬟，靠梳妆赎身暴富", "link": "https://fanqienovel.com/page/7564256304332557336", "data": [3.33, 3.49, 3.68], "trend": 0.35, "latest": 3.7, "wordNumber": 296013, "creationStatus": 1, "desc": "观看指南：【非爽文+架空北宋+微群像+市井经商+微宅斗+家长里短+日常流】\n林丰穗穿到北宋，成了八岁小丫头，喜提知州府上「家生子」身份。\n娘是灶上的厨娘，爹是账房贴书，前边还有个大她两岁的绣娘姐姐。\n老娘是灶上摸油水的高手，好的孬的全塞兜里。\n姐姐绣活一般，嘴皮子极好，哄的管事眉开眼笑，多出的边角料通通拎回家。\n家里边只剩个老实爹，半点不敢马虎手里的账。\n丰穗到了年纪要学门手艺，全家人跳出来支招。\n娘说：厨房干活是冬冷夏热，不行！\n姐说：绣娘的活计不分昼夜，别干！\n爹说：账房么，识字算术，不差分厘，还行！\n丰穗心想：学，都学，但还得靠重操旧业稳妥。\n“娘子，梳妆吗？”\n不不不，搞错了！八岁大的人应该先拜师学艺。\n谨小慎微是安身立命的前提。\n赚钱赎身，身兼数职是常态。\n伺候主子饮食起居，还得起早贪黑，制那面脂香膏、胭脂水粉上街兜售。\n苦点累点都没事，只要能挣脱这脖子上的枷锁。\n一家人齐整出府，置上一间小院，做些经济买卖，自由自在的过红火日子，便浑身都是劲。\n日子能过好，就别让其糟下去。\n立意：自由、奋斗、自强则万事顺，向阳而生。", "tags": ["种田", "古代言情", "穿越", "今穿古", "发家致富", "群像"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破庙通古今，小乞丐们有救啦！", "fullTitle": "破庙通古今，小乞丐们有救啦！", "link": "https://fanqienovel.com/page/7650351395756837912", "data": [2.49, 2.63, 2.67], "trend": 0.18, "latest": 2.7, "wordNumber": 263148, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+群像文+温馨日常+无极品+无cp】\n逃荒路上，弹尽粮绝，\n小瑶的爹娘卖完两个姐姐又想卖掉小瑶。\n小瑶连夜逃跑，跑到闹鬼的破庙。\n鬼再可怕也没有人可怕，\n原来破庙住着装神弄鬼的小乞丐。\n无粮无水五个小乞丐快要饿死之际，小瑶向破庙内神像求救，绑定快要报废的通古今交易系统。\n五个底层小人物，与废物统子共同携手，摸爬滚打，靠着古今穿越的奇遇，一步步努力，成为有饭吃，有衣穿，有屋住的小小大人物。\n（PS：前几章写五人的相识和小乞丐在古代底层社会生存的不易，想直接看古今穿越的可以从第五章开始看。\n前期小瑶，小满，狗蛋，虎子，乌川五个孩子都是主角，都会穿现代，后期还会有小瑶姐姐夏一，夏二的加入。\n希望大家能爱上这些性格不同，但一样善良可爱懂事的孩子）", "tags": ["种田", "古代言情", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.92, 2.97, 3.09], "trend": 0.17, "latest": 3.1, "wordNumber": 240381, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局逃荒农家长姐有空间", "fullTitle": "开局逃荒农家长姐有空间", "link": "https://fanqienovel.com/page/7655709030232362008", "data": [2.89, 2.99, 3.02], "trend": 0.14, "latest": 3.0, "wordNumber": 171874, "creationStatus": 1, "desc": "【古代言情＋种田＋逃荒＋基建＋女主成长＋年下养成】\n【年下娇羞小将军vs全能型末世大佬】\n末世挣扎求生五年，最后还是死在了丧尸手里，苏清禾本以为要重新投胎了，却不想一睁眼穿成了古代的农家长姐，刚穿来就是天崩开局，斗极品亲戚，爹娘还都死了，却留下两个妹妹，和一个几个月大的弟弟给她抚养，\n她都还没来得及适应新身份，就拖家带口踏上了逃荒路，\n没有家人帮衬没关系，没有她有灵泉空间，还有一身的本领，足够她带着弟妹在这乱世中生存下去，\n只是原本收养的小萝卜头不知道什么时间就悄悄长大了，她教他习武，教他杀人，在他被强制征兵后成为他坚实的后盾，看着他从青涩稚童到意气风发的少年将军，苏清禾满是吾家有弟初长成的成就感，本以为是相依为命的姐弟情，却不想随着她身边的追求者越来越多，他的占有欲也愈发浓烈，\n萧衡哪里知道某人对他也是觊觎已久，只是眼睁睁看着他一步步踏入自己早已编织好的牢笼，", " 迷×all向】\n張起靈和黑瞎子开棺挖到美人粽子，竟然是黑瞎子的未婚妻——清朝郡主。\n　　月痕自幼体弱多病，还未成亲便香消玉殒。却没想到，多年之后竟在棺材内醒来，作为典型的精致利己主义者，她必然要抓住机会活命，顺便寻找复活的秘密。\n　　后来，汪家人找上门来要人：“这是我们汪家精心准备的卧底，不准亲给我撒手！”\n　　黑瞎子咬牙将未婚妻搂进怀里：“咱们可是未婚夫妻，我生是你的人，死是你的鬼！”\n　　月痕眨眨眼睛：“我不喜欢老的”。\n      旁边的張家人：“……”\n阅读指南：\n1.女主身世成谜，后期揭晓。\n2.女主精致利己主义\n3.随意可代", "tags": ["女频悬疑", "悬疑", "盗墓", "灵异", "同人", "悬疑恋爱"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我，丧尸王，九叔亲亲徒弟是也", "fullTitle": "我，丧尸王，九叔亲亲徒弟是也", "link": "https://fanqienovel.com/page/7654505159258557502", "data": [2.25, 2.44, 2.56], "trend": 0.32, "latest": 2.6, "wordNumber": 154135, "creationStatus": 1, "desc": "无cp➕九叔推第一人➕九叔护崽记➕微群像➕微恐➕兄友弟恭（鸡飞狗跳）\n（注：故事为林正英电影框架，有修改，大部分原创故事，没看电影的也不影响阅读，故事基本都会重新梳理融合）\n无外挂，无系统，故事主要围绕九叔带着三个徒弟捉僵尸，破邪祟，以故事为主，会涉及电影原片中的风水八卦，民俗文化灵异传说，少量恐怖情节。\n拥有雷电系异能的末日丧尸王霖青青，被天雷夸嚓一下劈到了异世界，两眼一睁，发现不仅穿越了，脑子还慢慢恢复人类意识了。\n更重要的是，眼前这个拿符引天雷劈自己的一字连眉帅大叔，不是自己的童年男神林凤娇（林九英）么！\n霖青青上去就是一个滑跪抱住九叔的大腿，“师傅！我是你从未蒙面的亲徒弟啊！”\n林九：“？”\n秋生：“师傅你背着我们外面有别的徒弟了？”\n文才：“哇！师傅你好厉害啊，僵尸王都跪着求你收徒啊！”", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱", "风水秘术"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：大哥，要成为我的信徒吗？", "fullTitle": "盗墓：大哥，要成为我的信徒吗？", "link": "https://fanqienovel.com/page/7469016608720030744", "data": [2.48, 2.64, 2.78], "trend": 0.3, "latest": 2.8, "wordNumber": 123089, "creationStatus": 1, "desc": "（吳二白女儿+原创cp+与主角团亲情友情向+自然力量+微团宠）\n为了稳定天地间的力量变化，维持生灵间的平衡，自然与天道达成共识，自然选择人类成为她的使者，履行维护这个世界的平衡，世代自然使者就这么履行着自己的职责。\n\n直到这代使者——天道进行了选择，祂察觉到了这个世界这一代的气运者命运轨迹发生了变化，有一股力量插手了他们原本的轨迹，于是一个和他们有密切联系的孩子被祂选中。\n\n她顺应天道出生，却被阴谋笼罩，一张大网将她一步步推向九门与汪家的局，眼睁睁的看着疼爱自己的哥哥一步步走向深渊，父亲越来越多的白发。\n\n吴盎然逗弄着指尖求抚摸的藤曼，你们是在挑衅恢复力量的自然使者吗？\n\n“哥，要不你拜拜我吧，你太邪门了。”\n“我要不给你上柱香？”吳邪咬牙切齿的发问。\n“你要成为我的信徒？也可以啊！” \n“等等，你们一块过来干嘛？我只要我哥一个信徒啊！”\n\n吳盎然表示：她哥真的不是一般人能保的，太邪门了。\n（拯救意难平，全都好好的。）", "tags": ["女频悬疑", "悬疑", "盗墓", "灵异", "悬疑恋爱"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, 于我一个人……\n小哥：看我，别看其他人。\n瞎子：沅沅，你在想谁，是瞎子做的不好吗?\n张海客：沅沅，张家族内通婚，你只能嫁给我一个人。\n无邪：沅沅，是你先招惹我的，所以不可以丢下我。\n解雨晨：沅沅，你说过喜欢我的，不能反悔。\n张海楼：小祖宗，招惹了我，可不能后悔啊……\n张海侠：沅沅，你看，这里只有我和你。\n张千军万马：沅沅，道家的人讲究随心所欲，我的心在你这里，所以，我的欲望也在你这里。\n黎簇：姐姐，你答应过我和我在一起的。\n汪灿：宋沅，你为什么不能多看我一眼。\n刘丧：沅沅，让我听你的声音。\n\n\n\n", "tags": ["女频悬疑", "悬疑", "穿越", "盗墓", "灵异", "悬疑恋爱"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沙海：盈而不溢", "fullTitle": "沙海：盈而不溢", "link": "https://fanqienovel.com/page/7650859338046639128", "data": [1.99, 2.06, 2.12], "trend": 0.13, "latest": 2.1, "wordNumber": 158350, "creationStatus": 1, "desc": "【天才型女主all+巨量私设+鬼吹灯部分设定+文抄公情节…待补充】\n本书唯一主角姜盈。\n2年前，姜盈以为只是一次普通的重生，并且可能是重生特性，脑子也直接直接超进化了，一跃成为学神，本以为自己会这样平淡但不平凡地走下去，为果家争光。但没想到2年后上了高中刚准备大展身手，她就发现自己的同班同学有一个叫黎簇的，而他的朋友一个叫苏万一个叫杨好。她这时才明白她不止是重生，而且还是穿越！\n穿的还是某三叔写的大坑笔记！而当姜盈发现不对劲时，时间线已经来到了沙海计划的开始…\n并且吴邪好像对黎簇等人没有任何兴趣，却对她有了极大兴趣，姜盈看似面无表情很镇定实际内心os：吴邪你滚啊…我只想好好上学！\n吴邪：…现在的小孩都这么难忽悠？我居然比不过那个叫苏难的汪家人？宁愿跟王盟说话都不跟我说话是什么意思？（醋意up）\n王盟：小盈，你快走吧，我家老板就是个变态！\n苏难：小满，跟我回汪家吧。\n瞎子：我徒弟说得对！…王盟说得也对（咬牙切齿）", "tags": ["女频悬疑", "悬疑", "天才", "灵异", "同人", "悬疑恋爱"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：挖野菜的那帮人", "fullTitle": "盗墓：挖野菜的那帮人", "link": "https://fanqienovel.com/page/7653271844002221081", "data": [3.23, 3.34, 3.31], "trend": 0.08, "latest": 3.3, "wordNumber": 193770, "creationStatus": 1, "desc": "【原创女主+原著主角团+无CP+ooc+不走原剧情+剧情不够怪物来凑+自己想吃什么加什么】\n第一次见胖子往包里塞洛阳铲，季嬗伊问：“这啥？”\n“挖野菜的，山里的野菜纯天然无污染，吃着得劲儿。”胖子面不改色\n她又指了指张起灵背上那把黑金古刀。\n“砍柴的。”胖子抢答。\n“砍柴用这么长的刀？”\n“高处的柴火好烧。”\n又指了指无邪手里的黑驴蹄子。\n“熏好的野味，一会和野菜一起炖汤，那叫一个香。”\n季嬗伊点点头，没再问了。\n后来黑瞎子加入，背了个探阴爪，不等她开口，胖子主动介绍：“挖萝卜的，野萝卜不好挖。”\n解语臣拎着绳钩站在旁边，问:“那我这个呢？”\n胖子想了想：“晾衣绳，出门在外得自己洗衣服，勤快！”\n“你们装备挺全。”她说，“又是挖野菜又是砍柴又是野味又是拔萝卜，还带晾衣服的。”\n“那可不。”胖子拍胸脯，“专业驴友。”\n“行。”季嬗伊点点头，“那下次我带口锅，咱们就地野炊。”\n黑瞎子笑出声。\n张起灵没说话，默默把刀往背后挪了挪。", "tags": ["女频悬疑", "悬疑", "悬疑恋爱", "风水秘术", "盗墓", "无CP", "同人"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad2 务的方式。\n帮主角团挡刀，为主角团赴死，替主角团承受他们承受不了痛苦。\n可等到了他快死的时候，主角团却红着双眼，声音颤抖。\n“你就不能为自己活一次吗？”\n“求你，别死……”\n岑厌打出问号：？\n像他这种罪大恶极的人，死掉的话所有人都应该感到高兴吧？\n为什么他们会露出那般悲痛欲绝的眼神呢？\n不太明白呢……\n……\n起初，岑厌以为所有人都想让他死。\n后来，岑厌发现所有人都想让他活。\n他无法理解。\n……为什么？\n……\n副本一：希望二中\n副本二：轮回金字塔\n副本三：回廊福利院\n副本四：七罪", "tags": ["游戏体育", "规则怪谈", "惊悚游戏", "反派", "无CP", "重生", "无限流"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "这难道不是乙女游戏？", "fullTitle": "这难道不是乙女游戏？", "link": "https://fanqienovel.com/page/7631980422003428414", "data": [1.81, 1.93, 2.33], "trend": 0.52, "latest": 2.3, "wordNumber": 170939, "creationStatus": 1, "desc": "【全洁款，请放心食用。】\n《仙缘》号称全球首款拥有沉浸式VR体验的乙女向游戏。\n常宁作为品鉴无数电子男友的资深玩家，好不容易抢到了内测资格，却在数个可攻略对象中，头铁地选择了一名叫陆今尘的神秘剑修男。\n【请玩家选择身份：1.弟子；2.器灵；3.路人】\n“开玩笑，我当然要原地螺旋起飞再忧郁地降临继承他的一切并和他展开一场惊天动地的师徒禁忌之恋！”\n后来，常宁就为自己的无知付出了代价。\n她被be麻了。\n当常宁好不容易打出he之后，心累地决定换换口味潇洒一下。\n没想到她刚和新对象牵上小手，比她的脸红来的更快的是陆今尘的剑气。\n他落下的时候，剑甚至还没出鞘。\n“若此人接下我这一剑……”\n常宁希冀地看着他：“咱们就此别过了？”\n陆今尘气笑了，拔出长剑。\n“我就砍死他。”", "tags": ["游戏体育", "系统", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全息游戏当神偷，偷完他的偷你的", "fullTitle": "全息游戏当神偷，偷完他的偷你的", "link": "https://fanqienovel.com/page/7649555417638390846", "data": [5.04, 5.24, 5.36], "trend": 0.32, "latest": 5.4, "wordNumber": 116657, "creationStatus": 1, "desc": "《创世纪》开服。\n偷情的红衣主教、傲慢的天使、残暴的教皇……\n时西摩拳擦掌，正准备进入游戏，大干一场。\n刚进去，系统：\n【恭喜玩家抽到概率0.00001％的隐藏职业。】\n时西欣喜若狂。\n她抽中了什么职业？\n难道她一下就拥有了牛逼哄哄的身份，拳打法师，脚踢战士，从此走上人生巅峰？\n系统：\n【恭喜玩家成为一名伟大的——】\n【小偷。】\n时西：“？？？”\n从此以后——\n其它玩家努力做任务赚金币，而时西狂偷NPC东西，一跃成为游戏里最有钱之人。\n其它玩家努力刷教皇好感度，为了获得教皇的赏赐；而时西努力接近教皇，只为从他身上偷到教皇令，取而代之成为新的教皇。\n神魔大战，厮杀惨烈。其他玩家为各自阵营而战，而时西浑水摸鱼，偷完神族圣物，又去偷魔族至宝。双方好不容易打完，回头一看，争了半天的宝物全都不见了。\n众人：“！！！”\n发生了什么？！\n次日，系统通报全服：\n【在玩家中有一个神偷，请大家把ta找出来吧！】\n系统对时西：\n【现在你已经同时得罪了正邪双方，你的阵营里只有你自己，务必不要被其他人发现身份哦～】\n时西：我去，不早说：）\n【有男主】", "tags": ["游戏体育", "系统"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidt ber": 203389, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成末世炮灰，被重生大哥娇宠了", "fullTitle": "穿成末世炮灰，被重生大哥娇宠了", "link": "https://fanqienovel.com/page/7650061683078990873", "data": [10.82, 11.31, 11.38], "trend": 0.56, "latest": 11.4, "wordNumber": 169665, "creationStatus": 1, "desc": "【末世+穿书+空间+打脸+囤物资】\n【穿书女+重生男】\n苏小满穿成了末世文里的炮灰——男主早死的未婚妻。\n开局末世爆发，被男女主推出去引丧尸，书里原主不仅毁容，还险些丧命。\n苏小满直接开大。\n谁惹的祸谁背！！\n反手捅破男主拥有异能的秘密，嘲讽他贪生怕死，顺手抢回原身母亲的遗物。\n——女主的空间。\n“你俩不就是他想睡你，你想被他睡，王八配狗，天长地久。”\n划清界限，疯狂囤货。\n一通电话打破了平静。\n“我是陆晏之，三日后我到，一天时间出现在我面前，否则当你死了。”\n苏小满这才想起，原身名义上的大哥，在书里战力逆天。\n带领众人逼退丧尸王，可惜在书里最后一次丧尸潮中陨落。\n这金大腿。\n她抱定了！！\n——\n陆晏之上辈子视命令高于一切，始终冲锋在前，一次意外全军覆没。\n死后灵魂不散，才知晓一切不过是怀璧其罪，反倒让某人捡了便宜。\n重生携异能归来，他火速囤物资、寻队友，事事抢先一步。\n可偏偏出现了一个变数。\n“哥哥，真是物资吗？”\n“哥哥，后面好像有燃油。”\n“哥哥……”\n——\n陆晏之忍无可忍，一把将人按在床上，“说，你到底是谁。”\n苏小满：“……”\n完了，好像演过头了。", "tags": ["科幻末世", "穿越", "空间", "末世", "囤物资", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.68, 5.95, 5.97], "trend": 0.29, "latest": 6.0, "wordNumber": 244786, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越末世居然带了个养老系统", "fullTitle": "穿越末世居然带了个养老系统", "link": "https://fanqienovel.com/page/7655687760652536856", "data": [2.32, 2.42, 2.5], "trend": 0.18, "latest": 2.5, "wordNumber": 257325, "creationStatus": 1, "desc": "“哇~宿，宿主，对，对不起，我，我好像定位错世界了！”系统汤圆在颜蓁蓁脑海里哭泣。\n“所以，我们现在在什么世界？”颜蓁蓁无奈的扶额，这具身体，好像在生病，浑身滚烫。\n“末，末世！”\n“什么？”", "tags": ["科幻末世", "系统", "穿越", "末世", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.58, 9.54, 9.63], "trend": 0.05, "latest": 9.6, "wordNumber": 251078, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被末世小队抓到了", "fullTitle": "被末世小队抓到了", "link": "https://fanqienovel.com/page/7612535963385859134", "data": [2.44, 2.49, 2.47], "trend": 0.03, "latest": 2.5, "wordNumber": 183337, "creationStatus": 1, "desc": "1v5，男强女弱。\n【男主五个固定+雄竞+男主一起团宠+异能+另类末世】\n\n辛月躲在一丛山棘木后，后方罗狮在吼叫，前方炮火轰鸣。打斗的声音渐渐消失，只剩树枝掉落声。\n\n辛月并不觉得安全下来，更恐怖的情形才开始。\n\n灵石学院的传说，被高级觉醒小队抓到的灵师，都会被……\n\n领头的男人打了打手势，和另外四个男人对视几眼，大家心领神会。\n\n“出来！”\n“小姐，你躲在前面偷袭我们呐？”\n………\n“我们帮你，不好吗？”\n\n“接受我们吧。”\n\n接受了他们之后，怎么人都不见了？小灵师在一个一个副本小世界里找配偶。\n配偶变18了，配偶失忆了，配偶变成……", "tags": ["科幻末世", "幻想言情", "末世", "甜宠"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被种下异种之卵后，我不做人了", "fullTitle": "被种下异种之卵后，我不做人了", "link": "https://fanqienovel.com/page 3522", "data": [24.99, 25.02, 25.24, 25.24, 26.09, 26.99, 28.49], "trend": 3.51, "latest": 28.5, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [22.56, 23.11, 23.63, 23.63, 24.43, 24.56, 24.52], "trend": 1.96, "latest": 24.5, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [27.92, 28.37, 28.45, 28.45, 29.16, 29.36, 29.63], "trend": 1.71, "latest": 29.6, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.17, 41.31, 41.66, 41.66, 42.01, 42.21, 42.44], "trend": 1.27, "latest": 42.4, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [24.76, 25.75, 25.99, 25.99, 26.51, 26.7, 25.75], "trend": 1.0, "latest": 25.8, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [17.03, 17.43, 17.73, 17.73, 17.8, 17.84, 17.83], "trend": 0.8, "latest": 17.8, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [42.22, 42.58, 43.04, 43.04, 43.01, 42.57, 43.0], "trend": 0.78, "latest": 43.0, "wordNumber": 3267803, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n 妹。”\n谢昭信了，一直把她当妹妹照顾。\n自己吃苦受累不要紧，关键是要给妹妹最好的。\n给她攒够了嫁妆，找好了夫婿。\n眼看着她跟别的男人眉来眼去，他心里不得劲儿。\n他要把她留在身边。\n经过一系列的心理斗争后，他悟了。妹妹留不住，妻子能。\n于是他找到姜禾说：“我必须要向你坦白一件事，爹留给我的遗言，是让咱们做夫妻。”\n……\n恢复记忆的谢昭像条疯狗，不但假传父亲遗言，还对她死缠烂打，强取豪夺。\n朱门对朱门，竹门对竹门。她一个商户女，并不想去高攀什么天潢贵胄。\n她只想把家业发扬光大，当个富婆就好了。\n没想到一个不小心成了天下第一富婆，直到谢昭找来，要把自己卖给她换粮草。\n“将士们，咱们的粮草，是皇上给人当赘婿换来的，你们还有什么理由不拼命？”", "tags": ["宫斗宅斗", "古代言情", "穿越", "穿书", "HE", "1v1"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "团子助攻王爷请接招", "fullTitle": "团子助攻王爷请接招", "link": "https://fanqienovel.com/page/7613704029318695961", "data": [16.55, 16.55, 16.6, 16.6, 16.77, 16.83, 16.81], "trend": 0.26, "latest": 16.8, "wordNumber": 1237523, "creationStatus": 0, "desc": "特种兵军医沈长宁，在一次任务中牺牲，醒来却发现自己穿进了没读完的宅斗小说里——成了那个被姨母毒害、胖到200斤的蠢笨嫡女。洞房花烛夜，原主被又瘸又瞎的战神八王爷活活折腾死，她穿过来时，只剩一身酸痛和一肚子脏话。\n\n“卧槽！”这是沈长宁穿越后的第一句话。\n\n更操蛋的是，原主体内竟有五年慢性毒，亲弟弟被养成纨绔，母亲的死也疑点重重。而那个表面柔弱的姨母，如今正躺在父亲怀里，享受着本该属于原主母亲的一切。\n\n幸好，前世的手链化作随身空间，实验室、药品、美食一应俱全。她一边解毒减肥，一边暗中查证。谁知那晚一次意外，她竟怀上了那个又瘸又瞎的臭男人的种。\n\n三年后院幽禁，她带着天才儿子种菜养鸡，活得有滋有味。小团子三个月会说话，六个月背诗，七个月走路，三岁就能指挥鸡鸭鹅排兵布阵，智商堪比超级电脑。\n\n直到八王爷大婚之日，一个缩小版的自己突然出现在眼前——\n\n“你就是我爹？”小团子歪着头，“长得还行，就是脑子不太好使，难怪把娘亲关了三年。”\n\n慕容战：“？？？”\n\n当他闯入后院，看到那个曾经200斤的丑女如今身姿婀娜、容颜绝世，正叉腰骂鸡时，整个人都不好了。\n\n“你谁？”\n\n“你祖宗！”", "tags": ["宫斗宅斗", "古代言情", "穿越", "空间", "嫡女", "医术"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [27.81, 31.41, 32.42, 33.91, 35.17, 36.18, 36.67], "trend": 8.86, "latest": 36.7, "wordNumber": 494226, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宋老太重生，渣男私生子都滚开", "fullTitle": "宋老太重生，渣男私生子都滚开", "link": "https://fanqienovel.com/page/7573537639983238169", "data": [22.77, 23.91, 24.6, 24.6, 26.83, 27.58, 28.42], "trend": 5.65, "latest": 28.4, "wordNumber": 1862188, "creationStatus": 0, "desc": "（无系统空间，无CP，家长里短，海边美食，女人互助，送渣男去坐牢改造）\n八十岁的宋香兰，儿孙满堂，却活成了一个笑话。\n她为了丈夫，为了儿女，操劳一生，奉献出自己的全部，\n没想到临了的时候，丈夫为了白月光要和她离婚，还逼她净身出户。\n宋香兰来不及愤怒，更诛心的真相被揭开。\n原来她疼爱了大半辈子的儿子是丈夫和白月光所生，而被自己厌弃的、已英年早逝的养子才是自己的亲儿子。\n愤怒之下，她点燃瓦斯，和所有人渣同归于尽。\n再睁眼，宋香兰回到了1977，一切都还来得及。\n这一世，谁敢让她不痛快，她就让谁双倍不痛快！\n她要手撕渣男贱女，脚踢白眼狼野种，独宠亲生子女！搞钱！搞钱！再搞钱！", "tags": ["年代", "现代言情", "重生", "无CP", "虐渣", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "睁眼六零军区，弄错对象被亲哭了", "fullTitle": "睁眼六零军区，弄错对象被亲哭了", "link": "https://fanqienovel.com/page/7567657861308746814", "data": [28.59, 30.9, 33.32, 33.32, 34.93, 33.81, 32.95], "trend": 4.37, "latest": 33.0, "wordNumber": 1108775, "creationStatus": 1, "desc": "睁眼六零，许穗在男人床上醒来，被狠狠折腾了一整夜，亲哭晕死过去，一夜揣上双胎\n她这才发现自己穿书了。\n穿成肤白貌美，身姿窈窕的漂亮恶毒小青梅，前往军区找男主结婚，却意外弄错对象爬错床，被迫嫁给了落魄的假少爷。\n婚后顾云舟出任务断了腿，原主转头卷钱打胎跑路，最后钱丢了，身子骨坏了，大动荡被人举报作风问题惨死。\n顾云舟不仅腿好了，还重返部队步步高升，成为有权有势军区大佬，成了军区炙手可热的存在，惹得多少人想攀上他这根高枝。\n许穗看着眼前斯文俊美的军官男人，摸着肚子里的崽：长得帅，有本事，能力强，也不是不行。\n这么好的潜力股，可不能便宜了别人。\n*\n顾云舟不喜欢许穗。\n然而，婚后自家媳妇漂亮又勾人。\n一夜就怀上他的种，还是龙凤胎。\n怀着双胎轻松考上粮站铁饭碗，转头又成为六十年代顶尖大学高级人才，发明这个，发明那个，办厂赚外汇，让大伙儿富起来，成为领导座上宾。\n两个娃随媳妇，是有名的天才儿童。\n老实婆家：瞧见没，软弱了大半辈子的老秦家终于迎来了主心骨。\n成了首长夫人的心机寡妇娘：瞧，我闺女上报纸了。\n某首长：这是咱闺女，咱闺女就是厉害。\n被许穗带富的军嫂们：谁敢说许厂长坏话，就撕谁的嘴！", "tags": ["年代", "现代言情", "穿书", "大佬", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "村女吴秀丽", "fullTitle": "村女吴秀丽", "link": "https://fanqienovel.com/page/7614505261746621502", "data": [39. ], "trend": 0.13, "latest": 4.3, "wordNumber": 1016312, "creationStatus": 0, "desc": "病娇犯罪心理专家 VS 面瘫刑警队长\n原书名：《心理分析者》\n控制大脑的菌丝、人形蚁窝、邪恶吃播……离奇的案件折射出凶手扭曲的精神世界。\n基因给犯罪上膛，心理瞄准目标，环境扣动扳机。\n凝视深渊的人，也要警惕深渊。\n江宁希:我想跳进深渊体验一下。\n深渊:你不要过来啊！\n林司言拽住她：欢迎你先跳进我的世界。\n——\n江宁希见到帅气但面瘫的林司言时，格外兴奋。\n这竟然是个没有表情的男人。\n江宁希盯着林队长的瞳孔:你眼睛里的情绪很丰富。但你现在好像有点不耐烦。为什么呢?\n林司言:……你靠得太近了。\n表白时\n江宁希:没有遇到物理刺激，但你的瞳孔突然放大了，你在害怕我吗?\n林司言:没有。\n江宁希:那么就是另一种可能了。你对我产生了欲望。\n江宁希惊讶地发现，原来面瘫也会脸红啊。\n——\n推荐我的旧文《我一个自闭症会亿点剖尸怎么了》", "tags": ["女频悬疑", "悬疑恋爱", "悬疑", "推理", "病娇", "破案"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "警花她从地狱来", "fullTitle": "警花她从地狱来", "link": "https://fanqienovel.com/page/7517881898580839448", "data": [4.48, 4.65, 4.72, 4.62, 4.5, 4.51, 4.58], "trend": 0.1, "latest": 4.6, "wordNumber": 1371168, "creationStatus": 0, "desc": "　　青山市刑警队来了个低调沉默的女队员易念，看似柔弱，让人想保护。\n\n　　只是刑警队长连景山还没来得及伸出保护的手，就被血溅了一脸，他才发现，这姑娘逼到绝境，骨子里狠到了极致。\n\n　　易念说：“我是从血腥黑暗里爬出来的，只想找个山清水秀的地方养灵魂的伤。”\n\n　　卧底归来，让易念满身勋章，也满身伤痕。\n\n　　九星连珠古墓意外现世，暗流席卷，亡命之徒蜂拥而至。\n\n　　易念脱下制服，是早该被枪毙的黑道大姐大低调归来。\n\n　　昔日凶徒死咬不放，不知名杀手如影随形，易念被迫再度游走黑白边缘。可有人，想让她戴上面具，就再也摘不下来。\n\n　　当所有阴谋、追杀与精神迫害都指向同一个隐秘源头，最刺骨的深渊，才刚刚显露真面目。\n\n　　绝境之中，守护本心，于癫狂与毁灭之间破局追凶。\n\n　　撕裂黑暗，挣脱宿命桎梏，浴火重生，再揽荣光。\n\n　　没有深渊，能让英雄沉沦。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [14.35, 15.64, 17.31, 17.31, 21.7, 23.91, 26.66], "trend": 12.31, "latest": 26.7, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不 ，她也毫无怨言，只在得知信息那晚，悄悄泪湿枕巾。\n谢灼，顶级豪门太子爷，向来眼高于顶，目中无人，脾气差没边，最讨厌没分寸送上来的女人。\n在他看来，沈枝意就是其中一个。\n同居第一晚，谢灼半搂住新婚妻子，用温和却极具压迫感的嗓音低语：“给了你谢家女主人的身份，你该知足。”\n沈枝意僵住半边身子，只一个劲儿点头。\n不敢多说。\n_\n某天晚上，沈枝意痛经得厉害，怕他嫌弃，主动提出和他分房住。\n谢灼紧拧眉头，一声不吭进书房。\n沈枝意以为他在默认，一个人去了次卧，忍着痛迷迷糊糊睡过去。\n半夜，她忽然被男人身上的热意逼醒，听见他低声斥一句：“哪疼？老子给你揉揉。”\n“靠，就这点屁事，你要跟老子分房睡。”\n就这破事，我他妈去书房想一晚上也没想明白。\n沈枝意再次僵住半边身子，眼眶微湿，都没顾上疼。\n立意：以婚姻之名，爱上一个冷戾的他\n【先婚后爱+双洁+婚后甜宠+日久生情+年龄差五岁】", "tags": ["豪门总裁", "现代言情", "甜宠", "先婚后爱", "双洁", "位尊权重"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "万一小叔对假千金是柏拉图呢？", "fullTitle": "万一小叔对假千金是柏拉图呢？", "link": "https://fanqienovel.com/page/7614062220028152856", "data": [47.82, 48.05, 47.86], "trend": 0.04, "latest": 47.9, "wordNumber": 451126, "creationStatus": 0, "desc": "（高岭之花下神坛+蓄意撩拨+七岁年龄差+小叔）\n【恶劣装乖假千金×位高权重政界大佬】\n宋瓷做了个梦，她梦到自己其实是被抱错的假千金，未婚夫心爱的乡下贫困优等生才是真千金。\n后来未婚夫联手真千金，揭穿了她的身份，并把她送入精神病院，她不堪屈辱，割腕自杀。\n随着梦里的剧情一步步应验，宋瓷看着手上的亲缘鉴定单，终于把主意打在了她那个未婚夫都忌惮的小叔祝砚铮身上。\n金碧辉煌的订婚宴上，未婚夫牵着真千金的手出现在众人面前，向所有人宣告着对她的爱意。\n一门之隔，宋瓷听着门外的欢呼，声音颤抖：“小叔，阿瓷知错了……”\n--\n人人都知道祝家那位掌权人冷漠疏离，不近人情。\n可谁都不知道，夜深人静时，男人克制又偏执地吻着怀中的女孩，眼尾猩红。\n“小叔帮阿瓷惩罚他们了……”\n“阿瓷也帮帮小叔好不好……”\n--\n再后来，她假千金的身份被拆穿，蓄意撩拨也被拆穿，宋瓷逃去了国外。\n伦敦街头，男人眸光明灭，步步逼近。\n“阿瓷乖，跟我回家。”\n“别怕，阿瓷年纪小，玩心重，是我引诱的你，对不对。”\n#她才不要什么烂人的真心，她要圣人的那颗私心！\n后排提醒：男女主无任何血缘关系！", "tags": ["豪门总裁", "现代言情", "大佬", "真假千金", "年龄差", "位尊权重"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "满门反派疯批，唯有师妹逗比", "fullTitle": "满门反派疯批，唯有师妹逗比", "link": "https://fanqienovel.com/page/7134523177480227854", "data": [54.18, 59.37, 63.25], "trend": 9.07, "latest": 63.2, "wordNumber": 3537452, "creationStatus": 0, "desc": "一朝穿书，叶灵泷成了修仙文里的恶毒炮灰女配，资质奇差还在修仙大会上胁迫女主带她进第一宗门，入门后处处跟女主作对最后惨死收场。\n　　为了快乐苟活，叶灵泷当场放弃胁迫女主，扭头就进了修真界最差的门派，这恶毒女配她不当了！\n　　本以为进个最差宗门能吃喝玩乐苟日子当咸鱼，谁知这最差的宗门里全员都是疯批反派，随时走在黑化边缘，准备给女主挨个送头。\n　　啊这…她们门派要是马上要团灭了吗？不慌，这题她会。\n　　大师兄满门被灭后复仇杀穿整个修真界最终被女主打败？小师妹：师兄我知道她什么修为什么功法多少秘宝，快，卷起来！咱不能输！\n　　二师兄身藏妖族血脉隐忍躲藏却被人发现群起而诛之 mber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹五界第一，天才见她都破防", "fullTitle": "小师妹五界第一，天才见她都破防", "link": "https://fanqienovel.com/page/7587720446674471998", "data": [19.5, 20.27, 21.53], "trend": 2.03, "latest": 21.5, "wordNumber": 336276, "creationStatus": 1, "desc": "【大女主、爽文、群像、无cp】\n现代人有没有灵根？\n云鸢表示，有的！还很牛！\n*\n一朝身穿到修仙界，觉醒极品金灵根，还是先天剑骨，被顶级宗门追着抢。\n这都不算什么。\n云鸢没想到，自己在现代对动物的亲和力，在修仙界还能用！\n*\n异兽大杀四方，各宗门弟子出去历练。\n“那是杀伤力极高的黑背烈齿狼！”\n云鸢：黑背德牧？\n“那是会吐人言迷惑人心的凤鸟！”\n云鸢：小玄凤？？\n“那是雪地最难惹的蓝眸飓风狼！”\n云鸢：二哈？？？\n看着云鸢轻松收下一堆灵兽，并且还称兄道弟，还能契约！\n同辈弟子：大变态！！\n云鸢：变态？\n要不你们去瞧瞧她的几个师兄师姐？\n*\n加入飞流峰后。\n云鸢才知道，变态是何物。\n大师姐最强武力，专修无情道，一剑一负心人。\n二师兄笑眯眯的，整日睡不醒，像是个废物，实则下手最狠。\n三师兄清冷无双，洁癖严重，一弄脏衣服修为暴增。\n四师兄长的多美，说话就多脏，出手就多阴。\n小师姐没她腰高，却最有钱，擅长拿灵石砸人！\n*\n直到飞升后，云鸢才发现自己的身份大有来头。\n她穿的不是修仙界吗？\n这魔法又是哪儿来的！\n这突然冒出的爹妈又是怎么回事儿", "tags": ["玄幻言情", "幻想言情", "穿越", "无CP", "今穿古", "群像"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女配修仙，但是无限读档", "fullTitle": "女配修仙，但是无限读档", "link": "https://fanqienovel.com/page/7364327533921176638", "data": [16.69, 17.0, 17.41], "trend": 0.72, "latest": 17.4, "wordNumber": 1247970, "creationStatus": 0, "desc": "[无cp，金手指巨巨巨大，快乐修仙，打怪升级]\n当炮灰女配得到了无限读档的能力后......\n开局灵根不好？读档重来。\n宗门大比打不过？读档重来。\n秘境危险重重？读档规避一切危险，读档拿满全部天材地宝。\n得罪了高阶修士？哪怕只有1%的可能性，反复SL读档，刷一万次也能练气反杀筑基。\n
