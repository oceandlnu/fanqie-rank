"今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沙雕师妹咸鱼修仙", "fullTitle": "沙雕师妹咸鱼修仙", "link": "https://fanqienovel.com/page/7194622106259164198", "data": [18.19, 18.04, 18.47], "trend": 0.27, "latest": 18.5, "wordNumber": 1216771, "creationStatus": 0, "desc": "［玄幻+搞笑+修仙+唢呐］云柒柒在现代咸鱼了一辈子，没想到死了之后居然穿越到了人均卷王的修仙世界，可是她还是不干！\n选师尊的时候，云柒柒思虑了很久，剑修太累了，又没钱。符修天天画符，她连字都写不好，别提画符了。思来想去，还是音修最好，而且对于音乐，她觉得自己还是有些天分的，毕竟咸鱼的时候她可是听了不少音乐陶冶情操。\n只是人家的法器都是什么琵琶古琴什么的，为什么她是唢呐！难道就因为她小时候和爷爷学过唢呐吗！\n然后天音门就经常会出现这种现象。\n大师兄冥想的时候，突然被一阵唢呐声打断，直接气血上涌，两眼翻白晕了过去。\n“来人呐！师兄晕倒了啊！”\n二师姐正在优雅的吹笛子，突然被一阵唢呐声带偏了，优雅的二师姐吹起了忐忑。\n“来人呐！快拦住二师姐，她要疯了！”\n从此之后，优雅的天音门整个就变了一个画风，而始作俑者凭借着高超的吹唢呐能力，成了修真界的名人。\n而做为云柒柒师尊的沈若虚，他成了纵容云柒柒的最大的罪魁祸首。\n“师尊，你就不管管小师妹吗！”\n沈若虚看了看正在欢快的吹着唢呐的云柒柒，理所当然的说道：“管什么，你小师妹不是挺好的吗，活蹦乱跳的。”\n众人晕倒，看来是没人能管得了云柒柒了！", "tags": ["玄幻言情", "古代言情", "穿越", "今穿古", "异世穿越"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [24.43, 24.56, 24.52], "trend": 0.08, "latest": 24.5, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗都是舔狗，小师妹是真狗", "fullTitle": "全宗都是舔狗，小师妹是真狗", "link": "https://fanqienovel.com/page/7200755351845604355", "data": [27.38, 27.37, 27.44], "trend": 0.07, "latest": 27.4, "wordNumber": 4170637, "creationStatus": 0, "desc": "【实体书《一念凤兮》全平台可购】凤溪穿成修仙文里面的炮灰女配，穿书之日就是忌日。\n她为了苟命，千方百计脱离了女主所在的混元宗，加入了玄天宗。\n嚯！\n五个亲师兄，在书里全都是女主的舔狗，一个比一个死的惨。\n凤溪邪魅一笑：“舔狗了不起？有我狗吗？”\n大师兄身中剧毒，只有女主的血能够解毒，从此对女主情深似海，最后却被女主一脚踹入万丈魔渊，魂飞魄散？\n凤溪屁颠屁颠端来一大盆狗血：\n“师兄，喝我的！我的剂量大，药效足！”\n吞服完解毒丹，正准备割破手指的女主：“……”\n二师兄身具餍族皇族血脉，女主给了他隐藏血脉的丹药，从此二师兄心甘情愿为女主出生入死，哪怕最后被女主推出去当替死鬼也甘之如饴？\n凤溪拿出人族餍族友好一万年的盟约：\n“二师兄，尽情展示你高贵的餍族皇族血脉吧！万千少女为你痴为你狂为你咣咣撞大墙！”\n女主看着手里需要三个月服用一次的隐血丹：“……”\n凤溪的人生信条：做得狗中狗，方为人上人！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越", "魂穿"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [17.8, 17.84, 17.83], "trend": 0.02, "latest": 17.8, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "青春甜宠": [{"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [50.15, 52.74, 55.03], "trend": 4.88, "latest": 55.0, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，冷拽死对头被我亲爽了", "fullTitle": "重生后，冷拽死对头被我亲爽了", "link": "https://fanqienovel.com/page/7639375832493853720", "data": [42.66, 44.35, 45.27], "trend": 2.61, "latest": 45.3, "wordNumber": 349346, "creationStatus": 1, "desc": "【明媚小仙女X冷拽太子爷丨大学校园+同居+系统+死对头】\n卢筱筱在大四那年遭人毒害身亡。\n再睁眼，她重生到大一，还被迫绑定了系统。\n必须和死对头邵恩辞完成100件羞耻社死的任务，\n才能彻底复活。\n［任务1：篮球赛结束，当众强吻他。］\n卢筱筱：……老天奶为何如此整我！\n-\n邵恩辞，智商天花板，AI领域天才，家世显赫。\n191浓颜帅哥，薄肌冷白皮，爱滑板爱运动。\n高中起就是她的死对头，两人见面必掐。\n因为一条百科乌龙，众人都以为他们是一对。\n昨天她火速避嫌：“我谈百合都不会跟他有一腿。”\n没想到今天，众人便看见她在篮球场当众强吻他，\n并且嗲着嗓音说：“哥哥，你唇好甜。”\n众人傻眼：？\n-\n某晚卢筱筱为了完成任务，厚着脸皮住进他家里。\n偷看他洗澡，半夜爬上他的床，趁他睡觉摸他腹肌，\n这些邵恩辞都能忍。\n唯独接受不了她一个女孩子偷藏他裤衩这件事。\n急！暗恋对象成了变态怎么办？\n-\n后来兄弟邱柏野得知真相，提醒他：\n“她只是为了完成任务才接近你，你被骗财骗色了！”\n邵恩辞：“玩我都不介意了，还在乎被骗吗？”\n邱柏野：……哥们，你没救了。", "tags": ["青春甜宠", "现代言情", "校园", "系统", "学霸", "暗恋"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [57.45, 59.1, 59.82], "trend": 2.38, "latest": 59.8, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [51.1, 51.7, 52.13], "trend": 1.03, "latest": 52.1, "wordNumber": 833198, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [16.16, 16.55, 16.94], "trend": 0.77, "latest": 16.9, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "怎敌她动人", "fullTitle": "怎敌她动人", "link": "https://fanqienovel.com/page/7470142203893926936", "data": [33.7, 33.81, 34.1], "trend": 0.4, "latest": 34.1, "wordNumber": 551024, "creationStatus": 0, "desc": "【已签实体出版】\n【重生校园+救赎+男暗恋+双洁HE】\n明媚嗲精 x 偏执隐忍\n*\n外人眼里，许霁青清冷斯文，是身家显赫的耀眼新贵，靠自己改命的寒门奇迹，能在最狼狈的时候嫁给他，是苏夏八辈子修来的好命。\n只有苏夏知道，许霁青是个疯子。\n她不喜欢他湿沉的眼神，不喜欢他无处不在的掌控欲，更怕那双苍白变形的手。\n直到许霁青为保护她死了。\n百亿遗产到手，苏夏却开始失眠，每回惊醒，梦里都是许霁青最后那声“夏夏”，和那张鲜血浸透的俊脸。\n*\n一睁眼，重回高二。\n苏夏家庭美满，还是那个众星捧月的小公主。\n许霁青刚转校到临中，旧球鞋刷洗到泛白，眉眼冷淡。\n他过得很苦，但还看不出日后的偏执。\n无人愿意和他同桌，她攥紧了裙摆，拉开身边的椅子，鼓起勇气对他笑。\n我的亡夫，这辈子好好活着。\n长大之后，\n不许再缠着我了哦。\n*\nTIPS:\n1.女主重生，两世都是双洁；\n2.男主的手后面会好；\n3.无雌竞，女主会慢慢改变，男主起始好感拉满爱到发疯；\n4.有关“亡夫哥为什么会爱上女主”和其他前世内容，正文后已更新5w+亡夫哥专场番外，从if线风雪故人归开始，书信集结束，请务必不要错过", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "双洁", "位尊权重"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宝宝乖，再亲一口好不好", "fullTitle": "宝宝乖，再亲一口好不好", "link": "https://fanqienovel.com/page/7562154597620403262", "data": [25.21, 25.57, 25.53], "trend": 0.32, "latest": 25.5, "wordNumber": 645449, "creationStatus": 1, "desc": "●正文已完结\n【年上+上位者低头+强制爱+大学校园+双豪门+顶级拉扯+双洁+救赎】\n●装乖甜软真公主x野欲混球太子爷\n●小太阳女主，女主救赎男主\n京念是千娇万宠的京圈小公主，外表乖巧，实则叛逆钓系\n为气死对头，她把主意打到了那位恣意痞坏的太子爷楼逍身上\n她将他在马场拦下：“赛一圈？”\n众人屏息，谁不知楼爷最厌女人近身？\n他却掐了烟，目光懒倦地将她从头扫到脚，勾唇：“行啊。输了，亲我一口。”\n他设下赌局，诱她步步深入\n“小公主，我赌你不敢亲我。”\n“我赌你会为我心动。”\n“我赌你这辈子，逃不掉。”\n-\n赛车场上，楼逍夺冠，当着直播镜头将奖杯塞进京念怀里：“聘礼。”\n宴会上她受辱，他当众碾碎对方手腕，笑得冰凉：“我惯的，有意见？”\n深夜暴雨，他翻遍全城，只为她一句想吃\n兄弟调侃他栽得彻底，他却转着无名指上的戒指，哼笑：我乐意\n直到楼逍当众搂住京念的腰：“介绍下，这是我家祖宗。”\n“追了我好久我才答应。”\n当夜，京念哭笑不得将他按在沙发上：“谁追谁？”\n楼逍低笑翻身，握住她脚踝轻吻：\n“我追你。”\n“从你七岁为我打架那天起，这辈子就栽了。”\n“所以宝贝。”\n他气息灼热：“这次，换你在上面。”", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双洁", "位尊权重"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "他的盛夏热恋", "fullTitle": "他的盛夏热恋", "link": "https://fanqienovel.com/page/7603710153967275033", "data": [16.22, 16.41, 16.51], "trend": 0.29, "latest": 16.5, "wordNumber": 434718, "creationStatus": 0, "desc": "已签出版\n乖巧病弱VS懒淡拽哥\n微群像+双洁甜宠+日常慢热\n谈斯礼，为人冷痞又狂妄，顶着一张顶级皮囊，浑身散发着恣意随性，是学校里当之无愧的风云人物\n姜枳转学来到沪城一中，被爆料是个天才少女，刚入学就出了名\n第一次见到谈斯礼，听到他那声音觉得有几分耳熟，她没忍住多看了两眼\n*\n见面第一天，少年脸上笑意懒散，不达眼底，他掀了掀眼皮，歪首戏谑：“妹妹？还满意吗？”\n姜枳愣了下，下意识回道：“满意。”\n谈斯礼只觉得这人有点呆\n后来，他将人圈抱在怀内，亲的她喘不过气\n在她呼吸的间隙，少年在她耳边低笑，腔调懒洋洋的，嗓音暧昧又蛊人\n“宝宝，这么喜欢我的声音，我喘给你听好不好？”\n*\n提起谈斯礼，所有人对他的评价都是很拽一男的，不知怜香惜玉为何物\n直到联谊晚会那天，他们看着一向散漫高傲的少年弯下腰，用着他们从未听过的温柔语调，轻哄着怀里的女孩\n“不哭了好不好？”\n“要不…我给你当男妈妈？”\n*\n再后来，姜枳不告而别\n谈斯礼提前保送，再也没来过学校\n再见到他时，是在几年后的同学聚会\n他还是那个天之骄子\n当包厢门再次被推开，众人愣住了\n下一秒，只见男人上前将人揽在怀里埋在她的颈侧，委屈撒娇\n“老婆，怎么来的这么晚。”\n众人：？\n怎么跟他们想的不太一样？", "tags": ["青春甜宠", "现代言情", "天才", "甜宠", "双洁", "群像"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春夜禧雨", "fullTitle": "春夜禧雨", "link": "https://fanqienovel.com/page/7614900434636917784", "data": [30.52, 30.65, 30.56], "trend": 0.04, "latest": 30.6, "wordNumber": 312803, "creationStatus": 0, "desc": "【甜宠＋双洁+占有欲+双学霸＋蓄谋已久】\n高三最后一个学期，江枳初住进徐家，遇见了徐津年。\n初次见面，少年眉眼间尽是疏离，冷声和她划界线，定下两点要求。\n所有人都以为，这两人私下绝对毫无交集。\n江枳初也以为，自己和徐津年就像交叉线，不同方向而来，在某个节点短暂相遇，日后只会渐行渐远，再无交集。\n然而，后来——\n“我要你。”徐津年步步紧逼，“江枳初，拿你自己赔我。”\n“既然答应了，可不能反悔。别人恋爱期间做的事，我们也要有。”\n…\n聚会上，有人当众向江枳初告白。\n江枳初愣住之际，众目睽睽下，徐津年偏头吻在她嘴角，轻笑低语：“不拒绝吗，我的女朋友。”\n众人一脸震惊。\n…\n徐津年：“宝宝，喜欢我好不好。我的人，我的钱，我的一切都是你的。”\n这段关系开始，他就没想过要结束。\n【是徐津年让江枳初知道，有的爱是“润物细无声”，爱在灵魂生根。】\n【早在多年以前，原来我们曾见过】\n【这是一个“念念不忘，终有回响”的故事。】", "tags": ["青春甜宠", "现代言情", "校园", "学霸", "甜宠", "双洁"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿成男主的拜金前女友被亲懵了", "fullTitle": "穿成男主的拜金前女友被亲懵了", "link": "https://fanqienovel.com/page/7631009218320944152", "data": [21.35, 23.8, 24.83], "trend": 3.48, "latest": 24.8, "wordNumber": 424529, "creationStatus": 0, "desc": "（评分刚出，后面会涨）【甜宠+双洁+1v1】\n姜棠穿进了一本校园文，成为男主的拜金前女友。\n男主是物理学天才，家世顶尖，清冷禁欲，谈恋爱都是柏拉图模式，妥妥的高岭之花。\n姜棠穿进来后觉得剧情好眼熟，这不是她学物理学的发疯的好闺闺写的文吗？\n当时好闺闺问姜棠要不要客串角色。\n姜棠说要，她要做男主的拜金前女友，男主完全不爱她，一个月只见一面，但副卡随便刷，分手还会有九位数的巨额分手费。\n好闺闺大手一挥同意了。\n姜棠现在就是这位前女友，她需要维持拜金值，每天狂刷男主的卡，等待分手后拿到巨额分手费。\n但是男主说好的柏拉图呢？\n第一次约会刚牵手就搂腰，第三次约会要抱抱，第五次约会竟然想亲亲？\n姜棠都不敢想他以后还想做什么。\n她觉得一定是她维持人设的方式不对。\n她努力娇蛮任性，每天99+消息轰炸，男主总该对她厌烦了吧？\n男主看她的眼神怎么越来越深了。\n女主终于出场。\n姜棠主动提分手，清冷禁欲的男主开始发疯，她被抱着亲懵了。", "tags" Number": 600133, "creationStatus": 1, "desc": "【八零年代+女强+学霸+商战+香港】\n前世的她过目不忘的脑袋配了颗随时停摆的心脏；\n心脏停跳那刻，她想：下辈子，不做人了。\n再睁眼，她叫林颖，九岁，痴傻九年，今日魂归。\n师婆掐算过三次：\"不会再走了。你本来就是你，只是被放错了地方。\"\n她成了八零年代香江西环一间裁缝铺里痴傻九年的小女孩：林颖。\n老窦是从G省偷渡来的入赘木匠，老母踩着缝纫机和老窦一起养活一家四口。\n九岁，魂归香江。前世满腹经纶无处施展，这世她有了一副能跑能跳的身体。\n\"阿公，我想读书。\"\n\"好！你想读到几时，阿公就供到几时！\"\n官校不能跳级，私立学费要命，一个一天学没上过的九岁女孩，装了十八年知识的脑子，一颗终于不会停摆的心脏，和一家子拼了命也要托举她的人。\n从裁缝铺到港岛写字楼，从西环旧唐楼到半山豪宅：这个被老天放错了地方的女孩，要在这座黄金遍地的城市里，亲手造出一个商业帝国。\n前世欠她一副好身体，今生还她一个盛世香江。\n【大女主文，本书叙事核心重头到尾都是女主，该书看的是女主是否能掌控自己人生与事业，不是统计书中有几个男配角色！作者不会为了迎合极端观点消除所有男性！所有配角都是推动剧情的需要！】", "tags": ["年代", "现代言情", "学霸", "女强", "前世今生", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "纯情傻子是军官？大小姐娇宠他", "fullTitle": "纯情傻子是军官？大小姐娇宠他", "link": "https://fanqienovel.com/page/7593263178578938942", "data": [26.09, 27.18, 28.18], "trend": 2.1, "latest": 28.2, "wordNumber": 1045398, "creationStatus": 0, "desc": "【年代+爽文+赚钱+家长里短】\n许昭昭死后才知，她是被人换命的假千金！\n徐家把她换掉，就是为了夺走她的富贵气运！\n一朝觉醒，许昭昭绑定好感度系统，可以换粮，换药，换物资，直接开挂！\n    为夺回气运，她果断下乡投奔亲爹娘。\n    亲爹亲娘：“闺女是心头肉，谁也不能委屈她！”\n    哥哥们：“妹妹想要啥，哥都给你弄来！”\n    弟弟：“我保护姐姐！”\n    她带着全家搞钱，挖野味、赚工分，日子越过越红火，全村都羡慕哭！\n    半路还捡了个小傻子：长得帅、力气大、听话又护短，见她就喊：媳妇！\n    许昭昭：…… 别过来啊！\n    可傻子只黏她、只听她、只护她，夜里还会红温黏着她不放。\n    她索性嫁了，日子甜如蜜。\n    直到某天，傻子恢复神智。\n    他非但不是傻子，还是身份显赫的大佬！\n    沈寂恢复记忆，被迫返回军区。\n    许昭昭毅然挺着孕肚，千里奔赴军区寻夫。\n    众人等着看她的笑话。\n    却在看见沈寂在见到她的瞬间，卸下所有防备。\n    “媳妇，我这辈子、下辈子，都是你的小傻子。” \n    夺气运？换人生？谁也别想拿捏我！", "tags": ["年代", "现代言情", "乡村", "系统", "护短", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宋老太重生，渣男私生子都滚开", "fullTitle": "宋老太重生，渣男私生子都滚开", "link": "https://fanqienovel.com/page/7573537639983238169", "data": [26.83, 27.58, 28.42], "trend": 1.59, "latest": 28.4, "wordNumber": 1862188, "creationStatus": 0, "desc": "（无系统空间，无CP，家长里短，海边美食，女人互助，送渣男去坐牢改造）\n八十岁的宋香兰，儿孙满堂，却活成了一个笑话。\n她为了丈夫，为了儿女，操劳一生，奉献出自己的全部，\n没想到临了的时候，丈夫为了白月光要和她离婚，还逼她净身出户。\n宋香兰来不及愤怒，更诛心的真相被揭开。\n原来她疼爱了大半辈子的儿子是丈夫和白月光所生，而被自己厌弃的、已英年早逝的养子才是自己的亲儿子。\n愤怒之下，她点燃瓦斯，和所有人渣同归于尽。\n再睁眼，宋香兰回到了1977，一切都还来得及。\n这一世，谁敢让她不痛快，她就让谁双倍不痛快！\n她要手撕渣男贱女，脚踢白眼狼野种，独宠亲生子女！搞钱！搞钱！再搞钱！", "tags": ["年代", "现代言情", "重生", "无CP", "虐渣", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [35.17, 36.18, 36.67], "trend": 1.49, "latest": 36.7, "wordNumber": 494226, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零知青娇弱可人？刀刀要你狗命", "fullTitle": "七零知青娇弱可人？刀刀要你狗命", "link": "https://fanqienovel.com/page/7606648925205826584", "data": [21.0, 21.73, 22.44], "trend": 1.43, "latest": 22.4, "wordNumber": 834823, "creationStatus": 0, "desc": "【已完结，放心入坑】\n重生七零年代＋抄家＋空间＋白切黑女主＋男女双强＋下乡知青＋科技助国＋军婚＋甜宠＋恋爱脑兵王＋爽文＋双洁\n23世纪武术冠军魂穿七零，一睁眼就遇上抄家惊魂，原主被活活逼死。\n她携带异宝重活一世。\n父母双双牺牲，家产被窥，革委会频频上门刁难？\n她连夜端了革委会老巢，洗劫仇家，卷走滔天财富潇洒下乡。\n本想苟着搞钱搞科研，却意外撞破祖辈惊天秘辛，一路遭人截杀。\n人前软萌娇弱小知青，人后狠辣能打白切黑。\n谁料被冷面兵王一眼盯上，从此黏人属性彻底爆发。\n风行止：看着香香软软，想娶回家疼。\n下一秒见她把人揍飞：……更爱了，又飒又野！\n恋爱脑兵王天天贴贴，白切黑女主一言不合就动手。\n她搞科技强国，他做最强后盾。\n男女双强，军婚高甜，从下乡知青飒到京城顶层！", "tags": ["年代", "现代言情", "重生", "空间", "强强", "白切黑"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "村女吴秀丽", "fullTitle": "村女吴秀丽", "link": "https://fanqienovel.com/page/7614505261746621502", "data": [39.76, 40.3, 40.82], "trend": 1.07, "latest": 40.8, "wordNumber": 584415, "creationStatus": 1, "desc": "20岁的村女秀丽，在男友刚子大学入学前一天，失身于刚子，秀丽追随男友到了城里打工，然而，进城后发生的一件件事，让秀丽寒透了心，秀丽决定重新审视她与刚子的感情。在感情不如意的同时，秀丽的生活也陷入了困境，这时，大学教师许云峰走进了秀丽的生活，慢慢地两人陷入爱河。", "tags": ["年代", "现代言情"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [36.78, 37.43, 37.27], "trend": 0.5, "latest": 37.3, "wordNumber": 829466, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [21.99, 21.96, 22.2], "trend": 0.21, "latest": 22.2, "wordNumber": 755158, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "妹宝投亲认错哥，被冷面首长亲哭", "fullTitle": "妹宝投亲认错哥，被冷面首长亲哭", "link": "https://fanqienovel.com/page/7619239630935706686", "data": [20.79, 21.15, 20.95], "trend": 0.16, "latest": 21.0, "wordNumber": 805370, "creationStatus": 1, "desc": "漫剧《妹宝睡错房开局撞上大魔王》已上线，番茄红果搜索可看。\n乔欣欣是乔家刚认回来的真千金。\n假千金乔明珠为了不嫁给因任务残废的未婚夫，在认亲宴上，给她灌酒，将她送到了自己未婚夫床上。\n却没想到，她走错了房，和乔家死对头那优秀到人神共愤的儿子一夜荒唐。\n她连夜逃走，那男人到处寻找。\n假千金为了不嫁给那残废未婚夫，茶言茶语，全家逼迫她替嫁，她只能去投奔养父母家的大哥。\n然而，投奔当天，十年没见的大哥帅到她快认不出来了！\n但为了和大哥打好关系，她决定拿出自己看家本领——撒娇！\n但是……这男人怎么看着她的眼神那么不对劲呢？\n乔欣欣一直到后来才知道，原来她哥执行任务去了，作为她哥的好兄弟，某位年轻的首长大人亲自照顾她。\n但是……这男人好眼熟呀？\n嗯？他身上怎么有乔家死对头特有的家族胎记？\n不对！她好像是那天和她发生关系的人？", "tags": ["年代", "现代言情", "空间", "穿书", "真假千金"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [24.25, 24.17, 24.4], "trend": 0.15, "latest": 24.4, "wordNumber": 1087799, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "悬疑脑洞": [{"label": "全民躲猫猫：疯批美人她满级天眼", "fullTitle": "全民躲猫猫：疯批美人她满级天眼", "link": "https://fanqienovel.com/page/7615645509008493593", "data": [88.88, 90.05, 91.76], "trend": 2.87, "latest": 91.8, "wordNumber": 664338, "creationStatus": 1, "desc": "【游戏入侵+躲猫猫+直播+女主+无CP】\n核战之后，蓝星已成焦土，躲猫猫是人类唯一的希望。\n全球躲猫猫游戏降临，被选中的人将代表国家出战，胜则抽取奖励，败则领土沦陷！\n当龙国第四十四轮参赛者林岁安出现时，弹幕哀嚎：\n“穿病号服？踩着拖鞋？完了，龙国气运已尽！”\n然而，当其他选手躲在柜子里瑟瑟发抖时，林岁安在诡异眼皮子底下吃小蛋糕；\n当小鬼子被诡异镰刀腰斩时，林岁安在窗外卡BUG逗诡异玩。\n全世界都疯了：“让你去和诡异躲猫猫，你在这儿当自家后花园呢？”\n林岁安拎着刚抢来的神秘道具，歪头一笑：“不好意思，精神病院住久了，看谁都像好人。”\n-----\n【排雷：1.没那么惊悚；2.私设，诡异不是中式诡异，均为改造形态；3.文中有鬼魂，但不是诡异。】", "tags": ["悬疑脑洞", "悬疑", "直播", "灵异", "无CP", "惊悚游戏"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "在恐游里找男友是不是哪里有问题", "fullTitle": "在恐游里找男友是不是哪里有问题", "link": "https://fanqienovel.com/page/7466850081275120664", "data": [19.64, 20.62, 21.21], "trend": 1.56, "latest": 21.2, "wordNumber": 320717, "creationStatus": 0, "desc": "夏渺被扔进了奇奇怪怪的世界。\n系统给提示:【那个能够让你一眼就记住的，就是你要恋爱的攻略对象。】\n可笑。\n她堂堂夏家大小姐，只有别人来追求她，讨好她的份，哪有她送上门去攻略别人的道理？\n于是——\n在红月校园，脸上缠满绷带的少年笑嘻嘻的将校园化作炼狱，尽情享受恐惧。\n她指着对方趾高气扬的说:“本小姐看你长得不错，给你追求我的机会。”\n少年一惊，抓紧绷带，“我长得不错？”\n在诡异大学，面容昳丽好似艳鬼一般的怪物无处不在，藏身在各个角落里的身体与他一起窥视可怜的猎物。\n夏渺双手抱臂，不可一世，“虽然你每天看起来都有些不一样，但看你这么辛苦跟踪我，讨人喜欢的份上，给你一次机会追求我吧！”\n他们一起红了脸，“我讨人喜欢！？”在幽暗医院，怪物将多余的六条腿藏在干枯的皮肤里，耳朵上的红宝石耳钉犹如复眼，朝着美味的猎物目露贪婪。\n夏渺揪住了他的耳朵，气焰嚣张，“我好像对你一见钟情了，所以你来追求我吧！”\n怪物害羞结巴，“一一一见钟情？”\n许久，系统上线，沉默良久，【我让你攻略男人，你都干了啥？】\n夏渺:“你就说这个恋爱谈没谈成功吧！”\n系统:【我说的重点是人，你男朋友是人吗！】\n夏渺:“啊？”", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "大小姐"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宿舍求生，请活下去！", "fullTitle": "宿舍求生，请活下去！", "link": "https://fanqienovel.com/page/7519082784455937086", "data": [8.35, 9.11, 9.88], "trend": 1.53, "latest": 9.9, "wordNumber": 604053, "creationStatus": 0, "desc": "【无cp+成长+求生+塔防】\n白萧穿越到了宿舍求生游戏，六点夜幕降临之后，宿舍是唯一安全的地方。\n宿舍走廊外是沉重的脚步声和怪物的嘶吼，它们随时会破门而入，将宿舍内的人类吃干抹净。\n唯一活下去的办法就是升级宿舍大门，升级炮塔，升级小床。\n白萧想活下去，她一定要活下去。\n\n……\n目前主角团人：\n女：百病全消（白萧）、十八岁保洁阿姨、摇曳的百合花、我能活吗、风度翩翩的翩、仙气飘飘小师妹\n男：维水泱泱、炸毛狮王\n排雷，介意误入：\n1、角色：遍地飘零（gay）\n2、非全女文，有男配角。\n3、求生文，会有角色死亡。", "tags": ["悬疑脑洞", "悬疑", "灵异", "无限流", "穿越", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宿舍求生：开局加入诡异管理群", "fullTitle": "宿舍求生：开局加入诡异管理群", "link": "https://fanqienovel.com/page/7623619349001014334", "data": [18.09, 18.58, 19.53], "trend": 1.43, "latest": 19.5, "wordNumber": 758119, "creationStatus": 1, "desc": "【无CP+爽文+塔防+猛鬼宿舍+求生游戏+全榜榜一+萌宠+大佬】\n\n　　江浸月在即将签署家人《手术知情同意书》的下一秒，眼前一黑被拉入宿舍求生游戏。\n\n　　夜晚七点一到，门外开始出现恐怖的诡异，它们在走廊上游荡，时刻准备破门而入。\n\n　　活下去的唯一方法就是升级宿舍大门，升级武器炮台，开门抢夺宝箱。\n\n　　永冻深林、幽灵诡船、规则怪谈、欲望赌场、太平医院……\n\n　　江浸月手握【诡异管理群】游走在诡异与玩家之间，售卖消息，抢占先机，坑蒙拐骗，本来只想活着走出去，结果却不知不觉成了全榜榜一。\n\n　　无C 意共生。\n江离：我从地狱回来，只为扒开所有没被审判的罪。\n凌执：地狱太黑，往后光明，我陪你一起走。\n\n✨高燃双强互钓｜连环凶案反转不断｜全员助攻｜前世今生宿命拉扯｜全程无虐HE", "tags": ["女频悬疑", "悬疑", "重生", "推理", "破案", "悬疑恋爱"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三嫁阎君", "fullTitle": "三嫁阎君", "link": "https://fanqienovel.com/page/7588095605168163865", "data": [8.36, 8.63, 8.93], "trend": 0.57, "latest": 8.9, "wordNumber": 501829, "creationStatus": 1, "desc": "二十岁这年，我爸给我抢了一桩人人都惧怕的婚事。\n婚期定在七月十五，鬼节，而我要嫁的他……\n也不是人。\n只因我出生就没有心跳，是我爸用秘术吊着我的命，只有和这个神秘老公结婚才能得一线生机。\n成婚当天夜里，漫天飞舞的纸钱中，诡异的纸人携着八抬凤辇从天而降。\n我代替了同村少女成为了他的妻。\n结婚后，父亲诡异失踪，留下一本《世间百鬼录》，从此我携百鬼录踏入了奇幻诡谲的世界。\n千年尸王是我的保镖，万年灵物成为我的法器，渡灵扇在手了却世间万千执念，灵愈之力治愈三界山精鬼怪，我成为世间独一无二的渡灵师。\n而我的那个神秘老公，他说娶我非他所愿，等到约定期限一到，他便给我自由并赐予我长命百岁。\n我欣然接受，离婚而已，可以再嫁。\n可是……\n我都三嫁了，新郎怎么还是他？", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱", "风水秘术"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心理解剖者", "fullTitle": "心理解剖者", "link": "https://fanqienovel.com/page/7277923354739215422", "data": [18.06, 18.27, 18.41], "trend": 0.35, "latest": 18.4, "wordNumber": 548133, "creationStatus": 0, "desc": "〔已签约出版〕\n天才女法医 VS  硬汉刑警队长  \n[悬疑+推理+甜宠+高智商犯罪+连环杀人案+心理侧写+胆小可入]\n原书名:《心理解剖者》\n精神分裂、反社会人格、高智商犯罪……这是个变态横行的世界。\n猫胎人案、情侣屠夫、死亡天使……罪恶的妄想总是伴随暴力侵入现实。\n尸体是人性的X光片，照见一切罪恶。与死人对话者，终会被生命拥抱。\n第一次见面\n沐眠很真诚地问道:你好，请问你可以把你的遗体捐给我吗?\n后来\n方睿:如果我跟受害者的尸体一起掉水里了，你会先救哪个?\n沐眠:你！\n方睿有些意外地看着她。\n沐眠:因为尸体会自己漂起来~", "tags": ["女频悬疑", "推理", "天才", "破案"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：在张家打黑工的日子", "fullTitle": "盗笔：在张家打黑工的日子", "link": "https://fanqienovel.com/page/7438426163896142910", "data": [4.75, 4.87, 4.98], "trend": 0.23, "latest": 5.0, "wordNumber": 2443250, "creationStatus": 1, "desc": "【别名：张家列传】\n【男主无CP+张家人+世界融合+无系统+非爽文+救张海侠、阿宁、潘子等等所有人(包含南部档案馆、老九门、本传、雨村、藏海花等剧情】PS：非常重要！！！这本书是以原著为底写的！！！所以求求不要因为这件事而差评了……(力竭)\n张海桐因工作猝死穿成盗笔世界一个张家外家人，从此开始兢兢业业打黑工，勤勤恳恳做牛马的苦逼 弃娇贵趁她男友受伤昏迷丢弃。\n\n 好在天无绝人之路，她遇见了她姐姐的校友，不管三七二十一她直接叫姐夫认关系！\n\n她装乖示弱扮可怜，泪眼婆娑黏上大腿。\n\n姐夫，你们不会不管我吧？\n\n中途又遇见找她两年的竹马团。\n\n就是男人太多，每天都在争风吃醋，想着干掉对方。\n\n后面她找到了已经成基地长的姐姐，果断甩掉了他们，开启啃姐模式。\n\n只是为什么她那个被她单方面分手的男友也在这里？？？", "tags": ["科幻末世", "末世", "囤物资"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世文恶毒女配？嚣张一日是一日", "fullTitle": "末世文恶毒女配？嚣张一日是一日", "link": "https://fanqienovel.com/page/7478769464138288153", "data": [29.19, 30.12, 30.84], "trend": 1.64, "latest": 30.8, "wordNumber": 1532131, "creationStatus": 0, "desc": "（已出版）[女主回归+空间+位面交易+丧尸晶石+变异动植物]\n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局天灾，我靠囤百亿物资躺赢", "fullTitle": "开局天灾，我靠囤百亿物资躺赢", "link": "https://fanqienovel.com/page/7123103859110579213", "data": [15.73, 16.49, 17.09], "trend": 1.36, "latest": 17.1, "wordNumber": 1325784, "creationStatus": 0, "desc": "【末世+重生+空间+囤货+宠物+日常向】\n（实体出版中，短剧、动态漫已上线）\n末世天灾，适者生存。\n台风，洪水，极寒极热，地震，海啸，虫灾，酸雨……\n在末世挣扎求生三年，最终却落得惨死的姜宁，重生到末世前三天抢占先机夺回空间，开启疯狂囤货模式。\n买买买，囤囤囤，找回前世救她性命的狗子。\n磨好刀，囤好粮，挨个收拾渣男贱女们，有仇报仇有恩报恩。\n当天灾来临，她右手握刀左手撸狗，在文明丧失道德沦陷的末世中乘风破浪！", "tags": ["科幻末世", "重生", "空间", "末世", "虐渣", "囤物资", "打脸", "前世今生", "天灾"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "采集技能怎么了，我可采万物", "fullTitle": "采集技能怎么了，我可采万物", "link": "https://fanqienovel.com/page/7549109392579234841", "data": [10.66, 11.13, 11.63], "trend": 0.96, "latest": 11.6, "wordNumber": 1003183, "creationStatus": 0, "desc": "【废土求生】【天灾】【异能】【采集术】【无CP】【女强】\n   \n 异世废土，魔物入侵，大地皲裂，无数怪物涌入。\n十八岁的安然艰难求生，某天忽然发现，自己的技能有很多神奇之处，但凡用技能采来的植物与果实，不仅没有丝毫污染，还带着某种神奇功能。\n   叮！采集成功，你获得一颗五阶变异红薯，吸收可永久增加一点体质。\n   叮！采集成功，你获得六级变异葫芦，可储存一立方物体。\n  \n  叮！采集成功，你获得三阶小兽袋，可储存五立方体积物体。\n   叮！你得到一根狼牙......\n   叮！你得到2点力量属性......\n\n  安然震惊。\n   自己的技能竟然可以对其他生物施展，包括人类，明明就是采集技能，为何会有妙手空空的既视感？\n可没多久，灭世浩劫来临，魔物入侵，海水蔓延整个星球，自己必须收集材料制作浮空岛......", "tags": ["科幻末世", "末世", "女强", "无CP", "打脸", "天灾"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书：末世小透明被男主缠上了！", "fullTitle": "穿书：末世小透明被男主缠上了！", "link": "https://fanqienovel.com/page/7551707820933008408", "data": [10.75, 11.15, 11.36], "trend": 0.61, "latest": 11.4, "wordNumber": 562275, "creationStatus": 0, "desc": "【空间雷系甜酷少女VS分身火系嘴强拽哥】\n末世丧尸+异能+穿书+双c+团队+甜宠\n绝症少女诗染穿成了一本末世小说的路人甲。哦，所以她带着这个与她半毛钱关系都没有的剧本穿书的意义是？\n诗染：果然，我不是无路可走，我还有死路一条。\n孩子只能哼哧哼哧的收集物资，准备带着闺闺去实力强劲的苍松基地养老。\n什么？比女主先遇上主角团？\n这个还没到末世就能玩火的异能大佬，不是男主是谁？这不巧了，你们去基地找女主，俺和俺闺要去讨生活。\n一拍即合的蹭车，跟着主角团一路上吃香的喝辣的，哦不，脚踩丧尸提升异能充实空间。到地方就一拍两散的下车，准备开启躺平人生！\n周诺尘：车门锁死\n……\n 来Y省做任务，遇上女流氓就算了，一起组队就算了，想分开？呵，这个可不能算了\n诗染还没准备跑路就被男人逼到墙角，唇不安分的轻贴她的脖颈，微微喘息：\n“染染，他叫你姐姐，你该不会喜欢绿茶吧？”\n诗染：他本来就比我小\n“跟我走好不好？”\n诗染：贴这么近，不走你要咬死我吗？\n唇移耳畔，嗓音低沉：\n“姐姐，选我，我保证能比他更让你满意。”\n靠，谁来管管他！\nPS：避雷贴在第一章作者说，原书实际无女主，双洁！", "tags": ["科幻末世", "空间", "末世", "甜宠", "穿书", "囤物资"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "弱智就弱智吧，我照样星际最强！", "fullTitle": "弱智就弱智吧，我照样星际最强！", "link": "https://fanqienovel.com/page/7622869871344241689", "data": [15.14, 15.36, 15.63], "trend": 0.49, "latest": 15.6, "wordNumber": 800182, "creationStatus": 1, "desc": "【无cp】孔淼一朝穿越，成为了星际幼崽。\n被好心人送去上学时，孔淼看着周围随处可见的机甲两眼冒光，她飞快地接受了新身份，并摩拳擦掌决定大干一场立志成为一名出色的机甲手……然后差点没通过入学检测。\n校方：“精神力为0，疑似弱智。”\n孔淼：“……啊？”\n……\n军校大比拉开序幕，由于参赛人数不足，校方心一横，将复健了几年的弱智孔淼也塞了进去凑数。\n校方：“别有压力，重在参与，输赢也不是很重要。”\n孔淼：“哦哦。”\n比赛开始，孔淼开着初始机甲原地表演自杀。\n校方：“……”\n比赛中期，种子选手一个接一个地被淘汰，场上只剩孔淼还在挑战自我。\n校方：“……”\n比赛收尾，终于适应了机甲的孔淼磕磕绊绊地开着机甲出去收割了场上剩余人头。\n校方：“……？！”\n啊？赢了？？？\n**\n联盟举办的大型赛事中，一位横空出世的手操机甲手以出色的作战意识、漂亮流畅的操作技术以及出其不意的作战风格惊艳整个联盟。\n记者：“手操机甲手的魅力在您身上体现得很彻底，赛中看您多次挑战精神力极限迎敌，平时训练精神力一定很辛苦吧？”\n孔淼挠头：“没有吧……我是弱智来着。”\n记者：“……”\n被打败的众军校生：“……”\n翌日，星网大头条：《星际最强教您重新定义“弱智”》。", "tags": ["科幻末世", "穿越", "星际", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真公主？不，真君主！", "fullTitle": "真公主？不，真君主！", "link": "https://fanqienovel.com/page/7517228824212278334", "data": [12.23, 12.43, 12.6], "trend": 0.37, "latest": 12.6, "wordNumber": 947311, "creationStatus": 1, "desc": "（无CP+大女主+前期军校争霸+后期一统人族+热血）\n问：从君主幼年体到完成体要几步？\n幼年体凌昭：孤儿院开局，疑似金手指的游戏芯片还一直拖后腿。\n完成体凌昭：后星际第一人·第一指挥官·神级星者·人族的希望·神迹计划唯一继承者……\n后星际时代，异兽大肆入侵，帝国统治式微。在人人唱衰皇室的情况下，一个遗漏在外的公主默默绑定【万国狩猎场】的游戏芯片。\n在这里，她将作为帝国唯一继承人，以子民信仰为准入券，和其它生物进行比赛，从而赚取奖励。\n于是，卷王之旅正式开启。\n三十六校联赛冠军？拿来吧。\n天骄突围赛冠军？拿来吧。\n皇室身份、君主之冕、丢失的蓝星、散乱的人族大军？统统拿来吧。\n起初，凌昭的梦想是白塔市最强者，后面稍微提升了点难度，想成为帝国最强者。再后面，她不知不觉登顶万国狩猎场，一个顺手就把游戏芯片玩崩了。\nN年后，被揍到鼻青脸肿的宇宙诸国：你们当初惹她干嘛？\n全人类：再渺小的人类，也有在浩瀚宇宙里留下痕迹的权利。今天也是朝伟大君主前进的一天！\n（我流星际文，世界观私设颇多，非机甲体系，略慢热；前期军校和军营版图为主，后期游戏和宇宙诸国版图为主）", "tags": ["科幻末世", "穿越", "星际", "无CP", "异世穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全民求生，我成了万年老二", "fullTitle": "全民求生，我成了万年老二", "link": "https://fanqienovel.com/page/7567215449079811097", "data": [8.92, 9.09, 9.28], "trend": 0.37, "latest": 9.3, "wordNumber": 823819, "creationStatus": 0, "desc": "【无cp+囤货+无限流+天灾+有队友+美食+微恐】\n【刚开分，慢慢会长的，走过路过不要错过，进来看看吧～】\n　　作为群居动物的人类都知道，在一众榜单中，你能记住榜一，因为他可能是领头的羊，善战的狼，敏捷的豹，远见的鹰。\n　　你也能记住老六，因为他就是搅屎的棍，划水的鱼，装饭的桶，退堂的鼓。\n　　但你唯独记不住老二，这个实力不祥，名字不详，登上榜单好像只是为了凑数的存在。\n　　上一世李橙子先是成为老六在求生游戏中搅了个天翻地覆，随后成为榜一。\n　　享年25，卒！\n　　重活一世，她发誓要苟成榜二，做路人甲，做大众脸，在无人在意的角落里，默默发展。\n然而随着她来到1区，不断闯过一个又一个城市，她发现事情没有她想的那么简单，这款求生游戏的终点不是个人的生死而是种族的较量。\n有比较搞笑的部分，有比较压抑的部分，非温馨轻松向。", "tags": ["科幻末世", "重生", "末世", "美食", "无CP", "囤物资"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世降临，我靠种田带室友杀疯了", "fullTitle": "末世降临，我靠种田带室友杀疯了", "link": "https://fanqienovel.com/page/7497410581733854233", "data": [11.79, 11.91, 12.11], "trend": 0.33, "latest": 12.1, "wordNumber": 1546062, "creationStatus": 0, "desc": "【末世游戏+多位面+群像文+种田+无CP+囤货】\n【作者不看书评，偶尔看段评】\n简介：\n末世游戏降临，全校宿舍沦陷，许可望凭借一个梦带室友提前囤货，成功全部解锁职业技能。\n可谁能告诉她，哪个好人的职业是疯狂戴夫？\n能当子弹的花生，能吃异虫的含羞草，吃了能进入无敌状态的小番茄……\n室友们表示：你尽管种，怪我们杀，架我们打，土地我们给你抢！\n极寒、虫灾、洪涝、酷热、丧失、人造人，无论多难解决的世界，在许可望眼里都不是事儿，她靠一只铁铲，一块地，带全寝室杀穿末世。\n1.前期求生，解锁职业后开启种田。\n2.群像文，其他室友占据一定篇幅，孤狼设定爱好者慎入。\n3.非无脑爽文，成长需要时间。\n4.不要骂人。", "tags": ["科幻末世", "末世", "女强", "无CP", "囤物资", "群像"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际：逼我退学？反手造S级机甲", "fullTitle": "星际：逼我退学？反手造S级机甲", "link": "https://fanqienovel.com/page/7547238651487341593", "data": [18.5, 18.5, 18.67], "trend": 0.17, "latest": 18.7, "wordNumber": 1219948, "creationStatus": 1, "desc": "【星际+搞笑+学院+比赛+机甲制造+经营+无CP】\n机甲女王沈昭蕴重生三百年后。\n老师问：“你怎么评价创造联盟第一台机甲的沈昭蕴？是什么驱使她创造出世界上第一台机甲？”\n沈昭蕴答：“她有点小聪明，穷，抠门，爱财……\n为什么创造出机甲？因为怕死！”\n老师狂怒口水飞喷，“错！错！错！你学到狗肚子了吗？\n请看VCR！\n《沈昭蕴个人回忆录》，第一百九十三页，写了沈昭蕴背身站立，望月兴叹：血债就要血偿，伟大的胜利是需要牺牲，在血仇面前，个人利益微不足道。\n《沈昭蕴个人回忆录》，第一百九十四页，记载了沈昭蕴夜半起武吟诗，黄沙百战穿机甲，不破异兽终不还……\n这样的沈昭蕴应该是坚强，勇敢，无私，伟大的！”\n沈昭蕴越听越奇怪，这……是我吗？", "tags": ["科幻末世", "重生", "星际", "无CP", "前世今生", "搞笑轻松"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世：我一个炮灰，坏一点怎么了", "fullTitle": "末世：我一个炮灰，坏一点怎么了", "link": "https://fanqienovel.com/page/7485991648128666648", "data": [11.51, 11.65, 11.62], "trend": 0.1, "latest": 11.6, "wordNumber": 1132085, "creationStatus": 0, "desc": "[女频文＋空间＋丧尸晶核＋群像＋异能＋动植物变异。]\n\n鹿南歌穿书了，穿成了末世文里的炮灰——男配早死的妹妹！\n原书中，鹿南歌之所以有名字，仅仅是因为男配会时常拿出全家福思念家人。\n男主偶然看到照片，顺口问了一句，还夸赞了她。\n没想到，就因为这一句夸赞，这个炮灰角色成功成为了读者心目中的娇软白月光！\n毕竟，一心扑在事业上的男主，自始至终都只夸过鹿南歌。\n...\n穿书来的鹿南歌，开局就是 \n表妹也取代了她的地位。骆宁的父母、兄长疼她、祖母赏识她；就连骆宁的竹马，也暗慕她，说她处处比骆宁优秀。\n骆宁大闹，他们联手害死了她。\n做鬼十八年，看到了他们的下场，她重生了。\n她又活了。\n这次，她想要活得痛快。\n——*——*——\n骆宁重生后为复仇，找摄政王做靠山。\n“明面上你是雍王妃，实际上你是本王之奴。他日，助你假死脱身，更名换姓。封你为郡主，有封地、俸禄，同郡王。”\n她同意了。\n她镇得住侧妃、斗得赢野心勃勃的门阀、哄得了太后。\n几年后，摄政王成了新主。\n跋扈狠戾的年轻帝王，用很缥缈的声音问她：“郡主印换皇后金印，可愿意？”\n她忠诚听话，头一回忤逆他：“不愿！”\n—*—*—\n原书名：《侯府忘恩义？摄政王撑腰，不原谅》", "tags": ["宫斗宅斗", "古代言情", "重生", "王妃", "前世今生", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书：侯爷，夫人又给你纳妾了", "fullTitle": "穿书：侯爷，夫人又给你纳妾了", "link": "https://fanqienovel.com/page/7563282810547473433", "data": [33.4, 33.92, 34.21], "trend": 0.81, "latest": 34.2, "wordNumber": 1014007, "creationStatus": 0, "desc": "穿书+宫斗宅斗+重生的儿子+爽文+躺平的一生\n争家产大获全胜的林嫣然，因为太高兴参加极限运动摔死了，有幸穿到了一本她看过的小说里，她成了因为小说男主养外室抑郁而死的正室女配。\n书中女主当然就是成功登堂入室的那个外室。\n本来林嫣然都把袖子撸起来了，准备搬空渣男的私库，把外室纳进府里来折磨。\n结果林嫣然发现她这个‘大儿子’好像有点门道。\n所以画风就变成了，‘轩儿，管管你弟弟。’\n‘轩儿，管管你父亲。’\n“轩儿······”\n总的来说就是林嫣然看戏躺平的一生。\n楚云轩：母亲歇着，事情全部都交给儿子。", "tags": ["宫斗宅斗", "古代言情", "萌宝", "穿越", "穿书", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高门主母的驯夫手册", "fullTitle": "高门主母的驯夫手册", "link": "https://fanqienovel.com/page/7550793954933885976", "data": [21.99, 22.38, 22.7], "trend": 0.71, "latest": 22.7, "wordNumber": 547008, "creationStatus": 0, "desc": "程昭被赐婚给最年轻的国公爷周元慎。\n　　周元慎有一房背景强大的娇妾，又与寡嫂暧昧不清，憎恶高门贵女身上的古板沉闷。\n　　偏程昭是受过最正统教养的贵女。\n　　面对国公府层出不穷的争斗、小妾的挑衅、寡嫂暗中拨火，程昭解决起来游刃有余。\n　　“我嫁过来做主母，就是替国公爷收拾烂摊子的。”程昭温良恭俭。\n　　待我地位稳固，有了子嗣，下一个被收拾的烂摊子，就是国公爷你。\n　　——*——*——\n　　初见时，周元慎觉得程昭虚伪狡诈；相处日久，赞她恢廓大度、见识广博。\n　　他周元慎的夫人，没有任何缺点。唯一不好的，是她心中另有所属，不爱他。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "勾太傅，人前不熟人后如做了夫妻", "fullTitle": "勾太傅，人前不熟人后如做了夫妻", "link": "https://fanqienovel.com/page/7591861882936380478", "data": [45.74, 45.8, 46.31], "trend": 0.58, "latest": 46.3, "wordNumber": 1013877, "creationStatus": 1, "desc": "状元夫君熟睡，宋怜抱住霁月清风的当朝太傅哭：“求求您，救救我……”\n她能有什么错？她只是不想死。\n家规无情，长公主不容人，夫君要做驸马，留给宋怜唯有一条路——吊死。\n于是她壮着胆子，勾引了当朝太傅。\n陆九渊乘着酒意：“如你所愿。”\n从那以后，宋怜予取予求，陆九渊事事如了她的意。\n他俩一个蓄意勾引，一个见色起意。\n人前殊途陌路，人后颠鸾倒凤。\n有人告密：“宋怜她精于算计，处心积虑破坏太傅大婚。”\n陆九渊淡泊道：“我就喜欢被她霸占着，怎么了？”\n-\n太傅陆九渊出去打了场仗，回来发现自己暗中相看好的姑娘，被皇上指给新科状元了。\n他大发雷霆之后也没跟任何人提及，不过一个女人而已，犯不上。\n直到这女人哭着抱着他的腰求他：“求求您，救我……”\n“一哭二闹的。”陆九渊笑纳了，偶尔当回活菩萨也不错。\n可原本是无聊时纾解的玩物，却被他养成了尖牙利爪的小豹子。\n有人状告宋怜为虎作伥，飞扬跋扈，目中无人。\n陆九渊：“我惯的，你适应一下。”\n后来，宋怜说皇帝该换了，陆九渊就把皇帝换了。\n宋怜说反了吧，陆九渊就反了。", "tags": ["宫斗宅斗", "古代言情", "宠妻", "甜宠", "双洁", "古色古香"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "渣爹忘恩另娶！随母和离掀翻全府", "fullTitle": "渣爹忘恩另娶！随母和离掀翻全府", "link": "https://fanqienovel.com/page/7547260732312652862", "data": [19.9, 19.84, 20.35], "trend": 0.45, "latest": 20.4, "wordNumber": 1022614, "creationStatus": 0, "desc": "｛双女主➕母女联手➕宫斗宅斗➕纯古言无金手指＋徐徐图之｝\n母亲辛劳侍奉公婆，操持府中上下事宜二十年，父亲一朝凯旋，却带回一外室和一双儿女。\n祖母说：母亲与父亲成亲二十年，只生一下女，是犯了七出之一的无所出，没被休弃已是万幸！\n父亲说：他在边关出生入死，才换她与母亲在京城的荣耀与地位，让母亲知足！\n母女联手撕碎渣爹伪装，揭开祖母虚伪面。\n但她还是遭未婚夫嫌弃并被退亲，一时间她名声扫地，京城人人鄙夷！\n这世道女子艰难，只能依附男人而生，那她便要闯出一条路来！", "tags": ["宫斗宅斗", "古代言情", "虐渣", "打脸", "古色古香"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "和渣夫同归于尽后又双双重生了", "fullTitle": "和渣夫同归于尽后又双双重生了", "link": "https://fanqienovel.com/page/7402062722877115417", "data": [33.66, 33.96, 34.04], "trend": 0.37, "latest": 34.0, "wordNumber": 669864, "creationStatus": 0, "desc": "【实体书《岁岁春欢》已出，全平台可购】\n【女主渣男双重生＋男主穿越＋双向救赎＋扮猪吃虎】\n十七岁这年，沈嘉岁嫁于陆云铮为妻，沈陆两家皆为将门，强强联合。\r\n成婚两年后，陆云铮大败敌国名扬四海，沈家却因通敌叛国满门抄斩。\r\n沈嘉岁临死前才得知，沈家通敌叛国罪证乃陆云铮亲呈，且陆云铮想娶的人从来不是她，而是沈家养女，她视作亲妹妹的顾惜枝。\r\n灭门之仇，欺骗之恨，沈嘉岁临死反扑，拉陆云铮同归于尽。\r\n再一睁眼，重回陆云铮上门提亲那一日。\r\n沈嘉岁匆忙赶到时，陆云铮正深情开口求娶顾惜枝。\r\n原来，陆云铮也重生了......\r\n————\r\n沈家通敌叛国一事迷雾重重，牵涉甚广。\r\n为查清真相，沈嘉岁决然入局，这时，一人着绯红官服站在了她的身旁。\r\n沈嘉岁依稀记得，上一世咽气之时，似有一片绯红衣角闯进视野......\r\n————\r\n江浔：“江某平生所愿，唯山河远阔，国泰民安。如今再添一愿，愿心上之人岁岁无虞，常乐长安。”", "tags": ["宫斗宅斗", "古代言情", "重生", "扮猪吃虎", "HE", "相互救赎"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春潮夜渡，表姑娘渣得明明白白", "fullTitle": "春潮夜渡，表姑娘渣得明明白白", "link": "https://fanqienovel.com/page/7603646647297379352", "data": [31.01, 31.3, 31.12], "trend": 0.12, "latest": 31.1, "wordNumber": 441253, "creationStatus": 0, "desc": "禁忌之恋 #极限拉扯#美强惨 #双向救赎\n非一见钟情，非蓄谋已久，是日久生情，亦是日久生情！\n—\n\n江南茶庄的明珠温以贞，家破人亡后，被卖作扬州瘦马。\n逃出生天后，她带着一身不可告人的技艺与入骨的媚香，投奔至侯府姨母，却深陷二房的算计与觊觎。\n绝境之中，她将目光投向府中最高的冰山——四爷傅霁川。\n他捏起她的下巴，眸色深沉：“你究竟想干什么？”\n她坐在他的腿上，吻上他的喉结：“小叔，现在是想我下去，还是想我亲下去？”\n男人食髓知味，于是一纸荒唐的契约悄然成立——\n他成了她的靠山，而她成了他长夜的慰藉。\n她恪守“玩物”本分，笑问他厌弃后，能否予她千两白银放她离开。\n他冷眼应下，心却在她平静的自贱中，寸寸下沉。\n他们撕毁、重签、修订契约，在人前不熟、人后缱绻的极限拉扯里越陷越深。\n扬州旧案重查，杀父血案与皇室秘辛层层揭开\n他们能否夺回属于自己的一切？\n当初雪来临，这场始于算计的风月游戏，又将如何收场？\n他们都把对方当作救赎的太阳，殊不知，太阳在成为太阳之前，要经历多少毁灭般的聚变。\n—\n纯古言，无穿越重生金手指。\n两个陌生人的相知相恋相许全描摩。\n一起来谈场酸酸甜甜、咸咸涩涩的古风恋爱吧！", "tags": ["宫斗宅斗", "古代言情", "冰山", "契约婚姻", "相互救赎", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "团子助攻王爷请接招", "fullTitle": "团子助攻王爷请接招", "link": "https://fanqienovel.com/page/7613704029318695961", "data": [16.77, 16.83, 16.81], "trend": 0.04, "latest": 16.8, "wordNumber": 1237523, "creationStatus": 0, "desc": "特种兵军医沈长宁，在一次任务中牺牲，醒来却发现自己穿进了没读完的宅斗小说里——成了那个被姨母毒害、胖到200斤的蠢笨嫡女。洞房花烛夜，原主被又瘸又瞎的战神八王爷活活折腾死，她穿过来时，只剩一身酸痛和一肚子脏话。\n\n“卧槽！”这是沈长宁穿越后的第一句话。\n\n更操蛋的是，原主体内竟有五年慢性毒，亲弟弟被养成纨绔，母亲的死也疑点重重。而那个表面柔弱的姨母，如今正躺在父亲怀里，享受着本该属于原主母亲的一切。\n\n幸好，前世的手链化作随身空间，实验室、药品、美食一应俱全。她一边解毒减肥，一边暗中查证。谁知那晚一次意外，她竟怀上了那个又瘸又瞎的臭男人的种。\n\n三年后院幽禁，她带着天才儿子种菜养鸡，活得有滋有味。小团子三个月会说话，六个月背诗，七个月走路，三岁就能指挥鸡鸭鹅排兵布阵，智商堪比超级电脑。\n\n直到八王爷大婚之日，一个缩小版的自己突然出现在眼前——\n\n“你就是我爹？”小团子歪着头，“长得还行，就是脑子不太好使，难怪把娘亲关了三年。”\n\n慕容战：“？？？”\n\n当他闯入后院，看到那个曾经200斤的丑女如今身姿婀娜、容颜绝世，正叉腰骂鸡时，整个人都不好了。\n\n“你谁？”\n\n“你祖宗！”", "tags": ["宫斗宅斗", "古代言情", "穿越", "空间", "嫡女", "医术"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [21.7, 23.91, 26.66], "trend": 4.96, "latest": 26.7, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [23.65, 24.35, 24.94], "trend": 1.29, "latest": 24.9, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [23.92, 24.35, 24.63], "trend": 0.71, "latest": 24.6, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新 umber": 521153, "creationStatus": 1, "desc": "【无固定cp+女主普通人+非万人迷+绝不受气】\n（评分刚出！会涨的～）\n孤儿院出身的姜元初自小就是个很有主意的孩子，所有人对她的印象都是这孩子爱财。\n老院长称：她总是梦见有一天会在派出所见到姜元初。\n送外卖逮捕贩毒分子的姜元初：……\n警察：你怎么发现的？\n姜元初坐的端正：因为这是刑法规定不能做的事。\n老院长面露苦笑，担心姜元初走弯路，所以压着她把刑法全部背下来，这是能说的吗？\n姜元初耸耸肩。\n直到这天，正准备出发去打工的姜元初遇到了一个不知名能量体，自此她获得了另一个可能性。\n\n世界一：《甄嬛传》宜修✅\n代入感不多，游离在外。外挂：康熙帝\n世界二：《如懿传》魏嬿婉✅\n有了部分实感，感受到了友情，爱情，但体验依旧不够。对象：进忠\n世界三：《知否》墨兰✅\n有了更深的感悟，感受到了亲情，触摸了自己的灵魂，不再游离。cp：齐衡\n世界四：《HP》佩妮·伊万斯✅\n第一次代入自己感受爱情。唯一的家人：小巴蒂·克劳奇。\n世界五：《甄嬛传》夏冬春✅\n世界六……\n世界七……", "tags": ["女频衍生", "穿越", "同人", "甄嬛衍生", "综影视", "衍生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "综影视：石榴精她多子多福", "fullTitle": "综影视：石榴精她多子多福", "link": "https://fanqienovel.com/page/7538715011611364414", "data": [5.32, 5.36, 5.43], "trend": 0.1, "latest": 5.4, "wordNumber": 1445524, "creationStatus": 1, "desc": "（刚开分，评分较低。但很好看，欢迎来看～）【系统+做太后+女主不是好人+都市剧+宫斗剧+宅斗剧+年代剧】\n丹若是六界最后一个石榴精，在灵力消散前夕绑定了低级版还愿系统，从此跟着系统穿越无数个小世界做任务。\n（作者同类小说《综影视：炮灰女配多子多福》（别名：《综影视：做太后？唯手熟尔！》百万字已完结，欢迎观看！）\n（感谢读者朋友们帮忙捉虫）\n1、如懿传—富察琅嬅\n2、甄嬛传—余莺儿\n3、富察贵人\n4、欢乐颂—樊胜美\n5、高晞月\n6、贝微微\n7、安陵容\n8、魏嬿婉重生\n9、南来北往—姚玉玲\n10、宜修\n11、小欢喜—小梦\n12、璟瑟\n13、宫心计—姚金玲\n14、孙妙青\n15、小巷人家—原创庄桦林女儿向青云\n16、知否—顾廷烨之母白氏白静宜\n17、阿箬\n18、情深深雨濛濛—依萍\n19、邱莹莹\n20、又见一帘幽梦—绿萍\n21、甄嬛传—甘侧福晋\n22、延禧攻略—尔晴\n23、三十而已—钟晓芹", "tags": ["女频衍生", "系统", "穿越", "精灵", "综影视", "衍生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "综影视之美人生存手札", "fullTitle": "综影视之美人生存手札", "link": "https://fanqienovel.com/page/7476326435242642494", "data": [6.7, 6.75, 6.79], "trend": 0.09, "latest": 6.8, "wordNumber": 3111551, "creationStatus": 1, "desc": "新作品出炉啦，希望大家多多喜欢，多多支持吧！这里有各种各样的世界，剧情会三观跟着五官走哒，有1V1也有1Vn。欢迎欢迎～\n每个世界都有分卷，喜欢哪个就去看那个。\n把每一个世界都当成一个新的故事，女主不会有固定人设。\n可能大杀四方，也可能绿茶白莲花。\n作者会尊重所在世界的维度，仙神世界自然会有术法，封建社会要尊重当时的社会情况，仙侠世界自然会练武，现代世界也要遵守法律。\n人物的所有设定，也只是仅限于当前世界。", "tags": ["女频衍生", "系统", "穿越", "同人", "综影视", "衍生"], "borderColor": "#3498db", "backgroundColor" /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

    chartRegistry[sfx].push(chart);
  })();

  // ③ 增幅柱状图
  (function() {
    const chart = new Chart(document.getElementById('growthChart-' + sfx).getContext('2d'), {
      type: 'bar',
      data: { labels: D.growthCats, datasets: [{ data: D.growthValues,
        backgroundColor: D.growthColors.map(c=>c+'cc'), borderColor: D.growthColors,
        borderWidth: 1, borderRadius: 3 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.parsed.x>0?'+':''}${c.parsed.x}%` } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }
        }
      }
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>均腰比</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      const mmr=m.mm_ratio!=null?m.mm_ratio:0;
      const mmc=mmr<1.8?'#22c55e':mmr<=3.0?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${mmc};font-weight:600">${mmr}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const rawBooks = D.bookChartData[cat];
      const isRead = sfx.startsWith('Read');
      // 阅读榜只展示连载中的书；图表、表格、热门标签、累计净增全部同源
      const displayBooks = isRead
        ? rawBooks.filter(b => b.creationStatus === 1)
        : rawBooks;
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = displayBooks.length > 0
        ? displayBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${displayBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = displayBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书${isRead ? '，仅连载中' : ''}，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
