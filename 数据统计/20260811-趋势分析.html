经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [59.1, 59.82, 60.42, 61.67, 63.39, 64.38, 65.29], "trend": 6.19, "latest": 65.3, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [20.95, 20.63, 21.3, 21.95, 23.35, 24.33, 25.74], "trend": 4.79, "latest": 25.7, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [51.7, 52.13, 52.2, 52.43, 54.65, 55.39, 54.91], "trend": 3.21, "latest": 54.9, "wordNumber": 855613, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [16.55, 16.94, 17.2, 17.34, 17.87, 18.34, 18.8], "trend": 2.25, "latest": 18.8, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大小姐雇我替她和太子爷网恋", "fullTitle": "大小姐雇我替她和太子爷网恋", "link": "https://fanqienovel.com/page/7624147408376581145", "data": [38.77, 38.34, 38.27, 37.57, 38.25, 38.65, 39.43], "trend": 0.65, "latest": 39.4, "wordNumber": 384371, "creationStatus": 0, "desc": "已签实体出版！\n［无虐，无雌竞，轻松甜文，双洁1v1］\n【嘴特甜，很缺钱，纯欲钓系女主】\n【嘴很毒，钱贼多，冷傲拽哥男主】\n-\nS大校花姜晚接了一项特殊委托。\n豪门大小姐雇她追求海城太子爷进行网恋。\n照片、身份都是大小姐本人，手机对面换成她。\n然而太子爷又冷又拽，姜晚每天绞尽脑汁的撩。\n-\n姜晚费劲吧啦刚追到人，大小姐发来指令：\n“晚晚，目标达成，计划终止。”\n“收到！”\n姜晚连夜爬起来和太子爷提分手。\n商时序咬牙：【你别后悔】\n姜晚：【嗯嗯，绝不后悔】\n\n两天后——\n大小姐：“晚晚，情况有变，你还没跟他分手吧？”\n姜晚咬紧后槽牙：“你、说、呢？”\n大小姐：“快、快复合！”\n-\n复合后，海外留学的太子爷偷偷跑回国要给姜晚惊喜。\n他的惊喜，姜晚的惊吓！\n为了不掉马，情急之下，哄骗他酒店蒙眼。\n姜晚聊完天想溜，被他扣住腰亲懵！\n说好的网恋怎么还有失身的风险？\n-\n【掉马小剧场】\n某日，姜晚帮父母摆完摊后回到小区门口，太子爷突然打来电话。\n“在哪？”\n“不是告诉你我和朋友在拉斯维加斯玩呢。”\n“玩得开心吗？”\n“开心啊～”\n“回头。”\n姜晚：！！！", "tags": ["青春甜宠", "现代言情", "总裁", "甜宠", "双洁", "1v1"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [12.8, 13.49, 14.62, 16.83, 23.95, 23.5, 24.66], "trend": 11.86, "latest": 24.7, "wordNumber": 925518, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [19.23, 20.41, 23.16, 25.65, 28.2, 28.92, 29.22], "trend": 9.99, "latest": 29.2, "wordNumber": 909733, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [11.4, 11.18, 11.78, 12.31, 12.93, 14.88, 17.97], "trend": 6.57, "latest": 18.0, "wordNumber": 1783078, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [14.21, 14.41, 14.98, 15.72, 17.56, 18.55, 19.51], "trend": 5.3, "latest": 19.5, "wordNumber": 4626208, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [16.1, 17.58, 20.27, 21.96, 21.66, 21.42, 21.29], "trend": 5.18, "latest": 21.3, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [16.41, 16.93, 17.53, 18.08, 19.33, 19.95, 20.74], "trend": 4.33, "latest": 20.7, "wordNumber": 894770, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [12.03, 12.46, 13.27, 13.95, 14.7, 15.38, 15.67], "trend": 3.64, "latest": 15.7, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越农女断亲，有空间天天吃肉！", "fullTitle": "穿越农女断亲，有空间天天吃肉！", "link": "https://fanqienovel.com/page/7615591201386810393", "data": [13.26, 13.23, 16.55, 17.78, 16.87, 16.44, 16.25], "trend": 2.99, "latest": 16.3, "wordNumber": 935180, "creationStatus": 1, "desc": "动漫已上线！\n（有声已出）评分刚出，会涨的，放心入哈～\n【架空+空间+女强+家长里短+处理极品+日常+CP……】\n雇佣兵苏晚云，做最后一个任务被一枪爆头了。\n再醒来变成北国的农家女，要被奶奶和二叔拖去卖掉。\n她掌掴二叔，脚踢奶奶，带着被压榨得说话都不敢大声的爹决然断亲自立门户。\n上辈子的千万存款自动兑换成了灵泉空间，还有千亩良田。\n极品敢来闹事，打得他们鼻青脸肿。\n生死看淡，不服就干。\n住着破草棚，食不果腹，身无分文，那就上山打猎、挖草药，赚了银子就能盖房，天天大鱼大肉。\n有人抓着她的把柄来逼婚，直接干死他！\n她的愿望：赚到花不完的银子，直接躺平。\n某天，男人带着所有家当来敲门：“苏晚云，开门，我来入赘了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "女强"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [16.49, 16.36, 15.96, 16.23, 16.25, 16.5, 17.64], "trend": 1.15, "latest": 17.6, "wordNumber": 1639110, "creationStatus": 1, "desc": "【古言架空+女强+斗极品婆家娘家+养崽+无穿越+无重生+先婚后爱】\n　　银杏五岁就伤了身子，失去了做母亲的资格，尽管她长得好看又能赚钱。\n　　但依旧没有哪个人家愿意娶她，因为娶了她就变成绝户了。\n　　唯独村里的老鳏夫赖大，不但愿意娶她，还愿意出双倍的聘礼。\n　　这让银杏贪财的娘果断点头。\n　　收了五两银子的聘礼，让他把闺女直接领走。\n　　但银杏死活不肯，她知晓已经死了两个媳妇的赖大没安好心思。\n　　可在这封建的年代，婚姻向来是由父母做主。\n　　尽管她极力反对，但也无法改变贪财娘的想法。\n　　就在她绝望之时，那个藏在她心里多年的男人出现了。\n　　萧青北：婶子，我想娶银杏，希望您能同意。\n　　王氏：你要娶银杏？人家赖大出了五两银子的聘礼，你能拿得出来吗？\n　 萧青北：我能的。\n　　 银杏：青北哥，你真的要娶我吗？\n　 萧青北：嗯，跟我走吧。\n        银杏：大宝二宝，快叫爹！\n 大宝二宝：（他们可是皇子，怎么可能随便叫爹呢！）\n     萧青北：你们想学功夫吗？（这两个小子还真是块练武的好苗子）\n   大宝二宝：师父！（叫师父是可以的）", "tags": ["种田", "古代言情", "乡村", "女强", "养崽", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世：兽夫太凶猛", "fullTitle": "穿越兽世：兽夫太凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [11.89, 12.09, 12.28, 12.51, 12.69, 12.8, 12.89], "trend": 1.0, "latest": 12.9, "wordNumber": 1328196, "creationStatus": 0, "desc": "【穿越兽世＋轻快甜宠+生活日常＋1vN+多雄】\n千夏在21世纪是个勤勤恳恳的打工人，这天加完班回家路上被一辆失控的汽车撞死，没想到当她再睁开眼的时候是在一个巨大的山洞里。\n山洞阴暗潮湿让她惶恐，而她身上只围着一块抹胸样式和短裙样式的破烂兽皮，她不明白她明明死去了又怎么会出现在这里。\n难道......忽然见她脑袋里电光一闪，她又细细看了身上的兽皮，这......不会是像她看的兽世小说那样，穿越兽世了吧？？？\n别人的第一兽夫是四阶、五阶强者，她一个最不受欢迎的瘦弱丑雌的第一兽夫就是这大陆的顶尖战力强者。\n上辈子她兢兢业业连个恋爱都谈过，这辈子刚穿来没多久就肚里揣崽，还上演了一场兽世带球跑。", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "带球跑"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [23.91, 26.66, 29.6, 32.97, 40.14, 43.58, 46.96], "trend": 23.05, "latest": 47.0, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [28.86, 28.64, 29.28, 32.94, 37.44, 39.18, 40.91], "trend": 12.04, "latest": 40.9, "wordNumber": 503160, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [24.35, 24.94, 25.36, 25.69, 26.58, 26.79, 26.96], "trend": 2.61, "latest": 27.0, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [24.35, 24.63, 24.79, 24.9, 25.24, 25.49, 25.78], "trend": 1.42, "latest": 25.8, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新的人生，结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "要命！首长的小娇妻夜夜闹离婚", "fullTitle": "要命！首长的小娇妻夜夜闹离婚", "link": "https://fanqienovel.com/page/7634360267891018814", "data": [36.18, 36.67, 36.78, 36.98, 40.07, 43.06, 46.26], "trend": 10.08, "latest": 46.3, "wordNumber": 519326, "creationStatus": 1, "desc": "评分刚出，后面会涨\n【先婚后爱+日久生情+男痞女坏+双洁+随军】\n【80年代】\n军区团长陆砚峥，被父母逼迫回老家结婚。结果在路上抓小偷，误闯女人闺房，睡了个大美人。\n这女人长得娇，生的俏，心肝黑，性子野，一点都不好惹。\n人如其名，她叫萧惹。\n陆砚峥本想用钱打发麻烦。可这女人不要钱，只要名分，逼着他领证。\n“要么去公安局，要么去民政局你选一个！”\n关键，她不是真结婚，而是蓄谋已久来复仇的。\n***\n婚后，萧惹白天惹祸，夜里撩拨，把整个家属大院闹得乌烟瘴气，鸡犬不宁。\n上到领导，下到军嫂，所有人都劝陆砚峥离婚。\n“陆团长，求你了，跟你家那惹祸精离了吧！再不离，我们都活不下去了！”\n“离，明天就离！”\n陆砚峥也是气的牙痒痒，每天都把离婚挂嘴边，可怎么都离不掉。\n天知道那女人有多娇软，夜里有多勾魂！\n离了，他还怎么活？", "tags": ["年代", "现代言情", "先婚后爱", "日久生情", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魂归香江：从裁缝铺到女首富", "fullTitle": "魂归香江：从裁缝铺到女首富", "link": "https://fanqienovel.com/page/7644061214691052606", "data": [25.03, 25.94, 26.52, 27.02, 28.58, 29.32, 29.97], "trend": 4.94, "latest": 30.0, "wordNumber": 635374, "creationStatus": 1, "desc": "【八零年代+女强+学霸+商战+香港】\n前世的她过目不忘的脑袋配了颗随时停摆的心脏；\n心脏停跳那刻，她想：下辈子，不做人了。\n再睁眼，她叫林颖，九岁，痴傻九年，今日魂归。\n师婆掐算过三次：\"不会再走了。你本来就是你，只是被放错了地方。\"\n她成了八零年代香江西环一间裁缝铺里痴傻九年的小女孩：林颖。\n老窦是从G省偷渡来的入赘木匠，老母踩着缝纫机和老窦一起养活一家四口。\n九岁，魂归香江。前世满腹经纶无处施展，这世她有了一副能跑能跳的身体。\n\"阿公，我想读书。\"\n\"好！你想读到几时，阿公就供到几时！\"\n官校不能跳级，私立学费要命，一个一天学没上过的九岁女孩，装了十八年知识的脑子，一颗终于不会停摆的心脏，和一家子拼了命也要托举她的人。\n从裁缝铺到港岛写字楼，从西环旧唐楼到半山豪宅：这个被老天放错了地方的女孩，要在这座黄金遍地的城市里，亲手造出一个商业帝国。\n前世欠她一副好身体，今生还她一个盛世香江。\n【大女主文，本书叙事核心重头到尾都是女主，该书看的是女主是否能掌控自己人生与事业，不是统计书中有几个男配角色！作者不会为了迎合极端观点消除所有男性！所有配角都是推动剧情的需要！】", "tags": ["年代", "现代言情", "学霸", "女强", "前世今生", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [29.04, 29.18, 29.25, 28.91, 28.41, 31.3, 33.97], "trend": 4.93, "latest": 34.0, "wordNumber": 1156122, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [21.96, 22.2, 22.64, 22.7, 23.76, 24.77, 26.34], "trend": 4.39, "latest": 26.3, "wordNumber": 777997, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零知青娇弱可人？刀刀要你狗命", "fullTitle": "七零知青娇弱可人？刀刀要你狗命", "link": "https://fanqienovel.com/page/7606648925205826584", "data": [21.73, 22.44, 23.5, 24.67, 25.25, 25.37, 25.06], "trend": 3.32, "latest": 25.1, "wordNumber": 834823, "creationStatus": 0, "desc": "【已完结，放心入坑】\n重生七零年代＋抄家＋空间＋白切黑女主＋男女双强＋下乡知青＋科技助国＋军婚＋甜宠＋恋爱脑兵王＋爽文＋双洁\n23世纪武术冠军魂穿七零，一睁眼就遇上抄家惊魂，原主被活活逼死。\n她携带异宝重活一世。\n父母双双牺牲，家产被窥，革委会频频上门刁难？\n她连夜端了革委会老巢，洗劫仇家，卷走滔天财富潇洒下乡。\n本想苟着搞钱搞科研，却意外撞破祖辈惊天秘辛，一路遭人截杀。\n人前软萌娇弱小知青，人后狠辣能打白切黑。\n谁料被冷面兵王一眼盯上，从此黏人属性彻底爆发。\n风行止：看着香香软软，想娶回家疼。\n下一秒见她把人揍飞：……更爱了，又飒又野！\n恋爱脑兵王天天贴贴，白切黑女主一言不合就动手。\n她搞科技强国，他做最强后盾。\n男女双强，军婚高甜，从下乡知青飒到京城顶层！", "tags": ["年代", "现代言情", "重生", "空间", "强强", "白切黑"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": or": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宿舍求生：从刷广告开始变强", "fullTitle": "宿舍求生：从刷广告开始变强", "link": "https://fanqienovel.com/page/7632978161973595161", "data": [31.44, 31.54, 31.02, 30.62, 30.71, 30.92, 32.18], "trend": 0.74, "latest": 32.2, "wordNumber": 345038, "creationStatus": 1, "desc": "【诡异+有cp+女主恶毒炮灰+女主阴暗鼠鼠+女主超高配得感+爽文+成长流】\n避雷1：女主超漂亮，阴暗妒强，一心要当天龙人\n避雷2：男主超纯起点龙傲天风，巨强巨黑巨装，巨容易破防。\n避雷3：女主人见人爱，诡见诡爱，而且中央空调（少量女嬷）。男主后来还没上位，就天天抓小三。\n避雷4：唯一正宫宋聿，其余都是小三（情人越多越气派）\n=========\n诡异公寓降临，全民躺平求生 。\n在这里，夜晚必须躺在床上睡眠赚取金币。金币越多，房门越厚，活得越久。\n郁圆上辈子被人害死，重生归来，开局就抢走大楼内唯一珍稀盲盒。\n本以为这辈子直接起飞，脚踩所有天龙人。\n谁知道开盒一看：【获得隐藏款道具：广告麻麻！】\n郁圆：……什么东西？\n广告麻麻：看广告可获得升级或抽取盲盒的机会哦～\n##\n宋聿早就知道这个世界是个巨大的小说，而他是绝对的主角。\n既然他是主角，\n为什么郁圆不能只围着他转？\n那些仗着郁圆年纪小，不能辨别好坏，妄图勾引她的人，都该在这个世界上消失……", "tags": ["科幻末世", "幻想言情", "重生", "末世", "前世今生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世降临：小尸尸我呀囤囤囤囤！", "fullTitle": "末世降临：小尸尸我呀囤囤囤囤！", "link": "https://fanqienovel.com/page/7346909068407098430", "data": [32.92, 33.11, 33.41, 33.39, 33.21, 33.24, 33.36], "trend": 0.44, "latest": 33.4, "wordNumber": 1118886, "creationStatus": 0, "desc": "【末世x囤粮x双洁x甜宠x小丧尸女主x超A输出狂魔男主】\n暴雨，台风，海啸，雷暴，地磁消失，丧尸，怪物，异能，等等等等……\n恭喜各位打开末世主线，全世界大洗牌，接下来的求生路，靠命，靠运气，靠自己。\n-\n而在别人还在疯狂尖叫的时候，作为生存狂魔的许多多已经吭哧吭哧地囤满了粮仓！\n什么肉蛋奶，什么各种罐头干粮，什么武器各类工具。\n千面魔方空间在手，所有物资通通打包全部带走！\n只是——为什么万事俱备的她开场就直接变成了阿巴阿巴的小丧尸啊喂！", "tags": ["科幻末世", "空间", "末世", "囤物资"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真公主？不，真君主！", "fullTitle": "真公主？不，真君主！", "link": "https://fanqienovel.com/page/7517228824212278334", "data": [12.43, 12.6, 12.67, 12.7, 12.77, 12.77, 12.65], "trend": 0.22, "latest": 12.7, "wordNumber": 974777, "creationStatus": 1, "desc": "（无CP+大女主+前期军校争霸+后期一统人族+热血）\n问：从君主幼年体到完成体要几步？\n幼年体凌昭：孤儿院开局，疑似金手指的游戏芯片还一直拖后腿。\n完成体凌昭：后星际第一人·第一指挥官·神级星者·人族的希望·神迹计划唯一继承者……\n后星际时代，异兽大肆入侵，帝国统治式微。在人人唱衰皇室的情况下，一个遗漏在外的公主默默绑定【万国狩猎场】的游戏芯片。\n在这里，她将作为帝国唯一继承人，以子民信仰为准入券，和其它生物进行比赛，从而赚取奖励。\n于是，卷王之旅正式开启。\n三十六校联赛冠军？拿来吧。\n天骄突围赛冠军？拿来吧。\n皇室身份、君主之冕、丢失的蓝星、散乱的人族大军？统统拿来吧。\n起初，凌昭的梦想是白塔市最强者，后面稍微提升了点难度，想成为帝国最强者。再后面，她不知不觉登顶万国狩猎场，一个顺手就把游戏芯片玩崩了。\nN年后，被揍到鼻青脸肿的宇宙诸国：你们当初惹她干嘛？\n全人类：再渺小的人类，也有在浩瀚宇宙里留下痕迹的权利。今天也是朝伟大君主前进的一天！\n（我流星际文，世界观私设颇多，非机甲体系，略慢热；前期军校和军营版图为主，后期游戏和宇宙诸国版图为主）", "tags": ["科幻末世", "穿越", "星际", "无CP", "异世穿越"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "民国言情": [{"label": "苦娘", "fullTitle": "苦娘", "link": "https://fanqienovel.com/page/7574723775518755865", "data": [2.29, 2.25, 2.2, 2.14, 7.17, 9.54, 12.0], "trend": 9.71, "latest": 12.0, "wordNumber": 854687, "creationStatus": 0, "desc": "1932年，乡野姑娘素芬为追求自由与爱情，不顾爹娘反对，没要一分彩礼，没办婚宴，跟着心上人陈春生私奔到了码头。\n两人在棚屋安了家，陈春生扛粮袋挣血汗钱，素芬缝补浆洗补贴家用，清苦日子里满是盼头。\n可等陈春生攒了些小钱，心就野了，被城里花枝招展的姑娘缠上，夜不归宿成了常态。\n素芬怀上孩子，哭着劝他回头，换来的却是陈春生的打骂。\n争执间，她被推倒在地，孩子没了，多年的感情终究是错付了。\n素芬走投无路回了老家，她早已名声扫地……\n从此，素芬孤身一人，白天捡垃圾、收废品，夜里提着篮子走街串巷卖打火机。\n风餐露宿、受尽白眼，这个苦命的女人凭着一股韧劲，在尘埃里挣扎求生，只为守住最后一点尊严。", "tags": ["民国言情", "现代言情", "民国", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "苦命村妇", "fullTitle": "苦命村妇", "link": "https://fanqienovel.com/page/7650036980222282814", "data": [3.51, 3.61, 3.86, 4.19, 4.8, 5.3, 5.15], "trend": 1.65, "latest": 5.2, "wordNumber": 334487, "creationStatus": 1, "desc": "还原民国初年，淮北平原上的柳沟村。村妇翠莲的乡村故事。\n一个死了丈夫，被婆家嫌弃，被娘家抛弃的村女，一生的心酸无赖", "tags": ["民国言情", "现代言情", "乡村", "民国"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "顶级狂妄", "fullTitle": "顶级狂妄", "link": "https://fanqienovel.com/page/7428813474534280217", "data": [6.36, 6.6, 6.95, 7.25, 7.5, 7.59, 7.66], "trend": 1.3, "latest": 7.7, "wordNumber": 380753, "creationStatus": 0, "desc": "徐白家道中落。\n　　未婚夫与名门女暧昧，又不肯放开她：“你等着结婚，我不会嫌弃你。”\n　　徐白因这门婚约，受尽了羞辱与刁难。为自保，她搭上了未婚夫的小叔叔，南城有名的混蛋。\n　　这男人风流、残暴、野心勃勃。徐白与他各取所需，竟是在风雨飘摇中站稳了脚跟。\n       “你回头是岸。”未婚夫说。\n       “他说他是岸。”男人附耳，“把这岸炸了吧。”", "tags": ["民国言情", "现代言情", "总裁", "民国", "豪门世家", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穷妻", "fullTitle": "穷妻", "link": "https://fanqienovel.com/page/7640798769482583065", "data": [11.07, 11.31, 11.26, 10.88, 10.54, 11.37, 11.94], "trend": 0.87, "latest": 11.9, "wordNumber": 357710, "creationStatus": 1, "desc": "凤霞长得标致，却是村里最不安分的姑娘。\n她没文化、没家底，也没挣钱的本事，一心就想嫁户好人家，过上好日子。\n仗着一副好皮囊，她把嫁人当成改命的唯一出路，改嫁了一个又一个男人。\n总以为下一个男人能让她吃饱穿暖、不再受苦，可造化弄人，嫁的男人竟一个比一个穷……", "tags": ["民国言情", "现代言情", "乡村", "民国"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "作大死！怂包强制爱了暴戾督军", "fullTitle": "作大死！怂包强制爱了暴戾督军", "link": "https://fanqienovel.com/page/7577212119280520254", "data": [5.4, 5.65, 5.79, 5.95, 6.04, 6.05, 6.13], "trend": 0.73, "latest": 6.1, "wordNumber": 339189, "creationStatus": 0, "desc": "短剧可预约【超怂强制爱+心声+双洁甜宠+无雌竞+引导型年上】【贪财怕死小怂包x读心腹黑活阎王】\n阮绵绵摊上大事了！\n她绑了个作死的强制爱系统。\n强制对象竟是令全北境闻风丧胆的军阀头子厉沉舟。\n系统要求：欺他、辱他、驯服他。\n任务成功解锁绝世藏宝图。\n任务失败则小命不保。\n贪财又怕死的怂包阮绵绵，只能含泪作大死。\n当她抖成筛子，一鞭子抽歪甩自己脸上时。\n厉沉舟笑了。\n他能听见她的心声。\n【哇呜痛死了，这哪是强制爱，分明是强制死。】\n【等宝藏到手，我立刻卷款跑路。】\n于是厉沉舟慵懒勾唇，“想玩鞭子？”\n他攥住她发抖的手腕，引向自己胸膛。\n“乖，往这儿抽。”\n后来——\n她结巴着命令他学狗叫，心声哭唧唧。\n【救命！要不我给您汪一个？】\n厉沉舟垂眸闷笑：“汪。”\n她哆嗦着扯他衬衫，内心哀嚎。\n【对…对不起，求求您让我撕一下~】\n他反手扣住她后颈，气息灼热。\n“别抖，我教你。”\n全北境哗然。\n活阎王厉沉舟，竟被个怂包当狗训？！\n直到宝藏现世。\n阮绵绵扑进珠宝堆，“泼天富贵到手，今晚我就跑路！”\n却被厉沉舟掐腰箍进怀中。\n“绵绵，你跑不掉了。”", "tags": ["民国言情", "现代言情", "系统", "腹黑", "甜宠", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "督军开门！小奶团背着黄金来旺家", "fullTitle": "督军开门！小奶团背着黄金来旺家", "link": "https://fanqienovel.com/page/7487639328680578072", "data": [1.61, 1.68, 1.69, 1.77, 2.1, 2.22, 2.31], "trend": 0.69, "latest": 2.3, "wordNumber": 1000703, "creationStatus": 0, "desc": "【民国+团宠+萌宝奶团+锦鲤+青梅竹马】\n刚出生的舟舟被亲生父亲和小妾的女儿掉包，遗弃在大街上。\n督军家的小少爷将她捡回了家。\n从此落败的督军府，有了翻天覆地的变化。\n战死的督军，生龙活虎的回来。\n老旧的宅子，挖出成千上万的黄金。\n倒闭的纺织厂，日进斗金赚得手软。\n家有中风的老夫人？“祖母放心，你不仅能站起来，还能跳华尔兹。”\n家有小产的大嫂？“大嫂别怕，你将来一定能生个龙凤胎。”\n从此之后，督军家福运绵绵。\n年轻夭折的大儿子活了，失踪的二儿子成商界精英。\n三儿子的疯病痊愈，四儿子留洋归来。\n哑巴小儿子不仅能开口说话，还聪慧过人。\n督军家的福运小锦鲤，一天天长大，成了全家人的小团宠。\n更是小少帅傅卿昭，从小到大放在心尖上小青梅。", "tags": ["民国言情", "现代言情", "萌宝", "团宠", "青梅竹马", "民国"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "少帅霸妻，强扭的瓜不甜也得甜", "fullTitle": "少帅霸妻，强扭的瓜不甜也得甜", "link": "https://fanqienovel.com/page/7242257321152220217", "data": [4.35, 4.41, 4.44, 4.53, 4.7, 4.74, 4.76], "trend": 0.41, "latest": 4.8, "wordNumber": 1282257, "creationStatus": 0, "desc": "[传统宅斗+虐渣复仇+架空民国+强取豪夺+女主重生]\n少帅景元钊喜欢颜心的浓艳容貌，想要将她养在私宅，不顾她已经出嫁。\n“跟我三个月，我给你想要的荣华富贵，你丈夫会发达。”\n颜心扇了他一耳光。\n千方百计将她搞到手后，他不怀好意问她：“我和你丈夫，谁比较厉害？”\n颜心又扇他一耳光。\n后来，他卑微求她：“离婚跟我，我的脸只给你打。”\n颜心重生后，虐渣男丈夫、虐恶毒表妹，又吊打夫家一群吸血鬼。她打人打脸特厉害，大概是在景元钊那里练的，熟能生巧。", "tags": ["民国言情", "现代言情", "重生", "民国"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "挚欢", "fullTitle": "挚欢", "link": "https://fanqienovel.com/page/7438493454365101080", "data": [1.73, 1.77, 1.81, 1.83, 1.9, 1.97, 2.04], "trend": 0.32, "latest": 2.0, "wordNumber": 524260, "creationStatus": 0, "desc": "温瓷出国学医七年，一心回国搞事业，没想到，回来被迫先领了张结婚证。\n丈夫傅景淮是总督府二少帅。\n颜值高，手段狠。\n领证那天，男人一身暴戾警告她：“别以为扯了证你就是我妻子，敢造次，我第一个崩了你。”\n后来，男人又说：“你是我夫人，该有的体面，我会给你。”\n再后来，男人强势入住她的卧室：“我是你丈夫，这是你该尽的义务。”\n温瓷忍无可忍：“我们是假结婚，权宜之计。”\n傅景淮：“那就把它做成真的，正好你欠我四条命，是时候清算一下了。”", "tags": ["民国言情", "现代言情", "总裁", "婚恋", "民国", "医生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "民国闺秀", "fullTitle": "民国闺秀", "link": "https://fanqienovel.com/page/7595165044405455897", "data": [2.44, 2.52, 2.56, 2.55, 2.56, 2.68, 2.74], "trend": 0.3, "latest": 2.7, "wordNumber": 638841, "creationStatus": 0, "desc": "沈青瓷原以为这一生可以在苏州老宅里安然度日，春日看花，秋夜听雨，守着祖产过完一辈子。\n\n　　可乱世容不下这份安然。\n\n　　十七岁那年，她流落上海，被秦家收留。秦父秦母待她如亲女，秦渡那个上海滩出了名的混世魔王，偏偏对 .16, 25.46], "trend": 2.84, "latest": 25.5, "wordNumber": 351264, "creationStatus": 0, "desc": "[体弱少女 X 烈日少年]\n（正文已完结）\n（原书名：春日烈阳）\n（青梅竹马+校园甜宠+日常）\n（人物设定均已成年）\n许渔刚来青禾中学的时候，有一个梦想，那就是在冬日纷飞的时候亲手接住一片雪花。\n她想，人生都这么苦了，总要来看一次大雪纷飞的样子。\n于是许渔努力的一边上学，一边治病。\n在来京市之前，自家亲爹说，在学校会有小时候的邻居哥哥帮忙照顾她。\n但是在许渔记忆里的邻居哥哥：喜欢揪她衣领子，还和别人打架。\n“邻家哥哥”顾盛：......\n第一次见到许渔的时候，顾盛站在校门口“亲切”为她指路。\n第二次见到许渔，顾盛提着保温杯里面装的是热牛奶。\n第三次，第四次......\n顾盛在许渔面前向来习惯了伪装，只有那一次。\n他在昏暗的路灯下表情狠厉的撺着一个人的衣领：“别让我看见你打扰她第二次，滚。”\n他终于有些抑制不住的爆发，脸上掉落的面具后才会原原本本的顾盛。\n那天的许渔忽然觉得，顾盛就像太阳。\n她想，如果在冬天摸不到雪花，那就拜托顾盛带着她去春天感受阳光也不错。\n世界对她来说无聊单调，但是顾盛能够带来温暖。\n立意：我们可遇不可求。", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "青梅竹马"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [62.61, 64.12, 65.26], "trend": 2.65, "latest": 65.3, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [23.35, 24.33, 25.74], "trend": 2.39, "latest": 25.7, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [63.39, 64.38, 65.29], "trend": 1.9, "latest": 65.3, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大小姐雇我替她和太子爷网恋", "fullTitle": "大小姐雇我替她和太子爷网恋", "link": "https://fanqienovel.com/page/7624147408376581145", "data": [38.25, 38.65, 39.43], "trend": 1.18, "latest": 39.4, "wordNumber": 384371, "creationStatus": 0, "desc": "已签实体出版！\n［无虐，无雌竞，轻松甜文，双洁1v1］\n【嘴特甜，很缺钱，纯欲钓系女主】\n【嘴很毒，钱贼多，冷傲拽哥男主】\n-\nS大校花姜晚接了一项特殊委托。\n豪门大小姐雇她追求海城太子爷进行网恋。\n照片、身份都是大小姐本人，手机对面换成她。\n然而太子爷又冷又拽，姜晚每天绞尽脑汁的撩。\n-\n姜晚费劲吧啦刚追到人，大小姐发来指令：\n“晚晚，目标达成，计划终止。”\n“收到！”\n姜晚连夜爬起来和太子爷提分手。\n商时序咬牙：【你别后悔】\n姜晚：【嗯嗯，绝不后悔】\n\n两天后——\n大小姐：“晚晚，情况有变，你还没跟他分手吧？”\n姜晚咬紧后槽牙：“你、说、呢？”\n大小姐：“快、快复合！”\n-\n复合后，海外留学的太子爷偷偷跑回国要给姜晚惊喜。\n他的惊喜，姜晚的惊吓！\n为了不掉马，情急之下，哄骗他酒店蒙眼。\n姜晚聊完天想溜，被他扣住腰亲懵！\n说好的网恋怎么还有失身的风险？\n-\n【掉马小剧场】\n某日，姜晚帮父母摆完摊后回到小区门口，太子爷突然打来电话。\n“在哪？”\n“不是告诉你我和朋友在拉斯维加斯玩呢。”\n“玩得开心吗？”\n“开心啊～”\n“回头。”\n姜晚：！！！", "tags": ["青春甜宠", "现代言情", "总裁", "甜宠", "双洁", "1v1"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夏夜有染", "fullTitle": "夏夜有染", "link": "https://fanqienovel.com/page/7429537438936075289", "data": [18.46, 19.25, 19.62], "trend": 1.16, "latest": 19.6, "wordNumber": 401397, "creationStatus": 0, "desc": "（已签实体）\n【校园重生+追妻火葬场+拽哥上位+借住文学】\n【有点叛逆乖乖女x懒淡拽哥】\n奶奶离世，谈、陆两家见没了亲人的许恩棠可怜，都想把她接去照顾。\n来到北城，许恩棠再次见到那个让她一眼难忘的少年。\n陆襟痞气肆意，之后一起成长的那些年，她看他身边的女人换了一个又一个。\n没想到有一天，他会问她想不想嫁给他。\n她以为是自己多年暗恋终于得到回应。\n直到婚后，她听到他对朋友说：“家里让娶，我还能怎么办？”\n她心灰意冷，决定离婚。\n**\n离婚前夜，她重生回到高二被接回北城这天，依旧是两家都住。\n后来，她夜不归宿，他发疯似的找她。\n“你真的谈恋爱了？跟谁？”\n电话彼端的许恩棠红着脸被谈霁礼圈在怀里。\n谈霁礼开口，声音传进电话里，“告诉他，是不是在和我谈恋爱？”\n**\n以前的许恩棠心思都在陆襟身上，和谈霁礼不熟，没想到会与疏离懒淡的他在这个夏夜有染。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "追妻火葬场", "男二上位"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [17.87, 18.34, 18.8], "trend": 0.93, "latest": 18.8, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "超甜！校草哑声诱哄小可爱", "fullTitle": "超甜！校草哑声诱哄小可爱", "link": "https://fanqienovel.com/page/7344299159488318489", "data": [12.69, 12.84, 13.44], "trend": 0.75, "latest": 13.4, "wordNumber": 406209, "creationStatus": 0, "desc": "【痞帅校霸大佬×娇软学霸甜妹】\n【校园小甜饼，双强，轻松甜宠，双向救赎】\n传闻江城八中有一校霸大佬顾辞澜，桀骜不驯，狂妄张扬，从不把任何人放在眼里。\n高二这年，新来了一位甜妹转学生。\n黎酥人美声甜，初来乍到就斩获月考年级第一名。\n只是她胆子忒大了，总招惹大佬同桌。\n“顾大佬，书包好重，帮我拎~”\n“同桌，来姨妈了肚肚痛，你帮我去买~“\n“顾辞澜，手机放下，今天跟我一起学习。”\n所有人都以为大佬要让她知道什么是人世险恶，却震惊地看到大佬心甘情愿，一一照做。\n后来，某次八中和隔壁职高约架，所有人都看见顾辞澜低声哄着转学生。\n往日的乖张恣意化为绕指柔，声线干净清冽，语气却卑微入尘土。\n“酥酥，我听你的不打架，别生我气了好不好？”", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "大佬", "相互救赎", "学霸"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认路人甲当爹后我喜提反派全家桶", "fullTitle": "认路人甲当爹后我喜提反派全家桶", "link": "https://fanqienovel.com/page/7574398565431135256", "data": [54.65, 55.39, 54.91], "trend": 0.26, "latest": 54.9, "wordNumber": 855613, "creationStatus": 1, "desc": "沈衣在上辈子被豪门找回后，渣爹和亲弟弟已经拥抱养女过上父慈子孝的美好生活。\n她因为和养女作对而被霸凌，最终选择自杀。\n一朝重生在福利院门口，彼时的渣爹还没找上门来，她果断抱住路人脸的男人。\n死皮赖脸要跟着他混。\n她这辈子再也不想要什么豪门父母了，平平淡淡才是真！\n无意路过被抱住的某杀手：“？”\n接下来的日子，沈衣过着简单的生活，她对现状非常满意。\n后来她从系统那得知自己生活在一本漫画中，故事中男女主是她的同班同学。\n沈衣坐在后排摸鱼时意外听到主角团们讨论反派名字。\n“……等等你们嘴里的十恶不赦的坏人，好像全是我家人的名字？”\n*\n沈衣以为自己家人全是漫画里不起眼的路人。\n而实际上，温柔的妈妈会灭掉所有妨碍她的人。\n反社会医生大哥，伤天害理的路上还不忘接她上下学。\n神经质犯罪分子二哥，极端的疯批三哥、高智商坏种四哥，连素未谋面的爷爷都是漫画最终反派。\n某天，学校被恐怖分子袭击，她和养女一起惨遭绑架。\n她失踪已久的社畜老爹，让人包围了学校一枪崩掉绑匪，微微笑着一副幕后反派登场模样，朝她招手，“沈衣，过来。”\n所有人都觉得她死定了。\n结果沈衣在全校同学震惊目光下揪住男人头发，质问：“爸爸，你为什么整这个造型？你的大背头好丑！”", "tags": ["青春甜宠", "现代言情", "重生", "反派", "豪门世家", "搞笑轻松"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被缠上了，穿成疯批的作精前女友", "fullTitle": "被缠上了，穿成疯批的作精前女友", "link": "https://fanqienovel.com/page/7596956333937544254", "data": [12.79, 12.88, 12.95], "trend": 0.16, "latest": 13.0, "wordNumber": 367077, "creationStatus": 0, "desc": "（已签出版 漫剧已上线）【穿书+女主社恐+男主疯批+双洁】\n【超级超级甜！！】\n别人眼中的乖乖女闻初，实则是个深度社恐——直到她穿进了一本大学校园文，成了男主的作精前女友。按照剧情，这个角色将以胡搅蛮缠和撒泼打滚成功“作”掉爱情，成为男女主甜美恋情的完美对照组。\n闻初原想照本宣科走完剧情成功分手，却想起剧情里男主是个阴暗疯批，不仅会设计报复前女友，后期还会对女主上演强制爱。\n社恐闻初陷入了两难：按照剧情作死会被男主报复，但是主动分手可能触发男主记仇然后报复。\n于是她在网上查询如何成功和男朋友分手？\n得到了一个意想不到的答案：热暴力！在保持作精的同时，进行热暴力，撒娇粘人，是个男人都不会受的了这么控制欲强的女朋友！\n慢慢的她发现男主对她也是蛮好的，说不定等后面女主出现后两人可以实现和平分手。\n就是这个男主怎么看她的眼神越来越深沉，变得比自己还粘人啊？ \n闻初：O.O 等等，这剧本不对啊！\n终于女主出现了，闻初终于小心翼翼的试探着提出分手，但为什么每次一提分手就被压着亲？\n##\n席黎野某一天看到了自己女朋友的备忘录。\n他笑出了声，原来是要离开自己吗？\n“分手？”他垂眸轻声重复，语气温柔。\n“闻初，想都别想。”", 6, 24.77, 26.34], "trend": 2.59, "latest": 26.3, "wordNumber": 777997, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "堂妹抢婚？爽，禁欲首长馋上我！", "fullTitle": "堂妹抢婚？爽，禁欲首长馋上我！", "link": "https://fanqienovel.com/page/7612183160905796670", "data": [22.57, 22.83, 24.18], "trend": 1.61, "latest": 24.2, "wordNumber": 966822, "creationStatus": 1, "desc": "【姐妹易嫁+年代军婚+冷情恶女VS禁欲首长+撕渣+追妻火葬场】\n\n骆青瑶胎穿七零后，忘记了上辈子的事，十五岁的时候她还出了车祸。\n因此变得又胖又横。\n堂妹骆青雨抢了她的娃娃亲，失忆了的骆青瑶过不去这个坎，恨不得杀了那对狗男女。\n有一天，堂妹的未来亲姐夫到她家里来了！\n不仅是个高门子弟，还是部队最年轻的参谋长。\n很优质！\n比之她以前的未婚夫强太多！\n骆青瑶的眼底闪过一丝得意：机会来了！妹债姐还！\n抢！\n——骆青雨，你抢我的未婚夫、我抢你的亲姐夫，不为过吧？\n——骆青华，你不是说会被抢，那是自己不被爱吗？这滋味，你也享受享受吧！\n一夜混乱，骆青瑶把傅北寒给睡了，这一夜也因为她不小心摔倒，觉醒了前世的记忆。\n醒来后，骆青瑶给自己点了个赞：干得好，咱二十一世纪的人，吃啥也不能吃亏！\n傅北寒：我出来执行个任务，就被人睡了？\n睡我的，还是个小胖妹？？？\n", "tags": ["年代", "现代言情", "穿越", "追妻火葬场", "代嫁代娶"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生八零：老太太抛子弃女", "fullTitle": "重生八零：老太太抛子弃女", "link": "https://fanqienovel.com/page/7460001987375926296", "data": [23.64, 24.49, 25.13], "trend": 1.49, "latest": 25.1, "wordNumber": 3173827, "creationStatus": 1, "desc": "【年代】【八零】【微群像】【重生】【爽文】【无金手指】【家长里短】\n（又名：重生八零：老太太抛子弃女）七旬老太吴知秋重生了，重生到孩子们还要靠她辛苦付出的年代！上辈子自己偏心，晚景凄凉。重生不重演，老太太决定抛开儿女，美美的过余生！\n小儿子哭唧唧抱着大腿，妈！我可是你最爱的小儿子，我要给你买大房子！为了能跟老娘在一起生活，砒霜拌馅，鹤顶红勾芡，为了老娘没事就得插兄弟两刀！\n公婆化身王炸组合“我那最有出息的大孙呦！爷奶想吃锅子，烤肉，洋饭……”把大儿子两口子坑的裤衩子都穿不上溜。\n宠妻狂魔李满仓……别和我说，这家我说的不算！", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魂归香江：从裁缝铺到女首富", "fullTitle": "魂归香江：从裁缝铺到女首富", "link": "https://fanqienovel.com/page/7644061214691052606", "data": [28.58, 29.32, 29.97], "trend": 1.39, "latest": 30.0, "wordNumber": 635374, "creationStatus": 1, "desc": "【八零年代+女强+学霸+商战+香港】\n前世的她过目不忘的脑袋配了颗随时停摆的心脏；\n心脏停跳那刻，她想：下辈子，不做人了。\n再睁眼，她叫林颖，九岁，痴傻九年，今日魂归。\n师婆掐算过三次：\"不会再走了。你本来就是你，只是被放错了地方。\"\n她成了八零年代香江西环一间裁缝铺里痴傻九年的小女孩：林颖。\n老窦是从G省偷渡来的入赘木匠，老母踩着缝纫机和老窦一起养活一家四口。\n九岁，魂归香江。前世满腹经纶无处施展，这世她有了一副能跑能跳的身体。\n\"阿公，我想读书。\"\n\"好！你想读到几时，阿公就供到几时！\"\n官校不能跳级，私立学费要命，一个一天学没上过的九岁女孩，装了十八年知识的脑子，一颗终于不会停摆的心脏，和一家子拼了命也要托举她的人。\n从裁缝铺到港岛写字楼，从西环旧唐楼到半山豪宅：这个被老天放错了地方的女孩，要在这座黄金遍地的城市里，亲手造出一个商业帝国。\n前世欠她一副好身体，今生还她一个盛世香江。\n【大女主文，本书叙事核心重头到尾都是女主，该书看的是女主是否能掌控自己人生与事业，不是统计书中有几个男配角色！作者不会为了迎合极端观点消除所有男性！所有配角都是推动剧情的需要！】", "tags": ["年代", "现代言情", "学霸", "女强", "前世今生", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [26.37, 27.24, 27.42], "trend": 1.04, "latest": 27.4, "wordNumber": 1112733, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "结婚不圆房！军官老公回来傻眼了", "fullTitle": "结婚不圆房！军官老公回来傻眼了", "link": "https://fanqienovel.com/page/7447551503377648702", "data": [19.15, 19.37, 19.5], "trend": 0.35, "latest": 19.5, "wordNumber": 1013313, "creationStatus": 0, "desc": "（年代文）\n（军婚 + 爽文+ 甜宠 + 日久生情 + 穿书 VS 穿越）\n一场车祸，把叶芳菲撞到了一本书里，书里的世界是平行时空的八十年代初。书里的男女主是她男人沈占勋的堂弟和堂弟媳，沈占勋是男女主踩着肩膀发财的垫脚石。\n在那本书里，沈占勋从部队转业到市公安厅，在解救一个重要人质时牺牲了，而他留下的人脉都成了男女主事业成功的托举。\n现在的沈占勋还没转业，但已经两年多没回来了，和原主结婚当天都没来得及圆房，就被一封电报给召回了部队。\n而这一大家人也没一个好惹的，她公婆性格绵软，爷奶强势，大伯大伯娘精明会算计，小叔小婶自私自利，还有一对高高在上的男女主，一大群不省心的堂哥堂姐堂弟堂妹。\n每个人都有自己的小心思，而最让人受不了的是，现在还住在一个院里，没有分家！\n叶芳菲看着糟心的一大家子，觉得这日子一天都过不下去了。\n分家，分家，必须分家，她要赚钱过好日子，这极品的一家，通通给我走开。\n立了大功的沈占勋从部队回来，却发现已经分家了，他家大门紧锁，听村里人说，他媳妇带着他父母兄妹去城里享福了，他却一无所知………", "tags": ["年代", "现代言情", "甜宠", "穿书", "日久生情"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [29.33, 28.68, 29.44], "trend": 0.11, "latest": 29.4, "wordNumber": 856387, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁残疾英雄，婆家宠我青云志", "fullTitle": "替嫁残疾英雄，婆家宠我青云志", "link": "https://fanqienovel.com/page/7630006960976317502", "data": [21.45, 21.22, 21.47], "trend": 0.01, "latest": 21.5, "wordNumber": 638757, "creationStatus": 1, "desc": "【年代甜宠+爽文+婆家宠上天】\n七十年代末，家境贫寒受尽欺负的杨巧，被迫替嫁嫁给断了双腿的退伍英雄周文辉。\n本是一场各取所需的婚姻，她以为往后日子只有柴米油盐的艰辛，却没想到嫁对了人，连带着婆家都把她宠上了天！\n公公是部队师长，婆婆是外科主任，全家上下把她当成心尖宝。\n从受尽冷眼的苦命姑娘，到被婆家捧在手心的宝贝，杨巧一路逆袭。\n恢复高考后，她埋头苦读考上大学，成为受人尊敬的老师。\n哥哥杨政潜心钻研假肢技术，终于让丈夫重新站了起来。\n没有金手指，只有细水长流的温情与步步向上的人生。", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "代嫁代娶"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [12.93, 14.88, 17.97], "trend": 5.05, "latest": 18.0, "wordNumber": 1783078, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒前妻再就业，汴京第一妙厨娘", "fullTitle": "恶毒前妻再就业，汴京第一妙厨娘", "link": "https://fanqienovel.com/page/7517953139266309144", "data": [13.96, 15.69, 17.18], "trend": 3.22, "latest": 17.2, "wordNumber": 575418, "creationStatus": 1, "desc": "【1v1双洁+穿书+美食+经营+日常向】\n一睁眼，叶昭昭穿成了权臣文男主的恶毒前妻。\n在书中，原主做梦都想当官夫人。\n她使尽浑身解数嫁给男主，却在男主官职被一撸到底后，不顾男主和孩子的挽留，和离回到了扬州老家，二嫁给了青梅竹马。\n只是不到一年。\n竹马就转手将原主送给上峰做礼。\n原主逃出来，辗转回到汴京，却发现新帝登基，男主一朝翻身、敕封摄政王，誉满汴京。\n原主这个前妻也变得人人喊打，最后被擅作主张的下人活生生饿死在了柴房里。\n穿书后的叶昭昭，当然不想重蹈覆辙。\n放着现成的幸福生活不要，非要回什么扬州投奔青梅竹马？\n她脑子又没进水，分得清好赖。\n小姑子难缠小叔子阴郁；\n不愁，她苦练高情商，应付两个半大孩子还不容易？\n男主颓废潦倒家里入不敷出；\n不怕，她有厨艺傍身，能眼睁睁看着丈夫孩子饿死？\n只是，她的汴京小食肆开业的那一日，怎么全汴京的权贵都来捧她的场了？\n说好的全家低谷三年、人人可欺呢？\n流水的银子哗啦啦地进账，这哪里用得着吃苦头呀！\n原本麻木沉郁的男主更是将叶昭昭视若珍宝，全家人的日子也越过越好。", "tags": ["种田", "古代言情", "美食", "穿书", "双洁", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [17.66, 19.07, 20.47], "trend": 2.81, "latest": 20.5, "wordNumber": 571648, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [17.56, 18.55, 19.51], "trend": 1.95, "latest": 19.5, "wordNumber": 4626208, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [19.33, 19.95, 20.74], "trend": 1.41, "latest": 20.7, "wordNumber": 894770, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [16.25, 16.5, 17.64], "trend": 1.39, "latest": 17.6, "wordNumber": 1639110, "creationStatus": 1, "desc": "【古言架空+女强+斗极品婆家娘家+养崽+无穿越+无重生+先婚后爱】\n　　银杏五岁就伤了身子，失去了做母亲的资格，尽管她长得好看又能赚钱。\n　　但依旧没有哪个人家愿意娶她，因为娶了她就变成绝户了。\n　　唯独村里的老鳏夫赖大，不但愿意娶她，还愿意出双倍的聘礼。\n　　这让银杏贪财的娘果断点头。\n　　收了五两银子的聘礼，让他把闺女直接领走。\n　　但银杏死活不肯，她知晓已经死了两个媳妇的赖大没安好心思。\n　　可在这封建的年代，婚姻向来是由父母做主。\n　　尽管她极力反对，但也无法改变贪财娘的想法。\n　　就在她绝望之时，那个藏在她心里多年的男人出现了。\n　　萧青北：婶子，我想娶银杏，希望您能同意。\n　　王氏：你要娶银杏？人家赖大出了五两银子的聘礼，你能拿得出来吗？\n　 萧青北：我能的。\n　　 银杏：青北哥，你真的要娶我吗？\n　 萧青北：嗯，跟我走吧。\n        银杏：大宝二宝，快叫爹！\n 大宝二宝：（他们可是皇子，怎么可能随便叫爹呢！）\n     萧青北：你们想学功夫吗？（这两个小子还真是块练武的好苗子）\n   大宝二宝：师父！（叫师父是可以的）", "tags": ["种田", "古代言情", "乡村", "女强", "养崽", "古色古香"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [28.2, 28.92, 29.22], "trend": 1.01, "latest": 29.2, "wordNumber": 909733, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [14.7, 15.38, 15.67], "trend": 0.97, "latest": 15.7, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [23.95, 23.5, 24.66], "trend": 0.71, "latest": 24.7, "wordNumber": 925518, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世：兽夫太凶猛", "fullTitle": "穿越兽世：兽夫太凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [12.69, 12.8, 12.89], "trend": 0.21, "latest": 12.9, "wordNumber": 1328196, "creationStatus": 0, "desc": "【穿越兽世＋轻快甜宠+生活日常＋1vN+多雄】\n千夏在21世纪是个勤勤恳恳的打工人，这天加完班回家路上被一辆失控的汽车撞死，没想到当她再睁开眼的时候是在一个巨大的山洞里。\n山洞阴暗潮湿让她惶恐，而她身上只围着一块抹胸样式和短裙样式的破烂兽皮，她不明白她明明死去了又怎么会出现在这里。\n难道......忽然见她脑袋里电光一闪，她又细细看了身上的兽皮，这......不会是像她看的兽世小说那样，穿越兽世了吧？？？\n别人的第一兽夫是四阶、五阶强者，她一个最不受欢迎的瘦弱丑雌的第一兽夫就是这大陆的顶尖战力强者。\n上辈子她兢兢业业连个恋爱都谈过，这辈子刚穿来没多久就肚里揣崽，还上演了一场兽世带球跑。", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "带球跑"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [40.14, 43.58, 46.96], "trend": 6.82, "latest": 47.0, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [37.44, 39.18, 40.91], "trend": 3.46, "latest": 40.9, "wordNumber": 503160, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "你听心声我吃瓜，换嫁夫妻笑哈哈", "fullTitle": "你听心声我吃瓜，换嫁夫妻笑哈哈", "link": "https://fanqienovel.com/page/7592502894293683224", "data": [14.84, 15.36, 15.94], "trend": 1.1, "latest": 15.9, "wordNumber": 579611, "creationStatus": 0, "desc": "【吃瓜乐子人男主 × 读心宠夫女主，先婚后爱，夫妻联手，单女主】\n我，裴辞镜，穿成侯府二少，只想躺平吃瓜。\n谁知大婚在即，我那世子大哥，竟和我未婚妻滚到了一起！\n现场吃瓜，苦主竟是我自己？\n正当我以为要沦为全京城笑柄时，那位本该成为我大嫂的沈家嫡女，竟主动提出：\n“不如，换我嫁你？”\n我表面稳如老狗，内心狂喜：这姑娘有眼光！\n可直到婚后某天我才发现不对，我内心OS正嗨：【我媳妇今天真好看，想亲……】\n她忽然转头，眼波流转：“准了。”\n等等！\n她能听见我的心声？！\n这下好了，我吃遍天下的瓜，她专吃我这只呆瓜。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "宠夫", "代嫁代娶"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "有了暴君读心术，我在宫里杀疯了", "fullTitle": "有了暴君读心术，我在宫里杀疯了", "link": "https://fanqienovel.com/page/7367580979906497560", "data": [11.94, 12.24, 12.56], "trend": 0.62, "latest": 12.6, "wordNumber": 925747, "creationStatus": 0, "desc": "安玖穿成了皇帝宫里想爬龙床的小宫女。\n一睁眼，暴君将勾引他的小宫女一剑刺了个透心凉。\n第二天，暴君刺死了嫔妃身边的大宫女。\n第三天，给皇帝试菜的宫女毒发身亡。\n宫女是个高危职业，安玖决定好好干活，多多存钱，珍爱生命，远离暴君。\n可此时她忽然听到了暴君的心声。\n　　“啊啊啊，烦死了烦死了烦死了，这些奏章写的都是狗屎吗？朕都说了不吃桃子，不吃桃子，不吃桃子，还天天问天天问天天问。”\n　　安玖？\n　　“新来的宫女是傻子吗？杵在那做灯台？没看见朕脖子都酸了，也不知道过来捏捏？”\n　　安玖挪动脚步，试探着捏了捏皇帝的肩膀…\n　　“御膳房的点心噎死人，李公公瞎了，不知道给朕倒杯水…”\n　　安玖挪过去倒了一杯茶…\n　　渐渐的，光华殿的宫女太监们发现，暴君的脾气似乎好了许多…\n　　后宫嫔妃喜极而泣，陛下的疯病好了，是不是可以侍寝了…\n　　\n　　“朕是种马吗？天天让朕翻牌子，这是人腰子，不是猪腰子…提到腰子，朕忽然想吃爆炒腰子了…”\n　　于是绿头牌没了，一盘美味的腰子端了上来。\n　　安玖从小宫女升职成掌事姑姑…\n　　某天，暴君说：“你甚得朕心，做朕的女人吧。”\n安玖发现她忽然听不到暴君的心声了…", "tags": ["古言脑洞", "古代言情", "穿越", "今穿古", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [25.24, 25.49, 25.78], "trend": 0.53, "latest": 25.8, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新的人生，结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君今日又没有藏好他的尾巴！", "fullTitle": "夫君今日又没有藏好他的尾巴！", "link": "https://fanqienovel.com/page/7565826198656273432", "data": [11.62, 11.83, 12.11], "trend": 0.49, "latest": 12.1, "wordNumber": 370843, "creationStatus": 0, "desc": "乔盈穿书了，但不幸的是，她被绑匪伤到了脑袋，失了忆。\n在阴暗潮湿的地牢里，她遇到了一个少年。\n少年一袭青衣，白发如雪，面容昳丽，却眼覆白绫，虽身有残缺，但他最是乐观爱笑。\n那一天，失忆的乔盈带着人畜无害的少年一起逃出了地牢。\n少年是个好人。\n因为怕血，所以哪怕是在尸山血海，他的衣摆也一尘不染。\n因为胆小，别人打架，他只敢躲在远处，众人却在下一刻死在毒雾里。\n因为善良，他给痛苦的敌人递药，可惜对方没熬住，七窍流血而死。\n于是，她决定和这样的好人成亲。\n再到后来，正派人士叫着妖孽，提剑而来。\n那一夜，尸横遍野。\n她终于想起来了剧情。\n这是一个诡异横生，光怪陆离的世界。\n有那么一个大反派，他缺乏正常人的情感，为祸苍生，引来纷争无数，最后是男女主牺牲生命才将他封印。\n腥风血雨里，少年回眸看她。\n蓝色的眼眸幽深诡谲，缀了血花的面容，宛若人间修罗，九条狐尾在身后肆意舒展，妖冶秾丽。\n乔盈被吓得脸色煞白。\n他却轻轻的笑，“你若是害怕想跑，可来不及——”\n话音未落，乔盈跑了，却是跑进他的怀里，拭去他脸上的血花，“你吓到我了，我还以为你受伤了！”\n少年眨眨眼，摸摸她的脑袋，又戳戳她的脸，“你是不是傻？”", "tags": ["古言脑洞", "古代言情", "反派", "穿书", "HE"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "公府真千金，宠得首辅肆无忌惮", "fullTitle": "公府真千金，宠得首辅肆无忌惮", "link": "https://fanqienovel.com/page/7626562728341015577", "data": [15.98, 16.05, 16.47], "trend": 0.48, "latest": 16.5, "wordNumber": 892543, "creationStatus": 1, "desc": "【真假千金+爽文+异能+小空间+女宠男+女主最强永不吃亏】\n【武力充沛美少女&体弱多病小娇夫】\n末世女王谢珊珊贪财又好色，穿成生下来就被生母掉包的宁国公府真千金。\n本想浪荡江湖，结果为了锦衣华服不得不进京认亲，绝不是为了和少年郎同路北上。\n调戏美貌解元公，掏空亲爹小金库。\n同时讲究以德服人，一言不合就开打。\n取代她以镇国公府大姑娘身份生活的假千金重生后想杀自己灭口？还想抱紧未来皇后的大腿？\n果断拯救难产太子妃，让未来皇后做不成太子妃。\n给皇帝增寿，继续独享圣宠。\n人人都以为谢珊珊会嫁入门当户对的公侯之家，她却嫁给心甘情愿吃软饭的病弱美少年裴矩。\n人人又说裴矩命不久矣，谢珊珊注定做寡妇。\n结果裴矩的身体一日好过一日，六元及第，起步就是六品翰林。\n人人嘲讽裴矩吃软饭，他却说：“我知道你们这些想吃软饭却吃不着的人在嫉妒我。”\n他一步一个脚印，才过而立之年便稳稳坐上内阁首辅的宝座，对喂他软饭吃的谢珊珊死心塌地，从不二色，婚后更是把谢珊珊宠上了天（不是）。", "tags": ["古言脑洞", "古代言情", "空间", "女强", "科举", "真假千金"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [26.58, 26.79, 26.96], "trend": 0.38, "latest": 27.0, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "闺蜜穿书，搞错男主", "fullTitle": "闺蜜穿书，搞错男主", "link": "https://fanqienovel.com/page/7604900854776220696", "data": [10.76, 10.82, 10.82], "trend": 0.05, "latest": 10.8, "wordNumber": 414528, "creationStatus": 0, "desc": "【闺蜜穿书攻略男主和反派+两对cp+轻松日常+系统】\n白真儿去世后，系统找上柳月缇，说她闺蜜穿书了。\n还把反派摄政王错认成了男主，兢兢业业攻略大半天，现在才知道认错了人，只能找她救场。\n白真儿：闺蜜闺蜜想不想跟我一起穿书喵喵喵！\n柳月缇：……认错了怎么了！反派和男主，闺蜜一个我一个！\n两人一个是丞相府嫡女，一个是远来投奔的表小姐，要完成系统任务，必须从一众女配中夺下女主之位！\n柳月缇：系统，为什么这些女配有绝世神功、超绝医术、甚至是重生剧本啊！\n白真儿：就是就是！我们难道就没有金手指吗？\n系统：你们有啊。\n系统：你们有两个人。\n柳月缇&白真儿：……看来只能智取了。\n总之后来——\n真·男主凌不斩：你就不能看住你老婆吗？她天天睡我老婆床上什么意思？\n大反派·沈寒之：真儿天真，不谙世事，你就不能让柳月缇把她送回来吗？", "tags": ["古言脑洞", "古代言情", "系统", "反派", "穿书", "攻略反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "老太片场跑龙套，养活古代一家人", "fullTitle": "老太片场跑龙套，养活古代一家人", "link": "https://fanqienovel.com/page/7614407271283444798", "data": [17.5, 18.09, 19.46], "trend": 1.96, "latest": 19.5, "wordNumber": 607824, "creationStatus": 0, "desc": "王莲花上山挖野菜，一脚踩空——\n再睁眼，到了个妖怪窝。\n铁壳子满地跑，比马车还快。\n人穿得露胳膊露腿，不知羞！\n房子高得脖子仰断都看不见顶。\n王莲花攥紧背篓，心里只有一个念头：这咋回去？家里还等着野菜下锅呢！\n正懵着，一张纸片子塞到她手里：“阿姨，剧组招群演，盒饭管饱，一天八十！”\n王莲花不识字，但“盒饭管饱”四个字，她听懂了。\n一把拽住那人：“大兄弟，这活我能干！”\n第一天进组，演尸体。\n导演喊“卡”之后别人都爬起来了，她还直挺挺躺地上，眼睛闭得紧紧的。\n场务吓一跳：“阿姨？阿姨你醒醒！”\n王莲花睁开眼，一脸忐忑：“这就完了？我看旁边那人不是躺了老半天吗？我躺够时辰没？能结账不？”\n场务：“……阿姨，您多躺的这一会儿不算钱。”\n王莲花心疼坏了：亏了，躺多了。\n后来剧组发现，这个农村大姐简直是宝贝。\n演逃荒的难民，她往地上一坐，眼神里的绝望把场务都看哭了——这老太太是真有故事啊！\n演村妇骂街，她袖子一撸，一口气骂三分钟不带重样，把全场演员都镇住了。\n工资日结，王莲花拿着那纸钞，知道这钱能买多少米、多少肉、多少布，手抖得跟筛糠似的。\n她当场就哭了，要是早点来这个地方，她男人是不是就不用死了？", "tags": ["现言脑洞", "现代言情", "穿越", "娱乐圈", "空间", "古穿今"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成超稀有雌性，被大佬们追着宠", "fullTitle": "穿成超稀有雌性，被大佬们追着宠", "link": "https://fanqienovel.com/page/7342778447090945049", "data": [25.04, 25.72, 26.75], "trend": 1.71, "latest": 26.7, "wordNumber": 1344703, "creationStatus": 1, "desc": "（星际+兽人+万人迷团宠女主+男全洁+全程甜宠）\n年荼意外穿越，穿到星际帝国。\n睁开眼就被一群帅男人包围，每个都争着想做她的伴侣。\n兽人雄多雌少，雄性战斗力极强，但需要雌性精神力安抚，否则迟早会失去理智成为真正的野兽，早早死去。\n而年荼检测出帝 222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成早死的炮灰原配，我怒嫁反派", "fullTitle": "穿成早死的炮灰原配，我怒嫁反派", "link": "https://fanqienovel.com/page/7199806910327950392", "data": [18.24, 18.49, 18.66], "trend": 0.42, "latest": 18.7, "wordNumber": 1775762, "creationStatus": 0, "desc": "【影视版权已售】吕颂梨穿书了，穿成《权臣的娇美继室》里男主谢湛的炮灰原配。\n　　\n　　书里，原主会被从流放之地衣锦归来的好友赵郁檀抢了丈夫。他们在她重病时暗通曲款，活活气死了她。\n　　\n　　吕颂梨正打算撸起袖子手撕渣男贱女，却发现赵郁檀不打算维持原著剧情了，她想让两人互换未婚夫。吕颂梨默默地让她把渣男抢走了。\n　　\n　　但是，他们为什么还要请太后娘娘强行给她和秦晟赐婚？\n　　\n　　嫁进注定要被流放的秦家，她只好撸起袖子干了。\n　　\n　　不料干着干着，摊子越铺越大。\n　　\n　　秦家也没办法了，为了护着这摊子，只能打仗打仗再打仗。\n　　\n　　最后，吕颂梨和秦晟二圣临朝了，史称吕皇秦帝。\n　　\n　　秦吕两家一跃成为新朝最顶级的权贵。\n　　\n　　一次喝酒中，好友问秦晟，怎么会想到造反的？\n　　\n　　世代忠良的秦晟睁着微醉的眼眸说，商队是妻子给划拉起来的，贤士是妻子给招的，招兵买马的钱是妻子给的，一不小心妻子就为他们凑齐了造反的资本。\n　　\n　　妻子把摊子搞大了，不造反成功，他们很难收场的。\n　　\n　　天下：原来他们新朝两位圣人的皇位是这么来的啊，吕皇果然野心勃勃。\n　　\n　　吕颂梨：滚蛋，这个锅她不背！他们老秦家在原著里就造反了好吗？", "tags": ["宫斗宅斗", "古代言情", "宠妻", "穿越", "甜宠", "反派", "穿书", "虐渣", "今穿古", "打脸", "1v1", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女训狗无数！攀高枝！引雄竞", "fullTitle": "恶女训狗无数！攀高枝！引雄竞", "link": "https://fanqienovel.com/page/7500532008481721369", "data": [16.87, 17.14, 17.16], "trend": 0.28, "latest": 17.2, "wordNumber": 1098293, "creationStatus": 0, "desc": "（短剧《红鸾引》已上线）\n【恶女不洗白+精致利己+训狗+雄竞修罗场】\n云绮穿进了故意丑化她的话本子里。\n从权倾朝野、面首无数的长公主，一朝沦为侯府声名狼藉的假千金。\n而真千金却成为侯府明珠，未来是母仪天下的皇后，还让一众天之骄子为她倾倒。\n睁开眼，得知被她下药的冷硬将军要休了她。\n休了好啊。\n这跟笼中雀被放归山林有什么区别。\n-\n侯府要将她扫地出门。\n她反手便将侯府能灭门的罪状甩过去。\n这些事他们没干过？\n没干过她可以造谣啊。\n-\n满京城人人嘲讽她脑袋空空，蠢笨无知。\n她从不解释。\n装逼这种事，就得等哪天装波大的才行。\n-\n京中不知何时流传开新话本，名为《恶女驯犬录》\n第一章：冷硬将军变忠犬，前夫哥冷脸洗内裤。\n第二章：阴郁弟弟不听话，拴上条狗链就好了。\n第三章：竹马世子恨她要死，亲懵就没力气骂人了。\n第四章：高岭之花丞相只可远观，她偏趴人身上看。\n第五章：谁说救风尘的只能是男人？\n……\n云绮倚在榻上翻完最后一页，随手将话本子扔进炭盆。\n她懒懒望了眼漫天飞絮——这京城的雪，比话本子好看多了。\n-\n（万人嫌爆改万人迷，坏女人得到一切。女主名取自「行到水穷处，坐看云起时」）\n（男全洁！没有前世！这世界就是为女主而诞生，女主来的时间点世界开始运转）", "tags": ["宫斗宅斗", "古代言情", "扮猪吃虎", "反派", "穿书", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高门主母的驯夫手册", "fullTitle": "高门主母的驯夫手册", "link": "https://fanqienovel.com/page/7550793954933885976", "data": [22.12, 22.17, 22.16], "trend": 0.04, "latest": 22.2, "wordNumber": 547008, "creationStatus": 0, "desc": "程昭被赐婚给最年轻的国公爷周元慎。\n　　周元慎有一房背景强大的娇妾，又与寡嫂暧昧不清，憎恶高门贵女身上的古板沉闷。\n　　偏程昭是受过最正统教养的贵女。\n　　面对国公府层出不穷的争斗、小妾的挑衅、寡嫂暗中拨火，程昭解决起来游刃有余。\n　　“我嫁过来做主母，就是替国公爷收拾烂摊子的。”程昭温良恭俭。\n　　待我地位稳固，有了子嗣，下一个被收拾的烂摊子，就是国公爷你。\n　　——*——*——\n　　初见时，周元慎觉得程昭虚伪狡诈；相处日久，赞她恢廓大度、见识广博。\n　　他周元慎的夫人，没有任何缺点。唯一不好的，是她心中另有所属，不爱他。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不求真心求苟活，奈何帝王偏爱我", "fullTitle": "不求真心求苟活，奈何帝王偏爱我", "link": "https://fanqienovel.com/page/7527423000799366168", "data": [16.43, 16.38, 16.46], "trend": 0.03, "latest": 16.5, "wordNumber": 452388, "creationStatus": 0, "desc": "【腹黑偏执帝王×娇憨乖软美人｜双洁｜双向救赎｜养成系|恋爱脑的双向奔赴～】\n江映梨做了四年肃王侍妾，肃王萧承澜不好女色，府里只她一个妾室，日子安稳自在。本以为能一直这样安稳下去，没想到，肃王登基了。\n她从小小肃王侍妾一跃成为新帝的嘉婕妤，直接误闯天家。\n后宫让江映梨害怕，不想争宠，只想远离是非苟到最后。没想到，她不争宠，成了新帝的肃王却变着法子宠她。\n入宫第一天抱她坐龙椅，碰瓷她的妃子禁足的禁足，杖毙的杖毙，甚至，他还甘愿让她坐龙撵，他在一旁步行。\n被偏宠遭到嫉恨怎么办？陛下帮她宫斗挡下一切\n出身商户身世太低怎么办？陛下送她弟弟去军中历练，拿下军功直接封候，她直接变高门贵女\n群臣催立后怎么办？陛下说，她是他一手养大的，只有她能与他并肩，毅然封她为后\n一不小心生了个皇长子怎么办？陛下说子凭母贵，她的孩子一出生就是太子，给襁褓婴儿立下诏书，群臣震惊\n江映梨以为后宫是深渊，肃王府那样安稳的小日子再也回不去，但萧承澜还像从前那般予她无限偏宠…\n———\n两个年少时都没得到过爱的人如何相爱？\n一个爱得谨小慎微，一个爱得偏执又笨拙\n后来的他们，是史书上都承认的独宠，是情深一世的少年帝", "tags": ["宫斗宅斗", "古代言情", "腹黑", "甜宠", "双洁", "养成"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生在龙塌，宠妃抱着陛下哭", "fullTitle": "重生在龙塌，宠妃抱着陛下哭", "link": "https://fanqienovel.com/page/7452204681780005950", "data": [17.29, 17.35, 17.32], "trend": 0.03, "latest": 17.3, "wordNumber": 461096, "creationStatus": 0, "desc": "【娇纵又乖媚的宠妃VS温润如玉白切黑帝王(非双洁，开篇后独宠，从头宠到尾)】\n\n姜姝仪顺风顺水的做了十五年宠妃，帝王温柔仁慈，对她宠溺无度，后宫之中没有一人敢与她争锋。\n\n可她眼瞎，没看出亲妹妹的狼心狗肺，以至于到最后被至亲揭发了罪行，儿子也厌恶地看着她：“我如果是姨母所生的就好了！”\n\n一时间妖妃之名传遍天下，也只有帝王对她不离不弃，将她锁入宫殿，名为囚禁，实则夜夜都会与她同寝。\n\n帐幔低垂，帝王抚摸着她的脸颊，一遍 : [7.17, 9.54, 12.0], "trend": 4.83, "latest": 12.0, "wordNumber": 854687, "creationStatus": 0, "desc": "1932年，乡野姑娘素芬为追求自由与爱情，不顾爹娘反对，没要一分彩礼，没办婚宴，跟着心上人陈春生私奔到了码头。\n两人在棚屋安了家，陈春生扛粮袋挣血汗钱，素芬缝补浆洗补贴家用，清苦日子里满是盼头。\n可等陈春生攒了些小钱，心就野了，被城里花枝招展的姑娘缠上，夜不归宿成了常态。\n素芬怀上孩子，哭着劝他回头，换来的却是陈春生的打骂。\n争执间，她被推倒在地，孩子没了，多年的感情终究是错付了。\n素芬走投无路回了老家，她早已名声扫地……\n从此，素芬孤身一人，白天捡垃圾、收废品，夜里提着篮子走街串巷卖打火机。\n风餐露宿、受尽白眼，这个苦命的女人凭着一股韧劲，在尘埃里挣扎求生，只为守住最后一点尊严。", "tags": ["民国言情", "现代言情", "民国", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穷妻", "fullTitle": "穷妻", "link": "https://fanqienovel.com/page/7640798769482583065", "data": [10.54, 11.37, 11.94], "trend": 1.4, "latest": 11.9, "wordNumber": 357710, "creationStatus": 1, "desc": "凤霞长得标致，却是村里最不安分的姑娘。\n她没文化、没家底，也没挣钱的本事，一心就想嫁户好人家，过上好日子。\n仗着一副好皮囊，她把嫁人当成改命的唯一出路，改嫁了一个又一个男人。\n总以为下一个男人能让她吃饱穿暖、不再受苦，可造化弄人，嫁的男人竟一个比一个穷……", "tags": ["民国言情", "现代言情", "乡村", "民国"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "苦命村妇", "fullTitle": "苦命村妇", "link": "https://fanqienovel.com/page/7650036980222282814", "data": [4.8, 5.3, 5.15], "trend": 0.36, "latest": 5.2, "wordNumber": 334487, "creationStatus": 1, "desc": "还原民国初年，淮北平原上的柳沟村。村妇翠莲的乡村故事。\n一个死了丈夫，被婆家嫌弃，被娘家抛弃的村女，一生的心酸无赖", "tags": ["民国言情", "现代言情", "乡村", "民国"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "督军开门！小奶团背着黄金来旺家", "fullTitle": "督军开门！小奶团背着黄金来旺家", "link": "https://fanqienovel.com/page/7487639328680578072", "data": [2.1, 2.22, 2.31], "trend": 0.21, "latest": 2.3, "wordNumber": 1000703, "creationStatus": 0, "desc": "【民国+团宠+萌宝奶团+锦鲤+青梅竹马】\n刚出生的舟舟被亲生父亲和小妾的女儿掉包，遗弃在大街上。\n督军家的小少爷将她捡回了家。\n从此落败的督军府，有了翻天覆地的变化。\n战死的督军，生龙活虎的回来。\n老旧的宅子，挖出成千上万的黄金。\n倒闭的纺织厂，日进斗金赚得手软。\n家有中风的老夫人？“祖母放心，你不仅能站起来，还能跳华尔兹。”\n家有小产的大嫂？“大嫂别怕，你将来一定能生个龙凤胎。”\n从此之后，督军家福运绵绵。\n年轻夭折的大儿子活了，失踪的二儿子成商界精英。\n三儿子的疯病痊愈，四儿子留洋归来。\n哑巴小儿子不仅能开口说话，还聪慧过人。\n督军家的福运小锦鲤，一天天长大，成了全家人的小团宠。\n更是小少帅傅卿昭，从小到大放在心尖上小青梅。", "tags": ["民国言情", "现代言情", "萌宝", "团宠", "青梅竹马", "民国"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "民国闺秀", "fullTitle": "民国闺秀", "link": "https://fanqienovel.com/page/7595165044405455897", "data": [2.56, 2.68, 2.74], "trend": 0.18, "latest": 2.7, "wordNumber": 638841, "creationStatus": 0, "desc": "沈青瓷原以为这一生可以在苏州老宅里安然度日，春日看花，秋夜听雨，守着祖产过完一辈子。\n\n　　可乱世容不下这份安然。\n\n　　十七岁那年，她流落上海，被秦家收留。秦父秦母待她如亲女，秦渡那个上海滩出了名的混世魔王，偏偏对她上了心。他说等来年春天局势稳了，就娶她过门。\n\n　　来年春天没等到。秦父惨死，秦渡重伤，秦家大厦将倾。为救他，她孤身北上，踏进北平顾家那座深不可测的宅院里。\n\n　　顾言深解了秦家的困局，也把她困在了自己身边。那个男人用手段得到了她，却在日复一日的相处中，让她看见矜贵面孔底下藏着的笨拙与真心。她从江南烟雨走进北地风沙，从沈家小姐变成顾少夫人。\n\n　　后来她才明白，有些路不是自己选的，走上去，也就成了自己的路。", "tags": ["民国言情", "现代言情", "总裁", "民国"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "顶级狂妄", "fullTitle": "顶级狂妄", "link": "https://fanqienovel.com/page/7428813474534280217", "data": [7.5, 7.59, 7.66], "trend": 0.16, "latest": 7.7, "wordNumber": 380753, "creationStatus": 0, "desc": "徐白家道中落。\n　　未婚夫与名门女暧昧，又不肯放开她：“你等着结婚，我不会嫌弃你。”\n　　徐白因这门婚约，受尽了羞辱与刁难。为自保，她搭上了未婚夫的小叔叔，南城有名的混蛋。\n　　这男人风流、残暴、野心勃勃。徐白与他各取所需，竟是在风雨飘摇中站稳了脚跟。\n       “你回头是岸。”未婚夫说。\n       “他说他是岸。”男人附耳，“把这岸炸了吧。”", "tags": ["民国言情", "现代言情", "总裁", "民国", "豪门世家", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "挚欢", "fullTitle": "挚欢", "link": "https://fanqienovel.com/page/7438493454365101080", "data": [1.9, 1.97, 2.04], "trend": 0.14, "latest": 2.0, "wordNumber": 524260, "creationStatus": 0, "desc": "温瓷出国学医七年，一心回国搞事业，没想到，回来被迫先领了张结婚证。\n丈夫傅景淮是总督府二少帅。\n颜值高，手段狠。\n领证那天，男人一身暴戾警告她：“别以为扯了证你就是我妻子，敢造次，我第一个崩了你。”\n后来，男人又说：“你是我夫人，该有的体面，我会给你。”\n再后来，男人强势入住她的卧室：“我是你丈夫，这是你该尽的义务。”\n温瓷忍无可忍：“我们是假结婚，权宜之计。”\n傅景淮：“那就把它做成真的，正好你欠我四条命，是时候清算一下了。”", "tags": ["民国言情", "现代言情", "总裁", "婚恋", "民国", "医生"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRa t": 6.3, "wordNumber": 444150, "creationStatus": 1, "desc": "【地狱重生杀手×偏执刑侦队长｜双强相爱相杀｜刑侦悬疑反转｜HE】\n一枪贯穿额骨，江离死在她宿敌凌执面前。\n她是暗网封神的顶尖杀手A，双手染血，亦暗中救下无数无辜之人。\n罪孽与功德纠缠，地府无法审判，送她借尸重回人间。\n睁眼，她成了被拐卖虐杀的可怜少女，满身伤痕，前路皆是豺狼。\n这一世，她主动拨通那个与她不死不休的刑侦队长电话。\n\n前世猫鼠追猎，他拼尽全力缉拿她归案，两人刀尖相向，不死不休；\n今生她弃暗投明，硬闯刑警队，以一身杀人技法，撕开所有藏在正义皮囊下的肮脏罪孽。\n\n人人都说杀手本性难改，视律法如无物。\n唯有凌执看清她藏着的挣扎与温柔。\n她精通所有犯罪诡计，看透人性阴暗；\n他手握刑侦所有规则，坚守世间公道。\n\n昔日死敌，被迫并肩查案。\n明暗拉扯，步步博弈，爱意与杀意共生。\n江离：我从地狱回来，只为扒开所有没被审判的罪。\n凌执：地狱太黑，往后光明，我陪你一起走。\n\n✨高燃双强互钓｜连环凶案反转不断｜全员助攻｜前世今生宿命拉扯｜全程无虐HE", "tags": ["女频悬疑", "悬疑", "重生", "推理", "破案", "悬疑恋爱"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "蛇仙", "fullTitle": "蛇仙", "link": "https://fanqienovel.com/page/6990261702142987295", "data": [4.86, 4.99, 5.23], "trend": 0.37, "latest": 5.2, "wordNumber": 1996224, "creationStatus": 0, "desc": "《漫剧七日蛇缠已上线》我叫安心，‘青龙娶亲’那天，我曾祖父杀死了一青一白两条蛇，村民说，那是长角化蛟要飞升做蛇仙的。\n　　我出生那晚，我爷爷跪在蛇庙一宿，我妈才把我生下来，他却死在蛇庙。\n　　我打小，梦中就会出现一条蛇，他说，我是他的新娘。\n　　突然有一天，我的堂哥堂姐突然出事，我们回到村子，玉佩丢了，他却出现了……", "tags": ["女频悬疑", "悬疑", "乡村", "灵异", "第一人称", "悬疑恋爱"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶魔逆位", "fullTitle": "恶魔逆位", "link": "https://fanqienovel.com/page/7190722474613410872", "data": [5.11, 5.25, 5.4], "trend": 0.29, "latest": 5.4, "wordNumber": 737730, "creationStatus": 0, "desc": "“如果我要杀他，我不会用这种拙劣得可笑的方法。”\n\n询问室里，黑衣黑发的女孩说完这句话之后就再也没开过口。\n\n她气定神闲看着照片的样子，更像是在欣赏被害人残酷的死法。\n\n照片里，白色冰凉的浴缸，满浴缸触目惊心的鲜血，里面斜躺着一个仅露出肩部以上、皮肤死白的男人。\n\n这是死者周海雄，48小时之前被虐杀。", "tags": ["女频悬疑", "悬疑恋爱", "推理"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漫画预言杀人事件", "fullTitle": "漫画预言杀人事件", "link": "https://fanqienovel.com/page/7477901455727283225", "data": [4.81, 4.97, 5.05], "trend": 0.23, "latest": 5.0, "wordNumber": 393660, "creationStatus": 0, "desc": "【漫画师 X 复仇者】陈荷三年前坑掉的一部扑街漫画突然爆火，原因是预言了一宗凶案。\n　　网友们在漫画评论区瑟瑟发抖：\n　　[你 test": 5.5, "wordNumber": 1900507, "creationStatus": 0, "desc": "十八岁那天开始，我总是会做一个梦，梦里飘着戏曲歌谣，唱着“蛇抬轿，鬼送亲！“\n       我天生阴命，命格奇特，自带一双阴阳眼，自小便能见到鬼魂。\n　　据说我出生那天晚上，万蛇涌现，屋前屋后，涌进来无数条蛇，直到我呱呱坠地，那些蛇才朝我这个方向点着蛇头朝我拜了三拜后才离去。\n       村里的老人皆说我是被蛇庇佑出生的小福娃，但他们看我的眼神，却满是复杂，有心疼，有惊惧，亦有感恩，仿佛藏着惊天大秘密。\n　　我平生最怕蛇，却荒唐的被全村人逼迫嫁给蛇君——-村里千年前供奉的已化成人形的大蛇。\n　　中元节那天，我被迫穿上大红嫁衣，被我爷爷送到了老祠堂出嫁。\n       午夜12点，无数条吐着蛇信的大蛇，抬着大红花轿，出现在了我面前……\n", "tags": ["女频悬疑", "悬疑恋爱", "乡村", "灵异"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三嫁阎君", "fullTitle": "三嫁阎君", "link": "https://fanqienovel.com/page/7588095605168163865", "data": [8.9, 9.0, 8.99], "trend": 0.09, "latest": 9.0, "wordNumber": 506135, "creationStatus": 1, "desc": "二十岁这年，我爸给我抢了一桩人人都惧怕的婚事。\n婚期定在七月十五，鬼节，而我要嫁的他……\n也不是人。\n只因我出生就没有心跳，是我爸用秘术吊着我的命，只有和这个神秘老公结婚才能得一线生机。\n成婚当天夜里，漫天飞舞的纸钱中，诡异的纸人携着八抬凤辇从天而降。\n我代替了同村少女成为了他的妻。\n结婚后，父亲诡异失踪，留下一本《世间百鬼录》，从此我携百鬼录踏入了奇幻诡谲的世界。\n千年尸王是我的保镖，万年灵物成为我的法器，渡灵扇在手了却世间万千执念，灵愈之力治愈三界山精鬼怪，我成为世间独一无二的渡灵师。\n而我的那个神秘老公，他说娶我非他所愿，等到约定期限一到，他便给我自由并赐予我长命百岁。\n我欣然接受，离婚而已，可以再嫁。\n可是……\n我都三嫁了，新郎怎么还是他？", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱", "风水秘术"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "起猛了，夫人她好像手撕厉鬼了！", "fullTitle": "起猛了，夫人她好像手撕厉鬼了！", "link": "https://fanqienovel.com/page/7468317647302560793", "data": [4.12, 4.13, 4.19], "trend": 0.08, "latest": 4.2, "wordNumber": 1342411, "creationStatus": 0, "desc": "【玄学➕沙雕微恐➕抓鬼➕灵异➕算命➕爽文】\n\n    林家丢了二十年的小女儿找回来了，听说是在道观里长大的。\n\n    下山第一天，搭手给方家大少把出来了喜脉。\n\n    下山第二天，掐指一算，说李总被老婆戴了绿帽子，儿子不是自己的。\n\n    下山第四天，去方家公司，开水浇死了发财树，一拳献祭了程序员，并且从五楼跳下去还毫发无伤。\n\n    下山第n天，掐指一算，说从苏家千金肚子里生出来的宝贝儿子是上门女婿和外面野女人的。\n\n    乱了乱了，全乱套了。\n\n    全京城大佬都跪着求她别算了。\n\n    众人一个接一个的去方家那位掌权人面前告状，方砚珩看着一脸满足吃小蛋糕的林知知，斩钉截铁的说对方在造谣。\n\n    直到林知知当他的面轻轻松松将一只厉鬼一拳打的灰飞湮灭。\n\n    方砚珩:起猛了，好像看到老婆手撕厉鬼了！\n\n    怎么办，急，在线等。", "tags": ["女频悬疑", "悬疑", "灵异", "搞笑轻松", "捉鬼"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玫瑰燎火", "fullTitle": "玫瑰燎火", "link": "https://fanqienovel.com/page/7587364940483136537", "data": [4.22, 4.31, 4.28], "trend": 0.06, "latest": 4.3, "wordNumber": 345437, "creationStatus": 0, "desc": "【刑警队长VS明艳法医】\n【甜宠互撩｜极限拉扯｜双体制内｜破案恋爱两不误】\n叶允棠美艳无双，是朵带刺的玫瑰。\n前夫哥嫌她是法医，出轨找小三。\n没关系，离婚那晚，她勾搭上了小三的前未婚夫。\n男人又冷又帅，大长腿，公狗腰。\n春风一度，她以为再也不见。\n换到新单位，没想到他是刑警队长。\n丁克夫妻案，雨夜凶杀案，校园霸凌案……\n联手破案期间，她对他生出好感，频频施展撩技。\n他却端着冷脸，毫无反应。\n她转头去酒吧看男模跳扫腿舞，吹口哨，叫宝贝。\n谁知，向来冷静自持的男人失控了。\n深夜他将她抵在墙角，“你叫谁宝贝？”\n她将他推开，“反正不是你。”\n“但我的宝贝是你。”他咬住她唇角，“宝贝，跟我结婚。”\n她是敢在他心尖纵火、又撩又野的红玫瑰。\n他是破案无数，却栽在了她手里的铁血硬汉。\n-\n感情破案双线并行～包甜的\n破案细节可能不够严谨，请勿深究～", "tags": ["女频悬疑", "悬疑", "推理", "甜宠", "破案", "悬疑恋爱"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让蟑螂当线人后，她成重案组团宠", "fullTitle": "让蟑螂当线人后，她成重案组团宠", "link": "https://fanqienovel.com/page/7586232553372126232", "data": [14.5, 14.48, 14.56], "trend": 0.06, "latest": 14.6, "wordNumber": 930300, "creationStatus": 1, "desc": "【无cp】+【破案】+【另类听懂“兽”语】\n\n唐苁觉醒异能那晚，偷吃零食的老鼠给她直播凶案：“你邻居，成无脑女尸了！”\n\n唐苁：……我这是拿了什么阴间剧本？！\n\n别人听萌宠心声，她听四害开大会。\n\n靠这份离谱的“情报网”，唐苁帮警方连破奇案，从嫌疑犯翻身成特聘顾问。\n\n看不起她的精英警官，纷纷被她用“玄学破案法”打脸到自闭！\n\n警局王牌待遇没享受多久，她家蟑螂从某个大使馆带回一份“小礼物”。\n\n国安部亲自约谈，“唐小姐，我们有个任务，需要你的‘朋友们’配合。”\n\n从此，她档案封存。\n\n职称变更为【国家一级保护人类·害虫调度中心主任】。\n\n国际间谍圈也开始流传一个战栗的传说：\n\n“小心那个东方的女人，她的眼睛……是这座城市本身。”\n\n唐苁笑笑：都低调，鼠鼠们，今晚十二点，总攻开始！\n\n刑侦？她的眼线遍布下水道！", "tags": ["女频悬疑", "悬疑", "推理", "无CP", "破案", "悬疑恋爱"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玫瑰利刃", "fullTitle": "玫瑰利刃", "link": "https://fanqienovel.com/page/7211480528497675279", "data": [3.95, 3.97, 4.0], "trend": 0.06, "latest": 4.0, "wordNumber": 1092931, "creationStatus": 0, "desc": "严肃正义刑警队长VS乖巧能打实习女警\n姜不寒是刑警支队的新人实习生。\n邢念生本以为，长得太漂亮的美女，一般能力有限。\n“我的刑警队不需要花瓶。”邢念生板着脸道：“实习三个月，不行滚蛋。”\n谁料到这个花瓶，身高腿长武力值爆表，一拳能把壮汉打趴。心思细腻眼神敏锐，能在蛛丝马迹中寻找线索。可盐可甜造型百变，上山下海勇往无前。\n三个月后，邢队长严肃道。\n“小姜是我们支队的心肝大宝贝，谁也 先婚后爱，贫困小夫妻励志日常】\n　　郑浔佳摆烂了二十年，本想着豪门顺风顺水，一辈子当个爸妈娇养的金丝雀。\n　　没想到，她是被抱错的假小姐。\n　　郑家真正的小姐高傲强势，回来之后，郑浔佳两回合就败了，还被算计着，和家里新来的保镖滚了床单。\n　　郑浔佳灰溜溜的离开了豪门，嫁给了冷冰冰的保镖，住进了合租房。\n　　庆幸的是，老公赚五千给她三千，赚五万给她四万，赚五千万给她……咦，老公赚到了五个亿？她有了大房子大钻戒？\n　　......\n　　厉锋创业失败，临时找了个保镖工作，结果被人下药，为负责任和主家的小姐结了婚。\n　　虽然小姐身份是假的，但小姐冰肌玉骨，又乖又软，好看得要命，一口一个“老公”，据说她以前零花钱三万，但现在三千也毫不嫌弃，反而省吃俭用给他加餐。\n　　据说主家的家底有一个亿，厉锋发誓，他给小姐赚来两个亿。", "tags": ["豪门总裁", "现代言情", "先婚后爱", "冰山", "真假千金", "忠犬"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "京澳春潮", "fullTitle": "京澳春潮", "link": "https://fanqienovel.com/page/7470466292764380222", "data": [38.8, 39.28, 39.76], "trend": 0.96, "latest": 39.8, "wordNumber": 400878, "creationStatus": 0, "desc": "【实体于26年8月7日晚19点预售】\n【大小姐vs三教九流】又名《京澳春潮》\n温凝第一次在澳岛看见谢之屿，就知道他是个危险的男人。即便他当时只是混迹在糖水铺，安安静静用面前一碗绿豆沙。\n窄小的店铺，人声鼎沸，无人敢同他拼桌。方圆数米，是被刻意隔绝出的一片孤岛。\n“他是谁？”\n“谢之屿。在澳岛没人敢惹他，你最好别——啊喂，你去哪？”\n温凝弯起眉眼：“去认识一下啊。”\n***\n澳岛到京城，2260公里。\n谢之屿发誓这辈子不会再踏入这片地界，却还是在她订婚前赶去将她抓了起来。\n“你来做什么？”\n隔着薄薄一片门板，未婚夫在外等候。温凝的声音透出紧张。\n“做什么？”谢之屿徐徐摩挲她无名指上那枚素戒，眸光暗沉，“戴着我送的戒指，想嫁谁？”", "tags": ["豪门总裁", "现代言情", "总裁", "豪门世家", "大小姐"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "地久婚长", "fullTitle": "地久婚长", "link": "https://fanqienovel.com/page/7557023909992729625", "data": [25.54, 25.77, 26.13], "trend": 0.59, "latest": 26.1, "wordNumber": 378462, "creationStatus": 0, "desc": "先婚后爱/细水长流甜文\n傅青绍答应联姻的唯一要求就是，他希望未来的妻子跟他没有感情纠缠，简而言之就是希望对方不爱自己，能相敬如宾最好。\n孟家最小的女儿孟瑜，非常符合他的标准。\n她刚刚跟前男友分手，被逼相亲的时候眼角还有泪痕。\n-\n孟瑜跟傅青绍领证后，男人就赶赴国外开辟欧洲市场，江城顶级豪门傅氏继承人，清冷禁欲，为人淡漠又严苛，在商场上雷厉风行。\n两人相差五岁，除了必要的夫妻义务之外，互不打扰。\n所有人都以为，傅青绍对这位联姻妻子并没有感情，直到有一天，孟瑜喝多了酒，跟傅青绍拥吻的时候迷迷糊糊喊了一句前男友的名字，对方眼神盛满暴风雪，紧紧掐着她的细腰。\n孟瑜急忙道歉。\n可是他却失了态，声线不稳的逼问。\n“你想跟我离婚去找他是吗？”\n孟瑜没有想过离婚，她认认真真的经营傅太太的身份，保证不会出现上次的乌龙事件，但是傅青绍受够了这种相敬如宾的生活。\n“孟瑜，你的心里，能不能有一点点我...”\n“孟瑜，忘记他，爱我好吗。”\n“孟瑜，我们要个宝宝好吗？”\n是他先沦陷，无可救药。\n坚韧小白花X冰山贵公子/年龄差5", "tags": ["豪门总裁", "现代言情", "总裁", "婚恋", "甜宠", "闪婚", "先婚后爱"], "borderColor": 回京后的秦金枝嚣张依旧，回城当天就当街打掉皇子的牙！\n仗着帝后的宠爱竟诬陷裴瑾年父亲下毒害她，裴瑾年为救父亲退了婚约，请求皇帝赐婚。\n可一切尘埃落定之后，裴瑾年发现这嚣张跋扈的小郡主并不喜欢他。\n婚事另有隐情！\n\n所有阻拦我的人，都会拜倒在我秦金枝无与伦比的权势之下。\n\n泥潭里的人，做梦都在妄想攀上我这根金枝儿！\n\n", "tags": ["古风世情", "古言权谋", "古代言情", "公主", "团宠", "无CP", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死去的外室她成了国公府的表小姐", "fullTitle": "死去的外室她成了国公府的表小姐", "link": "https://fanqienovel.com/page/7579634085035772990", "data": [12.48, 12.38, 12.66], "trend": 0.18, "latest": 12.7, "wordNumber": 1127093, "creationStatus": 1, "desc": "原书名《冒认贵女》\n【古风群像】【权谋】【非重生】\n【剧情流】【有cp】【男洁】\n【群像，多主角，多视角】\n【裴庾欢是女主之一，陈蛮也是女主之一，主角栏签约后不能改，写的是本文主cp】\n皇城中有许多秘密，也有许多不甘。\n比如被污蔑入狱的商贾，比如被活埋荒山的戏子。\n她擅布局，她会唱戏。\n她将她从乱葬岗挖出，送她贵妃之女的身份。\n她为她做台前的筹码，打断仇人骨，铸成青云梯。\n\n若天生命贱者是为蝼蚁，那假金钗也可刺穿朱门骨。\n\n她们会簪着这假金钗，搅时局，拆凤阙，借东风，入青云，爬的比所有人都要高。", "tags": ["古风世情", "古代言情", "群像", "古色古香", "古言权谋"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "惹金枝", "fullTitle": "惹金枝", "link": "https://fanqienovel.com/page/7231424472606051384", "data": [32.76, 32.81, 32.94], "trend": 0.18, "latest": 32.9, "wordNumber": 1163967, "creationStatus": 0, "desc": "(影视版权已售出，实体书将于7月10日19：00开启预售)\n时不虞是笑着出生的。\n那一刻电闪雷鸣，轰塌了时家的一排杂屋，接连几日的暴雨带来滔天水患，受灾者众,京城渐有传言她是灾星降世。\n偏她早慧如妖，过目不忘，好的坏的都学得快，流言越传越邪乎，连宫中都使人来问。\n如众人所愿的，时不虞三岁就慧极早夭了。\n十五年后，镇守边境的忠勇侯叛国失城，忠勇侯府满门获罪，无人不骂时家的不忠不义，连早夭的灾星都再次被提及。\n临窗而坐的时不虞听笑了，灾星？那她得把这名头坐实了。", "tags": ["古风世情", "古代言情", "HE", "1v1", "古色古香"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "何不同舟渡", "fullTitle": "何不同舟渡", "link": "https://fanqienovel.com/page/7289383132648705082", "data": [20.1, 20.19, 20.25], "trend": 0.15, "latest": 20.2, "wordNumber": 483628, "creationStatus": 0, "desc": "〈同名实体书全网可购〉\n【无金手指无穿越无重生，纯古言家国天下+高智商谍战权谋】\n【卧底双面间谍+成长型小女贼：一匹孤狼玩养成游戏将一只兔子养出獠牙后非要跟她双宿双飞的故事】\n她是乱世里最如草芥的一个贼，为了活命无所不用其极\n她偷了一位公子的十两纹银，殊不知他便是那位臭名昭著的叛国将军，手上沾满同胞的鲜血。\n她上蹿下跳的求生欲竟激起了他的兴致，他燃起一炷香，跟他的玩物玩了一场大逃杀的游戏。\n“我给你一炷香的时间逃跑，不要被我抓到，否则——\n万劫不复。”\n她逃到世家里，改头换面嫁人为妻，以为能安稳度过余生，一抬眼却发现他笑望着她，温柔而危险地唤了一声“嫂嫂”。\n她输了这场游戏，成了他的奴。\n他说到做到，铁着心将她扔进刀山火海滚上一遭，然后她竟发现，自己在他的锤炼下有了一身刀枪不入的铠甲，在乱世中也能凭一介女子的脊梁骨站着。\n他似过江之舟，只渡她一程，便隐入黑暗。他到底是谁？\n去时迢迢，归路遥遥。都是迷途人，何不同舟渡？\n\n【本文架空仿宋，参考靖康之耻、南宋建立的历史大背景。所有人物都没有原型，请勿对号入座，请勿考究】", "tags": ["古风世情", "古言权谋", "古代言情", "双面", "将军"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "娶了替嫁美厨娘，厌世王爷开荤了", "fullTitle": "娶了替嫁美厨娘，厌世王爷开荤了", "link": "https://fanqienovel.com/page/7595483961023810622", "data": [5.73, 5.79, 5.87], "trend": 0.14, "latest": 5.9, "wordNumber": 434043, "creationStatus": 0, "desc": "温柔坚韧小厨娘+身残心死废王爷+替嫁权谋+双向救赎+美食疗愈+微群像\n立意：人心似水，可覆舟，亦可煮粥。\n安亲王卫烽，曾是大楚国最耀眼的少年战神。\n却在一场倍受争议的战役中，身残眼盲，性情大变，从铁血战神沦为暴戾厌世的‘废人’。\n永昌侯府为攀附权贵，早年就将嫡女许配于他，成婚当日却让厨娘生的庶女替嫁。\n这桩人人嘲笑的姻缘，于宋三愿而言，却是甘之如饴的奔赴。\n那个曾救她于危难的天之骄子，早已是她心底不敢言说的月亮。\n如今，月亮蒙尘，坠入深渊。\n那她便做那个提灯入渊的人。\n她以美食为舟，渡他出苦海。\n他以天下为聘，还她一世烟火长安。\n……\n文风慢热，会有许多关于美食和药膳的描写，男女主都不完美，非常规爽文，慎入。", "tags": ["古风世情", "古代言情", "美食", "厨娘", "古言权谋", "代嫁代娶"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "逢灯纪", "fullTitle": "逢灯纪", "link": "https://fanqienovel.com/page/7501543539474435097", "data": [8.75, 8.81, 8.85], "trend": 0.1, "latest": 8.9, "wordNumber": 982857, "creationStatus": 0, "desc": "你是侯府女，想要带走母亲的嫁妆和尸骨？\n接了。不止带走嫁妆和尸骨，还给你带来你母亲的和离书，以及你的断亲书。\n你被假死，成了兄弟背后的隐形人，想要过回正常人的生活？\n接了。不止让你重新有名有姓，还让你得到所有家产，尽展抱负。\n你要救婆婆脱离苦海？\n接了。不止让你婆婆重生，还让你们有依有靠。\n……\n逢灯，一个为女子行方便之事，接受女子委托的存在。\n从地狱爬回来的兰烬，以‘逢灯’立足于世。\n一步一步，织造天罗地网。\n当有一天她接下了废太子妃的委托，她就知道，报仇的机会来了。", "tags": ["古风世情", "古代言情", "古色古香", "古言权谋"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听说我命克百官", "fullTitle": "听说我命克百官", "link": "https://fanqienovel.com/page/7454583406228163646", "data": [6.03, 6.05, 6.11], "trend": 0.08, "latest": 6.1, "wordNumber": 1332154, "creationStatus": 0, "desc": "破案文，女主会验尸，会破案\n孝期一过，温清宁包袱款款回到了长安，奈何未婚夫沈沐怀不仅纳了美妾，还娶了娇妻，后院堪称百花齐放。\n沈沐怀深情地望着温清宁：“阿宁，我是为了你才纳的妾，为了你才娶的新妇！阿宁，我都是为了你！”\n温清宁瞧着苏云卿冒尖的肚子，疑惑问道：“你扭屁股入洞房的时候是我拿刀逼着你动的？”\n退亲前一天，温清宁碰到了命案，验个尸，接个活，顺便把未婚夫家的使唤婆子送进了县衙。\n退婚当天，温清宁气晕了未婚夫，又验了个尸。\n退亲第二天，温清宁让未婚夫挨了板子，赔了钱，然后给县尉验了个尸。\n退婚不知道多少天，温清宁去了趟悲田养病坊，监察御史死了……\n她在长安住了一日又一日，满朝文武，高门贵妇，无不谈“温”色变。\n只有一人，捏着自己的生辰八字巴巴地送到了她跟前……", "tags": ["古风世情", "古代言情", "虐渣", "古色古香", "古言权谋"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大明：从亡国公主到传奇女帝", "fullTitle": "大明：从亡国公主到传奇女帝", "link": "https://fanqienovel.com/page/7635671030693907518", "data": [5.73, 5.78, 5.8], "trend": 0.07, "latest": 5.8, "wordNumber": 354923, "creationStatus": 1, "desc": "【穿越+无系统+无CP+事业心+争霸权谋+日常+最后登基称帝+以上介意慎入】\n甲申之变前夜，崇祯提剑欲杀女，她反手五步套路，改变了崇祯自挂东南枝的结局，现代档案馆员朱梅绰穿成坤兴公主朱媺娖，开局就是亡国夜。\n满城烽火，她拽着崩溃的皇帝南逃，一路收锦衣卫、练新军、掌朝堂。江南士绅笑她牝鸡司晨，她反手抄了卖国盐商全家，军费瞬间到账。清军铁骑南下？她亲提大军正面硬刚，砍下多尔衮弟弟的人头传首九边。收复北京那天，满朝文武跪请登基：大明开国以来第一位女帝，就此诞生。\n后人翻开史书，只见蒸汽机的浓烟与战舰的旗帜遮蔽了全球航线，万国来朝，皆跪称“陛下”。", "tags": ["古风世情", "古代言情", "穿越", "女强", "无CP", "古言权谋"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "侯府重点班", "fullTitle": "侯府重点班", "link": "https://fanqienovel.com/page/7258838548495731749", "data": [5.98, 6.03, 6.05], "trend": 0.07, "latest": 6.0, "wordNumber": 1167914, "creationStatus": 0, "desc": "【萌宝+教子+公婆宠+轻松+救赎】\n徐婉出嫁就是个寡妇，本想苟个侯府夫人自由快活。\n谁料刚嫁来当天，那位全京城臭名昭著的混世魔王继子，就给她连下两个马威。\n徐婉提刀冲了出去，一举闻名全京城！\n本以为侯府夫人是当不成了，谁料公婆反向报复，将小魔王交给了她调教。\n徐婉：“？？？”\n小魔王：“？？？”\n最开始并没人看好……\n后来的后来，侍女们每天都在尖叫：\n“从不读书的小公子竟然进书房了！”\n“小公子还会给老侯爷端洗脚水了！”\n“小公子竟然救了整个贫民窟的小孩！”\n……\n侯府震惊了，全京城震惊了，就连宫里的那位都震惊了。\n听闻侯府夫人调教熊孩子有一手，众臣家里的逆子纷纷往侯府送，侯府重点班成员越来越多！\n三年后。\n科举选拔的礼部侍郎，仰天哀嚎：“选不完，根本选不完，全是一等一的甲！”\n————\n古代版抓娃娃，带娃攻略大全。\n男主出场晚，双洁。", "tags": ["古风世情", "古言权谋", "古代言情", "萌宝", "穿越", "HE", "大小姐"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "星光璀璨": [{"label": "甜爆恋综，他们竟是青梅竹马！",
