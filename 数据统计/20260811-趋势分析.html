<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 8月4日–8月11日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

\n\"懂，地下恋。\"\n后来我才知道。\n全网都在逼我和影帝谈恋爱。\n只有他，从一开始就是认真的。\n【娱乐圈×轻松搞笑×综艺直播×假情侣×甜宠×蓄谋已久】", "tags": ["星光璀璨", "现代言情", "娱乐圈", "直播", "甜宠", "搞笑轻松"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "睁眼！神豪的作死前爱播重生了！", "fullTitle": "睁眼！神豪的作死前爱播重生了！", "link": "https://fanqienovel.com/page/7632288881706028094", "data": [2.63, 3.19, 3.58, 4.05, 4.74, 5.07, 5.35], "trend": 2.72, "latest": 5.3, "wordNumber": 140284, "creationStatus": 1, "desc": "（评分刚出，给个机会吧₍ᐢ..ᐢ₎♡）【团播+娇气作精+训狗+1vN+雄竞+上桌男全洁】\n玉窈被人捅死了。\n死后她才惊觉自己是一本万人迷主播文里的貌美炮灰，存在的意义就是给女主送大哥，并衬托女主的温柔可亲善解人意。\n而所谓的女主，正是刚入团不久的新人阮软。\n我惹法？\n一个大哥而已，她都给了，怎么还要她的命？\n她只是作了点，罪不至死吧？\n再睁眼，玉窈发现自己重生了。\n当务之急是跑路保命。\n惹不起女男主，她躲开总可以了吧！\n只是…\n女主的狗怎么也跟着她跑了？\n♡\n狗狗有很多种，沉稳的，乖巧的，热情的，温柔的，也有反骨的，叛逆的，恶毒的，疯批的……\n无论是哪一种，最终的走向都是成为主人的乖狗。\n但主人不是谁都要的。\n于是聪明的狗狗们学会了伪装与示弱。", "tags": ["星光璀璨", "现代言情", "重生", "作精", "娱乐圈", "前世今生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全能顶流女星重生，卷疯娱乐圈", "fullTitle": "全能顶流女星重生，卷疯娱乐圈", "link": "https://fanqienovel.com/page/7654847548904983577", "data": [10.5, 11.6, 12.55, 12.92, 13.59, 13.46, 12.64], "trend": 2.14, "latest": 12.6, "wordNumber": 224664, "creationStatus": 1, "desc": "【重生顶流女明星卷王+高智商商业巨鳄爱扩版图大佬】\n顶流女星盛葱葱重生成贫家小妞去剧组拍戏挣学费。\n骑马射箭弹古琴，跳舞唱歌毛笔字，十八般武艺样样精通，卷疯娱乐圈众人。\n主题曲唱不出感觉？她来！\n工笔写意画的老师堵车来不了？她画！\n就连大佬没有好剧本投资，她都能亲自操刀写一部。\n娱乐圈众星望其项背，不可企及，背地里谈起她直呼怪物大魔王！\n大魔王重生一次无往不利，风生水起，只是，哎哎哎你这个大佬怎么回事，说好了一起赚钱这怎么还想把她也赚回家呢？\n做一行赚一行的某人刚干完一碗香喷喷的打卤面，眼巴巴望着她，老婆好吃，明天还想吃！\n小剧场：\n岑封在外边商业版图遍地开花，被岑父硬拽回家帮忙升级家族产业链，为摸清真实情况化身普通工人深入一线探查。\n老婆的打卤面一天不吃想的慌，某人撒娇卖萌求吃饭，无奈，盛葱葱只得抽空从剧组跑出来给男朋友送一碗她亲手做的打卤面。\n回程时，人还没到剧组，当红顶流盛葱葱私会男友，男方竟是机床修理工的消息就炸上了热搜。\n某商业大佬狂喜，栓Q，终于被发现了，这次老婆得光明正大的给名分了吧！\n（注：女主成年前只搞钱，成年后恋爱，积极向上阳光正能量。）", "tags": ["星光璀璨", "现代言情", "全能", "重生", "强强", "娱乐圈", "明星"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女变男：顾鱼的练习生之旅", "fullTitle": "女变男：顾鱼的练习生之旅", "li wordNumber": 208273, "creationStatus": 1, "desc": "【癫文+无CP】\n张九被一个叫“乞讨成帝”的实习系统绑错了，\n本来是龙傲天走老朱的路线，结果给她送到了盗墓世界。\n还只能向古人乞讨才能获得系统奖励。\n张九表示：“谁说错嫁没真爱？你看隔壁王二赖！”\n现代没古人？\n地下不全都是吗？\n清朝出生的都算古人？\n那不巧了吗！\n百岁老人这里有的是。\n【不怎么走剧情，没有感情戏，与鬼吹灯有一点联动】\n提前避雷：1.女主带过去的那个智能机没上交国家，而是给了小花。作者给出的理由是，国家不一定看得上那个手机，但一定看得上穿越这件事。盗墓贼江湖气重，只要女主够强，没人问来历。\n2.系统就是个开盲盒的工具，没有吊炸天的功能\n3.女主身穿、成长形，不是一上来就很牛逼，开始很弱。\n4.某种程度上说，女主是开着上帝视角穿书的，相比较政府部门，女主更了解书中人物，所以求求某些书友，不要让女主上岸从政啦！这是同人文啊亲！", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "无CP", "同人"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "青霉素发家，张家女在盗笔当富豪", "fullTitle": "青霉素发家，张家女在盗笔当富豪", "link": "https://fanqienovel.com/page/7659746866979933246", "data": [9.27, 10.75, 11.77, 12.05, 13.04, 13.62, 13.74], "trend": 4.47, "latest": 13.7, "wordNumber": 175513, "creationStatus": 1, "desc": "【字数比较少，刚开分】【剧情线从南部档案开始，cp黑瞎子1v1，无其他暧昧向】  \n       张海灼这辈子做过最正确的决定，是十五岁那年从张家假死出逃。\n       第二正确的决定，是在柏林巷子里捡了黑瞎子当劳动力。\n       她在法租界开药铺，在苏州河边建厂，用青霉素撬动军火贸易，用芯片技术搭上改革开放的快车。\n       八十年间她换了三个身份，产业却越做越大，从“姚老板”到“姚小姐”再到“姚董”，桃花暗纹的信物流传至今。\n       什么莫云高、裘德考？要体验一下被经济制裁的恐惧吗？\n       什么汪家？你背后的势力比得上我为国家做的贡献？\n       什么，每个身份身边都有一个黑漆漆的保镖？不好意思啊，我们毕竟是母女嘛，审美一致，男朋友长得像多正常。\n       黑瞎子：没错，她就喜欢我这款！\n——\n       我写的主角是1905出生的张家人，从民国活到主线，尽可能经历大部分重要剧情点，能避免的悲剧会尽量避免，不会过多干扰让某些剧情点直接消失，但会改变一些人的结局。\n       主角有自己的事业线要走，某种程度上会是从民国到现代的穿越大女主爽文", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "衍生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七罪副本：她靠怠惰封神", "fullTitle": "七罪副本：她靠怠惰封神", "link": "https://fanqienovel.com/page/7655266817392249918", "data": [8.47, 8.98, 9.63, 10.49, 11.18, 11.51, 11.74], "trend": 3.27, "latest": 11.7, "wordNumber": 251697, "creationStatus": 1, "desc": "【非爽文+无限流+无cp+智斗游戏+微群像+成神之路+神明入侵】\n晏夕这辈子最擅长三件事：藏锋，偷懒，逃避。\n她本以为自己可以这样安安稳稳和妹妹相依为命，直到某天，她被卷入一场名为“神明审判”的无限游戏。\n晏夕醒来时，发现自己在一座审判厅里。\n六个人，七张椅子。\n规则只有一条：每个人必须找到属于自己的审判椅，一人坐错，全员处刑。\n别人崩溃、争吵、抢线索，只有晏夕靠在墙边，一动不动。\n众人以为她吓傻了 她发现，这个世界竟是自己曾经看过的一本小说。\n而镇国公府，正是书中那个一年后会被诬陷“通敌叛国”、满门抄斩、流放惨死的炮灰家族。\n长宁：“……”\n既然知道结局，她自然不可能坐以待毙。\n于是，镇国公府上下很快发现，自家老祖宗突然像变了个人。\n她先是雷厉风行，斩断所有可能被人利用的隐患；又以强硬手段清理府中蛀虫，整肃内外势力。短短数月，原本漏洞百出的镇国公府，被她经营得固若金汤。\n至于原书那对踩着镇国公府尸骨上位的男女主？\n长宁只冷笑一声。\n想拿她全族的命铺路？\n做梦。\n【无CP＋金手指强大＋全家逆天改命＋爽感拉满】", "tags": ["古言脑洞", "古代言情", "穿越", "空间", "公主", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满朝听见我心声后，长公主护短了", "fullTitle": "满朝听见我心声后，长公主护短了", "link": "https://fanqienovel.com/page/7642748664410016793", "data": [3.64, 3.66, 4.05, 4.23, 4.43, 4.52, 4.58], "trend": 0.94, "latest": 4.6, "wordNumber": 287907, "creationStatus": 1, "desc": "（评分刚出，后面会涨，请放心食用）【读心吃瓜+爆笑沙雕+发疯文学+甜宠+微群像+双女主+1v1】\n版本一：\n宁小满穿越大夏两年半，绑定吃瓜系统。\n她在街上卖身时，被乔装逛街的冷面长公主带回府。\n\n她以为抱上金大腿，结果公主府也不太平：管事做两套账、绣房拿针扎人、外院领粮越来越狠。\n她嘴上装傻，心里喊统子扒瓜，公主、丫鬟、护卫统领，一个个憋笑憋到内伤。\n\n后来，皇帝听见了，皇后听见了，满朝文武也听见了。\n于是，大夏朝堂画风突变。\n\n反派正在深情演戏，她心里吐槽：\n「哥，别演了，你心眼多的都能给苏打饼干扎眼了。」\n\n贪官正在哭穷喊冤，她心里开麦：\n「你家地窖银砖都快码成小长城了，还搁这儿装月光族？」\n\n众人表面严肃，内心疯狂憋笑。\n宁小满：奇怪，为什么他们看我的眼神越来越不对？\n\n长公主冷静护人：\n“她胆小，别吓她。”\n\n满朝文武看着刚在心里把反派祖宗十八代都创飞的小姑娘，陷入沉默。\n胆小？\n殿下，您要不要听听她心里在骂什么？\n\n版本二：\n全大夏都知道，长公主萧明昭冷血、冷面、冷心。\n直到有一天，她捡回一个叫宁小满的小姑娘。\n\n从此，长公主上朝会走神，皇帝批奏折会喷茶，皇后喝茶会微笑，满朝文武会集体沉默。\n因为他们都听见了同一个声音。\n「啊，这瓜真香！」", "tags": ["古言脑洞", "古代言情", "系统", "甜宠", "搞笑轻松", "1v1"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了冷血皇帝的病弱炮灰养子", "fullTitle": "穿成了冷血皇帝的病弱炮灰养子", "link": "https://fanqienovel.com/page/7628961061521083416", "data": [2.61, 2.7, 2.7, 2.66, 2.72, 2.7, 2.8], "trend": 0.19, "latest": 2.8, "wordNumber": 272984, "creationStatus": 1, "desc": "【亲情向＋无CP＋病弱＋团宠＋架空】\n　　作为第二代的陪伴型AI仿真人，零零一陪伴小主人从幼崽到成年期，功不可没。\n　　按照原计划，它是要更新老化零件，再陪伴主人到老年。\n　　但市面上越来越多的新款，大人们早就想要换掉它，他们第一时间销毁了零零一。\n　　零零一不知道自己被销毁了，在重新醒来过后，它以为自己升级成功了，换了新皮肤。\n　　但脑海中不知道为什么多出了一段奇怪的记忆，它是炮灰？叫做李临祎？\n　　还是个炮灰，因为身体孱弱，又天生寡言少语，被遗弃在雪天荒野，遇到了重伤的帝王李钦纶。\n　　帝王会心软，将他带回去，认作养子，养在身侧。但他不识好歹，偏执娇纵，横行无忌，得罪了一众皇子公主，以及妃子，甚至下到宫女太监，无一不厌恶他。\n  "https://fanqienovel.com/page/7648995866363038745", "data": [2.97, 3.09, 3.17, 3.31, 3.68, 3.86, 4.1], "trend": 1.13, "latest": 4.1, "wordNumber": 264697, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿古代，又遇逃荒，怎么活", "fullTitle": "身穿古代，又遇逃荒，怎么活", "link": "https://fanqienovel.com/page/7655897155650980888", "data": [2.61, 2.58, 2.62, 2.69, 2.97, 2.96, 2.88], "trend": 0.27, "latest": 2.9, "wordNumber": 175478, "creationStatus": 1, "desc": "刚进入一家公司实习没几天的林荞，在帮一个离职同事送东西去楼下时，却在电梯内一脚踏空，连同装物品的纸箱子，一起穿越到了古代。\n别人穿越，都是魂穿，林荞却是整个身体都跟着穿越了。而穿越大神送给她的金手指，就是那个装有同事私人物品的纸箱子，变成了她的空间。\n就在林荞一边庆幸自己有个小的可怜的空间，一边忧愁自己在古代是个黑户时，让她更崩溃的是，她所在的地方，竟然大旱了半年，到处都是逃荒的流民。\n而她没钱没水没粮。\n苍天啊！大地啊！这叫她一个人生地不熟的现代人，在这里怎么活？\n逃荒种田文，女主无CP，不会和朝堂，贵族，大将军什么的扯上关系，就是一个普通的现代女孩在古代小心翼翼求生存，最终平安终老的日常文。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女一睁眼，残疾太子冷脸剥玉米", "fullTitle": "恶女一睁眼，残疾太子冷脸剥玉米", "link": "https://fanqienovel.com/page/7637807750260460568", "data": [3.07, 3.17, 3.2, 3.21, 3.29, 3.34, 3.32], "trend": 0.26, "latest": 3.3, "wordNumber": 175992, "creationStatus": 0, "desc": "【病秧子纯情废太子VS搞怪抽象大力女医生】+【种田无宫斗】+【虐渣】+【搞笑轻松】+【空间】+【双洁】\n医学大佬苏青梨，穿成古代农村小恶女，开局就身处山贼窝。\n\n好不容易逃回家，发现家里更惨，家里欠债，大嫂难产，一家人快活不下去了。\n\n不过问题不大，她穿越把空间实验室给带过来了。\n\n她撸起袖子，虐渣男，搞钱，还债，赎地，把绝望的一家人从泥潭里捞了出来。\n\n只是，她顺手救的那双腿瘫痪的病秧子怎么回事？饭不吃，药不喝，整日摆着一副“活着没意思”的死人脸。\n\n苏青梨表示：多半是闲的！\n\n啪地一下，直接将一大筐玉米砸在他面前。\n\n“腿废了，手不是还能动吗？干活！”\n\n病秧子：“？？？”\n\n干吧。\n\n不就一点农家活，能比读书练武累？\n\n结果——\n\n他剥完玉米剥花生，剥完花生刮木薯，刮完木薯煮猪食。\n\n好不容易腿能站起来了，又被拉着下田插秧，赶牛放羊。\n\n萧时衍沉默了。\n\n好消息：她没把自己当残疾人。\n\n坏消息：也没把自己当人。\n\n后来的苏青梨才知道，这个被她使唤许久的病秧子美人，是曾经位高权重的太子。\n\n你说这事整的，也没人跟她说啊。\n\n村里人都说，就是有十条命，也不敢娶这恶丫头。\n\n可后来，一个清隽如玉的公子带着十里红妆来敲她门，\n\n“阿梨，我来求赘了，你可愿娶我？”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "医术"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破庙通古今，小乞丐们有救啦！", "fullTitle": "破庙通古今，小乞丐们有救啦！", "link": "https://fanqienovel.com/page/7650351395756837912", "data": [2.63, 2.67, 2.78, 2.82, 2.85, 2.8, 2.86], "trend": 0.23, "latest": 2.9, "wordNumber": 287797, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+群像文+温馨日常+无极品+无cp】\n逃荒路上，弹尽粮绝，\n小瑶的爹娘卖完两个姐姐又想卖掉小瑶。\n小瑶连夜逃跑，跑到闹鬼的破庙。\n鬼再可怕也没有人可怕，\n原来破庙住着装神弄鬼的小乞丐。\n无粮无水五个小乞丐快要饿死之际，小瑶向破庙内神像求救，绑定快要报废的通古今交易系统。\n五个底层小人物，与废物统子共同携手，摸爬滚打，靠着古今穿越的奇遇，一步步努力，成为有饭吃，有衣穿，有屋住的小小大人物。\n（PS：前几章写五人的相识和小乞丐在古代底层社会生存的不易，想直接看古今穿越的可以从第五章开始看。\n前期小瑶，小满，狗蛋，虎子，乌川五个孩子都是主角，都会穿现代，后期还会有小瑶姐姐夏一，夏二的加入。\n希望大家能爱上这些性格不同，但一样善良可爱懂事的孩子）", "tags": ["种田", "古代言情", "萌宝", "穿越"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [6.0, 6.25, 6.54, 6.76, 7.11, 8.01, 8.76], "trend": 2.76, "latest": 8.8, "wordNumber": 226935, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [9.54, 9.63, 9.68, 9.81, 10.58, 11.15, 11.63], "trend": 2.08, "latest": 11.6, "wordNumber": 275904, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.95, 5.97, 5.97, 5.99, 6.12, 6.13, 6.22], "trend": 0.27, "latest": 6.2, "wordNumber": 268936, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世禁区？那明明是狩猎场！", "fullTitle": "末世禁区？那明明是狩猎场！", "link": "https://fanqienovel.com/page/7622901967165082648", "data": [2.57, 2.67, 2.73, 2.79, 2.76, 2.78, 2.76], "trend": 0.2, "latest": 2.8, "wordNumber": 299684, "creationStatus": 1, "desc": "【无cp+心狠手辣+杀伐果断+独狼+自私自利+损人利己+系统+多序列+诡异+成长+非无敌+末日末世+ 女强+战榜 】\n\n\n灰雾封世，诡异横行，多地沦为禁区。\n\n人类被迫迁徙，只为能找到为数不多的安全区苟延残喘。\n\n迁徙途中，林青意外绑定了生机系统！\n\n当其他觉醒者还框锁在一人一序列的铁律中，她却手握多重序列！\n\n当其他幸存者四处逃命躲避诡异，她却截然相反，迎雾而上！\n\n当诡异成了经验包……\n\n当灰雾成了狩猎场……\n\n我以猎诡谋生路。\n\n此途，由我定序。\n\n雾尽，我即规则。", "tags": ["科幻末世", "末世", "系统"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [6.49, 6.98, 7.25, 7.63, 8.37, 9.0, 9.19], "trend": 2.7, "latest": 9.2, "wordNumber": 204659, "creationStatus": 1, "desc": "评分刚开，后面会涨。\n（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [6.42, 6.64, 6.76, 6.89, 7.24, 7.45, 7.4], "trend": 0.99, "latest": 7.4, "wordNumber": 282928, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [6.37, 6.31, 6.27, 6.57, 7.18, 7.16, 7.02], "trend": 0.65, "latest": 7.0, "wordNumber": 195435, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却 一撞成婚", "link": "https://fanqienovel.com/page/7645558905812028441", "data": [4.41, 4.67, 4.89], "trend": 0.48, "latest": 4.9, "wordNumber": 252513, "creationStatus": 1, "desc": "夏沐在二十五岁那天和程氏集团总裁程青砚领证了。\n夏沐和柴珩相恋三年，今天是两人约定好领证的日子，夏沐在民政局等了一个小时，还不见柴珩的身影，她掏出手机给柴珩打电话，对方没接，随后给她发了一条消息：【对不起小沐，雪儿她生病了，我们改天再领证吧。】\n陆雪儿，柴珩的青梅竹马。\n夏沐看着这条消息，愣了半天，嘴角扬起一抹自嘲的笑容：“还是输了啊！”随后她收拾好自己的证件，转身朝着门外走去。\n程青砚刚下飞机，便被自己母亲的一通电话叫来了民政局，他走到门口，刚准备伸手去推门……\n夏沐一拉开门，便撞进了一个人的怀里，她鼻尖嗅到了一股淡淡的松木香气，\n“你没事吧？”\n头顶传来一道清透温润的声音。\n夏沐抬起头看着眼前的人，她眨了眨眼睛，“先生，有兴趣领个证吗？”", "tags": ["职场婚恋", "现代言情", "总裁", "先婚后爱", "豪门世家", "医生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [7.77, 7.88, 8.23], "trend": 0.46, "latest": 8.2, "wordNumber": 265203, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "渐入婚境", "fullTitle": "渐入婚境", "link": "https://fanqienovel.com/page/7648175724460772376", "data": [3.75, 4.03, 4.13], "trend": 0.38, "latest": 4.1, "wordNumber": 151965, "creationStatus": 1, "desc": "【神外医生x麻醉医生】\n【青梅竹马+先婚后爱+过期暗恋+双洁】\n麻醉科的沈医生年轻帅气又多金，是二院无数女同事心中最佳择偶对象，偏偏其人寡言冷情，身边从未出现过异性。\n神经外科的林医生明艳动人，富贵人家出身，追求者更如过江之鲫，却不曾见她为谁抛却芳心。\n二人共事多年，堪称金牌搭档。\n但从来没人将他俩想到一起——\n众所周知，沈医生与林医生磁场不合，除工作外，其余场合形同陌路，话都懒得说一句。\n-\n后来不知从哪里传出沈医生已婚的风声。\n有同事忍不住调侃：“沈医生娶的女人，会是什么样呢？”\n林稚想了想：“那当然是风华绝代的大美女。”\n同事笑道：“说的像你知道似的。”\n林稚也笑。\n她还真知道，毕竟家里的结婚证上，落着她与沈镜池的名字。\n-\n林稚和沈镜池是人尽皆知的死对头，却鲜有人知，两人也是青梅竹马。\n两小无猜的日子里，他们好过，闹过，吵过，最后分道扬镳。\n所以联姻三个月，两人依旧各不相干，关系纯洁如白纸。\n林稚认为沈镜池跟自己一样，对这桩婚事并非自愿。\n-\n直到某次冷战，有人拍到夫妻俩各自买醉。\n众人纷纷猜测，这段婚姻是否告吹。\n当夜，林稚被男人揽在怀里，听他轻语：“不吹，这辈子都不吹。”\n-\n【两情相悦这件事，是我从青春到白头的课题。】", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "暗恋", "双洁"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内：我的太太是我的步步为营", "fullTitle": "体制内：我的太太是我的步步为营", "link": "https://fanqienovel.com/page/7649367076783524889", "data": [6.14, 6.35, 6.5], "trend": 0.37, "latest": 6.5, "wordNumber": 224790, "creationStatus": 1, "desc": "我的太太年纪小但乖巧，是我的底线，更是我的步步为营。\n双向心动。\n年龄差的互宠。\n体制内，直播，声优配音，哪个是最真实的你。\n说白了，就是一场长在彼此择偶心动点上的爱情。\n\n补充：文中所有职务，事件均为平行时空，请宝宝们勿代入现实。\n爱你们呦~\n\n", "tags": ["职场婚恋", "现代言情", "总裁", "豪门世家", "互宠", "年龄差"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "高考出分，女儿第一个劝我离婚", "fullTitle": "高考出分，女儿第一个劝我离婚", "link": "https://fanqienovel.com/page/7657391720396508184", "data": [6.01, 6.24, 6.35], "trend": 0.34, "latest": 6.4, "wordNumber": 198337, "creationStatus": 1, "desc": "（高考查分+恶婆婆+离婚后我成了入殓师）\n高考出分，女儿第一句话没报分数，而是——\n“妈，你离婚吧。”\n安柠还没反应过来，就被拽进本市最贵的酒楼。\n婆家人正整整齐齐给一个女孩庆祝高考大捷。\n她这才知道：\n丈夫周明海的私生女竟和她的女儿一样大！\n包厢里，乱成一片。\n公公一拍桌子，定下规矩：\n“既然都捅破了，那就按老规矩办：谁生的娃有出息，谁就上周家族谱！”\n安柠气得发抖，女儿周念安却按住她的手，一口答应：“比就比。”\n在所有人的追问下，她只说了三个字：\n“屏蔽了。”\n全场一愣，随即哄笑：\n“零分啊！”\n婆婆满眼鄙夷，小三得意忘形，私生女笑着要认祖归宗，丈夫更是直接甩出离婚协议。\n后来，各招生办亲自上门，抢省状元周念安。\n周家人立马变脸：\n“老周家祖坟冒青烟，出了个女状元！安安是周家的种，必须上族谱！”\n周明海跪求原谅：\n“我只是犯了全天下男人都会犯的错。”\n可这次，安柠铁了心要离！\n离婚后，她重拾阿婆传下来的手艺，成了一名入殓师。\n起初只当谋生，后来越做越大。\n她也遇见了那个既能替她挡住前夫骚扰，又能安静看她为逝者整妆，更能看到她身上光的男人！", "tags": ["职场婚恋", "现代言情", "家庭", "虐渣", "打脸", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲闪婚，糙汉老公太直接", "fullTitle": "相亲闪婚，糙汉老公太直接", "link": "https://fanqienovel.com/page/7636132561508387902", "data": [3.02, 3.15, 3.35], "trend": 0.33, "latest": 3.3, "wordNumber": 204482, "creationStatus": 0, "desc": "【乡镇超市糙汉vs县城小会计+直球式相亲+年龄差两岁+细水长甜】\n林小晚相了七次亲，遇到的不是抠门就是奇葩，要不就是动手动脚。\n第八次，赵铁柱坐在对面，上来就摊牌：“我来相亲就奔着结婚来的，你要觉得行咱就处。”\n她以为又是三分钟热度。\n结果这人第二天就拉着她去挑三金，彩礼不打磕巴，领证不拖泥带水。\n林小晚内向又话少，生怕赵铁柱嫌她闷。\n但赵铁柱说：“你不用说太多，听我说就行。”\n婚后她第一次体会到被人护着的感觉，踏实，安心，有人撑腰。\n就是，就是这人太直接了，有啥说啥，她脸皮薄，有点吃不消。", "tags": ["职场婚恋", "现代言情", "婚恋", "家长里短", "乡村", "年龄差", "闪婚"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "社恐乖乖女意外怀了红毛的崽后", "fullTitle": "社恐乖乖女意外怀了红毛的崽后", "link": "https://fanqienovel.com/page/7648331109100440638", "data": [7.17, 7.23, 7.43], "trend": 0.26, "latest": 7.4, "wordNumber": 293047, "creationStatus": 1, "desc": "「温柔乖乖女×红毛小伙」「双洁×偏日常×病娇×出租屋文学」\n听说了吗？\n那个一头红毛特拽的小伙，把他网恋两年的女朋友搞怀孕了。\n人家姑娘打了十次胎都没打掉。\n最后还给他生了个闺女。\n——\n有时候，一个人爱你爱到骨子里，会害怕失去。\n害怕到想用最笨的方式，把另一个人死死锁在身边。\n哪怕手段卑劣，哪怕面目狰狞，哪怕她恨他。\n潜意识里，摧毁对方，可能是为了阻止她离开，或者让她永远只属于你一个人。\n就像《茶花女》里写的：\n“我是这样爱她，以致在我极度兴奋的爱情之中，我曾想到，要不要杀了她，这样她就永远不属于别人。”\n——\n不要问甜不甜，就像问你男朋友爱不爱你一样，没有任何意义，只有试过了才知道。\n注：【文里涉及到的任何行为，以及不好的台词，请理智阅读，这是小说，不要代入现实】", "tags": ["职场婚恋", "现代言情", "追妻火葬场", "虐恋情深", "破镜重圆", "情有独钟"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "救命！产检遇到妇科圣手前男友", "fullTitle": "救命！产检遇到妇科圣手前男友", "link": "https://fanqienovel.com/page/7665336297111686168", "data": [2.5, 2.51, 2.52], "trend": 0.02, "latest": 2.5, "wordNumber": 228706, "creationStatus": 1, "desc": "知名扑街小黄文作者马小旦，人生做过最勇的两件事：第一，把清冷禁欲的医学院男神睡了后渣掉；\n第二，发现怀孕后连夜买站票跑路回十八线老家。\n本以为天高皇帝远，谁知在县城医院第一次产检——\n“裤子脱了，躺好。”\n清冷熟悉的男声从口罩后传出，马小旦吓得差点从检查床上滚下来。\n眼前这位空降县医院的妇产科顶级圣手，不是她那被甩的前男友还能是谁？！\n看着B超单上的孕周，男人修长的手指把玩着探头，冷笑连连：“分手三个月，孕周十二周，马小旦，医学上这叫无缝衔接，还是叫医学奇迹？”\n马小旦死鸭子嘴硬：“那…那是我无性繁殖！”\n自此，妇产科大佬开启贴身“监视”模式。\n从按时产检到登堂入室，甚至把她小说里的姿势打印出来贴在床头：\n“马大作家，生完孩子，我们把这些实践一下？”", "tags": ["职场婚恋", "现代言情", "暗恋", "破镜重圆", "医生", "带球跑", "情有独钟"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "向周舟", "fullTitle": " , {"label": "绿茶主播靠撒娇拿捏神豪团", "fullTitle": "绿茶主播靠撒娇拿捏神豪团", "link": "https://fanqienovel.com/page/7627830594948320281", "data": [3.17, 3.27, 3.4], "trend": 0.23, "latest": 3.4, "wordNumber": 129711, "creationStatus": 1, "desc": "（评分刚出）［团播＋个播＋1vN＋雄竞修罗场＋多论坛体＋绿茶女主］\n团播了两个月但房租都快交不起的姜持鸢走上了一条“不归路”——撬大哥。\n幸运的是，她成功撬来了一个，不幸的是，她被开贴骂惨了。\n正当众人觉得撬来的大哥肯定会跑路时，没想到她家大哥大姐越来越多了。\n瓜妹不解，瓜妹震惊，瓜妹开串。\n“666，鸢姐两句话撬三个大哥。”\n姜持鸢：“…”\n“大哥跑路不要紧，鸢姐马上再撬来几个。”\n姜持鸢：“…有没有可能是我太有魅力了，根本不用撬。”\n瓜妹：“？”\n严肃观看直播后。\n瓜妹：“鸢姐茶茶的太萌了～”\n姜持鸢：“…”\n日常茶言茶语女主＋库库给女主送票但仍被女主背后蛐蛐的神豪大哥＋无条件偏爱女主维护女主的神豪大姐\n前期团播，公会赛后转个播，男全洁，不洁不上桌，不掺腐。\n排雷：1.部分大哥给其他女主播刷过礼物，非爱情票，给女主刷后，不会再给别人刷\n2.女主有一个大哥是画面男的堂哥，介意勿入", "tags": ["星光璀璨", "现代言情", "独宠", "总裁", "团宠", "直播"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女变男：顾鱼的练习生之旅", "fullTitle": "女变男：顾鱼的练习生之旅", "link": "https://fanqienovel.com/page/7647493458873043992", "data": [3.82, 3.9, 3.92], "trend": 0.1, "latest": 3.9, "wordNumber": 267716, "creationStatus": 1, "desc": "小时候的顾鱼瘦的跟个外星人似的，在小学门口因为跟一个怪叔叔对视一眼，从而进入一家娱乐公司当练习生。\n【星探】你们知不知道这种长相的！以我多年的经验来看，绝对是能开出绝世大帅哥的！\n于是顾鱼成为了一名练习生，一边上学一边去公司练习。\n到公司后因为吃的不限量，顾鱼因为吃的太多，跟周围一群嫌饭不好吃的其他练习生们形成了鲜明的对比，不爱吃？那太好了，都是我的了！\n顾鱼把自己吃的圆滚滚的，连练习舞蹈的苦都觉得不苦了。\n为了省出买盲盒的钱坐公交去公司，公交站离公司还有一公里的距离，为了躲避拍照的代拍们，每天快速跑进公司，经常在其他练习生们从各种豪车上下来进入公司时，从旁边跑过成为背景图。\n粉丝们翻看照片时总会发出疑问，那个在各个练习生后面跑的有点模糊的是谁？\n在其他粉丝互吵你家正主是黄子，是皇族，争颜永一时，顾鱼的粉丝都是在一边看热闹的。自家的小胖墩有种把秋衣扎在秋裤的实在感。\n随着时间的推移，营养跟上去的顾鱼，慢慢开始抽条，那张被星探追着不放的脸也逐渐显现出来。\n在看到自家爱豆逐渐显露出来的颜值，粉丝们表示，等一下！等一下！顾鱼你让我感到陌生！\n这是一个励志，温馨的日常文，在粉丝爱中长大的练习生", "tags": ["星光璀璨", "现代言情", "重生", "娱乐圈", "前世今生"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末世，我靠装弱，苟成最强", "fullTitle": "穿进末世，我靠装弱，苟成最强", "link": "https://fanqienovel.com/page/7662354834556734488", "data": [14.01, 16.39, 17.44], "trend": 3.42, "latest": 17.4, "wordNumber": 200991, "creationStatus": 1, "desc": "纪昼穿进末世八年，是临江基地公认的废物。\n\n检测做了一年又一年，结果始终没变。\n\n无异能。\n\n体弱。\n\n胆子小。\n\n遇到危险，只会躲在人群后面。\n\n纪昼对此十分满意。\n\n废物有人护着。\n\n天才却可能被送进实验室。\n\n没人知道，她体内藏着一团奇怪的东西。\n\n它会记住异能。\n\n硬化、雷电、冲击……\n\n只要给它一点时间，那些原本属于别人的力量，就能在她身上重新出现。\n\n纪昼靠着这张底牌装弱苟命，一装就是八年。\n\n她原本打算继续装下去。\n\n直到赛场坍塌，横梁压向被困的人，她当着六大基地的面，抬手托住了整片废墟。\n\n检测记录被连夜翻出。\n\n中央基地要求重新检测。\n\n研究人员想把她带回去。\n\n就连比赛里的对手，也故意重伤她的队友，逼她补位上场。\n\n姜妄隔着防护墙看向临江席位。\n\n“不是还有个替补吗？”\n\n“团队赛让她上。”\n\n“我倒想看看，她那层刚觉醒的硬化，能撑几刀。”\n\n所有人都以为，纪昼只有硬化。\n\n只有谢闻岐坐在高处，转了转缠着固定带的右腕。\n\n他望着她周围那片不肯随场域改变的异常，忽然笑了。\n\n“刚觉醒？”\n\n“她可藏了不止一天。”\n\n纪昼抱着医药箱，乖巧地坐在原位。\n\n她算了算自己手里剩下的异能。\n\n还是太少。\n\n得再攒一点。", "tags": ["科幻末世", "末世", "穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [7.11, 8.01, 8.76], "trend": 1.65, "latest": 8.8, "wordNumber": 226935, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糕末世：系统给我发了五个疯批", "fullTitle": "糟糕末世：系统给我发了五个疯批", "link": "https://fanqienovel.com/page/7661368861291187262", "data": [4.56, 5.19, 5.82], "trend": 1.26, "latest": 5.8, "wordNumber": 143978, "creationStatus": 1, "desc": "【搞笑+可爱+体型差+全员洁+无脑爽】\n可爱软萌女主VS忠犬男主\n意外穿到末世。\n人家都是技能满格，左手杀丧尸，右手扣晶核。\n而她！！！\n什么都没有！！！\n系统无奈：“好吧，我可以给你个储存空间，保证你饿不死。”\n“我还可以塑造你小说里的男主人物。”\n“让他们来陪你一起。”\n叶歌眼睛亮晶晶，她心动了。\n系统：“只能是你最近写的一本。”\n叶歌崩溃：“？我最近写的是极限文啊！”\n不止疯批，还没素质…\n“我不要。”\n系统：“……拒绝无效，已经生成了。”\n叶歌崩溃：“坑货，那是五个疯批啊——”\n系统：“人多热闹。”", "tags": ["科幻末世", "穿越", "空间", "末世", "搞笑轻松", "无脑爽"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [10.58, 11.15, 11.63], "trend": 1.05, "latest": 11.6, "wordNumber": 275904, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际第一躺平学大师", "fullTitle": "星际第一躺平学大师", "link": "https://fanqienovel.com/page/7656676073710554137", "data": [5.25, 5.78, 6.01], "trend": 0.76, "latest": 6.0, "wordNumber": 204103, "creationStatus": 1, "desc": "【星际、穿越、校园、女强、无CP】【评分刚出，后面会涨】\n两世卷王，这世放假。这辈子迎瓷发誓不卷了，躺平任嘲。\n迎瓷前两世卷生卷死，从小镇做题家卷成C9国奖得主，从外门弟子卷成天梯榜第一的天之骄子，结果两世都不得善终。\n直到第三世，眼睛一闭一睁，穿到星际时代，变成了一个五岁孤儿，迎瓷真的累了。\n这真的不是拐卖人口吗？能不能请有关部门管一管啊。\n风雨中飘摇的家，没爹没妈的她，清澈见底的财富和不努力捡垃圾就会饿死的生活。\n老天奶，她在互联网上接的不是这种日子啊。\n直到有一天，迎瓷翻到一张沾满油污的传单上写着：联邦“未成年教育保障计划”孤儿或底层贫困人口，只要通过最低入学测试就能进入就近的公立学校，享受包吃包住……\n本着免费的就是最好的，迎瓷决定去小学美美躺平，却因为每一次“省事操作”被当成隐藏实力的天才。\n她一路躺、一路被卷、一路拒绝，直到……\n（第一章作话有避雷，大家阅读前可以看一眼哦，如果是不喜欢的题材或者雷点，也方便提前识别）", "tags": ["科幻末世", "穿越", "星际", "女强", "天才", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日死考：七岁丧尸王也要考试？", "fullTitle": "末日死考：七岁丧尸王也要考试？", "link": "https://fanqienovel.com/page/7652257815586688025", "data": [3.85, 4.2, 4.48], "trend": 0.63, "latest": 4.5, "wordNumber": 192112, "creationStatus": 1, "desc": "评分刚出！会涨！看正文看可爱小老大!\n末日废土+恶童丧尸王+比格属性+全名求生直播】\n季末一觉睡醒，发现家没了，哥也不见了，甚至她连人都不当了。\n因为她变成了一只丧尸，穿着花棉袄的丧尸王。\n季末想要找妈妈，脑海中就传来了一道机械音。\n“叮，第101次末日死亡高考准备开始，考场已准备就绪，请考生做好准备。”\n季末：嗯？高考？我吗？可我刚满七岁，还没上小学啊。\n紧接着，季末出现在了墓地。\n考题：枯骨酸雨墓园（杀戮求生）\n季末不识字，问一旁的姐姐。\n姐姐眼神奇怪：“小姑娘，幼儿园不教认字吗？”\n季末挠了挠头：幼儿园，不是教杀人的地方吗？\n不过好在，她得到了答案。\n不需要做数学题啊，既然如此，她要开始，发疯了！\n----\n基地中，幸存者们看着直播画面，其实早就麻木了，因为人类根本没有希望，不过是延长死去的时间罢了。\n可突然，一个名叫季末的积分以成倍递增，所有人都涌入了季末的直播间。\n咦？咋还有个小孩。\n有点不爱干净啊，这脸咋乌漆嘛黑的，这花棉袄好土啊。\n季末：你们这是言语霸凌小学生。\n同样看到直播的五位哥哥：呜呜呜，我的妹宝，没死！\n有幸和季末一起参加高考的高考生们：人麻了，死考最恐怖的，是那个熊孩子啊！", "tags": ["科幻末世", "末世", "直播"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽皮肤抽到丧尸位面后我上交了", "fullTitle": "抽皮肤抽到丧尸位面后我上交了", "link": "https://fanqienovel.com/page/7660783163194494014", "data": [2.54, 2.87, 3.12], "trend": 0.58, "latest": 3.1, "wordNumber": 170235, "creationStatus": 1, "desc": "【多位面穿越+都市脑洞+有CP+强国+成长向+群像】\n【末世+游戏+小说+星际+修仙……】\n她只是想抽个皮肤，怎么还带强买强卖！\n从丧尸位面死里逃生后，奚乔裹成粽子冲进派出所：警察叔叔，我要上交！\n从此，国家爸爸组队穿越，奚乔开开心心薅资源，薅科技，薅系统！\n******\n“警察叔叔，等我变成丧尸，就会不讲卫生，还喜欢到处咬呜呜……我、我不知道会不会传染。”\n她不想被豌豆射手biu biu、biu！\n******\n“本系统是正经系统！”\n奚乔冷笑：“正经系统会把人强制送去丧尸世界？”\n系统：“……”\n它不吭声了。\n******\n“毕竟时间太短，那些人都只会按任务做，谁能想到带着一堆现实种子来补图鉴啊！”\n奚乔默默举手。\n“国家爸爸会。”\n系统安静了一秒，诚恳道：“你们国家爸爸确实很离谱。”", "tags": ["科幻末世", "系统", "穿越", "末世"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "基因沉沦：和队友在星际养老后", "fullTitle": "基因沉沦：和队友在星际养老后", "link": "https://fanqienovel.com/page/7657378158580075544", "data": [2.71, 2.91, 3.01], "trend": 0.3, "latest": 3.0, "wordNumber": 177924, "creationStatus": 1, "desc": "【队伍群穿+星际+1vN+团宠+马甲+雄竞+哨向改动+文抄公+全洁】\n飞船试验故障，应承雪和队友穿越黑洞流落垃圾星。\n星际时代，基因强化，贵族掌握绝对话语权，普通人想要翻身除了拥有绝对实力，还需要一定程度的基因。\n应承雪等人在这陌生的强权环境下该如何自处？\n……\n【身份篇】\n拥有一个身份光脑时，三人共用一个。\n拥有两个身份光脑时，新光脑的匹配者找上门。\n好在新光脑的主人身份优越，但性格不讨喜，光脑的匹配者睁一只眼闭一只眼，默认换人。\n可要谁成为新光脑的主人，匹配者们很有默契的指向其中一个……\n匹配者：这个呆呆的，看着很好掌控的样子。\n【匹配篇】\n基因匹配，姐妹几人暗自嘀咕。\n幽灵小队成员司岚：我匹配九个，你们呢？\n幽灵小队副队元乐宜：九个。\n两人默契将头颅转向队长应承雪。\n应承雪地铁老爷爷看光脑：十三……", "tags": ["科幻末世", "星际", "穿越", "群穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世经营：四位大佬蹲我小店打杂", "fullTitle": "末世经营：四位大佬蹲我 : 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿之人渣的宠妻洗白攻略", "fullTitle": "快穿之人渣的宠妻洗白攻略", "link": "https://fanqienovel.com/page/7651178616738303038", "data": [11.81, 12.22, 12.19], "trend": 0.38, "latest": 12.2, "wordNumber": 220561, "creationStatus": 1, "desc": "【世界三已完结（评分刚出，会涨哒！）】【女频文+男主视角快穿+沉浸式扮演+每个世界1v1宠妻虐渣】\n-\n小说世界里，总有一些人渣炮灰角色，做尽伤害欺骗之事，毁掉她人一生，最后不得善终。\n\n裴衍之的任务就是穿进各个小说世界，沉浸式扮演这些渣男，洗白自己，让原本悲惨的她们幸福美满一生。\n……\n世界一：【真假千金文里，霸凌病弱真千金的嚣张养弟】\n世界二：【武侠文里，哄骗正道小师妹身子的风流采花贼】\n世界三：【狗血文里，P图擦边钓白富美的通天代游戏陪玩】\n世界四：【权谋文里，与贵妃私通的杀伐果断摄政王】\n世界五：【诡异文里，欺骗鬼新娘BOSS的人类榜一杀神】\n......\n劝退：【主角非好人，只对任务目标宠溺！手段狠戾！而且一开始的人渣设定不会转变得太突兀哦！】", "tags": ["快穿", "系统", "宠妻", "幻想言情", "虐渣", "1v1"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：炮灰上位，从抢男主开始", "fullTitle": "快穿：炮灰上位，从抢男主开始", "link": "https://fanqienovel.com/page/7596580709154704446", "data": [14.24, 14.51, 14.58], "trend": 0.34, "latest": 14.6, "wordNumber": 214484, "creationStatus": 1, "desc": "【快穿，双洁，绿茶心机女主，炮灰逆袭，横刀夺爱上位，女主美艳无双】\n\n寻意被一股神秘的力量囚于无尽的轮回之中。\n她的行为和意志被操控了，被写成了无数个故事范本，成了剧情需要的炮灰，在悲惨的命运里苦苦挣扎。\n一朝觉醒，绑定系统，她决定踢翻剧情。\n就从抢男主开始，改变剧情，抢夺气运。\n然而突然出现的“女主印记 ”，让她觉得这无尽的轮回似乎没那么简单。\n-\n世界1：闺蜜的高富帅男友？我的了！（完）\n上一世寻意受困于剧情，对拥有女主光环的塑料闺蜜掏心掏肺，最后却落得替她顶罪被活活打死的下场。\n重来一世，她大胆出击，勾引闺蜜的高富帅男友，揭穿闺蜜伪善的嘴脸，让她落得跟自己上一世一样惨死的下场。\n- \n世界2：末世绿茶继妹，靠演技抢走男主（完）\n因母亲为救男主被丧尸咬了，临死前拜托男主保护好她，于是寻意就成了男主毫无血缘的便宜继妹。\n可一见面男主就因感染病毒强行与她发生了关系，事后还一脸愧疚强调会把她当亲妹妹，让她跟他未婚妻好好相处。\n于是她表示：哥哥放心，我就只是你的妹妹。\n到最后是谁把持不住还不一定呢。\n-\n世界3：灰姑娘故事中，男主的炮灰前妻（进行中）\n这次前妻成了爱妻，白月光倒成蚊子血了。\n\n\n", "tags": ["快穿", "系统", "幻想言情", "HE", "双洁", "1v1"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "娇软小漂亮天生就要被男人觊觎", "fullTitle": "娇软小漂亮天生就要被男人觊觎", "link": "https://fanqienovel.com/page/7660389113538808894", "data": [10.92, 10.96, 11.19], "trend": 0.27, "latest": 11.2, "wordNumber": 208716, "creationStatus": 1, "desc": "［1v1+双洁+甜宠+身高差体型差+各种类型男主+天生媚骨］\n小合欢花终于修炼成人形，在族里长辈的提议下入世修行。\n云雪儿谨记长老 ”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "当我同时绑定好孕系统和天命系统", "fullTitle": "当我同时绑定好孕系统和天命系统", "link": "https://fanqienovel.com/page/7654893715571362878", "data": [4.95, 5.52, 6.0], "trend": 1.04, "latest": 6.0, "wordNumber": 146930, "creationStatus": 1, "desc": "【变嫁+渣男改造+多男主+魅魔体质+攻略+生子变强】\n因为在前世辜负了太多女孩子的真心，卿越被前女友的哥哥撞死，死后同时绑定了天命掠夺系统和人渣好孕系统，前者帮他变强，后者要他赎罪，结果二者谁也不服谁，最后只能达成协作，让他通过攻略三个天命之子，并为他们诞下子嗣，才能变强的同时也跟着赎罪。\n卿越根本来不及拒绝，灵魂就被投放到了修真世界，成为了南宫家的二小姐——南宫卿月。\n从他变成了她。\n而她十八岁那天，在系统给的抽奖轮盘里抽中了绝世魅魔体质，同时系统给她发布了第一个任务。\n要她去攻略即将被她阿姐强势退婚的天命之子——萧焱尘，并在二十岁之前为他生下第一个孩子。\n为了活下去，南宫卿月不得不接受系统发布的任务……\n注1:本文又叫“人渣改造之旅”，“系统逼我生孩子”，“当我抽中魅魔体质后”。\n注2:主角前世真的很渣，不要同情“他”。", "tags": ["玄幻言情", "系统", "幻想言情", "前世今生", "双系统", "胎穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [16.81, 17.29, 17.69], "trend": 0.88, "latest": 17.7, "wordNumber": 216989, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "危！刚飞升我就杀了天帝？", "fullTitle": "危！刚飞升我就杀了天帝？", "link": "https://fanqienovel.com/page/7663020533176339518", "data": [5.7, 6.21, 6.5], "trend": 0.81, "latest": 6.5, "wordNumber": 136328, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在秘境废墟捡的垃圾都是宝", "fullTitle": "我在秘境废墟捡的垃圾都是宝", "link": "https://fanqienovel.com/page/7623367574926920729", "data": [4.89, 5.17, 5.58], "trend": 0.69, "latest": 5.6, "wordNumber": 251302, "creationStatus": 1, "desc": "【异世大陆】【打怪升级】【捡垃圾】【诡异】【领地经营】【秘境捡宝】【群像】【美食】\n莫小西穿到诡怪纵横之地，这里的人类以诡虫蘑菇苔藓为食，以诡怪皮为衣。\n她觉醒万物修复魂术，不仅可以修复秘境，还可以修复从秘境内捡到的垃圾，于是，煞气横生的秘境废墟成为她的藏宝地，这里遍地都是仙器灵器残骸，还有高阶仙宝残骸，仙府残骸，关键是，仙府残骸内还有遗存的灵植园……\n莫小西修复这些残骸为己用，终于吃上大米白面跟水果蔬菜，带着弟弟过上人人羡慕的好日子......", "tags": ["玄幻言情", "幻想言情", "穿越", "美食", "群像", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [3.78, 3.88, 4.14], "trend": 0.36, "latest": 4.1, "wordNumber": 296883, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "古色古香"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [5.49, 5.66, 5.81], "trend": 0.32, "latest": 5.8, "wordNumber": 279694, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "魂穿", "剑修"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [5.31, 5.45, 5.62], "trend": 0.3, "latest": 5.6, "wordNumber": 229558, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.19, 7.37, 7.45], "trend": 0.26, "latest": 7.5, "wordNumber": 213043, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\n——\n阮吱吱回到现实世界，不知为何，时常想起那个肆意潇洒的少年人。\n系统再次出现:【检测到男主黑化值过高，即将毁灭世界！】\n什么？\n他居然这么爱自己！\n怀着微妙情绪，阮吱吱回到书中世界，又一次见到他。\n少年穿着喜服，神情阴霾，手里拿着绳索，缓步而来。\n阮吱吱紧张，“裴厌，我可以解释，你别囚禁我——”\n她被扭断了脖子。\n倒在地上刹那，她见到的是少年把藏着的女孩抓出来，低声威胁:\n“贺喜，你再敢逃婚试试？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿书", "异世穿越", "黑化"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "那个闻药就呕的庸医是剑仙", "fullTitle": "那个闻药就呕的庸医是剑仙", "link": "https://fanqienovel.com/page/7653601370594872344", "data": [3.54, 3.68, 3.7], "trend": 0.16, "latest": 3.7, "wordNumber": 237156, "creationStatus": 1, "desc": "（刚开分，还会涨）【微群像+1v多雄竞+男全洁+性取向丰富+女强+团宠+掉马甲+高冷老六】\n月照梵身为医修，却一闻药味就想yue。\n问题不大，被当成黑心医修有什么不好？\n如果病人不听医嘱，那么我也略懂一些拳脚。\n没想到好不容易用技术征服患者，竟惹得剑宗高岭之花大师兄黑化疯魔：\n“小奶狗有什么好？是我还不够骚吗？” \n温润如玉的贵公子发小不服，跟在后面又争又抢：\n“只要你愿意多看我一眼，哪怕像小时候一样天天打我都行……”　　\n回到家还没喘口气，又被自己的腹黑兄长药翻在床上：\n“梵儿，兄长不好吗？为什么要去找别人？”\n月照梵还没跑掉，又被魅魔合欢宗宗主纠缠不休：\n“小月儿，男人有什么好？姐姐能让你尝到什么叫极乐……”\n谁能想到好不容易逃出生天，又被魔君抓走按住：\n“听说……你要我死？”\n月照梵都受不住了，首富家的腼腆少主还来横插一脚：\n“梵、梵姐……我很乖的……”\n接连而来的修罗场让月照梵怀疑人生，修真界怎么如此危险？", "tags": ["玄幻言情", "幻想言情", "医术", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.26, 3.34, 3.41], "trend": 0.16, "latest": 3.4, "wordNumber": 242566, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自 ”\n乌龙导致的结果就是：\n1.贴身太监王长贵，以头抢地：陛下您快歇歇吧，不然小皇子怎么办？\n2.太医院院判老李头，如履薄冰：陛下别闹了，您需要卧床！\n3.一向跟他不对付的弟弟宁云琅，看他的眼神也带着莫名其妙的关怀：皇兄，保重龙体。\n不仅前朝乌烟瘴气，就连微服私访收的学生也学会了那一套，一群人整天盯着小宁的肚子。\n众人：陛下都是为了我们才病的如此厉害，我要给陛下打一辈子工！\n小宁一边咳一边骂：朕真求你们了，你们疯了吗？", "tags": ["古言脑洞", "古代言情", "团宠", "无CP", "系统", "重生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "对，我在古代当神女", "fullTitle": "对，我在古代当神女", "link": "https://fanqienovel.com/page/7662746316191042585", "data": [2.92, 3.37, 3.63], "trend": 0.71, "latest": 3.6, "wordNumber": 171422, "creationStatus": 1, "desc": "穿到旱灾古代呼风唤雨，开局成神➕无cp➕万人迷。\n \n旱灾？她可呼风唤雨。\n缺粮？她可催生万物。\n瘟疫？她灵丹祛百病。\n\n片段：\n　　一船人呆呆看着。\n\n　　像山般大的巨兽，此刻褪去凶相，像一只狗一样，温顺地围着周身泛光的少女游动。\n\n　　符汐伸出手，手掌轻轻贴上它潮湿粗糙的脊背。\n\n　　海风卷走她的话音。\n\n　　“跟着我。”\n\n　　“我带你回深海。”\n\n　　巨鲸似乎听懂了她的声音。\n\n　　低鸣一声，沉入海中。\n\n　　符汐飞起，如同夜里一盏孤灯，在前方引路。\n\n　　巨鲸摆动巨大尾鳍，追着那片光亮，朝着无边远洋游去。", "tags": ["古言脑洞", "古代言情", "乡村", "穿越", "今穿古", "系统"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "皇室盼了三百年的小公主竟是神棍", "fullTitle": "皇室盼了三百年的小公主竟是神棍", "link": "https://fanqienovel.com/page/7658125514355264574", "data": [5.78, 6.23, 6.47], "trend": 0.69, "latest": 6.5, "wordNumber": 167899, "creationStatus": 1, "desc": "【玄学＋萌宝＋吃瓜+无脑爽文＋算命+虐渣＋团宠＋小缺德】\n   洛氏皇族阳盛阴衰，三百年内无一个女孩儿出生，当今圣上急得都想让老祖宗们搬新家了。\n   或许是老祖宗们怕棺材板不保，也或许是皇天不负有心人，在全皇室的殷殷期盼下，三百年后，终于迎来了他们心心念念的小公主。\n   天老爷啊！\n   小公主竟然是个小神棍！\n   别看她小小一只，年仅三岁半，但她文武双全、能掐会算、画符炼丹、驱鬼算命、上房揭瓦、惩奸除恶……样样精通。\n   一双眼能看透众生因果，主打一个不爽就开扒，所有阴私之事在她眼里都不是秘密。\n   满朝文武瑟瑟发抖：你不要过来啊！", "tags": ["古言脑洞", "古代言情", "团宠", "虐渣", "无脑爽", "风水秘术"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成病秧子原配，八个男配想偷家", "fullTitle": "穿成病秧子原配，八个男配想偷家", "link": "https://fanqienovel.com/page/7651982720796478526", "data": [7.56, 8.2, 8.18], "trend": 0.61, "latest": 8.2, "wordNumber": 228872, "creationStatus": 1, "desc": "【穿书+改造系统+大女主+多男主全洁+逆袭变美+万人迷】\n影后萧司沅与新欢幽 "pointRadius": 5, "borderWidth": 2}, {"label": "天幕盘点大秦女相，怎么是我啊！", "fullTitle": "天幕盘点大秦女相，怎么是我啊！", "link": "https://fanqienovel.com/page/7659047521683000344", "data": [2.16, 2.25, 2.34], "trend": 0.19, "latest": 2.3, "wordNumber": 204720, "creationStatus": 1, "desc": "【女扮男装+天幕盘点+秦始皇+权谋+基建+种田+基建狂魔】\n\n　　穿越成秦朝一个女扮男装的穷县令，黎简开局只有一间空得连老鼠都不来的粮仓。\n\n　　系统却要求三年温饱，五年奔小康。\n\n　　她卷起裤腿下田教沤肥、蹲在水田里试种水稻、用蜂窝煤撬动经济。\n\n　　就在她撸起袖子准备大搞水泥路和砖窑，带着全县奔小康时，天幕突然横亘苍穹。\n\n　　两千多年后的考古直播，硬生生砸在了大秦的天空上。\n\n　　始皇陵被挖、历史走向泄露、六国余孽蠢蠢欲动……整个天下都乱了套。\n\n　　黎简本打算置身事外，闷头搞基建就好。\n\n　　然而天幕第二次亮起时，却抛出一个石破天惊的消息。\n\n　　【被挖的不是秦始皇陵，而是大秦女相的陵寝。】\n\n　　黎简：“？？？”\n\n　　大秦什么时候有女相了？\n\n　　那个女相的名字，怎么跟自己一模一样？\n\n　　不等她理出头绪，天幕的声音再度响彻苍穹。\n\n　　【诸位，我们现在打开的，是大秦女相、也是古往今来千古第一女相的陵寝。】\n\n　　整个大秦，热血沸腾。\n\n　　黎简低头看了看自己手里的蜂窝煤模具，又抬头看了看天幕，陷入了沉思。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "女扮男装", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满朝听见我心声后，长公主护短了", "fullTitle": "满朝听见我心声后，长公主护短了", "link": "https://fanqienovel.com/page/7642748664410016793", "data": [4.43, 4.52, 4.58], "trend": 0.15, "latest": 4.6, "wordNumber": 287907, "creationStatus": 1, "desc": "（评分刚出，后面会涨，请放心食用）【读心吃瓜+爆笑沙雕+发疯文学+甜宠+微群像+双女主+1v1】\n版本一：\n宁小满穿越大夏两年半，绑定吃瓜系统。\n她在街上卖身时，被乔装逛街的冷面长公主带回府。\n\n她以为抱上金大腿，结果公主府也不太平：管事做两套账、绣房拿针扎人、外院领粮越来越狠。\n她嘴上装傻，心里喊统子扒瓜，公主、丫鬟、护卫统领，一个个憋笑憋到内伤。\n\n后来，皇帝听见了，皇后听见了，满朝文武也听见了。\n于是，大夏朝堂画风突变。\n\n反派正在深情演戏，她心里吐槽：\n「哥，别演了，你心眼多的都能给苏打饼干扎眼了。」\n\n贪官正在哭穷喊冤，她心里开麦：\n「你家地窖银砖都快码成小长城了，还搁这儿装月光族？」\n\n众人表面严肃，内心疯狂憋笑。\n宁小满：奇怪，为什么他们看我的眼神越来越不对？\n\n长公主冷静护人：\n“她胆小，别吓她。”\n\n满朝文武看着刚在心里把反派祖宗十八代都创飞的小姑娘，陷入沉默。\n胆小？\n殿下，您要不要听听她心里在骂什么？\n\n版本二：\n全大夏都知道，长公主萧明昭冷血、冷面、冷心。\n直到有一天，她捡回一个叫宁小满的小姑娘。\n\n从此，长公主上朝会走神，皇帝批奏折会喷茶，皇后喝茶会微笑，满朝文武会集体沉默。\n因为他们都听见了同一个声音。\n「啊，这瓜真香！」", "tags": ["古言脑洞", "古代言情", "系统", "甜宠", "搞笑轻松", "1v1"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了冷血皇帝的病弱炮灰养子", "fullTitle": "穿成了冷血皇帝的病弱炮灰养子", "link": "https://fanqienovel.com/page/7628961061521083416", "data": [2.72, 2.7, 2.8], "trend": 0.08, "latest": 2.8, "wordNumber": 272984, "creationStatus": 1, "desc": "【亲情向＋无CP＋病弱＋团宠＋架空】\n　　作为第二代的陪伴型AI仿真人，零零一陪伴小主人从幼崽到成年期，功不可没。\n　　按照原计划，它是要更新老化零件，再陪伴主人到老年。\n　　但市面上越来越多的新款，大人们早就想要换掉它，他们第一时间销毁了零零一。\n　　零零一不知道自己被销毁了，在重新醒来过后，它以为自己升级成功了，换了新皮肤。\n　　但脑海中不知道为什么多出了一段奇怪的记忆，它是炮灰？叫做李临祎？\n　　还是个炮灰，因为身体孱弱，又天生寡言少语，被遗弃在雪天荒野，遇到了重伤的帝王李钦纶。\n　　帝王会心软，将他带回去，认作养子，养在身侧。但他不识好歹，偏执娇纵，横行无忌，得罪了一众皇子公主，以及妃子，甚至下到宫女太监，无一不厌恶他。\n　　最后落得废为庶人，驱逐出宫的下场。\n　　零零一不明白自己这是穿书了，以为这是自己被新植入的程序……既然是程序，就应该执行。\n　　至此，零零一变成了炮灰李临祎。\n　　但不太会阴谋诡计的陪伴型零零一，总会搞砸一切……\n　　他后知后觉地发现，已经和【程序】完全不一样的时候……\n　　嗯，大概是零零一变成了真人之后的古代日常。（架空哒！）", "tags": ["古言脑洞", "古代言情", "穿越", "团宠", "医术", "无CP"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被丢乱坟坡后，我的客户全是鬼", "fullTitle": "被丢乱坟坡后，我的客户全是鬼", "link": "https://fanqienovel.com/page/7652224733592685592", "data": [5.71, 5.81, 5.78], "trend": 0.07, "latest": 5.8, "wordNumber": 291068, "creationStatus": 1, "desc": "修仙界不务正业的茱萸散人渡劫失败，一睁眼发现自己穿到古代奄奄一息的三岁小儿身体里。\n大冬天被家里人扔到乱坟坡，眼瞅着就要冻死了。\n 好消息：渡劫失败被雷劈死又活了。\n坏消息：这个世界没有灵气，修炼不了。\n本以为这辈子都要像凡人一样生活了，突然发现天道还给她留了条缝。\n她继承了原主的阴阳眼，能以凡人之躯看到鬼。\n在帮鬼完成心愿后，对方的真心感激会化为愿力进入她体内，而这愿力能转化成灵气。\n这就叫天无绝人之路啊！\n\n于是接下来茱萸的日子变了。\nA：我死时没来得及告诉儿子我私房钱藏在哪，烦请姑娘帮忙找出来放到儿子床头。\n茱萸：行\nB：我儿子换了我的棺材板，你帮我把他私房钱偷来咱俩分。\n茱萸：可以\nC：我要跟我老相好埋一起。\n茱萸：没问题\nDEFJGHIJK……\n\n茱萸一鱼两吃，愿力+劳务费两手抓，每天睁开眼：办完你的办你的……\n\n", "tags": ["古言脑洞", "古代言情", "乡村", "幻想言情", "穿越", "风水秘术"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "丰腴美人穿成恶毒女配后，发疯了", "fullTitle": "丰腴美人穿成恶毒女配后，发疯了", "link": "https://fanqienovel.com/page/7660895066201787416", "data": [9.51, 10.76, 11.67], "trend": 2.16, "latest": 11.7, "wordNumber": 159640, "creationStatus": 1, "desc": "【丰腴恶毒美人VS绝嗣封建大爹】\n【系统电击+对抗路夫妻+男主生理性喜欢】\n季清然穿书了，穿成了书里的恶毒女配。\n系统告诉她，完成任务后，她就能得到一亿。\n不就是走剧情吗，她狠狠行。\n设计陷害男主娶她，骂男主是不会下蛋的公鸡，只要有女人喜欢男主，就甩男主巴掌，伤害男主的侄子…\n不能脱离人设，否则就会被系统电击。\n她的目标是走完剧情拿钱跑路。\n看着微微隆起的肚子，她崩溃打人，“系统，你不是说是绝嗣吗？”\n系统：“他是男主。”\n季清然：“都给他，我只要钱回家。”\n…\n沈景川是书里的男主，人生一路顺到到三十岁，遇到了季清然这个大坎。\n他时常被这个小妻子气得脑门疼，不管怎么教育，她总是我行我素。\n沈景川在跟她相处的时候总是会感觉心脏不舒服，他以为是被气的。\n有一天，战友告诉他，喜欢就是一种电流般的酥麻感，沈景川不愿相信他喜欢上了那个恶毒的小妻子。\n她都快把他兜里的钱都掏完了。\n还想跑路呢。\n…\n当沈景川从医生的嘴巴里听到妻子怀孕的消息后，如遭天谴。\n“打掉！”他冷声说。\n“好。”季清然很轻易就答应了。\n他却后悔了，经过半个月的考虑，他接受了这个别人家的孩子。\n可是，养着养着，孩子却跟他越来越像", "tags": ["年代", "现代言情", "系统", "先婚后爱", "穿书"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带娃上军区找爹，改造前夫被亲哭", "fullTitle": "带娃上军区找爹，改造前夫被亲哭", "link": "https://fanqienovel.com/page/7635968897727859774", "data": [6.5, 7.11, 7.6], "trend": 1.1, "latest": 7.6, "wordNumber": 270369, "creationStatus": 1, "desc": "年代女大学生揣崽上部队，找被她弃的军官前夫\n【训夫成军区大佬+换亲拿捏男人+资本家肤白貌美大小姐VS首长家刚从乡下找回来的真儿子】\n夏桃是肤白貌美资本家娇小姐，是这个年代难得的大学生，有为她谋划的心机恶毒亲妈。\n新婚夜被继姐算计走错房，不知情的情况下，她男人变成了乡下泥腿子出身的军官，用户口本还跟对方领了证。\n一觉醒来夏桃傻眼了，把人狠狠踢下床，坚持离婚。\n生米煮成熟饭周野不想离婚。\n当初相看，有人指着夏桃说是他相看对象，他才会同意婚事。\n他这人俗气，就图媳妇俊。\n夏桃死活不愿意，用自杀逼着周野打离婚报告。\n周野最终还是妥协离婚了。\n不久夏家被下放。\n夏桃觉醒记忆，才发现肚里揣了崽。\n走错房不是意外。\n她和她妈是书里的恶毒继妹和心机后妈，不仅跟女主抢男人还抢家产。\n下放改造后，她和崽都惨死乡下。\n周野不是泥腿子，他才是首长家真儿子，然而身份还没曝出就出任务牺牲了。\n他压根不知道他们还有两个崽，也不知道自己的身世，更不知道她和崽惨死。\n重活一世。\n夏桃揣崽上部队找崽爹负责，这人可不能早死，早死她和崽咋办，还得改造他让他认祖归宗，带她和崽过好日子。\n爱不爱不重要，给钱给工作保证他们生活就行", "tags": ["年代", "现代言情", "重生", "大佬", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [8.37, 9.0, 9.19], "trend": 0.82, "latest": 9.2, "wordNumber": 204659, "creationStatus": 1, "desc": "评分刚开，后面会涨。\n（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，爷奶等啊等，都没等到老二媳妇怀二胎的消息。\n一问才得知，陆老二夫妻俩只生一个孩子，那怎么行！\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心，要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零年代：我在香江当咸鱼", "fullTitle": "六零年代：我在香江当咸鱼", "link": "https://fanqienovel.com/page/7658880923777109017", "data": [5.02, 5.19, 5.22], "trend": 0.2, "latest": 5.2, "wordNumber": 179346, "creationStatus": 1, "desc": "末世女穿越到六十年代的小姑娘身上，周围群狼环伺盯上了她家的宝藏，看她扮猪吃老虎，携空间卷走宝藏偷渡香江后，开始买房投资，过上躺平当咸鱼的日子。\n后来发现自己撒的谎都成了真，只能一边走一边补，顺便拐走高冷之花，坐拥财富，过上别样人生。", "tags": ["年代", "现代言情", "穿越", "空间", "扮猪吃虎", "冰山"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [7.24, 7.45, 7.4], "trend": 0.17, "latest": 7.4, "wordNumber": 282928, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "骗婚捞女？科研大佬独宠丰腴美人", "fullTitle": "骗婚捞女？科研大佬独宠丰腴美人", "link": "https://fanqienovel.com/page/7649237755582483518", "data": [8.08, 8.16, 8.2], "trend": 0.12, "latest": 8.2, "wordNumber": 245034, "creationStatus": 1, "desc": "【娇媚丰腴大美人VS外冷内野重欲大佬】\n【架空+八零+上位者为爱低头+独宠+先婚后爱+日久生情】\n柳娇媚穿进八零年代，成了书中那个又娇又媚的丰腴美人。\n好消息：老公穆寒舟是顶级科研大佬，工资津贴月月全额上交。\n坏消息：原主是捞女，老公是骗来的。\n按原书剧情，大佬半年后回家，发现原主是照骗，当场提出离婚。\n原主爱慕虚荣，对穆寒舟下药，企图生米煮成熟饭留在京市。\n穆寒舟自己忍着，给原主灌了十倍的药，丢进黑矿里，原主被摧残致死……\n柳娇媚瑟瑟发抖：惹不起惹不起，趁大佬还没回来，赶紧跑路！\n可原主太能挥霍了，兜里就剩二块五，估计跑出家门就饿死了。\n柳娇媚给自己定制剧本：装乖撒娇拉满情绪价值，搞一笔钱，再挑刺冷战断崖式分手。\n冷峻矜贵的科研大佬，开始电话里喊她宝宝，一张张万元汇款单砸过来，砸得柳娇媚说不出分手。\n穆寒舟一颗心，被家里的小妻子撩得辗转反侧，科研上攻坚克难，短短二个月就解决了预计半年才能解决的难题。\n提前回京市，只想按着小妻子的说法，把人狠狠宠爱，结果火车站就被正准备跑路的小妻子撞了个满怀。\n穆寒舟：宝宝！\n柳娇媚：？\n扣着小妻子的手腕把人抵在门上，穆寒舟：电话里说喜欢的，是这样吗？", "tags": ["年代", "现代言情", "先婚后爱", "独宠", "日久生情", "大佬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "搬空家产去随军，进错洞房被亲晕", "fullTitle": "搬空家产去随军，进错洞房被亲晕", "link": "https://fanqienovel.com/page/7649401358138756120", "data": [4.99, 5.05, 5.03], "trend": 0.04, "latest": 5.0, "wordNumber": 273338, "creationStatus": 1, "desc": "【空间+萌宠+爽文+丰满娇媚能医会毒大美人VS顶级男德无脑护军官】\n全球首富大小姐白梨无聊开了把游戏，打团气到嘎过去，还倒霉催的穿进酸鸡室友写的小说里。\n原主作为天命女主，被攻略者夺取气运，剥离光环，收走家产，家暴致死。\n死了也不放过，还给她配了几门阴婚。\n这给白梨看笑了，什么脑残剧情？滚一边去。\n她只会以恶制恶，煽风点火，主打谁都别想活。\n亲爹渣，后妈毒，她鞭子蘸碘伏，边打边消毒，免费附送农场改造VIP服务。\n白莲继妹？给她脸划烂，腿打断，嘴巴缝上，送她去收破烂。\n房屋地皮收收收，祖产嫁妆搬搬搬，雁过拔毛，一分不留，厕纸都一道顺走。\n连夜收拾行李，去军区投奔未婚夫。\n只是，咦，好像投错了～。\n裴泫冷静克制，不近女色，战友临时出任务，他去帮接未婚妻。\n第一次见面，小姑娘肤白貌美，身段窈窕，脆生生喊了句，“同志，你好。”\n裴泫心脏狂跳，连娃儿名字都已经想好。\n兄弟，既然你嫌弃，那我可就接盘了？\n大院都说裴泫疯了，捡了个兄弟不要的二手货。\n结果，白梨一手银针，起死回生，灵药出手，病痛全消，八国语言，通通全会，还被国家奉为座上宾，视为重点保护对象。\n看着闪闪发光的她，战友那是肠子都悔青了。", "tags": ["年代", "现代言情", "穿越", "空间", "先婚后爱", "虐渣"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频悬疑": [{"label": "盗笔：猫鼠人一家亲", "fullTitle": "盗笔：猫鼠人一家亲", "link": "https://fanqienovel.com/page/7659744133816257598", "data": [5.2, 5.71, 6.12], "trend": 0.92, "latest": 6.1, "wordNumber": 141560, "creationStatus": 1, "desc": "（OOC）（原创女主+无cp＋重生+猫和老鼠+私设）（时间在盗笔主线半年前）\n解家新来了一位表小姐。\n她父母双亡，孤苦伶仃。\n解当家为了还恩，特意将其接来老宅照顾。\n表小姐不是自己来的，她还带了一只半人高的英短蓝白。\n自从一人一猫来到解宅，老宅怪事频发。\n先是解当家深夜遇“鬼影”，只闻其声不见其“人”。\n后是厨房频繁被偷，疑似小偷已饿疯。\n直到天价古董无故失窃，对方还毁坏现场，场面之惨烈确定为打击报复。\n可解当家绞尽脑汁，翻遍新仇旧恨账本，却不得真面目。遂请来“专家”，却被专家质疑为失心疯。\n这一系列事件究竟是人性的扭曲，还是猫性的沦丧，关注大王，持续为您报道。\n……\n鹿笙是个传统的淑女，却命比纸薄，死在了最好的19岁年华。\n为了再给自己挣一条命，她接受了世界意识派发的拯救世界的任务。\n因为大量人物的重生，盗笔世界的主线乱成一锅粥，就需要有一个人来纠正它。\n鹿笙就成了天选之人。\n可熟知剧情的小伙伴都知道，盗笔是著名的黑深残。\n为了保证人身安全，聪明的鹿笙给自己找了两个小伙伴。\n一只猫和一只鼠。\n至此，猫鼠人小队正式成立，拯救世界行动开始。\n接下来登场的是，\n世界上最佳团队\n传奇点子王\n三大魔丸组合\n颤抖吧，新世界", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人", "悬疑恋爱"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：长生都是有纹身的", "fullTitle": "盗墓：长生都是有纹身的", "link": "https://fanqienovel.com/page/7622580052009438233", "data": [13.75, 14.34, 14.64], "trend": 0.9, "latest": 14.6, "wordNumber": 280524, "creationStatus": 1, "desc": "【OOC+无CP+全员单箭头+陈皮亲儿子+社恐男主+我是想要刺激，但绝对不包括这种刺激】\n陈言回到陈家的第一件事，就是杀了一批汪家人。\n陈金水到死都没想明白，汪家是什么？\n长白山上，张启灵觉得陈言眼熟，好像在哪里见过。\n吴邪更是不可置信的问潘子要是他成了家主，也需要这么干吗？\n对于黑瞎子，陈言更是热情，问黑瞎子吃不吃烤肉？\n瞎：小四爷，瞎子我吃饱了。\n言：那可惜了。\n*\n陈言的出现，炸了整个九门，也炸了整个盗墓圈子。\n谁都没有想到，一直混迹在国外，亲娘是北派最有名的摸金校尉后人的胡清，竟然会是南派九门四爷的崽子。\n南北派都怀疑人生了。\n吴三省想要局限于南派的事情，陈言不屑。\n要玩就玩大的。\n*\n北派南派，三教九流都疯了，长生？长生在哪？哪有长生？\n什么？长生的人身上有纹身？懂！挖地三尺都要找出来！\n汪家：草！\n张家：草啊！\n九门：陈皮！！！\n陈皮：我耳聋，还眼瞎，等死呢。勿扰。\n小剧场。\n邪：言哥，我三叔能还我吗？\n花：阿言，解连环能直接掐死吗？\n灵：我留下。\n黑：言子，没有你我可怎么活啊~\n皮：我砍死你们！\n言：我是想要刺激，但绝对不包括这种刺激。\n胖：言哥，求带啊，我也是摸金校尉的后代啊~", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人", "悬疑恋爱"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让你破案，你搁这分享犯罪经验？", "fullTitle": "让你破案，你搁这分享犯罪经验？", "link": "https://fanqienovel.com/page/7655334215491275801", "data": [8.76, 9.22, 9.42], "trend": 0.67, "latest": 9.4, "wordNumber": 282991, "creationStatus": 1, "desc": "评分刚出，小女警在线破案，进来沾点福气！\n【满级大佬+推理破案+轻松爽】\n江洋大盗兼传奇雇佣兵宋千夏，竟穿越成了一名在市警局刑侦大队处处受气、胆小如鼠的实习小警花？！\n面对连环密室杀人案，警局上下愁云惨淡，犯罪心理学专家束手无策。\n宋千夏却打了个哈欠：“这案子很难吗？作案手法不就是先把冰块做成子弹，然后利用滑轮组在走廊制造不在场证明，最后顺着下水道溜走吗？”\n冷面刑侦队长震惊：“完美的逻辑！你是怎么推断出来的？”\n宋千夏心里一咯噔：啊？我没推啊，这不是我最爱用的操作吗……\n每破一个大案，队长和全网粉丝都对她顶礼膜拜。\n只有宋千夏自己躲在角落瑟瑟发抖：“救命，我只是把干过的事说了一遍而已啊！再这样下去真实身份要暴露了！”", "tags": ["女频悬疑", "悬疑", "推理", "破案", "大佬", "悬疑恋爱"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三七穿越盗墓世界", "fullTitle": "三七穿越盗墓世界", ge/7636680384754764862", "data": [3.07, 3.25, 3.35], "trend": 0.28, "latest": 3.4, "wordNumber": 192653, "creationStatus": 0, "desc": "二十年前，青城西水厂的秋天，三个人接连失踪，活不见人，死不见尸。警察齐晓军追了这条线索半辈子，却在即将触碰到真相的那一刻，被命运一脚踹出了局。年轻厂长张有斐曾深爱过一个叫金花的女人，却不知道她的沉默里藏着多少秘密。\n\n二十年后，又一个人在西水厂失踪。齐晓军拖着病体从县里赶回来，张有斐翻出了当年的笔记，已经独当一面的张华调出了最新的监控。两代人，隔着二十年的光阴，重新盯上了同一片水面。\n\n真相像清水河底的石头，被时间的暗流冲刷了太久。金花、张鹏飞、张莉——三个守口如瓶的女人，一只奶白色的黄金小象，一具在废弃木箱里被强碱溶解的白骨，还有那片年年春天开满婆婆丁的空地下面，埋着比尸骨更沉重的东西。当所有的珠子终于被一颗一颗串起来，齐晓军发现，他追了二十年的答案，比他想象的更冷，也更烫。\n\n有些真相，不是用来让人释怀的，是用来让人学会承受的。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：花儿爷和他的雇佣兵老婆", "fullTitle": "盗笔：花儿爷和他的雇佣兵老婆", "link": "https://fanqienovel.com/page/7645676531263491134", "data": [2.76, 2.83, 2.94], "trend": 0.18, "latest": 2.9, "wordNumber": 206083, "creationStatus": 1, "desc": "评分刚出，后续应该会涨\n又名——《我是你的狗，你是我的花》\n\n【宋知禾cp小花➕瓶邪➕黑瞎子cp原创女配】\n\n盗笔全员反穿 → 女主后期反穿盗笔世界\n\n雇佣兵宋知禾终于放假了，推开家门，是五个她意想不到的客人。\n书房密室藏着一屋子军火，书架上全套《盗笔》写满批注。\n五个人就这么从书里走出来。\n第一天，她的心声被所有人听见了。\n\n「老公——」\n「我要当你的狗——」\n\n社死之后，她决定躺平。\n反正，他听见了，他没跑。\n\n作者玻璃心警告——\n私设如山➕剧情有bug➕逻辑是什么能吃吗➕反正这样写很爽\n\n如果你能接受以上所有——\n请进。", "tags": ["女频悬疑", "悬疑", "穿越", "灵异", "同人", "悬疑恋爱"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：大哥，要成为我的信徒吗？", "fullTitle": "盗墓：大哥，要成为我的信徒吗？", "link": "https://fanqienovel.com/page/7469016608720030744", "data": [2.75, 2.86, 2.93], "trend": 0.18, "latest": 2.9, "wordNumber": 133031, "creationStatus": 1, "desc": "（吳二白女儿+原创cp+与主角团亲情友情向+自然力量+微团宠）\n为了稳定天地间的力量变化，维持生灵间的平衡，自然与天道达成共识，自然选择人类成为她的使者，履行维护这个世界的平衡，世代自然使者就这么履行着自己的职责。\n\n直到这代使者——天道进行了选择，祂察觉到了这个世界这一代的气运者命运轨迹发生了变化，有一股力量插手了他们原本的轨迹，于是一个和他们有密切联系的孩子被祂选中。\n\n她顺应天道出生，却被阴谋笼罩，一张大网将她一步步推向九门与汪家的局，眼睁睁的看着疼爱自己的哥哥一步步走向深渊，父亲越来越多的白发。\n\n吴盎然逗弄着指尖求抚摸的藤曼，你们是在挑衅恢复力量的自然使者吗？\n\n“哥，要不你拜拜我吧，你太邪门了。”\n“我要不给你上柱香？”吳邪咬牙切齿的发问。\n“你要成为我的信徒？也可以啊！” \n“等等，你们一块过来干嘛？我只要我哥一个信徒啊！”\n\n吳盎然表示：她哥真的不是一般人能保的，太邪门了。\n（拯救意难平，全都好好的。）", "tags": ["女频悬疑", "悬疑", "盗墓", "灵异", "悬疑恋爱"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：被反派养大的我成了万人迷", "fullTitle": "盗墓：被反派养大的我成了万人迷", "link": "https://fanqienovel.com/page/7650550461103082558", "data": [4.38, 4.4, 4.5], "trend": 0.13, "latest": 4.5, "wordNumber": 264501, "creationStatus": 1, "desc": "【恶女预备役+美艳笨蛋美人+微万人迷+全员暧昧向】\n巴乃深山里，养出了一株有毒的野玫瑰。\n山月长了一张稠艳秾丽的脸，行事却不择手段，毫无善恶观。\n【划重点：女主前期善恶不分（注：没有说后期就分的意思）】\n七岁那年，父母双亡。\n山月哭闹着上山，一头撞进了那个毁容怪物的怀里。\n塌肩膀最初收留她，只想把她当成最听话锋利的棋子。\n可养着养着，棋子没变聪明，他的控制欲倒先变质了。\n他用扭曲又深沉的爱，将她浇灌成快活耀眼的模样。\n直到某天，吴邪一行人来到了巴乃。\n───\n避雷：女主大美人，表面恶女切开带点笨。\nooc预警，私设如山，介意勿入。", "tags": ["女频悬疑", "悬疑", "灵异", "同人", "悬疑恋爱"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓之银铃砂", "fullTitle": "盗墓之银铃砂", "link": "https://fanqienovel.com/page/7662238551915908120", "data": [2.6, 2.61, 2.71], "trend": 0.11, "latest": 2.7, "wordNumber": 221714, "creationStatus": 1, "desc": "你听说过三十三非人界吗？\n你听说过母石吗？\n你听说过张家圣婴吗？\n以上三个词是怎么联系在一起的？\n因为这三个词就是我的来历啊！\n人人都知道在周穆王的锦盒中放着张家的圣婴，只是这个圣婴再取出来的那一刻就已经死掉了，然后就有了末代启灵那充满了悲情的一生。\n但没人知道的是，圣婴分阴阳，他们被放置在了不同的地方。\n更没人知道的是，第一个被打开所在的圣婴注定是死亡的那一个，它所有的能量，包括生命力都会在第一时间转移到另一个里面。\n这种联系是因为那母石粉末涂满的锦盒，也是因为我们本身是一对龙凤胎。\n我醒来的时候，我给自己起了一个名字，叫做银铃砂。\n银铃砂，音灵杀！\n多好的名字啊！", "tags": ["女频悬疑", "悬疑", "悬疑恋爱", "风水秘术", "盗墓", "灵异", "衍生"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [6.27, 6.99, 7.72], "trend": 1.46, "latest": 7.7, "wordNumber": 215885, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [7.26, 7.86, 8.63], "trend": 1.37, "latest": 8.6, "wordNumber": 223247, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全村逃荒流失所，我独深山囤粮肉", "fullTitle": "全村逃荒流失所，我独深山囤粮肉", "link": "https://fanqienovel.com/page/7659219704237542425", "data": [3.94, 4.18, 4.38], "trend": 0.44, "latest": 4.4, "wordNumber": 161927, "creationStatus": 1, "desc": "评分刚出，大家莫慌！！！\n\n【种田+系统+空间+囤粮+深山+基建】\n陆枕筠穿越了，刚穿来，就面临全村逃难，她被丢下的命运。\n外人以为，一个十四岁的小姑娘：生活困苦，举步维艰。\n实际上的陆枕筠，堪称捡漏之王：\n粮食，捡捡捡！\n银钱，捡捡捡！\n保暖衣物，捡捡捡！\n山中宁谥，岁月静好。\n陆枕筠一边种田，一边捡漏，顺手打造了一个世外桃源。\n叮！恭喜宿主，安全领地扩展五百米，一千米，两千米，五千米……\n多年后，众人诧异。\n当初那个瘦不拉几，面黄肌瘦的小女娃呢？\n不好意思，请叫我：陆女王！\n（本文有男主，但出场比较晚，大体还是以女主深山基建为主。有空间和系统，但都以辅助为主。）", "tags": ["种田", "古代言情", "乡村", "系统", "穿越", "基建"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.68, 3.86, 4.1], "trend": 0.41, "latest": 4.1, "wordNumber": 264697, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [2.09, 2.08, 2.41], "trend": 0.32, "latest": 2.4, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身怀武力和空间，独自逃荒杀疯了", "fullTitle": "身怀武力和空间，独自逃荒杀疯了", "link": "https://fanqienovel.com/page/7649608466180361240", "data": [2.13, 2.21, 2.23], "trend": 0.1, "latest": 2.2, "wordNumber": 278401, "creationStatus": 1, "desc": "（无cp+心狠手辣+不圣母+有仇必报+天灾）\n　　灾荒年，苏小丫的家人为了一小袋粮把她卖给了老光棍儿，不愿屈服的她一头撞柱惨死。\n　　死于末世大爆炸的苏默就穿来了。\n　　只是处境不太妙：干旱缺水，敌国入侵，全村都逃了。\n　　为了活命，她逃上山，独自踏上南下逃荒之路。\n　　途中遇到了原主的家人。\n　　原主娘：“哪怕是给你吃屎长大的，那也是我这个做娘的一把屎一把尿的功劳。”\n　　吃屎是吧，那让你吃个够，这就是我对你天大的恩情了！\n　　恶毒爷奶，吸血的爹和弟还想再次把她卖了。\n　　那不能够！全家归西套餐立马安排上！\n　　逃荒路漫漫，灾祸不断，她只能咬牙朝前走，始终坚信不放弃，就有生的希望……", "tags": ["种田", "古代言情", "空间", "无CP", "逃荒", "天灾"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [8.43, 8.28, 8.51], "trend": 0.08, "latest": 8.5, "wordNumber": 249188, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女一睁眼，残疾太子冷脸剥玉米", "fullTitle": "恶女一睁眼，残疾太子冷脸剥玉米", "link": "https://fanqienovel.com/page/7637807750260460568", "data": [3.29, 3.34, 3.32], "trend": 0.03, "latest": 3.3, "wordNumber": 175992, "creationStatus": 0, "desc": "【病秧子纯情废太子VS搞怪抽象大力女医生】+【种田无宫斗】+【虐渣】+【搞笑轻松】+【空间】+【双洁】\n医学大佬苏青梨，穿成古代农村小恶女，开局就身处山贼窝。\n\n好不容易逃回家，发现家里更惨，家里欠债，大嫂难产，一家人快活不下去了。\n\n不过问题不大，她穿越把空间实验室给带过来了。\n\n她撸起袖子，虐渣男，搞钱，还债，赎地，把绝望的一家人从泥潭里捞了出来。\n\n只是，她顺手救的那双腿瘫痪的病秧子怎么回事？饭不吃，药不喝，整日摆着一副“活着没意思”的死人脸。\n\n苏青梨表示：多半是闲的！\n\n啪地一下，直接将一大筐玉米砸在他面前。\n\n“腿废了，手不是还能动吗？干活！”\n\n病秧子：“？？？”\n\n干吧。\n\n不就一点农家活，能比读书练武累？\n\n结果——\n\n他剥完玉米剥花生，剥完花生刮木薯，刮完木薯煮猪食。\n\n好不容易腿能站起来了，又被拉着下田插秧，赶牛放羊。\n\n萧时衍沉默了。\n\n好消息：她没把自己当残疾人。\n\n坏消息：也没把自己当人。\n\n后来的苏青梨才知道，这个被她使唤许久的病秧子美人，是曾经位高权重的太子。\n\n你说这事整的，也没人跟她说啊。\n\n村里人都说，就是有十条命，也不敢娶这恶丫头。\n\n可后来，一个清隽如玉的公子带着十里红妆来敲她门，\n\n“阿梨，我来求赘了，你可愿娶我？”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "医术"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [6.65, 6.57, 6.68], "trend": 0.02, "latest": 6.7, "wordNumber": 204324, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColo derWidth": 2}, {"label": "让我做妾？八千禁卫迎我回宫", "fullTitle": "让我做妾？八千禁卫迎我回宫", "link": "https://fanqienovel.com/page/7654988013595790361", "data": [6.47, 6.96, 7.95], "trend": 1.48, "latest": 7.9, "wordNumber": 193178, "creationStatus": 1, "desc": "因一道赐婚圣旨，谢昭颜带着万贯家财抵达京城，履行跟镇北侯的婚约，大婚之日却被侯府堵在大门外。　　\n　　侯府摆出阵仗，试图给她下马威：“你一个小小的商贾之女，根本没资格做侯府当家主母，若识趣点愿意自贬为妾，老夫人看在你谢家嫁妆丰厚的份上，勉强可以让你做个贵妾。”\n　　刚从战场归来的镇北侯眉眼冷漠：“我们身份差距太大，给你一个贵妾身份已是抬举，你别不识好歹。阿缨是我从边关带回来的救命恩人，她才有资格做我的正妻。”\n　　老夫人居高临下：“你的嫁妆从此归侯府支配，你出身卑贱，当务之急是先学好京城的礼节，别给侯府丢人。”\n　　谢昭颜听罢，冷冷一笑。\n做妾？真是天凉了，侯府满门该诛了。\n　　“阿梅，贺老夫人三年来陆续从谢家医馆赊欠名贵补品，共计现银九千三百两，今日结算。”\n　　“阿兰，三年前镇北侯从谢家借出十一万两白银，拿出账单，让镇北侯还钱。”\n　　“阿竹，镇北侯带回京城的阿缨是敌国细作，亮出罪证，请镇北侯给宾客们一个解释。”\n　　“阿菊，送我的手书进宫，请皇上下旨，取消我和镇北侯的婚约，然后派禁卫接我回宫。”\n话音落地，满场死寂。\n镇北侯母子脸色惨白，在风中摇摇欲坠。", "tags": ["宫斗宅斗", "古代言情", "虐渣", "打脸", "古色古香"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "哀家不想听", "fullTitle": "哀家不想听", "link": "https://fanqienovel.com/page/7580374951530597401", "data": [5.93, 6.03, 6.17], "trend": 0.24, "latest": 6.2, "wordNumber": 197219, "creationStatus": 0, "desc": "年轻太后x掌权太监\n    -    \n\n\n\n       \n    社畜穿成太后，虞栖见想提前退休。\n\n    谁劝她垂帘听政，她就哭到谁怀疑人生。\n\n    不料那个一脸阴冷却又长相很萌大太监处处看她不顺眼，非要把她架到工位当牛马。\n\n    行，我上辈子就是卷死的，还怕卷不死你们？\n\n    -\n    \n    朝臣们近来工作效率很高，因为太后娘娘有三大名言：\n\n    “晨会控制在三刻钟内，请大家抓紧时间。”\n\n    “各位，吵架计入无效会议时长，影响年终考评。”\n\n    以及：“哀家不想听！”\n\n\n\n\n-\n排雷：真太监，半切（不行），感情线为主！！感情为主！！轻松向短篇he\n-\n架得很空，he，宦官体系部分借鉴明朝司礼监。", "tags": ["宫斗宅斗", "古代言情", "萌宝", "穿越", "HE", "养崽"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "奉旨成婚后，糙汉将军日日洗床单", "fullTitle": "奉旨成婚后，糙汉将军日日洗床单", "link": "https://fanqienovel.com/page/7646055321944722494", "data": [9.3, 9.27, 9.49], "trend": 0.19, "latest": 9.5, "wordNumber": 154530, "creationStatus": 1, "desc": "娇美贵女x糙汉将军\n【一见钟情+先婚后爱+体型差+双洁he+非女强】\n沈策这辈子，最头痛的就是读书，更头疼的就是应付读书人。\n所以当一道圣旨为他和长安才女赐婚时，沈策觉得天都塌了。\n他最烦这种娇滴滴、文绉绉、说话九曲十八弯的贵女了！\n沈策决定尽早和那贵女说清楚，往后井水不犯河水，谁也别打扰谁。\n然后，他第一次见到了虞菀。\n“我○……”\n--\n虞菀也觉得自己倒霉极了。\n她自幼习诗书学礼乐，就是要成亲，也该和能懂她的知心人成亲；来日琴瑟和鸣，方为一段佳话。\n谁知命运弄人，却要教她嫁与一个不通文墨的草莽将军。\n此人不通文墨也罢，竟还不知礼数，初次见面还敢同她拿乔，竟来迟了！\n门开时，虞菀怒气冲冲地瞪了过去。\n--\n成亲前，虞菀讨厌沈策。\n成亲后，虞菀依旧讨厌沈策。\n入夜，虞菀揉着自己酸软的腰，拿足尖抵住试图凑上来的糙汉，没好气道：\n“你歇一天，成不成？”\n沈策捉住她皙白脚踝，嘿嘿一笑：\n“不成。”", "tags": ["宫斗宅斗", "古代言情", "将军", "一见钟情", "双洁", "HE", "天作之合"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "觊觎臣妻：清冷权臣不装了", "fullTitle": "觊觎臣妻：清冷权臣不装了", "link": "https://fanqienovel.com/page/7650103887151500350", "data": [5.35, 5.37, 5.52], "trend": 0.17, "latest": 5.5, "wordNumber": 281794, "creationStatus": 1, "desc": "（刚开分，后期会涨）\n【强取豪夺＋臣妻＋高岭之花下神坛＋步步为营】\n大靖朝权倾朝野的大司马裴修晏，世人皆道他清冷自持，如悲悯众生的神佛。\n温眠棠也深以为然。\n她本是七品御史沈子煜的娇妻，只想在夫君的羽翼下安稳度日。\n沈子煜以为自己遇到了青天大老爷。\n权倾朝野的大司马裴修晏赏识他，提拔他，甚至连他递上去的折子都亲自圈阅夸赞。\n他发誓要结草衔环，报答侯爷的知遇之恩。\n直到某日，他身陷重案，即将面临满门抄斩的死局。\n走投无路之下，温眠棠只能在那个大雨滂沱的深夜，跪在权倾朝野的大司马府前求情。\n书房门开，那尊玉雕般的圣人缓步而出，温眠棠衣衫尽湿，跪倒在那个清冷端方的男人脚边。\n男人用微凉的指腹勾起她的下巴。\n“求我？”男人的声音温醇如酿，眼底却翻涌着她看不懂的疯狂，“夫人打算拿什么来换沈大人的命？”\n温眠棠这才知道，夫君的死局，不过是这位圣人为了引她入笼，亲手布下的一场天罗地网。", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "年代", "score": 7, "reasons": ["3日增长+55.9万", "竞争系数低(2.8)", "腰部稳(均腰比1.17)"], "total19": 267.8, "growth": 26.4, "abs_growth": 55.9, "coeff": 2.8, "count10w": 8, "mean": 8.9, "mid19": 7.6, "mm_ratio": 1.17, "ndays": 3}, {"cat": "科幻末世", "score": 7, "reasons": ["3日增长+13.3万", "竞争系数低(4.6)", "腰部稳(均腰比1.31)"], "total19": 148.4, "growth": 9.8, "abs_growth": 13.3, "coeff": 4.6, "count10w": 2, "mean": 4.9, "mid19": 3.8, "mm_ratio": 1.31, "ndays": 3}, {"cat": "职场婚恋", "score": 7, "reasons": ["3日增长+14.1万", "竞争系数低(4.4)", "腰部稳(均腰比1.4)"], "total19": 173.6, "growth": 8.8, "abs_growth": 14.1, "coeff": 4.4, "count10w": 3, "mean": 5.8, "mid19": 4.1, "mm_ratio": 1.4, "ndays": 3}, {"cat": "玄幻言情", "score": 6, "reasons": ["3日增长+6.3万", "竞争系数低(3.5)", "腰部稳(均腰比1.11)"]
