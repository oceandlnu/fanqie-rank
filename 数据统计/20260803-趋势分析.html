, "末世", "囤物资", "天灾"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [5.14, 5.29, 5.68], "trend": 0.55, "latest": 5.7, "wordNumber": 236700, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书末世后，我拥有了冰箱空间", "fullTitle": "穿书末世后，我拥有了冰箱空间", "link": "https://fanqienovel.com/page/7649958321499163672", "data": [2.98, 2.98, 3.2], "trend": 0.22, "latest": 3.2, "wordNumber": 245277, "creationStatus": 1, "desc": "【穿书+末世+系统+空间+囤货+异能+有cp！】\n——如果你一觉醒来发现自己穿书了，还是穿的一本无脑末世文后，你会怎么办？\n——正一觉醒来发现自己成为了这个天谴之子的时语表示：还能怎么办，摆烂呗。\n——可若是穿书后发现绑定了一个末世炮灰觉醒系统，系统还附赠了一个冰箱空间金手指呢？\n——时语再次表示：呵呵，爱谁谁，将摆烂进行到底。\n——那如果系统带着你去截胡书中男女主的机缘，一旦截胡成功就能获得各种奖励，甚至还能开启系统商城，并在成功搞废男女主又安全活到末世结束后还有机会重回自己的原世界去呢？\n将摆烂进行到底的时语垂死病中惊坐起：那还等啥呢，这一票我干了。", "tags": ["科幻末世", "穿书", "末世", "系统"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日倒计时，我盯上了男友宿舍", "fullTitle": "末日倒计时，我盯上了男友宿舍", "link": "https://fanqienovel.com/page/7647018339197275161", "data": [6.04, 6.04, 6.18], "trend": 0.14, "latest": 6.2, "wordNumber": 280461, "creationStatus": 1, "desc": "【系统+空间+多男主全洁+超多雄竞修罗场+末世囤货爽文】\n末世来临前夕，宥笙带着系统和两袋物资，敲开了男友宿舍的门。\n【末世好感系统已激活。检测到5名顶级生存天赋者，请宿主尽快获取好感度，兑换异能。】\n一个假男友，一个假男友好哥们，一个冰山脸，一个笑面虎……\n她目标明确——薅他们的好感度，换道具、兑物资，在末世活下去。\n她盯上了他全寝的能力。但她不知道的是，全寝早就盯上了她。", "tags": ["科幻末世", "系统", "幻想言情", "空间", "末世", "囤物资"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成末日阴湿病娇反派的恶毒前妻", "fullTitle": "穿成末日阴湿病娇反派的恶毒前妻", "link": "https://fanqienovel.com/page/7622641521677847577", "data": [7.06, 7.06, 7.16], "trend": 0.1, "latest": 7.2, "wordNumber": 178059, "creationStatus": 1, "desc": "【穿书末日|偏执救赎|浪漫怪诞|双洁甜宠】\n\n【温柔社恐妹宝❌阴湿男鬼反派】\n\n-\n\n熬夜写论文晕倒后，唐瑶再次睁眼，发现自己竟穿成了一本诡异复苏文反派的恶毒前妻。\n\n作为书里活不过三章的炮灰女配，她嫌贫爱富，蠢笨刻薄，在反派还是高岭之花的时候费尽心机算计勾搭才和他结婚，却在反派公司破产后瞬间变了一个人，整日不满现状对反派言语侮辱，不准他休息，每夜拿鞭子抽他发泄。\n\n甚至在偷偷赌博欠下巨额债务后一走了之，留下反派一个人被追债者用刀砍下一条腿。\n\n反派没钱去医院，躲在出租屋伤口感染惨死。\n\n由于怨气太深复活变成杀人不眨眼的诡异，第一个复仇对象便是他恨之入骨的恶毒前妻！\n\n-\n\n穿书后，为了活命，唐瑶打算和反派好好过日子，却发现自己穿进来的时间线已经晚了。\n\n现在情况是——\n\n原主已经把反派小可怜压榨折磨的不成人形，还欠下高利债扛着行李箱打算连夜跑路。\n\n唐瑶被吓得头皮发麻。\n\n当即买了同一程车票，拉上刚在工地搬砖回家还不忘给她买新鲜草莓的反派少年一起跑路。\n\n反派被执笔者发现陷入原著剧情，唐瑶对他不离不弃，甚至为了给他找药差点被诡异杀掉。\n\n后来，书里杀人不眨眼的反派被她养成了漂亮绿茶的小白脸，整日吃饱后便扯着她的衣袖：\n\n“瑶瑶，你最爱的人是谁？”", "tags": ["科幻末世", "末世", "异世穿越", "系统", "穿书", "病娇", "甜宠", "反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古风世情": [{"label": "重生贞观：再续前尘解旧梦", "fullTitle": "重生贞观：再续前尘解旧梦", "link": "https://fanqienovel.com/page/7646423256160816152", "data": [13.14, 13.14, 15.28], "trend": 2.14, "latest": 15.3, "wordNumber": 268512, "creationStatus": 1, "desc": "（李承乾➕父子相爱相杀➕弥补历史遗憾➕慢热非爽文，不喜慎入！评分刚出！会涨的！先虐后甜，主父子情）\n\n李承乾死后阴魂不散，魂魄竟重回贞观七年。\n面对从小就偏心的李世民，他直接开启逆子模式，每天有事没事就跑到李世民面前给他添堵气他。\n“阿耶何须这般惺惺作态跑来孩儿这边，青雀在魏王府！”\n“臣这就去引戮自尽，给陛下心爱的爱子腾位置！反正陛下早就想废了我这个太子了吧！”\n李世民发现他的长子在某一天性情大变，连阿耶都不肯喊了。还喜欢天天跑他面前气他！\n“承乾！”\n随着跑去气李世民的次数越来越多，李承乾渐渐发现事情不对劲起来，这不对啊？李世民难道不该是越来越喜欢李泰的吗？\n怎么……李世民还天天跑他面前来刷存在感？", "tags": ["古风世情", "古代言情", "重生", "前世今生", "古色古香", "古言权谋"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒女背叛傻子老好人夫君后", "fullTitle": "恶毒女背叛傻子老好人夫君后", "link": "https://fanqienovel.com/page/7656816986424364094", "data": [2.6, 2.6, 3.27], "trend": 0.68, "latest": 3.3, "wordNumber": 184591, "creationStatus": 1, "desc": "前世，楼姬月被傻子靳渡秋从人牙子手里救下。\n谁知这傻子认了死理，偏执地非要她做娘子、给他生孩子。\n楼姬月不仅不懂感恩，还嫌贫爱富。\n她仗着傻子爱她，天天在家里作威作福，让傻子起早贪黑去挣钱，自己却娇养得十指不沾阳春水。\n那傻子白天百依百顺，夜里却发疯，红着眼占有她。\n为了上京去寻那礼部侍郎嫡子魏存言，她卷走了傻子的家当逃之夭夭。\n可哪怕被骗，傻子依然护着她，最后因一场误会喝下毒酒。\n死前他满口鲜血，还笨拙地替她擦泪：“月儿别哭，我不痛的……”\n重生后，楼姬月打算和傻子好好过日子，谁知傻子也重生了。\n告诉她要去和其他女人提亲，楼姬月气得眼前发黑。\n靳渡秋被凶得缩了缩脖子，委屈得直掉泪：“你、你又不喜欢我，我不要你了……”\n*\n1.坏坏的娇蛮跋扈的女主vs卑微傻子男主\n2.有前世内容，暴虐男主，女主虽然不完美（性格真有点坏）但是很有魅力➕重生后才追夫，重生后女主性格还是娇蛮跋扈\n3.男主真实身份是世子，不是穷人\n（双洁➕古风世情➕虐恋情深➕古代言情➕忠犬➕作精➕追夫➕双重生）", "tags": ["古风世情", "古代言情", "虐恋情深", "作精", "双重生", "忠犬", "追夫", "古言权谋"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "侍妾生存手册", "fullTitle": "侍妾生存手册", "link": "https://fanqienovel.com/page/7646430990331546686", "data": [4.02, 4.25, 4.48], "trend": 0.45, "latest": 4.5, "wordNumber": 286093, "creationStatus": 1, "desc": "评分才出\n【无金手指＋无系统+慢节奏＋宅斗宫斗＋后期独宠+养娃日常】\n\n景王赵时雍一向自傲自己知礼守礼，公平公正。\n即便朝中议论自己太过苛责，也不以为意。\n结果一朝栽倒在一个侍妾身上。\n在他还没有意识到的时候，就已经处处偏袒维护她。\n林阮的屋子小？\n换成大的！\n林阮的东西少？\n给，\n多多的给！\n林阮心惊胆战，自己只想躺平当个咸鱼，王爷这是要干嘛？\n因着这份宠爱，\n府里正妃视她眼中钉，日日想要扳倒她，\n一众名门出身的庶妃更是恨她入骨，\n明枪暗箭不曾停歇。\n林阮日日活得提心吊胆，她所求从来不多，只求安分度日，平安生下孩儿，往后伴着儿女安稳养老，半点不愿卷入后宅纷争。\n奈何一身滔天盛宠，反倒将她推至风口浪尖。\n“在我心底，你才是我心中唯一认定的妻。”\n赵时雍低头，温柔吻过她颤抖微凉的唇角，将瑟瑟发抖的人牢牢锁在怀中，似要隔绝外界所有风雨。\n低沉温柔的嗓音落在她耳畔，字字皆是滚烫真心：\n“不必设防，不必躲闪，世间所有风波有我替你挡下。”\n”你只需安安心心，永永远远留在我身边。“", "tags": ["古风世情", "独宠", "古代言情", "双向奔赴", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "咸鱼拒婚，冷面女将军杀上门了！", "fullTitle": "咸鱼拒婚，冷面女将军杀上门了！", "link": "https://fanqienovel.com/page/7655324229419666494", "data": [3.33, 3.33, 3.65], "trend": 0.32, "latest": 3.7, "wordNumber": 245928, "creationStatus": 1, "desc": "【男主视角×古言×乐子人咸鱼×女强护短×爆笑互宠】 晏岁安上辈子卷生卷死猝死在工位上，一朝穿成京城出了名的纨绔废柴。 本以为能安心当个遛鸟斗鸡的咸鱼，谁知皇帝一纸赐婚，竟将他指给了手握重兵、杀人如麻的镇国女将军楚惊霜！ 全京城都在等着看晏岁安被女魔头活劈了的笑话。 晏岁安连夜收拾包袱准备跑路，大门一推，一身银甲、煞气凛然的楚惊霜提着长枪堵在门口。 晏岁安双腿一软：“将军饶命，我保证不抢您家产！” 楚惊霜却一把将他捞进怀里，眼底满是偏执与温柔：“岁安，你若敢跑，本将就打断你的腿，把你绑在将军府。” 后来，满朝文武震惊地发现，那个威风凛凛的女战神，竟被一个手无缚鸡之力的纨绔拿捏得死死的。 晏岁安：谢邀，人在古代，软饭真香。", "tags": ["古风世情", "古代言情", "女强", "将军", "搞笑轻松", "古言权谋"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女扮男装上朝后，死对头暗恋成疾", "fullTitle": "女扮男装上朝后，死对头暗恋成疾", "link": "https://fanqienovel.com/page/7651286824677035033", "data": [4.63, 4.63, 4.9], "trend": 0.27, "latest": 4.9, "wordNumber": 151763, "creationStatus": 1, "desc": "【女扮男装】【宿敌就是妻子】【对抗路情侣】【双洁1v1】\n前期，桀骜不驯招摇女vs表里不一腹黑男。\n后期，狂拽酷毙帅女帝vs只忠君不一定爱国的绝世大奸臣。\n沈峤觉得她和苏砚简直是天造地设的一对。\n最纯恨的那年，他算计她下狱，让她差点丢官丢命。\n她三年谋划，让他落败，满门抄斩。\n可最后，鹬蚌相争，渔翁得利。\n两人一同死在了牢里。\n死前，这家伙被毒傻了。\n和她说，他心悦她。\n这毒这么烈的吗，给人都毒成啥样了。\n他是不是临死前也要恶心我一把？\n让我死也不安生？\n再睁眼，沈峤又活了，还重回了初见时。\n19岁的苏砚冷冰冰的看着她。\n沈峤：呵，小屁孩，这辈子你可斗不过我。\n可渐渐她发现…\n不对啊…苏砚他不对劲啊！\n重重误会解开，沈峤懵了。\n你真暗恋我啊，我以为你纯挑衅我呢！\n苏砚咬牙切齿，我有病才一直挑衅你！\n直到沈峤身份暴露，苏砚愣愣的看着眼前人。\n他都做好断袖的准备了，你告诉我你是…\n沈峤踩上他的胸口：怎么？苏大人想变卦？\n还觉得我粗鄙难登大雅之堂？\n苏砚握着她的脚踝：殿下金枝玉叶，何来粗鄙一说。\n沈峤窃笑：苏大人向来两幅面孔。", "tags": ["古风世情", "古代言情", "古言权谋", "科举", "女扮男装", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "病娇前男友篡位登基了", "fullTitle": "病娇前男友篡位登基了", "link": "https://fanqienovel.com/page/7650044982144814105", "data": [2.86, 2.86, 3.1], "trend": 0.24, "latest": 3.1, "wordNumber": 165258, "creationStatus": 1, "desc": "【阴湿偏执恋爱脑帝王VS 美貌清醒的大美人，很会训狗】\n【破镜重圆+微强制+上位者破防+救赎+自己哄自己】\n秦文珠没有等来前男友谋反失败的消息，而是他篡位成功称帝。\n父亲从一品国公被贬为了九品县令，一个大家族开始分崩离析。\n偏偏只有她的县主封号还保留着。\n所有人都猜测新帝是在故意羞辱秦家嫡女，没理由唯独放过她一人。\n秦文珠也是这样认为的，毕竟她的确出卖了他。\n周廷玉从小睚眦必报、嘴毒又乖戾，不会看在两人曾热恋过的份上就轻易饶了她。\n她怕这人发疯，也怕被他报复，更怕他察觉---\n她还爱他。\n...\n元宵夜宴，秦文珠故意喝下一杯烈酒。\n看着步步逼近的男人，女孩睁大双眸，泪流满面地看着他，颇是委屈。\n然而下一刻，只见帝王当着众人的面，将醉醺醺的姑娘温柔地搂进怀里，亲手喂解酒汤。\n身量高大的男人收敛一身狠厉强势，在心爱的人面前俯首低语：\n“秦文珠，只要你说一句你爱我，以后你骑我头上都成…小祖宗，别折磨我了行吗？”", "tags": ["古风世情", "古代言情", "嫡女", "病娇", "破镜重圆", "古言权谋"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "误却花期又逢君", "fullTitle": "误却花期又逢君", "link": "https://fanqienovel.com/page/7638184710425824280", "data": [2.82, 2.82, 3.0], "trend": 0.19, "latest": 3.0, "wordNumber": 100873, "creationStatus": 0, "desc": "一纸十年婚约，曾拴住翰林院学士嫡女与镇国大将军之子。\n她温婉通医理，他年少负壮志，本是天作良缘，却因世事风波，硬生生一纸退婚，情分两断。\n \n岁月流转，他成镇守一方的节度使，铁血冷面，权柄在握；她怀一身医术，游历山河。\n \n本以为山水不相逢，命运却再度将两人牵绊。前尘误会渐次揭开，年少情愫从未消散。\n花期虽误，故人仍归，兜兜转转，终究还是他与她，再续前缘。", "tags": ["古风世情", "古代言情", "嫡女", "医术", "破镜重圆", "古言权谋"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "他囚我于掌心", "fullTitle": "他囚我于掌心", "link": "https://fanqienovel.com/page/7628795145080540185", "data": [1.84, 1.84, 1.97], "trend": 0.13, "latest": 2.0, "wordNumber": 284637, "creationStatus": 1, "desc": "沈蘅十四岁那年，宫宴上一道圣旨，将她姐姐赐婚给了权倾朝野的顾世子。她替他高兴，觉得那人真好看，芝兰玉树，像天外仙。可她不知道——从一开始，他要的就是她。\n宫变之夜，姐姐被设计入宫。\n家族逼迫，沈蘅替嫁进了顾府。\n洞房花烛，那杯合卺酒被换成了暖情酒，她一边恨他入骨，一边在他身下不受控制地弓起腰身。他吻去她眼角的泪，在她耳边低语：“你只能是我的。”\n她心中另有白月光，却被家族绑缚、被丈夫囚于掌心。她用尽手段想逃，却逃不出他用温柔和欲望织成的那张网。\n他说：“我要你的心。”\n她说：“早就丢了。”\n他把她按在书案上：“那就找回来。”\n他教她画册上的事，逼她全身心臣服。\n她在恨意与羞耻中一点点沉沦，直到发现——这个强取豪夺的男人，早已把她嵌进了自己的命里。\n他囚她，也护她。他用半生权谋，换她一世心甘情愿。\n强取豪夺｜先婚后爱｜追妻火葬场｜她恨他入骨，却在每个失控的夜里为他盛开。", "tags": ["古风世情", "古代言情", "追妻火葬场", "古言权谋"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我都中状元了，你说我是公主？", "fullTitle": "我都中状元了，你说我是公主？", "link": "https://fanqienovel.com/page/7657451774994828312", "data": [7.27, 7.27, 7.39], "trend": 0.13, "latest": 7.4, "wordNumber": 147279, "creationStatus": 1, "desc": "【分刚出，后面会涨～】\n【大女主，无CP，女帝】\n穿成了古代富商家的千金，云昭本来觉得一辈子吃穿不愁还有人照顾也不错，\n却陡然得知这大宁朝单身居然犯法！\n凡大宁百姓，女子年满十六，男子年满十九未婚嫁者，每年罚银二两。\n女子年满二十，男子年满二十二未婚嫁者，由官府强制婚配！\n不想嫁人？除非她去考科举。\n云昭：“……”\n虽然上辈子一路卷到了博士，这辈子她是真不想再读一次书了，\n但上学再苦，还能苦得过十几岁就被迫嫁人？\n不就是科举吗？\n带上小伙伴们一起考！\n大宁立朝百年，因某些历史缘故，从未明令禁止女子参加科举，\n但因为各种现实因素，此前也的确从未有女子在科举一道取得过什么耀眼的成绩。\n直到那一年，云昭得圣上钦点，\n一身状元服打马长安惊天下。\n——\n多年前，大宁国师曾预言，皇六女云昭命格极贵，\n唯有送出宫隐藏身份养至二十方可接回。\n但永安帝没想到的是，云昭还没等到二十，就先自己考回长安了，\n此后更是一发不可收拾，一步一步，开创了一个全新的盛世。", "tags": ["古风世情", "古代言情", "公主", "无CP", "科举", "古言权谋"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "病娇魔教教主的掌心宠", "fullTitle": "病娇魔教教主的掌心宠", "link": "https://fanqienovel.com/page/7629592542245309464", "data": [1.5, 1.56, 1.6], "trend": 0.1, "latest": 1.6, "wordNumber": 218820, "creationStatus": 1, "desc": "「双洁+架空古言+养成系+青梅竹马+甜宠+1v1+四岁年龄差+微武侠」\n她认他是主，其实他才是奴\n【纯爱病娇】\n世人皆知，魔教教主花无暇是从尸山血海里爬出来的修罗。\n他凉薄冷性，狠辣残忍，杀伐果断，算无遗策。\n直到她甘愿，以身饲魔。\n魔却愿为她，做她的神仙哥哥。\n她自幼在魔窟长大，所学所知都是他教的。\n他教她读书写字、武功骑射，却唯独不教她礼仪廉耻。\n她不知男女之别，于是毫无顾忌亲近他。\n他本可以把她养成玩物，关在身边，让她眼里只有他。\n可他舍不得。\n他居然还是个纯爱病娇。\n等了十年，等她长大，她眼里心里全是他，却对男女之情一窍不通。\n他步步引诱，而她每一次靠近，越发失控的，只有他自己。\n原来，被养成、被驯服、被心甘情愿困住的人，从始至终，都是他自己。\n【阅读指南】\n1. 从9岁x5岁开始写，篇幅不长。\n2. 女主性格：天真烂漫，不谙世事，勾人不自知，骨子里有些侠气。\n3. 男主性格：对外凉薄暴戾，正道眼中的“魔头”。\n对内是生怕被丢下的粘人精。极致的温柔与克制。占有欲极强，却怕吓到她，把所有情欲和渴望都压在清冷的外表下。\n5.无穿越，无重生，无金手指", "tags": ["古风世情", "古代言情", "武侠", "病娇", "古灵精怪", "养成", "相互救赎"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "残雪烙", "fullTitle": "残雪烙", "link": "https://fanqienovel.com/page/7639311327311170622", "data": [1.23, 1.25, 1.29], "trend": 0.06, "latest": 1.3, "wordNumber": 102199, "creationStatus": 0, "desc": "当拄着拐杖的新娘发现，当年打断她腿的恶棍，正是那个说要护她一生的枕边人。在得知真相后，从绝望到觉醒，最终完成复仇与自我救赎的虐恋权谋过程，说不完，往后看……", "tags": ["古风世情", "古代言情", "医术", "虐恋情深", "将军", "古言权谋"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "父皇别凶，儿臣知错了", "fullTitle": "父皇别凶，儿臣知错了", "link": "https://fanqienovel.com/page/7652610574102055961", "data": [1.67, 1.67, 1.7], "trend": 0.03, "latest": 1.7, "wordNumber": 248530, "creationStatus": 1, "desc": "（刚开评分较低～后续会慢慢高起来，放心食用）\n【父子亲情+古风权谋+储君养成+虐身虐心火葬场】\n他饮下母后给的毒酒，当大齐最锋利的利刃。\n他被一寸寸折断傲骨，成帝国最忠诚的孤臣。\n他以为，只要隐忍听话，总能换得父皇一丝垂怜偏爱。\n可一步步退让，只换来不断的猜忌与惩罚。\n满腔赤诚，落得被囚禁折磨，狠心抛弃的结局。\n心死之后，他抛下江山责任，决意归隐江湖。\n可昔日冷漠绝情的父皇却千里追来，在他面前崩溃落泪。\n“夜儿，跟父皇回家！”\n【先虐儿子后虐爹，追子火葬场~】", "tags": ["古风世情", "古代言情", "虐文", "强强", "虐恋情深", "将军", "古言权谋"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [6.05, 6.05, 7.1], "trend": 1.05, "latest": 7.1, "wordNumber": 136021, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [8.21, 8.21, 8.59], "trend": 0.38, "latest": 8.6, "wordNumber": 205342, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [4.97, 4.97, 5.24], "trend": 0.26, "latest": 5.2, "wordNumber": 271747, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局逃荒农家长姐有空间", "fullTitle": "开局逃荒农家长姐有空间", "link": "https://fanqienovel.com/page/7655709030232362008", "data": [2.68, 2.68, 2.89], "trend": 0.21, "latest": 2.9, "wordNumber": 163516, "creationStatus": 1, "desc": "【古代言情＋种田＋逃荒＋基建＋女主成长＋年下养成】\n【年下娇羞小将军vs全能型末世大佬】\n末世挣扎求生五年，最后还是死在了丧尸手里，苏清禾本以为要重新投胎了，却不想一睁眼穿成了古代的农家长姐，刚穿来就是天崩开局，斗极品亲戚，爹娘还都死了，却留下两个妹妹，和一个几个月大的弟弟给她抚养，\n她都还没来得及适应新身份，就拖家带口踏上了逃荒路，\n没有家人帮衬没关系，没有她有灵泉空间，还有一身的本领，足够她带着弟妹在这乱世中生存下去，\n只是原本收养的小萝卜头不知道什么时间就悄悄长大了，她教他习武，教他杀人，在他被强制征兵后成为他坚实的后盾，看着他从青涩稚童到意气风发的少年将军，苏清禾满是吾家有弟初长成的成就感，本以为是相依为命的姐弟情，却不想随着她身边的追求者越来越多，他的占有欲也愈发浓烈，\n萧衡哪里知道某人对他也是觊觎已久，只是眼睁睁看着他一步步踏入自己早已编织好的牢笼，", "tags": ["种田", "古代言情", "乡村", "逃荒", "基建", "年下"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [6.09, 6.07, 6.21], "trend": 0.12, "latest": 6.2, "wordNumber": 186712, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女替嫁废夫后，赶海暴富炸渔村", "fullTitle": "恶女替嫁废夫后，赶海暴富炸渔村", "link": "https://fanqienovel.com/page/7647076991916592190", "data": [2.3, 2.3, 2.4], "trend": 0.1, "latest": 2.4, "wordNumber": 293719, "creationStatus": 1, "desc": "【恶女+替嫁++大力+美食+空间+甜宠+赶海+发家致富+虐渣】沈鸢穿成了被继母按着脑袋往墙上撞的恶毒村姑，全家逼她替姐嫁给瘸腿渔夫。\n她笑了：嫁！但断亲书和嫁妆一样不能少。\n临走上演空城计，把沈家偷得只剩四面墙。\n新婚第一天，全村恶霸来闹事，她一拳把人打飞两米远，全村震惊。\n第二天就要分家，公婆：没钱没房你分个寂寞？\n沈鸢拎起竹篓走向海边：你们不懂，这片海能生金。\n蛤蜊、海螺、八爪鱼……别人眼里的破烂，她手里的宝贝。沙虫、海参、鲍鱼……她闭着眼都知道哪儿有。\n全村人都在等着看笑话，直到她真金白银堆满了院。\n瘸腿相公一脸懵：娶了个啥媳妇？", "tags": ["种田", "古代言情", "乡村", "空间", "美食", "代嫁代娶"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [5.23, 5.23, 5.32], "trend": 0.09, "latest": 5.3, "wordNumber": 273224, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.83, 2.88, 2.92], "trend": 0.08, "latest": 2.9, "wordNumber": 232208, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "笨蛋美人挺孕肚，搬空全京去流放", "fullTitle": "笨蛋美人挺孕肚，搬空全京去流放", "link": "https://fanqienovel.com/page/7647142493472951321", "data": [2.69, 2.69, 2.74], "trend": 0.05, "latest": 2.7, "wordNumber": 269685, "creationStatus": 1, "desc": "【种田+天灾+流放+虐渣+搬空+空间】\n修真界符阵宗师南穗穗渡劫失败，穿成临安侯府人人嫌弃的痴傻庶女，被迫替嫁给身中剧毒、双腿残疾的短命宁王冲喜。\n新婚夜，宁王剑指咽喉：“说，皇后派你来做什么？”\n南穗穗软乎乎歪头：“哥哥，要吃糖糖吗？穗穗有甜甜的糖糖哦……”\n宁王：……（这怕不是个真傻子？）\n婚后次日，南穗穗察觉王府死气萦绕，掐指一算，十日之内必遭抄家流放！\n南穗穗冷笑一声，反手画下百张搬运符，连夜搬空侯府，顺便将国库、帝后私库一扫而空！\n短短十天，她不仅囤够亿万物资，还顺手解了宁王的毒，揣着双胎崽崽踏上流放路。\n流放途中，别人啃树皮，她吃香喝辣，极品来找茬，宁王开启极致护妻模式。\n宁王：“我家夫人身怀六甲，谁敢惊着她，本王要谁的命！”\n被自家老祖宗显灵揍得脸肿如猪的仇家痛哭：“王爷！她召我老祖宗上来抽了我三百个巴掌，到底谁惊着谁啊？！”\n宁王：“我家夫人最怕打雷，一听雷声就往本王怀里钻。”\n被劈得外焦里嫩的刺客们嚎啕大哭：“王爷！那追着我们劈了三天三夜的九天玄雷就是她招来的！我们被劈成黑炭，她挺着大肚子在旁边用雷火烤红薯，这叫怕打雷？！”\n……\n柔弱是装的，满级大佬是真的，搬空全京去流放是让狗皇帝哭爹喊娘的！", "tags": ["种田", "古代言情", "空间", "虐渣", "天灾", "代嫁代娶"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "古风世情", "score": 5, "reasons": ["3日增长+33.9万", "竞争系数低(4.7)"], "total19": 119.5, "growth": 39.6, "abs_growth": 33.9, "coeff": 4.7, "count10w": 2, "mean": 4.0, "mid19": 3.3, "ndays": 3}, {"cat": "玄幻言情", "score": 5, "reasons": ["3日增长+13.7万", "竞争系数低(2.3)"], "total19": 151.6, "growth": 9.9, "abs_growth": 13.7, "coeff": 2.3, "count10w": 0, "mean": 5.1, "mid19": 4.2, "ndays": 3}, {"cat": "职场婚恋", "score": 5, "reasons": ["3日增长+31.2万", "竞争系数低(2.7)"], "total19": 158.1, "growth": 24.6, "abs_growth": 31.2, "coeff": 2.7, "count10w": 2, "mean": 5.3, "mid19": 4.8, "ndays": 3}, {"cat": "现言脑洞", "score": 4, "reasons": ["3日增长+10.7万", "竞争系数中(9.8)"], "total19": 369.0, "growth": 3.0, "abs_growth": 10.7, "coeff": 9.8, "count10w": 9, "mean": 12.3, "mid19": 7.3, "ndays": 3}, {"cat": "种田", "score": 4, "reasons": ["3日增长+1.9万", "竞争系数低(2.7)"], "total19": 124.3, "growth": 1.5, "abs_growth": 1.9, "coeff": 2.7, "count10w": 0, "mean": 4.1, "mid19": 3.5, "ndays": 3}, {"cat": "科幻末世", "score": 4, "reasons": ["3日增长+6.0万", "竞争系数低(2.5)"], "total19": 144.2, "growth": 4.3, "abs_growth": 6.0, "coeff": 2.5, "count10w": 1, "mean": 4.8, "mid19": 4.3, "ndays": 3}, {"cat": "豪门总裁", "score": 4, "reasons": ["3日增长+20.0万", "竞争系数中(7.2)"], "total19": 629.5, "growth": 3.3, "abs_growth": 20.0, "coeff": 7.2, "count10w": 29, "mean": 21.0, "mid19": 15.2, "ndays": 3}, {"cat": "青春甜宠", "score": 4, "reasons": ["3日增长+8.3万", "竞争系数低(3.4)"], "total1 神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [22.74, 23.6, 24.39, 25.12, 25.85, 25.85, 27.25], "trend": 4.51, "latest": 27.2, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [21.21, 21.98, 23.62, 23.95, 24.14, 24.24, 24.34], "trend": 3.13, "latest": 24.3, "wordNumber": 883661, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [21.47, 22.56, 22.56, 23.11, 23.63, 23.63, 24.43], "trend": 2.97, "latest": 24.4, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [23.85, 24.76, 24.76, 25.75, 25.99, 25.99, 26.51], "trend": 2.66, "latest": 26.5, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [26.81, 27.25, 27.92, 28.37, 28.45, 28.45, 29.16], "trend": 2.36, "latest": 29.2, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我法师加奶妈，用七把剑不过分吧", "fullTitle": "我法师加奶妈，用七把剑不过分吧", "link": "https://fanqienovel.com/page/7251115758850149436", "data": [41.06, 42.22, 42.22, 42.58, 43.04, 43.04, 43.01], "trend": 1.96, "latest": 43.0, "wordNumber": 3259754, "creationStatus": 1, "desc": "实体书我可摘星辰全平台可购，开局天才➕富婆\n宁软出村的那天，九州大陆多了个变态。\n法师？\n剑修？\n不，她只想做个奶妈！\n大陆众天才：闭嘴，你这个毒奶！\n……\n后来：\n“救命，自从遇到宁软我才知道，原来奶妈也能奶死人！”\n“可她不是金系灵师吗？”\n“是木系吧？”\n“明明是水系。”\n“不可能，我亲眼所见她是火系。”\n“不，她一定是土系”\n“胡说，她分明是剑修！”\n“她真的不是战士吗？我亲眼看到她用拳头打碎了别人脑袋啊……”\n宁软：好叭，摊牌了，不想做奶妈的法师不是好剑修！\n主打一个奶妈提剑，杀敌千里；法师抡拳，拳拳致命。\n……\n再后来：\n宁软发现，整个师门凑不出一个正常人，除了她。\n暴躁师父护短，爱干架。\n剑修大师兄蓄剑十几年，从不用剑。\n剑修二师兄出剑必杀人，剑下无活口。\n苟王三师兄：厕所都要加几十层防御阵法，别人留一手他留一百手的变态。\n摆烂王四师兄：除了灵石能让他毫无怨言的动一动，平时连呼吸都觉得累的变态。\n社恐五师兄人狠话不多，越打人越凶。\n卷王七师兄：卷天卷地，总想卷死师兄师妹的变态，每时每刻都在修炼。\n…\n再再后来：\n宁软还发现，原来自幼生长的新手村，竟是大佬聚集地。\n便宜爹们，全是一出村就会招来雷劈的佬中佬。\n宁软：修二代的快乐你们不懂！", "tags": ["玄幻言情", "古代言情", "团宠", "无敌", "虐渣", "打脸"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠摆烂拯救了全宗门", "fullTitle": "我靠摆烂拯救了全宗门", "link": "https://fanqienovel.com/page/7153918048745819172", "data": [58.44, 59.48, 59.48, 59.78, 59.95, 59.95, 59.83], "trend": 1.39, "latest": 59.8, "wordNumber": 1899187, "creationStatus": 0, "desc": "（实体第二册已出）叶翘一觉睡醒穿成了万人迷小说里的工具人二师姐。\n小说里小师妹有难二师姐上，小师妹想要神器，二师姐去拿，小师妹没有灵根，要挖她的灵根。\n叶翘心态崩了，连夜下山，撂担子不干了。\n这工具人谁爱当谁当。\n……\n新宗门的师兄们一切都好，手拿剧本的叶翘却知道这些人都是万人迷女主的鱼。\n丧气厌世的大师兄是爱而不得的舔狗，最终为女主牺牲。\n自打叶翘来了后，他也不不丧了，也不想着去死了，而是整日追着叶翘咆哮：“以后再敢逃课试试！”\n二师兄是个天才男配，因为无法破境，而生了心魔最后死在雷劫。\n叶翘试探性发出邀请：“大道至简，无欲则刚，二师兄，一起摆烂吗？”\n二师兄：“……”好像有些道理？\n天才丹修三师兄是备胎男配，为女主提供各种丹药被榨干所有价值，只得到一句‘我们只是朋友’\n叶翘来了后，三师兄满脑子都是炼丹炼丹，努力投喂小师妹。\n天生剑骨的四师兄为了女主，断送修为，自毁道心。\n叶翘抽出一把剑，认认真真：“心中无女人，拔剑自然神，女人，只会影响你拔剑的速度。”\n四师兄看着神神叨叨的小师妹：“？”\n自从叶翘来了后，他们不围着女主转了，整个门派鸡飞狗跳。\n原文女主：“？”\n我的万人迷光环呢？", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "虐渣", "今穿古", "异世穿越", "打脸", "群像", "魂穿", "剑修"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [16.52, 16.68, 17.03, 17.43, 17.73, 17.73, 17.8], "trend": 1.29, "latest": 17.8, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [24.81, 24.93, 24.99, 25.02, 25.24, 25.24, 26.09], "trend": 1.28, "latest": 26.1, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙冤种女配崛起，开局杀女主", "fullTitle": "修仙冤种女配崛起，开局杀女主", "link": "https://fanqienovel.com/page/7117541469996452867", "data": [24.85, 26.99, 26.99, 26.82, 26.63, 26.63, 26.12], "trend": 1.26, "latest": 26.1, "wordNumber": 1026838, "creationStatus": 0, "desc": "[大家说被简介耽误了，本人简介无能，看内容吧］\n穿成惨死的冤种女配？不怕，开局杀女主，剧情崩塌，一切洗牌重来。\n　　这一世，我就是女主。\n　　这本书的设定是女主是外室生的小可怜，起点低，光环强，不管遇到什么危险总会逢凶化吉，逆境重生，最后走到人生巅峰。\n　　而她，是女主同父异母的冤种妹妹，父亲唯一的嫡女。\n　　穿越之后掏心掏肺的对女主好，人家发达后，照样抽她仙骨，毁她全族，她终究逃不过惨死的命运。\n　　既然改变不了命运，那就将命运的源头直接掐死。\n【本书是偏正统一些的修仙文，注重主角个人历程，大家齐心协力突破桎梏，不恋爱，友情师门羁绊为重，不写师门斗雌竞雄竞等等，希望大家多一点儿耐心，谢谢】\n——\n避雷：偏传统修仙，人物成长会更符合逻辑，不是一天筑基三天结丹的爽文，筑基打死金丹的剧情有，不可能出现筑基一拳打死元婴的夸张剧情，看爽文的慎入。", "tags": ["玄幻言情", "古代言情", "穿越", "嫡女", "穿书", "虐渣", "今穿古", "打脸", "魂穿"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.08, 41.16, 41.17, 41.31, 41.66, 41.66, 42.01], "trend": 0.92, "latest": 42.0, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听说我死后成了反派白月光", "fullTitle": "听说我死后成了反派白月光", "lin  "creationStatus": 0, "desc": "苏莞穿书后，看着自己的人物设定和下场陷入了沉思，明明可以躺赢，却非要作死，这就是恶毒女配的标准结局？\n为了改变命运，她选择主动回到乡下，抱紧五个哥哥的大腿，谁让他们以后都是大佬呢？\n大哥入朝为官，官拜三品，二哥被神医收徒，医毒双绝，三哥上了战场，成为了大将军，四哥厨艺无双，开的酒楼被御赐天下第一楼，五哥则是天赋异禀，丹青妙绝，闻名天下，这大腿，不抱白不抱。\n可是，这顺手救回来的大佬男二是哪根筋不对了？总是美色诱惑她，还时不时扮成小奶狗装可怜，扮无辜？\n哥哥们一致认为，他不安好心，图谋不轨，但苏莞看着他这张脸却觉得，好像也不是不可以。", "tags": ["种田", "古代言情", "乡村", "穿越", "团宠", "甜宠", "穿书", "今穿古", "大佬"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家，继母渣爹跪求我回家", "fullTitle": "分家，继母渣爹跪求我回家", "link": "https://fanqienovel.com/page/7620425812189121598", "data": [28.61, 30.05, 32.41, 35.21, 36.06, 36.06, 35.79], "trend": 7.17, "latest": 35.8, "wordNumber": 584290, "creationStatus": 1, "desc": "（漫剧已出）一睁眼，林仟仟成了农家炮灰女。\n亲娘刚死，继母带着她女儿进门了，从此她和三岁的弟弟住进了柴房，一天两顿稀粥，还要挨打受骂。继母说：“女孩子家，识什么字？”转头却给继妹请了先生。\n爷奶偏心小叔，大伯母尖酸刻薄，整日惦记着把她卖个好价钱。亲爹呢？站在院里搓着手，屁都不敢放一个。\n林仟仟笑了。\n牵着弟弟的手往外走。\n“分家。”\n堂屋里一片哄笑：“一个丫头片子，带着个拖油瓶，分出去等死？”\n她没回头。\n分家后，她采野菜卖野兔赚了第一桶金。\n一个月后，她的木薯淀粉风靡镇上酒楼。\n两个月后，她买下了村东头三十亩地。\n三个月后，她要翻新老宅推倒重盖\n继母急了，爷奶慌了，亲爹站在院门口来回踱步——那院门，她牵着弟弟走出去那天，就再没打算回来。\n年底，她坐着新打的牛车经过老宅门口，继母追出来喊她的名字。\n她低头给弟弟擦了擦嘴角的油光，头都没抬：\n“娘？我娘早死了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [12.59, 13.76, 13.76, 14.49, 15.21, 15.96, 16.28], "trend": 3.69, "latest": 16.3, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "末世文恶毒女配？嚣张一日是一日", "fullTitle": "末世文恶毒女配？嚣张一日是一日", "link": "https://fanqienovel.com/page/7478769464138288153", "data": [23.27, 23.98, 23.98, 25.59, 26.98, 28.21, 29.19], "trend": 5.93, "latest": 29.2, "wordNumber": 1532131, "creationStatus": 0, "desc": "（已出版）[女主回归+空间+位面交易+丧尸晶石+变异动植物]\n姜云檀熬夜猝死后，穿进了一本末世文。\n好消息：穿成有俊逸多金未婚夫的千金小姐。\n坏消息：她是恶毒女配，未婚夫是男主，穿到了推女主进丧尸堆后。\n未婚夫给的家传玉镯是金手指，还没被女主拿走。不好意思，在她手上就是她的。\n末世遍地危机，随时有升天的危险。前期武力不高的姜云檀，决定抱紧大腿，可让她讨好有过节的女主是不可能的。\n-\n面对日渐嚣张的姜云檀，有人让沈鹤归管管。\n他说：我能怎么办？\n沈鹤归：只要不闹我，闹谁都行。\n她跟沈鹤归保证：我肯定不给你添麻烦，将你当成亲哥哥。可他看她的目光越来越炙热。\n当她羽翼丰满，想要远离他的时候，男人一把将她拥入怀中：“云檀，用完了就想将我丢开，是不是太没良心了。”\n后来的沈鹤归：想干坏事的时候，叫上我。\n\n-\n遗憾没穿到末世前囤物资，可金手指有空间能零元购，还能连接古代、星际、修仙等位面，她还怕没物资？\n增强异能的果子出现，她啃灵果不过分吧？\n变异动植物成为战宠，她有灵兽！\n金系异能者成变形金刚，买机甲！\n木系异能者提取植物精粹，那炼丹吧。\n-\nps：沈鹤归跟林听雪任何一世都没有关系！", "tags": ["科幻末世", "系统", "穿越", "末世", "囤物资", "大小姐"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局天灾，我靠囤百亿物资躺赢", "fullTitle": "开局天灾，我靠囤百亿物资躺赢", "link": "https://fanqienovel.com/page/7123103859110579213", "data": [10.23, 11.0, 11.97, 13.07, 13.98, 13.98, 15.73], "trend": 5.5, "latest": 15.7, "wordNumber": 1325784, "creationStatus": 0, "desc": "【末世+重生+空间+囤货+宠物+日常向】\n（实体出版中，短剧、动态漫已上线）\n末世天灾，适者生存。\n台风，洪水，极寒极热，地震，海啸，虫灾，酸雨……\n在末世挣扎求生三年，最终却落得惨死的姜宁，重生到末世前三天抢占先机夺回空间，开启疯狂囤货模式。\n买买买，囤囤囤，找回前世救她性命的狗子。\n磨好刀，囤好粮，挨个收拾渣男贱女们，有仇报仇有恩报恩。\n当天灾来临，她右手握刀左手撸狗，在文明丧失道德沦陷的末世中乘风破浪！", "tags": ["科幻末世", "重生", "空间", "末世", "虐渣", "囤物资", "打脸", "前世今生", "天灾"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "弱智就弱智吧，我照样星际最强！", "fullTitle": "弱智就弱智吧，我照样星际最强！", "link": "https://fanqienovel.com/page/7622869871344241689", "data": [11.71, 12.88, 12.88, 13.74, 14.52, 14.52, 15.14], "trend": 3.43, "latest": 15.1, "wordNumber": 786276, "creationStatus": 1, "desc": "【无cp】孔淼一朝穿越，成为了星际幼崽。\n被好心人送去上学 roundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "快穿": [{"label": "快穿之万人迷路人甲摆烂攻略指南", "fullTitle": "快穿之万人迷路人甲摆烂攻略指南", "link": "https://fanqienovel.com/page/7314990411372579902", "data": [14.21, 14.75, 15.08, 15.47, 15.83, 16.15, 16.37], "trend": 2.16, "latest": 16.4, "wordNumber": 2692573, "creationStatus": 1, "desc": "【万人迷+废物女大摆烂式攻略+脑洞+无固定男主+一见钟情】\n　　废物点心禹乔被一个刚出厂的攻略系统绑定了。\n　　看着自信满满说要她到各个世界攻略优质男的系统，禹乔笑了。\n　　她觉得是时候让系统看看大学生的真正实力。\n　　世界一：穿成君夺臣妻里被赐给绿帽侠的炮灰宫妃，因不懂上古音被迫装聋作哑。\n　　世界二：被迫成为末世重生文黑化男主的“女儿”。\n　　世界三：星际恋爱游戏里不可攻略的绝美NPC。\n　　世界四：恋综文万人嫌女配的闺蜜。\n　　……\n　　事实证明，只要禹乔摆得够烂，系统就能主动变成卷王。\n　　多年以后，王牌攻略系统514在进行新系统培训演讲时，都会想起它的宿主禹乔。这时候它都会在演讲后补充一句话——“不要绑定大学生！！！”", "tags": ["快穿", "古代言情", "系统", "穿越", "王妃", "今穿古", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：吾之第一女技能生效", "fullTitle": "快穿：吾之第一女技能生效", "link": "https://fanqienovel.com/page/7631127077751639065", "data": [20.07, 20.67, 20.99, 21.35, 22.17, 22.05, 21.85], "trend": 1.77, "latest": 21.8, "wordNumber": 435825, "creationStatus": 1, "desc": "评分刚出～\n【父母偏心眼+女主不单纯不咸鱼不愧疚（父母的是她的）+胎穿】\n明琦，一个精怪化人的地府鬼，日日夜夜打扰地府人员办公，时不时篡出来吓鬼，不少人向阎王抗议。\n阎王头疼的看着又去她库房捡东西鬼鬼祟祟的鬼，下定决心——让明琦去小世界（玩）长大，给地府鬼一段安静的日子。\n于是，特意在明琦来捡东西的时候，一枚青色的拇指大小，板板正正发出金光的钥匙。\n明琦默默的趁人不注意，悄悄伸手，咧着嘴把钥匙收进怀里，只是下一秒，她被金光笼罩，消失在地府。\n......\n第一个年代文世界：重生女配妹妹\n知青办来家里动员下乡人选，只见他们家排成一排站好，重生女配面无表情听着她爸一脸兴奋跟她妈说：“这下好了，老大到老五都下乡了，咱家宝儿是老大，是独生子，能留在城里了。”\n重生女配：“......”\n第二个宫斗文世界：男主妹妹\n重生侯府女上一世被四皇子灭族，今生想要嫁给早死的太子，救下他，拦住四皇子的青云路，只是宫宴上，一白白胖胖的三四岁女娃娃，仰头挺胸，对着众人指点江山：“爹是大皇帝，我是小皇帝。”\n侯府女：“......”\n太子，你说话啊。\n太子：不敢开口。\n第三个真假千金世界：女主妹妹", "tags": ["快穿", "幻想言情", "穿越", "魂穿", "家长里短", "胎穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心机勾引快穿：女主心上人归我了", "fullTitle": "心机勾引快穿：女主心上人归我了", "link": "https://fanqienovel.com/page/7634751548186168344", "data": [17.52, 17.93, 18.25, 18.54, 18.77, 18.77, 18.63], "trend": 1.11, "latest": 18.6, "wordNumber": on": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "成为男主剑灵后，全宗门追悔莫及", "fullTitle": "成为男主剑灵后，全宗门追悔莫及", "link": "https://fanqienovel.com/page/7482706423281896473", "data": [26.03, 26.03, 29.51], "trend": 3.48, "latest": 29.5, "wordNumber": 1265723, "creationStatus": 0, "desc": "原书名：《成为男主剑灵后，全宗门追悔莫及》\n小师妹抢我灵根，夺我机缘，于是我一剑废了她。\n扶兮乃倚剑宗大师姐，修炼刻苦，同门敬仰，可这一切却在师尊带回小师妹后变了。\n敬重的师尊为了小师妹不顾宗门数次涉险，二师弟为了不让小师妹感到自卑对她下慢性毒药，三师弟在她奄奄一息时提议将她的灵根送给小师妹......\n系统告诉她，这一切都是因为这个世界是个龙傲天暗黑升级流小说，而她只是活在传闻中的炮灰。\n扶兮不甘心，她拖着残缺的身体进入宗门禁地深处，投入到上古神剑横苍剑之中成为剑灵，并辗转找到了未来的龙傲天男主。\n此时的男主还未黑化成未来神挡杀神，魔挡弑魔踏着鲜血登上天梯的龙傲天，于是扶兮以剑灵之身潜伏在他身边，待他踏上修仙之路时重新杀回倚剑宗复仇。\n只是，扶兮看着还是个孩子的男主犯了难，剑灵要如何养孩子？\n后来——\n龙傲天：他们都说剑修的剑就是自己的老婆，所以嗨，老婆！\n扶兮：.........\n哪一步出错了？\n【女频言情+复仇火葬场1v1+前期男主视角+女主剑灵】", "tags": ["玄幻言情", "古代言情", "系统", "幻想言情", "1v1", "剑修"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假冒贵族后我成神了", "fullTitle": "假冒贵族后我成神了", "link": "https://fanqienovel.com/page/7313853144142728254", "data": [25.85, 25.85, 27.25], "trend": 1.39, "latest": 27.2, "wordNumber": 1293721, "creationStatus": 1, "desc": "【假贵族＋真女王＋穿马甲＋万人迷＋基建＋成长】\n罗薇穿越了，她穿成了一个冒充贵族小姐入学的卑贱平民，且即将被人揭穿平民身份，遭到全校师生的唾弃和辱骂，最后被吊死在菜市口的绞刑架上。\n罗薇:怕什么，不就是装贵族吗，来自二十一世纪的她能装得比贵族更像贵族！\n贵族小姐想用昂贵的香料试探她，罗薇打眼一瞧:这不就是西餐里随处可见的调味品吗，当谁没吃过似的！\n说她是平民不会计算几何，罗薇微微一笑:不就是三角函数吗，她初中就学过了！\n什么，说她穷酸没钱，她反手就拿出一整匹丝绸布料做成睡衣，顺便再做一箱真丝手绢，用一条扔一条。\n说她没有封地不是真贵族？呵，她白天赚钱晚上开荒，一边上学一边种地，新大陆几百万平方公里的沃土全都是她一个人的，她自己建国封自己！\n终于，她的身份被旧相识揭穿，神教要对她实施审判，还拿出了她不是贵族的证明——没有在雾国找到她的封爵诏书。\n罗薇:爵位？不好意思，她确实没有，因为她是雾国的国王！\n最后的最后，她废除了贵族制，建立了新国家，成了万千平民心中的神。\n她许他们以国泰民安，他们许她以忠诚和信仰。\n她，终以信仰成神！", "tags": ["玄幻言情", "种田", "幻想言情", "穿越", "基建", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹五界第一，天才见她都破防", "fullTitle": "小师妹五界第一，天才见她都破防", "link": "https://fanqienovel.com/page/7587720446674471998", "data": [18.58, 18.58, 19.5], "trend": 0.92, "latest": 19.5, "wordNumber": 332120, "creationStatus": 1, "desc": "【大女主、爽文、群像、无cp】\n现代人有没有灵根？\n云鸢表示，有的！还很牛！\n*\n一朝身穿到修仙界，觉醒极品金灵根，还是先天剑骨，被顶级宗门追着抢。\n这都不算什么。\n云鸢没想到，自己在现代对动物的亲和力，在修仙界还能用！\n*\n异兽大杀四方，各宗门弟子出去历练。\n“那是杀伤力极高的黑背烈齿狼！”\n云鸢：黑背德牧？\n“那是会吐人言迷惑人心的凤鸟！”\n云鸢：小玄凤？？\n“那是雪地最难惹的蓝眸飓风狼！”\n云鸢：二哈？？？\n看着云鸢轻松收下一堆灵兽，并且还称兄道弟，还能契约！\n同辈弟子：大变态！！\n云鸢：变态？\n要不你们去瞧瞧她的几个师兄师姐？\n*\n加入飞流峰后。\n云鸢才知道，变态是何物。\n大师姐最强武力，专修无情道，一剑一负心人。\n二师兄笑眯眯的，整日睡不醒，像是个废物，实则下手最狠。\n三师兄清冷无双，洁癖严重，一弄脏衣服修为暴增。\n四师兄长的多美，说话就多脏，出手就多阴。\n小师姐没她腰高，却最有钱，擅长拿灵石砸人！\n*\n直到飞升后，云鸢才发现自己的身份大有来头。\n她穿的不是修仙界吗？\n这魔法又是哪儿来的！\n这突然冒出的爹妈又是怎么回事儿", "tags": ["玄幻言情", "幻想言情", "穿越", "无CP", "今穿古", "群像"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在修仙界搞内卷", "fullTitle": "我在修仙界搞内卷", "link": "https://fanqienovel.com/page/7091545438385343522", "data": [25.24, 25.24, 26.09], "trend": 0.85, "latest": 26.1, "wordNumber": 3245128, "creationStatus": 0, "desc": "【实体书已出】\n秦姝穿书后，得知自己是个顶替了庶妹去修仙的冒牌货。\n\n　　修仙八年，一朝庶妹以凡人之资入道，她的遮羞布被当众揭开，才练气三层的她被宗门无情地逐出师门。\n\n　　她容貌绝色，被人炼做炉鼎，不出三年便香消玉殒。\n\n　　秦姝看着窗外蒙蒙亮的天色，陷入了沉思。\n\n　　努力修仙！在庶妹入道之前提高修为！争取活下去！\n\n　　天黑了，别的道友都睡了，她爬起来偷偷修炼卷死他们。\n\n　　却阴差阳错地发现月光似乎对她的修行有加持作用。\n\n　　秦姝不由得感慨，原身若是勤快些也不会到死都没发现自己竟然是个天才。\n\n　　……\n\n　　越修行越心惊，替身庶妹的背后竟然藏着另一桩腌臜事。\n\n　　原著中平平无奇的鹤师兄是个隐藏大佬，二师兄是神族血脉，小师姐乃朱雀后裔……她随手捡来的魔尊小黑蛇竟是上古巨兽。\n\n　　越来越多只存在于山海经上的远古神兽出现在她身边，那深埋在海底的秘密也终将展露在世人眼前。\n\n　　天人五衰，混沌横行，万年无人飞升的修仙界也得到一丝飞升先机。\n\n　　秦姝正准备撸起袖子大展宏图，身旁跟随她已久的魔尊谢释渊却悄悄扯了扯她的袖子。\n\n　　“夫人，我生来俊俏，飞升可否", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙界最沙雕的女魔头，竟是我", "fullTitle": "修仙界最沙雕的女魔头，竟是我", "link": "https://fanqienovel.com/page/7472636369601301566", "data": [23.63, 23.63, 24.43], "trend": 0.8, "latest": 24.4, "wordNumber": 1439056, "creationStatus": 0, "desc": "[抽象玩梗+无CP+爆笑沙雕文+群像]\n\n天空一声巨响春锦命丧当场。\n\n死就死了还穿书了，穿书就穿书了竟然穿成一个人嫌狗厌的角色！\n\n俗话说的好慈哥多败妹，春寒温原文最大的倒霉蛋属于狗过去都得被标记一下。但笑梗不笑人春寒温真男人，妹妹想要什么便给什么宠的妹妹要星星给月亮。\n\n但就是这么好的哥哥却因主角团想要灵药没给被一剑捅死不说，尸首还被挂在宗门三天。\n\n原文中春锦更是惨上加惨被主角团折磨的不成人样，还被丢在野外跟野狗抢食。父母想要讨个公道被主角师父一剑封喉，这真一家都老倒霉蛋！\n\n她瞬间红温，当即化身输出小能手将主角团骂了三天三夜。\n\n这么好的家人由她来守护！\n\n自此之后什么天骄什么主角见了春锦都得低头做人，敢抬头她一巴掌，敢告状她两巴掌，敢反抗她更是降龙十八掌！\n\n昆仑山掌门看着这混世大魔头不禁流下眼泪。早知道就不贪便宜了图天赋一收收俩了！家家有本难念的经，他家还分上下册。 自己混世就行了还给别宗弟子都带偏了。\n\n春锦的小伙伴们：谁说春锦缺？一剑给你菊花戳烂！\n\n主角团：赤裸裸的无耻，一群缺德带冒烟的家伙们！\n\n作品排雷：没素质且缺德本文很颠，无脑文经不起推敲想看正经文的慎入", "tags": ["玄幻言情", "古代言情", "穿书", "无CP", "搞笑轻松", "群像"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "贩剑红衣身上穿，掌声送给整活人", "fullTitle": "贩剑红衣身上穿，掌声送给整活人", "link": "https://fanqienovel.com/page/7312048784836398143", "data": [28.45, 28.45, 29.16], "trend": 0.71, "latest": 29.2, "wordNumber": 1010401, "creationStatus": 0, "desc": "【实体书22日19点预售】\n【爆笑沙雕无CP爽文+玩梗+女主万恶之源】\n【一个女主带坏全部天骄】\n宗门入门测试上，别人忙着测灵根，我忙着骗人。\n迟淼穿进修真界十年，绑定了“行骗一百次”才能解锁的苟到天荒地老后就能史上最强系统，简称——苟史系统。\n本想着解锁系统后就洗心革面做个人美心善好女孩，不料缺德来自自我，在这条路上的不归路上一去不复返，一个传染俩。\n认识迟淼前：\n剑宗圣子清冷无情，全天下少女为之疯狂。\n佛宗佛子功德无量，一身佛光普照万千。\n金家少爷富可敌国，一身贵气逼人令人着迷。\n琴宗少宗主妙音无敌，宛若人间谪仙。\n认识迟淼后：\n剑宗圣子：“天下万剑，唯贱不破。”\n佛宗佛子：“念经不如喊麦，作法不如社会摇。”\n金家少爷：“钱如果不是用来砸人，羞辱人，最后还捡回来，那将毫无意义。”\n琴宗少宗主：“近来迟淼师妹送来的《科目三》甚是炸耳，我已熟练，可破天地万法。”\n就连合欢宗一心找到爱人的圣女都为她框框撞大墙。\n整个修真界，谁见了迟淼不骂一句：万恶之源！\n迟淼：“污蔑，赤裸裸的污蔑！虽然我骗财骗命，可我还是好女孩！”", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "无CP", "异世穿越", "搞笑轻松"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒师妹不洗白在宗门创死所有人", "fullTitle": "恶毒师妹不洗白在宗门创死所有人", "link": "https://fanqienovel.com/page/7377736380736097342", "data": [25.99, 25.99, 26.51], "trend": 0.53, "latest": 26.5, "wordNumber": 1400259, "creationStatus": 0, "desc": "【已签出版】\n姜雀穿成了修仙文里的恶毒女配，不仅下场凄惨还是个纯纯衬托女主的大冤种。\n\n女主清冷出尘，她是个女的；女主天赋异禀，她要命一条；女主追求者如云，她连男人手都没牵过。\n\n更惨的是，穿书当日就是死期，四大男主齐聚刑堂要她小命。\n\n姜雀为活命无所不用其极，威胁、诱哄、抱大腿，硬生生在圣母遍地的宗门里走出一条骚路。\n\n走着走着竟一不小心成了团宠。\n\n四大男主一口一个小师妹，去哪儿都要黏着她；师傅带她入阵道，把她宠成眼珠子；各宗宗主每天都想抢她回去当亲传。\n\n就连原女主也心甘情愿加入了她的缺德联盟。\n\n姜雀带着主角团哐哐开干，差点干翻修真界！\n\n最后，姜雀自己成了大腿，准备跟抱了许久的大腿分道扬镳：“仙主，我们就此别过。”\n\n大腿——天道之下，万人之上的仙主大人，清冷孤傲不下神坛，听到老婆要跑气得差点崩人设。\n\n“替你扛天雷、帮你挡天命剑、陪你入冥界抢魂......那时候怎么不跟我就此别过， 怎么，用完就扔？”\n\n姜雀：“......胡说什么，我没用过。”\n\n仙主大人宽衣解带。\n\n姜雀：你不要过来啊！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗门都是恋爱脑，唯我是真疯批", "fullTitle": "全宗门都是恋爱脑，唯我是真疯批", "link": "https://fanqienovel.com/page/7181755373928320033", "data": [41.66, 41.66, 42.01], "trend": 0.35, "latest": 42.0, "wordNumber": 1279983, "creationStatus": 0, "desc": "「2024年中国网络文学影响力榜新人榜」\n【实体书《且渡无双》全套已出，全平台可购】\n情感博主林渡被恋爱脑气得心梗而亡，死后穿进虐恋修真文中，成为用骨灰为主角伟大爱情铺路的美强惨小师叔。\n看完了剧本，她缓缓打出一个问号，“这宗门山上的野菜都被挖光了吧？” \n系统循循善诱：看到你们宗门那帮恋爱脑了吗？拯救他们，你就能活。\n林渡：一个愿打一个愿挨，尊重嘲笑锁死。 \n系统：亲亲你的寿命还有一天哦。 \n林渡：专业对口，包您满意。 \n于是林渡认命拯救起了被骗挖灵骨沦为残废的大师兄，被道侣剖腹取胎救白月光的二师姐，被魔尊利用盗取师门重宝后惨被抛弃堕魔的小师妹…… \n就是这个宗门画风怎么这么不对劲呢？掌门亲自铁锅炖大鹅，真人们不是在种菜就是在挖宝…… \n林渡：不确定，再看看。 \n本以为沉沦者愚不可及，可林渡接触了之后才发现，师侄们那么好，都是邪魔外道的错！\n剧情渐渐发展到了关键节点，整个宗门都被林渡同化了。 \n大师兄：缺灵骨无法飞升？飞升不了你还可以下地狱啊！\n二师姐：双修？孩子？我有孕子丹你自己生吧。 \n小师妹：小师叔说了路边捡的没有好东西！魔尊？把他锤进土里！\n* 大女主修真，微群像，主剧情。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "女强", "穿书", "今穿古", "1v1", "群像", "魂穿", "升级流"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全宗都是舔狗，小师妹是真狗", "fullTitle": "全宗都是舔狗，小师妹是真狗", "link": "https://fanqienovel.com/page/7200755351845604355", "data": [27.08, 27.08, 27.38], "trend": 0.3, "latest": 27.4, "wordNumber": 4170637, "creationStatus": 0, "desc": "【实体书《一念凤兮》全平台可购】凤溪穿成修仙文里面的炮灰女配，穿书之日就是忌日。\n她为了苟命，千方百计脱离了女主所在的混元宗，加入了玄天宗。\n嚯！\n五个亲师兄，在书里全都是女主的舔狗，一个比一个死的惨。\n凤溪邪魅一笑：“舔狗了不起？有我狗吗？”\n大师兄身中剧毒，只有女主的血能够解毒，从此对女主情深似海，最后却被女主一脚踹入万丈魔渊，魂飞魄散？\n凤溪屁颠屁颠端来一大盆狗血：\n“师兄，喝我的！我的剂量大，药效足！”\n吞服完解毒丹，正准备割破手指的女主：“……”\n二师兄身具餍族皇族血脉，女主给了他隐藏血脉的丹药，从此二师兄心甘情愿为女主出生入死，哪怕最后被女主推出去当替死鬼也甘之如饴？\n凤溪拿出人族餍族友好一万年的盟约：\n“二师兄，尽情展示你高贵的餍族皇族血脉吧！万千少女为你痴为你狂为你咣咣撞大墙！”\n女主看着手里需要三个月服用一次的隐血丹：“……”\n凤溪的人生信条：做得狗中狗，方为人上人！", "tags": ["玄幻言情", "古代言情", "穿越", "穿书", "今穿古", "异世穿越", "魂穿"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "合欢宗老祖重生小白花，又妖又坏", "fullTitle": "合欢宗老祖重生小白花，又妖又坏", "link": "https://fanqienovel.com/page/7590736068664642584", "data": [24.14, 24.24, 24.34], "trend": 0.2, "latest": 24.3, "wordNumber": 883661, "creationStatus": 1, "desc": "【合欢宗大佬重生+修仙+男全洁+1vN+多男主自我攻略+全收】\n上辈子，元姝继任合欢宗掌门之位，被道侣至亲双背叛，身死道消。\n重生归来，却修为尽失，成了落仙宗人尽可欺的大师姐。\n不是，你谁啊？敢教训我，我跟你很熟？\n当唯唯诺诺小白花摇身一变成心狠手辣红朱砂，落仙宗一下热闹了。\n一张张俊逸孤傲的脸出现在面前，于是画风就变成了这样。\n疏离淡漠未婚夫：姝姝，我错了，求求你不要走！\n冷硬师兄变忠犬：姝姝，以前是我有眼无珠，我负荆请罪！\n妖孽师兄拂了拂病愈双腿：姝姝，你亲手来检验这两条腿是不是好了？\n小奶狗师弟满肚子坏水：师姐，今天打赢了是不是有奖励？\n元姝：宗门天骄祸害够了，是时候换个地方找美人了！\n等等，怎么全都追上来了？", "tags": ["玄幻言情", "幻想言情", "重生", "大佬", "忠犬", "前世今生"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "听说我死后成了反派白月光", "fullTitle": "听说我死后成了反派白月光", "link": "https://fanqienovel.com/page/7383825464940317720", "data": [32.3, 32.3, 32.48], "trend": 0.18, "latest": 32.5, "wordNumber": 476600, "creationStatus": 0, "desc": "【实体书已上线】桑念不小心爬到了修仙界，成了书里下场凄惨的恶毒女配。\n　系统：你的任务是嫁给男配谢沉舟，虐待他，羞辱他，然后被他嘎掉。\n　桑念：ok(挥舞小皮鞭)（打中自己）（噗通倒地）\n　系统：（沉默）（望天）\n　系统：任务更改，你给我攻略他，失败就去挖煤\n　桑念：（自信一笑）这简直易如反掌\n　然后她就成功被谢沉舟嘎掉了。\n　她以为自己会被送去隔壁世界挖煤，可再睁开眼，她重生到了三百年后。\n　系统很沉重：“网卡来晚一步，你有了新的任务。”\n　桑念：“是什么？”\n　系统：“救赎黑化成反派的谢沉舟，让他变成一个懂爱的正常人，重点是让他停止灭世。”\n　桑念：“……”\n　#这个反派，我曾见过的#\n　#你怎么不等大结局再来呢#\n　#要不你还是把我删了吧#\n　*\n　谢沉舟恨桑念。\n　所有人都这样认为，包括他自己。\n　可她死的那一日，谢沉舟弃仙途入魔道，纵身跃下无尽炼狱。\n　他踏过忘川河中无数浮沉尸骨，一寸寸翻遍三百里黄泉。\n　冥界震荡，恶鬼嚎啕，两岸仙神皆闻之色变。\n　人人都道谢沉舟疯了。\n　只有谢沉舟知道，他只是想找回一个人。\n　他的妻子，他的……念念。", "tags": ["玄幻言情", "古代言情", "系统", "穿越", "甜宠", "反派", "异世穿越", "HE"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被修仙外室逼死？我提剑杀上九霄", "fullTitle": "被修仙外室逼死？我提剑杀上九霄", "link": "https://fanqienovel.com/page/7463013040196176958", "data": [17.73, 17.73, 17.8], "trend": 0.08, "latest": 17.8, "wordNumber": 710764, "creationStatus": 0, "desc": "（爽文，女主邪到发正，无穿越无重生）\n黎扶直到死才知道，为什么自己无论如何也斗不过夫君那外室花月。\n原来，这方世界之外还有一个修真界。\n花月就是来自修真界。\n对方有道法在身，自然她无论如何也斗不过。\n虐杀、剥皮、剔骨，黎扶众叛亲离，受尽苦楚而死。\n怎能不恨？！\n她从忘川爬出来，日日忍受噬骨之痛，只为求一个公道。\n可九霄之上的仙君们高高在上，花月二人背靠大宗门，乃修仙界新秀、有天命在身……她一个区区冤鬼，不仅上了九霄，竟然还敢攀污天命之人？\n这一刻，黎扶终于明白，这天下的真理与公道，从来不能指望别人。\n那一天，她回了忘川。\n也是那一天，忘川雷动、冤魂归位，天下怨气汇于九霄！\n九霄之上，万年前关于修仙界的生死预言出现——\n鬼煞之主降世，修仙界灭世之劫到来！\n忘川之内，黎扶睁开了眼睛。\n——十万怨鬼开道，一剑照破六道。\n——今日起，真理，只在她剑锋之上！\n#群像大爽文\n#私设仙侠无限流\n#有CP\n#文案前半段修仙外室渣男，有重大反转", "tags": ["玄幻言情", "古代言情", "群像", "剑修", "古色古香"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "发配边关，罪妻开荒养出战神", "fullTitle": "发配边关，罪妻开荒养出战神", "link": "https://fanqienovel.com/page/7613410424586767385", "data": [71.98, 71.98, 76.89], "trend": 4.91, "latest": 76.9, "wordNumber": 719210, "creationStatus": 1, "desc": "【边关生活+木系+御兽+宠夫+护短+开荒种田+甜宠+双强直球夫妇+对照组】\n大靖连旱两年，粮荒四起，战火燃遍辽东。\n末世后勤员苏禾穿成罪奴丫鬟，被发配给军户为妻。\n罪奴姐妹极力表现，力争抢个优秀男儿，而她只看安全感，一眼锁定全场最壮的百户萧征。\n他冷脸拒绝：“我不需要媳妇，赏我粮食就行！我养不起，也没功夫照顾。”\n她直白坦荡：“我不用你照顾。我能种地，能持家。你很强，跟你，我安全。”\n没媳妇前的萧征：女人真麻烦！\n有了媳妇后，萧征夜夜搂着苏禾：真得劲！媳妇，再来二十个馒头！\n自此，边关多了一对双强夫妇。\n他负责拿刀护她，横扫敌军；\n她负责种田产粮，兜底全家。\n极品邻居攀比？打脸！\n边关缺粮断炊？解决！\n敌军突袭包围？放野兽！\n萧征从穷军户一路封将，世人皆知：\n大将军最厉害的不是战功，是他那位能种出天下粮的媳妇。\n【饭桶将军×产粮小媳妇】\n你负责打仗护家・我负责种地养你", "tags": ["种田", "古代言情", "乡村", "穿越", "强强", "宠夫"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [40.35, 40.35, 42.88], "trend": 2.53, "latest": 42.9, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着冰箱穿到古代嫁病娇首辅", "fullTitle": "带着冰箱穿到古代嫁病娇首辅", "link": "https://fanqienovel.com/page/7023337733921704996", "data": [15.21, 15.96, 16.28], "trend": 1.07, "latest": 16.3, "wordNumber": 1307758, "creationStatus": 0, "desc": "【全文完结+先婚后爱+爽文，女主是真正的原主】温暖暖最近发现她家的冰箱出了故障，吃掉的食物可以自动补齐！\n以为要发达了的温暖暖竭尽所能将冰箱装的满满当当。\n结果第二天，华丽丽的悲催穿书了。\n更惨的是她穿的还是个下场凄惨的作死原配！\n温暖暖很焦虑。\n别怕、别乱，稳住！\n她有自动补充食物的冰箱，可以带领贫穷到响叮当的主角天团，过上吃饱穿暖热气腾腾生活。\n日后，权势滔天的首辅大人看在今日吃喝的份上，怎么也得放她离开吧？\n·\n冷霄自幼遭遇家变，父死母病弟幼、颠沛流离吃尽苦楚，看尽世态炎凉，阴郁戾气缠绕在眉眼之间，浑身笼罩着清冷疏离的气息，遥遥如天上月；\n当如同小太阳般的暖暖笑靥如花出现在他面前，他找回了独属于他的光。\n从此，视她如命，再也无法放手！", "tags": ["种田", "古代言情", "穿越", "空间", "美食", "病娇", "穿书", "今穿古", "1v1", "发家致富", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [14.92, 14.92, 15.82], "trend": 0.91, "latest": 15.8, "wordNumber": 882940, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [17.52, 17.52, 18.38], "trend": 0.86, "latest": 18.4, "wordNumber": 875422, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成恶婆婆后，儿媳抢着给我养老", "fullTitle": "穿成恶婆婆后，儿媳抢着给我养老", "link": "https://fanqienovel.com/page/7519959894917647422", "data": [17.57, 17.57, 18.37], "trend": 0.8, "latest": 18.4, "wordNumber": 726421, "creationStatus": 0, "desc": "已完结，短剧已上线，欢迎收看。（无cp！种田+空间+家长里短（微群像）+发家致富+爽文+医术） \n注：新书字数少评分低正常，会慢慢涨的哟～\n医学博士吴玉兰猝死后，魂穿成了个刻薄尖酸的恶毒老太。\n　吴老太恶毒是出了名，磋磨儿媳，买卖孙女，啥腌臜事儿都干得出来。\n　　四个儿子，除了小儿子，其余都是干活的牛马。\n　　为了让小儿子吃上肉，冬日让大儿子上山打猎，害的大儿子差点被猛兽咬死；\n　　为了让小儿子念上书，夏日送二儿子去修河道，害的二儿子差点累死；\n　　为了给小儿子铺路，还把摔断腿的三儿子送去边关，害的三儿子差点战死。\n　　可某一天，吴老太变了......\n　　她不再宠溺小儿子，不受待见的孙女也被她挨个赎回。\n　　宋知康知晓妻子生产，千里迢迢赶回来，本以为妻子会被偏心母亲折磨得不成人样。\n　　结果让他傻眼......\n　　妻子面色红润，人胖了一圈。\n　　刚出生的女儿更是被养的胖嘟嘟，小手跟藕段似的肉嘟嘟。\n　　再看家中其他女眷，一个个丰圆玉润，悠闲的在廊下绣花。\n　　而他那恶毒老娘，正挥着大扫帚，追着她最疼爱的四儿子打。\n　　我的老天，这还是我家吗？", "tags": ["种田", "古代言情", "穿越", "空间", "医术", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "想兼祧两房？搬空家产带儿女和离", "fullTitle": "想兼祧两房？搬空家产带儿女和离", "link": "https://fanqienovel.com/page/7545324289256328216", "data": [27.47, 27.47, 27.58], "trend": 0.11, "latest": 27.6, "wordNumber": 1152924, "creationStatus": 0, "desc": "【有空间，不是双洁，女主懂医术。】\n末世摸爬滚打多年的乔念，带着空间穿越到古代，一个穷秀才的妻子。\n刚睁眼，龙凤胎儿女面临被卖，乔念凭借自己的武力夺回孩子。\n成亲五年的秀才相公不回家？\n她带着孩子找过去。\n结果却发现，丈夫和寡嫂在城里，小日子过得风生水起，连儿子都生了俩。\n乔念一去，大杀四方，胖揍狗男女，搬空婆家所有财物。\n和离后，带着娘家人赚得盆满钵满。\n乔念变得越来越漂亮，肤白貌美又多金，渣前夫肠子都悔青了。\n他厚着脸皮上门求和，被乔念一脚踢出门。\n渣男有多远给我滚多远……", "tags": ["种田", "古代言情", "穿越", "空间", "医术", "发家致富"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "宿舍求生：从刷广告开始变强", "fullTitle": "宿舍求生：从刷广告开始变强", "link": "https://fanqienovel.com/page/7632978161973595161", "data": [29.61, 29.61, 32.0], "trend": 2.39, "latest": 32.0, "wordNumber": 310784, "creationStatus": 1, "desc": "评分刚开开开开！！！\n【诡异+有cp+女主恶毒炮灰+女主花心大萝卜+爽文+成长流】\n避雷1：女主超漂亮，阴暗妒强，一心要当天龙人\n避雷2：男主超纯起点龙傲天风，巨强巨黑巨装，巨容易破防。\n避雷3：女主人见人爱，诡见诡爱（少量女嬷）。男主后来还没上位，就天天抓小三。\n=========\n诡异公寓降临，全民躺平求生 。\n在这里，夜晚必须躺在 3, 4.83, 5.07], "trend": 0.34, "latest": 5.1, "wordNumber": 1055677, "creationStatus": 0, "desc": "〖大女主文+玄学+宠妻+群像+复仇〗\n目前同名短剧«七月半，鬼娶亲»已上线。\n阿妈说，我出生那年，村子里天降异象，雷霆大雨，万鬼嚎哭，爷爷将七婆请来，亲自接生，这才将我生下来。\n七婆批命:“天生阴命，已被“他”相中，十八年后，七月半，花轿至。”\n从我记事起，我每晚都会做一个梦，梦见我身旁躺着一个男人，他说:“阿音，我是你夫君。”\n从小阿妈便让我与一个灵牌一屋子睡觉，逢年过节还得上香叩拜，更不能让我与任何异性有接触。\n阿妈却只是说我还太小，要以学业为重。\n村里人用惧怕，恭敬，疏远的眼神看着我，甚至，不许家中小孩与我一同玩耍。\n七月半，鬼节那天，刚满十八岁的我，迫于无奈穿上大红嫁衣，被鬼抬轿离开家，与‘鬼’拜堂成亲。\n自从那之后，我虽然回归学校，但，各种灵异事件都接踵而来……\n本故事纯属虚构，所有意外，纯属巧合。", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漫画预言杀人事件", "fullTitle": "漫画预言杀人事件", "link": "https://fanqienovel.com/page/7477901455727283225", "data": [4.15, 4.15, 4.47], "trend": 0.32, "latest": 4.5, "wordNumber": 393660, "creationStatus": 0, "desc": "【漫画师 X 复仇者】陈荷三年前坑掉的一部扑街漫画突然爆火，原因是预言了一宗凶案。\n　　网友们在漫画评论区瑟瑟发抖：\n　　[你们看新闻了吗，这一幕怎么跟电视上播的一样啊！]\n　　[我没有看错吧，尸体是刚刚发现的，漫画是三年前发布的！]\n　　[画手是怎么想出这种埋尸地的，有这么巧吗？]\n　　[我有一个大胆的猜测……]\n　　[作者不会就是凶手吧！]\n　　[作者你说句话啊！人不会是你杀的吧！]\n　　……\n　　面对警方的质疑，陈荷微笑答复：\n　　“这只是巧合。我们画漫画的想象力很丰富的。”\n现实悬疑，本格推理，无奇幻元素。群像，主角填俩是因为只能填俩。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "群像", "悬疑恋爱"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：在张家打黑工的日子", "fullTitle": "盗笔：在张家打黑工的日子", "link": "https://fanqienovel.com/page/7438426163896142910", "data": [4.53, 4.53, 4.75], "trend": 0.23, "latest": 4.8, "wordNumber": 2435026, "creationStatus": 1, "desc": "【别名：张家列传】\n【男主无CP+张家人+世界融合+无系统+非爽文+救张海侠、阿宁、潘子等等所有人(包含南部档案馆、老九门、本传、雨村、藏海花等剧情】PS：非常重要！！！这本书是以原著为底写的！！！所以求求不要因为这件事而差评了……(力竭)\n张海桐因工作猝死穿成盗笔世界一个张家外家人，从此开始兢兢业业打黑工，勤勤恳恳做牛马的苦逼生活。\n可谓北能本家稳局势，南能南洋杀军阀。\n西跟绿林好汉借盘缠，东可海外镇场子。\n横批：打遍天下无敌手。\n本以为这辈子就这样了，却发现自己的世界竟然在和盗笔世界不断融合。\n当时代的洪流滚滚而去，长白山的雪落下一个世纪。\n流落在外的孩子终于要踏上回家的路程，诉说那漫长的故事。\nPS：本文从清末时间线开始讲张家故事，包含：南部档案、一部分老九门、本传。其余看情况补充。\nPS：第十章开始现实和书中世界互穿，慎\nPS：盗墓世界的能力会带回现实世界！后面可能会出现世界线合并！\nPS：主角杀人不眨眼且道德成谜(提前打个补丁)", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人"], "bor /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
