<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄女频榜单 · 趋势分析 7月28日–8月3日</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

 "desc": "9396是时空管理局维稳部的员工，犯错后被自家组长开后门塞进隔壁同人部避风头，开启属于她的摆烂之旅。", "tags": ["女频衍生", "穿越", "同人", "甄嬛衍生", "综影视", "衍生"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "【综名著】十九世纪冒险家", "fullTitle": "【综名著】十九世纪冒险家", "link": "https://fanqienovel.com/page/7646082398211279897", "data": [5.04, 5.14, 5.2, 5.28, 5.23, 5.23, 5.24], "trend": 0.2, "latest": 5.2, "wordNumber": 294923, "creationStatus": 1, "desc": "简介：\n【傲慢与偏见+福尔摩斯探案集+泰坦尼克号，世界观融合了福尔摩斯探案集的维多利亚时代，CP夏洛克·福尔摩斯】\n李梨因一场事故，穿越到了1855年。\n是傲慢与偏见中班纳特家刚出生的第六个女儿——伊迪斯·班纳特。\n比莉迪亚小三岁，但在原著从未出现过。\n李梨并未纠结过多，来都来了，想办法好好生存吧。\n伊迪斯顶着现代人的成熟灵魂，她既保持着十九世纪淑女的外表，骨子里却总是冒出不合维多利亚时代规训的现代思维。\n什么？随便写写的番茄味标题科普类小说火了？\n什么？这个世界不只是傲慢与偏见，一不小心成冒险家了？\nPS：1.半架空历史，傲慢与偏见延后时间线，泰坦尼克号提前时间线，因为时间线杂糅到一起可能有些设定跟真实历史对不上。\n2.前期剧情孕育发展女主事业，中期开始冒险", "tags": ["女频衍生", "穿越", "穿书", "魂穿", "公版衍生", "衍生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "斩神：如我所书？行吧【", "fullTitle": "斩神：如我所书？行吧【", "link": "https://fanqienovel.com/page/7645958431051893822", "data": [4.47, 4.37, 4.31, 4.36, 4.42, 4.52, 4.61], "trend": 0.15, "latest": 4.6, "wordNumber": 292489, "creationStatus": 1, "desc": "【斩神同人+崩铁（主要是黄金裔）+女频+无cp】\n【ooc致歉】【有触雷点可直接退出哦】【不喜勿喷】\n【拒绝恶意评分！】\n啊？什么叫她拆个快递的功夫就穿越了？\n穿的啥？斩神？\n没搞错吧？！\n所幸昔涟及时出现，将黄金裔们带到了她的面前。\n以及...如我所书。\n等等，这些能力是不是有点太逆天了？！\n黄金裔的能力逆天就算了，什么叫给她个欢愉令使当当？\n还有，什么叫要她种建木啊！\n天弓啊...请不要垂眸！求你了！\n等等...为什么其他人都心疼的看着她！她不惨啊！！！\n（轻微脑补）", "tags": ["女频衍生", "穿越", "无CP", "同人", "斩神衍生", "衍生"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "看见弹幕时白月光回国了", "fullTitle": "看见弹幕时白月光回国了", "link": "https://fanqienovel.com/page/7643830276526722110", "data": [54.82, 58.96, 63.3, 66.57, 67.44, 67.44, 66.66], "trend": 11.85, "latest": 66.7, "wordNumber": 230129, "creationStatus": 0, "desc": "（女主控勿看，超高洁勿看，超敏感人群勿看，多视角，情感快，小说勿代入现实，未成年勿入）\n绿茶偏执阴暗男二VS温柔白月光\n温以宁从小就是人群里的月亮，温柔漂亮善解人意。高中时无数人下课挤在走廊，只为远远看她一眼，包括那个永远站在角落的沉默少年\n——陆斯年。\n后来她出国深造，那段岁月被彻底封存。\n直到某天，她的视野里突然飘过弹幕：\n——“男二好可怜，守护了女主一辈子，却从来没被爱过。”\n——“听说他有个白月光？那又怎样，白月光只是过去式。”\n——“可惜了，他注定要爱女主一生一世。”\n——“等等，白月光好像叫……温以宁？”\n她心头一震，顺着弹幕指引回国，见到了那个所谓的“男主”，也见到了陆斯年。\n陆斯年温柔体贴，是所有人眼中深情的男二，命中注定要守护原女主，爱而不得地过完这一生。\n系统告诉他：只要完成任务，就能再见到他的白月光。\n他其实找过温以宁，但世界规则像一睹透明的墙，他永远找不到她。\n而她也从来没有注意过他。\n于是陆斯年学会伪装，把偏执阴暗藏在温柔皮相之下，按部就班地扮演一个深情配角。\n只有陆斯年自己知道，所有体面都是装出来的，骨子里早烂透了。", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "豪门世家", "久别重逢"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小炮灰变美后，抢了财阀太子爷", "fullTitle": "小炮灰变美后，抢了财阀太子爷", "link": "https://fanqienovel.com/page/7654572647035964440", "data": [59.7, 62.42, 62.42, 65.86, 68.81, 71.06, 71.22], "trend": 11.52, "latest": 71.2, "wordNumber": 246068, "creationStatus": 1, "desc": "【穿书 + 贵族学院F4 +  娇柔大美人 + 勾引上位】\n冷厉傲慢第一财阀太子爷（193cm） × 纯欲娇柔炮灰大美人（168cm）\n铃兰小花妖渡劫失败，本该魂飞魄散，却意外绑定了炮灰系统，穿进一本贵族学院小说，成了同名小炮灰。\n原剧情里，她是女主林晓葵的好朋友，对照组的配平工具人。\n对花心浪子温衍一见钟情，深情不移，最终嫁入豪门。\n可甜文结局的背面，是浪子永不回头，是情人和私生子登堂入室，是小产后再也不能生育，是抑郁而终。\n而她的好姐妹林晓葵，却嫁给了第一财阀太子爷司凛，人人称羡。\n穿过来那天，阮棠看着镜子里灰扑扑的原主。\n再看她灵魂带来的属性点：冰肌玉骨、倾城之貌、杨柳细腰、内媚天成……\n每一样都是她原本拥有的东西，但没有气运值，一样也解锁不了。\n而这个世界的气运，集中在圣澜学院执事团的四个天之骄子身上，尤其是执事之首：司凛。\n阮棠想得很清楚：既然要蹭气运，为什么要蹭温衍那个浪子的？\n要蹭，就蹭最大的那个。\n排雷：F4贵族文学，非NP，不买股。", "tags": ["现言脑洞", "现代言情", "系统", "穿书", "豪门世家"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [6.6, 6.84, 6.84, 7.94, 9.03, 10.09, 10.87], "trend": 4.26, "latest": 10.9, "wordNumber": 185742, "creationStatus": 1, "desc": "（新书）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“…… \"魂契?有意思。\"\n地下黑场的铁塔硬汉红着眼眶：\"有人要我了?\"\n最高监狱里，锁链寸断的少年抬起头，露出一双极深的凤眸。\n而轮椅上的男人，捻着一朵蓝楹花，笑得温润如玉：\"妻主?\"\n林清蕴：......我现在退契还来得及吗?男人，只是取悦她的工具罢了。", "tags": ["玄幻言情", "幻想言情", "穿越", "大佬", "魂穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [2.98, 3.34, 3.34, 3.55, 3.65, 3.65, 3.92], "trend": 0.94, "latest": 3.9, "wordNumber": 245818, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "幻想言情", "反派", "穿书", "古代言情", "团宠"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生另投师门成团宠，你们气什么", "fullTitle": "重生另投师门成团宠，你们气什么", "link": "https://fanqienovel.com/page/7637353004902911038", "data": [3.03, 3.53, 3.53, 3.68, 3.74, 3.74, 3.76], "trend": 0.73, "latest": 3.8, "wordNumber": 282662, "creationStatus": 1, "desc": "前世，乔月被妹妹觊觎她的极品单灵根，妹妹自导自演陷害她，害她被师父挖了灵根，沦为魔修，最后还被妹妹害死，被师兄抽了灵魂拘在妹妹的百鬼帆，折磨百年。\n　　被人从百鬼幡救后，她竟回到被挖灵根那一日！\n　　灵根已经被挖，她第一时间激发了隐灵根，重生长出来的居然是万年难得的全系完美灵根！\n　　师门害她，不仁不义，她转头拜前世恩人为师，成为残峰最小师妹。\n　　以为只是逃离被害的被迫选择，却不想成了残峰的团宠。\n　　大师兄送她花不完的灵石和法器，二师兄送她用不完的阵盘，三师兄送她嗑不完的丹药，四师兄送她守护傀儡。\n　　残峰师兄弟以为新来的小师妹是小可怜，却发现小师妹强得可怕。\n　　极品丹药从来没有人练出来过？小师妹能练！\n　　净化师只能净化妖兽肉？小师妹她还会净化魔气、鬼气！\n　　种植师只能种普通灵植？小师妹可以种仙植！\n　　最最厉害的是，万年没有人会的画符，小师妹她也手到擒来！\n　　那个谁谁谁，我们小师妹这么优秀，你们气什么？\n　　后悔？晚了！", "tags": ["玄幻言情", "幻想言情", "重生", "穿越", "团宠", "前世今生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [3.32, 3.55, 3.82, 3.85, 3.91, 3.91, 4.0], "trend": 0.68, "latest": 4.0, "wordNumber": 272804, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "美人师尊翻车后，惨遭两次囚禁", "fullTitle": "美人师尊翻车后，惨遭两次囚禁", "link": "https://fanqienovel.com/page/7654038704800926744", "data": [5.51, 5.59, 5.73, 5.76, 5.67, 5.67, 6.07], "trend": 0.56, "latest": 6.1, "wordNumber": 197397, "creationStatus": 1, "desc": "【修仙师徒+锁链警告+强制爱+1v3+男全洁】\n江棠以神尊和妖尊的身份收了两个徒弟。\n一个是妖族少尊主，拥有九幽玄蛇血脉，肉身强悍，能越境战斗。\n一个是仙族神君，天生剑骨，以杀问道，以战破境。\n他们哪哪都好，就是有个缺点，占有欲太强，都想做她唯一的徒弟。\n江棠一直藏得很好，他们互相不知道对方的存在，互相以为是她的唯一。\n不料因为一个香囊，她翻车了，而且恰巧还失了修为。\n他们变得陌生，变得肆无忌惮。\n相貌妖异的少尊主将她囚于氤氲的温泉池中，强逼她陪他照着书籍练习。\n“尊师重道还有另一层意思，师尊想听听吗？”\n光风霁月的神君将她囚于方寸的马车内，强逼她直视颠簸无退路的困境。\n“师尊，你是逃不掉的。”", "tags": ["玄幻言情", "穿越", "腹黑", "今穿古", "大佬", "剑修"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.11, 7.63, 7.63, 7.85, 7.62, 7.62, 7.46], "trend": 0.35, "latest": 7.5, "wordNumber": 179980, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中 k": "https://fanqienovel.com/page/7657451774994828312", "data": [3.79, 4.77, 5.89, 6.65, 7.27, 7.27, 7.39], "trend": 3.61, "latest": 7.4, "wordNumber": 147279, "creationStatus": 1, "desc": "【分刚出，后面会涨～】\n【大女主，无CP，女帝】\n穿成了古代富商家的千金，云昭本来觉得一辈子吃穿不愁还有人照顾也不错，\n却陡然得知这大宁朝单身居然犯法！\n凡大宁百姓，女子年满十六，男子年满十九未婚嫁者，每年罚银二两。\n女子年满二十，男子年满二十二未婚嫁者，由官府强制婚配！\n不想嫁人？除非她去考科举。\n云昭：“……”\n虽然上辈子一路卷到了博士，这辈子她是真不想再读一次书了，\n但上学再苦，还能苦得过十几岁就被迫嫁人？\n不就是科举吗？\n带上小伙伴们一起考！\n大宁立朝百年，因某些历史缘故，从未明令禁止女子参加科举，\n但因为各种现实因素，此前也的确从未有女子在科举一道取得过什么耀眼的成绩。\n直到那一年，云昭得圣上钦点，\n一身状元服打马长安惊天下。\n——\n多年前，大宁国师曾预言，皇六女云昭命格极贵，\n唯有送出宫隐藏身份养至二十方可接回。\n但永安帝没想到的是，云昭还没等到二十，就先自己考回长安了，\n此后更是一发不可收拾，一步一步，开创了一个全新的盛世。", "tags": ["古风世情", "古代言情", "公主", "无CP", "科举", "古言权谋"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "侍妾生存手册", "fullTitle": "侍妾生存手册", "link": "https://fanqienovel.com/page/7646430990331546686", "data": [2.8, 3.12, 3.39, 3.69, 4.02, 4.25, 4.48], "trend": 1.68, "latest": 4.5, "wordNumber": 286093, "creationStatus": 1, "desc": "评分才出\n【无金手指＋无系统+慢节奏＋宅斗宫斗＋后期独宠+养娃日常】\n\n景王赵时雍一向自傲自己知礼守礼，公平公正。\n即便朝中议论自己太过苛责，也不以为意。\n结果一朝栽倒在一个侍妾身上。\n在他还没有意识到的时候，就已经处处偏袒维护她。\n林阮的屋子小？\n换成大的！\n林阮的东西少？\n给，\n多多的给！\n林阮心惊胆战，自己只想躺平当个咸鱼，王爷这是要干嘛？\n因着这份宠爱，\n府里正妃视她眼中钉，日日想要扳倒她，\n一众名门出身的庶妃更是恨她入骨，\n明枪暗箭不曾停歇。\n林阮日日活得提心吊胆，她所求从来不多，只求安分度日，平安生下孩儿，往后伴着儿女安稳养老，半点不愿卷入后宅纷争。\n奈何一身滔天盛宠，反倒将她推至风口浪尖。\n“在我心底，你才是我心中唯一认定的妻。”\n赵时雍低头，温柔吻过她颤抖微凉的唇角，将瑟瑟发抖的人牢牢锁在怀中，似要隔绝外界所有风雨。\n低沉温柔的嗓音落在她耳畔，字字皆是滚烫真心：\n“不必设防，不必躲闪，世间所有风波有我替你挡下。”\n”你只需安安心心，永永远远留在我身边。“", "tags": ["古风世情", "独宠", "古代言情", "双向奔赴", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女扮男装上朝后，死对头暗恋成疾", "fullTitle": "女扮男装上朝后，死对头暗恋成疾", "link": "https://fanqienovel.com/page/7651286824677035033", "data": [3.43, 3.6, 3.88, 4.26, 4.63, 4.63, 4.9], "trend": 1.48, "latest": 4.9, "wordNumber": 151763, "creationStatus": 1, "desc": "【女扮男装】【宿敌就是妻子】【对抗路情侣】【双洁1v1】\n前期，桀骜不驯招摇女vs表里不一腹黑男。\n后期，狂拽酷毙帅女帝vs只忠君不一定爱国的绝世大奸臣。\n沈峤觉得她和苏砚简直是天造地设的一对。\n最纯恨的那年，他算计她下狱，让她差点丢官丢命。\n她三年谋划，让他落败，满门抄斩。\n可最后，鹬蚌相争，渔翁得利。\n两人一同死在了牢里。\n死前，这家伙被毒傻了。\n和她说，他心悦她。\n这毒这么烈的吗，给人都毒成啥样了。\n他是不是临死前也要恶心我一把？\n让我死也不安生？\n再睁眼，沈峤又活了，还重回了初见时。\n19岁的苏砚冷冰冰的看着她。\n沈峤：呵，小屁孩，这辈子你可斗不过我。\n可渐渐她发现…\n不对啊…苏砚他不对劲啊！\n重重误会解开，沈峤懵了。\n你真暗恋我啊，我以为你纯挑衅我呢！\n苏砚咬牙切齿，我有病才一直挑衅你！\n直到沈峤身份暴露，苏砚愣愣的看着眼前人。\n他都做好断袖的准备了，你告诉我你是…\n沈峤踩上他的胸口：怎么？苏大人想变卦？\n还觉得我粗鄙难登大雅之堂？\n苏砚握着她的脚踝：殿下金枝玉叶，何来粗鄙一说。\n沈峤窃笑：苏大人向来两幅面孔。", "tags": ["古风世情", "古代言情", "古言权谋", "科举", "女扮男装", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "误却花期又逢君", "fullTitle": "误却花期又逢君", "link": "https://fanqienovel.com/page/7638184710425824280", "data": [2.39, 2.35, 2.51, 2.7, 2.82, 2.82, 3.0], "trend": 0.61, "latest": 3.0, "wordNumber": 100873, "creationStatus": 0, "desc": "一纸十年婚约，曾拴住翰林院学士嫡女与镇国大将军之子。\n她温婉通医理，他年少负壮志，本是天作良缘，却因世事风波，硬生生一纸退婚，情分两断。\n \n岁月流转，他成镇守一方的节度使，铁血冷面，权柄在握；她怀一身医术，游历山河。\n \n本以为山水不相逢，命运却再度将两人牵绊。前尘误会渐次揭开，年少情愫从未消散。\n花期虽误，故人仍归，兜兜转转，终究还是他与她，再续前缘。", "tags": ["古风世情", "古代言情", "嫡女", "医术", "破镜重圆", "古言权谋"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "通房好孕，绝嗣王爷儿女双全", "fullTitle": "通房好孕，绝嗣王爷儿女双全", "link": "https://fanqienovel.com/page/7641071479651585048", "data": [4.02, 4.6, 4.6, 14.05, 14.33, 14.33, 14.32], "trend": 10.3, "latest": 14.3, "wordNumber": 262601, "creationStatus": 1, "desc": "宣王成亲三年，妻妾成群，却无一人有孕。\n丫头春晓被选为王爷的通房，全府都笑她：一个丫鬟，还想攀高枝？怕是连蛋也下不出！\n谁料三月后，春晓吐得惊天动地。\n王妃羡慕得红了眼，侧妃气得连夜爬床，姨娘们更是花样百出、手段用尽。\n十月怀胎，一朝分娩。\n稳婆抱出孩子，全府哗然！\n这眉眼，竟与宣王毫无相似！\n皇帝龙颜大怒，亲自过问：“难道孩子像朕这个皇爷爷有错？”\n春晓摸着肚子，不慌不忙：“肚子里这个，肯定像王爷。”\n而此时，宣王正策马狂奔，八百里加急：\n“让开！通通让开！！”\n“本王要回家带娃！！！”", "tags": ["宫斗宅斗", "古代言情", "系统", "穿越", "今穿古", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "入宫即高位，我是陛下表妹我怕谁", "fullTitle": "入宫即高位，我是陛下表妹我怕谁", "link": "https://fanqienovel.com/page/7648256759785589784", "data": [54.05, 54.37, 54.37, 55.72, 56.2, 56.2, 55.16], "trend": 1.11, "latest": 55.2, "wordNumber": 238880, "creationStatus": 1, "desc": "宫斗+伪表兄妹+极限拉扯+攻心+训狗\n（新文，评分会涨的）\n昭启十年春。\n沈嘉玉被召入宫中，成了天子的妃妾。\n彼时后宫表面看似风平浪静，实则利害缠杂、暗流潜行。诸妃之间明争暗斗，百般算计，刚入宫的新秀们战战兢兢，只怕一个不小心，便会命丧黄泉。\n唯有沈嘉玉淡淡一笑，表示这有什么？\n不爽就打，不服就干。\n她有的是甩巴掌的力气和资本。\n今天打了有宠的容华！明天打了得势的贵嫔！后天更是打了掌权的四妃！\n整个后宫被她搅了个天翻地覆。\n沈嘉玉丝毫不惧。\n她是陛下表妹她怕谁？！\n毕竟，她和陛下之间的羁绊实在太深了。\n没了爱意，还有情分，没了情分，还有血缘。\n*\n对于这位娇纵表妹入宫，\n一开始寡情疏冷的帝王：金尊玉贵养着，别亏待委屈她就行。\n后来逐渐失控破防的帝王：朕那么喜欢你，你凭什么敢不喜欢朕！\n再后来，这位权御九州的帝王，匍匐在她的裙下，俯首称臣，卑微求爱。\n*\n阅读指南:封建大爹帝王vs娇纵跋扈表妹", "tags": ["宫斗宅斗", "古代言情", "皇后", "甜宠", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "叹金缕", "fullTitle": "叹金缕", "link": "https://fanqienovel.com/page/7629335999511792702", "data": [6.42, 6.98, 7.32, 7.13, 7.05, 7.05, 7.25], "trend": 0.83, "latest": 7.2, "wordNumber": 249475, "creationStatus": 1, "desc": "谁为嫡子？谁承宗事？\n自己这个正室嫡出，刚一出生就成了嫡次子，被已经记名的庶长子压了一头。\n沈照禅不大高兴。\n记名长子订亲太傅费氏。\n费氏女进门，亲娘郭氏婆婆的款儿还没摆，费氏眼珠一转先把沈照禅整得不得不离家。\n亲娘郭氏肝肠寸断，从此仿佛换了一个人，沈家乱象起。\n从沈照禅不得不入宫开始……到他一身紫袍，立于金阶之上，俯瞰群臣为止。\n十年亲如是，十年起伐异，几经生死，散尽亲友", "tags": ["宫斗宅斗", "古代言情", "古色古香"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "不好了！小姑她又又又尿床了！", "fullTitle": "不好了！小姑她又又又尿床了！", "link": "https://fanqienovel.com/page/7648549296605760574", "data": [3.92, 5.06, 5.06, 5.41, 6.05, 6.05, 7.1], "trend": 3.18, "latest": 7.1, "wordNumber": 136021, "creationStatus": 1, "desc": "【无CP+种田+空间+家长里短+发家致富+团宠】\n五十岁的张板山意外捡到一个小女娃，跟他死去的闺女一样，胳膊上都带着一颗红痣，他认为这一定是老天爷可怜他没有闺女，特意送还给他的。\n让人没想到的是，自打这个小女娃到了他们家之后，老张家日渐富足起来，张板山摸着下巴想，这或许都是闺女带给他们家的.......\n宝子们，评分是7月30号新出的，后期会涨，别受影响哈😊", "tags": ["种田", "古代言情", "乡村", "空间", "无CP", "发家致富"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [5.64, 6.39, 7.09, 7.51, 8.21, 8.21, 8.59], "trend": 2.96, "latest": 8.6, "wordNumber": 205342, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "刚和离就逃荒，我靠灵泉空间改命", "fullTitle": "刚和离就逃荒，我靠灵泉空间改命", "link": "https://fanqienovel.com/page/7633708095465589785", "data": [3.73, 4.08, 4.54, 4.85, 4.97, 4.97, 5.24], "trend": 1.51, "latest": 5.2, "wordNumber": 271747, "creationStatus": 1, "desc": "苏清禾穿进逃荒文，甩了原主的渣男丈夫，拿着休书和嫁妆回了娘家，当看到原主娘家人时，惊呆了，这也太瘦了，还老的老，小的小，还有一个腿脚不便的，只有一个月就逃荒了，他们不会死在逃荒途中吧！\n先看看吧！这些人要是不收留她，她就离开，自己去逃荒。\n原主娘亲：“清禾，你怎么回来了。”\n苏清禾回答：“我和离了。”\n全场沉默。\n然后集体安慰她，让她安心待在家里，有他们一口吃的，就有苏清禾一口吃的。\n苏清禾：她还挺感动的，都穷成这样了，还要给她从嘴里挤出粮食，她还怎么独自去逃荒呢？", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成农家公公，掌家后全家旺翻天", "fullTitle": "穿成农家公公，掌家后全家旺翻天", "link": "https://fanqienovel.com/page/7644575791358938174", "data": [4.1, 4.53, 4.9, 5.16, 5.23, 5.23, 5.32], "trend": 1.22, "latest": 5.3, "wordNumber": 273224, "creationStatus": 1, "desc": "【农家公公+小人物+穿越+家长里短+无系统+致富养家】\n现代保安大叔李平意外猝死，穿到了一个架空的朝代，成了村里人人欺负的窝囊老汉。\n原主懦弱糊涂，在家说了不算；老伴偏心、拎不清，儿媳争吵内斗，更被极品族人步步欺压，活活被一口气憋死。\n再睁眼，换了内里灵魂！\n从此立家规、正家风，专治拎不清老伴、刁蛮搅事儿媳；护着委屈勤恳大儿媳，疼惜面黄肌瘦小孙儿，把鸡飞狗跳的烂家一点点过起来。\n手握现代生活本事，开垦种田、养殖副业、做酱菜做生意\n把家徒四壁、欠债累累的家一路逆袭，囤田产、开商铺，暴富不愁吃喝\n外怼贪婪极品亲戚，内护一家老小安稳\n教儿子踏实立业，送孙儿读书科举\n一步步从贫苦农家，逆袭成四代同堂、书香富贵之家！\n从前人人嘲讽的窝囊公公，如今成了全家依赖、全村敬重的定海神针", "tags": ["种田", "古代言情", "乡村", "穿越", "虐渣", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成瘸妻，糙汉一路背我千里逃荒", "fullTitle": "穿成瘸妻，糙汉一路背我千里逃荒", "link": "https://fanqienovel.com/page/7657078209531350041", "data": [5.19, 5.62, 5.77, 5.95, 6.09, 6.07, 6.21], "trend": 1.02, "latest": 6.2, "wordNumber": 186712, "creationStatus": 1, "desc": "温四月一睁眼，穿成了逃荒路上瘸了腿的小媳妇。\n土墙、吃人、被扒衣裳，开局就差没写个“死”字。\n一个站不起来的废物，在这个人吃人的世道里，活着就是浪费粮食。\n所有人都等着看她什么时候咽气。\n偏偏那个糙得不会说一句软话的猎户相公，把她背上了逃荒路，他护她周全，替她出头，对她无微不至。\n逃荒路上，她开灵泉养人，他提刀护家。从两手空空的流民，到有了自己的田地、自己的寨子、自己的军队。", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绣娘嫁猎户，夫妻携手发家致富", "fullTitle": "绣娘嫁猎户，夫妻携手发家致富", "link": "https://fanqienovel.com/page/7656824616471497753", "data": [2.33, 2.45, 2.58, 2.68, 2.71, 2.71, 2.68], "trend": 0.36, "latest": 2.7, "wordNumber": 252977, "creationStatus": 1, "desc": "【种田+发家致富+温馨日常+家长里短+打脸+先婚后爱+甜宠+古言+双洁】\n无极品，放心入，男女主属于双向奔赴。\n——————\n刚及笄，沈棠就成了十里八乡的香饽饽，不是因为她爹多有能耐，而是她有一双能“生金”的巧手。\n一时间，提亲的人踏破了门槛，尤其是那新晋童生家，更是势在必得。\n可他们打的算盘，是让她进门当牛做马，用绣品换来银子供养他读书。\n眼看提亲不成，他们竟丧心病狂，设下毒计推她入河，想让那童生“英雄救美”，好让她名声尽毁，不得不嫁。\n冰凉的河水吞噬了她的呼救，绝望之际，却被一双铁钳般的大手捞起。\n沈棠后来才知道，这人竟是隔壁村那个家徒四壁，穷的叮当响的猎户，陆衍。\n当童生家两手空空，再次上门求娶的时候，陆衍提着重礼上了门。\n所有人都笑沈家疯了，放着好好的童生老爷不嫁，偏把闺女嫁给穷猎户？\n直到下聘那日，陆衍驾着牛车停在沈家门口。\n众人看着院子里放不下的聘礼、成套的首饰以及那对村里人家来说天价的聘银，众人说话的风向彻底变了。\n婚后，陆衍为她打造了一个完美的小家，两人相濡以沫，互相温暖，用自己的双手把小日子过的风生水起。\n而外人眼中那个冷硬如铁的猎户，关上门来，比谁都黏人。", "tags": ["种田", "古代言情", "发家致富", "打脸", "甜宠", "双向奔赴", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [2.71, 2.73, 2.73, 2.79, 2.83, 2.88, 2.92], "trend": 0.2, "latest": 2.9, "wordNumber": 232208, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "异世穿越", "兽世", "萌宝"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "笨蛋美人挺孕肚，搬空全京去流放", "fullTitle": "笨蛋美人挺孕肚，搬空全京去流放", "link": "https://fanqienovel.com/page/7647142493472951321", "data": [2.6, 2.88, 2.88, 2.82, 2.69, 2.69, 2.74], "trend": 0.14, "latest": 2.7, "wordNumber": 269685, "creationStatus": 1, "desc": "【种田+天灾+流放+虐渣+搬空+空间】\n修真界符阵宗师南穗穗渡劫失败，穿成临安侯府人人嫌弃的痴傻庶女，被迫替嫁给身中剧毒、双腿残疾的短命宁王冲喜。\n新婚夜，宁王剑指咽喉：“说，皇后派你来做什么？”\n南穗穗软乎乎歪头：“哥哥，要吃糖糖吗？穗穗有甜甜的糖糖哦……”\n宁王：……（这怕不是个真傻子？）\n婚后次日，南穗穗察觉王府死气萦绕，掐指一算，十日之内必遭抄家流放！\n南穗穗冷笑一声，反手画下百张搬运符，连夜搬空侯府，顺便将国库、帝后私库一扫而空！\n短短十天，她不仅囤够亿万物资，还顺手解了宁王的毒，揣着双胎崽崽踏上流放路。\n流放途中，别人啃树皮，她吃香喝辣，极品来找茬，宁王开启极致护妻模式。\n宁王：“我家夫人身怀六甲，谁敢惊着她，本王要谁的命！”\n被自家老祖宗显灵揍得脸肿如猪的仇家痛哭：“王爷！她召我老祖宗上来抽了我三百个巴掌，到底谁惊着谁啊？！”\n宁王：“我家夫人最怕打雷，一听雷声就往本王怀里钻。”\n被劈得外焦里嫩的刺客们嚎啕大哭：“王爷！那追着我们劈了三天三夜的九天玄雷就是她招来的！我们被劈成黑炭，她挺着大肚子在旁边用雷火烤红薯，这叫怕打雷？！”\n……\n柔弱是装的，满级大佬是真的，搬空全京去流放是让狗皇帝哭爹喊娘的！", "tags": ["种田", "古代言情", "空间", "虐渣", "天灾", "代嫁代娶"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "新婚夜换亲：搬空侯府去流放", "fullTitle": "新婚夜换亲：搬空侯府去流放", "link": "https://fanqienovel.com/page/7623793709213043736", "data": [4.81, 4.88, 4.97, 5.04, 5.08, 5.08, 4.85], "trend": 0.04, "latest": 4.9, "wordNumber": 137766, "creationStatus": 1, "desc": "在外漂泊十二年的医女季蓁蓁，回京履行婚约，嫁入荣平侯为世子夫人，哪知，婚礼当日，后母庶妹换了她的婚事，季蓁蓁将计就计嫁入二房，本打算过上一个无夫君的幸福生活。\n哪知婚礼当夜，太子被废，作为国舅爷的荣平侯府被抄家流放，季蓁蓁利用祖上传下来的戒指空间，搬空了国舅府及娘家，开开心心接受现实。\n一路上无视任何让她不爽的人，一粒药丸一根银针，药到病除，凭心而治，行医问药，银钱开道是她的规矩。\n她发现那个一心出家当和尚的夫君竟然是假冒的，而是逃亡的皇子，两人互为同盟，刺杀、山崩、黑店、铁矿、贪官……银子归她，兵器为他，两人一路扶持，渐生情愫。\n曾经的未婚夫、渣爹请离远些！\n后来……\n他们在蛮边建立自己的家园，成立自己的军队，收服蛮族，种出天下粮仓。 成熟矜贵的顶级大佬。\n即使外界谣传他手腕毒辣，阴鸷薄情，是实打实的疯子。\n可温穗却觉得他温柔体贴，开明稳重。\n完全长成了她期许的模样，与记忆中并无不同。\n他会随和地劝退她的追求者，消弭她与这个世界七年的隔阂，永远在她危险时第一个赶到……\n除了偶尔过剩的保护欲，裴聿礼什么都好。\n…\n直到定位器暴露，玩偶里抠出摄像头，卧室里的红色光点明灭…慌不择路的温穗误闯密室，看着关于她的近乎限制级的一切……\n脚步无声，停在身后。\n男人的呼吸扫在她耳廓，如往常温柔：\n“怎么自己跑过来了，穗穗？”\n“宝宝这么聪明，老公还怎么在你面前装好丈夫？”", "tags": ["豪门总裁", "现代言情", "青梅竹马", "大佬", "久别重逢", "位尊权重"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "青春甜宠": [{"label": "许南风，至今夏", "fullTitle": "许南风，至今夏", "link": "https://fanqienovel.com/page/7650515507505810457", "data": [11.23, 11.23, 15.27], "trend": 4.04, "latest": 15.3, "wordNumber": 198856, "creationStatus": 1, "desc": "刚出分，会涨！会涨！【生理性喜欢/偏执/占有/爱而且得/酸涩拉扯】\n豪门少爷避祸至石乔小镇。\n他干净、好看、冷漠、疏离。\n石乔高中的人都知道，夏梧死缠烂打，追着许应跑了一年。\n最后不知道用了什么手段占有了他。\n却死在了成为许太太后没多久。\n重生后的夏梧：\n要边界感吗？我给\n要独立行走吗？我滚\n不再依赖哥哥算长大吗？\n许应：你试试。\n那晚，一向对她严防死守的人，\n竟主动献上他尊贵的躯体。\n他微微后仰了脖颈，缓缓闭上眼睛。\n任由她上下其手。\n喉结翻滚间，他暗哑着声音问：\n“喜欢吗？”\n“都给你。”\n就在许应以为，\n这个爱作妖的女人会安心待在他身边，不再离开后。\n一张照片打得他猝不及防。\n照片中的少年眼神温柔缱绻，女孩眉眼弯弯。\n还真是般配得很。\n她为了保命，果断选择离开。\n被赶到的许应死死攥住手腕，眼底压抑着翻涌的情愫：\n“不是最爱我吗？”\n“继续演下去，不好吗？”\n……\n他跟她之间从来都是他的欲擒故纵，\n他爱她已经入了骨髓，\n只有深度占有，才能让震颤的灵魂得以安定。\n我把整个灵魂都给你，连同怪癖、坏脾气与一千八百种毛病，它样样糟糕，唯独一件事很好：爱你。", "tags": ["青春甜宠", "现代言情", "总裁", "重生", "学霸", "豪门世家"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "给网恋对象发辣照，京圈太子爷疯", "fullTitle": "给网恋对象发辣照，京圈太子爷疯", "link": "https://fanqienovel.com/page/7661859477653572670", "data": [14.61, 16.08, 17.01], "trend": 2.4, "latest": 17.0, "wordNumber": 147606, "creationStatus": 1, "desc": "双洁+甜宠+京圈太子爷+校园小甜妹\n姜岁岁有个秘密，她在交友软件上养了个“化石学长”当树洞。\n学长人狠话不多，字写得好看，还有八块腹肌。\n为了逗他，姜岁岁发了张紧身小吊带辣照。\n配文：“哥哥，我的腿好看吗？”\n对面秒回：“换掉。”\n姜岁岁以为他是个老古板。\n直到.....", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "双洁", "位尊权重"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都重生了，谈什么恋爱，别耽误我", "fullTitle": "都重生了，谈什么恋爱，别耽误我", "link": "https://fanqienovel.com/page/7657181647405599768", "data": [8.44, 10.08, 10.84], "trend": 2.4, "latest": 10.8, "wordNumber": 196522, "creationStatus": 1, "desc": "重生/搞钱/女强/1v1/无系统金手指\n\n前世，她是江南韩家养女，十八岁被归来的真千金驱逐，只换来两千万补偿。\n\n空有豪门教养，却满身恋爱脑。她轻信他人、深陷杀猪盘，短短数年散尽家财。最终为爱卑微纠缠，惨死街头车祸。\n\n一朝重生少年时，韩栀彻底清醒。\n\n情爱虚妄，暴富为王道！这一世她斩断情丝，紧盯时代风口，一心搞钱逆袭。\n\n可谁曾想，素来矜贵淡漠、遥不可及的京都顶级太子爷，却日日黏在她身后，步步纠缠、疯狂偏爱。\n\n韩栀无奈摆手：谈恋爱？ 麻烦让一让，别耽误我赚钱！\n", "tags": ["青春甜宠", "现代言情", "重生", "女强", "1v1", "位尊权重"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成捞子前女友和男主网恋翻车后", "fullTitle": "穿成捞子前女友和男主网恋翻车后", "link": "https://fanqienovel.com/page/7643442671926660158", "data": [9.32, 9.32, 10.91], "trend": 1.59, "latest": 10.9, "wordNumber": 240389, "creationStatus": 0, "desc": "【网恋掉马+真香打脸+男主为爱发疯+微墙纸爱】\n【钓系小白花vs疯批天之骄子】\n—\n黎岁穿成校园文男主的炮灰捞子前女友。\n不仅胸大无脑，而且虚荣拜金。\n原书中，男主是顶级豪门继承人，天之骄子，被前女友用假照网恋，骗钱骗心断崖式分手后。\n最后男主重逢同频优秀的白富美青梅，才懂得什么是真爱。\n意识到自己纯纯是男女主play的一环。\n黎岁手撕剧本：什么傻逼设定？狗都不干！\n下一秒。\n看着钱包空空的余额和涌上来的催债短信。\n看着男主备注自愿赠与的大额转账。\n黎岁咬牙切齿：狗不干…我干！\n不就是网恋吗？我恋！不就是捞钱吗？我捞！\n—\n后来，青梅女主出现。\n黎岁识趣死遁跑路。\n对谢屿白拉黑删除一条龙贴心服务后，从此人间蒸发，不打扰男女主恩恩爱爱酿酿酱酱。\n……\n没多久，金碧辉煌的别墅里。\n黎岁想逃，却被谢屿白捞回怀里接吻，眸底兴味十足，薄唇微启不紧不慢逼问道。\n“小骗子，费尽心思玩我，就是为了这点钱？”\n“……宝宝不是喜欢钱吗？老公有很多钱。”\n“乖宝宝，全都吃下去了呢。”\n黎岁刚想尖叫。\n又被男人惩罚的吻狠狠堵了回去。\n救命！\n说好的炮灰女配剧本！怎么成强制爱了？", "tags": ["青春甜宠", "现代言情", "总裁", "穿越", "豪门世家", "位尊权重"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "暗恋对象说他喜欢乖乖女！", "fullTitle": "暗恋对象说他喜欢乖乖女！", "link": "https://fanqienovel.com/page/7645303606110850073", "data": [15.52, 16.42, 16.92], "trend": 1.39, "latest": 16.9, "wordNumber": 256552, "creationStatus": 0, "desc": "（已完结）【安静温软乖巧x又酷又拽会撩】\n【大学校园+男一见钟情+女暗恋成真+甜撩+双洁HE】\n季辞夜，天之骄子般的存在。\n喜欢他的女生更是不计其数，林雾桐就亲眼撞见过一场表白。\n去往KTV卫生间的走廊里，有女生甜着声音问他喜欢什么类型的女孩。\n片刻沉默后，她清晰的听见了两个字，“乖的。”\n-\n林雾桐，典型的乖乖女，又乖又纯。\n在一场生日宴上，她无意闯进了一间休息室，又误打误撞看见了正在换衣服的季辞夜。\n慌忙道过歉后就想逃离，却被男生截住退路。\n耳边落下一记撩人的低笑。\n季辞夜一边系着衬衫纽扣，一边慢条斯理道，“看都看了，想一走了之？”\n\n——\n毕业两年后，风云人物季辞夜再次踏入京大校园。\n满心崇拜她的学妹一脸好奇又惊讶的问，“学长，您怎么突然回学校了？”\n季辞夜：“来接女朋友。”\n想当初，季校草有神秘女友一事在京大传的沸沸扬扬，任谁都没有扒出女生信息。\n如今学妹大着胆子追问，“是之前和您传绯闻的那个女朋友吗？”\n银色戒指在阳光下泛着耀眼的光芒，男人唇角弧度肆意不羁，“嗯，是她。”\n一直都是她。\n也只有她。\n他生涩的爱恋，懵懂的悸动，想要共此一生的心，都只属于一个人。", "tags": ["青春甜宠", "现代言情", "校园", "暗恋", "HE", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "财阀继承人的古董女友", "fullTitle": "财阀继承人的古董女友", "link": "https://fanqienovel.com/page/7640366369896156185", "data": [22.16, 22.16, 23.39], "trend": 1.24, "latest": 23.4, "wordNumber": 249408, "creationStatus": 1, "desc": "思想传统才华横溢的江南冰美人VS占有欲极强的财阀继承人\n江南世家嫡女沈词自幼体弱多病，从未踏出过沈宅大门。二十多年的人生，她见过的郎中比见过的外男还要多。\n生命结束后，再醒来时，她穿进话本子里，成了书中那个冒领女主救命之恩、用恩情绑架男主成为自己男朋友的恶毒女配。\n话本子中，原主为了真正上位，无数次作妖，最终落得被退学、父亲生意破产的凄惨下场。\n沈词决定：先稳住男主，不作妖，不争不抢，安静当背景板。等男主主动提分手，等书中真正的女主出现，她就能脱身离开，在这个新世界安安静静地活下去。\n她太擅长等待了。她在深宅大院里等了二十多年，最不缺的就是耐心。\n然而，当书中的真女主终于出现，沈词觉得时机成熟，忍不住小心翼翼地提出了分手。\n房间里，男主喘息着将她死死抵在墙边，眼底翻涌着令人心惊的暗潮，声音沙哑而危险：\n“还敢提分手吗？”\n也是在这一日，沈词与半疯的男主，差点儿无媒而合。\n沈词这才惊恐地意识到——\n她等来的不是解脱。\n而是一个疯子彻底撕开伪装的时刻。", "tags": ["青春甜宠", "现代言情", "总裁", "穿越", "大佬", "位尊权重"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "不是说好不喜欢她的吗", "fullTitle": "不是说好不喜欢她的吗", "link": "https://fanqienovel.com/page/7652377925588634686", "data": [11.22, 11.55, 11.8], "trend": 0.58, "latest": 11.8, "wordNumber": 137146, "creationStatus": 1, "desc": "（刚出评分后面会涨）黑暗+黑泥+强制爱+男全洁+万人迷+疯批+偶尔论坛体+修罗场+强取豪夺+1vn多男主\n\n\n“伊伊，你爱我吗？”\n“宝宝，宝宝，我好爱你，你爱我吗？”\n“伊宝宝，宝贝，宝宝妻子，老婆，老婆你说话啊。”\n“嘘。”\n“说不爱的话，我们可是会很伤心的哦。”\n\n不是说好不喜欢她的吗？\n为什么他们都疯成这样？", "tags": ["青春甜宠", "现代言情", "校园"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我，怂且恶毒", "fullTitle": "我，怂且恶毒", "link": "https://fanqienovel.com/page/7613572197243685950", "data": [6.18, 6.39, 6.65], "trend": 0.47, "latest": 6.6, "wordNumber": 213545, "creationStatus": 0, "desc": "【女主重生+男主系统】\n【怂且恶毒窝窝囊囊干坏事女主x口嫌体正直男妈妈男主】\n云落没想过她这种人还  "borderWidth": 2}, {"label": "杀死那个春夜", "fullTitle": "杀死那个春夜", "link": "https://fanqienovel.com/page/7477468603504135230", "data": [4.62, 4.64, 4.65], "trend": 0.03, "latest": 4.6, "wordNumber": 291361, "creationStatus": 0, "desc": "【酸涩救赎｜禁忌背德｜纯恨变纯爱｜对抗路｜校园微群像｜小镇｜1v1双洁】\n【白切黑装货✖️刺儿头犟种】\n起初，她讨厌他的虚情假意，他讨厌她的油盐不进。\n人前兄友妹恭，人后争锋相对。\n后来，假意里生出真心。\n他们攀附在彼此脆弱的脊背上生长，脚下的根系连理枝般盘根错节、纠缠不清。\n第二年春节。\n路朝在温迎的房间里步步紧逼。\n门外依稀传来春节联欢晚会热闹开播的声音，还有爸爸和许阿姨的笑声，温迎头皮发麻，手心燥热，盯着近在咫尺的少年，低声提醒：“他们就在外面。”\n路朝顽劣轻笑：“怕什么。”\n印象中，家里的电闸跳过两次。\n一次他们在打架，一次在接吻。\n*\n人总是会在年少时干出点惊天动地的事儿。\n赢下这场比赛，是她少女时代最伟大的英雄主义。\n“你每次嘴上说着远离我，眼睛里却全是救救我。”", "tags": ["青春甜宠", "现代言情", "双洁", "1v1", "群像", "白切黑"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "嫌他穷？重欲太子爷按哭恶毒前妻", "fullTitle": "嫌他穷？重欲太子爷按哭恶毒前妻", "link": "https://fanqienovel.com/page/7637546200119397401", "data": [13.59, 13.59, 17.6], "trend": 4.01, "latest": 17.6, "wordNumber": 152855, "creationStatus": 1, "desc": "【先荤后爱+出租屋文学+重欲偏执小狗+1v1双向救赎】\n章月破产了，相亲时嫌弃地把柠檬水泼在穷小子江远辞脚边。\n刚骂完他算什么东西，出门就被催债大汉堵进死胡同，江远辞拼死替她挨了三闷棍。\n就在她准备跑路时，发现靠近江远辞一米内就有剧透弹幕：\n【打卡未来首富的贫民窟时期！】\n【呵呵，恶毒前妻嫌他穷，最后瞎眼断腿被撞死！】\n啥？我是下场凄惨的恶毒前妻？\n这个内裤松得能跑马的穷鬼是未来千亿首富？！\n章月一把按住发高烧的江远辞：“我们现在就去领证！”\n“我穷得只剩一条命，你图什么！”\n面对极度自卑、以为她要卷款跑路的阴湿小狗，章月强行同床。\n“我图你鼻子大、图你手指长！”\n从摆地摊到小商品批发，章月夜夜数钱。\n重欲丈夫声音暗哑：“老婆别数钱了，回头看看我。”", "tags": ["现言脑洞", "现代言情", "宠妻", "先婚后爱", "独宠", "发家致富", "忠犬"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小炮灰变美后，抢了财阀太子爷", "fullTitle": "小炮灰变美后，抢了财阀太子爷", "link": "https://fanqienovel.com/page/7654572647035964440", "data": [68.81, 71.06, 71.22], "trend": 2.41, "latest": 71.2, "wordNumber": 246068, "creationStatus": 1, "desc": "【穿书 + 贵族学院F4 +  娇柔大美人 + 勾引上位】\n冷厉傲慢第一财阀太子爷（193cm） × 纯欲娇柔炮灰大美人（168cm）\n铃兰小花妖渡劫失败，本该魂飞魄散，却意外绑定了炮灰系统，穿进一本贵族学院小说，成了同名小炮灰。\n原剧情里，她是女主林晓葵的好朋友，对照组的配平工具人。\n对花心浪子温衍一见钟情，深情不移，最终嫁入豪门。\n可甜文结局的背面，是浪子永不回头，是情人和私生子登堂入室，是小产后再也不能生育，是抑郁而终。\n而她的好姐妹林晓葵，却嫁给了第一财阀太子爷司凛，人人称羡。\n穿过来那天，阮棠看着镜子里灰扑扑的原主。\n再看她灵魂带来的属性点：冰肌玉骨、倾城之貌、杨柳细腰、内媚天成……\n每一样都是她原本拥有的东西，但没有气运值，一样也解锁不了。\n而这个世界的气运，集中在圣澜学院执事团的四个天之骄子身上，尤其是执事之首：司凛。\n阮棠想得很清楚：既然要蹭气运，为什么要蹭温衍那个浪子的？\n要蹭，就蹭最大的那个。\n排雷：F4贵族文学，非NP，不买股。", "tags": ["现言脑洞", "现代言情", "系统", "穿书", "豪门世家"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "厉爷养的花成精了", "fullTitle": "厉爷养的花成精了", "link": "https://fanqienovel.com/page/7652399106245020734", "data": [9.03, 10.09, 10.87], "trend": 1.84, "latest": 10.9, "wordNumber": 185742, "creationStatus": 1, "desc": "（新书）【媚骨天生霸道妖兰×刀尖舔血狠厉上位者丨身心双洁，养成系，上位者低头】\n他养了三个月的妖精兰，一朝化成人形。\n她蜷在他脚下，唇边沾着一抹红，桃花眼迷蒙地望着他：“这是什么？好甜。”\n他是海城最狠的厉爷，不信鬼神，不信命，却为一株花破了三次戒——养她，纵她，要她。\n她喊饿，他放血。\n她说冷，他拥她入怀。\n她不懂人间事，他耐着心思一步步教。\n直到那一夜，她趴在他颈侧，汲取了他的血气，也触到了他骨血深处不该碰的东西……\n他捏住她下巴：“再贪不该贪的，我就把你的根，从花盆里挖出来。”\n——\n后来圈里传，厉爷养了株妖兰，宠得没边了。\n厉司丞听着没否认，只偏头问她：“今晚还要不要喝？”\n她舔了舔唇，眼尾绯红：“……要。”\n\n她是他的血养出来的妖，也是他这辈子唯一的因与缘。\n（女主控放心观看，纯甜无虐）\n（文风轻松跳脱，诙谐幽默，不爱看勿入！！）\n（很甜！！甜的发腻！！不爱看甜的勿入！！）", "tags": ["现言脑洞", "现代言情", "双洁", "精灵", "幻想言情", "双向奔赴", "情有独钟"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "双重生后，我考公上岸了", "fullTitle": "双重生后，我考公上岸了", "link": "https://fanqienovel.com/page/7660718439375326233", "data": [9.08, 9.08, 10.3], "trend": 1.22, "latest": 10.3, "wordNumber": 175920, "creationStatus": 1, "desc": "苏沅重生了，回到22岁那年夏天。\n前夫也重生了，转身牵了别人的手。\n苏沅：懂了，各走各的路。\n考公上岸，入职省直单位，日子清闲体面。外加绑定一个每周秒杀系统，养元丹、储物空间、股票情报，该有的都有。\n他奔他的前程，我过我的日子。\n这一世，为自己活。", "tags": ["现言脑洞", "现代言情", "系统", "重生", "前世今生", "双重生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕：世民无长兄，朱棣无大侄", "fullTitle": "天幕：世民无长兄，朱棣无大侄", "link": "https://fanqienovel.com/page/7663091475009260569", "data": [7.46, 7.46, 8.58], "trend": 1.12, "latest": 8.6, "wordNumber": 129157, "creationStatus": 1, "desc": "【天幕+剧透历史+女主工具人+无CP+随机视频】\n天空一声巨响，闪电顺势劈下。\n高考完骑着电动车回家的的萧筱乐，幸运的成为了小倒霉蛋。\n她不知道的是，闪电同时击中了她的手机。\n手机没有任何损伤，却将她的手机同步到了华夏各个时空，从秦汉，到明清。\n嬴政：扶苏手握三十万大军自杀？\n李渊：世民无长兄？\n朱元璋：老四无大侄？\n假的，都是假的。\n后来。\n快剧透朕的朝代！\n这个飞机咱想要，这个机器狗咱也想要。\n水泥怎么制造！\n后世小儿还不速速献上计策！", "tags": ["现言脑洞", "现代言情", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都重生了，谁还整容装假千金啊", "fullTitle": "都重生了，谁还整容装假千金啊", "link": "https://fanqienovel.com/page/7641428978921638936", "data": [6.15, 6.62, 6.91], "trend": 0.75, "latest": 6.9, "wordNumber": 248831, "creationStatus": 1, "desc": "【评分新出，还会涨，各位大人不要放弃我】\n【重生+校园+多男主+日常+治愈甜宠】\n前一秒从手术床上永远闭上眼的许洛茵，下一秒又从自家床上醒来。\n她摸着自己原装的脸和稍微有些肉嘟嘟但干净的胳膊，笑了。\n重生一世，她回到了十八岁那年，一切还没开始。\n这一世，她没被“好闺蜜”拉去开眼界，没被拉着硬挤进那些高贵的富二代千金圈子。\n干干净净的的学习和生活，过完自己先天心脏病那注定短暂的一生。\n想不到这样的生活反而引来了系统青睐。\n只要她拥有足够多的网恋对象的恋爱值，就能兑换美貌、健康、智商甚至是财富。\n健康！！！\n美貌！智商！财富！\n那还说啥了，谈！\n往死里谈！\n这一世，她只想认真生活，不再追求虚妄的一切，踏踏实实积攒恋爱值，把自己变得更好，反而把自己活成众人眼中的光。", "tags": ["现言脑洞", "现代言情", "校园", "系统", "重生", "甜宠"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "人类饲养员：自己的老婆自己养", "fullTitle": "人类饲养员：自己的老婆自己养", "link": "https://fanqienovel.com/page/7657302630409964569", "data": [11.13, 11.13, 11.74], "trend": 0.61, "latest": 11.7, "wordNumber": 138119, "creationStatus": 1, "desc": "【新书刚开分，后面会涨】\n好吃懒做怂包女主VS严谨到变态的外星男主\n【人外，强制爱，触手】\n昭晨好被包养了，不对，被饲养了。\n也不对，准确来说，是被一个不明生物饲养了。\n这个有着人类外表却时不时能够变换形态的“人”强行带走她，成为了她的饲养员。\n为了照顾好她，严格地按照人类饲养手册执行。\nViner：必须早睡早起。\n长期日夜颠倒的昭晨好：“……”\nViner：一日三餐必须吃。\n饮食毫无规律的昭晨好:“……”\nViner：要适当的运动。\n能躺绝不坐着的昭晨好:“喂！这算哪门子运动！”\nViner一本正经：“适当的亲密关系运动也是运动。”", "tags": ["现言脑洞", "现代言情", "幻想言情"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越星际兽世：成为虚拟偶像顶流", "fullTitle": "穿越星际兽世：成为虚拟偶像顶流", "link": "https://fanqienovel.com/page/7655195003299318809", "data": [9.54, 9.54, 10.0], "trend": 0.46, "latest": 10.0, "wordNumber": 196303, "creationStatus": 1, "desc": "【星际兽世+主事业线无CP+非女强文，妹宝女主（有明月独不照我情节）+雌少雄多+万人迷+雄竞+系统】\n云岁穿越到了雌少雄多的星际兽世。\n\n\n\n云岁穿越前身体已经火化。\n\n系统绑定她后，用最后能量保住了她的灵魂带她穿越，要重新造出身体需要100亿星币能量。\n\n由于系统规则，虽然它的科技水平大于这个世界的水平，却不能做违法乱纪的事情，只能云岁自己想办法赚钱获得身体。\n\n云岁眼前一黑，虽然不知道1星币多少钱，但100亿就让人感觉人生无望了，其实当阿飘挺好的。\n\n系统却告知由于雌性在星际兽世过于稀少，现在很流行虚拟偶像，是大流量，操作好会很赚钱。\n\n云岁为了拥有新身体，注册了成为恋爱向虚拟偶像。\n\n想原来世界，恋爱向抽卡类虚拟偶像都很赚钱，云岁磕绊在系统的掩护下大胆出击，给这个荒芜的精神世界带来一次次的精神盛宴。\n\n每一次的打歌，舞台，综艺，影视，联动，都引爆全网。\n\n后来云岁拥有了最大的后援会。\n\n云岁生日当天全国大屏庆生。\n\n云岁联动全星铁刷屏。\n\n成星际兽世第一顶流。\n\n众多位高权重的大人物不相信这么完美的云岁是虚拟偶像，世人觉得他们疯魔，查探证明她是真的，结果越扒越有！\n最后云岁掉马。", "tags": ["现言脑洞", "现代言情", "系统", "穿越", "星际", "无CP"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "陆总的小桃花超甜哒", "fullTitle": "陆总的小桃花超甜哒", "link": "https://fanqienovel.com/page/7647676784783150142", "data": [5.03, 5.03, 5.33], "trend": 0.3, "latest": 5.3, "wordNumber": 255531, "creationStatus": 1, "desc": "（1V1架空甜宠文，双洁，软糯桃花精VS高冷腹黑醋王，带一点玄幻色彩，但不多）\n江清梨本是灵界勤勤垦垦修炼千年的桃花精，却在渡劫时意外丢失一魄。\n阴差阳错之下，那一魄竟然在人间转世成人，为了魂魄归位，江清梨只好用元神和人间体融合，在人间历劫一世。\n江清梨对陆君骁一见钟情，就想着如何把人拐回去做夫君。\n“陆君骁，你有娘子了吗？”\n陆君骁：“我不娶妻。”\n江清梨大胆求娶：“哦，那阿梨能娶你吗？”\n陆君骁睨着眼前大言不惭的女孩，笑了。\n“娶我？一百亿。”\n江清梨从兜里掏出仅有的一块钱，“定金，你现在是阿梨男朋友了，等赚够一百亿就娶你！”\n陆君骁：“……”\n\n后来——\n江清梨苦着脸，“陆君骁，一百亿好像有点多，阿梨能不能先付个首付娶你？”\n陆君骁：“多少？”\n她心虚伸出一根手指，“一亿？”\n“准了。”", "tags": ["现言脑洞", "现代言情", "位尊权重", "甜宠", "腹黑", "一见钟情", "幻想言情"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "掉进苗疆后成了圣子的蛊妻", "fullTitle": "掉进苗疆后成了圣子的蛊妻", "link": "https://fanqienovel.com/page/7656975286092696600", "data": [7.13, 7.13, 7.43], "trend": 0.3, "latest": 7.4, "wordNumber": 172476, "creationStatus": 1, "desc": "    【1v1双洁+偏执男主+占有欲+苗疆蛊术】\n\n    【清冷寡言苗疆圣子vs人类学女研究生】\n\n    周茸茸不过是摔了一跤。\n\n    从树上掉下来，喝了一碗酒，系了一根红绳，稀里糊涂就成了圣子的妻。\n\n    她以为这是意外，是倒霉，是运气不好。\n\n    直到他把一条软体的虫子放进她体内，笑着对她说——\n\n    这辈子，你都是我的人了。", "tags": ["现言脑洞", "现代言情", "幻想言情", "双洁", "1v1", "风水秘术"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：关于我的吸引疯批体质", "fullTitle": "快穿：关于我的吸引疯批体质", "link": "https://fanqienovel.com/page/7637132188705639486", "data": [5.84, 5.89, 5.99], "trend": 0.15, "latest": 6.0, "wordNumber": 157939, "creationStatus": 1, "desc": "【强制+1vn 】\n温念身上有个专门吸引疯批的光环，不是真正的疯批不会中招，而且还是永久性的。\n好在世界上还是正常人居多。\n不好在她总能遇到不太正常的人。", "tags": ["现言脑洞", "现代言情", "学霸", "校园", "一见钟情", "情有独钟", "系统"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [5.86, 5.86, 5.87], "trend": 0.01, "latest": 5.9, "wordNumber": 231358, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "保姆我在富贵窝里看冷暖", "fullTitle": "保姆我在富贵窝里看冷暖", "link": "https://fanqienovel.com/page/7646938862643579928", "data": [9.97, 13.19, 13.12], "trend": 3.15, "latest": 13.1, "wordNumber": 277294, "creationStatus": 1, "desc": "Hello，书友们好～我是王拉弟，一个爱记录、爱唠嗑的保姆。\n\n“不算计，能在别墅里挣上钱吗？”——可我这算计啊，都在心里，厚道嘛，得摆在脸上。\n\n我骑着那辆破二手电驴，进过500平的大铁门。见过高贵女主人背地里的眼泪，偷听过美丽太太心里的肮脏；这一家表面光鲜，那一家内心宽容。种种不同，我都见过……\n\n可我也得低头——低头看着丈夫那条伤腿，低头数着儿子的学费，还得低头闻一楼飘上来的那股子馊臭味。\n\n大强子总劝我：“嘴牢，装傻，把钱挣了。”\n\n可当我推开那扇门，才发现——这人间烟火太烫嘴，这世态炎凉太扎心，我又怎能真的视而不见？\n\n我这一辈子，在别人的屋檐下躲过雨，也在自家的车库里生过火。人说三十年河东，三十年河西，我看惯了高楼起，也看厌了宴席散。到头来才明白：那呛人的烟火味，才是活着的底气。\n\n——谨以此书，献给我中国普通的母亲，也致敬每一位用力活着的平凡人。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短", "第一人称"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真千金她从军了", "fullTitle": "真千金她从军了", "link": "https://fanqienovel.com/page/7634576516210232345", "data": [8.42, 8.42, 10.9], "trend": 2.49, "latest": 10.9, "wordNumber": 299589, "creationStatus": 1, "desc": "【女频➕军旅➕女强➕无CP➕成长➕大力】\n祁今越死了！死在精神病院洁白的病床上。鲜血淌满床单，她的手里还握着一把生锈的剪刀。\n祁今越又活了！白幡飘动的灵堂上，养父母的音容笑貌在脑海里一帧一帧回放。\n她还是一个无依无靠的可怜虫！！\n车轮不断向前，再一次站上那片熟悉的土地，心境却是大不相同了。\n这辈子，她走上了一条与前世截然相反的道路——参军！\n入伍前夕，陆家沸腾，愤怒的父母、看好戏的大哥、假惺惺的“姐妹”、拍手叫好的小弟，祁今越将他们脸上的表情牢牢刻进心底，却没有生出一丝波澜。\n丛林、草地、大海、雪山、沼泽都留下她的足迹，汗水腥咸、血液粘稠都不能阻挡她的脚步。\n若干年后，祁今越平步青云，接受最高程度的奖赏，陆家父母激动上前，眼中迸射出贪婪的光芒。\n“孩子，你辛苦了，我们……”\n“我们认识吗?”祁今越脸上没有任何表情。", "tags": ["职场婚恋", "现代言情", "重生", "豪门世家", "前世今生", "真假千金"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "触礁对岸", "fullTitle": "触礁对岸", "link": "https://fanqienovel.com/page/7542096272866413630", "data": [6.54, 6.54, 8.11], "trend": 1.57, "latest": 8.1, "wordNumber": 257384, "creationStatus": 1, "desc": "评分刚出，可能会涨哈哈\n姜柠是顶级学府本硕博八年制的医学生，学医，博士buff叠满\n巨大压力之下，她养成了一点无伤大雅但不好宣之于口的小爱好\n本来她还处于精神放飞但是行为保守的状态，直到她毕业那年，压力过大，她忍不住对一个认识了一年多的网友发起了邀请\n网友不仅长的好，身材也好\n两天两夜，姜柠吃饱喝足后删除拉黑，潇洒走人\n答辩那天，那位传说中导师死对头的答辩主席端坐主位，赫然是那个和她在酒店待了两天两夜的男人！\n而他还即将成为她的顶头上司，领导的领导\n\n一只伤痕累累但铁骨铮铮的小狐狸遇见了心软的神\n一个端方君子第一次谈恋爱就被骗身骗心为爱发疯的故事\n\n1v1双c，男女主都很纵yu。\nhappy ending \n本人不学医，所有的东西都是按自己的想法设定的，不实的地方千万不要当真啊\nPS：作者有一直在修文，完善前后逻辑，如果有宝宝看到内容有变化是正常的喔，爱每一个看文的宝宝", "tags": ["职场婚恋", "现代言情", "职场", "医生", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲相到高中物理老师", "fullTitle": "相亲相到高中物理老师", "link": "https://fanqienovel.com/page/7654979133981608985", "data": [5.73, 5.73, 6.3], "trend": 0.57, "latest": 6.3, "wordNumber": 181188, "creationStatus": 1, "desc": "沈书言的十七岁，有两个解不开的难题。 一个是物理，一个是尚睿。\n他是隔壁班的物理老师，穿白衬衫很好看，讲题的时候声音很低。 她不是他班的学生，但是总喜欢在他们班物理下课的时候去等闺蜜，借此看一眼他。\n拍毕业照那天，想跟他单独合影，但是没有理由，她以为这就是结局。\n四年后。 她是楼管，他是一个普通的顾客。 四目相对的那一刻，她听见自己心跳的声音。 \n更离谱的是 —— 过年回家相亲，对面坐的人，又是他。\n尚睿看着她，眼底带着诧异： \"好久不见？。\"\n原来不是她一个人的独角戏；\n原来物理题不会没关系；\n原来他在身边，就够了。", "tags": ["职场婚恋", "现代言情", "久别重逢"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [6.14, 6.14, 6.65], "trend": 0.51, "latest": 6.7, "wordNumber": 216192, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都市：一撞成婚", "fullTitle": "都市：一撞成婚", "link": "https://fanqienovel.com/page/7645558905812028441", "data": [3.11, 3.43, 3.61], "trend": 0.5, "latest": 3.6, "wordNumber": 220113, "creationStatus": 1, "desc": "夏沐在二十五岁那天和程氏集团总裁程青砚领证了。\n夏沐和柴珩相恋三年，今天是两人约定好领证的日子，夏沐在民政局等了一个小时，还不见柴珩的身影，她掏出手机给柴珩打电话，对方没接，随后给她发了一条消息：【对不起小沐，雪儿她生病了，我们改天再领证吧。】\n陆雪儿，柴珩的青梅竹马。\n夏沐看着这条消息，愣了半天，嘴角扬起一抹自嘲的笑容：“还是输了啊！”随后她收拾好自己的证件，转身朝着门外走去。\n程青砚刚下飞机，便被自己母亲的一通电话叫来了民政局，他走到门口，刚准备伸手去推门……\n夏沐一拉开门，便撞进了一个人的怀里，她鼻尖嗅到了一股淡淡的松木香气，\n“你没事吧？”\n头顶传来一道清透温润的声音。\n夏沐抬起头看着眼前的人，她眨了眨眼睛，“先生，有兴趣领个证吗？”", "tags": ["职场婚恋", "现代言情", "总裁", "先婚后爱", "豪门世家", "医生"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "清冷万人迷每个世界都被强取豪夺", "fullTitle": "清冷万人迷每个世界都被强取豪夺", "link": "https://fanqienovel.com/page/7624910386143169598", "data": [4.96, 5.31, 5.43], "trend": 0.48, "latest": 5.4, "wordNumber": 260070, "creationStatus": 1, "desc": "新书刚开分 读者宝宝说会涨૮₍♡>𖥦<₎ა💗  \n 82246425", "data": [4.79, 4.79, 5.11], "trend": 0.32, "latest": 5.1, "wordNumber": 256831, "creationStatus": 0, "desc": "【清冷医生vs乖张网红】　\n【年上DADDY·年龄差八岁·青梅竹马·先婚后爱】\n宋鹤眠娶了亲手带大的小姑娘。\n两家世交，娃娃亲，他大她八岁。她从穿纸尿裤起就是他看着长大的，幼儿园接送、小学开家长会、初中辅导作业……她人生的每一个阶段，都有他的影子。\n江稚：我现在是个成熟的大人了！\n宋鹤眠：成熟的大人会在凌晨两点因为空腹吃布洛芬被送进急诊？\n江稚：……那是意外。\n宋鹤眠：成熟的大人会连续一周每天只睡四个小时？\n江稚：……我那是工作忙。\n宋鹤眠：成熟的大人会把自己的工资卡花得一干二净，连余额都说不出来？\n江稚：……\n宋鹤眠：成熟的大人会……\n江稚：停停停，你是老大，你说了算！\n——　\n一句话简介：“我的太太，是我一手养大的。以前管我叫哥哥，现在管我叫老公。”", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "医生", "年龄差"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "社恐乖乖女意外怀了红毛的崽后", "fullTitle": "社恐乖乖女意外怀了红毛的崽后", "link": "https://fanqienovel.com/page/7648331109100440638", "data": [8.7, 8.78, 8.96], "trend": 0.26, "latest": 9.0, "wordNumber": 259670, "creationStatus": 1, "desc": "「温柔乖乖女×红毛小伙」「双洁×偏日常×病娇×出租屋文学」\n听说了吗？\n那个一头红毛特拽的小伙，把他网恋两年的女朋友搞怀孕了。\n人家姑娘打了十次胎都没打掉。\n最后还给他生了个闺女。\n——\n有时候，一个人爱你爱到骨子里，会害怕失去。\n害怕到想用最笨的方式，把另一个人死死锁在身边。\n哪怕手段卑劣，哪怕面目狰狞，哪怕她恨他。\n潜意识里，摧毁对方，可能是为了阻止她离开，或者让她永远只属于你一个人。\n就像《茶花女》里写的：\n“我是这样爱她，以致在我极度兴奋的爱情之中，我曾想到，要不要杀了她，这样她就永远不属于别人。”\n——\n不要问甜不甜，就像问你男朋友爱不爱你一样，没有任何意义，只有试过了才知道。\n注：【文里涉及到的任何行为，以及不好的台词，请理智阅读，这是小说，不要代入现实】", "tags": ["职场婚恋", "现代言情", "追妻火葬场", "虐恋情深", "破镜重圆", "情有独钟"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，我不再做小城乖女儿", "fullTitle": "重生后，我不再做小城乖女儿", "link": "https://fanqienovel.com/page/7658113549268421656", "data": [3.43, 3.46, 3.62], "trend": 0.19, "latest": 3.6, "wordNumber": 203539, "creationStatus": 1, "desc": "【重生觉醒+一步一个脚印+无金手指+女性独立+女强+成长】 \n蔡庭芳死在四十一岁那年。\n她这一生，听父母的话，放弃大城市高薪工作，回县城当“稳定”的乖女儿；听亲戚的话，嫁给“条件不错”的男人；听丈夫的话，顾家、带娃、伺候老人；听单位的话，加班、背锅、替人收拾烂摊子。\n最后，她病倒在医院，丈夫计较治疗费，婆婆嫌她拖累家里，父母还劝她忍一忍。 \n直到死的那一刻，蔡庭芳才发现，一辈子的逆来顺受，只给她带来了一生悲剧。\n难道我生来就该死？连活下去都要看别人脸色？这一切到底凭什么！\n再睁眼，她回到二十四岁那场相亲饭局。周家端着架子说：“女人结婚后，还是要以家庭为主。”\n所有人都等着她点头。\n蔡庭芳只做了三件事。退婚。拿回工资卡。拖着行李箱搬出家门。\n她没有系统，没有空间，没有天降贵人，也不靠彩票暴富。\n她只有一张余额六千八的银行卡，一间月租六百五的小 ienovel.com/page/7645232910252919870", "data": [5.94, 5.94, 6.54], "trend": 0.6, "latest": 6.5, "wordNumber": 141566, "creationStatus": 1, "desc": "【温柔老实妹宝×冷漠偏执龙龙】\n【双洁+1V1+人外+男强女弱+体型差+一见钟情+温馨治愈】\n（简介是儿子殷珩视角）\n殷珩重活一世，回到一千年前，只有一个任务：阻止爹娘相爱。\n他娘是世界上最好的人，他爹是条脑子有病的龙。\n在上一世，娘亲嫁给他爹没几年就去世了，他不想让娘亲重蹈覆辙，即便自己也会消失。\n好消息是：他重生得够早，两人根本不认识。\n坏消息是：不管他怎么阻止，那龙还是来了，而且对娘亲一见钟情。\n不仅如此，追人的方式还笨得要命：\n今天送灵石，明天往她枕头底下塞银票，后天面无表情地站在她家门口，开口就是：“我没家了，能收留我吗？”。\n云绵一脸茫然：“这位公子，我并不知道您是怎么了。”\n殷珩坐在屋顶上看着这一切，心情愉悦，甚至还想鼓掌。\n追姑娘追成这样，也是种本事。\n殷珩觉得这开局稳了，就他爹这个追法，不把娘吓跑才怪。\n可云绵偏偏觉得殷寂“挺有意思的”。\n某天，她拉着殷珩问：“阿珩，你了解隔壁那位殷公子吗？他这个人虽然奇怪，但好像…还挺不错的。”\n殷珩两眼一黑，苦口婆心地劝：“…不怎么样，他长得丑，心也黑，不是良配！”\n云绵羞赧：“你胡说，他长得不丑。”\n殷珩站在原地，仰头望天。\n他明明是回来拆散他们的。\n怎么变成助攻了？", "tags": ["玄幻言情", "独宠", "幻想言情", "宠妻", "团宠", "双洁", "HE"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "男主为爱发疯，但你只想好好活着", "fullTitle": "男主为爱发疯，但你只想好好活着", "link": "https://fanqienovel.com/page/7652408518770691096", "data": [7.36, 7.36, 7.88], "trend": 0.52, "latest": 7.9, "wordNumber": 255931, "creationStatus": 1, "desc": "【强调：本文为黑泥向纯代入乙女，有大量g向恐怖描写，男主神经病非人类较多，不要用正常三观对待】\n穿越后，你没有得到金手指，也没有万人迷光环，甚至被某个变态给缠上了。\n什么？他是气运之子，天道宠儿？\n可这个世界是疯掉的世界，气运之子也都是疯子。\n所以你选择了逃跑。\n那就请在保住命的情况下确保自己不被抓住吧。\n\t\n他说他会吃掉你，从头到脚，拆吃入腹。", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我死后竟成了堕神白月光", "fullTitle": "我死后竟成了堕神白月光", "link": "https://fanqienovel.com/page/7644508917321452569", "data": [9.03, 9.27, 9.45], "trend": 0.43, "latest": 9.5, "wordNumber": 237966, "creationStatus": 1, "desc": "（清冷美人x深情疯狗）\n（1v1双洁、年下、青梅竹马、前期忠犬后期变疯狗）\n整个青玄宗都知道云鸢师姐和谢昭师弟二人青梅竹马、从小一起长大，感情好的羡煞旁人。\n直到最近众人发现了不对劲，原本感情极好的二人不知何时起彼此疏远，许久未曾一同出现过。\n有弟子忍不住好奇问谢昭他和云鸢师姐是不是吵架了？\n一向就话少的少年没回答，只是沉着脸死死盯着不远处和新入门的弟子聊着正欢的少女……\n*\n一场梦后，沈云鸢才知道原来她是一本男频升级爽文里男主的早死白月光。\n男主谢昭身为龙族后裔，天生至纯灵体，万分珍贵，六岁时被人带回宗门作为药引活着，只为医治那人灵脉受损的女儿，而沈云鸢就是那人的女儿。\n他之所以对她心生好感，也只是因为她体内有他灵血的缘故，待真正与他相配的女主出现后，他会毫不犹豫将她摁进泥里，一剑捅死。\n于是为了助他飞升，也为了赎罪，她自愿死在他的剑下，还他一场造化。\n多年后，沈云鸢再次重降于世，看着本应位列仙班的男人竟成了令三界众生都闻风丧胆的堕神恶鬼。\n漆黑的夜幕之下，男人踏着血雾而来，冰冷寒凉的手抚上她的脸，赤红的眼眸中流露着浓郁的哀怨与仇恨：“师姐，为什么不要我？”", "tags": ["玄幻言情", "古代言情", "忠犬", "白切黑", "1v1", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "休了四个兽夫后，我契约了六个", "fullTitle": "休了四个兽夫后，我契约了六个", "link": "https://fanqienovel.com/page/7557391657260289086", "data": [4.99, 5.23, 5.41], "trend": 0.41, "latest": 5.4, "wordNumber": 258933, "creationStatus": 1, "desc": "（穿越+大佬+兽魂+强制契约+升级流+1vN）\n林清蕴修炼千年的灵符师，穿到第一天，以为自己拿的是女强爽文剧本。\n直到她低头一看——无灵根，蜗牛兽魂，凡品垫底。\n四个契约兽夫嫌她废物，把她扔在贫民区铁皮房里自生自灭。\n亲妈把她扫地出门，亲妹设局陷害，路过的人都要啐一句“丢人”。\n林清蕴：“……这剧本不对吧？”\n还没等她反应过来，直接被驱逐青云城，四名兽夫更是要解除契约。\n怂是不可能怂的，解，必须解，留着你们这些白眼狼干嘛？\n所有人都等着她死在城外。却不知她体内藏着上古紫凤兽魂。\n当晚六道契约天光散落大陆\n冰霜巨龙的主人低笑：\"魂契?有意思。\"\n地下黑场的铁塔硬汉红着眼眶：\"有人要我了?\"\n最高监狱里，锁链寸断的少年抬起头，露出一双极深的凤眸。\n而轮椅上的男人，捻着一朵蓝楹花，笑得温润如玉：\"妻主?\"\n林清蕴：......我现在退契还来得及吗?男人，只是取悦她的工具罢了。", "tags": ["玄幻言情", "幻想言情", "穿越", "大佬", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "美人师尊翻车后，惨遭两次囚禁", "fullTitle": "美人师尊翻车后，惨遭两次囚禁", "link": "https://fanqienovel.com/page/7654038704800926744", "data": [5.67, 5.67, 6.07], "trend": 0.4, "latest": 6.1, "wordNumber": 197397, "creationStatus": 1, "desc": "【修仙师徒+锁链警告+强制爱+1v3+男全洁】\n江棠以神尊和妖尊的身份收了两个徒弟。\n一个是妖族少尊主，拥有九幽玄蛇血脉，肉身强悍，能越境战斗。\n一个是仙族神君，天生剑骨，以杀问道，以战破境。\n他们哪哪都好，就是有个缺点，占有欲太强，都想做她唯一的徒弟。\n江棠一直藏得很好，他们互相不知道对方的存在，互相以为是她的唯一。\n不料因为一个香囊，她翻车了，而且恰巧还失了修为。\n他们变得陌生，变得肆无忌惮。\n相貌妖异的少尊主将她囚于氤氲的温泉池中，强逼她陪他照着书籍练习。\n“尊师重道还有另一层意思，师尊想听听吗？”\n光风霁月的神君将她囚于方寸的马车内，强逼她直视颠簸无退路的困境。\n“师尊，你是逃不掉的。”", "tags": ["玄幻言情", "穿越", "腹黑", "今穿古", "大佬", "剑修"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "魔法：被迫组队后高冷队长沦陷了", "fullTitle": "魔法：被迫组队后高冷队长沦陷了", "link": "https://fanqienovel.com/page/7649235070481353753", "data": [7.95, 7.95, 8.31], "trend": 0.37, "latest": 8.3, "wordNumber": 240002, "creationStatus": 1, "desc": "【高智商傲娇巫族公主VS高冷禁欲灵族公爵】\n魔法+言情+团队救世\n朗瓦西星球有三类人：会魔法的灵者、作战强的曜士、通巫术的巫主\n三千年前，灵、曜两族诞下五灵守护者，对灭世的不死女巫艾拉进行世代封印\n三千年后，新一届守护者诞生，五位圣灵者肩负救世使命。\n巫族公主蒂泠，出了名的任性，翘课、炸学校、学禁术\n然而，一则消息震惊世界\n蒂泠成了三千年来第一位来自巫族的圣灵者——智之灵\n让“恶霸”拯救世界？\n众人：谁说看不见星球的未来？这不是一眼就看到头了\n灵息学院，\n所有人都想进的三族最强学府，一心摆烂的蒂泠被强制保送\n灵息优等生缪辞，是灵族最年轻的公爵，也是众望所归的五灵守护者队长玄之灵\n蒂泠来前：高冷，沉稳，尽在掌握\n蒂泠来后：头疼，善后，怀疑人生\n算了，赶紧封印艾拉，大家好聚好散\n…\n一次意外，蒂泠灵印消失，决定独自离开。\n黑暗的房间内，她被吻的喘不过气，用力推开他，“队长，我不是圣灵者了，好聚好散吧。”\n男人眼尾浸红，额头贴着她的耳朵，薄唇轻吻她的脸颊，“你觉得呢？我的公主殿下。”\n撩也撩了，摸也摸了，要负责了，人就跑了\n女孩理亏的偏过头，缪辞都气笑了，指尖扣住她的下颌，迫使她面对自己，学着她曾经恶劣的语气\n“不接话？那就接吻。”", "tags": ["玄幻言情", "校园", "幻想言情", "星际", "冰山", "双洁"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙崽心声曝光后，六界都不好了！", "fullTitle": "龙崽心声曝光后，六界都不好了！", "link": "https://fanqienovel.com/page/7626321035767335961", "data": [8.35, 8.49, 8.63], "trend": 0.28, "latest": 8.6, "wordNumber": 228534, "creationStatus": 1, "desc": "【双洁1V1+全员读心+三界团宠+养崽撒糖+轻松救赎无虐】\n高考前夕，叶黎惨遭人间至恶！\n辛苦打工攒下的学费被表妹偷走，舅舅舅妈颠倒黑白，将他打伤后像丢垃圾一般赶出家门。\n无依无靠，遍体鳞伤的他，本以为人生就此落幕，却意外绑定天道救赎系统，重生成了一颗圆滚滚的至尊龙蛋！\n更炸裂的是，他的‘生母’，是六界闻风丧胆的妖族至尊夜无咎！\n别人出生被父母捧在手心，他刚出生，就被妖神亲爹拎在手里，扬言烤蛋，煮汤，直接丢掉！\n为了活命，叶黎只能装乖卖萌，破壳后化身软糯小奶团，日日花式吹捧讨好傲娇亲爹。\n系统给他开辟了吃瓜功能，本想安稳躺平吃瓜做顶级妖二代！皇二代！\n可系统惊天大瓜直接震懵他，他还有一个爹！\n另一个爹是清冷出尘的仙界仙尊楚云鉴！\n而楚云鉴，是夜无咎不共戴天的死对头！\n一边是暴躁别扭，嘴硬心软的妖神父神，\n一边是清冷温柔，禁欲圣洁的仙尊父尊。\n缺爱半生，执念有家的叶黎，化身三界最强月老，疯狂花式撮合双亲，在线维和！\n不曾想，天道选中他，本就是宿命安排。\n他对“家”的纯粹执念，竟是化解仙妖魔万年恩怨的唯一解药！\n从此，曾经任人欺凌的小可怜，逆袭成仙妖魔团宠！\n双大佬争锋护崽，全员读心吃瓜围观宠崽！\n崽有CP！后期主要剧情线！\n", "tags": ["玄幻言情", "重生", "团宠", "双洁", "1v1", "养崽"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小师妹绿茶满级，修真遍地是她鱼", "fullTitle": "小师妹绿茶满级，修真遍地是她鱼", "link": "https://fanqienovel.com/page/7620916926272785470", "data": [3.65, 3.65, 3.92], "trend": 0.27, "latest": 3.9, "wordNumber": 245818, "creationStatus": 1, "desc": "【强制爱1vN+万人迷+顶级绿茶+疯批xp阴暗+修罗场乱炖+男全洁】\n慕折枝穿成了强制爱修仙文里的恶毒女配。\n系统下达任务：【三十天内夺取剑宗首席谢不逾元阳，否则魂飞魄散。】\n慕折枝：？\n初次勾引，她捧着海棠花装作跌倒。\n谢不逾扶住她，雪色广袖拂过她手腕：“小心。”\n她刷存在表白，兢兢业业攻略，谁料被拒。\n此后，她认真当恶女，水性扬花，却不知后来——\n妖主勾走她发间簪：“小月亮，缠着古板剑修做什么，选我。”\n魔尊将噬魂珠串成手链戴在她腕间：“枝枝，它替我陪你。”\n就连佛子都为她破了戒：“若你愿意，我可还俗。”\n慕折枝：？？？\n-\n是夜，朝三暮四的慕折枝误中情蛊，在温泉边发抖，眼尾猩红，薄衣透骨。\n月光下，谢不逾慢条斯理脱下衣服，清冷面庞满是滔天欲念：\n“枝枝，你怎么敢假死骗我们呢？”\n-\n三界盛会，复活的慕折枝被疯狗们围堵。\n谢不逾当着众人面将锁魂铃系在她脚踝。\n“别选了，枝枝，你谁都逃不掉。”\n一场为她而起的修罗混战，一触即发。\n原著万人迷女主愣在原地：\n“可按照天命，你们明明都该爱我！”\n众人却同时抬眸：“你也配。”\n慕折枝：救命！男主们全崩人设追了上来！\n后来，长辈骂她不知廉耻，世人夸她驭夫术强，即便她祸水多情，也个个排队当狗。", "tags": ["玄幻言情", "幻想言情", "反派", "穿书", "古代言情", "团宠"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被迫退学的我绑定了打卡成仙系统", "fullTitle": "被迫退学的我绑定了打卡成仙系统", "link": "https://fanqienovel.com/page/7638640284493958168", "data": [3.79, 3.79, 4.02], "trend": 0.23, "latest": 4.0, "wordNumber": 277464, "creationStatus": 0, "desc": "【现代修仙+升级流+女主团宠+校园+系统+空间+无CP】\n龙国灵气复苏，所有人都以修仙者为荣。\n但林羡偏偏穿越到了祖上18代都是平民的大家庭中，成为那个虽美但渣，且自私自利、好吃懒做的小姑子。\n此刻的林羡，不仅被退学，还面对着家破人亡的风险。\n好消息，她绑定了一个系统。\n坏消息，这个系统好像是个半成品。\n没办法，林羡只好撸起袖子加油干！\n第一步，先制造一个储物袋。\n第二步，成为全龙国最大的储物袋供应商。\n她带着全家人一起发家致富。\n只是为何？身边会有那么多奇奇怪怪的人黏上来啊啊啊！\n\n———场景———\n【叮！监测到宿主到达冷湖图书馆，是否打卡？】\n林羡？？？\n“打卡！”\n【恭喜宿主获得图书馆自习室使用时长240小时！（注：在自习室学习时，外界时间静止！）】\n【恭喜宿主获得《不灭灵体》天阶炼体功法……练成后肉身不灭，断肢可重生；肉身湮灭，神魂不灭。】\n\n———\n排雷：\n1.前期家庭日常多，无脑爽文，请不要带脑子看\n2.10万字后才开始校园篇，校园有无脑打脸情节\n3.不是那种传统的无cp，有男角色追求女主、对女主一见钟情等的情节，不喜勿点，千万别点\n4.男性角色可能偏多（也有女性厉害的角色），男女角色比例大概64开，甚至73开\n", "tags": ["玄幻言情", "校园", "系统", "空间", "团宠", "无CP"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "万人迷在耽美世界生存法则", "fullTitle": "万人迷在耽美世界生存法则", "link": "https://fanqienovel.com/page/7632222540525489176", "data": [4.0, 4.0, 4.21], "trend": 0.21, "latest": 4.2, "wordNumber": 144594, "creationStatus": 1, "desc": "新书。谢春慈一觉醒来穿越到了一个奇怪的修仙界。\n这里不但阴阳失调，男男相恋大行其道，似乎暗地里还在酝酿着惊天秘密。\n而曾经眼高于顶不可一世的男人们，遇见谢春慈后，一个接一个都疯了。\n昔日师徒，离心。\n恩爱情侣，相残。\n亲密父子，反目。\n这些男人们挣来抢去闹个不停，恨不得互食血肉，到头来所求的其实不过是她的爱而已。\n谢春慈懵懵懂懂闯入这个扭曲的世界，却吝啬地不肯施舍一点真心。\n她要让这些伤害过她的人，永生永世困在苦海，不得往生！\n玛丽苏真万人迷但纯恨女主×各种各样单箭头的男人。\n真弯掰直，所有人都会爱上女主，包括且不限于男情侣/师徒/父子/好兄弟为了女主互相残杀。\n【世界背景为极端男尊女卑，女主无外挂，有微强制，黑泥！虐文，一点都不爽，全世界都有病，随时随地大小疯】\n初版简介：\n谢春慈莫名其妙穿进了一个修仙的耽美世界里。\n在这里，几乎所有的男人都喜欢男人。\n在男人为主导的世界，女人为男人们惊天动地的爱情摇旗呐喊感动流泪，却看不到自己卑贱如泥被男人狠狠踩在脚下。她们泯灭自我，沦为拼凑世界的装饰物。\n而谢春慈……她本只想和救命恩人一起平凡的度过此生，但这个可恶的世界不放过她，毁了她最爱的一切", "tags": ["玄幻言情", "穿越", "打脸", "今穿古"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁入敌对魔宗，师兄们悔疯了", "fullTitle": "死遁入敌对魔宗，师兄们悔疯了", "link": "https://fanqienovel.com/page/7624911114781854745", "data": [3.1, 3.1, 3.24], "trend": 0.14, "latest": 3.2, "wordNumber": 272394, "creationStatus": 1, "desc": "【新书刚出评分都低，会涨】\n宁浅浅为师兄们倾尽一切，为守护宗门甚至不惜献祭毕生修为。\n一路躺赢的小师妹动动嘴皮子就成了大女主。\n她却成了师兄们口中的毒妇，师尊眼里的孽徒。\n结局是——作为妖女被小师妹一剑刺穿。\n而她守护的“家人们”都护在小师妹身前，冷眼看着她死，拍手叫好。\n不曾想，另世人闻风丧胆的魔宗竟在闻讯后倾巢而出，将这些贱人全都挨个杀了刮了活剥了。\n阴戾冷血的大佬们为她敛尸，杀人如麻的宗主更是亲自为她立了碑。\n “宁浅浅，你我只是立场不同，可你……也不该被蝼蚁这般践踏。”\n再次睁眼，宁浅浅重生了。\n她决心做出跟前世完全对立的选择。\n欺师灭祖！加入敌对魔宗！", "tags": ["玄幻言情", "幻想言情", "重生", "前世今生", "剑修", "古色古香"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠抽卡系统装高手", "fullTitle": "我靠抽卡系统装高手", "link": "https://fanqienovel.com/page/7654641611606854718", "data": [4.1, 4.1, 4.23], "trend": 0.13, "latest": 4.2, "wordNumber": 293114, "creationStatus": 1, "desc": "仙门大比，我随手从怀里掏出一把古琴\n全场寂静。\n大师兄颤声：“那是……失踪百年的凤栖琴？”\n我波澜不惊，又从头发上随手取下一根发簪。\n大师姐尖叫:“那是神器青芜簪！”\n后来全修仙界都在传，林执月有一整个随身洞府，藏着无数上古灵器乃至神器。\n只有林执月知道，她这身时装是系统送的。\n今天想穿“烟落叠翠”，明天就穿“流火绯星”，至于后天——\n死系统突然弹窗：【限时卡池“九天玄女”开启，抽齐整套可解锁飞行特效，机不可失！】\n我看着卡池里48个部件以及需要氪金的面部妆容和头发陷入了沉思。\n评分刚出，会涨的，小宝们🥹", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "异世穿越", "魂穿"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [3.91, 3.91, 4.0], "trend": 0.09, "latest": 4.0, "wordNumber": 272804, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [5.47, 5.52, 5.53], "trend": 0.06, "latest": 5.5, "wordNumber": 194037, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生另投师门成团宠，你们气什么", "fullTitle": "重生另投师门成团宠，你们气什么", "link": "https://fanqienovel.com/page/7637353004902911038", "data": [3.74, 3.74, 3.76], "trend": 0.02, "latest": 3.8, "wordNumber": 282662, "creationStatus": 1, "desc": "前世，乔月被妹妹觊觎她的极品单灵根，妹妹自导自演陷害她，害她被师父挖了灵根，沦为魔修，最后还被妹妹害死，被师兄抽了灵魂拘在妹妹的百鬼帆，折磨百年。\n　　被人从百鬼幡救后，她竟回到被挖灵根那一日！\n　　灵根已经被挖，她第一时间激发了隐灵根，重生长出来的居然是万年难得的全系完美灵根！\n　　师门害她，不仁不义，她转头拜前世恩人为师，成为残峰最小师妹。\n　　以为只是逃离被害的被迫选择，却不想成了残峰的团宠。\n　　大师兄送她花不完的灵石和法器，二师兄送她用不完的阵盘，三师兄送她嗑不完的丹药，四师兄送她守护傀儡。\n　　残峰师兄弟以为新来的小师妹是小可怜，却发现小师妹强得可怕。\n　　极品丹药从来没有人练出来过？小师妹能练！\n　　净化师只能净化妖兽肉？小师妹她还会净化魔气、鬼气！\n　　种植师只能种普通灵植？小师妹可以种仙植！\n　　最最厉害的是，万年没有人会的画符，小师妹她也手到擒来！\n　　那个谁谁谁，我们小师妹这么优秀，你们气什么？\n　　后悔？晚了！", "tags": ["玄幻言情", "幻想言情", "重生", "穿越", "团宠", "前世今生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿成末世炮灰，被重生大哥娇宠了", "fullTitle": "穿成末世炮灰，被重生大哥娇宠了", "link": "https://fanqienovel.com/page/7650061683078990873", "data": [9.76, 9.76, 10.82], "trend": 1.05, "latest": 10.8, "wordNumber": 161292, "creationStatus": 1, "desc": "【末世+穿书+空间+打脸+囤物资】\n【穿书女+重生男】\n苏小满穿成了末世文里的炮灰——男主早死的未婚妻。\n开局末世爆发，被男女主推出去引丧尸，书里原主不仅毁容，还险些丧命。\n苏小满直接开大。\n谁惹的祸谁背！！\n反手捅破男主拥有异能的秘密，嘲讽他贪生怕死，顺手抢回原身母亲的遗物。\n——女主的空间。\n“你俩不就是他想睡你，你想被他睡，王八配狗，天长地久。”\n划清界限，疯狂囤货。\n一通电话打破了平静。\n“我是陆晏之，三日后我到，一天时间出现在我面前，否则当你死了。”\n苏小满这才想起，原身名义上的大哥，在书里战力逆天。\n带领众人逼退丧尸王，可惜在书里最后一次丧尸潮中陨落。\n这金大腿。\n她抱定了！！\n——\n陆晏之上辈子视命令高于一切，始终冲锋在前，一次意外全军覆没。\n死后灵魂不散，才知晓一切不过是怀璧其罪，反倒让某人捡了便宜。\n重生携异能归来，他火速囤物资、寻队友，事事抢先一步。\n可偏偏出现了一个变数。\n“哥哥，真是物资吗？”\n“哥哥，后面好像有燃油。”\n“哥哥……”\n——\n陆晏之忍无可忍，一把将人按在床上，“说，你到底是谁。”\n苏小满：“……”\n完了，好像演过头了。", "tags": ["科幻末世", "穿越", "空间", "末世", "囤物资", "打脸"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成大家族唯一雄虫崽崽后", "fullTitle": "穿成大家族唯一雄虫崽崽后", "link": "https://fanqienovel.com/page/7655640799404641305", "data": [3.79, 3.79, 4.81], "trend": 1.02, "latest": 4.8, "wordNumber": 162298, "creationStatus": 1, "desc": "懵懂的温柏小崽崽百无聊赖，小爪子轻轻敲了敲蛋壳，只听咔嚓一声脆响，蛋壳直接裂出一道大缝。\n温柏看着眼前裂开的缝，当场吓懵，圆乎乎的身子缩成一团，心里慌得不行，完了完了，把自己住的房子敲碎了！委屈巴巴的哭声瞬间响彻孵化室。\n负责看守孵化舱的雌虫闻声赶来，一低头看见蛋壳里那只细软的小雄虫崽，当场僵在原地，瞳孔地震。\n他手忙脚乱按响最高级警报，声音都在发抖：“警报！孵化舱出现雄虫幼崽！”\n要知道他们塞万提斯家族底蕴雄厚、支系庞大，近百年来都没能降生一只雄虫，全族上下早就做好了雄虫血脉断绝的准备，这颗蛋当初机器检测失误，才被归类成普通雌虫卵。\n族里权势滔天、上一辈仅存的雄虫卡西亚收到警报，整个人直接呆立几秒，等反应过来，连外套都来不及整理，疯了一样朝着孵化室狂奔，满心都是自家来之不易的小雄崽。\n蛋壳里的小不点还啥都不懂，只知道周遭全是陌生虫子，吓得只顾着嗷嗷大哭，完全不知道自己成了整个大家族捧在手心、盼了几代的宝贝疙瘩。", "tags": ["科幻末世", "穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末世作精女配勾引疯批哥哥", "fullTitle": "末世作精女配勾引疯批哥哥", "link": "https://f
