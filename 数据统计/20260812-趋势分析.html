rend": 1.4, "latest": 8.4, "wordNumber": 222029, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [2.08, 2.41, 3.01], "trend": 0.93, "latest": 3.0, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.86, 4.1, 4.37], "trend": 0.51, "latest": 4.4, "wordNumber": 268707, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夫君战死五年归来：我携婆家出族", "fullTitle": "夫君战死五年归来：我携婆家出族", "link": "https://fanqienovel.com/page/7654779071276010520", "data": [2.0, 2.16, 2.2], "trend": 0.21, "latest": 2.2, "wordNumber": 172968, "creationStatus": 1, "desc": "【女强+团宠+萌宝+绝不回头+加破案+微科举】\n刚升为公安局长的林玉娘穿越了，刚成亲三天，夫君裴元骏就被征兵去了战场，不到三个月就传来了夫君战死的消息。\n这时，林玉娘发现自己怀孕了，前世活了三十多年，连个男人的手都没牵过，这才多久，她肚子里已经喘着娃了。\n裴家父母和小叔子、小姑子都对她很好，不久她就生了一对龙凤胎。\n不光养活了裴家一家人，还送小叔子去书院读书，送小姑子去学刺绣的手艺。\n就连自己生的一对双胞胎她也给他们请了启蒙的夫子，村里人人羡慕裴家娶了一个能干又孝顺的儿媳，可惜是个命苦的。就当日子越来越好时，那个战死五年的夫君成了将军回来了，见面就要和离，林玉娘根本就不在乎这个夫君，只要不和她抢孩子，和离就和离，可让她没想到的是，裴家父母和小叔子、小姑子为她打抱不平，既然说不通，那就把儿子逐出族谱，断绝父子关系。可人家已经是正三品的大将军，族长不同意把他逐出族谱，公爹下定决心，带着他们一家自请出族，小叔子中状元，裴元骏使手段，把他贬到黄县为县令，黄县是整个大同最贫困的县，在叔嫂两人的治理下，成了整个大同最富裕的县。只是那个被贬的皇子天天来串门是怎么回事儿？\n", "tags": ["种田", "古代言情", "乡村", "萌宝", "女强", "科举"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成被休悍妇，边关种田养娃致富", "fullTitle": "穿成被休悍妇，边关种田养娃致富", "link": "https://fanqienovel.com/page/7655592418057653272", "data": [2.07, 2.04, 2.27], "trend": 0.21, "latest": 2.3, "wordNumber": 205759, "creationStatus": 1, "desc": "评分刚出，会涨，勿在意\n（边关开荒种田+空间+灵泉+木系异能）\n俗话说升官发财死老婆。\n江棉棉睁眼就成了那个将死的老婆。\n外室进门，男人嫌她是个黄脸婆随便捏了个不孝婆母的罪名。\n还没断气就被扔到外面等死，\n儿女也被赶到柴房给外室的孩子腾位置。\n呵呵。\n她江棉棉是谁，末世满级大佬，怕你一个陈世美。\n“和离。”\n她带着儿女媳妇离开。\n分家后，她靠木系异能卖草药很快赚了第一桶金。\n抓到野鸡，每天喂它喝灵泉水，噗噗下蛋。\n打死野猪，正好卖给别人办婚事用。\n老大夫妇心灵手巧，绝版编织书搞起，编的东西风靡边关，挣的盆满钵满。\n老二力大如牛，教他功夫去从军，战无不胜。\n老三脑子活，最聪明，教她识字经营，成为大燕朝第一女皇商。\n顺便再救救落难的小男主和被虐待的阴毒小反派。\n想让他们当外室女儿对照组，不可能，\n谁牛逼谁说了算。", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "发家致富"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "霸王龙孵蛋，窝里混进一只没毛崽", "fullTitle": "霸王龙孵蛋，窝里混进一只没毛崽", "link": "https://fanqienovel.com/page/7660296197348789272", "data": [8.28, 8.51, 8.46], "trend": 0.18, "latest": 8.5, "wordNumber": 260766, "creationStatus": 1, "desc": "【刚开分，会涨的！无CP+团宠文+沙雕日常+方言恐龙+侏罗纪】\n古生物学女博士穿越了，没穿成公主，也没穿成女将军。\n而是穿成了侏罗纪一只霸王龙巢穴里，三颗蛋旁边凭空多出来的……光溜溜人类幼崽。\n霸王龙妈低头看了一眼，用纯正东北话说：\n\"哎呀妈呀，这崽咋回事儿？薅吧薅吧毛都没有？……算了，搁我窝里的，都是我的！\"\n不是！真不是你生的啊！！\n更离谱的是，这里的恐龙全都会说话，而且每种恐龙说的方言还不一样：\n三角龙邻居操着四川话串门：\"你屋头那个没得壳的崽崽又在哭哦？要不要喂点草？\"\n翼龙大姨用粤语从天上飘过：\"靓女！你睇住你啲细路啦！又爬上树嘞！\"\n腕龙长老一口山东味儿：\"俺寻思这小东西咋恁聪明嘞？是不是俺们祖先变的？\"\n而沈鹿只想搞清楚一件事：\n——为什么她一个人类，能听懂所有恐龙的方言？？？\n霸王龙爸爸每天叼猎物回来：\"闺女！爹给你逮的！新鲜的！\"\n三只崽子抢着往她身边挤：\"姐！今天驮你去河边！\"\n沈鹿随手编个筐，恐龙界手工业萌芽了。\n沈鹿随手搭个窝，恐龙界建筑学起步了。\n沈鹿随手种个果子，产量大到腕龙吃撑。\n全侏罗纪的恐龙都传疯了：霸王龙家那只没毛崽，是个宝贝。\n沈鹿：我就想安静静当", "tags": ["种田", "古代言情", "穿越", "团宠", "无CP", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "愚孝爹逼别演了，我娘弟开荒暴富", "fullTitle": "愚孝爹逼别演了，我娘弟开荒暴富", "link": "https://fanqienovel.com/page/7657897844791053337", "data": [1.9, 1.98, 2.04], "trend": 0.15, "latest": 2.0, "wordNumber": 204482, "creationStatus": 1, "desc": "【穿越+致富+家长里短+美食+枯土异能+微群像+无 CP】\n\n    穿成被黑心奶卖身的小可怜，开局便是死局，末世女姜梨暴揍全家。都说老实人最可怕，便宜爹愚孝伪善，极品奶爱作妖，姜梨带着娘分家精神出户。\n\n    手握金手指枯土赋灵，荒山变粮仓，死地生万物。\n\n    分家后，黄土种地，遍山采药。\n\n    渣爹跪求原谅？滚。和离书、断亲书，一次性断干净。从今往后，天高任鸟飞，谁也别想欺负她半分，带着村民一起把日子过起来最重要。", "tags": ["种田", "古代言情", "乡村", "穿越", "美食", "发家致富"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破庙通古今，小乞丐们有救啦！", "fullTitle": "破庙通古今，小乞丐们有救啦！", "link": "https://fanqienovel.com/page/7650351395756837912", "data": [2.8, 2.86, 2.94], "trend": 0.14, "latest": 2.9, "wordNumber": 291877, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+群像文+温馨日常+无极品+无cp】\n逃荒路上，弹尽粮绝，\n小瑶的爹娘卖完两个姐姐又想卖掉小瑶。\n小瑶连夜逃跑，跑到闹鬼的破庙。\n鬼再可怕也没有人可怕，\n原来破庙住着装神弄鬼的小乞丐。\n无粮无水五个小乞丐快要饿死之际，小瑶向破庙内神像求救，绑定快要报废的通古今交易系统。\n五个底层小人物，与废物统子共同携手，摸爬滚打，靠着古今穿越的奇遇，一步步努力，成为有饭吃，有衣穿，有屋住的小小大人物。\n（PS：前几章写五人的相识和小乞丐在古代底层社会生存的不易，想直接看古今穿越的可以从第五章开始看。\n前期小瑶，小满，狗蛋，虎子，乌川五个孩子都是主角，都会穿现代，后期还会有小瑶姐姐夏一，夏二的加入。\n希望大家能爱上这些性格不同，但一样善良可爱懂事的孩子）", "tags": ["种田", "古代言情", "萌宝", "穿越"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全村逃荒流失所，我独深山囤粮肉", "fullTitle": "全村逃荒流失所，我独深山囤粮肉", "link": "https://fanqienovel.com/page/7659219704237542425", "data": [4.18, 4.38, 4.31], "trend": 0.13, "latest": 4.3, "wordNumber": 166011, "creationStatus": 1, "desc": "评分刚出，大家莫慌！！！\n\n【种田+系统+空间+囤粮+深山+基建】\n陆枕筠穿越了，刚穿来，就面临全村逃难，她被丢下的命运。\n外人以为，一个十四岁的小姑娘：生活困苦，举步维艰。\n实际上的陆枕筠，堪称捡漏之王：\n粮食，捡捡捡！\n银钱，捡捡捡！\n保暖衣物，捡捡捡！\n山中宁谥，岁月静好。\n陆枕筠一边种田，一边捡漏，顺手打造了一个世外桃源。\n叮！恭喜宿主，安全领地扩展五百米，一千米，两千米，五千米……\n多年后，众人诧异。\n当初那个瘦不拉几，面黄肌瘦的小女娃呢？\n不好意思，请叫我：陆女王！\n（本文有男主，但出场比较晚，大体还是以女主深山基建为主。有空间和系统，但都以辅助为主。）", "tags": ["种田", "古代言情", "乡村", "系统", "穿越", "基建"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "侯府大小姐居然是末世大佬", "fullTitle": "侯府大小姐居然是末世大佬", "link": "https://fanqienovel.com/page/7649705209668570174", "data": [2.24, 2.29, 2.35], "trend": 0.11, "latest": 2.3, "wordNumber": 279294, "creationStatus": 1, "desc": "大女主➕无CP【乡村➕侯府➕流放➕建设➕造反➕女帝】\n末世大佬因背叛而被系统选中，穿越到被侯府养在乡下的傻子身上，先是诛杀欺负过原主的二流子，回到京城后，主打表面柔弱不堪，背后直接捅刀子.......", "tags": ["种田", "古代言情", "乡村", "穿越", "女强", "无CP"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [6.57, 6.68, 6.62], "trend": 0.05, "latest": 6.6, "wordNumber": 204324, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身怀武力和空间，独自逃荒杀疯了", "fullTitle": "身怀武力和空间，独自逃荒杀疯了", "link": "https://fanqienovel.com/page/7649608466180361240", "data": [2.21, 2.23, 2.21], "trend": 0.0, "latest": 2.2, "wordNumber": 278401, "creationStatus": 1, "desc": "（无cp+心狠手辣+不圣母+有仇必报+天灾）\n　　灾荒年，苏小丫的家人为了一小袋粮把她卖给了老光棍儿，不愿屈服的她一头撞柱惨死。\n　　死于末世大爆炸的苏默就穿来了。\n　　只是处境不太妙：干旱缺水，敌国入侵，全村都逃了。\n　　为了活命，她逃上山，独自踏上南下逃荒之路。\n　　途中遇到了原主的家人。\n　　原主娘：“哪怕是给你吃屎长大的，那也是我这个做娘的一把屎一把尿的功劳。”\n　　吃屎是吧，那让你吃个够，这就是我对你天大的恩情了！\n　　恶毒爷奶，吸血的爹和弟还想再次把她卖了。\n　　那不能够！全家归西套餐立马安排上！\n　　逃荒路漫漫，灾祸不断，她只能咬牙朝前走，始终坚信不放弃，就有生的希望……", "tags": ["种田", "古代言情", "空间", "无CP", "逃荒", "天灾"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "被诊出喜脉后，朕成了病弱团宠", "fullTitle": "被诊出喜脉后，朕成了病弱团宠", "link": "https://fanqienovel.com/page/7664149830779800638", "data": [4.43, 4.97, 5.55], "trend": 1.12, "latest": 5.5, "wordNumber": 193144, "creationStatus": 1, "desc": "（刚出评分所以低）无cp无脑团宠+病弱系统设定，非生子\n“陛下！您这是喜脉呀！”\n“放肆！朕怎么可能有喜？！”\n“额...或许是因为您是天命之君呢？”\n“放屁！”\n前世，宁淮卿，宁氏王朝第五代君主，很不幸，挂了。\n由于他爹整天花天酒地，导致王朝岌岌可危——然后他爹暴毙了，丢下了一堆烂摊子给他。\n他宵衣旰食的努力努力再努力——修水路，重农重商，整顿贪官污吏，复辟科举...终于，猝死了。\n重生后，小宁发誓朕一定要再创辉煌！！！结果他得到了一个不靠谱的系统。\n小统：“作为陛下贴心的小棉袄，为了君臣一心，已为您发放病弱团宠大礼包——我去，发错了！这是给隔壁皇后的好孕礼包！”\n“？”\n乌龙导致的结果就是：\n1.贴身太监王长贵，以头抢地：陛下您快歇歇吧，不然小皇子怎么办？\n2.太医院院判老李头，如履薄冰：陛下别闹了，您需要卧床！\n3.一向跟他不对付的弟弟宁云琅，看他的眼神也带着莫名其妙的关怀：皇兄，保重龙体。\n不仅前朝乌烟瘴气，就连微服私访收的学生也学会了那一套，一群人整天盯着小宁的肚子。\n众人：陛下都是为了我们才病的如此厉害，我要给陛下打一辈子工！\n小宁一边咳一边骂：朕真求你们了，你们疯了吗？", "tags": ["古言脑洞", "古代言情", "团宠", "无CP", "系统", "重生"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "异世界妈妈控制欲不太对劲！？", "fullTitle": "异世界妈妈控制欲不太对劲！？", "link": "https://fanqienovel.com/page/7553154748937931838", "data": [2.63, 3.0, 3.28], "trend": 0.64, "latest": 3.3, "wordNumber": 174072, "creationStatus": 1, "desc": "“宝宝，要多喝奶才能更健康，更快长大哦～”\n“妈妈会一直守护宝宝，不让受到一点委屈，妈妈会永远爱你，永远～”\n［本人小说生涯中的癫疯之作，错过你就对了～］", "tags": ["古言脑洞", "古代言情", "萌宝", "公主", "年下", "养崽"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "没人告诉我兽世要会抡大锤啊！", "fullTitle": "没人告诉我兽世要会抡大锤啊！", "link": "https://fanqienovel.com/page/7650550529575095321", "data": [4.71, 5.04, 5.27], "trend": 0.56, "latest": 5.3, "wordNumber": 241154, "creationStatus": 1, "desc": "兽世，1/n，雌尊，异能，雌雄皆强，许多雌尊形容，避雷已放，不喜勿入或左上角，文明评论区，幸福你我他。\n\n—————————\n蓝渊胎穿到兽世，本以为自己将像上辈子看的各种兽世文一样，过上美男环伺左拥右抱的躺平整活，直到她看见她阿母的招侍擂台——\n当各个外形实力皆出挑的雄性兽人战到最后，最强的那位从中兽人脱颖而出，当蓝渊以为接下来就是阿母直接收下新的雄侍，皆大欢喜时——\n她的却阿母走下擂台。\n她便看见阿母将披风一扔，气势顶天立地，不像是在擂台招侍，反倒像是来收复新部落，对着这个准阿父摆出了邀战手势。\n阿母：刚才的战斗是你拼命争取站到我面前的资格，接下来想让我接受你，那就和我一战吧！努力获得我的认可，证明你有资格做我的雄侍！\n在阿父怀里咬手指看戏的小蓝渊：！\n不对！哪里不对！\n——————", "tags": ["古言脑洞", "古代言情", "幻想言情", "穿越", "兽世", "胎穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕曝光，朕的四哥是征北大将军", "fullTitle": "天幕曝光，朕的四哥是征北大将军", "link": "https://fanqienovel.com/page/7663787874822655001", "data": [3.03, 3.25, 3.54], "trend": 0.52, "latest": 3.5, "wordNumber": 130321, "creationStatus": 1, "desc": "天幕/大女主/渣女/称帝/微架空\n朱明姝穿成朱元璋最小的公主，成了皇宫唯一不怕洪武帝的硬茬！\n宫里上至皇子勋贵，下至宫人内侍，没人不怕洪武大帝的雷霆手段，就连骁勇的燕王朱棣，面见父皇时都谨小慎微，不敢造次\n朱明姝反而一身反骨，天天找老朱抬杠\n朱元璋拍着龙案怒斥：“女子安分守礼即可，朝堂江山，岂是你们女儿家该置喙的？”\n朱明姝挑眉回怼：“一味重男轻女，固守旧规，本就是在拖大明后腿”\n旁人都纳闷，陛下素来杀伐果决，怎么偏偏不重罚这位逆女？\n事实上呢？\n作为马皇后临终前再三托付要好生照料的幼女，朱元璋念着亡妻情分，每次都压下火气，顶多口头训斥，舍不得真对这个女儿真的下手\n再加上凑热闹的燕王，父女三人天天鸡飞狗跳\n直到天幕砸落大明，全民瞳孔地震！\n未来皇孙朱允炆登基才七天，龙椅还没捂热，就被朱明姝联手她四哥朱棣一起给薅下来了\n后来天幕更是曝光了一大堆大明的弊病\n合着老朱兢兢业业，愣是留了一堆烂摊子！\n反观众人最看不起的公主？\n她登基后，废苛政、减赋税、养万民、开盛世！\n直接把漏洞百出的大明，干成百姓吃饱、万国朝拜的巅峰！\n朱元璋盯着天幕盛世，捂心叹气：\n离谱！咱这逆女比咱几个儿子还厉害!", "tags": ["古言脑洞", "古代言情", "穿越", "直播", "公主", "女强"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "对，我在古代当神女", "fullTitle": "对，我在古代当神女", "link": "https://fanqienovel.com/page/7662746316191042585", "data": [3.37, 3.63, 3.86], "trend": 0.5, "latest": 3.9, "wordNumber": 175621, "creationStatus": 1, "desc": "穿到旱灾古代呼风唤雨，开局成神➕无cp➕万人迷。\n \n旱灾？她可呼风唤雨。\n缺粮？她可催生万物。\n瘟疫？她灵丹祛百病。\n\n片段：\n　　一船人呆呆看着。\n\n　　像山般大的巨兽，此刻褪去凶相，像一只狗一样，温顺地围着周身泛光的少女游动。\n\n　　符汐伸出手，手掌轻轻贴上它潮湿粗糙的脊背。\n\n　　海风卷走她的话音。\n\n　　“跟着我。”\n\n　　“我带你回深海。”\n\n　　巨鲸似乎听懂了她的声音。\n\n　　低鸣一声，沉入海中。\n\n　　符汐飞起，如同夜里一盏孤灯，在前方引路。\n\n　　巨鲸摆动巨大尾鳍，追着那片光亮，朝着无边远洋游去。", "tags": ["古言脑洞", "古代言情", "乡村", "穿越", "今穿古", "系统"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天幕盘点大秦女相，怎么是我啊！", "fullTitle": "天幕盘点大秦女相，怎么是我啊！", "link": "https://fanqienovel.com/page/7659047521683000344", "data": [2.25, 2.34, 2.65], "trend": 0.4, "latest": 2.6, "wordNumber": 210758, "creationStatus": 1, "desc": "【女扮男装+天幕盘点+秦始皇+权谋+基建+种田+基建狂魔】\n\n　　穿越成秦朝一个女扮男装的穷县令，黎简开局只有一间空得连老鼠都不来的粮仓。\n\n　　系统却要求三年温饱，五年奔小康。\n\n　　她卷起裤腿下田教沤肥、蹲在水田里试种水稻、用蜂窝煤撬动经济。\n\n　　就在她撸起袖子准备大搞水泥路和砖窑，带着全县奔小康时，天幕突然横亘苍穹。\n\n　　两千多年后的考古直播，硬生生砸在了大秦的天空上。\n\n　　始皇陵被挖、历史走向泄露、六国余孽蠢蠢欲动……整个天下都乱了套。\n\n　　黎简本打算置身事外，闷头搞基建就好。\n\n　　然而天幕第二次亮起时，却抛出一个石破天惊的消息。\n\n　　【被挖的不是秦始皇陵，而是大秦女相的陵寝。】\n\n　　黎简：“？？？”\n\n　　大秦什么时候有女相了？\n\n　　那个女相的名字，怎么跟自己一模一样？\n\n　　不等她理出头绪，天幕的声音再度响彻苍穹。\n\n　　【诸位，我们现在打开的，是大秦女相、也是古往今来千古第一女相的陵寝。】\n\n　　整个大秦，热血沸腾。\n\n　　黎简低头看了看自己手里的蜂窝煤模具，又抬头看了看天幕，陷入了沉思。", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "女扮男装", "无CP"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假千金全家读心，我靠摆烂躺赢", "fullTitle": "假千金全家读心，我靠摆烂躺赢", "link": "https://fanqienovel.com/page/7654561730638384152", "data": [4.21, 4.44, 4.56], "trend": 0.35, "latest": 4.6, "wordNumber": 162834, "creationStatus": 0, "desc": "前世，桓未晚身为侯府真千金，却被假千金抢走父母、兄长和婚约，最后惨死乱葬岗。\n重生回府，她决定不争了。\n亲情不要，婚约不要，侯府嫡女的位置也不要。\n她只想远离这群糊涂蛋，吃瓜摆烂，安稳活命。\n谁知刚进侯府，她就绑定了吃瓜系统。\n她不知道的是——\n全家都能听见她的心声。\n【大哥别喝，那碗汤里有毒！】\n【爹别查了，你身边那个忠心耿耿的副将就是敌国细作！】\n【娘，你还护着假千金呢？她已经准备踩着大房的尸骨嫁进皇子府了！】\n桓未晚表面乖巧，心里疯狂吃瓜。\n原以为侯府众人还会像前世一样护着假千金，结果一夜之间，全家都变了。\n大哥拔剑护在她身前。\n父亲连夜锯平她院中的门槛。\n母亲打开库房，恨不得将十五年亏欠全部补给她。\n假千金越算计，侯府众人越护着桓未晚。\n直到高高在上的摄政王祁临渊也将她堵在怀中，低声问：\n“你连满朝文武的秘密都能猜中。”\n“偏偏看不出本王为何一次次护着你？”", "tags": ["古言脑洞", "古代言情", "系统", "幻想言情", "重生", "真假千金"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宦官反派之子？但四岁封建老学究", "fullTitle": "宦官反派之子？但四岁封建老学究", "link": "https://fanqienovel.com/page/7663339551775001625", "data": [2.23, 2.39, 2.46], "trend": 0.23, "latest": 2.5, "wordNumber": 152267, "creationStatus": 1, "desc": "【养崽＋无CP＋日常流＋父子情占比高】\n　　念青四岁，府上心知肚明的野种。\n　　亲娘软弱，好在小家伙争气。\n　　他立誓考取功名，郡丞却要他当暴虐无状小皇帝的伴读。\n　　念青大病，眼看要烧成傻子。\n　　舅父忽至，细心照料。\n　　周青序一生飘零，父母早亡，少年时就成了太监。\n　　他不择手段成了辅佐幼帝的周常侍，朝野道他卑贱专权。\n　　周青序冷眼旁坐看北魏亡国。\n　　不料他锒铛入狱，受万人唾骂。\n　　厌世等死之际，恨极的人带来烧傻的孩子，说这是他的血脉！\n　　延续香火，爹娘临终期盼，周青序不想死了！当日他却死在了狱中。\n　　转世重生，他奔袭接回幼子。\n　　面对骨肉，周青序自卑又爱极，将他宠得如珠似宝。\n　　周从意发愤图强，要报答舅父。天降系统，说他舅父身为奸佞，距离死期只剩一年。\n　　从意怒目圆瞪，我舅父是忠臣，大大的良民！\n　　小家伙致力于洗白舅父，誓要将忠君爱国贯彻到底。\n　　一身正气克己复礼，左一句之乎者也，右一句仁义礼智。\n　　妥妥封建老学究。\n　　有天北魏分崩离析，皇权最坚定的维护者偷偷摸摸收拾包袱，苦口婆心：“爹爹，我们快跑。”\n　　凤仪鹤影的青年挥手，万千将士赫然跪地：“太子，请登基！”\n　　“我、我成奸佞反贼了？”", "tags": ["古言脑洞", "古代言情", "系统", "重生", "无CP", "养崽"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成京城第一权贵，主角们颤抖吧", "fullTitle": "穿成京城第一权贵，主角们颤抖吧", "link": "https://fanqienovel.com/page/7628206250508962878", "data": [4.2, 4.38, 4.41], "trend": 0.21, "latest": 4.4, "wordNumber": 273752, "creationStatus": 0, "desc": "爽文+团宠+日常+搞笑+利己+万人迷+系统\n坏消息，绑定了反派系统。要和一群打不死的主角们斗。\n好消息。系统直接带着宿主顾昭月穿成京城第一权贵，皇帝亲弟弟唯一的孩子——昭月郡主。小小主角们，拿捏～\n真假公主，偏心假公主？\n想都别想，各归其位，假公主变奴婢。\n人前显圣文主角。在我面前装神仙？\n系统商城在手，给老娘爬。\n众皇子上位之后要第一个宰了我？\n系统商城在手，给我金大腿——皇帝伯伯续波寿命，熬死你不成问题。\n你爹是皇帝没错，但你爹有几十个崽，我爹就我一个，物以稀为贵，懂？\n公主表姐非男主不嫁？来人，剥去她的公主身份，贬为庶人。\n叮，解锁新小说，修真界大佬魂穿异世。\n切～管他是龙是蛇，到我的地盘就得好好趴着。\n感谢最大的金主——反派系统001送来的顶级背景哦～（特别鸣谢～）\n主角们，颤抖吧！\n\n小剧场：\n系统：没错！我们反派天生就是一个阵营的。长大后的顾昭月：支持！所以这清冷反派，阴鸷反派，温润反派……各种反派快到本郡主府上来～", "tags": ["古言脑洞", "古代言情", "系统", "穿书", "团宠", "反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了冷血皇帝的病弱炮灰养子", "fullTitle": "穿成了冷血皇帝的病弱炮灰养子", "link": "https://fanqienovel.com/page/7628961061521083416", "data": [2.7, 2.8, 2.9], "trend": 0.2, "latest": 2.9, "wordNumber": 277067, "creationStatus": 1, "desc": "【亲情向＋无CP＋病弱＋团宠＋架空】\n　　作为第二代的陪伴型AI仿真人，零零一陪伴小主人从幼崽到成年期，功不可没。\n　　按照原计划，它是要更新老化零件，再陪伴主人到老年。\n　　但市面上越来越多的新款，大人们早就想要换掉它，他们第一时间销毁了零零一。\n　　零零一不知道自己被销毁了，在重新醒来过后，它以为自己升级成功了，换了新皮肤。\n　　但脑海中不知道为什么多出了一段奇怪的记忆，它是炮灰？叫做李临祎？\n　　还是个炮灰，因为身体孱弱，又天生寡言少语，被遗弃在雪天荒野，遇到了重伤的帝王李钦纶。\n　　帝王会心软，将他带回去，认作养子，养 ationStatus": 1, "desc": "（评分刚出，后面会涨，请放心食用）【读心吃瓜+爆笑沙雕+发疯文学+甜宠+微群像+双女主+1v1】\n版本一：\n宁小满穿越大夏两年半，绑定吃瓜系统。\n她在街上卖身时，被乔装逛街的冷面长公主带回府。\n\n她以为抱上金大腿，结果公主府也不太平：管事做两套账、绣房拿针扎人、外院领粮越来越狠。\n她嘴上装傻，心里喊统子扒瓜，公主、丫鬟、护卫统领，一个个憋笑憋到内伤。\n\n后来，皇帝听见了，皇后听见了，满朝文武也听见了。\n于是，大夏朝堂画风突变。\n\n反派正在深情演戏，她心里吐槽：\n「哥，别演了，你心眼多的都能给苏打饼干扎眼了。」\n\n贪官正在哭穷喊冤，她心里开麦：\n「你家地窖银砖都快码成小长城了，还搁这儿装月光族？」\n\n众人表面严肃，内心疯狂憋笑。\n宁小满：奇怪，为什么他们看我的眼神越来越不对？\n\n长公主冷静护人：\n“她胆小，别吓她。”\n\n满朝文武看着刚在心里把反派祖宗十八代都创飞的小姑娘，陷入沉默。\n胆小？\n殿下，您要不要听听她心里在骂什么？\n\n版本二：\n全大夏都知道，长公主萧明昭冷血、冷面、冷心。\n直到有一天，她捡回一个叫宁小满的小姑娘。\n\n从此，长公主上朝会走神，皇帝批奏折会喷茶，皇后喝茶会微笑，满朝文武会集体沉默。\n因为他们都听见了同一个声音。\n「啊，这瓜真香！」", "tags": ["古言脑洞", "古代言情", "系统", "甜宠", "搞笑轻松", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "系统升级后，百官听见了我的心声", "fullTitle": "系统升级后，百官听见了我的心声", "link": "https://fanqienovel.com/page/7643458776611163161", "data": [3.01, 3.03, 3.01], "trend": 0.0, "latest": 3.0, "wordNumber": 247863, "creationStatus": 1, "desc": "【全员读心+吃瓜+胎穿+团宠】\n　叶慈因为地府工作人员失误投胎成了大梁朝安王的独生女儿叶慈，地府人员为了补偿给了她一个吃瓜系统。\n\n　　因安王不忍妻子继续遭受生育之苦，叶慈从小就被安王对外宣称是男孩。有一天叶慈为了吃瓜偷偷摸去朝堂，却被皇帝和众大臣发现可以听到叶慈和那个系统的心声。从此叶慈就开启了她的慢慢上朝路。\n\n　　【什么？表面一本正经的御史私下里竟然写小黄书，还写得大理寺卿和刑部郎中的小黄书。】\n\n　　【九皇子的癖好是穿女装，原因竟是九皇子的母妃喜欢皇后，想给皇后生一个女儿，没生出来就九皇子当女孩养了？】\n\n　　建元帝有十五个儿子，却一个公主也没有，唯一的亲弟弟安王也只有一个儿子，平时对其他弟弟生的小郡主极尽宠爱。当得知叶慈是女孩时，立即修书一封给安王：“弟弟！你怎么能重男轻女呢！”\n\n　　太后得知自己唯一的孙女被当成男孩养了十五年以后，当即就要去北疆暴揍安王。\n\n　　建元帝：弟弟你不要女儿，那就是朕的了！", "tags": ["古言脑洞", "古代言情", "系统", "幻想言情", "穿越", "团宠"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "当我同时绑定好孕系统和天命系统", "fullTitle": "当我同时绑定好孕系统和天命系统", "link": "https://fanqienovel.com/page/7654893715571362878", "data": [5.52, 6.0, 6.72], "trend": 1.19, "latest": 6.7, "wordNumber": 150954, "creationStatus": 1, "desc": "【变嫁+渣男改造+多男主+魅魔体质+攻略+生子变强】\n因为在前世辜负了太多女孩子的真心，卿越被前女友的哥哥撞死，死后同时绑定了天命掠夺系统和人渣好孕系统，前者帮他变强，后者要他赎罪，结果二者谁也不服谁，最后只能达成协作，让他通过攻略三个天命之子，并为他们诞下子嗣，才能变强的同时也跟着赎罪。\n卿越根本来不及拒绝，灵魂就被投放到了修真世界，成为了南宫家的二小 有的路", "fullTitle": "重生后，她断了男女主所有的路", "link": "https://fanqienovel.com/page/7659427975628065816", "data": [2.76, 3.08, 3.36], "trend": 0.6, "latest": 3.4, "wordNumber": 149563, "creationStatus": 1, "desc": "沈灵汐是她爹娘的心头宝，爹娘因为要飞升，重新回到太初大陆。怕丢下她一人在云荒大陆孤单寂寞，为她创建了宗门。\n本来是想有人陪着他们的闺女，没想到却招进来一头白眼狼。披着深情款款的皮囊，想要的却是沈灵汐的灵根和她的血液。\n在被挖灵根，放血液的时候才知道他们的世界是一本书。而那头白眼狼和他家领养的妹妹，是书中的男主与女主。\n同归于尽后，强烈的不甘让她回到爹娘没有创建宗门之前。这一次，她要让那渣男贱女死在故事的开局。\n可这该死的天道，竟然护着这样的渣男贱女。既然杀不死他们，那就断了他们所有的路。", "tags": ["玄幻言情", "幻想言情", "重生", "空间", "虐渣", "前世今生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [6.52, 6.63, 6.67], "trend": 0.15, "latest": 6.7, "wordNumber": 154822, "creationStatus": 1, "desc": "【亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城+OOC预警】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.34, 3.41, 3.48], "trend": 0.14, "latest": 3.5, "wordNumber": 246995, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自己，却生得心脉残缺，体弱易碎，连哭都没力气，一副早夭相。\n他的孩子必须活得好好的，天要他亡，沈寂就把这天逆了。", "tags": ["玄幻言情", "幻想言情", "穿越", "穿书", "养崽", "胎穿"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [17.29, 17.69, 17.33], "trend": 0.04, "latest": 17.3, "wordNumber": 220990, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古风世情": [{"label": "探花郎夫人重生后", "fullTitle": "探花郎夫人重生后", "link": "https://fanqienovel.com/page/7647745007767538712", "data": [3.38, 3.73, 4.04], "trend": 0.65, "latest": 4.0, "wordNumber": 257773, "creationStatus": 1, "desc": "【分刚出，后面会涨，宝宝们放心食用】\n重回少年时坚韧女主*温柔内热书生探花郎，双洁1v1甜文\n\n说起来，沈月明这辈子很值了。　\n连家中姊妹都羡慕她命好，一个不起眼的庶女，嫁个沉默寡言的书生，结果书生成了钦点的探花郎，她也跟着水涨船高，成了探花郎夫人，一路高升，后来子女争气，她又成了人人敬重的老封君。　　\n这些头衔，外人瞧着光鲜，都觉得足以抵消她吃过的所有苦，唯一美中不足的，就是探花郎命短，二十有八就一命呜呼。　　\n日子谁过谁知道，沈月明守了一辈子寡，其实心里一直后悔。　　\n天冷衾寒，孤枕难眠，应该改嫁啊！　\n这个念头，在沈月明六十大寿这天，心里还可惜不已。　　\n要不，趁着身体还行，悄悄养两个小白脸？\n　　\n当晚，老封君就梦到早已死去的丈夫，还做了个美滋滋的梦。　　\n梦里她又是咒骂又是挠打，哭诉她独自面对豺狼虎豹，一个人睁眼到天明的苦日子，总之好话坏话羞人的话全都说了，身体和心里都痛快极了。　\n美梦醒来，一睁眼，沈月明居然真的看到了丈夫。　　\n他脖子上的指甲印，好像是自己挠出来的。　　\n不对，这是早就死了的丈夫，而且还是年轻的丈夫。\n\n一觉醒来，她回到了四十年前？？？　\n　\n#急急急，不小心在丈夫面前暴露大shai迷属性#", "tags": ["古风世情", "古代言情", "重生", "天作之合", "古言权谋"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒女背叛傻子老好人夫君后", "fullTitle": "恶毒女背叛傻子老好人夫君后", "link": "https://fanqienovel.com/page/7656816986424364094", "data": [7.28, 7.65, 7.86], "trend": 0.57, "latest": 7.9, "wordNumber": 228326, "creationStatus": 1, "desc": "前世，楼姬月被傻子靳渡秋从人牙子手里救下。\n谁知这傻子认了死理，偏执地非要她做娘子、给他生孩子。\n楼姬月不仅不懂感恩，还嫌贫爱富。\n她仗着傻子爱她，天天在家里作威作福，让傻子起早贪黑去挣钱，自己却娇养得十指不沾阳春水。\n那傻子白天百依百顺，夜里却发疯，红着眼占有她。\n为了上京去寻那礼部侍郎嫡子魏存言，她卷走了傻子的家当逃之夭夭。\n可哪怕被骗，傻子依然护着她，最后因一场误会喝下毒酒。\n死前他满口鲜血，还笨拙地替她擦泪：“月儿别哭，我不痛的……”\n重生后，楼姬月打算和傻子好好过日子，谁知傻子也重生了。\n告诉她要去和其他女人提亲，楼姬月气得眼前发黑。\n靳渡秋被凶得缩了缩脖子，委屈得直掉泪：“你、你又不喜欢我，我不要你了……”\n*\n1.坏坏的娇蛮跋扈的女主vs卑微傻子男主\n2.有前世内容，虐男主，女主虽然不完美（性格真有点坏）但是很有魅力➕重生后才追夫，重生后女主性格还是娇蛮跋扈\n3.男主真实身份是世子，不是穷人\n（双洁➕古风世情➕虐恋情深➕古代言情➕忠犬➕作精➕追夫➕双重生）", "tags": ["古风世情", "古代言情", "重生", "虐恋情深", "双洁", "古言权谋"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "枭雄的软肋", "fullTitle": "枭雄的软肋", "link": "https://fanqienovel.com/page/7661810123362290713", "data": [1.49, 1.78, 2.0], "trend": 0.5, "latest": 2.0, "wordNumber": 171283, "creationStatus": 1, "desc": "【狠戾乱世枭雄vs柔弱亡国公主+体型差+生子+先婚后爱+1v1双洁】\n寒冬的江上，谢澍救起了一名美貌少女。\n待少女及笄后他娶了少女为妻，妻子不仅温柔贤惠，还为他生下了一双儿女。\n两人度过了几年神仙眷侣般的平静日子。\n可有一日，妻子忽然不辞而别。\n再次见到妻子时，她另嫁了他人，并且已经有了身孕。\n她说:她已与失散的亲人相聚，一双儿女留给他抵救命之恩，从此不复相见，勿再纠缠。\n谢澍苦求无果后，杀意横生：既然她弃他而依附旁人，那他便屠尽她新夫满门和失散的血亲。\n等所有牵绊尽数被斩断，她只能乖乖回到他身边！\n……", "tags": ["古风世情", "古代言情", "公主", "双洁", "1v1", "古言权谋"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "父皇别凶，儿臣知错了", "fullTitle": "父皇别凶，儿臣知错了", "link": "https://fanqienovel.com/page/7652610574102055961", "data": [2.66, 2.87, 3.11], "trend": 0.44, "latest": 3.1, "wordNumber": 292237, "creationStatus": 1, "desc": "（刚开评分较低～后续会慢慢高起来，放心食用）\n【父子亲情+古风权谋+储君养成+虐身虐心火葬场】\n他饮下母后给的毒酒，当大齐最锋利的利刃。\n他被一寸寸折断傲骨，成帝国最忠诚的孤臣。\n他以为，只要隐忍听话，总能换得父皇一丝垂怜偏爱。\n可一步步退让，只换来不断的猜忌与惩罚。\n满腔赤诚，落得被囚禁折磨，狠心抛弃的结局。\n心死之后，他抛下江山责任，决意归隐江湖。\n可昔日冷漠绝情的父皇却千里追来，在他面前崩溃落泪。\n“夜儿，跟父皇回家！”\n【先虐儿子后虐爹，追子火葬场~】", "tags": ["古风世情", "古代言情", "虐文", "强强", "虐恋情深", "将军", "古言权谋"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "少卿大人，今天被亲了吗", "fullTitle": "少卿大人，今天被亲了吗", "link": "https://fanqienovel.com/page/7651865877440121880", "data": [1.8, 1.98, 2.04], "trend": 0.24, "latest" 言女主 VS 男主随剧情出现中……】", "tags": ["古风世情", "古代言情", "重生", "情有独钟", "忠犬", "古言权谋"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "尚宫有旧婚", "fullTitle": "尚宫有旧婚", "link": "https://fanqienovel.com/page/7646361267623431192", "data": [2.3, 2.37, 2.46], "trend": 0.15, "latest": 2.5, "wordNumber": 209704, "creationStatus": 0, "desc": "她是执掌六局的御前尚宫，人人敬她清冷孤高。\n没人知晓，她早与禁军将领陆骁定下终身。乱世误会写下和离书，从此宫墙相隔。\n当朝野商议为他另择世家妻室，她黯然离场。\n不料他拦在府门，笑唤她本名：婚书尚在，你想去哪里？", "tags": ["古风世情", "古代言情", "古言权谋", "破镜重圆", "强强", "情有独钟", "久别重逢"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "大都护命硬，夫人尽管来克", "fullTitle": "大都护命硬，夫人尽管来克", "link": "https://fanqienovel.com/page/7640135018169240601", "data": [1.47, 1.5, 1.55], "trend": 0.09, "latest": 1.6, "wordNumber": 299131, "creationStatus": 1, "desc": "【沉稳枭雄都护X坚韧聪慧医女】\n\n【双洁】【1v1】【先婚后爱】【架空】【无穿越重生】【纯古言】\n\n\n原书名《大都护命硬，夫人尽管来克》\n绥缨才四岁，死了生母。\n\n十三岁，未婚夫病亡。\n\n十六岁，刚议亲的男方也没了。\n\n接连两任过后，洛阳顾家六姑娘婚事再无人问津。\n\n也从此，绥缨被顾家视为弃子。\n\n同年，唯一能依靠的祖父也离她而去，丧事过后，她自请移去寺庙里独居。\n\n本以为此生要与世隔绝到死，未料到三年后京都来了旨意，将绥缨指婚给了安北大都护。\n\n消息传出那日，世人纷纷摇头，也不知道那位大都护命格硬否？", "tags": ["古风世情", "古代言情", "医术", "双洁", "1v1", "古言权谋"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "青梅归", "fullTitle": "青梅归", "link": "https://fanqienovel.com/page/7663479031827795006", "data": [1.04, 1.07, 1.1], "trend": 0.06, "latest": 1.1, "wordNumber": 147652, "creationStatus": 1, "desc": "门当户对✖️青梅竹马✖️天赐良缘\n纠结拧巴将军嫡女✖️痴情忠犬小郡王\n苏云纾和萧弋从小一起长大。\n她往东，他不会往西。\n她要上树，他不会下水。\n她要吃桃，他不会给梨。\n萧弋十八岁生辰前夕，苏云纾不告而别，远赴西北寻亲。\n两年后，她奉旨回京时，那个一起长大的少年郎将她拦在城门口，神情桀骜，言语间咄咄逼人。\n陛下要她成亲，以她为质，留在京都。\n所有人都急，唯他俩不急。\n她说:我才不喜欢他！我喜欢个蛤蟆也不喜欢他！\n他说:谁心仪她了？！我只是想问清楚她为何要不辞而别，我就是心仪个木头也不心仪她！\n一场意外，他巴巴地求来圣上亲笔赐婚圣旨。\n在他坚定的维护和万分的诚心下，苏云纾终于解开心结，揭开两年前不辞而别的真相和朝中暗流涌动的夺嫡之争。", "tags": ["古风世情", "古代言情", "古言权谋", "青梅竹马", "嫡女", "忠犬", "情有独钟"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "炮灰美人又坏又毒，失忆侯爷沦陷", "fullTitle": "炮灰美人又坏又毒，失忆侯爷沦陷", "link": "https://fanqienovel.com/page/7654149230889552921", "data": [1.85, 1.88, 1.91], "trend": 0.05, "latest": 1.9, "wordNumber": 127796, "creationStatus": 1, "desc": "【双洁➕不内耗恶毒娇蛮虚荣女主vs看似老实心眼子多如筛子心狠毒辣恋爱脑男主】\n\n　　成曦穿书了。\n\n　　穿成书里的恶毒女配，对失忆男主骗身骗心，为了荣华富贵死活跟着恢复记忆的男主上京，不断作死下成功英年早逝。\n\n　　系统：“你的任务就是走完恶毒女配的一生。”\n\n　　成曦懂了，不就是恶毒吗，这个她最会了。\n\n　　成曦恶声恶气，“我救了你的命，你要当牛做马回报我。”\n\n　　失忆的男主程真点头。\n\n　　成曦从不掩饰自己的本性，使劲磋磨程真，让失去记忆的侯爷天天给她家干活。\n\n　　就连程真辛辛苦苦赚的银子，都被成曦收走。\n\n　　成曦：“你的命是我的，你的东西就是我的东西。”\n\n　　拿着银子，成曦不亏待自己，买漂亮首饰，艳丽衣裳，天天打扮的花枝招展。\n\n　　程真在她家的地位就是奴仆，给口饭吃就要感恩戴德了。\n\n　　直到程真恢复记忆，成曦也不改自己的本性。\n\n　　她爱美，她娇蛮任性，极度自我，只爱荣华富贵。\n\n　　成曦不断作，作到后面成了皇后。\n\n　　成曦懵了，是她还不够恶毒吗。\n\n　　*\n\n　　程真：“她只是脾气坏点，她是爱我的。”\n\n　　程真身边的谋士震惊。\n\n　　什么？！\n\n　　这就是爱？!", "tags": ["古风世情", "古代言情", "穿越", "皇后", "穿书", "古言权谋"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "皇家女暗卫", "fullTitle": "皇家女暗卫", "link": "https://fanqienovel.com/page/7635531904992676888", "data": [1.54, 1.56, 1.58], "trend": 0.04, "latest": 1.6, "wordNumber": 166079, "creationStatus": 1, "desc": "鸢尾原名叫沈离，是长公主府唯一的庶女，八岁被送到皇家暗卫营受训，从进入暗卫营的那一天开始，沈离就死了，活着的只是暗卫鸢尾！", "tags": ["古风世情", "古代言情", "古色古香", "古言权谋"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "公主，不可以", "fullTitle": "公主，不可以", "link": "https://fanqienovel.com/page/7165548302484638751", "data": [2.41, 2.43, 2.44], "trend": 0.03, "latest": 2.4, "wordNumber": 293288, "creationStatus": 0, "desc": "世人都说，商国首辅温文尔雅，是难得的君子，可在商柔眼里，他就是披着羊皮的狼，就是扮猪吃老虎的主（外加老混蛋）。\n商柔贵为公主，从小娇生惯养，得知自己要被送去和亲，于是私下找首辅，她曾经的师长商量办法。\n办法就是，无所不用其极勾搭他，往死里勾搭他，这样就不用和亲了，嫁给老男人总比嫁给快要老死的皇帝强。\n结果，事是成了，勾搭的非常成功，但没想到皇兄下旨，让她隐藏公主的身份，去国子监上首辅大人的课。\n天天面对老狐狸，她要被榨，不是，要被（宠）死了...\n清冷老狐狸，整日儒雅装斯文，结果，得知她有孕后，哑着嗓子，求她嫁给他...\n她偏不！早想什么去了！\n宝宝是她一个人的，跟老男人半点关系都没有。\n老狐狸X小公主，1v1双洁文，扮猪吃老虎是他，处心积虑是他，步步为营，欲哭无泪，是她。\n娇弱喜欢勾搭人不负责的小公主，老男人+首辅+斯文=败类，很会。", "tags": ["古风世情", "古言权谋", "古代言情", "公主", "双洁", "扮猪吃虎", "1v1"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成带娃尼姑，渣爹逼我去冲喜", "fullTitle": "穿成带娃尼姑，渣爹逼我去冲喜", "link": "https://fanqienovel.com/page/7646255692998773785", "data": [1.54, 1.51, 1.56], "trend": 0.02, "latest": 1.6, "wordNumber": 250470, "creationStatus": 1, "desc": "【穿越+大女主+医武双绝+复仇+逆袭】现代战地军医姜灵穿成尼姑，一手精妙医术，一身不俗武功。为寻子复仇，她踏出尼庵，不得已与昔日仇敌联手，循着线索揪出幕后黑手，寻回失散孩儿，以己之力护得一方安宁。", "tags": ["古风世情", "古代言情", "穿越", "医术", "虐渣", "古言权谋"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "误却花期又逢君", "fullTitle": "误却花期又逢君", "link": "https://fanqienovel.com/page/7638184710425824280", "data": [3.17, 3.22, 3.19], "trend": 0.02, "latest": 3.2, "wordNumber": 100873, "creationStatus": 0, "desc": "一纸十年婚约，曾拴住翰林院学士嫡女与镇国大将军之子。\n她温婉通医理，他年少负壮志，本是天作良缘，却因世事风波，硬生生一纸退婚，情分两断。\n \n岁月流转，他成镇守一方的节度使，铁血冷面，权柄在握；她怀一身医术，游历山河。\n \n本以为山水不相逢，命运却再度将两人牵绊。前尘误会渐次揭开，年少情愫从未消散。\n花期虽误，故人仍归，兜兜转转，终究还是他与她，再续前缘。", "tags": ["古风世情", "古代言情", "嫡女", "医术", "破镜重圆", "古言权谋"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小娇娘竟来自未来特种部队", "fullTitle": "小娇娘竟来自未来特种部队", "link": "https://fanqienovel.com/page/7642369001191918617", "data": [2.29, 2.29, 2.31], "trend": 0.02, "latest": 2.3, "wordNumber": 214717, "creationStatus": 0, "desc": "这是一个现代女子特种兵在古代冷兵器战场上降维打击的故事。也是一个现代人思维进行古代争宠的故事，更是一个人在被全世界抛弃之后，不靠任何人、一步一步走上巅峰的故事。", "tags": ["古风世情", "古代言情", "穿越", "今穿古", "魂穿", "古言权谋"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "女频悬疑": [{"label": "盗笔：猫鼠人一家亲", "fullTitle": "盗笔：猫鼠人一家亲", "link": "https://fanqienovel.com/page/7659744133816257598", "data": [5.71, 6.12, 6.62], "trend": 0.91, "latest": 6.6, "wordNumber": 145627, "creationStatus": 1, "desc": "（OOC）（原创女主+无cp＋重生+猫和老鼠+私设）（时间在盗笔主线半年前）\n解家新来了一位表小姐。\n她父母双亡，孤苦伶仃。\n解当家为了还恩，特意将其接来老宅照顾。\n表小姐不是自己来的，她还带了一只半人高的英短蓝白。\n自从一人一猫来到解宅，老宅怪事频发。\n先是解当家深夜遇“鬼影”，只闻其声不见其“人”。\n后是厨房频繁被偷，疑似小偷已饿疯。\n直到天价古董无故失窃，对方还毁坏现场，场面之惨烈确定为打击报复。\n可解当家绞尽脑汁，翻遍新仇旧恨账本，却不得真面目。遂请来“专家”，却被专家质疑为失心疯。\n这一系列事件究竟是人性的扭曲，还是猫性的沦丧，关注大王，持续为您报道。\n……\n鹿笙是个传统的淑女，却命比纸薄，死在了最好的19岁年华。\n为了再给自己挣一条命，她接受了世界意识派发的拯救世界的任务。\n因为大量人物的重生，盗笔世界的主线乱成一锅粥，就需要有一个人来纠正它。\n鹿笙就成了天选之人。\n可熟知剧情的小伙伴都知道，盗笔是著名的黑深残。\n为了保证人身安全，聪明的鹿笙给自己找了两个小伙伴。\n一只猫和一只鼠。\n至此，猫鼠人小队正式成立，拯救世界行动开始。\n接下来登场的是，\n世界上最佳团队\n传奇点子王\n三大魔丸组合\n颤抖吧，新世界", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人", "悬疑恋爱"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三七穿越盗墓世界", "fullTitle": "三七穿越盗墓世界", "link": "https://fanqienovel.com/page/7650737707861167129", "data": [3.89, 4.11, 4.3], "trend": 0.41, "latest": 4.3, "wordNumber": 148865, "creationStatus": 1, "desc": "灵魂摆渡里反应慢半拍的孟婆三七无意间离开了黄泉，被人类的花花世界所吸引，又遇见一群把她当妹妹宠的人，不过这几个哥哥怎么都奇奇怪怪，总是喜欢往地底下钻呢？算了，看在他们这么弱小的份上，她就勉为其难地护着他们吧～\n三七是被吴邪捡到当妹妹养的，所以跟吴邪相处最多", "tags": ["女频悬疑", "悬疑", "灵异", "衍生", "悬疑恋爱", "风水秘术"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让你破案，你搁这分享犯罪经验？", "fullTitle": "让你破案，你搁这分享犯罪经验？", "link": "https://fanqienovel.com/page/7655334215491275801", "data": [9.22, 9.42, 9.49], "trend": 0.27, "latest": 9.5, "wordNumber": 289193, "creationStatus": 1, "desc": "评分刚出，小女警在线破案，进来沾点福气！\n【满级大佬+推理破案+轻松爽】\n顶级黑客/地下雇佣兵宋千夏，竟穿越成了一名在市警局刑侦大队处处受气、胆小如鼠的实习小警花？！\n面对连环密室杀人案，警局上下愁云惨淡，犯罪心理学专家束手无策。\n宋千夏却打了个哈欠：“这案子很难吗？作案手法不就是先把冰块做成子弹，然后利用滑轮组在走廊制造不在场证明，最后顺着下水道溜走吗？”\n冷面刑侦队长震惊：“完美！你是怎么推断出来的？”\n宋千夏心里一咯噔：啊？我没推啊，这不是我最爱用的操作吗……\n每破一个大案，队长和全网粉丝都对她顶礼膜拜。\n只有宋千夏自己躲在角落瑟瑟发抖：“救命，我只是把干过的事说了一遍而已啊！再这样下去真实身份要暴露了！”", "tags": ["女频悬疑", "悬疑", "推理", "破案", "大佬", "悬疑恋爱"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：开棺挖到黑爷的小福晋", "fullTitle": "盗墓：开棺挖到黑爷的小福晋", "link": "https://fanqienovel.com/page/7660708472912104472" tps://fanqienovel.com/page/7636680384754764862", "data": [3.25, 3.35, 3.44], "trend": 0.19, "latest": 3.4, "wordNumber": 192653, "creationStatus": 0, "desc": "二十年前，青城西水厂的秋天，三个人接连失踪，活不见人，死不见尸。警察齐晓军追了这条线索半辈子，却在即将触碰到真相的那一刻，被命运一脚踹出了局。年轻厂长张有斐曾深爱过一个叫金花的女人，却不知道她的沉默里藏着多少秘密。\n\n二十年后，又一个人在西水厂失踪。齐晓军拖着病体从县里赶回来，张有斐翻出了当年的笔记，已经独当一面的张华调出了最新的监控。两代人，隔着二十年的光阴，重新盯上了同一片水面。\n\n真相像清水河底的石头，被时间的暗流冲刷了太久。金花、张鹏飞、张莉——三个守口如瓶的女人，一只奶白色的黄金小象，一具在废弃木箱里被强碱溶解的白骨，还有那片年年春天开满婆婆丁的空地下面，埋着比尸骨更沉重的东西。当所有的珠子终于被一颗一颗串起来，齐晓军发现，他追了二十年的答案，比他想象的更冷，也更烫。\n\n有些真相，不是用来让人释怀的，是用来让人学会承受的。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：长生都是有纹身的", "fullTitle": "盗墓：长生都是有纹身的", "link": "https://fanqienovel.com/page/7622580052009438233", "data": [14.34, 14.64, 14.48], "trend": 0.14, "latest": 14.5, "wordNumber": 284543, "creationStatus": 1, "desc": "【OOC+无CP+全员单箭头+陈皮亲儿子+社恐男主+我是想要刺激，但绝对不包括这种刺激】\n陈言回到陈家的第一件事，就是杀了一批汪家人。\n陈金水到死都没想明白，汪家是什么？\n长白山上，张启灵觉得陈言眼熟，好像在哪里见过。\n吴邪更是不可置信的问潘子要是他成了家主，也需要这么干吗？\n对于黑瞎子，陈言更是热情，问黑瞎子吃不吃烤肉？\n瞎：小四爷，瞎子我吃饱了。\n言：那可惜了。\n*\n陈言的出现，炸了整个九门，也炸了整个盗墓圈子。\n谁都没有想到，一直混迹在国外，亲娘是北派最有名的摸金校尉后人的胡清，竟然会是南派九门四爷的崽子。\n南北派都怀疑人生了。\n吴三省想要局限于南派的事情，陈言不屑。\n要玩就玩大的。\n*\n北派南派，三教九流都疯了，长生？长生在哪？哪有长生？\n什么？长生的人身上有纹身？懂！挖地三尺都要找出来！\n汪家：草！\n张家：草啊！\n九门：陈皮！！！\n陈皮：我耳聋，还眼瞎，等死呢。勿扰。\n小剧场。\n邪：言哥，我三叔能还我吗？\n花：阿言，解连环能直接掐死吗？\n灵：我留下。\n黑：言子，没有你我可怎么活啊~\n皮：我砍死你们！\n言：我是想要刺激，但绝对不包括这种刺激。\n胖：言哥，求带啊，我也是摸金校尉的后代啊~", "tags": ["女频悬疑", "悬疑", "灵异", "无CP", "同人", "悬疑恋爱"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别争了，小哥这条命我宠回来的", "fullTitle": "别争了，小哥这条命我宠回来的", "link": "https://fanqienovel.com/page/7661595175088573502", "data": [2.57, 2.75, 2.7], "trend": 0.13, "latest": 2.7, "wordNumber": 174289, "creationStatus": 1, "desc": "all团宠1vn。\n霁雪棠一睁眼，发现自己又穿了，还被张起灵给捡到。\n谁人不知张起灵是战力天花板，妥妥的金大腿！\n这个男人我赖定了！这声哥哥我先喊为敬！\n张起灵：你认识我？\n霁雪棠坚定点头：毛有错，你是哥哥，我只记得你！\n黑瞎子：你知道你什么身份吧？会很危险的，要不要拜我为师啊？\n解雨臣：小花 "data": [1.49, 1.51, 1.51], "trend": 0.02, "latest": 1.5, "wordNumber": 205649, "creationStatus": 0, "desc": "题外话，新书尘缘当铺已开，另一本电竞文筹备中。\n姜时愿，清北大学大一新生，高考状元，还好是高考状元，不然以她的家庭条件是绝对上不起自费大学的。\n为了赚生活费，她下载了最近爆火的【绝境突围】，打算做陪玩。玩了三局后，她认真的问闺蜜：“这游戏真的有难度吗？”\n闺蜜：“......不难吗？”\n于是姜时愿开始了白天上课，晚上陪玩，深夜直播的精分生活。她专挑大主播的单子打，甚至一度把榜一大哥打自闭，直播间弹幕从“妹子别送了”变成“求求你别秀了”\n直到有一天，她接了一个陪玩单子，对方被她按在地上摩擦了二十局。\n老板回去后，在训练室里哭了十分钟，然后对队长说：“傅哥，我点了个陪玩，她把我打哭了。”\n后来，所有人都知道了，那个毒舌女陪玩变成了MG战队的第一位女队员，也顺利让傅沉舟学会了什么叫“喜欢一个人，就是愿意把最好的枪都给她！”", "tags": ["游戏体育", "电竞", "学霸", "甜宠"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "公路求生，开局和前任绑定共生", "fullTitle": "公路求生，开局和前任绑定共生", "link": "https://fanqienovel.com/page/7648679388824734745", "data": [2.12, 2.12, 2.13], "trend": 0.01, "latest": 2.1, "wordNumber": 283206, "creationStatus": 1, "desc": "【奇葩羁绊+游戏副本+囤货基建+破镜重圆+萌宠+搞笑爽文】\n\n系统日志：新推出双人求生计划，各位将与羁绊最深的玩家组成搭档。\n\n姜桃看着身边表情冷淡的男人，陷入沉思。\n\n全校最年轻的教授，她当初追了三个月，后来感觉师生恋不好，把人甩了。\n\n“好久不见，小桃。”\n\n别人进副本九死一生，他俩次次刷到福利本，吃饱喝足白嫖属性。\n\n两人住在一辆房车里，姜桃太清楚他衣服下的肩有多宽，腰有多窄了。\n\n背包里蛋蛋疯狂闪烁，它觉得今晚的气氛很微妙。\n\n下面是全服大型羁绊吃瓜榜单：\n\n继子小妈组：顶级修罗场，瓜田常年爆满。\n\n 婆媳绑定组：一天吵架十场，求生不如宫斗。\n\n债主欠债人：光听就知道有多绝望了。", "tags": ["游戏体育", "系统", "穿越"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全民求生：我在沙漠当农场主", "fullTitle": "全民求生：我在沙漠当农场主", "link": "https://fanqienovel.com/page/7646281648610233369", "data": [2.77, 2.81, 2.78], "trend": 0.01, "latest": 2.8, "wordNumber": 275428, "creationStatus": 1, "desc": "【求生+沙漠+战力No.1+从无到有+农场主+无CP】\n（评分刚出，后面会涨的）\n苦命打工人席芝刚买好房就被拉入全民求生游戏，还被投放到一无所有的沙漠中。\n发育全靠开箱，非酋幸运为1。\n她一连开了五个箱子，看着面前的破布、沙子、茅草，非酋席芝陷入沉默，就在这时，系统美妙的声音响起：【恭喜玩家席芝全服开箱第一，收获倒数第一，获得唯一称号“非到极致就是欧”：佩戴称号后，半小时内幸运值+10，获得物资翻倍。】\n跟她一起来的锄头被改成特殊道具——开垦过的土地都将变成适宜种植的农田，席芝看着面前一望无际的沙漠狂喜。\n她挥舞着锄头，在漫天黄沙中开辟出属于自己的绿洲农田，并且称霸诸多榜一。\n玩家1：“她击杀和等级榜第一就算了，在沙漠她凭什么当财富榜榜一？”\n玩家2：“什么什么，你说财富榜一在沙漠发育？逗我呢？”\n……\n其他玩家还在为了生存苦哈哈发育时，席芝戴着墨镜晒着太阳喝着果汁美滋滋地躺平了。", "tags": ["游戏体育"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "求生游戏，我真不是美食魔女", "fullTitle": "求生游戏，我真不是美食魔女", "link": "https://fanqienovel.com/page/7649779995786611737", "data": [1.2, 1.2, 1.21], "trend": 0.0, "latest": 1.2, "wordNumber": 266568, "creationStatus": 1, "desc": "新人，小白文笔，因为自己想看类似题材开的文，欢迎指正。\n上辈子幸运e，重生后成为自然的宠儿，在这个实力为尊的世界，剑与魔法的光辉下，谢暮朝强者的道路上不断前行。\n伟大的魔女大人有一片神奇的领地，在这里元素精灵自由飞舞，金灿灿的面包树散发着香甜的气味，高大的玉米在太阳下爆成蓬松的爆米花，小树般的稻谷被巴掌大的米粒压弯了腰，苍翠的竹子里是香嫩的竹筒饭，挂满藤的彩色葫芦里是各种饮品……等等，这里不是美食魔女！\n大厨弱弱出声：“我觉得可以是……”\n点击就看自然魔女的军火库集锦：、咸鱼长剑、四叶草飞镖、土豆地雷、西瓜炸弹、茄子手雷等，果然，艺术就是爆炸！", "tags": ["游戏体育", "惊悚游戏", "美食", "重生", "穿越"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "丰腴美人穿成恶毒女配后，发疯了", "fullTitle": "丰腴美人穿成恶毒女配后，发疯了", "link": "https://fanqienovel.com/page/7660895066201787416", "data": [10.76, 11.67, 11.83], "trend": 1.08, "latest": 11.8, "wordNumber": 163695, "creationStatus": 1, "desc": "【丰腴恶毒美人VS绝嗣封建大爹】\n【系统电击+对抗路夫妻+男主生理性喜欢】\n季清然穿书了，穿成了书里的恶毒女配。\n系统告诉她，完成任务后，她就能得到一亿。\n不就是走剧情吗，她狠狠行。\n设计陷害男主娶她，骂男主是不会下蛋的公鸡，只要有女人喜欢男主，就甩男主巴掌，伤害男主的侄子…\n不能脱离人设，否则就会被系统电击。\n她的目标是走完剧情拿钱跑路。\n看着微微隆起的肚子，她崩溃打人，“系统，你不是说是绝嗣吗？”\n系统：“他是男主。”\n季清然：“都给他，我只要钱回家。”\n…\n沈景川是书里的男主，人生一路顺到到三十岁，遇到了季清然这个大坎。\n他时常被这个小妻子气得脑门疼，不管怎么教育，她总是我行我素。\n沈景川在跟她相处的时候总是会感觉心脏不舒服，他以为是被气的。\n有一天，战友告诉他，喜欢就是一种电流般的酥麻感，沈景川不愿相信他喜欢上了那个恶毒的小妻子。\n她都快把他兜里的钱都掏完了。\n还想跑路呢。\n…\n当沈景川从医生的嘴巴里听到妻子怀孕的消息后，如遭天谴。\n“打掉！”他冷声说。\n“好。”季清然很轻易就答应了。\n他却后悔了，经过半个月的考虑，他接受了这个别人家的孩子。\n可是，养着养着，孩子却跟他越来越像", "tags": ["年代", "现代言情", "系统", "先婚后爱", "穿书"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带娃上军区找爹，改造前夫被亲哭", "fullTitle": "带娃上军区找爹，改造前夫被亲哭", "link": "https://fanqienovel.com/page/7635968897727859774", "data": [7.11, 7.6, 7.96], "trend": 0.85, "latest": 8.0, "wordNumber": 274431, "creationStatus": 1, "desc": "年代女大学生揣崽上部队，找被她弃的军官前夫\n【训夫成军区大佬+换亲拿捏男人+资本家肤白貌美大小姐VS首长家刚从乡下找回来的真儿子】\n夏桃是肤白貌美资本家娇小姐，是这个年代难得的大学生，有为她谋划的心机恶毒亲妈。\n新婚夜被继姐算计走错房，不知情的情况下，她男人变成了乡下泥腿子出身的军官，用户口本还跟对方领了证。\n一觉醒来夏桃傻眼了，把人狠狠踢下床，坚持离婚。\n生米煮成熟饭周野不想离婚。\n当初相看，有人指着夏桃说是他相看对象，他才会同意婚事。\n他这人俗气，就图媳妇俊。\n夏桃死活不愿意，用自杀逼着周野打离婚报告。\n周野最终还是妥协离婚了。\n不久夏家被下放。\n夏桃觉醒记忆，才发现肚里揣了崽。\n走错房不是意外。\n她和她妈是书里的恶毒继妹和心机后妈，不仅跟女主抢男人还抢家产。\n下放改造后，她和崽都惨死乡下。\n周野不是泥腿子，他才是首长家真儿子，然而身份还没曝出就出任务牺牲了。\n他压根不知道他们还有两个崽，也不知道自己的身世，更不知道她和崽惨死。\n重活一世。\n夏桃揣崽上部队找崽爹负责，这人可不能早死，早死她和崽咋办，还得改造他让他认祖归宗，带她和崽过好日子。\n爱不爱不重要，给钱给工作保证他们生活就行", "tags": ["年代", "现代言情", "重生", "大佬", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [9.0, 9.19, 9.55], "trend": 0.55, "latest": 9.5, "wordNumber": 208726, "creationStatus": 1, "desc": "评分刚开，后面会涨。\n（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，且表示只要这一个孩子，不会再生二胎。\n爷奶一听瞬间急了……\n只生一个孩子，还是个女娃，那怎么能行？\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "骗婚捞女？科研大佬独宠丰腴美人", "fullTitle": "骗婚捞女？科研大佬独宠丰腴美人", "link": "https://fanqienovel.com/page/7649237755582483518", "data": [8.16, 8.2, 8.21], "trend": 0.04, "latest": 8.2, "wordNumber": 249052, "creationStatus": 1, "desc": "【娇媚丰腴大美人VS外冷内野重欲大佬】\n【架空+八零+上位者为爱低头+独宠+先婚后爱+日久生情】\n柳娇媚穿进八零年代，成了书中那个又娇又媚的丰腴美人。\n好消息：老公穆寒舟是顶级科研大佬，工资津贴月月全额上交。\n坏消息：原主是捞女，老公是骗来的。\n按原书剧情，大佬半年后回家，发现原主是照骗，当场提出离婚。\n原主爱慕虚荣，对穆寒舟下药，企图生米煮成熟饭留在京市。\n穆寒舟自己忍着，给原主灌了十倍的药，丢进黑矿里，原主被摧残致死……\n柳娇媚瑟瑟发抖：惹不起惹不起，趁大佬还没回来，赶紧跑路！\n可原主太能挥霍了，兜里就剩二块五，估计跑出家门就饿死了。\n柳娇媚给自己定制剧本：装乖撒娇拉满情绪价值，搞一笔钱，再挑刺冷战断崖式分手。\n冷峻矜贵的科研大佬，开始电话里喊她宝宝，一张张万元汇款单砸过来，砸得柳娇媚说不出分手。\n穆寒舟一颗心，被家里的小妻子撩得辗转反侧，科研上攻坚克难，短短二个月就解决了预计半年才能解决的难题。\n提前回京市，只想按着小妻子的说法，把人狠狠宠爱，结果火车站就被正准备跑路的小妻子撞了个满怀。\n穆寒舟：宝宝！\n柳娇媚：？\n扣着小妻子的手腕把人抵在门上，穆寒舟：电话里说喜欢的，是这样吗？", "tags": ["年代", "现代言情", "先婚后爱", "独宠", "日久生情", "大佬"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "年代", "score": 7, "reasons": ["3日增长+23.4万", "竞争系数低(3.2)", "腰部稳(均腰比1.21)"], "total19": 232.5, "growth": 11.2, "abs_growth": 23.4, "coeff": 3.2, "count10w": 4, "mean": 7.7, "mid19": 6.4, "mm_ratio": 1.21, "ndays": 3}, {"cat": "玄幻言情", "score": 7, "reasons": ["3日增长+40.2万", "竞争系数低(2.6)", "腰部稳(均腰比1.04)"], "total19": 210.0, "growth": 23.7, "abs_growth": 40.2, "coeff": 2.6, "count10w": 4, "mean": 7.0, "mid19": 6.7, "mm_ratio": 1.04, "ndays": 3}, {"cat": "职场婚恋", "score": 7, "reasons": ["3日增长+12.0万", "竞争系数低(4.4)", "腰部稳(均腰比1.4)"], "total19": 177.8, "growth": 7.2, "abs_growth": 12.0, "coeff": 4.4, "count10w": 3, "mean": 5.9, "mid19": 4.2, "mm_ratio": 1.4, "ndays": 3}, {"cat": "豪门总裁", "score": 7, "reasons": ["3日增长+228.0万", "竞争系数低(2.6)", "腰部稳(均腰比1.14)"], "total19": 844.2, "growth": 37.0, "abs_growth": 228.0, "coeff": 2.6, "count10w": 27, "mean": 28.1, "mid19": 24.6, "mm_ratio": 1.14, "ndays": 3}, {"cat": "女频衍生", "score": 6, "reasons": ["3日增长+2.9万", "竞争系数低(4.9)", "腰部稳(均腰比1.34)"], "total19": 244.1, "growth": 1.2, "abs_growth": 2.9, "coeff": 4.9, "count10w": 7, "mean": 8.1, "mid19": 6.1, "mm_ratio": 1.34, "ndays": 3}, {"cat": "种田", "score": 6, "reasons": ["3日增长+3.1万", "竞争系数低(3.6)", "腰部稳(均腰比1.36)"], "total19": 105.4, "growth": 3.0, "abs_growth": 3.1, "coeff": 3.6, "count10w": 0, "mean": 3.5, "mid19": 2.6, "mm_ratio": 1.36, "ndays": 3}, {"cat": "科幻末世", "score": 6, "reasons": ["3日增长+5.4万", "竞争系数低(4.6)", "腰部稳(均腰比1.25)"], "total19": 149.2, "growth": 3.7, "abs_growth": 5.4, "coeff": 4.6, "count10w": 2, "mean": 5.0, "mid19": 4.0, "mm_ratio": 1.25, "ndays": 3}, {"cat": "古言脑洞", "score": 5, "reasons": ["基本稳定(-0.7万)", "竞争系数低(2.9)", "腰部稳(均腰比1.14)"], "total1 .12, 65.26, 66.07], "trend": 11.04, "latest": 66.1, "wordNumber": 373473, "creationStatus": 0, "desc": "【已签实体出版】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨现实向丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春心难捱", "fullTitle": "春心难捱", "link": "https://fanqienovel.com/page/7593546594557889560", "data": [20.63, 21.3, 21.95, 23.35, 24.33, 25.74, 27.09], "trend": 6.46, "latest": 27.1, "wordNumber": 408020, "creationStatus": 0, "desc": "【我才19岁但儿子18岁+追妻火葬场+拽哥上位+一点点狼兔文学】\n【安静乖乖女学生x狗脾气资本家】\n祝、孟两家是世交，祝令榆和孟恪从小就认识，并且有婚约。\n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生觉醒，这次我不做恋爱脑", "fullTitle": "重生觉醒，这次我不做恋爱脑", "link": "https://fanqienovel.com/page/7546227706472451096", "data": [59.82, 60.42, 61.67, 63.39, 64.38, 65.29, 66.17], "trend": 6.34, "latest": 66.2, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任  "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [24.4, 24.37, 24.55, 26.37, 27.24, 27.42, 27.79], "trend": 3.39, "latest": 27.8, "wordNumber": 1116794, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小辣椒闹腾，高冷首长宠宠宠", "fullTitle": "小辣椒闹腾，高冷首长宠宠宠", "link": "https://fanqienovel.com/page/7561724651605330968", "data": [25.33, 26.47, 26.84, 26.86, 26.64, 26.65, 28.35], "trend": 3.02, "latest": 28.4, "wordNumber": 1017822, "creationStatus": 0, "desc": "[年代文+爽文+虐渣+空间+双洁]\n\n上辈子，魂魄不全的黎予初，被渣男和绿茶合谋骗到了边境，落了个死后喂狗的下场！\n\n重生后，她清醒果断，\n\n渣男想升职？毫不犹豫送他去吃花生米！\n\n绿茶想要又要？做梦！你只配吃花生米！\n\n不仅处处给他们挖坑，还通过他们找到了金山银山？\n\n太好了，目之所及，不论钱财粮食还是宝贝，通通收收收！\n\n顺带着陆海空三军告状告了一大遍，把渣男的领导搞的灰头土脸，别提有多爽！\n\n啥？渣男娘受不了刺激想求自己？\nno！本姑娘不接受道德绑架！\n\n\n\n\n\n\n\n\n\n………………\n只是那个高冷的首长喂，\n你千里追到我家为哪般？想让我跟你去随军？\n\n本辣椒是觉得你有钱又大方还好欺负，\n可咱们不太合适！\n\n毕竟，跨军界告你状，让你成为了大笑话，我虽不后悔但心虚！\n\n\n而且姐有大志向：只想当村霸！\n\n………………………………\n\n小剧场：\n“听说了吗，顾首长的新婚妻子是黎予初！”\n“老天爷！这个活爹怎么又回来了？”\n嫂子们急的嘴里起了水泡，\n文工团的姑娘使劲捂住钱包，\n训狗的提前做好了被罚准备，\n\n……\n\n要说谁最欢迎黎予初这个大闹腾，\n当然是……犬！\n呃，还有某人！", "tags": ["年代", "现代言情", "宠妻", "空间", "虐渣", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七零知青娇弱可人？刀刀要你狗命", "fullTitle": "七零知青娇弱可人？刀刀要你狗命", "link": "https://fanqienovel.com/page/7606648925205826584", "data": [22.44, 23.5, 24.67, 25.25, 25.37, 25.06, 24.98], "trend": 2.54, "latest": 25.0, "wordNumber": 834823, "creationStatus": 0, "desc": "【已完结，放心入坑】\n重生七零年代＋抄家＋空间＋白切黑女主＋男女双强＋下乡知青＋科技助国＋军婚＋甜宠＋恋爱脑兵王＋爽文＋双洁\n23世纪武术冠军魂穿七零，一睁眼就遇上抄家惊魂，原主被活活逼死。\n她携带异宝重活一世。\n父母双双牺牲，家产被窥，革委会频频上门刁难？\n她连夜端了革委会老巢，洗劫仇家，卷走滔天财富潇洒下乡。\n本想苟着搞钱搞科研，却意外撞破祖辈惊天秘辛，一路遭人截杀。\n人前软萌娇弱小知青，人后狠辣能打白切黑。\n谁料被冷面兵王一眼盯上，从此黏人属性彻底爆发。\n风行止：看着香香软软，想娶回家疼。\n下一秒见她把人揍飞：……更爱了，又飒又野！\n恋爱脑兵王天天贴贴，白切黑女主一言不合就动手。\n她搞科技强国，他做最强后盾。\n男女双强，军婚高甜，从下乡知青飒到京城顶层！", "tags": ["年代", "现代言情", "重生", "空间", "强强", "白切黑"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生八零：老太太抛子弃女", "fullTitle": "重生八零：老太太抛子弃女", "link": "https://fanqienovel.com/page/7460001987375926296", "data": [23.11, 23.0, 22.77, 23.64, 24.49, 25.13, 25.36], "trend": 2.25, "latest": 25.4, "wordNumber": 3177979, "creationStatus": 1, "desc": "【年代】【八零】【微群像】【重生】【爽文】【无金手指】【家长里短】\n（又名：重生八零：老太太抛子弃女）七旬老太吴知秋重生了，重生到孩子们还要靠她辛苦付出的年代！上辈子自己偏心，晚景凄凉。重生不重演，老太太决定抛开儿女，美美的过余生！\n小儿子哭唧唧抱着大腿，妈！我可是你最爱的小儿子，我要给你买大房子！为了能跟老娘在一起生活，砒霜拌馅，鹤顶红勾芡，为了老娘没事就得插兄弟两刀！\n公婆化身王炸组合“我那最有出息的大孙呦！爷奶想吃锅子，烤肉，洋饭……”把大儿子两口子坑的裤衩子都穿不上溜。\n宠妻狂魔李满仓……别和我说，这家我说的不算！", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄学真千金穿七零，认亲首长父亲", "fullTitle": "玄学真千金穿七零，认亲首长父亲", "link": "https://fanqienovel.com/page/7581118244304473150", "data": [29.57, 28.28, 29.84, 31.07, 30.18, 30.87, 31.65], "trend": 2.07, "latest": 31.6, "wordNumber": 947599, "creationStatus": 0, "desc": "江莯颜本是现代玄学界的修炼天才，早在她穿越之前，师父便已算出她有穿越到异世这一劫难。为护她周全，师父与众位师兄们，将海量金银珠宝、稀缺药材以及各种符箓和生活物资尽数收纳于芥子袋中，成为江莯颜在七十年代最大的“底气”。\n江莯颜刚穿越，便发现原主在刚出生时，就被现在的养母把她和自己的亲生女儿偷偷调换 。而养母更是为了自己的亲生女儿和儿子，逼着原主嫁给一个打死过两任老婆的老渣男。\n不过，这都难不倒江莯颜，看她如何榨干无良养父母的钱财，临走前还分别送给他们一个霉运符，让他们为欺辱原主付出代价。\n江莯颜报名下乡后，在这期间，邂逅了未来的命中注定，也重逢了自己的亲三哥。凭借精湛的玄术和医术救治了很多本该被命运辜负的人。更凭借那双能洞察虚妄的天眼，敏锐察觉到潜藏在暗处的敌特分子，保护了被下放的科研人员的安全。\n高考恢复后，江莯颜凭借过人的天赋和优异的成绩考入京市的顶尖学府，也终于和亲生父母相遇，开启了属于她的璀璨篇章！", "tags": ["年代", "现代言情", "穿越", "天才", "虐渣", "真假千金"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书七零，吃瓜赚钱两不误！", "fullTitle": "穿书七零，吃瓜赚钱两不误！", "link": "https://fanqienovel.com/page/7554031144186940478", "data": [21.71, 21.87, 22.03, 22.02, 21.8, 21.91, 21.75], "trend": 0.04, "latest": 21.8, "wordNumber": 1008237, "creationStatus": 0, "desc": "【穿书+系统+知青下乡+吃瓜+爽文+女主自强+原女主也是大女主人设+不娇妻】\n女主太小，感情线比较靠后。\n穿到七零年代，还没过几天好日子，就被迫下乡的苏桃，对着让她下乡的罪魁祸首冷冷一笑。\n敢算计她，那就一起下乡吧！\n没想到，她不仅穿越了，还穿书了！\n作为书中没有的角色，她决定远离男女主，静静地吃瓜，默默地赚钱，争取早日买上车，买上房，抱个少年郎！\n只是，故事的发展怎么跟她记得的不一样呢？\n恶毒女配怎么跟女主成了朋友？\n自己身边的这个帅哥，书里也没有啊？", "tags": ["年代", "现代言情", "乡村", "系统", "穿书", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [13.49, 14.62, 16.83, 23.95, 23.5, 24.66, 25.38], "trend": 11.89, "latest": 25.4, "wordNumber": 932202, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [20.41, 23.16, 25.65, 28.2, 28.92, 29.22, 30.11], "trend": 9.7, "latest": 30.1, "wordNumber": 913806, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [11.18, 11.78, 12.31, 12.93, 14.88, 17.97, 19.27], "trend": 8.09, "latest": 19.3, "wordNumber": 1787203, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [14.41, 14.98, 15.72, 17.56, 18.55, 19.51, 20.16], "trend": 5.75, "latest": 20.2, "wordNumber": 4630238, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [16.93, 17.53, 18.08, 19.33, 19.95, 20.74, 21.23], "trend": 4.3, "latest": 21.2, "wordNumber": 894770, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。 枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [26.66, 29.6, 32.97, 40.14, 43.58, 46.96, 50.1], "trend": 23.44, "latest": 50.1, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [28.64, 29.28, 32.94, 37.44, 39.18, 40.91, 42.41], "trend": 13.76, "latest": 42.4, "wordNumber": 503160, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹那个苗疆少年，他病娇又变态", "fullTitle": "别惹那个苗疆少年，他病娇又变态", "link": "https://fanqienovel.com/page/7554209550094584894", "data": [24.94, 25.36, 25.69, 26.58, 26.79, 26.96, 27.02], "trend": 2.08, "latest": 27.0, "wordNumber": 580598, "creationStatus": 0, "desc": "【已签实体待上市】\n【双洁1v1+救赎+甜宠+HE】\n【直球小甜瓜 x 毒舌阴湿傲娇】\n原书名《别惹那个苗疆少年，他病娇又变态》\n看到书中的正义女配因阻挠反派给女主种情蛊，落得被蛊虫啃食到尸骨无存的悲惨下场，柴小米默默打冷战。\n旅途中被毒蝎蛰死，她在古老神秘禁地醒来。\n系统：「宿主想复活吗？你的任务是阻挠反派给女主种情蛊。」\n柴小米：艹。\n异瞳少年从盘旋的蝙蝠群中缓步而来，发间耳畔银饰叮当作响，漂亮得人畜无害。\n实际上他恶毒至极，是个彻彻底底黑到骨子里的病娇变态。\n柴小米知道，若干年后他将是苗疆最年轻的蛊王。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "满门炮灰读我心后，全家造反了", "fullTitle": "满门炮灰读我心后，全家造反了", "link": "https://fanqienovel.com/page/7266411377009364008", "data": [24.63, 24.79, 24.9, 25.24, 25.49, 25.78, 26.01], "trend": 1.39, "latest": 26.0, "wordNumber": 1309817, "creationStatus": 0, "desc": "【实体书《揽明珠1》已出，全平台可购】\n【读心术+系统+团宠+穿书+扮猪吃虎】乔娇娇上辈子功德太满，老阎王许她带着记忆投胎，还附加一个功德商城金手指。\n乔娇娇喜滋滋准备迎接新的人生，结果发现她不是投胎而是穿书了！穿成了古早言情里三岁早夭，戏份少到只有一句话的路人甲。\n而她全家满门忠臣皆是炮灰，全部不得好死!\n【爹啊，你是一心为国为民的大英雄，最后沦为政治斗争的牺牲品，被午门斩首啊！】\n【娘啊，你被有心之人算计，与爹爹离心，最后思虑过重，抑郁而亡啊！】\n【大哥啊，你一生光风霁月，为民请命，最后奸人捏造罪证，害你被五马分尸啊！】\n【二哥啊，你少年热血，为国守边，最后在沙场上被人暗算，马革裹尸啊！】\n乔家全家：“.......”\n【呜呜呜，连我也三岁早夭，死得不明不白！】\n乔家全家：“什么！这不能忍，谁也不能动他们的娇娇！圣上任由次子把持朝纲，残害忠良，那他们就辅佐仁德太子，反了！”\n最后，乔娇娇看着爹娘恩爱，看着大哥入主内阁，看着二哥封狼居胥，不由地一脸懵逼。\n【啊啊啊！老阎王没骗我，这辈子果然顺风顺水，幸福美满！】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "扮猪吃虎", "团宠", "穿书", "今穿古", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿成男主的拜金前女友被亲懵了", "fullTitle": "穿成男主的拜金前女友被亲懵了", "link": "https://fanqienovel.com/page/7631009218320944152", "data": [24.83, 26.64, 28.13, 29.68, 30.68, 31.31, 32.33], "trend": 7.5, "latest": 32.3, "wordNumber": 424529, "creationStatus": 0, "desc": "（评分刚出，后面会涨）【甜宠+双洁+1v1】\n姜棠穿进了一本校园文，成为男主的拜金前女友。\n男主是物理学天才，家世顶尖，清冷禁欲，谈恋爱都是柏拉图模式，妥妥的高岭之花。\n姜棠穿进来后觉得剧情好眼熟，这不是她学物理学的发疯的好闺闺写的文吗？\n当时好闺闺问姜棠要不要客串角色。\n姜棠说要，她要做男主的拜金前女友，男主完全 ckgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "警花她从地狱来", "fullTitle": "警花她从地狱来", "link": "https://fanqienovel.com/page/7517881898580839448", "data": [4.58, 4.68, 4.75, 4.89, 4.98, 5.09, 5.3], "trend": 0.73, "latest": 5.3, "wordNumber": 1371168, "creationStatus": 0, "desc": "　　青山市刑警队来了个低调沉默的女队员易念，看似柔弱，让人想保护。\n\n　　只是刑警队长连景山还没来得及伸出保护的手，就被血溅了一脸，他才发现，这姑娘逼到绝境，骨子里狠到了极致。\n\n　　易念说：“我是从血腥黑暗里爬出来的，只想找个山清水秀的地方养灵魂的伤。”\n\n　　卧底归来，让易念满身勋章，也满身伤痕。\n\n　　九星连珠古墓意外现世，暗流席卷，亡命之徒蜂拥而至。\n\n　　易念脱下制服，是早该被枪毙的黑道大姐大低调归来。\n\n　　昔日凶徒死咬不放，不知名杀手如影随形，易念被迫再度游走黑白边缘。可有人，想让她戴上面具，就再也摘不下来。\n\n　　当所有阴谋、追杀与精神迫害都指向同一个隐秘源头，最刺骨的深渊，才刚刚显露真面目。\n\n　　绝境之中，守护本心，于癫狂与毁灭之间破局追凶。\n\n　　撕裂黑暗，挣脱宿命桎梏，浴火重生，再揽荣光。\n\n　　没有深渊，能让英雄沉沦。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "漫画预言杀人事件", "fullTitle": "漫画预言杀人事件", "link": "https://fanqienovel.com/page/7477901455727283225", "data": [4.65, 4.67, 4.67, 4.81, 4.97, 5.05, 5.21], "trend": 0.56, "latest": 5.2, "wordNumber": 393660, "creationStatus": 0, "desc": "【漫画师 X 复仇者】陈荷三年前坑掉的一部扑街漫画突然爆火，原因是预言了一宗凶案。\n　　网友们在漫画评论区瑟瑟发抖：\n　　[你们看新闻了吗，这一幕怎么跟电视上播的一样啊！]\n　　[我没有看错吧，尸体是刚刚发现的，漫画是三年前发布的！]\n　　[画手是怎么想出这种埋尸地的，有这么巧吗？]\n　　[我有一个大胆的猜测……]\n　　[作者不会就是凶手吧！]\n　　[作者你说句话啊！人不会是你杀的吧！]\n　　……\n　　面对警方的质疑，陈荷微笑答复：\n　　“这只是巧合。我们画漫画的想象力很丰富的。”\n现实悬疑，本格推理，无奇幻元素。群像，主角填俩是因为只能填俩。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "群像", "悬疑恋爱"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙王聘", "fullTitle": "龙王聘", "link": "https://fanqienovel.com/page/7124257791828560929", "data": [7.08, 7.22, 7.36, 7.54, 7.57, 7.49, 7.54], "trend": 0.46, "latest": 7.5, "wordNumber": 1392761, "creationStatus": 0, "desc": "那一年我生了一场怪病，怎么都治不好。\n直到那晚血月高悬，我家张灯结彩，从那以后我有了一个看不见的丈夫。\n也是那个时候我妈神色凝重的告诫我，以后都要衷于我的丈夫，得与其他男子保持距离，否则会招来大祸！\n十九岁那年，我破戒了，而他…出现了。", "tags": ["女频悬疑", "灵异"], "borderColor": "#16a085", "backgroundColor": "#16a085 \n骆队总结：迟警官必须留在专案组！还得立马转正！\n————————————\n【如果黑云遮住这片天，罪恶无法消散，那就遮住这片云，再造一个太阳，悬于苍穹和人心之上。】\n我们终其一生，顶着烈日寒冬，我将忠于我的内心，忠于我的祖国，忠于我的人民，用我一腔热血，护一方山河无恙。\n我护你一方小小山河，你全我一腔赤忱热爱。\n　　\n  ***\n【超高智商天才实习生VS 最接地气浓颜系大队长】\n\n强强联合|破案为主，感情为辅|架空，含私设", "tags": ["女频悬疑", "悬疑恋爱", "推理", "女强", "天才", "1v1"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "心理分析者", "fullTitle": "心理分析者", "link": "https://fanqienovel.com/page/7412616178163534873", "data": [4.27, 4.3, 4.37, 4.39, 4.4, 4.4, 4.4], "trend": 0.12, "latest": 4.4, "wordNumber": 1016312, "creationStatus": 0, "desc": "病娇犯罪心理专家 VS 面瘫刑警队长\n原书名：《心理分析者》\n控制大脑的菌丝、人形蚁窝、邪恶吃播……离奇的案件折射出凶手扭曲的精神世界。\n基因给犯罪上膛，心理瞄准目标，环境扣动扳机。\n凝视深渊的人，也要警惕深渊。\n江宁希:我想跳进深渊体验一下。\n深渊:你不要过来啊！\n林司言拽住她：欢迎你先跳进我的世界。\n——\n江宁希见到帅气但面瘫的林司言时，格外兴奋。\n这竟然是个没有表情的男人。\n江宁希盯着林队长的瞳孔:你眼睛里的情绪很丰富。但你现在好像有点不耐烦。为什么呢?\n林司言:……你靠得太近了。\n表白时\n江宁希:没有遇到物理刺激，但你的瞳孔突然放大了，你在害怕我吗?\n林司言:没有。\n江宁希:那么就是另一种可能了。你对我产生了欲望。\n江宁希惊讶地发现，原来面瘫也会脸红啊。\n——\n推荐我的旧文《我一个自闭症会亿点剖尸怎么了》", "tags": ["女频悬疑", "悬疑恋爱", "悬疑", "推理", "病娇", "破案"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玫瑰利刃", "fullTitle": "玫瑰利刃", "link": "https://fanqienovel.com/page/7211480528497675279", "data": [3.93, 3.95, 3.94, 3.95, 3.97, 4.0, 4.05], "trend": 0.11, "latest": 4.0, "wordNumber": 1092931, "creationStatus": 0, "desc": "严肃正义刑警队长VS乖巧能打实习女警\n姜不寒是刑警支队的新人实习生。\n邢念生本以为，长得太漂亮的美女，一般能力有限。\n“我的刑警队不需要花瓶。”邢念生板着脸道：“实习三个月，不行滚蛋。”\n谁料到这个花瓶，身高腿长武力值爆表，一拳能把壮汉打趴。心思细腻眼神敏锐，能在蛛丝马迹中寻找线索。可盐可甜造型百变，上山下海勇往无前。\n三个月后，邢队长严肃道。\n“小姜是我们支队的心肝大宝贝，谁也别想把她挖走！”\n不知死活的队员飘过。\n“邢队，也是你的心肝大宝贝吗？”\n铁血硬汉邢队长，他竟然脸红了！", "tags": ["女频悬疑", "悬疑恋爱", "推理", "破案"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "三嫁阎君", "fullTitle": "三嫁阎君", "link": "https://fanqienovel.com/page/7588095605168163865", "data": [8.93, 9.04, 9.05, 8.9, 9.0, 8.99, 9.0], "trend": 0.07, "latest": 9.0, "wordNumber": 507650, "creationStatus": 1, "desc": "二十岁这年，我爸给我抢了一桩人人都惧怕的婚事。\n婚期定在七月十五，鬼节，而我要嫁的他……\n也不是人。\n只因我出生就没有心跳，是我爸用秘术吊着我的命，只有和这个神秘老公结婚才能得一线生机。\n成婚当天夜里，漫天飞舞的纸钱中，诡异的纸人携着八抬凤辇从天而降。\n我代替了同村少女成为了他的妻。\n结婚后，父亲诡异失踪，留下一本《世间百鬼录》，从此我携百鬼录踏入了奇幻诡谲的世界。\n千年尸王是我的保镖，万年灵物成为我的法器，渡灵扇在手了却世间万千执念，灵愈之力治愈三界山精鬼怪，我成为世间独一无二的渡灵师。\n而我的那个神秘老公，他说娶我非他所愿，等到约定期限一到，他便给我自由并赐予我长命百岁。\n我欣然接受，离婚而已，可以再嫁。\n可是……\n我都三嫁了，新郎怎么还是他？", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱", "风水秘术"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "民国言情": [{"label": "苦娘", "fullTitle": "苦娘", "link": "https://fanqienovel.com/page/7574723775518755865", "data": [2.25, 2.2, 2.14, 7.17, 9.54, 12.0, 13.47], "trend": 11.22, "latest": 13.5, "wordNumber": 854687, "creationStatus": 0, "desc": "1932年，乡野姑娘素芬为追求自由与爱情，不顾爹娘反对，没要一分彩礼，没办婚宴，跟着心上人陈春生私奔到了码头。\n两人在棚屋安了家，陈春生扛粮袋挣血汗钱，素芬缝补浆洗补贴家用，清苦日子里满是盼头。\n可等陈春生攒了些小钱，心就野了，被城里花枝招展的姑娘缠上，夜不归宿成了常态。\n素芬怀上孩子，哭着劝他回头，换来的却是陈春生的打骂。\n争执间，她被推倒在地，孩子没了，多年的感情终究是错付了。\n素芬走投无路回了老家，她早已名声扫地……\n从此，素芬孤身一人，白天捡垃圾、收废品，夜里提着篮子走街串巷卖打火机。\n风餐露宿、受尽白眼，这个苦命的女人凭着一股韧劲，在尘埃里挣扎求生，只为守住最后一点尊严。", "tags": ["民国言情", "现代言情", "民国", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "苦命村妇", "fullTitle": "苦命村妇", "link": "https://fanqienovel.com/page/7650036980222282814", "data": [3.61, 3.86, 4.19, 4.8, 5.3, 5.15, 4.6], "trend": 0.99, "latest": 4.6, "wordNumber": 339218, "creationStatus": 1, "desc": "还原民国初年，淮北平原上的柳沟村。村妇翠莲的乡村故事。\n一个死了丈夫，被婆家嫌弃，被娘家抛弃的村女，一生的心酸无赖", "tags": ["民国言情", "现代言情", "乡村", "民国"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "顶级狂妄", "fullTitle": "顶级狂妄", "link": "https://fanqienovel.com/page/7428813474534280217", "data": [6.6, 6.95, 7.25, 7.5, 7.59, 7.66, 7.39], "trend": 0.78, "latest": 7.4, "wordNumber": 380753, "creationStatus": 0, "desc": "徐白家道中落。\n　　未婚夫与名门女暧昧，又不肯放开她：“你等着结婚，我不会嫌弃你。”\n　　徐白因这门婚约，受尽了羞辱与刁难。为自保，她搭上了未婚夫的小叔叔，南城有名的混蛋。\n　　这男人风流、残暴、野心勃勃。徐白与他各取所需，竟是在风雨飘摇中站稳了脚跟。\n       “你回头是岸。”未婚夫说。\n       “他说他是岸。”男人附耳，“把这岸炸了吧。”", "tags": ["民国言情", "现代言情", "总裁", "民国", "豪门世家", "打脸"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "作大死！怂包强制爱了暴戾督军", "fullTitle": "作大死！怂包强制爱了暴戾督军", "link": "https://fanqienovel.com/page/7577212119280520254", "data": [5.65, 5.79, 5.95, 6.04, 6.05, 6.13, 6.24], "trend": 0.59, "latest": 6.2, "wordNumber": 339189, "creationStatus": 0, "desc": "短剧可预约【超怂强制爱+心声+双洁甜宠+无雌竞+引导型年上】【贪财怕死小怂包x读心腹黑活阎王】\n阮绵绵摊上大事了！\n她绑了个作死的强制爱系统。\n强制对象竟是令全北境闻风丧胆的军阀头子厉沉舟。\n系统要求：欺他、辱他、驯服他。\n任务成功解锁绝世藏宝图。\n任务失败则小命不保。\n贪财又怕死的怂包阮绵绵，只能含泪作大死。\n当她抖成筛子，一鞭子抽歪甩自己脸上时。\n厉沉舟笑了。\n他能听见她的心声。\n【哇呜痛死了，这哪是强制爱，分明是强制死。】\n【等宝藏到手，我立刻卷款跑路。】\n于是厉沉舟慵懒勾唇，“想玩鞭子？”\n他攥住她发抖的手腕，引向自己胸膛。\n“乖，往这儿抽。”\n后来——\n她结巴着命令他学狗叫，心声哭唧唧。\n【救命！要不我给您汪一个？】\n厉沉舟垂眸闷笑：“汪。”\n她哆嗦着扯他衬衫，内心哀嚎。\n【对…对不起，求求您让我撕一下~】\n他反手扣住她后颈，气息灼热。\n“别抖，我教你。”\n全北境哗然。\n活阎王厉沉舟，竟被个怂包当狗训？！\n直到宝藏现世。\n阮绵绵扑进珠宝堆，“泼天富贵到手，今晚我就跑路！”\n却被厉沉舟掐腰箍进怀中。\n“绵绵，你跑不掉了。”", "tags": ["民国言情", "现代言情", "系统", "腹黑", "甜宠", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "督军开门！小奶团背着黄金来旺家", "fullTitle": "督军开门！小奶团背着黄金来旺家", "link": "https://fanqienovel.com/page/7487639328680578072", "data": [1.68, 1.69, 1.77, 2.1, 2.22, 2.31, 2.23], "trend": 0.56, "latest": 2.2, "wordNumber": 1000703, "creationStatus": 0, "desc": "【民国+团宠+萌宝奶团+锦鲤+青梅竹马】\n刚出生的舟舟被亲生父亲和小妾的女儿掉包，遗弃在大街上。\n督军家的小少爷将她捡回了家。\n从此落败的督军府，有了翻天覆地的变化。\n战死的督军，生龙活虎的回来。\n老旧的宅子，挖出成千上万的黄金。\n倒闭的纺织厂，日进斗金赚得手软。\n家有中风的老夫人？“祖母放心，你不仅能站起来，还能跳华尔兹。”\n家有小产的大嫂？“大嫂别怕，你将来一定能生个龙凤胎。”\n从此之后，督军家福运绵绵。\n年轻夭折的大儿子活了，失踪的二儿子成商界精英。\n三儿子的疯病痊愈，四儿子留洋归来。\n哑巴小儿子不仅能开口说话，还聪慧过人。\n督军家的福运小锦鲤，一天天长大，成了全家人的小团宠。\n更是小少帅傅卿昭，从小到大放在心尖上小青梅。", "tags": ["民国言情", "现代言情", "萌宝", "团宠", "青梅竹马", "民国"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穷妻", "fullTitle": "穷妻", "link": "https://fanqienovel.com/page/7640798769482583065", "data": [11.31, 11.26, 10.88, 10.54, 11.37, 11.94, 11.76], "trend": 0.44, "latest": 11.8, "wordNumber": 362412, "creationStatus": 1, "desc": "凤霞长得标致，却是村里最不安分的姑娘。\n她没文化、没家底，也没挣钱的本事，一心就想嫁户好人家，过上好日子。\n仗着一副好皮囊，她把嫁人当成改命的唯一出路，改嫁了一个又一个男人。\n总以为下一个男人能让她吃饱穿暖、不再受苦，可造化弄人，嫁的男人竟一个比一个穷……", "tags": ["民国言情", "现代言情", "乡村", "民国"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "少帅霸妻，强扭的瓜不甜也得甜", "fullTitle": "少帅霸妻，强扭的瓜不甜也得甜", "link": "https://fanqienovel.com/page/7242257321152220217", "data": [4.41, 4.44, 4.53, 4.7, 4.74, 4.76, 4.77], "trend": 0.36, "latest": 4.8, "wordNumber": 1282257, "creationStatus": 0, "desc": "[传统宅斗+虐渣复仇+架空民国+强取豪夺+女主重生]\n少帅景元钊喜欢颜心的浓艳容貌，想要将她养在私宅，不顾她已经出嫁。\n“跟我三个月，我给你想要的荣华富贵，你丈夫会发达。”\n颜心扇了他一耳光。\n千方百计将她搞到手后，他不怀好意问她：“我和你丈夫，谁比较厉害？”\n颜心又扇他一耳光。\n后来，他卑微求她：“离婚跟我，我的脸只给你打。”\n颜心重生后，虐渣男丈夫、虐恶毒表妹，又吊打夫家一群吸血鬼。她打人打脸特厉害，大概是在景元钊那里练的，熟能生巧。", "tags": ["民国言情", "现代言情", "重生", "民国"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "带着拼夕夕在民国", "fullTitle": "带着拼夕夕在民国", "link": "https://fanqienovel.com/page/7542906101423950872", "data": [1.81, 1.99, 2.1, 2.19, 2.15, 2.14, 2.16], "trend": 0.35, "latest": 2.2, "wordNumber": 1719307, "creationStatus": 0, "desc": "主角：黎玥（简思萱）\n黎玥意外穿越到1938年，此时距离南京大屠杀才过去了不到两个月，她这具身体的主人只是一个很普通的乞儿。\n刚穿越的黎玥只觉得前途一片黑暗，她可能在这个时代都活不过三天，但很快，黎玥发现她的手机跟着她一起穿越了，手机里唯一的软件（拼夕夕）给了她活下去的勇气。\n她决定前往延安，好好在根据地苟到解放，在利用一些自己知道的历史信息帮助我党。\n可是，就在她一步一个脚印前往延安时，她偶遇了一对带着孩子的夫妇。这对夫妇给了黎玥在这个时代的第一份温暖，她以为这是萍水相逢，后会无期。\n可是，当她再次见到这对夫妇时，只看见了他们的尸体，除了一个还在襁褓中的婴儿，这对夫妇，连同他们的女儿，保镖、车夫，全部死了，马车上的财物一杯搜刮一空。\n黎玥抱着婴儿无所适从，要知道她穿越的这具身体也只是一个半大的孩子。\n这时，她在婴儿的襁褓里发现了一封信。\n这封信让黎玥做出了一个大胆的想法，她要冒用那个死去的小女孩的身份，带着这个婴儿前往上海。\n她有预感，未来在上海的生活一定非常刺激和惊险。", "tags": ["民国言情", "现代言情", "系统", "穿越", "民国", "谍战"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "挚欢", "fullTitle": "挚欢", "link": "https://fanqienovel.com/page/7 岁的时候她还出了车祸。\n因此变得又胖又横。\n堂妹骆青雨抢了她的娃娃亲，失忆了的骆青瑶过不去这个坎，恨不得杀了那对狗男女。\n有一天，堂妹的未来亲姐夫到她家里来了！\n不仅是个高门子弟，还是部队最年轻的参谋长。\n很优质！\n比之她以前的未婚夫强太多！\n骆青瑶的眼底闪过一丝得意：机会来了！妹债姐还！\n抢！\n——骆青雨，你抢我的未婚夫、我抢你的亲姐夫，不为过吧？\n——骆青华，你不是说会被抢，那是自己不被爱吗？这滋味，你也享受享受吧！\n一夜混乱，骆青瑶把傅北寒给睡了，这一夜也因为她不小心摔倒，觉醒了前世的记忆。\n醒来后，骆青瑶给自己点了个赞：干得好，咱二十一世纪的人，吃啥也不能吃亏！\n傅北寒：我出来执行个任务，就被人睡了？\n睡我的，还是个小胖妹？？？\n", "tags": ["年代", "现代言情", "穿越", "追妻火葬场", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "投胎？不！我和六零重生女换人生", "fullTitle": "投胎？不！我和六零重生女换人生", "link": "https://fanqienovel.com/page/7627049014881438745", "data": [18.98, 21.19, 22.81], "trend": 3.83, "latest": 22.8, "wordNumber": 544244, "creationStatus": 1, "desc": "评分刚开，会涨！\n【强惨狱霸风男主X貌美咸鱼小作家】\n【不下乡+不黑市+日常家长里短+互相救赎+甜文】\n下辈子荣华富贵关我这辈子什么事儿？\n林夏本是现代一个网文作者和粉丝十几万的短篇漫画作家。\n一场意外连人带窝被轰得渣都没了，喝孟婆汤投个富贵胎？她选补偿空间和六零重生女交换人生。\n林夏面对即将被卖出去换彩礼的人生，首先选择撕开林家偏心的遮羞布，不当老黄牛伺候全家，在外积极找工作。\n结果六十年代的铁饭碗没关系实在是太难了。\n“夏夏，老师给你介绍个相亲对象，其他条件都符合你的要求，就是这长相，五官分开看都好看”\n“合在一起嘛。夏夏，你知道胡子么？他就像那没有胡子的胡子，胡子头儿要是一起蹲笆篱子，他凭长相气质能当狱霸的那种。”\n林夏想了想下乡的苦。\n相！长得凶怎么了，有下乡可怕吗？\n谁知当天相亲，第二天就领了证，嫁进了铁路局家属院。\n贺凛在他荒芜的人生碰到了独属于他的救赎，迅速扒拉回了家。\n家属院众人看着美若天仙的林夏，本以为贺科长的媳妇儿肯定是被强迫嫁给他的，日子肯定不好过。\n谁知人家贺科长长得凶但他是真疼媳妇啊。\n再后来夫妻两一起努力，一个在铁路系统一路晋升，一个成为了闻名全国的畅销作家", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "相互救赎", "家长里短"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [24.77, 26.34, 27.65], "trend": 2.88, "latest": 27.6, "wordNumber": 782081, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随军？做梦呢！资本小姐来离婚的", "fullTitle": "随军？做梦呢！资本小姐来离婚的", "link": "https://fanqienovel.com/page/7514147137089702937", "data": [31.3, 33.97, 33.56], "trend": 2.26, "latest": 33.6, "wordNumber": 1157104, "creationStatus": 1, "desc": "短剧已经上线，红果抖音都可观看，剧名《月慵便枕玉凉梦》\n【先婚后爱+日久生情+调教劣犬+随军+美艳资本大小姐】\n21世纪世界著名珠宝设计师温意穿越到1971年。\n七年后，首长丈夫和儿子都只爱白月光，温意觉得自己美美的老子只身独美生活过的很滋润。\n她却意外觉醒了后半辈子的剧情。\n她居然是一本年代虐恋情深BE文里的恶毒工具人女配。\n她的儿子居然是原文里的男主：疯批阴鸷的京圈佛子。\n她的儿子和军官丈夫都会无脑的深爱白月光母女。\n儿子长大后把亲生父亲关进精神病院，把她这个亲妈打断四肢丢进山里喂狼。\n还因为无脑护着她便宜老公的白月光的女儿，对另一个女孩虐身虐心，直到那女孩儿死了她的儿子才醒悟，最终把陆家全部资产都给了白月光母女，自己抱着女孩儿的尸体跳楼自尽。\n温意觉醒之后瑟瑟发抖，她那便宜老公陆泽铭被关精神病院相当可以，可她的结局还有那个无辜女孩落的这样的结局她表示很不同意。\n于是她追到军区家属院想和陆泽铭离婚远离这些疯批。\n可在等待离婚的日子里，她才发现陆泽铭不但位高权重还会暴金币。\n面对这样优质的提款机她表示美美的老子很享受。\n后来，人人都夸白月光：温柔大方还会赚钱养家\n陆泽铭却说：\n那有啥，我媳妇粗暴野蛮还会花钱败家呢！", "tags": ["年代", "现代言情", "婚恋", "穿越", "日久生情", "大小姐"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [28.68, 29.44, 30.42], "trend": 1.74, "latest": 30.4, "wordNumber": 860782, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小辣椒闹腾，高冷首长宠宠宠", "fullTitle": "小辣椒闹腾，高冷首长宠宠宠", "link": "https://fanqienovel.com/page/7561724651605330968", "data": [26.64, 26.65, 28.35], "trend": 1.71, "latest": 28.4, "wordNumber": 1017822, "creationStatus": 0, "desc": "[年代文+爽文+虐渣+空间+双洁]\n\n上辈子，魂魄不全的黎予初，被渣男和绿茶合谋骗到了边境，落了个死后喂狗的下场！\n\n重生后，她清醒果断，\n\n渣男想升职？毫不犹豫送他去吃花生米！\n\n绿茶想要又要？做梦！你只配吃花生米！\n\n不仅处处给他们挖坑，还通过他们找到了金山银山？\n\n太好了，目之所及，不论钱财粮食还是宝贝，通通收收收！\n\n顺带着陆海空三军告状告了一大遍，把渣男的领导搞的灰头土脸，别提有多爽！\n\n啥？渣男娘受不了刺激想求自己？\nno！本姑娘不接受道德绑架！\n\n\n\n\n\n\n\n\n\n………………\n只是那个高冷的首长喂，\n你千里追到我家为哪般？想让我跟你去随军？\n\n本辣椒是觉得你有钱又大方还好欺负，\n可咱们不太合适！\n\n毕竟，跨军界告你状，让你成为了大笑话，我虽不后悔但心虚！\n\n\n而且姐有大志向：只想当村霸！\n\n………………………………\n\n小剧场：\n“听说了吗，顾首长的新婚妻子是黎予初！”\n“老天爷！这个活爹怎么又回来了？”\n嫂子们急的嘴里起了水泡，\n文工团的姑娘使劲捂住钱包，\n训狗的提前做好了被罚准备，\n\n……\n\n要说谁最欢迎黎予初这个大闹腾，\n当然是……犬！\n呃，还有某人！", "tags": ["年代", "现代言情", "宠妻", "空间", "虐渣", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "玄学真千金穿七零，认亲首长父亲", "fullTitle": "玄学真千金穿七零，认亲首长父亲", "link": "https://fanqienovel.com/page/7581118244304473150", "data": [30.18, 30.87, 31.65], "trend": 1.47, "latest": 31.6, "wordNumber": 947599, "creationStatus": 0, "desc": "江莯颜本是现代玄学界的修炼天才，早在她穿越之前，师父便已算出她有穿越到异世这一劫难。为护她周全，师父与众位师兄们，将海量金银珠宝、稀缺药材以及各种符箓和生活物资尽数收纳于芥子袋中，成为江莯颜在七十年代最大的“底气”。\n江莯颜刚穿越，便发现原主在刚出生时，就被现在的养母把她和自己的亲生女儿偷偷调换 。而养母更是为了自己的亲生女儿和儿子，逼着原主嫁给一个打死过两任老婆的老渣男。\n不过，这都难不倒江莯颜，看她如何榨干无良养父母的钱财，临走前还分别送给他们一个霉运符，让他们为欺辱原主付出代价。\n江莯颜报名下乡后，在这期间，邂逅了未来的命中注定，也重逢了自己的亲三哥。凭借精湛的玄术和医术救治了很多本该被命运辜负的人。更凭借那双能洞察虚妄的天眼，敏锐察觉到潜藏在暗处的敌特分子，保护了被下放的科研人员的安全。\n高考恢复后，江莯颜凭借过人的天赋和优异的成绩考入京市的顶尖学府，也终于和亲生父母相遇，开启了属于她的璀璨篇章！", "tags": ["年代", "现代言情", "穿越", "天才", "虐渣", "真假千金"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随妈改嫁军区院：首长他蓄谋已久", "fullTitle": "随妈改嫁军区院：首长他蓄谋已久", "link": "https://fanqienovel.com/page/7530871199874681880", "data": [22.92, 23.63, 24.11], "trend": 1.19, "latest": 24.1, "wordNumber": 1116007, "creationStatus": 0, "desc": "【年代+群像+军婚+家长里短+病娇+打脸虐渣+女强】\n天才医生江临夏累死在手术台上，穿成80年代受人排挤欺辱的小村姑。苏醒后，她与泼辣老妈林阿秀联手揍人渣，成了村里的女霸王！\n\n老妈捡回重伤的顾石野。眼看母女俩艰难度日，又因为自己的到来被羞辱，救命恩情加烈士遗孀身份，顾时野果断求婚歪婆娘：“我娶你，你和阿夏都跟我走！”\n\n 母女俩一合计：进军区大院？不亏！\n\n谁知大院才是真地狱开局，流言蜚语如刀，弟弟不认，哥哥不睬 : "重生八零：老太太抛子弃女", "link": "https://fanqienovel.com/page/7460001987375926296", "data": [24.49, 25.13, 25.36], "trend": 0.87, "latest": 25.4, "wordNumber": 3177979, "creationStatus": 1, "desc": "【年代】【八零】【微群像】【重生】【爽文】【无金手指】【家长里短】\n（又名：重生八零：老太太抛子弃女）七旬老太吴知秋重生了，重生到孩子们还要靠她辛苦付出的年代！上辈子自己偏心，晚景凄凉。重生不重演，老太太决定抛开儿女，美美的过余生！\n小儿子哭唧唧抱着大腿，妈！我可是你最爱的小儿子，我要给你买大房子！为了能跟老娘在一起生活，砒霜拌馅，鹤顶红勾芡，为了老娘没事就得插兄弟两刀！\n公婆化身王炸组合“我那最有出息的大孙呦！爷奶想吃锅子，烤肉，洋饭……”把大儿子两口子坑的裤衩子都穿不上溜。\n宠妻狂魔李满仓……别和我说，这家我说的不算！", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小嘴叭叭姜糖，哑巴哈哈裴蘅", "fullTitle": "小嘴叭叭姜糖，哑巴哈哈裴蘅", "link": "https://fanqienovel.com/page/7633431503636007960", "data": [21.59, 22.32, 22.33], "trend": 0.73, "latest": 22.3, "wordNumber": 396004, "creationStatus": 1, "desc": "【七零年代+金手指】【性格冷静+拒绝恋爱脑】【男主姜糖脑+长嘴】\n“妈，我长大了。”\n“我真的长大了。“\n“您，可以离婚，我支持您。”\n周秀梅震惊：“小孩子，瞎说什么，哪有亲闺女劝爸妈离婚的？”\n姜糖：“您才胡闹，哪有亲闺女能看着自己亲妈受苦的？”\n“妈这辈子就这样了，影响你的名声可怎么好？”\n姜糖气鼓鼓：“大不了，嫁给对门的裴蘅，那小子敢不娶我，我就锤爆他的脑袋！\n刚结束科研任务三天没睡觉的裴蘅：还有这样的好事！\n“说定了，不准反悔，我现在就去单位申请！”\n姜糖：哎？哎···不是···\n咋这么着急呢？\n从小被打到大，裴蘅不能真的被自己打傻了吧···\n周秀梅：“裴蘅，这孩子·····你咋这么想不开呢？有姨在，姜糖不打你，你可千万别害怕·····”\n··········\n再后来，姜糖愕然的发现，她扯虎皮拉大旗的黑老大，竟然成了她后爸，这下好了，自家人，用着更顺手。", "tags": ["年代", "现代言情", "穿越", "青梅竹马", "魂穿", "家长里短"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [27.24, 27.42, 27.79], "trend": 0.55, "latest": 27.8, "wordNumber": 1116794, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#d35400
