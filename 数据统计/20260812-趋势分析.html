孩子，鹿之绫被迫嫁给疯批大佬，所有人都猜她活不到生崽之日。\n为保命她开始攻略，一不小心成了他的心尖宠。\n后来，她准备跑路。\n他的车停在悬崖之上，摇摇欲坠，他虚踩油门，笑得漫不经心，“我好像没听清，你是说……离婚？嗯？”\n后来，他轻抚她的脸，声线性感而残忍，“乖乖留在我身边，逃跑的人要受惩罚。”\n再后来，他满身血污地走到她面前，体力不支地倒在雨里，卑微如泥，“我到底要怎么做，你才肯留在我身边？”\n最后的最后，他闷声问她，“心肝，今天也不能亲一下？”", "tags": ["豪门总裁", "现代言情", "HE", "契约婚姻", "豪门世家", "宠妻", "大佬", "独宠", "病娇", "1v1", "忠犬"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [14.88, 17.97, 19.27], "trend": 4.4, "latest": 19.3, "wordNumber": 1787203, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒前妻再就业，汴京第一妙厨娘", "fullTitle": "恶毒前妻再就业，汴京第一妙厨娘", "link": "https://fanqienovel.com/page/7517953139266309144", "data": [15.69, 17.18, 18.29], "trend": 2.6, "latest": 18.3, "wordNumber": 579683, "creationStatus": 1, "desc": "【1v1双洁+穿书+美食+经营+日常向】\n一睁眼，叶昭昭穿成了权臣文男主的恶毒前妻。\n在书中，原主做梦都想当官夫人。\n她使尽浑身解数嫁给男主，却在男主官职被一撸到底后，不顾男主和孩子的挽留，和离回到了扬州老家，二嫁给了青梅竹马。\n只是不到一年。\n竹马就转手将原主送给上峰做礼。\n原主逃出来，辗转回到汴京，却发现新帝登基，男主一朝翻身、敕封摄政王，誉满汴京。\n原主这个前妻也变得人人喊打，最后被擅作主张的下人活生生饿死在了柴房里。\n穿书后的叶昭昭，当然不想重蹈覆辙。\n放着现成的幸福生活不要，非要回什么扬州投奔青梅竹马？\n她脑子又没进水，分得清好赖。\n小姑子难缠小叔子阴郁；\n不愁，她苦练高情商，应付两个半大孩子还不容易？\n男主颓废潦倒家里入不敷出；\n不怕，她有厨艺傍身，能眼睁睁看着丈夫孩子饿死？\n只是，她的汴京小食肆开业的那一日，怎么全汴京的权贵都来捧她的场了？\n说好的全家低谷三年、人人可欺呢？\n流水的银子哗啦啦地进账，这哪里用得着吃苦头呀！\n原本麻木沉郁的男主更是将叶昭昭视若珍宝，全家人的日子也越过越好。", "tags": ["种田", "古代言情", "美食", "穿书", "双洁", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [19.07, 20.47, 21.48], "trend": 2.41, "latest": 21.5, "wordNumber": 575759, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "农家团宠娇娇女", "fullTitle": "农家团宠娇娇女", "link": "https://fanqienovel.com/page/6849391701497220109", "data": [13.29, 13.81, 15.41], "trend": 2.12, "latest": 15.4, "wordNumber": 1459545, "creationStatus": 0, "desc": "糖宝没了爹娘，亲戚都不愿意养，说她克人。\n拥有七个孙子的杨老太为凑齐八（谐音“发”），把糖宝领回了家。\n人人都说杨家养糖宝这下要倒霉了，可杨家不仅没倒霉，还成了大周新贵！\n就是杨家人脾气不好，一有人说糖宝克人，杨老二就瞪眼：哪个不要命的说我闺女克人？\n杨老太最牛逼，抽出一根绳子跑到人家：说你自个克人，不说我就吊死在你家。\n杨家七个孙子围着糖宝：妹妹吃糖。\n糖宝：耶？我是来凑数的呀，怎么凑成了人人疼爱的小宝贝？", "tags": ["种田", "古代言情", "团宠", "古灵精怪", "甜宠", "发家致富"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [23.5, 24.66, 25.38], "trend": 1.88, "latest": 25.4, "wordNumber": 932202, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [16.5, 17.64, 18.24], "trend": 1.74, "latest": 18.2, "wordNumber": 1645373, "creationStatus": 1, "desc": "【古言架空+女强+斗极品婆家娘家+养崽+无穿越+无重生+先婚后爱】\n　　银杏五岁就伤了身子，失去了做母亲的资格，尽管她长得好看又能赚钱。\n　　但依旧没有哪个人家愿意娶她，因为娶了她就变成绝户了。\n　　唯独村里的老鳏夫赖大，不但愿意娶她，还愿意出双倍的聘礼。\n　　这让银杏贪财的娘果断点头。\n　　收了五两银子的聘礼，让他把闺女直接领走。\n　　但银杏死活不肯，她知晓已经死了两个媳妇的赖大没安好心思。\n　　可在这封建的年代，婚姻向来是由父母做主。\n　　尽管她极力反对，但也无法改变贪财娘的想法。\n　　就在她绝望之时，那个藏在她心里多年的男人出现了。\n　　萧青北：婶子，我想娶银杏，希望您能同意。\n　　王氏：你要娶银杏？人家赖大出了五两银子的聘礼，你能拿得出来吗？\n　 萧青北：我能的。\n　　 银杏：青北哥，你真的要娶我吗？\n　 萧青北：嗯，跟我走吧。\n        银杏：大宝二宝，快叫爹！\n 大宝二宝：（他们可是皇子，怎么可能随便叫爹呢！）\n     萧青北：你们想学功夫吗？（这两个小子还真是块练武的好苗子）\n   大宝二宝：师父！（叫师父是可以的）", "tags": ["种田", "古代言情", "乡村", "女强", "养崽", "古色古香"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [18.55, 19.51, 20.16], "trend": 1.61, "latest": 20.2, "wordNumber": 4630238, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [19.95, 20.74, 21.23], "trend": 1.28, "latest": 21.2, "wordNumber": 894770, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [28.92, 29.22, 30.11], "trend": 1.19, "latest": 30.1, "wordNumber": 913806, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [15.38, 15.67, 16.08], "trend": 0.7, "latest": 16.1, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "婆家休娘家拒！困境中潇洒翻身！", "fullTitle": "婆家休娘家拒！困境中潇洒翻身！", "link": "https://fanqienovel.com/page/7576293473200901182", "data": [20.26, 20.91, 20.95], "trend": 0.7, "latest": 21.0, "wordNumber": 1163296, "creationStatus": 1, "desc": "空间+商超+大女主+无cp\n两世抓奸：\n前世爸爸出轨被自己抓奸，重活一世丈夫背叛，被自己抓奸，难道老天爷就是派自己来抓奸的。\n柳思月发现父亲养小三，还有一个私生子，她与小三起冲突，被父亲拉扯摔倒，遭遇车祸。\n再醒来时，发现自己身处一个陌生的环境，看着一张张陌生的脸，嘴里说着关心的话，原来她占用了一个叫柳四月的女子的身体。\n柳四月被父母卖给邻村陆家当童养媳，那年她八岁，被带走的那天，爹娘对她说：“今天出了柳家门，从此不再是柳家人。”\n到了婆家，把她当牲口使唤，干的多吃得少。\n偶然间，撞破了丈夫和大嫂的奸情，吓得柳四月早产生下一个女儿，陆家诬陷她与人私通，这孩子根本不是小叔子的，陆云舟一纸休书，让她带着自己生的赔钱货滚。\n她抱着女儿回娘家，被爹娘哥嫂赶出来。\n心灰意冷起了轻生的念头,她站在村口的土崖边，望着曾经长大的地方，谁知脚下的土一松，整个人摔了下去，被路过的村民所救，送到娘家不留，又送到二叔家，收留娘俩。\n上天垂怜，赏赐空间，还带了一个商超，老天爷有些可爱，重活一世，绝不辜负……\n看她如何改变命运，带二叔发家致富……\n报复陆家……\n打脸娘家！有肉，汤都不给娘家喝……", "tags": ["种田", "古代言情", "空间", "无CP", "打脸", "发家致富"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "断亲住破屋？不怕，小农女有空间", "fullTitle": "断亲住破屋？不怕，小农女有空间", "link": "https://fanqienovel.com/page/7582643550953671705", "data": [13.6, 13.88, 13.89], "trend": 0.29, "latest": 13.9, "wordNumber": 1440019, "creationStatus": 1, "desc": "动漫已上线～\n真人有声已出～\n（评分刚出，后面会涨的，放心入哈～）\n【空间+架空+架空+架空+种田+女强+家长里短+有cp……】\n作为雇佣兵的方若宁，做任务时中了埋伏被炸死。\n再醒来变成农家女，因为二十文钱，差点被打死不说，全家都要被扫地出门。\n她决然断亲，带着瞎眼娘和妹妹出去自立门户。\n还获得了一个灵泉空间，她都这么惨了，空间能升级不过分吧？\n极品敢来闹事，拳打脚踢，一次把他们收拾得服服帖帖。\n神经男：“方若宁，我对你是真心的，等我高中状元，定许你十里红妆，八抬大轿。”\n方若宁：“傻逼吧，别来沾边。”\n上山打猎、挖药，赚钱盖房囤粮。\n方若宁的梦想：一家人，一间屋，养一条狗，30亿存款！\n沈延：“阿宁今天打得没有昨天痛，一定是又爱我了。”\n（注：女强，男主前期弱，心地善良，会被女主带着成长，感情线稍慢，写作不易，打分请手下留情，谢谢。）", "tags": ["种田", "古代言情", "穿越", "空间", "女强", "虐渣"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "古代农家夫妻的红火小日子", "fullTitle": "古代农家夫妻的红火小日子", "link": "https://fanqienovel.com/page/7574739331256945726", "data": [13.7, 13.75, 13.98], "trend": 0.28, "latest": 14.0, "wordNumber": 4501643, "creationStatus": 1, "desc": "（又名：清水故事）\n【古代种田/架空地图（南北乱炖）/群像（每个人都是自己人生的主角）/无空间/无金手指/乡村生活/细水长流】\n\n\n真人有声书已上线~欢迎收听~\n\n一本闲来无事，消磨光阴的好书~\n\n作者拥有五百万字长文经验，量大管饱~可放心追更观看~\n\n这是一户农家最真实的日子，是清水村林家一生的故事。\n\n这里有田间的汗水，也有市集的吆喝，\n\n有屋檐下的温馨，也有暗流涌动的危机，\n\n有病榻前的守候，也有绝境中的奋起，\n\n有朴实无华的相守，也有悄然滋生的情愫，\n\n酸甜苦辣，有哭有笑，列位看官，且听我慢慢道来...\n\n", "tags": ["种田", "古代言情", "乡村", "团宠", "互宠", "古色古香"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世：兽夫太凶猛", "fullTitle": "穿越兽世：兽夫太凶猛", "link": "https://fanqienovel.com/page/7381113315570748441", "data": [12.8, 12.89, 12.96], "trend": 0.16, "latest": 13.0, "wordNumber": 1328196, "creationStatus": 0, "desc": "【穿越兽世＋轻快甜宠+生活日常＋1vN+多雄】\n千夏在21世纪是个勤勤恳恳的打工人，这天加完班回家路上被一辆失控的汽车撞死，没想到当她再睁开眼的时候是在一个巨大的山洞里。\n山洞阴暗潮湿让她惶恐，而她身上只围着一块抹胸样式和短裙样式的破烂兽皮，她不明白她明明死去了又怎么会出现在这里。\n难道......忽然见她脑袋里电光一闪，她又细细看了身上的兽皮，这......不会是像她看的兽世小说那样，穿越兽世了吧？？？\n别人的第一兽夫是四阶、五阶强者，她一个最不受欢迎的瘦弱丑雌的第一兽夫就是这大陆的顶尖战力强者。\n上辈子她兢兢业业连个恋爱都谈过，这辈子刚穿来没多久就肚里揣崽，还上演了一场兽世带球跑。", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "带球跑"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [43.58, 46.96, 50.1], "trend": 6.52, "latest": 50.1, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [39.18, 40.91, 42.41], "trend": 3.23, "latest": 42.4, "wordNumber": 503160, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世天降小社恐，雄性们爱惨了", "fullTitle": "兽世天降小社恐，雄性们爱惨了", "link": "https://fanqienovel.com/page/7628038849679068185", "data": [19.5, 20.44, 21.08], "trend": 1.58, "latest": 21.1, "wordNumber": 535954, "creationStatus": 1, "desc": "【兽世+1v多+无种田+甜宠逆袭】\n【评分刚出～】\n林浅：摔进兽世第一天，两只白虎要和我结侣。第二天，我觉醒了空间灵泉。从此，存粮、种灵植、养兽夫，日子越过越滋润。\n\n本以为低孕育力会被嫌弃，结果他们把我捧在手心，连内衣都抢着洗。后来，人鱼王子、清冷巫医、白狼少主纷纷找上门，哭着喊着要当我的兽夫。\n\n我：……你们别挤，排队！", "tags": ["古言脑洞", "古代言情", "穿越", "空间", "兽世", "甜宠"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "读心后，疯批暴君决定洗白", "fullTitle": "读心后，疯批暴君决定洗白", "link": "https://fanqienovel.com/page/7351425788660419609", "data": [15.51, 15.81, 16.6], "trend": 1.09, "latest": 16.6, "wordNumber": 1055335, "creationStatus": 0, "desc": "【穿书+女扮男装+读心术+爽文+双强+双洁】\n宋云初穿成了虐文里惨死的反派奸相。\n按照原文，她会先被反派皇帝革职下狱，后被她爱慕的男主逸王乱箭穿心。\n思量再三，宋云初决心当个好臣子，效忠皇帝，阻止他黑化成疯批。\n*\n皇帝忽然发现自己能听见宋云初的心里话。\n【狗皇帝心狠手辣还装仁德，塑料袋都没你能装。】\n【狗皇帝生病时的脆弱模样真是我见犹怜。】\n【可惜狗皇帝是个反派，打不过狗逸王的主角光环，最后连江山也丢了。】\n皇帝：“……”\n逸王是吧？他记住了。\n\n见皇帝对千娇百媚的妃嫔毫不理睬，宋云初心里不禁嘀咕。\n【丽妃如此貌美，我要是个男的肯定招架不住，狗皇帝一直这么清心寡欲，难道是肾虚？】\n皇帝：“……？！”\n等等，她不是个男的吗？\n***\n女主武力值最强，不会削弱。\n心声设定与现实听到的声音一样，后期读心术失效。\n本文有CP！男女主从对抗路到互相信任，独美党请注意避雷。\n***\n［作者主动排雷！］\n原女主非反派！会觉醒！前50章会犯错，有争议。68章觉醒后成为女主阵营最强辅助。接受不了此设定的宝宝们请尽早弃文，或跳到68章再决定是否看后续。参考了大家的书评，原女主觉醒后口碑反转。", "tags": ["古言脑洞", "古代言情", "穿越", "女强", "反派", "穿书", "强强", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "你听心声我吃瓜，换嫁夫妻笑哈哈", "fullTitle": "你听心声我吃瓜，换嫁夫妻笑哈哈", "link": "https://fanqienovel.com/page/7592502894293683224", "data": [15.36, 15.94, 16.43], "trend": 。\n而她却是随时要领盒饭的炮灰女配，无奈边做反派狗腿子边给反派使绊子。\n在无数次暗中阻拦无果后，她索性一把抓住偏执少年，毁灭吧没招了：“这蛊你是非种不可吗？实在不行你种我身上吧。”\n少年安静地望向她，异色幽瞳浸着水泽，轻抚她手背的毒蝎刺青。\n她的耳坠被他咬在齿间：“还没发现啊，你身上早就种着我的蛊了。”\n蝎蛊，五毒之首，用心头血饲养后的威力非同凡响。\n少女无力失禁的泪滚进被褥，嗓子哑得发不出声。\n这时候，他不是应该放蛊虫啃食她吗，为什么是他亲自在啃？！\n到底是哪个环节出错了？？", "tags": ["古言脑洞", "古代言情", "腹黑", "病娇", "双洁", "1v1"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "穿书兽世：恶雌她终于吃上好的了", "fullTitle": "穿书兽世：恶雌她终于吃上好的了", "link": "https://fanqienovel.com/page/7627509785704811545", "data": [59.42, 60.66, 62.22], "trend": 2.8, "latest": 62.2, "wordNumber": 775715, "creationStatus": 1, "desc": "【兽世】+【雄竞修罗场】+【基建】\n沈湄穿进一本星际兽世大女主文，成了女主宁雪的对照组炮灰女配。\n书里的她，家世显赫，父兄宠爱，天赋惊人，除了长相普通点，处处都是优点。\n主脑刚给婚配了兽夫，结婚证还没焐热，海时代来临。\n曾经被争相追捧的毛茸茸陆地兽人一夜间沦为废兽，而曾被嫌恶满身腥气的水生兽人，成了炙手可热的生存保障。\n沈湄失去精神力，陆地兽夫无法入海捕猎，养活不了她。\n原主接受不了这个刺激，发疯了。\n租赁兽夫给别的雌性、逼迫兽夫当众跳求偶舞、将兽夫推进海里捕鱼……\n折辱、打骂、践踏，日复一日，极尽癫狂。\n最终众叛亲离，穷困潦倒，被海盗军团折磨分食。\n沈湄大骂原主变态，可一睁眼，穿到贩卖兽夫现场了！\n【“吃得超好系统”为您服务。请问，是否绑定？】\n吃得超好？吃什么？什么超好？\n后来，沈湄看着怼到眼前的胸肌、腹肌、大腿肌，陷入沉思。", "tags": ["现言脑洞", "现代言情", "幻想言情", "星际", "穿书", "基建"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糕！攻略的病娇男主怎么成真了", "fullTitle": "糟糕！攻略的病娇男主怎么成真了", "link": "https://fanqienovel.com/page/7513046483235523609", "data": [15.41, 16.61, 17.43], "trend": 2.02, "latest": 17.4, "wordNumber": 606068, "creationStatus": 0, "desc": "（短剧已上线，可以两边追）\n明媚迷糊小太阳x阴湿病娇男艳鬼\r\n【虚拟入侵现实+极限拉扯+强制爱+救赎+双洁高甜HE】\r\n司桓是某19+全息乙女游戏里的男主，是游戏玩家的下位属性男友。\r\n偏偏测试阶段，测试员总会失败，然后游戏崩塌。\r\n这次，来了个新测试员。\r\n这个女孩，除了关心他，还会讲些奇奇怪怪的话。\r\n【长成这样怎么还不谈恋爱，该不是在等我吧？】\r\n【不好意思太紧张了做我宝宝吗？】\r\n女孩一边嘴巴调戏他，一边摸鱼折磨他。\r\n他假装配合地，被她日复一日的驯成了乖狗。\r\n女孩却消失了。\r\n他怎么找也找不到她。\r\n于是，他干脆颠覆了虚拟的世界，来到了她的身边……\r\n*\r\n鹿芝芝终于完成了游戏测试，拿到了可观的奖励，挽救了濒临破产的鹿家。\r\n这样她就又能做回无忧无虑的大小姐，享受快乐的大学时光。\r\n至于游戏中的那个人，那些情节……她要全部忘掉！\r\n一踏入校园，好心的前辈们让她感受到治愈。\r\n她扬起一抹笑，“学姐学长好！我是鹿芝芝！”\r\n“你好。”好听的男声从背后响起，“需要帮忙吗？\"\r\n鹿芝芝回头，俊美得像从二次元来的男生，眼神黏腻，笑得却温柔：“我是你的学长，司桓。”", "tags": ["现言脑洞", "现代言情", "甜宠", "病娇", "HE", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "老太片场跑龙套，养活古代一家人", "fullTitle": "老太片场跑龙套，养活古代一家人", "link": "https://fanqienovel.com/page/7614407271283444798", "data": [18.09, 19.46, 19.81], "trend": 1.72, "latest": 19.8, "wordNumber": 607824, "creationStatus": 0, "desc": "王莲花上山挖野菜，一脚踩空——\n再睁眼，到了个妖怪窝。\n铁壳子满地跑，比马车还快。\n人穿得露胳膊露腿，不知羞！\n房子高得脖子仰断都看不见顶。\n王莲花攥紧背篓，心里只有一个念头：这咋回去？家里还等着野菜下锅呢！\n正懵着，一张纸片子塞到她手里：“阿姨，剧组招群演，盒饭管饱，一天八十！”\n王莲花不识字，但“盒饭管饱”四个字，她听懂了。\n一把拽住那人：“大兄弟，这活我能干！”\n第一天进组，演尸体。\n导演喊“卡”之后别人都爬起来了，她还直挺挺躺地上，眼睛闭得紧紧的。\n场务吓一跳：“阿姨？阿姨你醒醒！”\n王莲花睁开眼，一脸忐忑：“这就完了？我看旁边那人不是躺了老半天吗？我躺够时辰没？能结账不？”\n场务：“……阿姨，您多躺的这一会儿不算钱。”\n王莲花心疼坏了：亏了，躺多了。\n后来剧组发现，这个农村大姐简直是宝贝。\n演逃荒的难民，她往地上一坐，眼神里的绝望把场务都看哭了——这老太太是真有故事啊！\n演村妇骂街，她袖子一撸，一口气骂三分钟不带重样，把全场演员都镇住了。\n工资日结，王莲花拿着那纸钞，知道这钱能买多少米、多少肉、多少布，手抖得跟筛糠似的。\n她当场就哭了，要是早点来这个地方，她男人是不是就不用死了？", "tags": ["现言脑洞", "现代言情", "穿越", "娱乐圈", "空间", "古穿今"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成男主的拜金前女友被亲懵了", "fullTitle": "穿成男主的拜金前女友被亲懵了", "link": "https://fanqienovel.com/page/7631009218320944152", "data": [30.68, 31.31, 32.33], "trend": 1.65, "latest": 32.3, "wordNumber": 424529, "creationStatus": 0, "desc": "（评分刚出，后面会涨）【甜宠+双洁+1v1】\n姜棠穿进了一本校园文，成为男主的拜金前女友。\n男主是物理学天才，家世顶尖，清冷禁欲，谈恋爱都是柏拉图模式，妥妥的高岭之花。\n姜棠穿进来后觉得剧情好眼熟，这不是她学物理学的发疯的好闺闺写的文吗？\n当时好闺闺问姜棠要不要客串角色。\n姜棠说要，她要做男主的拜金前女友，男主完全不爱她，一个月只见一面，但副卡随便刷，分手还会有九位数的巨额分手费。\n好闺闺大手一挥同意了。\n姜棠现在就是这位前女友，她需要维持拜金值，每天狂刷男主的卡，等待分手后拿到巨额分手费。\n但是男主说好的柏拉图呢？\n第一次约会刚牵手就搂腰，第三次约会要抱抱，第五次约会竟然想亲亲？\n姜棠都不敢想他以后还想做什么。\n她觉得一定是她维持人设的方式不对。\n她努力娇蛮任性，每天99+消息轰炸，男主总该对她厌烦了吧？\n男主看她的眼神怎么越来越深了。\n女主终于出场。\n姜棠主动提分手，清冷禁欲的男主开始发疯，她被抱着亲懵了。", "tags": ["现言脑洞", "现代言情", "系统", "学霸", "甜宠", "双洁"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成超稀有雌性，被大佬们追着宠", "fullTitle": "穿成超稀有雌性，被大佬们追着宠", "link": "https://fanqienovel.com/page/734277844709094504 : "https://fanqienovel.com/page/7199806910327950392", "data": [18.49, 18.66, 18.86], "trend": 0.38, "latest": 18.9, "wordNumber": 1775762, "creationStatus": 0, "desc": "【影视版权已售】吕颂梨穿书了，穿成《权臣的娇美继室》里男主谢湛的炮灰原配。\n　　\n　　书里，原主会被从流放之地衣锦归来的好友赵郁檀抢了丈夫。他们在她重病时暗通曲款，活活气死了她。\n　　\n　　吕颂梨正打算撸起袖子手撕渣男贱女，却发现赵郁檀不打算维持原著剧情了，她想让两人互换未婚夫。吕颂梨默默地让她把渣男抢走了。\n　　\n　　但是，他们为什么还要请太后娘娘强行给她和秦晟赐婚？\n　　\n　　嫁进注定要被流放的秦家，她只好撸起袖子干了。\n　　\n　　不料干着干着，摊子越铺越大。\n　　\n　　秦家也没办法了，为了护着这摊子，只能打仗打仗再打仗。\n　　\n　　最后，吕颂梨和秦晟二圣临朝了，史称吕皇秦帝。\n　　\n　　秦吕两家一跃成为新朝最顶级的权贵。\n　　\n　　一次喝酒中，好友问秦晟，怎么会想到造反的？\n　　\n　　世代忠良的秦晟睁着微醉的眼眸说，商队是妻子给划拉起来的，贤士是妻子给招的，招兵买马的钱是妻子给的，一不小心妻子就为他们凑齐了造反的资本。\n　　\n　　妻子把摊子搞大了，不造反成功，他们很难收场的。\n　　\n　　天下：原来他们新朝两位圣人的皇位是这么来的啊，吕皇果然野心勃勃。\n　　\n　　吕颂梨：滚蛋，这个锅她不背！他们老秦家在原著里就造反了好吗？", "tags": ["宫斗宅斗", "古代言情", "宠妻", "穿越", "甜宠", "反派", "穿书", "虐渣", "今穿古", "打脸", "1v1", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "宠妾灭妻？这侯门主母我不当了！", "fullTitle": "宠妾灭妻？这侯门主母我不当了！", "link": "https://fanqienovel.com/page/7216360675109506103", "data": [14.95, 15.15, 15.21], "trend": 0.27, "latest": 15.2, "wordNumber": 598926, "creationStatus": 0, "desc": "【年度巅峰榜】投票活动开始，搜索【年度巅峰榜】可以为本书《婉复闺中》投出一票，谢谢大家~\n【传统古言宅斗+重生虐渣打脸+王爷追妻】\n　　蔺云婉是名门蔺氏的嫡女，在侯府即将被夺爵时，下嫁世子陆争流。\n　　新婚当天，丈夫冷冷扔下一句“娶你非我本愿”，便冷落她整整七年。\n　　她始终抱有一丝夫妻和睦的希望，悉心为他教养宗族里过继来的养子。\n　　直到养子功成名就，她也累垮了身体。\n　　她以为自己这一生也算圆满。\n　　临死前，养子却对她说：“母亲？她才是我的母亲！你不过是个狠毒的养母。”\n　　陆争流带着他身份低微，只配为妾的“表妹”，对她说：“你占了主母之位二十年，该还给宝儿了。”\n　　蔺云婉活生生气死。\n　　二十年经营拱手送人，连孩子也是替旁人养的。\n　　真是不甘啊。\n　　重活一世，她不干了。　\n　　胆敢踩在她头上称心如意，她就让他们悔不当初！　\n　　\\\\\n　　武定侯世子夫人死在了一场大火中。\n　　据说世子陆争流撕心裂肺到发疯。\n　　与此同时，最受宠的桓王齐令珩，身侧也有了雍容华贵的王妃，有人发现桓王妃居然与蔺云婉长得一模一样。\n　　齐令珩深沉隽美的脸上，难得出现笑意：幸好某人不识货，否则本王怎么能娶到心仪的王妃？", "tags": ["宫斗宅斗", "古代言情", "虐渣", "重生", "打脸", "追妻火葬场"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局被卖，我在王府开启逆袭之路", "fullTitle": "开局被卖，我在王府开启逆袭之路", "link": "https://fanqienovel.com/page/7487969155233090584", "data": [14.94, 15.0, 15.16], 两千多个日日夜夜，一万三千公里长路，是我从未有一刻动摇，为你献上的全部思念与忠诚。」\n*\nTIPS：\n1. 单眼皮年下酷哥/男主暗恋成真/五岁年龄差；\n2. 开篇即重逢/内含大量回忆杀；\n3. 主角均无原型/F1", "tags": ["星光璀璨", "现代言情", "娱乐圈", "暗恋", "HE", "双洁"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯批大佬病态溺宠，小娇软被亲懵", "fullTitle": "疯批大佬病态溺宠，小娇软被亲懵", "link": "https://fanqienovel.com/page/7199968411785366561", "data": [7.85, 7.89, 7.99], "trend": 0.14, "latest": 8.0, "wordNumber": 300816, "creationStatus": 0, "desc": "短剧已上线｜【貌美软糯钓系小娇娇x位高权重疯批大佬】\n姜杳杳穿书的时候，她正娇滴滴坐在反派大佬腿上，红唇贴向男人侧脸。软声甜气，媚眼如丝，\n“裴先生，杳杳仰慕您很久了……”\n男人垂眼看她，眸底冰冷毫无波澜。\n下一瞬，手腕被攥住。\n原主偷偷握在手里的匕首暴露在灯光下，寒芒闪动。\n背锅侠姜杳杳：“！！！”\n……\n书中她有印象，捅刀子失败后，反派大佬心狠手辣阴鸷冷血，当即就把炮灰女配姜杳杳剥皮削骨，做成了灯笼。\n反应过来的姜杳杳小脸一白，瞳孔震惊。\n她又怂又怕，磕磕绊绊地说着解释的话，反派大佬面无表情地看着她，姜杳杳差点觉得自己又要死了。\n可谁料——\n反派大佬摩挲着刀柄，低沉声线禁欲又撩人，连气息都仿佛环绕在她耳边：\n“不是说仰慕我，然后呢？”\n\n-\n裴珩其人，凉薄狠戾，偏执冷情。\n在没遇见姜杳杳之前，他如高山薄雪，俯视众生。\n无数名媛狂蜂浪蝶般争奇斗艳，他连一个眼神都欠奉。\n可后来，他的目光总是不由自主地追随着那个纤细身影，不厌其烦地哄她吻她，说尽世界上最好听的情话。\n他的宝贝杳杳蜷缩在他怀中，乌发红唇，漂亮小脸眼尾晕开一片薄红，甜软嗓音微微发颤，\n“裴珩……老公……”", "tags": ["星光璀璨", "现代言情", "宠妻", "穿越", "娱乐圈", "甜宠", "反派", "穿书", "冰山", "豪门世家", "明星", "大佬"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "醋缸翻，病娇佬宠废", "fullTitle": "醋缸翻，病娇佬宠废", "link": "https://fanqienovel.com/page/7075238909369650187", "data": [8.32, 8.32, 8.36], "trend": 0.04, "latest": 8.4, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古风世情": [{"label": "死遁后，成了盲眼王爷的白月光", "fullTitle": "死遁后，成了盲眼王爷的白月光", "link": "https://fanqienovel.com/page/7640771121582722110", "data": [6.93, 7.64, 8.33], "trend": 1.4, "latest": 8.3, "wordNumber": 313965, "creationStatus": 0, "desc": "（细水长流/日久生情/双向救赎/少年爱恋/he）\n　　逃荒北上，苏缨饿得奄奄一息，险些死在漫天风雪里。\n　　是尚书府的盲眼小公子裴修救了她，将她带入府中。\n　　两年后，皇权更迭，裴家一朝倾覆。\n　　抄家那夜，苏缨趁乱将小瞎子救走。\n　　·\n　　那年，苏缨十六岁，带着一个十五岁的盲眼少年东躲西藏讨生活。\n　　一路颠沛流离，苏缨觉得自己还够了恩情。\n　　恰逢意外， /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

  // ① 推荐卡片
  (function() {
    const container = document.getElementById('rec-container-' + sfx);
    const groups = {};
    D.recTracks.forEach(t => { if (!groups[t.score]) groups[t.score] = []; groups[t.score].push(t); });
    Object.keys(groups).sort((a,b)=>b-a).forEach(score => {
      const s = parseInt(score);
      const groupEl = document.createElement('div');
      groupEl.className = 'score-group';
      const labelEl = document.createElement('div');
      labelEl.className = 'score-group-label';
      const scoreLabel =
        s>=7 ? '★★★ 强烈推荐' :
        s>=6 ? '★★★ 强推' :
        s>=5 ? '★★☆ 推荐' :
        s>=4 ? '★★☆ 建议关注' :
        s>=3 ? '★☆☆ 可参考' :
        s>=1 ? '☆☆☆ 谨慎' :
        '✕ 不建议';
      labelEl.textContent = `${scoreLabel} — ${s}分`;
      groupEl.appendChild(labelEl);
      const grid = document.createElement('div');
      grid.className = 'rec-grid';
      groups[score].forEach(t => {
        const tierClass =
          s>=7 ? 's8' :
          s>=5 ? 's7' :
          s>=3 ? 's6' :
          s>=1 ? 's5' :
          'slo';
        const scoreClass = s>=6?'high':s>=3?'med':'low';
        const agRaw = t.abs_growth != null ? t.abs_growth : 0;
        const gPct = t.growth != null ? t.growth : 0;
        const agHtml = agRaw>=0?`<span class="pill pill-up">+${agRaw}万</span>`:`<span class="pill pill-dn">${agRaw}万</span>`;
        const pctHtml = `<span style="font-size:11px;color:var(--text3);margin-left:4px">${gPct>=0?'+':''}${gPct}%</span>`;
        const gHtml = agHtml + pctHtml;
        const reasonsHtml = t.reasons.map(r=>{
          let cls='tag-blue';
          if(r.includes('增长'))cls='tag-green';
          else if(r.includes('稳定'))cls='tag-yellow';
          else if(r.includes('系数低'))cls='tag-green';
          else if(r.includes('系数中'))cls='tag-yellow';
          else if(r.includes('腰部稳'))cls='tag-green';
          else if(r.includes('腰部中'))cls='tag-yellow';
          else if(r.includes('头部虹吸'))cls='tag-red';
          else if(r.includes('体量偏小'))cls='tag-red';
          return `<span class="${cls}">${r}</span>`;
        }).join('');
        grid.innerHTML += `<div class="rec-card ${tierClass}">
          <div class="rec-cat">${t.cat}</div>
          <div class="rec-score-badge ${scoreClass}">综合评分 ${s}分</div>
          <div class="rec-stats">
            <div class="rec-stat"><div class="val">${t.total19}万</div><div class="lbl">总在读</div></div>
            <div class="rec-stat"><div class="val">${gHtml}</div><div class="lbl">${n}日在读增幅</div></div>
            <div class="rec-stat"><div class="val" style="color:${t.coeff<5?'#22c55e':t.coeff<7?'#3b82f6':t.coeff<10?'#f59e0b':'#ef4444'}">${t.coeff}</div><div class="lbl">竞争系数</div></div>
            <div class="rec-stat"><div class="val" style="color:${t.mm_ratio<1.8?'#22c55e':t.mm_ratio<=3.0?'#f59e0b':'#ef4444'}">${t.mm_ratio}</div><div class="lbl">均腰比</div></div>
          </div>
          <div class="rec-reasons">${reasonsHtml}</div>
        </div>`;
      });
      groupEl.appendChild(grid);
      container.appendChild(groupEl);
    });
  })();

  // ② 上升题材折线图（solo legend）
  (function() {
    const ctx = document.getElementById('overviewChart-' + sfx).getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: D.days, datasets: D.overviewDatasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}万` } }
        },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b' } },
          y: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'万' } }
        }
      }
    });
    const legEl = document.getElementById('overview-legend-' + sfx);
    attachSoloLegend(legEl, chart, D.overviewDatasets);
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 增幅柱状图
  (function() {
    const chart = new Chart(document.getElementById('growthChart-' + sfx).getContext('2d'), {
      type: 'bar',
      data: { labels: D.growthCats, datasets: [{ data: D.growthValues,
        backgroundColor: D.growthColors.map(c=>c+'cc'), borderColor: D.growthColors,
        borderWidth: 1, borderRadius: 3 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { label: c => ` ${c.parsed.x>0?'+':''}${c.parsed.x}%` } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color: '#64748b', callback: v => v+'%' } },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 12 } } }
        }
      }
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ③ 气泡图
  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>均腰比</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      const mmr=m.mm_ratio!=null?m.mm_ratio:0;
      const mmc=mmr<1.8?'#22c55e':mmr<=3.0?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${mmc};font-weight:600">${mmr}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const rawBooks = D.bookChartData[cat];
      const isRead = sfx.startsWith('Read');
      // 阅读榜只展示连载中的书；图表、表格、热门标签、累计净增全部同源
      const displayBooks = isRead
        ? rawBooks.filter(b => b.creationStatus === 1)
        : rawBooks;
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = displayBooks.length > 0
        ? displayBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${displayBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = displayBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书${isRead ? '，仅连载中' : ''}，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
