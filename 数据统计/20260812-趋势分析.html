<style>

    --bg: #0f1117; --bg2: #171b26; --bg3: #1e2433; --border: #2a3040;
    --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
    --accent: #f59e0b; --accent-dim: rgba(245,158,11,.12);
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --nav-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; font-size: 14px; line-height: 1.6; }

  /* ── Fetch warning banner ── */
  .fetch-warn {
    background: rgba(239,68,68,.08);
    border-bottom: 1px solid rgba(239,68,68,.25);
    padding: 10px 40px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13px; color: #fca5a5; line-height: 1.6;
  }
  .fetch-warn-icon { font-size: 15px; margin-top: 1px; flex-shrink: 0; }
  .fetch-warn b { color: #fca5a5; font-weight: 700; }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg,#1c2138 0%,#0f1117 60%);
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 28px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; line-height: 1.2; margin-bottom: 8px; }
  .header h1 span { color: var(--accent); }
  .header-sub { color: var(--text2); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .header-sub .dot { color: var(--border); }

  /* ── Floating period switcher ── */
  .period-float {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(23,27,38,.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 4px 28px rgba(0,0,0,.45);
  }
  .period-group-label {
    font-size: 10px; font-weight: 700; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px 2px;
  }
  .period-divider { height: 1px; background: var(--border); margin: 4px 6px; }
  .period-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text3);
    background: transparent;
    border: 1px solid transparent;
    transition: color .15s, background .15s, border-color .15s, box-shadow .15s;
    white-space: nowrap;
    letter-spacing: .02em;
    text-decoration: none;
  }
  .period-btn:hover { color: var(--text2); border-color: var(--border); background: rgba(255,255,255,.04); }
  .period-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(245,158,11,.35);
    box-shadow: 0 0 10px rgba(245,158,11,.18);
  }
  .period-btn-num { font-size: 10px; font-weight: 700; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ── Sticky nav ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: var(--nav-h);
    display: flex; align-items: center;
    padding: 0 40px;
    gap: 4px;
    overflow-x: auto;
  }
  .sticky-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    white-space: nowrap;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    text-decoration: none;
  }
  .nav-item:hover { color: var(--text2); border-color: var(--border); }
  .nav-item.active { color: var(--accent); border-color: rgba(245,158,11,.3); background: var(--accent-dim); }
  .nav-num { font-size: 10px; font-weight: 700; color: var(--text3); font-variant-numeric: tabular-nums; }
  .nav-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  /* ── Layout ── */
  .period-panel { display: none; }
  .period-panel.active { display: block; }
  .container { max-width: 1320px; margin: 0 auto; padding: 32px 40px 80px; }
  .section { margin-bottom: 52px; scroll-margin-top: calc(var(--nav-h) + 16px); }
  .section-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-num { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; }
  .badge { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 3px; letter-spacing: .04em; flex-shrink: 0; }

  /* ── Cards & common ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .chart-wrap { position: relative; }
  .note { background: var(--accent-dim); border: 1px solid rgba(245,158,11,.2); border-radius: 8px; padding: 12px 16px; color: var(--text2); font-size: 12px; line-height: 1.7; margin-bottom: 20px; }
  .note strong { color: var(--accent); }

  /* ── Rec cards ── */
  .score-group { margin-bottom: 24px; }
  .score-group-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
  .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rec-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .rec-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .rec-card.s8::before { background: linear-gradient(180deg,#f59e0b,#ef4444); }
  .rec-card.s7::before { background: linear-gradient(180deg,#22c55e,#3b82f6); }
  .rec-card.s6::before { background: linear-gradient(180deg,#6366f1,#8b5cf6); }
  .rec-card.s5::before { background: #3498db; }
  .rec-card.slo::before { background: var(--bg3); }
  .rec-cat { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .rec-score-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 10px; }
  .rec-score-badge.high { background: rgba(245,158,11,.15); color: var(--accent); border: 1px solid rgba(245,158,11,.3); }
  .rec-score-badge.med  { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  .rec-score-badge.low  { background: rgba(100,116,139,.15); color: var(--text3); border: 1px solid rgba(100,116,139,.25); }
  .rec-stats { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .rec-stat .val { font-size: 15px; font-weight: 700; }
  .rec-stat .lbl { font-size: 11px; color: var(--text3); }
  .rec-reasons { display: flex; flex-wrap: wrap; gap: 4px; }
  .rec-reasons span { font-size: 11px; padding: 2px 7px; border-radius: 3px; }
  .tag-green  { background: rgba(34,197,94,.15); color: #86efac; }
  .tag-yellow { background: rgba(245,158,11,.15); color: #fde68a; }
  .tag-blue   { background: rgba(59,130,246,.15); color: #93c5fd; }
  .tag-purple { background: rgba(168,85,247,.15); color: #d8b4fe; }
  .tag-red    { background: rgba(239,68,68,.15); color: #fca5a5; }

  /* ── Table ── */
  .overview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .overview-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .overview-table td { padding: 7px 12px; border-bottom: 1px solid rgba(42,48,64,.5); white-space: nowrap; }
  .overview-table tr:hover td { background: var(--bg3); }
  .overview-table .cat-name { font-weight: 600; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill-up { background: rgba(34,197,94,.15); color: #86efac; }
  .pill-dn { background: rgba(239,68,68,.12); color: #fca5a5; }

  /* ── Racer tabs (赛道) ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); transition: all .15s; }
  .tab:hover { color: var(--text); border-color: var(--text3); }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Book table ── */
  .book-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 16px; table-layout: fixed; }
  .book-table th { text-align: left; padding: 7px 10px; color: var(--text3); font-weight: 500; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 1; }
  .book-table td { padding: 7px 10px; border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-table tr:hover td { background: var(--bg3); }
  .book-table a { color: var(--blue); text-decoration: none; }
  .book-table a:hover { text-decoration: underline; }
  .book-table .book-name-cell { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 0; }
  .book-detail-row td { white-space: normal; overflow: visible; word-break: break-word; }
  .trend-up { color: var(--green); font-weight: 600; }
  .trend-mid { color: #f97316; font-weight: 600; }
  .trend-dn { color: var(--red); }
  .expand-btn { background: none; border: 1px solid var(--border); color: var(--text3); border-radius: 4px; padding: 1px 7px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .expand-btn:hover { border-color: var(--text2); color: var(--text); }
  .book-detail-row { display: none; }
  .book-detail-row.open { display: table-row; }
  .book-detail-row td { padding: 10px 14px 14px; background: var(--bg3); border-bottom: 1px solid rgba(42,48,64,.4); }
  .book-detail-inner { font-size: 12px; color: var(--text2); line-height: 1.7; }
  .book-detail-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .book-detail-tag { background: rgba(59,130,246,.12); color: #93c5fd; border-radius: 3px; padding: 1px 7px; font-size: 11px; }

  /* ── Tags ── */
  .tag-section { margin-top: 16px; }
  .tag-section-title { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 12px; }
  .tag-bar-list { display: flex; flex-direction: column; gap: 7px; }
  .tag-bar-row { display: flex; align-items: center; gap: 10px; }
  .tag-bar-name { width: 80px; font-size: 12px; color: var(--text); text-align: right; flex-shrink: 0; }
  .tag-bar-track { flex: 1; background: var(--bg3); border-radius: 3px; height: 16px; overflow: hidden; }
  .tag-bar-fill { height: 100%; border-radius: 3px; }
  .tag-bar-count { font-size: 11px; color: var(--text3); flex-shrink: 0; width: 36px; }

  /* ── Layout helpers ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .book-layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; margin-top: 4px; }
  .book-layout > .card { margin-top: 0; }
  @media (max-width: 1100px) { .book-layout { grid-template-columns: 1fr; } }

  /* ── Solo legend ── */
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text2);
    cursor: pointer;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid transparent;
    transition: border-color .12s, opacity .12s, background .12s;
    user-select: none;
  }
  .legend-item:hover { border-color: var(--border); background: rgba(255,255,255,.03); }
  .legend-item.dimmed { opacity: .22; }
  .legend-item.solo { border-color: var(--accent); background: var(--accent-dim); color: var(--text); opacity: 1; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-hint { font-size: 11px; color: var(--text3); align-self: center; margin-left: 4px; flex-shrink: 0; }

  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>
</head>

们从各种豪车上下来进入公司时，从旁边跑过成为背景图。\n粉丝们翻看照片时总会发出疑问，那个在各个练习生后面跑的有点模糊的是谁？\n在其他粉丝互吵你家正主是黄子，是皇族，争颜永一时，顾鱼的粉丝都是在一边看热闹的。自家的小胖墩有种把秋衣扎在秋裤的实在感。\n随着时间的推移，营养跟上去的顾鱼，慢慢开始抽条，那张被星探追着不放的脸也逐渐显现出来。\n在看到自家爱豆逐渐显露出来的颜值，粉丝们表示，等一下！等一下！顾鱼你让我感到陌生！\n这是一个励志，温馨的日常文，在粉丝爱中长大的练习生", "tags": ["星光璀璨", "现代言情", "重生", "娱乐圈", "前世今生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全能顶流女星重生，卷疯娱乐圈", "fullTitle": "全能顶流女星重生，卷疯娱乐圈", "link": "https://fanqienovel.com/page/7654847548904983577", "data": [11.6, 12.55, 12.92, 13.59, 13.46, 12.64, 11.98], "trend": 0.38, "latest": 12.0, "wordNumber": 229070, "creationStatus": 1, "desc": "【重生顶流女明星卷王+高智商商业巨鳄爱扩版图大佬】\n顶流女星盛葱葱重生成贫家小妞去剧组拍戏挣学费。\n骑马射箭弹古琴，跳舞唱歌毛笔字，十八般武艺样样精通，卷疯娱乐圈众人。\n主题曲唱不出感觉？她来！\n工笔写意画的老师堵车来不了？她画！\n就连大佬没有好剧本投资，她都能亲自操刀写一部。\n娱乐圈众星望其项背，不可企及，背地里谈起她直呼怪物大魔王！\n大魔王重生一次无往不利，风生水起，只是，哎哎哎你这个大佬怎么回事，说好了一起赚钱这怎么还想把她也赚回家呢？\n做一行赚一行的某人刚干完一碗香喷喷的打卤面，眼巴巴望着她，老婆好吃，明天还想吃！\n小剧场：\n岑封在外边商业版图遍地开花，被岑父硬拽回家帮忙升级家族产业链，为摸清真实情况化身普通工人深入一线探查。\n老婆的打卤面一天不吃想的慌，某人撒娇卖萌求吃饭，无奈，盛葱葱只得抽空从剧组跑出来给男朋友送一碗她亲手做的打卤面。\n回程时，人还没到剧组，当红顶流盛葱葱私会男友，男方竟是机床修理工的消息就炸上了热搜。\n某商业大佬狂喜，栓Q，终于被发现了，这次老婆得光明正大的给名分了吧！\n（注：女主成年前只搞钱，成年后恋爱，积极向上阳光正能量。）", "tags": ["星光璀璨", "现代言情", "重生", "娱乐圈", "明星", "全能"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "悬疑脑洞": [{"label": "乙女游戏哪来的面板和血条啊喂？", "fullTitle": "乙女游戏哪来的面板和血条啊喂？", "link": "https://fanqienovel.com/page/7650859423321033790", "data": [3.5, 3.55, 4.51, 6.58, 7.66, 8.5, 9.18], "trend": 5.68, "latest": 9.2, "wordNumber": 264321, "creationStatus": 1, "desc": "【系统+万人迷+病娇+全洁+暧昧拉扯+直播弹幕+升级流+反杀+宿敌+诡异副本】\n#狠狠玩弄病娇们感情，她超勇的#\n#表面《诡异恋爱模拟游戏》，实际惊悚副本生死局#\n深夜，沈亦言手机弹出某诡异恋爱游戏。\n开局就抽中伪人卡并被画面吓死。\n好在得到重生方法——通关副本赚积分买重生卡。\n【叮咚！恭喜您开局出生在病床上】\n【您的状态：被绳索水灵灵地五花大绑着】\n【黑发红眸的斯文败类医生正优雅地拿着电锯，即将把您五马分尸！】\n沈亦言：“......？”\n【恭喜您受迷魂香影响扑倒了眼前矜贵优雅却无力反抗的白发青年！】\n【场面一度活色生香！】\n沈亦言：“这才是我们大女人该玩的恋爱游......”戏。\n【检测到白发青年为诡异，与您教导培训中会释放虫胚，使其寄生于您】\n沈亦言：“......？”\n【叮咚！】\n【--检测更多疯批病娇们正在靠近，请玩家做好准备--】\n***\n作为一个间歇性疯批变态的 : 2}, {"label": "七罪副本：她靠怠惰封神", "fullTitle": "七罪副本：她靠怠惰封神", "link": "https://fanqienovel.com/page/7655266817392249918", "data": [8.98, 9.63, 10.49, 11.18, 11.51, 11.74, 11.67], "trend": 2.69, "latest": 11.7, "wordNumber": 256240, "creationStatus": 1, "desc": "【非爽文+无限流+无cp+智斗游戏+微群像+成神之路+神明入侵】\n晏夕这辈子最擅长三件事：藏锋，偷懒，逃避。\n她本以为自己可以这样安安稳稳和妹妹相依为命，直到某天，她被卷入一场名为“神明审判”的无限游戏。\n晏夕醒来时，发现自己在一座审判厅里。\n六个人，七张椅子。\n规则只有一条：每个人必须找到属于自己的审判椅，一人坐错，全员处刑。\n别人崩溃、争吵、抢线索，只有晏夕靠在墙边，一动不动。\n众人以为她吓傻了。\n直到审判钟声敲响，她不动声色地做出正确的选择。\n他们这才发现，这个被判定为【怠惰】的女人，不是不敢动，她只是懒得做错事。\n后来，贪惏者死于欲望，色欲者毁于执念，暴怒者痛不欲生，傲慢者跪下求饶。\n所有人都在七罪试验里挣扎求活。\n只有晏夕，一步一步走上神座。\n塔灵问她：“你犯下怠惰之罪，可知悔改？”\n晏夕淡淡道：\n“我不悔。”\n“我只是累了。”\n“累到想让这场无穷无尽的审判，彻底安息。”\n（不是爽文！！！具体排雷详见第一章作话和评论，谢绝写作指导，不喜勿入）", "tags": ["悬疑脑洞", "悬疑", "无限流", "灵异", "无CP", "群像"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "老九门到盗笔，宿主他易燃易爆炸", "fullTitle": "老九门到盗笔，宿主他易燃易爆炸", "link": "https://fanqienovel.com/page/7638263689493089305", "data": [4.1, 4.3, 4.51, 4.95, 5.24, 5.57, 5.9], "trend": 1.8, "latest": 5.9, "wordNumber": 285048, "creationStatus": 1, "desc": "[无cp+团宠]\n江昭，快穿局绿茶部成员，被新上任的绿茶部部长直接打包扔进了盗笔小世界。\n江昭：不是，没人先过问一下我的意见吗？\n吴棠：你的意见是什么很重要的东西吗？要是任务失败了，我就把你扔星际监狱里去……\n江昭：一串优美的电报声飘过\n江昭再次睁眼的时候，就成了一个小婴儿。\n江昭：不是，就不能让我一穿过来的时候就是个成年人吗？为什么一穿过来就是生活不能自理的年纪？又是一串优美的电报声！\n小时候的江昭，是一颗乖巧软萌的灵珠，长大后的江昭，是唯恐天下不乱，而且还一点就炸的炮仗！\n水蝗：佛爷好歹也是九门之首，你这么直呼其名不太好吧？\n江昭嗖的一下过去踹翻了水蝗，\n江昭：我敢叫，他敢应吗？他逢年过节给我磕一个还差不多！\n张起山刚想开口\n江昭：你闭嘴！\n张起山：张家人为什么会有晚婚晚育这种东西？\n努力降低自己存在感的张鈤山：佛爷，咱也收敛点成吗？\n解九：阿昭，气大伤身！\n江昭：我要是有气不撒出来，更伤身！\n吴叁省／解联环：叔，你下手能轻点吗？我的医保卡要刷爆了！\n江昭：没把你们两个倒霉玩意儿打死，已经算得上是我脾气好了。\n吴斜：小爷爷，别骂了！别骂了！你再骂我就破防了！\n解雨辰：求放过", "tags": ["悬疑脑洞", "悬疑", "穿越", "灵异", "无CP", "同人"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进盗笔当采购，全九门都喊我靠", "fullTitle": "穿进盗笔当采购，全九门都喊我靠", "link": "https://fanqienovel.com/page/7629974068464208920", "data": [2.96, 3.15, 3.26, 3.71, 3.94, 4.13, 4.29], "trend": 1.33, "latest": …”\n“细说深不可测……”\n——\n于此同时，副本内的大佬们……\n孤狼大佬呈影（心满意足）：“是的，我是他的狗，这是我的荣幸(｡･ω･｡)。”\n公会会长风惊羽（认真脸）：“啊？你问我杨宴吗？他宽肩窄腰，气质斐然，高冷神秘……（此处省略一万字）”\n商会盟主枭鹤（温润如玉）：“希望能够取代呈影的位置，他还不配(◣_◢)。”\n某反派：“真的不能改变阵营吗？老师我想和杨宴一组o(╥﹏╥)o”\n杨宴：？你们", "tags": ["悬疑脑洞", "悬疑", "系统", "直播", "灵异", "惊悚游戏"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.5, 3.53, 3.57, 3.67, 3.72, 3.76, 3.82], "trend": 0.32, "latest": 3.8, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：强制诚实的我憋不住了", "fullTitle": "盗墓：强制诚实的我憋不住了", "link": "https://fanqienovel.com/page/7563612379108346905", "data": [4.81, 4.66, 4.57, 4.77, 4.87, 4.94, 4.99], "trend": 0.18, "latest": 5.0, "wordNumber": 252869, "creationStatus": 1, "desc": "（评分刚出，会涨哒）\n一个普通人穿越到盗笔世界，成了吴家小少爷。\n吴言，开局抽奖抽到了‘强制诚实’，这是奖励？\n再次抽奖，抽到了‘不会坏的计算器’。\n为了活下去，吴言只能尽量少说话，用‘计算器’代替自己发言！\n（有CP，有系统，团宠，搞笑甜味，不虐。主角性格是被特意培养的，单纯、幼稚，但三观极正。介意者，勿看！！！！！！！）\n看着不停说话欺负自己的黑瞎子，吴言不语，拿出计算器，不停按下减号键，计算器不停响起 “ jian jian jian jian jian jian ........”\n看着出言不逊的伙计，吴言用计算器按下几个键，计算器响起“平方根62500  等于......”\n遇到嘲讽吴家的藿仙姑，吴言不语，拿出计算器，按下六个数字‘4’ ‘3’ ‘8’， ‘4’ ‘7’ ‘8’！\n不想回答别人问题，按下计算器的“X的y次方”键，计算器会响起‘mi’！\n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "洪荒，阐教小师妹后台太硬", "fullTitle": "洪荒，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [5.35, 5.95, 7.2, 10.08, 11.07, 11.45, 11.87], "trend": 6.52, "latest": 11.9, "wordNumber": 168981, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽卡召旧族，炮灰她掀了修真界", "fullTitle": "抽卡召旧族，炮灰她掀了修真界", "link": "https://fanqienovel.com/page/7490181810219912217", "data": [13.05, 14.31, 15.54, 16.81, 17.29, 17.69, 17.33], "trend": 4.28, "latest": 17.3, "wordNumber": 220990, "creationStatus": 1, "desc": "【修仙+穿书+抽卡系统+女强爽文+升级流+无cp+炮灰逆袭+隐世古族+打脸】评分刚出后续会涨\n———\n救命，云衡居然穿成了修仙文里活不过三章的炮灰。\n原书女主天命加身，贵人相护，随手一句话，就能让她身败名裂、死无葬身之地。\n这可怎么办？\n叮，恭喜宿主绑定抽卡系统，现在开启十连抽。\n什么？抽卡系统？\n于是云衡走上了赚取敬畏值抽卡的不归路......\n———\n无垢灵根？测！叮，敬畏值+900\n元婴中期？打！叮，敬畏值+2100\n问武场元婴榜？上！叮，敬畏值+9000\n炼虚长老？揍！叮，敬畏值+30000\n———\n别人靠天命逢凶化吉，她靠抽卡把死局抽成杀局。\n被污偷盗，她反手甩出溯影符，当众翻案。\n无人撑腰，她召出旧族侍令，满宗失声。\n原书女主抢机缘，她先一步截胡秘境。\n宗门世家想试探她底细，她便让他们自己脑补出一个避世万年的古老大族。\n———\n起初，所有人都以为她只是运气好。\n后来，影卫归位，古剑复鸣，旧族遗迹重见天日。\n他们才知道——\n云衡身后的隐世古族，从来不是假的。\n她抽出的每一张卡，都在唤醒一个被天命抹去的时代。", "tags": ["玄幻言情", "系统", "女强", "穿书", "无CP", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天才辅灵师在异世大陆挖疯了", "fullTitle": "天才辅灵师在异世大陆挖疯了", "link": "https://fanqienovel.com/page/7653630361284398105", "data": [7.4, 8.03, 8.41, 9.36, 9.82, 9.49, 9.72], "trend": 2.32, "latest": 9.7, "wordNumber": 150319, "creationStatus": 1, "desc": "(异世采集+空间+1V1)\n植物学研究生宋知意因外出采集植物样本时不慎摔下山，穿越到了异世大陆。\n她跟着哥嫂一起外出采集，觉醒为辅灵师后她发现自己能看到不同品阶的能量食材所散发的光，利用这些光，她采集到了各种各样的能量食材。", "tags": ["玄幻言情", "幻想言情", "穿越", "空间", "天才", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓，满级古武麒麟女杀疯了", "fullTitle": "盗墓，满级古武麒麟女杀疯了", "link": "https://fanqienovel.com/page/7651531752468384792", "data": [5.51, 5.83, 6.08, 6.61, 6.52, 6.63, 6.67], "trend": 1.16, "latest": 6.7, "wordNumber": 154822, "creationStatus": 1, "desc": "【亲情向无cp+盗笔同人+张家人+南部档案+老九门+终极笔记+沙海+雷城+OOC预警】\n‘我亲历所有人的宿命，却只能旁观大势倾覆’\n——\n张知绾，千年来天赋最佳的古武世家传承人。\n在自家武馆里N刷挖坑笔记时，被不知道从哪打来了一束金光笼罩。\n下一秒，整个人消失在了原地。\n再一次醒来，她发现自己正身处一处茫茫雪地里。\n“你是谁？”\n“我是天道。”\n“为什么带我来这里？”\n“我需要你，他们的命运被那个东西改变了，我需要你去帮助他们。”\n“……”\n天道巴拉巴拉说了一堆的话。\n张知绾歪头，只记住其中两条重要信息。\n1.她穿越了，被面前的这个天道拉进了盗笔世界。\n2.她要去拯救一些人，当然，报酬很丰富。\n既然如此，张知绾点头答应了这笔交易。\n自此，有她参与的故事正式开始……", "tags": ["玄幻言情", "盗墓", "同人", "穿越", "衍生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.3, 7.24, 7.14, 7.19, 7.37, 7.45, 7.3], "trend": 0.01, "latest": 7.3, "wordNumber": 217236, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\n——\n阮吱吱回到现实世界，不知为何，时常想起那个肆意潇洒的少年人。\n系统再次出现:【检测到男主黑化值过高，即将毁灭世界！】\n什么？\n他居然这么爱自己！\n怀着微妙情绪，阮吱吱回到书中世界，又一次见到他。\n少年穿着喜服，神情阴霾，手里拿着绳索，缓步而来。\n阮吱吱紧张，“裴厌，我可以解释，你别囚禁我——”\n她被扭断了脖子。\n倒在地上刹那，她见到的是少年把藏着的女孩抓出来，低声威胁:\n“贺喜，你再敢逃婚试试？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿书", "异世穿越", "黑化"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "bord {"label": "快穿之人渣的宠妻洗白攻略", "fullTitle": "快穿之人渣的宠妻洗白攻略", "link": "https://fanqienovel.com/page/7651178616738303038", "data": [10.87, 11.0, 10.76, 11.81, 12.22, 12.19, 11.69], "trend": 0.82, "latest": 11.7, "wordNumber": 225191, "creationStatus": 1, "desc": "【世界三已完结（评分刚出，会涨哒！）】【女频文+男主视角快穿+沉浸式扮演+每个世界1v1宠妻虐渣】\n-\n小说世界里，总有一些人渣炮灰角色，做尽伤害欺骗之事，毁掉她人一生，最后不得善终。\n\n裴衍之的任务就是穿进各个小说世界，沉浸式扮演这些渣男，洗白自己，让原本悲惨的她们幸福美满一生。\n……\n世界一：【真假千金文里，霸凌病弱真千金的嚣张养弟】\n世界二：【武侠文里，哄骗正道小师妹身子的风流采花贼】\n世界三：【狗血文里，P图擦边钓白富美的通天代游戏陪玩】\n世界四：【权谋文里，与贵妃私通的杀伐果断摄政王】\n世界五：【诡异文里，欺骗SSS级BOSS的人类榜一杀神】\n......\n劝退：【主角非好人，只对任务目标宠溺！手段狠戾！而且一开始的人渣设定不会转变得太突兀哦！】", "tags": ["快穿", "系统", "宠妻", "幻想言情", "虐渣", "1v1"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "星际第一躺平学大师", "fullTitle": "星际第一躺平学大师", "link": "https://fanqienovel.com/page/7656676073710554137", "data": [3.06, 3.34, 3.92, 5.25, 5.78, 6.01, 5.94], "trend": 2.88, "latest": 5.9, "wordNumber": 208555, "creationStatus": 1, "desc": "【星际、穿越、校园、女强、无CP】【评分刚出，后面会涨】\n两世卷王，这世放假。这辈子迎瓷发誓不卷了，躺平任嘲。\n迎瓷前两世卷生卷死，从小镇做题家卷成C9国奖得主，从外门弟子卷成天梯榜第一的天之骄子，结果两世都不得善终。\n直到第三世，眼睛一闭一睁，穿到星际时代，变成了一个五岁孤儿，迎瓷真的累了。\n这真的不是拐卖人口吗？能不能请有关部门管一管啊。\n风雨中飘摇的家，没爹没妈的她，清澈见底的财富和不努力捡垃圾就会饿死的生活。\n老天奶，她在互联网上接的不是这种日子啊。\n直到有一天，迎瓷翻到一张沾满油污的传单上写着：联邦“未成年教育保障计划”孤儿或底层贫困人口，只要通过最低入学测试就能进入就近的公立学校，享受包吃包住……\n本着免费的就是最好的，迎瓷决定去小学美美躺平，却因为每一次“省事操作”被当成隐藏实力的天才。\n她一路躺、一路被卷、一路拒绝，直到……\n（第一章作话有避雷，大家阅读前可以看一眼哦，如果是不喜欢的题材或者雷点，也方便提前识别）", "tags": ["科幻末世", "穿越", "星际", "女强", "天才", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [6.25, 6.54, 6.76, 7.11, 8.01, 8.76, 8.73], "trend": 2.47, "latest": 8.7, "wordNumber": 231099, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末 "综影视：开局抽到小纸人", "link": "https://fanqienovel.com/page/7654179746627980313", "data": [7.69, 7.97, 8.31, 7.68, 7.94, 8.12, 8.1], "trend": 0.41, "latest": 8.1, "wordNumber": 165492, "creationStatus": 1, "desc": "【女强，绝不受委屈，老书——综影视：我在小世界疯狂做任务】\n知云，一个平平无奇的普通人，因救人绑定系统面板，穿越在影视剧中的衍生世界做任务。\n第一个世界：终极笔记——易飒CP解雨臣\n第二个世界：莲花楼——小龙女CP李莲花\n第三个世界：暗河传——CP苏昌河", "tags": ["女频衍生", "穿越", "女强", "同人", "综影视", "衍生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "综影视之余笙", "fullTitle": "综影视之余笙", "link": "https://fanqienovel.com/page/7654175978326854718", "data": [4.05, 4.35, 4.32, 4.73, 4.59, 4.41, 4.32], "trend": 0.27, "latest": 4.3, "wordNumber": 168584, "creationStatus": 1, "desc": "余笙原本是个躺平的小咸鱼，没抗住快穿局的忽悠，想不开当了牛马。\n但最重要的是要过好自己的小日子。\n本书以好好生活为目的，没有那么大戾气，也不喊打喊杀，不是特别爽，介意勿入。\n第一个世界：娘要嫁人里面的嫂子魏淑青，远离齐家人，好好爱自己。\n第二个世界：知否墨兰，盛家，要多远她跑多远，带着阿娘就好。\n第三个世界：从70年代开始，原创女主沈逸真，小巷人家林栋哲重生。\n第四个世界：父母爱情，江德华。", "tags": ["女频衍生", "衍生", "同人", "穿越", "系统"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "沉香要劈天条？龙子绝不允许", "fullTitle": "沉香要劈天条？龙子绝不允许", "link": "https://fanqienovel.com/page/7656717581486656537", "data": [8.45, 9.15, 9.75, 9.42, 9.02, 8.67, 8.48], "trend": 0.03, "latest": 8.5, "wordNumber": 195250, "creationStatus": 1, "desc": "三界皆怜沉香，欲毁严苛天条，唯有敖一持斧相拦。\n他是杨戬与敖寸心藏在西海海眼的混血龙子，自幼受尽分离苦楚。\n可他深知，天条崩塌，仙神皆能徇私，苍生必将受难。\n赴天庭求援恰逢大乱，敖一硬夺盘古斧对峙沉香，隐秘身世随之公之于众。", "tags": ["女频衍生", "幻想言情", "同人", "古色古香", "衍生"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "现言脑洞": [{"label": "嫌他穷？重欲太子爷按哭恶毒前妻", "fullTitle": "嫌他穷？重欲太子爷按哭恶毒前妻", "link": "https://fanqienovel.com/page/7637546200119397401", "data": [21.2, 22.91, 25.41, 26.3, 27.56, 28.04, 27.43], "trend": 6.23, "latest": 27.4, "wordNumber": 196513, "creationStatus": 1, "desc": "【出租屋文学+破产大小姐搞钱+阴湿小狗暗恋】\n开局破产，负债千万。\n被堵在巷子里，章月以为自己要完，\n曾经被她踩在脚底的穷小子江远辞，\n却冲出来替她挡了三记闷棍！\n\n距离拉近一米，他头顶突然疯狂闪过发光弹幕，\n【心疼！未来千亿首富就是今晚瘸腿彻底黑化的！】\n【这恶毒女配不仅卷走他最后的饭钱，以后瞎眼断腿遭报应！】\n\n千亿首富？瞎眼断腿？\n章月瞬间清醒！\n这粗大腿她今天抱定了！\n“穷鬼，拼个婚吗？你请我。”\n江远辞不信，大小姐刚刚还把他骂成狗，现在就要结婚了？\n“把我当成摇尾乞怜的狗是吗？”\n“结不结？！”\n“汪汪汪！结！”\n弹幕全疯了：\n【说好的清冷暴戾未来首富呢？怎么像个被霸王硬上弓的小媳妇！】\n【恶毒前妻你住手啊！搞钱就搞钱，别一直盯着腹肌看啊！】\n婚后阴湿男爆改粘人忠犬，被她搞得羞涩难当。\n章月：“不是，说好的阴郁绝情大男主呢？这粘人精是谁啊？！”\n江远辞支棱起来了：“乖，叫老公。”", "tags": ["现言脑洞", "现代言情", "宠妻", "先婚后爱", "独宠", "发家致富", "忠犬"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [5.12, 5.36, 5.66, 7.26, 7.86, 8.63, 9.32], "trend": 4.2, "latest": 9.3, "wordNumber": 227853, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.09, 3.17, 3.31, 3.68, 3.86, 4.1, 4.37], "trend": 1.28, "latest": 4.4, "wordNumber": 268707, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破庙通古今，小乞丐们有救啦！", "fullTitle": "破庙通古今，小乞丐们有救啦！", "link": "https://fanqienovel.com/page/7650351395756837912", "data": [2.67, 2.78, 2.82, 2.85, 2.8, 2.86, 2.94], "trend": 0.27, "latest": 2.9, "wordNumber": 291877, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+群像文+温馨日常+无极品+无cp】\n逃荒路上，弹尽粮绝，\n小瑶的爹娘卖完两个姐姐又想卖掉小瑶。\n小瑶连夜逃跑，跑到闹鬼的破庙。\n鬼再可怕也没有人可怕，\n原来破庙住着装神弄鬼的小乞丐。\n无粮无水五个小乞丐快要饿死之际，小瑶向破庙内神像求救，绑定快要报废的通古今交易系统。\n五个底层小人物，与废物统子共同携手，摸爬滚打，靠着古今穿越的奇遇，一步步努力，成为有饭吃，有衣穿，有屋住的小小大人物。\n（PS：前几章写五人的相识和小乞丐在古代底层社会生存的不易，想直接看古今穿越的可以从第五章开始看。\n前期小瑶，小满，狗蛋，虎子，乌川五个孩子都是主角，都会穿现代，后期还会有小瑶姐姐夏一，夏二的加入。\n希望大家能爱上这些性格不同，但一样善良可爱懂事的孩子）", "tags": ["种田", "古代言情", "萌宝", "穿越"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身穿古代，又遇逃荒，怎么活", "fullTitle": "身穿古代，又遇逃荒，怎么活", "link": "https://fanqienovel.com/page/7655897155650980888", "data": [2.58, 2.62, 2.69, 2.97, 2.96, 2.88, 2.81], "trend": 0.23, "latest": 2.8, "wordNumber": 179664, "creationStatus": 1, "desc": "刚进入一家公司实习没几天的林荞，在帮一个离职同事送东西去楼下时，却在电梯内一脚踏空，连同装物品的纸箱子，一起穿越到了古代。\n别人穿越，都是魂穿，林荞却是整个身体都跟着穿越了。而穿越大神送给她的金手指，就是那个装有同事私人物品的纸箱子，变成了她的空间。\n就在林荞一边庆幸自己有个小的可怜的空间，一边忧愁自己在古代是个黑户时，让她更崩溃的是，她所在的地方，竟然大旱了半年，到处都是逃荒的流民。\n而她没钱没水没粮。\n苍天啊！大地啊！这叫她一个人生地不熟的现代人，在这里怎么活？\n逃荒种田文，女主无CP，不会和朝堂，贵族，大将军什么的扯上关系，就是一个普通的现代女孩在古代小心翼翼求生存，最终平安终老的日常文。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "逃荒"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [2.85, 2.61, 2.41, 2.09, 2.08, 2.41, 3.01], "trend": 0.16, "latest": 3.0, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶女一睁眼，残疾太子冷 过游戏系统善心大发，给了每个人一次获得天赋的机会。\n温苓是一个孤儿，秉持着能活就活的想法，随便一点。\n没想到运气爆发，居然出金了。\n唯一天赋【应龙：获得应龙血脉】，好的，温苓从此不当人了。\n嚼嚼嚼(￣～￣)，还别说，获得天赋后，温苓的运气有了飞升！\n非常完美，就是尾巴和角不太听使唤怎么办？温苓如是问。", "tags": ["游戏体育", "无CP", "群像", "系统", "穿越", "搞笑轻松"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "七十年代：陆老二家的独生女", "fullTitle": "七十年代：陆老二家的独生女", "link": "https://fanqienovel.com/page/7647529810461199384", "data": [6.98, 7.25, 7.63, 8.37, 9.0, 9.19, 9.55], "trend": 2.57, "latest": 9.5, "wordNumber": 208726, "creationStatus": 1, "desc": "评分刚开，后面会涨。\n（七零+独生女+日常）\n​穿越的妈，妻奴的爸，还有独生女的我！\n​陆言在父母的期盼下出生，且表示只要这一个孩子，不会再生二胎。\n爷奶一听瞬间急了……\n只生一个孩子，还是个女娃，那怎么能行？\n可是不管他们怎么劝，都没盼来小孙子。\n——\n宋玉不管在前世还是今生，都有个幸福的原生家庭。\n所以生了陆言后，她下定决心要好好培养女儿。\n有着未来的记忆，她对孩子的教导，与现在的教育观念格格不入。\n亲朋好友都认为女孩子不应该这样教，以后会嫁不出去。\n谁知二十年过去，陆老二家的闺女越来越出息了，甚至还上了电视！\n就连宋玉自己，都成了知名大作家。\n最让人惊讶的当属陆老二，初中毕业的他跟着媳妇进城后，摇身一变成了大老板……\n村里人感叹，陆家这风水养人啊！\n下岗工人陆老大：……陆家哪儿来的风水？\n陆老三：全靠二哥取了个好媳妇，又生了个好闺女。\n（非大女主，但绝不受气，有仇立马报，绝不过夜！）\n家庭群像，小说视角是围绕一家三口展开）", "tags": ["年代", "现代言情", "乡村", "穿越", "群像", "家长里短"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成了年代文女主的贵人", "fullTitle": "穿成了年代文女主的贵人", "link": "https://fanqienovel.com/page/7656801337560009752", "data": [6.31, 6.27, 6.57, 7.18, 7.16, 7.02, 7.0], "trend": 0.7, "latest": 7.0, "wordNumber": 199501, "creationStatus": 1, "desc": "苏溪二十一世纪孤儿，在现世挣扎活了25年，终于研究生毕业入职外交部，但做的再多不如命运轻轻一笔，在去拿毕业证的路上被撞死了。\n苏明溪六零年代大院子弟，年代人文中女主的贵人之一，但却是个“高能自闭儿”，眼睁睁的看着家里人一个个出事却无能为力。\n当苏溪穿成苏明溪，当一个孤儿成为了大院子弟，", "tags": ["年代", "现代言情", "穿越", "空间", "穿书", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "骗婚捞女？科研大佬独宠丰腴美人", "fullTitle": "骗婚捞女？科研大佬独宠丰腴美人", "link": "https://fanqienovel.com/page/7649237755582483518", "data": [7.59, 7.57, 7.91, 8.08, 8.16, 8.2, 8.21], "trend": 0.62, "latest": 8.2, "wordNumber": 249052, "creationStatus": 1, "desc": "【娇媚丰腴大美人VS外冷内野重欲大佬】\n【架空+八零+上位者为爱低头+独宠+先婚后爱+日久生情】\n柳娇媚穿进八零年代，成了书中那个又娇又媚的丰腴美人。\n好消息：老公穆寒舟是顶级科研大佬，工资津贴月月全额上交。\n坏消息：原主是捞女，老公是骗来的。\n按原书剧情，大佬半年后回家，发现原主是照骗，当场提出离婚。\n原主爱慕虚荣，对穆寒舟下药，企图生米煮成熟饭留在京市。\n穆寒舟自己忍着，给原主灌了十倍的药，丢进黑矿里，原主被摧残致死……\n柳娇媚瑟瑟发抖：惹不起惹不起，趁大佬还没回来，赶紧跑路！\n可原主太能挥霍了，兜里就剩二块五，估计跑出家门就饿死了。\n柳娇媚给自己定制剧本：装乖撒娇拉满情绪价值，搞一笔钱，再挑刺冷战断崖式分手。\n冷峻矜贵的科研大佬，开始电话里喊她宝宝，一张张万元汇款单砸过来，砸得柳娇媚说不出分手。\n穆寒舟一颗心，被家里的小妻子撩得辗转反侧，科研上攻坚克难，短短二个月就解决了预计半年才能解决的难题。\n提前回京市，只想按着小妻子的说法，把人狠狠宠爱，结果火车站就被正准备跑路的小妻子撞了个满怀。\n穆寒舟：宝宝！\n柳娇媚：？\n扣着小妻子的手腕把人抵在门上，穆寒舟：电话里说喜欢的，是这样吗？", "tags": ["年代", "现代言情", "先婚后爱", "独宠", "日久生情", "大佬"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "认错军官对象，都撩上勾了，咋整", "fullTitle": "认错军官对象，都撩上勾了，咋整", "link": "https://fanqienovel.com/page/7648837283092630590", "data": [6.64, 6.76, 6.89, 7.24, 7.45, 7.4, 7.24], "trend": 0.6, "latest": 7.2, "wordNumber": 287168, "creationStatus": 1, "desc": "2026年的乔欣，穿到1983年，一个同名同姓的极品美人身上。\n一睁眼，就是订亲了七年的未婚夫要退亲，她撞墙的难堪场面。\n男方担心她真寻死，让她直接去部队找她未婚夫完婚。\n“明ze（哲）不是真的想退亲，他只是太忙不能回来结婚，不想再耽误乔丫头。”\n“乔丫头直接去部队找他结婚好了。”\n就这样，乔欣踏上了去部队的火车，火车上还遇到一个原本跟她一样，要去部队找未婚夫的姑娘。\n只是那姑娘半路下车逃婚了......\n她没有原主的记忆，以为他们口中的明哲叫铭泽，并不知道是老家人平翘舌不分，把“哲”说成了“泽”。\n一出火车站，看到一个军人同志举着“傅铭泽”的牌子，就以为是她那个便宜未婚夫来接她了，乐呵呵地跑了过去。\n部队都传开了，傅营长的未婚妻人美声甜脾气还好，从不近女色的傅营长如珠如宝，打了结婚报告马上要结婚了，谁知出任务回来的付明哲付连长认出了乔欣。\n拦住了她，眼底情绪翻涌，“你是我的未婚妻！”\n乔欣无辜地看着眼前的两个帅男人，一个是真的未婚夫，一个是她刚撩上套的男人，咋整？", "tags": ["年代", "现代言情", "穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}]}, "recTracks": [{"cat": "玄幻言情", "score": 7, "reasons": ["7日增长+38.5万", "竞争系数低(2.6)", "腰部稳(均腰比1.04)"], "total19": 210.0, "growth": 22.5, "abs_growth": 38.5, "coeff": 2.6, "count10w": 4, "mean": 7.0, "mid19": 6.7, "mm_ratio": 1.04, "ndays": 7}, {"cat": "职场婚恋", "score": 7, "reasons": ["7日增长+33.5万", "竞争系数低(4.4)", "腰部稳(均腰比1.4)"], "total19": 177.8, "growth": 23.2, "abs_growth": 33.5, "coeff": 4.4, "count10w": 3, "mean": 5.9, "mid19": 4.2, "mm_ratio": 1.4, "ndays": 7}, {"cat": " 圆圆知道自己是书中的作精前女友，开局差点被偏执男主办了。\n眼前这个穷修车工，是未来的财阀太子爷。\n他重欲重欲重欲！\n她会因为绿了他，被他亲手裹上辣椒面沉塘。\n而他会在剧情作用力下，对真女主一见钟情。\n摆脱炮灰命运，从拒绝同房开始。\n为了保住小命，江圆圆开始了精密的脱身计划：\n1、忍痛拒绝诱惑，死守清白底线绝不生娃；\n2、大义灭亲，把吸血全家骗去电子厂打螺丝给她挣钱；\n3、伪装乖巧，背地里海投简历攒钱独立。\n她以为自己做得天衣无缝，随时可以抽身而退。\n却不知道，何域齐每晚看着她的眼神越来越黏腻湿热。\n他白天打四份工，晚上在小木床上把她锁死。\n当她准备逃跑那天。\n何域齐慢条斯理地脱衣服，露出八块腹肌和人鱼线：\n“想跑？很可惜，门锁死了。乖乖躺下，我们生宝宝。”", "tags": ["豪门总裁", "现代言情", "总裁", "作精"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "网恋骗了太子爷，四胞胎瞒不住了", "fullTitle": "网恋骗了太子爷，四胞胎瞒不住了", "link": "https://fanqienovel.com/page/7653132495839300633", "data": [36.33, 38.89, 40.51], "trend": 4.18, "latest": 40.5, "wordNumber": 185780, "creationStatus": 1, "desc": "整个京圈奔走相告：当年骗了裴少的网恋捞女回国了，还带了四个拖油瓶！\n众人炸锅：好家伙，这是捞上瘾了？不光自己捞，还带着小的一起捞？等着领盒饭吧！\n温茉一睁眼，穿成霸总文里的炮灰女配，还是个靠网恋诈骗，捞完跑路的职业捞女。\n“妈妈，饿饿，饭饭~”\n看着四个嗷嗷待哺、面黄肌瘦的崽子，她两眼一黑：原主捞的钱全自己花了，娃都快饿死了？\n造孽啊！没钱没经验，这烂摊子怎么接？难不成…重操旧业？继续网恋捞钱奶娃！\n正愁着，其中一个娃还丢了——转头就认了亲爹。\n男人冷笑：当年骗我钱的捞女回来了？\n全员看戏：这次裴少肯定一网打尽，必须让她铁窗含泪！\n众所周知，当年被骗钱骗感情后，裴少早已封心锁爱，只搞事业，女人别挨边。\n结果画风逐渐失控——\n说好的只搞事业不近女色呢？裴少怎么又跟那个捞女纠缠不清。\n众人：裴少你不是封心锁爱了吗？\n裴司桀：是啊，疯了心说了爱。\n后来，裴司桀为了在家奶娃陪老婆，狐朋狗友约酒也喊不动了。\n“裴少，你不能再被妖女迷惑了啊！”\n裴恋爱脑甜蜜叹气：可她和宝宝都离不开我啊～", "tags": ["豪门总裁", "现代言情", "萌宝", "总裁", "穿书", "位尊权重"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春夜难渡", "fullTitle": "春夜难渡", "link": "https://fanqienovel.com/page/7604739798246378521", "data": [20.89, 22.51, 23.85], "trend": 2.95, "latest": 23.8, "wordNumber": 280316, "creationStatus": 0, "desc": "明媚大小姐x狠厉伪绅士\n京圈｜上位者低头｜占有欲｜双洁he\n宋黎第一次见到梁靳年是在澳城，男人相貌非凡，身份尊贵，赌桌上，他连底牌都未翻，一派绅士风度，淡然开口：“宋小姐赢了。”\n是有意相让。\n几天后宋黎才得知，她与梁靳年有一纸婚约。\n京北梁家门庭显赫，圈里人评价这位梁先生：风华内敛，手段如刃，非善类。\n宋黎是有些怕的，更不满没有感情基础的“包办婚姻”，所以她想着法子要退婚。\n可无论她怎么闹腾，梁靳年都是那副温柔绅士的模样，对她百般纵容。\n就连在床上，也是以她为主，sweet情话又苏又撩。似乎永远理性从容，喜怒不形于色。\n直到某次吵架闹别扭，宋黎委屈跟人跑路。\n彼时的梁靳年亲自截车拦人。\n电话里，他语气平静却透着股疯感：“是你自己下车，还是我撞过来，你选。”\n-\n外人眼中位高权重、无所不能的梁先生，也曾做过一个迫不得已的决定。\n那年春天，风雨如晦，是梁靳年此生渡过的，最漫长的季节。\n“这场春雨会下很久，我也会很想 】\n穿成虐文女主后，婚约是男主的，人是他兄弟的，床是偷来的。\n联姻对象为了哄绿茶，转手把她推给他的禁欲兄弟照顾。\n这一照顾，就照顾到了床上。\n外人眼中鹤司忱纤尘不染，是寡欲疏离的鹤医生。\n只有司意绵知道鹤司忱清白了一辈子，脏都脏在她身上。\n鹤司忱想当圣人，但更想当她的人。\n婚约作废那天，未婚夫破大防。\n“她是我未婚妻！”\n鹤司忱抱着她，嗓音慵懒：“现在不是了。”\n“你把她当什么？”\n鹤司忱：“当你的嫂子。”\n“是你亲手把她送到我面前，求我照顾的。”\n-\n鹤司忱这辈子没当过狗，直到被司意绵断崖分手。\n素来矜贵的男人攥着她手腕跪在床沿，眼尾猩红。\n“是你引诱我进这条不伦不类的路，现在嫌腻了？ ”\n“司意绵，连玩弄人心你都玩得虎头蛇尾。”\n“以前你说想要衣冠禽兽跪下来给你当狗。”\n“我现在考证了，合法宠物，求你把我捡回来。”\n食用指南：\n她进他退，她退他疯。\n女主非传统小白花，是爱我老己配得感极高的精致利己主义者。\n表面是蜜桃糯米团子，实际是道德底线灵活的顶级操盘手。\n男主明知道女主自私被利用却还是选择为她兜底，疯狂爱上", "tags": ["豪门总裁", "现代言情", "医生", "双洁", "1v1", "年龄差"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "温夜潮湿", "fullTitle": "温夜潮湿", "link": "https://fanqienovel.com/page/7654742513151921177", "data": [24.04, 23.69, 24.65], "trend": 0.61, "latest": 24.6, "wordNumber": 244382, "creationStatus": 1, "desc": "【心机男主诱骗女宝一晌贪欢的故事】\n【双洁+甜宠+一见钟情强制爱+上位者当狗又挣又抢】\n【娇软好欺乖乖女vs腹黑心机太子爷】\n温薏生在一个高知家庭里，父母都是知名教授。\n她是父母长辈眼中的乖乖女，从小到大，几乎从不忤逆父母的想法，父母给她安排联姻，她也乖乖接受。\n直到有一天，喝醉酒的她被闺蜜不小心送到她大哥床上，她的人生，发生了天翻地覆的变化……\n一夜疯狂，温薏醒来时，看到跟闺蜜大哥躺在一张床上，彻底傻了。\n怕被要求负责，她连忙逃走，却不想这男人不仅是她闺蜜大哥，还是她顶头上司。\n隔天就被他叫到办公室，顶着一张祸国殃民的俊脸，对着她笑。\n“温小姐，上了我的床就跑，胆子挺大。”\n她只想把这件事当做一场意外，不负责不追究，可男人并不允许。\n某天深夜，他把她抵在闺房里，薄唇贴着她耳朵咬。\n“乖，再来一次。”\n“放心，我不会让你未婚夫知道。”\n她一时糊涂，被男人得逞了一次又一次，直到再也无法摆脱他……\n韩沐宸，京圈顶级豪门太子爷，毒舌又不近人情，从前清心寡欲的他，因为一次意外，跟亲妹妹的闺蜜一夜贪欢，从此一发不可收。\n亲妹说她有未婚夫，让他别痴心妄想。\n他嗤笑一声，有未婚夫又怎么了，抢过来就是", "tags": ["豪门总裁", "现代言情", "腹黑", "甜宠", "一见钟情", "双洁"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "和老板被困小渔村，日夜同床共枕", "fullTitle": "和老板被困小渔村，日夜同床共枕", "link": "https://fanqienovel.com/page/7647513898643360793", "data": [9.67, 9.78, 9.89], "trend": 0.22, "latest": 9.9, "wordNumber": 227395, "creationStatus": 1, "desc": "【貌美财迷小助理VS解决问题能力超强的年上靠谱总裁】\n【总裁和助理的被迫同居日常+心动暧昧拉扯+吊桥效应】\n舒雨微刚毕业工作，就碰上公司高层变动。\n总公司派来的新任总裁傅容峥，直接空降成了她的顶头上司。\n新老板身高188，年轻帅气，身材堪比男模。\n却总是冷着一张脸，一副生人勿近的上位者气势，高冷又可怕。\n舒雨微一个新人小助理，在他手底下兢兢业业工作，不敢出任何差错。\n可她怎么都没想到，在一次和老板出差的路上，他们碰上了恶 迟了。\n全网都在求她活着，求着她凯旋！\n她叫纪寻，代号寒戈，华国最年轻的少将。\n当所有人期待着那场授勋仪式时，她又跑去北欧把桌掀了……", "tags": ["职场婚恋", "现代言情", "直播", "女强", "强强", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "触礁对岸", "fullTitle": "触礁对岸", "link": "https://fanqienovel.com/page/7542096272866413630", "data": [17.56, 18.36, 18.8], "trend": 1.24, "latest": 18.8, "wordNumber": 299694, "creationStatus": 1, "desc": "评分刚出，可能会涨哈哈\n姜柠是顶级学府本硕博八年制的医学生，学医，博士buff叠满\n巨大压力之下，她养成了一点无伤大雅但不好宣之于口的小爱好\n本来她还处于精神放飞但是行为保守的状态，直到她毕业那年，压力过大，她忍不住对一个认识了一年多的网友发起了邀请\n网友不仅长的好，身材也好\n两天两夜，姜柠吃饱喝足后删除拉黑，潇洒走人\n答辩那天，那位传说中导师死对头的答辩主席端坐主位，赫然是那个和她在酒店待了两天两夜的男人！\n而他还即将成为她的顶头上司，领导的领导\n\n一只伤痕累累但铁骨铮铮的小狐狸遇见了心软的神\n一个端方君子第一次谈恋爱就被骗身骗心为爱发疯的故事\n\n1v1双c，男女主都很纵yu。\nhappy ending \n本人不学医，所有的东西都是按自己的想法设定的，不实的地方千万不要当真啊\nPS：作者有一直在修文，完善前后逻辑，如果有宝宝看到内容有变化是正常的喔，爱每一个看文的宝宝", "tags": ["职场婚恋", "现代言情", "职场", "医生", "1v1"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女儿惨死，我亲手覆灭仇人全家", "fullTitle": "女儿惨死，我亲手覆灭仇人全家", "link": "https://fanqienovel.com/page/7661644438480899096", "data": [3.47, 3.99, 4.38], "trend": 0.92, "latest": 4.4, "wordNumber": 178342, "creationStatus": 1, "desc": "赵云早年失去丈夫，独自一人带大女儿，不曾想，女儿刚结婚五年便带着孩子一起寻了短见。\n赵云失去女儿和外孙女的同时，却发现女婿的态度极其冷漠，她开始怀疑女儿的死并非那么简单。\n好在女儿从小便有写日记的习惯，长大后也未曾改变，她最终找到女儿的日记本，里面揭露了女儿五年婚姻中受到来自婆家一家人的各种不平等对待。\n更残忍的是，她发现这场婚姻从一开始就是一场针对女儿演的一场戏……\n极度愤怒下，赵云决定用自己的方式为女儿和外孙女讨回一个公道。\n她要让所有伤害过女儿的恶人都求生不能，求死不得！", "tags": ["职场婚恋", "现代言情", "家庭", "虐渣", "打脸", "家长里短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在总裁文里当助理", "fullTitle": "我在总裁文里当助理", "link": "https://fanqienovel.com/page/7472651990569339929", "data": [5.04, 5.5, 5.88], "trend": 0.83, "latest": 5.9, "wordNumber": 199208, "creationStatus": 1, "desc": "叶肖在这个世界生活了二十多年，有一天突然觉醒了，他才知道原来他不是土著人而是穿书的，甚至男女主跟他看的那本书也完全不一样..........而且他怎么这么爱吃醋啊！！占有欲强。\n有副CP   不一样的两对", "tags": ["职场婚恋", "现代言情", 现代言情", "先婚后爱", "隐婚", "医生", "双洁"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [7.88, 8.23, 8.61], "trend": 0.73, "latest": 8.6, "wordNumber": 269328, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "都市：一撞成婚", "fullTitle": "都市：一撞成婚", "link": "https://fanqienovel.com/page/7645558905812028441", "data": [4.67, 4.89, 5.18], "trend": 0.51, "latest": 5.2, "wordNumber": 258535, "creationStatus": 1, "desc": "夏沐在二十五岁那天和程氏集团总裁程青砚领证了。\n夏沐和柴珩相恋三年，今天是两人约定好领证的日子，夏沐在民政局等了一个小时，还不见柴珩的身影，她掏出手机给柴珩打电话，对方没接，随后给她发了一条消息：【对不起小沐，雪儿她生病了，我们改天再领证吧。】\n陆雪儿，柴珩的青梅竹马。\n夏沐看着这条消息，愣了半天，嘴角扬起一抹自嘲的笑容：“还是输了啊！”随后她收拾好自己的证件，转身朝着门外走去。\n程青砚刚下飞机，便被自己母亲的一通电话叫来了民政局，他走到门口，刚准备伸手去推门……\n夏沐一拉开门，便撞进了一个人的怀里，她鼻尖嗅到了一股淡淡的松木香气，\n“你没事吧？”\n头顶传来一道清透温润的声音。\n夏沐抬起头看着眼前的人，她眨了眨眼睛，“先生，有兴趣领个证吗？”", "tags": ["职场婚恋", "现代言情", "总裁", "先婚后爱", "豪门世家", "医生"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲闪婚，糙汉老公太直接", "fullTitle": "相亲闪婚，糙汉老公太直接", "link": "https://fanqienovel.com/page/7636132561508387902", "data": [3.15, 3.35, 3.59], "trend": 0.44, "latest": 3.6, "wordNumber": 204482, "creationStatus": 0, "desc": "【乡镇超市糙汉vs县城小会计+直球式相亲+年龄差两岁+细水长甜】\n林小晚相了七次亲，遇到的不是抠门就是奇葩，要不就是动手动脚。\n第八次，赵铁柱坐在对面，上来就摊牌：“我来相亲就奔着结婚来的，你要觉得行咱就处。”\n她以为又是三分钟热度。\n结果这人第二天就拉着她去挑三金，彩礼不打磕巴，领证不拖泥带水。\n林小晚内向又话少，生怕赵铁柱嫌她闷。\n但赵铁柱说：“你不用说太多，听我说就行。”\n婚后她第一次体会到被人护着的感觉，踏实，安心，有人撑腰。\n就是，就是这人太直接了，有啥说啥，她脸皮薄，有点吃不消。", "tags": ["职场婚恋", "现代言情", "婚恋", "家长里短", "乡村", "年龄差", "闪婚"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春潮坠落", "fullTitle": "春潮坠落", "link": "https://fanqienovel.com/page/7641023975295814681", "data": [7.32, 7.6, 7.76], "trend": 0.43, "latest": 7.8, "wordNumber": 287308, "creationStatus": 1, "desc": "（刚出分，会涨！）先睡后爱/追妻火葬场/破镜重圆/家长里短/女性成长                  \n小县城软包子×冷清傲慢教授\n排雷提醒: 非爽文，女性成长，前期虐女，后期虐男。渣男为爱低头，不换男主。\n \n结婚一年，她连他的“紧急联系人”都算不上，离婚是时凝唯一主动做的事。他们的婚姻，没有领证，没有孩子，没有一条能证明她存在过的痕迹。\n她以为离开是他默许的结束。\n\n等他费尽心思再次靠近，她却不相信了。\n“你现在想说什么？想说我离开了，你又发现离不开我是吗？”\n“陈明森，我走的那天，你说我在浪费你的时间，现在，你对我说这些，你自己不觉得可笑吗？”\n\n 他的眼底赤红阴翳，毫不掩饰占有:“我爱你，所以我也要你全身心爱我。”\n她退后半步，看着他：“凭什么，以前我的生活只有你，所以我的喜怒哀乐随你牵动，现在我不可能再牺牲我的人格，再次变成围着你转的附属。”\n\n后来，他终于学会蹲下来，可她不再需要他蹲下了。\n她曾经把爱当作救命稻草，后来她站了起来，她才明白，把她引向她更多的路，从来都是她自己的勇气。\n\n立意:我会再次相信，并且勇敢地不顾一切爱你。", "tags": ["职场婚恋", "现代言情", "家庭", "破镜重圆", "追妻火葬场", "家长里短"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "渐入婚境", "fullTitle": "渐入婚境", "link": "https://fanqienovel.com/page/7648175724460772376", "data": [4.03, 4.13, 4.32], "trend": 0.29, "latest": 4.3, "wordNumber": 156556, "creationStatus": 1, "desc": "【神外医生x麻醉医生】\n【青梅竹马+先婚后爱+过期暗恋+双洁】\n麻醉科的沈医生年轻帅气又多金，是二院无数女同事心中最佳择偶对象，偏偏其人寡言冷情，身边从未出现过异性。\n神经外科的林医生明艳动人，富贵人家出身，追求者更如过江之鲫，却不曾见她为谁抛却芳心。\n二人共事多年，堪称金牌搭档。\n但从来没人将他俩想到一起——\n众所周知，沈医生与林医生磁场不合，除工作外，其余场合形同陌路，话都懒得说一句。\n-\n后来不知从哪里传出沈医生已婚的风声。\n有同事忍不住调侃：“沈医生娶的女人，会是什么样呢？”\n林稚想了想：“那当然是风华绝代的大美女。”\n同事笑道：“说的像你知道似的。”\n林稚也笑。\n她还真知道，毕竟家里的结婚证上，落着她与沈镜池的名字。\n-\n林稚和沈镜池是人尽皆知的死对头，却鲜有人知，两人也是青梅竹马。\n两小无猜的日子里，他们好过，闹过，吵过，最后分道扬镳。\n所以联姻三个月，两人依旧各不相干，关系纯洁如白纸。\n林稚认为沈镜池跟自己一样，对这桩婚事并非自愿。\n-\n直到某次冷战，有人拍到夫妻俩各自买醉。\n众人纷纷猜测，这段婚姻是否告吹。\n当夜，林稚被男人揽在怀里，听他轻语：“不吹，这辈子都不吹。”\n-\n【两情相悦这件事，是我从青春到白头的课题。】", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "暗恋", "双洁"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "社恐乖乖女意外怀了红毛的崽后", "fullTitle": "社恐乖乖女意外怀了红毛的崽后", "link": "https://fanqienovel.com/page/7648331109100440638", "data": [7.23, 7.43, 7.41], "trend": 0.18, "latest": 7.4, "wordNumber": 297155, "creationStatus": 1, "desc": "「温柔乖乖女×红毛小伙」「双洁×偏日常×病娇×出租屋文学」\n听说了吗？\n那个一头红毛特拽的小伙，把他网恋两年的女朋友搞怀孕了。\n人家姑娘打了十次胎都没打掉。\n最后还给他生了个闺女。\n——\n有时候，一个人爱你爱到骨子里，会害怕失去。\n害怕到想用最笨的方式，把另一个人死死锁在身边。\n哪怕手段卑劣，哪怕面目狰狞，哪怕她恨他。\n潜意识里，摧毁对方，可能是为了阻止她离开，或者让她永远只属于你一个人。\n就像《茶花女》里写的：\n“我是这样爱她，以致在我极度兴奋的爱情之中，我曾想到，要不要杀了她，这样她就永远不属于别人。”\n——\n不要问甜不甜，就像问你男朋友爱不爱你一样，没有任何意义，只有试过了才知道。\n注：【文里涉及到的任何行为，以及不好的台词，请理智阅读，这是小说，不要代入现实】", "tags": ["职场婚恋", "现代言情", "追妻火葬场", "虐恋情深", "破镜重圆", "情有独钟"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "真千金分家，我靠世袭爵位搞顶奢", "fullTitle": "真千金分家，我靠世袭爵位搞顶奢", "link": "https://fanqienovel.com/page/7656408357565107224", "data": [3.15, 3.21, 3.31], "trend": 0.16, "latest": 3.3, "wordNumber": 163920, "creationStatus": 1, "desc": "沈清欢穿进了一个没有奢侈品概念的平行世界。\n身为利物浦伯爵苦心培养，惊才绝艳的养女，却在老伯爵病危之际，迎来了刚被找回的真千金。\n分家宴上，亲妹妹歇斯底里，联合远亲逼宫：\n“我要继承价值几十亿的纺织钢铁集团！你一个外人，只配分一笔现金，守着那个连修缮费都交不起的空壳伯爵爵位和破庄园滚蛋！”\n面对亲妹妹的贪婪、吃瓜群众的同情，养父的叹息声之中。\n当场签字交出集团。\n在这个工业产能过剩，只懂打价格战的世界，几十亿的大厂不过是随时会贬值的空中楼阁。\n而唯有盖着英王御赐原始特许状，允许女性继承的世袭伯爵爵位，才是通往顶级老钱圈子的唯一入场券！\n拿走三千万英镑的现金，沈清欢转身退守苏格兰高地。\n机器生产被嫌弃的手工面料？\n那是她眼中的软黄金！\n濒临失传的古老编织手艺？\n那是注入时间的高定艺术！\n当沈清欢将古老家族徽章烙印在纯手工服饰上，在伦敦顶级社交季亮相时，全英王室与顶级贵族疯狂了！\n“一件衣服要五千英镑，还要配货？买！不买就配不上我的身份！”\n“这才是真正的奢侈品！”\n(英国全名名字叫：伊芙琳·辛克莱)", "tags": ["职场婚恋", "现代言情", "穿越", "打脸", "职场", "职场商战", "豪门世家"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "体制内：我的太太是我的步步为营", "fullTitle": "体制内：我的太太是我的步步为营", "link": "https://fanqienovel.com/page/7649367076783524889", "data": [6.35, 6.5, 6.41], "trend": 0.06, "latest": 6.4, "wordNumber": 230939, "creationStatus": 1, "desc": "我的太太年纪小但乖巧，是我的底线，更是我的步步为营。\n双向心动。\n年龄 穿越到山东瓜子庙鲁王宫就见了五鬼朝拜的诡异场面。\n吴斜见这个人悄无声息摸到他们五人背后，寒意爬上脊背。\n吴斜：“你是人是鬼？”吴三醒：“人影子立那儿了，你眉毛下挂俩蛋，只扇风不会看是吧？”\n吴斜委屈巴巴：“心急则乱，再说，人难道就不可怕了吗？”\n吴三醒哑口无言，心想还真是这个理儿。\n杨花落：这人一来就拿手电筒晃我，挑衅我是吧？\n———\n杨花落瞟了一眼任务介绍，寻找海南西沙沙头礁下的‘小北鼻’。\n杨花落：？\n杨花落不解，小北鼻？小baby？小宝贝？\n宝贝？宝物？孩子？\n什么乱七八糟的。", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "同人"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我恐怖boss，从南部档案开始", "fullTitle": "我恐怖boss，从南部档案开始", "link": "https://fanqienovel.com/page/7659921533963340825", "data": [2.6, 2.75, 2.83], "trend": 0.23, "latest": 2.8, "wordNumber": 146558, "creationStatus": 1, "desc": "【无CP+女强+平遗憾+走剧情】\n桑九叶是一个倒霉鬼，第一次穿成无限流副本里冥婚主题大boss的新娘，\n战战兢兢搞死大boss之后，自己成了大boss，本来该大杀四方，大显身手，大展拳脚！\n结果被无限流系统判定为bug，直接把人踢出世界。\n好不容易带着她的小搭档找到一个小世界投放，\n却没想到这是个依旧诡异的世界……\n桑九叶：想过回正常人生活 咋就这么难？\n张海琪：我说我是顶格了，没想到来了个更夯的……\n张海楼：干娘一个老太婆就很难伺候了，没想到这样难伺候的老太婆还有一个！\n张海侠：（偷笑.jpg）没办法，谁让我太乖了呢", "tags": ["悬疑脑洞", "悬疑", "风水秘术", "无CP", "女强", "穿越", "系统"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：柔弱", "fullTitle": "盗墓：柔弱", "link": "https://fanqienovel.com/page/7646504547661138968", "data": [5.49, 5.61, 5.7], "trend": 0.21, "latest": 5.7, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "青霉素发家，张家女在盗笔当富豪", "fullTitle": "青霉素发家，张家女在盗笔当富豪", "link": "https://fanqienovel.com/page/7659746866979933246", "data": [13.62, 13.74, 13.81], "trend": 0.19, "latest": 13.8, "wordNumber": 180013, "creationStatus": 1, "desc": "【字数比较少，刚开分】【剧情线从南部档案开始，cp黑瞎子1v1，无其他暧昧向】  \n       张海灼这辈子做过最正确的决定，是十五岁那年从张家假死出逃。\n       第二正确的决定，是在柏林巷子里捡了黑瞎子当劳动力。\n       她在法租界开药铺，在苏州河边建厂，用青霉素撬动军火贸易，用芯片技术搭上改革开放的快车。\n       八十年间她换了三个身份，产业却越做越大，从“姚老板”到“姚小姐”再到“姚董”，桃花暗纹的信物流传至今。\n       什么莫云高、裘德考？要体验一下被经济制裁的恐惧吗？\n       什么汪家？你背后的势力比得上我为国家做的贡献？\n       什么，每个身份身边都有一个黑漆漆的保镖？不好意思啊，我们毕竟是母女嘛，审美一致，男朋友长得像多正常。\n       黑瞎子：没错，她就喜欢我这款！\n——\n       我写的主角是1905出生的张家人，从民国活到主线，尽可能经历大部分重要剧情点，能避免的悲剧会尽量避免，不会过多干扰让某些剧情点直接消失，但会改变一些人的结局。\n       主角有自己的事业线要走，某种程度上会是从民国到现代的穿越大女主爽文", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "衍生"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：谁家要饭的这么嚣张！", "fullTitle": "盗墓：谁家要饭的这么嚣张！", "link": "https://fanqienovel.com/page/7660518060612144152", "data": [8.57, 8.95, 8.74], "trend": 0.17, "latest": 8.7, "wordNumber": 214694, "creationStatus": 1, "desc": "【癫文+无CP】\n张九被一个叫“乞讨成帝”的实习系统绑错了，\n本来是龙傲天走老朱的路线，结果给她送到了盗墓世界。\n还只能向古人乞讨才能获得系统奖励。\n张九表示：“谁说错嫁没真爱？你看隔壁王二赖！”\n现代没古人？\n地下不全都是吗？\n清朝出生的都算古人？\n那不巧了吗！\n百岁老人这里有的是。\n【不怎么走剧情，没有感情戏，与鬼吹灯有一点联动】\n提前避雷：1.女主带过去的那个智能机没上交国家，而是给了小花。作者给出的理由是，国家不一定看得上那个手机，但一定看得上穿越这件事。盗墓贼江湖气重，只要女主够强，没人问来历。\n2.系统就是个开盲盒的工具，没有吊炸天的功能\n3.女主身穿、成长形，不是一上来就很牛逼，开始很弱。\n4.某种程度上说，女主是开着上帝视角穿书的，相比较政府部门，女主更了解书中人物，所以求求某些书友，不要让女主上岸从政啦！这是同人文啊亲！", "tags": ["悬疑脑洞", "悬疑", "系统", "灵异", "无CP", "同人"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我靠装逼征服诡异世界", "fullTitle": "我靠装逼征服诡异世界", "link": "https://fanqienovel.com/page/7651204736850332697", "data": [4.97, 5.04, 5.14], "trend": 0.16, "latest": 5.1, "wordNumber": 283417, "creationStatus": 1, "desc": "【评分刚出，求五星🙏🏻】\n【1VN】【无CP】【装逼】【迪化】\n【注：无CP等于谁都能是CPヘ(￣ω￣ヘ)】\n公元3077年，诡异入侵世界，杨宴被迫卷入到诡异副本当中，正准备摆烂混日子，谁曾想居然绑定了一个装逼系统，从此在迪化的道路上一去不复返……\n杨宴：闭眼休息\n众人：都闭上眼睛！大佬察觉了不对！\n杨宴：发发呆放空大脑\n众人：都不要轻举妄动！大佬在思考破局之法！\n杨宴：？\n系统欲哭无泪：家人们谁懂啊！本以为绑定了一个大佬，谁知道是个面瘫装逼男啊！\n—\n“听说十三区来了一个顶级大佬！”\n“真的假的！”\n“真的！据说他杀伐果断，深不可测，腰细腿长，清冷矜贵……”\n“嗯？等等？后面的形容词不对吧啊喂……”\n“细说深不可测……”\n——\n于此同时，副本内的大佬们……\n孤狼大佬呈影（心满意足）：“是的，我是他的狗，这是我的荣幸(｡･ω･｡)。”\n公会会长风惊羽（认真脸）：“啊？你问我杨宴吗？他宽肩窄腰，气质斐然，高冷神秘……（此处省略一万字）”\n商会盟主枭鹤（温润如玉）：“希望能够取代呈影的位置，他还不配(◣_◢)。”\n某反派：“真的不能改变阵营吗？老师我想和杨宴一组o(╥﹏╥)o”\n杨宴：？你们", "tags": ["悬疑脑洞", "悬疑", "系统", "直播", "灵异", "惊悚游戏"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "七罪副本：她靠怠惰封神", "fullTitle": "七罪副本：她靠怠惰封神", "link": "https://fanqienovel.com/page/7655266817392249918", "data": [11.51, 11.74, 11.67], "trend": 0.16, "latest": 11.7, "wordNumber": 256240, "creationStatus": 1, "desc": "【非爽文+无限流+无cp+智斗游戏+微群像+成神之路+神明入侵】\n晏夕这辈子最擅长三件事：藏锋，偷懒，逃避。\n她本以为自己可以这样安安稳稳和妹妹相依为命，直到某天，她被卷入一场名为“神明审判”的无限游戏。\n晏夕醒来时，发现自己在一座审判厅里。\n六个人，七张椅子。\n规则只有一条：每个人必须找到属于自己的审判椅，一人坐错，全员处刑。\n别人崩溃、争吵、抢线索，只有晏夕靠在墙边，一动不动。\n众人以为她吓傻了。\n直到审判钟声敲响，她不动声色地做出正确的选择。\n他们这才发现，这个被判定为【怠惰】的女人，不是不敢动，她只是懒得做错事。\n后来，贪惏者死于欲望，色欲者毁于执念，暴怒者痛不欲生，傲慢者跪下求饶。\n所有人都在七罪试验里挣扎求活。\n只有晏夕，一步一步走上神座。\n塔灵问她：“你犯下怠惰之罪，可知悔改？”\n晏夕淡淡道：\n“我不悔。”\n“我只是累了。”\n“累到想让这场无穷无尽的审判，彻底安息。”\n（不是爽文！！！具体排雷详见第一章作话和评论，谢绝写作指导，不喜勿入）", "tags": ["悬疑脑洞", "悬疑", "无限流", "灵异", "无CP", "群像"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：强制诚实的我憋不住了", "fullTitle": "盗墓：强制诚实的我憋不住了", "link": "https://fanqienovel.com/page/7563612379108346905", "data": [4.87, 4.94, 4.99], "trend": 0.11, "latest": 5.0, "wordNumber": 252869, "creationStatus": 1, "desc": "（评分刚出，会涨哒）\n一个普通人穿越到盗笔世界，成了吴家小少爷。\n吴言，开局抽奖抽到了‘强制诚实’，这是奖励？\n再次抽奖，抽到了‘不会坏的计算器’。\n为了活下去，吴言只能尽量少说话，用‘计算器’代替自己发言！\n（有CP，有系统，团宠，搞笑甜味，不虐。主角性格是被特意培养的，单纯、幼稚，但三观极正。介意者，勿看！！！！！！！）\n看着不停说话欺负自己的黑瞎子，吴言不语，拿出计算器，不停按下减号键，计算器不停响起 “ jian jian jian jian jian jian ........”\n看着出言不逊的伙计，吴言用计算器按下几个键，计算器响起“平方根62500  等于......”\n遇到嘲讽吴家的藿仙姑，吴言不语，拿出计算器，按下六个数字‘4’ ‘3’ ‘8’， ‘4’ ‘7’ ‘8’！\n不想回答别人问题，按下计算器的“X的y次方”键，计算器会响起‘mi’！\n周围人的沉默震耳欲聋.........\n————————————\n吴言实在憋不住的时候，大家都完蛋了！\n‘强制诚实’开始了！\n吴言要么不语，掏出计算器按‘按键’！  要么，话说不停，还气人！\n大家默默捏紧拳头，不能生气！孩子就是太实诚了！忍忍吧！", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "灵异", "同人"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.72, 3.76, 3.82], "trend": 0.1, "latest": 3.8, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗笔：他们怎么都这么看我？", "fullTitle": "盗笔：他们怎么都这么看我？", "link": "https://fanqienovel.com/page/7658600769142131736", "data": [2.36, 2.42, 2.45], "trend": 0.09, "latest": 2.4, "wordNumber": 257143, "creationStatus": 1, "desc": "【无cp+脑补美强惨+开局四岁幼崽+主角无邪有cp+无脑爽+平行时空+如果有什么别扭的地方请见谅，作者功力有限！！！+ooc】\n35世纪，全息游戏盗墓世界风靡全星系，张瑞安非常，及其，幸运的拿到了内测名额。\n张瑞安：倒霉了二十年的命这个时候居然欧皇了？哈哈哈哈哈\n结果开局不靠谱的001居然把她绑定了一个四岁女童的身体里，周围全是尸体，天杀的还不如重开呢！！！\n在张瑞安撒泼打滚，无理取闹之下001割肉般赔了张瑞安十连抽。\n001：咋这么倒霉啊！\n张瑞安舒服了，别说这个游戏的自由度真高啊，还有，古地球的食物怎么这么好吃😋\n张瑞安跟着系统001的指示去各个墓里收集能量，没想到这个身体居然还有亲爹呢，还以为这是个孤儿呢！\n只是这些个古地球的人是不是脑子不好啊，怎么老是用那种眼神看她？\n无邪：……小宝……\n张起灵：别逞强，我会保护你！\n王胖子：小安啊…\n黑瞎子：小崽子，你可真能耐啊！\n解雨臣：多谢你！\n张瑞安：系统，他们在说啥呢，把游戏奖励给我结算一下！\n001：不知道啊，可能古地球人多愁善感吧！", "tags": ["悬疑脑洞", "悬疑", "灵异", "无CP", "同人", "风水秘术"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我和顶头boss成诡了", "fullTitle": "我和顶头boss成诡了", "link": "https://fanqienovel.com/page/7657438469932715033", "data": [2.38, 2.39, 2.46], "trend": 0.09, "latest": 2.5, "wordNumber": 182989, "creationStatus": 1, "desc": "诡异视角\n双男主，视角随机\n周荣攻，胡建仁受\n第一卷：小心夫妻店，包括无限流世界\n第二卷：寻找霸总真爱\n第三卷：少妻的珍宝（含老夫少妻，救风尘因素）\n第四卷：退婚流龙傲天的未婚“妻”（含狗血，男扮女装，私会因素）\n第五卷：三舅，你就放心的去吧，我会继承你的一切\n第六卷：狐假虎威and为虎作伥\n\n“建仁，哥只是有病，没啥正常三观，但哥又不是傻。真喜欢一个人，不知道怎么去爱，还能不知道啥日子过的舒服？”\n\n也是，当年没捅破那窗户纸，没意识到自己爱上了对方。\n\n但荣哥给钱给权给地位给自由，还得偷偷给我留后路。当然，我也留了。\n可惜，都没用上，准确来说，是我们都不想用。\n\n胡建仁把笔拿起来又放下：“现在外面世界的爱，已经到了我们都理解不了的程度了吗？你说他们是不是不懂什么叫爱？”\n\n“你看看那四个傀儡，不是被关、就是被抽血、或者被恨、被当空气。她们身上的标签全是‘惨’”\n“爱又不是把自己搞得越惨就越真。爱一个人，是会让他过得好的。”\n\n周荣哼了一声：“所以真正的答案不在那四个人里面。真正的答案，应该是那个让被爱的人过得最好的人。”", "tags": ["悬疑脑洞", "悬疑", "推理", "规则怪谈", "惊悚游戏", "灵异", "无限流"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "科幻末世": [{"label": "穿进末世，我靠装弱，苟成最强", "fullTitle": "穿进末世，我靠装弱，苟成最强", "link": "https://fanqienovel.com/page/7662354834556734488", "data": [16.39, 17.44, 18.26], "trend": 1.88, "latest": 18.3, "wordNumber": 214658, "creationStatus": 1, "desc": "纪昼穿进末世八年，是临江基地公认的废物。\n\n检测做了一年又一年，结果始终没变。\n\n无异能。\n\n体弱。\n\n胆子小。\n\n遇到危险，只会躲在人群后面。\n\n纪昼对此十分满意。\n\n废物有人护着。\n\n天才却可能被送进实验室。\n\n没人知道，她体内藏着一团奇怪的东西。\n\n它会记住异能。\n\n硬化、雷电、冲击……\n\n只要给它一点时间，那些原本属于别人的力量，就能在她身上重新出现。\n\n纪昼靠着这张底牌装弱苟命，一装就是八年。\n\n她原本打算继续装下去。\n\n直到赛场坍塌，横梁压向被困的人，她当着六大基地的面，抬手托住了整片废墟。\n\n检测记录被连夜翻出。\n\n中央基地要求重新检测。\n\n研究人员想把她带回去。\n\n就连比赛里的对手，也故意重伤她的队友，逼她补位上场。\n\n姜妄隔着防护墙看向临江席位。\n\n“不是还有个替补吗？”\n\n“团队赛让她上。”\n\n“我倒想看看，她那层刚觉醒的硬化，能撑几刀。”\n\n所有人都以为，纪昼只有硬化。\n\n只有谢闻岐坐在高处，转了转缠着固定带的右腕。\n\n他望着她周围那片不肯随场域改变的异常，忽然笑了。\n\n“刚觉醒？”\n\n“她可藏了不止一天。”\n\n纪昼抱着医药箱，乖巧地坐在原位。\n\n她算了算自己手里剩下的异能。\n\n还是太少。\n\n得再攒一点。", "tags": ["科幻末世", "末世", "穿越", "魂穿"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "糟糕末世：系统给我发了五个疯批", "fullTitle": "糟糕末世：系统给我发了五个疯批", "link": "https://fanqienovel.com/page/7661368861291187262", "data": [5.19, 5.82, 6.83], "trend": 1.63, "latest": 6.8, "wordNumber": 148368, "creationStatus": 1, "desc": "【搞笑+可爱+体型差+全员洁+无脑爽】\n可爱软萌女主VS忠犬男主\n意外穿到末世。\n人家都是技能满格，左手杀丧尸，右手扣晶核。\n而她！！！\n什么都没有！！！\n系统无奈：“好吧，我可以给你个储存空间，保证你饿不死。”\n“我还可以塑造你小说里的男主人物。”\n“让他们来陪你一起。”\n叶歌眼睛亮晶晶，她心动了。\n系统：“只能是你最近写的一本。”\n叶歌崩溃：“？我最近写的是极限文啊！”\n不止疯批，还没素质…\n“我不要。”\n系统：“……拒绝无效，已经生成了。”\n叶歌崩溃：“坑货，那是五个疯批啊——”\n系统：“人多热闹。”", "tags": ["科幻末世", "穿越", "空间", "末世", "搞笑轻松", "无脑爽"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿进末日双男主文里当白莲花", "fullTitle": "穿进末日双男主文里当白莲花", "link": "https://fanqienovel.com/page/7649708129977895960", "data": [8.01, 8.76, 8.73], "trend": 0.71, "latest": 8.7, "wordNumber": 231099, "creationStatus": 1, "desc": "（刚出分，会涨的）\n【末日+1v2+异能+男主全洁+伪穿书+成长型女主】\n排雷：成长流女主非大女主爽文，非圣母，非工具人女主，前期会出现道德绑架等情节，不喜勿入\n（请勿把最基本的善良当圣母，请允许主角善良）\n白安安穿书了。\n好消息是，这书她看过。\n坏消息是，这是一本末日双男主文（并非）。\n更坏的消息是，这本书她只草草扫了几眼简介和下面的高赞热评。\n她穿的这个角色和她同名同姓，也叫白安安。\n这种题材里的女角色不是恶毒女配，就是纯炮灰。\n更重要的是，她记得有一条高赞热评。\n「白**什么时候下线啊，下药那段都气死我了」\n这个“白**”极有可能就是指她。\n这就意味着，她拿的是恶毒女配的剧本。\n末日、双男主、恶毒女配。\n这几个词加一起，白安安看不到一点活路。\n此刻的她只想仰天长啸，\n老天，我再也不叫你奶了，\n你根本没把我当亲孙女。", "tags": ["科幻末世", "幻想言情", "穿越", "末世", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日来临：囤货癖的她又又赢麻了", "fullTitle": "末日来临：囤货癖的她又又赢麻了", "link": "https://fanqienovel.com/page/7651176432588049433", "data": [11.15, 11.63, 11.73], "trend": 0.59, "latest": 11.7, "wordNumber": 280015, "creationStatus": 1, "desc": "【丧尸+天灾+异能+空间+囤货+逃难日常+天选之女女主+隐藏款大佬男主】\n洗洁精、洗衣液、纸巾、杀虫剂、护肤品；大米小米、红豆绿豆、压缩饼干；肉罐头、水果罐头、常温牛奶、蔬菜干……\n618又来了。\n张晓晓继续疯狂囤囤囤，结果一抬头，天瞬间变黑，极端天气来袭，安稳时代正式结束，末日时代正在开启中……\n她只是淡定地打开储物APP，看着自己的物资松了口气。\n莫慌莫慌。\n这波终究是她这囤货癖的家伙赢了！！不就是末世而已？\n轻松苟活！！！", "tags": ["科幻末世", "空间", "末世", "囤物资", "大佬", "天灾"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "抽皮肤抽到丧尸位面后我上交了", "fullTitle": "抽皮肤抽到丧尸位面后我上交了", "link": "https://fanqienovel.com/page/7660783163194494014", "data": [2.87, 3.12, 3.39], "trend": 0.52, "latest": 3.4, "wordNumber": 176871, "creationStatus": 1, "desc": "【多位面穿越+都市脑洞+有CP+强国+成长向+群像】\n【末世+游戏+小说+星际+修仙……】\n她只是想抽个皮肤，怎么还带强买强卖！\n从丧尸位面死里逃生后，奚乔裹成粽子冲进派出所：警察叔叔，我要上交！\n从此，国家爸爸组队穿越，奚乔开开心心薅资源，薅科技，薅系统！\n******\n“警察叔叔，等我变成丧尸，就会不讲卫生，还喜欢到处咬呜呜……我、我不知道会不会传染。”\n她不想被豌豆射手biu biu、biu！\n******\n“本系统是正经系统！”\n奚乔冷笑：“正经系统会把人强制送去丧尸世界？”\n系统：“……”\n它不吭声了。\n******\n“毕竟时间太短，那些人都只会按任务做，谁能想到带着一堆现实种子来补图鉴啊！”\n奚乔默默举手。\n“国家爸爸会。”\n系统安静了一秒，诚恳道：“你们国家爸爸确实很离谱。”", "tags": ["科幻末世", "系统", "穿越", "末世"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "末日死考：七岁丧尸王也要考试？", "fullTitle": "末日死考：七岁丧尸王也要考试？", "link": "https://fanqienovel.com/page/7652257815586688025", "data": [4.2, 4.48, 4.68], "trend": 0.48, "latest": 4.7, "wordNumber": 196263, "creationStatus": 1, "desc": "评分刚出！会涨！看正文看可爱小老大!\n末日废土+恶童丧尸王+比格属性+全名求生直播】\n季末一觉睡醒，发现家没了，哥也不见了，甚至她连人都不当了。\n因为她变成了一只丧尸，穿着花棉袄的丧尸王。\n季末想要找妈妈，脑海中就传来了一道机械音。\n“叮，第101次末日死亡高考准备开始，考场已准备就绪，请考生做好准备。”\n季末：嗯？高考？我吗？可我刚满七岁，还没上小学啊。\n紧接着，季末出现在了墓地。\n考题：枯骨酸雨墓园（杀戮求生）\n季末不识字，问一旁的姐姐。\n姐姐眼神奇怪：“小姑娘，幼儿园不教认字吗？”\n季末挠了挠头：幼儿园，不是教杀人的地方吗？\n不过好在，她得到了答案。\n不需要做数学题啊，既然如此，她要开始，发疯了！\n----\n基地中，幸存者们看着直播画面，其实早就麻木了，因为人类根本没有希望，不过是延长死去的时间罢了。\n可突然，一个名叫季末的积分以成倍递增，所有人都涌入了季末的直播间。\n咦？咋还有个小孩。\n有点不爱干净啊，这脸咋乌漆嘛黑的，这花棉袄好土啊。\n季末：你们这是言语霸凌小学生。\n同样看到直播的五位哥哥：呜呜呜，我的妹宝，没死！\n有幸和季末一起参加高考的高考生们：人麻了，死考最恐怖的，是那个熊孩子啊！", "tags": ["科幻末世", "末世", "直播"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "同居半年后发现未婚夫非人类！", "fullTitle": "同居半年后发现未婚夫非人类！", "link": "https://fanqienovel.com/page/7615492664061856792", "data": [3.64, 3.89, 4.09], "trend": 0.45, "latest": 4.1, "wordNumber": 138302, "creationStatus": 1, "desc": "【微型末世+甜宠恋爱文（阴暗疯批非人×微盲坚韧人类】\n陆昭昭是只是家里培养的联姻工具，而周景和是周家不入名的末流孩子。\n因为一场合作，两人相知相爱，原本以为生活会平平淡淡，幸福快乐的过下去，突然的变异人爆发，让他们被迫隔离家中。\n末日爆发，所有人自顾不暇，唯独这对小情侣，仍旧甜甜蜜蜜。\n偶然的一天，陆昭昭视力恢复，她看着上天入地的未婚夫，短暂的陷入沉默。\n他怎么有尾巴？\n求助，未婚夫不是人怎么办？\n—\n小剧场：\n周景和：我不是人你还会爱我吗？\n陆昭昭：我最最喜欢的人就是你。\n周景和（沉默）：我不是人。\n陆昭昭：最爱你。\n—\n你可是我孵出来的 自然是我的老婆。\n                                    ——周景和\n——\n（PS：\n           非女强，女主前期盲，后面视力会恢复正常。）", "tags": ["科幻末世", "末世", "甜宠", "1v1"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "别惹小祖宗！星际战神竟是女儿奴", "fullTitle": "别惹小祖宗！星际战神竟是女儿奴", "link": "https://fanqienovel.com/page/7660492016349875262", "data": [2.94, 3.14, 3.31], "trend": 0.38, "latest": 3.3, "wordNumber": 171383, "creationStatus": 1, "desc": "【星际+系统+团宠+重生+升级+爽文+大佬+打脸】\n\n上一世，江子霜为了顶替江子函的身份，将她囚困致死\n\n她信赖的养父，养兄，青梅竹马的未婚夫全都是帮凶\n\n遭所有至亲之人背叛而死\n\n她死不瞑目 重生归来，有仇报仇，有怨报怨。\n\n玉佩激活，自带系统、空间、灵泉水\n\n还意外觉醒了稀有的木系异能\n\n完成任务就能提升精神力\n\n从此走上了变强之路\n\n铁血杀伐、威震星际的战神元帅，竟然是她爹\n\n战神化身女儿奴\n\n他将所有温柔与偏爱尽数倾注在女儿身上\n\n顶级别墅直接过户，赠予千万零花钱..十六年缺失的疼爱，他一一补齐\n\n不仅如此，她还意外发现，六位顶尖3S级精神力强者是她的哥哥\n\n老大是联邦首席医疗权威\n\n老二是顶级星际财团掌权人\n\n老三是星际黑市老大\n\n老四是全星级顶级大明星\n\n老五是最年轻星际法官\n\n老六是大皇子，最年轻的指挥官\n\n从前无人撑腰、任人欺凌的孤女，一朝逆袭成战神父亲极尽偏爱、六位天才大佬兄长极致宠爱\n\n成了没人敢招惹的存在！\n\n谁敢惹我的小祖宗？\n\n不想活了！\n\n所有人达成共识：惹谁都别惹司清柠小祖宗，她全家超级护短！\n\n昔日肆意践踏她尊严的江家众人、虚伪爱人，再度偶遇她时，只剩惊恐后怕、狼狈不堪、后悔万分\n\n柔弱不能自理的小妹竟然成了顶级大佬，\n\n重活一世，她终于活成了人生赢家！！", "tags": ["科幻末世", "星际", "末世", "重生"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全星际都知道我们小队很有钱", "fullTitle": "全星际都知道我们小队很有钱", "link": "https://fanqienovel.com/page/7646458108536966169", "data": [3.77, 3.93, 4.1], "trend": 0.34, "latest": 4.1, "wordNumber": 134527, "creationStatus": 1, "desc": "【星际军校+热血群像+爆笑反差+爽爆高能】\n穿越第一天，江晚栀看着账户里237亿星币和13颗资源星，准备直接躺平当富婆。\n结果管家一盆冷水浇下：\n“小姐，您签了四年军籍预备协议。除非……因能力太差被军校淘汰。”\n江晚栀眼睛暴亮：还有这种好事？拿倒数第一回家继承家产，这不有手就行？！\n于是，荒星考核里——\n别人拼命杀怪，江晚栀找安全区睡觉；\n别人抢夺积分，她拉着四个全校最嫌弃的怪胎组队避战。\n可画风突然就歪了：\n别人小队缺弹药，江晚栀随手买下补给站：“刷卡。”\n别人遭遇星兽潮，江晚栀脑子飞速计算：“它左侧肋下有旧伤，周野，撞它！”\n原本想混个零分被开除，结果莫名其妙拿了战术贡献第一；\n原本想当个花瓶富婆，结果把这支“垃圾小队”一路带成了联邦最强战神！\n别人眼中的他们：富婆、贫民、书呆子、莽夫、懒狗。\n星兽眼中的他们：求求了，这五个疯子真的不是来毁毁灭宇宙的吗？！\n【绝不虐主+超默契团队+五人独立高光+爆笑热血杀穿星际！】", "tags": ["科幻末世", "星际", "群像", "穿越", "搞笑轻松", "魂穿"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "废土：我能看见万物数据", "fullTitle": "废土：我能看见万物数据", "link": "https://fanqienovel.com/page/7616502135168977944", "data": [6.13, 6.22, 6.38], "trend": 0.25, "latest": 6.4, "wordNumber": 273006, "creationStatus": 1, "desc": "【废土求生+异能+数据眼+采集+无CP+空间】\n徐昭刚觉醒力量系异能，便跟着狩猎小队外出采集狩猎，只为多赚积分，挽救濒临破碎的家。\n可第一次外出，她就惨遭变异植物刺棱花袭击中毒。\n队伍里唯一一支解毒剂，却被优先分给了更重要的水系异能者。\n无人愿救她。\n她忍着毒素蚀骨的剧痛，被小队送回家中，静静等待死亡。\n然而，徐昭没有死。\n再次睁眼，她的世界彻底变了。\n所有人、异兽、植物，在她眼中都化作一串清晰数值：\n体质、力量、速度、污染度、异能类型、等级……一览无余。\n变异动植物是否有毒、能否食用、暗藏何种功效，更是无所遁形。\n这一次，她不再任人摆布。\n凭一双数据眼，她在污染废土中捡物资、猎异兽、辟生路，\n一步步逆转自己与家人的命运，在废土杀出一条最强生路！", "tags": ["科幻末世", "空间", "末世", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "假借身份入学，全军校防我偷零件", "fullTitle": "假借身份入学，全军校防我偷零件", "link": "https://fanqienovel.com/page/7646091148657708056", "data": [2.62, 2.75, 2.86], "trend": 0.25, "latest": 2.9, "wordNumber": 238708, "creationStatus": 1, "desc": "【评分刚出，后面会涨】\n废窑星黑户楚休顶替死人身份混进皇家军校。\n别人来上学是为了建功立业。\n她来上学是为了捡破烂搞钱。\n全校师生都以为机甲制造系来了个天才。\n直到五大军校联赛开打。\n楚休开着一堆破铜烂铁拼成的缝合怪上场。\n边打边拆敌方零件现场改装。\n整个赛场沦为她进货的废品收购站。\n后来虫族降临，星际覆灭在即。\n那个被贵族圈嘲笑的拾荒者，驾驶着满身补丁的机甲一枪贯穿母巢。\n星海之巅，她踩着反派的定制机甲残骸。\n手里的碳钢扳手包浆发亮。\n“万物皆可拆，万物皆有价，结账吧各位。”", "tags": ["科幻末世", "星际", "天才"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "星际第一躺平学大师", "fullTitle": "星际第一躺平学大师", "link": "https://fanqienovel.com/page/7656676073710554137", "data": [5.78, 6.01, 5.94], "trend": 0.16, "latest": 5.9, "wordNumber": 208555, "creationStatus": 1, "desc": "【星际、穿越、校园、女强、无CP】【评分刚出，后面会涨】\n两世卷王，这世放假。这辈子迎瓷发誓不卷了，躺平任嘲。\n迎瓷前两世卷生卷死，从小镇做题家卷成C9国奖得主，从外门弟子卷成天梯榜第一的天之骄子，结果两世都不得善终。\n直到第三世，眼睛一闭一睁，穿到星际时代，变成了一个五岁孤儿，迎瓷真的累了。\n这真的不是拐卖人口吗？能不能请有关部门管一管啊。\n风雨中飘摇的家，没爹没妈的她，清澈见底的财富和不努力捡垃圾就会饿死的生活。\n老天奶，她在互联网上接的不是这种日子啊。\n直到有一天，迎瓷翻到一张沾满油污的传单上写着：联邦“未成年教育保障计划”孤儿或底层贫困人口，只要通过最低入学测试就能进入就近的公立学校，享受包吃包住……\n本着免费的就是最好的，迎瓷决定去小学美美躺平，却因为每一次“省事操作”被当成隐藏实力的天才。\n她一路躺、一路被卷、一路拒绝，直到……\n（第一章作话有避雷，大家阅读前可以看一眼哦，如果是不喜欢的题材或者雷点，也方便提前识别）", "tags": ["科幻末世", "穿越", "星际", "女强", "天才", "无CP"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "救命穿越废土，开局通知我去选夫", "fullTitle": "救命穿越废土，开局通知我去选夫", "link": "https://fanqienovel.com/page/7638661558599420953", "data": [4.1, 4.18, 4.2], "trend": 0.1, "latest": 4.2, "wordNumber": 245876, "creationStatus": 0, "desc": "评分刚出，会涨，求宝宝们别给差评哈，写书不易，不喜欢可以下一本哈。\n[废土+空间+异能++位面交易系统+拾荒+种田+1v3+锦鲤附体+小甜文+全洁+不虐】\n一觉醒来，林麦麦穿进了废土世界，全世界都是高辐射，怎么办？\n吃喝都愁！日子比现代农村苦！\n什么？成年就发老公！还发3个！\n还发房子！老公工资上交！\n那我可以！还能挣扎挣扎！\n重生  1, "desc": "【爹系+年龄差+体型差+甜宠+沉浸式】\n\n① 五万卖掉自己的小村姑\n\n② 坏捞女和传统封建爹系（非沉浸式）\n\n③ 发配边关的罪奴小丫鬟，为了放良书勾引糙汉将军\n\n④ 为了稳固江山委身于权臣九千岁的长公主\n\n⑤ 待定\n\n还有年代、兽世、末世、女尊等待定...\n\n【避雷：女弱男强，女主每个世界都弱，男主绝对掌控。年龄差大、体型差大、微重口惩戒。没有此XP的误入。】\n\n【重点：第一世界写的仓促，看文不要带脑子。第二世界非沉浸式，不喜欢就跳过。每个世界没有关联性，可以跳着看。】\n\n① 得知家里将她卖给瘸腿老男人，小村姑从萝卜地跑到了大城市，被中介骗光钱。躲在地下停车场饿了两天，终于饿的受不了了拉了一个西装革履男人的袖子。以为只是一次交易，谁知这个看起来斯文沉稳的男人，老房子着火一发不可收拾。", "tags": ["快穿", "总裁", "幻想言情", "甜宠", "养成", "年龄差"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：路人，但万人迷", "fullTitle": "快穿：路人，但万人迷", "link": "https://fanqienovel.com/page/7522845825026772030", "data": [8.46, 8.79, 9.03], "trend": 0.57, "latest": 9.0, "wordNumber": 159523, "creationStatus": 1, "desc": "（刚开分，但不知道后续会不会涨，欢迎品鉴～）\n快穿+路人甲+系统+万人迷+无脑苏+男女都爱\n无立意。\n世界一：穿成太后侄女，任务是在宴会上替女主说一句话……\n但为什么，原女主会说“我不会忘记你为我所做的一切”\n为什么原男主会说“我可以是您的君，您的夫，您的姪儿，您希望我是什么，我都可以是。”\n为什么系统会警告——“检测到女主对男主杀意已至临界值！”“男主对女主杀意已至临界值！”\n1v2。（完）\n世界二：主角攻的妹妹。\n在元蘅以为自己是在撮合主角攻受时，系统上线：“刚刚检测，周衍对方循的好感度是-30。方循选对周衍的好感度是-25。数据显示，他们似乎已经对您产生了某种程度的依赖心理。”\n元蘅看着听着一个接着一个的坏消息，沉默了。\n后来，男角色逐渐伪人，连系统都怒斥！\n无cp（完）\n世界三：权谋文男主的救命恩人ing\n以下暂定：\n心有所属的贵妃、冷傲霸总的秘书……", "tags": ["快穿", "系统", "幻想言情", "穿越", "今穿古", "胎穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "娇软小漂亮天生就要被男人觊觎", "fullTitle": "娇软小漂亮天生就要被男人觊觎", "link": "https://fanqienovel.com/page/7660389113538808894", "data": [10.96, 11.19, 11.51], "trend": 0.55, "latest": 11.5, "wordNumber": 213228, "creationStatus": 1, "desc": "［1v1+双洁+甜宠+身高差体型差+各种类型男主+天生媚骨］\n小合欢花终于修炼成人形，在族里长辈的提议下入世修行。\n云雪儿谨记长老们的叮嘱，只为寻找世界中气运最强者帮助自己精进修为。\n人是找到了，可怎么没人告诉她这些男人怎么见到她就想狗见到了骨头，可怕、霸道、让人难以招架。", "tags": ["快穿", "总裁", "幻想言情", "甜宠", "双洁", "1v1"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：恶霸如何搞救赎", "fullTitle": "快穿：恶霸如何搞救赎", "link": "https://fanqienovel.com/page/7657478752095456318", "data": [8.21, 8.57, 8.63], "
