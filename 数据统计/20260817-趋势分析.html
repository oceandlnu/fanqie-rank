  @media (max-width: 600px) {
    .header { padding: 20px; }
    .container { padding: 20px 16px 60px; }
    .sticky-nav { padding: 0 16px; }
  }
</style>

偶心动点上的爱情。\n\n补充：文中所有职务，事件均为平行时空，请宝宝们勿代入现实。\n爱你们呦~\n\n", "tags": ["职场婚恋", "现代言情", "总裁", "豪门世家", "互宠", "年龄差"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "考个公，竟被大佬盯上了", "fullTitle": "考个公，竟被大佬盯上了", "link": "https://fanqienovel.com/page/7636950803512560702", "data": [7.77, 7.88, 8.23, 8.61, 8.78, 8.61, 8.08], "trend": 0.31, "latest": 8.1, "wordNumber": 298615, "creationStatus": 1, "desc": "评分刚出，会慢慢往上涨，不必在意【成熟稳重心机大佬】VS【清纯上进职场新人】+【巧取妙夺/步步为营】+【年上引导型恋人】+【年龄差】+【1V1】+【甜宠】\n       大学即将毕业的林兮在留在沪城打拼和回老家考公之间左右为难。一边是极力劝她留下来的男友，一边是迫切希望她回老家的父母，她不知该如何抉择。\n        因为一次展会的义务帮忙，她认识了老家新任大佬季时川，俩人还阴差阳错成为了跑友。她向他诉说了自己的苦恼。对方精辟分析了企业管理与社会管理的异同，并给了她明确的建议。林兮因为男友与前追求者的暧昧不清，最终还是决定回老家考公，从此与季时川有了更多工作上的交流和互动。\n       她以为这一切都是自己主动选择的结果，殊不知，从见到她的第一眼起，老谋深算的男人就在如何谋划将她扒拉进自己碗里……\n       她更没想到，人前严肃高冷的季时川，私下里会一遍遍地喊她“宝宝”……", "tags": ["职场婚恋", "现代言情", "甜宠", "大佬", "1v1", "年龄差"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [6.27, 6.99, 7.72, 8.39, 9.0, 9.45, 10.64], "trend": 4.37, "latest": 10.6, "wordNumber": 252679, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [2.09, 2.08, 2.41, 3.01, 3.51, 3.93, 5.08], "trend": 2.99, "latest": 5.1, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [3.68, 3.86, 4.1, 4.37, 4.56, 4.66, 5.11], "trend": 1.43, "latest": 5.1, "wordNumber": 287237, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [6.65, 6.57, 6.68, 6.62, 7.01, 7.06, 7.18], "trend": 0.52, "latest": 7.2, "wordNumber": 220180, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "小通房乱世带球跑", "fullTitle": "小通房乱世带球跑", "link": "https://fanqienovel.com/page/7537669907320687641", "data": [7.26, 7.86, 8.63, 9.32, 9.09, 8.65, 7.69], "trend": 0.43, "latest": 7.7, "wordNumber": 251589, "creationStatus": 1, "desc": "【偏种田逃荒～非爽文+战乱+久别重逢+生子+空间】\n一觉醒来就穿了，穿成没地位、没人权的通房丫鬟，还没原主记忆，清欢欲哭无泪，穿都穿了，能怎么办，努力活着呗。\n可好日子没过几天，都城兵变、战乱四起。\n逃亡时刻，她还被老夫人落下了，顾清欢只能挺着孕肚去逃难，整天吃不饱穿不暖，比流民还不如。\n在战场的将军也不容易，通房怀孕他害喜，战场闻到血腥味就呕呕。同僚把酒言欢，他还是呕呕。\n【温馨提示: 不喜慢走，码字不易，作者玻璃心接受不了差评╮(‵▽′)╭，谢谢理解！】", "tags": ["种田", "古代言情", "穿越", "空间", "逃荒", "久别重逢"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身怀武力和空间，独自逃荒杀疯了", "fullTitle": "身怀武力和空间，独自逃荒杀疯了", "link": "https://fanqienovel.com/page/7649608466180361240", "data": [2.13, 2.21, 2.23, 2.21, 2.21, 2.17, 2.22], "trend": 0.09, "latest": 2.2, "wordNumber": 288757, "creationStatus": 1, "desc": "（无cp+心狠手辣+不圣母+有仇必报+天灾）\n　　灾荒年，苏小丫的家人为了一小袋粮把她卖给了老光棍儿，不愿屈服的她一头撞柱惨死。\n　　死于末世大爆炸的苏默就穿来了。\n　　只是处境不太妙：干旱缺水，敌国入侵，全村都逃了。\n　　为了活命，她逃上山，独自踏上南下逃荒之路。\n　　途中遇到了原主的家人。\n　　原主娘：“哪怕是给你吃屎长大的，那也是我这个做娘的一把屎一把尿的功劳。”\n　　吃屎是吧，那让你吃个够，这就是我对你天大的恩情了！\n　　恶毒爷奶，吸血的爹和弟还想再次把她卖了。\n　　那不能够！全家归西套餐立马安排上！\n　　逃荒路漫漫，灾祸不断，她只能咬牙朝前走，始终坚信不放弃，就有生的希望……", "tags": ["种田", "古代言情", "空间", "无CP", "逃荒", "天灾"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "民国言情": [{"label": "陈皮阿四之多情种", "fullTitle": "陈皮阿四之多情种", "link": "https://fanqienovel.com/page/7537294523685145625", "data": [1.99, 2.34, 2.91, 3.5, 4.06, 4.61, 5.74], "trend": 3.75, "latest": 5.7, "wordNumber": 263795, "creationStatus": 1, "desc": "故事发生在四屠黄葵之后……初见时，浑身浴血的少年黑沉着眸子，无法无天的流氓做派。\n后来竟将整颗真心奉上，只求她的怜惜……\n披着老九门外衣的小甜文\n私设如山，努力不崩人设\n给橘子皮一个小小的羁绊", "tags": ["民国言情", "现代言情", "古代言情", "古色古香", "医术", "武侠"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成五零姨太太，卷走财产逃港城", "fullTitle": "穿成五零姨太太，卷走财产逃港城", "link": "https://fanqienovel.com/page/7645653673145551896", "data": [3.89, 4.38, 4.71, 4.95, 5.53, 6.23, 6.48], "trend": 2.6, "latest": 6.5, "wordNumber": 172909, "creationStatus": 1, "desc": "祝阮蓝一醒来就发现自己穿成了索府的七爷的‘冲喜姨太太’，而且索府的人正在谋划着离开沪上，逃往小弯，最重要的是竟然还不带她！\n这怎么能成，她也要出去，她想去港城！\n可惜，相处后才发现，索府都是一群豺狼虎豹，而且还一个个带着坏主意，竟然觉得买了她这个冲喜姨太太不能吃亏，想要将她当成礼物送给沪上官员笼络人心。\n看着索府的人这样恶心，祝阮蓝索性当起了飞天大盗，先是偷走了索府的保险箱，后又偷走了枪支弹药，还毫不客气的送索府的人看了一场炸弹烟花给他们开开胃。\n趁着这个时机，她卷走了索府宝库里所有的东西，而后消失不见。\n索府的人气炸了，老太太发出高额悬赏想要捉拿祝阮蓝。\n祝阮蓝趁着这个时机，逃离沪上，等到船快要开时才辗转回来。\n没想到她千算万算，等上船后才发现，她如今坐着的这条船，竟然是那条奔向绝路的‘太平轮’，且看祝阮蓝如何逆风翻盘，去往港城大杀四方，由一个姨太太成为一个港城新贵！", "tags": ["民国言情", "现代言情", "穿越", "空间", "民国", "虐渣"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "南部档案：师姐老想退休了", "fullTitle": "南部档案：师姐老想退休了", "link": "https://fanqienovel.com/page/7658487361486982206", "data": [1.47, 1.74, 1.96, 2.15, 2.25, 2.32, 2.4], "trend": 0.93, "latest": 2.4, "wordNumber": 120195, "creationStatus": 1, "desc": "（不是爽文，不后宫，部分情节和原著有出入，女主本相蝴蝶，CP未定。）\n张海梦也是在南安号上牺牲的探员之一，她的尸体被张海琪带回了厦门，下葬之前，她的尸体上布满了大大小小的蝴蝶，再一恍惚，蝴蝶连带尸体都不见了，在张海琪眼皮子底下消失了。", "tags": ["民国言情", "现代言情", "民国", "幻想言情", "谍战"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "我在老九门打工那些年", "fullTitle": "我在老九门打工那些年", "link": "https://fanqienovel.com/page/7347712908786158654", "data": [1.11, 1.26, 1.35, 1.38, 1.42, 1.53, 1.63], "trend": 0.52, "latest": 1.6, "wordNumber": 158797, "creationStatus": 1, "desc": "本文略偏群像，以剧版节奏展开，多偏生活气息，不偏重下墓。\n女主脑力武力都没问题，一开始隐藏实力只是因为雨村金盆洗手的誓言，所以不想插手。\n然后逐渐被卷入，和九门众人熟悉起来，才决定参与。\n主CP齐八爷（日久生情，患得患失，甜甜的唯妻主义）和二月红有些瓜葛（前世今生，换皮掉马甲，追妻火葬场），其他人看情况撩一撩。\n第一次借尸还魂，她遇到了二月红，名为霜叶。\n在她想留下时，一切却戛然而止。\n她回到现实，疯狂搜寻关于他的一切，从而结识了吴邪等人。\n多年冒险之后，打算就此金盆洗手，留在雨村养养老，却不想突如其来第二次借尸还魂。\n第二次借尸还魂，她回到了九门，自称叶霜。\n昔日少年郎，已是名伶二爷，有了丫头。\n“叶霜，霜叶，很难猜吗？二月红，你是真的不知道，还是装作不知道？”\n不过没关系，她遇到了更好的。\n“八爷这么贤惠，不如我娶了你去吧。”", "tags": ["民国言情", "现代言情", "民国"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "出门在外，身份全靠自己编", "fullTitle": "出门在外，身份全靠自己编", "link": "https://fanqienovel.com/page/7580057733001399321", "data": [1.08, 1.2, 1.28, 1.35, 1.37, 1.31, 1.42], "trend": 0.34, "latest": 1.4, "wordNumber": 155508, "creationStatus": 1, "desc": "【无cp，爽文，微迪化，系统，民国，不掉马】\n刚开分，评分有点低，后面还会陆续涨起来的\n大二学生林舟，在出车祸后被迫绑定了系统，穿进了一本民国架空背景的小说。\n系统告诉他想要复活需要十万熵值，在林舟兢兢业业努力两个月却只凑够了三点熵值后，他顿悟了。\n做人，不能太踏实，还是要学会投机取巧。\n在确认更改原著剧情能获得大量熵值后，林舟果断选择把自己塞进剧情。\n只他一个改变的剧情当然不够，可如果还有一个隐居避世的大家族呢？\n再没有什么能比一个横空出世的家族改变剧情更方便了。\n多方势力都在争夺的信物？主角遍寻不得的仇家？行事莫测的高手？\n一切的一切，都在这个只显露冰山一角的大家族掌握之中。\n-\n林舟，一个领了家族任务被派出来的子弟，其行事从来都以家中任务为首要目标，道上骂他的人不知几何。\n有人想拉拢他，也有人骂他是家族的走狗，可无论道上的人怎么说，他们都清楚一个事，那就是这位年纪并不大的后生，是个狠角色。\n横空出世仅仅两年，哪怕身后的家族供给他源源不断的资源，能将手下创立的据点做到这个地步都说明了他的能力。\n（无脑爽，无暧昧向，重要的事情说三遍：无cp，无cp）", "tags": ["民国言情", "现代言情", "系统", "穿越", "民国", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "快穿": [{"label": "娇软小漂亮天生就要被男人觊觎", "fullTitle": "娇软小漂亮天生就要被男人觊觎", "link": "https://fanqienovel.com/page/7660389113538808894", "data": [10.92, 10.96, 11.19, 11.51, 11.98, 12.24, 13.52], "trend": 2.6, "latest": 13.5, "wordNumber": 237810, "creationStatus": 1, "desc": "［1v1+双洁+甜宠+身高差体型差+各种类型男主+天生媚骨］\n小合欢花终于修炼成人形，在族里长辈的提议下入世修行。\n云雪儿谨记长老们的叮嘱，只为寻找世界中气运最强者帮助自己精进修为。\n人是找到了，可怎么没人告诉她这些男人怎么见到她就想狗见到了骨头，可怕、霸道、让人难以招架。", "tags": ["快穿", "总裁", "幻想言情", "甜宠", "双洁", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "开局穿渣男？笑话！软饭我吃定了", "fullTitle": "开局穿渣男？笑话！软饭我吃定了", "link": "https://fanqienovel.com/page/7646322248013335576", "data": [10.03, 10.42, 10.87, 11.15, 11.29, 11.39, 12.45], "trend": 2.42, "latest": 12.4, "wordNumber": 298516, "creationStatus": 1, "desc": "开局穿渣男？笑话！软饭我还吃定了！\n（快穿+家长里短+打脸+软饭男+无固定CP+没有金手指+脸好看）\n许砚舟实验室爆炸身亡，意外绑定快穿系统，为了回到实验室爆炸前两小时，他只能不停的在小世界做任务，但是谁来告诉他为什么每次都穿成吃软饭还吃不明白的渣男啊？\n不过没关系，他胃不好，最会吃软饭了。\n世界一：尚公主的侯府小少爷√\n世界二：影后的厨神小男友√\n世界三：被富婆包养的男公关√\n世界四：被榜下捉婿的探花郎\n世界五：靠岳丈一家供养的知青\n世界六：靠卖儿卖女生活的继父\n世界七：爱上假千金的豪门私生子\n世界八：抱错大腿的劳务派遣\n世界九：疯狂借运的早死大明星\n世界十：背信弃义的凤凰男\n（未完待续…… ）", "tags": ["快穿", "系统", "幻想言情", "穿越", "公主", "打脸"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, 族办公室，全程只为自己一人服务，直接惊破众多好友。\n最终黎梦将自己真的变成了豪门大小姐，住豪宅开豪车，私人助理，全能管家全部都有啦。\n提示：\n本文购物情节，和去世界各地旅行的环节描写详细，主打享受生活。\n没有极品，没有反派撕逼环节。\n本文因为主打日常购物消费，一开始打地基节奏比较慢一点，所以希望各位读者大人不要放弃本书哈，后期节奏就快一点", "tags": ["现言脑洞", "现代言情", "系统", "重生", "无CP", "前世今生"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "修仙满级回现代，我让全家横着走", "fullTitle": "修仙满级回现代，我让全家横着走", "link": "https://fanqienovel.com/page/7658235056653077529", "data": [5.29, 5.71, 7.39], "trend": 2.1, "latest": 7.4, "wordNumber": 246734, "creationStatus": 1, "desc": "【爽文+日常+全家致富+雄竞】\n评分刚出比较低，后期会涨。\n故事整体偏家庭日常，所有人都是一步一步成长起来的，介意的慎入。\n凌霄死了二十年，又从修仙界杀回来了。\n\n二十年前她意外穿越到修仙界一呆就是两万年，踩着尸山血海修成满级大佬，如今撕裂时空回到现代，蓝星才过了区区二十年。\n她那忠心耿耿的灵宠应时，却已经在蓝星上等了整整五千年，顺便成了全球最古老、最神秘、最有钱的隐世家族掌门人。\n\n回来第一件事就是查亲人的下落。\n\n结果查出来的信息让她血压飙升——\n妈妈改嫁务农，姐姐离异带娃二婚欠了一屁股债，日子过得苦不堪言。\n而她当年之所以掉海里穿越，是因为去找那个傍上富婆抛妻弃子的亲爹要学费，被妈妈姐姐当成了叛徒。\n\n现在她回来了，满级法术在手，全球首富当跟班。\n一向瞧不起她妈的亲戚排队来巴结，她妈开的农家乐，用的她灵泉空间里的食材，延年益寿，全球大佬排队来消费。\n姐姐摇身一变，成为集团总裁，前夫悔的肠子都青了。\n\n至于钱？她家应时在蓝星经营了五千年，别的没有，就是钱多到花不完。\n满级大佬回归现代，专治各种不服，顺带让全家过上神仙日子。", "tags": ["现言脑洞", "现代言情", "穿越", "空间", "大佬", "发家致富"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绑定接吻系统，咋都嘬上瘾了", "fullTitle": "绑定接吻系统，咋都嘬上瘾了", "link": "https://fanqienovel.com/page/7659021946213911614", "data": [12.6, 13.26, 14.61], "trend": 2.01, "latest": 14.6, "wordNumber": 173111, "creationStatus": 1, "desc": "刚开分）万人迷，女主给他们香迷糊了/烧男人/雄竞修罗场/男全洁/全员真香沦陷\n（这玩应简介咋写啊，我求你们看bushi）\n社畜林幺绑定了亲亲变美系统。\n她必须按照系统要求，想办法和优质目标人物接吻，以此来对系统进行充电。\n任务奖励极其丰厚：天籁之音、魔鬼身材、最强柔韧度。\n“等等，我万一挨揍咋办？”\n【宿主放心，我是专业的，一旦他们摄入你的信息素，就会上瘾似的渴望更多，只要你勾勾手，他们连命都给你。】\n“我不行啊！”\n【宿主有拒绝的权利，但我与您命脉相连，我休眠的那一刻，您也一起】\n“……”\n林幺欲哭无泪，为了活命，她不得不狗狗祟祟地去接近目标。\n目标A：集团董事，雷厉风行，看她的目光都是冷的。\n没办法，林幺咬牙硬上，亲完就跑。\n结果这一亲，男人连续一周没睡好觉，一闭眼就是想她、想她、想她。\n邪门了。\n不行，他得把她追回来。\n但林幺很忙啊。\n目标B：金牌律师，斯文败类，玉面狐狸。\n目标C：天才法医，清冷疯批，情感漠视。\n目标D：顶级清道夫，阴鸷少年，只哄不停。\n目标E：邻家哥哥，毒舌抽象，嘴硬心软。\n目标F：教廷神子，绿茶黑莲花，天天色诱。\n还有GHIJ……\n目标太多，林幺不得不骗完这个骗那个，结果大家聚一块了。\n非大女主，纯男色文", "tags": ["现言脑洞", "现代言情", "系统", "总裁", "天才", "律师"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "神豪系统：美男收集图鉴", "fullTitle": "神豪系统：美男收集图鉴", "link": "https://fanqienovel.com/page/7654902943195352126", "data": [5.79, 6.58, 7.8], "trend": 2.01, "latest": 7.8, "wordNumber": 178081, "creationStatus": 1, "desc": "【神豪+多美男+直播打赏+无脑爽+男全洁+日常花花花】\n代月纯狂徒，准备对男友霸王硬上弓时，被推飞撞死，回到10年前，意外绑定神豪系统。\n打赏美男能返现，本垒打了还有意外大喜，狂徒·代月表示：挖洋芋！（我愿意）\n自此，她只能刷钱刷到麻木，花钱花到厌倦，数钱数到手抽筋，变成了一个浑身沾满铜臭味满，左拥右抱的满级富豪。\n（避雷：月姐真大凰丫头来的，慎入。）", "tags": ["现言脑洞", "现代言情", "系统", "重生", "直播", "无脑爽"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "掠夺男主爱意后，我成为了万人迷", "fullTitle": "掠夺男主爱意后，我成为了万人迷", "link": "https://fanqienovel.com/page/7618307530891987993", "data": [5.65, 6.01, 7.2], "trend": 1.54, "latest": 7.2, "wordNumber": 288302, "creationStatus": 1, "desc": "【精致利己白切黑+雄竞+变美系统+训狗文学】\n时音是个普通人，唯一的变故可能就是考上了重点高中，但，依旧普通。\n在看过别的长相甜美的小女孩撒撒娇就能获得糖果，时音摸了摸自己的脸。\n要是她也能长的漂亮就好了。\n后来，十八岁的时音绑定了女神系统，不仅得到了变美的秘密，还得知了世界的真相——\n原来，她所在的世界是一本小说，男主是她未来隔壁学校的学长，清冷矜贵，但暗恋之人却为了追寻自由，远赴国外留学，甚至交了个外国男友。\n男主得知后大受打击，在好兄弟的组局下，找了个替身女友。\n女主回国后，二人经过一番狗血拉扯，最终解除误会达成he结局。\n时音以为自己会是那个替身女友，却被系统告知，替身女友是自己未来人美声甜的大学室友。\n而时音，只是整本书中被一笔带过的炮灰路人甲，唯一的戏份就是在男女主因误会与替身女友发生争执时上去劝架。最后因整容失败而割腕自杀。\n————\n在得知只要掠夺爱意后，就能变美，时音眼中闪过痴迷。\n直到，被玩弄后的男主男配红着眼问她，\"时音，你究竟有没有心？\"\n心？她当然有了。\n只不过不是爱你们的心，而是踩着你们上位的心。\n#既然你爱我，就满足我\n#感情？净给些没人要的东西", "tags": ["现言脑洞", "现代言情", "系统", "腹黑", "白切黑"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒女二被男主错认成女主后", "fullTitle": "恶毒女二被男主错认成女主后", "link": "https://fanqienovel.com/page/7624784956866186264", "data": [6.49, 6.81, 7.7], "trend": 1.21, "latest": 7.7, "wordNumber": 228024, "creationStatus": 0, "desc": "【现言甜宠/日常向/双洁/男主逗比脑补帝/女主吐槽大师】\n十八岁那年，虞晚发现自己是一本小说里的恶毒女二。\n她虚荣、拜金、挥金如土，最后被继兄男二指着鼻子骂吸血鬼、寄生虫。\n——最后，她被赶出豪门，惨死街头。\n……不行！恶毒女二也要自力更生！\n于是虞晚拒绝了豪门的每一分钱，开始打工。\n直到有一天，她正在咖啡店洗杯子，突然听见了男主的心声：\n【系统，你确定是她？】\n【宿主，根据原著简介描述，‘A大最美最穷的女生’就是本书女主。虞晚又穷又美！她一定是女主！】\n【你确定，她就是我命中注定的另一半？】\n【宿主，我十分确定！你，李熠，是这本小说的男主。她，虞晚，是这本小说的女主。】\n【你们就是天造地设的一对！】\n虞晚：……？\n天呐！男主把她一个恶毒女二错认成女主了！\n——\n当李熠又一次疑惑女主的好感度加的这么慢后，系统提出了疑问：\n【宿主，有没有可能，我们找错人了？】\n【想什么呢！】李熠冷哼：【要是女主这么好攻略，凭什么当女主？】\n他转头，看向虞晚的目光炯炯有神：\n【不愧是我命中注定的女人，就是与众不同！】", "tags": ["现言脑洞", "现代言情", "系统", "甜宠", "豪门世家", "双洁"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "被逼回乡，老祖宗回来撑腰了！", "fullTitle": "被逼回乡，老祖宗回来撑腰了！", "link": "https://fanqienovel.com/page/7647458669554060312", "data": [18.3, 19.1, 19.39], "trend": 1.09, "latest": 19.4, "wordNumber": 185847, "creationStatus": 1, "desc": "【无CP，请放心食用】\n唐娇在娱乐圈打拼了六年，养着青梅竹马的恋人上大学，谁知道男朋友被富家小姐看上了。\n男朋友劈腿攀上高枝。\n富家小三姐打压她。\n一夜之间，全网黑。\n走投无路之下，她被逼着回到乡下。\n回家之后就没绷住，直接去祖坟哭。\n没想到一下就把家里的老祖宗给哭回来了！\n泼天的富贵，立马就来了。\n她不装了！\n直接回家继承家业了！\n苏黎以为自己死了，没想到意外穿越到了修仙界。\n她一心苦修，好不容易要飞升了。\n却被另界的后辈给哭回去了。\n“老祖宗，他们全都欺负我！”\n回家一看，太惨了。\n一大家子，就只剩下了这么一个独苗苗。\n还有一个从小就被人偷走了。\n这个家，没她得散啊！\n顾城从小就是独生子，父母对他虽然不亲近，可也很不错。\n谁知，他居然是个假少爷。\n真千金回归，他立马成了家里的透明。\n养父母想让他和真千金结婚，谁知道真千金看不上他。\n转头就把他赶出了家门，还处处打压他。\n背负巨额负债的他，突然得知自己是被偷的？\n家里还有一个老祖宗和一个亲妹妹？\n好日子也算是被他过上了。", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "空间", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "狐狸精下山，顶级万人迷训狗守则", "fullTitle": "狐狸精下山，顶级万人迷训狗守则", "link": "https://fanqienovel.com/page/7650314635018521625", "data": [11.16, 11.19, 11.85], "trend": 0.69, "latest": 11.9, "wordNumber": 292377, "creationStatus": 1, "desc": "刚开分，会涨【钓系万人迷 + 诱而不自知 + 修罗场 + 上位者为爱低头 + 1vn + 纯欲系笨蛋美人 + 改造变美（含网恋、高干元素）】\n\n因暗恋舍友的高富帅男友而声名狼藉的乡下普女胡宝芝，机缘巧合下……\n\n被一只刚刚下山的狐狸精取代了身体。\n\n众所周知，狐狸精要吃男人的阳气才能活。\n\n初出茅庐的小狐狸精宝芝在努力学习当一个女大学生的同时，也开始了自己的寻找口粮之路。\n\n高冷学霸、电竞男神、封建大爹总裁、权势滔天的京三代…\n\n这些口粮们开始都看不上她，最后却都红着眼质问宝芝为什么要抛弃他们。\n\n宝芝却只能无辜地眨眨眼睛。\n\n再好吃的东西吃久了，也会腻的，不是吗？\n\n每个曾拥有过宝芝的男人都以为自己能与她天长地久。\n\n总之妹宝走到哪撩到哪，天然渣属性。\n男主不是在当小三就是在打小三的路上。\n\n本文两个地图：\n京市篇：校园背景（包含文案中出现的男嘉宾）\n沪市篇：都市背景（男嘉宾待解锁中…）", "tags": ["现言脑洞", "现代言情", "校园", "总裁", "幻想言情", "学霸"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "炮灰女配勾勾手，血族少爷全当狗", "fullTitle": "炮灰女配勾勾手，血族少爷全当狗", "link": "https://fanqienovel.com/page/7661498676581256216", "data": [23.66, 24.12, 24.13], "trend": 0.47, "latest": 24.1, "wordNumber": 239486, "creationStatus": 1, "desc": "（评分刚出）\n颜控利己娇软美人×七位血族少爷继承人（七宗罪）\n血族学院｜雄竞修罗场｜穿书｜系统任务｜万人迷｜多男主！｜娇软不是真的娇妻丨含有副本游戏丨男主们是处|非人有超能力的都市\n提醒：女主利己惜命，擅长示弱与算计，不走舍己救人的路线。\n血族男主均有危险倾向，感情线包含争夺、占有与博弈。\n—\n边玖月穿进一本血族贵族学院文，成了替长姐入学的炮灰。\n在这里，血族掌握财富、土地与能源，人类学生戴着徽章分出等级。\n豪门子女拿血换取家族庇护\n按照书中剧情，边玖月会被榨干利用价值，死在夜曜学院的地下室。\n而原书女主林初雪却会高举人族尊严的大旗，掌掴血族少爷，引来七位继承人争相折腰。\n—\n她的命运不该像书里的剧情一样如此安排\n她不甘做别人走上巅峰的踏脚石\n她知道自己自私、贪财、惜命，还重度颜控，就算穿书又不是换人，也没替她长出舍己为人的胆子。\n让她为了人族尊严冲上去送命，她做不到。\n好在她绑定了甜美系统。\n只要完成任务就可以获得一定的道具和甜蜜值，甜蜜值存够了就可以带着一千万重生回家\n娇弱又坚韧，善良又利己的她，如何在这个地方生存下去直到完成任务回家\n当她落入纯血种口中，这场狩猎的掌控者会是谁…", "tags": ["现言脑洞", "现代言情", "校园", "系统", "幻想言情", "穿书"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成猫后，带反派全家薅秃气运女", "fullTitle": "穿成猫后，带反派全家薅秃气运女", "link": "https://fanqienovel.com/page/7662732724855114776", "data": [6.13, 6.38, 6.57], "trend": 0.44, "latest": 6.6, "wordNumber": 189567, "creationStatus": 1, "desc": "新书评分刚开\n【傻白甜沙雕小猫+全家反派路人甲+团宠+动物心声+毛绒绒】\n姜澄穿成一只炮灰橘猫，被气运女主虐杀三次吸气运后，她悟了！\n再不当血包了，只求找个毫无存在感的路人甲苟活一世！\n月黑风高夜，她碰瓷了一个社畜大叔。\n【叔，养猫吗？我干得多吃得少！】\n刚处理完“业务”的杀手之王姜铮，听见小猫心声，沉默了。\n为不吓跑这只傻白甜，杀手全家被迫开启“遵纪守法好市民”剧本。\n于是，在姜澄眼中：\n老爸是平庸社畜，偶尔处理一些“肉类碎块”。\n老妈是温柔主妇，虽然宠物是毒蛇和蜥蜴。\n哥哥是病弱理科生，只是兜里常揣微型炸弹。\n妹妹是单纯高中生，偶尔发出反派狞笑。\n姜澄握紧了猫爪：\n【我的家人都是普通人，必须保护好他们！】\n当晚，猫猫率领毒蛇老鼠，熟练炸了总电闸，把气运女主价值一亿的新手礼包连锅端回家。\n正开会分赃的四个顶级反派，听着脑内的剧透，嘴角疯狂上扬。\n——懂了，以后亲子活动就是跟猫打劫。\n气运女主要再次虐杀小橘猫，所有人都觉得猫死定了。\n却见她那社畜老爹慢条斯理地走上前，身后，无数黑洞洞的枪口从阴影中探出。\n他朝她招了招手，语气是极致的温柔与冷酷：\n“澄澄，过来，别溅你一身血。”\n姜澄猫瞳地震。\n爸爸，你不是遵纪守法的平庸路人甲吗？！", "tags": ["现言脑洞", "现代言情", "幻想言情", "穿越", "团宠", "反派"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a 偏执，阴暗\n他是个大变态！！！\n-\n直到姜岁澜真的离开，那个将死一直挂在嘴边的男人突然间就不想死了。\n男人一身阴冷死寂，对着空号喃喃自语\n“宝宝，我不想死了，也不闹了”\n“求你别抛弃我…”", "tags": ["青春甜宠", "现代言情", "暗恋", "双洁", "甜宠", "破镜重圆", "校园"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "年代": [{"label": "七零：成了农村耀祖亲生的崽", "fullTitle": "七零：成了农村耀祖亲生的崽", "link": "https://fanqienovel.com/page/7663822713491835928", "data": [16.38, 18.46, 21.32], "trend": 4.94, "latest": 21.3, "wordNumber": 142618, "creationStatus": 1, "desc": "评分刚开，会涨\n【无cp➕团宠➕女主真小孩➕爽文➕玄幻➕多世界】\n沈遂蓁在虚空中睡着睡着，睁眼发现自己变成了小婴儿，再睁眼，又没了所有的记忆。\n她爹，原修真老祖，现农村耀祖，带着自己的储物空间被天雷劈到陌生小世界，在别人面前桀骜不驯，平等的看不起每一个人；在她面前，把她宠成了祖宗，甚至还会哭着说自己如何如何艰难才生下的她。\n她奶她爷，坚定的重男轻女拥护者，但又极为偏爱沈承耀。于是沈遂蓁生下后，老两口爱屋及乌，全然不顾自己还有那么多孙子孙女，潜意识认为只有沈遂蓁才是沈家唯一的后。\n沈遂蓁理所应当的被全家惯成了继她爹之后的下一个农村耀祖。\n只是长着长着，突然发现自己还有一个娘。\n亲娘顾泠月乃是快穿局顶尖资深员工，此刻正在京城闯荡真假千金副本.........\n(蓁蓁五岁前和顾泠月互相不知道对方的存在，跟着沈承耀在农村生活，五岁后开始前往京城)\n(蓁蓁本质上不是沈承耀亲自生的，只是沈承耀承担了顾泠月的生育痛苦，又因为系统的错误，生下来就空间传送到沈承耀身边。)", "tags": ["年代", "现代言情", "空间", "团宠", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "拿继妹照片相亲，冷面军官掐腰宠", "fullTitle": "拿继妹照片相亲，冷面军官掐腰宠", "link": "https://fanqienovel.com/page/7659378397017017369", "data": [6.36, 7.06, 9.11], "trend": 2.75, "latest": 9.1, "wordNumber": 178183, "creationStatus": 1, "desc": "评分新出，后面会涨！【美媚娇小作精×又冷又傲禁欲军官】\n季寒川被父亲勒令去乡下接人。\n临出发前母亲特意打电话叮嘱，让他防着些一个叫沈黛的姑娘，别被缠上了。\n一见面，女人一张脸勾魂夺魄，娇媚入骨，性格更是矫揉造作，闹腾作妖。\n季寒川下意识不喜，打定主意接了人之后就避而不见。\n只是后来……\n他单膝下跪，捧起女人嫩白的脚，深情印上一吻，素来冷傲的脸上满是意乱情迷：\n“黛黛，不要离开我……”\n——\n沈黛穿成了年代文里女主的对照组，一个胸大无脑、虚荣拜金、一心想要攀高枝的蠢女人。\n原主作死地拿继妹照片去相亲，被戳穿后还给男主下药。\n为了避免凄惨结局，沈黛去了军区大院后老老实实享受生活。\n面对军区大院里成堆的帅气兵哥哥时，实在没忍住好色的本质，跑去跟人家搭讪。\n一向冷傲禁欲的季寒川却拦住她，黑眸沉沉：“你是我的！”\n沈黛：？\nPS：甜宠爽文，女主是站在美貌链顶端的女人！", "tags": ["年代", "现代言情", "宠妻", "穿越", "作精", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "携空间，豪门大小姐在年代", "fullTitle": "携空间，豪门大小姐在年代", "link": "https://fanqienovel.com/page/765 先找小花哥哥解除婚约，被送出国，拐走姐姐霍有雪，跑去墨脱睡了张起灵。\n系统001看着宿主的操作，说好的你胆小呢？胆小你敢睡了张起灵？要不让宿主穿成个男的？不知道会有什么惊喜呢？！\n1、穿越成霍有雪（CP瓶、黑、花）\n2、穿成霍秀秀（CP瓶、黑、花）开局先睡张起灵\n3、穿成尹南风（CP黑、花、瓶）\n4、穿成阿宁（CP暂定瓶、邪、黑、花）\n5、未定......", "tags": ["悬疑脑洞", "悬疑", "盗墓", "星际", "系统", "穿越", "同人"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "让让，挡我杀人了", "fullTitle": "让让，挡我杀人了", "link": "https://fanqienovel.com/page/7626141425612098622", "data": [3.85, 3.88, 3.95], "trend": 0.1, "latest": 4.0, "wordNumber": 240269, "creationStatus": 0, "desc": "【没有恐怖标签，因为我觉得写的不恐怖，但读者说吓人，让我预警下。】\n\n【第一，女主绝对善良。第二，不要相信任何人的话。】\n池金莲的房子里藏着娘的腐尸，雪地里倒着未婚夫的僵尸，山洞里埋藏着父亲的朽尸，那都是她一个人的秘密。\n　　\n　　她的世界就是个巨大的停尸场。\n　　\n　　她喜欢以火救火，以水救水。\n　　\n　　旁人指责她，说她这是益之而厉。\n　　\n　　她想了想，在火里面撒了毒药，在水里面放了屎。\n　　\n　　对于这个时代而言，她不亚于毁灭世界的毒瘤。\n　　\n　　但身处这个时代，即使无比错误，也无限正确。", "tags": ["悬疑脑洞", "悬疑", "女强", "灵异", "无CP", "攻略反派"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "盗墓：我就是个拿画笔的", "fullTitle": "盗墓：我就是个拿画笔的", "link": "https://fanqienovel.com/page/7655175878015454270", "data": [3.84, 3.88, 3.9], "trend": 0.05, "latest": 3.9, "wordNumber": 283744, "creationStatus": 1, "desc": "先是老九门的故事，这章篇幅比较短，作为过渡。然后是九门三代。\n杨花落刚穿越到山东瓜子庙鲁王宫就见了五鬼朝拜的诡异场面。\n吴斜见这个人悄无声息摸到他们五人背后，寒意爬上脊背。\n吴斜：“你是人是鬼？”吴三醒：“人影子立那儿了，你眉毛下挂俩蛋，只扇风不会看是吧？”\n吴斜委屈巴巴：“心急则乱，再说，人难道就不可怕了吗？”\n吴三醒哑口无言，心想还真是这个理儿。\n杨花落：这人一来就拿手电筒晃我，挑衅我是吧？\n———\n杨花落瞟了一眼任务介绍，寻找海南西沙沙头礁下的‘小北鼻’。\n杨花落：？\n杨花落不解，小北鼻？小baby？小宝贝？\n宝贝？宝物？孩子？\n什么乱七八糟的。", "tags": ["悬疑脑洞", "悬疑", "系统", "穿越", "盗墓", "灵异", "同人"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "盲雌一睁眼，周围全是大佬兽夫", "fullTitle": "盲雌一睁眼，周围全是大佬兽夫", "link": "https://fanqienovel.com/page/7654427669408255000", "data": [2.57, 3.07, 5.22], "trend": 2.65, "latest": 5.2, "wordNumber": 166642, "creationStatus": 1, "desc": "【兽世+甜宠+雄多雌少+日常治愈】\r\n一场意外，失明少女颜悦穿越到凶险的蛮荒兽世。\r\n荒草荆棘、古木参天、猛兽蛰伏、弱肉强食……\n为了活下去，颜悦接受了流浪兽的守护。\r\n冷厉寡言的金雕兽人，敛着宽翼护她身后，不动声色撑起安稳；\n温柔细心的熊兽人，将她裹进厚毛怀抱，事事都要操心周全；\n温柔腹黑的灵瞳猫，耳畔低语说尽情话；\n暴躁勇猛的花豹，赤忱心意却从不作假；\n还有双生人鱼，一个心思深沉，肆意逗弄，却句句藏着试探心意；\n一个温顺失语，沉默里尽是死心塌地。\r\n……\r\n兽夫轮番哄宠，蛮荒日子甜到发腻！", "tags": ["种田", "古代言情", "穿越", "兽世", "甜宠", "大佬"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生妹妹抢亲？我换亲嫁糙汉暴富", "fullTitle": "重生妹妹抢亲？我换亲嫁糙汉暴富", "link": "https://fanqienovel.com/page/7660557904553987134", "data": [9.0, 9.45, 10.64], "trend": 1.64, "latest": 10.6, "wordNumber": 252679, "creationStatus": 1, "desc": "【穿越】【重生】【换亲】【种田致富】【打脸爽文】【宠妻】【姐妹对照组】【将军】\n前世，妹妹苏雪嫁给军汉年纪轻轻就守了寡，姐姐苏婉嫁给探花郎成了人人羡慕的诰命夫人。\n重生归来，苏雪干的第一件事，就是哭闹着不嫁霍家，抢着要嫁给未来的探花郎许修之，把注定要“早死”的军汉推给了苏婉。\n苏婉微微一笑：抢吧，那家暴男谁要谁拿去！\n她顺水推舟，换亲嫁给霍石安。\n本以为是去当个有钱有闲的快乐小寡妇，谁知她用精神体莲息把糙汉养得生龙活虎，霍石安不仅没死，还一路加官进爵，把她宠上了天！\n而抢走探花郎的妹妹，在许家吃糠咽菜被恶婆婆磋磨，盼着渣男高中，日子越过越差。", "tags": ["种田", "古代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成流放罪臣的恶毒妻", "fullTitle": "穿成流放罪臣的恶毒妻", "link": "https://fanqienovel.com/page/7637903145187691582", "data": [3.51, 3.93, 5.08], "trend": 1.57, "latest": 5.1, "wordNumber": 258484, "creationStatus": 0, "desc": "评分低是才开！\n宋知意一睁眼，穿进了一本古言虐文。\n穿成了那个偷光丈夫救命粮、跟押送官私奔、最后被浸猪笼的恶毒妻子。\n身边躺着烧到四十度、伤口发黑的男主——前内阁首辅沈惊寒。\n面前坐着满嘴黄牙、眼神下流的押送官赵虎。\n路边的车前草，她认得。沟渠里的黄芩根，她挖得。\n水缸里的断肠草，她一舔舌尖就辨出来了。\n粥里磨碎的曼陀罗籽？不好意思，她闻得到那股微麻的涩味。\n所有人都在等沈惊寒死在路上。\n而她，拿一根断了头的铜簪当针，扯麻绳当线，就着火光缝了七针。\n没有外挂的普通人，凭什么活到最后？\n凭一双认得药草的眼睛，一颗死也要死得明白的心。", "tags": ["种田", "古代言情", "穿越", "医术", "穿书", "魂穿"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "生七个娃逃荒？我的马车无限囤货", "fullTitle": "生七个娃逃荒？我的马车无限囤货", "link": "https://fanqienovel.com/page/7583891851157965848", "data": [2.1, 2.35, 2.89], "trend": 0.79, "latest": 2.9, "wordNumber": 253232, "creationStatus": 1, "desc": "【逃荒+天灾+无限空间+无限囤货+灵泉+养七个娃日常+美食+丧尸】\n　　前世，田秋水靠着一辆可以无限囤货、无限扩大的马车，在末世庇护夫家二十余口整整三年！\n　　换来的却是丈夫与好闺蜜暗通款曲，诞下双生子！\n　　恶毒婆婆骂她三岁的亲生女儿是赔钱货，将她推入丧尸潮中！\n　　“你以为你只生了一个女儿吗？你生了七个！当时我们偷偷给你卖了六个！赔钱货要这么多有什么用？”\n　　得知惊天真相对夫家恨之入骨的田秋水再睁眼，她竟回到了末世降临前一个月！\n　　刚生下七胞胎女儿，极品婆家故技重施，想把她刚出生的六个亲生骨肉卖给黑心人贩子换钱？\n　　田秋水冷笑一声，一把生锈的剪刀直接抵住渣夫，“要么滚过来写和离书！要么今天就送你当太监！”\n　　踹翻极品夫家，带着护短的爹娘，和七个绝世宝贝女儿果断跑路！\n　　觉醒【无限囤货马车系统】，一个月内搬空夫家！\n　　一个月后，极寒、酷暑、洪涝、地震、丧尸狂潮接踵而至，人间沦为炼狱。\n　　当渣夫全家在丧尸群里断水断粮、冻饿交加、跪地磕头求她赏一口残羹冷炙时。\n　　田秋水却坐在早已升级成末日堡垒的豪华马车里，抱着七个乖女儿喝羊奶，将马车上刚升级好的火枪大炮对准渣夫全家！", "tags": ["种田", "古代言情", "乡村", "美食", "逃荒", "天灾"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "丫鬟反籍，带回两孩子", "fullTitle": "丫鬟反籍，带回两孩子", "link": "https://fanqienovel.com/page/7636305754881788990", "data": [2.02, 2.23, 2.77], "trend": 0.75, "latest": 2.8, "wordNumber": 172287, "creationStatus": 1, "desc": "【种田➕魂穿➕空间➕养娃➕虐渣➕流放➕基建】\n（一时疏忽，打错书名。正确书名:丫鬟返籍，带回两儿子）\n陈幼安投胎失败，魂穿到带着孩子返乡的丫鬟程宁身上。\n回村后，她一心想搞营生糊口，和两个小儿好好在村里苟活。\n奈何，树欲静风不止。\n继奶想把她嫁给鳏夫拿聘金，还想卖掉她的孩子。\n她把继奶和鳏夫扒了衣服关在一屋，共处一室。\n继奶老了老了被休了。\n镇上员外觊觎她的方子，当天员外骑马外出，眉心不知中了何种暗器，当场毙命。\n村长和村长女儿为了悔婚，陷害她和瘸子通奸要把她沉塘？\n村里全员恶人，都想欺负她孤儿寡母。\n既然不让她好过，那就大家都别好过了，她把全村人迷晕，把所有人弄得衣衫凌乱，男男女女垒做一堆，然后敲锣打鼓去报官。\n县官大人一听，全村靡乱？\n他辖下竟然还有风气如此败坏的村子？\n太好了！\n他正愁上官派下来的任务不好完成。\n惊堂木一拍，全村发配边关，成为朝廷新攻下的城池的新移民！\n程宁:“……”\n这，这算不算是搬起石头砸自己的脚了？\n她满脸怨气地收拾东西，准备带着两个小儿迁往边关，那个脸上贴着假疤的假瘸子巴巴贴上来。\n“宁宁，你两儿子缺个爹，你看我合适不？”", "tags": ["种田", "古代言情", "乡村", "空间", "虐渣", "魂穿"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世团宠：幼崽的基建囤货日常", "fullTitle": "兽世团宠：幼崽的基建囤货日常", "link": "https://fanqienovel.com/page/7648995866363038745", "data": [4.56, 4.66, 5.11], "trend": 0.56, "latest": 5.1, "wordNumber": 287237, "creationStatus": 1, "desc": "白果在回校的路上，被辆黑车一屁股拱到河里，再睁眼成了被兽人捡回部落的熊猫幼崽。\n白果看着帅气腹黑的银狼哥哥，又看看蠢萌蠢萌的黑狼二哥，觉得也不是不行。\n但住山洞，吃烤肉、野果，她不行她不可。\n白果想改善日常伙食，奈何作为家中最小的幼崽毫无话语权。\n随着一次又一次发现新食物，白果逐渐掌握话语权。\n她背着小竹篓，带着两个哥哥满山跑，挖野菜、收物资、开垦田地。\n山洞潮湿，简陋兽皮棚？没关系，小手手动手搭建坚固石屋。\n食物短缺？不怕，良田万顷，美食管够！\n白果眨着圆溜溜的大眼睛：只是想好好种田搞基建，怎么就成了兽世公认的小大佬啦！", "tags": ["种田", "古代言情", "兽世", "团宠", "大佬", "基建"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "家徒四壁我养活两个兽世哥哥", "fullTitle": "家徒四壁我养活两个兽世哥哥", "link": "https://fanqienovel.com/page/7621838813861514264", "data": [7.01, 7.06, 7.18], "trend": 0.17, "latest": 7.2, "wordNumber": 220180, "creationStatus": 1, "desc": "【救赎向+雌尊+蛇兽+洁+1v2】\n安瑜穿越了，开局就在当人贩子卖自己的继兄。\n她看看面前嚣张的买家，身后一副心死如灰摸样的继兄，她拍开递来的兽晶。\n“我不卖了。”\n可带着继兄回家，才发现家徒四壁，不卖人还真快活不下去了。\n家里还有位跟着狩猎队外出的大哥，但分到的肉只够安瑜一个人吃。\n一家三口人两个饿肚子，偏偏两个哥哥任劳任怨唯唯诺诺。\n安瑜没招了，摸摸自己的兽耳，只能撸起袖子养哥哥。\n……\n一些设定：雌性是半兽人形态，雄性平时是普通人形态，捕猎时会变兽形，但根据等级决定变异时常，所以雌雄一起捕猎，雌雄充当眼睛来指挥。", "tags": ["种田", "古代言情", "穿越", "兽世", "异世穿越", "魂穿"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "身怀武力和空间，独自逃荒杀疯了", "fullTitle": "身怀武力和空间，独自逃荒杀疯了", "link": "https://fanqienovel.com/page/7649608466180361240", "data": [2.21, 2.17, 2.22], "trend": 0.01, "latest": 2.2, "wordNumber": 288757, "creationStatus": 1, "desc": "（无cp+心狠手辣+不圣母+有仇必报+天灾）\n　　灾荒年，苏小丫的家人为了一小袋粮把她卖给了老光棍儿，不愿屈服的她一头撞柱惨死。\n　　死于末世大爆炸的苏默就穿来了。\n　　只是处境不太妙：干旱缺水，敌国入侵，全村都逃了。\n　　为了活命，她逃上山，独自踏上南下逃荒之路。\n　　途中遇到了原主的家人。\n　　原主娘：“哪怕是给你吃屎长大的，那也是我这个做娘的一把屎一把尿的功劳。”\n　　吃屎是吧，那让你吃个够，这就是我对你天大的恩情了！\n　　恶毒爷奶，吸血的爹和弟还想再次把她卖了。\n　　那不能够！全家归西套餐立马安排上！\n　　逃荒路漫漫，灾祸不断，她只能咬牙朝前走，始终坚信不放弃，就有生的希望……", "tags": ["种田", "古代言情", "空间", "无CP", "逃荒", "天灾"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "兽世开荒：小怂包娇娇成团宠了", "fullTitle": "兽世开荒：小怂包娇娇成团宠了", "link": "https://fanqienovel.com/page/7651124284554759192", "data": [2.01, 2.04, 2.01], "trend": 0.01, "latest": 2.0, "wordNumber": 259763, "creationStatus": 1, "desc": "【兽世】【小怂包】【甜宠】【生存】\n苏妙斥巨资办了998游泳卡，只上一节课，一睁眼穿越蛮荒兽世。\n她被族长指派给一头性情暴戾的守护兽，受尽冷待磋磨，最后竟被狠心丢弃在荒林等死。\n濒临绝境之际，数名颜值逆天的兽夫踏光而来。\n为首的君泽眸光缱绻，满心疼惜：“这般软糯小雌性，他不疼，我来疼。”\n从前人人嫌弃、受尽委屈的小苦瓜，一朝得兽神眷顾，坐拥一众神颜兽夫。\n开荒觅食、抵御凶兽、搭建暖巢，全员把她捧在心尖娇养。\n从前受尽冷眼的小怂包，终究在蛮荒绝境里，被偏爱裹成独一无二的团宠。", "tags": ["种田", "古代言情", "穿越", "兽世", "团宠", "甜宠"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "玄幻言情": [{"label": "恶役女配她只想活命", "fullTitle": "恶役女配她只想活命", "link": "https://fanqienovel.com/page/7654607579082935321", "data": [2.94, 3.43, 4.92], "trend": 1.98, "latest": 4.9, "wordNumber": 112068, "creationStatus": 1, "desc": "（见色起意，日常文，娇弱文，非爽文，非大女主，多视角文，依靠男主，女主控勿入，双洁，半人半龙）\n爱财抠门龙傲天vs娇弱好色真凡人\n玉宸雪一觉醒来，发现自己活在一本龙傲天小说里，而她就是那个活不过十章的恶毒女配。\n书里男主陈砚凡，修仙世家出身，八岁被灭门废脉，流浪十年后觉醒龙血，一路杀上九重天，红颜无数。\n而她玉宸雪，不过是他在凡间当佣人时，那个仗势欺人、动辄折辱他，最后被他随手碾死的炮灰。\n眼下剧情已经走到第三章，那个日后将屠尽八荒的男人，正穿着她家下人衣服，在院子里扫地。他龙脉已醒，修为暗涨，目前只想混口饭吃。\n玉宸雪知道自己死期将至，干脆破罐破摔，反正横竖都是死。\n——于是她把龙傲天睡了。\n玉宸雪每回召他入房，完事后便丢下一袋灵石，权当交易。陈砚凡竟也乐得配合，毕竟他是真贪财。\n荒唐日子过了一月，玉宸雪发现这个男人确实没打算杀她。她甚至开始妄想，也许命运可以改写。\n然后灭门之夜意外到来。\n杀声四起时，刚刚从他怀中起身。火光映亮半座府邸，她浑身冰凉，等着他亲手了结自己这段孽缘。\n然而陈砚凡只是替她披上外袍，转身走进夜色，头也没回。\n玉宸雪怔在原地，忽然不知道该恨他冷血，还是该庆幸……", "tags": ["玄幻言情", "大小姐"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "8小时修仙，老娘卷哭全世界", "fullTitle": "8小时修仙，老娘卷哭全世界", "link": "https://fanqienovel.com/page/7650930355381210137", "data": [5.91, 5.97, 6.61], "trend": 0.7, "latest": 6.6, "wordNumber": 254710, "creationStatus": 1, "desc": "【 卷王穿越修仙界+种田+成长+家族】【天道？我即是天道】\n　　穿越了？\n　　挺好。\n　　穿成废柴三灵根？\n　　也行。\n　　全家把我当劳动力，供天才大哥修仙？\n　　……行吧。\n　　但这个修仙界有个破规矩——每天只能修炼四个时辰，多一秒都不行。\n　　说是天道铁律，违者天罚。\n　　大哥每天修炼四个时辰，全家夸他用功。\n　　我笑了。\n　　四个时辰？八小时？\n　　上辈子，我在纺织厂每天站十二个小时，腰椎间盘突出，疼的死去活来都没喊过累。\n　　这算什么苦？\n　　当天晚上，我偷偷修炼了六个时辰。\n　　屁事没有。\n　　第二天，我修炼了八个时辰。\n　　还是屁事没有。\n　　这个世界的人是不是搞错了什么？\n　　所谓的“极限”，不过是他们太娇气罢了。\n　　从此以后——\n　　别人修炼，我修炼。\n　　别人休息，我修炼。\n　　别人谈恋爱，我还是在修炼。\n　　天才大哥被我卷到怀疑人生：你到底怎么做到的？\n　　我：呵呵，等你每天干十二个小时农活还要被骂偷懒的时候就知道了。\n　　后来，全修仙界都疯了。\n　　“那个废柴三灵根，为什么比天灵根还猛？”", "tags": ["玄幻言情", "幻想言情", "穿越", "今穿古", "异世穿越", "魂穿"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全班穿越洪荒，唯有我登阶成圣", "fullTitle": "全班穿越洪荒，唯有我登阶成圣", "link": "https://fanqienovel.com/page/7658899236926262297", "data": [5.24, 5.37, 5.89], "trend": 0.65, "latest": 5.9, "wordNumber": 172002, "creationStatus": 1, "desc": "周青青穿越了，穿越到的还是一切世界和神话的源头——洪荒世界。\n唯一不一样的是，不仅仅是她一个穿了，她们全班都穿来了！", "tags": ["玄幻言情", "幻想言情", "穿越", "群穿", "今穿古", "异世穿越"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "普通路人甲，但顶级美貌", "fullTitle": "普通路人甲，但顶级美貌", "link": "https://fanqienovel.com/page/7641468481489095705", "data": [2.91, 3.11, 3.5], "trend": 0.59, "latest": 3.5, "wordNumber": 126997, "creationStatus": 1, "desc": "【修仙感情流➕女主美貌值up➕男全洁➕（伪）强取豪夺】\n简介：\n作为一个普普通通的路人甲，陆仁嘉只想在这波谲云诡的修仙界安稳修炼，从来没想过搅弄风云。\n然而上天却给了她一张连日月都为之倾倒的绝美容颜。\n从她出现在修仙界的那一刻，此界众生终将为她所倾倒。\n——\n这本是一个大女主重生复仇暗黑流修仙文，然而因为一个路人甲的出现而画风逐渐偏移上不可说。\n避雷：女主万人迷，会跨越性别和种族；女主性格较佛系，无激烈反抗\n强烈女嬷。", "tags": ["玄幻言情", "古代言情", "一见钟情", "护短"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "出生就被淹死，我靠模拟改命", "fullTitle": "出生就被淹死，我靠模拟改命", "link": "https://fanqienovel.com/page/7659717188818832409", "data": [4.66, 4.86, 5.23], "trend": 0.57, "latest": 5.2, "wordNumber": 254429, "creationStatus": 1, "desc": "【爽文+有仇必报+女强无cp+女配友好】人在古代，尚未出生，江春年就迎来金手指——修仙模拟器。\n她立刻模拟，立刻傻眼。\n不到二十分钟，新人生竟然速通了！\n模拟中，她妈才生下她，她就被生物爹扔进河里淹死！\n哼！模拟器在手，岂能轻易狗带！\n【你成功活到第二天，不幸死于地震。】\n【你在地震中幸存，学得武功，却被修仙者斗法波及，沦为炮灰。】\n【你记仇，击杀修仙者，声名鹊起，无奈资质有限，死在提升实力的路上……】\n【……】\n【你修为绝顶，天下无敌，恭喜你飞升成仙！】", "tags": ["玄幻言情", "幻想言情", "穿越", "女强", "无敌", "无CP"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生后，她断了男女主所有的路", "fullTitle": "重生后，她断了男女主所有的路", "link": "https://fanqienovel.com/page/7659427975628065816", "data": [3.54, 3.76, 4.08], "trend": 0.54, "latest": 4.1, "wordNumber": 169813, "creationStatus": 1, "desc": "沈灵汐是她爹娘的心头宝，爹娘因为要飞升，重新回到太初大陆。怕丢下她一人在云荒大陆孤单寂寞，为她创建了宗门。\n本来是想有人陪着他们的闺女，没想到却招进来一头白眼狼。披着深情款款的皮囊，想要的却是沈灵汐的灵根和她的血液。\n在被挖灵根，放血液的时候才知道他们的世界是一本书。而那头白眼狼和他家领养的妹妹，是书中的男主与女主。\n同归于尽后，强烈的不甘让她回到爹娘没有创建宗门之前。这一次，她要让那渣男贱女死在故事的开局。\n可这该死的天道，竟然护着这样的渣男贱女。既然杀不死他们，那就断了他们所有的路。", "tags": ["玄幻言情", "幻想言情", "重生", "空间", "虐渣", "前世今生"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "危！刚飞升我就杀了天帝？", "fullTitle": "危！刚飞升我就杀了天帝？", "link": "https://fanqienovel.com/page/7663020533176339518", "data": [7.17, 7.48, 7.63], "trend": 0.46, "latest": 7.6, "wordNumber": 162973, "creationStatus": 1, "desc": "丁玖刚刚飞升，代表飞升新人给天帝敬了杯酒。\n天帝喝完……嘎了。\n丁玖：“？”\n酒杯一扔、她愤然转身：“是谁害我敬爱的天帝陛下，来人啊！封锁南天门，查出真凶，为我天帝陛下报仇！！”\n过了很久，仙界的人都没想明白——\n丁玖她一个刚飞升的新人，怎么就反客为主，做了他们仙界的主？\n丁玖：“大概是因为……我又强又不要脸？”\n*\n丁玖名言：“我的剑，从不轻易杀人。”\n伏玉：“……你刚杀掉的那一堆仙人怎么回事？”\n丁玖摸出刀，理所当然：“所以我的武器是刀呀。”\n再后来，当他们废掉丁玖的刀，以为终于可以打掉这个祸害后……\n丁玖不慌不忙：“看来只能祭出我的剑了。”\n众人：“？？？”\n——你特么竟然真的有剑！！\n*\n仙侠版谁是凶手。\n无限流走法、狼人杀玩法，爽文，群像，有cp。\n草根女主乱杀传统仙界，以及依旧用脚写的文案，凑合看！", "tags": ["玄幻言情", "幻想言情", "无限流", "群像", "古色古香"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "死遁文女主离开，我接盘阴湿男主", "fullTitle": "死遁文女主离开，我接盘阴湿男主", "link": "https://fanqienovel.com/page/7643783382958083096", "data": [7.25, 7.23, 7.65], "trend": 0.41, "latest": 7.7, "wordNumber": 225962, "creationStatus": 1, "desc": "贺喜趴在石桌上打盹时做了个梦。\n女主穿书，任务是攻略那美强惨的少年仙君。\n可惜少年好似修了无情道，对她的好感始终不上不下。\n直到被妖魔围攻那一日，她决定赌一把为他而死，好感度终于满了。\n女主攻略成功，死遁回了现实世界。\n少年却因她的死入魔，一夜屠尽千里之地。\n而贺喜的家就在这其中。\n她被吓醒了！\n“喂，阿喜。”\n一颗枇杷砸中她的脑袋。\n穿着青色道袍的少年蹲在墙上，一手撑着下颌，阳光爽朗。\n“你爹说我再攒够一百两，我就能娶你过门了，你高不高兴？”\n贺喜看着自己一年前从尸山血海里捡出来的失忆少年。\n他有着和梦中男主一模一样的脸。\n她表情复杂，“要不……我们婚事还是作罢吧？”\n少年沉了脸。\n——\n阮吱吱回到现实世界，不知为何，时常想起那个肆意潇洒的少年人。\n系统再次出现:【检测到男主黑化值过高，即将毁灭世界！】\n什么？\n他居然这么爱自己！\n怀着微妙情绪，阮吱吱回到书中世界，又一次见到他。\n少年穿着喜服，神情阴霾，手里拿着绳索，缓步而来。\n阮吱吱紧张，“裴厌，我可以解释，你别囚禁我——”\n她被扭断了脖子。\n倒在地上刹那，她见到的是少年把藏着的女孩抓出来，低声威胁:\n“贺喜，你再敢逃婚试试？”", "tags": ["玄幻言情", "系统", "幻想言情", "穿书", "异世穿越", "黑化"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "绑定双修系统后，我躺成宗门团宠", "fullTitle": "绑定双修系统后，我躺成宗门团宠", "link": "https://fanqienovel.com/page/7653329586515610648", "data": [3.29, 3.29, 3.66], "trend": 0.36, "latest": 3.7, "wordNumber": 273021, "creationStatus": 1, "desc": "【爽文+系统+修仙+微万人迷+男全洁】\n她穿进一本《我在修仙界生崽就变强》的狗血文中。\n成了活不过一章的炮灰女配安如素。\n原文小师妹是女主，身怀多子多福系统，不仅抢了她的道侣，还哄得全宗门都成了她的舔狗，最后飞升成仙。\n幸好，她获得了双修就变强系统。\n高岭之花师尊，为她跌落神坛。\n无情道二师兄，为她挡天雷。\n抠搜的三师兄，把最顶级的丹药捧到她面前。\n体修四师兄，金刚不坏神功已经达到铁石心肠，见到她心就软了。\n每天想死的五师兄，不想死了，每天只想跟她贴贴。\n就连与她解除婚契的大师兄，跪在她面前，只求她多看一眼。\n甚至黄狗旺财化为人形后，对外宣布，“主人是我的，你们敢抢，吞了你们！”\n她懵了，她只想双修变强啊，怎么就成了宗门团宠了？", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "团宠", "今穿古"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "族姐带炼丹游戏，我捡了种植板块", "fullTitle": "族姐带炼丹游戏，我捡了种植板块", "link": "https://fanqienovel.com/page/7662611486992239640", "data": [2.96, 3.0, 3.17], "trend": 0.2, "latest": 3.2, "wordNumber": 164253, "creationStatus": 1, "desc": "【家族修仙】+【发展经营】+【慢剧情流】+【灵植师】+【金手指】+【无cp】\n　　王灵葫在幼时去看望意外昏迷的族姐王灵筠时，捡到一块闪着金光的碎片\n　　这件事，王灵葫谁也没说过，自进入家族养正堂学习，修仙百艺传承果断选了灵植师，根据灵植词条，开始关于灵植遗传的研究。\n　　引气入体时，家族传承的本命灵植青符木上出现【枝繁】【叶茂】两个蓝色词条，命运开始转动，顺势开拓了副职业符箓师。\n　　自炼气三层到炼气大圆满，一直负责照料作为家族底蕴的聚灵草和淬骨草。\n　　在收割同种灵植一千株，才发现，自己意外得到的这个炼丹游戏附带种植版块隐藏福利，亲自种下、照料并收割同种灵植一千株，灵植全方位1%提升，一直到一百万株，累计提升15%。\n　　从炼气到筑基，从筑基到金丹，乃至一路到元婴、化神，王灵葫都钟爱于照料同一种灵植，至于斗法，跟我的符箓说去吧。\n　　与此同时，落寞的筑基家族清溪王家，也逐步有了祖辈昔年的威势，从恢复筑基家族全盛状态，到派遣族人穿越横澜山脉到达无尽流沙海，从金丹家族到成就元婴家族。\n　　炼气、筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫。\n　　大道无疆，砥砺永前，薪火长驰。", "tags": ["玄幻言情", "幻想言情", "无CP"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成龙傲天的早逝病弱崽", "fullTitle": "穿成龙傲天的早逝病弱崽", "link": "https://fanqienovel.com/page/7645273200145746968", "data": [3.53, 3.42, 3.62], "trend": 0.09, "latest": 3.6, "wordNumber": 267404, "creationStatus": 1, "desc": "龙傲天的养崽日常。\n沈寂作为龙傲天文里的爽文男主，活了数万年一路披荆斩棘成为当世顶峰，谁知在平平无奇的一天里肚子里突然多出一股微弱气息。费尽艰辛将崽子生下来后却发现小家伙眉眼活脱脱一个缩小版自己，却生得心脉残缺，体弱易碎，连哭都没力气，一副早夭相。\n他的孩子必须活得好好的，天要他亡，沈寂就把这天逆了。", "tags": ["玄幻言情", "幻想言情", "穿越", "穿书", "养崽", "胎穿"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "洪荒，阐教小师妹后台太硬", "fullTitle": "洪荒，阐教小师妹后台太硬", "link": "https://fanqienovel.com/page/7660791235753299006", "data": [12.23, 12.44, 12.28], "trend": 0.05, "latest": 12.3, "wordNumber": 190273, "creationStatus": 1, "desc": "【女频，非穿越，cp道祖鸿钧，没看错！女主是元始天尊的弟子，道祖徒孙！三清一家亲，甜文，毕竟洪荒没人敢质疑道祖。】\n道祖正云台高坐，忽听一道急切的声音“师尊！”\n二徒弟一向端方持重重规矩，竟然不通传直入紫霄宫？\n他皱眉正要问，怀中一沉。\n“…？”\n低头，膝上多了个小团子。\n道祖对上她的眼睛，这孩子粉雕玉琢，眼睛是浅浅的金色，很是漂亮，不哭不闹坐在他腿上，大眼睛好奇打量他。\n“弟子冒昧，这是弟子的七徒弟，她趁弟子不注意吞了颗九转金丹……”元始天尊急切的很，九转金丹，这可不是糖豆！刚化形的小徒弟吃了还不得爆体而亡，他到底刚收徒不久，慌了神。\n道祖察看后，沉默一息，对玉团子伸出手。\n元始天尊不明所以“师尊？”\n然后他就看小徒弟把手放在道祖手上，九道丹纹，赫然是那颗九转金丹。\n“玉鼎！”合着她压根没吃！\n小团子连忙往道祖怀中缩了缩，大眼睛写满委屈。\n道祖有些心累，打算把她还回去，对上那双眼睛，忽然看到了未来。\n云床软被，翻云覆雨，他身下的少女，有一双金色的眼睛。\n于是，道祖平静的问“她叫什么？”", "tags": ["玄幻言情", "幻想言情", "甜宠", "无敌", "古色古香"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰后把龙傲天们采了个遍", "fullTitle": "穿成炮灰后把龙傲天们采了个遍", "link": "https://fanqienovel.com/page/7646425289873951768", "data": [3.48, 3.5, 3.5], "trend": 0.03, "latest": 3.5, "wordNumber": 294541, "creationStatus": 1, "desc": "【穿书｜钓系女主｜多男主｜全洁｜修罗场｜伪快穿攻略】\n云妩卿穿进龙傲天扎堆的修仙世界成了一个炮灰，还接了个要命的活儿。\n系统让她采集龙傲天元阳。\n这个世界上龙傲天太多了，不拖延他们的修炼速度，世界迟早被他们卷死。\n只要采到元阳就有奖励，到时候长生飞升不是梦。\n可那些龙傲天个个眼高于顶，满心只有修炼。\n那凡人医女、兄弟道侣，南海鲛人、座下徒弟……一个个你们自己强取的女人又如何呢？\n元阳到手，直接死遁，干脆利落。\n徒留龙傲天们面对自己死去的爱人陷入疯魔。\n云妩卿淡笑：元阳到手，修为狂飙，谁管你们疯不疯。\n随着云妩卿修为越来越高，修仙界遍地都是为爱痴狂的疯批龙傲天。\n云妩卿不安：她不会翻车吧……", "tags": ["玄幻言情", "系统", "幻想言情", "穿越", "医术", "剑修"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "职场婚恋": [{"label": "渐入婚境", "fullTitle": "渐入婚境", "link": "https://fanqienovel.com/page/7648175724460772376", "data": [4.6, 5.11, 6.23], "trend": 1.62, "latest": 6.2, "wordNumber": 177805, "creationStatus": 1, "desc": "【神外医生x麻醉医生】\n【青梅竹马+先婚后爱+过期暗恋+双洁】\n麻醉科的沈医生年轻帅气又多金，是二院无数女同事心中最佳择偶对象，偏偏其人寡言冷情，身边从未出现过异性。\n神经外科的林医生明艳动人，富贵人家出身，追求者更如过江之鲫，却不曾见她为谁抛却芳心。\n二人共事多年，堪称金牌搭档。\n但从来没人将他俩想到一起——\n众所周知，沈医生与林医生磁场不合，除工作外，其余场合形同陌路，话都懒得说一句。\n-\n后来不知从哪里传出沈医生已婚的风声。\n有同事忍不住调侃：“沈医生娶的女人，会是什么样呢？”\n林稚想了想：“那当然是风华绝代的大美女。”\n同事笑道：“说的像你知道似的。”\n林稚也笑。\n她还真知道，毕竟家里的结婚证上，落着她与沈镜池的名字。\n-\n林稚和沈镜池是人尽皆知的死对头，却鲜有人知，两人也是青梅竹马。\n两小无猜的日子里，他们好过，闹过，吵过，最后分道扬镳。\n所以联姻三个月，两人依旧各不相干，关系纯洁如白纸。\n林稚认为沈镜池跟自己一样，对这桩婚事并非自愿。\n-\n直到某次冷战，有人拍到夫妻俩各自买醉。\n众人纷纷猜测，这段婚姻是否告吹。\n当夜，林稚被男人揽在怀里，听他轻语：“不吹，这辈子都不吹。”\n-\n【两情相悦这件事，是我从青春到白头的课题。】", "tags": ["职场婚恋", "现代言情", "先婚后爱", "青梅竹马", "暗恋", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "晚年底牌", "fullTitle": "晚年底牌", "link": "https://fanqienovel.com/page/7639112428055186457", "data": [4.8, 5.1, 5.94], "trend": 1.14, "latest": 5.9, "wordNumber": 111621, "creationStatus": 0, "desc": "李玉芬刚一退休就去了儿子家帮带孙子，一帮就是12年，她不但牺牲了退休后的自由，还把自己一生的积蓄包括最后卖房子的钱，都给了儿子用来结婚，买房，买车。可当她把孙子看大以后，儿媳觉得她成了家里的闲人，感觉两代人住一起不方便，便又想过河拆桥，嫌弃，排挤。屈辱绝望中的女主，不再忍受妥协，开始对自己的人生有了新的认识和醒悟，手中掌控的一笔惊人财富，也成了她晚年重启人生的最后底牌。故事撕开原生家庭的亲情凉薄，为儿女付出也要有底线，也要为自己留后路的现实内核。", "tags": ["职场婚恋", "现代言情", "家庭", "家长里短"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯爹捡我弃婴命，我护他余生安稳", "fullTitle": "疯爹捡我弃婴命，我护他余生安稳", "link": "https://fanqienovel.com/page/7659432573558344728", "data": [3.01, 3.23, 3.76], "trend": 0.75, "latest": 3.8, "wordNumber": 216601, "creationStatus": 1, "desc": "他被全村叫疯子，准备跳河那天，捡到了被豪门父母丢弃在冰河边的女婴。\n两个濒死之人，在寒冬里互相救了对方的命。\n全村笑：疯子养灾星，早晚饿死。\n二十年后，女婴成了顶级名医，疯子养父被她治愈。\n豪门血亲跪地求认亲，她说——\n“你们给我冰冷血缘，他给我整个人间。”", "tags": ["职场婚恋", "现代言情", "乡村", "家庭", "豪门世家", "医生"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "女儿惨死，我亲手覆灭仇人全家", "fullTitle": "女儿惨死，我亲手覆灭仇人全家", "link": "https://fanqienovel.com/page/7661644438480899096", "data": [4.83, 5.05, 5.46], "trend": 0.63, "latest": 5.5, "wordNumber": 209602, "creationStatus": 1, "desc": "赵云早年失去丈夫，独自一人带大女儿，不曾想，女儿刚结婚五年便带着孩子一起寻了短见。\n赵云失去女儿和外孙女的同时，却发现女婿的态度极其冷漠，她开始怀疑女儿的死并非那么简单。\n好在女儿从小便有写日记的习惯，长大后也未 的贪婪、吃瓜群众的同情，养父的叹息声之中。\n当场签字交出集团。\n在这个工业产能过剩，只懂打价格战的世界，几十亿的大厂不过是随时会贬值的空中楼阁。\n而唯有盖着英王御赐原始特许状，允许女性继承的世袭伯爵爵位，才是通往顶级老钱圈子的唯一入场券！\n拿走三千万英镑的现金，沈清欢转身退守苏格兰高地。\n机器生产被嫌弃的手工面料？\n那是她眼中的软黄金！\n濒临失传的古老编织手艺？\n那是注入时间的高定艺术！\n当沈清欢将古老家族徽章烙印在纯手工服饰上，在伦敦顶级社交季亮相时，全英王室与顶级贵族疯狂了！\n“一件衣服要五千英镑，还要配货？买！不买就配不上我的身份！”\n“这才是真正的奢侈品！”\n(英国全名名字叫：伊芙琳·辛克莱)", "tags": ["职场婚恋", "现代言情", "穿越", "打脸", "职场", "职场商战", "豪门世家"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "相亲闪婚，糙汉老公太直接", "fullTitle": "相亲闪婚，糙汉老公太直接", "link": "https://fanqienovel.com/page/7636132561508387902", "data": [3.81, 3.99, 4.03], "trend": 0.21, "latest": 4.0, "wordNumber": 204482, "creationStatus": 0, "desc": "【乡镇超市糙汉vs县城小会计+直球式相亲+年龄差两岁+细水长甜】\n林小晚相了七次亲，遇到的不是抠门就是奇葩，要不就是动手动脚。\n第八次，赵铁柱坐在对面，上来就摊牌：“我来相亲就奔着结婚来的，你要觉得行咱就处。”\n她以为又是三分钟热度。\n结果这人第二天就拉着她去挑三金，彩礼不打磕巴，领证不拖泥带水。\n林小晚内向又话少，生怕赵铁柱嫌她闷。\n但赵铁柱说：“你不用说太多，听我说就行。”\n婚后她第一次体会到被人护着的感觉，踏实，安心，有人撑腰。\n就是，就是这人太直接了，有啥说啥，她脸皮薄，有点吃不消。", "tags": ["职场婚恋", "现代言情", "婚恋", "家长里短", "乡村", "年龄差", "闪婚"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "网聊翻车！闪婚前发现竟是死对头", "fullTitle": "网聊翻车！闪婚前发现竟是死对头", "link": "https://fanqienovel.com/page/7663743385160666174", "data": [9.6, 9.88, 9.68], "trend": 0.08, "latest": 9.7, "wordNumber": 170069, "creationStatus": 1, "desc": "【先婚后爱/双洁/网上知己现实对抗路/双医生/隐婚】\n【重欲腹黑闷骚（爹系）X明媚大女人（魔丸）】\n众所周知，神外和骨外两个科室王不见王\n院长为此头疼许久\n高人提议：想解决，眼下就两个办法\n一.炸翻全院\n二.科室联姻\n院长：联姻？当他没试过吗？可二位当事人是这么说的\n骨外沈主任：“多谢院长，相亲可以，就一点要求，不找神外”\n“手术台上拿显微镜的，生活里估计也是找茬的一把好手，受不起”\n这话刚巧被路过的曲医生听见\n推门而入，“院长，不劳您费心，我有聊得来的网友，他才是我结婚首选”\n“至于沈主任…”\n曲珊溶视线自上而下扫过沈溪年，嗤道：“放心，骨外神外永不联姻”\n“我们拿显微镜的艺术家，跟抡大锤的木匠没什么好聊的！”\n-\n彼时两人都不知道，对方正是自己热聊一年的网友\n直到约定见面闪婚那天，民政局门口\n“沈溪年？”\n“你是‘善良兽医’？！”\n沈溪年淡笑：“曲医生，您对‘温柔甜心’四个字有什么误解吗？”\n-\n不想吓到医院同事，二人决定隐婚\n两个科室依旧天天吵\n直到某天，沈主任转发了条曲医生的获奖新闻，配文：【恭喜我们曲医生得偿所愿】\n骨科：我们？咱骨科要和神外合并了？\n神外：哈！咱赢了！沈主任被曲医生气疯了！\n知晓真相：原来不是合并，是被偷家了！", "tags": ["职场婚恋", "现代言情", "先婚后爱", "隐婚", "医生", "双洁"], "borderColor": "# ": 607824, "creationStatus": 0, "desc": "王莲花上山挖野菜，一脚踩空——\n再睁眼，到了个妖怪窝。\n铁壳子满地跑，比马车还快。\n人穿得露胳膊露腿，不知羞！\n房子高得脖子仰断都看不见顶。\n王莲花攥紧背篓，心里只有一个念头：这咋回去？家里还等着野菜下锅呢！\n正懵着，一张纸片子塞到她手里：“阿姨，剧组招群演，盒饭管饱，一天八十！”\n王莲花不识字，但“盒饭管饱”四个字，她听懂了。\n一把拽住那人：“大兄弟，这活我能干！”\n第一天进组，演尸体。\n导演喊“卡”之后别人都爬起来了，她还直挺挺躺地上，眼睛闭得紧紧的。\n场务吓一跳：“阿姨？阿姨你醒醒！”\n王莲花睁开眼，一脸忐忑：“这就完了？我看旁边那人不是躺了老半天吗？我躺够时辰没？能结账不？”\n场务：“……阿姨，您多躺的这一会儿不算钱。”\n王莲花心疼坏了：亏了，躺多了。\n后来剧组发现，这个农村大姐简直是宝贝。\n演逃荒的难民，她往地上一坐，眼神里的绝望把场务都看哭了——这老太太是真有故事啊！\n演村妇骂街，她袖子一撸，一口气骂三分钟不带重样，把全场演员都镇住了。\n工资日结，王莲花拿着那纸钞，知道这钱能买多少米、多少肉、多少布，手抖得跟筛糠似的。\n她当场就哭了，要是早点来这个地方，她男人是不是就不用死了？", "tags": ["现言脑洞", "现代言情", "穿越", "娱乐圈", "空间", "古穿今"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿书兽世：恶雌她终于吃上好的了", "fullTitle": "穿书兽世：恶雌她终于吃上好的了", "link": "https://fanqienovel.com/page/7627509785704811545", "data": [59.26, 59.42, 60.66, 62.22, 64.62, 67.1, 72.67], "trend": 13.41, "latest": 72.7, "wordNumber": 811985, "creationStatus": 1, "desc": "【兽世】+【雄竞修罗场】+【基建】\n沈湄穿进一本星际兽世大女主文，成了女主宁雪的对照组炮灰女配。\n书里的她，家世显赫，父兄宠爱，天赋惊人，除了长相普通点，处处都是优点。\n主脑刚给婚配了兽夫，结婚证还没焐热，海时代来临。\n曾经被争相追捧的毛茸茸陆地兽人一夜间沦为废兽，而曾被嫌恶满身腥气的水生兽人，成了炙手可热的生存保障。\n沈湄失去精神力，陆地兽夫无法入海捕猎，养活不了她。\n原主接受不了这个刺激，发疯了。\n租赁兽夫给别的雌性、逼迫兽夫当众跳求偶舞、将兽夫推进海里捕鱼……\n折辱、打骂、践踏，日复一日，极尽癫狂。\n最终众叛亲离，穷困潦倒，被海盗军团折磨分食。\n沈湄大骂原主变态，可一睁眼，穿到贩卖兽夫现场了！\n【“吃得超好系统”为您服务。请问，是否绑定？】\n吃得超好？吃什么？什么超好？\n后来，沈湄看着怼到眼前的胸肌、腹肌、大腿肌，陷入沉思。", "tags": ["现言脑洞", "现代言情", "幻想言情", "星际", "穿书", "基建"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世学院，匹配顶级兽人", "fullTitle": "穿越兽世学院，匹配顶级兽人", "link": "https://fanqienovel.com/page/7589654180378201150", "data": [18.04, 18.38, 18.85, 19.57, 21.23, 22.82, 26.15], "trend": 8.11, "latest": 26.1, "wordNumber": 949183, "creationStatus": 1, "desc": "【我流兽世+万人迷微升级流+毛绒控女主横扫顶级兽人+1vN男全c】\n（补充：全文未完，请勿臆断剧情。没有人死，全员包饺子）\n　　被羊撞后穿进兽人世界，匹配到顶级兽人。\n　　身为动物爱好者的苏徉惊喜连连，开始享受幸福人生。\n　　这是什么？毛茸茸！摸一下。\n　　这是什么？滑溜溜！摸一下。\n　　……变成人？\n　　算了，也摸一下！\n　　-\n　　兽人把自己的另一半称为【驯养师】。\n　　即为 爽文+婆家宠上天】\n七十年代末，家境贫寒受尽欺负的杨巧，被迫替嫁嫁给断了双腿的退伍英雄周文辉。\n本是一场各取所需的婚姻，她以为往后日子只有柴米油盐的艰辛，却没想到嫁对了人，连带着婆家都把她宠上了天！\n公公是部队师长，婆婆是外科主任，全家上下把她当成心尖宝。\n从受尽冷眼的苦命姑娘，到被婆家捧在手心的宝贝，杨巧一路逆袭。\n恢复高考后，她埋头苦读考上大学，成为受人尊敬的老师。\n哥哥杨政潜心钻研假肢技术，终于让丈夫重新站了起来。\n没有金手指，只有细水长流的温情与步步向上的人生。", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "代嫁代娶"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [26.37, 27.24, 27.42, 27.79, 27.73, 27.78, 30.31], "trend": 3.93, "latest": 30.3, "wordNumber": 1137613, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "重生八零：老太太抛子弃女", "fullTitle": "重生八零：老太太抛子弃女", "link": "https://fanqienovel.com/page/7460001987375926296", "data": [23.64, 24.49, 25.13, 25.36, 25.31, 25.22, 24.91], "trend": 1.27, "latest": 24.9, "wordNumber": 3198650, "creationStatus": 1, "desc": "【年代】【八零】【微群像】【重生】【爽文】【无金手指】【家长里短】\n（又名：重生八零：老太太抛子弃女）七旬老太吴知秋重生了，重生到孩子们还要靠她辛苦付出的年代！上辈子自己偏心，晚景凄凉。重生不重演，老太太决定抛开儿女，美美的过余生！\n小儿子哭唧唧抱着大腿，妈！我可是你最爱的小儿子，我要给你买大房子！为了能跟老娘在一起生活，砒霜拌馅，鹤顶红勾芡，为了老娘没事就得插兄弟两刀！\n公婆化身王炸组合“我那最有出息的大孙呦！爷奶想吃锅子，烤肉，洋饭……”把大儿子两口子坑的裤衩子都穿不上溜。\n宠妻狂魔李满仓……别和我说，这家我说的不算！", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "种田": [{"label": "崽崽荷包通两界，荒村变成桃花源", "fullTitle": "崽崽荷包通两界，荒村变成桃花源", "link": "https://fanqienovel.com/page/7595102903841344537", "data": [28.2, 28.92, 29.22, 30.11, 31.1, 32.27, 37.56], "trend": 9.36, "latest": 37.6, "wordNumber": 936074, "creationStatus": 1, "desc": "【种田+古今穿越+萌宝+温馨经营（日常向，无cp)】\n\n五岁芽芽的破荷包能通现代。\n\n从捡垃圾堆里半个卤蛋开始，到发现野菜在现代价比黄金。\n\n从捡拾到交换，从求生到经营。\n\n她背着小背篓穿梭两界，从一颗卤蛋到满仓粮食，从濒临绝境到炊烟袅袅。\n\n山还是那座山，日子却一天天有了滋味。", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越", "无CP"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "恶毒前妻再就业，汴京第一妙厨娘", "fullTitle": "恶毒前妻再就业，汴京第一妙厨娘", "link": "https://fanqienovel.com/page/7517953139266309144", "data": [13.96, 15.69, 17.18, 18.29, 19.26, 20.11, 22.5], "trend": 8.54, "latest": 22.5, "wordNumber": 601888, "creationStatus": 1, "desc": "【1v1双洁+穿书+美食+经营+日常向】\n一睁眼，叶昭昭穿成了权臣文男主的恶毒前妻。\n在书中，原主做梦都想当官夫人。\n她使尽浑身解数嫁给男主，却在男主官职被一撸到底后，不顾男主和孩子的挽留，和离回到了扬州老家，二嫁给了青梅竹马。\n只是不到一年。\n竹马就转手将原主送给上峰做礼。\n原主逃出来，辗转回到汴京，却发现新帝登基，男主一朝翻身、敕封摄政王，誉满汴京。\n原主这个前妻也变得人人喊打，最后被擅作主张的下人活生生饿死在了柴房里。\n穿书后的叶昭昭，当然不想重蹈覆辙。\n放着现成的幸福生活不要，非要回什么扬州投奔青梅竹马？\n她脑子又没进水，分得清好赖。\n小姑子难缠小叔子阴郁；\n不愁，她苦练高情商，应付两个半大孩子还不容易？\n男主颓废潦倒家里入不敷出；\n不怕，她有厨艺傍身，能眼睁睁看着丈夫孩子饿死？\n只是，她的汴京小食肆开业的那一日，怎么全汴京的权贵都来捧她的场了？\n说好的全家低谷三年、人人可欺呢？\n流水的银子哗啦啦地进账，这哪里用得着吃苦头呀！\n原本麻木沉郁的男主更是将叶昭昭视若珍宝，全家人的日子也越过越好。", "tags": ["种田", "古代言情", "美食", "穿书", "双洁", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "旺家小福女", "fullTitle": "旺家小福女", "link": "https://fanqienovel.com/page/7617458520832609305", "data": [23.95, 23.5, 24.66, 25.38, 25.73, 26.55, 30.01], "trend": 6.07, "latest": 30.0, "wordNumber": 966160, "creationStatus": 1, "desc": "穿越？重生？都没有。林小满只是一个古代农家普通小丫头。\n\n被后娘推进冰窟窿那天，她以为自己死定了。是隔壁的张婶子把她捞起来，带回了家。“从今往后，你就是我李家的闺女！”\n\n李家穷的住破屋烂瓦，吃野菜糊糊粥，没想到自打她来了，李家就跟开了光似的——栗子捡不完、赏银从天降、老宅挖出存钱罐、烧炭赶上官府收购……日子越过越红火，三个哥哥也进了学堂。\n\n李家人都说她是福星，可林小满知道：哪有什么福星，不过是老天爷可怜她，给了她一双能看见明天的眼睛。", "tags": ["种田", "古代言情", "乡村", "幻想言情", "发家致富", "古色古香"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "流放？疯批恶女搬空国库去逃荒", "fullTitle": "流放？疯批恶女搬空国库去逃荒", "link": "https://fanqienovel.com/page/7517657006560267288", "data": [12.93, 14.88, 17.97, 19.27, 19.01, 17.99, 18.25], "trend": 5.32, "latest": 18.2, "wordNumber": 1807663, "creationStatus": 1, "desc": "【系统空间+天灾+神医+爽文+虐渣+发家致富】\n顶级特工纪云舒，一睁眼，成了书中的炮灰女配，刚醒来竟在强扑短命王爷！\n正准备入洞房！\n怎料皇帝老儿趁机下旨，把王府全家抄家流放！\n她喜提系统，把王府收了个精光，还顺手掏空了缺德娘家！搬空国库，挖空皇帝老儿祖坟！\n意外解锁系统隐藏功能\n叮！碰一下可解锁大商场一座！\n叮！亲一下可解锁灵泉空间！\n叮！睡一下可.......\n纪云舒：睡一下可解锁啥？你倒是说清楚啊！\n别人流放吃树皮，成饿死鬼，她流放一路吃香喝辣，空间在手，富得流油！\n路遇贪官？杀！搬空小金库！\n遇到强盗？！掏出机关枪，横扫土匪窝，占山为王！\n路遇天灾人祸？空间灵泉解百毒，成人美心善的绝世神医！\n狗皇帝坐不住了，派兵追杀？\n不好意思！她解锁整个空间武器库，开着飞机大炮轰了皇宫，再扫荡国库！\n整个西北流放地都成了她的领地！\n开奶茶店，烤肉店，建医院，修学堂，建商场，还附带穿越服务！\n皇帝老儿悔不当初，趴在城墙下两眼泪汪汪\n“王妃啊，我错了，你给我个西瓜吃吧，让我尝尝奶茶的味道吧。”", "tags": ["种田", "古代言情", "空间", "医术", "逃荒"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [14.7, 15.38, 15.67, 16.08, 16.86, 17.66, 19.24], "trend": 4.54, "latest": 19.2, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "冤种世子要我命？几巴掌就服了", "fullTitle": "冤种世子要我命？几巴掌就服了", "link": "https://fanqienovel.com/page/7619647324658093080", "data": [17.66, 19.07, 20.47, 21.48, 22.1, 22.32, 21.77], "trend": 4.11, "latest": 21.8, "wordNumber": 596184, "creationStatus": 1, "desc": "#穿书##重生##双向误会##日常拌嘴##她真打他也是真的服##口嫌体正直##冤种世子在线挨打#\n#1v1##细水长流##成年人的恋爱##he#双洁#\n容忬穿书了，穿成一个穷得叮当响的猎户女。\n家里断粮三日，弟弟饿得啃桌子腿。\n好消息：捡到个四肢全断的漂亮男人，身上有银子。\n坏消息：原主把这个男人卖了换钱，换了三十两，害的人家胳膊被剁，复仇不得，怀恨而亡。\n更坏的消息：他重生了。\n但容忬不知道他重生了。想着怎么着也不能他复仇，准备刀了他。可看在那十两的份上，还是妥协了。\n扛回家，治，一套服务明码标价：你给钱，我救人，公平交易，童叟无欺。\n翟青祤望着这个上辈子将她卖掉的女人，发誓这一辈子都不会信她一个字。\n但这个女人不按剧本来。\n不温柔，不体贴，不假装关心，换药手重，喂饭靠怼，没耐心了就一巴掌。谈感情伤钱，谈钱又伤他。\n\"……你能不能轻点？\"\n\"轻点加多少钱？\"\n\"我不饿。\"\n\"你打算饿死好赊账？\"\n榜文出来了，悬赏二十五两。\n容忬看着这与记忆里不同的价格，又看了翟青祤一眼：\"你怎么还掉价了？\"\n翟青祤：\"……\"\n他恨她贪财，又恨自己动不了只能忍着，到后来，又发现忍习惯了……", "tags": ["种田", "古代言情", "乡村", "穿书", "HE", "双洁"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [19.33, 19.95, 20.74, 21.23, 21.73, 22.14, 22.36], "trend": 3.03, "latest": 22.4, "wordNumber": 899492, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "傻子成精了，她会说话了", "fullTitle": "傻子成精了，她会说话了", "link": "https://fanqienovel.com/page/7262794154923527226", "data": [17.56, 18.55, 19.51, 20.16, 20.76, 21.2, 20.12], "trend": 2.56, "latest": 20.1, "wordNumber": 4646588, "creationStatus": 1, "desc": "她是个傻子，她娘为了打发她，花了五两银子倒贴程风的嫂子，程风怎么甘心娶一个傻子呢，他有喜欢的人，并且两个人已经好了许多年。\n在这样的寒冬腊月，吃不饱穿不暖的冬天，傻子成功留在了程风的家里。", "tags": ["种田", "古代言情", "乡村", "穿越", "魂穿"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越农女断亲，有空间天天吃肉！", "fullTitle": "穿越农女断亲，有空间天天吃肉！", "link": "https://fanqienovel.com/page/7615591201386810393", "data": [16.87, 16.44, 16.25, 16.24, 17.22, 18.75, 19.12], "trend": 2.25, "latest": 19.1, "wordNumber": 972419, "creationStatus": 1, "desc": "动漫已上线！\n（有声已出）评分刚出，会涨的，放心入哈～\n【架空+空间+女强+家长里短+处理极品+日常+CP……】\n雇佣兵苏晚云，做最后一个任务被一枪爆头了。\n再醒来变成北国的农家女，要被奶奶和二叔拖去卖掉。\n她掌掴二叔，脚踢奶奶，带着被压榨得说话都不敢大声的爹决然断亲自立门户。\n上辈子的千万存款自动兑换成了灵泉空间，还有千亩良田。\n极品敢来闹事，打得他们鼻青脸肿。\n生死看淡，不服就干。\n住着破草棚，食不果腹，身无分文，那就上山打猎、挖草药，赚了银子就能盖房，天天大鱼大肉。\n有人抓着她的把柄来逼婚，直接干死他！\n她的愿望：赚到花不完的银子，直接躺平。\n某天，男人带着所有家当来敲门：“苏晚云，开门，我来入赘了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "女强"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "古代农家夫妻的红火小日子", "fullTitle": "古代农家夫妻的红火小日子", "link": "https://fanqienovel.com/page/7574739331256945726", "data": [13.86, 13.7, 13.75, 13.98, 14.2, 14.38, 15.34], "trend": 1.48, "latest": 15.3, "wordNumber": 4602727, "creationStatus": 1, "desc": "（又名：清水故事）\n【古代种田/架空地图（南北乱炖）/群像（每个人都是自己人生的主角）/无空间/无金手指/乡村生活/细水长流】\n\n\n真人有声书已上线~欢迎收听~\n\n一本闲来无事，消磨光阴的好书~\n\n作者拥有五百万字长文经验，量大管饱~可放心追更观看~\n\n这是一户农家最真实的日子，是清水村林家一生的故事。\n\n这里有田间的汗水，也有市集的吆喝，\n\n有屋檐下的温馨，也有暗流涌动的危机，\n\n有病榻前的守候，也有绝境中的奋起，\n\n有朴实无华的相守，也有悄然滋生的情愫，\n\n酸甜苦辣，有哭有笑，列位看官，且听我慢慢道来...\n\n", "tags": ["种田", "古代言情", "乡村", "团宠", "互宠", "古色古香"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "想兼祧两房？搬空家产带儿女和离", "fullTitle": "想兼祧两房？搬空家产带儿女和离", "link": "https://fanqienovel.com/page/7545324289256328216", "data": [28.71, 28.41, 27.74, 27.41, 27.19, 27.88, 30.12], "trend": 1.41, "latest": 30.1, "wordNumber": 1152924, "creationStatus": 0, "desc": "【有空间，不是双洁，女主懂医术。】\n末世摸爬滚打多年的乔念，带着空间穿越到古代，一个穷秀才的妻子。\n刚睁眼，龙凤胎儿女面临被卖，乔念凭借自己的武力夺回孩子。\n成亲五年的秀才相公不回家？\n她带着孩子找过去。\n结果却发现，丈夫和寡嫂在城里，小日子过得风生水起，连儿子都生了俩。\n乔念一去，大杀四方，胖揍狗男女，搬空婆家所有财物。\n和离后，带着娘家人赚得盆满钵满。\n乔念变得越来越漂亮，肤白貌美又多金，渣前夫肠子都悔青了。\n他厚着脸皮上门求和，被乔念一脚踢出门。\n渣男有多远给我滚多远……", "tags": ["种田", "古代言情", "穿越", "空间", "医术", "发家致富"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "天崩开局，绝户偏要儿女双全", "fullTitle": "天崩开局，绝户偏要儿女双全", "link": "https://fanqienovel.com/page/7579151080366296089", "data": [16.25, 16.5, 17.64, 18.24, 18.36, 18.29, 1 \n身边人都默认他们是男女朋友，将来会结婚。\n只有祝令榆知道，对她万般包容的他心里一直藏着个人。\n她想，他总会忘掉那个人的，她可以等他的心空出来。\n**\n一天，有个和她差不多大的骄恣少年出现在她面前，喊她一声“妈”，说是她未来的儿子。\n她未来的老公竟然不是孟恪，而是他的好兄弟周成焕。\n怎么可能呢，她和那人话都没讲过几句。\n陪孟恪参加聚会，她坐在孟恪身边，忍不住暗中观察起未来孩子他爸。\n男人端着酒杯坐在那里，仿佛置身这场喧闹浮华外，拽得没边，也很不好相处。\n似察觉到她的目光，他抬眼看来。她快速收回视线。\n**\n后来，祝令榆终于决定放下孟恪。\n婚约解除，孟恪失魂落魄地找来，却不知道她的住处还有别人。\n一门之隔，交融的呼吸带着热度。\n周成焕在昏暗中看着她，“还想跟他在一起？”", "tags": ["青春甜宠", "现代言情", "总裁", "追妻火葬场", "男二上位"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "溯雨信笺", "fullTitle": "溯雨信笺", "link": "https://fanqienovel.com/page/7582240771588230206", "data": [62.61, 64.12, 65.26, 66.07, 66.84, 67.51, 68.56], "trend": 5.96, "latest": 68.6, "wordNumber": 373464, "creationStatus": 0, "desc": "【已签实体出版未上市】\n【小镇文学丨酸涩慢热丨双向救赎丨1V1丨HE】\n【温柔坚韧x颓废厌世】\n蒲雨十七岁那年，转学到偏远的南方小镇。\n在这里，她遇见了原溯。\n那个曾经是整个镇上最耀眼的天之骄子。\n如今跌落云端，人人都避之不及。\n除了蒲雨。\n-\n旧街，修理铺。\n她与他隔着一地狼藉对视。\n“别总来。”\n“为什么？”\n“……脏。”\n蒲雨没答话。\n第二天，她依旧在那个时间，出现在修理铺门口。\n-\n小巷，尽头深处。\n蒲雨拿着碘伏的手微微发抖，眼泪无声滑落。\n“原溯，”她声音带着哭腔，“我们一起考出去，好不好？”\n少女逆着光，校服被风吹得鼓起，像要挣脱这片荒芜小镇的蝶。\n他猛地别开脸，胸口处剧烈起伏了一下。\n那双总是晦暗的眼睛里，像是有什么东西烧了起来。\n-\n后来，蝉鸣散去。\n他和那间修理铺一同消失于小镇的夏天。　\n直到北方冬夜，大雪覆盖了街巷。\n她终于明白，那二十一封信藏起的秘密。", "tags": ["青春甜宠", "现代言情", "校园", "1v1", "相互救赎"], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "疯批太子爷夜夜闻我体香入睡", "fullTitle": "疯批太子爷夜夜闻我体香入睡", "link": "https://fanqienovel.com/page/7561406804232522814", "data": [35.49, 37.24, 39.17, 40.92, 42.67, 43.37, 39.52], "trend": 4.02, "latest": 39.5, "wordNumber": 308760, "creationStatus": 0, "desc": "新书刚开分，还会涨的！【阴湿疯批+甜撩+救赎+穿越+大学校园+双洁1v1】 \n天生坏种X坚韧乐观小太阳 \n品学兼优的大一新生江幼希，某天兼职时，意外捡到一个少年。 \n少年自称是她未来的儿子，对她大喊“妈”，抱着江大风云人物贺酌直喊“爸”。\n等等！ \n孩子他爸是贺酌？\n那个传闻杀过人、手段狠戾变态的疯批太子爷？！ \n儿子：“妈，那都是谣言，爸其实是一个温柔善良的好人！”\n江幼希半信半疑，当晚就亲眼看到贺酌开车撞人。\n他满眼杀气，以飙车的速度把一名男子撞得满身是血，奄奄一息。\n江幼希吓得转身想跑，却被他扣住后脖颈。\n“抱歉，吓到你了，”他沾染血迹的指尖落在她眉心，笑容恶劣—\n“小、学、妹。”\n—\n虽然孩子他爹是变态，但为了避免丧偶式教育，江幼希决定带着儿子去认爹。\n江幼希把儿子拉出来：“贺酌学长，他、他是你儿子。”\n贺酌睨她：“他妈是谁？”\n“我。”\n“行，那今晚陪我睡。”\n“？？我为什么要陪你睡？”\n“不睡，他怎么来？”\n“……”\n— \n贺酌因童年遭受打击，导致患上了睡眠障碍症。唯有江幼希身上的气息，能让他心安，成功入眠。 \n男人指腹轻碾她的小梨涡：“再陪我睡一晚，好不好？” \n“怎么睡？”\n男人紧扣她纤腰，俯身亲吻— \n“换个姿势。”", "tags": ["青春甜宠", "现代言情", "校园", "穿越", "双洁", "1v1"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "夏夜有染", "fullTitle": "夏夜有染", "link": "https://fanqienovel.com/page/7429537438936075289", "data": [18.46, 19.25, 19.62, 19.94, 20.31, 20.72, 20.43], "trend": 1.97, "latest": 20.4, "wordNumber": 405960, "creationStatus": 0, "desc": "（已签实体）\n【校园重生+追妻火葬场+拽哥上位+借住文学】\n【有点叛逆乖乖女x懒淡拽哥】\n奶奶离世，谈、陆两家见没了亲人的许恩棠可怜，都想把她接去照顾。\n来到北城，许恩棠再次见到那个让她一眼难忘的少年。\n陆襟痞气肆意，之后一起成长的那些年，她看他身边的女人换了一个又一个。\n没想到有一天，他会问她想不想嫁给他。\n她以为是自己多年暗恋终于得到回应。\n直到婚后，她听到他对朋友说：“家里让娶，我还能怎么办？”\n她心灰意冷，决定离婚。\n**\n离婚前夜，她重生回到高二被接回北城这天，依旧是两家都住。\n后来，她夜不归宿，他发疯似的找她。\n“你真的谈恋爱了？跟谁？”\n电话彼端的许恩棠红着脸被谈霁礼圈在怀里。\n谈霁礼开口，声音传进电话里，“告诉他，是不是在和我谈恋爱？”\n**\n以前的许恩棠心思都在陆襟身上，和谈霁礼不熟，没想到会与疏离懒淡的他在这个夏夜有染。", "tags": ["青春甜宠", "现代言情", "校园", "重生", "暗恋", "追妻火葬场", "男二上位"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "春日烈阳", "fullTitle": "春日烈阳", "link": "https://fanqienovel.com/page/7163459032223583270", "data": [22.62, 24.16, 25.46, 26.46, 27.37, 28.1, 24.25], "trend": 1.64, "latest": 24.3, "wordNumber": 351264, "creationStatus": 0, "desc": "[体弱少女 X 烈日少年]\n（正文已完结）\n（原书名：春日烈阳）\n（青梅竹马+校园甜宠+日常）\n（人物设定均已成年）\n许渔刚来青禾中学的时候，有一个梦想，那就是在冬日纷飞的时候亲手接住一片雪花。\n她想，人生都这么苦了，总要来看一次大雪纷飞的样子。\n于是许渔努力的一边上学，一边治病。\n在来京市之前，自家亲爹说，在学校会有小时候的邻居哥哥帮忙照顾她。\n但是在许渔记忆里的邻居哥哥：喜欢揪她衣领子，还和别人打架。\n“邻家哥哥”顾盛：......\n第一次见到许渔的时候，顾盛站在校门口“亲切”为她指路。\n第二次见到许渔，顾盛提着保温杯里面装的是热牛奶。\n第三次，第四次......\n顾盛在许渔面前向来习惯了伪装，只有那一次。\n他在昏暗的路灯下表情狠厉的撺着一个人的衣领：“别让我看见你打扰她第二次，滚。”\n他终于有些抑制不住的爆发，脸上掉落的面具后才会原原本本的顾盛。\n那天的许渔忽然觉得，顾盛就像太阳。\n她想，如果在冬天摸不到雪花，那就拜托顾盛带着她去春天感受阳光也不错。\n世界对她来说无聊单调，但是顾盛能够带来温暖。\n立意：我们可遇不可求。", "tags": ["青春甜宠", "现代言情", "校园", "甜宠", "青梅竹马"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWi m/page/7546227706472451096", "data": [63.39, 64.38, 65.29, 66.17, 67.3, 68.94, 64.66], "trend": 1.26, "latest": 64.7, "wordNumber": 1128339, "creationStatus": 0, "desc": "【双重生+校园+阴湿绿茶男主+救赎】\n林雾死后才知，她是校园文里的恶毒女配。\n豪门出身，拥有着漂亮的脸蛋，依旧是男女主甜蜜故事里的垫脚石。\n即使她与谢厌淮青梅竹马，婚约加身。\n谢厌淮的眼里，永远只有清纯贫穷的夏若若。\n可惜她执念太深，跟女主做对，连累了全家人。\n-\n侥幸重生，林雾这次不打算跟夏若若抢男人。\n摆烂的爸，暴躁的妈，恋爱脑的弟。\n岌岌可危的家更需要她操心。\n当然，时不时膈应一下男女主也是她这个恶毒女配的责任。\n-\n夏若若家是重组家庭，有个异父异母的哥哥。\n同样贫穷，成绩优异，被破格录取。\n徐京妄性格淡漠，寡冷貌美，独来独往。\n这样的人与天之骄女林雾格格不入。\n就连林雾自己都瞧不上这人…\n重活一世，林雾看着少年打包时的修长手指。\n荒诞地回想起，上一世她被下药，徐京妄用这只手擦掉了她眼角的泪。\n………\n“哎。”\n少女不自在地问，“徐京妄，你就这么缺钱？”\n徐京妄习惯了她的羞辱：“是。”\n林雾鬼使神差地发出邀请：“我缺个家教，工资很高，你要试试么？”\n徐京妄本以为，这又是林大小姐心血来潮的逗弄。\n不满夏若若，连她身边的人都视作洪水猛兽。\n没成想，天上的月亮竟然真的属于他", "tags": ["青春甜宠", "现代言情", "校园", "豪门世家", "双重生", "相互救赎"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "坏兄妹", "fullTitle": "坏兄妹", "link": "https://fanqienovel.com/page/7568341885492661310", "data": [17.87, 18.34, 18.8, 18.82, 18.79, 18.93, 19.1], "trend": 1.23, "latest": 19.1, "wordNumber": 442519, "creationStatus": 0, "desc": "【已签实体】\n【混蛋哥哥vs乖妹妹】\n\n认识郁驰洲的前几年，陈尔不想要一个哥哥。\n认识郁驰洲的后几年，陈尔不愿郁驰洲当她哥。\n***\n台风天，陈尔跟着妈妈来到郁家。\n她躲在大人身后，浑身湿透，可怜如白花。\n大人三番五次催促下。\n她小声叫坐在沙发上的男生“哥哥”。\n男生冷嗤一声。\n彼时他还不知道，这朵看起来一掐就断的小白花将来会循序渐进，步步为营，终于某天一脚踩上他胸口——\n领带被拽得死紧，呼吸几乎阻遏。\n他弯唇：“就这么对哥哥啊？”\n\n\n【无血缘关系/不在同一户口】\n【未成年前无亲密关系】", "tags": ["青春甜宠", "现代言情"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古言脑洞": [{"label": "枝上蘅", "fullTitle": "枝上蘅", "link": "https://fanqienovel.com/page/7655245523447729177", "data": [40.14, 43.58, 46.96, 50.1, 53.01, 55.9, 60.63], "trend": 20.49, "latest": 60.6, "wordNumber": 381173, "creationStatus": 0, "desc": "【钓系公主 × 清冷国师】\n【双向试探 · 极限拉扯 ·双洁· HE·他的私心从来只对她一人】\n穿成病弱公主，沈蘅慌得一批。\n系统告诉她，想活命，就去攻略书里最危险的那个男人——北疆国师珣濯。\n此人多智近妖，断情绝欲，杀人如麻，最后死得不明不白，是个标准的短命美强惨。\n沈蘅笑了：两个炮灰凑一对，谁也别嫌弃谁。\n宫宴之上，她破罐子破摔，当众请嫁。\n他纹丝不动，似在看一个无理取闹的孩子。\n沈蘅不以为意，她用尽心机靠近，他却步步为营后退。\n沈蘅咬牙切齿:这男人太难搞了！\n北疆小王子默默举手:嗯……难道你没有发现我们国师大人一直在纵容你吗?\n沈蘅:???\n她扭头看了一眼端坐席间、面无表情的俊俏男人。\n沈蘅（曹操脸）:不可能，绝对不可能。\n……\n【本书立意:残命相抵，风雪同路。\n两个被命运判了死刑的人，各自守着一盘残命，却偏偏在风雪里并肩而立，劈出了一线生天。活着不是因为有希望才去争，是因为争了，才有希望。】", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "HE", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "攻略苗疆少主", "fullTitle": "攻略苗疆少主", "link": "https://fanqienovel.com/page/7515457905320004632", "data": [37.44, 39.18, 40.91, 42.41, 43.85, 45.21, 48.85], "trend": 11.41, "latest": 48.8, "wordNumber": 507414, "creationStatus": 0, "desc": "楚禾穿书了。\n【那个反派会杀了男主，弄残女主，最后再厌世自杀，这个世界即将崩溃，而你的任务是拯救这个世界。】\n破系统丢了任务就失踪，楚禾还没有来得及思考怎么做，不幸的被绑到了苗疆，成了药人们炼蛊的绝佳母蛊。\n药人不是人，不记前尘。\n母蛊珍贵，只有厮杀到最后的那个胜者才有资格霸占。\n片刻过后，血肉遍地。\n血衣白发的少年一步步而来，身后满是窥伺的蛊毒之虫。\n楚禾咬牙说瞎话:“你不能杀我，我已经有你的孩子了！”\n少年停下脚步，歪了歪头。\n大半年后，系统重新上线，继续科普。\n【听好了，那个反派之所以又疯又变态，是因为他从小到大就是被蛊毒喂养长大的药人，他没有正常人的情感，而且他——】\n“性格偏激执拗，不达目的不会罢休。”\n系统一顿:【你怎么知道的？】\n楚禾有气无力的躺在床上，生无可恋的说道:“这一切还得从我嘴快的那一天说起……”\n房门打开，送来光亮。\n少年随着银饰叮当声缓缓而来，俯下身，赤瞳锁着她的容颜，轻声低语，“阿禾，今天又到了我们努力让小宝出现的时候了。”\n系统:【小宝是谁？】\n楚禾抱着被子缩在墙角，听着锁链作响，欲哭无泪。\n——自然是欠了他的那个孩子！", "tags": ["古言脑洞", "古代言情", "系统", "穿越", "反派", "穿书"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "公府真千金，宠得首辅肆无忌惮", "fullTitle": "公府真千金，宠得首辅肆无忌惮", "link": "https://fanqienovel.com/page/7626562728341015577", "data": [15.98, 16.05, 16.47, 16.49, 16.98, 17.58, 18.54], "trend": 2.55, "latest": 18.5, "wordNumber": 915453, "creationStatus": 1, "desc": "【真假千金+爽文+异能+小空间+女宠男+女主最强永不吃亏】\n【武力充沛美少女&体弱多病小娇夫】\n末世女王谢珊珊贪财又好色，穿成生下来就被生母掉包的宁国公府真千金。\n本想浪荡江湖，结果为了锦衣华服不得不进京认亲，绝不是为了和少年郎同路北上。\n调戏美貌解元公，掏空亲爹小金库。\n同时讲究以德服人，一言不合就开打。\n取代她以镇国公府大姑娘身份生活的假千金重生后想杀自己灭口？还想抱紧未来皇后的大腿？\n果断拯救难产太子妃，让未来皇后做不成太子妃。\n给皇帝增寿，继续独享圣宠。\n人人都以为谢珊珊会嫁入门当户对的公侯之家，她却嫁给心甘情愿吃软饭的病弱美少年裴矩。\n人人又说裴矩命不久矣，谢珊珊注定做寡妇。\n结果裴矩的身体一日好过一日，六元及第，起步就是六品翰林。\n人人嘲讽裴矩吃软饭，他却说：“我知道你们这些想吃软饭却吃不着的人在嫉妒我。”\n他一步一个脚印，才过而立之年便稳稳坐上内阁首辅的宝座，对喂他软饭吃的谢珊珊死心塌地，从不二色，婚后更是把谢珊珊宠上了天（不是）。", "tags": ["古言脑洞", "古代言情", "空间", "女强", "科举", "真假千金" \n我代替了同村少女成为了他的妻。\n结婚后，父亲诡异失踪，留下一本《世间百鬼录》，从此我携百鬼录踏入了奇幻诡谲的世界。\n千年尸王是我的保镖，万年灵物成为我的法器，渡灵扇在手了却世间万千执念，灵愈之力治愈三界山精鬼怪，我成为世间独一无二的渡灵师。\n而我的那个神秘老公，他说娶我非他所愿，等到约定期限一到，他便给我自由并赐予我长命百岁。\n我欣然接受，离婚而已，可以再嫁。\n可是……\n我都三嫁了，新郎怎么还是他？", "tags": ["女频悬疑", "悬疑", "灵异", "悬疑恋爱", "风水秘术"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "当个社畜，怎么成凶案嫌疑人了？", "fullTitle": "当个社畜，怎么成凶案嫌疑人了？", "link": "https://fanqienovel.com/page/7620318256322071576", "data": [17.13, 16.94, 16.81, 16.83, 16.95, 17.02, 17.32], "trend": 0.18, "latest": 17.3, "wordNumber": 618814, "creationStatus": 1, "desc": "刚开分，后面会涨！请放心食用\n逻辑天才实习生×高冷禁欲护短刑警队长1v1，双洁双强，架空，含私设。\n姜绵只是下楼拿个雷霆外卖，就撞上小区垃圾桶发现人民碎片。\n她挤进人群吃瓜，下一秒直接被目击证人指认成凶手。\n姜绵：满脸???，别这么离谱行不？她只是吃个瓜！怎么成凶手了？\n刑警队队长宋延，高冷禁欲，不近人情，一开口就把她按在嫌疑人位置上磋磨。\n“说一下作案过程。”\n语气冷漠，还把她逗了一通。姜绵气到肺快炸了，幸好天降神探系统，当场洗清嫌疑。\n但她万万没料到自己倒霉到竟被学校分配到临江市刑警支队实习。\n上司，还是宋延!!\n直到某天，姜绵发现，这位高冷禁欲的队长，一跟她对视就耳尖发红。\n她笑眯眯凑近：“宋队，你中暑了?”\n宋延绷着脸：“没有。”\n姜绵挑眉：“那就是……对我心动了。” \n再后来她更惊了。\n这人在床上既不高冷，也不禁欲。\n分明是个装正经的大涩迷！！！\n清水河里，钓友钓起一具高度腐败……\n空置出租屋，夜半墙缝渗出暗红水渍。\n诡异村庄，看似村风纯朴，实则暗藏恐怖陋习。\n腐生菌丛、假面新郎、骨影灯笼……\n一桩桩离奇凶案，撕开人性最黑暗的褶皱。\n而她和他，在刀尖上追凶，也在心动里沦陷。", "tags": ["女频悬疑", "悬疑", "推理", "天才", "破案", "悬疑恋爱"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "古风世情": [{"label": "死遁后，成了盲眼王爷的白月光", "fullTitle": "死遁后，成了盲眼王爷的白月光", "link": "https://fanqienovel.com/page/7640771121582722110", "data": [6.52, 6.93, 7.64, 8.33, 9.76, 11.96, 17.25], "trend": 10.73, "latest": 17.2, "wordNumber": 313965, "creationStatus": 0, "desc": "（细水长流/日久生情/双向救赎/少年爱恋/he）\n　　逃荒北上，苏缨饿得奄奄一息，险些死在漫天风雪里。\n　　是尚书府的盲眼小公子裴修救了她，将她带入府中。\n　　两年后，皇权更迭，裴家一朝倾覆。\n　　抄家那夜，苏缨趁乱将小瞎子救走。\n　　·\n　　那年，苏缨十六岁，带着一个十五岁的盲眼少年东躲西藏讨生活。\n　　一路颠沛流离，苏缨觉得自己还够了恩情。\n　　恰逢意外，裴家兄长找上门，裴修的眼疾也好了。\n　　苏缨趁着一场大雨，跳进水里，成功死遁。\n　　·\n　　五年后，豫州。\n　　苏缨改名换姓，开了一家小药铺，生活平淡如水。\n　　那日，暮春细雨潇潇入夜。\n　　有人踏雨而来。\n　　昔日温雅斯文的小瞎子，成了威震天下的定安王。\n　　裴修心脉受损，少年白头，湿漉漉地站在门口——像是从未走出五年前的那场大雨。\n　　“再救我一次……好么？”", "tags": ["古风世情", "古代言情", "HE", " 90, "creationStatus": 1, "desc": "系统➕无cp➕种田➕打猎➕囤粮➕逃荒➕评分刚出\n京之春穿了！\n好消息，成了京城尊贵大小姐。\n坏消息，罪臣之女，被流放西北。\n除了挺个大肚子之外，还有个四岁的女儿。\n京之春白眼一翻，差点灵魂出窍。\n幸好，她是个医生，稳了稳心跳决定自己接生。\n历经一场千辛万苦，娃终于落地。\n只是没想到，孩子爹登场竟拒不认娃，还大骂京之春送他一片青青草原。\n京之春：“哈哈哈哈，我能给你戴绿帽子，只能说明你这男人是个渣渣！！”\n结果剧情反转，这男人自己也揣着个外室，外头还藏了个私生子。\n京之春腰杆瞬间直了：“原来你我半斤八两，谁也别嫌谁帽子绿！和离！”\n谁知狗男人不肯和离，京之春大手一挥直接休夫。\n直到某天，天下大乱，战乱天灾不断，京之春立马带着俩孩子开启逃荒模式。", "tags": ["种田", "古代言情", "系统", "医术", "无CP", "逃荒"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "农家团宠娇娇女", "fullTitle": "农家团宠娇娇女", "link": "https://fanqienovel.com/page/6849391701497220109", "data": [16.42, 17.26, 18.9], "trend": 2.48, "latest": 18.9, "wordNumber": 1459545, "creationStatus": 0, "desc": "糖宝没了爹娘，亲戚都不愿意养，说她克人。\n拥有七个孙子的杨老太为凑齐八（谐音“发”），把糖宝领回了家。\n人人都说杨家养糖宝这下要倒霉了，可杨家不仅没倒霉，还成了大周新贵！\n就是杨家人脾气不好，一有人说糖宝克人，杨老二就瞪眼：哪个不要命的说我闺女克人？\n杨老太最牛逼，抽出一根绳子跑到人家：说你自个克人，不说我就吊死在你家。\n杨家七个孙子围着糖宝：妹妹吃糖。\n糖宝：耶？我是来凑数的呀，怎么凑成了人人疼爱的小宝贝？", "tags": ["种田", "古代言情", "团宠", "古灵精怪", "甜宠", "发家致富"], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成疯娘：别怕，好日子在后头", "fullTitle": "穿成疯娘：别怕，好日子在后头", "link": "https://fanqienovel.com/page/7313444102157126718", "data": [16.86, 17.66, 19.24], "trend": 2.38, "latest": 19.2, "wordNumber": 1037352, "creationStatus": 0, "desc": "武力值满满女主+勤劳致富\n周琼不过是下水救人，哪个知道这一落水她便从一个现代好青年变成了古代见人就咬的疯妇一名，\n好在只有疯娘没有疯爹，看着两个孤苦懂事却备受生活折磨的孩子，她心中隐痛，不就是当娘，她定要让孩子们吃饱穿暖，成为村里人人羡慕的对象。\n只是这头刚建设好小家，村子也因为她日渐温饱，却因为疯妇身世的原因突发意外一朝回到了解放前。\n老天啊，这是在考验她的能耐吗，不就是重来，到哪里她都是那个能把日子过得蒸蒸日上的人！", "tags": ["种田", "古代言情", "乡村", "萌宝", "穿越"], "borderColor": "#f1c40f", "backgroundColor": "#f1c40f22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "逃荒，我全家都是重生的", "fullTitle": "逃荒，我全家都是重生的", "link": "https://fanqienovel.com/page/7335796433146088510", "data": [12.35, 12.77, 14.42], "trend": 2.07, "latest": 14.4, "wordNumber": 1008891, "creationStatus": 0, "desc": "【预知梦+全家重生+无cp】前世苏音、苏母、小姑三人惨死在暴民屠刀下。转眼间，三人一同重生，在暴民冲入村庄前，带上杏花村（舅舅所在村子）提前逃离。\n逃荒路上，遇到被苏家人抛弃的愚孝爹，本以为他是拖后腿的存在，没想到他未卜先知，手段变得狠辣。\n在京城中遇到傻白甜双胞胎弟弟，结果一个变得阴险狡诈，一个变的冷血无情。\n“说吧，你们前世身份。”\n愚孝爹:“额，傀儡……皇帝。”\n二弟别过脸，“九千岁！”\n三弟冷着脸，“暗阁阁主。”\n好家伙！苏音直呼好家伙！这都是牛逼的主！\n听着他们说的前世，怎么觉得有点不对劲……\n三人的记忆似乎都……不一样。\n体验过腥风血雨的一家子，这辈子只想安安稳稳过地主小日子。\n可偏偏有人不愿意，用刀逼着他们下场。\n既然都不想过安稳日子，那就都别玩了。\n“爹！反了吧！”苏音。\n愚孝爹磨着屠刀，嘴上却说道:“闺女，这不好吧。”\n结果，转身就掀桌。\n阴险狡诈的二弟，“姐，搞得那么血腥不妥吧！”\n结果，转身就覆灭十万大军……\n冷血无情的三弟，“姐，娘说我们做事得温柔点！”\n结果，转身就一刀斩杀叛军首领！\n苏音:“…", "tags": ["种田", "古代言情", "重生", "前世今生", "逃荒"], "borderColor": "#16a085", "backgroundColor": "#16a08522", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越农女断亲，有空间天天吃肉！", "fullTitle": "穿越农女断亲，有空间天天吃肉！", "link": "https://fanqienovel.com/page/7615591201386810393", "data": [17.22, 18.75, 19.12], "trend": 1.9, "latest": 19.1, "wordNumber": 972419, "creationStatus": 1, "desc": "动漫已上线！\n（有声已出）评分刚出，会涨的，放心入哈～\n【架空+空间+女强+家长里短+处理极品+日常+CP……】\n雇佣兵苏晚云，做最后一个任务被一枪爆头了。\n再醒来变成北国的农家女，要被奶奶和二叔拖去卖掉。\n她掌掴二叔，脚踢奶奶，带着被压榨得说话都不敢大声的爹决然断亲自立门户。\n上辈子的千万存款自动兑换成了灵泉空间，还有千亩良田。\n极品敢来闹事，打得他们鼻青脸肿。\n生死看淡，不服就干。\n住着破草棚，食不果腹，身无分文，那就上山打猎、挖草药，赚了银子就能盖房，天天大鱼大肉。\n有人抓着她的把柄来逼婚，直接干死他！\n她的愿望：赚到花不完的银子，直接躺平。\n某天，男人带着所有家当来敲门：“苏晚云，开门，我来入赘了。”", "tags": ["种田", "古代言情", "乡村", "穿越", "空间", "女强"], "borderColor": "#2ecc71", "backgroundColor": "#2ecc7122", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "全家提前两年囤货，逃荒吃香喝辣", "fullTitle": "全家提前两年囤货，逃荒吃香喝辣", "link": "https://fanqienovel.com/page/7546430467558345752", "data": [12.92, 13.23, 14.8], "trend": 1.88, "latest": 14.8, "wordNumber": 1438578, "creationStatus": 1, "desc": "【空间+赶山找山货+草药野果野菜真实配图+家长里短+逃荒+群像+囤货+虐渣+无CP]\t\n（又名：全家提前两年囤货，逃荒吃香喝辣）\n李杏儿做了一个奇怪的预知梦，她梦见自己十八代祖宗正在被屠杀。\n她必须穿越过去拯救自己的老祖宗。\n不然后世的她会因为蝴蝶反应消失，没想到老祖宗的魂在地府把人都求遍了，上天才给她十天同时又获得灵泉空间和千万存款。\n她迅速开启买买买囤货模式。\n十天过去，她买好物资穿定时越到古代池州杏花村。\n没想到穿早了，距离可怕的荒年还有两年。\n李杏儿发誓带着一空间物资要在古代过上好日。\n...\n谁都没想到。\n李杏儿穿越后变成大力女，一身武力值超高。\n她拳打野猪，脚踢恶霸，别人不敢去的禁山是她的粮仓，山珍野味随便捡。\n穿越后的春耕她利用现代化种子种出千斤粮食，搞出惊人的大丰收，带全家疯狂囤货。\n两年后。\n地震，火山爆发，蝗灾，瘟疫如期而至。杏花村全村人却没个怕的。\n因为地窖堆满粮食，杏儿带着村民们逃荒路上底气嘎嘎强!", "tags": ["种田", "古代言情", "空间", "逃荒", "群像", "无CP", "虐渣", "囤物资"], "borderColor": "#95a5a6", "backgroundColor": "#95a5a622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "分家咋了？天天吃肉赚钱盖大房！", "fullTitle": "分家咋了？天天吃肉赚钱盖大房！", "link": "https://fanqienovel.com/page/7476390307068660760", "data": [26.57, 27.35, 28.01], "trend": 1.44, "latest": 28.0, "wordNumber": 1000307, "creationStatus": 0, "desc": "（穿越+种田+空间+一点点发家致富+无CP）\n林棉穿越了，成了无父无母，被爷奶嫌弃的孙女。\n还好有空间，山里经常有野猪、大虫出没，村里无人敢去，她无所畏惧。\n带弟弟们进山摘辣椒、挖陷阱，买鸭、买羊，断亲分家日子越过越红火。\n把爷奶卖了的大姐买回来。\n给弟弟们盖上青砖大瓦房，娶媳妇。\n爷奶红眼找上门：\n“你小姑要出嫁，你大伯家大哥娶媳妇儿，出多少银钱，你看着办？”\n林棉啐他们一口，“臭不要脸”\n日子慢慢过，有钱慢慢赚，有福慢慢享。", "tags": ["种田", "古代言情", "穿越", "空间", "无CP", "发家致富"], "borderColor": "#d35400", "backgroundColor": "#d3540022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "古代农家夫妻的红火小日子", "fullTitle": "古代农家夫妻的红火小日子", "link": "https://fanqienovel.com/page/7574739331256945726", "data": [14.2, 14.38, 15.34], "trend": 1.14, "latest": 15.3, "wordNumber": 4602727, "creationStatus": 1, "desc": "（又名：清水故事）\n【古代种田/架空地图（南北乱炖）/群像（每个人都是自己人生的主角）/无空间/无金手指/乡村生活/细水长流】\n\n\n真人有声书已上线~欢迎收听~\n\n一本闲来无事，消磨光阴的好书~\n\n作者拥有五百万字长文经验，量大管饱~可放心追更观看~\n\n这是一户农家最真实的日子，是清水村林家一生的故事。\n\n这里有田间的汗水，也有市集的吆喝，\n\n有屋檐下的温馨，也有暗流涌动的危机，\n\n有病榻前的守候，也有绝境中的奋起，\n\n有朴实无华的相守，也有悄然滋生的情愫，\n\n酸甜苦辣，有哭有笑，列位看官，且听我慢慢道来...\n\n", "tags": ["种田", "古代言情", "乡村", "团宠", "互宠", "古色古香"], "borderColor": "#2980b9", "backgroundColor": "#2980b922", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越兽世，被雄性们抢疯了", "fullTitle": "穿越兽世，被雄性们抢疯了", "link": "https://fanqienovel.com/page/7548738856166624281", "data": [21.73, 22.14, 22.36], "trend": 0.63, "latest": 22.4, "wordNumber": 899492, "creationStatus": 1, "desc": "【身穿＋雄多雌少＋兽世雌性身材火辣但普遍男相＋女主越变越美+多男】\n【女主底子非常好，胖的时候也不丑，像团白乎乎的棉花糖，可爱型的，瘦下来就是娇柔绝美型的。】\n\n遭遇洪水，高月这个一百六十斤的胖女孩不小心坠入异世界，开局就掉入了幽蟒部落的圣湖里，被一群巨蟒环绕。\n兽世雄多雌少，即使是胖女孩也有很多人追，但她不想匹配，于是厚着脸皮假装幼崽，企图萌混过关。\n后来因为兽世饮食健康，高月不知不觉越来越瘦，也越来越美，美得令人目眩神迷，同时暴露了自己已经成年的身份，于是众多虎视眈眈的雄性再也忍不住，疯狂大打出手，或追求，或强迫，都想成为她的兽夫。\n\n幽蟒最强者墨琊轻抚高月的后脖颈，弯唇轻笑：“既然你不是幼崽，不如考虑考虑我？”\n\n白狼部落的年轻少主：“墨琊那个无趣的家伙，哪有我有意思，跟我走吧？”\n\n火鸦目光灼灼，气势逼人：“我抢到的就归我了！你是我的！”\n\n还有雪象、猛虎、游隼……\n\n一个个都抢疯了。", "tags": ["种田", "古代言情", "穿越", "兽世", "精灵"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "快穿": [{"label": "快穿：变成绝美动物被大佬娇养了", "fullTitle": "快穿：变成绝美动物被大佬娇养了", "link": "https://fanqienovel.com/page/7611080128432442430", "data": [14.82, 19.36, 29.65], "trend": 14.84, "latest": 29.7, "wordNumber": 866091, "creationStatus": 1, "desc": "漫剧已上线，漫剧名《穿成顶美动物抱大腿》\n【快穿】【甜宠】【纯兽文】【1v1】\n主角不变人！！！\n主角一直是娇娇和重楼！！！\n苏娇娇穿越成各种各样的小动物，作为一只除了美貌全是缺点的“累赘”，她不仅没有被抛弃，反而被各路大佬捧在手心里。\n第一个世界（已完成），她是喜马拉雅山上皮毛如雪、眼若星辰却捕猎零分的落魄雪豹少女，而被她赖上的是那只统治整座雪山的雪豹王；\n第二个世界（已完成），她是马赛马拉草原上因早产而被狮群嫌弃的白狮幼崽，男主则是被流放归来的复仇狮王；\n第三个世界（已完成），她是天空中最美的法外狂徒，男主则是蛋壳里就认命的冷面杀手。\n第四个世界（已完成），她是深海中独行的虎鲸少女，他则是刚断奶没多久的虎鲸幼崽。初见那天，他把脑袋拱进她的胸鳍下面，嘤嘤嘤地赖着不走。从此他们一起学捕猎，一起躲暴风雨，一起在极光下并肩浮出海面。\n第五个世界，她是基地捧在手心的“高岭之花”，他是另一个基地防不胜防的“越狱狂魔”，自相遇高岭之花不再高冷，越狱狂魔甘愿止步于此，把所有最嫩的竹笋尖都堆到她面前。\n......\n从雪豹到白狮，从游隼到虎鲸，从大熊猫到东北虎.....", "tags": ["快穿", "幻想言情", "穿越", "甜宠", "大佬", "1v1"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "掠夺成瘾！", "fullTitle": "掠夺成瘾！", "link": "https://fanqienovel.com/page/7642331435910564888", "data": [12.73, 13.52, 18.09], "trend": 5.36, "latest": 18.1, "wordNumber": 347427, "creationStatus": 1, "desc": "强制。\n强制。\n强制。\n且很变态。重口味。女主也很娇，吃不动的不入。\n快穿+病娇+疯批+掠夺+强取豪夺+囚禁+禁忌+暗黑+男主无三观+女主超级超级娇+双洁+无雌竞\r\n不吃这个设定的宝贝可以绕。\r\n——\r\n世界一：又凶又坏的少帅。\r\n“嘘——”\n世界二：又疯又欲的暴君。\r\n“他不敢看的。”\r\n“就算看了——”\r\n“也只能跪着谢恩！”\n世界三：又冷又欲的非人怪物。\r\n“老婆.....荫的.....不跑.....不跑.....”\n世界四：又痞又撩的公子哥。\r\n“乖乖很棒——”\n世界五：又狠又缠的俄国恶犬。\r\n“宝宝跑了这么久。你说，哥哥该怎么罚你呢？”\n世界六：死了也要爬回来的冷鬼×活着就想把老婆吞了的本体。\r\n“老婆，告诉他——”\r\n.....", "tags": ["快穿", "宠妻", "幻想言情", "病娇", "民国", "双洁"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "快穿：恶毒女配？男主都给她当狗", "fullTitle": "快穿：恶毒女配？男主都给她当狗", "link": "https://fanqienove
