要又要？做梦！你只配吃花生米！\n\n不仅处处给他们挖坑，还通过他们找到了金山银山？\n\n太好了，目之所及，不论钱财粮食还是宝贝，通通收收收！\n\n顺带着陆海空三军告状告了一大遍，把渣男的领导搞的灰头土脸，别提有多爽！\n\n啥？渣男娘受不了刺激想求自己？\nno！本姑娘不接受道德绑架！\n\n\n\n\n\n\n\n\n\n………………\n只是那个高冷的首长喂，\n你千里追到我家为哪般？想让我跟你去随军？\n\n本辣椒是觉得你有钱又大方还好欺负，\n可咱们不太合适！\n\n毕竟，跨军界告你状，让你成为了大笑话，我虽不后悔但心虚！\n\n\n而且姐有大志向：只想当村霸！\n\n………………………………\n\n小剧场：\n“听说了吗，顾首长的新婚妻子是黎予初！”\n“老天爷！这个活爹怎么又回来了？”\n嫂子们急的嘴里起了水泡，\n文工团的姑娘使劲捂住钱包，\n训狗的提前做好了被罚准备，\n\n……\n\n要说谁最欢迎黎予初这个大闹腾，\n当然是……犬！\n呃，还有某人！", "tags": ["年代", "现代言情", "宠妻", "空间", "虐渣", "双洁"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "首长家的傻儿媳原来是装傻啊！", "fullTitle": "首长家的傻儿媳原来是装傻啊！", "link": "https://fanqienovel.com/page/7600666412239031321", "data": [29.91, 31.0, 35.0], "trend": 5.09, "latest": 35.0, "wordNumber": 881849, "creationStatus": 1, "desc": "【军婚+穿越+年代+甜宠】\n一朝穿越，她成了村长家智商停留在八岁、连自己都照顾不好的老丫头，前有护短却憨厚的两个亲哥，后有嘴碎爱嚼舌根的大嫂暗中使绊子，日子过得憋屈又窝囊。\n本想慢慢捂热家人、治好痴傻，谁料村长爹突然翻出一封尘封十五年的信——竟是当年随口给女儿定下的娃娃亲！\n如今，亲家竟真的找上门来了……\n男方家中在书信让她年后就要进城，接触一段时间后就让两人完婚。\n二哥不放心陪着妹妹进城退亲。\n与之有婚约的是裴家老三却死也不愿意娶这个傻子，正当叶志芳心中得意之时，以为这门亲事就此了断，裴父退而求其次想让老大或老二娶亲，结果两人想法一致。\n最终这门亲事是退了，但裴父认了叶志芳为干女儿，叶家两兄妹以一种特殊的关系留在了裴家。\n本想继续装傻的叶志芳最后还是暴露了，最后花落谁手敬请收看！", "tags": ["年代", "现代言情", "乡村", "穿越", "甜宠"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "投胎？！六零换", "fullTitle": "投胎？！六零换", "link": "https://fanqienovel.com/page/7627049014881438745", "data": [23.98, 25.21, 28.82], "trend": 4.84, "latest": 28.8, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁后，糙汉男人将她宠上天", "fullTitle": "替嫁后，糙汉男人将她宠上天", "link": "https://fanqienovel.com/page/7596021152615517209", "data": [28.24, 28.92, 32.67], "trend": 4.43, "latest": 32.7, "wordNumber": 803590, "creationStatus": 1, "desc": "【年代+乡村+家长里短+糙汉护妻+发家致富+打脸】\n陈玉梅在成亲前三天，跟前男友私奔。\n陈家没办法，只好提出跟江家退亲，江家男人要陈家退彩礼补偿损失。\n陈家母亲为了不退彩礼，想了其他办法。\n于是陈玉梅的二妹，那个生下来就被抱出去，七岁时接回来，在陈家当牛做马的二女儿陈冬妹，被推了出来。\n陈家让她替嫁。\n陈冬妹是苦水里泡大的，陈家没有人在乎她。\n她战战兢兢捏着衣角，想着替嫁也许会比在陈家的日子好一些。\n便点头同意。\n婚后，日子发生了翻天覆地的变化。\n男人处处护着她，她在跟男人相处中慢慢放松下来，就在她打开心扉，满心欢的期待未来的美好日子时，大姐哭着回来了。\n她说她后悔了，想要跟陈冬妹换回来……", "tags": ["年代", "现代言情", "乡村", "宠妻", "发家致富", "代嫁代娶"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "替嫁残疾英雄，婆家宠我青云志", "fullTitle": "替嫁残疾英雄，婆家宠我青云志", "link": "https://fanqienovel.com/page/7630006960976317502", "data": [21.37, 21.31, 25.4], "trend": 4.03, "latest": 25.4, "wordNumber": 665538, "creationStatus": 1, "desc": "【年代甜宠+爽文+婆家宠上天】\n七十年代末，家境贫寒受尽欺负的杨巧，被迫替嫁嫁给断了双腿的退伍英雄周文辉。\n本是一场各取所需的婚姻，她以为往后日子只有柴米油盐的艰辛，却没想到嫁对了人，连带着婆家都把她宠上了天！\n公公是部队师长，婆婆是外科主任，全家上下把她当成心尖宝。\n从受尽冷眼的苦命姑娘，到被婆家捧在手心的宝贝，杨巧一路逆袭。\n恢复高考后，她埋头苦读考上大学，成为受人尊敬的老师。\n哥哥杨政潜心钻研假肢技术，终于让丈夫重新站了起来。\n没有金手指，只有细水长流的温情与步步向上的人生。", "tags": ["年代", "现代言情", "甜宠", "先婚后爱", "代嫁代娶"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "：搬空首富底北荒", "fullTitle": "：搬空首富底北荒", "link": "https://fanqienovel.com/page/7632550005361888281", "data": [19.99, 20.96, 22.65], "trend": 2.65, "latest": 22.6, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "六零配改嫁，糙汉官急", "fullTitle": "六零配改嫁，糙汉官急", "link": "https://fanqienovel.com/page/7511997532336032793", "data": [19.85, 20.67, 22.48], "trend": 2.63, "latest": 22.5, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#e67e22", "backgroundColor": "#e67e2222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "张老太重生：发疯！断亲！暴富！", "fullTitle": "张老太重生：发疯！断亲！暴富！", "link": "https://fanqienovel.com/page/7568371714745175102", "data": [27.73, 27.78, 30.31], "trend": 2.58, "latest": 30.3, "wordNumber": 1137613, "creationStatus": 1, "desc": "张老太觉得自己算个好妈好婆婆。\n　　她年轻的时候没人帮衬，为了让子女不走她的老路，对孩子们她尽力帮扶，该出钱的时候出钱，该出力的时候出力，从来没含糊过。\n　　帮着六个儿女成家立业，又带大了几个孙辈，临了出车祸得了三百万赔偿款，也全分给六个儿女。\n　　可分了赔偿款的子女却不想照顾她。\n　　一场大火剥夺了张老太的生命，也让她看清了子女们的本性。\n　　重生回到老伴过世那天，工作还没传给儿媳，赔偿款也还没分给儿女。张桂英该发疯发疯，该断亲断亲，主打一个自己痛快。\n　　日子舒坦后，张桂英突然发现自己一不小心暴富了。", "tags": ["年代", "现代言情", "重生", "虐渣", "前世今生", "家长里短"], "borderColor": "#27ae60", "backgroundColor": "#27ae6022", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "随改嫁区院：首蓄谋久", "fullTitle": "随改嫁区院：首蓄谋久", "link": "https://fanqienovel.com/page/7530871199874681880", "data": [25.21, 28.36, 27.66], "trend": 2.45, "latest": 27.7, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#8e44ad", "backgroundColor": "#8e44ad22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}], "宫斗宅斗": [{"label": "和阉贼在一起后，真公主重生了", "fullTitle": "和阉贼在一起后，真公主重生了", "link": "https://fanqienovel.com/page/7623310820218244158", "data": [24.73, 26.33, 34.27], "trend": 9.54, "latest": 34.3, "wordNumber": 571798, "creationStatus": 0, "desc": "\n容夭六岁时中毒，毒坏了脑子，便成了蠢人，都说她只有六岁小儿的心智。\n\n为活命，容夭蒙混进了宫，成为了盛平公主的贴身宫女，日日给盛平公主洗脚捶背，干些轻快活计。\n\n她感激不嫌她蠢的盛平公主，故而在盛平公主让她与大宦官祁慎做对食时，她便偷偷爬上了大宦官的床榻。\n\n可事后不久，盛平公主便将她乱棍打死了。\n\n死后她才知，她能活到十七岁，全因盛平公主想要戏耍她，玩够了，便将她杀了。\n\n盛平公主说她才是真公主，说陈贵妃顶替了她的娘亲，说她的亲人都死于她和陈贵妃之手……\n\n*\n再睁眼，容夭重生回到六岁，此时她头脑清醒，还没被毒傻。\n\n而害她痴傻的带毒吃食正摆在她的眼前。\n容夭将吃食一分两份，一份送给假祖母，一份送给假父亲……\n\n然后她收拾好家当带娘回娘家，她还小，认爹要趁早！认完爹后还要帮祁慎留根……\n\n*\n谁都没料到，那个被皇上从民间寻回的小公主，有一日会令天下人臣服，站在最高位上，带领大周走向前所未有的盛世。", "tags": ["宫斗宅斗", "古代言情", "重生", "公主", "前世今生", "古色古香"], "borderColor": "#e74c3c", "backgroundColor": "#e74c3c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "清穿之四爷娇宠", "fullTitle": "清穿之四爷娇宠", "link": "https://fanqienovel.com/page/7618129995814161470", "data": [18.05, 19.97, 24.22], "trend": 6.17, "latest": 24.2, "wordNumber": 639081, "creationStatus": 0, "desc": "评分刚出，后面会涨的\n又名《皇后的进击之路》\n\n耿直咸鱼庶女VS腹黑大爹四爷\n\n从新时代“牛马”变成古代“娇小姐”，宝珠只感慨世事无常。\n\n虽是庶女但是好在自己的姨娘是嫡母的陪嫁，从小一起长大情分非比寻常。\n\n后来还是救主身亡的，这份恩情自然回报到了自己身上，从小被嫡母娇养长大。\n\n本来这日子也挺好的，坏就坏在自己长得过于标致，选秀是每个穿越女的标配，就让战火来的更猛烈些吧！\n\n更让宝珠没想到的是，四阿哥原来也是每个穿越女的标配！", "tags": ["宫斗宅斗", "古代言情", "宠妻", "清穿", "HE", "1v1"], "borderColor": "#e91e8c", "backgroundColor": "#e91e8c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "搬空府，王妃藏孕肚乡娃", "fullTitle": "搬空府，王妃藏孕肚乡娃", "link": "https://fanqienovel.com/page/7548312955947863065", "data": [14.55, 16.06, 18.84], "trend": 4.29, "latest": 18.8, "wordNumber": 0, "creationStatus": 0, "desc": "", "tags": [], "borderColor": "#9b59b6", "backgroundColor": "#9b59b622", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "状元悔断肠，玄学大佬不好惹", "fullTitle": "状元悔断肠，玄学大佬不好惹", "link": "https://fanqienovel.com/page/7631195129595841561", "data": [17.27, 17.49, 20.8], "trend": 3.54, "latest": 20.8, "wordNumber": 486117, "creationStatus": 1, "desc": "［玄学+宅斗+抓鬼+爽文+无cp+算命+故事单元］\n修炼三百年的玄学大佬桑夏，在飞升之际陨落了，重生到了一百年以后。\n成为了被新科状元抛弃的糟糠之妻。\n这还不够惨，她还是被自己的亲祖母抛弃的太傅府真千金。\n桑夏都怀疑，天道是嫉妒她的天赋，才让她重生到这个可怜虫身上。\n人人都想看她笑话，偏生她是最争气的那个。\n风水测算，捉鬼画符……\n短短时间内，她便成为了京中人人敬畏的玄学大佬。\n百姓敬畏的监正大人喊她祖师奶奶。\n京中人人惧怕的纨绔世子，求着拜她为师。\n连权侵朝野的辅国公毕恭毕敬的喊她主子。\n这时，那位状元爷前夫，以及抛弃她的祖母，才后悔莫及。", "tags": ["宫斗宅斗", "古代言情", "重生", "无CP", "大佬", "风水秘术"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿成炮灰皇后，和闺蜜扶暗卫登基", "fullTitle": "穿成炮灰皇后，和闺蜜扶暗卫登基", "link": "https://fanqienovel.com/page/7622264339327618073", "data": [23.98, 24.3, 26.96], "trend": 2.98, "latest": 27.0, "wordNumber": 384494, "creationStatus": 0, "desc": "（正文完结）【双穿书|双cp|双洁|闺蜜联手|无雌竞】\n【阴暗忠犬暗卫×钓系皇后|毒舌哭包暗卫×暴躁贵妃】\n一睁眼，温心涟和闺蜜叶婉盈双双穿成了宫斗文里的炮灰女配，一个是跋扈贵妃，一个是恶毒皇后。更要命的是，正在跟她们滚床单的“皇帝”还是个冒牌货。\n原著里皇帝为女主守身如玉，让暗卫假扮自己临幸后妃，再挑唆他们自相残杀，而他躲在幕后，笑看后宫血流成河。\n看着眼前这个满脸写着“我只是在执行任务”的暗卫小哥，温心涟拍了拍他的脸。\n“兄弟，要不要换个老板，薪资双倍，夫人也包分配。”\n“娘娘请自重。”\n后来，他将温心涟抵在铜镜上:“夫人，眼睛睁开啊……”\n温心涟:“我没说分配的是我呀！”\n而隔壁宫的叶婉盈，正威胁着被她捆起来的暗卫:“兄弟，你是想合作还是想被我揍哭呀？”\n“我死都不屈服！”\n后来，他跪在叶婉盈的脚边，眼眶含泪，亲手把绸带递过去:“你想对我做什么都可以。”\n叶婉盈:“这谁能忍得住。”\n表面上皇后和贵妃水火不容，暗地里策反暗卫，拉拢朝臣，一步一步让暗卫彻底代替龙椅上的天子。\n当暴君回宫，他站在宫门前大喊“我是皇帝”。\n温心涟和叶婉盈坐在龙椅上微微一笑： 守护本心，于癫狂与毁灭之间破局追凶。\n\n　　撕裂黑暗，挣脱宿命桎梏，浴火重生，再揽荣光。\n\n　　没有深渊，能让英雄沉沦。", "tags": ["女频悬疑", "悬疑", "推理", "破案", "悬疑恋爱"], "borderColor": "#f39c12", "backgroundColor": "#f39c1222", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "穿越云南虫谷：献王妃求生指南", "fullTitle": "穿越云南虫谷：献王妃求生指南", "link": "https://fanqienovel.com/page/7650408680646511678", "data": [4.71, 4.91, 5.71], "trend": 1.01, "latest": 5.7, "wordNumber": 545212, "creationStatus": 1, "desc": "【鬼吹灯】+【病娇】+【献王纯暴君，不会洗白】刚出分，评分会涨得，更新稳定，入股不亏哦\n一朝穿越，我没拿到逆袭剧本，反而直接落在了滇国献王的王宫里！\n四周是嗷嗷痛哭的女子，眼前是手握青铜剑、眼神阴鸷的疯批暴君。\n没有系统！没有异能！手无缚鸡之力的我，\n为了活命，硬是凭着“怂到极致便是勇”的演技，在残暴暴君的刀尖上蹦迪。\n他残暴、偏执、疯魔，为了成仙不择手段，活人痋术令人闻风丧胆。\n我没有去改变他的圣母心，也没有可以与他抗衡的超能力。\n我只是个想活下去的普通人。\n每一次他眼神扫过，都是一场生死博弈；每一次他抚摸我的脖颈，都伴随着窒息的战栗。\n我靠着极致的顺从、天衣无缝的伪装，在他尸骨累累的王座旁，生生苟出了一条王妃之路。\n他视人命如草芥，手段狠辣，我便做他身边最听话的哑巴新娘。\n我被迫近距离围观遮龙山神宫的血腥建造，亲眼看着无数人沦为痋引，只能瑟瑟发抖地往他怀里钻。\n多年后，当摸金校尉历经千险终于打开献王墓，看着那尊玉棺时……\n我揉着眼睛在玉棺里坐了起来，弱弱地问了一句：“那个……胡司令，来了吗？我憋了两千年了……”", "tags": ["女频悬疑", "悬疑", "灵异", "衍生", "悬疑恋爱"], "borderColor": "#1abc9c", "backgroundColor": "#1abc9c22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "破案需要我这样的人才【刑侦】", "fullTitle": "破案需要我这样的人才【刑侦】", "link": "https://fanqienovel.com/page/7189536565176044581", "data": [13.52, 13.7, 14.37], "trend": 0.86, "latest": 14.4, "wordNumber": 1103361, "creationStatus": 0, "desc": "凌无忧此人，路过的蚂蚁瞧见了，都要和同伴说一句：“别惹那个疯子！”\n这家伙说两句就变炮仗，成年人的体面她是一点不要。\n在公安大学习期间，不少同学被她教训了好几回，谁让人力气不大，阴招却层出不穷呢？\n后来疯子成为了一名光荣的警察，嘴上说着“这钱少事多的破工作谁爱干谁干”，但破案追凶永远冲第一。\n刑警大队的队长看着满桌子的投诉单，日日天人交战，爱恨纠缠：问，徒儿太会惹事了，想抄她鱿鱼但是舍不得怎么破？\n人美钱多的大少爷时垣每日对她贴心问候：“再不找男朋友你就老了。”\n凌无忧：“关你屁事？”\n时垣：“。”\n---\n非传统良善女主X绿茶男主\n女主会成长，现实向爽文，只虐渣", "tags": ["女频悬疑", "悬疑恋爱", "推理", "破案", "打脸"], "borderColor": "#3498db", "backgroundColor": "#3498db22", "tension": 0.3, "pointRadius": 5, "borderWidth": 2}, {"label": "龙王聘", "fullTitle": "龙王聘", "link": "https://fanqienovel.com/page/7124257791828560929", "data": [7.63, 7.75, 8.31], "trend": 0.68, "latest": 8.3, "wordNumber": 1392761, "creationStatus": 0, "desc": "那一年我生了一场怪病，怎么都治不好。\n /* ── Solo-legend helper ── */
function attachSoloLegend(legEl, chart, datasets) {
  let soloIdx = -1;
  const items = [];
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < datasets.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < datasets.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (datasets.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

/* ── Section IDs for nav ── */
const SECTION_DEFS = [
  { key:'rec',      label:'赛道推荐' },
  { key:'overview', label:'趋势上升赛道' },
  { key:'compare',  label:'增幅对比' },
  { key:'table',    label:'全分类汇总' },
  { key:'books',    label:'推荐书目' },
];

let activeNavKey = 'rec';

function buildNav(sfx) {
  const nav = document.getElementById('stickyNav');
  nav.innerHTML = '';
  SECTION_DEFS.forEach((s, idx) => {
    if (idx > 0) {
      const sep = document.createElement('div');
      sep.className = 'nav-sep';
      nav.appendChild(sep);
    }
    const a = document.createElement('a');
    a.className = 'nav-item' + (s.key === activeNavKey ? ' active' : '');
    a.href = '#sec-' + s.key + '-' + sfx;
    a.innerHTML = `<span class="nav-num">0${idx+1}</span>${s.label}`;
    a.addEventListener('click', e => {
      e.preventDefault();
      activeNavKey = s.key;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
      const target = document.getElementById('sec-' + s.key + '-' + sfx);
      if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
    });
    nav.appendChild(a);
  });
}

/* scrollspy */
let spyObserver = null;
function setupScrollSpy(sfx) {
  if (spyObserver) spyObserver.disconnect();
  const navH = 48;
  spyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      const key = id.replace('sec-','').replace('-'+sfx,'');
      activeNavKey = key;
      const a = document.querySelector(`#stickyNav a[href="#${id}"]`);
      if (!a) return;
      document.querySelectorAll('#stickyNav .nav-item').forEach(el=>el.classList.remove('active'));
      a.classList.add('active');
    });
  }, { rootMargin: `-${navH}px 0px -60% 0px`, threshold: 0 });
  SECTION_DEFS.forEach(s => {
    const el = document.getElementById('sec-' + s.key + '-' + sfx);
    if (el) spyObserver.observe(el);
  });
}

  (function() {
    const colors = ['#f39c12','#c0392b','#95a5a6','#d35400','#e67e22','#27ae60','#3498db',
      '#1abc9c','#f1c40f','#7f8c8d','#1e8449','#8e44ad','#9b59b6','#2ecc71',
      '#16a085','#2980b9','#e74c3c','#e91e8c'];
    const chart = new Chart(document.getElementById('bubbleChart-' + sfx).getContext('2d'), {
      type: 'bubble',
      data: { datasets: D.bubbleData.map((b,i) => ({
        label: b.label, data: [{x:b.x,y:b.y,r:b.r}],
        backgroundColor: colors[i%colors.length]+'88', borderColor: colors[i%colors.length], borderWidth: 1.5
      })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
            callbacks: { title: c => c[0].dataset.label,
              label: c => { const b=D.bubbleData.find(b=>b.label===c.dataset.label);
                return [` 总在读：${c.parsed.x}万`,` 竞争系数：${c.parsed.y}`,` 10万+：${b?b.count10w:'-'}本`]; } } } },
        scales: {
          x: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>v+'万'}, title:{display:true,text:'总在读（万）',color:'#64748b'} },
          y: { grid:{color:gridColor}, ticks:{color:'#64748b'}, title:{display:true,text:'竞争系数（越低越好）',color:'#64748b'} }
        }
      },
      plugins: [{ id:'bubbleLabels', afterDatasetsDraw(chart2) {
        const ctx2=chart2.ctx;
        chart2.data.datasets.forEach((ds,i)=>{ chart2.getDatasetMeta(i).data.forEach(el=>{
          const {x,y}=el.getProps(['x','y']);
          ctx2.save(); ctx2.fillStyle='#e2e8f0'; ctx2.font='10px PingFang SC,sans-serif';
          ctx2.textAlign='center'; ctx2.fillText(ds.label,x,y+3); ctx2.restore();
        }); });
      } }]
    });
    if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
    chartRegistry[sfx].push(chart);
  })();

  // ④ 汇总表
  (function() {
    const sorted = Object.keys(D.metrics).sort((a,b)=>(D.metrics[b].abs_growth||0)-(D.metrics[a].abs_growth||0));
    const table = document.getElementById('overviewTable-' + sfx);
    table.innerHTML = `<thead><tr><th>分类</th><th>总在读（万）</th><th>${n}日增幅</th><th>${n}日增长在读（万）</th><th>在读均值（万）</th><th>在读中位数（万）</th><th>均腰比</th><th>竞争系数</th><th>10万+书</th></tr></thead>
    <tbody>${sorted.map((cat,i)=>{
      const m=D.metrics[cat];
      const gClass=m.growth>=0?'pill-up':'pill-dn';
      const gStr=(m.growth>=0?'+':'')+m.growth+'%';
      const agRaw=m.abs_growth!=null?m.abs_growth:0;
      const agClass=agRaw>=0?'pill-up':'pill-dn';
      const agStr=(agRaw>=0?'+':'')+agRaw+'万';
      const cc=m.coeff<=5?'#22c55e':m.coeff<=10?'#f59e0b':'#ef4444';
      const mmr=m.mm_ratio!=null?m.mm_ratio:0;
      const mmc=mmr<1.8?'#22c55e':mmr<=3.0?'#f59e0b':'#ef4444';
      return `<tr><td class="cat-name">${i+1}. ${cat}</td><td>${m.total19}</td>
        <td><span class="pill ${gClass}">${gStr}</span></td>
        <td><span class="pill ${agClass}">${agStr}</span></td>
        <td>${m.mean}</td><td>${m.mid19!=null?m.mid19:'—'}</td>
        <td style="color:${mmc};font-weight:600">${mmr}</td>
        <td style="color:${cc};font-weight:600">${m.coeff}</td>
        <td>${m.count10w>0?m.count10w+'本':'<span style=\"color:var(--text3)\">—</span>'}</td></tr>`;
    }).join('')}</tbody>`;
  })();

  // ⑤ 书目折线图 + 趋势表 + 热门标签
  (function() {
    const cats = Object.keys(D.bookChartData);
    const tabsEl = document.getElementById('bookTabs-' + sfx);
    const contsEl = document.getElementById('bookTabContents-' + sfx);
    cats.forEach((cat, ci) => {
      const tab = document.createElement('div');
      tab.className = 'tab'+(ci===0?' active':'');
      tab.textContent = cat; tab.dataset.cat = cat + '-' + sfx;
      tabsEl.appendChild(tab);
      const rawBooks = D.bookChartData[cat];
      const isRead = sfx.startsWith('Read');
      // 阅读榜只展示连载中的书；图表、表格、热门标签、累计净增全部同源
      const displayBooks = isRead
        ? rawBooks.filter(b => b.creationStatus === 1)
        : rawBooks;
      const content = document.createElement('div');
      content.className = 'tab-content'+(ci===0?' active':'');
      content.id = 'tab-' + cat + '-' + sfx;
      const dayCols = displayBooks.length > 0
        ? displayBooks[0].data.map((_,di) => `<th style="width:52px">${D.days[di] || ''}</th>`).join('')
        : D.days.map(d => `<th style="width:52px">${d}</th>`).join('');
      content.innerHTML = `
        <div class="book-layout">
          <div class="card">
            <div style="font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <span>${cat} · 在读人数折线图（万人）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
            </div>
            <div id="bookLegend-${sfx}-${ci}" class="legend-row" style="margin-bottom:10px"></div>
            <div class="chart-wrap" style="height:480px"><canvas id="bookChart-${sfx}-${ci}"></canvas></div>
          </div>
          <div class="card" style="overflow-x:auto">
            <div style="font-size:13px;color:var(--text2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <span>全部书目趋势（${D.days[0]}→${D.days[D.days.length-1]}，按净增排序）${isRead ? '<span style="font-size:11px;color:var(--green);margin-left:6px">仅连载中</span>' : ''}</span>
              <span style="font-size:12px;color:#ef4444;font-weight:600">累计净增 +${displayBooks.reduce((s,b)=>+(s+b.trend).toFixed(2),0)}万</span>
            </div>
            <table class="book-table" id="bookTable-${sfx}-${ci}">
              <thead><tr><th style="width:32px"></th><th style="width:28px">#</th><th>书名</th>${dayCols}<th style="width:52px">字数</th><th style="width:52px">净增</th></tr></thead>
              <tbody id="bookTbody-${sfx}-${ci}"></tbody>
            </table>
          </div>
        </div>`;
      contsEl.appendChild(content);

      const tags = (D.catTags||{})[cat]||[];
      if (tags.length) {
        const maxCount = tags[0].count;
        const barColors = {'豪门总裁':'#e74c3c','青春甜宠':'#e91e8c','古言脑洞':'#f39c12','悬疑脑洞':'#1abc9c','现言脑洞':'#9b59b6'};
        const barColor = barColors[cat]||'#3498db';
        const totalBooks = displayBooks.length;
        const tagSec = document.createElement('div');
        tagSec.className = 'tag-section card';
        tagSec.style.marginTop = '16px';
        tagSec.innerHTML = `
          <div class="tag-section-title">📌 热门标签（基于 ${totalBooks} 本上榜书${isRead ? '，仅连载中' : ''}，可作为开书参考）</div>
          <div class="tag-bar-list">
            ${tags.slice(0,10).map(t=>`
              <div class="tag-bar-row">
                <div class="tag-bar-name">${t.tag}</div>
                <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:${barColor}99"></div></div>
                <div class="tag-bar-count">${t.count}本</div>
              </div>`).join('')}
          </div>`;
        content.appendChild(tagSec);
      }

      (function() {
        const tbody = document.getElementById('bookTbody-' + sfx + '-' + ci);
        if (!tbody) return;
        const sorted = [...displayBooks].sort((a,b)=>b.trend-a.trend);
        if (isRead && sorted.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="100" style="color:var(--text3);padding:20px;text-align:center">暂无连载中书目</td>`;
          tbody.appendChild(tr);
          return;
        }
        sorted.forEach((b, i) => {
          const tStr = b.trend>0?`+${b.trend}`:`${b.trend}`;
          const tCls = b.trend>=1?'trend-up':b.trend>0?'trend-mid':b.trend<0?'trend-dn':'';
          const wn = b.wordNumber||0;
          const wStr = wn>0?(Math.round(wn/1000)/10).toFixed(1)+'万':'—';
          const rid = `dr-${sfx}-${ci}-${i}`;
          const btnId = `btn-${sfx}-${ci}-${i}`;
          const cols = b.data.map(v=>`<td>${v}万</td>`).join('');
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          tr.innerHTML = `
            <td><button class="expand-btn" id="${btnId}">+</button></td>
            <td style="color:var(--text3)">${i+1}</td>
            <td class="book-name-cell"><a href="${b.link}" target="_blank" onclick="event.stopPropagation()" title="${b.fullTitle}">${b.fullTitle}</a></td>
            ${cols}
            <td style="color:var(--text2)">${wStr}</td>
            <td class="${tCls}">${tStr}万</td>`;
          tbody.appendChild(tr);
          const dr = document.createElement('tr');
          dr.className = 'book-detail-row';
          dr.id = rid;
          const colspan = 5 + b.data.length;
          const tagsHtml = (b.tags||[]).map(t=>`<span class="book-detail-tag">${t}</span>`).join('');
          dr.innerHTML = `<td colspan="${colspan}">
            <div class="book-detail-inner">
              <div><span style="color:var(--text3)">书名：</span><span style="color:var(--text);font-weight:600">${b.fullTitle}</span></div>
              <div style="margin-top:4px"><span style="color:var(--text3)">作品简介：</span>${b.desc||'暂无简介'}</div>
              ${tagsHtml?`<div class="book-detail-tags">${tagsHtml}</div>`:''}
            </div></td>`;
          tbody.appendChild(dr);
          const toggle = () => {
            const row = document.getElementById(rid);
            const open = row.classList.toggle('open');
            const btn = document.getElementById(btnId);
            if (btn) btn.textContent = open ? '−' : '+';
          };
          tr.addEventListener('click', toggle);
        });
      })();

      // 书目折线图（带 solo legend），延迟渲染
      setTimeout(() => {
        const cvs = document.getElementById('bookChart-' + sfx + '-' + ci);
        if (!cvs) return;
        if (displayBooks.length === 0) return;
        const chart = new Chart(cvs.getContext('2d'), {
          type: 'line',
          data: { labels: D.days, datasets: displayBooks },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false },
              tooltip: { backgroundColor: '#1e2433', borderColor: '#2a3040', borderWidth: 1,
                callbacks: { label: c => ` ${c.dataset.fullTitle||c.dataset.label}: ${c.parsed.y}万` } } },
            scales: {
              x: { grid:{color:gridColor}, ticks:{color:'#64748b'} },
              y: { grid:{color:gridColor}, ticks:{color:'#64748b',callback:v=>parseFloat(v.toFixed(1))+'万'} }
            }
          }
        });
        const legEl = document.getElementById('bookLegend-' + sfx + '-' + ci);
        if (legEl) attachSoloLegend(legEl, chart, displayBooks);
        if (!chartRegistry[sfx]) chartRegistry[sfx] = [];
        chartRegistry[sfx].push(chart);
      }, 60*(ci+1));
    });

    tabsEl.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      contsEl.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      const el = document.getElementById('tab-' + tab.dataset.cat);
      if (el) el.classList.add('active');
    });
  })();
}

// Period switcher
const PANEL_IDS = ['New7','New3','Read7','Read3'];
let renderedPanels = {};
function switchPeriod(p) {
  PANEL_IDS.forEach(id => {
    document.getElementById('btn' + id).classList.toggle('active', id === p);
    document.getElementById('panel' + id).classList.toggle('active', id === p);
  });
  if (!renderedPanels[p]) {
    renderedPanels[p] = true;
    renderReport(DATA[p], p);
  } else {
    buildNav(p);
    setTimeout(() => setupScrollSpy(p), 200);
  }
}

// Default: 7日新书榜
switchPeriod('New7');
PANEL_IDS.forEach(id => {
  document.getElementById('btn' + id).addEventListener('click', () => switchPeriod(id));
});
</script>
</body>
</html>
