// solo legend
function attachSoloLegend(legEl, chart, dsList) {
  let soloIdx = -1;
  const items = [];
  dsList.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span>${ds.label||ds.fullTitle||''}`;
    item.addEventListener('click', () => {
      if (soloIdx === i) {
        soloIdx = -1;
        for (let j = 0; j < dsList.length; j++) {
          chart.getDatasetMeta(j).hidden = false;
          items[j].classList.remove('solo','dimmed');
        }
      } else {
        soloIdx = i;
        for (let j = 0; j < dsList.length; j++) {
          const hidden = j !== i;
          chart.getDatasetMeta(j).hidden = hidden;
          items[j].classList.toggle('solo', j === i);
          items[j].classList.toggle('dimmed', hidden);
        }
      }
      chart.update();
    });
    items.push(item);
    legEl.appendChild(item);
  });
  if (dsList.length > 1) {
    const hint = document.createElement('span');
    hint.className = 'legend-hint';
    hint.textContent = '点击只看该曲线';
    legEl.appendChild(hint);
  }
}

});

// 热门标签
const tagBars = document.getElementById('shelfTagBars');
if (SHELF_TAGS && SHELF_TAGS.length) {
  const maxCount = SHELF_TAGS[0].count;
  SHELF_TAGS.forEach(t => {
    const row = document.createElement('div');
    row.className = 'tag-bar-row';
    row.innerHTML = `
      <div class="tag-bar-name">${t.tag}</div>
      <div class="tag-bar-track"><div class="tag-bar-fill" style="width:${Math.round(t.count/maxCount*100)}%;background:#f59e0b99"></div></div>
      <div class="tag-bar-count">${t.count}本</div>`;
    tagBars.appendChild(row);
  });
} else {
  tagBars.innerHTML = '<div style="color:var(--text3);font-size:12px">暂无标签数据</div>';
}
</script>
</body>
</html>
